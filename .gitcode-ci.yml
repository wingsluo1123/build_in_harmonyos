# GitCode CI Pipeline — build_in_harmonyos
# 鸿蒙PC三方库适配项目 CI 流水线
# 触发条件: PR 创建/更新、main 分支推送

variables:
  CONAN_HOME: "$CI_PROJECT_DIR/.conan2"

stages:
  - setup
  - preflight
  - build
  - test
  - upload

# ============================================================
# Stage: setup — 环境准备
# ============================================================
setup_environment:
  stage: setup
  script:
    - bash ci/conan/setup.sh
  artifacts:
    paths:
      - .conan2/
    expire_in: 1 hour

# ============================================================
# Stage: preflight — 预检
# ============================================================
preflight_check:
  stage: preflight
  script:
    - bash ci/scripts/preflight_check.sh qtpositioning/5.15.2
  needs:
    - setup_environment

# ============================================================
# Stage: build — 编译验证
# ============================================================
build_package:
  stage: build
  script:
    - bash ci/conan/build_and_test.sh
  artifacts:
    paths:
      - .conan2/
    expire_in: 2 hours
  needs:
    - setup_environment

# ============================================================
# Stage: test — 测试验证
# ============================================================
test_package:
  stage: test
  script:
    - conan create archives/q/qtpositioning/5.15.2 --build=missing -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=default
  needs:
    - build_package
  only:
    - merge_requests
    - main

# ============================================================
# Stage: upload — 制品上传（仅 main 分支）
# ============================================================
upload_artifacts:
  stage: upload
  script:
    - bash ci/conan/upload.sh
  needs:
    - test_package
  only:
    - main
