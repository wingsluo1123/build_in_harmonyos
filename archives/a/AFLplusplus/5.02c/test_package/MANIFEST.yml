# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aflplusplus/5.02c
homepage: "https://github.com/AFLplusplus/AFLplusplus"

# AFL++ uses `make test` which requires Docker for ARCH testing.
# The upstream test framework (test/test-all.sh) runs integration tests
# that require a full fuzzing environment, not suitable for CI L1.
upstream_check_command: "make test"

# conanfile.py build() method does not integrate upstream tests
# (they require Docker and a full fuzzing environment)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test-all.sh
    source: AFLplusplus-5.02c/test/test-all.sh
    description: "AFL++ integration test suite (requires Docker)"
    command: "cd test && ./test-all.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 afl-fuzz --version、afl-showmap --help、afl-cc 存在性"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
