software: a2ps
version: "4.15.7"
status: built
build_date: "2026-08-05"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/a2ps/a2ps-4.15.7.tar.gz"
  sha256: "715f38670afd950b4ca71c01f468feefad265ca52d3f112934c63c0a8bfbb8af"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies:
    - bdw-gc/8.2.6@ohpcd/stable
    - libpaper/1.1.28@ohpcd/stable
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.patch"
  - "0004-ogonkify-configure.patch"

knowledge_gained:
  - "config.guess/config.sub needs OHOS platform detection patches"
  - "umask 077 causes Permission denied on HarmonyOS filesystem"
  - "pthread_cancel/pthread_setcancelstate not implemented on OHOS - need --allow-shlib-undefined"
  - "AUTOMAKE=true to skip autotools regeneration when automake not installed"
  - "PkgConfigDeps generator needed for configure to find conan dependencies via pkg-config"

patch_generation:
  method: per-file-difflib
  patches_count: 4

patch_classification:
  - file: 0001-build-aux-config.guess.patch
    type: portability
    platform_only: true
  - file: 0002-build-aux-config.sub.patch
    type: portability
    platform_only: true
  - file: 0003-configure.patch
    type: portability
    platform_only: true
  - file: 0004-ogonkify-configure.patch
    type: portability
    platform_only: true
