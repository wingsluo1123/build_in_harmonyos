# 编译中学到的知识
knowledge_gained:
  - "R36 依赖必须先发布再构建下游：accounts-qml-module 的 4 个直接依赖中 3 个未发布（libaccounts-qt/libsignon-qt/qt5-qtdeclarative），conan list -r=ohpcd 权威验证 0 recipe"
  - "qt5-qtbase/5.15.2 以 -no-feature-xml 构建，QtXml 头/库缺失（qtxml-config.h 未生成），不满足 libaccounts-qt service.h 的 QDomDocument 依赖"
  - "qt5-qtbase 包内 qmake 的 QMAKE_MKSPECS 固化指向构建期 build 目录（打包缺陷），消费者无法用其 qmake 模块系统；可改用手动 moc + clang++ 构建绕过"
  - "OHOS HMDFS 拒绝 ln -s 软链接且 chmod 不生效；Qt5 全量构建在本地环境遇软链接/并行链接平台问题，需 CI 完整构建机"
  - "libaccounts-glib 1.27 本地构建成功（meson，含 4 个平台补丁）；libaccounts-qt 1.13 手动编译已推进到仅缺 QtXml"
