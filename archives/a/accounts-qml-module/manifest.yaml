# accounts-qml-module 软件级 manifest
# 文件位置: archives/a/accounts-qml-module/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: accounts-qml-module

# 显示名
display: "Accounts QML Module"

# 一句话描述
description: "QML bindings for libaccounts-qt + libsignon-qt（Online Accounts QML 插件）"

# 分类标签
category: library

# 官网 URL
homepage: "https://gitlab.com/accounts-sso/accounts-qml-module"

# 开源许可证（SPDX 标识）
license: LGPL-2.1

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: qmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "依赖链断裂：libaccounts-qt / libsignon-qt / qt5-qtdeclarative 未发布到 ohpcd 制品仓（R36 阻塞）"
    - "qt5-qtbase 5.15.2 以 -no-feature-xml 构建，缺 QtXml 模块；需 qt5-qtbase 5.15.2.1（未发布）"

  # 跨版本通用依赖
  common_dependencies:
    - libaccounts-qt
    - libsignon-qt
    - qt5-qtbase
    - qt5-qtdeclarative

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.7.1-git20231028.05e79eb":
    status: archived
    build_date: 2026-08-13
    # 无法适配：依赖链断裂（详见版本级 manifest 与说明文档）
