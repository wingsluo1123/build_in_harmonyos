software: acf-lib-lua5.3
display: "ACF libraries for Lua 5.3"
description: "Lua 5.3 standard modules for the Alpine Configuration Framework"
category: library
homepage: "https://gitlab.alpinelinux.org/acf/acf-lib"
license: GPL-2.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "Install all eight upstream Lua modules in the Lua 5.3 module layout"
    - "Patch format.lua legacy Lua 5.1 APIs (getfenv/string.gfind) to Lua 5.2+ equivalents"
    - "Load and invoke packaged modules through the Lua 5.3 C API"
  common_dependencies:
    - lua/5.3.6

versions:
  "0.11.1":
    status: built
    build_date: "2026-08-11"
    conan_ref: "acf-lib-lua5.3/0.11.1"
