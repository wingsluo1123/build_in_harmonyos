build:
  # 构建系统类型
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表
  dependencies:
  - "sbcl (host Lisp compiler, required at build time)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ACL2 是基于 Common Lisp 的定理证明器，构建需要宿主 Lisp 编译器（SBCL/CCL）"
  - "ACL2 使用 GNUmakefile 构建，通过 LISP 变量指定宿主 Lisp 实现"
  - "构建命令: make large LISP=sbcl，产出 saved_acl2 可执行文件"
  - "源码包较大（~237MB），包含 ACL2 系统和 community books"
  - "OHOS 平台需要先交叉编译 SBCL 才能构建 ACL2"

# ============================================================
# verify-build 兼容字段
# ============================================================

build_system: makefile
