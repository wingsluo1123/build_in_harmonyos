# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表
  dependencies:
  - "GCL 2.7.1 (bootstrapped host Lisp when SBCL/CCL is unavailable)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ACL2 是基于 Common Lisp 的定理证明器，构建需要可在目标构建机运行的宿主 Lisp"
  - "ACL2 使用 GNUmakefile 构建，通过 LISP 变量指定宿主 Lisp 实现"
  - "CI 未提供 SBCL/CCL 时从官方源码引导 GCL 2.7.1，再执行 make large"
  - "OHOS 上 GCL 引导阶段生成的 ELF 镜像必须在首次执行前完成自签名"
  - "源码包较大（~237MB），包含 ACL2 系统和 community books"


