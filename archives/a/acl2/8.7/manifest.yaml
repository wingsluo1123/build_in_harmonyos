software: acl2
# 版本级 manifest
# 文件位置: archives/a/acl2/8.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.7"

# 编译状态
# published | built | failed | archived
status: failed

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# 构建系统类型（顶级字段，供验证脚本使用）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/acl2-devel/acl2-devel/releases/download/8.7/acl2-8.7.tar.gz"

  # 源码校验和
  sha256: "370433766f56737e597b09c0fd8f837d2df889ec8ed51efa9fc869a93185ce89"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
