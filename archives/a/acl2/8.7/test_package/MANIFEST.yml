# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: acl2/8.7
homepage: "https://github.com/acl2/acl2"

# 上游测试命令
upstream_check_command: "make regression"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ACL2 的测试套件是 "make regression"，会认证 community books
# 由于认证全部 books 耗时极长（数小时），test_package 仅运行简化烟雾测试
upstream_tests:
  - file: mini-proveall.lisp
    source: acl2-8.7/mini-proveall.lisp
    description: "ACL2 自带的最小证明测试 (make mini-proveall)"
    command: "make mini-proveall"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "验证 saved_acl2 可执行且能完成简单证明"
    command: "sh test.sh <path-to-saved_acl2>"

# 测试断言总数
assertion_count: 4
