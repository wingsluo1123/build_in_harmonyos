software: acme-tiny
# 版本级 manifest
# 文件位置: archives/a/acme-tiny/5.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.1"

# 编译状态
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"

# 构建系统类型
build_system: setuptools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/diafygi/acme-tiny/archive/refs/tags/5.0.1.tar.gz"

  # 源码校验和
  sha256: "8205736d0de258283e337f6fbc35892cb54fac19e10b770f4dc8b0941b1a08a5"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：Python 包使用 setuptools
  system: setuptools

  # Python 包安装命令
  configure_options:
    - "python3 setup.py install --prefix=$DEFAULT_PREFIX"

  # 运行时依赖
  dependencies:
    - "openssl/3.5.6"

  # 不需要编译器（纯 Python）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# Python 脚本不需要补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Python 脚本使用 setuptools 安装，不需要传统编译"
  - "需要 openssl 命令行工具作为运行时依赖"
  - "setuptools_scm 版本检测需要 SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ACME_TINY 环境变量"
