software: actionlint
display: "actionlint"
description: "Static checker for GitHub Actions workflow files"
category: build-tool
homepage: "https://github.com/rhysd/actionlint"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Go project: CGO_ENABLED=0 go build -trimpath for static binary"
    - "Version injection via -X github.com/rhysd/actionlint.version=<version>"
    - "Go toolchain on OHOS already wrapped with elfldr, no extra wrapper needed"
    - "Binary requires elfldr to run on OHOS platform"
  common_dependencies:
    - go

versions:
  "1.7.9":
    status: published
    build_date: "2026-07-02"
    conan_ref: "actionlint/1.7.9@ohpcd/stable"
