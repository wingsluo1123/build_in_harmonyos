- patches/0010-src-runtime-omp-omp_code_object.cpp.patch
- patches/0011-include-hipSYCL-compiler-Frontend.hpp.patch

knowledge_gained:
  - "AdaptiveCpp 的编译能力集中在 Clang 插件 acpp-clang，必须链接 clang 前端库；制品仓 clang/22.1.8 同时导出 ClangConfig.cmake + libclang-cpp.so + libLLVM.so + clang 头，是可用依赖"
  - "上游要求 LLVM 主版本 15..20，clang/22.1.8 超出范围，需 ACPP_EXPERIMENTAL_LLVM=ON（真机首要验证项）"
  - "OHOS SDK 自带 libomp.a/libomp.so 与 omp.h，OpenMP 交叉编译实测通过，CPU 后端无平台障碍"
  - "官方仓库 CMake 类配方（clang/llvm/onetbb）均为真机原生编译，非交叉编译"

