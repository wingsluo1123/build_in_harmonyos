- patches/0005-src-compiler-llvm-to-backend-GlobalSizesFitInI32OptPass.cpp.patch
- patches/0006-src-compiler-stdpar-SyncElision.cpp.patch
- patches/0007-src-libkernel-sscp-CMakeLists.txt.patch
- patches/0008-src-libkernel-sscp-host-math.cpp.patch
