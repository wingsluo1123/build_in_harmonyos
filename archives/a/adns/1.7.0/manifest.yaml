version: "1.7.0"
software: adns
status: in_progress
build_date: "2026-10-19"
build_system: autotools

source:
  url: "https://www.chiark.greenend.org.uk/~ian/adns/ftp/adns-1.7.0.tar.gz"
  sha256: "2ffabc4853bb1c70e29e6585ea15dfef8b2bdb86b6ccaad0a3b8c92b5d526d1b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-dynamic (default static package)"
  dependencies: []
  cc: clang
  upstream_test_command: "make check"
  upstream_test_count: 102

patches_applied:
  - patches/0001-fix-out-of-source-regress-generation.patch
  - patches/0002-fix-config-status-hmdfs-umask.patch
  - patches/0003-ohos-errno-messages.patch

knowledge_gained:
  - "The upstream regression suite contains 102 recorded DNS interaction cases."
  - "Generated regression harness files must remain in the build directory for an out-of-source build."
  - "Autoconf temporary directories need a non-owner-only umask on the OHOS HMDFS workspace."
  - "The consumer test exercises address conversion APIs without requiring network access."
  - "Three recorded regression expected-output strings use HarmonyOS strerror wording for the same EHOSTUNREACH and ENOTSOCK syscall results; the syscall traces and test logic are unchanged."
