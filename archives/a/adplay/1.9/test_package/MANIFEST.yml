# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: adplay/1.9
homepage: "https://github.com/adplug/adplay-unix"

# 上游测试命令（CLI 播放器无独立测试框架；OHOS CI 未执行）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "验证 adplay 二进制存在且可执行（--help 冒烟测试，不依赖音频设备）"
    command: "bash test.sh <package_folder>"
