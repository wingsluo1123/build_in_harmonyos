# 版本级 manifest — aider 0.86.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.86.2"
software: "aider"

# 编译状态
# published | built | failed | archived
# status 语义说明（提交前纠偏审计）：
# - built 仅表示 Conan 构建/验证结果（conan-verify 本轮 PASS、test_package 31/31），与既有样例 portaudio=built 一致；
# - finish 未执行（.finish-state.json 缺失），本 status 不作为 finish 成功证据；
# - 默认核心测试 test_voice 8 个用例全部通过（portaudio 19.7.0 经 cmd-pkgs 预编译包安装至测试前缀；libsndfile 由 soundfile wheel 内置）；
# - 不得视为正式适配完成；仅当 finish 成功后才可由 finish 流程改写状态。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-11"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag tarball）
  url: "https://github.com/Aider-AI/aider/archive/refs/tags/v0.86.2.tar.gz"

  # 源码校验和（2026-08-11 实测下载核对）
  sha256: "1c5ccaac6778482b4f44bb8f105103e47c2b862e37fe5c092d3433344c648a24"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  configure_options: []

  # Conan 编译依赖列表（Python 依赖经 PyPI 社区源安装，非 Conan 制品）
  dependencies: []

  # 编译器（纯 Python，无 C/C++ 编译；PEP 517 构建需 clang）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-requirements-ohos-rebase.patch：requirements.txt 与 requirements/requirements-help.txt 共 16 项依赖 pin 重基（aiohttp 3.13.3→3.14.0 等），scipy 1.18.0 违反上游 scipy<1.16 显式约束"

# ============================================================
