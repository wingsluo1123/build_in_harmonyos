software: aircrack-ng
# 版本级 manifest
# 文件位置: archives/a/aircrack-ng/1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.aircrack-ng.org/aircrack-ng-1.7.tar.gz"

  # 源码校验和
  sha256: "05a704e3c8f7792a17315080a21214a4448fd2452c1b0dd5226a3a55f90b58c3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DSTATIC_BUILD"
    - "-DDYNAMIC=0"
    - "-DCACHELINE_SIZE=64"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.5.6"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autotools不可用：OHOS上缺少automake/libtoolize，改用CMake构建"
  - "STATIC_BUILD选项：禁用动态加载(dlopen)，直接链接静态函数"
  - "osdep平台适配：使用dummy.c替代linux.c避免sockaddr_storage冲突"
  - "version.h生成：从version.h.in模板创建，需额外添加_REVISION宏"
  - "CACHELINE_SIZE：需定义为64（CPU L1 cache-line size）"
  - "cpuset_pthread：使用pthread实现替代hwloc（OHOS无hwloc）"
  - "communications.c/fragments.c排除：这些文件引用工具特有全局变量，aircrack-ng不需要"
  - "show_wep_stats桩函数：makeivs-ng链接aircrack-ptw-lib时需要此桩"

# ============================================================
# 编译结果
# ============================================================

compiled_tools:
  - name: "aircrack-ng"
    status: "success"
    description: "WEP/WPA-PSK密钥破解工具"
    size: "232064 bytes"
  - name: "kstats"
    status: "success"
    description: "显示IVS文件中的密钥统计信息"
    size: "27008 bytes"
  - name: "makeivs-ng"
    status: "success"
    description: "生成测试用的IVS文件"
    size: "141888 bytes"
