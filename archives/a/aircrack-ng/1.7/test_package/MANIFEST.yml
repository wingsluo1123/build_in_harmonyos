# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aircrack-ng/1.7
homepage: "https://aircrack-ng.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test-aircrack-ng-0001.sh
    source: aircrack-ng-1.7/test/test-aircrack-ng-0001.sh
    description: "aircrack-ng WEP cracking test"
    command: "./test/test-aircrack-ng-0001.sh"
  - file: test/test-aircrack-ng-0002.sh
    source: aircrack-ng-1.7/test/test-aircrack-ng-0002.sh
    description: "aircrack-ng WPA cracking test"
    command: "./test/test-aircrack-ng-0002.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_aircrack_ng.sh
    description: "验证 aircrack-ng/kstats/makeivs-ng 二进制存在且版本正确"
    command: "bash test_aircrack_ng.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
