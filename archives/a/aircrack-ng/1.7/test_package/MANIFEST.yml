# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: aircrack-ng/1.7
homepage: "https://www.aircrack-ng.org/"

# Upstream test command (make -n check / ctest -N / meson test --list analysis)
upstream_check_command: "make check"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test_aircrack.sh
    source: aircrack-ng-1.7/test_package/test_aircrack.sh
    description: "Run aircrack-ng --help, kstats, makeivs-ng --help"
    command: "aircrack-ng --help; kstats; makeivs-ng --help"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run aircrack-ng --help, kstats, makeivs-ng --help"
    command: "aircrack-ng --help && kstats && makeivs-ng --help"
  - file: test_aircrack.sh
    description: "Shell script running aircrack-ng --help, kstats, makeivs-ng --help"
    command: "sh test_aircrack.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 3
