# 版本级 manifest 模板
# 文件位置: archives/a/ait/1.15/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.15"

# 软件名
software: "ait"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.netbsd.org/pub/NetBSD/misc/ktnb/ait-1.15.tar.gz"

  # 源码校验和
  sha256: "f805b5c6d2b0ed94be37b289ca3164c3694822056f4fe12f9c741586e8a6e6a1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ait 是纯 libc 依赖的简单 Makefile 项目，无需 configure"
  - "make ait CC=clang CFLAGS='-fPIC -O2 -Wall' 即可编译"
  - "staging 验证时未签名 ELF 受 Seccomp 限制（Operation not permitted），属平台限制"
