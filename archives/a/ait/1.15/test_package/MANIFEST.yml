# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ait/1.15
homepage: "https://ftp.netbsd.org/pub/NetBSD/misc/ktnb/"

# 上游测试命令 (ait 无 make check 目标)
upstream_check_command: "none"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ait 无自动化测试)
# test_package 仅验证编译产物的 CLI 可用性

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    source: test_package/conanfile.py
    description: "Run `ait -v` and assert output contains 'Ait 1.15'"
    command: "ait -v"
