# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: akku/1.1.0
homepage: "https://akkuscm.org/"

# 上游测试命令：akku 自带测试套件走 GitLab CI（run-tests.sh），
# 依赖完整 Scheme 模块与网络；OHOS 受限环境下以冒烟验证为主。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1 || true"

# test_package 冒烟测试：akku version 输出正确版本（akku 用 version 子命令）
supplementary_tests:
  - file: test_package/test.sh
    count: 1
    description: >-
      运行 akku version 验证 CLI 可执行且输出版本 1.1.0。
      akku 完整测试套件依赖 Scheme 模块生态与网络，OHOS 以冒烟验证为主。
