# 版本级 manifest 模板
# 文件位置: archives/a/alda/2.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.3"

# 软件名
software: "alda"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/alda-lang/alda/archive/refs/tags/release-2.4.3.tar.gz"

  # 源码校验和
  sha256: "c7ebdcb9fc73f9821184a7bf6603076988ea626b2eda8c9b0249f3b56ec4df79"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目在 Conan 沙箱中 PATH 被剥离，需在 build() 中显式注入 GOROOT/bin"
  - "Conan 2.x ConanFile.run() 的 env 参数必须是 list/RunEnvironment，不接受 dict"
  - "CGO_ENABLED=0 生成纯静态二进制，无 libc 依赖"
  - "GOPROXY=https://goproxy.cn,direct 可靠拉取 Go 模块"
