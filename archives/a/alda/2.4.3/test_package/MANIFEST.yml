# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alda/2.4.3
homepage: "https://alda.io"

# 上游测试命令 (Go test, 仅在源码树可用)
upstream_check_command: "cd client && go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Go unit tests, 不在 test_package 中复现)
# test_package 仅验证编译产物的 CLI 可用性

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    source: test_package/conanfile.py
    description: "Run `alda version` and assert output starts with 'alda 2.4.3'"
    command: "ALDA_TELEMETRY_DISABLED=1 alda version"
