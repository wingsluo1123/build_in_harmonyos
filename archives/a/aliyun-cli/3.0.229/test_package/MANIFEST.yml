# test_package/MANIFEST.yml
package: aliyun-cli/3.0.229
homepage: "https://github.com/aliyun/aliyun-cli"

# aliyun-cli is a Go CLI tool — no standard make check / ctest / meson test
upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test binary — smoke test only
upstream_tests: []

# Consumer-side smoke test
test_package_tests:
  - file: test_package/test.sh
    description: "Smoke test: aliyun version outputs correct version string"
    command: "bash test.sh"

assertion_count: 1
