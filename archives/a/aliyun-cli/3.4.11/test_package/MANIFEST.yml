package: aliyun-cli/3.4.11
homepage: https://github.com/aliyun/aliyun-cli

upstream_test_in_build: true
upstream_tests:
  - command: "go test ./cli"
    description: "Run upstream cli package Go tests (command parsing, flag handling, output formatting) on Linux and signed OHOS test binaries"

test_package_tests:
  - file: test.sh
    description: "Run aliyun version and validate version output matches 3.4.11"
    command: "bash test.sh <bin/aliyun>"

assertion_count: 3
