# 软件级 manifest
# 文件位置: archives/a/aliyun-cli/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: aliyun-cli

display: "Alibaba Cloud CLI"

description: "阿里云命令行工具 — Alibaba Cloud services CLI"

category: utility

homepage: "https://github.com/aliyun/aliyun-cli"

license: Apache-2.0

# ============================================================
# 构建信息
# ============================================================

build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Go 项目，使用 go build 编译，非 C/C++ 构建系统"
    - "aliyun-openapi-meta 是 git submodule，tarball 不包含，需单独下载"
    - "版本注入: -ldflags \"-X 'github.com/aliyun/aliyun-cli/cli.Version=VERSION'\""
    - "Go linker 在 HMDFS 上 mmap 失败，输出需放在 ext2 分区"
    - "CGO_ENABLED=0 纯静态编译"
    - "GOPROXY=https://goproxy.cn,direct 国内加速"
    - "ELF 签名: 构建后需 binary-sign-tool 签名才能执行"

  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.0.229":
    status: built
    build_date: 2026-08-05
