# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: allegro/5.2.11.3
homepage: "https://liballegro.org/"

# Upstream test command (allegro uses CMake, no make check)
upstream_check_command: "ctest -N"

# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (allegro has examples but they require X11/OpenGL)
upstream_tests: []

# test_package tests (consumer perspective validation)
test_package_tests:
  - file: test.c
    description: "Verify allegro library version via al_get_allegro_version()"
    command: "./test_allegro"

# Total assertion count (approximate, for quality assessment)
assertion_count: 2
