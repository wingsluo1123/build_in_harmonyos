package: alloy/1.18.1
homepage: "https://grafana.com/oss/alloy"

# 上游测试命令 — alloy 上游使用 Go 测试套件
upstream_check_command: "go test ./..."
upstream_test_in_build: true
upstream_test_command: "go test ./... (根模块 + collector 模块)"

# 上游实际运行的测试程序
upstream_tests:
  - file: "**/*_test.go"
    source: "alloy-1.18.1 (github.com/grafana/alloy 根模块 + collector/otel_engine 模块)"
    description: "上游 Go 单元测试（otel-collector 组件与 alloy 核心）"
    command: "go test ./..."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_alloy.py
    description: "消费者 smoke test: alloy --version 版本断言 + alloy fmt 配置解析"
    command: "python3 test_alloy.py <exe>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
