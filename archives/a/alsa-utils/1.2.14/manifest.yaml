knowledge_gained:
  - "musl libc does not implement POSIX thread cancellation API (pthread_cancel etc), need stub file"
  - "alsa-utils requires alsa-lib >= 1.2.13"
  - "Disable udev rules (--with-udev-rules-dir=no) because /lib is read-only"
  - "VPATH build avoids HMDFS temp file permission issues"
  - "Shebang fix needed for /bin/sh -> /system/bin/sh on HarmonyOS"
  - "umask 077 in configure causes HMDFS permission denied, change to umask 000"

