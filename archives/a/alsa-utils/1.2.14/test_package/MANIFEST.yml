# test_package/MANIFEST.yml
# CI scripts (build_and_test.sh L0e) require this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: alsa-utils/1.2.14
homepage: "https://www.alsa-project.org/"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests not integrated in build() (no test suite in alsa-utils)
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (alsa-utils has no test suite)
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run aplay --version to verify alsa-utils binary is functional"
    command: "aplay --version"

# Approximate assertion count
assertion_count: 1
