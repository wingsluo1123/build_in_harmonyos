# conandata.yml — analitza 26.04.0
# Upstream source: official KDE release-service 26.04.0 tarball (education/
# analitza tag v26.04.0; the project version string is ANALITZA_VERSION
# 9.0.0, the release number 26.04.0 is used as the package version).

sources:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/analitza-26.04.0.tar.xz"
  sha256: "2fd1803bcc011515716ed802265e63dc4d34ee6fccbdf6d523f39475eb64431f"

patches:
  "26.04.0":
    - patch_file: "patches/0001-cmake-optional-qt-modules.patch"
      patch_description: "Move PrintSupport/OpenGL/OpenGLWidgets to OPTIONAL_COMPONENTS in the top-level find_package(Qt6) and report which optional modules are missing"
      patch_type: "portability"
    - patch_file: "patches/0002-analitzaplot-optional-links.patch"
      patch_description: "Link Qt6::PrintSupport / Qt6::OpenGL into AnalitzaPlot only when the imported targets exist, and export ANALITZA_HAVE_OPENGL as a PUBLIC compile definition of the target so consumers compile the same plotter3d_es.h class layout"
      patch_type: "portability"
    - patch_file: "patches/0003-analitzawidgets-conditional-openglwidgets.patch"
      patch_description: "Build/install plotsview3d_es and link Qt6::OpenGLWidgets only when the module is available"
      patch_type: "portability"
    - patch_file: "patches/0004-declarative-conditional-graph3d.patch"
      patch_description: "Compile the QML Graph3D item (QQuickFramebufferObject) and ship qml/Graph3D.qml only when Qt6::OpenGL exists"
      patch_type: "portability"
    - patch_file: "patches/0005-examples-conditional-plots3ddemo.patch"
      patch_description: "Build plots3ddemo only with OpenGLWidgets; keep export3dplotdemo (X3D exporter) buildable without OpenGL so the upstream export CTest cases keep running"
      patch_type: "portability"
    - patch_file: "patches/0006-plotter3des-capability-guards.patch"
      patch_description: "Capability guards for QOpenGL* and QPrinter in plotter3d_es.h/.cpp: the header consumes the ANALITZA_HAVE_OPENGL PUBLIC definition exported by the target (with a __has_include fallback for non-CMake consumers), compiling out the GPU scene and the PDF save branch while keeping the 3D plot model and the X3D/STL export path"
      patch_type: "portability"
