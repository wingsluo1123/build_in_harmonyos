# ============================================================
# 必须字段
# ============================================================

version: "26.04.0"
software: "analitza"
status: built
build_date: "2026-10-17"
build_system: "cmake"
conan_ref: "analitza/26.04.0"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/analitza-26.04.0.tar.xz"
  sha256: "2fd1803bcc011515716ed802265e63dc4d34ee6fccbdf6d523f39475eb64431f"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux / -DCMAKE_SYSTEM_PROCESSOR=aarch64（OHOS 强制 Linux 平台模块，E092 链式约定）"
    - "-DBUILD_SHARED_LIBS=ON（libAnalitza / AnalitzaPlot / AnalitzaGui / AnalitzaWidgets 四库）"
    - "-DBUILD_TESTING=ON（构建内 ctest 实跑上游 18 项用例）"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE（OHOS 不在 KDE 平台白名单）"
    - "-DCMAKE_INSTALL_LIBDIR=lib、-DKDE_INSTALL_USE_QT_SYS_PATHS=OFF（KDEInstallDirs 单前缀布局）"
    - "-DCMAKE_EXE_LINKER_FLAGS_INIT / -DCMAKE_SHARED_LINKER_FLAGS_INIT=-Wl,-z,max-page-size=0x1000（OHOS 加载器要求 4K 段布局）"
    - "CMAKE_USER_MAKE_RULES_OVERRIDE_C/CXX 注入 rules 文件：-Wl,-soname, 与 -Wl,-rpath,（OHOS CMake 无 Platform/HarmonyOS，默认不产 SONAME；E1582 同源）"
    - "-DCMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE（HMDFS 禁 symlink：单文件无版本 .so + 裸 DT_SONAME，E330；package() 对 install 重写 RUNPATH 后的 ELF 重签 .codesign）"
    - "-DECM_MODULE_PATH=<ecm/share/ECM 的 modules;find-modules;kde-modules>（CMakeDeps 生成的 ECMConfig 不带模块路径，手工注入）"
    - "-DQt6LinguistTools_DIR=<qt6linguisttools>/lib/cmake/Qt6LinguistTools（ECMPoQmTools 需要 lrelease/lconvert；kdbusaddons 6.29.0 先例）"
    - "-DQT_ADDITIONAL_PACKAGES_PREFIX_PATH=<qtbase;qtsvg;qtdeclarative 前缀>（Qt6 拆包组件查找：Svg 在 qtsvg、Qml/Quick 在 qtdeclarative）"
    - "conan_cmakedeps_paths.cmake（CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON + CMAKE_PREFIX_PATH/LIBRARY_PATH/INCLUDE_PATH/MODULE_PATH 注入；qtbase/qtsvg/qtdeclarative 为 cmake_find_mode=none）"

  dependencies:
    - "qtbase/6.11.1（Core/Gui/Widgets/Xml；Test 供上游 QTest 程序）"
    - "qtsvg/6.11.1（AnalitzaWidgets 以 PRIVATE 链接 Qt6::Svg）"
    - "qtdeclarative/6.11.1（Qml/Quick，org.kde.analitza QML 模块）"
    - "ecm/6.26.0 (tool_requires)"
    - "qt6linguisttools/6.11.1 (tool_requires)"

  cc: clang
  cxx: clang++

