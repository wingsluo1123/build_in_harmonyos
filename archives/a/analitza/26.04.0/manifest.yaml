# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "analitza 26.04.0（kalgebra 26.04.0 的 find_package(Analitza6 REQUIRED) 依赖）：OHOS qtbase/6.11.1 未启用 PrintSupport / OpenGL / OpenGLWidgets 三组件——顶层 find_package(Qt6) 将三者移入 OPTIONAL_COMPONENTS（补丁 0001），AnalitzaPlot / AnalitzaWidgets / declarative / examples 的每一处链接与源文件均以 if(TARGET) 或 __has_include 能力探测守卫生效（补丁 0002–0006），全仓无平台宏（R8 合规）。"
  - "E330：HMDFS 用户卷拒绝 symlink()（EPERM），上游 VERSION/SOVERSION 的 libAnalitza.so.9.0.0→.so.9→.so 链无法落地——以 CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE 产出单文件无版本 .so，DT_SONAME 为裸基名（ki18n/attica 先例）；CMake install() 重写 RUNPATH 会破坏 OHOS 构建期 .codesign 封印，package() 以 llvm-objcopy --remove-section .codesign + binary-sign-tool -selfSign 1 全树重签。"
  - "plotter3d_es.h 消费 AnalitzaPlot target 导出的 PUBLIC 编译定义 ANALITZA_HAVE_OPENGL（0/1，随 Analitza6Targets.cmake 传播，保证库与消费者类布局一致；非 CMake 消费者保留 __has_include(<QOpenGLFunctions>) 兜底），plotter3d_es.cpp 用 __has_include(<QPrinter>) 定义 ANALITZA_HAVE_PRINTSUPPORT：GPU 场景与 PDF 保存分支编译排除，而 3D 绘图模型与 X3D/STL 导出路径保持完整——上游 4 个 export-test-{sin,fancy}-{stl,x3d} CTest 用例因此在无 OpenGL 的 qtbase 线上照常运行（补丁 0002 + 0006）。"
  - "QML 模块 org.kde.analitza 的 Graph3D（QQuickFramebufferObject）依赖 Qt6::OpenGL，缺失时 declarative/ 只编译并安装 Graph2D.qml（补丁 0004）；模块其余部分正常安装到 lib/qml/org/kde/analitza（qmldir + Graph2D.qml），package_info() 导出 QML2_IMPORT_PATH/QML_IMPORT_PATH。"
  - "上游 ctest 从各测试自己的 binary dir 启动，构建树的 lib*.so 需要镜像到每个测试工作目录（HMDFS symlink EPERM → shutil.copy2 回退）；运行环境隔离 HOME/XDG_RUNTIME_DIR/XDG_CACHE_HOME 等并设 QT_QPA_PLATFORM=offscreen（无头）；LD_LIBRARY_PATH 前置 /system/lib64 规避沙箱 libc++_shared.so 不兼容。"
  - "包导出面：上游自带 Analitza6Config.cmake（find_dependency(Qt6Core 6.5.2) + find_dependency(Qt6Xml)，target 命名空间 KF6::Analitza*），配方以 cmake_find_mode=none 防止 CMakeDeps 遮蔽；AnalitzaWidgets 的公共头被上游安装到 include/Analitza6/analitzagui/（无 analitzawidgets 目录），消费者按 analitzagui/expressionedit.h、analitzagui/plotsview2d.h 引用；AnalitzaWidgets 以 PRIVATE Qt6::Svg 进入运行期 DT_NEEDED（qtsvg 必须在运行环境）。"
  - "Qt6LinguistTools 用 tool_requires qt6linguisttools/6.11.1 + 显式 Qt6LinguistTools_DIR 钉法（Qt6Config 按 Qt6_DIR 相对查找组件，qtbase 制品不含该组件）——kdbusaddons 6.29.0 先例。"
