package: apertium/3.9.12
homepage: "https://github.com/apertium/apertium"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  apertium 3.9.12 ships a Python unittest suite (tests/run_tests.py) that
  invokes transfer/cleanstream/tagger/interchunk/postchunk binaries via
  subprocess. OHOS target has no Python runtime, so the upstream test suite
  cannot run on-device. The C++ test_package verifies libapertium linkability
  and core type API (Morpheme/Analysis/a/i) instead.

test_package_tests:
  - file: apertium_probe.cpp
    description: "Link libapertium and invoke core types (Morpheme/Analysis/a/i) to verify the library is usable"
    command: "apertium_probe"

assertion_count: 5
