software: apitrace
version: "14.0"
status: built
build_date: "2026-08-05"

source:
  url: "https://github.com/apitrace/apitrace/archive/refs/tags/14.0.tar.gz"
  sha256: "53469052b28ca56dc0d28153d218dee6c2c128c53b2aa32d6e7f906f7a5c6c7a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DENABLE_LTO=OFF"
    - "-DENABLE_GUI=OFF"
    - "-DENABLE_CLI=ON"
    - "-DENABLE_X11=OFF"
    - "-DENABLE_EGL=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt: Add ENABLE_LTO option"
  - "0002-thirdparty-brotli.cmake: Add missing brotli source files for brotli 1.2.0+"

knowledge_gained:
  - "LTO must be disabled: brotli BROTLI_INTERNAL symbols fail to link with lld"
  - "brotli.cmake needs patch: prefix.c, static_init.c, static_dict_lut.c for brotli 1.2.0+"
  - "X11 disabled (ENABLE_X11=OFF) as OHOS has no X11; EGL enabled as OHOS has EGL"
  - "apitrace bundles zlib, libpng, snappy, brotli, zstd, libbacktrace, gtest as git submodules"
