package: apitrace/14.0
homepage: "https://github.com/apitrace/apitrace"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "ctest"

upstream_tests:
  - file: tests/CMakeLists.txt
    source: apitrace-14.0/tests/CMakeLists.txt
    description: "apitrace unit tests"
    command: "ctest"

test_package_tests:
  - file: test.c
    description: "Verify apitrace CLI binary works"
    command: "./test_apitrace"

assertion_count: 5
