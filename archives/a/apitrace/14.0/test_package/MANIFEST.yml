# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: apitrace/14.0
homepage: "https://github.com/apitrace/apitrace"

# 上游测试命令 (apitrace uses CMake BUILD_TESTING / ENABLE_TESTS)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序 (BUILD_TESTING disabled for cross-compile, no bundled tests run)
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_apitrace.sh 验证 apitrace/gltrim 二进制存在且可执行、egltrace.so wrapper 存在、Python 脚本完整"
    command: "conan create (test_package: bash test_apitrace.sh <pkg_dir>)"
  - file: test_apitrace.sh
    description: "真实冒烟测试:检查 bin/apitrace 可执行并响应命令、bin/gltrim 存在、lib/apitrace/wrappers/egltrace.so 存在、scripts/ 下 3 个 Python 脚本完整"
    command: "bash test_apitrace.sh <package root dir>"

assertion_count: 7
