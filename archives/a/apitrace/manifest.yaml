software: apitrace
display: "apitrace"
description: "API call tracing framework for OpenGL, Direct3D and other graphics APIs"
category: development
homepage: "https://github.com/apitrace/apitrace"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake build system, cross-compiles for OHOS aarch64"
    - "GitHub tarball lacks git submodules; fetched individually in conanfile.py source()"
    - "ENABLE_EGL=ON builds egltrace.so wrapper (core tracing functionality)"
    - "ENABLE_X11=OFF since HarmonyOS has no X11; EGL uses dlsym for runtime resolution"
    - "All third-party deps bundled as git submodules (zlib, snappy, brotli, zstd, libpng, etc.)"
  common_dependencies: []

versions:
  "14.0":
    status: published
    build_date: "2026-08-05"
