software: apko
# 版本级 manifest
# 文件位置: archives/a/apko/1.2.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.17"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/chainguard-dev/apko/archive/refs/tags/v1.2.17.tar.gz"

  # 源码校验和
  sha256: "12af82ec319f989c82da2ff5ef59a19822fc0193158f6510b0ada3b72f2d7662"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux GOARCH=arm64"
    - "GOTOOLCHAIN=local"
    - "-buildmode=pie"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "apko go.mod requires Go >= 1.26.0, need Go 1.26.0+ SDK for building"
  - "Go projects on HarmonyOS need GOTOOLCHAIN=local or proper SDK path"
  - "buildmode=pie required for HMDFS to execute Go binaries (ET_DYN)"
  - "apko is a pure Go static binary, CGO_ENABLED=0 works fine"
  - "Go toolchain binaries need ELF signing on HarmonyOS (binary-sign-tool)"
  - "No conan-level dependencies: Go resolves modules from proxy during build"
