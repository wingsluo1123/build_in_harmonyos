software: apko
# 版本级 manifest
# 文件位置: archives/a/apko/1.2.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.17"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: go

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/chainguard-dev/apko/archive/refs/tags/v1.2.17.tar.gz"

  # 源码校验和
  sha256: "12af82ec319f989c82da2ff5ef59a19822fc0193158f6510b0ada3b72f2d7662"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: go

  configure_options:
    - "CGO_ENABLED=0 go build -trimpath -ldflags='-buildid= -X sigs.k8s.io/release-utils/version.gitVersion=1.2.17 ...' -o apko ./"
    - "CGO_ENABLED=0 go test -short -count=1 -timeout 120s ./..."

  dependencies:
    - "go/1.26.3 (self-bootstrapped linux-arm64)"

  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "apko go.mod requires Go >= 1.26.0, need Go 1.26.3 SDK for building"
  - "Go projects on HarmonyOS need GOTOOLCHAIN=local or proper SDK path"
  - "binary-sign-tool selfSign mode required for ELF signing (E128)"
  - "apko is a static Go binary, CGO_ENABLED=0 works fine"
  - "E128: Go binaries and Go toolchain ELFs require .codesign section for HongMeng execve"
  - "E166: Go linker mmap fails on HMDFS, route output to ext2 partition"
  - "E077: ELF signing pipeline: llvm-objcopy --remove-section .codesign -> binary-sign-tool sign -selfSign 1 -> chmod 0o755"

platform_workarounds:
  - problem: "Go toolchain not available on HarmonyOS PC preflight worker"
    solution: "Self-bootstrap Go 1.26.3 from golang.google.cn, re-sign all toolchain ELFs"
    knowledge_ref: "E128 + E077"
  - problem: "Go linker mmap fails on HMDFS"
    solution: "Route GOCACHE/GOTMPDIR/linker output to ext2 partition"
    knowledge_ref: "E166"
