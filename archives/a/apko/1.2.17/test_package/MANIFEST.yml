package: apko/1.2.17
homepage: "https://github.com/chainguard-dev/apko"

upstream_check_command: "go test -count=1 ./..."
upstream_test_in_build: false
upstream_test_command: "go test -short -count=1 -timeout 120s -json <per-package>"

upstream_tests:
  - file: pkg/paths/paths_test.go
    source: apko-1.2.17/pkg/paths/paths_test.go
    description: "Path resolution tests"
    command: "go test ./pkg/paths/"
  - file: pkg/passwd/passwd_test.go
    source: apko-1.2.17/pkg/passwd/passwd_test.go
    description: "Passwd/group parsing tests"
    command: "go test ./pkg/passwd/"
  - file: pkg/vcs/vcs_unit_test.go
    source: apko-1.2.17/pkg/vcs/vcs_unit_test.go
    description: "VCS detection tests"
    command: "go test ./pkg/vcs/"

test_package_tests:
  - file: test.sh
    description: "Smoke test: apko version"
    command: "bash test.sh"
