# conandata.yml — appres 1.0.7
# 上游官方源 (R39): x.org releases 个体目录，sha256 为本机实测值
sources:
  url: "https://www.x.org/releases/individual/app/appres-1.0.7.tar.xz"
  sha256: "1114b189239fd87a8d1db433edcb4486346d29912132b91eaeee5667f13b819f"

# 三处均为对 autotools 分发脚本的移植性修复，无平台预处理器宏（R8/PF5）
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach config.guess to recognize uname -s = HarmonyOS and emit aarch64-unknown-linux-ohos (E007); also relax its umask 077 scratch dir to 022 so HMDFS can write it (E110)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Add the ohos-linux triplet mapping plus the OS and kernel whitelists so config.sub accepts aarch64-unknown-linux-ohos (E072)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Create config.status's scratch dir with umask 022 and mkdir instead of umask 077 and mktemp -d, which produces a 700 dir HMDFS refuses to write (E110/E112)"
    patch_type: "portability"
