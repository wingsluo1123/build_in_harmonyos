# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.7"

# 软件名
software: "appres"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-07"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.x.org/releases/individual/app/appres-1.0.7.tar.xz"

  # 源码校验和（本机 sha256sum 实测）
  sha256: "1114b189239fd87a8d1db433edcb4486346d29912132b91eaeee5667f13b819f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  # 上游 configure.ac 无项目专属开关，只需 --prefix（R1 参数最少化）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # ⚠ 必须是 conan graph info rc=0 的可解组合：
  #   libxt/1.3.1 自身 requires libx11/1.8.13，与 libx11/6.4.0 冲突
  dependencies:
    - libx11/1.8.13
    - libxt/1.3.1
    - xorgproto/2025.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 测试口径（三处同源：本件 / notes.md / test-report.md + MANIFEST.yml + README.md）
# ============================================================
tests:
  # 上游测试资产 —— §12.72 四口径 2026-10-07 源码树实测
  #   test*/ 框架 0 · */res 语料 0 · **/*RUNTEST* 0 · src/demo|examples *.c 0
  #   Makefile.am 无 TESTS/check_PROGRAMS；make check 实测空转 rc=0
  upstream: 0
  # test_package 消费者断言（conan create 内实测 4/4 PASS）
  after_adapt: 4
  evidence: "reports/test-report.md"

# ============================================================
# 补丁信息
# ============================================================

# 3 件补丁全部落在 patches/（与 conandata.yml 的 patches: 3 件、
# patch_generation.patches_count: 3、磁盘实物 3 件同源一致）——
# 均为对 autotools 分发 shell 脚本的移植性修复，无平台预处理器宏（R8/PF5）
# —— conanfile.py 的 build() 先 apply_conandata_patches() 应用下列 3 件，
#    再跑幂等的 _patch_autotools_scripts() 兜底（补丁已生效时为 no-op）：
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条须带 ref: —— 指向本次实际查用的知识条目）
knowledge_gained:
  - "config.guess/config.sub 不识 uname -s=HarmonyOS ⇒ 补 HarmonyOS case + ohos-linux 三元组 (ref: E007, E072)"
  - "config.sub 的 kernel-OS 白名单需单独补 linux-ohos*：三元组 patch 已写入该子串，裸判存在会漏 (ref: E072 第 3 处)"
  - "config.status 用 umask 077 && mktemp 建 700 目录，HMDFS 拒写 ⇒ 放宽 022 + mkdir (ref: E110, E112)"
  - "conan xorgproto 只声明 pkg_config_name=xorgproto，上游要 xproto ⇒ generate() 内别名 (ref: E075)"
  - "依赖『已发布』≠『可解』：preflight --deps 与 conan graph info 是两道闸 (ref: R36, R35)"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/appres-1.0.7.orig
  source_work_dir: /storage/Users/currentUser/builds/appres-1.0.7.work
  source_orig_hash: 06e16342e36dc1ea
  source_work_hash: 485d6f9c9bbad4cf
  generated_at: '2026-10-07T18:45:12'
  patches_count: 3

patch_classification:
