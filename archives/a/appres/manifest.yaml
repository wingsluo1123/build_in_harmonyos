# 软件级 manifest — appres
# 遵循 ARCHIVE-SPEC v2.0

software: appres
display: "appres"
description: "X.Org 应用资源查看器 — 连接 X 客户端并打印其资源数据库"
category: utility
homepage: "https://gitlab.freedesktop.org/xorg/app/appres"
license: MIT
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游同时带 configure（官方发布路径）与 meson.build；本仓走 autotools —— 设备/CI 均无 meson，且 autotools 是上游发布验证过的路径"
    - "config.guess/config.sub 不识 uname -s=HarmonyOS：需补 HarmonyOS case（→ aarch64-unknown-linux-ohos）、ohos-linux 三元组、OS 白名单 ohos*、kernel 白名单 linux-ohos*"
    - "⚠ kernel 白名单必须单独判存在：三元组 patch 已写入子串 linux-ohos，用裸子串做 guard 会误判'已存在'而漏改，configure 报 Kernel `linux` not known to work with OS `ohos`"
    - "config.status 用 umask 077 && mktemp -d 建 700 目录，HMDFS 拒写 ⇒ 放宽 022 + mkdir（E110/E112）；改 configure 源头即可让 config.status 继承，且必须真正写回磁盘"
    - "conan xorgproto 只声明 pkg_config_name=xorgproto，上游 configure.ac 要 `xproto >= 7.0.17` ⇒ generate() 内别名，x11.pc/xt.pc 的 Requires 链同步"
    - "依赖 libxt/1.3.1 自带约束 libx11/1.8.13 ⇒ 与 libx11/6.4.0 互斥；『已发布』≠『可解』，preflight --deps 与 conan graph info 是两道闸"
    - "本机无 X server：-version/-V/-help 在连 X 前即返回（可断言）；裸执行与未知参数会 `Error: Can't open display`"
  common_dependencies:
    - libx11
    - libxt
    - xorgproto

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.7":
    status: built
    build_date: "2026-10-07"
    source_url: "https://www.x.org/releases/individual/app/appres-1.0.7.tar.xz"
    sha256: "1114b189239fd87a8d1db433edcb4486346d29912132b91eaeee5667f13b819f"
    dependencies:
      - libx11/1.8.13
      - libxt/1.3.1
      - xorgproto/2025.1
    tests:
      upstream: 0
      after_adapt: 4
