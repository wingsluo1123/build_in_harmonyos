software: apr-util
version: "1.6.3"
status: published
build_date: "2026-08-09"

source:
  url: "https://archive.apache.org/dist/apr/apr-util-1.6.3.tar.gz"
  sha256: "2b74d8932703826862ca305b094eef2983c27b39d5c9414442e9976a9acf1983"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-apr=apr/1.7.6"
    - "--with-expat=expat/2.8.2"
  dependencies:
    - "apr/1.7.6"
    - "expat/2.8.2"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess-ohos.patch"
  - "0002-configure-umask.patch"
  - "0003-config.sub-ohos.patch"

knowledge_gained:
  - "E007: config.guess 需要 HarmonyOS 系统检测和 aarch64:HarmonyOS GUESS 构造"
  - "E011: configure 的 umask 077 需改为 umask 022 解决 HMDFS 权限问题"
  - "E072: config.sub 需要 ohos-linux triplet 支持"

conan:
  recipe: true
  test_package: true
  shared_option: false
  libraries: ["aprutil-1"]
