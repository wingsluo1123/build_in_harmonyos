# test_package/MANIFEST.yml — apr-util 1.6.3
# CI L0e requires this file to exist.

package: apr-util/1.6.3
homepage: "https://apr.apache.org/"

# apr-util has upstream test suite (test/ directory in source)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package.c
    description: "Calls apr_initialize() and prints apu_version_string()"
    command: "./test_package"

# Approximate assertion count
assertion_count: 1
