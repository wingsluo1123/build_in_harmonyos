# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: apr-util/1.6.3
homepage: "https://apr.apache.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_aprutil.h
    source: apr-util-1.6.3/test/test_aprutil.h
    description: "APR-util test harness header"
    command: "make check"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 apr_initialize, apr_pool_create, apr_bucket_alloc_create, apu_version_string 等 API"
    command: "./test_apr_util"

# 测试断言总数
assertion_count: 5
