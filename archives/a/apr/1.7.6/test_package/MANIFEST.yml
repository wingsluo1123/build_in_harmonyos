# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: apr/1.7.6
homepage: "https://apr.apache.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_apr.h
    source: apr-1.7.6/test/test_apr.h
    description: "APR test suite header"
    command: "./testall"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 apr_initialize, apr_pool_create, apr_terminate API"
    command: "./test_apr"

# 测试断言总数
assertion_count: 3
