# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS/musl 无 /usr/share/dpkg 的 cputable/tupletable/triplettable，pkgInitArchTupleMap() 打开失败会让库初始化整体失败；需在 __OHOS__ 分支内嵌 dpkg 1.21.x 架构表（0007/0009 补丁）。"
  - "OHOS 无 /etc/debian_version，GNUInstallDirs 不认识 HarmonyOS 平台，LIBEXECDIR 解析为 bin 导致 libexec 工具与 apt 本体同目录冲突；需在 CMAKE_SYSTEM_NAME=HarmonyOS 时同样固定 LIBEXECDIR=lib（0010 补丁）。"
  - "上游 test/libapt 137 项在 OHOS 实测 119 通过：5 项 CompareVersion 因宿主无 dpkg 二进制（/usr/bin/dpkg、/bin/dpkg 均不存在，execvp 失败）；4 项 FileUtl 因 /var/tmp 不存在、/bin/bash 不存在、/etc 为 /system/etc 符号链接、存储文件系统屏蔽 others-read(0004) 位；1 项 HashSums 因 /etc/os-release 不存在；8 项 OpenMaybeClearSignedFile 系前序失败用例污染全局 _error 栈（单独运行 15/15 全过）。全部为不可变 OHOS rootfs 缺 Debian 专有文件/工具所致，非 libapt-pkg 缺陷。"
  - "apt 依赖静态链接的 systemd/libgcrypt/xxhash 等头文件目录为单数 include（gnutls/seccomp 为复数 include），需逐目录传播（0001/0002/0003 补丁）。"
  - "musl/OHOS 下 methods/seccomp 需 #undef LFS 别名（open64 等）避免与 OHOS 头文件冲突（0004 补丁）。"
  - "OHOS 无 debSystem 评分表，需给 OHOS 打分避免 pkgInitSystem 判死（0006 补丁）；debSystem 需静态链接强制（0008 补丁）。"
  - "conan-verify 使用 ohpcd/stable channel，配方 requires 需含 libdb/zlib/bzip2/liblzma/lz4/libgcrypt/xxhash/libzstd/gnutls/systemd/libseccomp，tool_requires 需含 triehash/perl（apt CMake find_program 硬性要求）。"
  - "conan 的 apply_conandata_patches 用 patch_ng 严格匹配（fuzz=False、行号精确）；在已改动源码上重新生成的补丁带行号偏移会直接失败。补丁必须按连续快照 diff -u tree_{i-1} tree_i 重生成（本包 0001-0010 已重生成），且 0007→0009 是同区域演进必须按序。"
  - "apt 的 apt-pkg/apt-private 是显式 add_library(SHARED)，BUILD_SHARED_LIBS=OFF 不影响；R26 静态库需补丁改成 STATIC+install ARCHIVE（0014/0015）。"
  - "conan CMakeToolchain 设 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，会屏蔽 FindLFS.cmake 的 CACHE INTERNAL 值（0011 用 PARENT_SCOPE 修复）；C++17 已删除 throw() 动态异常规格（0012）；CMake 缺 include(CheckSymbolExists)（0013）；musl 无 getservbyport_r（0016）。"

