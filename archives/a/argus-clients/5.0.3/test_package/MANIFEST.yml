# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: argus-clients/5.0.3
homepage: "http://qosient.com/argus"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# argus-clients has no automated test suite (Makefile has no check target)
# Manual verification: ra --version shows "Ra Version 5.0.3"
upstream_tests:
  - file: "N/A"
    source: "argus-clients does not provide automated tests"
    description: "No automated test suite in upstream"
    command: "ra --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Runs ra --version and verifies output contains 'Ra Version 5.0.3'"
    command: "ra --version 2>&1 | grep 'Ra Version 5.0.3'"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
