# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aria2/1.37.0
homepage: "https://aria2.github.io"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/aria2c
    source: aria2-1.37.0/test/aria2c
    description: "aria2 unit tests (cppunit-based, 980 test cases)"
    command: "./aria2c"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run aria2c --version to verify binary works"
    command: "aria2c --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 980
