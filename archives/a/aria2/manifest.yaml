software: aria2
display: "aria2"
description: "轻量级多协议命令行下载工具，支持 HTTP/HTTPS、FTP、BitTorrent 和 Metalink"
category: network
homepage: "https://aria2.github.io"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "基于 autotools 构建系统"
    - "需要 patch config.guess/config.sub 支持 OHOS 平台"
    - "需要移除 configure 中的 umask 077 (HMDFS 兼容性)"
  common_dependencies:
    - openssl
    - c-ares
    - expat
    - zlib
    - sqlite3
    - gmp
    - libxml2
    - libuv

versions:
  "1.37.0":
    status: built
    build_date: "2026-08-10"
    source_url: "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.gz"
