# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: asciidoc/10.2.1
homepage: "https://asciidoc.org/"

# 上游测试命令
upstream_check_command: "python3 -m pytest tests/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_asciidoc.py
    source: asciidoc-10.2.1/tests/test_asciidoc.py
    description: "上游 asciidoc 功能测试"
    command: "python3 -m pytest tests/test_asciidoc.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_asciidoc.py
    description: "消费者测试：验证 asciidoc 命令行工具可正常转换文档"
    command: "asciidoc --version && asciidoc -o test.html test.adoc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
