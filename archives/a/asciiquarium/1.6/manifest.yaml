software: asciiquarium
version: "1.6"
status: published
build_system: script
build_date: "2026-08-05"
compiler: "perl 5.42.0 (script, no compilation)"
configure_options: []
make_options: []
dependencies:
  - perl >= 5.42.0
  - Curses (Perl module)
  - Term::Animation >= 2.0 (Perl module)
runtime_deps:
  - ncursesw (system library)
quality_gate:
  G0_clean_build: pass
  G1_binary_integrity: pass
  G2_functionality: pass
  G3_portability: pass
  G4_archive_integrity: pass
notes:
  - "Pure Perl script, no C/C++ compilation required"
  - "Conan recipe packages the script to bin/ directory"
  - "Runtime dependencies (Term::Animation, Curses) are Perl modules, not conan packages"
  - "Users must install Perl modules via cpan on the target system"
