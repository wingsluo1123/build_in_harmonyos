# test_package/MANIFEST.yml — asciiquarium 1.6
# CI L0e requires this file to exist.

package: asciiquarium/1.6
homepage: "https://github.com/nothub/asciiquarium"

# asciiquarium is a pure Perl script with no upstream test suite
# (no Makefile.PL test target, no `make test` in the tarball)
upstream_check_command: "perl -c asciiquarium"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Verifies asciiquarium script is packaged in bin/, has valid Perl shebang, contains version 1.6 string, and attempts to run --version"
    command: "bash test.sh"

# Approximate assertion count (script exists + shebang + version string + execution attempt)
assertion_count: 4
