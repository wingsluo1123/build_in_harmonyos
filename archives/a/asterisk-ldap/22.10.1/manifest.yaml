# ============================================================
# 测试结果
# ============================================================

test_results:
  type: conan create + conan-verify + 消费者测试
  passed: 13
  failed: 0
  note: |
    上游测试：Asterisk 的 in-tree 单元测试以 AST_TEST_DEFINE(...) 注册，
    **全树共 707 个用例**（源码清点口径：
    `grep -rh "^AST_TEST_DEFINE(" --include="*.c" . | wc -l` = 707；
    其中 tests/*.c = 633 个 / 95 个文件，其余 74 个分布在 res/ main/ funcs/
    bridges/ apps/ 等 25 个 .c 文件）。入口为
    tests/CI/buildAsterisk.sh + tests/CI/runUnittests.sh
    （`asterisk -rx "test execute all"`）；res_config_ldap **无专属上游用例**
    （707 个注册中无一涉及 LDAP；grep 取证见 reports/upstream-tests.md），
    且套件需完整核心（-o *_/with_test_framework=True）与运行中的 PBX —— 本模块包
    不构建核心，故 707 个上游用例未运行（如实声明，非跳过、不计入通过率）。
    适配后：test_package 13 项检查全部通过（8 静态 ELF 校验 + 5 动态加载检查）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Asterisk 模块的 ABI 是『构造函数自注册』：AST_MODULE_INFO() 生成 static struct ast_module_info __mod_info + __attribute__((constructor)) __reg_module() 调用 ast_module_register(&__mod_info)；加载器只需 dlopen，.so 不导出任何符号（导出为空是正确形态）"
  - "clang 不支持 GCC 风格嵌套函数定义，而 Asterisk utils.h 的 RAII_VAR 在 __GNUC__ 分支里正是嵌套函数 —— 未启用 -fblocks 时（kernel 关闭 blocks 分支）会编译失败（function definition is not allowed here）；需为 clang 增加 __attribute__((cleanup)) 版分支（patch 0009）"
  - "Asterisk configure 的 LDAP 检查只产出 -lldap，而 res_config_ldap.c 直接调用 liblber 的 ber_free；lld 默认 --no-copy-dt-needed-entries 不从传递库解析符号 → 必须在 makeopts 的 LDAP_LIB 里显式补 -llber（并给 LIBS 加 -llber 让 configure 检查通过）"
  - "openldap/2.6.7 直接提供 include/ldap.h + lib/libldap.so + lib/liblber.so + pkgconfig/{ldap,lber}.pc，注入私有 prefix 即可；configure 用 --with-ldap=<prefix> 探测 AST_EXT_LIB_CHECK([LDAP], [ldap], [ldap_initialize], [ldap.h])"
  - "OHOS libc（musl 分支）提供 __strlen_chk/__strchr_chk 等 FORTIFY 符号，因此 clang 生成的引用在设备上可解析（可用 dlopen 加载测试实证）"

references:
