# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: asterisk-ldap/22.10.1
homepage: "https://www.asterisk.org/"

# 上游测试：Asterisk 的 in-tree 单元测试以 AST_TEST_DEFINE(...) 注册。
# 全树源码清点口径 = 707 个用例
#   grep -rh "^AST_TEST_DEFINE(" --include="*.c" . | wc -l   → 707
# 其中 tests/*.c = 633 个（95 个文件），其余 74 个分布在 res/ main/ funcs/
# bridges/ apps/ 等 25 个 .c 文件。入口 tests/CI/buildAsterisk.sh +
# tests/CI/runUnittests.sh（执行 `asterisk -rx "test execute all"`）。
# res_config_ldap 无专属上游用例（707 个注册中无一涉及 LDAP），且套件需完整核心
# （-o asterisk/*:with_test_framework=True）与运行中的 PBX —— 本模块包不构建
# 核心，故 707 个上游用例未执行（如实声明，非跳过）。逐文件清点见
# reports/upstream-tests.md。
upstream_check_command: "tests/CI/buildAsterisk.sh && tests/CI/runUnittests.sh"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_total: 707
upstream_test_total_counting: "源码清点口径：全树 *.c 行首 AST_TEST_DEFINE( 注册数"
upstream_module_specific_total: 0

upstream_tests:
  - file: "tests/test_*.c + 其余 25 个含注册的 .c"
    source: "https://codeload.github.com/asterisk/asterisk/tar.gz/refs/tags/22.10.1"
    description: >-
      Asterisk in-tree 单元测试框架用例，全树共 707 个 AST_TEST_DEFINE 注册
      （tests/test_*.c 95 个文件 633 个 + res/main/funcs/bridges/apps 等 25 个文件 74 个）；
      res_config_ldap 无专属用例（grep -ril ldap tests/ 仅命中 CI 构建脚本）。
      需完整核心（TEST_FRAMEWORK + MENUSELECT_TESTS）与运行中的 PBX 才能执行，
      本模块包（只构建 res_config_ldap.so）未运行。
    command: "./sbin/asterisk -rx \"test execute all\""

# test_package 消费者测试（R34 真实产物验证，不替代上游测试统计）
test_package_tests:
  - file: test_asterisk_ldap.py
    description: >-
      静态 ELF 校验（自实现解析器 elf_utils.py，不依赖 binutils）：AArch64 ET_DYN、
      DT_NEEDED 含 libldap.so.2/liblber.so.2、绑定 res_config_ldap 使用的 OpenLDAP
      API 8 个符号、绑定 Asterisk 模块 ABI（ast_module_register/unregister）、
      DT_INIT_ARRAY 非空、无 RPATH/RUNPATH 泄漏、OPENLDAP_2.200 ABI 版本
    command: "python3 test_asterisk_ldap.py <package_folder>"
  - file: ldap_module_load.c
    description: >-
      鸿蒙特有测试：由模块自身未定义符号表生成 Asterisk 核心 API 桩并以 -rdynamic
      链接，dlopen(RTLD_NOW) 加载打包模块，断言构造函数自注册恰好一次且
      struct ast_module_info 合法（name=res_config_ldap、description 非空、
      load/unload 存在）——即时绑定成功即证明 OHOS 加载器解析了全部依赖
    command: "./ldap_module_load <package_folder>/lib/asterisk/modules/res_config_ldap.so"

# 断言总数：13（8 静态 ELF 检查 + 5 动态加载检查）
assertion_count: 13
