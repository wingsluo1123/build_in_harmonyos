known_issues:
  - "issue 编号未在项目文件或会话上下文中找到，待补。"
  - "官方 CI #42701 已基于当前修复提交通过；#36868 的错误 126 根因是构建期生成的 menuselect ELF 未签名，chmod 不能替代签名。"
knowledge_gained:
  - "Asterisk 22.10.1 ODBC 支持优先 unixODBC；configure 通过 SQLConnect/sql.h 探测 UNIXODBC 后设置 GENERIC_ODBC。"
  - "Asterisk 22.10.1 has 724 upstream internal tests under tests/. They exercise the complete PBX test runner and are not represented by this module-only package's consumer probe."
  - "核心 ODBC 模块为 res_odbc_transaction、res_odbc、res_config_odbc、func_odbc、cdr_odbc、cdr_adaptive_odbc、cel_odbc。"
  - "Asterisk 源码 downloads.asterisk.org 的 22.10.1 tarball 路径返回 404；GitHub tag tarball 可下载并已校验 sha256。"
  - "unixodbc/2.3.12 已在 ohpcd 发布 OHOS armv8 Release shared 包，asterisk-odbc 可继续依赖它做后续构建验证。"
  - "OHOS build 里 Asterisk module entrypoints 可能只落在普通符号表，不一定出现在动态符号表；test_package 应以包内容验证为主。"
  - "OHOS device tool bundles may provide llvm-readobj and llvm-nm without llvm-readelf/readelf; consumer probes should locate tools relative to their executing Python and accept the equivalent SharedObject header output."
  - "官方 conan test 已可直接复用同一包缓存，作为交接前的最终消费验证。"
  - "官方 CI #37218 证明 /data/service/hnp/bin/ld 路径存在并不代表 GNU ld，可能仍会启动缺少 libxml2.so.16 的 SDK lld；配方改用 ld.lld 入口，并仅在构建环境前置设备 LLVM/用户工具库路径。"
  - "官方 CI #36868 在 chmod 755 后仍执行失败，证明 HMDFS 上构建期 ELF 需要 .codesign 签名；menuselect 生成后必须先 llvm-objcopy 移除旧签名段、binary-sign-tool self-sign，再恢复执行位。"
  - "签名工具输出到临时文件并以 os.replace 原子替换，可同时规避签名工具重置权限和原地改写留下半成品；最终模块沿用同一流程。"
