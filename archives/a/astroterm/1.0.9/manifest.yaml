package:
  name: astroterm
  version: "1.0.9"
  description: "A terminal-based star map written in C, displaying real-time positions of stars, planets, and constellations"
  homepage: "https://github.com/da-luce/astroterm"
  license:
    name: "MIT"
    url: "https://raw.githubusercontent.com/da-luce/astroterm/main/LICENSE"
    file: "MIT"
  tags:
    - category: "game"
      subcategory: "game"
  requirements:
    - "linux-headers >= 6.5"
    - "argtable3 >= 3.0"
    - "ncurses >= 6.0"
  source:
    url: "https://github.com/da-luce/astroterm/archive/refs/tags/v1.0.9.tar.gz"
    sha256: "d96d70c644b258ed0adc3a700e6af122659ecabf3eed60d7cfb6810b5068f3eb"
  build:
    kind: "meson"
    verify_script: ""
    
testing:
  # Upstream tests (N/A: astroterm upstream does not ship automated tests).
  upstream_tests:
    - name: "N/A"
  # test_package binary smoke tests.
  test_package_tests:
    - name: "astroterm --version"
      test_command: "astroterm --version"
      assertion_count: 1
    - name: "astroterm --help"
      test_command: "astroterm --help"
      assertion_count: 1
