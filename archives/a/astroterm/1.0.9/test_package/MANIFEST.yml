testing:
  # Upstream tests (N/A: astroterm upstream does not ship automated tests in
  # the source tarball).
  upstream_tests:
    - name: "N/A"
  # test_package binary smoke tests.
  test_package_tests:
    - name: "astroterm --version"
      test_command: "astroterm --version"
      assertion_count: 1
    - name: "astroterm --help"
      test_command: "astroterm --help"
      assertion_count: 1
