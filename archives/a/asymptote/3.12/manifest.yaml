software: asymptote
# 版本级 manifest 模板
# 文件位置: archives/a/asymptote/3.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.12"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-07-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 SourceForge 发布包)
  url: "https://sourceforge.net/projects/asymptote/files/3.12/asymptote-3.12.src.tgz/download"

  # 源码校验和
  sha256: "eaec1e97463ef213a393c388d466a73478b0818f9403c962b91240659c9b8f1b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--disable-ffmpeg"
    - "--disable-gsl"
    - "--disable-opengl"

  # 编译依赖列表 (格式: name/version)
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
# 本 Conan 配方为基础配方 (无内嵌补丁)
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "asymptote 为终端可执行工具 (asy), package_info.cpp_info.libs=[] (无可链接库)"
  - "OHOS 平台 config_options 删除 shared (强制静态可执行)"
  - "asymptote 为描述性矢量图形语言, 用于技术绘图"
  - "OHOS 适配需 --build=aarch64-unknown-linux-gnu, 详见 autotools 项目惯例"
  - "可选依赖 ffmpeg/gsl/opengl 在鸿蒙平台缺失, 通过 --disable-* 关闭"
