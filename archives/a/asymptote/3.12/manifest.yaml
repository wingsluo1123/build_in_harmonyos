software: asymptote
# 版本级 manifest 模板
# 文件位置: archives/a/asymptote/3.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.12"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-07-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 SourceForge 发布包)
  url: "https://sourceforge.net/projects/asymptote/files/3.12/asymptote-3.12.src.tgz/download"

  # 源码校验和
  sha256: "eaec1e97463ef213a393c388d466a73478b0818f9403c962b91240659c9b8f1b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--disable-ffmpeg"
    - "--disable-gc"
    - "--disable-gsl"
    - "--disable-gl"
    - "--disable-vulkan"
    - "--disable-lsp"

  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "001-config-status-readable-temp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "asymptote is a standalone executable (asy), so package_info.cpp_info.libs=[]"
  - "OHOS removes shared in config_options to keep the package executable-only"
  - "asymptote is a descriptive vector graphics language used for technical drawing"
  - "OHOS needs --build=aarch64-unknown-linux-gnu for autotools detection"
  - "Optional components ffmpeg/gc/gsl/gl/vulkan/lsp can be disabled with --disable-*"
  - "OHOS HMDFS configure temp directories need umask 022 so config.status can read them"
  - "asymptote must build in-source and use make pipe jobserver to avoid Makefile.in/FIFO issues"
