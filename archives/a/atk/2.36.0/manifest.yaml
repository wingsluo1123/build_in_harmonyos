software: atk
# 版本级 manifest
# 文件位置: archives/a/atk/2.36.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.36.0"
status: built
build_date: "2026-07-30"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/atk/2.36/atk-2.36.0.tar.xz"
  sha256: "fb76247e369402be23f1f5c65d38a9639c1164d934e40f6a9cf3c9e96b652788"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "--wrap-mode=nofallback"
    - "-Dintrospection=disabled"
    - "-Ddocs=false"
  dependencies:
    - glib/2.84.0
    - gobject/2.84.0
    - libintl
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-atk-intl-wrapper.c.patch"
  - "0002-atk-meson.build.patch"
  - "0003-meson.build.patch"

patch_classification:
  - file: 0001-atk-intl-wrapper.c.patch
    type: new-file
    platform_only: true
    reason: "glib 静态库引用 g_libintl_* 符号但 libintl.so 只导出 libintl_*，创建 wrapper 库映射符号 (E107)"
  - file: 0002-atk-meson.build.patch
    type: source-fix
    platform_only: true
    reason: "将 intl-wrapper.c 加入 atk 源文件列表"
  - file: 0003-meson.build.patch
    type: source-fix
    platform_only: true
    reason: "Meson host_machine.system() == 'linux' 不匹配 HarmonyOS，改为 in ['linux', 'harmonyos'] (E090)"

# ============================================================
# 测试信息
# ============================================================

test:
  upstream:
    count: 5
    command: "ninja -C builddir test"
    result: "5/5 passed (introspection disabled)"
  consumer:
    count: 1
    api_calls:
      - "atk_get_version()"
    result: "PASS"

# ============================================================
# 知识引用
# ============================================================

knowledge_used:
  - E090  # Meson host_system == 'linux' 不匹配 HarmonyOS
  - E107  # g_libintl_* 符号缺失，需 intl-wrapper

# ============================================================
# 备注
# ============================================================

notes:
  - "glib 2.84.0 已在制品仓发布 (resolve-deps glib ✅)"
  - "路径 B 申报：E090 + E107 均为通用问题已入知识图谱正式条目"
