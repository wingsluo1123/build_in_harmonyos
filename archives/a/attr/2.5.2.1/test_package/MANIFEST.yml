consumer_tests:
  command: Conan test_package on HarmonyOS device
  total: 6
  pass: 6
  fail: 0
  notrun: 0
  result: passed
  checks:
  - C consumer attr_set stores an xattr on a temporary file in the build folder
  - C consumer attr_get reads and verifies the value
  - package PATH setfattr writes a user xattr
  - package PATH getfattr reads the value
  - package PATH attr -s writes an xattr
  - package PATH attr -g reads the value
  package_tool_path: Resolved from the tested Conan package's package_folder/bin
  filesystem_boundary: All six xattr consumer checks passed; no raw xattr errno was generated.
privilege_boundary:
  root_probe_command: sudo -n true
  raw_output: open /dev/tty for write failed
  exit: 1
  root_suite_raw: 'Possible precedence issue with control flow operator (exit) at .../test/run line 150.\nFAIL test/root/getfattr.test (exit status: 159)'
  cause: Effective UID 0 was unavailable to the SSH device user, so upstream require_root terminated before the first root-only command; all 30 registered
    root cases are listed as not run.
upstream_tests_modified: false
