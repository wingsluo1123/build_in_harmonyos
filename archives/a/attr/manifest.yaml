software: attr
display: attr
description: Extended attribute utilities (getfattr, setfattr, attr) and the libattr C compatibility API
category: system
homepage: https://savannah.nongnu.org/projects/attr
license: GPL-2.0-or-later AND LGPL-2.1-or-later
license_components:
  libattr: LGPL-2.1-or-later
  getfattr: GPL-2.0-or-later
  setfattr: GPL-2.0-or-later
  attr: GPL-2.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
  - config.guess/config.sub recognize the HarmonyOS linux-ohos target triplet.
  - configure uses umask 022 for temporary directories because HMDFS UID mapping rejected config.status writes with upstream umask 077.
  - Exports static libattr with attr/attributes.h, attr/libattr.h, and attr/error_context.h.
  - All three installed tools, getfattr, setfattr, and attr, are declared in commands.json.
  - 'The device upstream suite registered 149 command checks: 87 pass, 32 fail with recorded output mismatches, and 30 root-only checks
    were not run; see the per-case report.'
  - The device Conan consumer passed 6/6 checks, including libattr attr_set/attr_get and all package CLI tools.
  common_dependencies: []
versions:
  2.5.2:
    status: pending
    conan_ref: attr/2.5.2
    note: Merged by !1539 without a green CI run; its only run failed at checkout-pr and the package is absent from the registry.
  2.5.2.1:
    status: built
    build_date: '2026-10-18'
    conan_ref: attr/2.5.2.1
