# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: audacious-plugins/4.5.1
homepage: "https://audacious-media-player.org/"

# Upstream test command (audacious-plugins has no make check test suite)
upstream_check_command: "make check"

# conanfile.py build() — upstream test not integrated (no test suite in source)
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs — audacious-plugins has no test suite
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.c
    description: "dlopen plugin loader test — verifies plugin .so files are valid shared objects"
    command: "./test_plugin_loader <plugin.so>"

# Test assertion count (approximate)
assertion_count: 3
