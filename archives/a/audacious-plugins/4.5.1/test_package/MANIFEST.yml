# test_package/MANIFEST.yml
# CI script (build_and_test.sh L0e) requires this file
package: audacious-plugins/4.5.1
homepage: "https://audacious-media-player.org/"

# audacious-plugins has no make check test suite
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream tests; staging verification replaces make check
upstream_tests: []

# Consumer-side test: verify .so plugin files exist
test_package_tests:
  - file: test.c
    description: "Verify plugin .so files are present in the package"
    command: "./test_audacious-plugins"

assertion_count: 2
