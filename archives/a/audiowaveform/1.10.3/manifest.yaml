software: audiowaveform
version: "1.10.3"
status: built
build_date: "2026-08-05"

source:
  url: "https://github.com/bbc/audiowaveform/archive/refs/tags/1.10.3.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DENABLE_TESTS=0"
  dependencies:
    - "libmad/0.16.4"
    - "libid3tag/0.16.3"
    - "libgd/2.3.3"
    - "libsndfile/1.2.2"
    - "boost/1.91.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "CMake 4.x requires CMAKE_POLICY_VERSION_MINIMUM=3.5 for cmake_minimum_required(VERSION 2.8.7)"
  - "Boost 1.91.0 package from ohpcd only includes filesystem, iostreams, program_options, regex, thread - format headers must be added"
  - "Custom FindXXX.cmake modules need cache variables (LIBGD_INCLUDE_DIRS, LIBGD_LIBRARIES, etc.) to bypass find_path/find_library"
  - "libid3tag conanfile ZLIB::ZLIB target alignment depends on zlib version (1.3.1.1 generates ZLIB::ZLIB, 1.3.1.1.1 generates zlib::zlib)"
  - "libogg version conflict between libvorbis (1.3.6) and flac (1.3.5) resolved with [replace_requires] override profile"
  - "zlib version conflict between libgd (1.3.1.1) and libid3tag (1.3.1) resolved with [replace_requires] override profile"

conan:
  recipe_hash: "480d7465a719abcfdceab46c20939626"
  package_id: "bbfe205442f0c4de45a5824302e03a0d2ed37a34"
  build_command: "conan create archives/a/audiowaveform/1.10.3/conanfile.py -pr:h=ohos-aarch64-override -pr:b=default --build=missing"
