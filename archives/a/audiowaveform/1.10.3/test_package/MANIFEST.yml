# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: audiowaveform/1.10.3
homepage: https://github.com/bbc/audiowaveform

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试使用 googletest (submodule), 但 ENABLE_TESTS=0 在 Conan 构建中禁用
# 因为 googletest submodule 在源码 tarball 中不可用
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "生成WAV测试文件并运行audiowaveform生成波形JSON和PNG输出"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
