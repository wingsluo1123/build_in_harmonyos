# test_package/MANIFEST.yml
# CI L0e check requires this file to exist.
package: audiowaveform/1.10.3
homepage: "https://github.com/bbc/audiowaveform"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/WaveformBufferTest.cpp
    source: audiowaveform-1.10.3/test/WaveformBufferTest.cpp
    description: "Unit tests for WaveformBuffer"
    command: "./audiowaveform_tests"
  - file: test/OptionsTest.cpp
    source: audiowaveform-1.10.3/test/OptionsTest.cpp
    description: "Unit tests for command-line option parsing"
    command: "./audiowaveform_tests"

test_package_tests:
  - file: test.c
    description: "Placeholder build target; actual test runs audiowaveform --help via conanfile.py test()"
    command: "audiowaveform --help"

assertion_count: 15
