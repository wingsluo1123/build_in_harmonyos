software: audiowaveform
display: "audiowaveform"
description: "Generate waveform images and JSON data from audio files"
category: multimedia
homepage: "https://github.com/bbc/audiowaveform"
license: GPL-3.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake build with custom FindXXX.cmake modules for LibGD, LibSndFile, LibMad, LibId3Tag"
    - "Cache variables set for custom find modules to locate conan-managed dependencies"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5 for CMake 4.x compatibility"
    - "ENABLE_TESTS=0 to skip googletest submodule"
    - "Boost format headers added to package (boost 1.91.0 ohpcd package only includes 5 specific libraries)"
  common_dependencies:
    - libmad
    - libid3tag
    - libgd
    - libsndfile
    - boost

versions:
  "1.10.3":
    status: built
    build_date: "2026-08-05"
