# 版本级 manifest — autofdo 0.19（AutoFDO profile 工具集）
version: "0.19"
software: "autofdo"

# 编译状态：conan create 通过后写 built；conan-verify 通过后由流程更新。
status: built
build_date: "2026-10-16"
build_system: autotools

source:
  url: "https://github.com/google/autofdo/archive/refs/tags/0.19.tar.gz"
  sha256: "2ab3a16a8966b6e9a877fddb15ee39e627646fcf8d0df17c19de013da36c27d0"
  tar_format: tar.gz

# 上游 tag tarball 不含子模块内容（third_party/{protobuf,perf_data_converter} 为空），
# 额外源码见 conandata.yml 的 perf_data_converter 源（E150 manual-download）。
additional_sources:
  - name: perf_data_converter
    url: "https://github.com/google/perf_data_converter/archive/d9ef70b46e63ebaec6d2d296aa178e332c6e5f58.tar.gz"
    sha256: "99f20f50bb07d9cb5ff4d16899583d71abfac8b28ec7cb9e2900776f9c41a953"
    pinned_commit: "d9ef70b46e63ebaec6d2d296aa178e332c6e5f58"
    placement: "third_party/perf_data_converter"

build:
  system: autotools
  configure_options:
    - "--with-llvm=<平台 SDK llvm-config (LLVM 15.0.4)>"
    - "make -j1 PROTOC=<conan protobuf protoc> PROTOBUF_DEP=  # LIBELF 保留 Makefile 默认 -lelf"
  dependencies:
    - protobuf/3.17.3
    - openssl/3.5.6
    - libelf/0.8.13.1
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-base-port.h.patch（OHOS/musl 的 <byteswap.h> 用宏提供 bswap_16/32/64，base/port.h 把 __OHOS__ 并入 include <byteswap.h> 分支，避免 static inline bswap_16 与宏冲突）"
  - "patches/0002-llvm_profile_writer.cc.patch（LLVM 15 SampleProf API：SampleProfileMap 以 SampleContext 为键、FunctionSamplesMap 以 std::string 为键；LLVM_VERSION_MAJOR >= 15 守卫）"
  - "patches/0003-llvm_profile_writer.h.patch（同上的头文件侧：AutoFDOProfileMap 别名统一 ConvertProfiles/GetProfiles/profiles_）"
  - "patches/0004-m4-ax_llvm.m4.patch（OHOS SDK LLVM 只有单一 libLLVM-<major>.so，shared 分支改链整库；并避免探测失败污染 LIBS）"
  - "patches/0005-profile_creator.cc.patch（OHOS/musl 无 GNU basename，__OHOS__ 走等价实现）"
  - "patches/0006-sample_reader.cc.patch（同上，sample_reader.cc 的 MatchBinary）"
  - "patches/0007-symbolize-elf_reader.cc.patch（OHOS/musl 不定义 __WORDSIZE，__OHOS__ 下取 Elf64）"
  - "patches/0008-third_party-perf_data_converter-src-quipper-dso.cc.patch（Riepe libelf 无 ELF_C_READ_MMAP；0.8.13.1 实现但未声明 gelf_getnote，__OHOS__ 下补别名与声明）"

knowledge_gained:
  - "GitHub release tarball 不含 git 子模块内容（E150）；autofdo 0.19 的 third_party/{protobuf,perf_data_converter} 为空目录，需单独下载子模块源码；且该子模块源码（quipper）本身需要额外补丁，可用 refresh-patch 的源树模型把子模块文件同时放入 .orig/.work 后按 edited 生成"
  - "本机无 automake/libtool，无法在树内 autoreconf 生成 bundled protobuf 的 configure；改用 Conan protobuf/3.17.3 的 protoc+libprotobuf，并通过 make 变量覆盖（PROTOC/PROTOBUF_DEP）绕过树内子构建，从而不改 Makefile.am（改 .am 需 automake 重生成 Makefile.in）"
  - "ohpcd 的 llvm/15.0.4 二进制包在服务器端损坏（缺 conan_package.t），不能作为 requires；create_llvm_prof 改用平台 SDK 自带 llvm-config(15.0.4)"
  - "第三方 bundled 子模块 quipper（perf_data_converter）真实依赖 openssl MD5()（<openssl/md5.h>）与 libelf（<libelf.h>/<gelf.h> 的 elf_*/gelf_*，dso.cc）：即使上游 configure.ac 的 AC_CHECK_LIB 看似可选探测，也必须显式 requires openssl + libelf，否则编译期 fatal error（openssl/md5.h file not found / libelf.h not found）与链接期缺 -lelf/-lcrypto"
  - "libelf 必须用本仓 OHOS 移植版 libelf/0.8.13.1（不是 0.8.13）：0.8.13 的头经 elf_repl.h 自带 Elf32_/Elf64_ typedef，与 OHOS SDK <elf.h> 冲突（typedef redefinition ... struct Elf32_Ehdr）；0.8.13.1 让 sys_elf.h 用系统 <elf.h> 并补齐 GElf_Nhdr/GElf_Versym 与 gelf_getnote"
  - "OHOS/musl 也有 <byteswap.h> 宏（bswap_16/32/64）；autofdo 自带 base/port.h 仅在 __GLIBC__/__CYGWIN__ 下 include 它，OHOS 落入 #else 自定 static inline bswap_16 与宏冲突（redefinition of __bswap_16），需把 __OHOS__ 并入该 include 分支"
  - "OHOS/musl 不定义 glibc 专有的 __WORDSIZE；上游按 #if __WORDSIZE == 32/64 判字长的代码会落入 #else 触发 #error（Invalid word size），需补 __OHOS__ 分支"
  - "LLVM 15 的 SampleProf API 与 LLVM 7 不兼容：SampleProfileMap 变为 unordered_map<SampleContext, FunctionSamples>，FunctionSamplesMap 以 std::string 为键，函数键构造需 SampleContext(name)/CalleeName.str()；旧代码按 StringMap<StringRef> 写会编译失败，用 LLVM_VERSION_MAJOR >= 15 守卫适配（本仓 castxml 亦用该守卫）"
  - "bundled gflags 的 --help 走 gflags_reporting.cc HandleCommandLineHelpFlags()：--help 打印用法后 exit(1)，--version 打印程序名后 exit(0)；且帮助里 flag 以**单破折号**列出（    -binary (...)），消费者/烟测断言的 needle 必须用单破折号，退出码不能一律期望 0"

