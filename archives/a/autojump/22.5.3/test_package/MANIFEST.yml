# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: autojump/22.5.3
homepage: "https://github.com/wting/autojump"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "python3 -m pytest tests/unit/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/unit/"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/unit/autojump_match_test.py
    source: autojump-22.5.3/tests/unit/autojump_match_test.py
    description: "Match logic unit tests (14 tests: anywhere + consecutive)"
    command: "python3 -m pytest tests/unit/autojump_match_test.py"
  - file: tests/unit/autojump_utils_test.py
    source: autojump-22.5.3/tests/unit/autojump_utils_test.py
    description: "Utility function unit tests (18 tests: encoding, sanitization, matching)"
    command: "python3 -m pytest tests/unit/autojump_utils_test.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Execute autojump --version to verify installed binary"
    command: "autojump --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 32
