software: "autotrace"
version: "0.31.10"
status: built
build_date: "2026-07-18"
build_system: custom

source:
  url: "https://github.com/autotrace/autotrace/archive/refs/tags/0.31.10.tar.gz"
  sha256: "14627f93bb02fe14eeda0163434a7cb9b1f316c0f1727f0bdf6323a831ffe80d"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "direct compile upstream C sources"
    - "enable libpng for the native PNG input backend"
    - "disable optional GraphicsMagick/ImageMagick, libming, and pstoedit backends"
    - "build static libautotrace.a and autotrace CLI"
  dependencies:
    - glib/2.84.0
    - libpng/1.6.58
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-fix-bmp-mask-width.patch"
  - "patches/0002-support-native-pnm-stdin.patch"

knowledge_gained:
  - "autotrace tag archives do not include a generated configure script."
  - "PNG input remains enabled through libpng while other optional image backends are disabled."
  - "The native PNM reader can consume standard input when the input filename is '-'."
  - "NLS/gettext bootstrap is not required when building directly with ENABLE_NLS disabled."
