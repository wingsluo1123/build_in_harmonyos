package: autotrace/0.31.10
homepage: "https://github.com/autotrace/autotrace"

upstream_check_command: "tests/runtests.sh"
upstream_test_in_build: true
upstream_test_command: "AUTOTRACE=<built-autotrace-bin> sh tests/runtests.sh"
upstream_tests:
  - file: tests/runtests.sh
    description: "Run all 10 upstream github-* image-conversion regression scenarios."

test_package_tests:
  - file: test_autotrace.py
    description: "Run 17 checks for package layout, pkg-config metadata, linked output, public C API behavior, CLI version, real PNG-to-SVG conversion, and missing-input failure behavior."
    command: "python test_autotrace.py <package-folder> <c-compiler> <run-binary-flag>"

assertion_count: 17
