software: "autotrace"
version: "homebrew"
status: built
build_date: "2026-07-18"
build_system: autotools

source:
  url: "https://github.com/autotrace/autotrace/archive/refs/tags/0.31.10.tar.gz"
  sha256: "14627f93bb02fe14eeda0163434a7cb9b1f316c0f1727f0bdf6323a831ffe80d"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "./autogen.sh"
    - "--without-magick"
    - "--without-pstoedit"
    - "--without-png"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - glib/2.88.0
    - gettext/0.22.5
    - intltool/0.51.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "autotrace tag archives do not include a generated configure script."
  - "Optional image backends can be disabled for a core library and CLI build."
