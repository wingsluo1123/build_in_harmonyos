software: avro-c
version: "1.12.0"
status: built
build_date: "2026-08-09"
build_system: cmake

source:
  url: "https://archive.apache.org/dist/avro/avro-1.12.0/c/avro-c-1.12.0.tar.gz"
  sha256: "74333d431079c35d770cef6996cb4de04058d19e81bd0b9a363bcfd38575037f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "CMAKE_BUILD_TYPE=Release"
    - "CMAKE_EXE_LINKER_FLAGS=-lc++"
  dependencies:
    - jansson/2.15.1
    - zlib/1.3.1
    - snappy/1.1.10
    - xz/5.6.2
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-src-CMakeLists.txt.patch
  - 0002-version.sh.patch

knowledge_gained:
  - "OpenHarmony bash 位于非标准路径，需使用 #!/usr/bin/env bash"
  - "CMake 在 HarmonyOS 上可能无法正确获取 SOVERSION，需设置默认值"
  - "snappy 是 C++ 库，链接到 C 项目需添加 -lc++ 链接参数"
  - "使用 CMakeDeps + PkgConfigDeps 生成器解决 Conan 依赖查找"
  - "所有 Codec 已启用: deflate (zlib), snappy, lzma (xz/liblzma)"
