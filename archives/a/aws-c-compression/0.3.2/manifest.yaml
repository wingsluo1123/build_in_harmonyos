version: "0.3.2"
software: "aws-c-compression"
status: built
build_date: "2026-08-05"
build_system: cmake

source:
  url: "https://github.com/awslabs/aws-c-compression/archive/refs/tags/v0.3.2.tar.gz"
  sha256: "f93f5a5d8b3fee3a6d97b14ba279efacd4d4016ef9cc7dc4be7d43519ecfbe93"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common/0.12.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "标准 CMake 构建，无需补丁"
  - "使用 CMakeDeps 设置 cmake_target_name 为 AWS::aws-c-common"
  - "CMAKE_MODULE_PATH 需指向 aws-c-common modules 目录"
