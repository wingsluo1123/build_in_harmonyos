# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aws-c-compression/0.3.2
homepage: "https://github.com/awslabs/aws-c-compression"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/compression_test.c
    source: aws-c-compression-0.3.2/tests/compression_test.c
    description: "aws-c-compression unit tests (huffman coding, compression)"
    command: "./compression_test_runner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 aws-c-compression 库符号链接和初始化/清理"
    command: "./test_aws-c-compression"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
