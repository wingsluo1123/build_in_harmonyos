version: "0.10.14"
status: built
build_date: "2026-08-05"

source:
  url: "https://github.com/awslabs/aws-c-http/archive/refs/tags/v0.10.14.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common/0.12.6
    - aws-c-io/0.26.3
    - aws-c-compression/0.3.2
    - aws-c-cal/0.9.13
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "aws_use_package() calls find_package() and creates AWS:: target"
  - "CMakeDeps需要设置cmake_target_name为AWS::前缀"
  - "aws-c-cal的include dirs在CMakeDeps中不自动传播，需手动添加-I标志"
  - "aws_http_library_init需要非NULL的allocator参数"
