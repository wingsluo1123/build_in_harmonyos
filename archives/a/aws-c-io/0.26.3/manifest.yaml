version: "0.26.3"
software: "aws-c-io"
status: built
build_date: "2026-08-05"
build_system: cmake

source:
  url: "https://github.com/awslabs/aws-c-io/archive/refs/tags/v0.26.3.tar.gz"
  sha256: "521fd0848fca661130bbb7278a414d7a38bdcb9bc8ffa89f6660d84e5838a303"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBYO_CRYPTO=ON"
  dependencies:
    - aws-c-common/0.12.6
    - aws-c-cal/0.9.13
    - aws-c-compression/0.3.2
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-add-harmonyos-platform-support.patch: 添加 HarmonyOS 到 Linux 平台分支，启用 epoll 事件循环"

knowledge_gained:
  - "BYO_CRYPTO=ON 可禁用 s2n TLS 依赖"
  - "CMakeLists.txt 中 CMAKE_SYSTEM_NAME 为 HarmonyOS 时不匹配任何平台分支，需要补丁添加 HarmonyOS 到 Linux 分支"
  - "HarmonyOS 使用 Linux 内核，epoll 事件循环可用"
