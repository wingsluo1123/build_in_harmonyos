software: aws-c-io
version: "0.26.3"
status: built
build_date: "2026-08-05"
build_system: cmake

source:
  url: "https://github.com/awslabs/aws-c-io/archive/refs/tags/v0.26.3.tar.gz"
  sha256: "521fd0848fca661130bbb7278a414d7a38bdcb9bc8ffa89f6660d84e5838a303"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBYO_CRYPTO=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common/0.12.6
    - aws-c-cal/0.9.13
    - aws-lc/5.4.0
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-CMakeLists.txt.patch"
    type: portability
    description: "Add HarmonyOS to Linux platform branch for proper event loop and source file selection"

knowledge_gained:
  - "BYO_CRYPTO=ON disables s2n TLS dependency (s2n not available on HarmonyOS yet)"
  - "HarmonyOS needs to be added to CMake platform branch for Linux source files and EPOLL event loop"
  - "CMakeDeps needed for proper cmake config file generation when dependencies use installed cmake targets"
