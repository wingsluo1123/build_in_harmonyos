# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: aws-c-io/0.26.3
homepage: "https://github.com/awslabs/aws-c-io"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/io_test.c
    source: aws-c-io-0.26.3/tests/io_test.c
    description: "aws-c-io unit tests"
    command: "./aws-c-io-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 初始化和清理 aws-c-io 库"
    command: "./test_aws-c-io"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
