# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.27.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.27.5"
software: "aws-c-io"
status: built
build_date: "2026-07-27"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/awslabs/aws-c-io/archive/refs/tags/v0.27.5.tar.gz"
  sha256: "aa132d5a728f18ab8e0a6ea96d3d2f7e66bc8d3fe029d9ed1b05c06aa0c5b900"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DBYO_CRYPTO=ON"
  dependencies:
    - aws-c-common/0.14.3
    - aws-c-cal/0.9.15
    - aws-lc/5.4.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-CMakeLists-add-harmonyos-platform.patch"
  - "0002-CMakeLists-add-threads-before-cal.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "BYO_CRYPTO=ON disables s2n-tls TLS backend, basic IO still available"
  - "Uses CMAKE_PREFIX_PATH instead of CMakeDeps for AWS CMake module compatibility"
  - "find_package(Threads) must be called before find_package(aws-c-cal) for crypto-config.cmake"
  - "HarmonyOS platform patch needed for epoll event loop detection"
