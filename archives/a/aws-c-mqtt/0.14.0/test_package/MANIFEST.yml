# test_package/MANIFEST.yml
package: aws-c-mqtt/0.14.0
homepage: "https://github.com/awslabs/aws-c-mqtt"

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/
    source: aws-c-mqtt-0.14.0/tests/
    description: "aws-c-mqtt upstream unit tests (disabled in package build)"
    command: "ctest"

test_package_tests:
  - file: test.c
    description: "Verify aws-c-mqtt library loads, library_init succeeds, and topic validation API works"
    command: "./test_aws-c-mqtt"

assertion_count: 4
