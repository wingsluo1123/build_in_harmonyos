version: "0.2.10"
status: built
software: aws-checksums
build_date: "2026-08-05"
build_system: cmake

source:
  url: "https://github.com/awslabs/aws-checksums/archive/refs/tags/v0.2.10.tar.gz"
  tar_format: tar.gz

build:
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-alias-target.patch"

knowledge_gained:
  - "AWS CMake modules need CMAKE_MODULE_PATH set to aws-c-common package's lib/cmake/aws-c-common/modules/"
  - "AWS:: namespace target alias needed for conan CMakeDeps compatibility"
  - "aws-c-common recipe doesn't expose include dirs via cpp_info, test_package needs manual include path"
