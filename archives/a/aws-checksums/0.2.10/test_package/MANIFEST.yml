test_source: test_main.c
test_type: conan_test_package
upstream_tests:
  - name: crc_test
    file: tests/crc_test.c
  - name: crc64_test
    file: tests/crc64_test.c
  - name: xxhash_test
    file: tests/xxhash_test.c
test_description: |
  Verifies aws-checksums CRC32/CRC32C/CRC64 API by computing checksums
  of "hello world" and verifying non-zero results. Depends on aws-c-common
  for allocator initialization (aws_default_allocator, aws_checksums_library_init).
