# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aws-checksums/0.2.10
homepage: "https://github.com/awslabs/aws-checksums"

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/
    source: aws-checksums-0.2.10/tests/
    description: "aws-checksums upstream unit tests (disabled in package build)"
    command: "ctest"

test_package_tests:
  - file: test.c
    description: "Verify aws-checksums CRC32 API: init library, compute CRC32, verify non-zero result"
    command: "./test_aws-checksums"

assertion_count: 3
