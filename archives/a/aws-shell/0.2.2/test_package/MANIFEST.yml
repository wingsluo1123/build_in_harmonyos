# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aws-shell/0.2.2
homepage: "https://github.com/awslabs/aws-shell"

# 上游测试命令 (aws-shell is a Python package; tests via pytest)
upstream_check_command: "python3 -m pytest tests/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/unit/test_app.py
    source: aws-shell-0.2.2/tests/unit/test_app.py
    description: "Unit test for awsshell app"
    command: "python3 -m pytest tests/unit/test_app.py"
  - file: tests/unit/test_autocomplete.py
    source: aws-shell-0.2.2/tests/unit/test_autocomplete.py
    description: "Unit test for autocomplete"
    command: "python3 -m pytest tests/unit/test_autocomplete.py"
  - file: tests/unit/test_fuzzy.py
    source: aws-shell-0.2.2/tests/unit/test_fuzzy.py
    description: "Unit test for fuzzy search"
    command: "python3 -m pytest tests/unit/test_fuzzy.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Import awsshell module and verify entry point exists"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 50
