# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go GOROOT for harmonybrew-installed Go is at Cellar/go/<ver>/libexec, not Cellar root"
  - "config.ConfigDir() returns OHOS sandbox path /data/storage/el2/base/haps/entry/files/aws-sso which doesn't exist; fix by setting XDG_CONFIG_HOME in TestMain"
  - "OHOS SELinux does not enforce file/directory permission chmod (E046); tests relying on permission restrictions need t.Skip()"
  - "OHOS lacks getent command; loginshell.Shell() fails; fix by setting SHELL env var"
  - "ldflags -X main.Version works correctly for aws-sso-cli (unlike saml2aws which had Go build cache issue)"
  - "Go 1.26.4 installable via harmonybrew brew install go"

