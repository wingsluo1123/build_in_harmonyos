# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aztfexport/0.19.0
homepage: "https://github.com/Azure/aztfexport"

# 上游测试命令 (Go 项目使用 go test)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: "*_test.go"
    source: aztfexport-0.19.0/*_test.go
    description: "Go unit tests across multiple packages"
    command: "go test ./..."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify aztfexport binary runs --version"
    command: "aztfexport --version"

# 测试断言总数 (go test 7 packages ok)
assertion_count: 50
