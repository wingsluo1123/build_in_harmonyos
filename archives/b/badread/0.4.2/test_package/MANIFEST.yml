# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: badread/0.4.2
homepage: "https://github.com/rrwick/Badread"

# 纯 Python 包，无 C/C++ 编译，无 Makefile/CMake
upstream_check_command: "python3 -m pytest"

# conanfile.py build() 中未集成上游测试（依赖 numpy/scipy/matplotlib/edlib，由宿主环境提供）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试由 pytest 驱动，测试源位于 Badread/tests/
upstream_tests:
  - file: tests/test_badread.py
    source: Badread-0.4.2/tests/test_badread.py
    description: "pytest tests for badread (simulator, error model, qscore model, plotting)"
    command: "python3 -m pytest tests/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py (inline test)
    description: "消费者验证: bin/badread --version 确认包布局和 wrapper 路径正确"
    command: "bin/badread --version (期待输出 Badread v0.4.2)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
