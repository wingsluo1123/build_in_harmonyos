# test_package/MANIFEST.yml
# 声明上游测试来源（CI L0e 强制要求）
# badread 是纯 Python 命令行工具，无 C/C++ 编译
# 上游测试在 GitHub Actions 中运行 pytest，但本地依赖复杂（需 edlib/numpy/scipy/matplotlib）
# test_package 验证方式：调用 badread --version 检查包可执行

upstream_test:
  source: "https://github.com/rrwick/Badread"
  type: "cli_app"
  test_type: "explicit"
  verification: "badread --version"
  dependencies:
    - edlib
    - numpy
    - scipy
    - matplotlib
