# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bandwhich/0.23.0
homepage: "https://github.com/imsnif/bandwhich"

# 上游测试命令 (cargo test)
upstream_check_command: "cargo test --release"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cargo test --release"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/main.rs
    source: bandwhich-0.23.0/src/main.rs
    description: "Unit tests for bandwidth formatting, raw mode output, DNS resolution"
    command: "cargo test --release"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: bandwhich --version"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
