patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "baresip uses CMake build system with modular architecture (modules/ directory)"
  - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON (set by Conan CMakeToolchain) causes find_package(RE) to use re-config.cmake instead of FindRE.cmake"
  - "FindRE.cmake sets RE_INCLUDE_DIRS (uppercase) but Conan CMakeDeps sets re_INCLUDE_DIRS (lowercase) — patch needed to use lowercase variables"
  - "re package headers at include/re/ require include path to be include/re for #include <re.h> style (baresip uses this style)"
  - "re_INCLUDE_DIRS_RELEASE is empty when re is transitive dependency — test_package must declare re as direct dependency"
  - "baresip_init() fails on OHOS due to DNS init (EINVAL 22) — smoke test should avoid full network init"
  - "Modules needing ALSA/PulseAudio/FFmpeg/etc auto-skip via find_package()+return() in their CMakeLists.txt"

