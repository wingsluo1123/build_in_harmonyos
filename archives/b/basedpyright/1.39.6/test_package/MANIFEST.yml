# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: basedpyright/1.39.6
homepage: "https://github.com/DetachHead/basedpyright"

# basedpyright is an npm package (pre-built JavaScript), no make check
upstream_check_command: "npm test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# basedpyright 上游无可用测试入口 (npm 包，非 C/C++ 项目)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 验证 basedpyright 可执行文件可正常调用"
    command: "basedpyright --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
