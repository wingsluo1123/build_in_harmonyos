software: basedpyright
# 软件级 manifest 模板
# 文件位置: archives/b/basedpyright/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

name: basedpyright
description: "基于 pyright 的 Python 类型检查器"
category: development-tools  # 开发工具/类型检查器
license: MIT

homepage: https://github.com/DetachHead/basedpyright
repository: https://github.com/DetachHead/basedpyright

# ============================================================
# 版本索引
# ============================================================

versions:
  1.39.6:
    status: built
    build_date: "2026-08-05"
    notes: "Conan 配方打包 npm 预构建 JS，bin wrappers 调用 node"

# ============================================================
# 软件特性
# ============================================================

build_type: npm  # 特殊构建类型：Node.js 包
dependencies:
  required:
    - nodejs >= 18.0.0
  optional: []

special_notes:
  - "basedpyright 是 Node.js 包，使用 Conan custom recipe 打包预构建 JS"
  - "Bin wrappers 使用相对路径解析调用 node"
  - "依赖系统预装 nodejs，无需编译 nodejs-wheel-binaries"
