software: bashdb
display: "GNU Bash Debugger"
description: "Bash 脚本调试器，提供断点、单步执行、变量检查等 gdb 风格调试功能"
category: development
homepage: "https://bashdb.sourceforge.net/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 脚本仅支持 bash 5.0/5.1/5.2，需补丁添加 5.3 支持"
    - "使用 --with-bash 选项指定 bash 5.3 可执行文件路径"
    - "纯 bash 脚本包，无需编译，仅运行 configure + make install"
    - "运行时依赖 bash/5.3"
  common_dependencies:
    - bash

versions:
  "5.2-1.2.0":
    status: built
    build_date: "2026-07-22"
