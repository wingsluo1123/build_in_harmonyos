# test_package/MANIFEST.yml
package: basisu/v2_1_0r
homepage: "https://github.com/BinomialLLC/basis_universal"

upstream_check_command: "basisu -test -test_dir res/test_files"
upstream_tests_exist: true
upstream_test_audit: >
  basisu v2_1_0r's upstream test suite is `basisu -test` (== `-test_ldr`),
  defined in basisu_tool.cpp's test_mode_ldr() and g_etc1s_uastc_4x4_ldr_test_files[].
  It runs ETC1S level 1 / ETC1S level 128 / UASTC LDR 4x4 encoding for each of the
  28 PNGs in test_files/ (kodim01-24, black_1x1, white_1x1, wikipedia, alpha0),
  validating compressed file size (+/-4.5%) and PSNR (+/-0.3). Exit code 0=pass.

upstream_test_in_build: false
upstream_test_command: "basisu -test -test_dir res/test_files"

upstream_tests:
  - file: basisu (-test / -test_ldr mode)
    source: basisu_tool.cpp:test_mode_ldr + g_etc1s_uastc_4x4_ldr_test_files
    description: "Upstream automated LDR ETC1S/UASTC encoding and transcoding test, 28 test cases"
    command: "basisu -test -test_dir res/test_files"

test_package_tests:
  - file: basisu_test.cpp
    description: "Consumer test: verify basisu_transcoder API linking and basic functionality"
    command: "ctest (test_basisu)"
  - file: conanfile.py (inline CLI test)
    description: "Consumer test: basisu --version verifies CLI binary is executable"
    command: "basisu --version"

upstream_test_case_count: 28
assertion_count: 173
