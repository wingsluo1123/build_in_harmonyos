# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "fd_loader.c"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "bat (sharkdp) 必须使用 fd_loader 而非 elfldr：--version 可用 elfldr 但文件 I/O 段错误，因 TLS 初始化不完整"
  - "elfldr 不设置 AT_PHENT 导致 musl TLS 初始化不完整，简单命令可用但复杂操作（文件读取、语法高亮）崩溃"
  - "sharkdp 系列工具（bat、fd）均需要 fd_loader，应默认使用不做 elfldr 尝试"
