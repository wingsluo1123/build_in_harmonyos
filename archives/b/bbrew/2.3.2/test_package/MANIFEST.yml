# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# bbrew 是 Go 命令行应用（Bold Brew TUI for Homebrew）。
# 上游无 `make check` 测试套件；Go 应用通过 `go test ./...` 运行单元测试，
# 但这些测试依赖 Homebrew 环境与 TTY，无法在 CI 交叉编译产物上运行。
# 因此 test_package 采用 L2 冒烟测试：运行 `bbrew --version` 验证二进制可用性。

package: bbrew/2.3.2
homepage: "https://github.com/Valkyrie00/bold-brew"

# 上游测试命令分析
upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: "go test ./..."

# 上游实际运行的测试程序（Go 单元测试，CI 阶段在 runner 上执行）
upstream_tests:
  - file: internal/services/app_service_test.go
    source: bbrew-2.3.2/internal/services/app_service_test.go
    description: "AppService 启动与数据加载单元测试"
    command: "go test ./internal/services/"

# test_package 中自带的测试（消费者视角验证）
# R34: 调用被测包的实际二进制（bbrew --version），非空壳 stub
test_package_tests:
  - file: conanfile.py
    description: "运行 bbrew --version，验证二进制可执行且版本号正确"
    command: "bbrew --version"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
