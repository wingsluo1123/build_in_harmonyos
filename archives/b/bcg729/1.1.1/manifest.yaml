patches_applied: []

knowledge_gained:
  - "Upstream 1.1.1 ships a clean native CMakeLists.txt (project bcg729 1.1.1); Conan CMakeToolchain works directly — zero patches."
  - "ENABLE_STRICT=YES upstream adds -Werror -Wextra; harmless warnings on the OHOS clang toolchain become hard failures — disable it, keep real compile errors visible."
  - "Upstream test vectors live in an external archive bcg729-patterns-v1.1.0.zip (33 MB, linphone.org/bc-downloads); testCampaign harness compares CSV outputs with hard diff (defaultMaxDiff all 0)."
  - "The v1.1.0 vector archive was generated by 1.0.x code: replaying it against upstream 1.0.4 passes 173/173, while 1.1.0+ (SATURATE/SSHL overflow fix in LP2LSPConversion, CHANGELOG 'overflow in encoder') produces LSB-level LSP differences that propagate through LSPQuantization into encoder parameters — 158/173 pass on 1.1.1, mismatches are upstream-intended behavior change, not an adaptation defect."
  - "Upstream 1.1.1 registers 27 test executables; 21 blocs have pattern vectors (173 .in cases), g729FixedPointMathTest is self-contained (passes), and encoderVAD/computeNoiseExcitation/CNGRFC3389decoder/decoderMultiChannel/encoderMultiChannel have no vectors in the public zip."

verified:
  device: "HarmonyOS PC aarch64 (ohos profile clang 15)"
  date: "2026-09-23"
