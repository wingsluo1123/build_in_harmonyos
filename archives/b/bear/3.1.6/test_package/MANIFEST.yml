# test_package/MANIFEST.yml
# CI L0e requires this file to exist

package: bear/3.1.6
homepage: "https://github.com/rizsotto/Bear"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test.c
    source: bear-3.1.6/test_package/test.c
    description: "Consumer test - verify bear binary runs"
    command: "bear --version"

test_package_tests:
  - file: test.c
    description: "Consumer test"
    command: "./test_bear"

assertion_count: 1
