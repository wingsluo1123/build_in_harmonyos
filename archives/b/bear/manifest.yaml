software: bear
display: "Bear"
description: "编译命令捕获工具，生成 compile_commands.json 用于 IDE 集成"
category: build-tool
homepage: "https://github.com/rizsotto/Bear"
license: GPL-3.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake superbuild with ExternalProject_Add for all dependencies"
    - "gRPC v1.49.2 submodules fetched via separate script"
    - "boringssl patched for HarmonyOS processor/UNIX detection"
    - "OPENSSL_NO_ASM=ON to avoid missing assembly symbols"
    - "find_package(gRPC CONFIG) instead of pkg_check_modules"
  common_dependencies: []

versions:
  "3.1.6":
    status: built
    build_date: "2026-08-05"
