software: "bearssl"
version: "0.6"
status: published
build_date: "2026-08-05"
build_system: makefile

source:
  url: "https://www.bearssl.org/bearssl-0.6.tar.gz"
  tar_format: tar.gz

build:
  cc: clang

patches_applied: []

knowledge_gained:
  - "BearSSL 使用自定义 Makefile，无标准 configure/make install"
  - "配置方式：通过 conf/<config>.mk 配置工具链"
  - "编译命令：make CONF=Ohos"
  - "安装方式：需手动复制静态库和头文件"
  - "DLL 限制：官方不推荐动态库模式（API 不稳定）"
  - "测试套件：testcrypto all + testx509，覆盖完整"
