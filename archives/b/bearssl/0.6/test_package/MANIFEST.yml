# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bearssl/0.6
homepage: "https://www.bearssl.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make CONF=Ohos tests && ./ohos/testcrypto all && ./ohos/testx509"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_crypto.c
    source: bearssl-0.6/test/test_crypto.c
    description: "Cryptographic algorithm tests (all ciphers, hashes, EC, RSA)"
    command: "./ohos/testcrypto all"
  - file: test/test_x509.c
    source: bearssl-0.6/test/test_x509.c
    description: "X.509 certificate validation tests (57 test vectors)"
    command: "./ohos/testx509"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "SHA-256 digest verification test using BearSSL API"
    command: "./test_bearssl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100
