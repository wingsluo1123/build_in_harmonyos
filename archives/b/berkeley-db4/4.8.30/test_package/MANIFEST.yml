# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: berkeley-db4/4.8.30
homepage: https://www.oracle.com/database/berkeley-db/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件（Berkeley DB 4.8.30 无正式测试框架）
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "Berkeley DB 基本功能测试（打开数据库、插入数据、查询数据）"
    command: "./test_db"

# 测试断言总数
assertion_count: 4
