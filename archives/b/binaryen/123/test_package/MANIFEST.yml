# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: binaryen/123
homepage: "https://github.com/WebAssembly/binaryen"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# binaryen uses googletest (not included in source tarball), tests disabled via BUILD_TESTS=OFF
upstream_tests:
  - file: "N/A (googletest not in source tarball)"
    source: "binaryen-123/third_party/googletest"
    description: "Upstream tests require googletest submodule not in release tarball"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Links against libbinaryen and calls BinaryenModuleCreate/BinaryenAddMemory C API"
    command: "./test_binaryen"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
