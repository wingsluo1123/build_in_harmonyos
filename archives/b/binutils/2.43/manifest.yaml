software: binutils
version: "2.43"
status: built
build_date: "2026-07-15"

source:
  url: "https://ftp.gnu.org/gnu/binutils/binutils-2.43.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  build_system: autotools
  system: autotools
  configure_options:
    - "--target=i686-elf"
    - "--disable-gprofng"
    - "--disable-nls"
    - "--enable-interwork"
    - "--enable-multilib"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "binutils 2.43 成功交叉编译为 i686-elf 目标"
  - "交叉编译时不需要修改 config.guess/config.sub（本地 host 是 aarch64-linux）"
  - "i686-elf 是 ELF 裸机目标，不依赖操作系统"
