# test_package/MANIFEST.yml
# Upstream test declaration (CI L0e requirement)

package: binwalk/2.3.4
homepage: "https://github.com/ReFirmLabs/binwalk"

# Upstream test command
upstream_check_command: "python3 setup.py test"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (binwalk uses testing/ directory)
upstream_tests:
  - file: testing/tests.py
    source: binwalk-2.3.4/testing/tests.py
    description: "binwalk upstream test suite"
    command: "python3 -m pytest testing/tests.py"

# test_package consumer-side verification
test_package_tests:
  - file: test_binwalk.py
    description: "Import and version smoke test"
    command: "python3 -c \"import binwalk; print(binwalk.__version__)\""

assertion_count: 2
