  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "glibc_compat.c"
  # glibc-to-musl 适配: ELF interpreter patch + NEEDED entry replacement
  # + glibc compatibility shim library (libgcompat.so)
  # + binary-sign-tool self-signing

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "BiSheng JDK Linux aarch64 二进制是 glibc 编译，HarmonyOS 使用 musl"
  - "需要 patchelf 修改 interpreter (ld-linux-aarch64.so.1 -> ld-musl-aarch64.so.1)"
  - "需要 patchelf 替换 NEEDED entries (libc.so.6 -> libc.so 等)"
  - "需要 glibc 兼容层 (libgcompat.so) 提供 __getpagesize, malloc_trim 等缺失符号"
  - "所有 ELF 文件需要 binary-sign-tool -selfSign 1 自签名 (E083)"
  - "创建 musl 兼容符号链接 (libc.so -> /lib/ld-musl-aarch64.so.1)"
