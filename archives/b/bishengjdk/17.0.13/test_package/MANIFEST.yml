# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bishengjdk/17.0.13
homepage: "https://gitee.com/openeuler/bishengjdk-17"

# BiSheng JDK is a pre-built binary, not source-compiled.
# No upstream test suite is available (binary distribution).

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream tests (pre-built binary distribution)
upstream_tests: []

# test_package: verifies ELF adaptation was applied correctly
test_package_tests:
  - file: test.sh
    description: "Verify glibc-to-musl adaptation: ELF interpreter, NEEDED replacement, glibc compat shim, musl symlinks, binary signing"
    command: "bash test.sh"

# 6 assertions: ELF format, musl interpreter, NEEDED replacement, gcompat shim, musl compat lib, binary signing
assertion_count: 6
