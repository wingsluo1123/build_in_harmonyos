sources:
  url: "https://ftp.gnu.org/gnu/bison/bison-2.7.tar.gz"
  sha256: "19bbe7374fd602f7a6654c131c21a15aebdc06cc89493e8ff250cb7f9ed0a831"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "HarmonyOS 平台识别：config.guess 新增 aarch64:HarmonyOS 分支，映射到 aarch64-unknown-linux-gnu"
    patch_type: "portability"
  - patch_file: "patches/0002-src-scan-gram.c.patch"
    patch_description: "修复 flex 生成代码的变量作用域问题：将 code_start 定义移到 YY_USER_INIT 调用之前，解决 OHOS 上编译报错"
    patch_type: "bugfix"
  - patch_file: "patches/0003-src-system.h.patch"
    patch_description: "添加 gnulib 多字节字符串函数 mbschr/mbsrchr 声明，解决 OHOS 上缺少函数声明的编译错误"
    patch_type: "portability"
