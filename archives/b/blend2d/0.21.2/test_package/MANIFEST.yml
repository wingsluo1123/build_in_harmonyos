# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: blend2d/0.21.2
homepage: "https://github.com/blend2d/blend2d"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (blend2d-testing/)
upstream_tests:
  - file: blend2d-testing/tests/bl_test_runner.cpp
    source: blend2d-0.21.2/blend2d-testing/tests/
    description: "blend2d 官方测试运行器 (包含 array, bitset, context, gradient, rgba 等单元测试)"
    command: "./bl_test_runner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "blend2d C API 烟雾测试: 创建图像、渲染圆形、验证 API 可用性"
    command: "./test_blend2d"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
