# manifest.yaml — blender 5.0.1
# 软件级元数据

name: blender
display_name: Blender
version: "5.0.1"
type: application  # 3D创作套件，不是纯库

description: >
  专业3D创作套件，支持建模、动画、渲染等功能。
  OHOS 平台无头版本，适用于服务器渲染。

category: graphics
license: GPL-3.0-or-later

homepage: https://www.blender.org/
source_url: https://download.blender.org/source/blender-5.0.1.tar.xz

status: pending
build_system: cmake
build_mode: headless

# OHOS 适配信息
ohos_compatible: true
ohos_arch: aarch64

# 构建选项
build_options:
  with_cycles: false
  with_ffmpeg: false
  with_openimageio: false

# 已知限制
limitations:
  - GUI 功能不可用
  - GPU 渲染不可用
  - Python API 不可用
  - 渲染管线完整性需人工验证 (R40)

# R40: 图形/渲染类库需人工确认适配完整性
requires_manual_verification: true

# 变更历史
adaptation_history:
  - date: "2026-07-30"
    version: "5.0.1"
    changes:
      - "Initial OHOS adaptation"
      - "Headless mode only"
      - "Disabled GPU features"
      - "Disabled Python integration"
