# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本强制要求此文件存在

package: blender/5.0.1
homepage: https://www.blender.org/

# Blender headless mode tests
upstream_check_command: "blender --version"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# Blender 自带测试 (ctest)
upstream_tests:
  - file: tests
    source: tests/
    description: "Blender internal test suite"
    command: "ctest --output-on-failure"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "Verify blender headless executable works"
    command: "blender --version"

# 测试断言总数
assertion_count: 1
