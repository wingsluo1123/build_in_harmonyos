software: blender
# 软件级 manifest
# 文件位置: archives/b/blender/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 基本信息
# ============================================================

# 软件描述
description: "全球领先的开源 3D 创作套件，支持建模、动画、模拟、渲染、合成和运动追踪。OHOS 适配版本为无头(headless)模式，适用于服务器渲染和自动化流水线。"

# 许可证
license: GPL-3.0-or-later

# 主页
homepage: https://www.blender.org/

# 作者
maintainer: Blender Foundation

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "5.0.1"
    status: pending
    build_date: ""
    build_system: cmake
    archive_path: "5.0.1"
    requires_manual_verification: true

# 当前推荐版本
current_version: "5.0.1"

# ============================================================
# 分类信息
# ============================================================

# 软件分类
category: graphics

# 软件类型（与 commands.json type 字段对齐）
type: application

# 关键词
keywords:
  - 3d
  - modeling
  - animation
  - rendering
  - cycles
  - opengl
  - headless
  - blender

# ============================================================
# 依赖关系
# ============================================================

# 运行时依赖
runtime_dependencies:
  - libc  # musl libc on OHOS

# 编译时依赖
build_dependencies:
  - cmake >= 3.10
  - clang
  - clang++

# ============================================================
# 预编译包信息
# ============================================================

# 预编译包可用性
precompiled_available: false

# 最新预编译包
latest_package: ""
package_size: ""
package_date: ""
