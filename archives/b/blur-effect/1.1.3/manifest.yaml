# 版本级 manifest — blur-effect 1.1.3
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.3"
software: "blur-effect"
status: built
build_date: "2026-10-18"
build_system: cmake

source:
  url: "https://github.com/sonald/blur-effect/archive/refs/tags/1.1.3.tar.gz"
  sha256: "80baead168e117cdbd7dd915dac94b8055e63dc05ec5797f3030acfaf19e5654"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: []
  dependencies:
    - gdk-pixbuf/2.44.6.1
    # EGL/GLESv3 为 OpenHarmony 平台库（clang 默认 sysroot），非 conan 依赖
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-blur_image.cc.patch"

knowledge_gained:
  - "OHOS 无 /dev/dri 与 libgbm：GBM+DRM 离屏渲染路径可整体替换为 EGL_DEFAULT_DISPLAY + pbuffer（EGL 标准 API，Linux 同样合法）；ref: archives/b/blur/1.1.3"
  - "OpenHarmony GLES shader 严格模式：#version 必须在源码首行、GLSL ES 3.00 禁用 texture2D；ref: archives/b/blur/1.1.3"
  - "musl getopt 无 GNU 参数重排，CLI 选项须置于位置参数前；ref: archives/b/blur/1.1.3"
  - "mesa 原生 GBM 路线在 OHOS 不可行：conan install --requires=mesa/24.3.4.1.1.1 --build=never 实测缺 prebuilt（libxrender/0.9.12），gbm.pc/glesv2.pc 无从取得；ref: archives/m/mesa/24.3.4.1.1.1"
  - "同一上游 sonald/blur-effect 1.1.3（sha256 80baead1…）已由姊妹配方 archives/b/blur/1.1.3 覆盖且已发布 ohpcd，本包为其第二归档（B 判定 hit）；ref: archives/b/blur/1.1.3"
