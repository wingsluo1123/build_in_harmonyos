# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bmake/20260508
homepage: "https://www.crufty.net/help/sjg/bmake.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 — bmake 自带 unit-tests/ 目录
upstream_tests:
  - file: unit-tests/
    source: bmake-20260508/unit-tests/
    description: "bmake 单元测试套件 (make test)"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 bmake 可执行并输出版本号"
    command: "./test_bmake"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2