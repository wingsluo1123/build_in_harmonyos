software: boost-python
version: "1.90.0"
upstream_version: "1.90.0"
status: built
build_date: "2026-08-11"
build_system: custom

source:
  url: "https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2"
  sha256: "49551aff3b22cbc5c5a9ed3dbc92f0e23ea50a0f7325b0d198b705e8ee3fc305"
  tar_format: tar.bz2

build:
  system: custom (direct compile of official libs/python CMakeLists source list)
  configure_options: []
  dependencies:
    required:
      - "boost/1.90.0.3 (ordinary Boost headers, published ohpcd)"
    optional: []
  cc: clang
  cxx: clang++
  cxx_standard: c++14
  python: "CPython 3.12.9 (cp312-aarch64-linux-ohos ABI), dev headers + libpython3.12.so self-discovered via sysconfig"

patches_applied: []

knowledge_gained:
  - "b2 (Boost.Build) 与 OHOS 不兼容（E035/E099/E153），Boost.Python 无法用 b2 构建"
  - "Boost 官方 CMake 构建（BOOST_INCLUDE_LIBRARIES 含 python）依赖 github cmake 版 tarball，CI/本机不可达"
  - "Boost.Python 专属头文件位于官方源码树顶层 boost/python.hpp 与 boost/python/，不在 libs/python/include/"
  - "官方 libs/python/CMakeLists.txt add_library 共 29 行 src/ 引用，去重后 27 个唯一核心源文件（object_protocol.cpp 与 object_operators.cpp 各重复一次）；grep -c 'src/' = 35 = 29 + 6(numpy 条件块)"
  - "Boost.NumPy 6 文件为可选，eigenpy 不依赖 boost::python::numpy，不编译"
  - "libboost_python312.so NEEDED 仅 libpython3.12.so.1.0 / libc++_shared.so / libc.so，无 glibc/manylinux 依赖"
  - "Python 3.12 dev 环境自发现机制（sysconfig + /proc/self/maps，参考 cpython-tkinter 已验证），不硬编码路径"
  - "python_abi option 进入 package ID，防止跨 Python 版本复用"

test_results:
  type: official
  total: 3
  passed: 3
  failed: 0
  detail: "test_package 真实消费者测试：find_package(boost_python CONFIG) → boost_python::python312；编译真实 Boost.Python 扩展模块 test_ext；Python 3.12 import；断言 add(2,3)==5、add(-1,1)==0、greet()=='hello-from-boost-python'"

knowledge_ref: []
