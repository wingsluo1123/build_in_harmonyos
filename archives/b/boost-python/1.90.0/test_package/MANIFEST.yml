# test_package/MANIFEST.yml — boost-python/1.90.0 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: boost-python/1.90.0
homepage: "https://www.boost.org/doc/libs/1_90_0/libs/python/"

# Boost.Python 官方测试依赖 b2 (Boost.Build)，与 OHOS 不兼容（E035/E099/E153），
# 上游测试树未在 OHOS 本地执行；本包以真实消费者验证替代（test_package 扩展模块 + Python 断言）。
upstream_tests:
  source: "Boost libs/python upstream test tree (b2-based)"
  scope: "Not run on OHOS: b2 (Boost.Build) is incompatible with OHOS (E035/E099/E153); local validation uses a real consumer test instead."
  total: 0
  reason: "Boost.Python upstream tests require b2, which cannot run on OHOS; consumer-side validation covers linkage and CPython 3.12 ABI."

test_package_tests:
  - file: "test_ext.cpp"
    description: "Real Boost.Python extension module: exports add(int,int) and greet(); Python 3.12 imports and asserts add(2,3)==5, add(-1,1)==0, greet() string."
    command: "python3 consumer_test.py"

test_package_test_count: 3
