software: boost
version: "1.84.0"
status: recipe-ready-ohos-build-unverified
build_system: boost-build-b2
source:
  url: "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2"
  sha256: "cc4b893acf645c9d4b698e9a0f08ca8846aa5d6c68275c14c3e7949c24109454"
target:
  os: OHOS
  arch: armv8
  triplet: aarch64-linux-ohos
  compiler: clang
  libcxx: libc++
build:
  compiled_libraries:
    - boost_program_options
    - boost_date_time
  b2_options:
    - --with-program_options
    - --with-date_time
    - --layout=system
    - -j1
test_package:
  links:
    - Boost::program_options
    - Boost::date_time
  source: test_package/test.cpp
  status: ready
known_limitations:
  - "OHOS b2 and test_package are unverified on the Windows workstation."
  - "The former header-only attempt failed at common.jam:1164 before producing compiled libraries."
ohos_toolchain_fix:
  sysroot: "Auto-detect /data/service/hnp/ohos-sdk.org/ohos-sdk_*/ohos/native/sysroot"
  libcxx_include: "native/llvm/include/libcxx-ohos/include/c++/v1"
  config_site: "Discover __config_site below native/llvm/include and add its parent"
  compile_flags:
    - "--sysroot=<OHOS_SYSROOT>"
    - "-nostdinc++"
    - "-isystem <libcxx-v1>"
    - "-isystem <__config_site-parent>"
    - "-D__OHOS_FAMILY__=1"
    - "-D_LIBCPP_HAS_NO_C_LOCALE"
    - "-DBOOST_DISABLE_THREADS"
    - "-include boost_ohos_locale_compat.h"
  generated_headers:
    - "include/boost_ohos_locale_compat.h"
  locale_compatibility:
    missing_apis:
      - strtoll_l
      - strtoull_l
    wrappers: "OHOS-only wrappers call strtoll/strtoull and ignore locale_t"
  component_flags: true
