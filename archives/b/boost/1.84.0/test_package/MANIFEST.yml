# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boost/1.84.0
homepage: "https://www.boost.org"

# 上游测试命令 (boost 使用 b2 test, not make check)
upstream_check_command: "b2 test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: libs/system/test
    source: boost_1_84_0/libs/system/test
    description: "Boost.System unit tests (b2 test)"
    command: "b2 test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: verify boost version, shared_ptr, lexical_cast, error_code"
    command: "./test_boost"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
