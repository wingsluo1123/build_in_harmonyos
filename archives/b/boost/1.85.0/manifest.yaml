knowledge_gained:
  - Boost.Build SHELL 执行机制在鸿蒙不兼容（E035）
  - b2 引擎可通过重编译修复：jam.h 加 __ohos__ 检测定义 NO_VFORK
  - boost/core/detail/sp_thread_sleep.hpp 用 pthread_setcancelstate 鸿蒙缺失（E099）
  - boost/fiber+context 的 native-impl 规则显式用 ucontext，鸿蒙 musl 缺 getcontext（E100）
  - 29 个 compiled 库可通过 b2 直接编译（atomic~wave），供测试链接
  - b2 引擎编译规则存在 phantom fail bug：编译成功（exit 0）但标记 failed updating N targets，无 error 行
  - Boost CMake 支持是实验性的，不支持独立构建
  - Boost 大部分库是 header-only，可直接安装使用
knowledge_ref:
  - E035 (Boost.Build SHELL 执行机制在鸿蒙不兼容)
  - E099 (boost sp_thread_sleep.hpp pthread_setcancelstate 鸿蒙缺失)
  - E100 (boost fiber/context ucontext API 鸿蒙 musl 缺失)
issues:
  - b2 构建系统失败：clang++ --version SHELL 执行错误（已通过重编译 b2 引擎修复 E035）
  - sp_thread_sleep.hpp 调用 pthread_setcancelstate 鸿蒙 musl 缺失（已加 __OHOS__ 排除 E099）
  - fiber/context 的 native-impl 规则显式用 ucontext，鸿蒙 musl 缺 getcontext（已改 Jamfile 跳过 native E100）
  - system/filesystem/date_time/locale/thread 等测试依赖 compiled 库（已用 b2 编译 29 个 compiled 库）
  - b2 phantom fail bug：编译成功但标记 failed updating，无 error 行（51 个虚假失败，不计入真实通过率）
  - CMake 构建系统不支持独立构建（需要 superproject 模式）
