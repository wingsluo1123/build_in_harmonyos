package: boost/1.85.0
homepage: "https://www.boost.org"
upstream_check_command: "tools/build/src/engine/test_all.py"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - "Boost.Build engine upstream tests (not run: Python harness is not part of the packaged CLI smoke test)"
test_package_tests:
  - file: conanfile.py
    description: "运行 b2 --help，验证命令行工具可执行"
    command: "b2 --help"
  - file: Jamroot
    description: "使用 b2 和 clang 编译并运行 hello.c"
    command: "使用 Conan profile 编译器生成 user-config.jam，再执行 b2 toolset=clang-ohos -j1 && hello"
assertion_count: 4
