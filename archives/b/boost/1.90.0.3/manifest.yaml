notes: >
  Builds the compiled Boost components required by FastNetMon and VOTCA using
  Boost.Build/b2. The component set includes atomic, chrono, filesystem,
  program_options, regex, serialization, thread, and timer. The package version
  uses an adaptation suffix because boost/1.90.0 already exists as a
  header-only archive. OHOS builds route b2 through a generated clang++ wrapper
  so Boost.Build's generic Linux target triple cannot override the Conan OHOS
  target. WSL/Linux local validation ran 1578 selected upstream Boost.Build
  targets plus one Conan consumer test successfully; OpenHarmony target-side
  runtime validation remains a separate requirement.
