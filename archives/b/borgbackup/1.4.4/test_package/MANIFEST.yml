# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: borgbackup/1.4.4
homepage: "https://www.borgbackup.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "python3 -m pytest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/borg/testsuite/__init__.py
    source: borgbackup-1.4.4/src/borg/testsuite/__init__.py
    description: "borgbackup test suite (pytest-based)"
    command: "python3 -m pytest src/borg/testsuite/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 包结构、.so文件和版本验证"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
