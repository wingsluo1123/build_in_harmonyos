# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e check

package: bottom/0.12.3
homepage: "https://github.com/ClementTsang/bottom"

# Upstream test command (cargo test for Rust projects)
upstream_check_command: "cargo test --release"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: "cargo test --release"

# Upstream actual test programs
upstream_tests:
  - file: tests/arg_tests.rs
    source: bottom-0.12.3/tests/arg_tests.rs
    description: "CLI argument parsing tests (29 tests)"
    command: "cargo test --release --test arg_tests"
  - file: tests/invalid_config_tests.rs
    source: bottom-0.12.3/tests/invalid_config_tests.rs
    description: "Invalid config file handling tests"
    command: "cargo test --release --test invalid_config_tests"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.sh
    description: "Verifies btm binary runs and reports correct version"
    command: "./test.sh"

# Approximate assertion count
assertion_count: 30
