# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: brag/1.4.3
homepage: "https://sourceforge.net/projects/brag/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# brag 是纯 Tcl 脚本，上游无测试套件
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# brag 上游无测试文件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 brag 脚本文件存在、包含 tclsh 引用、可执行"
    command: "conan create"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
