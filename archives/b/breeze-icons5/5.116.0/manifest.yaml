platform_differences:
  - "上游可选构建 Qt 二进制资源（BINARY_ICONS_RESOURCE，qrcAlias + Qt5 Core）；交叉编译到 OHOS 时 qrcAlias 为宿主原生工具无法执行，且消费方构建期不需要 .rcc，故关闭。"
  - "WITH_ICON_GENERATION（python3-lxml 生成 24px 单色变体）跳过：产物可选且 lxml 无法保证。"
  - "OHOS 无 gtk-update-icon-cache，不生成磁盘图标缓存（可选；QIcon::fromTheme 直接读 index.theme）。"
  - "图标安装到 share/icons/breeze 与 share/icons/breeze-dark（含各自 index.theme），与 KDEInstallDirs 一致；暗色主题缺失的浅色图标按上游行为回填。"

