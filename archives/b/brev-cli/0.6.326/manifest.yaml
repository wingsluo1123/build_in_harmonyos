# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "brev-cli 是 Go 应用，HMDFS 无法执行 static ET_EXEC 的 Go 工具链"
  - "Go -buildmode=pie 生成 PIE (ET_DYN) 二进制，HMDFS 可执行"
  - "NVML GPU 探测需要 CGO，禁用后纯 Go 编译"
  - "本机无 Go 工具链，需依赖 CI runner 交叉编译"

platform_limitations:
  - "HMDFS 仅执行 PIE (ET_DYN) 二进制，Go 默认 static ET_EXEC 被拒"
  - "NVML 依赖 NVIDIA CGO 库，鸿蒙平台无此依赖"
  - "本机无 Go 工具链，无法本地 go build"

special_notes:
  - "NVML support disabled (requires CGO and NVIDIA libraries)"
  - "Pure Go build for portability"
  - "May need ELF signature on HongMeng systems"
