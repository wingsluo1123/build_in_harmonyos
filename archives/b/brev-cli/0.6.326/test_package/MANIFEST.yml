# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# brev-cli 是 Go 命令行应用（云开发环境连接工具）。
# 上游通过 `go test ./...` 运行单元测试，测试代码大多为 hermetic 纯逻辑测试。
# 本机开发环境（HMDFS）无法执行 static ET_EXEC 的 Go 工具链（低 PHDR vaddr 被
# 内核拒绝），因此 `go test ./...` 在 conanfile.py build() 中集成到 CI 阶段：
# 当 runner 具备可用 Go 工具链时真实执行 `go test ./...` 并把结果写入
# go-test-report.txt 与构建日志，供 CI 日志回填真实通过率。
# test_package 采用 L2 冒烟测试：运行 `brev --version` 验证二进制可用性。

package: brev-cli/0.6.326
homepage: "https://github.com/brevdev/brev-cli"

# 上游测试命令分析
# R5: 上游测试在 CI 构建阶段（conanfile.py build()，go 可用时）真实运行
upstream_check_command: "go test ./..."
upstream_test_in_build: true
upstream_test_command: "go test ./..."

# 上游实际运行的测试程序（Go 单元测试，CI 阶段在具备 Go 工具链的 runner 上执行）
upstream_tests:
  - file: pkg/cmd/version/version_test.go
    source: brev-cli-0.6.326/pkg/cmd/version/version_test.go
    description: "Version 字符串构建单元测试"
    command: "go test ./pkg/cmd/version/"
  - file: pkg/cmd/register/register_test.go
    source: brev-cli-0.6.326/pkg/cmd/register/register_test.go
    description: "Register 命令单元测试（hermetic）"
    command: "go test ./pkg/cmd/register/"

# test_package 中自带的测试（消费者视角验证）
# R34: 调用被测包的实际二进制（brev --version），非空壳 stub
test_package_tests:
  - file: conanfile.py
    description: "运行 brev --version，验证二进制可执行且版本号正确"
    command: "brev --version"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
