# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bsd-compat-headers/0.7.2
homepage: "https://github.com/NeonatoX/bsd-compat-headers"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Header-only package — no upstream test suite
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 sys/queue.h (LIST macros) 和 sys/tree.h (RB tree macros) 可编译并正确运行"
    command: "./test_bsd_compat_headers"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
