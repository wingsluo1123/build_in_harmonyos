  - "0013-scripts-sanitize.patch"
  - "0014-scripts-test-wrappers.patch"
  - "0015-src-btllib-status.cpp.patch"

# Subproject CMake version fixes applied via sed in conanfile.py source()
subproject_fixes:
  - "subprojects/cpptoml/CMakeLists.txt: cmake_minimum_required VERSION 3.5...4.1"
  - "subprojects/sdsl-lite/CMakeLists.txt: cmake_minimum_required VERSION 3.5...4.1"
  - "subprojects/sdsl-lite/external/googletest/googletest/CMakeLists.txt: cmake_minimum_required VERSION 3.5...4.1"
  - "subprojects/sdsl-lite/external/libdivsufsort/CMakeLists.txt: cmake_minimum_required VERSION 3.5...4.1"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "strerror_r returns int (POSIX) on HarmonyOS (musl libc), not char* (GNU); use !defined(__GLIBC__) guard"
  - "Python wrappers fail on HarmonyOS due to getcwd issues; disabled via meson.build patch"
  - "Submodules must be cloned manually in conanfile.py source() since tarball excludes them"
  - "OpenMP provided by system clang, no conan dependency needed"
  - "CMake 4.x requires cmake_minimum_required >= 3.5"

