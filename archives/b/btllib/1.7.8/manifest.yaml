software: btllib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.7.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7.8"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/BirolLab/btllib/archive/refs/tags/v1.7.8.tar.gz"

  # 源码校验和
  sha256: "1bfc83f639d04dd55d57c5bc32c1b12cfd77fac571220655e443f41243205c5f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "-Db_coverage=false"
    - "-Dwerror=false"

  # 编译依赖列表（格式: name/version）
  # OpenMP provided by system clang, no conan dependency needed
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # Git submodules (cloned in conanfile.py source())
  submodules:
    - name: cpptoml
      url: "https://github.com/skystrife/cpptoml.git"
      commit: "fededad7169e538ca47e11a9ee9251bc361a9a65"
    - name: sdsl-lite
      url: "https://github.com/simongog/sdsl-lite.git"
      commit: "c32874cb2d8524119f25f3b501526fe692df29f4"
    - name: argparse
      url: "https://github.com/p-ranav/argparse.git"
      commit: "15d745f58481158ceb65f860e379deac9f722b5d"
    - name: meta-cmake (nested in cpptoml)
      url: "https://github.com/meta-toolkit/meta-cmake.git"
      commit: "db7ff976c430a6cb6cbd03ae691be04cfaac0a07"
    - name: googletest (nested in sdsl-lite)
      url: "https://github.com/google/googletest.git"
      commit: "c2d90bddc6a2a562ee7750c14351e9ca16a6a37a"
    - name: libdivsufsort (nested in sdsl-lite)
      url: "https://github.com/simongog/libdivsufsort.git"
      commit: "0f24acd8de208464769c782119dacf158647f7ed"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-meson.build.patch"
  - "0002-scripts-code-coverage.patch"
  - "0003-scripts-docs.patch"
  - "0004-scripts-get-files.patch"
  - "0005-scripts-get-include-relative.patch"
