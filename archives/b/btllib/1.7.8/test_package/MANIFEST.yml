# MANIFEST.yml — test_package for btllib 1.7.8
# Declares the upstream test reference and adaptation status

package: btllib
version: 1.7.8

upstream_tests:
  - name: "btllib unit tests"
    upstream_command: "cd build && meson test"
    adapted: false
    reason: "Upstream tests require samtools which is unavailable on HarmonyOS; tests disabled via meson.build patch"

local_tests:
  - name: "NtHash smoke test"
    description: "Creates an NtHash object and verifies hash generation works correctly"
    file: "test_btllib.cpp"
