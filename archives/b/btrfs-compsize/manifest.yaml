software: btrfs-compsize
# 软件级 manifest
# 文件位置: archives/b/btrfs-compsize/manifest.yaml

name: "btrfs-compsize"
description: "compsize — 统计 btrfs 文件集在压缩 / reflink 下的实际磁盘占用与有效压缩比"
category: filesystem
homepage: "https://github.com/kilobyte/compsize"

versions:
  - version: "1.5"
    status: built
    build_date: "2026-10-06"
    notes: "官方 tag v1.5；纯 Makefile C 程序，零第三方依赖"

build_systems:
  - makefile

common_configure_options: []

platform_compatibility:
  ohos_arm64: yes
  notes: "btrfs 头文件由 OHOS 内核 uapi 转包；逐文件统计需目标机内核 + 真实 btrfs + root"

dependencies: []

error_patterns_applied: []
