name: busted
version: "2.2.0-1"
package_type: lua
license: MIT
homepage: "https://lunarmodules.github.io/busted/"
source:
  url: "https://github.com/lunarmodules/busted/archive/refs/tags/v2.2.0.tar.gz"
  mirror: "https://gh-proxy.com/https://github.com/lunarmodules/busted/archive/refs/tags/v2.2.0.tar.gz"
  sha256: "befca10f573bb476fa1db2e3149150d65f802a71d34d1682679e640665f2dc2b"

build:
  system: custom
  requires:
    - lua/5.4.8
    - lua_cliargs/3.0.2-1
    - luasystem/0.6.3-1
    - dkjson/2.8-1
    - lua-say/1.4.1-3
    - luassert/1.9.0-1
    - lua-term/0.7
    - lua-penlight/1.15.0
    - mediator_lua/1.1.2-0

artifacts:
  - bin/busted
  - share/lua/5.4/busted.lua
  - share/lua/5.4/busted/core.lua

validation:
  consumer_smoke: true
  upstream_tests: "Busted upstream specs present; pending OHOS validation"

notes:
  - "Busted is the test runner dependency needed by Vusted"
  - "Consumers should compose LUA_PATH and LUA_CPATH explicitly across Lua dependencies"

