# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bzip2/1.0.8
homepage: "https://sourceware.org/bzip2/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: sample1
    source: bzip2-1.0.8/sample1.ref
    description: "Compress and decompress sample1 with -1 flag"
    command: "./bzip2 -1 < sample1.ref > sample1.rb2 && ./bzip2 -d < sample1.bz2 > sample1.tst && cmp sample1.bz2 sample1.rb2 && cmp sample1.tst sample1.ref"
  - file: sample2
    source: bzip2-1.0.8/sample2.ref
    description: "Compress and decompress sample2 with -2 flag"
    command: "./bzip2 -2 < sample2.ref > sample2.rb2 && cmp sample2.bz2 sample2.rb2"
  - file: sample3
    source: bzip2-1.0.8/sample3.ref
    description: "Compress and decompress sample3 with -3 flag"
    command: "./bzip2 -3 < sample3.ref > sample3.rb2 && ./bzip2 -d < sample3.bz2 > sample3.tst && cmp sample3.bz2 sample3.rb2 && cmp sample3.tst sample3.ref"

test_package_tests:
  - file: test.c
    description: "Round-trip compress/decompress test using bzip2 API"
    command: "./test_bzip2"

assertion_count: 4
