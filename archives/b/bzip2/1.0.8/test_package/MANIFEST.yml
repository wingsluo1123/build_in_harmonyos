# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bzip2/1.0.8
homepage: "https://sourceware.org/bzip2/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: bzip2.c
    source: bzip2-1.0.8/bzip2.c
    description: "bzip2 压缩/解压命令行工具测试 (6 个 cmp 测试)"
    command: "./bzip2 -1 < sample1.ref > sample1.rb2 && ./bzip2 -d < sample1.bz2 > sample1.tst && cmp sample1.bz2 sample1.rb2 && cmp sample1.tst sample1.ref"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "使用 BZ2_bzBuffToBuffCompress/Decompress API 进行压缩解压往返测试"
    command: "./test_bzip2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
