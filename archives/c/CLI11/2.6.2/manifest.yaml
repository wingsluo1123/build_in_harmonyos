software: CLI11
version: "2.6.2"
status: published
build_date: "2026-07-15"
build_system: cmake

source:
  url: "https://github.com/CLIUtils/CLI11/archive/refs/tags/v2.6.2.tar.gz"
  sha256: "c6ea6b2e5608b3ea8617999bd5f47420c71b2ebdb8dc4767c1034d1da5785711"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCLI11_BUILD_TESTS=OFF"
    - "-DCLI11_BUILD_EXAMPLES=OFF"
    - "-DCLI11_BUILD_DOCS=OFF"
    - "-DCLI11_PRECOMPILED=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CLI11 is a header-only library, no binary compilation needed"
  - "Tests use pthread_testcancel which is not available on OHOS, so tests must be disabled"
  - "CMake install installs headers + CMake config files + pkg-config file"
