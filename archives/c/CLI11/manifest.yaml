# 软件级 manifest
# 文件位置: archives/c/CLI11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: CLI11

# 显示名
display: "CLI11"

# 一句话描述
description: "Command line parser for C++11 and beyond"

# 分类标签
category: library

# 官网 URL
homepage: "https://github.com/CLIUtils/CLI11"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Header-only library, no binary compilation needed"
    - "Disable tests/examples to avoid pthread_testcancel issues on OHOS"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.6.2":
    status: published
    build_date: 2026-07-15
