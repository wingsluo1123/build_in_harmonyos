software: ca-certificates
display: "CA Certificates"
description: "Mozilla CA 证书捆绑包，提供受信任的根证书"
category: system
homepage: "https://salsa.debian.org/debian/ca-certificates"
license: MPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯数据包，无 C/C++ 编译步骤"
    - "certdata2pem.py 从 Mozilla certdata.txt 生成 PEM 证书"
    - "cryptography 模块 Rust .so 权限问题，使用 OpenSSL CLI shim 解决"
    - "certdata2pem.py 不修改 — 无裁剪"
  common_dependencies: []

versions:
  "20250416":
    status: published
    build_date: "2026-08-05"
