knowledge_gained:
  - "cachecontrol 0.14.x __init__.py 用 importlib.metadata.version('cachecontrol')
    无守卫解析版本——copytree 移植必须生成最小 dist-info（METADATA/WHEEL），否则
    import 即抛 PackageNotFoundError（区别于多数纯库包）。"
  - "[filecache] extra 的 FileCache 是 lastversion 启动路径（BaseProjectHolder 用
    CacheControlAdapter+FileCache），filelock 依赖显式声明而非留空。R38：纯库无
    commands.json。"

