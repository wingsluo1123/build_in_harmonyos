# 软件级 manifest — cachecontrol
# 遵循 ARCHIVE-SPEC v3.0

software: cachecontrol
display: "cachecontrol"
description: "cachecontrol — requests 的 HTTP 缓存层（cachecontrol[filecache]，lastversion 依赖）"
category: library
homepage: "https://github.com/psf/cachecontrol"
license: Apache-2.0
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Python noarch，copytree staging 到 site-packages（awscli WR-008 模式），
      无源码补丁"
    - "上游 __init__.py 经 importlib.metadata 无守卫解析 __version__ —— copytree
      移植需附带最小 dist-info（等价 pip 安装残留），否则 import 失败"
    - "msgpack 依赖映射 python-msgpack（ohpcd 的 msgpack/7.0.1 是 msgpack-c C 库）；
      [filecache] extra 的 filelock 显式声明（lastversion 启动路径 import FileCache）"

versions:
  "0.14.4":
    status: built
    build_date: "2026-09-26"
    conan_ref: "cachecontrol/0.14.4"
