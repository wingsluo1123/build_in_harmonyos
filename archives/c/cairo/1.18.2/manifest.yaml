software: cairo
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.18.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.18.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.cairographics.org/releases/cairo-1.18.2.tar.xz"

  # 源码校验和
  sha256: "a62b9bb42425e844cc3d6ddde043ff39dbabedd1542eba57a2eb79f85889d45a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dbuildtype=release"
    - "-Dxlib=disabled"
    - "-Dxcb=disabled"
    - "-Dfontconfig=enabled"
    - "-Dtests=disabled"
    - "-Dwrap_mode=nofallback"
    - "-Dc_args=-DHAVE_CTIME_R"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "pixman/0.46.4"
    - "fontconfig/2.16.0"
    - "freetype2/26.6.20"
    - "libpng/1.6.43"
    - "glib-2.0/2.88.0"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cairo static ctime_r 与 OHOS sysroot time.h 冲突, 需 -DHAVE_CTIME_R 跳过"
  - "meson 在 conan 构建环境中 PATH 被覆盖, 需 --native-file 指定编译器全路径"
  - "meson 会尝试 git clone 下载 subproject, 需 -Dwrap_mode=nofallback 禁止"
  - "OHOS 强制 dlopen .so 签名校验, 需 binary-sign-tool 自签名"
  - "test_package 运行时需 runenv_info LD_LIBRARY_PATH 指向系统库目录"
  - "R40 headless 模式: 禁用 xlib/xcb, 保留 image/png/pdf/ps/svg 后端, 满足非窗口渲染需求"
