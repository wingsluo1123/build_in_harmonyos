# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: cairo/1.18.2
homepage: ""

# 上游测试命令 (构建时 -Dtests=disabled, 上游测试未集成)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (构建中已禁用, 无测试运行)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "cairo_version() + cairo_image_surface_create() + cairo_create() API 验证"
    command: "./test_cairo"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
