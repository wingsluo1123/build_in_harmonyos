# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.21.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.21.1"

# 软件名
software: "cargo-binstall"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"
build_system: "precompiled"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (prebuilt binary from GitHub releases)
  url: "https://github.com/cargo-bins/cargo-binstall/releases/download/v1.21.1/cargo-binstall-aarch64-unknown-linux-musl.full.tgz"

  # 源码校验和
  sha256: "1dcc18f75bfc51d96b65206a0eedaee322c65316d4b1de15f2173a579747f090"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: precompiled

  # 配置选项列表 (precompiled — no configure needed)
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器 (N/A — precompiled binary)
  cc: precompiled
  cxx: precompiled

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "rustc crashes (SIGSEGV) on HarmonyOS — cannot compile Rust from source"
  - "Prebuilt aarch64-unknown-linux-musl static binary works on HarmonyOS Kernel 1.12.0"
  - "ELF binaries require adhoc self-signing via binary-sign-tool on HarmonyOS"

  - "cargo-binstall full.tgz includes detect-targets and detect-wasi helper binaries"
