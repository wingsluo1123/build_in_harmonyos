# test_package/MANIFEST.yml — cargo-binstall 1.21.1
# CI L0e requires this file to exist.

package: cargo-binstall/1.21.1
homepage: "https://github.com/cargo-bins/cargo-binstall"

# cargo-binstall is a precompiled Rust binary (no upstream test suite in tarball)
upstream_check_command: "cargo-binstall -V"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs in the prebuilt tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs cargo-binstall -V, detect-targets, detect-wasi, and cargo-binstall --help to verify all three precompiled binaries are functional"
    command: "bash test.sh"

# Approximate assertion count (version check + targets check + wasi check + help check)
assertion_count: 4
