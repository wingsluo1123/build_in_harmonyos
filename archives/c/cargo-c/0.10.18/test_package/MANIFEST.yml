# test_package/MANIFEST.yml — cargo-c 0.10.18
# CI L0e requires this file to exist.

package: cargo-c/0.10.18
homepage: "https://github.com/lu-zero/cargo-c"

# cargo-c has no upstream test suite in the tarball (Rust project, tests require cargo integration)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs --version on all 4 cargo subcommand binaries (cargo-capi, cargo-cbuild, cargo-cinstall, cargo-ctest) to verify installation and basic functionality"
    command: "bash test.sh"

assertion_count: 4
