patches:
  "g20200105.1":
    - patch_file: "patches/0001-ohos-build-and-isolated-regressions.patch"
      patch_description: "Adapt the HarmonyOS CMake build, use configurable writable simulator scratch paths, and isolate regression resources."
      patch_type: conan
      base_path: "."
    - patch_file: "patches/0002-enable-aarch64-64bit-regressions.patch"
      patch_description: "Run the software 64-bit Avalon and Verilator regressions on aarch64."
      patch_type: conan
      base_path: "."
    - patch_file: "patches/0003-use-abstract-unix-sockets-on-harmonyos.patch"
      patch_description: "Use abstract Unix sockets for remote regressions because HarmonyOS storage forbids pathname socket binds."
      patch_type: conan
      base_path: "."
