software: catch2
version: 2.13.10-r0
build_system: cmake
status: published
build_date: '2026-07-14'

source:
  url: https://github.com/catchorg/Catch2/archive/refs/tags/v2.13.10.tar.gz
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - -DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local
    - -DCMAKE_BUILD_TYPE=Release
    - -DBUILD_TESTING=OFF
    - -DCATCH_BUILD_TESTING=OFF
    - -DCATCH_BUILD_EXAMPLES=OFF
    - -DCATCH_INSTALL_DOCS=OFF
  dependencies: []
  cc: clang
  cxx: clang++

knowledge_gained:
  - catch2 是 header-only C++ 测试框架，使用 CMake 构建
  - init-build 可能误判构建系统（基于 URL 猜测），需手动修正
