version: "18.7.2"
software: "cdecl"
status: built
build_date: "2026-07-14"
build_system: autotools

source:
  url: "https://github.com/paul-j-lucas/cdecl/releases/download/cdecl-18.7.2/cdecl-18.7.2.tar.gz"
  sha256: "e91cc201c79456b923b45cfa779da62f5ca91824d11c545167ee7bb33a9fb810"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--without-readline"
    - "--disable-term-size"
    - "--disable-dependency-tracking"
    - "--prefix=/"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-umask.patch"

knowledge_gained:
  - "HMDFS 下 configure 使用 umask 077 创建临时目录会导致 config.status 写入失败，需改为 umask 022"
  - "cdecl 的 readline/curses 为可选交互增强，可禁用以保留批处理命令行功能并避免未发布依赖"
  - "HMDFS 不支持 GNU make jobserver mkfifo，需使用 make -j1"
  - "上游测试集 (make check) 不依赖 readline：所有 .test 文件通过管道传 stdin 比对 stdout 运行；自动补全测试 (.exp) 依赖 expect(1) 而非 readline，由 --with-expect 门控（默认关闭）"
