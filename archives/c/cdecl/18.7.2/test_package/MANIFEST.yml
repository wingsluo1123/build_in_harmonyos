# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: cdecl/18.7.2
homepage: "https://github.com/paul-j-lucas/cdecl"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "test/tests/declare.test"
    source: "cdecl-18.7.2/test/tests/declare.test"
    description: "cdecl 上游声明转换测试集合"
    command: "make check"
  - file: "test/tests/explain.test"
    source: "cdecl-18.7.2/test/tests/explain.test"
    description: "cdecl 上游解释声明测试集合"
    command: "make check"

test_package_tests:
  - file: "test_cdecl.sh"
    description: "执行 cdecl --version、declare、explain 验证命令行功能"
    command: "bash test_cdecl.sh <cdecl_bin>"

assertion_count: 3
