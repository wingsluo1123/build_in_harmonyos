software: cdecl
display: "cdecl"
description: "C/C++ 声明和类型转换解释命令行工具"
category: development-tool
homepage: "https://github.com/paul-j-lucas/cdecl"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools configure 需要显式指定 aarch64-unknown-linux-ohos build/host 三元组"
    - "HMDFS 下 configure 使用 umask 077 创建临时目录会导致 config.status 写入失败，需改为 umask 022"
    - "readline/curses 为可选交互增强，命令行批处理功能可通过 --without-readline --disable-term-size 禁用"
    - "HMDFS 不支持 GNU make jobserver mkfifo，使用 make -j1 单线程构建"
  common_dependencies: []

versions:
  "18.7.2":
    status: built
    build_date: "2026-07-14"
