software: cdk
# Version manifest
# File: archives/c/cdk/5.0/manifest.yaml
# Follows ARCHIVE-SPEC v2.0

# ============================================================
# Required fields
# ============================================================

# Version
version: "5.0"

# Build status
# published | built | failed | archived
status: published

# Conan reference
conan_ref: "cdk/5.0"

# Build date (YYYY-MM-DD)
build_date: "2026-07-15"

# ============================================================
# Source info
# ============================================================

source:
  # Source download URL (official GitHub archive)
  url: "https://github.com/ThomasDickey/cdk-snapshots/archive/refs/tags/t20260119.tar.gz"

  # Source checksum (left empty: to be filled after verification)
  sha256: ""

  # Archive format
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# Build config
# ============================================================

build:
  # Build system type
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # Configure options
  configure_options:
    - "--enable-static"
    - "--disable-shared"

  # Build dependencies (format: name/version)
  dependencies:
    - ncurses/6.4

  # Compiler
  cc: clang
  cxx: clang++

# ============================================================
# Patches
# ============================================================

# Applied patches
patches_applied: []

# ============================================================
# Knowledge gained
# ============================================================

knowledge_gained:
  - "CDK is a curses widget library depending on ncurses"
  - "config.guess/config.sub need HarmonyOS (OHOS) detection branch (E007)"
  - "Static library libcdk.a produced via --enable-static --disable-shared"
  - "Conan version 5.0 maps to upstream snapshot tag t20260119 (5.0-20260119)"
