version: "2.4.0"
software: cdo
status: built
build_date: "2026-07-15"
build_system: autotools

source:
  url: "https://code.mpimet.mpg.de/attachments/download/29670/cdo-2.4.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-ohos"
    - "--enable-static"
    - "--disable-shared"
    - "--without-netcdf"
    - "--without-hdf5"
    - "--without-szlib"
    - "--disable-dependency-tracking"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "E007: config.guess/config.sub 需要打 HarmonyOS 识别补丁"
  - "CDO 使用 autotools 构建，需要 CONFIG_SHELL=/data/service/hnp/bin/bash"