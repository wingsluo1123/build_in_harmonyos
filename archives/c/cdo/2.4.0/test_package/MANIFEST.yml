# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: cdo/2.4.0
homepage: "https://code.mpimet.mpg.de/projects/cdo"

upstream_check_command: "make check"

upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/
    source: cdo-2.4.0/tests/
    description: "CDO 内置测试套件（格式转换、统计计算、网格操作等）"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "消费者测试: 执行 cdo --version 与 cdo --help"
    command: "./test_cdo"

assertion_count: 1
