version: "2.6.3"
software: cdo
status: built
build_date: "2026-07-15"
build_system: autotools

source:
  url: "https://code.mpimet.mpg.de/attachments/download/30224/cdo-2.6.3.tar.gz"
  sha256: "889ece29314b48cbf47ba14ab5f1779886f128767f6d22dfcc7fad1e62f2d017"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-ohos"
    - "--enable-static"
    - "--disable-shared"
    - "--without-netcdf"
    - "--without-hdf5"
    - "--without-szlib"
    - "--disable-dependency-tracking"
  dependencies: []
  cc: clang
  cxx: clang++
  cxxflags:
    - "-std=c++20"

patches_applied:
  - "patches/0001-config-config.guess.patch"
  - "patches/0002-config-config.sub.patch"
  - "patches/0003-libcdi-config-config.guess.patch"
  - "patches/0004-libcdi-config-config.sub.patch"
  - "patches/0005-libcdi-configure-hmdfs-umask.patch"
  - "patches/0006-configure-hmdfs-umask.patch"
  - "patches/0007-libf2c-public-off64-t.patch"
  - "patches/0008-detect-pthread-cancel.patch"

knowledge_gained:
  - "E007: config.guess/config.sub 需要打 HarmonyOS 识别补丁"
  - "E011: 顶层和 libcdi/configure 生成 config.status 时均需放宽临时目录 umask，以兼容 HMDFS 权限语义"
  - "libf2c 的 Linux 分支不能依赖 glibc 私有 __off64_t，应使用公开 off64_t 兼容 HarmonyOS musl"
  - "E127: 使用 Autoconf 检测 pthread_cancel，并在该函数不可用时跳过线程取消调用并输出准确的 skipped 日志"
  - "CDO 使用 autotools 构建，需要 CONFIG_SHELL=/data/service/hnp/bin/bash"
  - "CDO 2.6.3 需要 C++20，CI 共享 profile 为 C++17 时需在配方中显式覆盖"
  - "CI 可运行目标程序时应在 build() 阶段执行 make check，以满足 L1 上游测试验证"
