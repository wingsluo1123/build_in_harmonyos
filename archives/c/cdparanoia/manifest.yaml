software: cdparanoia
display: "cdparanoia"
description: "CD audio extraction library and tool with error correction"
category: library
homepage: "https://xiph.org/paranoia/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools build system with config.guess/sub patches for OHOS"
    - "cuserid() replaced with getpwuid-based implementation"
    - "u_int32_t/u_int16_t typedefs added for musl libc"
    - "DESTDIR support added to Makefile.in for conan packaging"
    - "umask 077 changed to 022 for temp directory creation on OHOS"
  common_dependencies: []

versions:
  "10.2":
    status: published
    build_date: "2026-08-06"
