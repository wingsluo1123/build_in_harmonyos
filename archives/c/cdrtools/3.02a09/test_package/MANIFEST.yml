# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cdrtools/3.02a09
homepage: "https://sourceforge.net/projects/cdrtools/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: "inc/align_test.c"
    source: cdrtools-3.02a09/inc/align_test.c
    description: "Stack alignment test"
    command: "make -f align_test.mk"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: run mkisofs --version, cdrecord, cdda2wav, readcd"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 4
