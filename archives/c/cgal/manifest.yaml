software: cgal
display: "CGAL"
description: "Computational Geometry Algorithms Library - header-only C++ library for computational geometry"
category: lib
homepage: "https://www.cgal.org/"
license: GPL-3.0-or-later / LGPL-3.0-or-later
build_system: cmake

# OHOS 适配知识
ohos_adaptation:
  key_points:
    - "CGAL 5.0+ 是 header-only 库，无需编译库文件"
    - "需要 GMP 和 MPFR 预编译依赖"
    - "LD_LIBRARY_PATH 需包含 OHOS SDK llvm/lib 目录"
  common_dependencies:
    - gmp/6.3.0
    - mpfr/4.2.1
    - boost/1.86.0

# 版本索引
versions:
  "6.1.1":
    status: published
    build_date: "2026-05-30"
    published_as: cgal