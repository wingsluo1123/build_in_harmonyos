# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）

package: chayang/0.1.0
homepage: "https://git.sr.ht/~emersion/chayang"

# 上游测试命令
upstream_check_command: "meson test"

# build() 中是否集成了上游测试命令
# （chayang 上游 meson.build 未声明任何 test()；仍执行 `meson test` 以在日志中
#   留下权威计数 "No tests defined."）
upstream_test_in_build: true
upstream_test_command: "meson test"

# chayang 0.1.0 上游测试清点结果：0 项
# 证据：meson.build 无 test()/benchmark() 调用；`meson test` 输出 "No tests defined."
upstream_tests: []

# test_package 自带的消费者测试（命令行工具：执行已安装的 bin/chayang）
test_package_tests:
  - file: src/test_chayang.sh
    description: "检查 bin/chayang 产物与链接（ok/kill/usage 串、DT_NEEDED），并在可执行时运行 -h / -d 非法值 / 无 display"
    command: "bash src/test_chayang.sh <pkg>/bin/chayang"

# 断言总数（产物 6 + 运行 3）：
#   1 exists / 2 executable / 3 "usage: chayang" / 4 "invalid -d value"
#   5 "failed to connect to display" / 6 DT_NEEDED libwayland-client.so.0
#   7 -h 退出 0 / 8 -d 非法值退出 1 / 9 无 display 退出 1
assertion_count: 9
