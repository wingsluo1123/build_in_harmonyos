tests:
  - name: check-consumer-smoke
    type: conan-test-package
    file: test_check.c
    assertions:
      - CHECK_MAJOR_VERSION reports the packaged 0.x API
      - CHECK_MINOR_VERSION reports the packaged 0.15 API
      - Plain C assertions validate the consumer executable without SRunner temp-file IPC
      - Suite and TCase objects can be created and linked from the packaged library
