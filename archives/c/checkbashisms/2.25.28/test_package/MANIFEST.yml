# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: checkbashisms/2.25.28
homepage: "https://salsa.debian.org/debian/devscripts"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_checkbashisms
    source: checkbashisms-2.25.28/test/test_checkbashisms
    description: "checkbashisms functional tests using shunit2"
    command: "sh test/test_checkbashisms"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 checkbashisms --version 和 --help 可执行，以及 bashism 检测功能"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
