# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: chezscheme/10.4.1
homepage: "https://github.com/cisco/ChezScheme"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# Chez Scheme has make check but it requires a workingScheme runtime first (bootstrap)
# Skipped due to: 1) bootstrap dependency 2) test suite time (~30min) 3) platform syscall gaps
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Chez Scheme 自带测试套件)
# Note: These tests exist upstream but were not run during conan build
# due to bootstrap complexity and platform limitations (E051 syscalls)
upstream_tests:
  - file: s/compile.ss
    source: chezscheme-10.4.1/s/compile.ss
    description: "编译器自举测试（fixpoint 验证）"
    command: "make"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 scheme 二进制验证版本和算术"
    command: "scheme --version && scheme --script test.ss"

# 测试断言总数 (近似值)
assertion_count: 5
