# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: chkrootkit/0.59
homepage: "https://www.chkrootkit.org/"

# chkrootkit has no 'make check' target; no upstream test suite
upstream_check_command: "N/A (no test target in Makefile)"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Run chkrootkit -V to verify version output"
    command: "chkrootkit -V"

assertion_count: 1
