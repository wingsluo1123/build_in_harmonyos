test_file: test_chmlib.c
test_type: explicit
assertion_count: 4
description: |
  Tests chmlib API correctness:
  1. chm_open on non-existent file returns NULL
  2. chm_close(NULL) is safe (no crash)
  3. chm_resolve_object on NULL handle returns CHM_RESOLVE_FAILURE
  4. Minimal ITSF file — chm_open accepts or rejects without crash
