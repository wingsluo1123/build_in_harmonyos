software: cilium-cli
version: "v0.19.4"
status: built
build_system: go
build_date: "2026-08-06"

source:
  url: "https://github.com/cilium/cilium-cli/archive/refs/tags/v0.19.4.tar.gz"
  sha256: "488a53df69685f5bd6a39de166ce9509fb3b5c4eca660b570c3e40c3946cf17c"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "-ldflags=-s -w -X github.com/cilium/cilium/cilium-cli/defaults.CLIVersion=v0.19.4"
  dependencies:
    - "go/1.26.3"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "cilium-cli requires Go >= 1.26.0 (go.mod specifies go 1.26.0, uses crypto/pbkdf2, crypto/hkdf, crypto/sha3, weak)"
  - "Binary name is 'cilium' (not 'cilium-cli'), build target is ./cmd/cilium"
  - "CGO_ENABLED=0 static compilation produces ~143MB binary, fully portable"
  - "Go linker fallocate syscall fails with EACCES on HarmonyOS tmpfs (EPERM expected), needs hmfs workspace workaround"
  - "Conan recipe self-bootstraps Go 1.26.3 SDK, signs ELF binaries for OHOS"
