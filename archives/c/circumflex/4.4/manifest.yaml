software: circumflex
version: "4.4"
status: built
build_date: "2026-07-03"
build_system: go
conan_ref: "circumflex/4.4@ohpcd/stable"

source:
  url: "https://github.com/bensadeh/circumflex/archive/refs/tags/4.4.tar.gz"
  sha256: "ea0d29d95a8999d32a592d68484a7acd2dc2651da3ecbe49cbfab43038c9b68d"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "go build -ldflags=\"-s -w\" -o clx ./cmd/clx"
  dependencies: []
  go_env:
    GOPROXY: "https://goproxy.cn,direct"
    TMPDIR: "/storage/Users/currentUser/tmp"

patches_applied: []

knowledge_gained:
  - "Go 项目在鸿蒙上使用 CGO_ENABLED=0 纯静态编译"
  - "使用 -ldflags=\"-s -w\" 去除符号表和调试信息，减少二进制体积"
  - "GOPROXY 设置为 goproxy.cn 加速依赖下载"
  - "纯 Go 项目无需 CGO，避免交叉编译工具链依赖"
