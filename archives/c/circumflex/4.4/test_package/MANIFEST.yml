# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: circumflex/4.4
homepage: "https://github.com/bensadeh/circumflex"

# 上游测试命令 (Go 项目使用 go test)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: "*_test.go"
    source: circumflex-4.4/*_test.go
    description: "Go unit tests across multiple packages"
    command: "go test ./..."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify clx binary runs --version"
    command: "clx version"

# 测试断言总数 (go test across packages)
assertion_count: 10
