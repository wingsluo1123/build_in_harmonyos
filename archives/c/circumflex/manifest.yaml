software: circumflex
display: "circumflex"
description: "终端版 Hacker News 浏览器，支持 Vim 风格导航、语法高亮、Reader Mode"
category: cli-tool
homepage: "https://github.com/bensadeh/circumflex"
license: MIT
build_system: go

ohos_adaptation:
  key_points:
    - "纯 Go 项目，使用 CGO_ENABLED=0 静态编译"
    - "使用 -ldflags=\"-s -w\" 优化体积"
    - "TMPDIR 必须设置到可写目录（鸿蒙 /tmp 只读）"
    - "GOPROXY 使用 goproxy.cn 加速依赖下载"
  common_dependencies: []

versions:
  "4.4":
    status: built
    build_date: "2026-07-03"
    conan_ref: "circumflex/4.4@ohpcd/stable"
