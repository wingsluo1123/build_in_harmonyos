package: cleo/0.004
homepage: "https://github.com/thaljef/App-Cleo"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: t/compile.t
    description: "Perl Test::More use_ok('App::Cleo') 模块加载测试"

test_package_tests:
  - file: test_cleo.c
    description: "校验 bin/cleo 存在 + perl -c 语法检查通过（间接验证 Perl 模块依赖链可加载）"
    command: "./test_cleo <cleo_bin> <perl>"

assertion_count: 2
