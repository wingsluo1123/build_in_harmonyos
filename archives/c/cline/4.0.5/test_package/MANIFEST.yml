# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cline/4.0.5
homepage: "https://github.com/cline/cline"

# 上游测试命令 (TypeScript project uses vitest, not make check)
upstream_check_command: "npm test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "npm test"

# 上游实际运行的测试程序
upstream_tests:
  - file: vitest.config.ts
    source: cline-4.0.5/vitest.config.ts
    description: "Unit tests via vitest (requires Bun, skipped on OHOS)"
    command: "npm test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cline.py
    description: "Package artifact verification (CLI entry point, SDK dist, package.json)"
    command: "python3 test_cline.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
