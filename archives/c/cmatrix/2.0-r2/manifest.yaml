software: cmatrix
version: 2.0-r2
build_system: autotools
status: published
build_date: '2026-07-14'

source:
  url: https://github.com/abishekvashok/cmatrix/archive/refs/tags/v2.0.tar.gz
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - --without-shared
    - --enable-widec
    - --enable-overwrite
  dependencies:
    - ncurses/6.4
  cc: clang
  cxx: clang++

patch_classification:
  - file: 0001-INSTALL.patch
    type: auto
    platform_only: True
    guard: pending
  - file: 0002-config.guess.patch
    type: auto
    platform_only: True
    guard: pending
  - file: 0003-config.sub.patch
    type: auto
    platform_only: True
    guard: pending

knowledge_gained:
  - HMDFS umask 077 blocks file creation in 700-permission subdirs (E002 variant)
  - config.guess/config.sub replacement for HarmonyOS platform recognition (E007)
  - GitHub downloads require mirror (ghfast.top) on this platform
