build:
  build_system: autotools
  cc: clang
  configure_options:
  - --host=aarch64-unknown-linux-ohos
  cxx: clang++
  dependencies:
  - ncurses/6.6
  system: autotools
build_date: '2026-07-16'
build_status: verified
knowledge_gained:
- CMake 4.x removed cmake_minimum_required(VERSION 2.8) compatibility, use >= 3.5
- R39 exception: use community fork when official upstream lacks release tag
- OHOS system ncurses at /root/sysnc provides curses.h but not ncurses.h (need wrapper)
patch_classification:
  - file: 0001-INSTALL.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'