knowledge_gained:
- CMake 4.x removed cmake_minimum_required(VERSION 2.8) compatibility, use >= 3.5
- R39 exception: use community fork when official upstream lacks release tag
- OHOS sysroot provides curses.h but not ncurses.h (need wrapper in source dir)