software: cmatrix
display: "CMatrix"
description: "终端字符雨屏保，显示滚动文本线条"
category: tool
homepage: "https://github.com/abishekvashok/cmatrix"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
