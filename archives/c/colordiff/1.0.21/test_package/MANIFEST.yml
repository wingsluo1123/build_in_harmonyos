# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: colordiff/1.0.21
homepage: "https://www.colordiff.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# colordiff is a pure Perl script, no upstream test suite exists
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Runs colordiff --version to verify binary is installed and executable"
    command: "colordiff --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
