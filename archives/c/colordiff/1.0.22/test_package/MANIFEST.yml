# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: colordiff/1.0.22
homepage: "https://www.colordiff.org/"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py (inline test)
    description: "消费者 smoke test: colordiff --version"
    command: "conan test (colordiff --version)"

# 测试断言总数
assertion_count: 1
