# 软件级 manifest
# 文件位置: archives/c/colordiff/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: colordiff
display: "colordiff"
description: "A wrapper/replacement for 'diff' producing colourful output (pure Perl script)"
category: utility
homepage: "https://www.colordiff.org/"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "Perl shebang #!/usr/bin/perl 需改为 #!/usr/bin/env perl，OHOS 无 /usr/bin/perl"
    - "纯 Perl 脚本项目，无需编译，只需 make install 安装脚本和配置文件"
    - "Makefile 的 install 目标使用 sed 替换 /etc 为 ETC_DIR，需通过 INSTALL_DIR/MAN_DIR/ETC_DIR 参数指定路径"
  common_dependencies: []

versions:
  "1.0.22":
    status: built
    build_date: "2026-07-15"
    conan_ref: "colordiff/1.0.22"
  "1.0.21-r0":
    status: archived
    build_date: "2026-05-20"
