software: coreimage
version: "latest"
status: built
build_date: "2026-08-06"
build_system: cmake

source:
  url: "https://api.github.com/repos/rahanshaber/coreimage/tarball/master"
  sha256: "84039a1669cd8feb29f9d4a1e71e17e1cd650ea4e61b9c589254cb5edc0e386f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies:
    - "qtbase/6.11.1"
    - "libcprime/latest"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-qt6-compat.patch"
  - "0002-add-cmake-build.patch"

knowledge_gained:
  - "Qt6 QShortcut uses | instead of + for modifier combinations"
  - "QWheelEvent::delta() replaced by angleDelta().y() in Qt6"
  - "QMouseEvent::globalPos() replaced by globalPosition().toPoint() in Qt6"
  - "QLabel::pixmap() returns value not pointer in Qt6"
  - "CMakeLists.txt uses conan-managed find_package for cprime and Qt6"
