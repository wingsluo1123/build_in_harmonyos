software: corepdf
# 版本级 manifest
# 文件位置: archives/c/corepdf/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# Build system (top-level for script compatibility)
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://api.github.com/repos/rahmanshaber/corepdf/tarball/v.1.0"
  sha256: "ad07c1e2128e7c6a9464a6a5b34e3ac2aa47aa93a9945ca2dba173361bcdf540"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_AUTOMOC=ON"
  dependencies:
    - "qtbase/6.11.1"
    - "poppler/25.12.0.3"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-ccorepdf.pro.patch"
  - "0002-corepdf-corepdf.cpp.patch"
  - "0003-corepdf-corepdf.pro.patch"
  - "0004-corepdf-main.cpp.patch"
  - "0005-qpdflib-qpdflib.pro.patch"
  - "0006-qpdflib-qpdfwidget.cpp.patch"
  - "0007-qpdflib-qpdfwidget.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Original corepdf uses Qt Web Engine + PDF.js for rendering; OpenHarmony lacks WebEngine, replaced with poppler-qt6"
  - "qmake on OpenHarmony cannot generate Makefiles; must use cmake instead"
  - "poppler-qt6 Document::load() returns unique_ptr (not raw pointer) in v25.12.0"
  - "poppler conan package has ENABLE_QT6=OFF hardcoded; built local version 25.12.0.3 with qt6 support"
  - "corepdf v1.0 has hardcoded PDF file path; adapted to accept command-line arguments"
  - "pdfjsbridge (WebChannel/WebEngine) replaced entirely by poppler native rendering"
