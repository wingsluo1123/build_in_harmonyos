# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: coturn/4.5.2
homepage: "https://github.com/coturn/coturn"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (bin/turnutils_rfc5769check)
upstream_tests:
  - file: bin/turnutils_rfc5769check
    source: coturn-4.5.2/bin/turnutils_rfc5769check
    description: "RFC 5769 compliance tests: message fingerprint, short-term/long-term credentials, integrity, encoding"
    command: "./bin/turnutils_rfc5769check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 libturnclient STUN 消息 API 可链接和调用 (BINDING/ALLOCATE 请求创建+验证)"
    command: "./test_coturn"

# 测试断言总数 (RFC 5769: 13 checks + 2 oauth checks = 15)
assertion_count: 15
