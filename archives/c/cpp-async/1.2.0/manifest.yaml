# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cpp-async 为 header-only 协程库：Conan 配方用 package_type=header-library + no_copy_source，package() 保留 include/async 相对路径复制"
  - "上游 awaitable_resume_t.h 的 C++20 concepts 分支用 lvalue 探测非成员 operator co_await（形参为 rvalue 引用）在 clang 下探测失败，需改 std::declval<T>()"
  - "上游测试辅助头 constexpr await_suspend 内含 assert(false)，在 C++20 下 ill-formed，需移除 constexpr"
