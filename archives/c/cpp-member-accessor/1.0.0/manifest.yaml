# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: cpp-member-accessor

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hliberacki/cpp-member-accessor"

  # 源码校验和
  sha256: "10f9ceedc96d2ff3dc95ed0dba50708739107ccbe659d5ca4e0250f8c0ac824d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "header-only CMake INTERFACE 库：package_type 用 header-library，package_info 置空 libs/bindirs/libdirs"
- "test_package 访问私有成员的消费者测试必须用 MakeProxy + accessMember/callFunction 惯用法；直接构造 Proxy 静态成员会 SegFault"
- "上游 CMake 无 EXAMPLES=OFF 默认值时需在 generate() 显式关掉示例避免构建多余目标"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
