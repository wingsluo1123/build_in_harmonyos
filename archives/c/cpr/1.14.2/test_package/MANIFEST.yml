# test_package/MANIFEST.yml
# libcpr 是 C++ 库，无上游测试套件
# test_package 验证消费者视角的编译和链接

package: cpr/1.14.2
homepage: "https://github.com/libcpr/cpr"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_cpr.cpp
    description: "Verify cpr library can be compiled and linked"
    command: "./test_cpr"

assertion_count: 1