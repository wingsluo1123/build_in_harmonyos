# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: crosstool-ng/1.28.0
homepage: "https://crosstool-ng.github.io/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check passed with no tests to run)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 - 验证 ct-ng 命令行工具可执行"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 2
