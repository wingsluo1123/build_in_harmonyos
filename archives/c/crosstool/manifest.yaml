software: crosstool
display: "crosstool"
description: "可定制的交叉工具链生成器（跟踪上游 crosstool-ng），通过 ct-ng 编排交叉编译工具链的下载、配置与构建"
category: build-tool
homepage: "https://crosstool-ng.github.io/"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建（configure + make），无需源码补丁"
    - "OHOS 下固定 --build=aarch64-unknown-linux-gnu，绕过随包 config.guess 对 OHOS 三元组的识别缺失（历史 E007/E072 经验）"
    - "命令行工具包：交付 bin/ct-ng，不提供开发库"
  common_dependencies: []

versions:
  "1.28.0":
    status: built
    build_date: "2026-09-26"
