# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: csvq/1.18.1
homepage: "https://github.com/mithrandie/csvq"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# csvq is a Go project with no standard test suite (no make check)
upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# csvq has Go unit tests but no integration test suite
upstream_tests:
  - file: lib/ (Go unit tests)
    source: csvq-1.18.1/lib/
    description: "Go unit tests for csvq library (not run in conan build)"
    command: "go test ./..."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: --version, SELECT *, WHERE, COUNT/AVG"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
