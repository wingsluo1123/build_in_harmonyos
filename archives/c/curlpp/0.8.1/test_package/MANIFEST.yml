# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: curlpp/0.8.1
homepage: "https://github.com/jpbarrette/curlpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# curlpp 0.8.1 无自动化测试套件 (无 make check / ctest target)
# 上游 examples/ 目录含示例程序但非正式测试
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "curlpp lifecycle API smoke test (initialize/Easy/setOpt/terminate)"
    command: "./test_curlpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
