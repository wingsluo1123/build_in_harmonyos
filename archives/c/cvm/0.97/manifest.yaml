knowledge_gained:
  - "SPAC-generated compile/load/ltcompile/ltload/makeshlib wrappers must derive compiler, flags, sysroot and dependency search paths from Conan rather than host defaults (ref: DRAFT-7324-BGLIBS-DJB-TWO-STAGE-CROSS-BUILD)"
  - "Libtool's uninstalled command launchers retained a build-cache RUNPATH when copied directly from .libs; packaging strips private debug paths, removes effective dynamic-loader metadata and re-signs all 22 shipped ELFs, which are then checked for SONAME, NEEDED closure and exactly one signature (ref: DRAFT-7324 and E236)"
  - "A two-channel command transport must acquire both pipes before forking and release the first pipe if the second allocation fails (ref: DRAFT-CVM-097-TWO-PIPE-FAILURE-ATOMICITY)"
  - "A four-scenario compilation-unit syscall matrix proves first-pipe, second-pipe, fork-failure and parent-success ownership transitions, including exact close order and no duplicate or invalid close; restoring the upstream -2 check makes the matrix fail (ref: DRAFT-CVM-097-TWO-PIPE-FAILURE-ATOMICITY)"
  - "All 52 named upstream tests and all 76 compare invocations run on OHOS after supplying published sqlite3/cdb test fixtures and selecting an AF_UNIX-capable temporary mount (ref: E386)"

