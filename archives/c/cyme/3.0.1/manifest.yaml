software: cyme
# 版本级 manifest
# 文件位置: archives/c/cyme/3.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.1"
status: published
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/tuna-f1sh/cyme/archive/refs/tags/v3.0.1.tar.gz"
  sha256: "1d0f712d39f5d747f900829b6b9cccbfa943637b4c14d60e8a6a505162174c82"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cargo
  configure_options:
    - "--no-default-features"
    - "--features nusb,regex_icon,watch,bin"
  dependencies:
    - "rust/1.96.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "cyme 是 Rust/cargo 项目，非 C/C++，使用 cargo build --release 编译"
  - "默认 features 包含 udev (依赖 udevrs crate)，但 udevrs 在 OHOS 上有 libc 类型不兼容：SIOCGIFNAME 是 u64 而非 i32，msghdr 有私有字段 __pad1/__pad2，msg_controllen 期望 u32 而非 usize"
  - "解决方案：禁用 udev feature，使用 --no-default-features --features nusb,regex_icon,watch,bin，nusb 是纯 Rust USB 库不需要 C 绑定"
  - "cargo 二进制需要 LD_LIBRARY_PATH 包含 OpenSSL 库路径（通过 rustc --print sysroot 动态获取）才能运行"
  - "doc/ 目录包含预生成的 man 页和 shell 补全文件，可直接安装"
