# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cyme/3.0.1
homepage: https://github.com/tuna-f1sh/cyme

# 上游测试命令
upstream_check_command: "cargo test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# cargo test 超时（>120s），跳过；使用 smoke test 替代
upstream_tests:
  - name: "smoke-version"
    source: test_package/test.sh
    description: "cyme --version 验证版本输出"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "cyme --version smoke test"
    command: "bash test.sh"

# 测试断言总数 (近似值)
assertion_count: 1
