software: cyrus-sasl
version: "2.1.28"
status: adapted
build_system: autotools
source:
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
build:
  options:
    - "--disable-sample"
    - "--disable-shared"
    - "--enable-static"
    - "--with-staticsasl"
    - "--with-dblib=none"
    - "--without external auth backends"
libs:
  - sasl2
requires: []
test_package:
  type: cmake-consumer
  checks: 6
adaptation_paths:
  - A
  - C
notes:
  - "Packages core libsasl2 and disables service/back-end closures such as saslauthd, PAM, LDAP, SQL, Kerberos/GSSAPI, DB, OpenSSL, and DES."
  - "Path C is justified by SASL mechanism negotiation, plugin/back-end matrix, system authentication integration, and protocol-service validation requirements."
