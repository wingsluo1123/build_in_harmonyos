software: czkawka
version: "11.0.1"
status: built
build_date: "2026-08-06"
build_system: cargo
configure_options: ""
build_commands:
  - cargo build --release -p czkawka_cli
install_commands:
  - mkdir -p $TEST_PREFIX/$DEFAULT_PREFIX/bin
  - cp target/release/czkawka_cli $TEST_PREFIX/$DEFAULT_PREFIX/bin/
dependencies: []
knowledge_gained:
  - "Rust 工具链通过 Harmonybrew 安装 (brew install rust)"
  - "HarmonyOS 缺少 cc，需创建 cc wrapper 指向 clang"
  - "cargo 依赖 Rust crate (非 Conan 包)，通过 Cargo.lock 管理"
