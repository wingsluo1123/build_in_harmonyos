# test_package/MANIFEST.yml
# Upstream test declaration file (required by CI L0e)

package: czmq/4.2.1
homepage: "https://github.com/zeromq/czmq"

# Upstream test command
upstream_check_command: "make check"

# conanfile.py build() method - upstream tests not integrated in build
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: src/czmq_selftest.c
    source: czmq-4.2.1/src/czmq_selftest.c
    description: "czmq selftest covering all modules"
    command: "./czmq_selftest"

# test_package consumer-side test
test_package_tests:
  - file: test.c
    description: "Consumer test: zhash_new, zhash_insert, zhash_lookup, zhash_size, zhash_destroy"
    command: "./test_czmq"

# Approximate assertion count
assertion_count: 6
