software: czmq
display: "CZMQ"
description: "The high-level C binding for ZeroMQ: zsock/zframe/zmsg convenience classes, zactor services and generic data structures"
category: network
homepage: "https://github.com/zeromq/czmq"
license: MPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建需提升 cmake_minimum_required 以兼容 CMake 4.x（4.2.1 补丁）"
    - "zproject 生成的 Findlibzmq.cmake 为 MODULE 模式，需注入 zeromq 包 include/lib 搜索路径"
    - "产物 libczmq.so 与 bin/zmakecert 需 OHOS ELF 自签名"
    - "6 个可选依赖（uuid/systemd/lz4/libcurl/nss/libmicrohttpd）显式关闭，特性集确定"
  common_dependencies:
    - zeromq

versions:
  "4.2.1":
    status: built
    build_date: "2026-10-09"
    conan_ref: "czmq/4.2.1"
