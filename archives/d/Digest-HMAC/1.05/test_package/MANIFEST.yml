# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: digest-hmac/1.05
homepage: "https://metacpan.org/pod/Digest::HMAC"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/rfc2202.t
    source: Digest-HMAC-1.05/t/rfc2202.t
    description: "RFC 2202 HMAC-MD5 and HMAC-SHA-1 test vectors (14 assertions)"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/rfc2202.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Perl inline test: RFC 2202 HMAC-MD5 and HMAC-SHA1 test case 1"
    command: "perl -e '...'"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
