# test_package/MANIFEST.yml
# daemontools has a DJB test suite (rts target) but it hangs on OHOS (FIFO/supervise)
package: daemontools/0.76
homepage: "https://cr.yp.to/daemontools.html"

# Upstream test suite exists but cannot run on OHOS (FIFO/supervise tests hang)
upstream_check_command: "make rts (skipped — FIFO/supervise tests hang on OHOS)"
upstream_test_in_build: false
upstream_test_command: "N/A (skipped on OHOS, patch 0001)"

# No upstream test programs included in test_package
upstream_tests: []

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verifies tai64n/tai64nlocal timestamp conversion and envdir environment variable handling"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 5
