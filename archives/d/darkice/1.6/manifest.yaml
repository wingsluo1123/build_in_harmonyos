software: darkice
version: "1.6"
status: published
build_date: "2026-08-06"
build_system: autotools

source:
  url: "https://api.github.com/repos/rafael2k/darkice/tarball/v1.6"
  sha256: "9eb2adac1999e6da0552e59ff7b0cba0a360b382934ec5f16a5cf5061badd15e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-vorbis"
    - "--with-opus"
    - "--with-flac"
    - "--with-lame"
    - "--without-twolame"
    - "--without-pulseaudio"
  dependencies:
    - libogg (conan)
    - libvorbis (conan)
    - opus (conan)
    - flac (conan)
    - lame (conan)
    - alsa-lib (system cmd-pkg, auto-detected)
  cc: clang
  cxx: clang++
  bootstrap: "autoreconf -fi (需要ACLOCAL_PATH包含pkg.m4)"

conan:
  recipe: conanfile.py
  conandata: conandata.yml
  test_package: test_package/
  commands_json: true

patches_applied: []

knowledge_gained:
  - "SVN-imported仓库的源码在darkice/trunk/子目录中，conanfile.py source()需要手动提取"
  - "autoreconf需要ACLOCAL_PATH设置pkg.m4才能正确展开PKG_CHECK_MODULES"
  - "autoconf的config.status使用umask 077在HarmonyOS上触发SELinux拒绝(E046)，需patch为umask 022"
  - "darkice对lame/faac使用LA_SEARCH_LIB而非pkg-config检测，需--with-lame-prefix指向依赖包目录"
  - "libogg版本冲突：flac/1.4.3需要1.3.5，libvorbis/1.3.7需要1.3.6，用override=True解决"
  - "alsa-lib/1.2.16.1 conan配方topology模块有链接错误(snd_lib_log未定义)，暂用系统cmd-pkg替代"
  - "GitHub tarball API URL缺少.tar.gz扩展名，conan get()会误判为zip，需在conandata.yml指定filename"
  - "twolame和pulseaudio在制品仓和cmd-pkgs中均不可用，configure时--without-*禁用"

