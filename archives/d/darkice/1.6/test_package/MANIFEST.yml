# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: darkice/1.6
homepage: "https://github.com/rafael2k/darkice"

# darkice has no upstream test suite (no make check / make test target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: darkice -V (version) and darkice -h (help) — verifies the binary is installed and functional"
    command: "bash test.sh"

assertion_count: 2
