# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dash/0.5.12
homepage: "http://gondor.apana.org.au/~herbert/dash/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: builtins/mkbuiltins
    source: dash-0.5.12/src/builtins/mkbuiltins
    description: "builtins 表生成"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 dash 二进制可执行"
    command: "./test_dash"

# 测试断言总数 (近似值)
assertion_count: 1
