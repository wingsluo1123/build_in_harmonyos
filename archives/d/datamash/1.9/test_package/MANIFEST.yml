# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: datamash/1.9
homepage: "https://www.gnu.org/software/datamash/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: src/datamash.c
    source: datamash-1.9/src/datamash.c
    description: "datamash 主程序"
    command: "make check"

test_package_tests:
  - file: test.sh
    description: "功能测试: sum/count/max 操作"
    command: "sh test.sh <datamash_bin>"

assertion_count: 3
