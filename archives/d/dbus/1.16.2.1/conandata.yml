sources:
  "1.16.2.1":
    url: "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz"
    sha256: "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2"
patches:
  "1.16.2.1":
    - patch_file: "patches/0001-bus-policy.c.patch"
      patch_description: "Defer NSS group lookup only when original policy has no group or console rule"
    - patch_file: "patches/0002-dbus-dbus-sysdeps-unix.c.patch"
      patch_description: "Keep complete portable close/CLOEXEC fallback when the build disables unsupported fast paths"
    - patch_file: "patches/0003-dbus-dbus-userdb-util.c.patch"
      patch_description: "Parse numeric UID without manufacturing an NSS account"
    - patch_file: "patches/0004-dbus-dbus-userdb.c.patch"
      patch_description: "Defer process passwd lookup until an operation needs it"
    - patch_file: "patches/0005-test-corrupt.c.patch"
      patch_description: "Use configured private socket root"
    - patch_file: "patches/0006-test-fdpass.c.patch"
      patch_description: "Use one portable SCM_RIGHTS batching path while retaining aggregate255 and isolation oracles"
    - patch_file: "patches/0007-test-loopback.c.patch"
      patch_description: "Use configured private root and retain address-prefix assertions"
    - patch_file: "patches/0008-test-relay.c.patch"
      patch_description: "Use configured private socket root"
    - patch_file: "patches/0009-test-data-valid-config-files-system-tmp-session-like-system.conf.in.patch"
      patch_description: "Use original configured TEST_LISTEN in system-like fixture"
    - patch_file: "patches/0010-test-internals-refs.c.patch"
      patch_description: "Escape configured private socket root"
    - patch_file: "patches/0011-test-internals-server-oom.c.patch"
      patch_description: "Use configured private socket root in original OOM test"
    - patch_file: "patches/0012-meson.build.patch"
      patch_description: "Bind one explicit close_range execution-domain option to both libc and raw syscall fast paths"
    - patch_file: "patches/0013-meson_options.txt.patch"
      patch_description: "Retain upstream auto by default and expose capability-based fast-path disablement"
    - patch_file: "patches/0014-test-test-utils-glib.c.patch"
      patch_description: "Reap the exact spawned OHOS test child with real waitpid, preserving original timeout and test oracles"
