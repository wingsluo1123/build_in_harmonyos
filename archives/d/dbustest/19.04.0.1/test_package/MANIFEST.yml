# test_package/MANIFEST.yml — dbustest 19.04.0.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: dbustest/19.04.0.1
homepage: "https://launchpad.net/dbus-test-runner"

# 上游测试：tests/ 目录基于 Makefile 的测试（需运行 dbus-daemon 隔离环境）；
# dbus/1.14.10.1 override 提供 dbus-daemon，build() 真实执行 make check，
# 实测 31 项：PASS 11 + XFAIL 16 + FAIL 4（OHOS 沙箱环境限制，详见 notes.md）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# test_package 消费者测试（R34 真实产物 + 编译链接 + 构造/析构 API 校验）：
# 构造/析构 API（dbus_test_task_new/service_new/process_new/add_task）不依赖
# 运行中的 D-Bus 会话，本地实测通过（析构打印 "DBus daemon: Shutdown"）。
test_package_tests:
  - file: test_dbus_test_runner.c
    description: "CMake 编译链接 libdbustest + glib + dbus-glib（dbus-glib::dbus-glib），编译链接成功即验证 dbus_test_task_new/dbus_test_service_new/dbus_test_process_new 等 API 可用；不调用 dbus_test_service_run（无需运行 daemon），构造/析构实测通过（1/1）"
    command: "conan create 内自动执行（CMake build + test() 编译链接校验，构造/析构 API 实测通过）"
