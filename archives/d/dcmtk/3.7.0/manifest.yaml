software: dcmtk
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.7.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.7.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"
compile_date: "2026-06-30"
build_system: cmake
compile_date: "2026-06-30"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/DCMTK/dcmtk/archive/refs/tags/DCMTK-3.7.0.tar.gz"

  # 源码校验和
  sha256: "5bb3ec8317dc465788bed2ca789e76d03ae5848c9381cce3b14c1a3f8b6aca56"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DDCMTK_WITH_TIFF=ON"
    - "-DDCMTK_WITH_PNG=ON"
    - "-DDCMTK_WITH_XML=ON"
    - "-DDCMTK_WITH_ZLIB=ON"
    - "-DDCMTK_WITH_OPENSSL=ON"
    - "-DDCMTK_WITH_OPENJPEG=ON"
    - "-DDCMTK_WITH_THREADS=ON"
    - "-DDCMTK_USE_UNIX_SOCKET_QUEUE"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "zlib/1.3.1@ohpcd/stable"
    - "openssl (system)"
    - "libpng (system)"
    - "libtiff (system)"
    - "libjpeg-turbo (system)"
    - "libxml2 (system)"
    - "openjpeg (system)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "E092: CMake 不识别 HarmonyOS 平台，需通过 user_toolchain 设置 CMAKE_SYSTEM_NAME=Linux"
    - "HarmonyOS clang target triple (aarch64-unknown-linux-ohos) 触发 CMAKE_CROSSCOMPILING=TRUE，需设置 CMAKE_CROSSCOMPILING_EMULATOR 使 try_run() 可用"
    - "HarmonyOS 不提供 POSIX 消息队列 (mq_open)，DCMTK 使用 -DDCMTK_USE_UNIX_SOCKET_QUEUE 替代"
    - "Conan cache 中的二进制受 HarmonyOS 安全限制无法执行，L2 smoke test 需符号链接到已 bless 的路径"
