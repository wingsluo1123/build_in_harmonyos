software: ddate
display: "ddate Discordian Date Converter"
description: "Discordian 日期转换器 — 将公历日期转换为 Discordian 历法日期"
category: utility
homepage: "https://github.com/bo0ts/ddate"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 4.x 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 参数兼容旧版 cmake_minimum_required(2.8)"
    - "终端工具必须静态链接: -DCMAKE_EXE_LINKER_FLAGS=-static (R26)"
    - "无 CTest 测试套件，通过 smoke test 和 Conan test_package 验证"
    - "无外部依赖，仅依赖 musl libc"
  common_dependencies: []

versions:
  "0.2.2":
    status: published
    build_date: "2026-06-26"
    published_as: ddate
    source_url: "https://github.com/bo0ts/ddate/archive/refs/tags/v0.2.2.tar.gz"
