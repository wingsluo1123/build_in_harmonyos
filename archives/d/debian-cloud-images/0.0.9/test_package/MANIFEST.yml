#   - 无 tox.ini / pytest.ini / noxfile.py / setup.py / pyproject.toml（无 pytest/tox 套件）
#   - debian/rules 仅 `dh $@`（无任何测试 target）；唯一可执行逻辑是 debian/bin/make-substvars
# 结论：上游**无自动化测试入口**，N=0。清点命令与原始输出见 reports/upstream-test-gap-statement.md。
