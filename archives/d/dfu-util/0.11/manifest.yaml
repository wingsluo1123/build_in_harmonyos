software: dfu-util
# 版本线 manifest 模板
# 文件位置: archives/{letter}/dfu-util/0.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.11"

# 编译状态
# published | built | failed | archived
status: archived

# 编译日期 (YYYY-MM-DD)
build_date: "2026-07-15"

# Conan 引用
conan_ref: "dfu-util/0.11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Stefan-Schmidt/dfu-util/archive/refs/tags/v0.11.tar.gz"

  # 源码校验和 (待实际构建时填充)
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/usr/local"

  # 编译依赖列表 (格式: name/version)
  dependencies:
    - "libusb/1.0.27"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "dfu-util 使用 autotools 构建系统；GitHub 源码归档未含预生成 configure，需运行 autoreconf -fi 重新生成"
  - "dfu-util 通过 pkg-config 检测 libusb-1.0，需确保 PKG_CONFIG_PATH 指向 libusb"
  - "产物为终端工具 dfu-util/dfu-suffix/dfu-prefix，无可链接库 (cpp_info.libs = [])"
  - "dfu-util 0.11 在 GitHub 仓库 (Stefan-Schmidt/dfu-util) 未打 tag，最新 tag 为 v0.7；0.11 release 官方发布于 SourceForge"
