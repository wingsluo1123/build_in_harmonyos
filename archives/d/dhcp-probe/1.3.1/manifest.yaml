name: dhcp-probe
version: "1.3.1"
software: dhcp-probe
category: network
description: Attempts to discover DHCP and BootP servers on a network
license: GPL-2.0-or-later
homepage: https://www.net.princeton.edu/software/dhcp_probe/
source_url: https://www.net.princeton.edu/software/dhcp_probe/dhcp_probe-1.3.1.tar.gz
build_system: autotools
build_date: "2026-08-06"
status: built

build:
  system: autotools
  compiler: clang
  date: 2026-08-06
  platform: HarmonyOS
  arch: aarch64

  steps:
    - description: Patch config.guess/config.sub for OHOS
      details: |
        Add HarmonyOS system detection to config.guess (echo + exit)
        Add linux-ohos to config.sub OS pattern lists

    - description: Patch configure mktemp workaround
      details: |
        HarmonyOS restricts file creation in mktemp-created directories.
        Patch configure to use a pre-created fixed temp directory (.cstmp).

    - description: Configure with dependency paths
      details: |
        ./configure --prefix=$PREFIX \
          --with-pcap-include=$LIBPCAP_INC \
          --with-pcap-lib=$LIBPCAP_LIB \
          --with-libnet-include=$LIBNET_INC \
          --with-libnet-lib=$LIBNET_LIB

    - description: Build and install
      details: |
        make -j1 && make install

dependencies:
  runtime:
    - name: libpcap
      version: "1.10.6"
      category: network
      notes: Conan package from ohpcd remote

    - name: libnet
      version: "1.2"
      category: network
      notes: Required for packet construction; libnet_cq_end_loop() included

patches:
  - name: 0001-config-config.guess.patch
    description: Add HarmonyOS detection to config.guess
    status: applied
  - name: 0002-config-config.sub.patch
    description: Add linux-ohos to config.sub OS pattern lists
    status: applied
  - name: 0003-configure-mktemp-workaround.patch
    description: Workaround HarmonyOS mktemp temp directory permission issue
    status: applied

packaging:
  format: conan
  arch: aarch64
  platform: ohos

  contents:
    - path: bin/dhcp_probe
      type: binary
      description: DHCP probe tool

status: built
date: 2026-08-06

notes: |
  Conan adaptation of previously manually-compiled dhcp-probe.
  - config.guess/config.sub patched for OHOS platform detection
  - configure mktemp workaround for HarmonyOS temp directory permission issue
  - config.status runtime patch (generated file, can't pre-patch)
  - Default paths (/etc, /var/run) replaced with package prefix paths at build time
  - libnet_cq_end_loop() already present in libnet 1.2 from cmd-pkgs
  - No automated test suite; test_package verifies binary runs with -v
