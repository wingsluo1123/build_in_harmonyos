# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: dhcp-probe/1.3.1
homepage: "https://www.net.princeton.edu/software/dhcp_probe/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# dhcp-probe has no automated test suite; make check is a no-op
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify dhcp_probe binary runs and reports version"
    command: 'dhcp_probe -v'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
