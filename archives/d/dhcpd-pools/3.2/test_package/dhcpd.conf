# Test dhcpd.conf — covers subnet/pool/range patterns
shared-network example1 {
    subnet 10.0.0.0 netmask 255.255.255.0 {
        pool {
            range 10.0.0.1 10.0.0.20;
        }
    }
    subnet 10.1.0.0 netmask 255.255.255.0 {
        pool {
            range 10.1.0.1 10.1.0.20;
        }
    }
}
shared-network example2 {
    subnet 10.2.0.0 netmask 255.255.255.0 {
        pool {
            range 10.2.0.1 10.2.0.20;
        }
    }
}
subnet 10.4.0.0 netmask 255.255.255.0 {
    pool {
        range 10.4.0.1 10.4.0.20;
    }
}
# Empty pool for edge-case testing
subnet 10.5.0.0 netmask 255.255.255.0 {
    pool {
        range 10.5.0.1 10.5.0.10;
    }
}
# Single-IP pool for boundary testing
subnet 10.6.0.0 netmask 255.255.255.0 {
    pool {
        range 10.6.0.1 10.6.0.1;
    }
}
