sources:
  url: "http://deb.debian.org/debian/pool/main/d/dhcpstarv/dhcpstarv_0.2.2.orig.tar.gz"
  sha256: "95c6bbffab681c71bba49eccee955b3264f99c295802f1476617c95ff343c31f"

patches:
  - patch_file: "patches/0000-add-autotools-generated.patch"
    patch_description: "预生成 autotools 文件（configure/aclocal.m4/Makefile.in/build-aux），CI 无 automake 时直接使用"
    patch_type: "portability"
  - patch_file: "patches/0001-configure-hmdfs-tmpdir.patch"
    patch_description: "HMDFS 临时目录修复：config.status 改用源码内 .tmp 目录并去掉 umask 077"
    patch_type: "portability"
  - patch_file: "patches/0002-dhcp.c-udphdr.patch"
    patch_description: "OHOS musl struct udphdr 成员为 BSD 风格 uh_dport（glibc dest 不存在）"
    patch_type: "portability"
  - patch_file: "patches/0003-udp.c-udphdr.patch"
    patch_description: "OHOS musl struct udphdr 成员：source/dest/len/check -> uh_sport/uh_dport/uh_ulen/uh_sum"
    patch_type: "portability"
  - patch_file: "patches/0004-sock.c-select.patch"
    patch_description: "sock.c 补 <sys/select.h>/<sys/time.h> 头文件（fd_set/select/timeval 声明）"
    patch_type: "portability"
