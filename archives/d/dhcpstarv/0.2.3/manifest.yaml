# 版本级 manifest — dhcpstarv 0.2.3
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.3"

# 软件名
software: "dhcpstarv"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-04"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub sgeto/dhcpstarv master，AC_INIT 声明 0.2.3）
  url: "https://github.com/sgeto/dhcpstarv/archive/refs/heads/master.tar.gz"

  # 源码校验和（已核验）
  sha256: "fdd6e3a406a70ad1a2e4f926503d8f6063af3cd9a8a70bc0a152de97a6f0d701"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
  - "--disable-silent-rules"

  # 编译依赖列表（格式: name/version）— 无外部依赖（直接 PF_PACKET raw socket，不依赖 libpcap）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "patches/0001-configure-hmdfs-tmpdir.patch"
- "patches/0002-dhcp.c-udphdr.patch"
- "patches/0003-udp.c-udphdr.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS musl netinet/udp.h 中 struct udphdr 采用 BSD 风格成员名 uh_sport/uh_dport/uh_ulen/uh_sum，与 glibc 的 source/dest/len/check 不同，直接访问 udph->dest 报 no member named 'dest'（新增 E215-draft-4AA8 草稿）"
- "HMDFS 上 config.status 的 mktemp -d ./confXXXXXX（umask 077）报 Permission denied，需改用源码内 .tmp 目录并去掉 umask 077（对齐 apcupsd 既有修复）"
- "dhcpstarv 是命令行工具（非库），package_type=application，上游无测试框架，test_package 自备 smoke test（--help 退出码 0）"
