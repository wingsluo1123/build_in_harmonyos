# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dhcpstarv/0.2.3
homepage: "https://github.com/sgeto/dhcpstarv"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# dhcpstarv 0.2.3 源码无 test/、tests/ 目录，Makefile.am 无 check 目标，
# 仅 bin_PROGRAMS + man_MANS。核验依据：源码包 find 无 test 目录、
# grep Makefile.am 无 check target、configure.ac 无测试宏。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 dhcpstarv --help 验证二进制可执行且打印版本/Usage（退出码 0）"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
