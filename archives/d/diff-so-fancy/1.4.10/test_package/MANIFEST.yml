# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: diff-so-fancy/1.4.10
homepage: "https://github.com/so-fancy/diff-so-fancy"

# Upstream test command (for analysis)
upstream_check_command: "bats test/diff-so-fancy.bats"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: test/diff-so-fancy.bats
    source: diff-so-fancy-1.4.10/test/diff-so-fancy.bats
    description: "Bats-based functional tests for diff formatting"
    command: "bats test/diff-so-fancy.bats"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_diff_so_fancy.py
    description: "Pipes diff output through diff-so-fancy and verifies formatted output"
    command: "python3 test_diff_so_fancy.py"

# Approximate assertion count
assertion_count: 3
