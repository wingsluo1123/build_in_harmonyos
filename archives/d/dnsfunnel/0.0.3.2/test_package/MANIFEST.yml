# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dnsfunnel/0.0.3.2
homepage: "https://skarnet.org/software/dnsfunnel/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# dnsfunnel 上游 TEST_BINS 为空 (package/targets.mak 无 TEST_BINS 条目、
# src/tests/ 目录不存在)，make check 只循环空列表，因此上游 0 个注册测试；
# tools/run-test.sh 是给未来测试二进制用的驱动，当前没有 baseline 可跑。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行真实安装的 dnsfunneld / dnsfunnel-translate：usage 路径退出码 100；resolv.conf 解析写出缓存列表（回环地址按默认规则剔除）；缺文件路径退出码 111；dnsfunneld 在非特权回环端口绑定并给出 -1 就绪信号；端到端真实 DNS 转发（dig +noedns 经 127.0.0.1:<port> 取回 A 记录，外网 DNS 探针不可达时显式 [skip] 并说明原因）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 1 usage 退出码 + 1 缓存列表内容 + 1 缺文件退出码 + 1 监听/就绪 + 1 端到端转发
assertion_count: 5
