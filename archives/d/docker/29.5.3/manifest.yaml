software: docker
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/29.5.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "29.5.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-16"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/docker/cli/archive/refs/tags/v29.5.3.tar.gz"

  # 源码校验和
  sha256: "7608d82f33ce0ebbbed5bf8f6997319375c30a46d325496f3e8974c9a0c8ce6b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=1"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOTOOLCHAIN=local"
    - "DISABLE_WARN_OUTSIDE_CONTAINER=1"
    - "GIT_DISCOVERY_ACROSS_FILESYSTEM=1"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: "clang"
  cxx: "clang++"

  # Go 编译命令
  go_build_cmd: "go build -mod=vendor -o build/docker -tags grpcnotrace -ldflags '-X github.com/docker/cli/cli/version.GitCommit=29.5.3 -X github.com/docker/cli/cli/version.BuildTime=2026-07-16T04:00:00Z -X github.com/docker/cli/cli/version.Version=29.5.3' github.com/docker/cli/cmd/docker"
  go_version: "1.25.0"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "docker/cli 使用 vendor.mod 而非 go.mod，需手动复制为 go.mod"
  - "Go >= 1.23 要求满足 vendor 依赖版本要求"
  - "HarmonyOS 上需要签名 Go 工具链所有 ELF 才能执行"
  - "E124: Go linker mmap 在 HMDFS 上失败，输出需写到 /data 分区"
  - "CGO_ENABLED=1 使用系统链接器替代 Go 内部链接器"
  - "vendor.mod 中 tool 指令需移除"
