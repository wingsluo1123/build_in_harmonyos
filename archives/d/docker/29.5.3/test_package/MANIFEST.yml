# test_package/MANIFEST.yml
# Docker CLI has no traditional test suite - it's a Go binary
# The test runs the binary directly (R34: test must depend on tested package)

package: docker/29.5.3
homepage: "https://www.docker.com"

# Docker CLI is a Go project with no 'make check' target
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (Go binary, no test harness)
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Run docker --version to verify binary works"
    command: "docker --version"

# Approximate assertion count
assertion_count: 1
