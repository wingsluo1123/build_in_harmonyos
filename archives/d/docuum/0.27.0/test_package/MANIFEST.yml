# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: docuum/0.27.0
homepage: "https://github.com/stepchowfun/docuum"

# 上游测试命令
upstream_check_command: "cargo test"
upstream_test_in_build: false
upstream_test_command: "cargo test"

# 上游实际运行的测试程序
upstream_tests:
  - file: "tests/"
    source: "docuum-0.27.0.tar.gz/tests/"
    description: "Rust 单元测试（cargo test）"
    command: "cargo test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "执行 docuum --help/--version 验证二进制可运行"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
