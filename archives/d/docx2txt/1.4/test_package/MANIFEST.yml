# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: docx2txt/1.4
homepage: "https://sourceforge.net/projects/docx2txt/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# docx2txt is a Perl script tool with no automated test suite
upstream_tests:
  - file: docx2txt.pl
    source: docx2txt-1.4/docx2txt.pl
    description: "Perl script for extracting text from DOCX files"
    command: "perl docx2txt.pl -h"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify docx2txt.pl shows usage, docx2txt.sh and config exist"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
