patches:
  - patch_file: "patches/0001-src-cli-auth.c.patch"
    patch_description: "Guard getpass() and use a stdin fallback when OHOS does not provide it"
    patch_type: "portability"
  - patch_file: "patches/0002-src-common-session.c.patch"
    patch_description: "Guard getspnam() when OHOS provides shadow.h without the function"
    patch_type: "portability"
