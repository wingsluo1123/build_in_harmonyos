    patch_description: "Fix the upstream test server option and close parameterized TCP listeners"
    patch_type: "test"
  - patch_file: "patches/0004-tests-use-explicit-client-key.patch"
    patch_description: "Use the generated client key for Dropbear and AsyncSSH integration tests"
    patch_type: "test"
