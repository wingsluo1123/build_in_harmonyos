version: "2025.88"
status: built
build_date: "2026-07-18"
conan_ref: "dropbear/2025.88"

source:
  url: "https://matt.ucc.asn.au/dropbear/releases/dropbear-2025.88.tar.bz2"
  sha256: "783f50ea27b17c16da89578fafdb6decfa44bb8f6590e5698a4e4d3672dc53d4"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    Linux: []
    OHOS:
      - "--disable-zlib"
      - "--disable-syslog"
      - "--disable-shadow"
      - "--disable-openpty"
      - "--disable-lastlog"
      - "--disable-utmp"
      - "--disable-utmpx"
      - "--disable-wtmp"
      - "--disable-wtmpx"
      - "--disable-loginfunc"
      - "--disable-pututline"
      - "--disable-pututxline"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-cli-auth.c.patch"
  - "0002-src-common-session.c.patch"
  - "0003-tests-fix-server-option-and-close-sockets.patch"
  - "0004-tests-use-explicit-client-key.patch"
  - "0005-ohos-config-guess.patch"
  - "0006-configure-use-tmpdir.patch"
  - "0007-tests-avoid-psutil.patch"
  - "0008-tests-avoid-asyncssh-virtualenv.patch"

knowledge_gained:
  - "The official release is a bzip2 archive and must use a fixed SHA-256."
  - "Dropbear bundles libtomcrypt and libtommath, so no Conan dependency is required."
  - "OHOS may expose shadow.h while lacking getspnam(); the recipe disables shadow and keeps the guarded fallback."
  - "OHOS does not provide crypt(); only OHOS builds generate localoptions.h to disable server password authentication while retaining public-key authentication. Linux builds retain the upstream default."
  - "The upstream make check target passes 51 tests and has one expected failure on the native Linux build."
  - "AsyncSSH requires an OpenSSH-format copy of the generated Dropbear private key."
  - "OHOS config.status temporary files must use the recipe-provided writable TMPDIR."
  - "The ASLR test uses /proc instead of psutil because OHOS cannot build the pinned psutil dependency."
  - "asyncssh is removed from the upstream test venv because it pulls cryptography, whose wheel build fails under HMDFS getcwd; test_concurrent is skipped when asyncssh is unavailable."
  - "For OHOS builds the recipe inlines a rewriter of test/Makefile.in's venv/bin/pytest rule in build(): the venv is created with --without-pip --system-site-packages so HMDFS getcwd does not crash ensurepip mid-bootstrap; the already-installed system pytest is reused via the inherited site-packages. The fix is inlined because Conan's vendored patch_ng rejected a standalone diff for Makefile.in."
