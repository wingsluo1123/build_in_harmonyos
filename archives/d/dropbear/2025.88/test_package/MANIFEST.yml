package: dropbear/2025.88
homepage: "https://matt.ucc.asn.au/dropbear/dropbear.html"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: test/test_dropbear.py
    source: dropbear-2025.88/test/test_dropbear.py
    description: "SSH server/client channel, forwarding and session behavior"
    command: "pytest test/test_dropbear.py"
  - file: test/test_channels.py
    source: dropbear-2025.88/test/test_channels.py
    description: "Channel exit codes, data round trips, PTY and TCP forwarding"
    command: "pytest test/test_channels.py"
  - file: test/test_concurrent.py
    source: dropbear-2025.88/test/test_concurrent.py
    description: "Concurrent SSH channel open/close handling"
    command: "pytest test/test_concurrent.py"
  - file: test/test_dropbearconvert.py
    source: dropbear-2025.88/test/test_dropbearconvert.py
    description: "Host-key generation and OpenSSH/Dropbear conversion round trips"
    command: "pytest test/test_dropbearconvert.py"

test_package_tests:
  - file: test_dropbear.sh
    description: "Packaged binaries plus a local public-key SSH client/server round trip"
    command: "bash test_dropbear.sh"

assertion_count: 8
