software: dropbear
display: "Dropbear"
description: "Small SSH server and client"
category: network
homepage: "https://matt.ucc.asn.au/dropbear/dropbear.html"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Disable shadow, login accounting, syslog, zlib and openpty features unavailable or unnecessary on OHOS."
    - "Use the bundled libtomcrypt and libtommath implementations."
    - "Guard getpass() and getspnam() because OHOS may expose the headers without the functions."

versions:
  "2025.88":
    status: built
    build_date: "2026-07-18"
    conan_ref: "dropbear/2025.88"
