sources:
  url: "https://github.com/pedrolcl/drumstick/archive/refs/tags/RELEASE_2_11_1.tar.gz"
  sha256: "38b3d459a7e7dc4eeb12c6e42b1b6cfa6e28b1d3976fa61e83de2a56b830bae7"
patches:
  - patch_file: "patches/0001-alsa-harmonyos-linux-detection.patch"
    patch_description: "Treat HarmonyOS as Linux for ALSA sequencer detection (BUILD_ALSA default and pkg_check_modules(ALSA))"
    patch_type: "portability"
  - patch_file: "patches/0002-alsa-include-dirs-global.patch"
    patch_description: "Expose ALSA_INCLUDE_DIRS globally so RT backends and tests can include <alsa/asoundlib.h> through the drumstick headers on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0003-rttest-gate-alsa-device.patch"
    patch_description: "Register the rtTest CTest only when the ALSA sequencer device (/dev/snd/seq) exists, matching the upstream Linux gating (HarmonyOS has no such device)"
    patch_type: "portability"
  - patch_file: "patches/0004-skip-translations-on-harmonyos.patch"
    patch_description: "Skip the widgets .qm translations (lrelease/lupdate host tools) on HarmonyOS: the qttools cross-built ELF tools cannot run on the OHOS build host"
    patch_type: "portability"
