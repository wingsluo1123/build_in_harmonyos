software: drumstick
display: "Drumstick MIDI libraries"
description: "MIDI C++ libraries for Qt: ALSA sequencer wrapper, SMF/RMID/WRK file I/O, realtime MIDI I/O and GUI widgets"
category: multimedia
homepage: "https://drumstick.sourceforge.io"
license: GPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "ALSA sequencer gates in CMake must also accept CMAKE_SYSTEM_NAME=HarmonyOS (patch 0001)"
    - "Qt6 consumed from qtbase/6.11.1 + qt5compat/6.11.1 (Qt6Core5Compat) + qttools/6.11.1 (Qt6LinguistTools)"
    - "ALSA resolved via pkg-config alsa.pc from alsa-lib/1.2.16.1"
    - "Optional backends (PulseAudio/PipeWire/FluidSynth/Sonivox/DBus) disabled"
    - "CMake package consumed via installed drumstick-config.cmake (cmake_find_mode=none), find_package(Drumstick COMPONENTS ALSA ...)"
  common_dependencies:
    - qtbase
    - qt5compat
    - qttools
    - alsa-lib

versions:
  "2.11.1":
    status: built
    build_date: "2026-10-09"
