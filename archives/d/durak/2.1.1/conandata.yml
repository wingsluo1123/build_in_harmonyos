# conandata.yml — durak 2.1.1

sources:
  url: "https://github.com/werto87/durak/archive/refs/tags/v2.1.1.tar.gz"
  sha256: "44b6ef260c4f509ea85c7988d8d1257226153e1203d3e4524c08ee5f356d65d3"

patches:
  - patch_file: "patches/0001-durak-CMakeLists.txt.patch"
    patch_description: "Link Boost::boost instead of Boost::headers (conan CMakeDeps exports Boost::boost only)"
    patch_type: "portability"
  - patch_file: "patches/0002-durak-game.hxx.patch"
    patch_description: "Replace C++23 std::ranges::contains with C++20 std::ranges::find (OHOS libc++15 has no ranges::contains)"
    patch_type: "portability"
  - patch_file: "patches/0003-durak-move.hxx.patch"
    patch_description: "Guard MSVC-only #pragma warning with _MSC_VER (clang -Werror rejects unknown pragmas)"
    patch_type: "portability"
  - patch_file: "patches/0004-durak-print.hxx.patch"
    patch_description: "Replace std::format with ostream operators (OHOS libc++ runtime ships no std::format symbols)"
    patch_type: "portability"
  - patch_file: "patches/0005-test-CMakeLists.txt.patch"
    patch_description: "Link Catch2::Catch2 instead of Catch2WithMain (test main.cxx defines CATCH_CONFIG_MAIN)"
    patch_type: "portability"