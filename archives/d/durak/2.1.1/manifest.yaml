# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS libc++ 15 默认定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES，C++20 ranges 算法（find_if/count_if/transform/binary_search/copy_if/find）实现头实际存在但被宏隐藏；-D_LIBCPP_ENABLE_EXPERIMENTAL 编译标志解锁即可，且须经 cpp_info.defines 传导给消费者"
  - "C++23 std::ranges::contains 在 libc++ 15 完全缺失（无 ranges_contains.h），改写为 std::ranges::find(r,v) != std::ranges::end(r) 语义等价"
  - "libc++ 15 <format> 头声明可用但运行库未编译 format 部分（INCOMPLETE_FORMAT），std::format 链接报 undefined symbol format_error；改 ostream 流式输出"
  - "MSVC 专有 #pragma warning 在 clang -Werror 下报 unknown pragma，需 #ifdef _MSC_VER 守卫"
  - "conan CMakeDeps 只导出 Boost::boost 不导出上游引用的 Boost::headers；配方级补丁改链接目标"
  - "conan test_package 消费 header-only 库时传递依赖 include 不物化，需 test_package requirements() 显式声明 boost/confu_json"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

