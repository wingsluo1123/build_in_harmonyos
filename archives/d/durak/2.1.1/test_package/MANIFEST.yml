# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: durak/2.1.1
homepage: "https://github.com/werto87/durak"

# 上游测试命令 (ctest -N 视图)
upstream_check_command: "ctest --test-dir build/Release -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (Catch2 单可执行 _test；25 个 TEST_CASE / 63 断言)
upstream_tests:
  - file: test/game.cxx
    source: durak-2.1.1/test/game.cxx
    description: "Game state machine tests (12 TEST_CASE): attack/defend/assist rules, allowed moves, option handling"
    command: "./_test"
  - file: test/player.cxx
    source: durak-2.1.1/test/player.cxx
    description: "Player tests (12 TEST_CASE): beats() semantics, cardsForIndex, put/drop cards"
    command: "./_test"
  - file: test/move.cxx
    source: durak-2.1.1/test/move.cxx
    description: "History event comparison (1 TEST_CASE)"
    command: "./_test"

upstream_test_case_count: 25
upstream_ctest_count: 1

# test_package 中的消费者验证（真实公开 API 调用 + 可观察结果）
test_package_tests:
  - file: test_durak_consumer.cpp
    description: "Consumer test: deterministic round via public GameOption.cardsInHands, attack/defend/print/state with observable results"
    command: "./test_durak"

test_package_test_case_count: 1
assertion_count: 63