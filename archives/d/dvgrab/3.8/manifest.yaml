version: "3.8"
status: built
build_date: "2026-08-06"
build_system: autotools

source:
  url: "https://github.com/ddennedy/dvgrab/archive/34637fe633f03e4767ff5179749df2fb000c863f.tar.gz"
  sha256: "9eafe30ee941d03379db56f9bd830f1b002489abac0c3eb5cf1ffecb5640ecc7"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies:
    - "libraw1394/2.1.2"
    - "libavc1394/0.5.4"
    - "libiec61883/1.2.0"
    - "libdv/1.0.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-dvgrab.h.patch"
  - "0004-error.h.patch"
  - "0005-ieee1394io.cc.patch"
  - "0006-io.c.patch"

knowledge_gained:
  - "musl libc 缺少 pthread_testcancel/pthread_cancel，需要宏替代"
  - "musl 使用 __func__ 替代 glibc 的 __ASSERT_FUNCTION"
  - "需要显式包含 sys/select.h 头文件"
  - "HMDFS 不允许在 umask 077 创建的目录中创建文件，需要修改 config.status 中的 umask 077 为 umask 022"
