sources:
  '1.4':
    url: https://dyncall.org/r1.4/dyncall-1.4.tar.gz
    sha256: 14437dbbef3b6dc92483f6507eaf825ab97964a89eecae8cb347a6bec9c32aae
patches:
  '1.4':
    - patch_file: patches/0001-CMakeLists.txt.patch
      patch_description: Build every registered upstream test when explicitly enabled
    - patch_file: patches/0002-dyncall-CMakeLists.txt.patch
      patch_description: Honor shared libraries and install ELF library artifacts
    - patch_file: patches/0003-dyncall-dyncall.h.patch
      patch_description: Expose aggregate allocation and stack capacity errors
    - patch_file: patches/0004-dyncall-dyncall_aggregate.c.patch
      patch_description: Connect the ELF ARM64 aggregate classifier
    - patch_file: patches/0005-dyncall-dyncall_aggregate.h.patch
      patch_description: Retain ARM64 homogeneous aggregate metadata
    - patch_file: patches/0006-dyncall-dyncall_aggregate_arm64.c.patch
      patch_description: Classify nested arrays and unions by actual member coverage
    - patch_file: patches/0007-dyncall-dyncall_call_arm64.S.patch
      patch_description: Pass hidden x8 results and capture aggregate return registers
    - patch_file: patches/0008-dyncall-dyncall_callvm_arm64.c.patch
      patch_description: Marshal AAPCS64 aggregate arguments and results
    - patch_file: patches/0009-dyncall-dyncall_callvm_arm64.h.patch
      patch_description: Own large aggregate argument copies for each VM transaction
    - patch_file: patches/0010-dyncall-dyncall_macros.h.patch
      patch_description: Advertise aggregate support only for the implemented ELF ARM64 PCS
    - patch_file: patches/0011-dyncallback-CMakeLists.txt.patch
      patch_description: Link callback providers and install the ARM64 thunk header
    - patch_file: patches/0012-dyncallback-dyncall_args_arm64.c.patch
      patch_description: Decode aggregate callback arguments and marshal return values
    - patch_file: patches/0013-dyncallback-dyncall_args_arm64.h.patch
      patch_description: Share checked callback register and metadata frame layout
    - patch_file: patches/0014-dyncallback-dyncall_callback_arm64.S.patch
      patch_description: Capture hidden result pointers and restore aggregate return registers
    - patch_file: patches/0015-dyncallback-dyncall_callback_arm64.c.patch
      patch_description: Preserve callback aggregate signature descriptors
    - patch_file: patches/0016-dynload-CMakeLists.txt.patch
      patch_description: Honor shared libraries and declared dynamic loader link requirements
    - patch_file: patches/0017-test-callf-main.c.patch
      patch_description: Compare char values using the target C char signedness
    - patch_file: patches/0018-test-dynload_plain-dynload_plain.c.patch
      patch_description: Bind the loaded POSIX C runtime rather than a guessed libc alias
    - patch_file: patches/0019-test-resolve_self-CMakeLists.txt.patch
      patch_description: Probe explicit executable symbol export support on unknown CMake systems
    - patch_file: patches/0020-test-thunk-test_thunk.c.patch
      patch_description: Restore POSIX signal masks across deliberate NX protection faults
