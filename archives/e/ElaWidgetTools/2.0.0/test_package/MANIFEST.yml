# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ElaWidgetTools/2.0.0
homepage: "https://github.com/Liniyous/ElaWidgetTools"

# 上游测试命令 (ElaWidgetTools 上游无 make check，仅 Example 可运行)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ElaWidgetTools 上游无独立测试程序)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "链接 ElaWidgetTools 静态库并创建 ElaWidget 实例验证 API 可用性"
    command: "./test_ElaWidgetTools"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
