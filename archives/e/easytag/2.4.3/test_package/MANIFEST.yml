# test_package/MANIFEST.yml
# Upstream test declaration for easytag 2.4.3

package: easytag/2.4.3
homepage: "https://wiki.gnome.org/Apps/EasyTAG"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test-easytag.c
    source: easytag-2.4.3/tests/test-easytag.c
    description: "Upstream easytag unit tests"
    command: "./test-easytag"

test_package_tests:
  - file: conanfile.py
    description: "Verifies easytag binary is installed and runs"
    command: "easytag --version"

assertion_count: 2
