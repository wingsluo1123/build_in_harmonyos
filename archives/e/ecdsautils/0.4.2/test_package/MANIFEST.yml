# test_package/MANIFEST.yml — ecdsautils/0.4.2
#
# Upstream test inventory was counted against the verified source tarball
# (sha256 8880e5a506555a06d7a866de8a76c28bb4c7472abbf0d3fb396100d16c447174):
#   * find . -iname '*test*' -type f                        -> 0 hits
#   * find . -name 'Makefile*'                              -> contrib/Makefile-openwrt only (packaging, not a test)
#   * grep -rn 'enable_testing|add_test|ctest' --include=CMakeLists.txt . -> 0 hits
#   * no BUILD_TEST / ENABLE_TEST option, no test/ or tests/ directory
# ecdsautils 0.4.2 ships no automated test suite; N_static = 0.

package: ecdsautils/0.4.2
homepage: "https://github.com/freifunk-gluon/ecdsautils"

# No upstream check / test command exists.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream supplies zero automated tests for this release.
upstream_tests: []

# Adapter-side (Conan test_package) consumer test that compiles, links and runs
# against the packaged library + public headers.
test_package_tests:
  - file: test_ecdsautils.c
    description: "ecdsautils 鸿蒙PC消费者测试：SHA256/HMAC-SHA256 标准向量 + ECDSA 签名验签往返、篡改与换哈希拒绝"
    command: "./test_ecdsautils"

# Adapter-side assertion count for the new consumer test (9 CHECK() sites).
assertion_count: 9
