knowledge_gained:
  - "DRAFT-eckit-2.0.7.1-ctest-anchored-per-case-exclusion（B判定=create）：CMake/CTest 的锚定 --exclude-regex 逐项豁免平台受限用例，去锚会多删 11 个同族兄弟；注册分母 216 不删不缩"
  - "OHOS: ecbuild 的 OS_NAME 取原始 CMAKE_SYSTEM 且未把 HarmonyOS 归一化为 Linux ⇒ 补丁 0004 让 makeSystemInfo() 的 Linux 分支同时接受 OHOS/HarmonyOS"
  - "OHOS/musl: 不间接引入 sys/types.h（0001）、只有 POSIX 版 strerror_r（0002）、libc 无线程取消机制故 ThreadControler::kill() 降级 no-op（0003）"
  - "OHOS: conan CMakeDeps 生成 libzip::libzip 而上游 src/eckit/geo 链接 libzip::zip ⇒ 用 CMAKE_PROJECT_eckit_INCLUDE 钩子补 ALIAS；该 .cmake 由 recipe 在 generate() 内 save() 到 self.source_folder，仓库不需要保存它，把它提交进归档目录既不生效（exports_sources 只含 patches/*）又扩大归档目录违规面"
  - "OHOS: HMDFS 默认文件模式与 Unix 契约不同（知识库 E011），是 eckit_test_filesystem_filemode 受限的一手原因"
knowledge_ref:
  - "E011（HMDFS 默认文件模式 660）"
