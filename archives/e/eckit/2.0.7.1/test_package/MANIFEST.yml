upstream_test_in_build: true
upstream_check_command: "ctest --output-on-failure --exclude-regex <5 anchored case names> (invoked by cmake.test(build_tool_args=[ARGS=...]) in the recipe build())"
upstream_test_command: "cmake --build <build>/Release --target test -- 'ARGS=--output-on-failure -E \"^eckit_test_(container_sharedmemarray|filesystem_filemode|log|maths_floating_point_exceptions|safe_casts)$$\"'"
upstream_tests:
  - file: "tests/*/CMakeLists.txt"
    source: "https://github.com/ecmwf/eckit/archive/refs/tags/2.0.7.tar.gz (sha256 376aa865b317d9533c1c88e1a7d15ca248420cc8a048570f3fe216e123991b51)"
    description: >-
      ecbuild registration sites ecbuild_add_test( = 138 across 28 CMakeLists.txt files
      (bare add_test( = 0; reproducible: grep -ro 'ecbuild_add_test(' <src>/ --include=CMakeLists.txt | wc -l = 138, grep -rl same pattern = 28 files; the loose form without the parenthesis is 142 because 4 more hits sit on a different line inside tests/geo/CMakeLists.txt, so this package reports the anchored 138/28 pair only). Under this recipe's feature set ENABLE_TESTS=ON registers 216 ctest cases,
      of which 198 are labelled "executable". create#6 (fresh rebuild after conan remove -c) executed
      all of them: 211 Passed / 5 Failed
      (#3 eckit_test_container_sharedmemarray SIGSYS, #19 eckit_test_filesystem_filemode,
      #57 eckit_test_log, #69 eckit_test_maths_floating_point_exceptions, #154 eckit_test_safe_casts).
      Earlier create#5 independently produced the same denominator and the same 5-item failure set
      (93.01 s vs create#6 91.07 s), so the numbers are reproducible across two separate executions.
      Platform-mechanism / upstream-test-contract causes only; per-case technical reasons in notes.md
      (round-23 定案 table: root cause / platform-limited vs caused-by-this-port / 10-section handling).
      Cases are NOT reclassified, NOT deleted and the 216 denominator is NOT shrunk.
      Round 24 (coordinator decision): the build() test gate now excludes exactly those 5
      platform-limited cases by name via CMake/CTest's own anchored --exclude-regex (per-case
      test_skipped; GNU Make 4.4.1 "test" rule is literally "ctest $(ARGS)"), so a fresh create
      runs 211/211 while the 216 registration denominator and the 5 documented signatures remain.
      Measured with --show-only (zero execution): anchored form keeps 211 and retains all sibling
      cases (eckit_test_log_channels ..., floating_point_exception_FE_*); dropping the trailing
      anchor yields 205 (11 siblings wrongly dropped) and is therefore not used.
    command: "ctest --output-on-failure"
  - file: "regressions/CMakeLists.txt"
    source: "same tag tarball"
    description: >-
      1 ecbuild_add_test registration site expanding to 18 shell regression cases labelled "script"
      (ECKIT-166.sh / ECKIT-175.sh / ECKIT-221.sh etc.), all included in the 216 executed denominator
      and all Passed.
    command: "ctest --output-on-failure"
test_package_tests:
  - file: test.cpp
    description: >-
      Consumer test built and run as a user of the library: compiled from test.cpp against the
      installed headers, linked against libeckit, then executed as ./test_probe. Five assertion groups:
      runtime version vs ECKIT_VERSION macro vs version_int()==20007; MD5 against three RFC 1321
      standard vectors; Tokenizer split of "a:bb:ccc"; AEC compress/decompress round-trip (libaec);
      SystemInfo dynamicLibraryName()/executablePath() (regression assertion for patch 0004).
    command: "./test_probe"
