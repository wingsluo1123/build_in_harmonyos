notes: >-
  Historical (superseded): under create#6 the recipe had no per-case exclusion, so cmake.test()
  propagated the 5 failing cases and conan create ended rc=2 with the test_package step
  unreachable; test.cpp was then executed out-of-band (round 22) with the exact CXX_FLAGS and
  CXX_INCLUDES from the build tree's flags.make and the real link.txt, under memcap-run.py --mb 800,
  rc=0 with all five assertion groups printing (independent carrier, not a substitute for the
  conan test_package run).
  Authoritative state for this version (2.0.7.1): create#9 (see create9_e2e above) returns rc=0 on recipe revision ec9c1763c4cb84752953546e4a58c8c7,
  exported from archives/e/eckit/2.0.7.1/ (conanfile.py version = 2.0.7.1, conandata.yml patches key = 2.0.7.1,
  sources still the upstream 2.0.7 tag tarball sha256 376aa865...). It runs the in-build ctest gate with
  the 5 platform-limited cases excluded per case (211 executed of 216 registered, 94.45 s), and executes
  test_package for real inside the pipeline ('./test_probe' -> all five assertion groups printed, final line
  create#7 remains a historical reading on the older rrev af53dddb9... (commit 20303bf4c8, before the
  package_info bindirs=["bin"] fix) and is not bound to the current tip.
  create#6 terminal readings (round 22 launch, round 23 closure; fresh tree after conan remove -c,
  one build slot, MAKEFLAGS=-j2, memcap --mb 4000): CREATE_RC=2, ELAPSED_S=1645,
  MEMCAP[run] peak=460MB budget=4000MB rc=1 elapsed 1625.5s,
  RREV=8057e2e84f8b16ee05e381d8f715da81 (2026-10-11 08:20:44 UTC), and that revision shows
  "No packages found" => no PKID/prev exists for it because the build failed before package().
  The 40-hex string ac5dbe63be94cf44531a6b18ac4b40fa5a84d380 is a conan package_id, NOT a git object
  (git cat-file fails on it) and must not be cited as a commit.
  Build folder of create#6 is .../p/b/eckita32a57605b7b5/b/build/Release; create#5 used
  eckitaead498222279. Both runs carry the SAME rrev 8057e2e84f... (grep of 'eckit/2.0.7#<32hex>' in
  both logs), so a differing build-folder name does NOT imply a differing recipe revision - conan
  names build folders per build request, not per rrev.
  Per-case handling under AGENTS section 10: all 5 failures are platform-mechanism or
  upstream-test-contract, evidenced item by item (item 3 pinned to seccomp RET_TRAP on semget/190 via
  si_syscall + musl semget backtrace frame bound to the create#6 tree + a fork-per-primitive C probe
  showing semget/shmget/shmat/semop killed while shmctl/semctl/statx return errno, POSIX shm_open and
  MAP_SHARED|ANON mmap working); the only allowed route is per-case test_skipped with technical
  reason, which the coordinator decided in round 24 and the recipe now implements (anchored CTest
  --exclude-regex injected through cmake.test(build_tool_args=[ARGS=...]); the gate is not softened
  and ignore_errors is not used). This manifest still does not claim the port is complete or ready
  all passed). Update for this version: the package_info bindirs=["bin"] fix is already inside rrev ec9c1763c4cb84752953546e4a58c8c7,
  so the PF8/P0-1 finding is now answered by measurement rather than argument (bin/eckit-version present at
  35328 B, runs rc=0 under memcap). The create#5-#8 readings above are historical evidence of the 2.0.7 line;
  the independent W4 audit for this revision has not been run yet (this window must not self-audit).
