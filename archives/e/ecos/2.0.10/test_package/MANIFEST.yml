upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: test/ecostester.c
    source: "embotech/ecos v2.0.10"
    cases: 28
  - file: test/bb_test.c
    source: "embotech/ecos v2.0.10"
    cases: 10
test_package_tests:
  - file: test.c
    description: "Public API: version, index ABI, LP solution/residual, update, infeasibility, unboundedness, SOCP, Boolean branch-and-bound"
    command: "./test_ecos"
    assertions: 20
