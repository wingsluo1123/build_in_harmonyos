# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: elfutils/0.195
homepage: "https://sourceware.org/elfutils/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: run-elflib-test.sh
    source: elfutils-0.195/tests/run-elflib-test.sh
    description: "libelf API 测试套件"
    command: "./run-elflib-test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_elfutils.c
    description: "libelf 初始化和版本检查"
    command: "./test_elfutils"
  - file: conanfile.py
    description: "eu-readelf --version 冒烟测试"
    command: "eu-readelf --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3