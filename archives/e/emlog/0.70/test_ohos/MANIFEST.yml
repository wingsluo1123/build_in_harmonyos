# test_ohos/MANIFEST.yml — emlog 0.70 HarmonyOS PC 专项验证
# 六项独立鸿蒙检查（run_ohos_test.sh，任一失败非零退出）：
#   T1_aarch64_elf    ELF64 AArch64（readelf -h）
#   T2_musl_no_glibc  musl libc, 无 GLIBC 符号版本
#   T3_no_host_paths  无宿主绝对路径（/storage、/home、/Users）
#   T4_nbcat_read     nbcat 非阻塞读取普通文件，输出与输入一致（emlog 核心语义）
#   T5_nbcat_usage    nbcat 无参数打印 usage 且退出非零
#   T6_mkemlog_bound  mkemlog 内核模块未加载时按补丁语义报错退出非零
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_musl_no_glibc
    desc: musl libc, no GLIBC symbol versions
  - id: T3_no_host_paths
    desc: no absolute host paths
  - id: T4_nbcat_read
    desc: nbcat nonblocking read matches input content
  - id: T5_nbcat_usage
    desc: nbcat without args prints usage and exits non-zero
  - id: T6_mkemlog_bound
    desc: mkemlog errors out when kernel module is not loaded
assertion_count: 6
assertion_count_note: 6 shell checks against installed OHOS binaries
test_language: c
test_framework: bare
framework_flavor: shell