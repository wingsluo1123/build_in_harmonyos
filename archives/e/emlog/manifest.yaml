software: emlog
display: "emlog"
description: "EMbedded-system LOG-device：Linux 内核模块 + 用户态工具（nbcat/mkemlog）"
category: system
homepage: "http://www.circlemud.org/~jelson/software/emlog"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "内核模块（emlog.c）依赖 Linux 内核头与 KDIR，OHOS 用户态无法构建，仅适配用户态工具"
    - "mkemlog.c 依赖 GNU error.h，OHOS musl sysroot 缺失，用 fprintf+exit 最小等价实现补丁"
    - "make 需按目标拆分：只构建 nbcat/mkemlog，不触发 modules 目标"
  common_dependencies: []

versions:
  "0.70":
    status: built
    build_date: "2026-09-26"
    conan_ref: "emlog/0.70"