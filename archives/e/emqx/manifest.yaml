software: emqx
display: "EMQX MQTT Broker"
description: "EMQX is a distributed MQTT broker for IoT messaging, built on Erlang/OTP."
category: networking
homepage: "https://www.emqx.io/"
license: Apache-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Version 5.8.8 follows the Homebrew formula build entry point."
    - "Build uses Erlang/OTP rebar3 release generation through make emqx-rel."
    - "BUILD_WITHOUT_QUIC=1 is required to avoid the QUIC native dependency closure in the first OHOS package."
    - "Full runtime validation requires Erlang/OTP 26 and broker network/service support on OHOS."
  common_dependencies:
    - "openssl/3.5.6"

versions:
  "5.8.8":
    status: pending
    build_date: "2026-07-21"
    source_url: "https://github.com/emqx/emqx/archive/refs/tags/v5.8.8.tar.gz"
