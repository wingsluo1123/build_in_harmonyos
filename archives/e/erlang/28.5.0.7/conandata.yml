sources:
  url: "https://github.com/erlang/otp/releases/download/OTP-28.5.0.7/otp_src_28.5.0.7.tar.gz"
  sha256: "ddf17db6d3e9b7a7cfac0d72238ddc8ea040fedc5e3dfad82fc90675319d6c93"

patches:
  - patch_file: "patches/0001-config-sub-ohos.patch"
    patch_description: "Teach the bundled config.sub the linux-ohos OS so aarch64-unknown-linux-ohos is accepted"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Create the autoconf temporary directories with umask 022; HarmonyOS renders the umask 077 ones unwritable"
    patch_type: "portability"
  - patch_file: "patches/0003-erts-termcap-ncursesw.patch"
    patch_description: "Accept the wide-character ncurses archive (libncursesw.a) in the erts termcap probe"
    patch_type: "portability"
  - patch_file: "patches/0004-erl-interface-gethostid-ohos.patch"
    patch_description: "Do not call gethostid() on HarmonyOS; the musl libc does not provide it"
    patch_type: "portability"
  - patch_file: "patches/0005-erts-mallopt-ohos.patch"
    patch_description: "Include malloc.h on HarmonyOS, where the mallopt() prototype lives"
    patch_type: "portability"
  - patch_file: "patches/0006-erts-inet-uname-ohos.patch"
    patch_description: "Treat the vendor HarmonyOS kernel release string as a modern kernel instead of warning on it"
    patch_type: "portability"
  - patch_file: "patches/0007-config-guess-ohos.patch"
    patch_description: "Teach the bundled config.guess the HarmonyOS uname so configure/ts:install can guess the build type without an explicit triplet"
    patch_type: "portability"
