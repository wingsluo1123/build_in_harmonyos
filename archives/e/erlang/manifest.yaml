software: erlang
display: "Erlang/OTP"
description: "Erlang/OTP 28: BEAM 虚拟机、Erlang 编译器、标准库与开发工具"
category: foundation
homepage: "https://www.erlang.org/"
license: Apache-2.0
build_system: custom

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "Erlang 不使用单一 autotools 工程：release tarball 自带手写顶层 configure 驱动 erts 与少数应用的 autoconf configure，其余由递归 make 完成，配方直接驱动 ./configure + make + make install"
    - "/system/bin/sh（mksh）执行 autoconf 脚本不可用，必须注入 CONFIG_SHELL/SHELL=/data/service/hnp/bin/bash 让 configure 与递归 make 自举到 bash"
    - "OHOS 三元组 aarch64-unknown-linux-ohos 需给自带 config.sub 补 ohos* OS 与 linux-ohos*- 内核模式（make/autoconf、erts/autoconf、lib/common_test/test_server 三份）"
    - "autoconf 辅助脚本以 umask 077 建临时目录，OHOS 下不可写，需统一改 umask 022"
    - "musl 无 gethostid()（erl_interface 需绕开）、mallopt() 声明在 <malloc.h>、uname 返回厂商内核串 'HongMeng Kernel x.y.z' 不符合 version.patchlevel 格式（inet 驱动需按现代内核处理）"
    - "erts termcap 探测需接受宽字符归档 libncursesw（termcap_libs 增加 ncursesw）"
    - "OHOS 无 mkfifo(1)，GNU make 默认 FIFO jobserver 失效致递归 make 退化为 -j1，需 --jobserver-style=pipe（GNU make >= 4.4）"
    - "wx（GUI 工具包）、odbc（unixODBC）、jinterface（Java 编译器）在 OHOS PC 不可达，--without-wx/--without-odbc/--without-javac 边界裁剪；TUI/VM/编译器为核心交付面"

  common_dependencies:
    - openssl/3.5.7
    - zlib/1.3.1
    - ncurses/6.5

versions:
  "28.5.0.7":
    status: built
    build_date: "2026-10-12"
    conan_ref: "erlang/28.5.0.7"
