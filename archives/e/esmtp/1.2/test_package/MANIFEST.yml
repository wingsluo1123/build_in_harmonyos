# test_package/MANIFEST.yml — esmtp 1.2
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: esmtp/1.2
homepage: "https://esmtp.sourceforge.net/"

# 上游测试命令 — esmtp 没有自动化测试套件（见下方 upstream_test_audit），
# 但 build() 仍执行 `make check`，记录真实的空结果。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "Makefile.am"
    finding: "仅 bin_PROGRAMS = esmtp 与 dist_man_MANS；无 TESTS、无 check_PROGRAMS、无 AM_TESTS 相关变量（grep -c 'TESTS|check_PROGRAMS' = 0）"
  - path: "源码树（tarball 全量清单，41 条目 / 40 个顶层文件）"
    finding: "无 tests/、test/、check/、spec/ 目录（find 四类目录 = 0 命中）"
  - path: "跨框架测试标记扫描"
    finding: "Test::More / use_ok / def test_ / TEST_CASE / add_test / enable_testing / gtest / TAP 八类标记全文 0 命中"
  - path: "configure.ac"
    finding: "只有 AC_PROG_CC/LEX/YACC、libESMTP 探测与 getopt 检测，无任何测试接线"
  - path: "README / INSTALL / TODO"
    finding: "仅描述构建与使用，未提供测试入口或 CI 测试步骤"

test_package_tests:
  - file: test.sh
    description: "协议级端到端验证：--version/--help 输出断言 + 在回环非特权 TCP 端口起本地 ESMTP 监听，驱动完整 EHLO→MAIL FROM→RCPT TO→DATA→QUIT 会话并对 transcript 断言（5 个协议标记 + 正文回读）"
    command: "bash test.sh"

assertion_count: 8
