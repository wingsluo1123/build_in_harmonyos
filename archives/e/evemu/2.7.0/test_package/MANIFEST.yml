# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: evemu/2.7.0
homepage: "https://www.freedesktop.org/wiki/Evemu/"

# 上游测试命令 (automake check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 上游 test/Makefile.am 共注册 3 条 TESTS，三条全部在 build() 的
# `make check` 中真实执行（设备无关，实测通过）：
#   test-c-compile   — 纯编译+链接+运行
#   test-cxx-compile — 纯编译+链接+运行
#   test-evemu-create — 只对 mkstemp() 临时文件做 evemu_new/evemu_read
#                       回环断言，不打开任何设备节点；上游 Makefile.am 给它
#                       加的 `-static` 与本包 shared=True 冲突，由
#                       patches/0002 移除后即可正常链接运行
# python/Makefile.am 另注册 1 条 evemu-test-runner，它嵌套在
# BUILD_PYTHON_BINDINGS 之内，本包按 --disable-python-bindings 关闭 python
# 绑定（automake py-compile 依赖已从 Python 3.12 移除的 `imp` 模块），故该
# 条目不参与构建。
upstream_tests:
  - file: test/test-c-compile.c
    source: evemu-2.7.0/test/test-c-compile.c
    description: "上游 C 编译/链接/运行测试（设备无关，make check 真实执行）"
    command: "./test-c-compile"
  - file: test/test-cxx-compile.cpp
    source: evemu-2.7.0/test/test-cxx-compile.cpp
    description: "上游 C++ 编译/链接/运行测试（设备无关，make check 真实执行）"
    command: "./test-cxx-compile"
  - file: test/test-evemu-create.c
    source: evemu-2.7.0/test/test-evemu-create.c
    description: "上游 evemu 文件格式回环测试（mkstemp 临时文件，设备无关，make check 真实执行；-static 由 patches/0002 移除）"
    command: "./test-evemu-create"
  - file: python/evemu-test-runner
    source: evemu-2.7.0/python/evemu-test-runner.in
    description: "上游 python 事件回放测试（--disable-python-bindings 关闭 python 绑定，不参与构建）"
    command: "./evemu-test-runner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 libevemu API 可用性: evemu_new/evemu_get_name/evemu_set_name/evemu_delete + C++ 消费者探测；另断言 evemu-record 无效选项输出上游 usage 横幅与 rc=1"
    command: "./test_evemu"
  - file: test_cpp.cpp
    description: "C++ 消费者链接探测（等效上游 test-cxx-compile.cpp）"
    command: "./test_evemu"

# 测试断言总数（近似值）
#   3 个上游测试程序 + test.c 的 5 条 API 断言 + CLI 信息面的 2 条 grep 断言
assertion_count: 10
