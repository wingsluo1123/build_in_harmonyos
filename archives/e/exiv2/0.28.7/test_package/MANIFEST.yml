# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: exiv2/0.28.7
homepage: "https://github.com/Exiv2/exiv2"

# 上游测试命令 (cmake ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (EXIV2_BUILD_UNIT_TESTS=OFF, 不构建上游单测)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_exiv2.cpp
    description: "验证 exiv2 库链接与 EXIF 元数据读写 API (ExifData operator[] / Exiv2::version)"
    command: "./test_exiv2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
