# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: extract-dtb/1.2
homepage: "https://github.com/PabloCastellano/extract-dtb"

# 上游测试命令
# extract-dtb 是纯 Python 包，无上游测试套件
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# extract-dtb 是纯 Python 包，无上游测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_extract_dtb.py
    description: "验证 extract-dtb 工具的 --version、--help 功能和 DTB 提取功能"
    command: "python3 test_extract_dtb.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
