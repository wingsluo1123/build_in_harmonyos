software: f2fs-tools
version: "1.16.0"
status: recipe_checks_run_no_device_this_session
build_system: autotools
source:
  upstream_url: "https://git.kernel.org/pub/scm/linux/kernel/git/jaegeuk/f2fs-tools.git"
  tag: "v1.16.0"
  commit: "06c027abc6153c4a97cba5317844e8dcaaee3cf7"
  tree: "9c3ad82b3acaac8665211a7d7ad650879ef352af"
  archive_url: "https://github.com/kernelorg-mirror/linux_kernel_git_jaegeuk_f2fs-tools/archive/refs/tags/v1.16.0.tar.gz"
  archive_sha256: "cdb2c85e52e2fea075569fe661764dc026ad3640501add2aa9927f605596bc63"
  archive_policy: "GitHub static archive of the upstream tag copied by the kernelorg-mirror account (which labels its copies unofficial); kernel.org Google Git confirms tag commit/tree, github.com is CI mirror-covered per rule A/R39, and SHA pins bytes. No git.kernel.org snapshot or clone."

build:
  target: "aarch64-unknown-linux-ohos"
  options:
    - "--enable-static"
    - "--disable-shared"
    - "--with-blkid"
    - "--with-selinux"
    - "--with-lzo2"
    - "--with-lz4"
  build_tools:
    - "autoconf/2.72"
    - "automake/1.18"
    - "libtool/2.5.4"
    - "m4/1.4.19"
  dependencies:
    required:
      - "libuuid/2.42.2"
      - "libblkid/2.42.2"
      - "libselinux/3.10.1"
      - "lzo2/2.10"
      - "lz4/1.10.0.3"
  patches_applied:
    - "patches/0001-ohos-portable-install-and-ldconfig.patch"
  notes:
    - "Static build avoids libtool shared-library symlink hooks."
    - "fsck tool aliases are installed as copies for destination filesystems without symlink support."
    - "configure.ac's LDCONFIG probe has no generated-makefile consumer; its fallback is a no-op."

outputs:
  commands:
    - "mkfs.f2fs"
    - "fsck.f2fs"
    - "dump.f2fs"
    - "defrag.f2fs"
    - "resize.f2fs"
    - "sload.f2fs"
    - "f2fslabel"
    - "f2fs_io"
    - "f2fscrypt"
    - "fibmap.f2fs"
    - "parse.f2fs"
  libraries:
    - "libf2fs"
    - "libf2fs_format"

