platform_boundaries:
  - "f2fs_io includes the Linux fs ioctl interface and issues F2FS_IOC_* requests; behavior requires a compatible F2FS kernel and mounted filesystem."
  - "The verify.sh integration matrix requires root-equivalent mount/umount, loop-backed F2FS, xfstests ltp/fsstress, and a writable isolated temporary directory."
  - "spo_test.sh uses a raw block device, kernel module insertion, sysrq reboot, and a stress helper from an F2FS kernel source checkout; it must only run on an explicitly disposable device."


