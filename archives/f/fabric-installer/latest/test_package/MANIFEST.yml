# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: fabric-installer/latest
homepage: "https://hyperledger-fabric.readthedocs.io"

# 上游无测试（Shell 脚本工具）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_fabric_installer.sh 验证 install-fabric.sh 已安装、可执行且 bash 语法正确"
    command: "conan create (test_package: bash test_fabric_installer.sh <bin_dir>)"
  - file: test_fabric_installer.sh
    description: "真实冒烟测试: 检查 bin/install-fabric.sh 存在、shebang 有效、bash -n 语法检查通过、--help 输出正确"
    command: "bash test_fabric_installer.sh <package bin dir>"

assertion_count: 4
