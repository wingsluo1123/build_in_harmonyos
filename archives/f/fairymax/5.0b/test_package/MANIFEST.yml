# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fairymax/5.0b
homepage: "https://deb.debian.org/debian/pool/main/f/fairymax/"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# fairymax uses XBoard protocol — no traditional unit tests
# Verification is done by sending XBoard commands and checking engine responses
upstream_tests:
  - file: test_fairymax.sh
    source: fairymax-5.0b/test_fairymax.sh
    description: "XBoard protocol interaction test for fairymax, shamax, maxqi"
    command: "sh test_fairymax.sh"

# test_package 中自带的测试
test_package_tests:
  - file: test_fairymax.sh
    description: "Runs all three engine binaries with XBoard protocol and verifies greeting output"
    command: "./test_fairymax.sh"

# 测试断言总数
assertion_count: 3
