package: falcosecurity-libs/0.25.4
homepage: https://github.com/falcosecurity/libs

upstream_check_command: "cmake --build build --target run-unit-tests"
upstream_test_in_build: false
upstream_test_command: "cmake --build build --target run-unit-tests"
upstream_tests:
  - description: "Upstream libsinsp unit test target; disabled for cross compilation"
    command: "cmake --build build --target run-unit-tests"

test_package_tests:
  - file: test_falcosecurity_libs.c
    description: "Validate libscap API compatibility, event table and syscall metadata"
    command: "./test_falcosecurity_libs"

# OHOS: PPM_API_CURRENT_VERSION macro check skipped (not available
# on OHOS), leaving 2 actual assertions: event table null check +
# syscall name availability check.
assertion_count: 2
