package: falcosecurity-libs/0.25.4
homepage: https://github.com/falcosecurity/libs

upstream_check_command: "cmake --build build --target run-unit-tests"
upstream_test_in_build: false
upstream_test_command: "cmake --build build --target run-unit-tests"
upstream_tests:
  - description: "Upstream libsinsp unit test target; disabled for cross compilation"
    command: "cmake --build build --target run-unit-tests"

test_package_tests:
  - file: test_falcosecurity_libs.c
    description: "Link-time validation: 5 libscap API symbols verified at link stage via extern references"
    command: "./test_falcosecurity_libs"

# Compile-time assertion count corresponds to the number of libscap public
# API symbols referenced. Each symbol forces linker resolution and validates
# the API is available in the installed library. Runtime execution is not
# possible on this host (OHOS-cross .so incompatible with system musl linker).
assertion_count: 5
