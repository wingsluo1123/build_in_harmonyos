# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: farbfeld/4.0.0
homepage: "https://tools.suckless.org/farbfeld/"

# 上游测试命令
upstream_check_command: "make check"

# farbfeld has no 'make check' target; upstream has no automated tests
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Generate 1x1 farbfeld image, convert via ff2ppm and ff2pam, verify output format"
    command: "conan test"

# 测试断言总数
assertion_count: 8
