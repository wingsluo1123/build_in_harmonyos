software: farbfeld
display: "farbfeld"
description: "Lossless image format with 16-bit RGBA pixel data and simple conversion tools"
category: gfx
homepage: "https://tools.suckless.org/farbfeld/"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "通过 make 命令行参数传递编译器和标志，无需补丁"
    - "依赖 libpng 和 libjpeg，通过 Conan 管理依赖链"
    - "OHOS 不支持 make -j2+，必须使用 -j1"
  common_dependencies:
    - "libpng"
    - "libjpeg"

versions:
  "4.0.0":
    status: built
    build_date: "2026-07-15"
