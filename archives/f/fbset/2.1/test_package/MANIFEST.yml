# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fbset/2.1
homepage: "http://g33rt.be/migrated/Linux/fbdev/"

# 上游测试清点证据（R51 三步法第 1 步）：
#   源码树仅 fbset.c / GetVideoMode.c / modes.l / modes.y / fb.h / fbset.h /
#   Makefile / man 手册 / etc/fb.modes.*，无 tests/ 目录、无任何测试源文件；
#   Makefile 只有 All / fbset / install / clean 四个目标，没有 check / test 目标。
#   ⇒ N_static = 0（上游确无测试，故本包只交付消费者测试）。
upstream_check_command: ""

# 上游无测试目标，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test_fbset.c
    description: "执行 fbset --help：断言退出码 0、stdout 含版本横幅、stderr 含 Usage 选项表"
    command: "./test_fbset <fbset-bin>"
  - file: test_fbset.c
    description: "执行 fbset -V：断言 stdout 含 Version 2.1 横幅，退出结果为模式输出或格式化的设备诊断"
    command: "./test_fbset <fbset-bin>"
  - file: test_fbset.c
    description: "执行 fbset -s：走一次真实帧缓冲查询（FBIOGET_VSCREENINFO ioctl）——有 /dev/fb* 时输出显示模式，无帧缓冲设备时须指明设备/裁决失败原因"
    command: "./test_fbset <fbset-bin>"

# 测试断言总数 (test_fbset.c 中 check() 调用数)
assertion_count: 6
