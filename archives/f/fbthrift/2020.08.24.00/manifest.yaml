    - "zstd/1.5.6"
    - "fmt/11.2.0"
    - "double-conversion/3.3.0"
    - "folly/v2024.11.18.00"
    - "fizz/v2024.11.18.00"
    - "wangle/v2024.11.18.00"
  cc: clang
  cxx: clang++

