# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "fbthrift 编译需要 folly/fizz/wangle 等依赖，这些库未发布到 ohpcd 制品仓"
  - "fbthrift 2020.08.24.00 与 folly v2024.11.18.00 存在 API 不兼容 (FOLLY_INLINE_VARIABLE, FOLLY_GNU_ENABLE_ERROR, SharedMutex::ReadHolder)"
  - "使用 std::filesystem 替代 boost::filesystem 避免需要编译 Boost filesystem 库"
  - "需要定义 FOLLY_INLINE_VARIABLE 和 FOLLY_GNU_ENABLE_ERROR 宏以兼容旧版 folly"
  - "thrift1 编译器完整构建成功，thrift-core 库构建成功"
  - "concurrency/protocol/async 库因 folly API 版本差异构建失败，需使用匹配版本的 folly (v2020.08.24.00)"

