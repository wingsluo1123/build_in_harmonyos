knowledge_gained:
  - "fcitx5 是输入法框架核心库（Fcitx5Core/Fcitx5Config/Fcitx5Utils + addon 模块），上游 CMake 顶层直接构建，顶层依赖 X11/Wayland/DBus/Enchant/Emoji/Keyboard 子系统，OHOS PC 无对应系统服务，需全部禁用得到最小核心闭包"
  - "OHOS 裁剪 libc++15 缺 <format>（__cpp_lib_format 未定义）、std::ranges 算法（transform/copy/equal/lower_bound）、std::views、std::hash<std::filesystem::path>；逐一等价改写（i18n.h 兼容实现 / ostringstream / 标准算法 + 显式循环 / std::set 去重），先例见 fcitx5-utils 5.1.13 / ada-url / bitcoin"
  - "OHOS sysroot 的 libintl.h 是空壳（无 gettext/bindtextdomain 声明），必须依赖 gettext 包真实 libintl；po/ 翻译 .mo 生成需系统 msgfmt（hnp bin）并注入 GETTEXTDATADIR 定位 ITS 规则"
  - "EVENT_LOOP_BACKEND=libuv：event_none 后端 createDefaultEventLoop 返回 nullptr，核心测试抛 'No available event loop implementation'；sysroot/制品仓 libuv 提供真实事件循环"
  - "OHOS 加载器拒绝加载 RUNPATH 指向 conan 缓存目录的库（dlopen 报 Permission denied）；库保持 conan 默认 CMAKE_SKIP_RPATH=1 不带 RUNPATH，消费者通过 conanrun 环境（LD_LIBRARY_PATH）解析运行库"
  - "ecm_setup_version 需 ECM 的 ECMSetupVersion 模块；fcitx5 顶层 include(ECMUninstallTarget) 需要 ecm_uninstall.cmake.in，extra-cmake-modules 6.29.0 已发布可作 tool_requires（6.19.0 缺该文件）"
  - "spell 模块 add_custom_command 用 ALIAS 目标 Fcitx5::comp-spell-dict 在 CMake 4.1 不展开为可执行路径，须用 $<TARGET_FILE:comp-spell-dict>；BUILD_SPELL_DICT 需 Off（en_dict 数据下载源超时）"

