# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "tag 归档无 configure：build() 内 `mkdir -p etc && autoreconf -fi` 自举。工具面只声明 automake/1.18（aclocal+automake）、libtool/2.5.4（libtoolize）、bison/3.8.2（parse.y 需要 yacc）；autoconf 与 m4 故意不声明——conan autoconf 会拉入 OHOS 构建的 perl/5.42.2，其 XS 模块被 SDK autoreconf 使用的 perl 5.42.0 拒载（`Perl_my_cxt_init: symbol not found` / `Can't load …/Cwd.so`），而 SDK 已自带 autoconf 2.72 与 m4。"
  - "conan automake/1.18 的 buildenv 已把 PERL5LIB 指向其 share/automake-1.18（纯 Perl 模块目录），与 SDK perl 5.42.0 兼容；conan automake 包装脚本的 .aclocal-real/.automake-real shebang 硬编码 `#!/data/service/hnp/bin/perl`，因此把 conan 的 automake bin 前置到 PATH 无法改变解释器版本——只有「不引入第二个 perl」才是可行解。"
  - "musl regex.h 无 REG_STARTEND（GNU/BSD 扩展），上游 re.c 直接 `regexec(…, REG_STARTEND)` ⇒ `use of undeclared identifier 'REG_STARTEND'`。上游 MANUAL 明确给出出路：『I'm building on Linux and it complains about REG_STARTEND … Either upgrade to a later version of glibc, or use PCRE』，Debian/FreeBSD 端口默认也用 PCRE ⇒ 用 `--enable-pcre2` 走 pcre.c，零补丁、零平台宏。"
  - "E011 复现：configure 内 `(umask 077 && mktemp -d \"./confXXXXXX\")` 在 HMDFS 建出的临时目录属主被映射、当前进程写不进 ⇒ `config.status: built: could not setup config files machinery` / `can't create ./confXxj9pU/subs1.awk: Permission denied`；`umask 077 → umask 022` 后全绿（必须在 autoreconf 之后改）。"
  - "config.guess 对 `uname` 返回的 `HarmonyOS`/`HongMeng Kernel` 无法识别 ⇒ `configure: error: cannot guess build type`；显式 `--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos` 后 configure 全绿（fdm 无 AC_TRY_RUN，交叉标记下 AC_LINK 类探测仍可用）。"
  - "运行期：fdm 要求 `getpwuid(getuid())` 命中（fdm.c:433-436）；OHOS /etc/passwd（本机 389 条）只有系统账号，交互/构建 uid（实测 20020084）无条目且 /etc 不可写、无 CAP_SETUID ⇒ 不补条目时 fdm 在配置解析之前就 `unknown user: <uid>` + exit 1。消费者测试用一个只补这一条 uid→passwd 映射的 LD_PRELOAD 垫片（test_package/fdm-test-passwd.c，仅测试期注入、不进交付产物），把 fetch→deliver 核心流程真实跑通。"
  - "configure 末尾若 b64_ntop 缺失会把 `-lresolv` 追加进 LIBS；OHOS 侧 libresolv 可链接、不报错，同时 compat/base64.c 被编入（NO_B64_NTOP）——两条路径都可用，无需干预。"

