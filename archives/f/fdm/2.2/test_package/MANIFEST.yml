# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制)

package: fdm/2.2
homepage: "https://github.com/nicm/fdm"

# 上游测试命令
# 上游 fdm 2.2 无任何测试套件：Makefile.am 无 TESTS / check_PROGRAMS、无 tests/ 目录，
# make check 实测输出 "Nothing to be done for 'check-am'."（见 ../manifest.yaml 的
# upstream_test_audit 与 ../notes.md 三）。此处仍声明真实执行的 check 目标。
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序：无（N_static = 0，no_tests）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: >-
      消费者验证：真实执行随包 bin/fdm —— (1) 二进制存在且可执行；
      (2) usage 参数面与启动期动态链接；(3) 端到端 fetch → deliver 核心流程
      （本地 maildir 源 → fdm fetch 抓取 → 正则匹配 → 投递到 mbox 目标，
      断言投递内容与源 maildir 被取空）；(4) 反例对照（同一规则集下主题
      不匹配的邮件不得投递到任何目标）。运行期垫片见 fdm-test-passwd.c。
    command: "bash test.sh"

# 测试断言总数（由 test.sh 自行打印：ASSERTIONS: 19 passed, 0 failed）
assertion_count: 19
