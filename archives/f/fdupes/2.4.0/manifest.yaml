  # 编译依赖列表（格式: name/version）
  dependencies: ["ncurses/6.5", "pcre2/10.45.1", "sqlite3/3.49.1"]

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []  # No patches needed - release tarball used as-is

# ============================================================
