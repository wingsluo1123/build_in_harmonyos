# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E002-HMDFS-tmpdir: autotools configure 需要 TMPDIR 环境变量"
  - "HMDFS 平台不支持 ./confXXXXXX 临时文件创建，需手动编译"

# ============================================================
# 二进制信息
# ============================================================

binary:
  # 安装前缀
  install_prefix: conan_package_folder

  # Staging 目录
  staging_dir: conan_build_staging

  # 二进制类型
  binary_type: executable

  # 可执行文件列表
  binaries:
