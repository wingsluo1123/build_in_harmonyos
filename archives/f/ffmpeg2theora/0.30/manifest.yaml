software: ffmpeg2theora

# 版本号
version: "0.30"

# 编译状态: built (conan adaptation pending - libtheora dependency not yet in artifact repo)
status: built

# 编译日期
build_date: "2026-08-06"

# 源码信息
source:
  url: "https://gitlab.xiph.org/xiph/ffmpeg2theora/-/archive/0.30/ffmpeg2theora-0.30.tar.gz"
  sha256: "814e80b76b49be5a9966d8a2077efd9326d98351b872cc1d7ee0896469cb1b9c"
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统: SCons (Python-based build system)
  system: scons

  # 配置选项
  configure_options: []

  # 编译依赖列表
  dependencies:
    - "ffmpeg/4.4.8"
    - "libtheora/1.1.1"
    - "libvorbis/1.3.7"
    - "libogg/1.3.6"

  # 编译器
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "0001-SConstruct.patch"
  - "0002-src-ffmpeg2theora.c.patch"
  - "0003-src-ffmpeg2theora.h.patch"
  - "0004-version.sh.patch"

# 知识沉淀
knowledge_gained:
  - "SCons build system requires Python 3 migration (print → print())"
  - "HarmonyOS needs SHELL='/system/bin/sh' in SCons Environment()"
  - "libtheora not yet published in conan artifact repo - dependency_missing"
  - "libpostproc made optional with HAVE_POSTPROC ifdef guard"
  - "libavcodec version check removed (conan .pc uses package version, not library version)"

patch_generation:
  method: per-file-difflib
  patches_count: 4
