# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ffmpeg2theora/0.30
homepage: "https://gitlab.xiph.org/xiph/ffmpeg2theora"

# 上游测试命令 (ffmpeg2theora 使用 SCons，无 make check)
upstream_check_command: "scons check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ffmpeg2theora 无自动化测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "运行 ffmpeg2theora --help 验证二进制可执行"
    command: "ffmpeg2theora --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
