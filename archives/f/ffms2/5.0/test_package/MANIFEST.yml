# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ffms2/5.0
homepage: "https://github.com/FFMS/ffms2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (requires googletest submodule + sample media files)
upstream_tests:
  - file: test/indexer.cpp
    source: ffms2-5.0/test/indexer.cpp
    description: "Indexer unit tests (requires googletest + sample media)"
    command: "./indexer"
  - file: test/hdr.cpp
    source: ffms2-5.0/test/hdr.cpp
    description: "HDR metadata tests (requires googletest + sample media)"
    command: "./hdr"
  - file: test/display_matrix.cpp
    source: ffms2-5.0/test/display_matrix.cpp
    description: "Display matrix tests (requires googletest + sample media)"
    command: "./display_matrix"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: FFMS_Init/FFMS_GetVersion/FFMS_GetLogLevel/FFMS_SetLogLevel/FFMS_CreateIndexer API 验证"
    command: "./test_ffms2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
