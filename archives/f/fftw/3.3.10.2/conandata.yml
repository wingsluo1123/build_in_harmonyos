sources:
  url: "https://www.fftw.org/fftw-3.3.10.tar.gz"
  sha256: "56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467"
patches:
  "3.3.10.2":
    - patch_file: "patches/fftw-0001-fix-swapped-soversion-version.patch"
      patch_description: "上游 CMake 把 SOVERSION 与 VERSION 写反，导致 soname 成了 libfftw3.so.3.6.9 而非 .so.3"
      patch_type: "portability"
    - patch_file: "patches/fftw-0002-bench-use-estimate-mode.patch"
      patch_description: "bench 默认用 FFTW_MEASURE 规划模式，在 OHOS/aarch64 上 32x64 等多维度/大尺寸问题的 MEASURE 计时循环不收敛，规划器陷入无限循环（speed.c 的 start_over 循环）。-o estimate 强制 FFTW_ESTIMATE，跳过 MEASURE 计时，上游测试全部通过。库功能本身不受影响。"
      patch_type: "portability"
