# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: findlib/1.9.8
homepage: https://github.com/ocaml/ocamlfind

# 上游测试命令
upstream_check_command: "make itest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make itest"

# make itest 实际运行的测试套件 (itest/目录)
upstream_tests:
  - name: "itest-ocamlc"
    source: findlib-1.9.8/src/findlib/itest/itest-ocamlc
    description: "ocamlc 通过 findlib 链接测试"
    command: "./itest-ocamlc"
  - name: "itest-ocamlopt"
    source: findlib-1.9.8/src/findlib/itest/itest-ocamlopt
    description: "ocamlopt 通过 findlib 链接测试"
    command: "./itest-ocamlopt"
  - name: "itest-ocamlcp"
    source: findlib-1.9.8/src/findlib/itest/itest-ocamlcp
    description: "ocamlcp 通过 findlib 链接测试"
    command: "./itest-ocamlcp"
  - name: "itest-ocamlmklib"
    source: findlib-1.9.8/src/findlib/itest/itest-ocamlmklib
    description: "ocamlmklib 通过 findlib 链接测试"
    command: "./itest-ocamlmklib"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "ocamlfind query findlib -format '%v' 版本验证"
    command: 'ocamlfind query findlib -format "%v"'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
