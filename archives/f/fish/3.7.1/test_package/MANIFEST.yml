test_type: "conan"
test_level: "L1"
upstream_tests:
  - name: "fish --version"
    description: "Verify fish binary reports correct version"
  - name: "fish -c 'echo hello'"
    description: "Verify fish can execute simple commands"
notes: |
  Fish is a shell application. Tests run the binary directly
  rather than linking against a library.
