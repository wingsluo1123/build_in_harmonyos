# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: flake/0.11
homepage: "https://sourceforge.net/projects/flake-enc/"

# flake 无 make check 测试套件
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# flake 上游无自动化测试
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 flake API: FLAKE_IDENT 字符串检查 + flake_set_defaults 函数调用 + block_time_ms 参数初始化验证"
    command: "./test_flake"

# 测试断言总数: FLAKE_IDENT 检查 + flake_set_defaults 返回值 + block_size 验证
assertion_count: 3
