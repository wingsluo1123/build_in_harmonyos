# Stub bundle managed manually by export_sources()/build() (NOT a conan patch):
# conan 2.x apply_conandata_patches tries to parse every patches: entry as a
# .patch, so the .tar.gz bundle lives here under a custom key instead.
stubs:
  dir: "patches/stubs"
  # Stub sources materialised under ${BUILD_FOLDER}/ by build() before
  # cmake.configure runs (copied manually, not by apply_conandata_patches):
  #   - include/openssl/*.h (empty, FLB_TLS=Off)
  #   - include/sqlite3.h (empty, FLB_SQLDB=Off)
  #   - include/fts.h (musl lacks fts.h; chunkio's cio_utils.c uses fts_open/read/close)
  #   - include/monkey/mk_core_info.h, mk_info.h, mk_env.h
  #   - include/fluent-bit/tls/flb_tls.h (declaration stub for FLB_TLS=Off)
  #   - ohos_link_stubs.c (empty impls for flb_sqldb_*, flb_http_server_*, pthread_cancel)
  # Kept as plain text files (no binary tar.gz) so PR diffs stay text-only
  # and CI's checkout-pr `git apply` can apply them.
  description: "HarmonyOS stub headers + generated monkey headers + link-time stubs source"
