    - "-DFLB_OUT_INFLUXDB=Off -DFLB_OUT_LOGDNA=Off -DFLB_OUT_NATS=Off"
    - "-DFLB_OUT_NRLOGS=Off -DFLB_OUT_OPENSEARCH=Off -DFLB_OUT_ES=Off"
