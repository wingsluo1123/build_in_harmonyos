# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fmt/11.2.0-r1
homepage: "https://github.com/fmtlib/fmt"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (fmt 11.2.0 ships 21 ctest targets)
upstream_tests:
  - file: test/format-test.cc
    source: fmt-11.2.0/test/format-test.cc
    description: "Core format API tests"
    command: "./bin/format-test"
  - file: test/chrono-test.cc
    source: fmt-11.2.0/test/chrono-test.cc
    description: "Chrono formatting tests"
    command: "./bin/chrono-test"
  - file: test/os-test.cc
    source: fmt-11.2.0/test/os-test.cc
    description: "OS/file utilities tests (file_test.line_buffering has known HarmonyOS platform limitation)"
    command: "./bin/os-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: fmt::format, fmt::print, fmt::to_string API calls"
    command: "./test_fmt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
