# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fnt/homebrew
homepage: "https://github.com/alexmyczko/fnt"

# 上游测试命令 (fnt 是纯 Shell 脚本，无上游测试)
upstream_check_command: ""

# conanfile.py build() 中无上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "验证 fnt --help 可执行"
    command: "fnt --help"

# 测试断言总数
assertion_count: 1