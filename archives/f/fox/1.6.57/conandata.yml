sources:
  "1.6.57":
    url:
      - "https://cdn.netbsd.org/pub/pkgsrc/distfiles/fox-1.6.57.tar.gz"
      - "https://www.mirrorservice.org/sites/ftp.netbsd.org/pub/pkgsrc/distfiles/fox-1.6.57.tar.gz"
    sha256: "65ef15de9e0f3a396dc36d9ea29c158b78fad47f7184780357b929c94d458923"
    tar_format: tar.gz

patches:
  "1.6.57":
    - patch_file: "patches/0001-config.sub-linux-ohos.patch"
      patch_description: "Teach the old config.sub that linux-ohos is a valid OS, so autotools accepts aarch64-linux-ohos as build/host triplet."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-configure-umask-hmdfs.patch"
      patch_description: "Create configure's temporary directory with umask 022 instead of 077: on HMDFS the owner of a 0700 directory is mapped to another uid, so the build process cannot write the config.status helper files (knowledge E011)."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0003-thread-cancellation-musl.patch"
      patch_description: "Provide the thread cancellation API FOX's FXThread uses on C libraries that omit it (musl on OHOS): the cancel state/type setters are accepted and a cancel request is refused with ENOTSUP instead of being faked."
      patch_type: "portability"
      strip: 1
