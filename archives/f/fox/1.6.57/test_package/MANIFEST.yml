package: fox/1.6.57
homepage: "https://www.fox-toolkit.org/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests: []
upstream_test_notes: "FOX 1.6.57 ships no test suite: tests/Makefile.am only declares noinst_PROGRAMS (example applications such as hello, table, memmap) with no TESTS or check_PROGRAMS entries, so make check builds nothing and runs nothing. The example programs also require an X display and a window manager to do anything observable."

test_package_tests:
  - file: test_fox.cpp
    description: "Link the packaged libFOX-1.6 and exercise display-free public API: the fxversion build-time version record, FXString construction/append/index/comparison and instance independence."
    command: "test_fox"
  - file: conanfile.py
    description: "Run the packaged bin/reswrap (upstream resource compiler used by downstream FOX applications at build time) over a resource file and assert it emits the expected 'const unsigned char sample[]' array carrying the resource content."
    command: "reswrap -o reswrap-sample.cpp resources/sample.txt"

assertion_count: 10
