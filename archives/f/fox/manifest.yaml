software: fox
name: FOX Toolkit
description: C++ 跨平台 GUI 工具包，同时提供 reswrap 资源编译器与 fox-config 构建助手
category: x11
license: LGPL-2.1-or-later
website: https://www.fox-toolkit.org/

versions:
  - version: "1.6.57"
    status: built
    compiled_at: 2026-10-14
    notes:
      - 1.6.57（2018-07-25），rezound 0.13.1beta 的硬依赖（configure.ac:739 AC_MSG_ERROR libfox not found）
      - 挂 6.4.0 版 libx11/libxext 历史栈（现代栈 libxext/1.3.7 制品仓缺失）
      - 随包产出 libFOX-1.6.so、libCHART-1.6.so 与 bin/{reswrap,fox-config}
    dependencies:
      - libx11/6.4.0
      - libxext/6.4.0.1
      - xorgproto/2025.1
      - libpng/1.6.58
      - libjpeg-turbo/3.2.0
      - libtiff/4.7.2
      - zlib/1.3.1.1
      - bzip2/1.0.8
    provides:
      - libFOX-1.6.so
      - libCHART-1.6.so
      - reswrap
      - fox-config
