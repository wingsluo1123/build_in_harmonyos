# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "freecell-solver 6.16.0 的 CMake 工程在 tarball 的 fc-solve/source 子目录（仓库路径），但发布包不含 rinutils 子模块；cmake/rinutils_bootstrap.cmake 先试 find_package(Rinutils QUIET)，未命中且目录已存在时会执行 git submodule update --init —— 在解包 tarball（非 git 检出）上必败。配方把 rinutils 0.6.0 解到 fc-solve/source/rinutils（bootstrap 期望的 <src>/rinutils/rinutils/include），补丁 0007 删除 submodule 分支，configure 全离线。"
  - "依赖真实性：上游 FIND_PROGRAM(_GPERF) 缺失即 FATAL_ERROR；configure/build 期 6 个 perl 生成器（gen-c-lookup-files.pl、gen-cmd-line-radix-tree.pl、gen-presets.pl、gen-move-funcs.pl、gen-man-page.pl、t/generate-card-tests.pl）全部 use Path::Tiny，而 OHOS Perl 无 CPAN —— 故 gperf/3.3 与 libpath-tiny-perl/0.118 均为 tool_requires，PERL5LIB 指向包的 lib/perl5。"
  - "GMP 不是本目标依赖：cmake/Shlomif_Common.cmake 的 MY_FIND_GMP 仅在 HAVE_INT128 不成立时查找 libgmp；aarch64 clang 的 __SIZEOF_INT128__ 成立，该分支整段跳过（gmp 无需打包）。"
  - "FCS_ENABLE_DBM_SOLVER 默认 ON 时上游只构建 delta-states-debondt-test 与 dbm-kaztree-compare-records 两个变体之一（DEBONDT_DELTA_STATES 决定）；配方断言 <build>/t 下两个 delta 程序中恰有一个存在，避免测试注册随上游开关漂移。"
  - "上游只注册 Perl run-tests.pl 一条 CTest；OHOS 缺 Task::FreecellSolver/Test::Differences 等 CPAN 模块，适配把同一批上游 C 程序逐条注册为 5 个 CTest 用例（不改测试代码），并把 cmocka 从 pkg_check_modules 改为 FIND_PACKAGE(cmocka CONFIG)（OHOS 无 cmocka 的 pkg-config 条目，CMakeDeps 导出 cmocka::cmocka）。"
  - "E330/E077：HMDFS 拒绝 VERSION/SOVERSION 的 .so 符号链接链 —— CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE 产出单文件 libfreecell-solver.so（裸 DT_SONAME）；cmake install() 重写 RUNPATH 会破坏 OHOS 构建期 .codesign，package() 以 llvm-objcopy --remove-section .codesign + binary-sign-tool -selfSign 1 重签全部 8 个 ELF（7 个 bin 工具 + 1 个库）。"
  - "pub API 细节：freecell_solver_user_current_state_stringify 的显示模式（parseable_output=0）对上盘行做 16 列对齐且省略 'Foundations:' 前缀；消费者若断言完成态应传 parseable_output=1，得到规范形式 'Foundations: H-K C-K D-K S-K'。"
  - "安装树含 7 个 ELF CLI（fc-solve、freecell-solver-range-parallel-solve、freecell-solver-fc-pro-range-solve、dbm-fc-solver、depth-dbm-fc-solver、freecell-solver-multi-thread-solve、pi-make-microsoft-freecell-board）、5 个 Python 棋盘助手、8 页 man6、presetrc + presets 共享数据、10 个公共头与 libfreecell-solver.pc；bin 非空故必须有 commands.json（PF8/R38）。"
