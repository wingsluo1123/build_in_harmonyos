# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/fc-solve/fc-solve/freecell-solver-6.16.0.tar.xz"
  sha256: "71b8882e68f1be62529069018d0c732b75078669077c96348279575849f34313"
  tar_format: tar.xz
  bundled_sources:
    - name: rinutils
      version: "0.6.0"
      url: "https://codeload.github.com/shlomif/rinutils/tar.gz/refs/tags/0.6.0"
      sha256: "81966e7f73a9a8e095dd06c159cfb8dd0da2b78942ba83b323d7ff59f74800cf"
      staged_at: "fc-solve/source/rinutils"
      license: MIT

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "build_script_folder=fc-solve/source（tarball 内 CMake 工程根；源包 <source_folder>/fc-solve/source）"
    - "rinutils 0.6.0 预置在 fc-solve/source/rinutils：发布 tarball 未带该子模块头文件，cmake/rinutils_bootstrap.cmake 期望 <src>/rinutils/rinutils/include（补丁 0007 同时移除非 git 检出上必然失败的 git submodule update 分支）"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DDISABLE_APPLYING_RPATH=ON + -DCMAKE_INSTALL_RPATH=$ORIGIN:$ORIGIN/../lib（上游默认把 CMAKE_INSTALL_FULL_LIBDIR 烤进可执行文件；改为可搬迁 $ORIGIN 布局）"
    - "-DBUILD_STATIC_LIBRARY=OFF（上游主库本就只建 SHARED；静态孪生只放大构建时间）"
    - "-DFCS_WITH_TEST_SUITE=ON（上游 t/ 下 cmocka C 单测程序照常构建并注册 CTest）"
    - "-DFCS_SKIP_PERL_TEST_HARNESS=ON、-DFCS_SKIP_PERL_GENERATED_TESTS=ON、-DSKIP_PERL_TESTING_TASK_CHECK=ON（OHOS Perl 无 CPAN：Moo/Template/Task::FreecellSolver 等缺席；三开关由补丁 0001/0002 新增）"
    - "构建目录内 Platform/HarmonyOS.cmake 垫片（include(Platform/Linux)，CMake 无 HarmonyOS 平台模块，E140/fluidsynth 先例）"
    - "-DCMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE（HMDFS 禁 symlink：单文件无版本 .so + 裸 DT_SONAME，E330；package() 对 install 重写 RUNPATH 后的 ELF 重签 .codesign）"
    - "-DCMAKE_EXE_LINKER_FLAGS_INIT / -DCMAKE_SHARED_LINKER_FLAGS_INIT=-Wl,-z,max-page-size=0x1000（OHOS 加载器 4K 段布局）"
    - "TMPDIR=$HOME/tmp（/tmp 只读；Path::Tiny->tempdir 与 pod2man 包装器按 TMPDIR 落盘）"
    - "PERL5LIB=<libpath-tiny-perl>/lib/perl5（configure/build 期 perl 生成器 use Path::Tiny）"

  dependencies:
    - "gperf/3.3 (tool_requires，上游 FIND_PROGRAM(_GPERF) FATAL_ERROR 硬依赖)"
    - "libpath-tiny-perl/0.118 (tool_requires，6 个 perl 生成器 use Path::Tiny；OHOS Perl 无 CPAN)"
    - "cmocka/2.0.2 (test_requires，t/ 下 5 个 cmocka C 单测程序)"

  system_dependencies:
    - libm
    - libc

  cc: clang
  cxx: clang++

