patches:
  3.26.0:
    - patch_file: patches/0001-winpr-pthread-cancel.patch
      patch_description: >-
        musl (and therefore OHOS) has no pthread_cancel; replace the
        "#ifndef ANDROID" guard around the WinPR TerminateThread() call with
        a CMake check_symbol_exists(pthread_cancel) capability probe.
      patch_type: portability
