software: freerdp
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.26.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.26.0"

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-10-17"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/FreeRDP/FreeRDP/releases/download/3.26.0/freerdp-3.26.0.tar.gz"
  sha256: "55fa5c3159399886ba4adbe2c8a10d0b1c0484022efdf3827f68adc478b944d5"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: cmake

build:
  system: cmake

  # 与 conanfile.py generate() 注入的变量一一对应
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=OFF"
    # HarmonyOS 无 Platform/HarmonyOS.cmake：不注入 soname 标志则 SOVERSION 静默失效
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname,"
    # 前端需要 X11/Wayland/SDL 与显示服务器，OHOS 基线不提供
    - "-DWITH_CLIENT=OFF"
    - "-DWITH_CLIENT_COMMON=ON"
    - "-DWITH_X11=OFF"
    - "-DWITH_WAYLAND=OFF"
    - "-DWITH_SERVER=OFF"
    - "-DWITH_SHADOW=OFF"
    - "-DWITH_PROXY=OFF"
    - "-DWITH_PLATFORM_SERVER=OFF"
    # 通道插件是 OBJECT 库，只被前端链接，前端不构建时无产物
    - "-DWITH_CLIENT_CHANNELS=OFF"
    - "-DWITH_CHANNELS=ON"
    # 可选多媒体/设备后端在 OHOS 基线无开发包
    - "-DWITH_FFMPEG=OFF"
    - "-DWITH_SWSCALE=OFF"
    - "-DWITH_CAIRO=OFF"
    - "-DWITH_CUPS=OFF"
    - "-DWITH_PCSC=OFF"
    - "-DWITH_KRB5=OFF"
    - "-DWITH_GSSAPI=OFF"
    - "-DWITH_OPUS=OFF"
    - "-DWITH_ALSA=OFF"
    - "-DWITH_PULSE=OFF"
    - "-DWITH_SNDIO=OFF"
    - "-DWITH_OSS=OFF"
    - "-DWITH_FUSE=OFF"
    - "-DWITH_LIBSYSTEMD=OFF"
    - "-DWITH_PAM=OFF"
    - "-DWITH_SAMPLE=OFF"
    - "-DWITH_WINPR_TOOLS=ON"
    - "-DWITH_UNICODE_BUILTIN=ON"
    # OpenSSL 3 静态包不含可加载的 legacy provider：MD4/RC4 用内置实现
    - "-DWITH_INTERNAL_MD4=ON"
    - "-DWITH_INTERNAL_RC4=ON"

  dependencies:
    - openssl/3.5.8.1
    - zlib/1.3.2.1
    - libusb/1.0.29

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-winpr-pthread-cancel.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 的 CMAKE_SYSTEM_NAME=HarmonyOS 没有 CMake 平台模块，CMAKE_SHARED_LIBRARY_SONAME_<LANG>_FLAG 为空，set_target_properties(VERSION/SOVERSION) 静默失效：产物无 DT_SONAME，DT_NEEDED 记录链接路径（winpr/libwinpr/libwinpr3.so），只能靠配方注入 -Wl,-soname, 恢复"
  - "CMakeDeps 发布小写 openssl-config.cmake 并设 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，winpr 消费的大写 OPENSSL_FOUND/OPENSSL_INCLUDE_DIR/OPENSSL_LIBRARIES 会全空，需在配方 cache_variables 里补"
  - "urbdrc 走 module 模式变量 LIBUSB_1_INCLUDE_DIRS/LIBUSB_1_LIBRARIES（上游 docs/mingw-example/Dockerfile 同样做法），不注入则 urbdrc 找不到 libusb.h"
  - "musl 无 pthread_cancel，上游只用 #ifndef ANDROID 守卫 TerminateThread 调用；改用 check_symbol_exists(pthread_cancel) 能力探测（补丁 0001）"
  - "OpenSSL 3 把 MD4/RC4 移入 legacy provider，WinPR 运行期 OSSL_PROVIDER_load(nullptr,\"legacy\") 在静态 openssl 包下加载失败，NTLM 认证与 RDP 标准安全层不可用；开启 WITH_INTERNAL_MD4/WITH_INTERNAL_RC4 走上游内置实现"
  - "通道插件（cliprdr/rdpdr/rail/disp/rdpsnd/urbdrc）是 OBJECT 库，只被客户端前端链接，WITH_CLIENT=OFF 时没有任何插件产物可安装"
