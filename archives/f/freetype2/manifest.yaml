name: freetype2
description: FreeType is a freely available software library to render fonts.
website: https://freetype.org
category: graphics

versions:
  2.13.2:
    status: built
    build_system: cmake
    configure_options:
      - -DCMAKE_INSTALL_PREFIX=~/usr/local
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    dependencies:
      required:
        - zlib
      optional:
        - harfbuzz
        - libpng
        - bzip2
        - brotli
    notes: |
      - autotools 构建在 HMDFS 上有临时文件权限问题，使用 CMake 构建成功
      - 需要打补丁 config.guess 和 config.sub 以支持 HarmonyOS