# conandata.yml - fslsfonts 1.0.7
# The url value is a LIST on purpose: the single-value mirror rewriting points
# xorg URLs at a dead mirror, and the release host may fail TLS from HarmonyOS.
# Both URLs are official x.org hosts and serve byte-identical tarballs
# (sha256 of both copies verified equal: 67cddb1aa7...c6f306b63, 127436 B).
sources:
  url:
    - "https://xorg.freedesktop.org/archive/individual/app/fslsfonts-1.0.7.tar.xz"
    - "https://www.x.org/releases/individual/app/fslsfonts-1.0.7.tar.xz"
  sha256: "67cddb1aa7fccab5d107beef32fa2c143e8a132a2b974a557557b24c6f306b63"

patches:
  - patch_file: "patches/0001-configure-hmdfs-pwd-tmpdir.patch"
    patch_description: "configure: fall back to PWD when pwd (getcwd) fails on HMDFS, and relax the config.status tmp dir from umask 077 to 022"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "config.guess: recognize a HarmonyOS uname and emit aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "config.sub: accept the ohos OS token and the linux-ohos kernel and OS pair"
    patch_type: "portability"
