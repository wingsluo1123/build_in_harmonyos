# test_package/MANIFEST.yml
# fslsfonts 1.0.7 上游测试声明
#
# 上游无任何自动化测试：顶层 Makefile.am 与 man/Makefile.am 中
# grep -E "TESTS|check_" 均命中 0 条（automake 只会生成空的 check 目标），
# 因此上游可执行测试数 = 0，不存在"上游 N 项"的对比基线。
# 本包全部测试均为 test_package 自造的消费者断言，声明数 = 实测执行数。
#
# 运行期能力面：fslsfonts 的主功能路径（列出字体）需要可达的 X Font
# Server（FONTSERVER 环境变量或 -s servername），CI/构建环境不提供 font
# server，故无服务器依赖的代码路径断言（-version / -help / 无服务器用法错
# 误 / 服务器不可达时的干净报错）。

package: fslsfonts/1.0.7
homepage: "https://gitlab.freedesktop.org/xorg/app/fslsfonts"

# 上游声明的 check 命令（automake 生成，实为空目标）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序：无
upstream_tests: []

# test_package 自带的消费者断言（在无头环境可稳定复现的真断言）
test_package_tests:
  - file: test.sh
    description: "二进制可在 conanrun 环境解析（依赖闭包可加载）"
    command: "command -v fslsfonts"
  - file: test.sh
    description: "-version 横幅输出 'fslsfonts 1.0.7' 且退出码 0（30s 超时保护）"
    command: "fslsfonts -version"
  - file: test.sh
    description: "-help 打印 usage 与选项说明，退出码 0（不接触服务器）"
    command: "fslsfonts -help"
  - file: test.sh
    description: "FONTSERVER 置空后 -l：无服务器用法错误 'no font server defined' + usage，退出码 1，30s 内自行终止"
    command: "env -u FONTSERVER fslsfonts -l"
  - file: test.sh
    description: "-s 127.0.0.1:1 走真实 FS 连接路径，连接被拒后干净报错 'unable to open server'，退出码 0，不挂死"
    command: "env -u FONTSERVER fslsfonts -s 127.0.0.1:1 -l"
  - file: test.sh
    description: "readelf -d 解析 ELF NEEDED 项，确认 libFS.so.6 依赖闭包齐全（无 readelf 时如实 SKIP）"
    command: "readelf -d $(command -v fslsfonts)"

assertion_count: 6
