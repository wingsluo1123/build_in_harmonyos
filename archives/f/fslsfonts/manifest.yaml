software: fslsfonts
name: X Font Server font lister
description: List the fonts served by an X Font Server through the FS protocol client library
category: x11
license: MIT
website: https://www.x.org/

versions:
  - version: "1.0.7"
    status: built
    compiled_at: 2026-10-15
    notes: |
      - X.Org app 包，1 个 C 源文件（fslsfonts.c）+ 1 个手册页，autotools 构建
      - 纯 FS 协议客户端：依赖 libFS（libfs）+ xorgproto 的 pkg-config 视图，
        不链接 libX11、不依赖 X server
      - config.guess/config.sub 补丁识别 HarmonyOS 与 ohos 三元组
      - HMDFS 补丁：configure 的 pwd 回退 $PWD、config.status umask 077→022
      - 上游无自动化测试（Makefile.am 内 TESTS/check_ 命中 0），测试全部由
        test_package 自造：6 条无头断言全过
      - 主功能路径（列出字体）需可达的 X font server（FONTSERVER/-s），构建/CI
        环境不可达属运行期能力墙，已如实披露
    dependencies:
      - libfs
      - xorgproto
    provides:
      - fslsfonts
