knowledge_gained:
  - "E007 完整命中：config.guess 无 HarmonyOS 分支时 configure 首错逐字为 `configure: error: cannot guess build type; you must specify one`，必须补 config.guess 而非用 --build/--host 绕过"
  - "E129/E110/E112：configure 的 config.status 临时目录用 `umask 077 && mktemp -d` 建出 700 目录，HMDFS 拒写，首错逐字为 `./config.status: built 593: ./conf5hU5rv/subs1.awk: Permission denied`"
  - "同族三补丁模板对本代 x.org tarball 不适用：本 1.0.8 的 config.sub 实测已接受 aarch64-unknown-linux-ohos（rc=0），故不带 config.sub 补丁 —— 领同族包时应先跑 `./config.sub <triplet>` 探针再决定，别整套照抄"
  - "E386 家族：HMDFS 下 `pwd`(getcwd) 在父目录不可达时失效，G0 干净构建验证首错逐字为 `configure: error: working directory cannot be determined`；补丁 0002 在 `ac_pwd` 失败时回退 $PWD（与已合入同族 fslsfonts/xcmsdb 同款 hunk），但不预置 os.environ[PWD]（E386 forbid_2 反对配方侧注入）；CI 权威路径 conan create 不需要该 hunk（真实构建目录内子进程 pwd 实测 rc=0、stderr 为空）"
  - "pkg-config 视图陷阱：libx11 包内自带的 x11.pc 的 prefix 为 `/`（`-I//include` 死路径），必须用 PkgConfigDeps 生成到 generators 目录的 x11.pc；错用包内 pc 会 configure 通过但 make 首错 `chars.c:49:10: fatal error: 'X11/Xlib.h' file not found`"
  - "PkgConfigDeps 已把 xorgproto 的 share/pkgconfig 暴露给 PKG_CONFIG_PATH，xproto/kbproto/fontsproto 均可解析（实测 7.0.34 / 1.0.7 / 2.1.3），本包无需 appres 那样的 xproto 别名"
  - "E182/E188 在本包不成立：configure 解析到 GNU ginstall，`ginstall -c` 对 man 页与二进制均 rc=0，故不带 fslsfonts 的 install shim（该 shim 在 fslsfonts 实际日志中也从未生效：`/ginstall` 不含子串 `/install`，改写条件不命中）"
  - "GNU make 的 jobserver 需要 FIFO，本平台 mkfifo 被拒：`make: jobserver mkfifo: … Operation not permitted` ⇒ 配方固定 `make -j1`"
  - "E490 在本包不成立：G0 预警 autotools 脚本可能丢失可执行位，实测 configure 正常执行 ⇒ 位未丢，无需 chmod +x（且 E386 forbid_1 反对 blanket chmod +x）"

