# test_package/MANIFEST.yml
# fstobdf 1.0.8 上游测试清点结论
#
# 上游无任何自动化测试。2026-10-16 对解包后的 1.0.8 源码树逐项实测：
#   find . -type d -name 'test*'                       -> 0
#   grep -rE 'TESTS|check_PROGRAMS|check_SCRIPTS' Makefile.am man/Makefile.am configure.ac -> 0
#   ls tests/ t/                                        -> 不存在
# 因此上游可执行测试数 = 0，不存在「上游 N 项」的对比基线；本包全部测试均为
# test_package 自造的消费者断言，声明数 = 实测执行数。
#
# 运行期能力面：fstobdf 的主功能路径（从 font server 导出字体并打印 BDF）
# 需要可达的 X Font Server（FONTSERVER 环境变量或 -server），CI/构建环境不
# 提供 font server，故只断言不依赖服务器的路径与「无服务器时按文档干净退出」
# 的路径。
#
# 重要上游行为：fstobdf 的 usage() 以 exit(0) 结束（上游 fstobdf.c:56-62），
# 因此所有用法错误路径的退出码都是 0；负向对照落在 stderr 文案、stdout 为空
# 以及「不得输出 BDF」三条上，而不是退出码。

package: fstobdf/1.0.8
homepage: "https://gitlab.freedesktop.org/xorg/app/fstobdf"

# 上游声明的 check 命令（Makefile.am 无 TESTS，automake 只生成空 check 目标）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序：无
upstream_tests: []

# test_package 自带的消费者断言（在无头环境可稳定复现的真断言）
test_package_tests:
  - file: test.sh
    description: "二进制可在 conanrun 环境解析（依赖闭包可加载）"
    command: "command -v fstobdf"
  - file: test.sh
    description: "-version 在 stdout 精确输出 'fstobdf 1.0.8'，退出码 0，stderr 必须为空"
    command: "fstobdf -version"
  - file: test.sh
    description: "无参数：stderr 为 'No font name specified' + Usage 用法行，退出码 0，stdout 必须为空（不得输出 BDF）"
    command: "fstobdf"
  - file: test.sh
    description: "-fn 缺参数：stderr 为 '-fn requires an argument'，退出码 0"
    command: "fstobdf -fn"
  - file: test.sh
    description: "-server 缺参数：stderr 为 '-server requires an argument'，退出码 0"
    command: "fstobdf -server"
  - file: test.sh
    description: "未知选项：stderr 逐字包含 \"unrecognized option '-bogus'\" 并回显该选项名，退出码 0"
    command: "fstobdf -bogus"
  - file: test.sh
    description: "FONTSERVER 置空且 -fn fixed：stderr 为 'No font server specified.'，退出码 0，且 stdout 不得出现 STARTFONT/ENDFONT（负向对照）"
    command: "env -u FONTSERVER fstobdf -fn fixed"
  - file: test.sh
    description: "包内手册页 share/man/man1/fstobdf.1 存在、非空且提及 fstobdf"
    command: "test -s \"$(dirname $(command -v fstobdf))/../share/man/man1/fstobdf.1\""
  - file: test.sh
    description: "readelf -d 解析 ELF NEEDED，确认 libFS.so.6 与 libX11.so.6 依赖闭包齐全（无 readelf 时如实 SKIP）"
    command: "readelf -d $(command -v fstobdf)"

assertion_count: 9
