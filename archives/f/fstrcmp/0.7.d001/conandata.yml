sources:
  url: "https://mirrors.kodi.tv/build-deps/sources/fstrcmp-0.7.D001.tar.gz"
  sha256: "e4018e850f80700acee8da296e56e15b1eef711ab15157e542e7d7e1237c3476"

patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_description: "Accept the aarch64-linux-ohos Autoconf triplet in the bundled config.sub: add aarch64 to the CPU table and accept -linux-ohos in the OS alias/main tables (upstream config.sub predates HarmonyOS)"
    patch_type: "portability"
  - patch_file: "patches/0003-test-prelude-tmpdir.patch"
    patch_description: "Honour TMPDIR in script/test_prelude.sh.in: the suite hardcodes testdir=/tmp/fstrcmp-$$ and the CI worker mounts /tmp read-only, so every test aborts with mkdir: Read-only file system"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Use umask 022 for the ./confXXXXXX temp dir that config.status sets up: HMDFS turns umask-077 dirs into an unwritable drwx--S--- dir, so ./confXXXXXX/subs1.awk fails with Permission denied (same E114 fix as a52dec)"
    patch_type: "portability"
