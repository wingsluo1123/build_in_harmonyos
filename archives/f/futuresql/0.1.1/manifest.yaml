knowledge_gained:
  - "futuresql 0.1.1 is archived upstream: download.kde.org/stable/futuresql redirects to the KDE Attic. The Attic mirrors (ftp.gwdg.de, mirrors.nju.edu.cn, mirrors.ustc.edu.cn) plus the official download.kde.org URL are listed in conandata.yml; the tarball sha256 e44ed8d5…cbcbebd43 was verified byte-for-byte from the official tarball."
  - "futuresql links Qt6 Core + Sql. Only qtbase-sql-dbus/6.11.1 (FEATURE_sql=ON, dbus/1.14.10, QSQLITE driver plugin) provides Qt6Sql on OHOS; the baseline qtbase is built with FEATURE_sql=OFF and must not shadow it in CMAKE_PREFIX_PATH/LD_LIBRARY_PATH."
  - "Upstream autotests need QCoro6::Core only at test time (QCoro::Task coroutine test bodies). Declaring it with test_requires keeps qcoro and its baseline qtbase out of the consumers' dependency graph."
  - "The upstream top-level CMakeLists calls qcoro_enable_coroutines(), which is defined in the real QCoro6Coro/QCoroMacros.cmake. The CMakeDeps-generated QCoro6Config.cmake only declares Conan component targets and lacks the macro, so find_package(QCoro6) must resolve the real package config: prepend <qcoro>/lib/cmake ahead of the generators folder (QCoro6Config -> QCoro6CoreConfig -> find_dependency(QCoro6Coro) -> QCoroMacros.cmake)."
  - "HMDFS on the device refuses symlink(2) with EACCES (Permission denied; EPERM/ENOSYS/EOPNOTSUPP are the other refusals handled). CMake's VERSION/SOVERSION symlink chain (libfuturesql6.so -> libfuturesql6.so.0) aborts the link step. A runtime capability probe in generate() sets CMAKE_PLATFORM_NO_VERSIONED_SONAME=ON when symlinks are unavailable, keeping the injected -Wl,-soname, flag so the installed libfuturesql6.so still carries DT_SONAME (DRAFT-7341 libtiff precedent). On hosts where symlinks work the upstream versioned layout is preserved."
  - "CMake has no Platform/HarmonyOS module: CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG must be injected in generate() or the shared library ships without DT_SONAME (CI L5a) and exported targets get IMPORTED_NO_SONAME TRUE (L5c)."
  - "ECM_MODULE_PATH must be set manually: ecm is a build-context tool_requires, so CMakeDeps generates no ECMConfig.cmake; the real ECMConfig.cmake is located through CMAKE_PREFIX_PATH."
  - "ECM's KDEInstallDirs6 runs Qt6::qtpaths at configure time, so the qtbase-sql-dbus bin/ and lib/ directories must be on PATH/LD_LIBRARY_PATH during cmake configure."
