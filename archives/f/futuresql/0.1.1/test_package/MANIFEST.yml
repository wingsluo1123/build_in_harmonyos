# test_package/MANIFEST.yml
# Upstream and consumer test declaration for futuresql/0.1.1.

package: futuresql/0.1.1
homepage: https://invent.kde.org/libraries/futuresql

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: tests/sqlitetest.cpp
    source: futuresql-0.1.1/tests/sqlitetest.cpp
    description: "Upstream QTest suite: testDeserialization (execute/getResult/getResults with the built-in and custom deserializers) and testMigration (runMigrations over tests/migrations). The coroutine bodies run through QCoro::Task on an in-memory SQLite database."
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; QCoro6::Core comes from the qcoro/0.13.0 test_requires"

test_package_tests:
  - file: test_package/test_package.cpp
    description: "Consumer end-to-end: establishConnection, real connection state via runOnThread (QSqlDatabase::isOpen), CREATE TABLE verified through sqlite_master, INSERT verified through SELECT count(*), getResults<Row> and getResult<Row> over the installed libfuturesql6 and the packaged QSQLITE driver plugin."
    command: "conan create (test_package builds and runs test_package)"
    condition: "always (skipped when the host cannot run target binaries); exits non-zero if any named case fails"

assertion_count: 8
