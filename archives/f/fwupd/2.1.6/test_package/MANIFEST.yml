# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fwupd/2.1.6
homepage: "https://github.com/fwupd/fwupd"

# 上游测试命令
upstream_check_command: "meson test -C build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: libfwupd
    source: fwupd-2.1.6/libfwupd
    description: "libfwupd unit tests"
    command: "meson test -C build libfwupd"
  - file: libfwupdplugin
    source: fwupd-2.1.6/libfwupdplugin
    description: "libfwupdplugin unit tests"
    command: "meson test -C build libfwupdplugin"
  - file: src
    source: fwupd-2.1.6/src
    description: "fwupd engine unit tests"
    command: "meson test -C build src"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "fwupd API consumer test (R34)"
    command: "./test_fwupd"

# 测试断言总数
assertion_count: 2
