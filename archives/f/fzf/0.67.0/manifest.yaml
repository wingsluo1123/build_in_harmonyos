  size: 4391096
  type: "ELF executable, 64-bit LSB arm64, static"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目在 OHOS 上编译需要 elfldr 自动介入处理 SVC syscall 和 mmap 调用"
  - "fzf Makefile 使用 git describe/log 获取版本信息，从 tarball 编译需手动设置 FZF_VERSION 和 FZF_REVISION"
  - "conan-init 默认将 Go 项目识别为 autotools，需要手动重写 conanfile.py 为 Go 构建系统"
  - "GitHub 直连在 OHOS 上有 SSL 证书问题，可使用 codeload.github.com 直接下载端点绕过"
  - "test_package 需使用 Conan 2.x API (self.dependencies) 替代 1.x 的 deps_cpp_info"
