# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/junegunn/fzf/archive/refs/tags/v0.67.0.tar.gz"

  # 源码校验和
  sha256: "da72936dd23045346769dbf233a7a1fa6b4cfe4f0e856b279821598ce8f692af"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
