# 版本级 manifest — gammastep 2.0.9（ARCHIVE-SPEC v2.0）

version: "2.0.9"
software: "gammastep"

# 编译状态：published | built | failed | archived
# 本包只到 W3 本地构建验证 + 消费者测试通过 ⇒ built（制品未上传 ⇒ 不用 published）
status: built

build_date: "2026-10-16"
build_system: "autotools"

source:
  url: "https://gitlab.com/chinstrap/gammastep/-/archive/v2.0.9/gammastep-v2.0.9.tar.gz"
  sha256: "bbb9d90e1cf30920c1017db4ce5c4652e4c7843fd4c4e34164d99ecbc3bbb4c0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-drm"
    - "--enable-wayland"
    - "--enable-randr"
    - "--enable-vidmode"
    - "--disable-geoclue2"
    - "--disable-gui"
    - "--build=aarch64-linux"
