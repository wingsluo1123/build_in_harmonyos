# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: garcon/4.20.0
homepage: "https://gitlab.xfce.org/xfce/garcon"

# 上游测试套件为 noinst 程序（不接入 make check）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: false
upstream_test_audit: |
  审计结论：上游 garcon 4.20.0 的测试程序未接入构建系统测试目标（N=0 注册用例）。
  1. 上游仓库（archive.xfce.org garcon 4.20.0 tarball 逐文件核对）：
     tests/ 目录含 test-menu-parser.c / test-menu-spec.c /
     test-display-menu-gtk3.c 三个源文件。
  2. tests/Makefile.am 中三个程序均声明为 noinst_PROGRAMS（构建但不
     安装、不被 make check 执行）；无 TESTS= 声明、无 check_PROGRAMS。
  3. 功能验证由消费者冒烟测试补全（test_package/test.c）：
     版本 API（garcon_get_version_major/minor，断言 1.x）、
     菜单构造+销毁（garcon_menu_new_for_path，GObject 类初始化与
     libxfce4util 链路验证）、menu-item-pool 构造+销毁共 3 用例真
     编译真执行真断言。

# 上游实际运行的测试程序（无——N=0）
upstream_tests: []
