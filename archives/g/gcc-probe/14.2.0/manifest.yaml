# 版本级 manifest — gcc-probe
# 文件位置: archives/g/gcc-probe/14.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "14.2.0"
software: "gcc-probe"
status: built
build_date: "2026-10-08"
build_system: "autotools-custom"

source:
  url: "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
  sha256: "a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9"
  tar_format: tar.xz

build:
  system: autotools-custom
  configure_options:
    - "--enable-languages=c,c++"
    - "--disable-bootstrap"
    - "--disable-lto"
    - "--enable-plugin"
    - "--enable-shared"
    - "--disable-multilib"
    - "--disable-nls"
    - "--disable-werror"
    - "--without-isl"
  dependencies:
    - "bundled gmp/6.2.1"
    - "bundled mpfr/4.1.0"
    - "bundled mpc/1.2.1"
  cc: clang
  cxx: clang++

source_transforms:
  - "Inject aarch64-unknown-linux-ohos mapping into config.sub/configfsf.sub at build time"
  - "Route linux-ohos to tconfig ohos.h and the t-musl target makefile"
  - "Replace Autoconf umask 077 with umask 022 for HMDFS"

tests:
  upstream: 3312
  after_adapt: 101
  evidence: "reports/test-report.md"

patches_applied: []

knowledge_gained:
  - "config.sub/configfsf.sub 不识 HarmonyOS 三元组，构建期注入 aarch64-unknown-linux-ohos 映射 (ref: E007, E072, E268)"
  - "Autoconf umask 077 在 HMDFS 下建 700 目录不可写，构建期改写为 022 (ref: E110, E112)"
