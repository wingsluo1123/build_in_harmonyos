# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gd/2.3.3
homepage: "https://libgd.github.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/gdimagefilledrectangle/gdimagefilledrectangle_basic.c
    source: gd-2.3.3/tests/gdimagefilledrectangle/gdimagefilledrectangle_basic.c
    description: "Test gdImageFilledRectangle basic functionality"
    command: "./tests/gdimagefilledrectangle/gdimagefilledrectangle_basic"
  - file: tests/gdimagecolor/gdimagecolor_basic.c
    source: gd-2.3.3/tests/gdimagecolor/gdimagecolor_basic.c
    description: "Test gdImageColor allocation"
    command: "./tests/gdimagecolor/gdimagecolor_basic"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 创建图像、分配颜色、绘制矩形、验证像素"
    command: "./test_gd"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
