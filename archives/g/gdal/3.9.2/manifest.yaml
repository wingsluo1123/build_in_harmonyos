software: gdal
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.9.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.9.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/OSGeo/gdal/releases/download/v3.9.2/gdal-3.9.2.tar.gz"

  # 源码校验和
  sha256: "c9767e79ca7245f704bfbcb47d771b2dc317d743536b78d648c3e92b95fbc21e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: cmake
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_APPS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_PYTHON_BINDINGS=OFF"
    - "-DGDAL_BUILD_OPTIONAL_DRIVERS=OFF"
    - "-DOGR_BUILD_OPTIONAL_DRIVERS=OFF"
    - "-DGDAL_USE_PROJ=ON"
    - "-DGDAL_USE_SQLITE3=ON"
    - "-DOGR_ENABLE_DRIVER_SQLITE=ON"
    - "-DOGR_ENABLE_DRIVER_GPKG=ON"
    - "-DGDAL_USE_TIFF=ON"
    - "-DGDAL_USE_PNG=ON"
    - "-DGDAL_USE_JPEG=ON"
    - "-DGDAL_USE_CURL=OFF"
    - "-DGDAL_USE_OPENSSL=OFF"
    - "-DGDAL_USE_WEBP=OFF"
    - "-DGDAL_USE_ARROW=OFF"
    - "-DGDAL_USE_PARQUET=OFF"
    - "-DGDAL_USE_ARROWDATASET=OFF"
    - "-DGDAL_USE_GEOS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - proj/9.3.1
    - sqlite3/3.49.1
    - libtiff/4.7.2
    - libpng/1.6.58
    - libjpeg-turbo/3.2.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
