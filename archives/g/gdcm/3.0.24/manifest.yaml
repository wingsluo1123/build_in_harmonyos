knowledge_gained:
  - "ohos.toolchain.cmake 强制 CMAKE_RANLIB=<SDK>/llvm/bin/llvm-ranlib，但设备 SDK 的 llvm/bin 缺 llvm-ranlib（只有 ar/nm/objcopy）→ 静态库链接报 'Error running link command'；SDK 只读，修法=configure 后重写 build 树所有 link.txt 的 ranlib 路径（幂等，CI 有 ranlib 时自动跳过）；命令行 -DCMAKE_RANLIB 只改 cache、不重生成 link.txt，因此无效"
  - "库清单不能照抄同族版本：3.0.24 的 Utilities/gdcmrle/CMakeLists.txt:7 把 add_library(gdcmrle) 注释掉了（RLE 源码进 gdcmMSFF），且 GDCM_USE_SYSTEM_{ZLIB,EXPAT}=ON 时 Utilities/CMakeLists.txt:21/68 的 add_subdirectory 被跳过 → 无 libgdcmzlib/libgdcmexpat；实际 install 树只有 14 个 .a"
  - "gdcmMEXD 用 target_link_libraries(... LINK_PRIVATE socketxx)（Source/MessageExchangeDefinition/CMakeLists.txt:99）：LINK_PRIVATE 不进导出清单，但 llvm-nm -u 实测留有 sockbuf/sockinetbuf/iosockinet 等未定义符号，静态库消费方必须显式链 socketxx，否则 undefined reference；用 'nm -u | grep socket' 探会得到假阴性（需 c++filt 或按类名检索）"
  - "plain char 符号性是实现定义：OHOS arm64 SDK 下 char 是 unsigned（numeric_limits<char>::min()==0），上游 TestRescaler2 的 TestRescaler2Func<char,char> 假设 signed（x86 语义）→ 输入输出双向回绕断言失败；显式 signed char 修复"
  - "PS3.5 6.2 填充语义实测校准：奇数长 UI 补 0x00、奇数长 CS 补空格 0x20、偶数长不补；Attribute::GetValue() 不去填充——按'预期补空格'写的 UI 断言会假失败"
  - "GDCM_DATA_ROOT 不要手动指向空目录：if(GDCM_DATA_ROOT) 分支成立会让数据驱动用例注册但文件表为空 → 用例空转、注册数虚高（假覆盖）；交给上游 find_path() 自然判空"
  - "GDCM_BUILD_DOCBOOK_MANPAGES 不在 GDCM_DOCUMENTATION 守卫内（Utilities/doxygen/CMakeLists.txt:228），开着会取在线 docbook DTD，无外网时构建在 35% 处失败"
  - "/dev/shm 占满时 conan 并行下载 ThreadPool 起不来，报 OSError [Errno 28]（磁盘其实很空）；绕过 = 'conan create ... -cc core.download:parallel=0'，注意 -c 拒绝 core.*、-cc 不能放子命令前；属本地设备环境问题，勿写进随 PR 提交的配置"
