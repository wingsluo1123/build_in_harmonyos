name: gdcm
display_name: "GDCM (Grassroots DICOM)"
description: "Grassroots DICOM 库：DICOM 医学影像格式解析/读写/转换工具集"
upstream:
  repo: "https://github.com/malaterre/GDCM"
  tag: "v3.2.11"
  license: "BSD-3-Clause"
  language: "C++"
versions:
  3.2.11:
    status: published
    date: "2026-09-20"
    notes: "首次适配 OHOS PC aarch64；zlib/expat 走制品仓，其余内嵌；上游测试 193/193 通过"
  3.0.24:
    status: built
    date: "2026-10-18"
    notes: "sight 26.0.0 的硬依赖版本；同族裸 cmake + ohos.toolchain 路线，但库清单/补丁需按本版实测（无 gdcmrle、必须链 socketxx、EXPAT include 上游已修故只带 1 个补丁）；上游测试注册 199/豁免 5/实跑 194/通过 194；语料 gdcmData 不接入（修订错配），详见 3.0.24/notes.md"
build:
  system: CMake
  deps:
    - zlib/1.3.1.1
    - expat/2.8.4
  options:
    GDCM_BUILD_SHARED_LIBS: OFF
    GDCM_BUILD_APPLICATIONS: ON
    GDCM_BUILD_TESTING: ON
    GDCM_USE_SYSTEM_ZLIB: ON
    GDCM_USE_SYSTEM_EXPAT: ON
platform:
  os: OHOS
  arch: arm64-v8a
  toolchain: ohos.toolchain.cmake (clang 15, libc++)
