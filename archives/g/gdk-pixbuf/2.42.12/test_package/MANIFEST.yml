# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gdk-pixbuf/2.42.12
homepage: "https://gitlab.gnome.org/GNOME/gdk-pixbuf"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (meson test 禁用，此处仅声明)
upstream_tests:
  - file: tests/pixbuf-loaded.c
    source: gdk-pixbuf-2.42.12/tests/pixbuf-loaded.c
    description: "测试 pixbuf 加载功能"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 gdk_pixbuf_get_version() 验证链接"
    command: "./test_gdk-pixbuf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
