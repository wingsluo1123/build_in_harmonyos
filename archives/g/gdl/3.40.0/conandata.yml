# conandata.yml — gdl 3.40.0
#
# Identity: GNOME Docking Library (GNOME Devtools Libraries), library artifact
# libgdl-3 (soname libgdl-3.so.5). 3.40.0 is the upstream final stable release
# (download.gnome.org sources/gdl/ top series is 3.40, tag GDL_3_40_0
# 2021-08-26, no later tag; Scout-A 2026-10-15). R39: single official URL —
# the CI mirror fallback rewrites download.gnome.org URLs to a mirror list
# automatically, so do not inline mirrors here.
#
# The source sha256 equals the official gdl-3.40.0.sha256sum published
# alongside the tarball.

sources:
  url: "https://download.gnome.org/sources/gdl/3.40/gdl-3.40.0.tar.xz"
  sha256: "3641d4fd669d1e1818aeff3cf9ffb7887fc5c367850b78c28c775eba4ab6a555"

patches:
  "3.40.0":
    - patch_file: "patches/0001-neutralize-intltool-configure-hard-deps.patch"
      patch_type: "portability"
      patch_description: "Relax the five unconditional IT_PROG_INTLTOOL hard errors baked into the shipped generated configure (intltool too old / intltool scripts missing / GNU gettext tools missing, twice / perl XML::Parser missing) into no-op ':' markers. The port builds with the upstream-supported --disable-nls switch, under which the intltool po/Makefile.in.in evaluates the empty all-no and install-data-no targets, so no intltool/gettext/perl machinery is ever invoked at make or install time. Build-system neutralization only: no C source is touched and no platform macros are added."
