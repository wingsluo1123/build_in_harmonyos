# ============================================================
# Patch info
# ============================================================

# Applied patch list
patches_applied:
  - "patches/0001-neutralize-intltool-configure-hard-deps.patch"

# ============================================================
# Knowledge gained
# ============================================================

knowledge_gained:
  - "GNOME dist tarball ships a pre-generated configure with IT_PROG_INTLTOOL expanded into five unconditional hard-error probes (intltool-update/-merge/-extract, gettext xgettext/msgmerge/msgfmt, perl >= 5.8.1, perl XML::Parser) — none provisionable on the OHOS worker; patch 0001 relaxes exactly those five as_fn_error sites into ':' markers in the generated configure"
  - "--disable-nls makes the intltool po/Makefile.in.in evaluate the empty all-no and install-data-no targets, so no intltool/gettext/perl machinery runs at make/install time; gdl library code has zero gettext runtime calls (bindtextdomain/dgettext grep count 0), so NLS is inert at runtime too"
  - "gdl's configure resolves its dev tools with `pkg-config --variable=glib_genmarshal glib-2.0` (resp. glib_mkenums) — conan PkgConfigDeps mirrors carry no custom variables, so the recipe appends the absolute glib package tool paths as variables to the generated glib-2.0.pc mirror; without this the typebuiltins/marshal generation at make time gets empty tool paths"
  - "No-regen mtime guard is mandatory for dist tarballs on this worker (no automake/aclocal): normalize mtimes so every generated file (aclocal.m4, configure, config.h.in, Makefile.in, aux scripts) is newer than its input, else make runs the `missing automake` regen path (enchant precedent)"
  - "E179: introspection disabled (g-ir-scanner cannot run target binaries under OHOS ELF signing); gtk-doc disabled (default no); upstream has NO automated tests (no tests/ dir, no TESTS/check_PROGRAMS anywhere; gdl/test-dock.c is a noinst interactive GTK demo with zero assertions) -> NO_UPSTREAM_TESTS with evidence; make check still runs and emits an honest zero-case HMBS_UPSTREAM_TEST_RESULT"
  - "Explicit link closure: all dep libdirs get -L/-Wl,-rpath/-Wl,-rpath-link and glib lib/libintl.so is appended as an absolute input before the toolchain env snapshot (build-chain-pitfalls lld rules)"
  - "libgdl-3.so.5 must hold real file content (HMDFS symlinks unreliable at runtime): package() copies the libtool real file onto the SONAME name and self-signs installed ELFs with binary-sign-tool (glib/libido3 precedent)"
