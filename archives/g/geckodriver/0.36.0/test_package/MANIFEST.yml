# test_package/MANIFEST.yml — geckodriver 0.36.0
# CI L0e requires this file to exist.

package: geckodriver/0.36.0
homepage: "https://github.com/mozilla/geckodriver"

# geckodriver has upstream cargo tests (cargo test --release)
# 79 tests pass, 4 ignored (Android-specific, expected on OpenHarmony)
upstream_check_command: "cargo test --release"
upstream_test_in_build: true
upstream_test_command: "cargo test --release"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_geckodriver.sh
    description: "Runs geckodriver --version to verify the binary is functional"
    command: "bash test_geckodriver.sh"

# Assertions: --version output contains version string
assertion_count: 1
