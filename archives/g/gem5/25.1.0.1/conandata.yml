sources:
  url: "https://github.com/gem5/gem5/archive/refs/tags/v25.1.0.1.tar.gz"
  sha256: "86bf3123e68c953db3d5358017e1649419a2c02944cf8b4c390911c06aa119b9"

patches:
  - patch_file: "patches/0001-src-arch-arm-freebsd-se_workload.cc.patch"
    patch_description: "Compile the FreeBSD sysctl paths only on real FreeBSD/Apple hosts (!defined(__GNU_LIBRARY__) is not a libc test; musl builds picked the wrong branch)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-cpu-kvm-timer.cc.patch"
    patch_description: "Fall back to SIGEV_SIGNAL when the libc has no SIGEV_THREAD_ID (OHOS musl signal.h)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-kern-linux-linux.cc.patch"
    patch_description: "Fall back to a TMPDIR mkstemp file when tmpfile() fails because /tmp is read-only"
    patch_type: "portability"
  - patch_file: "patches/0004-src-base-circular_queue.hh.patch"
    patch_description: "Include <sys/types.h> for ssize_t (OHOS libc++ does not include it transitively)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-sim-fd_entry.hh.patch"
    patch_description: "Include <sys/types.h> for mode_t (OHOS libc++ does not include it transitively)"
    patch_type: "portability"
