knowledge_gained:
  - "gem5 SCons ignores command-line variable assignments; compiler/flags must be injected through the process environment (CC/CXX/PYTHON_CONFIG from site_scons/gem5_scons/defaults.py and CCFLAGS_EXTRA/LINKFLAGS_EXTRA from SConstruct:987)."
  - "OHOS ships no python3-config and gem5 requires one; a shim generated from the actual CPython (discovered paths) unblocks configure."
  - "zlib is a hard dependency; inject the static conan zlib via -I/-L and never add -L/system/lib64 to the link flags (it hijacks libc++ resolution)."
  - "OHOS stdio.h defines stdin/stdout/stderr as parenthesized macros, breaking C++ qualified/member uses in generated SimObject params; a private stdio.h shim undefines them."
  - "ucontext functions (getcontext/makecontext/swapcontext) are only in the OHOS runtime libc; link /system/lib64/libc.so by absolute path."
  - "The embedded CPython needs PYTHONHOME=<site python prefix> at run time; embedding an rpath for the CPython lib dir removes the LD_LIBRARY_PATH requirement."
  - "The stage-2 AArch32 hello guest exit code 13 was an AArch32 SE loader artifact; an AArch64 SE guest exits with code 0."
  - "SCons 4.x hardcodes env['SHELL'] = 'sh' in SCons/Platform/posix.py and resolves that bare name against the spawned child PATH. In CI appspawn sandboxes the lookup fails, so every Configure probe reports no with the detail only in config.log. Pinning '/system/bin/sh' in the installed copy fixes it (godot 4.7.2 / gpsd 3.26 / serf 1.3.10 / vixl 5.1.0 precedent)."
  - "A self-contained build-time CPython (tool_requires python/3.12.9, ohpcd binary with Python.h + libpython3.12.so) must be bound end to end: python3-config shim, PYTHONHOME, linker rpath, LD_LIBRARY_PATH append and SCons invoked through that interpreter; additionally its stdlib + lib-dynload must be on PYTHONPATH because SCons strips PYTHONHOME from child environments and embedded tools (gem5py) would otherwise fail with ModuleNotFoundError zlib. Candidates are asserted on Python.h + libpython3.12.so* with an explicit self.fail."
