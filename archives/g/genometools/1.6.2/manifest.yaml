software: genometools
version: "1.6.2"
conan_ref: "genometools/1.6.2"
status: built
build_date: "2026-10-04"
build_system: makefile

source:
  url: "https://github.com/genometools/genometools/archive/refs/tags/v1.6.2.tar.gz"
  tag: "v1.6.2"
  sha256: "974825ddc42602bdce3d5fbe2b6e2726e7a35e81b532a0dc236f6e375d18adac"
  tar_format: tar.gz
  upstream_repo: "https://github.com/genometools/genometools"
  notes: >-
    上游官方 GitHub tag v1.6.2 归档。ISC 许可（external/* 子目录各自原许可，
    均静态编入 libgenometools.so 内部）。本包是 ltrsift/1.0.2 的阻塞依赖
    （ltrsift Makefile 硬链接 -lgenometools + -I<gt>/include/genometools）。

build:
  system: makefile
  configure_options: []
  make_target: "all"
  make_variables:
    - "CC=<tools.build:compiler_executables:c> / CXX=<…:cpp>（上游默认 gcc/g++）"
    - "64bit=yes（显式 64bit，绕过 uname -m 探测）"
    - "cairo=no（裁掉 annotationsketch 绘图子系统与 pango/cairo pkg-config 路径）"
    - "sharedlib=yes（默认，产出 lib/libgenometools.so + bin/gt）"
    - "CFLAGS=-O3"
    - "LDFLAGS=-Wl,-rpath,$ORIGIN/../lib（bin/gt 安装树裸环境判据）"
  dependencies: []
  note: >-
    W0 结论：**零外部 conan 依赖**。上游以 useshared=no 内置编译
    external/（zlib-1.2.8、expat-2.0.1、bzip2-1.0.6、lua-5.1.5、
    luafilesystem、lpeg、md5、samtools-0.1.18、sqlite、tre），静态编入
    libgenometools。构建工具链（autoconf 等）也不需要——手写 Makefile。
  cc: clang
  cxx: clang++
  outputs:
    - "lib/libgenometools.so（无版本化 SONAME）"
    - "lib/libgenometools.a（shared 构建副产物）"
    - "bin/gt（CLI 工具，含内建单元测试入口 gt -test）"
    - "include/genometools/{core,extended,ltr,match,mgth,gtlua}/*_api.h + genometools.h + gt_config.h"
    - "share/genometools/gtdata（运行数据）"

patches_applied: []

tests:
  upstream:
    command: "build() 内 LD_LIBRARY_PATH=<src>/lib ./bin/gt -test"
    counting_unit: "上游内建 C 单元测试逐项（gt -test，评审 Septest 实测 79 项）"
    declared_n: 79
    executed: 79
    passed: 79
    failed: 0
    skipped: 0
    not_run: 1
    assertions: 0
    pass_rate: "79/79 (100%)；testsuite/*.rb（Ruby 回归集）单列 not_run，附具体缺失证据，不并入通过率"
    note: >-
      testsuite/ 回归集由 testsuite.rb（Ruby）驱动，属缺工具依赖，具体缺失证据：
      ① 设备无 ruby 解释器（command -v ruby 无结果）；② 制品仓无 ruby 配方
      （conan list "ruby/*" -r ohpcd → Found 0 pkg/version recipes，Windows 侧
      2026-10-13 复核一致）；③ 曾尝试 tool_requires ruby/3.4.10（仓库
      archives/r/ruby 有配方但制品未发布），CI L0i 以 registry_unreachable
      拒绝（构建 #87497 之后轮次），已 revert——按判例登记 not_run，
      不并入通过数，也不伪装平台限制。
  adapted:
    command: "Conan test_package（test_genometools.c 7 断言 + bin/gt 冒烟）"
    cases: 4
    passed: 4
    pass_rate: "4/4（100%），conanrun 与裸环境各一轮"
    breakdown:
      consumer_api_assertions: 7
      bare_env_smoke_entries: 4
    note: >-
      真机 r13 实测：探针 7 断言 × 2 轮全过 + gt -version/-test 裸环境通过。

blockers: []

knowledge_gained:
  - "上游 tarball 内 src/external/ 存在同名目录+无扩展文件对（samtools-0.1.18/samtools），
     Windows 解包报 Invalid argument——真机/Linux 端正常；审计在 Windows 做时忽略
     这两个报错即可，不影响配方。"
  - "genometools 的 pkg-config 探测仅在 useshared=yes 或 cairo 启用时才引入依赖；
     cairo=no + 默认内置 external 后，配方 requirements 为空也能完整构建。"
