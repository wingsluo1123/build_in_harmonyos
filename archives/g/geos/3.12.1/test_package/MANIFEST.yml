package: geos/3.12.1
homepage: "https://libgeos.org/"

upstream_check_command: "cmake --build . --target test"
upstream_test_in_build: true
upstream_test_command: "cmake.test()"

upstream_tests:
  - file: tests/unit
    source: geos-3.12.1/tests/unit
    description: "298 upstream C++ unit test entries"
    command: "ctest --output-on-failure -R '^unit-'"
  - file: tests/xmltester
    source: geos-3.12.1/tests/xmltester
    description: "168 upstream XML regression test entries"
    command: "ctest --output-on-failure -R '^xml-'"

test_package_tests:
  - file: test_geos.c
    description: "C API version, WKT parsing, distance, and containment consumer checks"
    command: "./test_geos"

assertion_count: 5
