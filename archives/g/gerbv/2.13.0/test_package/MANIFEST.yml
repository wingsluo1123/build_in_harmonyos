# test_package/MANIFEST.yml
# gerbv/2.13.0 test manifest

package: gerbv/2.13.0
homepage: "https://gerbv.github.io/"

# Upstream test command
upstream_check_command: "cmake --build build --target test"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests use pixel-by-pixel PNG comparison
upstream_tests:
  - file: test/*.c
    source: gerbv-2.13.0/test/
    description: "Pixel-by-pixel golden image comparison tests (require cairo renderer)"

# test_package tests
test_package_tests:
  - file: test.c
    description: "Verify gerbv binary is installed and executable"
    command: "gerbv --version"

# Assertion count
assertion_count: 1
