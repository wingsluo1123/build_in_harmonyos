version: "9.12.2"
software: "ghc-ohos"
status: built
build_date: "2026-09-29"
build_system: "custom"

source:
  url: "https://downloads.haskell.org/~ghc/9.12.2/ghc-9.12.2-aarch64-alpine3_18-linux.tar.gz"
  sha256: "1e7188253aceda41836242207c943c56d7fdaf1ebe83149b1dbb71bdc41fba7e"
  tar_format: tar.gz
  size: 601250114
  note: "官方 aarch64-alpine3_18 musl bindist（唯一可在 OHOS 执行的官方 aarch64 变体）"

build:
  system: custom
  configure_options: []
  dependencies:
    - "（运行期 .so）gmp 6.2.1-r3 / libffi 3.4.4-r2 / libncursesw 6.4_p20230506-r0 / ncurses-terminfo-base（alpine v3.18 aarch64 APK，随包分发）"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS 纯 musl：GHC 的 aarch64-deb10/deb12 glibc 变体缺 /lib/ld-linux-aarch64.so.1 无法执行，只有 alpine3_18 musl bindist 可运行"
  - "downloads.haskell.org 单连接限速约 20-60KB/s 且不在 CI 镜像域名清单内 → 601MB bindist 必须用分片并行 Range 下载器；部分代理无视 Range 直接回 200+整包，需识别并当整包保留"
  - "OHOS 执行外来 ELF 必须自签（llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1）；**签名必须在最后一次 copy() 之后**，conan 的 copy() 会重写文件破坏签名（E212 族）"
  - "bindist 的 musl 运行时依赖取自同版本 alpine v3.18 APK；APK 解包用 download()+tarfile（get() 会报 BadZipFile）"
  - "SDK 的 clang 是 $0 相对 wrapper 且无条件追加 -Wl,--code-sign（破坏 GHC 的 C 预处理阶段）：需 gcc/g++/cc shim 直接调用 clang-15，编译阶段只给 --sysroot，链接阶段再追加 libclang_rt.builtins、musl 桩（dlinfo / posix_spawn_file_actions_addchdir_np）与 __aarch64_*_sync 原子符号 --defsym 别名"
  - "hmdfs 上 mktemp -d 建出的目录属主为本会话却不可写（且同会话 chmod 空操作）→ 需 umask 0 的 mktemp shim"
  - "OHOS toybox 的 time 缺 -a/-o/-f，构建脚本按 GNU time 语法调用 → 需 time shim 剥掉 options"
  - "平台限制：OHOS 禁止可执行的匿名内存，libffi 的 ffi_closure_alloc 失败 → runghc/GHCi 完全不可用，Hackage 安装必须用 ghc --make 编译 Setup 脚本"
