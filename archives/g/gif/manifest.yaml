software: gif
display: "gif"
description: "GIF 图像格式读写库（giflib 上游）"
category: gfx
homepage: "https://sourceforge.net/projects/giflib/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "giflib 5.2.2 为纯 Makefile 构建（无 configure），直接以 make 命令行注入 clang/llvm-ar 与 CFLAGS"
    - "编译器和归档器从 tools.build:compiler_executables conf 获取（R33：不依赖未定义 shell 环境变量）"
    - "SourceForge /download URL 需在 conan source() 显式指定 giflib-5.2.2.tar.gz 文件名"
    - "上游回归套件需要先构建 GIF 命令行工具，Conan 包仅发布库/头文件/许可（R38 库类型豁免 commands.json）"
    - "OHOS head 不支持 GNU 负数 --bytes（--bytes=-20 失败），测试截断输入改用 POSIX wc -c 与 dd（补丁 0001）"
  common_dependencies: []

versions:
  "5.2.2":
    status: built
    build_date: "2026-10-04"
    conan_ref: "gif/5.2.2"
    format: conan
