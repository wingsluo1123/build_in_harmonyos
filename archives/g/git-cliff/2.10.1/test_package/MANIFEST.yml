# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: git-cliff/2.10.1
homepage: "https://github.com/orhun/git-cliff"

# 上游测试命令 (cargo test --release)
upstream_check_command: "cargo test --release"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/integration_tests.rs
    source: git-cliff/tests/integration_tests.rs
    description: "Integration tests for git-cliff CLI"
    command: "cargo test --release --test integration_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify git-cliff --version runs successfully"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
