software: git-cliff
display: "git-cliff"
description: "A highly customizable changelog generator for Git repositories"
category: utility
homepage: "https://github.com/orhun/git-cliff"
license: MIT OR Apache-2.0

build_system: cargo

ohos_adaptation:
  key_points:
    - "Rust/Cargo project, builds directly without source modifications"
    - "Requires rustc and cargo in PATH (installed via Harmonybrew)"
    - "Cargo dependencies resolved from crates.io mirror (rsproxy.cn)"
    - "cc/c++ symlinks needed for linker resolution (cargo uses cc as linker)"
  common_dependencies: []

versions:
  "2.10.1":
    status: built
    build_date: 2026-08-06
