  # R39（aireview 2026-08-09 P2）：CI 会自动为 GitHub URL 添加镜像 fallback
  # （gh-proxy/ghproxy/gitclone/moeyy/kkgithub），conandata.yml 只写官方原始 URL，
  # 不手动加镜像前缀（避免与 CI 自动 fallback 重复 + 上游迁移时硬编码镜像失效）。
