version: "1.3"
software: "git-who"
status: built
build_date: "2026-07-30"
build_system: go

source:
  url: "https://github.com/sinclairtarget/git-who/archive/refs/tags/v1.3.tar.gz"
  sha256: "7af9950b8786a52e71e80457986f8b961064dc39923de1e330bc9fede42feef4"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"  # 动态映射 conanfile.py: armv8→arm64, x86_64→amd64，CI armv8 默认 arm64
    - "GOPROXY=https://goproxy.cn,direct"
    - "go build -ldflags=\"-s -w\" -o git-who ."
  dependencies:
    - "go/1.21.13"
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "git-who 是 Go 应用，使用 go build 编译为单二进制文件"
  - "无外部 C/C++ 依赖，运行时依赖 git"
