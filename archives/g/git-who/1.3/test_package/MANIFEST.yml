# git-who/1.3 test_package
# Verifies git-who binary is installed and executable

package: git-who/1.3
homepage: "https://github.com/sinclairtarget/git-who"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.c
    description: "验证 git-who 二进制存在并可执行 (--help)，test.c 用 argv 传 bin_path 避依赖 PATH"
    command: "./test_git_who \"$BIN\"  # test.c 改用 argv 传 bin_path，需传 git-who 二进制路径参数"

assertion_count: 1
