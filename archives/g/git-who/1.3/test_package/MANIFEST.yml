# test_package/MANIFEST.yml — git-who 1.3
package: git-who/1.3
homepage: "https://github.com/sinclairtarget/git-who"
upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: "internal/*_test.go"
    source: "git-who-1.3/internal/"
    description: "Go unit tests"
    command: "go test ./..."
test_package_tests:
  - file: "test_package/conanfile.py"
    description: "CLI smoke test: -version + --help"
    command: "git-who -version && git-who --help"
assertion_count: 2
