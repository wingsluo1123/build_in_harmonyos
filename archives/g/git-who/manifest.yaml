software: git-who
display: "git-who"
description: "Git blame for file trees — Go application"
category: build-tool
homepage: "https://github.com/sinclairtarget/git-who"
license: MIT
build_system: go

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "Go 应用，go build 编译为单二进制文件"
    - "CI worker 无 go 工具链，通过 cmd-pkgs 预编译包安装"
    - "交叉编译 GOOS=linux GOARCH=arm64 CGO_ENABLED=0"
  common_dependencies:
    - git

# 版本索引
versions:
  "1.3":
    status: failed  # R9: CI 实际结果——go 工具链 cmd-pkgs 装载超时+系统 go 缺，build() 失败。与版本级 manifest+notes 一致如实标记。修复后待重跑 CI 验证。
    build_date: "2026-07-30"
    # aireview P2: published_as 与 status: failed 互斥（failed 表示未发布成功）
    # 移除 published_as，避免下游 manifest 消费者误认为已发布可用
