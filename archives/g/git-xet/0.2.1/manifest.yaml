software: git-xet
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/{version}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/huggingface/xet-core/archive/refs/tags/git-xet-v0.2.1.tar.gz"

  # 源码校验和
  sha256: "df2a90a8266918bf2aba35e22276c745d11bd9c39850410f78ebbf2b50d0c87c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "glibc-shim.c (glibc compatibility shim for musl HarmonyOS)"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust源码无法在HarmonyOS上编译 (rustc SIGSEGV on musl), 使用GitHub预编译二进制"
  - "预编译二进制为glibc-dynamic, 使用patchelf + Alpine gcompat适配musl"
  - "需要Alpine gcompat/libucontext/libobstack/libgcc_s兼容库"
  - "自定义libglibc-shim.so提供pthread_mutexattr_setrobust等glibc特有符号"
