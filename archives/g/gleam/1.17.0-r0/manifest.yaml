software: gleam
# 版本级 manifest
# 文件位置: archives/g/gleam/1.17.0-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.17.0-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# 构建系统
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/gleam-lang/gleam/archive/refs/tags/v1.17.0.tar.gz"

  # 源码校验和
  sha256: "644db4b25596d5f27f03614ef1cc10646baaabbd559407acc278bb24c6502f8b"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom
  build_system: cargo

  # 配置选项列表
  configure_options:
    - "cargo build --release --bin gleam"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "rust/1.97.1"
    - "clang/15.0.4"

  # 编译器
  cc: clang
  cxx: clang++

  # 构建方式说明
  build_method: "source-compilation"
  build_notes: "Rust project compiled from source using cargo. Patched to use ring crypto provider instead of aws-lc-rs (assembly linking failure on OHOS). Uses rsproxy.cn crates.io mirror. Resulting binary is dynamically linked to musl libc."

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/fix-rustls-ring.patch: Use ring crypto provider instead of aws-lc-rs"

# ============================================================
# 测试报告
# ============================================================

test_report:
  status: built
  notes: "Source-compiled binary, verified gleam --version outputs 'gleam 1.17.0'"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust 1.97.1 (via Harmonybrew) works on HarmonyOS without SIGSEGV (previous rustc crashes resolved)"
  - "aws-lc-rs assembly symbols fail to link on OHOS - undefined bn_* symbols in bcm.c"
  - "Solution: use rustls-no-provider feature + ring crypto provider as alternative to aws-lc-rs"
  - "ring crate compiles successfully on OHOS with clang"
  - "cargo requires rsproxy.cn mirror for crates.io access from HarmonyOS"
  - "Resulting binary is dynamically linked to musl libc (/lib/ld-musl-aarch64.so.1), needs only libc.so"
