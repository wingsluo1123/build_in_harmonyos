# test_package/MANIFEST.yml — gleam 1.17.0-r0
# CI L0e requires this file to exist.

package: gleam/1.17.0-r0
homepage: "https://gleam.run/"

# Gleam has upstream tests but they require Erlang runtime
upstream_check_command: "cargo test"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (requires Erlang runtime)
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    description: "Runs gleam --version to verify the compiled binary executes correctly"
    command: "conan test"

# Approximate assertion count
assertion_count: 2
