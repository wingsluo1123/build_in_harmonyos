name: glib
version: 2.84.0
category: core
status: published
build_system: meson
build_date: 2026-05-16
compiler: clang 15.0.4 + GNU ld (bfd)
platform:
  os: ohos
  arch: aarch64

source:
  url: https://download.gnome.org/sources/glib/2.84/glib-2.84.0.tar.xz
  tag: 2.84.0
  sha256: f8823600cb85425e2815cfad82ea20fdaa538482ab74e7293d58b3f64a5aff6a
  tar_format: tar.xz

dependencies:
  runtime:
    - gettext >= 0.22.5
    - libffi >= 3.4.4
    - pcre2 >= 10.32
    - zlib >= 1.3.1
  build:
    - meson >= 1.11.1
    - ninja >= 1.13

build_options:
  meson_options:
    - default_library=static
    - selinux=disabled
    - libmount=disabled
    - man-pages=disabled
    - documentation=false
    - dtrace=disabled
    - systemtap=disabled
    - sysprof=disabled
    - tests=false
    - installed_tests=false
    - nls=disabled

upstream_tests:
  total: 290+
  suites:
    - name: glib/tests
      count: 90+
      note: "含 strfuncs/hash/atomic 等纯算法测试及部分 IO 测试"
    - name: gio/tests
      count: 200+
      note: "含数百个 GIO 功能测试"
  execution_status: "not_run"
  reason: "本次基础适配以 -Dtests=false 关闭上游测试，未执行。上游测试运行计划延后"

verification:
  static_libs:
    - libglib-2.0.a
    - libgio-2.0.a
    - libgmodule-2.0.a
    - libgthread-2.0.a
    - libgobject-2.0.a
    - libgirepository-2.0.a
  binaries:
    - gio
    - glib-compile-schemas
    - glib-compile-resources
    - gresource
  test_commands:
    - "conan test . -pr:b default -pr:h ohos-arm64"

artifacts:
  package: archives/g/glib/2.84.0/packaging/glib-2.84.0-ohos-aarch64.tar.gz

patches:
  - 0001-disable-netlink-for-harmonyos.patch
  - 0002-add-harmonyos-host-support.patch
  - 0003-clang-wrapper-for-elf-signing.patch

conan:
  ref: glib/2.84.0
  verify: passed
  package_type: static-library

test:
  smoke: passed
  test_package: passed
