# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: glib/2.84.0
homepage: ""

# 上游测试命令 (meson 项目用 meson test)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
# glib 上游测试套件庞大且依赖 DBus/桌面环境，OHOS 上无法运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件 (meson test --list 分析结果)
# glib 上游有数百个测试，OHOS 上因 tests=false 未构建
# 以下列出代表性测试模块
upstream_tests:
  - file: glib/tests/
    source: glib-2.84.0/glib/tests/
    description: "glib 核心工具库测试 (string, hash, list, etc.)"
    command: "meson test glib"
  - file: gobject/tests/
    source: glib-2.84.0/gobject/tests/
    description: "gobject 类型系统测试 (GType, signals, properties)"
    command: "meson test gobject"
  - file: gio/tests/
    source: glib-2.84.0/gio/tests/
    description: "gio I/O 测试 (file, socket, dbus, etc.)"
    command: "meson test gio"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "glib+gobject 消费者测试 (g_strdup, g_free, GType 类型系统)"
    command: "./test_glib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
