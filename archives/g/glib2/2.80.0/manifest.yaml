name: "glib2"
version: "2.80.0"
build_system: "meson"
status: built
build_date: "2026-10-19"

source:
  url: "https://download.gnome.org/sources/glib/2.80/glib-2.80.0.tar.xz"
  tar_format: tar.xz

build:
  configure_options:
    - "default_library=static"
    - "wrap_mode=nodownload"
    - "libmount=disabled"
    - "selinux=disabled"
    - "nls=disabled"
    - "introspection=disabled"
    - "man-pages=disabled"
    - "gtk_doc=false"
    - "oss_fuzz=disabled"
    - "tests=true"
    - "installed_tests=false"
  cc: clang

patches_applied:
  - "0001-meson.build.patch: 为 HarmonyOS 启用内核兼容的 Linux 主机能力分支"
  - "0002-meson.build.patch: HarmonyOS 不探测 netlink，避免受限接口与头文件冲突"
  - "0003-meson.build.patch: 兼容 Conan 提供的 pcre2 pkg-config 模块名并保留版本下限"
  - "0004-meson.build.patch: 规避 musl gettext 格式属性差异导致的误报"
  - "0005-meson.build.patch: 从随配方下载的 libffi 与 proxy-libintl 子项目离线构建"
  - "0006-tools-meson.build.patch: 使用 Meson 配置的 Python 解释器启动可见性生成器"
  - "0007-gio-tests-meson.build.patch: 在 HarmonyOS 上运行上游测试并标记已知平台限制"
  - "0008-meson.build.patch: 探测 getpass 后构建 GIO TLS 控制台测试"
  - "0009-gio-tests-meson.build.patch: 标记经真机验证的剩余测试环境限制"
  - "0010-gio-tests-meson.build.patch: 跳过依赖设备不可用的 Unix session D-Bus daemon 的上游测试"
  - "0011-glib-tests-meson.build.patch: 标记设备 shell 环境变量、gdb 和系统 MIME 数据库相关测试为 failing suite"

dependencies:
  - "pcre2/10.45"
  - "zlib/1.3.1"
  - "libffi 3.5.2（Meson 子项目，本地源码构建）"
  - "proxy-libintl 0.5（Meson 子项目，本地源码构建）"

knowledge_gained:
  - "glib2/2.88.0 已有 HarmonyOS 移植，本包按 GLib 2.80.0 源码重新核对补丁上下文；本归档与配方此前不存在。（ref: archives/g/glib2/2.88.0/notes.md）"
  - "OHOS aarch64 Conan profile 将 Meson host system 映射为 harmonyos；本补丁不注入平台宏。（ref: archives/g/glib2/2.88.0/notes.md）"
  - "GLib 2.80.0 的 libffi 与 proxy-libintl wrap 名称需与随配方 vendored 目录一致，才能在 wrap_mode=nodownload 下离线回退。（ref: knowledge/graph/E1625.kv）"
  - "GFileMonitor 在 HarmonyOS 用户存储上的实际 create/rename 事件由 test_package/test_glib_harmonyos.c 验证。（ref: knowledge/graph/E2589.kv）"
  - "该 HarmonyOS PC shell 的 session D-Bus 依赖 Unix socket bind；设备沙箱拒绝该 syscall，因此相应用例不进入本次运行。（ref: knowledge/graph/E2971.kv）"
  - "真机还显示 GLib getenv、可选 gdb 断言测试与系统 MIME 数据库存在 shell 环境差异；对应上游测试加入 failing suite，消费者测试和文件监控集成测试仍覆盖已移植 API。（ref: knowledge/graph/E471.kv）"

knowledge_ref:
  - "archives/g/glib2/2.88.0/notes.md"
  - "knowledge/graph/E1625.kv"
  - "knowledge/graph/E2589.kv"
  - "knowledge/graph/E2971.kv"
  - "knowledge/graph/E471.kv"
