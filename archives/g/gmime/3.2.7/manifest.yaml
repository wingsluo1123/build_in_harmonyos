version: "3.2.7"
status: published
build_date: "2026-08-07"

source:
  url: "https://ftp.gnome.org/pub/GNOME/sources/gmime/3.2/gmime-3.2.7.tar.xz"
  sha256: ""
  tar_format: tar.xz

build_system: autotools
configure_options:
  - "--build=aarch64-unknown-linux-gnu"
  - "--disable-gtk-doc"
  - "--disable-introspection"
dependencies:
  - glib/2.84.0
cc: clang
cxx: clang++

patches_applied: []
knowledge_gained:
  - "OHOS: need mktemp wrapper for config.status (E002/E046)"
  - "OHOS: need -L/lib for musl dynamic linker"
  - "OHOS: conan glib .pc files have prefix=/, need PKG_CONFIG_PATH fix"
  - "OHOS: need custom pkg.m4 with PKG_CHECK_MODULES/PKG_PROG_PKG_CONFIG"
