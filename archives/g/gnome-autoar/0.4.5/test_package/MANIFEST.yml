# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gnome-autoar/0.4.5
homepage: "https://gitlab.gnome.org/GNOME/gnome-autoar"

# 上游测试命令
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-extract.c
    source: gnome-autoar-0.4.5/tests/test-extract.c
    description: "Test archive extraction"
    command: "meson test test-extract"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Call autoar_libarchive_quark() and autoar_format_is_valid(AUTOAR_FORMAT_ZIP)"
    command: "./test_gnome_autoar"

# 测试断言总数
assertion_count: 3
