sources:
  url: "https://download.gnome.org/sources/gnome-recipes/2.0/gnome-recipes-2.0.4.tar.xz"
  sha256: "b30e96985f66fe138a17189c77af44d34d0b4c859b304ebdb52033bc2cd3ffed"
  filename: "gnome-recipes-2.0.4.tar.xz"
patches:
  - patch_file: "patches/0001-shopping-list-export-via-libsoup.patch"
    patch_description: "Port the Todoist shopping-list export from librest (rest-0.7) to libsoup 2.4 form POSTs; librest is unavailable on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-appdata-no-its-merge.patch"
    patch_description: "Skip appdata translation merge (msgfmt cannot locate ITS rules on OHOS, no itstool); install the untranslated appdata file"
    patch_type: "portability"
  - patch_file: "patches/0003-post-install-no-system-tools.patch"
    patch_description: "Drop gtk-update-icon-cache / update-desktop-database post-install calls (not present on OHOS); guard glib-compile-schemas on availability"
    patch_type: "portability"
  - patch_file: "patches/0004-disable-help-build.patch"
    patch_description: "Disable the help/ subdirectory (needs itstool and yelp-tools, not available on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0005-locale-measurement-capability-guard.patch"
    patch_description: "Guard the locale measurement-system branches behind a meson cc.links capability probe (HAVE__NL_MEASUREMENT_MEASUREMENT); the glibc langinfo item is an enum constant (not #ifdef-able) and libcs without it (e.g. OHOS) fall back to the metric default"
    patch_type: "portability"
  - patch_file: "patches/0006-disable-post-install-script.patch"
    patch_description: "Drop the meson.add_install_script() post-install invocation (OHOS denies direct script execution); the GSettings schema compilation it drives is performed by the recipe's package() instead"
    patch_type: "portability"
