package: gnome-recipes/2.0.4
homepage: "https://gitlab.gnome.org/GNOME/gnome-recipes"

# The release ships five GLib test suites under tests/ (ingredients, number,
# unit, ids, strv), built by the standard Meson build and run with
# `meson test`.  The consumer test checks the installed application files and
# the GApplication help path when the target profile is runnable.
upstream_check_command: "meson test --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test --print-errorlogs"
upstream_tests:
  - ingredients
  - number
  - unit
  - ids
  - strv

test_package_tests:
  - file: test_gnome_recipes.sh
    description: "Check the installed executable, desktop entry, appdata, GSettings schema and compiled schema, icon, recipe databases, and runnable GApplication help path"
    command: "bash test_gnome_recipes.sh"

assertion_count: 11
