# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gnupg/2.5.20
homepage: https://gnupg.org/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false

# HMDFS 平台限制导致 make check 无法在 CI 内执行
# 手动验证结果记录于 notes.md 和 reports/quality-report.md
upstream_test_exempt: true
upstream_test_exempt_reason: "HMDFS filesystem restrictions prevent make check in CI; manually verified (G1-G4 gates passed)"

# make check 实际运行的测试程序（从上游源码分析）
upstream_tests:
  - name: "gpg-basic"
    source: gnupg-2.5.20/tests/openpgp/
    description: "OpenPGP 基本加密/签名/验证测试"
  - name: "gpgsm-basic"
    source: gnupg-2.5.20/tests/smime/
    description: "S/MIME 加密/签名测试"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "gpg --version + gpgv --version + gpgsm --version smoke test"
    command: "bash test.sh"

# 测试断言总数（近似值）
assertion_count: 3
