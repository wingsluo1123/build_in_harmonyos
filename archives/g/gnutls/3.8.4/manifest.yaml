software: gnutls
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.8.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.8.4"

# 编译状态
# published | built | failed | archived
status: built
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-30"

# 成功说明
success_note: "历史目标机编译生成过 libgnutls 和 gnutls-cli；当前 Conan 配方仍需正式 CI 复核。"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.4.tar.xz"

  # 源码校验和
  sha256: "2bea4e154794f3f00180fa2a5c51fe8b005ac7a31cd58bd44cdfa7f36ebc3a9b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-included-libtasn1"
    - "--disable-gost"
  
  # 编译依赖列表（格式: name/version）
  dependencies:
    - "nettle/3.10.2"
    - "gmp/6.3.0"
  
  # 编译器
  cc: ~/tmp/wrappers/cc-wrapper
  cxx: ~/tmp/wrappers/cxx-wrapper

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E072: config.guess需识别HarmonyOS（不是OHOS），config.sub需添加ohos三元组映射（3处修改）✅验证成功"
  - "Conan 配方动态解析 bash，并用 Environment 限定 CONFIG_SHELL/SHELL 作用域"
  - "配方依赖 nettle/3.10.2 和 gmp/6.3.0；依赖发布后再执行正式 CI"

