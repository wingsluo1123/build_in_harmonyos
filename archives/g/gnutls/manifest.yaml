software: gnutls
display: "GnuTLS TLS Library"
description: "GNU Transport Layer Security library for secure communications"
category: crypto
homepage: "https://www.gnutls.org/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Requires libtasn1, nettle, gmp for cryptographic operations"
    - "Binary tools: gnutls-cli, gnutls-serv"
  common_dependencies:
    - libtasn1
    - nettle
    - gmp
    - openssl

versions:
  "3.8.4":
    status: built
    build_date: 2026-06-07
