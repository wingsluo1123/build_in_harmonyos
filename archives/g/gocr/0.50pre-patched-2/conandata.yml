# conandata.yml — gocr 0.50pre-patched-2
#
# Official source: the OSRA project publishes the patched GOCR snapshot that
# its configure.ac expects (thread-local OCR_JOB/JOB hook used by libPgm2asc).
# https://sourceforge.net/projects/osra/files/gocr-patched/

sources:
  # Direct SourceForge download host (canonical, keeps the .tgz filename so
  # Conan's get() can detect the archive format; the sourceforge.net
  # "/download" redirect URL has no extension and fails as BadZipFile).
  url: "https://downloads.sourceforge.net/project/osra/gocr-patched/gocr-0.50pre-patched-2.tgz"
  sha256: "3ff73f03845878a4f08585b25d1e2b690e3f2d03bb4df1bbebb2ae2ead25287a"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "Relax autoconf config.status temp dir umask (077 -> 022) for HMDFS/OHOS"
    patch_type: "portability"
