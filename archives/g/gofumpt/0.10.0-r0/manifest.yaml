# manifest.yaml — gofumpt 0.10.0-r0
software: gofumpt
version: "0.10.0-r0"
status: built
build_date: "2026-07-13"
build_system: custom

source:
  url: "https://github.com/mvdan/gofumpt/archive/refs/tags/v0.10.0.tar.gz"
  sha256: "5f3158f665d1d49a19f3ed48981366c892b68904b2b34cb893c6fe3ff8346929"
  tar_format: tar.gz

build:
  system: custom
  build_system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Go project: CGO_ENABLED=0 for static binary (no C library dependency)"
  - "Go linker mmap fails on HMDFS: build on /data/storage/el2/base/cache/ instead"
  - "Go ELF output has non-standard SHT_STRTAB: must strip before ELF sign"
  - "ELF signing required for all binaries on OHOS HMDFS (binary-sign-tool)"
  - "Go 1.25.0 required (per go.mod: go 1.25.0)"
  - "gofumpt CLI: gofumpt -version for version, gofumpt -h for help"
  - "Standard format: gofumpt -l -w <file> (in-place formatting)"
