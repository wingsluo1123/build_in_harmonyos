# test_package/MANIFEST.yml — gofumpt/0.10.0-r0
package: gofumpt/0.10.0-r0
homepage: "https://github.com/mvdan/gofumpt"

# Go project: no upstream make check
upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: ""

# gofumpt uses Go's built-in test framework
upstream_tests:
  - file: main_test.go
    source: gofumpt-0.10.0-r0/main_test.go
    description: "gofumpt main function tests"
    command: "go test -v ./..."

# test_package smoke test (binary execution verification)
test_package_tests:
  - file: test.sh
    description: "CLI smoke test - version and help"
    command: "gofumpt -version"

assertion_count: 2
