software: golangci-lint
version: "2.5.0"
status: published
build_date: "2026-07-02"

source:
  url: "https://github.com/golangci/golangci-lint/archive/refs/tags/v2.5.0.tar.gz"
  sha256: "0e0fcb42d9eda9ab0ff167c1df1e79cfe6aac72fbc9f97b9ff158c96baa438f4"
  tar_format: tar.gz

build:
  system: go
  configure_options: []
  dependencies:
    - "go/1.24.4"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Go 项目版本注入需设置 main.version 和 main.date 两个 ldflags 变量，否则会回退到 buildInfo.Main.Version 显示 (devel)"
  - "conan create 构建时需要在 build() 中 cd 到 source_folder，否则 go build 找不到 go.mod"
  - "GitHub 源码下载在 OHOS 上 SSL 验证失败，conandata.yml 需使用 ghfast.top 镜像 URL"
