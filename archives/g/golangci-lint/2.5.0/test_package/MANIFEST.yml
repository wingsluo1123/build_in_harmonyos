# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: golangci-lint/2.5.0
homepage: "https://github.com/golangci/golangci-lint"

# 上游测试命令 (Go 项目使用 go test)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: cmd/golangci-lint/main.go
    source: golangci-lint-2.5.0/cmd/golangci-lint/main.go
    description: "主入口，包含版本信息构建逻辑"
    command: "go build -o golangci-lint ./cmd/golangci-lint"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "L1 smoke test: 验证 golangci-lint --version 可执行并输出正确版本"
    command: "elfldr golangci-lint --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
