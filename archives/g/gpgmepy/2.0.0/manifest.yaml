knowledge_gained:
  - "E007: config.guess/sub 需加 linux-ohos 支持（config.sub 还需手工补内核-OS 列表 linux-ohos*）"
  - "E011: configure umask 077 -> 022 修复 HMDFS 临时目录权限"
  - "新坑: gpgmepy 打包的 gpgme-config 过滤掉 -I/include 且不含自身 include 目录，需自建 gpgme-config/gpg-error-config 包装（config-overrides）"
  - "新坑: gpgmepy 的 setup.py.in 用 os.popen('uname -s').read()，在 HarmonyOS Python 3.12 下返回二进制流崩溃，需改 subprocess.check_output"
  - "E074: make -j1（OHOS SELinux 禁止 FIFO jobserver）"
  - "上游 Makefile copystamp 在 in-tree 构建下 cp 同文件失败，必须 VPATH 构建"
  - "gpgrt-config 挂起坑（继承 gpgme 经验）：通过不把 gpgrt-config 放入 PATH 并自建 gpg-error-config 包装绕开"
  - "测试: 上游 28/28 全部阻塞（缺 GnuPG 运行时，GPG_ERR_INV_ENGINE），test_package R34 实质测试 4/4 通过"

