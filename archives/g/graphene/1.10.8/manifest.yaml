# 版本级 manifest — graphene 1.10.8
# 遵循 ARCHIVE-SPEC v2.0

version: "1.10.8"
software: "graphene"

status: built
build_date: "2026-08-09"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/ebassi/graphene/archive/refs/tags/1.10.8.tar.gz"
  sha256: "922dc109d2dc5dc56617a29bd716c79dd84db31721a8493a13a5f79109a4a4ed"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "--libdir=lib"
    - "-Dgobject_types=true"
    - "-Dintrospection=disabled"
    - "-Dtests=false"
    - "-Dgtk_doc=false"
    - "-Dsse2=false"
    - "-Dgcc_vector=false"
    - "-Darm_neon=true"
  dependencies:
    - "glib/2.84.0.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "graphene 1.10.8 builds with meson; requires glib for GObject types"
  - "Disabled SSE2 and GCC vector intrinsics, enabled ARM NEON for OHOS aarch64"
  - "Introspection disabled (no gobject-introspection on OHOS)"
