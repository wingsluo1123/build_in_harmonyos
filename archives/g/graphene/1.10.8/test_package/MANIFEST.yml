# test_package/MANIFEST.yml — graphene 1.10.8
# CI L0e requires this file to exist.

package: graphene/1.10.8
homepage: "https://github.com/ebassi/graphene"

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test"

upstream_tests:
  - file: tests/meson.build
    source: graphene-1.10.8/tests/meson.build
    description: "Graphene test suite covering vectors, matrices, quaternions, rects, points, and SIMD paths"
    command: "meson test"

test_package_tests:
  - file: test_graphene.c
    description: "Initializes a vec4 and identity matrix, checks component values and diagonal element"
    command: "./test_graphene"

assertion_count: 2
