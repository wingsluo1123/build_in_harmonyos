# 软件级 manifest — graphene
# 遵循 ARCHIVE-SPEC v2.0

software: graphene
display: "graphene"
description: "A thin layer of graphic data types for 2D/3D graphics (vectors, matrices, quaternions)"
category: library
homepage: "https://github.com/ebassi/graphene"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "SSE2 and GCC vector intrinsics disabled, ARM NEON enabled for aarch64"
    - "Requires glib for GObject types (gobject_types=true)"
    - "Introspection disabled (no gobject-introspection on OHOS)"
  common_dependencies:
    - glib

versions:
  "1.10.8":
    status: built
    build_date: "2026-08-09"
    dependencies:
      glib: 2.84.0.1
