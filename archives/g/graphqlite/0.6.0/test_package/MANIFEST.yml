# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: graphqlite/0.6.0
homepage: "https://github.com/colliery-io/graphqlite"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_runner.c
    source: graphqlite-0.6.0/tests/test_runner.c
    description: "CUnit test runner — parser, scanner, transform, executor tests"
    command: "./build/test_runner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 graphqlite.so 扩展库可加载"
    command: "./test_graphqlite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1