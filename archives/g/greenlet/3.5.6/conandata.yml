# conandata.yml — greenlet 3.5.6
# 源码来自 PyPI 官方文件托管（files.pythonhosted.org，R39 合规）

sources:
  url: "https://files.pythonhosted.org/packages/3e/6e/0091f175ccd02b02bc8811bbcbcc6ac2e980be116e3b2f7a736ca322bf84/greenlet-3.5.6.tar.gz"
  sha256: "8e67c43bdfc88d5fee6db0d3e40175b362fc95fb85f0412d233b9b203c53a575"

patches:
  # 上游 tests/__init__.py:17 是裸 `import psutil`（模块级），而 psutil 只是
  # **测试期可选依赖**（greenlet 的运行时依赖为无）。
  # 该裸导入使**整个测试套件**在收集阶段中断（实测 15 个 ERROR → Interrupted），
  # 因为 pytest 导入 conftest/测试包时就执行了它。
  # 而 psutil 在上游只被一个方法用到：get_process_uss()（USS 内存测量），
  # 且上游**本就**为"uss 不支持"设计了 unittest.SkipTest 语义
  # （tests/__init__.py:213-214 的 `except AttributeError -> SkipTest`）。
  # 故把导入改为可选、缺失时按上游既有语义 SkipTest——
  # 保留原行为契约（不伪造内存数据），同时让其余套件可收集。
  #
  # 现状：psutil 已发布到 ohpcd，配方经 build_requirements() 以 tool_requires
  # 声明它，套件正常运行时该分支不会走到；保留本补丁作为**依赖不可用时的
  # 降级路径**（无 try/except 的裸导入会在收集阶段中断整套，降级路径仍有价值）。
  - patch_file: "patches/0001-tests-psutil-optional.patch"
    patch_description: "tests/__init__.py: import psutil 改为可选；get_process_uss 在 psutil 缺失时 SkipTest（沿用上游既有语义）"
    patch_type: "portability"
  # 同一类问题的**第二个**裸导入：tests/leakcheck.py:32 的 `import objgraph`。
  # 该文件被 tests/__init__.py:33 导入，故同样在**收集阶段**中断整个套件——
  # 只修 psutil 不足以解阻塞（实测：修 psutil 后收集仍全部失败，错误转为 objgraph）。
  # objgraph 同样只用做对象增长测量（leakcheck._RefCountChecker._growth →
  # objgraph.growth）；同样改为可选：缺失时该泄漏检查 SkipTest，其余套件照常运行。
  # 另有第三个导入点 tests/test_cpp.py:6，一并处理（只修前两处仍会失败）。
  # 现状：objgraph 已发布到 ohpcd，同理由 build_requirements() 声明，本补丁
  # 保留为降级路径。
  - patch_file: "patches/0002-tests-objgraph-optional.patch"
    patch_description: "tests/leakcheck.py: import objgraph 改为可选；_growth 在缺失时 SkipTest（不伪造增长数据）"
    patch_type: "portability"
