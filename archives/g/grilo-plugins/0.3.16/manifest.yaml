software: grilo-plugins
version: "0.3.16"
status: built
build_date: "2026-08-06"

source:
  url: "https://download.gnome.org/sources/grilo-plugins/0.3/grilo-plugins-0.3.16.tar.xz"
  sha256: "fe6f4dbe586c6b8ba2406394e202f22d009d642a96eb3a54f32f6a21d084cdcb"
  tar_format: tar.xz

build:
  system: meson
  build_system: meson
  configure_options:
    - "-Dhelp=no"
    - "--default-library=shared"
    - "--wrap-mode=nodownload"
  dependencies:
    - glib2/2.88.0
    - libxml2/2.15.3
    - sqlite3/3.49.1
    - lua/5.4.8
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "grilo-plugins uses Meson build system with 23 plugins, each with optional deps"
  - "11 plugins enabled with available dependencies (chromaprint, dleyna, gravatar, local-metadata, lua-factory, magnatune, metadata-store, opensubtitles, raitv, shoutcast, tmdb)"
  - "12 plugins auto-disabled due to missing deps (bookmarks, dmap, filesystem, flickr, freebox, optical-media, podcasts, thetvdb, tracker, tracker3, youtube)"
  - "Missing deps not in Conan repo: grilo, json-glib, libsoup, libarchive, gstreamer, libmediaart, gom, oauth, totem-plparser, libdmapsharing, avahi, libgdata, tracker-sparql"
  - "Need clang wrapper to fix lld linker libxml2.so.16 loading issue for meson detection"
  - "Pre-built glib package has static (.a) and shared (.so) libs in separate dirs; need symlinks"
  - "libffi pre-built package had corrupt .so (10KB instead of 120KB); replaced with HNP version"
  - "libarchive.pc Requires.private: libcrypto caused pkg-config failure; removed since shared linking"
  - "libmediaart requires gdk-pixbuf-2.0.pc; created stub .pc file pointing to external lib dir"
