# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: grilo-plugins/0.3.16
homepage: "https://gnome.pages.gitlab.gnome.org/grilo/"

# Upstream test command
upstream_check_command: "meson test --list"

# Whether upstream tests are integrated in build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from meson test --list)
upstream_tests:
  - file: tests/chromaprint/test_chromaprint_resolve
    source: grilo-plugins-0.3.16/tests/chromaprint/test_chromaprint_resolve.c
    description: "Chromaprint plugin resolve test"
    command: "./test_chromaprint_resolve"
  - file: tests/lua-factory/test_lua_factory_grl_media
    source: grilo-plugins-0.3.16/tests/lua-factory/test_lua_factory_grl_media.c
    description: "Lua factory media test"
    command: "./test_lua_factory_grl_media"
  - file: tests/tmdb/test_tmdb_fast_resolution
    source: grilo-plugins-0.3.16/tests/tmdb/test_tmdb_fast_resolution.c
    description: "TMDb fast resolution test"
    command: "./test_tmdb_fast_resolution"
  - file: tests/local-metadata/test_local_metadata
    source: grilo-plugins-0.3.16/tests/local-metadata/test_local_metadata.c
    description: "Local metadata plugin test"
    command: "./test_local_metadata"

# test_package consumer tests
test_package_tests:
  - file: test.c
    description: "dlopen plugin loading test"
    command: "./test_grilo_plugins"

# Test assertion count (approximate)
assertion_count: 4
