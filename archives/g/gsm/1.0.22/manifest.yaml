software: gsm
version: "1.0.22"
status: published
build_date: "2026-08-06"
build_system: makefile

source:
  url: "https://www.quut.com/gsm/gsm-1.0.22.tar.gz"
  sha256: "f0072e91f6bb85a878b2f6dbf4a0b7c850c4deb8049d554c65340b3bf69df0ac"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "CCFLAGS=-c -O2 -DNeedFunctionPrototypes=1 -Wall -Wno-comment -fPIC"
  cc: clang

patches_applied:
  - "0001-makefile-clang-ln-s.patch"

knowledge_gained:
  - "Makefile 需修改 CC=gcc → CC=clang"
  - "需添加 -fPIC"
  - "HMDFS 不支持硬链接，需设置 LN=ln -s"

conan:
  recipe: true
  test_package: true
