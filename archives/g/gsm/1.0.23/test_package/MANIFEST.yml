# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gsm/1.0.23
homepage: "https://www.quut.com/gsm/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: add-test
    source: gsm-1.0.23/add-test
    description: "上游自带的 GSM 编解码功能测试脚本"
    command: "./add-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "GSM 编解码回环测试：编码 160 样点静音，解码后验证幅值"
    command: "./test_gsm"

# 测试断言总数
assertion_count: 4
