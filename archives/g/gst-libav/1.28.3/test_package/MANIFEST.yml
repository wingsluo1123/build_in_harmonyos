# test_package/MANIFEST.yml
# Upstream official test declaration for gst-libav 1.28.3
# CI script (build_and_test.sh L0e) requires this file

package: gst-libav/1.28.3
homepage: "https://gstreamer.freedesktop.org"

upstream_check_command: "meson test --list"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "tests/check/generic/plugin.c"
    source: "gst-libav-1.28.3/tests/check/generic/plugin.c"
    description: "GStreamer libav plugin unit tests (disabled in build, tracked for reference)"
    command: "meson test"

test_package_tests:
  - file: test.c
    description: "Consumer test: dlopen the plugin .so and verify GStreamer plugin descriptor symbols"
    command: "./test_gst_libav"

assertion_count: 4
