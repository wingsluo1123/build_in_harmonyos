package: gst-libav/1.28.3
homepage: "https://gstreamer.freedesktop.org"

upstream_check_command: "meson test --list"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/check/gst/libav.c
    source: gst-libav-1.28.3/tests/check/gst/libav.c
    description: "gst-libav plugin functional tests"
    command: "./tests/check/gst/libav"

test_package_tests:
  - file: conanfile.py
    description: "Verify plugin ELF has SONAME and GStreamer descriptor symbols"
    command: "llvm-readelf -d libgstlibav.so | grep SONAME"

assertion_count: 2
