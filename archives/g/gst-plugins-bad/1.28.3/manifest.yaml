software: gst-plugins-bad
version: "1.28.3"
build_system: meson
status: built
build_date: "2026-08-06"

source:
  url: "https://github.com/GStreamer/gstreamer/archive/refs/tags/1.28.3.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--buildtype=release"
    - "-Dbase=enabled"
    - "-Dbad=enabled"
    - "-Dgood=disabled"
    - "-Dugly=disabled"
    - "-Dlibav=disabled"
    - "-Ddevtools=disabled"
    - "-Dges=disabled"
    - "-Drtsp_server=disabled"
    - "-Dpython=disabled"
    - "-Dsharp=disabled"
    - "-Dtests=disabled"
    - "-Dexamples=disabled"
    - "-Dintrospection=disabled"
    - "-Dtls=disabled"
    - "-Dbenchmarks=disabled"
    - "-Dorc=disabled"
    - "-Dgpl=disabled"
    - "-Dgst-full=disabled"
    - "-Dgst-plugins-bad:opensles=disabled"
    - "--wrap-mode=nodownload"
  dependencies:
    - glib/2.88.0
    - pcre2/10.47
    - libffi/3.4.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GStreamer 1.28.x uses monorepo structure; gst-plugins-bad is a subproject"
  - "Must build from monorepo root to resolve gstreamer/gst-plugins-base subproject dependencies"
  - "OpenSLES plugin (Android-specific) must be disabled with -Dgst-plugins-bad:opensles=disabled"
  - "System glib from cmd-pkgs requires pcre2 and libffi to be built from source for static linking"
  - "Network restrictions prevent downloading meson wraps from gitlab.freedesktop.org"
  - "glib.wrap must be removed to force meson to use system-installed glib (avoid GNOME download timeout)"
