# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: gst-plugins-bad/1.28.3
homepage: "https://gstreamer.freedesktop.org/"

# Upstream test command (from meson test --list analysis)
upstream_check_command: "meson test --list"

# Upstream tests are disabled in our build (-Dtests=disabled)
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (not executed, disabled for cross-platform build)
upstream_tests:
  - file: "tests/check/gstbuffer.c"
    source: "subprojects/gst-plugins-bad/tests/check/gstbuffer.c"
    description: "GStreamer core buffer unit tests"
    command: "meson test"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: "test_gst_plugins_bad.c"
    description: "Verify gstreamer library initialization and gst-plugins-bad plugin loading"
    command: "./test_gst_plugins_bad"

# Approximate assertion count for quality assessment
assertion_count: 3
