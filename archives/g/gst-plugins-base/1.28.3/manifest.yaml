software: gst-plugins-base
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.28.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.28.3"

# 构建系统
build_system: meson

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gstreamer.freedesktop.org/src/gst-plugins-base/gst-plugins-base-1.28.3.tar.xz"

  # 源码校验和
  sha256: "27880f3d87efa3bb5aa5f99f7ef6e4be7c95229f44eee928c1633d32e87d0099"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dprefix=/storage/Users/currentUser/usr/local"
    - "-Diso-codes=disabled"
    - "-Dorc=disabled"
    - "-Dgl=disabled"
    - "-Dexamples=disabled"
    - "-Dvorbis=disabled"
    - "-Dtheora=disabled"
    - "-Dogg=disabled"
    - "-Dtests=disabled"
    - "-Ddoc=disabled"
    - "-Dintrospection=disabled"
    - "-Dnls=disabled"
    - "-Dtools=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gstreamer/1.28.3
    - glib2/2.88.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-python-script-execution.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python scripts on HMDFS need find_program→files+python3 pattern (same as gstreamer)"
  - "gettext/ngettext must be stubbed as macros via c_args (OHOS has no gettext)"
  - "glib2 sub-package .pc files needed for meson dependency detection (same as gstreamer)"
  - "gstreamer .pc files needed for meson dependency detection"
  - "orc/gl/vorbis/theora/ogg all disabled (not available on OHOS PC)"
  - "AR/AS/STRIP/NM/RANLIB env vars must be pinned from PATH (CI worker exports llvm-* names)"
