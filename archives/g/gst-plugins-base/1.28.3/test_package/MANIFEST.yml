# test_package/MANIFEST.yml
# Upstream official test declaration for gst-plugins-base 1.28.3
# CI script (build_and_test.sh L0e) requires this file

package: gst-plugins-base/1.28.3
homepage: "https://gstreamer.freedesktop.org"

upstream_check_command: "meson test --list"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "tests/check/libs/appsink.c"
    source: "gst-plugins-base-1.28.3/tests/check/libs/appsink.c"
    description: "GStreamer base plugins unit tests (disabled in build, tracked for reference)"
    command: "meson test"

test_package_tests:
  - file: test.c
    description: "Consumer test: verify gst_app API and appsink element"
    command: "./test_gst_plugins_base"

assertion_count: 2
