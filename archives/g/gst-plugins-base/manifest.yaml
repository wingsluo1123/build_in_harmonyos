software: gst-plugins-base
display: "GStreamer Base Plugins"
description: "GStreamer base plugins and libraries"
category: multimedia
homepage: "https://gstreamer.freedesktop.org/"
license: LGPL
build_system: meson

ohos_adaptation:
  key_points:
    - "使用 meson 构建系统，需 meson 1.4+ 和 ninja"
    - "HMDFS/SELinux 环境下 Python 脚本无法直接执行，需通过 python3 解释器调用"
    - "依赖 gstreamer-1.0 (1.28.3) 和 glib-2.0 (2.88.0+)，需先安装"
    - "禁用 gl, vorbis, theora, ogg, orc, iso-codes 等外部依赖"
    - "核心库 (allocators, app, audio, fft, pbutils, riff, rtp, rtsp, sdp, tag, video) 完全可用"
  common_dependencies:
    - gstreamer/1.28.3
    - glib2/2.88.0

versions:
  "1.28.3":
    status: built
    build_date: "2026-08-06"
    notes: "最新稳定版，需修复 Python 脚本执行问题"
