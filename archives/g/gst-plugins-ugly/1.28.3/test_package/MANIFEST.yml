# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e check

package: gst-plugins-ugly/1.28.3
homepage: "https://gstreamer.freedesktop.org/"

# Upstream test command
upstream_check_command: "meson test --list"

# Conan build() does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: tests/check/asfdemux.c
    source: gst-plugins-ugly-1.28.3/tests/check/asfdemux.c
    description: "ASF demuxer unit test"
    command: "meson test asfdemux"

# Consumer-side test
test_package_tests:
  - file: test_gst_plugins_ugly.c
    description: "Verifies gstreamer init + ASF plugin static registration"
    command: "./test_gst_plugins_ugly"

# Approximate assertion count
assertion_count: 3
