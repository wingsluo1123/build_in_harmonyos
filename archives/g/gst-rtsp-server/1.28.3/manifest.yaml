software: gst-rtsp-server
build_system: meson
version: "1.28.3"
status: built
build_date: "2026-08-10"

source:
  url: "https://gstreamer.freedesktop.org/src/gst-rtsp-server/gst-rtsp-server-1.28.3.tar.xz"
  sha256: "9379585ea9d30a00811f4590760208d3412e2ea6dbd9562b07fba6872f275664"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Drtspclientsink=enabled"
    - "-Dexamples=disabled"
    - "-Dtests=disabled"
    - "-Dintrospection=disabled"
    - "-Ddoc=disabled"
    - "-Dglib_assert=false"
    - "-Dglib_checks=false"
    - "-Ddefault_library=static"
  dependencies:
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
    - glib2/2.88.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "gst-rtsp-server 1.28.3 使用 meson 构建，直接编译无需平台适配补丁"
  - "需要 gstreamer 1.28.3、gst-plugins-base 1.28.3 作为核心依赖"
  - "静态构建以避免 conan zlib 静态库未编译 -fPIC 的链接错误"
  - "gstreamer 和 gst-plugins-base 尚未发布到 ohpcd 制品仓，conan create 需要它们先发布"
