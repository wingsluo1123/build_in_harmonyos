software: gst-rtsp-server
display: "gst-rtsp-server"
description: "GStreamer-based RTSP server library and rtspclientsink plugin"
category: multimedia
homepage: "https://gitlab.freedesktop.org/gstreamer/gst-rtsp-server"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson >= 1.4 构建，OHOS profile 自动映射 host_system"
    - "无需平台适配补丁，原生支持 aarch64 + musl 构建"
    - "依赖 gstreamer 1.28.3、gst-plugins-base 1.28.3、glib2 2.88.0"
    - "静态构建以避免 zlib 静态库 -fPIC 问题"
  common_dependencies:
    - "gstreamer"
    - "gst-plugins-base"
    - "glib2"

versions:
  "1.28.3":
    status: built
    build_date: "2026-08-10"
