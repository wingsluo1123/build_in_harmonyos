# test_package/MANIFEST.yml
# Upstream official test declaration for gstreamer 1.28.3
# CI script (build_and_test.sh L0e) requires this file

package: gstreamer/1.28.3
homepage: "https://gstreamer.freedesktop.org"

upstream_check_command: "meson test --list"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "tests/check/gst/gst.c"
    source: "gstreamer-1.28.3/tests/check/gst/gst.c"
    description: "GStreamer core unit tests (disabled in build, tracked for reference)"
    command: "meson test"

test_package_tests:
  - file: test.c
    description: "Consumer test: verify gst_init() and version string"
    command: "./test_gstreamer"

assertion_count: 2
