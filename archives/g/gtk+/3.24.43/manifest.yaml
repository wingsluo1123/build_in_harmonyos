software: gtk+
version: "3.24.43"
status: built
build_date: "2026-05-27"

source:
  url: "https://ftp.gnome.org/pub/GNOME/sources/gtk+/3.24/gtk+-3.24.43.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dx11_backend=false"
    - "-Dwayland_backend=false"
    - "-Dbroadway_backend=true"
    - "-Dwin32_backend=false"
    - "-Dquartz_backend=false"
    - "-Ddemos=false"
    - "-Dexamples=false"
    - "-Dtests=false"
    - "-Dintrospection=false"
    - "-Dgtk_doc=false"
    - "-Dman=false"
    - "-Dprint_backends=file"
    - "-Dcolord=no"
  dependencies:
    - glib/2.84.0
    - cairo/1.18.4
    - pango/1.50.14
    - fribidi/1.0.13
    - atk/2.58.3
    - epoxy/1.5.10
    - gdk-pixbuf/2.42.12
    - harfbuzz/6.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-xml-declaration-in-gen-gtk-gresources-xml.patch"

knowledge_gained:
  - "GTK+3 meson build 需要 native file 指定 python3 路径避免 libiconv.so.2 加载问题"
  - "gen-gtk-gresources-xml.py XML 声明缺少 ?> 需要补丁修复"
  - "gdbus-codegen shebang 使用 /usr/bin/python3 不存在，需要创建 wrapper"
  - "GTK+3 编译需要 glib 内部 gobjectnotifyqueue.c 文件"