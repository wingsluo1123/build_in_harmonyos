software: gtk+
display: "GTK+ 3"
description: "GIMP Toolkit — a multi-platform toolkit for creating graphical user interfaces"
category: gui
homepage: "https://www.gtk.org/"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "需要使用 meson native file 指定 python3 wrapper 路径避免 libiconv.so.2 加载问题"
    - "需要设置 UNINSTALLED_GLIB_SRCDIR 环境变量让 gdbus-codegen 正常工作"
    - "需要创建 gobjectnotifyqueue.c 的符号链接到本地 include 目录"
    - "gen-gtk-gresources-xml.py XML 声明缺少 ?> 需要补丁修复"
    - "gdbus-codegen shebang 使用 /usr/bin/python3 不存在，需要创建 wrapper 脚本"
    - "禁用 X11/wayland/win32/quartz 后端，仅启用 broadway 后端（HTML5 渲染）"
  common_dependencies:
    - glib
    - cairo
    - pango
    - atk
    - epoxy
    - gdk-pixbuf
    - harfbuzz
    - fribidi

versions:
  "3.24.43":
    status: built
    build_date: "2026-05-27"