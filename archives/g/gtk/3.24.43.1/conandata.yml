  mirror_url: "https://repo.huaweicloud.com/gnome/sources/gtk+/3.24/gtk+-3.24.43.tar.xz"

patches:
  - patch_file: "patches/0001-meson-enable-export-dynamic-for-clang.patch"
    patch_description: >-
      上游 testsuite/gtk/meson.build 只在编译器既非 msvc 也非 clang 时才给
      测试目标加 -Wl,--export-dynamic；OHOS 适配用 clang，builder 用例于是
      在运行期找不到 UI 文件里声明的信号处理器
      (Gtk-WARNING: Could not find signal handler 'signal_normal'. Did you
      compile with -rdynamic?) 而失败。clang 支持该链接选项，放宽条件即可。
    patch_type: "portability"
