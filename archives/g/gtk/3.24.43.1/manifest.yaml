knowledge_gained:
  - "R37：同一上游版本变更适配层必须递增版本后缀——3.24.43 为 broadway-only，gdkconfig.h 中 GDK_WINDOWING_X11 未定义且不安装 gtk+-x11-3.0.pc；X11-only 消费者 vino 3.22.0 在 server/smclient/eggsgmclient.c:348 编译失败 → 3.24.43.1 启用 x11_backend（保留 broadway）"
  - "gtk 上游 meson.build:556-568 的 X11 分支硬性要求 atk-bridge-2.0（由 at-spi2-core 提供）；制品仓 at-spi2-core/2.60.5 走 glib2/2.88 谱系与本依赖图冲突 → 产出 at-spi2-core/2.60.5.1（切 glib/2.84.0.2 谱系）"
  - "glib/2.84.0.2：proxy-libintl subproject 改 static 并入 libglib-2.0.so（9 个 g_libintl_* 定义、无 libintl.so NEEDED），解决 atk/atspi 经 gi18n 静态链接的 undefined symbol"
  - "cairo 必须用 xlib 变体（cairo/1.18.4.1 + cairo-gobject/1.18.4.3）：pango 原钉 cairo/1.18.4，需顶层 override 统一，否则模块 .pc 缺失"
  - "X11 库谱系冲突：libxrender/0.9.12 钉 libx11/1.8.13，而 libxext/6.4.0 依赖 libx11/6.4.0 → 顶层 override libx11/6.4.0 统一"
  - "gtk+-x11-3.0.pc 是 X11 消费者（vino configure.ac:285）的 pkg-config 探测入口，必须随包安装，否则 configure 直接失败"
  - "已知限制：OHOS 环境无真实 X 服务器，X11 后端完成编译期/链接期验证（后端宏 + gdk_x11_* 符号），运行时显示会话未验证"
  - "上游 tests/ 为 GUI 测试（需显示会话），配方 tests=false 不构建；测试完备性由 test_package 消费者用例承担并在 test_package/MANIFEST.yml 如实申报（R51）"
