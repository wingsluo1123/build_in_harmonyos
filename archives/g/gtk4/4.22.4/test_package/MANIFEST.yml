# test_package/MANIFEST.yml — gtk4 4.22.4
# CI L0e requires this file to exist.

package: gtk4/4.22.4
homepage: "https://www.gtk.org"

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test"

upstream_tests:
  - file: tests/meson.build
    source: gtk-4.22.4/tests/meson.build
    description: "GTK4 test suite covering rendering, input, widgets, accessibility, and Broadway backend"
    command: "meson test"

test_package_tests:
  - file: test_gtk4.c
    description: "Calls gtk_get_major_version() to verify library linkage and expected GTK4 major version"
    command: "./test_gtk4"

assertion_count: 1
