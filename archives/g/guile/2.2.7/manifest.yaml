# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.gnu.org/gnu/guile/guile-2.2.7.tar.xz"

  sha256: "cdf776ea5f29430b1258209630555beea6d2be5481f9da4d64986b077ff37504"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options: []

  # Conan 依赖
  dependencies:
    - "gc/8.2.12"
    - "gmp/6.3.0@ohpcd/stable"
    - "libffi/3.4.8"
  # 非 Conan 依赖（已安装到 /usr/local）
  system_dependencies:
    - "libunistring/1.4.2 (/usr/local)"
    - "libltdl/2.4.7 (/usr/local)"
    - "readline/8.2 (system)"
    - "gettext/libintl (system)"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.patch"

# 注意: 0004/0005 补丁是构建过程中自动生成的文档时间戳补丁，
# 包含环境变量转储，不应作为正式补丁应用。
# 文档时间戳问题通过 conanfile.py 中的 touch 操作处理。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Guile 2.2.x 依赖 libltdl（libtool 的库部分），需确保 /usr/local 在搜索路径中"
  - "HMDFS 文件系统需修改 umask 077 为 022（configure 和 guile-snarf 两处）"
  - "Signal 5 (SIGTRAP) 在 .go 编译后崩溃不影响产物，用 make -k 容忍"
  - "doc/ref/stamp-vti 和 version.texi 需 touch 防止 texinfo 工具重新生成"
  - "Guile 2.2.7 的库名为 libguile-2.2（非 libguile），pkg-config 名为 guile-2.2"
  - "头文件无 libguile.h 总头文件，需直接 include libguile/__scm.h 等"

