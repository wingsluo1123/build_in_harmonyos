# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: guile/2.2.7
homepage: "https://www.gnu.org/software/guile/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test-suite/standalone/test-num2int
    source: guile-2.2.7/test-suite/standalone/test-num2int
    description: "Number conversion test"
    command: "./test-num2int"
  - file: test-suite/standalone/test-list
    source: guile-2.2.7/test-suite/standalone/test-list
    description: "List operations test"
    command: "./test-list"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verify libguile API: scm_with_guile + scm_c_eval_string (+ 1 2) = 3"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
