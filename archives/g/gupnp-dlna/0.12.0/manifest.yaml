software: gupnp-dlna
version: "0.12.0"
status: built
build_date: "2026-10-19"
build_system: meson
conan_ref: "gupnp-dlna/0.12.0"

source:
  url: "https://download.gnome.org/sources/gupnp-dlna/0.12/gupnp-dlna-0.12.0.tar.xz"
  sha256: "3d53b96f85bc5628d33e367ec9bf2adb38ef2b34d7ad0434a6ba0cf4ad9048e6"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "default_library=shared"
    - "wrap_mode=nodownload"
    - "introspection=false"
    - "vapi=false"
    - "gtk_doc=false"
    - "gstreamer_backend=enabled"
    - "default_backend=gstreamer"
  cc: clang
  cxx: clang++

patches_applied: []

dependencies:
  - "glib2/2.88.0"
  - "libxml2/2.15.3.1"
  - "gstreamer/1.28.3"
  - "gst-plugins-base/1.28.3"
  - "zlib/1.3.1.1 (override, PIC)"

test_results:
  validation_round: 1
  device_verified: "2026-10-19"
  verify_call: "ohc-run.py conan-verify gupnp-dlna 0.12.0 --user ohpcd --channel stable -> PASS (G0-G5)"
  upstream_meson_test_targets: 2
  upstream_gtest_subtests: 9
  upstream_gtest_passed: 9
  upstream_script_ctest: "discoverer: exit 77 (SKIP, media set absent)"
  consumer_test_cases: 3
  consumer_test_cases_passed: 3
  consumer_checks: 18
  consumer_checks_failed: 0
  consumer_assertions_passed: 3
  cli_tools: "gupnp-dlna-ls-profiles-2.0 exit 0 (profile table); gupnp-dlna-info-2.0 --help exit 0"
  platform_limitation: "GstDiscoverer 解码链路与后端模块 dlopen 受静态 glib 多副本限制（dlopen 探针 SIGABRT；info-2.0 真实文件 SIGABRT），详见 notes.md"
  test_environment:
    profile_dir: "GUPNP_DLNA_PROFILE_DIR=<pkg>/share/gupnp-dlna-2.0/dlna-profiles (runenv_info 注入)"
    backend_dir: "GUPNP_DLNA_METADATA_BACKEND_DIR=<pkg>/lib/gupnp-dlna (runenv_info 注入)"
    gst_plugin_path: "GST_PLUGIN_PATH=<gst-plugins-base>/lib/gstreamer-1.0 (runenv_info 注入)"

knowledge_gained:
  - "gupnp-dlna 的 gstreamer 元数据后端是 shared_module（libgstreamer.so），由 g_module_open() 在运行时加载；default_library 必须为 shared，静态包会把后端与 glib 复制进多个副本。"
  - "编译期 DATA_DIR/metadata_backend_dir 取 configure-time prefix（conan 下为 /），运行时必须用 GUPNP_DLNA_PROFILE_DIR / GUPNP_DLNA_METADATA_BACKEND_DIR 指到包内实际路径（gupnp-av GUPNP_AV_DATADIR 同款）。"
  - "glib2/gstreamer/gst-plugins-base 在制品仓均为静态包：共享库链接时静态 glib/gst 全量入链，-Wl,--no-undefined 要求 pbutils 的 .pc 带全量静态 lib 链；gst-plugins-bad 1.28.3 已证明该形态真机可运行。"
