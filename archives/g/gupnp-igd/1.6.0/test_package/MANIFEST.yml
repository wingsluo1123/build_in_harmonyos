# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）

package: gupnp-igd/1.6.0
homepage: https://gitlab.gnome.org/GNOME/gupnp-igd

# 上游测试命令（meson test，build() 中在 OHOS 设备原生执行）
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 中集成上游测试（OHOS 设备原生跑）
upstream_test_in_build: true
upstream_test_command: "meson test -v --no-rebuild --timeout-multiplier=48"

# 上游测试（tests/gtest/ 目录，meson test 1 项 glib TAP 测试程序，11 个 TAP 子用例）
# 取数命令：meson test -C builddir 输出 testlog.txt 中 g_test_add_func 注册项计数
# （glib TAP 格式，一个测试程序一个 TAP plan "1..11"）；统计单位 = TAP 子用例。
upstream_tests:
  - file: tests/gtest/gupnp-simple-igd.c
    source: gupnp-igd-1.6.0.tar.xz/tests/gtest/gupnp-simple-igd.c
    description: "GUPnPSimpleIgd 单元测试（11 个 TAP 子用例：new/default_ctx/remove_local/custom_ctx/thread/random-no_conflict/random-conflict/dispose_removes-regular/dispose_removes-thread/invalid_ip/empty_ip，含模拟 IGD 设备的回环 SSDP/SOAP 往返；配套 XML InternetGatewayDevice/WANIPConnection/WANPPPConnection 设备描述由 XML_PATH 环境提供）"
    command: "meson test gupnp-simple-igd"
    cases: 11

# test_package 自带测试（消费者视角，真实 API）
test_package_tests:
  - file: test_gupnp_igd.c
    description: "gupnp-igd 真实 API 冒烟：pkg-config 探测 gupnp-igd-1.6（--modversion/--variable/--cflags/--libs）+ gupnp_simple_igd_new/gupnp_simple_igd_thread_new 对象构造（GObject 类型注册）+ mapped-external-port/error-mapping-port 信号连接 + add_port/remove_port 端口映射 API + 默认主上下文迭代（线程化对象真实起停 GMainContext 工作线程）+ 双对象释放"
    command: "./test_gupnp_igd"

# 断言数：igd 非空 + IS_SIMPLE_IGD + igdthread 非空 + IS_SIMPLE_IGD_THREAD
# + igdthread IS_SIMPLE_IGD + sig_mapped 非零 + sig_error 非零 = 7 项断言
assertion_count: 7
