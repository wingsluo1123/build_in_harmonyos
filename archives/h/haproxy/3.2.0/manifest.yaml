version: '3.2.0'
status: built
build_date: '2026-08-07'
build_system: makefile

software:
  name: haproxy
  version: 3.2.0
  description: HAProxy - Reliable, High Performance TCP/HTTP Load Balancer
  homepage: https://www.haproxy.org/
  license: GPL-2.0-or-later

build:
  platform: OpenHarmony
  architecture: aarch64
  compiler: clang
  target: linux-musl
  build_env: TMPDIR=/storage/Users/currentUser/.local/tmp

dependencies:
  - name: openssl
    version: "3.5.6.1"
    required: true
  - name: zlib
    version: "1.3.1.1"
    required: true
  - name: pcre2
    version: "10.45"
    required: true

features:
  - ssl
  - compression
  - pcre2
  - thread
  - prometheus-exporter

build_flags:
  - USE_OPENSSL=1
  - USE_ZLIB=1
  - USE_PCRE2=1
  - USE_THREAD=1
  - USE_PROMEX=1

artifacts:
  bin:
    - name: haproxy
      type: executable
      format: ELF 64-bit LSB arm64, dynamic linked

notes:
  - HAProxy binary dynamically linked to libc only (all deps statically linked)
  - Suitable for production use on OpenHarmony aarch64 systems

patch_generation:
  method: per-file-difflib
  patches_count: 2

patch_classification:
  - file: 0001-include-haproxy-compat.h.patch
    type: auto
    platform_only: true
  - file: 0002-src-thread.c.patch
    type: auto
    platform_only: true
