version: '3.2.0'
status: built
build_date: '2026-08-07'
build_system: makefile
software: haproxy
description: HAProxy - Reliable, High Performance TCP/HTTP Load Balancer
homepage: https://www.haproxy.org/
license: GPL-2.0-or-later
platform: OpenHarmony
architecture: aarch64
compiler: clang
target: linux-musl

dependencies:
  - openssl/3.5.6.1
  - zlib/1.3.1.1
  - pcre2/10.45

build_flags:
  - USE_OPENSSL=1
  - USE_ZLIB=1
  - USE_PCRE2=1
  - USE_THREAD=1
  - USE_PROMEX=1

features:
  - ssl
  - compression
  - pcre2
  - thread
  - prometheus-exporter

patch_generation:
  method: per-file-difflib
  patches_count: 2

patch_classification:
  - file: 0001-include-haproxy-compat.h.patch
    type: auto
    platform_only: true
  - file: 0002-src-thread.c.patch
    type: auto
    platform_only: true
