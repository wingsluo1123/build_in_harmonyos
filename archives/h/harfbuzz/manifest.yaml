software: harfbuzz
display: "HarfBuzz"
description: "HarfBuzz is a text shaping library for OpenType fonts"
category: gfx
homepage: "https://harfbuzz.github.io/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake build system works on HMDFS (meson has subprocess issues)"
    - "graphite2 support via HB_HAVE_GRAPHITE2=ON cmake option"
    - "freetype support via HB_HAVE_FREETYPE=ON cmake option"
    - "Static library build (BUILD_SHARED_LIBS=OFF)"
  common_dependencies:
    - graphite2/1.3.14
    - freetype/2.14.3

versions:
  "14.2.0":
    status: archived
    build_date: "2026-07-22"
    archived_date: "2026-07-30"
    archive_reason: "Replaced by 14.2.0.1 (CMake rewrite with components, pkg_config_name, conditional requires)"
  "14.2.0.1":
    status: built
    build_date: "2026-07-30"
    note: "CMake rewrite with components, pkg_config_name, conditional requires"
