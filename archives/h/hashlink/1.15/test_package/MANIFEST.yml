# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hashlink/1.15
homepage: https://github.com/HaxeFoundation/hashlink

# 上游测试命令
# hashlink 1.15 的上游测试套件位于 other/tests/ 下，是 Haxe 源码（依赖 Haxe 编译器
# 在构建时把 .hx 编译成 .c/.hl）。不依赖 Haxe 编译链时无法运行；BUILD_TESTING=OFF
# 已禁用。本适配也不引入 Haxe 编译器。
upstream_check_command: "cmake -DBUILD_TESTING=ON && ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（参考；本适配未运行）
upstream_tests:
  - file: other/tests/HelloWorld.hx
    source: hashlink-1.15/other/tests/HelloWorld.hx
    description: "编译并运行 'Hello, World!'（需要 haxe 编译器，本适配禁用）"
    command: "hl test/hello.hl"
  - file: other/tests/Threads.hx
    source: hashlink-1.15/other/tests/Threads.hx
    description: "线程/协程基础测试（需要 haxe 编译器）"
    command: "hl test/threads.hl"
  - file: other/uvsample/UVSample.hx
    source: hashlink-1.15/other/uvsample/UVSample.hx
    description: "libuv 集成测试（需要 libuv，本适配禁用 WITH_UV）"
    command: "hl test/uvsample.hl"

# test_package 中自带的测试 (消费者视角验证)
# R34：必须调用被测包 API，禁止只 print 字符串空壳测试
test_package_tests:
  - file: test.c
    description: "真实 API 调用：GC init / 自定义 allocator / buffer 读写 / UTF-8 round-trip / 原始字节分配 / 类型系统 singletons"
    command: "./test_hashlink"

# 测试断言总数（近似值，用于质量评估）
# 6 个测试函数 / 22 个 HL_ASSERT（按函数细分：1+1+5+4+2+9=22）
assertion_count: 22