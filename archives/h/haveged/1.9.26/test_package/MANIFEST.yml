package: haveged/1.9.26
homepage: "https://github.com/jirka-h/haveged"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (ent/test.sh invoked through bash on OHOS)"
upstream_tests:
  - file: ent/entest.c
    source: haveged-1.9.26/ent/entest.c
    description: "ENT self-test against entitle.gif"
    command: "./entest -t ./entitle.gif"
  - file: ent/test.sh
    source: haveged-1.9.26/ent/test.sh
    description: "Ten 16 MiB haveged streams checked by ENT"
    command: "bash ./test.sh"
test_package_tests:
  - file: test.c
    description: "Link libhavege; create, start, generate and check 32 words"
    command: "ctest --output-on-failure"
assertion_count: 5
