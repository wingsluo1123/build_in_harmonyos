software: hdf5
display: "HDF5"
description: "高性能数据管理和存储库，支持大规模科学数据存储和处理"
category: library
homepage: "https://www.hdfgroup.org/solutions/hdf5/"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "HDF5 支持 CMake 构建，比 autotools 在鸿蒙环境更稳定"
    - "autotools 构建可能遇到 config.status 权限问题，推荐使用 CMake"
    - "GNU config.guess/config.sub 需添加 HarmonyOS/ohos 支持（用于 autotools）"
    - "CMake 会输出平台未知警告，但不影响编译和运行"
  common_dependencies:
    - zlib/system

versions:
  "1.13.0":
    status: published
    build_date: "2026-05-27"
    published_as: hdf5
    source_url: "https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.13/hdf5-1.13.0/src/hdf5-1.13.0.tar.gz"