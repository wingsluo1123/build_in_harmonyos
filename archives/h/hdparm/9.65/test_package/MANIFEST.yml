# test_package/MANIFEST.yml — hdparm/9.65
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hdparm/9.65
homepage: "https://sourceforge.net/projects/hdparm/"

# 上游测试命令 — hdparm 上游 Makefile 只有 all/static/install/clean 目标，
# 不存在 check / test 目标，也无任何测试源文件。
# 实测：make -n check → "No rule to make target 'check'.  Stop." (exit 2)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无自动化测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  # 真实消费者测试源文件（CI L0c no_test_sources 门禁要求 test_package/ 内存在
  # .py/.c/.sh 等后缀的实质测试源）。纯 Python 解析已安装二进制，断言鸿蒙加载契约：
  # ELF64/AArch64 + PT_INTERP=/lib/ld-musl-aarch64.so.1 + DT_NEEDED 含 libc.so
  # + .note.ohos.ident 段存在。无需执行被测 ELF，故不受未签名 ELF 限制。
  - file: test_hdparm_elf.py
    description: "OHOS ELF loading-contract consumer test (4 assertions: ELF64/AArch64, PT_INTERP musl loader, DT_NEEDED libc.so, .note.ohos.ident)"
    command: "python3 test_hdparm_elf.py <pkg>/bin/hdparm"
    ohos_specific: true
    assertion: true
  # 鸿蒙特有、非断言消费者用例：在 OHOS 上无法执行未签名 ELF，
  # 因此直接检查打包产物的 ELF 加载契约（PT_INTERP / NEEDED），
  # 证明该二进制可在 HarmonyOS PC 上被动态加载消费。仅打印，不做断言。
  - file: conanfile.py
    description: "OHOS consumer probe (non-assertion): dump ELF header/program headers/dynamic section to confirm the HarmonyOS musl loading contract"
    command: "readelf -hld <pkg>/bin/hdparm"
    ohos_specific: true
    assertion: false
  # 非断言：ELF 类型探测
  - file: conanfile.py
    description: "ELF type probe (non-assertion)"
    command: "file <pkg>/bin/hdparm"
    ohos_specific: false
    assertion: false

# 测试断言总数 (conanfile.py 3 处 assert + test_hdparm_elf.py 4 处 assert)
assertion_count: 7
# 鸿蒙特有非断言用例数量
ohos_specific_test_count: 1
