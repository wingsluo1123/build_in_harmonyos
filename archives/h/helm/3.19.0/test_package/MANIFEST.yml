# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: helm/3.19.0
homepage: "https://helm.sh"

# 上游测试命令 (helm 是 Go 项目，无 make check)
upstream_check_command: "go test ./cmd/helm/..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# helm 的上游测试需要完整 Kubernetes 集群环境，不适合在 OHOS 上运行
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_helm.sh
    description: "helm version + help + completion smoke test — 验证二进制可执行并输出正确版本号"
    command: "bash test_helm.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
