software: helm
display: "Helm"
description: "Kubernetes 包管理器 — 查找、共享和使用为 Kubernetes 构建的软件"
category: network
homepage: "https://helm.sh"
license: Apache-2.0
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Go 项目，使用 go build 编译，非传统 configure/make"
    - "Go 工具链子工具 (compile, link, asm 等) 在 OHOS 上需要 elfldr wrapper"
    - "CGO_ENABLED=0 静态编译，无外部动态库依赖"
    - "helm go.mod 要求 go >= 1.24.0"
    - "HMDFS 不支持硬链接，copytree 需用 copy2 替代 os.link"
  common_dependencies:
    - "go/1.24.0"

# 版本索引
versions:
  "3.19.0":
    status: published
    build_date: "2026-07-01"
    conan_ref: "helm/3.19.0@ohpcd/stable"
