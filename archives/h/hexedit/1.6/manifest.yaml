software: hexedit
version: '1.6'
build_system: autotools
status: published
build_date: '2026-07-14'

source:
  url: https://download.savannah.nongnu.org/releases/hexedit/hexedit-1.6.tar.gz
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - --prefix=$DEFAULT_PREFIX
    - HELP2MAN=/bin/true
    - CFLAGS=-fPIC -O2 -I$DEFAULT_PREFIX/include
    - LDFLAGS=-L$DEFAULT_PREFIX/lib
    - LIBS=-lncursesw
  dependencies:
    - ncurses/6.4
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-configure-hmdfs.patch

knowledge_gained:
  - hexedit configure需要设置cross_compiling=maybe（HMDFS限制无法执行conftest）
  - hexedit configure需要umask 022替换077（HMDFS目录创建限制）
  - hexedit依赖ncurses，使用-lncursesw（宽字符版本）
  - hexedit无make check目标，无需测试
