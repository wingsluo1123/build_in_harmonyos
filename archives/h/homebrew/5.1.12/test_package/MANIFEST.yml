# test_package/MANIFEST.yml
package: homebrew/5.1.12
homepage: "https://brew.sh"

# homebrew is a script-based package - no upstream test suite
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream C tests - homebrew is a Ruby/bash application
upstream_tests: []

# test_package consumer test
test_package_tests:
  - file: conanfile.py
    description: "验证 homebrew brew --version 可执行"
    command: "brew --version"

assertion_count: 1
