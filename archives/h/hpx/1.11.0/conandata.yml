# conandata.yml — hpx 1.11.0
# =============================================================================
# sources: official upstream tag archive (upstream moved from STEllAR-GROUP/hpx
#          to TheHPXProject/hpx; GitHub redirects the old namespace).
# =============================================================================
sources:
  url: "https://github.com/TheHPXProject/hpx/archive/refs/tags/v1.11.0.tar.gz"
  sha256: "01ec47228a2253b41e318bb09c83325a75021eb6ef3262400fbda30ac7389279"

# =============================================================================
# deps: FetchContent injected dependencies (official upstream tag archives).
#
# HPX 1.11.0 unconditionally requires standalone Asio (>= 1.12.0) — see
# cmake/HPX_SetupAsio.cmake: `find_package(Asio 1.12.0 REQUIRED)` runs unless
# HPX_WITH_FETCH_ASIO=ON.  There is no asio package in the registry yet, so
# the official chriskohlhoff/asio tag archive is downloaded here and injected
# through -DFETCHCONTENT_SOURCE_DIR_ASIO=<repo root> (the root contains the
# `asio/include` tree that HPX_SetupAsio.cmake installs from).  The tag is
# aligned with HPX's own HPX_WITH_ASIO_TAG_DEFAULT ("asio-1-21-0").
# =============================================================================
deps:
  asio:
    url: "https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-21-0.tar.gz"
    sha256: "5d2d2dcb7bfb39bff941cabbfc8c27ee322a495470bf0f3a7c5238648cf5e6a9"
    filename: "asio-asio-1-21-0.tar.gz"

patches:
  "1.11.0":
    - patch_file: "patches/0001-libs-core-coroutines-include-hpx-coroutines-detail-context_impl.hpp.patch"
      patch_description: >-
        OHOS/aarch64: select the POSIX ucontext coroutine backend
        (Boost.Context cannot be built for OHOS and the x86 specific backend
        is not applicable on aarch64)
      patch_type: "portability"
    - patch_file: "patches/0002-libs-core-coroutines-include-hpx-coroutines-detail-context_posix.hpp.patch"
      patch_description: >-
        OHOS musl: declare the ucontext context switching functions whose
        implementations are provided by libucontext/1.5.2
      patch_type: "portability"
    - patch_file: "patches/0003-libs-core-coroutines-src-swapcontext.cpp.patch"
      patch_description: >-
        OHOS/aarch64: skip the x86 specific swapcontext implementation (the
        ucontext backend is used instead)
      patch_type: "portability"
    - patch_file: "patches/0004-libs-core-coroutines-src-detail-context_posix.cpp.patch"
      patch_description: >-
        OHOS/aarch64: route the coroutine stack-size definition through the
        POSIX ucontext branch (kept in sync with context_impl.hpp)
      patch_type: "portability"
