# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DHPX_USE_CMAKE_CXX_STANDARD=ON"
    - "-DHPX_WITH_MALLOC=system"
    - "-DHPX_WITH_GENERIC_CONTEXT_COROUTINES=OFF"
    - "-DHPX_WITH_FETCH_ASIO=ON"
    - "-DFETCHCONTENT_SOURCE_DIR_ASIO=<build>/deps/asio"
    - "-DHPX_WITH_TESTS=OFF"
    - "-DHPX_WITH_EXAMPLES=OFF"
    - "-DHPX_WITH_PKGCONFIG=OFF"
    - "-DCMAKE_CXX_STANDARD_LIBRARIES=-L<libucontext>/lib -lucontext -lucontext_posix -lm"

  dependencies:
    - boost/1.85.0
    - hwloc/2.14.0
    - libucontext/1.5.2
    - zlib/1.3.1.1

  cc: clang
  cxx: clang++

# ============================================================
