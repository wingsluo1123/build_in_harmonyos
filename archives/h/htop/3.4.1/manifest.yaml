knowledge_gained:
  - "htop 3.4.1 有 bug: linux/IOPriorityPanel.h 中 #include \"Panel.h\" 路径不正确"
  - "鸿蒙 SELinux 策略限制 /proc 文件系统访问，普通用户无法读取 /proc/stat"
  - "sudo 后需使用 sudo -E 保留环境变量"
  - "htop config.guess/config.sub 在 build-aux/ 子目录"
  - "patch-autotools-ohos.pl 漏加 kernel-os 白名单 linux-ohos*"
  - "OHOS 系统头文件 <stdnoreturn.h> 将 noreturn 宏展开为 _Noreturn -> __attribute__((__noreturn__))，导致 ATTR_NORETURN 双重展开失败，需用 __noreturn__ 替代 noreturn"
  - "HMDFS 上 mktemp -d 创建的目录不可写入文件，需用 mkdir 替代（config.status 需要修改 PATH 或使用包装器）"
  - "ncurses 预编译包(cmd-pkgs)不含头文件，需从 ncurses 源码生成 term.h（用 awk -f MKterm.h.awk Caps Caps-ncurses > term.h）"

