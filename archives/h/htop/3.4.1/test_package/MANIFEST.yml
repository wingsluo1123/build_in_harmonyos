# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: htop/3.4.1
homepage: "https://htop.dev/"

# htop has no official test suite
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 htop --version 验证二进制已安装且可执行"
    command: "conan create (test_package: htop --version)"
  - file: test_htop.sh
    description: "冒烟测试: 检查 htop 二进制存在、可执行、版本号正确"
    command: "bash test_htop.sh <package bin dir>"

assertion_count: 2
