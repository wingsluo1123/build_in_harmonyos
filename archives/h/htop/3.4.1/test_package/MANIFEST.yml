# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: htop/3.4.1
homepage: "https://htop.dev/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# htop has no official test suite
# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# htop has no official test programs
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Run htop --version to verify binary is functional"
    command: "./test_htop"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
