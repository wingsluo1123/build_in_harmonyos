last_updated: 2026-08-10

compilation_notes:
  - "Pre-generated hd_ids.h patches skip slow check_hd --check --sort step"
  - "ohos_fixup.h prevents sockaddr_storage redefinition (OHOS sysroot bug)"
  - "ISDN.CDB.txt copied instead of symlinked (HMDFS ln -s issue)"
  - "lex→flex symlink created for ISDN CDB lexer"

issues_fixed:
  - issue: "sockaddr_storage redefinition"
    root_cause: "OHOS sysroot linux/socket.h redefines sockaddr_storage without guard"
    solution: "ohos_fixup.h with #define _UAPI_LINUX_SOCKET_H"
  - issue: "HD_VERSION_STRING not defined"
    root_cause: "git2log needs .git directory which is absent in tarball"
    solution: "version.h generated via 0001-version.h.patch"
  - issue: "check_hd slow on PCI data (186K lines, ~15 min)"
    root_cause: "O(n²) complexity in --check --sort on large hardware ID files"
    solution: "Pre-generated hd_ids.h/hd_ids_tiny.h/hd.ids patches"
  - issue: "lex command not found"
    root_cause: "OHOS has flex but not lex"
    solution: "Symlink flex to lex in local_bin"
