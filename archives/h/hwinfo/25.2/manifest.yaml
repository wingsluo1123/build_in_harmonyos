compilation_notes:
  - "Conan 配方适配: version.h 和 uuid/uuid.h 在 build() 方法中生成"
  - "flex 用于生成 lex.yy.c (Makefile 期望 lex 命令)"
  - "libuuid 从 HNP 包获取 (colrm.org/colrm_1.1/lib)"
  - "HWINFO_VERSION=25.2 跳过 git2log (需要 .git 目录)"
  - "sockaddr_storage 重定义修复 (net.c/pppoe.c/wlan.c)"

issues_fixed:
  - issue: "sockaddr_storage redefinition"
    root_cause: "OHOS SDK 的 sys/socket.h 和 linux/socket.h 都定义了 sockaddr_storage"
    solution: "定义 _UAPI_LINUX_SOCKET_H 宏跳过 linux/socket.h，手动 typedef __kernel_sa_family_t"
    knowledge_ref: "E119"
  - issue: "HD_VERSION_STRING 未定义"
    root_cause: "Makefile 的 git2log 脚本需要 .git 目录但源码包没有"
    solution: "conanfile.py build() 方法中创建 version.h"
  - issue: "uuid/uuid.h 缺失"
    root_cause: "系统有 libuuid 库但缺少 uuid/uuid.h 头文件"
    solution: "conanfile.py build() 方法中创建标准 uuid/uuid.h 头文件"
  - issue: "lex 命令不存在"
    root_cause: "OpenHarmony 没有 lex 命令，只有 flex"
    solution: "conanfile.py build() 方法中用 flex 生成 lex.yy.c"

