compilation_notes:
  - "version.h auto-generation fails (git2log requires .git dir) — generated in conanfile build()"
  - "sockaddr_storage redefinition (OHOS sys/socket.h vs linux/socket.h) — fixed with -D__MUSL__"
  - "lex command missing — used flex directly"
  - "ln -s hangs on HMDFS — pre-created ISDN.CDB.txt by copy"
  - "GNU install command missing — used conan copy() in package()"

issues_fixed:
  - issue: "HD_VERSION_STRING 未定义"
    root_cause: "Makefile git2log requires .git dir, version.h not auto-generated"
    solution: "Generated version.h in conanfile build() with correct version string"
  - issue: "sockaddr_storage redefinition"
    root_cause: "OHOS sys/socket.h and linux/socket.h define conflicting sockaddr_storage"
    solution: "Added -D__MUSL__ to suppress linux/socket.h definition"
  - issue: "lex command not found"
    root_cause: "OHOS system has flex but not lex"
    solution: "Used flex directly to generate lex.yy.c"
  - issue: "ln -s hangs on HMDFS"
    root_cause: "HMDFS does not support symbolic link creation"
    solution: "Pre-created ISDN.CDB.txt by copying ISDN.ppc.txt"
  - issue: "GNU install command missing"
    root_cause: "OpenHarmony uses toybox, lacks GNU coreutils install"
    solution: "Used conan copy() in package() instead of make install"
