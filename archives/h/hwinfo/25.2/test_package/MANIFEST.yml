# test_package/MANIFEST.yml — hwinfo 25.2
# CI L0e requires this file to exist.

package: hwinfo/25.2
homepage: "https://github.com/openSUSE/hwinfo"

# hwinfo has no upstream test suite (Makefile project, no `make check` target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs hwinfo --version to verify the binary is functional"
    command: "bash test.sh"

# Approximate assertion count (--version)
assertion_count: 1
