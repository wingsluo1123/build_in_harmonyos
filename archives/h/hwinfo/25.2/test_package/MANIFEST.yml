# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file

package: hwinfo/25.2
homepage: "https://github.com/openSUSE/hwinfo"

# Upstream has no formal test suite (no `make check` target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    description: "Run hwinfo --version to verify binary works"
    command: "hwinfo --version"

# Approximate assertion count
assertion_count: 1
