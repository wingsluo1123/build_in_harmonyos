# 软件级 manifest
# 文件位置: archives/h/hwinfo/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: hwinfo
display: "hwinfo"
description: "Hardware information tool from openSUSE"
category: system
homepage: "https://github.com/openSUSE/hwinfo"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "git2log requires .git dir, generate version.h manually"
    - "sockaddr_storage redefinition: use -D__MUSL__ to suppress sys/socket.h definition"
    - "lex command missing: use flex directly"
    - "ln -s hangs on HMDFS: pre-create ISDN.CDB.txt by copy"
    - "GNU install command missing: use conan copy() in package()"
  common_dependencies:
    - uuid

versions:
  "25.2":
    status: built
    build_date: 2026-08-06
