# 编译中学到的知识
knowledge_gained:
  - "E002+E073: HMDFS 对 umask 077 + mktemp -d + 重定向写入必拒（autotools 全源文件需改 umask 022）"
  - "鸿蒙沙箱对 4 个 NUMA mempolicy syscall 发 SIGSYS 而非 ENOSYS: set_mempolicy/get_mempolicy/migrate_pages/move_pages"
  - "鸿蒙 sched_setaffinity 静默成功不绑定（rc=0 但 sched_getaffinity 返回全 CPU），需 OHOS 守卫返回 ENOSYS"
  - "autotools config.guess/sub 需加 __OHOS__ 检测分支 + linux-ohos kernel-os 组合"
  - "freebsd ports 测试代码 __int32_t 鸿蒙 sysroot 不提供，需改 int32_t"

