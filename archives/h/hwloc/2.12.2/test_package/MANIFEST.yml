# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hwloc/2.12.2
homepage: "https://www.open-mpi.org/projects/hwloc/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试 (44 个: utils/hwloc/*.sh + tests/hwloc/*.c) 在 build() 不集成，
# 由本地适配验证 + CI conan create 的 test_package 替代
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 44 个测试: 8 个 utils/hwloc/*.sh + 2 个 utils/lstopo/*.sh + 34 个 tests/hwloc/*.c
# 本地适配验证结果: 42 PASS / 2 SKIP (shmem: HMDFS 共享内存限制) / 0 FAIL
upstream_tests:
  - file: utils/hwloc/test-hwloc-annotate.sh
    source: hwloc-2.12.2/utils/hwloc/test-hwloc-annotate.sh.in
    description: "hwloc-annotate 命令行工具功能测试"
    command: "./test-hwloc-annotate.sh"
  - file: utils/hwloc/test-hwloc-calc.sh
    source: hwloc-2.12.2/utils/hwloc/test-hwloc-calc.sh.in
    description: "hwloc-calc 命令行工具功能测试"
    command: "./test-hwloc-calc.sh"
  - file: utils/hwloc/test-hwloc-compress-dir.sh
    source: hwloc-2.12.2/utils/hwloc/test-hwloc-compress-dir.sh.in
    description: "hwloc-compress-dir 命令行工具功能测试"
    command: "./test-hwloc-compress-dir.sh"
  - file: utils/hwloc/test-hwloc-diffpatch.sh
    source: hwloc-2.12.2/utils/hwloc/test-hwloc-diffpatch.sh.in
    description: "hwloc-diff/hwloc-patch 命令行工具功能测试"
    command: "./test-hwloc-diffpatch.sh"
  - file: utils/hwloc/test-hwloc-distrib.sh
    source: hwloc-2.12.2/utils/hwloc/test-hwloc-distrib.sh.in
    description: "hwloc-distrib 命令行工具功能测试"
    command: "./test-hwloc-distrib.sh"
  - file: utils/hwloc/test-hwloc-info.sh
    source: hwloc-2.12.2/utils/hwloc/test-hwloc-info.sh.in
    description: "hwloc-info/hwloc-ls 命令行工具功能测试"
    command: "./test-hwloc-info.sh"
  - file: utils/hwloc/test-build-custom-topology.sh
    source: hwloc-2.12.2/utils/hwloc/test-build-custom-topology.sh.in
    description: "自定义拓扑构建测试"
    command: "./test-build-custom-topology.sh"
  - file: utils/hwloc/test-parsing-flags.sh
    source: hwloc-2.12.2/utils/hwloc/test-parsing-flags.sh.in
    description: "解析标志测试"
    command: "./test-parsing-flags.sh"
  - file: utils/lstopo/test-lstopo.sh
    source: hwloc-2.12.2/utils/lstopo/test-lstopo.sh.in
    description: "lstopo 命令行工具功能测试"
    command: "./test-lstopo.sh"
  - file: utils/lstopo/test-lstopo-shmem.sh
    source: hwloc-2.12.2/utils/lstopo/test-lstopo-shmem.sh.in
    description: "lstopo 共享内存测试 (本平台 SKIP: HMDFS 限制)"
    command: "./test-lstopo-shmem.sh"
  - file: tests/hwloc/*.c
    source: hwloc-2.12.2/tests/hwloc/*.c
    description: "34 个 hwloc API 单元测试 (hwloc_bitmap/hwloc_get_depth_distribution/hwloc_get_last_cpu_location/glibc-sched 等)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 hwloc_topology_init/load/get_depth/get_root_obj 验证库链接和符号导出"
    command: "./test_hwloc"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 44 个测试 + test_package 4 个断言
assertion_count: 100
