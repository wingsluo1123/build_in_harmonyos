# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: hyperfine/1.20.0-r0
homepage: "https://github.com/sharkdp/hyperfine"

# Upstream test command
upstream_check_command: "cargo test"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test.sh
    source: "hyperfine-1.20.0-r0/test_package/test.sh"
    description: "Run hyperfine --version, --help, and a simple benchmark"
    command: "hyperfine --version; hyperfine --help; hyperfine 'echo hello' --runs 2"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run hyperfine binary: --version, --help, simple benchmark"
    command: "hyperfine --version && hyperfine --help && hyperfine 'echo hello' --runs 2"
  - file: test.sh
    description: "Shell script running hyperfine --version, --help, and benchmark"
    command: "sh test.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 3
