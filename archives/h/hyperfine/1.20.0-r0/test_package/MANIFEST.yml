# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: hyperfine/1.20.0-r0
homepage: "https://github.com/sharkdp/hyperfine"

# Upstream test command (Rust cargo test — cannot run on HarmonyOS)
upstream_check_command: "cargo test"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test.sh
    source: "hyperfine-1.20.0-r0/test_package/test.sh"
    description: "Verify binary exists, ELF format, NEEDED deps, attempt execution"
    command: "file hyperfine; readelf -d hyperfine; hyperfine --version"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run test.sh: binary existence, ELF format, deps, execution"
    command: "bash test.sh"
  - file: test.sh
    description: "Shell script: find binary, check ELF, check NEEDED, run --version"
    command: "sh test.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 5
