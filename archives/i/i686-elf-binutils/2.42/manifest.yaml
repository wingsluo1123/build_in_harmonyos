  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "config.guess: HarmonyOS detection (E007)"
  - "config.sub: ohos-linux triple support"
  - "configure: umask 077→022 (E011, HMDFS, 15 files)"
  - "libiberty/config.h: fix missing HAVE_LIMITS_H, HAVE_SPAWN_H, etc."

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS 需要修改 config.guess/config.sub 添加系统识别（E007）"
  - "HMDFS 文件系统需要修改 configure 中 umask 077 为 umask 022（E011）"
  - "gprofng 使用 Linux 特定信号机制（SIGEV_THREAD_ID），在 HarmonyOS 上不可用，需禁用"
  - "所有子目录的 configure 脚本都需要修改 umask"
  - "系统 md5.h/sha1.h/obstack.h 与 binutils include/ 冲突，需设置 CPPFLAGS='' 避免"
  - "configure 脚本无法检测 limits.h/spawn.h 等标准头文件（交叉编译限制），需手动定义 config.h"
  - "交叉编译 --target=i686-elf 需要 --build 和 --host 参数，config.sub 不识别 ohos 需用 linux-gnu 替代"

