# test_package/MANIFEST.yml
package: i686-elf-binutils/2.46.1
homepage: "https://www.gnu.org/software/binutils/"

upstream_check_command: "make -C binutils check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "Smoke test: verify core binutils tools --version"
    command: "i686-elf-objdump --version && i686-elf-objcopy --version && i686-elf-ld --version && i686-elf-as --version && i686-elf-ar --version && i686-elf-nm --version && i686-elf-strip --version && i686-elf-size --version"

assertion_count: 8