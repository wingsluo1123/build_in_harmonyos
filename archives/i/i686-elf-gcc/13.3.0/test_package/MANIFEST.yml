# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: i686-elf-gcc/13.3.0
homepage: "https://gcc.gnu.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# GCC 测试套件 (gcc/testsuite/) 需要 dejagnu/runtest，在交叉编译裸机目标上不可用
upstream_tests:
  - file: gcc/testsuite/gcc.dg/
    source: gcc-13.3.0/gcc/testsuite/gcc.dg/
    description: "GCC 退化测试套件（需要 dejagnu，交叉编译环境不可用）"
    command: "runtest --tool gcc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 i686-elf-gcc/i686-elf-g++ 可执行"
    command: "i686-elf-gcc --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
