version: "3.8.2"
software: "ice"
status: built
build_date: "2026-07-13"
build_system: "custom-makefile"

source:
  url: "https://github.com/zeroc-ice/ice/archive/refs/tags/v3.8.2.tar.gz"
  sha256: "d350ebbcdd7971fafccebfdf1e99db139dc6d121f5a5dcdc4036256206735078"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - bzip2/1.0.8
    - mcpp/2.7.2
    - expat/2.8.0
    - openssl/3.5.6
    - zlib/1.3.1
    - lmdb/0.9.35
    - libedit/20240817
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Ice 3.8.2 uses a custom Makefile build system and selects config/Make.rules.$(uname); HarmonyOS needs Make.rules.HarmonyOS -> Make.rules.Linux."
  - "DataStorm requires C++20 structured binding capture and is disabled for this first OHOS adaptation."
  - "The package installs generated Slice headers into include/ as well as include/generated so public headers can resolve Ice/Version.h."
  - "test_package verifies icebox --version and slice2cpp code generation as runtime smoke tests."
