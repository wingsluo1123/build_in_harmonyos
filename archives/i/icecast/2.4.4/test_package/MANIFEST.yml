package: icecast/2.4.4
homepage: https://icecast.org/
upstream_check_command: "upstream-avl-test 25 && upstream-log-test"
upstream_test_in_build: true
upstream_test_command: "upstream-avl-test 25 && upstream-log-test"
upstream_tests:
  - file: src/avl/test.c
    source: icecast-2.4.4/src/avl/test.c
    description: "Standalone upstream AVL insertion and traversal test"
    command: "upstream-avl-test 25"
  - file: src/log/test.c
    source: icecast-2.4.4/src/log/test.c
    description: "Standalone upstream log lifecycle and write test"
    command: "upstream-log-test"
test_package_tests:
  - file: test.sh
    description: "Execute the packaged streaming server and verify its version"
    command: "icecast --version"
assertion_count: 1
