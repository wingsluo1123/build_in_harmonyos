knowledge_gained:
  - "iceoryx 2.0.8 的 ICEORYX_CXX_STANDARD 只在 CMAKE_SYSTEM_NAME 匹配 Linux/QNX 时取 14，其余（含 HarmonyOS）取 17 ⇒ 用 gtest >= 1.17（要求 C++17）时，Linux 构建反而会失败而 OHOS 构建正常"
  - "iceoryx 的构建入口是 iceoryx_meta/CMakeLists.txt（顶层无 CMakeLists.txt）⇒ conan 的 CMake helper 要 build_script_folder='iceoryx_meta'"
  - "iceoryx 的上游测试入口是 custom target（make module_tests / integration_tests）而非 ctest；且 tests.cmake 会在 configure 期下载 googletest ⇒ 无网 worker 必须改走 find_package(GTest)"
  - "iox-roudi 与 iceoryx_posh_config 都在 if(TOML_CONFIG) 内；cpptoml 缺失时 iceoryx 会退化成“只有库、没有守护进程”"
  - "CMake 对未知 CMAKE_SYSTEM_NAME=HarmonyOS 不置 UNIX，而 iceoryx 用 if(UNIX) 选择 POSIX 实现 ⇒ 必须显式 -DUNIX=TRUE（本仓 7 个先例）"
  - "iceoryx_hoofs 的 cxx::string 只用 string(const char (&)[N]) 接受字面量；运行期 const char* 需要 string(TruncateToCapacity_t, const char*)（否则编译报“no matching function”）"
