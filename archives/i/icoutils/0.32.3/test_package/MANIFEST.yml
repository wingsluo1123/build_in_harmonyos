# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e compliance

package: icoutils/0.32.3
homepage: "https://www.nongnu.org/icoutils/"

# Upstream test command (from make check analysis)
upstream_check_command: "make check"

# Conanfile build() upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (icoutils has no automated test suite in make check)
upstream_tests:
  - file: N/A
    source: N/A
    description: "icoutils make check runs no automated tests (only checks build completeness)"
    command: "make check"

# test_package tests (consumer verification)
test_package_tests:
  - file: test_icoutils.sh
    description: "Verifies icotool and wrestool --version output reports 0.32.3"
    command: "sh test_icoutils.sh"

# Approximate assertion count
assertion_count: 4
