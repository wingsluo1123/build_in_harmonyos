software: icoutils
display: "icoutils"
description: "Extract and convert Windows icon and cursor resources (ICO/CUR/ANI)"
category: dev
homepage: "https://www.nongnu.org/icoutil/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools build, 3 patches for HarmonyOS platform support"
    - "config.guess replaced (2012 version cannot detect HarmonyOS)"
    - "configure umask 077 fix for HMDFS mktemp compatibility"
    - "libpng/1.6.58 dependency from Conan repo"
  common_dependencies:
    - libpng

versions:
  "0.32.3":
    status: built
    build_date: "2026-08-06"
