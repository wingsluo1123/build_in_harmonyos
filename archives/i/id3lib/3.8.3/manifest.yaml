knowledge_gained:
  - "OHOS profile [buildenv] 的 SHELL/CONFIG_SHELL=hnp bash 会让 autoconf 2.13 configure 的自身重 exec 陷入坏 cwd（getcwd 失败）→ conftest 相对路径写坏（confdefs.h not found）→ \"C preprocessor fails sanity check\"；build() 以 CONFIG_SHELL=/bin/sh + 显式 CPP/CXXCPP 前缀运行 configure（E386 类；cdo 2.6.3/idutils 4.6/id3v2 0.1.12 先例）"
  - "E007: config.guess 不识别 HarmonyOS（uname -s=HarmonyOS）→ 追加 *:HarmonyOS:*:* 分支输出 aarch64-unknown-linux-ohos"
  - "E011: HMDFS 上 config.status 用 mktemp -d 且 umask 077 会 Permission denied → configure 内 umask 077→022（a52dec 先例）"
  - "id3lib 的 configure 对 iomanip.h 做致命 AC_CHECK_HEADERS；现代 libc++ 已无此头 → 移除该检查（代码仅用标准 <iomanip>）"
  - "libz 不可链接时 id3lib 回退编译内嵌 zlib；声明 zlib/1.3.1 后仍需从 self.dependencies 显式注入 -I/-L（AutotoolsToolchain 不注入依赖路径），否则 -lz 命中 SDK sysroot libz.so（审计 R26）；注入后 4 个 CLI NEEDED 无 libz.so"
  - "findeng.cpp/findstr.cpp 第 5 行为混合 CRLF：refresh-patch 文本模式 difflib 无法表达 CRLF 上下文，需 build() 先 sed 归一化再打补丁（mp3val/0.1.8 先例）"
  - "R38：库类型包若安装 bin_PROGRAMS（4 个 CLI），需软件级 commands.json + cpp_info.bindirs=[\"bin\"]，否则 L0k 静态检测盲区（审计判定）"

