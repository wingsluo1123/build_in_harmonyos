# test_package/MANIFEST.yml — id3lib 3.8.3
# CI L0e requires this file to exist.

package: id3lib/3.8.3
homepage: "https://sourceforge.net/projects/id3lib/"

# Upstream has NO formal test suite: examples/Makefile.am contains no TESTS=,
# `make check` only builds the 9 check_PROGRAMS (nothing is executed).
# The 9/9 build result and ad-hoc runs are recorded in
# ../reports/test-report.md.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.cpp
    description: "ID3v2 tag write -> re-read round-trip assertions (artist/title/album persistence across updates) plus HarmonyOS ELF checks (AArch64, ld-musl-aarch64 interpreter, no dangerous RPATH/RUNPATH)"
    command: "./test_id3lib"

# 7 API round-trip assertions + 3 HarmonyOS ELF assertions
assertion_count: 10
