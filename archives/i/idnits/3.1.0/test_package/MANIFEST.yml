package: idnits/3.1.0
homepage: "https://github.com/ietf-tools/idnits"

upstream_check_command: "npx vitest run"
upstream_test_in_build: false
upstream_test_command: "npx vitest run"

upstream_tests:
  - file: "tests/*.test.js"
    source: "idnits-3.1.0/tests/"
    description: "13 upstream Vitest test files / 590 tests; 587 passed on the Windows build host (zh-CN locale). 3 locale-dependent failures in tests/metadata.test.js (luxon month-name parsing under zh-CN ICU); not executed on device yet."
    command: "npx vitest run"

test_package_tests:
  - file: test_idnits.sh
    description: "Verifies launcher availability, semver version output, a real offline nit-check run on a bundled fixture, and the error path for a missing file"
    command: "/system/bin/sh test_idnits.sh"

assertion_count: 4
