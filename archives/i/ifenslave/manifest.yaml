software: ifenslave
display: "ifenslave"
description: "Configure network interfaces for parallel routing (bonding)"
category: net
homepage: "https://salsa.debian.org/debian/ifenslave"
license: GPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure shell hooks, no compilation; staged under bin/ for Conan redistribution"
    - "No external Conan dependencies; Debian runtime needs ifupdown and iproute2"
    - "Upstream ships zero automated tests; consumer test asserts hook contracts statically"
  common_dependencies: []

versions:
  "2.14":
    status: built
    build_date: "2026-10-15"
