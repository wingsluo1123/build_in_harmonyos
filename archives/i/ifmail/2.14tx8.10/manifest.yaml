# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  # 每条都带 ref:（check-knowledge-gap 用它判断"已引用"）
  - "gdbm 的 compat 层 <ndbm.h> 没有 include guard（实测 grep -c 'ifndef|pragma once' == 0）：同一 TU 二次包含即 typedef redefinition ('struct DBM' vs 'struct DBM') 硬错误，消费方必须把包含点收敛到项目头 —— 已沉淀草稿 (ref: DRAFT-ifmail-2.14tx8.10-gdbm-compat-ndbm-no-include-guard)"
  - "制品仓 gdbm/1.23 是 --enable-libgdbm-compat（含 ndbm.h/dbm.h/libgdbm_compat.a），gdbm/1.24 反而是 --disable-libgdbm-compat（连 ndbm.h 都没有）；conan list 看不出开关，必须下载配方/包体实测 (ref: DRAFT-ifmail-2.14tx8.10-gdbm-compat-ndbm-no-include-guard)"
  - "clang 15/17 的 <varargs.h> 是只含 #error 的桩头，K&R 的 va_dcl + 单参 va_start(ap) 会同时炸出三条硬错误；必须逐入口转 C99 stdarg，并同步 ANSI 原型/前置声明/包含顺序，CFLAGS 绕不过去 —— 已沉淀草稿 (ref: DRAFT-ifmail-2.14tx8.10-kr-varargs-clang-error-stub-stdarg)"
  - "musl 只提供 struct __res_state 类型（头文件自注 'unused; purely for broken apps'）而没有 _res 对象，也没有 libresolv 私有的 _getshort/_getlong —— 命中既有条目，按其口径处置 (ref: E516)"
  - "musl 无 BSD re_comp/re_exec（glibc 需 _REGEX_RE_COMP 才暴露），只有 POSIX regcomp/regexec；老代码的掩码匹配要包一层 (engine 查重未命中既有条目；本次只在 notes 记录，未单独申报草稿) (ref: notes.md#4-适配点逐条)"
  - "readconfig() 结束时会 freopen(debugfile, 'a', stderr)，配置之后的所有诊断都进调试文件；debugfile 未配置时落到编译期 DEBUGFILE —— 本包排障/测试取证的必备前提，属单包行为，不申报通用条目 (ref: notes.md#7-已知限制路径-a核心能力完整)"

