sources:
  url: "https://www.ex-parrot.com/pdw/iftop/download/iftop-1.0pre4.tar.gz"
  sha256: "f733eeea371a7577f8fe353d86dd88d16f5b2a2e702bd96f5ffb2c197d9b4f97"

patches:
  "1.0_pre4":
    - patch_file: patches/0001-config-config.guess.patch
      patch_description: "Recognize OHOS (linux-ohos) in config.guess; echo the triplet and exit"
    - patch_file: patches/0002-config-config.sub.patch
      patch_description: "Recognize linux-ohos in config.sub and keep it from being normalized to linux-gnu-ohos"
    - patch_file: patches/0003-config-pthread.c.patch
      patch_description: "Use flag+pthread_join when HAVE_PTHREAD_CANCEL is 0 (feature detection, no platform macro)"
    - patch_file: patches/0004-iftop.c.patch
      patch_description: "Join the capture thread cleanly when HAVE_PTHREAD_CANCEL is 0 (feature detection, no platform macro)"
    - patch_file: patches/0005-ui_common.c.patch
      patch_description: "Define UI globals in one translation unit"
    - patch_file: patches/0006-ui_common.h.patch
      patch_description: "Declare UI globals as extern"
