software: iftop
display: "iftop"
description: "Real-time bandwidth monitoring tool that displays network usage by host"
category: network
homepage: "https://pdw.ex-parrot.com/iftop/"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub patched for HarmonyOS platform detection (E007)"
    - "pthread_cancel replaced with flag+join for musl/OHOS compatibility"
    - "Global variables in ui_common.h changed to extern declarations"
    - "ncurses installed via cmd-pkgs (static library + bundled headers)"
    - "libpcap/1.10.6 from Conan artifact repo"
    - "config.status requires umask 077 removal for HMDFS compatibility"
  common_dependencies:
    - ncurses
    - libpcap

versions:
  "1.0_pre4-r0":
    status: published
    build_date: "2026-08-06"
