software: igmplot
version: "3.17"
status: built
build_date: "2026-09-29"

source:
  url: "http://igmplot.univ-reims.fr/download/IGMPlot-3.17.zip"
  sha256: "3fb76c80f60c84b3b2d15d32189b3eea1083937b641afbb47c251f576d9efd29"
  tar_format: zip

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-ohos-toolchain.patch"
  - "0002-ncisolver-include-sys-time.patch"

knowledge_gained:
  - "IGMPlot 的 Makefile 默认硬编码 g++，改为 ?= 后可由 Conan profile 注入 clang++"
  - "上游默认开启 OpenMP；OHOS 工具链未提供对应运行库时可以通过 OpenMP=NO 构建"
  - "上游保留 -Werror，在新 clang 上会把历史格式告警升级为错误，移植时只移除 Werror 而不修改算法代码"
  - "OHOS clang 不会间接提供 struct timeval，NCISolver 需要显式包含 sys/time.h"
  - "上游官方样例脚本会无条件返回 0，因此构建阶段必须自行校验 OK/KO 计数"
  - "上游 35 组官方样例耗时跨度极大（秒级到小时级，test11 单样例约 1 小时），CI 的 conan create 预算只能覆盖秒级档"

verification:
  upstream_test: "python3 source/scripts/IGMPLOT_test_samples.py source/IGMPLOT samples-ci（CI 档 20/20 组官方样例通过；其余 15 组为 88s~1h 级计算样例，逐条实测数据见 PR 说明）"
  test_package: "test_package/test.sh"
  result: "pending CI verification"
