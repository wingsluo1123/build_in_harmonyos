package: igraph/1.0.0
homepage: "https://igraph.org"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 中无上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 igraph 核心 API（igraph_small/igraph_vcount/igraph_ecount）"
    command: "./test_igraph"

# 测试断言总数
assertion_count: 3