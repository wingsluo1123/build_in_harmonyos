# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.1.2-23"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# 构建系统
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-23.tar.gz"

  # 源码校验和
  sha256: "f129f7d87fc21da453d032dd291b80ea13faf2497f13ef8279d97759ed7d5c46"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-shared"
    - "--with-jpeg"
    - "--with-png"
    - "--with-tiff"
    - "--with-freetype"
    - "--with-fontconfig"
    - "--with-openjp2"
    - "--with-webp"
    - "--with-xml"
    - "--with-fftw"
    - "--without-heic"
    - "--without-djvu"
    - "--without-raw"
    - "--disable-openmp"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libjpeg-turbo/3.2.0
    - libpng/1.6.58
    - libtiff/4.7.2
    - freetype/2.14.3
    - fontconfig/2.18.1.1
    - openjpeg/2.5.4
    - libwebp/1.6.0
    - libxml2/2.15.3.1
    - zstd/1.5.7
    - fftw/3.3.10

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0003-config-config.guess.patch"
  - "0004-config-config.sub.patch"
  - "0006-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS上config.status创建临时目录需将umask 077改为022，否则目录owner继承父目录uid导致当前用户无法写入"
  - "rm -rf conf* 会误删config/目录和configure文件，应避免使用glob模式清理"
  - "autotools项目需patch-autotools-ohos.pl添加__OHOS__/ohos-linux triplet检测"
  - "webp/xml/fftw依赖现已发布到制品仓，可启用（之前版本因无预编译包而禁用）"
  - "libheif(lcms2/djvulibre)依赖链未发布到制品仓，需后续适配"
  - "conan PkgConfigDeps生成器不自动为zlib/xz生成.pc文件，需手动创建zlib.pc和liblzma.pc"
  - "ImageMagick configure查找libopenjp2而非openjpeg，需创建libopenjp2.pc别名"
  - "libwebp包包含libwebpmux.so和libwebpdemux.so但无对应.pc文件，需手动创建"
  - "系统lld链接器依赖libxml2.so.16但系统lib路径只读，make check可能失败（非ImageMagick问题）"

