# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: imagemagick-full/7.1.2-23
homepage: "https://imagemagick.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/validate.c
    source: ImageMagick-7.1.2-23/tests/validate.c
    description: "ImageMagick validation suite - colorspace, compare, composite, convert, identify, montage, stream"
    command: "tests/validate"
  - file: tests/drawtest.c
    source: ImageMagick-7.1.2-23/tests/drawtest.c
    description: "Drawing test"
    command: "tests/drawtest"
  - file: tests/wandtest.c
    source: ImageMagick-7.1.2-23/tests/wandtest.c
    description: "MagickWand API test"
    command: "tests/wandtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "MagickWand API smoke test - creates a 1x1 red image using MagickWand API and verifies dimensions"
    command: "./test_imagemagick_full"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
