software: imagemagick
version: "7.1.2-24"
status: built
build_system: autotools
build_date: "2026-07-30"

source:
  url: "https://download.imagemagick.org/archive/releases/ImageMagick-7.1.2-24.tar.xz"
  sha256: "e44e70aa49e97ceb8b4f68e97829d0bde69b79387d69660b8886b1f6e06ddb19"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--disable-openmp"
    - "--disable-docs"
    - "--without-modules"
    - "--with-utilities"
    - "all optional delegates disabled"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-harmonyos.patch"
  - "0002-configure-tmpdir.patch"

knowledge_gained:
  - "Use Conan's AutotoolsToolchain for the target tuple instead of hard-coded --host and compiler paths"
  - "A delegate-free static build removes unpublished image codec dependencies while preserving built-in xc and txt coders"
