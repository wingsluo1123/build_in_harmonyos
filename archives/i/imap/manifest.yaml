# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: imap
display: "UW IMAP Toolkit"
description: "University of Washington IMAP toolkit with c-client library and IMAP/POP servers"
category: mail
homepage: "https://www.washington.edu/imap/"
license: "Apache-2.0"
build_system: makefile

ohos_adaptation:
  key_points:
    - "顶层 Makefile 三字母 OSTYPE，通用 Linux 口径选 slx（仅 shadow 口令，无 PAM 依赖）"
    - "SSLTYPE=none 关闭仅兼容 OpenSSL 0.9/1.0 的旧 SSL 代码，避免与 OpenSSL 3.x 不兼容"
    - "仅打包静态 c-client（c-client.a 重命名为 libc-client.a），头文件平铺到 include/"
  common_dependencies: []

versions:
  "2007f":
    status: built
    build_date: "2026-10-15"
