# 版本级 manifest — imaptool 0.9
# 文件位置: archives/i/imaptool/0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "0.9"
software: "imaptool"
status: built
build_date: "2026-10-19"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游原站 www.sspitzer.org 已不可达（2026-10-19 实测 curl rc=000），
  # 源码取 Debian 稳定源包的 orig tarball。该 tarball 的 md5
  # 8e716c8b8af4486f71b33c30a62de2ab 与 Debian 源包 imaptool_0.9-24.dsc
  # 声明的校验和一致（dsc 30897 字节），主版本 0.9 与任务 version 一致。
  url: "https://deb.debian.org/debian/pool/main/i/imaptool/imaptool_0.9.orig.tar.gz"
  sha256: "8c2726d1e10c7bda8d1b145bf503bd4394ab4a6b460e216d1cdd167339cfb1b5"
  md5: "8e716c8b8af4486f71b33c30a62de2ab"
  tar_format: tar.gz
  release_date: "2000-01-17"

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options: []
  build_command: >-
    make -j1 CC="<clang> -O2 -I<依赖 include 目录>" JPEG_INCLUDE="-I<依赖 include 目录>"
    LIBDIR="-L<依赖 lib 目录>"
  install_method: "package() 用 conan copy 安装 bin/imaptool、licenses/LICENCE.TXT、share/man/man1/imaptool.1（上游 Makefile 无 install 目标）；随后对 bin/imaptool 做 OHOS 自签"
  dependencies:
    - "libx11/1.8.13（force）"
    - "libxext/6.4.0.1"
    - "libxt/1.3.1"
    - "libxmu/1.3.1.1"
    - "libxaw/1.0.14"
    - "xorgproto/2025.1（头文件）"
    - "libjpeg/10（静态）"
    - "libxcb/1.17.0 + libxau/1.0.11 + libxdmcp/1.1.5（run=True 运行期闭包）"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游手写 Makefile 把 CC/JPEG_INCLUDE/LIBDIR 写死为 X11R6/usr-local 路径：在 make 命令行用同名变量覆盖即可（命令行为最高优先级，且 JPEG_CHOICE 内部的 $(JPEG_INCLUDE) 会展开为命令行值），无需改 Makefile 或打补丁"  # reference: archives/c/coolmail/1.3/conanfile.py
  - "imaptool.c 在 parseparams() 之前调用 XtVaAppInitialize()（imaptool.c:171→:178），因此 -h/-v 也依赖 display；无 X server 环境下唯一可运行路径是无 DISPLAY 时 Xt 的 Can't open display 诊断（非零退出）"  # reference: archives/i/imaptool/0.9/test_package/test_imaptool.py
  - "libxaw/1.0.14 制品在 lib/ 下以符号链接链发布 libXaw.so -> libXaw7.so -> libXaw7.so.7.0.0，实际文件权限为 -rwxrwx---；-lXaw 依赖链接器能解析该链，OHOS 运行期靠 LD_LIBRARY_PATH/LD_PRELOAD 注入依赖 libdir"
  - "Athena 应用的依赖图 libxaw/1.0.14+libxt/1.3.1+libxmu/1.3.1.1+libxext/6.4.0.1+libx11/1.8.13+xorgproto/2025.1 已在制品仓发布（与 xfontsel 1.1.2 同图），可整组复用"  # reference: archives/x/xfontsel/1.1.2/conanfile.py

# ============================================================
# 验证
# ============================================================

verification:
  conan_create:
    result: "见 notes.md 的实测命令与退出码"
  test_package:
    command: "conan create 自动执行：python3 test_imaptool.py <package_folder>/bin/imaptool <package_folder> <LD_PRELOAD>"
    result: "见 notes.md"
  upstream_tests:
    result: "N/A（上游无自动化测试：Makefile 无 check/test 目标，make -n check 报 No rule to make target 'check'；发行包 13 个文件无测试代码）"
    detail: "见 test_package/MANIFEST.yml 的 upstream_test_audit 小节"
