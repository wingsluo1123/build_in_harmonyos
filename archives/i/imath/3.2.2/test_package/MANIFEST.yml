# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file

package: imath/3.2.2
homepage: "https://github.com/AcademySoftwareFoundation/Imath"

# Upstream test command (Imath uses ctest, disabled in conan build)
upstream_check_command: "ctest -N"

# No upstream tests run in conan build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (not run in conan build)
upstream_tests: []

# test_package consumer tests
test_package_tests:
  - file: src/test.cpp
    description: "Consumer test: include ImathVec.h and create Vec3 to verify Imath library linkage"
    command: "./test_package"

# Approximate assertion count
assertion_count: 1
