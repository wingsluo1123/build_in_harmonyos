# 版本级 manifest（与 conandata.yml 交叉校验；不一致时以 conandata.yml 为准）

version: "5.0.1"
software: "imv"
status: published
build_date: "2026-10-18"
build_system: "meson"
conan_ref: "imv/5.0.1"

source:
  url: "https://git.sr.ht/~exec64/imv/archive/v5.0.1.tar.gz"
  sha256: "8949c1df4b933b1d324e02ce49f1834a4b73dd25fa8103579e0ed105149e080e"
  tar_format: tar.gz

# 构建期额外源码：wayland 1.24.0，仅用于静态编译 wayland-scanner
scanner_source:
  url: "https://gitlab.freedesktop.org/wayland/wayland/-/archive/1.24.0/wayland-1.24.0.tar.gz"
  sha256: "7800858844751fc7113d7df3678dc6b58b26a056176a65c49a059763045bffd5"

build:
  system: meson
  configure_options:
    - "-Dwindows=wayland"          # 上游无 x11 布尔选项；X11 路因 libxkbcommon 无 xkbcommon-x11.pc 不可行
    - "-Dunicode=icu"
    - "-Dtest=enabled"
    - "-Dman=disabled"
    - "-Dcontrib-commands=true"
    - "-Dlibjxl=disabled"          # ohpcd 未发布 libjxl/0.11.2（W0 实测 MISS）
    - "-Dqoi=disabled"             # OHOS sysroot 无 qoi.h（上游用 cc.has_header 探测系统头）
  dependencies:
    - pango/1.50.14.1.1
    - gl4es/1.1.6
    - egl/1.0.5
    - libxkbcommon/1.6.0
    - icu4c/77
    - inih/r58
    - wayland/1.24.0
    - wayland-protocols/1.36
    - libffi/3.4.4
    - pcre2/10.45
    - graphite2/1.3.14
    - xz/5.6.2
    - xorgproto/2025.1
    - libpng/1.6.58
    - libtiff/4.7.2
    - libjpeg-turbo/3.2.0
    - librsvg/2.62.3.1.1
    - libnsgif/1.0.0
    - libnsbmp/0.1.7
    - libheif/1.22.2
    - libwebp/1.6.0
    - cmocka/2.0.2
  overrides:
    - expat/2.8.2.1
    - libxml2/2.15.3.1
    - libxrender/0.9.12.1
  tool_requires:
    - meson/1.11.0
    - tinyxxd/1.3.16
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  count: 5
  static_entries: 6
  live_entries: 5
  registered_targets: 3
  executed: 5
  pass: 5
  fail: 0
  command: "meson test"
  evidence: "Ok: 3 / Fail: 0 -> test_list 1/1, test_navigator 1/1, test_backends 3/3"

consumer_tests:
  file: test_package/src/test_imv.sh
  assertions: 14
  pass: 14
  fail: 0
  skip: 0
  note: "行为面 3（真跑 bin/imv-msg 的 argv/AF_UNIX 行为）+ 结构面 9（bin/imv 可执行/.codesign/6 条 DT_NEEDED/bin/imv-dir）+ 旁证面 2（外部缺陷复现后重签副本再跑 imv -h）"

elf_signing:
  required: true
  reason: "鸿蒙只执行带有效 .codesign 的 ELF（E077）；meson 安装期就地改写 ELF（RUNPATH→占位符）使该段失效，故 package() 末尾用 binary-sign-tool sign -selfSign 1 重新签名"
  knowledge_ref: "E077"

gl_stack:
  desktop_gl: "gl4es/1.1.6（自建 gl.pc；ohpcd 无 opengl/4.6）"
  egl: "egl/1.0.5（自建 egl.pc；gl4es 不导出 EGL API）"
  runenv:
    LIBGL_GLES: "/system/lib64/libGLESv3.so"
    LIBGL_EGL: "/system/lib64/libEGL.so"

runtime_limitations:
  - "本机无 Wayland compositor：GUI（窗口/渲染/IPC）不可端到端验证"
  - "bin/imv 在无修复环境下不可直接运行：出厂 wayland 制品的 libwayland-cursor.so.0 的 .codesign 失效（dlopen ⇒ EACCES），wayland 1.24.0 与 1.22.0.1 两版实测均复现（外部缺陷，非本配方）"
  - "libheif.so 无 SONAME ⇒ 消费者 DT_NEEDED 记录绝对路径（外部制品问题）"

knowledge_gained:
  - "OHOS 无 POSIX 线程取消三层缺失（sysroot 头不声明 + 桩 libc.so 不导出 + 运行时导出但调用返回 ENOSYS(38) 空壳）⇒ cancel→join 路径按正式条目 E513（guarded-signal-thread-exit：SIGUSR1 handler + pthread_exit + pthread_kill + join）处置；本包差异=零上游补丁的配方侧注入 + pthread_exit(PTHREAD_CANCELED) 保留取消语义（B判定=create；ref: E513 + 本包草稿 DRAFT-imv-5.0.1-pthread-cancel-ohos-nonRT-signal-shim）"
  - "conan 2 对纯传递依赖标 Skipped binary => 其 .pc 不安装，而 pkg-config --cflags 会解析 Requires.private，必须把 pcre2/graphite2/xz/xorgproto 提升为直接 requires（ref: 手册/07 §12.3 共享下载缓存与依赖发布 + chayang/0.1.0 libffi 先例）"
  - "制品 .pc 的 prefix 可能是 'prefix = /'（= 两侧带空格）或把 libdir 展开成字面量 '-L//lib'；改写正则必须容忍空白并修复失效的 -L，否则表现为 'unable to find library -licuuc/-lfreetype'（ref: 手册/07 §12.2 + gegl/0.4.70 .pc 改写先例）"
  - "静态归档（librsvg-2.a）的 .pc 把闭包放在 Requires.private，pkg-config --libs 不展开 => 必须把该行提升为 Requires，否则链接期 undefined symbol（cairo_gobject_*/xmlParseDocument）（ref: critter/2.0.4 静态库传递依赖先例）"
  - "icu4c 制品只有静态 .a 且是 C++ 实现 => C 消费者必须在 icu-uc.pc 的 Libs 追加 -lc++（ref: cif-api/0.4.2）"
  - "meson 只为直接 pkg-config 依赖生成 -rpath，传递共享库需自行追加 -Wl,-rpath；不能改用 LD_LIBRARY_PATH（conan 的 libintl 代理会打挂 python3/meson）（ref: 手册/07 §12.2）"
  - "OHOS 的 /usr/bin/xxd 是 toybox applet（无 -n/-i）=> 用制品仓 tinyxxd/1.3.16 并经 meson machine file 的 [binaries] 注入（ref: 无既有条目，已落 经验文档/反馈/pending/）"
  - "gl4es 的 libGL.so 构造函数必须配合 LIBGL_GLES/LIBGL_EGL，否则加载期 SIGSEGV（ref: gl4es/1.1.6 test_package）"
  - "RT 信号在 OHOS 被静默吞掉（sigaction/pthread_kill 均 rc=0 而 handler got=0；SIGUSR1 got=1）⇒ 线程取消兼容层只能用非 RT 信号（推翻 12d §4 的 SIGRTMIN 路线；ref: E513 + 经验文档/反馈/pending/ 已另立档）"

knowledge_ref:
  - "E077"
  - "E513"
  - "DRAFT-imv-5.0.1-pthread-cancel-ohos-nonRT-signal-shim"
  - "E472"
  - "DRAFT-ohos-static-tool-bypass-dlopen-limit"
  - "E085"
