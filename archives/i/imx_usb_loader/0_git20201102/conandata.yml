sources:
  "0_git20201102":
    # 任务版本号 0_git20201102 是 Alpine aports（community/imx_loader/APKBUILD）的
    # pkgver；它钉死的上游 commit 是 30b43d69770cd69e84c045dc9dcabb1f3e9d975a
    # （upstream master 只有这一个分支、无 tag，该 commit 即 master 顶端，日期
    # 2020-05-17）。同一 commit 也被 Buildroot 与 Debian 的 orig tarball 独立印证：
    #   Alpine : pkgver=0_git20201102  _commit="30b43d69770c..."
    #   Buildroot: IMX_USB_LOADER_VERSION = 30b43d69770cd69e84c045dc9dcabb1f3e9d975a
    #   Debian : imx-usb-loader_0~git20200517.30b43d69.orig.tar.gz
    # 三者 sha256 对应的字节完全一致（本配方实测 4357907c96...，68279 字节，55 条目）。
    url: "https://github.com/boundarydevices/imx_usb_loader/archive/30b43d69770cd69e84c045dc9dcabb1f3e9d975a.tar.gz"
    sha256: "4357907c9669874d3ccbf00395bf0b1733c26e6daea85d721f1c0cd897f4162c"
