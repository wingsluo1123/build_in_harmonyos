knowledge_gained:
  - "incus-feature-oci 是 Alpine 源包 incus-feature（community/incus-feature APKBUILD）的 noarch 元包子包：oci() 函数 pkgdesc 'Install packages required to run OCI images under Incus'，depends skopeo，install -d，无自有二进制；上游源码 = github.com/lxc/incus tag v7.2.0（与 incus-feature-agent/client 同一 tarball，sha256 一致）"
  - "上游 incus 7.2.0 无独立 incus-oci 二进制（cmd/ 下仅 fuidshift/generate-config/generate-database/incus/incus-agent/incus-benchmark/incus-migrate/incus-simplestreams/incus-user/incusd/lxc-to-incus）；OCI 镜像处理内嵌于 incus 客户端，运行时 exec.LookPath(\"skopeo\")（client/oci_images.go），缺失时报 'OCI container handling requires \"skopeo\" be present on the system'"
  - "skopeo 未发布 ohpcd 制品仓（conan list 'skopeo/*' -r=ohpcd = 0，2026-10-15 实测），PF4 禁止声明未发布依赖 → 配方不声明 skopeo requires，由 bin/incus-oci 包装器在运行时执行上游同款契约检查"
  - "复用 archives/a/abuild-rootbld noarch 元包先例模式：requirements 声明已发布依赖 incus-feature-client/7.2.0（conan download 双实测含二进制），package() 安装 bin/incus-oci 薄包装（--version + 契约检查 + exec incus），无编译"
  - "test_package 4 用例：--version 执行 / skopeo 契约原始报错锁定 / incus 依赖契约 / skopeo 桩注入 PATH 后真实委托 incus --help（R34 实质依赖执行）"
  - "上游测试全仓口径实测（rule4 少报整改）：全仓静态清点 357 个顶层测试函数（评审实测口径 356，声明 N=357）；29 包可编译并真实执行 = 133 顶层 + 320 子测试全 PASS（0 FAIL 0 SKIP）；21 个服务端包因 CGO 依赖（sqlite3/liblxc/quota）不可编译，233 个用例属环境限制不可执行；证据 reports/upstream-test-run-v3.md + upstream-go-test-full-run.log；未修改上游任何测试代码"
