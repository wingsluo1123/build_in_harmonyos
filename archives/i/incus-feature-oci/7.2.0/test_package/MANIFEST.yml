test_package_tests:
  - file: conanfile.py
    description: |
      解析被测包与依赖包产物路径（wrapper / incus 二进制），以 conanrun
      环境调用 test_contract.sh 执行全部用例。
    command: "conan test"
  - file: test_contract.sh
    description: |
      4 用例：①incus-oci --version 真实执行被测包装器；②skopeo 缺失时按
      上游 client/oci_images.go 原始报错逐字退出（契约锁定）；③
      incus-feature-client 提供 incus 二进制的依赖契约；④skopeo 桩注入
      PATH 后验证真实委托 exec incus（输出非元包 banner 即委托成功，
      R34 实质依赖执行）。
    command: "sh test_contract.sh <wrapper> <incus_bin>"

assertion_count: 4
