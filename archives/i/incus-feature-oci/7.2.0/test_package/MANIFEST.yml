  passed: 453
  failed: 0
  notes: |
    全上游口径（评审 rule4 实测 N=356 少报整改）：上游全仓顶层测试函数静态清点
    357 个；可执行子集 = 133 个顶层用例 + 320 个子测试（共 453 项运行时执行）
