software: incus-feature-oci
display: "Incus OCI image support (meta-package)"
description: "Incus 运行 OCI 容器镜像所需的依赖契约元包（Alpine incus-feature 的 noarch 子包 oci()：依赖 skopeo 与 incus 客户端，无自有二进制）"
category: container
homepage: "https://github.com/lxc/incus"
license: Apache-2.0

build_system: custom

ohos_adaptation:
  key_points:
    - "noarch 元包：复用 abuild-rootbld 先例模式（薄包装 + 依赖契约），无编译"
    - "requirements 声明已发布的 incus-feature-client/7.2.0（OCI 能力消费者）"
    - "skopeo 未发布制品仓（PF4 禁止声明），契约检查在运行时由包装器执行（与上游 exec.LookPath 报错逐字一致）"
  common_dependencies:
    - incus-feature-client/7.2.0

versions:
  "7.2.0":
    status: built
    build_date: "2026-10-15"
