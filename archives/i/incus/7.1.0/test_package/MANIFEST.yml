# test_package/MANIFEST.yml
# Upstream test declaration for incus 7.1.0

package: incus/7.1.0
homepage: "https://github.com/lxc/incus"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests not integrated in build (Go test suite requires running incusd)
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test_version.sh
    source: incus-7.1.0/test/
    description: "Verify incus client binary reports correct version"
    command: "./test_version.sh"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_version.sh
    description: "Run incus version to verify the binary works"
    command: "incus version"

# Approximate assertion count
assertion_count: 1
