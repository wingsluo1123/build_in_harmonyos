notes: |
  indi-dsi 是 Meade DSI 系列相机的 INDI 驱动，纯 C++，USB/libusb 协议，
  无 GUI/媒体/内核依赖，源码树无 libnova 引用。

  适配要点：
  - CMake 构建，强制 CMAKE_SYSTEM_NAME=Linux（E092，CMake 不识别 HarmonyOS）。
  - 上游 cmake_minimum_required(VERSION 3.0) → 注入 cache 变量
    CMAKE_POLICY_VERSION_MINIMUM=3.5（CMake 4.x 移除 <3.5 兼容）。
  - 用驱动自带 FindINDI 模块：INDI_INCLUDE_DIR 指 include/libindi 子目录、
    库解析靠 INDI_ROOT（注入 INDI_LIBRARIES 会被模块覆盖）。
  - FindCFITSIO 双注入短路；静态 libcfitsio.a 引 zlib 符号 → libz.a 追加进
    CFITSIO_LIBRARIES 保链接序。
  - FindUSB1 预置 USB1_INCLUDE_DIR（include/libusb-1.0 子目录）+USB1_LIBRARY；
    源码带前缀引用 <libusb-1.0/libusb.h> → extra_cxxflags -I 注入包 include 根。
  - udev 规则/固件的绝对安装路径改写为包内 share/ 相对路径。
  - patches 0001-0003 修 libindi 2.x 迁移四雷（正则/cxx17/两处 BayerTP 回移）。
  - 产出为可执行程序 indi_dsi_ccd（R38：软件级 commands.json 声明）。

  test_package（R34/R51）：
  - 上游无测试套件（R51 声明，清点证据见 knowledge_gained 末条）。
  - Layer 1：vendor 编译包内 src/Util.cpp，自研探测 test_dsi.cpp 六组断言
    覆盖 tokenize_str 分隔符语义（默认混合/连续/前导/尾随/空/自定义）。
  - Layer 2：bin/indi_dsi_ccd 存在性硬断言（L1e 依赖锚点）+ --help
    best-effort（捕获返回码 warn；EPERM/126 属环境限制）。
