    reason: "快照 FindUSB1.cmake/CMakeLists 源码实测；WSL 彩排 configure Found USB1 + 11 个 .o 编译全过双重实证"
  - category: L1
    content: "快照 CMakeLists 以绝对路径安装 udev 规则（/lib/udev/rules.d）与 fx2 固件（/lib/firmware）——conan 打包会把绝对路径写到包外；配方注入包内相对路径 RULES_INSTALL_DIR=share/udev/rules.d + FIRMWARE_INSTALL_DIR=share/firmware（install(FILES DESTINATION 相对路径) 自动拼 prefix，不动上游源码）"
