# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS 用户分区（/storage）上的 .so 无法被 dlopen（musl 'Error loading shared library ... Permission denied'，E537/R49），系统分区 /data /system 不可写；任何动态链接版 test 二进制都无法在本机/CI 执行——静态链接（全部依赖 .a）是唯一可真实运行上游测试的路径（libindi/argp-standalone test_package 已验证同款模式）"
- "上游 indi-eqmod 的 eqmod.cpp 含全局 static std::unique_ptr<EQMod>（驱动入口文件），静态链接时会 pre-main 构造 EQMod → 与 INDI::Logger 等静态初始化顺序冲突（static-init-order fiasco）导致 SIGSEGV；测试链接必须排除 eqmod.cpp.o"
- "libindidriver.a 内含 indidrivermain.c.o（驱动 main 与 waitPingReply）；测试链接冲突可通过 llvm-objcopy --redefine-sym main=... 改名规避，waitPingReply 等符号保留"
- "libindi 上游 libs/alignment/CMakeLists.txt 对 AlignmentDriver 硬编码 add_library(SHARED)，libindi 包 INDI_BUILD_STATIC=ON 也只出 libindidriver.a；静态 GTest 需按 conandata libindi_src 下载 libindi 源码编译 11 个 alignment 源文件生成 libindiAlignmentDriver.a（头文件用 libindi 包 include/）"
- "INDI buildSkeleton 的 sk.xml 路径优先读环境变量 INDISKEL/INDIPREFIX（$INDIPREFIX/share/indi/*.xml）；静态测试运行时用 INDIPREFIX 指向 staging 目录即可，无需修改 libindi 包"
- "GSL 仅被 BuiltInMathPlugin（默认注册插件）引用；8 个上游测试用例只构造 EQMod 不执行数学变换，gsl_* 符号仅供链接期满足——提供签名对齐的 stub（assets/gsl_stub.c）即可，避免在 CI 额外构建 GSL 静态库"

