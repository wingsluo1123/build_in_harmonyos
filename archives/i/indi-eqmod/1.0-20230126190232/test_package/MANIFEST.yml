# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: indi-eqmod/1.0-20230126190232
homepage: "https://github.com/indilib/indi-eqmod"

# 上游测试命令 (ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "静态链接 test_eqmod 并真实运行（build() 内 gtest-static-staging/test_eqmod_static，8/8 PASS）"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_eqmod.cpp
    source: indi-eqmod-1.0-20230126190232/test/test_eqmod.cpp
    description: "EQMod 编码器换算单元测试（GTest，8 个 TEST 用例）；已通过 test_requires gtest/1.17.0.2 + generate() 注入 GTest/GMock 变量真实构建，并在 build() 中全静态链接后真实执行 8/8 PASS（hemisphere_symmetry/encoders_north|south/encoder_target_north|south/scope_limits_properties|empty|altaz；动态链接版受 OHOS dlopen 平台限制 E537/R49，静态链接为 libindi/argp-standalone 验证的合规执行路径）"
    command: "test_eqmod_static (staged $INDIPREFIX/share/indi)"

# test_package 中自带的测试 (消费者视角验证，rule12 鸿蒙特有测试)
test_package_tests:
  - file: test_eqmod_probe.py
    description: "消费者探针（参照已获认可的 indi-aok/indi-shelyak test_package 同款模式）：4 个驱动逐一 ELF64/AArch64(e_machine=183) 身份 + DT_NEEDED 链接闭包（libindidriver.so.2/libindiAlignmentDriver.so.2 裸 soname 且库存在于 libindi 包）+ share/indi/indi_eqmod.xml 设备/驱动名注册交叉校验 + 4 个 *-sk.xml 配套骨架。OHOS 加载器拒绝执行交叉产物（PROT_EXEC/mmap 受限，E537/R49），故探针用制品静态解析而非执行二进制；任一断言失败 raise AssertionError 非零退出。共 53 项断言（4×5 ELF + 4×3 链接 + 13 XML 注册 + 8 sk 骨架）"
    command: "bash -c 'python3 test_eqmod_probe.py <pkg> <libindi-libdir>'"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 53
