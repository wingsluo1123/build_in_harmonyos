# 软件级 manifest — indi-eqmod
# 文件位置: archives/i/indi-eqmod/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: indi-eqmod

# 显示名
display: "INDI EQMod 望远镜驱动"

# 一句话描述
description: "INDI 天文望远镜 EQMod/AZ GTi/Sky Adventurer GTi/Star Adventurer 驱动集合"

# 分类标签
category: utility

# 官网 URL
homepage: "https://github.com/indilib/indi-eqmod"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64（E092: CMake 不识别 HarmonyOS）"
    - "libindi 2.x Property API 迁移：operator-> / initProperties / processNumber / indi_timestamp()"
    - "CMakeCommon.cmake C++14→17（libindi 2.2.2.1 头文件需要 std::any）"
    - "WITH_AHP_GT=OFF（AHPGT 依赖未发布，可选组件）"
    - "链接 c++/c++abi（OHOS libc++）"
  common_dependencies:
    - libindi
    - libnova
    - zlib
    - gsl

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0-20230126190232":
    status: built
    build_date: 2026-10-01
    published_as: indi-eqmod
