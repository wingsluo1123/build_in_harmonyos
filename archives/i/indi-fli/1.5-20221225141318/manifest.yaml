# 版本级 manifest — indi-fli 1.5-20221225141318
version: "1.5-20221225141318"
software: "indi-fli"
status: built
build_date: "2026-10-15"
build_system: cmake

source:
  # 上游不为单个 3rdparty 驱动打 tag；Debian Astronomy Team 的 main pool orig 包是
  # indilib/indi-3rdparty indi-fli/ 子目录 1.5 版本（时间戳 2022-12-25 14:13:18）的
  # 权威可下载快照。2026-10-15 实测：HTTP 200，60838 字节，
  # 顶层目录 indi-fli-1.5+20221225141318/（16 个文件 + cmake_modules/ 共 66 个文件）。
  url: "https://deb.debian.org/debian/pool/main/i/indi-fli/indi-fli_1.5+20221225141318.orig.tar.gz"
  sha256: "b8956302d74e944dfdba95cae510df4d86d4aecaee3745617b10a48510c000e2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux (E092: CMake 无 HarmonyOS 平台映射)"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF (让树内 FindINDI/FindFLI/FindCFITSIO 生效)"
    - "INDI_ROOT=<libindi 包目录> (让树内 FindINDI.cmake 命中预构建包)"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (上游 cmake_minimum_required 3.0，CMake>=4.0 不兼容；patch 0003 同时把声明抬到 3.16)"
    - "CMAKE_CXX_STANDARD=17 (patch 0002；INDI 2.x defaultdevice.h 使用 std::any)"
  dependencies:
    - "libindi/2.2.2.1"
    - "libfli/2.0-20221221182632"
    - "cfitsio/4.6.4"
    - "zlib/1.3.1.1"
    - "libusb/1.0.27"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-FindINDI.cmake.patch (portability: 版本号正则兼容 INDI 2.x 的引号形式 INDI_VERSION \"2.2.2\"，与 indi-fishcamp/indi-gpsnmea/indi-beefocus 的 0001 byte-identical)"
  - "patches/0002-CMakeCommon-cxx17.patch (portability: 树内 CMakeCommon.cmake 的 CMAKE_CXX_STANDARD 14 -> 17，回移上游 master 同一处改动)"
  - "patches/0003-CMakeLists-ohos.patch (portability: cmake_minimum_required 3.0->3.16；静态 libfli.a 的 USB 后端补 find_library(usb-1.0) 并加入三个驱动的链接行；INDI_DATA_DIR 改指向本包 share/indi)"
  - "patches/0004-fli-indi2-api.patch (portability: fli_ccd/fli_cfw/fli_pdf 三个驱动由 INDI 1.x 属性 API 迁移到 INDI 2.x Property* API)"

upstream_tests:
  framework: none
  test_sources: 0
  test_command: ""
  run_in_build: false
  evidence: >-
    indi-fli 1.5 快照的 CMakeLists.txt 只有 add_executable + install，
    无 enable_testing()/add_test()；整棵 indi-3rdparty 仓亦无该驱动的测试用例
    ——上游确无测试，故 build() 不跑上游套件（如实披露，非"待 CI 测试"）
upstream_test_pass_rate: "N/A（上游无测试用例，如实披露）"
adapted_test_pass_rate: "test_package/check_driver.py **9 项校验：6 项通过 + 3 项平台 SKIP**（本地 conan create 实测，包创建成功）：①bin/indi_fli_{ccd,focus,wheel} 均为 AArch64 ELF64 可执行文件（211456/154112/150016 B）②share/indi/indi_fli.xml 与 bin/ 交叉引用一致（FLI CCD / FLI PDF / FLI CFW 三个设备各自指向真实存在的可执行文件）③三个驱动的 DT_NEEDED 闭包完整（libindidriver.so.2 + libindiAlignmentDriver.so.2 + libusb-1.0.so.0，且都在对应依赖包内）④conanrun 下逐个启动驱动：**真实闭包/符号缺陷一律 FAIL**，仅**有证据**的宿主拒绝（Errno 1 Operation not permitted，OHOS 未签名 ELF 的平台限制）记 SKIP —— `checks=9 fails=0 skips=3 RESULT: PASS`"

knowledge_gained:
  - "INDI 3rdparty 驱动的 2022 快照在 INDI 2.x 下的通用移植套路（本包与 indi-fishcamp/indi-gpsnmea/indi-beefocus/indi-gphoto 共用）：① 基类属性在 2.x 由 C 结构体变成 INDI::Property* 对象，TemperatureN/FilterSlotN/FocusAbsPosN 等数组成员要换成 *NP 属性的 [i].setMin/setMax/setValue 与 getMin/getMax/getValue；② .s 状态读写换 setState()/getState()；③ IUUpdateMinMax(&P) 换 P.updateMinMax()、IDSetNumber(&P,...) 换 P.apply(...)；④ 基类属性在 updateProperties() 里 defineProperty(P)/deleteProperty(P)（不再取地址、不再读 .name）"
  - "驱动链接的是静态 libfli.a 时，必须把 libusb-1.0 显式加到链接行：归档库里的 USB 后端会引用 libusb 符号，而 2022 快照的 CMakeLists 没有 FindUSB1 wiring —— 用 find_library(usb-1.0) + 链接行即可，制品上体现为 DT_NEEDED 里出现 libusb-1.0.so.0（消费者测试里已把这一点做成断言）"
  - "树内 FindINDI.cmake 的 find_path(INDI_DATA_DIR ...) 会把数据目录定成 libindi 包的绝对路径，导致 install(FILES <xml> DESTINATION ${INDI_DATA_DIR}) 写进依赖包；必须在 CMakeLists 里把它改成本包的相对 share/indi（R49）"
