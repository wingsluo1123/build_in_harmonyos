# 软件级 manifest — indi-fli
# 遵循 ARCHIVE-SPEC v3.0

software: indi-fli
display: "INDI FLI driver set"
description: "INDI 驱动集合：Finger Lakes Instrument (FLI) 的 CCD 相机（indi_fli_ccd）、PDF 调焦器（indi_fli_focus）、CFW 滤光轮（indi_fli_wheel）"
category: application
homepage: "https://github.com/indilib/indi-3rdparty"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "源码采用 Debian main pool 的 indi-fli orig tarball（indi-3rdparty 子目录快照），URL 中的 '+' 必须写字面量（%2B 会触发 CI pre-download 的路径不一致）"
    - "INDI 2.x 属性 API 迁移（补丁 0004）：基类 *N 成员 -> *NP 的 setValue/getValue/updateMinMax/apply/setState/getState，基类属性 defineProperty(P)/deleteProperty(P)"
    - "树内 FindINDI.cmake 版本正则回移（补丁 0001）+ CMakeCommon C++14->17（补丁 0002）"
    - "静态 libfli.a 的 libusb-1.0 链接显式化 + INDI_DATA_DIR 归本包 + CMake 4 兼容（补丁 0003）"
    - "package_info 暴露 bin/share 并声明 LD_LIBRARY_PATH（libindi 静态优先发布，需显式注入其 lib 目录）"
    - "上游无测试（CMakeLists 无 enable_testing/add_test）；消费者验证由 test_package/check_driver.py 的 9 项校验承担"
  common_dependencies:
    - "libindi/2.2.2.1"
    - "libfli/2.0-20221221182632"
    - "cfitsio/4.6.4"
    - "zlib/1.3.1.1"
    - "libusb/1.0.27"

versions:
  "1.5-20221225141318":
    status: built
    build_date: "2026-10-15"
    conan_ref: "indi-fli/1.5-20221225141318"
