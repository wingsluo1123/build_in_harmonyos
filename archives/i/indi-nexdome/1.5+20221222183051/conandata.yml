# conandata.yml — indi-nexdome 1.5+20221222183051
#
# indi-nexdome is the NexDome personal-observatory dome driver shipped as a
# subproject of the INDI 3rdparty monorepo (github.com/indilib/indi-3rdparty).
# The version 1.5+20221222183051 is the Debian source version of that snapshot,
# whose pristine upstream tarball (deb.debian.org .../indi-nexdome/*.orig.tar.gz)
# is byte-for-byte the indi-3rdparty "indi-nexdome/" tree (verified against the
# official v1.9.9 GitHub tag, on which this Debian upload is based) together
# with the shared "cmake_modules/" helpers. We consume that pristine upstream
# tarball directly (same pattern as libapogee3/3.2+20221221183454 in this repo).

sources:
  url: "https://deb.debian.org/debian/pool/main/i/indi-nexdome/indi-nexdome_1.5+20221222183051.orig.tar.gz"
  sha256: "85bf08929fb031a4ed58439b95c85b24ac2fe159973b9bc59ca9207208d78e37"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Raise cmake_minimum_required from 3.0 to 3.16 (CMake 4.x removed compatibility with < 3.5)"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake_modules-CMakeCommon.cmake.patch"
    patch_description: "Build as C++17 (current libindi headers use std::any; the bundled CMakeCommon.cmake pinned C++14)"
    patch_type: "portability"
  - patch_file: "patches/0003-cmake_modules-FindINDI.cmake.patch"
    patch_description: "Accept the quoted INDI_VERSION string emitted by current libindi headers (indiversion.h) in the bundled FindINDI.cmake version probe"
    patch_type: "portability"
  - patch_file: "patches/0004-nex_dome.cpp.patch"
    patch_description: "Port the Dome properties (DomeParamNP/DomeAbsPosNP/DomeShutterSP/ShutterParkPolicySP) from the removed INDI 1.x array names to the INDI 2.x INDI::Property API (isNameMatch/update/setState/apply/getValue), matching upstream's own migration"
    patch_type: "portability"
