knowledge_gained:
  - "INDI 3rdparty 驱动从 INDI 1.x 的数组式属性 API 迁移到 INDI 2.x 的 INDI::Property 对象 API：DomeParamNP/DomeAbsPosNP/DomeShutterSP/ShutterParkPolicySP 的 old 名称（DomeParamN/DomeAbsPosN/DomeShutterS/ShutterParkPolicyS）在 libindi 2.x 已被移除"
  - "libindi 2.x 头文件使用 std::any，驱动必须按 C++17 编译（旧的 CMakeCommon.cmake 固定 C++14 会编译失败）"
  - "老式 FindINDI.cmake 的版本探针只认无引号的 INDI_VERSION x.y.z，读不懂当前 libindi 带引号的 #define INDI_VERSION \"x.y.z\""
  - "OHOS 上 libindi 的共享对象（libindidriver.so.2 / libindiAlignmentDriver.so.2）无法被加载，消费者必须静态链接 INDI 归档"
  - "静态链接 INDI 时驱动目标必须排在 INDI 静态库之后：链接器按链接顺序生成 .init_array，驱动全局设备对象若先于 INDI 自身的静态初始化运行会段错误（命令行 --whole-archive 后置驱动归档可修复）"
  - "CMake install 步骤改写 RPATH 会使 OHOS 的 ELF .codesign 失效，执行时报误导性的 Operation not permitted，需同时设置 CMAKE_SKIP_BUILD_RPATH/CMAKE_SKIP_INSTALL_RPATH"

