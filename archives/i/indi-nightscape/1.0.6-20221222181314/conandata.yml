patches:
  - patch_file: "patches/0001-CMakeLists-OHOS-install-cmake.patch"
    patch_description: "CMakeLists: INDI_DATA_DIR 找不到时回退 share/indi；udev rules 安装加 NIGHTSCAPE_INSTALL_UDEV_RULES 开关默认 OFF (OHOS /lib/udev 不可写)"
    patch_type: "portability"
  - patch_file: "patches/0002-nightscape-INDI2-API-migration.patch"
    patch_description: "nightscape.cpp: 迁移到 libindi 2.2.x 新 Property API (TemperatureN->TemperatureNP, BayerT->BayerTP, .s->getState(), IDSetNumber->apply/save, currentCCDTemperature->setValue/getValue)；OHOS musl 无 secure_getenv 统一用 getenv"
    patch_type: "portability"
  - patch_file: "patches/0003-FindINDI-version-regex.patch"
    patch_description: "FindINDI.cmake: 版本正则兼容带引号的 INDI_VERSION \"x.y.z\" (libindi 头文件格式)"
    patch_type: "portability"
  - patch_file: "patches/0004-FindFTDI1-include-dirs.patch"
    patch_description: "FindFTDI1.cmake: 定义 FTDI1_INCLUDE_DIRS 并指向 ftdi.h 父目录 (CMakeLists 引用复数变量，且源码 include <libftdi1/ftdi.h>)"
    patch_type: "portability"
  - patch_file: "patches/0005-CMakeCommon-cxx17.patch"
    patch_description: "CMakeCommon.cmake: C++ 标准 14->17 (libindi 2.x 头文件使用 std::any 等 C++17 特性)"
    patch_type: "portability"
