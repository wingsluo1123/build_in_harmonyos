  - "patches/0005-CMakeCommon-cxx17.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "indi-3rdparty 自带 FindINDI.cmake 版本正则无法匹配带引号的 #define INDI_VERSION \"x.y.z\"，需放宽正则"
  - "libindi 2.x 头文件要求 C++17 (std::any)，CMakeCommon.cmake 需从 14 提升到 17"
  - "2022 年的驱动源码使用旧 INDI Property API，需按上游 master 迁移到 PropertyNumber/PropertyText 类 API"
  - "Conan CMakeToolchain 默认 PREFER_CONFIG=ON 会 shadow 自带 Find*.cmake 旧式变量，需强制 OFF"
  - "OHOS musl libc 无 secure_getenv，统一用 getenv"
  - "FindFTDI1.cmake 未定义 FTDI1_INCLUDE_DIRS 且路径层级不匹配，需派生父目录"
