# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# R51 申报 (indi-nightscape 1.0.6-20221222181314 上游测试, 2026-10-01 实测):
#   - 上游测试工具: nstest (nstest-main.cpp + nschannel-*.cpp, 编译为独立
#     可执行文件 nstest)，用于在真机上驱动 Nightscape 8300 相机做曝光、
#     降温、风扇控制等硬件测试。无 hardware 时走到 libusb_init()/FTDI 扫描
#     即失败退出 (输出 "unable to init ftdi scan device: -3")。
#   - tests/ 目录数: 0 (本驱动无独立 tests/ 目录)
#   - CTest 注册数: 0 (CMakeLists.txt 无 enable_testing/add_test)
#   - 实测结论: 构建期 nstest 编译成功；运行期在 CI/本机无硬件条件下
#     验证到 FTDI/libusb init (依赖链加载成功)，完整硬件测试需真机。

package: indi-nightscape/1.0.6-20221222181314
homepage: "https://www.indilib.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "nstest (真机硬件测试工具); 无 ctest 注册"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: nstest-main.cpp
    source: "indi-3rdparty-bd010b89b00bf63f396075835a0c5ef95986b3c2/indi-nightscape/nstest-main.cpp"
    description: "nstest: Nightscape 8300 真机测试工具 (libftdi/libusb FTDI 通道, 曝光/降温/风扇控制)"
    command: "nstest [-c camera] [-f fanspeed] [-n num exp] [-t temp] [-e exposure] [-b binning]"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：执行安装的 nstest 二进制，验证 libftdi/libusb 依赖链运行时加载 (无硬件时预期 'unable to init ftdi scan device' 输出)；并检查驱动产物完整性"
    command: "test.sh <pkg>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2