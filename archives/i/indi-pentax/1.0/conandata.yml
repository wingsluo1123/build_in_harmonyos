patches:
  - patch_file: "patches/0001-indi-pentax-CMakeLists.txt.patch"
    patch_description: "Use published dependency targets and relocatable signed aarch64 applications"
    patch_type: "portability"
  - patch_file: "patches/0002-indi-pentax-capture_helpers.c.patch"
    patch_description: "Preserve real MSC capture helpers against the published pslr API"
    patch_type: "portability"
  - patch_file: "patches/0003-indi-pentax-capture_helpers.h.patch"
    patch_description: "Declare driver-side capture helpers"
    patch_type: "portability"
  - patch_file: "patches/0004-indi-pentax-cmake-Platform-HarmonyOS.cmake.patch"
    patch_description: "0004-indi-pentax-cmake-Platform-HarmonyOS.cmake"
    patch_type: "portability"
  - patch_file: "patches/0005-indi-pentax-gphoto_readimage.cpp.patch"
    patch_description: "Share offline decoding, preserve pixels, return JPEG errors and validate RAW layout"
    patch_type: "portability"
  - patch_file: "patches/0006-indi-pentax-image_convert.cpp.patch"
    patch_description: "Add public offline JPEG/RAW to FITS conversion entry"
    patch_type: "portability"
  - patch_file: "patches/0007-indi-pentax-indi_pentax.cpp.patch"
    patch_description: "Retain 1.0 discovery callbacks with modern static INDI and single cleanup registration"
    patch_type: "portability"
