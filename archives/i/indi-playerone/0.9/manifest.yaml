version: "0.9"
software: "indi-playerone"
status: built
build_date: "2026-10-15"
build_system: "cmake"

source:
  # 上游未为 indi-playerone 单独打 tag；Debian Astronomy Team 的 contrib pool
  # orig 包是 indilib/indi-3rdparty indi-playerone/ 子目录 0.9 版本的权威
  # 可下载快照（版本 0.9+20230105184731，时间戳 = git 提交时刻 2023-01-05
  # 18:47:31）。2026-10-15 已验证 HTTP 200，63735 字节，顶层目录
  # indi-playerone-0.9+20230105184731，tarball 带 COPYING.LGPL。
  # conan 版本号取基版本 0.9（'+' 后为快照时间戳，与 indi-gpsnmea/
  # indi-fishcamp 的归一化口径一致）。
  url: "https://deb.debian.org/debian/pool/contrib/i/indi-playerone/indi-playerone_0.9+20230105184731.orig.tar.gz"
  sha256: "3f592574077cb79b95e2ac52de9fb557cddc3a50d471b3c34c58f1fe78a220c0"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux (E092: CMake 无 HarmonyOS 平台映射)"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF (让树内 FindINDI/FindPLAYERONE/FindCFITSIO/FindUSB1 生效)"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (上游 cmake_minimum_required 3.0，CMake>=4.0 不兼容)"
    - "CMAKE_CXX_STANDARD=17 (patch 0002，INDI 2.x defaultdevice.h 用 std::any)"
    - "INDI_DATA_DIR=${CMAKE_INSTALL_PREFIX}/share/indi (patch 0002，设备 xml 装进本包)"
  dependencies:
    - "libindi/2.2.2.1"
    - "libplayerone/3.1.0"
    - "cfitsio/4.6.4"
    - "zlib/1.3.1.1"
    - "libusb/1.0.27"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-FindINDI.cmake.patch (portability: 版本号正则兼容 INDI 2.x 引号形式，与 indi-gpsnmea/indi-fishcamp 0001 byte-identical)"
  - "patches/0002-CMakeLists-ohos-port.patch (portability: C++17 + INDI_DATA_DIR 指向本包 share/indi)"

test:
  # 上游 tarball 无任何自动化测试套件：无 tests/ 目录、无 CTest 注册、无
  # Makefile test 目标（playerone_camera_test 是需物理相机的厂商 SDK 探测
  # 工具，面向终端用户，不是自动化测试）。
  upstream_test_in_build: false
  upstream_test_command: "none (upstream ships no test suite)"
  upstream_test_count: 0
  upstream_pass: 0
  package_test: "5 个消费者用例(HC-1 包内驱动 ELF 有效性/HC-2 INDI 框架+厂商 SDK 链接与驱动逻辑字符串/HC-3 厂商 POA SDK 真实下游编译+链接(R34)/HC-4 设备描述 XML/HC-5 鸿蒙特有 aarch64+musl loader)"
  assertions: 26
  pass_rate: 1.0
  result: "conan create (test_package) 真实执行: == 4 cases, 0 failed == / == 26 checks, 0 failures == / RESULT: PASSED"
