# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 强制要求存在）
#
# 上游测试清点（R51）：indi-sbig 2.1 快照的 CMakeLists.txt 只有 add_executable +
# install，无 enable_testing()/add_test()；整棵 indi-3rdparty 仓亦无该驱动用例
# → 上游确无测试（upstream_tests 为空列表，非占位符）

package: indi-sbig/2.1
homepage: "https://github.com/indilib/indi-3rdparty"

# 上游测试命令：该驱动子项目未提供 check/test 目标
upstream_check_command: ""

# conanfile.py build() 中是否已集成上游测试（上游确无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点结论：无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，鸿蒙独有）
test_package_tests:
  - file: check_driver.py
    description: "消费者校验 4 项：①bin/indi_sbig_ccd 为 AArch64 ELF64 可执行文件；②DT_NEEDED 闭包完整（libindidriver/libindiAlignmentDriver 齐备、libusb-1.0 已记录、均为裸 soname 且能在依赖包内找到）；③share/indi/indi_sbig.xml 声明 'SBIG CCD' 与 'SBIG ST-I' 两个设备并指向真实存在的可执行文件；④conanrun 下启动驱动——真实闭包/符号缺陷一律 FAIL，仅有证据的宿主拒绝记 SKIP"
    command: "python3 check_driver.py <pkg>/bin <pkg>/share/indi/indi_sbig.xml <libindi-pkg>/lib <libusb-pkg>/lib"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 4
