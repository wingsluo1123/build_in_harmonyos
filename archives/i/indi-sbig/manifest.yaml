# 软件级 manifest — indi-sbig
# 遵循 ARCHIVE-SPEC v3.0

software: indi-sbig
display: "INDI SBIG CCD driver"
description: "INDI 驱动：SBIG / Diffraction Limited CCD 相机（可执行 indi_sbig_ccd，INDI::CCD 派生；含滤光轮 CFW 与自适应光学 AO 支持）"
category: application
homepage: "https://github.com/indilib/indi-3rdparty"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "源码采用 Debian contrib pool 的 indi-sbig orig tarball；URL 中的 '+' 必须写字面量"
    - "INDI 2.x 迁移（补丁 0004）：TemperatureNP/FilterSlotNP 访问器、apply/setState/updateMinMax、BayerTP.setText、FilterNameTP.count()/getName()"
    - "libusb 头路径注入 include 根（sbig_ccd.h 用 <libusb-1.0/libusb.h>）"
    - "INDI_DATA_DIR 归本包 share/indi（补丁 0003，R49）"
    - "上游无测试（CMakeLists 无 enable_testing/add_test）；消费者验证由 test_package/check_driver.py 的 4 项校验承担"
  common_dependencies:
    - "libindi/2.2.2.1"
    - "libsbig/4.9.9"
    - "cfitsio/4.6.4"
    - "zlib/1.3.1.1"
    - "libusb/1.0.27"

versions:
  "2.1":
    status: built
    build_date: "2026-10-15"
    conan_ref: "indi-sbig/2.1"
