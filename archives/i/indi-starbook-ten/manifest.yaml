# 软件级 manifest — indi-starbook-ten
# 遵循 ARCHIVE-SPEC v3.0

software: indi-starbook-ten
display: "INDI StarBook Ten Driver"
description: "INDI 天文框架的 Vixen StarBook Ten 望远镜 mount 驱动（C++ 可执行程序，依赖 libindi/libnova）"
category: library
homepage: "https://github.com/indilib/indi-3rdparty"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "E092：CMake 不识别 HarmonyOS → 强制 CMAKE_SYSTEM_NAME=Linux（同 libindi 配方）"
    - "上游 cmake_minimum_required(VERSION 3.0) → 注入 cache 变量 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "OHOS libc++：C++ 驱动目标需链接 c++/c++abi（见 package_info system_libs）"
    - "libindi 未安装 INDIConfig.cmake → 用驱动自带 FindINDI.cmake/FindNova.cmake，配方注入 INDI_INCLUDE_DIR/INDI_LIBRARIES/NOVA_*"
    - "产出为可执行驱动（非库）→ test_package 用 vendor 的 starbook_ten.cpp + localhost mock mount 做真实 API 测试（R34）"
  common_dependencies:
    - libindi
    - libnova

versions:
  "0.1":
    status: built
    build_date: "2026-10-01"
    conan_ref: "indi-starbook-ten/0.1"
    note: "INDI StarBook Ten mount 驱动（CMake，依赖全已在制品仓）"
