notes: |
  indi-starbook 是 Vixen StarBook 赤道仪（Ten 代以前）的 INDI 驱动，
  纯 C++，HTTP/curl 协议，无 GUI/媒体/内核依赖。

  适配要点：
  - CMake 构建，强制 CMAKE_SYSTEM_NAME=Linux（E092，CMake 不识别 HarmonyOS）。
  - 上游 cmake_minimum_required(VERSION 3.0) → 注入 cache 变量
    CMAKE_POLICY_VERSION_MINIMUM=3.5（CMake 4.x 移除 <3.5 兼容）。
  - 用驱动自带 FindINDI 模块：INDI_INCLUDE_DIR 指 include/libindi 子目录、
    库解析靠 INDI_ROOT（注入 INDI_LIBRARIES 会被模块覆盖）。
  - FindNova 双注入短路：NOVA_INCLUDE_DIR=<nova>/include + NOVA_LIBRARIES=<nova>/lib/libnova.a。
  - FindCURL 零注入：conan 工具链前缀路径已含 curl 包根，内建 FindCURL
    模块直接命中（主包不跑 CMakeDeps）；conanfile 零注入、零引号字面量
    （CI L0o clean）。
  - patches 0001-0004 修 libindi 2.x 迁移四雷（正则/cxx17/master 两处 Property 回移）
    + 0004 修上游死测试（CommandResponse ltrim，官方测试 2/2 真实通过）。
  - 产出为可执行程序 indi_starbook_telescope（R38：软件级 commands.json 声明）。

  test_package（R34）：
  - Layer 1：编译 test_package/ 内置 vendored test_starbook.cpp（上游官方
    GTest 单测）+ starbook_types.cpp（0004 后版本；CI L0c 要求测试源在
    test_package/ 树内），CMakeDeps 链 libnova::libnova+GTest::gtest；
    断言 cmd_res 解析（"OK"/"ERROR"/空白变体）与 DateTime 格式化
    （"2018+10+05+12+30+04"）。上游有测试（INDI_BUILD_UNITTESTS 分支），
    不适用 R51 无测试声明。
  - Layer 2：bin/indi_starbook_telescope 存在性硬断言（L1e 依赖锚点）
    + --help best-effort（捕获返回码 warn；EPERM/126 属环境限制）。
