# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51，证据见 notes.md「上游测试清点」一节）：
#   indi-sx 1.16 快照的 CMakeLists.txt 只有 add_executable + install，
#   无 enable_testing()/add_test()；树内 sxccdtest.cpp 是**交互式 USB 诊断工具**
#   （目标是 sx_ccd_test，随包安装），不是自动化测试；整棵 indi-3rdparty 仓亦无该驱动用例
#   → 上游确无测试（故 upstream_tests 为空列表，非占位符）

package: indi-sx/1.16-20221222162728
homepage: "https://github.com/indilib/indi-3rdparty"

# 上游测试命令：该驱动子项目未提供 check/test 目标
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试（上游确无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点结论：无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，鸿蒙独有）
test_package_tests:
  - file: check_driver.py
    description: "消费者校验：①bin/indi_sx_{ccd,wheel,ao} 均为 AArch64 ELF64 可执行文件；②share/indi/indi_sx.xml 声明 SX CCD / SX Wheel / SX AO 三个设备且各自指向 bin/ 内真实存在的可执行文件；③三个驱动的 DT_NEEDED 静态审计（libindidriver/libindiAlignmentDriver 齐备、libusb-1.0 已被记录、全部为裸 soname、且都能在对应依赖包内找到）；④conanrun 下逐个启动驱动——**真实闭包/符号缺陷一律 FAIL**，仅**有证据**的宿主拒绝记 SKIP"
    command: "python3 check_driver.py <pkg>/bin <pkg>/share/indi/indi_sx.xml <libindi-pkg>/lib <libusb-pkg>/lib"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 9
