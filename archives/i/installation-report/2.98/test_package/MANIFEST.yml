# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51）：
#   包内**无** Makefile、无 t/、无 debian/tests；debian/rules 全文仅 `%: dh $@`
#   → 上游确无测试（故 upstream_tests 为空列表，非占位符），上游通过率记 N/A；
#     build() 仅做 sh -n 语法检查（5 个脚本）作为构建期证据。

package: installation-report/2.98
homepage: "https://salsa.debian.org/installer-team/installation-report"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_scripts.sh
    description: "消费者校验 5 项：①5 个脚本（bin/report-hw、bin/httpd、bin/usb-list、lib/pre-pkgsel.d/50save-logs、lib/finish-install.d/94save-logs）齐备、非空、可执行 ②shebang 均为 /bin/sh ③sh -n 语法检查全过 ④数据产物齐备（share/installation-report 与 share/save-logs 的 install-report.template、share/bug/×3、share/man/man1/report-hw.1、share/doc/README.Debian，以及 debian/*.links 声明的软链可解析）⑤best-effort 真跑 usb-list 与 report-hw——**仅具名环境信号可 SKIP**（超时/无执行权限/权限拒绝），其余失败判缺陷；httpd 默认绑特权端口 :80 按设计不跑（记 SKIP 并说明）"
    command: "sh test_scripts.sh <package-folder>"

assertion_count: 5
