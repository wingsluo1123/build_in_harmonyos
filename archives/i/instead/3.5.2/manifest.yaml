# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.5.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.5.2"

# 软件名
software: "instead"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-22"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/instead-hub/instead/archive/refs/tags/3.5.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.4.7
    - sdl/2.30.9
    - sdl_image/2.8.8
    - sdl_ttf/2.24.0
    - sdl_mixer/2.8.1
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  # INSTEAD 上游 CMakeLists 自带的 option() + FIND_PACKAGE 组合经由
  # CMake 工具链变量驱动（WITH_LUAJIT=OFF / WITH_ICONV=OFF /
  # WITH_GTK2/3=OFF / WITH_HARFBUZZ=OFF / SYSTEMWIDE=OFF / STANDALONE=OFF），
  # 无源码 patch。等 CI conan-verify 后追加。
  [] # empty in W0 stage

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "INSTEAD 使用 bundled minizip（src/unzip.c + iowin32.c），不需要 libzip/conan zip 配方"
  - "CMakeLists.txt 硬依赖 SDL2_mixer；audio 关闭会需要 fork src/sound.c，**不要**关闭 WITH_MIXER 一类的开关——上游没有这个 option，本适配保留 SDL2_mixer 作为最小可移植面"
  - "src/CMakeLists.txt 用 SET(INSTEAD_SRCS ...) + UNIX 分支加 unix.c，**不**加 iowin32.c，所以 Windows-only stub 在 Unix 下不会编译"
  - "Lua 5.1/5.4 ABI 差异：INSTEAD 通过 FindLua51.cmake 接受 LUA_VERSION_MAJOR=5；conan lua/5.4.7 导出的 LUA_VERSION_MAJOR=5 兼容"
  - "setlocale(LC_ALL, \"\") 在 OHOS 上返回 NULL（合法行为），不强退，硬要硬退则改为 LC_ALL=\"C\" 守护"
  - "产物类型：application，cpp_info.libs=[]，bindirs=[bin]，下游用 include/instead/instead.h 链接引擎源"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
