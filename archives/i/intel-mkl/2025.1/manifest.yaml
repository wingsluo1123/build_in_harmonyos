# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "intel-mkl（oneMKL）是 Intel 闭源商业数学库，许可证为 Intel Simplified Software License，Intel 从不发布源码"
  - "Intel 仅发布 x86_64 (Intel 64) 与 Intel GPU 的预编译二进制；无 ARM/aarch64 版本，无 HarmonyOS/OHOS 版本"
  - "init-build 实测：intel-mkl 2025.1 用 Intel 官方产品页 URL 下载失败（HTTP 403 Forbidden），上游不存在可下载源码包——该失败本身即关键证据"
  - "ohpcd 制品仓查询：conan list '*mkl*' / 'intel*' 均为 0 条；conan list 'intel-mkl/2025.1' 报 Recipe not found"
  - "conan-center-index（社区最大 recipe 集，1000 目录）中无 intel-mkl recipe，仅有 intel-ipsec-mb / intel-neon2sse / clblast——全球开源打包体系中不存在 intel-mkl 源码包"
  - "即使获得 x86_64 二进制也无法运行于 OHOS：x86_64 ELF 与 aarch64-unknown-linux-ohos 目标架构不匹配"
  - "开源 oneMath（uxlfoundation/oneMath，Apache-2.0，原 oneMKL Interfaces）仅是 SYCL 接口/分发层（selector），默认后端就是闭源 Intel oneMKL；aarch64 CPU 后端仅商用 ArmPL 或 NETLIB/OpenBLAS（仅 BLAS/LAPACK 子集），且其构建强制要求 SYCL/DPC++ 编译器，OHOS 无此工具链"
  - "oneMath host API 基于 sycl::queue 的 C++ 模板接口，不是经典 BLAS Fortran/C ABI，无法作为 intel-mkl 的 drop-in 替代"
  - "赛事先例：#1990 nccl（OHOS 无 NVIDIA CUDA 无法适配）、#1906 intel-oneapi-dpcpp（Intel 工具链高难度）——intel-mkl 属同类闭源+无平台交付，判定无法适配"

