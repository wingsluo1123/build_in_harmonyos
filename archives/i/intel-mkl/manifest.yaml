# 软件级 manifest — intel-mkl
# 遵循 ARCHIVE-SPEC v3.0（failed 归档规范，参考 prefixsuffix 先例）

software: intel-mkl
display: "Intel oneAPI Math Kernel Library (oneMKL)"
description: "Intel 专有闭源高性能数学库（BLAS/LAPACK/FFT/PARDISO/向量数学等），仅发布 x86_64 / Intel GPU 预编译二进制，无公开源码、无 aarch64/OHOS 交付"
category: library
homepage: "https://www.intel.com/content/www/us/en/developer/tools/oneapi/onemkl.html"
license: "Intel Simplified Software License (闭源，禁止源码分发)"
build_system: n/a
adaptation_path: "路径 B（贡献创新）— 无法适配分析"

ohos_adaptation:
  key_points:
    - "intel-mkl（oneMKL）是 Intel 闭源商业产品（Intel Simplified Software License），Intel 从不发布源码"
    - "Intel 仅发布 Windows/Linux/macOS 的 x86_64 (Intel 64) 预编译二进制及 Intel GPU 后端；无 aarch64/ARM 发布物，无 HarmonyOS/OHOS 版本"
    - "MKL 内核深度依赖 x86 指令集（SSE/AVX/AVX-512），无法移植/交叉编译到 aarch64"
    - "开源替代 oneMath（原 oneMKL Interfaces，Apache-2.0）仅是 SYCL 接口/分发层，需后端（默认后端即闭源 Intel oneMKL；aarch64 需商用 ArmPL），无法替代 intel-mkl 产品本身"
    - "oneMath 构建强制要求 SYCL/DPC++ 编译器（Intel icpx / AdaptiveCpp），OHOS 无 SYCL 工具链"
  common_dependencies:
    - "闭源产品，无开源依赖链可建"

versions:
  "2025.1":
    status: failed
    build_date: "2026-08-10"
