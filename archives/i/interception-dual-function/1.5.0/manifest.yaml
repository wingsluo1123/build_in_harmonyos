knowledge_gained:
  - "OHOS clang 15 sysroot 自带 linux/input.h 等内核 UAPI 头，libevdev 下游无需头文件注入"
  - "yaml-cpp 对标量 YAML 节点 Node::size() 返回 0：calloc(node.size(), ...) 在标量分支只拿到 1 字节堆块，写 ->code 越界——glibc calloc(0) 返回块足够大而掩盖，OHOS musl 下 SIGSEGV"
  - "上游 Makefile 硬编码 CC/CXX/INCS/CFLAGS/CXXFLAGS/LDFLAGS；用 make 命令行变量覆盖（命令行优先于 Makefile 赋值），CPPFLAGS 保持上游原样（含 -D_POSIX_C_SOURCE/-DVERSION）"
  - "clang 15 对 K&R 风格函数定义报 -Wstrict-prototypes，上游 -Werror 会因此失败，覆盖 CFLAGS/CXXFLAGS 时需移除 -Werror"

