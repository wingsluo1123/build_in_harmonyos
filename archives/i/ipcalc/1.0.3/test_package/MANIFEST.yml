# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: ipcalc/1.0.3
homepage: "https://gitlab.com/ipcalc/ipcalc"

# Upstream test command (from Makefile/tests/ directory)
upstream_check_command: "sh tests/ipcalc-testrunner.sh"

# conanfile.py build() method includes upstream test
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (in tests/ directory of source)
upstream_tests:
  - file: ipcalc-testrunner.sh
    source: ipcalc-1.0.3/tests/ipcalc-testrunner.sh
    description: "Official test runner with 90+ test cases for IPv4/IPv6 calculations"
    command: "sh tests/ipcalc-testrunner.sh"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_ipcalc.sh
    description: "Smoke test: version, IPv4 calc, IPv6 calc"
    command: "./test_ipcalc.sh"

# Approximate assertion count
assertion_count: 5
