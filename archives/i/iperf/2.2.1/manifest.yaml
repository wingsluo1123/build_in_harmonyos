# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Autotools umask 077 in configure creates temp dirs owned by wrong user on HarmonyOS; fix via configure patch using TMPDIR and removing umask 077"
  - "/bin/bash does not exist on HarmonyOS; bash is at /data/service/hnp/bin/bash; upstream test scripts with #!/bin/bash shebang fail"
  - "config.guess needs HarmonyOS detection (aarch64-unknown-linux-ohos)"
  - "config.sub needs linux-ohos kernel-OS validation"
  - "linux/socket.h conflicts with sys/socket.h on HarmonyOS; fix with sockaddr_storage macro alias in headers.h"
  - "musl libc udphdr uses uh_sum instead of check; fix with #ifdef __OHOS__ in checksums.c"

patch_generation:
