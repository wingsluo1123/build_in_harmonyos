# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: iperf/2.2.1
homepage: "https://sourceforge.net/projects/iperf2/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Note: All 16 upstream tests use #!/bin/bash shebang which is unavailable
# on HarmonyOS (/bin/bash does not exist). Tests fail with ENOENT.
# This is a platform limitation, not a code issue.
upstream_tests:
  - file: t/t1_tcp.sh
    source: iperf-2.2.1/t/t1_tcp.sh
    description: "TCP bandwidth test (server+client)"
    command: "./t/t1_tcp.sh"
  - file: t/t7_n.sh
    source: iperf-2.2.1/t/t7_n.sh
    description: "N-byte transfer test"
    command: "./t/t7_n.sh"
  - file: t/t3_udp.sh
    source: iperf-2.2.1/t/t3_udp.sh
    description: "UDP bandwidth test"
    command: "./t/t3_udp.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Structure check placeholder"
    command: "./test_iperf"

# 测试断言总数 (近似值, 用于质量评估)
# 1 assertion: iperf --version returns successfully
assertion_count: 1
