software: ipsumdump
name: ipsumdump
version: "1.86"
status: built
build_date: "2026-07-28"
build_system: autotools

source:
  url: "https://read.seas.harvard.edu/~kohler/ipsumdump/ipsumdump-1.86.tar.gz"
  sha256: "e114cd01b04238b42cd1d0dc6cfb8086a6b0a50672a866f3d0d1888d565e3b9c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=\$DEFAULT_PREFIX"

  dependencies:
    - "libpcap/1.10.6"

  cc: clang
  cxx: clang++

patches_applied:
  - file: "0001-config.guess-ohos.patch"
    description: "Fix config.guess to recognize HarmonyOS"
    type: portability
  - file: "0002-config.sub-ohos.patch"
    description: "Fix config.sub for OHOS triplet and aarch64"
    type: portability
  - file: "0003-siocgstamp-ohos.patch"
    description: "Add missing SIOCGSTAMP definition for OHOS"
    type: portability

knowledge_gained:
  - "E007/E072: config.guess/sub 2010版需echo+exit风格补丁"
  - "E002/E011: umask 077→022 for HMDFS"
  - "SIOCGSTAMP未定义需回退定义(0x8906)"
  - "OHOS使用libc++，configure中-force-linux-check绕过"
  - "OHOS缺少_IOC_DIRSHIFT宏需在llrpc.h中回退定义"
