software: iraf
display: "IRAF"
description: "天文图像归约和分析系统，含 CL/ECL、SPP 编译链及完整 NOAO 包"
category: utility
homepage: "https://github.com/iraf-community/iraf"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "原生构建捆绑 F2C，再通过 SPP/Ratfor/F2C 自举 VOS、核心及 NOAO"
    - "链接能力探测选择AArch64保存现场入口，保持尾调用与原始缓冲布局"
    - "按实际头能力选择浮点控制路径；探针及F77使用可写TMPDIR"
    - "xc 以 rename 落盘产物并检查返回值，适应不支持硬链接的 HMDFS"
    - "安装配置限定在包内；启动器相对定位 IRAF 根目录"
    - "旧 rcmd 通道使用 SSH socketpair 传输，并验证 stderr、FD 生命周期及 exec 错误"
    - "F77 清理 trap 保留真实失败状态；构建期最多四路调度独立 Fortran 翻译单元"
    - "Bison 的 yacc、数据目录及 m4 均通过配方私有环境定位"
  common_dependencies:
    - "readline/8.3"
    - "zlib/1.3.1"
  build_dependencies:
    - "flex/2.6.4.2"
    - "bison/3.8.2"
    - "m4/1.4.19"

versions:
  - version: "2.18.1"
    status: built
    build_date: "2026-10-17"
