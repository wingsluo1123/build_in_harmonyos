software: irssi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/irssi/irssi/releases/download/1.4.5/irssi-1.4.5.tar.xz"

  # 源码校验和
  sha256: "72a951cb0ad622785a8962801f005a3a412736c7e7e3ce152f176287c52fe062"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dwith-perl=no"
    - "-Denable-true-color=yes"
    - "-Dstatic-dependency=yes"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0
    - openssl/3.5.6
    - ncurses/6.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# Meson build system doesn't need config.guess/config.sub patches

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub HarmonyOS识别 — autotools需要patch，meson不需要"
  - "Perl模块编译在HarmonyOS上失败，使用meson -Dwith-perl=no禁用"
  - "autotools config.status在HMDFS上创建临时文件失败(Permission denied)，改用meson构建系统"
  - "test-796失败因getpwuid_r()不支持非系统UID(E051平台限制)"
  - "ncurses cmd-pkgs预编译包缺少头文件，但meson configure可用cc.find_library检测到libncursesw.a"
