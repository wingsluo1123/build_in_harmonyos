software: irssi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/irssi/irssi/releases/download/1.4.5/irssi-1.4.5.tar.gz"

  # 源码校验和
  sha256: "31653e8e0c5b1ef9b89905c330a0d77fe3f0592f88d163e504c1923dcd28ac47"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-perl=no"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0
    - openssl/3.5.6
    - ncurses/6.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.patch"
  - "0004-irssi-config.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub HarmonyOS识别，使用patch-autotools-ohos.pl一键补丁"
  - "Perl模块编译在HarmonyOS上失败(pm_to_blib错误)，使用--with-perl=no禁用"
  - "ncurses静态库需设置CFLAGS/LDFLAGS才能被configure的AC_CHECK_LIB检测到"
  - "test-796失败因getpwuid_r()不支持非系统UID(E051平台限制)"
  - "glib/2.84.0.1版本号4段导致irssi configure sed解析失败，改用glib/2.84.0"
  - "HarmonyOS mktemp -d创建的目录带SGID位阻止写入，需patch configure跳过mktemp用mkdir"
  - "glib-2.0.pc含-l:ld-musl-aarch64.so.1，需-L/system/lib才能找到musl动态链接器"
  - "conan pcre2/libffi的.la文件libdir='//lib'错误，需修正为实际路径"

