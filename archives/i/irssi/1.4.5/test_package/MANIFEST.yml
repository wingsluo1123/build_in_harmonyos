# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: irssi/1.4.5
homepage: "https://irssi.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "meson test"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/fe-common/core/test-formats
    source: irssi-1.4.5/tests/fe-common/core/test-formats.c
    description: "Format string tests"
    command: "meson test test-formats"
  - file: tests/irc/core/test-irc
    source: irssi-1.4.5/tests/irc/core/test-irc.c
    description: "IRC core protocol tests"
    command: "meson test test-irc"
  - file: tests/irc/core/test-channel-events
    source: irssi-1.4.5/tests/irc/core/test-channel-events.c
    description: "IRC channel event tests"
    command: "meson test test-channel-events"
  - file: tests/fe-text/test-paste-join-multiline
    source: irssi-1.4.5/tests/fe-text/test-paste-join-multiline.c
    description: "Paste join multiline tests"
    command: "meson test test-paste-join-multiline"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: irssi --version"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 29
