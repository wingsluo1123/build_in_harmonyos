# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: irssi/1.4.5
homepage: "https://irssi.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-796
    source: irssi-1.4.5/tests/test-796
    description: "irc/flood server_destroy_flood test (fails on HarmonyOS due to getpwuid_r E051)"
    command: "./tests/test-796"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "构建环境验证测试 (conanfile.py test() 运行 irssi --version 进行功能验证)"
    command: "irssi --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
