sources:
  "3.10.14":
    url: "https://github.com/xlcnd/isbnlib/archive/refs/tags/v3.10.14.tar.gz"
    sha256: "2aaed501b34a72c2f018b245358c0ef15772c1f3b9c2a8f407194e209b0f5804"
patches:
  "3.10.14":
    - patch_file: "patches/0001-isbnlib-registry.py.patch"
      patch_description: "Discover both plugin groups via importlib.metadata without pkg_resources"
      patch_type: "portability"
    - patch_file: "patches/0002-isbnlib-dev-vias.py.patch"
      patch_description: "Move multiprocessing worker to module scope for spawn serialization"
      patch_type: "portability"
    - patch_file: "patches/0003-isbnlib-test-test_files.py.patch"
      patch_description: "Keep filesystem assertions in an isolated writable directory"
      patch_type: "portability"
    - patch_file: "patches/0004-isbnlib-test-test_rename.py.patch"
      patch_description: "Keep rename assertions in an isolated writable directory"
      patch_type: "portability"
