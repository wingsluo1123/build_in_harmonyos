# conandata.yml — isc-dhcp 4.4.3-p1 (ISC DHCP)
# Upstream release tarball from the ISC ftp server (official source).
sources:
  url: "https://ftp.isc.org/isc/dhcp/4.4.3-P1/dhcp-4.4.3-P1.tar.gz"
  sha256: "0ac416bb55997ca8632174fd10737fd61cdb8dba2752160a335775bc21dc73c7"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos.patch"
    patch_description: "config.guess: recognize the HarmonyOS host (UNAME_SYSTEM=HarmonyOS) and emit the aarch64-unknown-linux-ohos triple"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-linux-ohos.patch"
    patch_description: "config.sub: accept the *-linux-ohos pattern so the OHOS --host triple validates"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-E011-HMDFS-umask-fix.patch"
    patch_description: "configure: probe the temporary directory with umask 022 instead of 077, whose 0700 mode the HMDFS user volume rejects (E011)"
    patch_type: "portability"
  - patch_file: "patches/0004-bind-config.guess-harmonyos.patch"
    patch_description: "Same config.guess OHOS triple, for the bundled BIND 9.11.36 tree"
    patch_type: "portability"
  - patch_file: "patches/0005-bind-config.sub-linux-ohos.patch"
    patch_description: "Same config.sub *-linux-ohos pattern, for the bundled BIND 9.11.36 tree"
    patch_type: "portability"
  - patch_file: "patches/0006-bind-configure-E011-HMDFS-umask-fix.patch"
    patch_description: "Same temporary-directory umask fix, for the bundled BIND configure"
    patch_type: "portability"
  - patch_file: "patches/0007-bind-makefile-shell-prefix.patch"
    patch_description: "bind/Makefile.in: invoke the bundled BIND configure through $(SHELL); OHOS rejects direct exec() of unsigned interpreter scripts"
    patch_type: "portability"
  - patch_file: "patches/0008-tests-unittest-atfrun-command-v.patch"
    patch_description: "tests/unittest.sh.in: resolve the ATF tool paths with command -v instead of the shell-specific type|awk extraction (mksh prints 'is a tracked alias for <path>', so awk $3 yielded a single letter and the -x guard silently skipped every suite)"
    patch_type: "portability"
