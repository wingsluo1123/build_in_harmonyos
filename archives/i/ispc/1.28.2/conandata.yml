# 源码与补丁声明；CI 读取此文件下载源码并校验 sha256
# R39: 只写官方 URL（GitHub 官方 release tag 归档），镜像 fallback 由 CI 自动添加
sources:
  url: "https://github.com/ispc/ispc/archive/refs/tags/v1.28.2.tar.gz"
  sha256: "0b7d1d73afa93c015814b99c97b88fa45bce822d7904e8fc4a95666ba8e3fb92"

patches:
  - patch_file: "patches/0001-host-libcxx-verbose-abort-noexcept.patch"
    patch_description: >-
      std::__libcpp_verbose_abort 的异常规格改为跟随**宿主 libc++** 版本：
      libc++ >= 20 把它声明为 noexcept，libc++ < 20（如 OHOS SDK 的 libc++ 15.0.4）不声明；
      上游按 ISPC_LLVM_VERSION >= 20 决定是否加 noexcept（假定宿主 libc++ 与所链接的 LLVM 同版本），
      在 OHOS（LLVM 20.1.8 + SDK libc++ 15.0.4）下触发
      "error: exception specification in declaration does not match previous declaration"。
      本补丁只改这一个条件（ISPC_LLVM_VERSION -> _LIBCPP_VERSION），不改变任何运行期行为。
    patch_type: "portability"
