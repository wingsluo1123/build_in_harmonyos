build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DLLVM_CONFIG_EXECUTABLE=<llvm-project pkg>/bin/llvm-config"
    - "-DLLVM_DIR=<llvm-project pkg>/lib/cmake/llvm"
    - "-DX86_ENABLED=<ON 当 llvm-config --targets-built 含 X86>"
    - "-DARM_ENABLED=<ON 当 llvm-config --targets-built 含 ARM>"
    - "-DWASM_ENABLED=OFF"
    - "-DXE_ENABLED=OFF"
    - "-DISPC_INCLUDE_TESTS=ON"
    - "-DISPC_INCLUDE_BENCHMARKS=OFF"
    - "-DISPC_INCLUDE_EXAMPLES=OFF"
    - "-DISPC_INCLUDE_RT=OFF"
    - "-DISPC_LIBRARY=OFF"
    - "-DISPC_LIBRARY_JIT=OFF"
    - "-DISPC_PREPARE_PACKAGE=OFF"
    - "-DISPC_STATIC_LINK=OFF"
    - "-DISPC_STATIC_STDCXX_LINK=OFF"
    - "-DCLANGPP_EXECUTABLE=<build>/_host_tools/clang++"
  dependencies:
    - llvm-project/20.1.8
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-host-libcxx-verbose-abort-noexcept.patch"

