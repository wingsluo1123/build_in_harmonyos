# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: istgt/0.4-20111008
homepage: "https://sourceforge.net/projects/istgt/"

# 上游测试命令 — istgt 0.4-20111008 autotools 无 TESTS/check 目标
# (src/Makefile.in 只有 istgt / istgtcontrol 两个 program，无 TESTS 变量，
#  无 make check 目标；上游不提供自动化测试套件)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (istgt 无上游自动化测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test_istgt.py
    description: "端到端功能测试: 包布局 8 项（bin/istgt、bin/istgtcontrol、man、pkgconfig、licenses、etc/istgt 样例配置）+ istgt -V / istgtcontrol -V / istgt -H 契约 3 项 + 最小配置启动 daemon（uctl 38261 + iSCSI portal 38262 双监听）+ istgtcontrol noop/version uctl 往返 + SIGTERM 干净退出（共 15 项断言）"
    command: "python3 test_istgt.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
