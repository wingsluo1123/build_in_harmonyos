# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: isync/1.5.1
homepage: "https://isync.sourceforge.net/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/tst_imap_msgs.c
    source: isync-1.5.1/src/tst_imap_msgs.c
    description: "IMAP message parsing tests"
    command: "./tst_imap_msgs"
  - file: src/tst_imap_utf7.c
    source: isync-1.5.1/src/tst_imap_utf7.c
    description: "IMAP UTF-7 encoding tests"
    command: "./tst_imap_utf7"
  - file: src/tst_msg_cvt.c
    source: isync-1.5.1/src/tst_msg_cvt.c
    description: "Message conversion tests"
    command: "./tst_msg_cvt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run mbsync --version to verify binary is functional"
    command: "mbsync --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
