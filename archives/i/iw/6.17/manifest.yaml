build:
  system: makefile
  configure_options: []
  dependencies:
    required:
      - libnl/3.11.0
    optional: []
  cc: clang
  notes: >
    纯 Makefile（无 configure / 非 autotools）；libnl 经 pkg-config 探测
    （PkgConfigDeps 生成 .pc → PKG_CONFIG_PATH 指向 generators_folder）；
    -j1 避开 make jobserver（OHOS 沙箱无 mkfifo）；制品仓 libnl 仅 .a
    ⇒ iw 静态链入 libnl，二进制运行期仅 NEEDED libc.so。

patches_applied:
  - "0001-Makefile.patch"

knowledge_gained:
  - "E119/E1604（命中，非新增）：OHOS musl 派生 sysroot 的 <linux/socket.h> 无条件重定义 struct sockaddr_storage（<sys/socket.h> 已提供；glibc 的 UAPI 副本用 #ifndef __GLIBC__ 屏蔽）。libnl 的 <netlink/netlink.h> 先引 <sys/socket.h> 再引 <linux/netlink.h> → <linux/socket.h>，故**每个** iw TU 都报 redefinition。修法沿用仓内 E119/E1604 惯用法：预锁 _UAPI_LINUX_SOCKET_H + 补 __kernel_sa_family_t typedef。⚠ 与 E119 原处方的两处差异：①不用平台宏 __OHOS__（E1604 forbid 口径、PF5 合规）；②不新增头文件，两个宏直接在 Makefile 的 CFLAGS 里定义（glibc 下 guard 只是冗余，行为逐字不变）。"
  - "★新增：OHOS app 沙箱在**创建** socket(AF_NETLINK, SOCK_RAW, NETLINK_GENERIC=16) 时即返回 EACCES(13)，而 NETLINK_ROUTE(0) 可创建、可 bind。因此所有经 generic netlink 访问 nl80211 的工具（iw / ethtool 的 netlink 后端）在运行期一律 'Failed to connect to generic netlink.' rc=1；CLI 契约面（--version / usage / 命令表）不受影响。图谱现有能力墙条目只覆盖 AF_UNIX（E461/E1240）与 NETLINK_ROUTE 的 bind EPERM（kea 草稿），未覆盖 NETLINK_GENERIC 的 socket() EACCES。"
  - "★新增：上游 `check:` 目标的存在性**不能**作为'存在测试套件'的判据——iw 6.17 的 `check:` 是 `$(MAKE) all CC=\"REAL_CC=$(CC) CHECK=\\\"sparse -Wall\\\" cgcc\"` 即 sparse/cgcc **静态分析 lint**（本机 sparse/cgcc 均不存在），既非测试执行面、也不构成上游注册用例；若照抄 `autotools.make(target=\"check\")` 会失败或空跑。正确口径 = R51 六探针清点得 N_static=0，真实断言全部由 test_package 承担。"

