# test_package/MANIFEST.yml — iw 6.17
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
package: iw/6.17
homepage: "https://wireless.wiki.kernel.org/en/users/documentation/iw"

# 上游测试命令：Makefile 里唯一的 `check:` 目标 =
#   check:
#       $(Q)$(MAKE) all CC="REAL_CC=$(CC) CHECK=\"sparse -Wall\" cgcc"
# 这是 sparse/cgcc **静态分析 lint**，不是测试套件；且本机 sparse/cgcc 均不
# 存在 ⇒ 既不可执行、也不构成"上游注册用例"。故 N_static = 0。
upstream_check_command: "make check  # = sparse -Wall cgcc 静态分析 lint，非测试套件"

# conanfile.py build() 中**未**集成上游测试——上游没有任何测试可集成。
upstream_test_in_build: false
upstream_test_command: "无（上游注册用例数 = 0）"

# 上游实际运行的测试程序：无。
upstream_tests: []

# R51 六探针清点（2026-10-17 在官方 tarball iw-6.17.tar.xz 上实测，全 0 命中）：
#   P1 test/tests 目录                    : 0
#   P2 TESTS= / check_PROGRAMS=           : 0   （无 Makefile.am，仅裸 Makefile）
#   P3 test*.c / *_test.c 测试源           : 0
#   P4 add_test( / ctest / enable_testing  : 0
#   P5 *RUNTEST* / runtest 驱动            : 0
#   P6 demo / demos / examples 目录        : 0
# 全树 52 个文件 = 40 *.c + 4 *.h + Makefile + Android.mk + version.sh + iw.8
# + COPYING + README + CONTRIBUTING + .gitignore；全树 grep -i test 唯一命中为
# NL80211_CMD_TESTMODE / testmode（nl80211 驱动透传命令，非测试）。
# 复现：
#   tar xf iw-6.17.tar.xz && cd iw-6.17
#   find . -type d \( -name test -o -name tests -o -name testing \) | wc -l
#   grep -rE '^[[:space:]]*(TESTS|check_PROGRAMS)[[:space:]]*[:+]?=' . | wc -l
#   find . -name 'test*.c' -o -name '*_test.c' | wc -l
#   grep -rE 'add_test\(|ctest|enable_testing\(' . | wc -l
upstream_test_count: 0

# test_package 自带的测试（消费者视角验证，真实执行已安装二进制）
test_package_tests:
  - file: test_iw.py
    description: "消费者断言：产物存在 + aarch64 ELF + --version 逐字版本串 + 无参数/help 的 usage 与命令表 + generic-netlink 平台墙逐字固定（rc=1）"
    command: "python3 test_iw.py <package_folder>"

assertion_count: 11
