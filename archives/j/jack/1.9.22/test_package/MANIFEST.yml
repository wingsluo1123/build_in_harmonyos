# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jack/1.9.22
homepage: "https://jackaudio.org"

# 上游测试命令 (waf build system, tests disabled by default)
upstream_check_command: "python3 waf build --tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (waf --tests, disabled in this build)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 jack 库链接和 API 调用 (jack_client_name_size)"
    command: "./test_jack"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
