# 版本级 manifest — jakarta-jmeter 2.13
version: "2.13"
software: jakarta-jmeter
status: built
build_date: "2026-10-13"
conan_ref: "jakarta-jmeter/2.13"

source:
  url: "https://archive.apache.org/dist/jmeter/source/apache-jmeter-2.13_src.tgz"
  sha256: "f5aeda5db5266aef8b2de1c7c65229ac81339401b3cf64c810b2d34e2ae8957f"
  note: "Apache 官方归档主机；SHA256 与同目录官方 .md5 校验一致"

build:
  system: ant
  command: "ant -Dsrc.java.version=1.8 -Dtarget.java.version=1.8 download_jars package"
  dependencies:
    - bishengjdk 17.0.13（配方经 cmd-pkgs 自取；HNP 自带 JVM 在部分环境无法启动）
    - apache-ant 1.10.15（配方自 archive.apache.org 自取，sha256 钉校验 71334d7e…80506）
    - javax.activation:activation 1.1.1（配方自 repo1.maven.org 自取，sha256 钉校验 ae475120…4f99；JDK 11 起不再随 JDK 提供）
    - Maven Central 运行时 jar（ant download_jars 按 build.properties 逐 jar MD5 钉取）

patches_applied:
  - file: "patches/jm-0001-jdk9-swing-generics.patch"
    description: "Swing 自 JDK 9 泛型化：JTreeTable 的 JTable(Vector,Vector) 构造、JMeterTreeNode.children() 协变覆写（Enumeration<JMeterTreeNode>→Enumeration<TreeNode>）及 5 处调用点经通配双转型修复——JDK 17 javac 下原签名不再合法"
  - file: "patches/jm-0002-javax-activation-classpath.patch"
    description: "build.xml classpath 增加 lib/activation-1.1.1.jar 一行——javax.activation 自 JDK 11 起摘除，由配方自取的外部 jar 承担（src/protocol/mail SMTP 采样器编译期需要）"

upstream_tests:
  framework: "ant test-headless（org.apache.jorphan.test.AllTests 汇集的官方 JUnit 套件，build.xml 官方无头入口）"
  test_sources: "test/src/**（1596 个 JUnit 用例）；另有 batchtest（golden 文本 diff）属 `ant test` 目标"
  test_classes: "test/src 下 Test* 类（1596 用例级）"
  test_methods: 1596
  test_command: "ant -Dsrc.java.version=1.8 -Dtarget.java.version=1.8 test-headless（CI 外真机原样运行）"
  run_in_build: false
  evidence: "官方入口原样运行日志 upstream-tests/test-headless-run1.log；失败清单 failure-list-run1.txt；--add-opens 诊断重跑 test-headless-rerun-add-opens.log 与 test-headless-rerun2-add-opens.log（本机 runs 目录）"
upstream_test_pass_rate: "1475/1596 通过（92.4%）；1 失败 + 120 错误，如实记录：SaveService/xstream 1.4.8 触发 JDK17 JPMS InaccessibleObjectException（65）、headless 字体栈缺 libfreetype.so.6（15）、htmlparser 2.1 的 [B→[C ClassCastException（JDK9+ compact strings，33）、ProxyControl 初始化连带（7）、TestMenuFactory 断言 1——batchtest 未运行（非 PASS，未覆盖）"
adapted_test_pass_rate: "test_package 全过：结构校验 5 项 + java -jar ApacheJMeter.jar --version 报告 Version 2.13 + 反射消费者 10 项断言（含 StandardJMeterEngine 无 GUI 实例化、getJMeterVersion()=2.13）；conan create EXIT=0 待权威 CI 复核"

knowledge_gained:
  - "JMeter 2.13 build.xml 默认 -source/-target 1.6，JDK 17 javac 已移除 1.6 目标——Ant 命令行 -Dsrc.java.version=1.8 -Dtarget.java.version=1.8 覆盖即可（Ant 命令行属性优先级高于 build.xml <property>，免 patch）"
  - "2015 年代源码在 JDK 17 下两类编译不兼容：Swing JDK9+ 泛型化（JTable Vector 构造与 DefaultMutableTreeNode.children() 覆写签名）与 javax.activation 摘除——分别用最小 portability 补丁处理；javax.activation 以外部 jar（activation-1.1.1.jar，sha256 钉）补回 classpath，随 lib/*.jar 打包进产物"
  - "ant download_jars 从 Maven Central 拉 build.properties 逐 jar 钉 MD5 的运行时依赖，在 OHOS 真机网络下可正常工作；classpath 是逐 jar 显式 pathelement（非 fileset），外部 jar 必须同时改 build.xml 才进编译期 classpath"
  - "上游 AllTests 依赖 user.dir=<jmeter_home>/bin（按 user.dir 父目录推断 home），复跑需保持 ant _test 的 dir 语义；HMDFS 下经 sh $ANT_HOME/bin/ant 调用规避新写脚本执行位缺失"
  - "headless 字体类错误的真实根因是 bishengjdk17 自带 libfontmanager.so 依赖 libfreetype.so.6 而设备缺失（UnsatisfiedLinkError）——非 W^X/JPMS 问题；GUI 依赖类测试（菜单/bean 编辑器/可视化器）在该环境无法通过，属环境缺口"
  - "xstream 1.4.8 在 JDK 17 需要大量 --add-opens（java.util→java.lang.reflect→java.awt.font…逐层暴露），两个旗标集合均未能收敛——消费 .jmx（SaveService）在 JDK 17 上需依赖侧评估旗标集合或升级 xstream，属上游依赖决策，不在本 run 内代做"
