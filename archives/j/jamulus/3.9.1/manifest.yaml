# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.9.1"

# 软件名
software: "jamulus"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-13"
build_system: "qmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jamulussoftware/jamulus/archive/refs/tags/r3_9_1.tar.gz"

  # 源码校验和
  sha256: "758381a92ff7b264534773b71b6bf8e098bbeb6d693efdc2916609f2ff842889"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: qmake

  # 配置选项列表
  configure_options:
  - "CONFIG+=serveronly"
  - "CONFIG+=headless"
  - "PREFIX=/usr"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - qt/5.15.19

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

# 补丁生成（实测终态：零补丁）
patch_generation:
  method: none
  patches_count: 0
  note: "适配无任何源码修改（.qm 空翻译由 build() 构建期生成于 conan 缓存），
    refresh-patch --auto 因空基线误判生成过 65 个整文件垃圾 diff，已全部删除，
    与 W3 实测通过的零补丁形态一致。"
