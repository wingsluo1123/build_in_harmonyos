version: "1.4.1"
software: "janus"
status: built
build_date: "2026-10-13"
build_system: "autotools"

source:
  url: "https://github.com/meetecho/janus-gateway/archive/refs/tags/v1.4.1.tar.gz"
  sha256: "cba1e7aac44f4458701c5e14698e791a0eee13ecacbdacc71b4245716c442c08"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--disable-data-channels"
    - "--enable-libsrtp2"
    - "--disable-all-plugins"
    - "--enable-plugin-echotest"
    - "--enable-plugin-videocall"
    - "--enable-plugin-videoroom"
    - "--disable-all-transports"
    - "--enable-rest"
    - "--enable-websockets"
    - "--disable-all-handlers"
    - "--disable-all-loggers"
    - "--disable-turn-rest-api"
    - "--disable-docs"
    - "--disable-post-processing"
  dependencies:
    - "glib/2.84.0.1.1"
    - "libnice/0.1.21"
    - "jansson/2.15.1.1"
    - "libconfig/1.7.3"
    - "libsrtp2/2.8.0"
    - "libmicrohttpd/1.0.1"
    - "libwebsockets/4.3.5.1"
    - "libuv/1.52.1"
    - "zlib/1.3.1.1"
    - "openssl/1.1.1w"
  cc: "clang"
  cxx: "clang++"

patches_applied: []
knowledge_gained:
  - "libnice/0.1.21 的已发布 HarmonyOS 二进制绑定 OpenSSL 1.1.1w；因此在 Janus 根图中统一使用 OpenSSL 1.1.1w，并从源码重建 libwebsockets/4.3.5.1。" # knowledge_ref: E429
