  - "jaraco.stream 的测试直接放在包目录内（jaraco/stream/test_gzip.py）而非独立 tests/，清点上游测试时要按「包内测试模块」口径找"
  - "上游测试里起本地 HTTP server（localhost:8080）在 OHOS 沙箱内可正常工作，网络类测试不必预先排除"
