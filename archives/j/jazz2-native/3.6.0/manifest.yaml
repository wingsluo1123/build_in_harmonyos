# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS musl 不支持 IRELATIVE 重定位 → nCine 默认 DEATH_CPU_USE_IFUNC=ON 的二进制启动即崩；关开关后正常（readelf -r IRELATIVE 计数 0）"
  - "nCine ES 渲染路径调用 ES 3.0 入口点（glBlitFramebuffer/glInvalidateFramebuffer 等），sysroot libGLESv2.so 不导出 → 必须用 libGLESv3.so，否则链接期 22 个未定义符号"
  - "GLES/EGL 四个 CMake 查找变量（OPENGLES2_LIBRARY/EGL_LIBRARY/OPENGLES2_INCLUDE_DIR/EGL_INCLUDE_DIR）需显式指向 OHOS sysroot；库目录用 clang -print-file-name=libm.a 反查最稳"
  - "E211：OHOS musl 缺 pthread_setaffinity_np/pthread_getaffinity_np/pthread_cancel → 改 sched_setaffinity/sched_getaffinity，取消语义按不支持返回"
  - "ohpcd sdl2 头装在 include/SDL2/，nCine 在 CMAKE_BUILD 下直接 #include <SDL.h> → 把 include/SDL2 加入包含路径即可，无需上游补丁"
  - "application 包的运行时依赖在消费者/测试图里被标 Skipped binaries（cpp_info 只剩相对 libdirs、package_folder 为空）→ 测试包需显式 require 对应依赖才能拼出完整 LD_LIBRARY_PATH"
  - "conan run env 列表在本环境不生效（同仓库 acsccid 先例）→ test_package 改为命令行内联 LD_LIBRARY_PATH"
  - "libcurl 在非 Windows 平台是硬依赖（WebRequest.cpp 无条件 include <curl/curl.h>）；zlib 需钉 1.3.1.1 与 libcurl 传递依赖对齐"

