# OHOS 适配：上游根 CMakeLists / guitarml CMakeLists 全部经 FetchContent 从
# GitHub 构建期拉取（无网络环境不可行）。除 JUCE 改为消费已发布的 conan 包
# （find_package(JUCE)）外，其余五个 FetchContent 源在 recipe source() 期由
# 下列固定 URL+SHA256 下载解包，经 FETCHCONTENT_SOURCE_DIR_* 注入（E292 先例：
# knowledge/graph/E292.kv L25 "必要时使用 no-links 预解包并通过
# FETCHCONTENT_SOURCE_DIR_* 注入"）。锁定 commit 与上游 CMakeLists 声明一致：
#   根 CMakeLists LIB_CLAP_TAG / LIB_CHOWDSP_UTILS_TAG
#   guitarml CMakeLists LIB_RTNEURAL_TAG / LIB_CHOWDSP_MATH_APPROX_TAG / LIB_VARIANT_TAG
# RTNeural-xsimd 是 RTNeural@04cb333 的 .gitmodules 二跳 submodule
# （modules/xsimd → xtensor-stack/xsimd，gitlink a00c81f…，RTNEURAL_XSIMD=ON 必需；
#  RTNeural 归档内 modules/Eigen 与 modules/json 为普通 vendored 目录已自带）。
# clap / clap-helpers 是 clap-juce-extensions@a3227c5 的 .gitmodules 二跳
# submodule（clap-libs/clap → free-audio/clap gitlink df8f16c…；
# clap-libs/clap-helpers → free-audio/clap-helpers gitlink 7b53a68…）。
