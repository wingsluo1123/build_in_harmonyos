# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jdim/0.10.1
homepage: "https://github.com/JDimproved/JDim"

# 上游测试存在性审计（硬门禁要求；上游确有测试，已接入并在真机执行）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 jdim 0.10.1（tag JDim-v0.10.1）tarball 内含完整 GoogleTest
  单元测试套件，经 autotools 注册并在 OHOS 真机 make check 真实执行。
  1. 注册入口 test/Makefile.am：
       check_PROGRAMS = gtest_jdim
       TESTS = gtest_jdim
       gtest_jdim_SOURCES = <12 个 gtest_*.cpp>
     ⇒ 静态声明原子用例 = 各文件 TEST_F() 注册数之和 = 531；
       构建系统注册的可执行目标 = 1（gtest_jdim），TESTS 条目 = 1。
  2. 逐文件原子用例数（TEST_F 静态计数）：
       gtest_dbtree_nodetreebase.cpp      8
       gtest_dbtree_spchar_decoder.cpp   34
       gtest_jdlib_cookiemanager.cpp      7
       gtest_jdlib_jdiconv.cpp           13
       gtest_jdlib_jdregex.cpp            4
       gtest_jdlib_loader.cpp            20
       gtest_jdlib_misccharcode.cpp     109
       gtest_jdlib_misctime.cpp          12
       gtest_jdlib_misctrip.cpp          13
       gtest_jdlib_miscutil.cpp         261
       gtest_jdlib_span.cpp              15
       gtest_xml_dom.cpp                 35
       合计 531
  3. 运行方式：conanfile.py build() 中 make check 真实执行；gtest 的
     "[==========] Running N tests from M test suites" 与
     "[  PASSED  ] N tests" 行、automake test harness 的
     TOTAL/PASS/FAIL 汇总均被解析，结果落 upstream_test_result.json 并裸
     print HMBS_UPSTREAM_TEST_RESULT 标记。
  4. 依赖：gtest_main >= 1.10.0 由 pkg-config 提供；ohpcd 的 gtest/1.17.0
     配方 cpp_info 只声明 gtest 组件，上游 googletest 实际安装
     libgtest_main.a + gtest_main.pc，配方在 generate() 写 gtest_main.pc
     shim（无需补丁，未改上游任何测试文件）。
  5. 上游测试文件零修改：本配方未对 test/ 下任何文件打补丁，531 个用例的
     断言与输入数据保持上游原样。

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试用例（真机可运行集合 = 1 个 gtest 可执行目标，内含 531 原子用例）
upstream_tests:
  - file: test/gtest_dbtree_nodetreebase.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_dbtree_nodetreebase.cpp"
    description: "NodeTreeBase::remove_imenu 单元测试（8 用例）"
    command: "make check"
  - file: test/gtest_dbtree_spchar_decoder.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_dbtree_spchar_decoder.cpp"
    description: "DTREE 特殊字符引用解码单元测试（34 用例）"
    command: "make check"
  - file: test/gtest_jdlib_cookiemanager.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_cookiemanager.cpp"
    description: "CookieManager 解析单元测试（7 用例）"
    command: "make check"
  - file: test/gtest_jdlib_jdiconv.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_jdiconv.cpp"
    description: "JDLIB::Iconv 编码转换单元测试（13 用例）"
    command: "make check"
  - file: test/gtest_jdlib_jdregex.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_jdregex.cpp"
    description: "JDLIB::Regex 正则封装单元测试（4 用例）"
    command: "make check"
  - file: test/gtest_jdlib_loader.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_loader.cpp"
    description: "JDLIB::Loader 加载器单元测试（20 用例）"
    command: "make check"
  - file: test/gtest_jdlib_misccharcode.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_misccharcode.cpp"
    description: "MISC 字符编码工具单元测试（109 用例）"
    command: "make check"
  - file: test/gtest_jdlib_misctime.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_misctime.cpp"
    description: "MISC 时间解析/格式化单元测试（12 用例）"
    command: "make check"
  - file: test/gtest_jdlib_misctrip.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_misctrip.cpp"
    description: "MISC 字符串裁剪/匹配单元测试（13 用例）"
    command: "make check"
  - file: test/gtest_jdlib_miscutil.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_miscutil.cpp"
    description: "MISC 通用工具单元测试（261 用例）"
    command: "make check"
  - file: test/gtest_jdlib_span.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_jdlib_span.cpp"
    description: "JDLIB::span 视图单元测试（15 用例）"
    command: "make check"
  - file: test/gtest_xml_dom.cpp
    source: "JDim-JDim-v0.10.1/test/gtest_xml_dom.cpp"
    description: "XML::Document 解析单元测试（35 用例）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者用例：执行已安装的 jdim 二进制并断言 --version 契约（程序名 / 0.10.1 / --with-sessionlib=xsmp / --with-migemo / --with-alsa 共 5 条断言）"
    command: "sh test.sh <package_folder>/bin/jdim"

# 测试断言总数 (近似值)
# 上游静态原子用例 531（TEST_F 注册），真机 make check 全部执行；
# test_package 消费者断言 5 条
assertion_count: 536

# 测试套件覆盖说明
test_suite_gaps:
  unregistered: "无。test/Makefile.am 无条件注册 gtest_jdim 与全部 12 个源文件，
    531/531 静态用例均可执行，无 -wrap / 条件编译 / 资源缺失导致的跳过。"
