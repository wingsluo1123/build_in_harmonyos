package: jheaps/0.14
homepage: "https://github.com/d-michail/jheaps"

upstream_check_command: "mvn -B -Dstyle.color=never -Duser.home=<build> -Dmaven.repo.local=<build>/m2-repository -Dmaven.javadoc.skip=true clean package"
upstream_test_in_build: true
upstream_test_command: "mvn -B -Dstyle.color=never -Duser.home=<build> -Dmaven.repo.local=<build>/m2-repository -Dmaven.javadoc.skip=true clean package"

# Declaration scope aligned with the PR-check rule4 gate: the gate statically
# counts ACTIVE @Test methods across the whole tag source of jheaps-0.14
# (N=428, raw annotation occurrences also 428; no comment-embedded or dead
# occurrences, no @Ignore). The ledger below is the recomputable identity that
# connects the static 428 to the executed count: JUnit inherits the @Test
# methods of the 8 abstract base test classes into every concrete subclass, so
# the 428 unique source methods execute 1391 times across the 51 concrete
# Surefire suites. Nothing is excluded, skipped or left undeclared.
upstream_test_ledger:
  upstream_total: 428
  executed: 1391
  not_executed: 0
  identity: "428 unique source @Test methods (59 test files: 51 concrete suites + 8 abstract base classes) -> 1391 executed Surefire test cases via JUnit inheritance; 0 excluded, 0 skipped"
  counting_method: "static count of active @Test method annotations in the tag jheaps-0.14 source tree (github codeload archive sha256 e09aa581818a220257d3ab17e3a6c54fefe8d1419228c40536eb5514a7fb3022, identical to the conandata source entry); strict line-anchored grep = loose occurrence grep = 428, zero @Ignore, zero non-annotation occurrences; executed count = rerun-aware per-<testcase> count over the 51 Surefire XML reports of the device run"
  per_package_upstream_static:
    org.jheaps.array: 51
    org.jheaps.monotone: 167
    org.jheaps.tree: 210
  per_package_check: "51 + 167 + 210 = 428 static (org.jheaps.root and org.jheaps.dag contribute 0 active @Test statically: their files are abstract bases or classes inheriting them); executed split: array 339 + dag 54 + monotone 167 + tree 831 = 1391"
  executed_split: "51 Surefire suites, 1391 tests (array 339 + dag 54 + monotone 167 + tree 831), 0 failures/errors/skips, 0 flaky records (surefire rerun flags unused), mvn clean package on BiSheng JDK 17.0.13 + Apache Maven 3.8.6, ~2 min wall clock"
  inheritance_note: "abstract bases contributing inherited @Test: AbstractAddressableHeapTest, AbstractComparatorLongHeapTest, AbstractDoubleEndedAddressableHeapTest, AbstractDoubleEndedHeapTest, AbstractIntegerHeapTest, AbstractLongHeapTest, AbstractMergeableAddressableHeapTest, AbstractMergeableDoubleEndedAddressableHeapTest (8 files, static @Test counted once each; executed once per concrete subclass, which is why the org.jheaps.dag package executes 54 cases from 0 own annotations)"

upstream_tests:
  - file: "src/test/java/**/*.java"
    source: "jheaps-jheaps-0.14/src/test/java"
    description: "Complete upstream JUnit 4.13 suite (maven-surefire-plugin 3.0.0-M5, plain surefire provider, deterministic fixed-seed Random): array 51 + monotone 167 + tree 210 static methods executing as 1391 cases in 51 suites, all passed"
    command: "maven-surefire-plugin:test during mvn clean package (test phase)"

test_package_tests:
  - file: "TestJHeaps.java (dijkstra)"
    description: "End-to-end OHOS consumer: deterministic strongly-connected digraph (64 vertices, ring + seeded random edges), Dijkstra driven by three jheaps heap families (tree PairingHeap, array BinaryArrayAddressableHeap, monotone DoubleRadixAddressableHeap with bounded key range), each cross-checked against an in-consumer Bellman-Ford reference; decreaseKey handle reuse and full drain asserted; runs on the OHOS device JVM (209 assertions)"
    command: "javac --release 8 -cp <jheaps-jar> TestJHeaps.java && java -cp <classes>:<jheaps-jar> TestJHeaps dijkstra"
  - file: "TestJHeaps.java (os.name normalization)"
    description: "OHOS-specific platform normalization: the consumer JVM is launched with JAVA_TOOL_OPTIONS=-Dos.name=Linux (the same pin the build applies to Maven and Surefire) and must report os.name=Linux back to test.py, proving the OpenHarmony os.name quirk handling works for downstream consumers of the packaged jar"
    command: "python3 test.py (asserts JHEAPS_OS=Linux marker)"
  - file: "test.py (jar verification)"
    description: "Packaged jheaps-0.14.jar: nonempty, ZIP CRC clean, every class major 52 (Java 8), required entries (core interfaces, array/monotone/tree families, bundle manifest), exact class count 88, OSGi Automatic-Module-Name org.jheaps present"
    command: "python3 test.py --lib <package-lib> --version 0.14"

assertion_count: 209

scope_disclosures:
  - "Upstream jacoco 0.75 COVEREDRATIO gate is bound to the verify phase and is deliberately outside this recipe's test scope (mvn clean package = test + jar, full upstream suite executed at the test phase); the tradeoff is disclosed in notes.md ('测试口径与门禁' and '已知非目标' sections) and the conanfile.py _maven_command inline comment. Line added at path-update per audit LOW-3; no CI gate consumes MANIFEST.yml content (L0e is existence-only)."
