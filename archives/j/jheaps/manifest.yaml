software: jheaps
display: "JHeaps"
description: "Java 堆数据结构库：数组/树形/单调 radix 堆与可合并堆（Dijkstra 支撑件）"
category: library
homepage: "https://github.com/d-michail/jheaps"
license: "Apache-2.0"
build_system: maven

ohos_adaptation:
  key_points:
    - "纯 Java 交付：单个 JAR 为 Java 8 字节码（major 52，88 class），无 ELF 产物、零 JNI/native"
    - "设备无 Maven 且上游无 Wrapper：经 conandata build_tools.maven 固定 SHA-256 下载 Apache Maven 3.8.6（repo1.maven.org，sha512 对 Apache 官方发布值核对）"
    - "OHOS 设备 JVM user.home='?'：构建显式 -Duser.home + -Dmaven.repo.local 钉进构建目录（export HOME 无效）"
    - "-Dos.name=Linux 经 JAVA_TOOL_OPTIONS 注入 Maven/Surefire/消费者 JVM"
    - "maven-bundle-plugin 4.2.1 在 JDK 9+ 抛 ConcurrentModificationException（FELIX-6259）：补丁升 5.1.9，OSGi manifest 保持"
    - "上游测试口径 mvn clean package（test+jar）；jacoco 0.75 门绑 verify 不进口径，静态 428 @Test 继承扇出为 51 套件 1391 用例全过"
  common_dependencies: []

versions:
  "0.14":
    status: built
    build_date: "2026-10-14"
    conan_ref: "jheaps/0.14"
