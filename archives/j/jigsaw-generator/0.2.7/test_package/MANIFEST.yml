# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法申报）
# CI 脚本强制要求此文件存在

package: jigsaw-generator/0.2.7
homepage: "https://github.com/juliangilbey/jigsaw-generator"

# 上游测试入口（源码实测 2026-10-13，upstream/0.2.7 tag 归档）
upstream_check_command: "(none)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点（源码实测 2026-10-13）
upstream_tests_count: 0
upstream_tests: []

# 上游测试未在 OHOS 上运行的原因（逐项技术原因，非「没环境」）
upstream_tests_not_run:
  - reason: "上游无任何测试套件：无 test/ 目录、Makefile.in 无 check 目标、无 CI 配置；examples/ 只是示例拼图数据（YAML），不是可执行测试，故无可运行、可修改的上游测试"
    blocking: false

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "静态层 9 断言（安装布局 / python3 shebang / 入口脚本无未替换 @pkgdatadir@ 与 @PACKAGE_VERSION@ / 写死的 pkgdatadir 指向包内且存在 / python 包三件齐全且包内无宿主 .pyc / 模板 default_config.ini + >=6 版式 yaml / man 页 / ast.parse 语法检查 / 全部打包 YAML 可解析）+ 运行层 4 断言（-v 版本 0.2.7 / --help 用法 / --nomakepdf 真实样例生成出 .md 且退出码 0 / 完整 makepdf 管线对 stub pdflatex：退出码 0、产出 3 个 .pdf、中间 .tex 被上游 runlatex 的 clean 逻辑清理）；运行层仅在宿主有 python3+yaml 时执行，OHOS worker 上显式 defer"
    command: "bash test.sh --auto (via test_package conanfile.py test(), 静态层恒执行, 运行层按宿主 python3+yaml 可用性自动判定)"

assertion_count: 13
