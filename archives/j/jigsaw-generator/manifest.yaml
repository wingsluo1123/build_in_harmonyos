software: jigsaw-generator
display: "Jigsaw Generator"
description: "将 YAML 拼图定义转换为可打印 LaTeX 拼图/卡片排序（Tarsia 风格）物料的命令行工具"
category: data
homepage: "https://github.com/juliangilbey/jigsaw-generator"
license: "GPL-3.0-or-later"
build_system: script

ohos_adaptation:
  key_points:
    - "纯 Python 3 脚本包，无 C/C++ 编译；构建仅为上游 Makefile 的一条 sed 替换生成入口脚本"
    - "运行环境依赖 python3 + PyYAML（PyYAML 不在 ohpcd 制品仓，未声明为 conan 依赖）；生成 PDF 另需 pdflatex"
    - "入口脚本 pkgdatadir 为打包时写死的绝对路径（与上游 make install --prefix 行为一致）"
    - "上游 doc PDF 由 LaTeX 在构建时生成；本包只带 .tex 源码，不带生成出的 PDF"
  common_dependencies: []

versions:
  "0.2.7":
    status: built
    build_date: "2026-10-13"
    conan_ref: "jigsaw-generator/0.2.7"
