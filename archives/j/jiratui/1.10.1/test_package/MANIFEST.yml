# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jiratui/1.10.1
homepage: "https://jiratui.sh/"

upstream_check_command: "python -m pytest tests/"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - name: "test_cli"
    source: jiratui-1.10.1/tests/test_cli.py
    description: "CLI 命令行界面测试"
  - name: "test_commonmark"
    source: jiratui-1.10.1/tests/test_commonmark.py
    description: "CommonMark 规范兼容测试"
  - name: "test_directives"
    source: jiratui-1.10.1/tests/test_directives.py
    description: "Markdown 指令测试"
  - name: "test_hooks"
    source: jiratui-1.10.1/tests/test_hooks.py
    description: "钩子函数测试"
  - name: "test_misc"
    source: jiratui-1.10.1/tests/test_misc.py
    description: "杂项功能测试"
  - name: "test_plugins"
    source: jiratui-1.10.1/tests/test_plugins.py
    description: "插件系统测试"
  - name: "test_renderers"
    source: jiratui-1.10.1/tests/test_renderers.py
    description: "渲染器测试"
  - name: "test_security_formatting"
    source: jiratui-1.10.1/tests/test_security_formatting.py
    description: "安全格式化测试"
  - name: "test_security_image"
    source: jiratui-1.10.1/tests/test_security_image.py
    description: "安全图片处理测试"
  - name: "test_security_include"
    source: jiratui-1.10.1/tests/test_security_include.py
    description: "安全文件包含测试"
  - name: "test_security_inline"
    source: jiratui-1.10.1/tests/test_security_inline.py
    description: "安全内联测试"
  - name: "test_security_math"
    source: jiratui-1.10.1/tests/test_security_math.py
    description: "安全数学公式测试"
  - name: "test_security_ref_links"
    source: jiratui-1.10.1/tests/test_security_ref_links.py
    description: "安全引用链接测试"
  - name: "test_security_toc"
    source: jiratui-1.10.1/tests/test_security_toc.py
    description: "安全目录测试"
  - name: "test_security_urls"
    source: jiratui-1.10.1/tests/test_security_urls.py
    description: "安全 URL 测试"
  - name: "test_syntax"
    source: jiratui-1.10.1/tests/test_syntax.py
    description: "语法解析测试"

test_package_tests:
  - file: conanfile.py
    description: "jiratui version 命令验证"
    command: "jiratui version"

assertion_count: 50
