# test_package/MANIFEST.yml
# Upstream has no formal test target; the consumer test exercises the
# installed sample decoder with the documented binary record format.

package: jitterdebugger/0.3.1-git20200117.b90ff3a
homepage: "https://github.com/igaw/jitterdebugger"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# jd_samples_csv.c is an output plugin, not an automated test.
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "CLI version/help checks plus real jittersamples raw-to-CSV decoding"
    command: "sh test.sh"
    assertions:
      - "jitterdebugger, jittersamples, and jitterplot are installed and executable"
      - "jitterdebugger --version is exactly 'jitterdebugger 0.3'"
      - "jittersamples --version is exactly 'jittersamples 0.3'"
      - "jitterdebugger -h prints its general usage"
      - "jittersamples -h prints its directory usage"
      - "jitterplot has a Python shebang"
      - "jittersamples creates a non-empty samples.csv"
      - "samples.csv contains exactly one expected record"

assertion_count: 8
