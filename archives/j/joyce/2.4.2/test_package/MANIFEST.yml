package: joyce/2.4.2
homepage: "https://www.seasip.info/Unix/Joyce/"

upstream_check_command: "make check"
upstream_test_in_build: true
# joyce's LibDsk/tools/Makefile.am declares `check_PROGRAMS = check1 check2 check3`
# but sets NO `TESTS = $(check_PROGRAMS)`, so the automake `make check` target only
# BUILDS those binaries and runs nothing (no # TOTAL / PASS: / FAIL: summary).  The
# three genuine upstream tests are therefore executed directly (each binary's real
# exit status), after `make check` has built them.
upstream_test_command: "make -j1 check && ./LibDsk/tools/check1; ./LibDsk/tools/check2; ./LibDsk/tools/check3"

# The joyce 2.4.2 source tree bundles LibDsk.  Its LibDsk/tools/Makefile.am
# registers `check_PROGRAMS = check1 check2 check3`, which the top-level
# automake `make check` builds and runs through the automake test-driver.
# This is the official autotools registration count for this upstream version.
upstream_tests_exist: true
upstream_test_total: 3
upstream_test_count_method: autotools_tests

upstream_tests:
  - file: LibDsk/tools/check1.c
    source: joyce-2.4.2/LibDsk/tools/check1.c
    description: "LibDsk geometry round-trip: dg_ps2ls/dg_ls2ps over 80x2x9 sectors."
    command: "./check1"
  - file: LibDsk/tools/check2.c
    source: joyce-2.4.2/LibDsk/tools/check2.c
    description: "Opens host floppy /dev/fd0, reads a 512-byte sector via dsk_open/dsk_pread."
    command: "./check2"
  - file: LibDsk/tools/check3.c
    source: joyce-2.4.2/LibDsk/tools/check3.c
    description: "Opens host floppy /dev/fd0, tracks 0 via dsk_open/dsk_ptread."
    command: "./check3"

# check2/check3 open a physical /dev/fd0 floppy device which is not present on
# HarmonyOS PC (no floppy hardware), so they fail on-device with a concrete
# ohos_feature reason; check1 is a pure geometry computation and passes.

test_package_tests:
  - file: test.sh
    description: "Consumer smoke test: run installed dskconv -formats (format list + exit code)."
    command: "sh test.sh <bindir>/dskconv (invoked via conanfile.py test() self.run)"

assertion_count: 2
