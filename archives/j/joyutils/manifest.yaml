software: joyutils
display: "joyutils"
description: "jscal, jstest and related utilities for the Linux joystick driver"
category: hardware
homepage: "https://sourceforge.net/projects/linuxconsole"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Builds only the joystick utilities (DISABLE_INPUTATTACH=1 DISABLE_FORCEFEEDBACK=1), avoiding the SDL2 dependency."
    - "No Conan package dependencies are declared."
    - "Consumer test executes installed jstest/jscal through 4 hardware-free checks."
  common_dependencies: []

versions:
  "1.8.1":
    status: built
    build_date: "2026-10-15"
