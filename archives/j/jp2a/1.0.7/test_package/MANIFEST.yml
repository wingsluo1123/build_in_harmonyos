# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: jp2a/1.0.7
homepage: "https://github.com/cslarsen/jp2a"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: run-tests.sh
    source: jp2a-1.0.7/tests/run-tests.sh
    description: "Shell-based integration tests comparing jp2a output against reference files"
    command: "./run-tests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test - verifies jp2a binary runs with --version"
    command: "./jp2a --version"

# 测试断言总数
assertion_count: 1
