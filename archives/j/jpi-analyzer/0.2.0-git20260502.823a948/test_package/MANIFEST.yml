tests:
  - name: ohos-jpi-analyzer-e2e
    type: conan-test-package
    file: test_ohos_jpi_analyzer.py
    origin: port-added (OHOS-specific, this adaptation run)
    assertions:
      - OHOS-T1: conan-injected PYTHONPATH resolves the packaged jpi_analyzer and its dependency click in the ohos-aarch64 target env
      - OHOS-T1: click satisfies upstream floor click>=8.1 and jpi_analyzer exposes cli.main
      - OHOS-T2: test runs under the AArch64 target interpreter of the ohos-aarch64 profile (device python >= 3.10)
      - OHOS-T3: packaged console scripts jpi-analyzer/jpia execute for real on the target
      - OHOS-T3: jpi-analyzer info parses a synthesized JPI sample and reports tail/model/flight metadata
      - OHOS-T3: jpi-analyzer csv decodes flight records and writes flight_1.csv with header and real metric values

upstream_tests: none
upstream_tests_note: >-
  Upstream commit 823a948bf005941275b9c6d93bfc8037be63239d (and e1a34c3) ships no
  tests/ directory, pyproject declares no pytest/test extra, and no CI workflow
  files exist; README documents manual CLI usage only. Recorded as
  NO_UPSTREAM_TESTS; verification is the port-added OHOS end-to-end test above.
