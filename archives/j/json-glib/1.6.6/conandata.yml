# 0001: replace gnome.mkenums() with pre-generated enum files to avoid
#   subprocess permission issues in the CI sandbox (gnome.mkenums spawns
#   python3 which fails under HMDFS fifo restrictions).
patches:
  - patch_file: "patches/0001-meson-enum-types.patch"
    patch_description: "Use pre-generated enum files instead of gnome.mkenums to avoid subprocess permission issues on OHOS"
    patch_type: "portability"
