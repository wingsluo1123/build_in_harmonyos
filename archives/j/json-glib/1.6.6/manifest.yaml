software: json-glib
# 版本级 manifest
# 文件位置: archives/j/json-glib/1.6.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.6"

# 编译状态
status: published

# 编译日期
build_date: "2026-08-06"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://repo.huaweicloud.com/gnome/sources/json-glib/1.6/json-glib-1.6.6.tar.xz"
  mirror_urls:
    - "https://download.gnome.org/sources/json-glib/1.6/json-glib-1.6.6.tar.xz"
  sha256: "96ec98be7a91f6dde33636720e3da2ff6ecbb90e76ccaa49497f31a6855a490e"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "--default-library=static"
    - "-Dintrospection=disabled"
    - "-Dgtk_doc=disabled"
    - "-Dtests=false"
    - "-Dman=false"
  dependencies:
    - glib2/2.88.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "glib2 Conan package only declares pkg_config_name='glib-2.0'; meson's dependency('gio-2.0') needs gio-2.0.pc from glib2's lib/pkgconfig/ with prefix=/ fixed"
  - "gnome.mkenums() needs glib-mkenums from glib2's bin/; add glib2 bin to PATH in generate()"
  - "PkgConfigDeps-generated .pc files lack custom variables like glib_mkenums; use meson-generated .pc files from the package instead"
  - "OHOS-adapted Conan lacks meson_layout; use basic_layout instead"
