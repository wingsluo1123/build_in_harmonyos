# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: json-glib/1.6.6
homepage: "https://wiki.gnome.org/Projects/JsonGlib"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-generator.c
    source: json-glib-1.6.6/json-glib/tests/test-generator.c
    description: "Test JSON generator functionality"
    command: "./test-generator"
  - file: tests/test-parser.c
    source: json-glib-1.6.6/json-glib/tests/test-parser.c
    description: "Test JSON parser functionality"
    command: "./test-parser"
  - file: tests/test-object.c
    source: json-glib-1.6.6/json-glib/tests/test-object.c
    description: "Test JSON object operations"
    command: "./test-object"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Parse JSON string and verify field access via json-glib API"
    command: "./test_json_glib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
