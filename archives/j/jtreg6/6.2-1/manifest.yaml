  source_orig_dir: /storage/Users/currentUser/work/kasumizawa-miyuu/tmp/builds/jtreg6-6.2-1.orig
  source_work_dir: /storage/Users/currentUser/work/kasumizawa-miyuu/tmp/builds/jtreg6-6.2-1.work
