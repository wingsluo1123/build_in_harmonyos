software: jtreg6
display: "jtreg (JDK Regression Test Harness)"
description: "OpenJDK 官方 JDK 回归测试框架 jtreg（命令行工具 + Java 测试库），上游 6.2+1"
category: build-tool
homepage: "https://github.com/openjdk/jtreg"
license: GPL-2.0-only WITH Classpath-exception-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "HarmonyOS 的 uname -s 返回 HarmonyOS，上游 make/Platform.gmk 需按 Linux 处理（否则 PS 变成 Windows 分号，javac -Werror 失败）"
    - "JDK 17 的 javac -Xlint:all 含 removal 类别（JEP 398 将 Applet 标记 forRemoval），旧基线 -Werror 构建需在 lint 列表排除 removal"
    - "构建依赖 Ant/JT Harness/JCov/AsmTools/JUnit/TestNG 由上游 build.sh 下载并校验；Ant 预取缓存于 ~/apache-ant-1.10.8，Maven 依赖走阿里云镜像"
    - "raw.githubusercontent.com 不可达：TestNG LICENSE 从 GitHub testng 源码 tarball 提取（sha1 钉校验）"
    - "设备 toybox wget 不支持 -q：配方生成 wget→curl shim"
    - "需要 BiShengJDK 17+（缺失时经 cmd-pkgs 自动安装到 ~/bishengjdk17）"
  common_dependencies: []

versions:
  "6.2-1":
    status: built
    build_date: "2026-10-14"
