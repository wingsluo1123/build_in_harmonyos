  # 官方 GitHub release/tag tarball（conandata.yml 中列首位）
  url: "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.14.tar.gz"

  # 与 conandata.yml 一致（对应 gitee mirrors_juce-framework 镜像 tag tarball）
