# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 沙箱 mkfifo() 返回 EPERM → JUCE NamedPipe（POSIX FIFO）不可用，上游 NamedPipe 单测在该平台恒失败（实测 python os.mkfifo → PermissionError[EPERM]）"
  - "OHOS 文件系统上上游 Files 单测（大量小文件写/删/属性校验）不收敛：>4 分钟 CPU 无输出推进，需在 test_package 侧隔离"
  - "JUCE 单测随模块源码编译（JUCE_UNIT_TESTS=1），可在源码+头文件型消费包里用 UnitTest::getAllTests() 运行时枚举并逐套 fork 执行（本包实测 93 套 / 91 通过 / 2 套环境排除）"
