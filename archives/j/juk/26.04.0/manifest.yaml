# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kio/6.26.0 在本制品仓是 KIOCORE_ONLY（无 KIOWidgets/KIOFileWidgets），需要 widgets 的消费方必须钉 kio/6.14.0"
  - "制品仓 KF6 模块按版本覆盖不均（无 6.26 的 kconfigwidgets/kdbusaddons 等、无 6.14 的 kglobalaccel），必须逐模块取可用版本并用 override 统一共享基底"
  - "zlib/1.3.1 的静态 binary 非 PIC（clang 构建），下游以链接期 relocation R_AARCH64_... 报错；钉 zlib/1.3.2"
  - "conan taglib/2.3 导出 TagLib::tag，上游 CMake 找 Taglib::Taglib → 在 generate() 注入别名，不改上游 CMake"
  - "OHOS kdoctools 缺 DocBook 4.5 DTD，KF6 handbook 文档链必须裁掉"
  - "制品仓 KF6 二进制带构建机绝对路径 DT_NEEDED（E537），test_package 运行前须物化这些路径并落 scratch CWD"
  - "OHOS loader 无法处理含空白的 host LD_LIBRARY_PATH，需显式列出 /system/lib64* 目录"

