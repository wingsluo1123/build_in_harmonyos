# conandata.yml — juke 0.7
# Canonical distfiles mirror (used as MASTER_SITES by pkgsrc audio/juke).
# Original homepage http://johan.nocrew.org/nav10/unix/juke/ is no longer reachable.
# SHA256 cross-checked against FreeBSD ports (audio/juke, size 64103).
# Download reliability: moll.no intermittently serves a transport-decompressed
# 266240-byte tar under the .tar.gz name (sha 9a5eb5cf...), failing the hash
# check. pkgsrc distfiles hosts byte-identical 64103-byte gzip (verified same
# size + sha256 locally), so it is listed first; the original URL stays last
# as fallback. sha256 unchanged. Mirror uses http because the host has no
# valid https certificate (verified: https fails certificate check).

sources:
  url:
    - "http://ftp.pkgsrc.org/pub/pkgsrc/distfiles/juke-0.7.tar.gz"
    - "https://www.moll.no/oyvind/distfiles/juke-0.7.tar.gz"
  sha256: "b19d6bb46ece9f47b07bcd52e371b447fbef580ffb9ded59257305962f47cae0"
