software: just
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.43.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.43.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/casey/just/archive/refs/tags/1.43.1.tar.gz"

  # 源码校验和
  sha256: "741b5c6743501dc4dbd23050dd798f571d873d042b67bcea113d622b0c37d180"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 预编译二进制信息 (Rust 项目，rustc 在 OHOS 上不可用)
binary:
  url: "https://ghfast.top/https://github.com/casey/just/releases/download/1.43.1/just-1.43.1-aarch64-unknown-linux-musl.tar.gz"
  sha256: "e28e1f18cecd45d35f9fb39ef3651dd79c0623cb29a2f375ea7a1a185ac32dc9"
  binary_sha256: "dd6f2732327fa52387474a63db6b1b4175b6164ffe808675883a509731e3b9d0"
  loader: elfldr

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - elfldr  # OHOS ELF 加载器，用于加载 musl 静态二进制

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "rustc 1.87.0 在 OHOS 上段错误 (SIGSEGV)，所有 Rust 项目需使用预编译 musl 二进制 + elfldr 方案"
  - "elfldr 可成功加载 aarch64-unknown-linux-musl 静态 PIE 二进制在 OHOS 上运行"
  - "GitHub 下载需使用 ghfast.top 镜像 (E017) 避免超时"
  - "Conan 2.x test_package 需使用 self.dependencies[xxx].package_folder 替代已移除的 deps_cpp_info"
