# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: just/1.43.1
homepage: "https://github.com/casey/just"

# 上游测试命令 (just 使用 cargo test，但 rustc 在 OHOS 上不可用)
upstream_check_command: "cargo test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无法在 OHOS 上运行，rustc SIGSEGV)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "smoke test: just-wrapper --version"
    command: "just-wrapper --version"
    expected_output: "just 1.43.1"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
