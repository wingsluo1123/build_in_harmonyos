software: jwt-cli

# 版本号
version: "6.2.0"

# 编译状态
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# 源码信息
source:
  url: "https://github.com/mike-engel/jwt-cli/archive/refs/tags/6.2.0.tar.gz"
  sha256: "49d67d920391978684dc32b75e553a2abbd46c775365c0fb4b232d22c0ed653a"
  tar_format: tar.gz

# 构建配置
build:
  # Rust 项目使用 cargo 构建，非 autotools/cmake
  system: cargo
  configure_options: []
  # Rust 编译参数
  # --target aarch64-unknown-linux-ohos (OHOS 交叉编译目标三元组)
  # --release (发布构建)
  dependencies: []
  # Rust 依赖通过 Cargo.toml 管理，无需外部依赖
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []
# 无需补丁，源码原生兼容 OHOS 平台

# 知识沉淀
knowledge_gained:
  - "Rust 项目使用 cargo build --target aarch64-unknown-linux-ohos 进行 OHOS 交叉编译"
  - "OHOS auto-sign 会对编译产物自动签名，需注意 target dir 路径避免 Text file busy"
  - "jwt-cli 是纯二进制工具包，无共享库输出，package_info 中 libdirs/includedirs 置空"
