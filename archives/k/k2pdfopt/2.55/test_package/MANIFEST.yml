# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: k2pdfopt/2.55
homepage: "https://willus.com/k2pdfopt/"

# 上游无自动化测试套件（源码包内无 make check / ctest / 测试目录）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.pdf + conanfile.py test()
    description: "端到端转换测试：运行打包后的 k2pdfopt 可执行文件，将内嵌的单页 PDF（含两行文字）经 MuPDF 渲染 -> k2pdfopt 页面优化 -> 输出 k2out.pdf，并断言输出存在且以 %PDF- 开头"
    command: "k2pdfopt -ui- -o k2out.pdf test.pdf"

# 测试断言总数
assertion_count: 2
