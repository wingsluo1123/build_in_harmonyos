# ============================================================
knowledge_gained:
  - "纯 Python tkinter GUI 应用（无 CLI 入口，但有脚本主程序）以无构建/打包族配方交付：copy 全部 .py 至 lib/python3.12/site-packages + 生成 bin/k40-whisperer 启动包装（--version/--help 直接响应，真实启动因缺 _tkinter/lxml 失败时给明确诊断）+ commands.json（R38）"
  - "上游 try/except 可选依赖（pyclipper/pyusb）与硬依赖（lxml/pillow）判定：读代码确认 import 是否有 try 保护后再决定 requirements() 声明与否；未发布硬依赖按 R36 不声明并在 manifest/notes/test_package 三处如实标注依赖缺口"
