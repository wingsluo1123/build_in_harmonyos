# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kaccounts-integration/26.04.0
homepage: "https://invent.kde.org/network/kaccounts-integration"

# 上游测试清点（R51 申报表）：26.04.0 release tarball 内无 tests/ 或
# autotests/ 目录（已实测解压目录树确认），上游不随源码发布单元测试套件。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kaccounts_integration.cpp
    description: "消费者冒烟测试：find_package(KAccounts6) 解析 + 链接 KAccounts6 目标 + kaccounts_add_provider 宏真实消费 + Accounts::Manager/Provider 离线 API（列举 provider/service、loadProvider 未找到路径）"
    command: "./test_kaccounts_integration"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
