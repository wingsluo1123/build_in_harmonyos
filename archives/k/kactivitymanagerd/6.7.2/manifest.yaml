# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "大小写不敏感文件系统: <features.h>/<version.h> 与项目同名头文件冲突，需改名（含 AUTOMOC moc_ 引用同步）"
  - "conandata 补丁只支持修改型；文件重命名/新增需在 source() 内完成，且 source() 禁止访问 self.settings"
  - "KF6 依赖库无 DT_SONAME 导致产物 DT_NEEDED 含绝对路径，package() 用 patchelf --replace-needed 改写为 basename（alkimia 先例）"
  - "HarmonyOS 无 Platform 模块需设置 CMAKE_SHARED_LIBRARY_SONAME_*_FLAG（kglobalaccel 先例）"
  - "DBus 能力用 qtbase-sql-dbus 超集包（kglobalaccel 先例），generate() 中最后 PREPEND 其 cmake 路径保证 find_package(Qt6) 命中"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

