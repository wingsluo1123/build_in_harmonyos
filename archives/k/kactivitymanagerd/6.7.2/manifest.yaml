# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DESIGNERPLUGIN=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "qtbase-sql-dbus/6.11.1"
    - "kdbusaddons/6.29.0"
    - "kcoreaddons/6.26.0.1"
    - "kcrash/6.26.0"
    - "ki18n/6.26.0"
    - "kconfig/6.26.0"
    - "kglobalaccel/6.26.0"
    - "kxmlgui/6.26.0"
    - "kio/6.26.0"
    - "boost/1.85.0"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

