      整组 KF6 保持 6.18.0 家族以匹配已发布的 OHOS 二进制，避免任何
      force 覆盖导致依赖 package_id 失效而被迫从源码重建；
      kirigami-addons/1.13.0 经传递依赖引入 DBus/SQL 版 qtbase-sql-dbus/6.11.1。
    removed:
      - "kdoctools（KF6 DocTools 经 patches/0001-CMakeLists.txt.patch 关闭）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch（OHOS 跳过 KF6 DocTools：kdoctools/6.19.0 钉 karchive/6.19.0 与 kiconthemes/6.18.0.1 的 karchive/6.18.0 冲突；帮助手册非生成器功能所必需。kfourinline/ksnakeduel 26.04.x 先例）"
  - "0002-src-application-generator.cpp.patch（OHOS 上 QFile::copy() 恒返回 false，模板落盘改为手动 read+write；否则生成器静默 0 输出）"
  - "0003-src-templates-C++-CMakeLists.txt.patch（模板归档由 .tar.bz2 改为 .zip：karchive WITH_BZIP2=OFF 无法读 bz2，generator 经 KZip/zlib 读 .zip）"

knowledge_gained:
  - "已发布 KF6 共享库携带过期绝对 DT_NEEDED（指向构建机 $HOME/.cache/conan2/...）与 build-tree 相对 DT_NEEDED（../../bin/libX.so）；消费者运行需按 accessibility 26.04.3 先例做 link farm + 绝对依赖物化"
  - "kdoctools/6.19.0 的 generate() 直接引用 self.dependencies[\"zstd\"]（经 karchive/6.19.0 传递）；若把 karchive force 到无 zstd 的 6.26.0 会让其闭包丢失 zstd 而 KeyError"

