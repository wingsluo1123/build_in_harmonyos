# test_package/MANIFEST.yml — karabo-bridge 0.6.2
#
# 上游测试入口 (karabo_bridge/tests/): pytest 框架, 使用 ZeroMQ IPC transport.
# 上游测试需 pyzmq, msgpack, msgpack-numpy, numpy, h5py, pytest 等 Python 依赖,
# 且依赖 ZeroMQ C 库的 IPC (ipc://) transport — 在 OHOS R32 平台上 IPC 语义
# 可能受限, 故 upstream_test_in_build=false, 由 test_package 做消费者 smoke test.
#
# test_package smoke tests (5 assertions, R34 实质测试 — 实际调用 API):
#   1. import karabo_bridge — 模块导入 + __version__ == "0.6.2"
#   2. Client class 可导入且为 class — Client 类存在
#   3. ServerInThread + Sender class 可导入且为 class — Server/Sender 类存在
#   4. serialize() 真实调用 — 真实数据 → 消息列表
#   5. serialize/deserialize 真实往返 — 标量 + numpy 数组 round-trip 一致
# （PR 审查 P1 改正：原测试仅 find_spec/AST 检查未调用 API，现为真实 API 调用。）

package: karabo-bridge/0.6.2
homepage: "https://github.com/European-XFEL/karabo-bridge-py"

upstream_check_command: "python3 -m pytest karabo_bridge/tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: karabo_bridge/tests/test_serialize.py
    source: "karabo_bridge-0.6.2/karabo_bridge/tests/test_serialize.py"
    description: "serialize/deserialize round-trip (pytest, needs msgpack+numpy+zmq)"
    command: "python3 -m pytest karabo_bridge/tests/test_serialize.py"
    result: unrunnable
  - file: karabo_bridge/tests/test_server.py
    source: "karabo_bridge-0.6.2/karabo_bridge/tests/test_server.py"
    description: "ServerInThread REQ/REP + PUSH (pytest, needs zmq IPC transport)"
    command: "python3 -m pytest karabo_bridge/tests/test_server.py"
    result: unrunnable
  - file: karabo_bridge/tests/test_client.py
    source: "karabo_bridge-0.6.2/karabo_bridge/tests/test_client.py"
    description: "Client next() REQ/REP (pytest, needs zmq IPC transport)"
    command: "python3 -m pytest karabo_bridge/tests/test_client.py"
    result: unrunnable

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test（R34 实质测试）: import + 版本 + Client/ServerInThread/Sender 类 + serialize/deserialize 真实往返"
    command: "bash test.sh"
    result: "5/5 PASS（实测：本机 python3 具备 msgpack/msgpack-numpy/numpy，zmq 27.1.0 可用；serialize/deserialize 无需真实 IPC 连接即可往返）"

# 测试断言总数
assertion_count: 5
