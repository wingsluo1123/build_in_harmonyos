# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: karchive/6.19.0
homepage: https://invent.kde.org/frameworks/karchive

# karchive 上游 autotests 需 Qt6 + bzip2/liblzma/openssl/libzstd，CI worker 预置后可跑，
# 本 test_package 仅做消费者视角的 KF6::Archive 链通验证（R34 实质调用 API）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 测试实质调用被测包 API — find_package(KF6Archive) + KZip 构造验证链通
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(KF6Archive REQUIRED CONFIG) + target_link_libraries KF6::Archive + KZip 构造 — 验证 KF6Archive 库已正确安装且 KArchive API 可调用"
    command: "cmake --build"

# 测试断言总数 (find_package 成功 + KF6::Archive 链接通过 + KZip 构造可调用 + test_karchive 退出码 0)
assertion_count: 4
