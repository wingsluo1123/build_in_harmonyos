knowledge_gained:
  - "zlib/1.3.1 的 ohpcd 二进制包内 libz.a 非 PIC: 链入共享库报 relocation R_AARCH64_ADR_PREL_PG_HI21 cannot be used against symbol 'z_errmsg'。修复不必重建 zlib: 给共享库链接加 -Wl,--exclude-libs,ALL 隐藏静态归档符号即可 (OHOS clang 15 实测)。"
  - "qt5-qtbase/5.15.2.2 的 package id 绑定 zlib/1.3.1; 其 profile 无 tools.build:compiler_executables, 一旦图里换成 zlib/1.3.1.1 就会触发 qtbase 源码重建并失败。保持 zlib/1.3.1 是整条 KF5 5.116 链的前提。"
  - "karchive5 原 5.116.0 配方用 self.requires('zlib/1.3.1.1', force=True) 绕非 PIC 链接墙, 但该 force 会污染所有消费者的 zlib 解析并拖垮 qtbase 二进制复用 (R37 版本递增后改回 1.3.1)。"
  - "KArchive 的上游测试: autotests/ 的 ecm_add_tests 3 项 + ecm_add_test 2 项共 5 项进入 CTest; tests/ 下 5 个可执行文件只被 ecm_mark_as_test() 标记(不调用 add_test), 会被构建但不会被执行, 数测试时不能把它们算进 CTest。"
  - "OHOS 应用沙箱拒绝 symlink() (errno 13 EACCES, $HOME 与应用数据目录实测均如此); 依赖真实符号链接的测试需做运行期能力探测, 否则上游 initTestCase 的 QVERIFY(false) 会直接判整个测试程序失败。"
patch_generation:
  method: "manual unified diff (portability)"
  notes: "0001-karchivetest-symlink-eacces.patch 仅改 autotests/karchivetest.cpp: 增加 s_symlinksAvailable 运行期标志, initTestCase 中 symlink 失败改为告警+置 false, 并条件化 writeTestFilesToArchive/testFileData/testCopyTo/testReadTar/testReadZip/testRead7Zip 中所有 symlink 专项校验与列表计数。其余适配仍经由 CMake 选项/工具链变量与链接标志完成 (KF_IGNORE_PLATFORM_CHECK / KF_SKIP_PO_PROCESSING / SONAME / CMAKE_FIND_PACKAGE_PREFER_CONFIG / --exclude-libs,ALL)。"
