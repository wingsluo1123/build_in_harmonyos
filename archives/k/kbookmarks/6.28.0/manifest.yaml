knowledge_gained:
  - "kbookmarks 6.28.0 requires KF6Config, KF6CoreAddons and KF6WidgetsAddons at KF_DEP_VERSION 6.28.0; patches/0001 lowers the floor to 6.26.0 because ohpcd publishes kconfig/kcoreaddons only up to 6.26.0.1 while kwidgetsaddons is at 6.28.0 (kcontacts 6.28.0 precedent)."
  - "download.kde.org 302-redirects to a regional mirror (mirrors.bfsu.edu.cn from CN networks) that can fail TLS certificate verification on both campus and device networks; conan get()/download() natively accept a URL list (first = primary, rest = mirrors on download error), so conandata.yml lists the official URL plus three sha256-verified authoritative mirrors (R39)."
  - "KF_SKIP_PO_PROCESSING=ON is a no-patch way to skip po/qm processing: ECM's ecm_process_po_files_as_qm() returns early when the option is set (verified in the ECM 6.26/6.28 sources on device), so no Qt6LinguistTools lookup happens."
  - "The 6.26->6.28 CMake delta is tiny: cmake_minimum_required 3.16->3.29, KF_VERSION/KF_DEP_VERSION, ECM 6.18->6.28, REQUIRED_QT_VERSION 6.7->6.9, deprecation floors; src/widgets/CMakeLists.txt only moves KF6::Bookmarks from PRIVATE to PUBLIC; autotests/ and tests/ CMakeLists are byte-identical."
  - "KBookmarkActionMenu derives from KActionMenu (KF6ConfigGui is a PRIVATE link of KF6BookmarksWidgets), so consumers must not instantiate it without linking the ConfigGui target; KBookmarkMenu (plain QObject, QMenu out-parameter) is the safe widgets-side surface for consumer tests."
  - "KBookmarkMenu populates lazily: the constructor only connects to QMenu::aboutToShow (slotAboutToShow checks a dirty flag), so a headless consumer must call the public ensureUpToDate() before inspecting menu.actions(); a null KBookmarkOwner is safe (it is stored, only dereferenced in owner-gated add* slots)."
  - "kbookmarks installs a single KF6BookmarksConfig.cmake exporting both KF6::Bookmarks and KF6::BookmarksWidgets; find_dependency() there only requires KF6WidgetsAddons (plus Qt6Widgets/Qt6Xml) for shared builds."
