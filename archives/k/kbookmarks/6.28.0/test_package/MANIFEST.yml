# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kbookmarks/6.28.0.

package: kbookmarks/6.28.0
homepage: https://invent.kde.org/frameworks/kbookmarks

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error --timeout 60"

upstream_tests:
  - file: autotests/
    source: kbookmarks-6.28.0/autotests/
    description: "KBookmarks upstream CTest/autotests suite (kbookmarktest: XBEL payload, mime data, external file change, manager reload)"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error --timeout 60"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: tests/
    source: kbookmarks-6.28.0/tests/
    description: "Manual upstream bookmark dialog probe executable"
    command: "built by cmake --build; not registered by upstream as a CTest test (ecm_mark_as_test)"
    condition: "not executed because this is a manual/interactive UI probe"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer end-to-end: KBookmarkManager addBookmark/saveAs writes an XBEL file, a fresh manager finds the bookmark by address, and KBookmarkMenu fills a QMenu with it."
    command: "conan create (test_package builds and runs test_kbookmarks)"

assertion_count: 14
