    - patch_file: "patches/0002-canvaswidget-cpp-use-KLocalizedContext.patch"
      patch_description: >
        0002 canvaswidget cpp use KLocalizedContext: KF6::I18nQml
        (KLocalizedQmlContext) is not published in the conan registry, so the
        upstream KI18N >= 6.8 QML i18n context is replaced by the equivalent
        KLocalizedContext from KF6::I18n, which the published ki18n package
        provides (alligator 26.04.0 precedent)
      patch_type: "portability"
