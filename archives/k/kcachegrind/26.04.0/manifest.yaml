knowledge_gained:
  - "kio/6.26.0 在 ohpcd 上是 KIOCORE_ONLY 变体（无 KIOWidgets/KIOGui/KIOFileWidgets）；上游 kcachegrind/CMakeLists.txt 显式链接 KF6::KIOWidgets ⇒ 必须改用带 KIOWidgets 的 kio/6.14.0 并用 override 抬齐到 6.18 闭包（ktimer 26.04.0 先例）。"
  - "kcachegrind 源码只使用 KIO::file_copy（KIOCore）与 KJobWidgets::setWindow（kjobwidgets），KIOWidgets 仅为上游链接期目标 ⇒ 无需裁剪 KIO 功能。"
  - "上游 KF6DocTools 为非 REQUIRED 可选依赖，doc/ 与 kdoctools_install(po) 由 KF6DocTools_FOUND 守卫 ⇒ 不声明 kdoctools 即自动跳过文档子目录，无需补丁。"
  - "KF6 依赖库存在坏 DT_NEEDED：相对形式 `../../bin/<lib>.so` 被加载器按 CWD 解析（含 '/' 的名字绕过 DT_RPATH/LD_LIBRARY_PATH），绝对形式指向构建方 conan home。CI worker 缓存里的 kconfigwidgets/kiconthemes 是上游配方在 worker 上本地重建出来的同 package_id 副本（Conan 不校验同 package_id 的字节一致性），故该缺陷只在 CI 暴露、本开发机不可复现。修法（kteatime/ktimer 26.04.0 先例）：test_package 把依赖 .so 复制到 <conan_cache>/bin 并以 <conan_cache>/recon/kcg 为 CWD 运行测试（_reconstruct_kf6_rpaths）。"
  - "远端 CI 前 6 次尝试全为基础设施故障（worker spawn 资源耗尽 posix_spawn/Resource temporarily unavailable、make Error 127，或 worker 挂死 mkdir 超时 1200s），失败点均在依赖 kio/6.14.0 的源码重建上；按踩坑清单 #10 重触发换 worker，第 7 次才跑到本包的真实失败。"

