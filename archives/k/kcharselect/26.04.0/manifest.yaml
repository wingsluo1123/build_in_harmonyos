test_results:
  upstream: "上游 kcharselect 26.04.0 无任何测试（0 用例）——证据：tarball 无 autotests/、无 tests/ 目录（顶层仅 doc/、pics/、po/、LICENSES/）；CMakeLists.txt 仅 add_executable(kcharselect) + target_sources(kcharselect PRIVATE kcharselectdia.cc kcharselectdia.h main.cc kcharselect.qrc)，未注册任何测试（无 add_test/enable_testing/ecm_add_test，亦无 BUILD_TESTING 守卫；tarball 中仅有的两处 BUILD_TESTING 位于 CMakePresets.json 与 snapcraft.yaml，均只是传 -DBUILD_TESTING=OFF）；doc/CMakeLists.txt 仅 kdoctools_create_handbook；.kde-ci.yml 仅构建依赖元数据 + require-passing-tests-on，未声明测试目标；.gitlab-ci.yml 引入 9 个 KDE 共享模板（linux-qt6 / linux-qt6-next / freebsd-qt6 / windows-qt6 / craft-windows-x86-64-qt6 / flatpak / snap-snapcraft-lxd + xml-lint / yaml-lint），这些模板做构建/打包/lint，仅在项目注册测试时才跑 ctest——本项目未注册。故无上游 ctest 可执行，test_package/MANIFEST.yml 申报 upstream_tests: []"
  test_package: "passed 4 用例 / 5 断言 + 1 鸿蒙特有非断言用例 —— 用例1a 产物存在可执行；用例1b --version 报告 26.04.0；用例2 --help 识别 kcharselect；用例3a --author 输出 KAboutData 作者（Christoph Feck）；用例3b --license 输出二进制 KAboutData 声明的 GPL 许可证文本（上游 main.cc 传 KAboutLicense::GPL，与 COPYING/LICENSES/appdata.xml 的 GPL-2.0+ 一致）；用例4 [鸿蒙特有，非断言] 真实启动 bin/kcharselect，由 OHOS 动态链接器解析完整 DT_NEEDED closure（KBookmarks/KCrash/KXmlGui/KColorScheme 闭包）。证据：reports/conan-create.log 'ALL CONSUMER CASES PASSED (4 用例 / 5 断言 + 1 鸿蒙特有非断言用例)'"
  ohos_run: "passed: conan create（含 test_package 消费者用例）在 HarmonyOS PC 设备（OHOS aarch64 profile）原生执行"
  r40_note: "R40 深适配声明：字符选择器的核心交互（字符表网格渲染、字体/区块切换、搜索、复制到剪贴板、书签菜单、配色方案菜单）在无头 offscreen 平台无法自动断言，仅经 DT_NEEDED closure + 元数据/CLI 路径验证；交互路径需真机人工确认（本 PR 不声称已完成交互验收）。许可证：上游 COPYING / LICENSES/GPL-2.0-or-later.txt 与 appdata.xml（<project_license>GPL-2.0+）为 GPL-2.0-or-later（Conan license=GPL-2.0-or-later）。"

knowledge_gained:
  - "配方设置 CMAKE_BUILD_RPATH/CMAKE_INSTALL_RPATH + -Wl,--disable-new-dtags 并不保证产物带 RPATH：依赖以绝对路径入链时链接行无 -rpath，CMake 安装期只改写已存在的 RPATH → 实测产物 .dynamic 无 DT_RPATH/DT_RUNPATH，运行期必须靠 Conan runenv（package_info → runenv_info LD_LIBRARY_PATH）；连带 CI L2 冒烟对 GUI 应用必然 skip（非阻断） [knowledge_ref: knowledge/drafts/kcharselect-26.04.0-cmake-install-rpath-not-emitted-rely-on-runenv.kv]"
  - "KDE/ECM 工程里 find_package(KF6DocTools) 多为上游**可选**依赖（无 REQUIRED）：OHOS 上不提供 kdoctools 时 doc/ 手册子目录与 kdoctools_install(po) 整段被配置掉，只留一条 CMake Warning 与 feature summary 的『OPTIONAL packages have not been found』，构建/安装不受影响；不要把该 Warning 当依赖缺口，也不要把补 kdoctools 当必需（doc 链还需 DocBook XML 4.5 DTD，poXml 先例） [knowledge_ref: knowledge/drafts/kcharselect-26.04.0-kf6doctools-optional-upstream-doc-subdir-configured-out.kv]"
  - "conan test_package（test_type=explicit）的构建目录就是归档的 test_package/：把 HOME 指向 self.build_folder 会让 KIconTheme/KStyleManager 初始化把 .local/state/<app>staterc 写进归档树（不在 .gitignore 白名单，会被 git add 带进 PR）；HOME/XDG_* 必须指向源码树外 [knowledge_ref: knowledge/drafts/kcharselect-26.04.0-test-package-home-xdg-state-file-archive-pollution.kv]"
  - "kcharselect 26.04.0 无补丁即可在 OHOS 构建：KF6 Bookmarks/CoreAddons/Crash/I18n/WidgetsAddons/XmlGui/ConfigWidgets/IconThemes 均在 ohpcd 6.18.0 闭包内，KF_IGNORE_PLATFORM_CHECK + KF_SKIP_PO_PROCESSING 两个开关即可；KF6DocTools 为上游可选依赖，不提供时 doc/ 手册与 kdoctools_install(po) 被配置掉（构建成功关键） [knowledge_ref: knowledge/drafts/DRAFT-kf-metainfo-platform-whitelist-ignore-flag.kv, knowledge/drafts/DRAFT-kf-skip-po-processing-gettext-toolchain.kv]"
  - "已发布 KF6 6.18.0 库的 path-form DT_NEEDED 有两类：相对 \"../../bin/libX.so\" 与构建机绝对路径；OHOS 按符号链接路径解析相对条目，消费者测试需归一化为 SONAME + 重签名 [knowledge_ref: knowledge/drafts/DRAFT-14403-registry-so-no-soname-dynstr-normalize-resign.kv, knowledge/drafts/DRAFT-E5xx-registry-so-baked-absolute-needed-symlink.kv]"
  - "ECM_MODULE_PATH 与 conan_cmakedeps_paths.cmake 必须手工补齐：CMakeDeps 不对 cmake_find_mode=none 的 qtbase/KF6 包加入 CMAKE_PREFIX_PATH，其生成的 ECMConfig.cmake 也不传播 ECM_MODULE_PATH [knowledge_ref: knowledge/drafts/DRAFT-13796-qqc2-breeze-style-6.7.5-kf6-ecm-cmakedeps-bridge.kv]"
