knowledge_gained:
  - "kcmutils 6.28.0 src/qml (kcmutilsqmlplugin) still links KF6::KIOGui; ohpcd kio/6.26.0 is a KIOCORE_ONLY baseline without KIOGui, so the QML plugin stays cut behind KCMUTILS_BUILD_QML_PLUGIN while KCMUtilsCore/KCMUtilsQuick/KCMUtils remain fully functional."
  - "6.28.0 raises KF_DEP_VERSION to 6.28.0 while the published KF6 line stops at 6.26.0; patch 0001 lowers the dependency floor (and the kconfigwidgets cap to 6.18.0) while the kcmutils version itself stays 6.28.0."
  - "6.28.0 adds kcmshell6 --smoke-test CTest rows; the QML row needs the cut org.kde.kcmutils QML module and is guarded, while the widget row loads the fakekcm fixture from the build-tree plugin namespace (<build>/bin/plasma/kcms/systemsettings_qwidgets, resolved through QCoreApplication::libraryPaths())."
  - "kinfocenter (task #12847) consumes the widget path (KPageDialog/KCMultiDialog via KF6::KCMUtils), which does not require the declarative QML plugin."
  - "test_package runtime lookup must follow the ctest process CWD: source-built dependency binaries on CI record relative DT_NEEDED entries such as ../../bin/libKF6ConfigCore.so, and musl resolves slash-containing names against the process CWD (the test_package build folder). The package mirrors exactly the referenced dependency libraries to normpath(build_folder/<needed>) with a copy2 fallback for HMDFS, instead of relying on conan-process-CWD-relative bindirs."
