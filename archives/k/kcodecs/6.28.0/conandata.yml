# conandata.yml — kcodecs 6.28.0
# Same OHOS adaptation set as 6.26.0.1, plus the device symlink fix
# (CMAKE_PLATFORM_NO_VERSIONED_SONAME in conanfile.py). Patch 0003 was
# regenerated for the 6.28.0 source tree (upstream dropped the <stdio.h>
# include and the Q_OS_WIN block its hunk context relied on); patches
# 0001/0002/0004/0005 are byte-identical to 6.26.0.1.
#
# download.kde.org is a Mirrorbits redirector; on some networks the mirror
# it selects answers with a broken (demo) TLS certificate (mirrors.bfsu.edu.cn
# observed failing from the device network), so two authoritative KDE mirrors
# are listed as fallbacks (R39: official source or authoritative mirror). The
# sha256 below pins the identical official tarball whichever mirror answers
# first.

sources:
  url:
    - "https://download.kde.org/stable/frameworks/6.28/kcodecs-6.28.0.tar.xz"
    - "https://mirrors.nju.edu.cn/kde/stable/frameworks/6.28/kcodecs-6.28.0.tar.xz"
    - "https://mirrors.aliyun.com/kde/stable/frameworks/6.28/kcodecs-6.28.0.tar.xz"
  sha256: "b0a9ae34b389c6460adad5323d21bb9e43638acb58da9685f8dc8d821c38a4d8"

patches:
  "6.28.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
    - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    - patch_file: "patches/0003-src-kcodecs.cpp.patch"
    - patch_file: "patches/0004-autotests-CMakeLists.txt.patch"
    - patch_file: "patches/0005-src-kcharsets.cpp.patch"
