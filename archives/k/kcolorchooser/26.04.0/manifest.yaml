version: "26.04.0"
software: kcolorchooser
status: built
build_date: "2026-10-15"
build_system: cmake

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kcolorchooser-26.04.0.tar.xz"
  sha256: "8595c4294a087b516d55443ea009b8fdcb2e9fd798f550acc6a6c11fdcca1f24"
