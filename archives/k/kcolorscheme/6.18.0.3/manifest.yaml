knowledge_gained:
  - "kcolorscheme 6.18.0 requires KF6Config, KF6GuiAddons, and KF6I18n at KF_DEP_VERSION 6.18.0."
  - "With Qt 6.10 or newer upstream requires Qt6GuiPrivate; the recipe relies on qtbase/6.11.1 to provide it."
  - "KF_SKIP_PO_PROCESSING=ON skips translation catalog generation while preserving the library target."
