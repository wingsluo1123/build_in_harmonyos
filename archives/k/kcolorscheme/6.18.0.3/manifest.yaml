  - "修法：依赖改为带 SONAME 的 kguiaddons/6.18.0.1（override=True）+ 自身注入 CMAKE_SHARED_LIBRARY_SONAME_*_FLAG，使重建后的二进制只记 soname 或包目录路径。"
