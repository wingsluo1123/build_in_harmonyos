knowledge_gained:
  - "kcompletion 6.28.0 raises ECM to 6.28.0 and KF_DEP_VERSION to 6.28.0; ohpcd publishes kcodecs/kconfig only up to 6.26.0.1 while kwidgetsaddons is at 6.28.0, so patches/0001 lowers KF_DEP_VERSION to the 6.26.0 common floor that satisfies all three find_package() calls (kbookmarks 6.28.0 precedent)."
  - "The 6.26.0 -> 6.28.0 delta is confined to the top-level CMakeLists.txt (KF_VERSION/KF_DEP_VERSION, ECM minimum 6.28.0, deprecation floor KF 6.23 -> 6.27) plus five poqm updates (ia, nb, nn, se, ug); src/, autotests/ and tests/ are byte-identical."
  - "KLineEdit and KComboBox makeCompletion() overloads are protected; consumers drive completion through public KLineEdit::doCompletion() and, for an editable KComboBox, qobject_cast<KLineEdit *>(combo.lineEdit()) first (doCompletion is public since KDE 4.2.1)."
  - "The three programs in tests/ (kcomboboxtest, kcompletionuitest, klineedittest) run QApplication::exec() and never return on their own, so a ctest timeout would be recorded as a failure; exclude them with -E and run each offscreen under a 15 s timeout, where still-running = launch-alive PASS (kglobalaccel 6.28.0 precedent)."
  - "HMDFS rejects symlink() with EPERM, so CMake's versioned .so chain cannot be created on device: CMAKE_PLATFORM_NO_VERSIONED_SONAME=ON plus explicit -Wl,-soname, flags in both plain and cache variables keeps a real DT_SONAME with an unversioned file name (kwidgetsaddons/kbookmarks 6.28.0 precedent)."
  - "KF_SKIP_PO_PROCESSING=ON skips po/qm catalog generation without a source patch (ECM's ecm_process_po_files_as_qm() returns early), avoiding Qt6LinguistTools; BUILD_DESIGNERPLUGIN=OFF avoids the unpublished Qt6UiPlugin."
