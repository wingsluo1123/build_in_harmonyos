# conandata.yml — kconfig 6.28.0
# Same OHOS adaptation set as 6.26.0.1 (DT_SONAME fix included from the
# start) plus QML ON: the org.kde.config module is built with
# qtdeclarative/6.11.1 and the upstream poqm step runs with
# qt6linguisttools/6.11.1, so the patch is reduced to the kconfigtest
# build-out guard for the C++20 chrono calendar types.

