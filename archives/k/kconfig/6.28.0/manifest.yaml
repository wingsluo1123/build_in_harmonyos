knowledge_gained:
  - "kconfig 6.28.0 with KCONFIG_USE_QML=ON (upstream default) builds and ships the org.kde.config QML module (KAuthorized singleton, WindowStateSaver, KConfigPropertyMap) under lib/qml/org/kde/config; qtdeclarative/6.11.1 provides Qt6Qml/Qt6Quick and qtshadertools/6.11.1 joins the graph because Qt6Quick links Qt6::ShaderTools."
  - "The upstream poqm translation step runs in 6.28.0 (qt6linguisttools/6.11.1 provides Qt6LinguistTools), so the patch hunk that disabled ecm_install_po_files_as_qm in 6.26 and earlier is no longer needed; upstream 6.28.0 requires ECM >= 6.28.0, satisfied by extra-cmake-modules/6.29.0."
  - "Installed tool layout of the KF6 kconfig package: bin/kreadconfig6, bin/kwriteconfig6, bin/kf6/kconf_update and bin/kf6/kconfig_compiler_kf6; consumers reach the XT generator through the installed kconfig_add_kcfg_files CMake function and the KF6::kconfig_compiler imported target rather than a bin/ PATH entry."
  - "KSharedConfig::openConfig(\"name_rc\")->name() returns the identifier as passed (relative); the file lives below XDG_CONFIG_HOME (GenericConfigLocation). Checks that read the raw file must resolve the absolute path via QStandardPaths instead of name()."
  - "QQmlComponent can remain in the Loading state while the org.kde.config plugin finishes resolving; errorString() is empty and create() reports Component is not ready. A bounded wait on statusChanged plus an isReady() check makes QML consumer checks deterministic."
  - "A suite that runs twice per create (ctest round plus direct execution) against one XDG_CONFIG_HOME must remove the rc files it writes at process start; otherwise default-value and first-write checks read the previous round's state."
  - "HarmonyOS PC device builds cannot create symlinks under /storage (Permission denied device-wide), so CMake's versioned shared-library chain fails to link; kpeople/6.28.0 hit the same wall (knowledge E540). The device-local ohos-aarch64-full profile injects a user_toolchain (no-versioned-soname.cmake) that strips VERSION/SOVERSION from every target at end of directory processing; nothing about it ships in the recipes."
  - "Never remove a conan cache package folder with rm -rf: the stale package listing makes the next conan create crash with os.utime FileNotFoundError after Already installed! (rc 7); conan remove \"kconfig/6.28.0\" -c is the clean path."
