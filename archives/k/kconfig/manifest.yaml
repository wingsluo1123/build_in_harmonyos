software: kconfig
display: "KConfig"
description: "KDE Frameworks 6 configuration system (KConfig/KConfigGroup/KConfig XT)"
category: library
homepage: "https://invent.kde.org/frameworks/kconfig"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "6.28.0: KCONFIG_USE_QML=ON (upstream default) ships the org.kde.config QML module (lib/qml/org/kde/config) with qtdeclarative/6.11.1; qtshadertools/6.11.1 joins the graph because Qt6Quick links Qt6::ShaderTools"
    - "6.28.0: the upstream poqm step runs with qt6linguisttools/6.11.1, so the 6.26 poqm-disabling patch is no longer needed (only extra-cmake-modules/6.29.0, required upstream since ECM >= 6.28.0)"
    - "6.26.0.1 and older: KCONFIG_USE_QML=OFF and USE_DBUS=OFF keep the Akonadi KF baseline minimal"
    - "CMAKE_INSTALL_QMLDIR=lib/qml pins the QML module tree next to the libraries (ksvg precedent)"
    - "DT_SONAME restored via CMAKE_SHARED_LIBRARY_SONAME_*_FLAG (OHOS CMake has no Platform/HarmonyOS module); without it DT_NEEDED records build-tree relative paths"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
    - "kconfigtest target needs C++20 chrono calendar types (6.26.0+) - skipped at build time on HarmonyOS (clang 15/libc++/cppstd=17)"
  common_dependencies:
    - qtbase
    - ecm

