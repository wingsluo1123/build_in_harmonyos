knowledge_gained:
  - "kconfigwidgets >= 6.20 makes Qt6GuiPrivate a hard requirement because CMakeLists does find_package(Qt6GuiPrivate REQUIRED) once Qt >= 6.10; qtbase-gui must therefore be a direct requires, not a transitive hope."
  - "Upstream KF_DEP_VERSION 6.20.0 is satisfied by the published 6.26.0 KF line, so a 6.20.0 package can be built without importing a matching 6.20.0 sibling set."
  - "KConfigDialog::addPage() only appends (KPageDialog::addPage); it does not switch currentPage(). Consumer tests must use setCurrentPage() to observe switching."
  - "conan 2.29 sources backup cache stores entries as <cache>/s/<sha256> plus a <sha256>.json metadata sidecar; dropping a bare sha256-named file at the cache root does not hit (the s/ layout is required)."
