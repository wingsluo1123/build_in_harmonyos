# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kconfigwidgets/6.20.0.

package: kconfigwidgets/6.20.0
homepage: https://invent.kde.org/frameworks/kconfigwidgets

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kconfigwidgets-6.20.0/autotests/
    description: "KConfigWidgets upstream autotests (CTest suite)"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: tests/
    source: kconfigwidgets-6.20.0/tests/
    description: "KConfigWidgets upstream tests/ tree (CTest suite)"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke constructs KConfigDialog, verifies exists() registration, addPage() append semantics (no implicit page switch), explicit setCurrentPage() switching across two pages, and teardown."
    command: "conan create (test_package builds and runs test_kconfigwidgets)"

assertion_count: 8
