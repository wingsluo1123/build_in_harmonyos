version: 1

package: kcontacts5/5.116.0
homepage: https://invent.kde.org/frameworks/kcontacts

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    source: "kcontacts-5.116.0/autotests/"
    expected:
      - kcontacts-testroundtrip
      - kcontacts-addresseetest
      - kcontacts-addresstest
      - kcontacts-addressformattest
      - kcontacts-birthdaytest
      - kcontacts-calendarurltest
      - kcontacts-clientpidmaptest
      - kcontacts-contactgrouptest
      - kcontacts-customidentifiertest
      - kcontacts-datetimetest
      - kcontacts-emailtest
      - kcontacts-fieldgrouptest
      - kcontacts-gendertest
      - kcontacts-geotest
      - kcontacts-impptest
      - kcontacts-importexportvcardtest
      - kcontacts-keytest
      - kcontacts-langtest
      - kcontacts-ldifconvertertest
      - kcontacts-nicknametest
      - kcontacts-orgtest
      - kcontacts-picturetest
      - kcontacts-phonenumbertest
      - kcontacts-relatedtest
      - kcontacts-resourcelocatorurltest
      - kcontacts-roletest
      - kcontacts-secrecytest
      - kcontacts-soundtest
      - kcontacts-timezonetest
      - kcontacts-titletest
      - kcontacts-vcarddragtest
      - kcontacts-vcardlinetest
  package:
    status: planned
    source: test.cpp
    command: "./test_kcontacts5"
    description: >-
      Drives the real KContacts public API (Addressee field round-trips,
      Email/PhoneNumber/Address insertion and collection getters,
      VCardConverter create/parse round-trip, ContactGroup with inline
      ContactGroup::Data entries, Picture image data, Geo validity,
      Addressee::mimeType) and asserts HarmonyOS-specific behaviour: the
      loaded libKF5Contacts.so carries the unversioned DT_SONAME plus a
      DT_RUNPATH (E537 install-RPATH adaptation).

notes:
  - "kcontacts5 is a pure library package (the single libKF5Contacts.so
     shared library plus headers and the KF5ContactsConfig.cmake export);
     no commands.json is required (R38)."
  - "The upstream tests/ subdirectory (testread/testwrite, upstream-marked
     'FIXME: Build fails'; qmlintegrationtest, a manual QML demo) is
     excluded through patches/0001: none of its targets registers a ctest
     case and testread/testwrite do not compile upstream."
  - "The KCountry-based functions of kcontacts-addresstest
     (countryToISO/ISOtoCountry) and the addressformat repository
     validation need the iso-codes runtime data (JSON country tables +
     translated iso_3166-1 catalogs), deployed into the per-test
     XDG_DATA_HOME from the iso-codes package reaching this graph
     transitively through ki18n5 (ki18n5 precedent)."
  - "Upstream tests are run from build() with ctest; any test that cannot
     run in the headless sandbox is listed in notes.md with the concrete
     reason."
