# conandata.yml — kcrash 6.28.0
# Same OHOS adaptation set as 6.26.0.1 (DT_SONAME fix included from the
# start) plus the KF6 dependency ceiling patch: kcoreaddons 6.28.0 is not
# published to the ohpcd registry (max 6.26.0.1), while the kcrash 6.28.0
# sources use no KF6CoreAddons API newer than 6.26, so the upstream
# KF_DEP_VERSION gate is lowered to 6.26.0 (kcontacts 6.28.0 precedent).

sources:
  # download.kde.org times out from CI workers (network-restricted).
  # mirrors.nju.edu.cn is an authoritative KDE mirror hosting the byte-identical
  # tarball (sha256 cross-verified against the upstream tag v6.28.0).
  url: "https://mirrors.nju.edu.cn/kde/stable/frameworks/6.28/kcrash-6.28.0.tar.xz"
  sha256: "ddcc14c0c40e24f4c0dc04246b87d11b650e6fd8be2cb00e4f2cc2ee9e605702"

patches:
  "6.28.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
