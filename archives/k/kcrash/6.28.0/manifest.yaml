knowledge_gained:
  - category: L1
    content: "HMDFS 用户卷拒符号链接（EPERM），带 VERSION/SOVERSION 的共享库在链接期触发 CMake 版本化符号链接链（libKF6Crash.so -> .so.6 -> .so.6.28.0），报 'cmake_symlink_library: System Error: Permission denied'（E330）。配方钉 CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE 并保留 -Wl,-soname, 后产出单个无版本真实 .so：readelf 对打包产物实测 DT_SONAME=libKF6Crash.so，消费方（test_package）DT_NEEDED 记录裸名 libKF6CoreAddons.so.6，产物内无 conan cache 绝对路径。"
    reason: "平台真理（任何带版本号的共享库适配通用；ki18n 6.28.0 / kitemodels 6.28.0 同配方形态）"
  - category: L2
    content: "本配方全部 CMAKE_* 变量经 toolchain.variables 下发（写入 conan_toolchain.cmake，成为 CMakeCache 条目）——Conan 2.29.1 的 cache_variables 只进 generators/CMakePresets.json；凡不走 --preset、以手工 -DCMAKE_TOOLCHAIN_FILE 配置的构建（本工具链即如此）会静默丢失该通道的变量（kpeople 6.28.0 实测踩坑；本包首次构建即走对通道）。"
    reason: "模式经验（Conan 2 CMakeToolchain 两条变量通道的可见性差异；跨包通用）"
  - category: L2
    content: "KF6 版本墙：kcrash 6.28.0 顶层 find_package(KF6CoreAddons 6.28.0) 高于制品仓上限（kcoreaddons 最大 6.26.0.1）；补丁 0001 仅把 KF_DEP_VERSION 门限下调至 6.26.0（源码未使用 6.26 之后新增 API），ECM 门槛由 tool_requires extra-cmake-modules/6.29.0 满足。影响面仅构建期版本门限，运行时代码零改动。"
    reason: "模式经验（KF6 顶层组件对制品仓基线的门限降级；kcontacts 6.28.0 先例）"
