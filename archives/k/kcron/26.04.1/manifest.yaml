# ============================================================
# 必须字段
# ============================================================

version: "26.04.1"
software: "kcron"
status: built
build_date: "2026-10-16"
build_system: "cmake"
conan_ref: "kcron/26.04.1"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.kde.org/stable/release-service/26.04.1/src/kcron-26.04.1.tar.xz"
  sha256: "ee83f2a70a7a58882a75a9e989205917ee8d872b01c572a140ecc4094b3df45f"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DBUILD_TESTING=ON（上游 taskvalidatortest 在 build() 内真实执行）"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE（OHOS 不在 KDE 平台白名单）"
    - "-DKF_SKIP_PO_PROCESSING=ON（平台无 msgfmt/lconvert）"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_KF6DocTools=TRUE（未发布，非必需）"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_MODULE_LINKER_FLAGS_INIT=-Wl,-z,max-page-size=0x1000（OHOS 加载器要求 4-LOAD 段布局）"
    - "-DCMAKE_EXE_LINKER_FLAGS_INIT=-Wl,-z,max-page-size=0x1000 -Wl,--disable-new-dtags（工具链若落依赖 RPATH 则取 DT_RPATH 形式）"
    - "-DCMAKE_BUILD_RPATH/-DCMAKE_INSTALL_RPATH=<依赖 lib 目录集>（跨平台意图；本 OHOS 工具链实测不落 RPATH，运行时解析经 package_info() 导出 LD_LIBRARY_PATH）"
    - "-DQT_ADDITIONAL_PACKAGES_PREFIX_PATH=<qtdeclarative;qtsvg;qtshadertools;qtmultimedia 前缀>（Qt6 跨包组件查找）"

  dependencies:
    - "qtbase/6.11.1.1"
    - "qtbase-sql-dbus/6.11.1"
    - "qtdeclarative/6.11.1"
    - "qtsvg/6.11.1"
    - "qtshadertools/6.11.1"
    - "qtmultimedia/6.11.1"
    - "kauth/6.26.0"
    - "kcmutils/6.26.0"
    - "kio/6.26.0"
    - "kxmlgui/6.26.0"
    - "kitemviews/6.26.0"
    - "kservice/6.26.0（传递）"
    - "kconfigwidgets/6.18.0"
    - "kirigami/6.18.0"
    - "kirigami-addons/1.13.0"
    - "kconfig/6.26.0"
    - "kcoreaddons/6.26.0"
    - "kguiaddons/6.26.0"
    - "ki18n/6.26.0"
    - "kwidgetsaddons/6.26.0"
    - "kcolorscheme/6.26.0"
    - "kcodecs/6.26.0"
    - "kiconthemes/6.26.0"
    - "kcrash/6.26.0"
    - "karchive/6.26.0（传递，KIO 闭包）"
    - "expat/2.8.2.1"
    - "openssl/3.5.6.1"
    - "zstd/1.5.7"
    - "libxml2/2.15.3"
    - "ecm/6.26.0 (tool_requires)"

  cc: clang
  cxx: clang++

