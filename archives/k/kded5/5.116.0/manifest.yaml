version: "5.116.0"
status: built
build_date: "2026-10-17"

source:
  url: "https://download.kde.org/stable/frameworks/5.116/kded-5.116.0.tar.xz"
  sha256: "5cb67255f866ad765a88a091ad864e4fa83c7bd8b59fa96717817f448e6fa03d"
  tar_format: tar.xz

build:
  system: cmake
  notes:
    - "CMake + Ninja 交叉编译；kded5 为可执行守护进程（无库产物）。"

dependencies:
  build:
    - ecm/6.20.0
  runtime:
    - qt5-qtbase/5.15.2.2
    - kconfig5/5.116.0
    - kcoreaddons5/5.116.0
    - kcrash5/5.116.0
    - kdbusaddons5/5.116.0
