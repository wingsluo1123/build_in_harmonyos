platform_differences:
  - "KF_IGNORE_PLATFORM_CHECK=TRUE 绕过 KDE 平台检测（OHOS 不在 KDE 平台列表）。"
  - "ECM_MODULE_PATH 手动设置（CMakeDeps 生成的 ECMConfig.cmake 不传播该变量）。"
  - "conan_cmakedeps_paths.cmake 手写：所有 KF5 依赖均以 cmake_find_mode=none 发布，CMakeDeps 不会把其 lib/cmake 加入 CMAKE_PREFIX_PATH，故逐依赖前置。"
  - "OHOS CMake 平台模块未定义 SONAME flag，设置 CMAKE_SHARED_LIBRARY_SONAME_*=-Wl,-soname, 以产生真实 DT_SONAME。"
  - "KF5DocTools 保持可选（find_package(KF5DocTools) 非 REQUIRED），未引入以最小化依赖集并跳过 po/doc 安装。"

patches_count: 0
