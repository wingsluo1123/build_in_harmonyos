patches:
  "1.90.92":
    - patch_file: "patches/0001-guard-std-hash-qbitarray-qt515.patch"
      patch_type: "portability"
      patch_description: >-
        Qt 5.15 的 qhashfunctions.h(204-209) 已自带 std::hash 对 QString/
        QStringRef/QByteArray/QBitArray 的特化且无可关闭守卫，上游本地特化
        （kdev-pg/kdev-pg-regexp.cpp:54 的 q_Hash_to_tr1_hash(QBitArray)）
        会重定义报错 → 按 QT_VERSION < 5.15 守卫本地定义；5.15 上行为不变
        （Qt 自带特化同样是 qHash 实现）。
