# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ohpcd 的 kio/6.26.0 是 KIOCORE_ONLY 基线（仅 libKF6KIOCore + kioworker/ktrash6/workers，无 libKF6KIOWidgets）：kdialog 唯一 KIO 符号 KRecentDocument::add()（--getsavefilename 分支）即由 KIOCore 导出（kio src/core/krecentdocument.cpp 的 KIOCORE_EXPORT 类），链接目标 KF6::KIOWidgets -> KF6::KIOCore 一行替换即保留最近文档功能，无需回填 KIOWidgets（后者需 kbookmarks/solid/kjobwidgets/kiconthemes 6.26 全链，其中数个未发布）"
  - "kdialog 另一处 'KIO 观感' 的调用 KColorMimeData::fromMimeData()（--getcolor 分支）实际属于 KGuiAddons，不受链接替换影响；KF6::IconWidgets 是 kiconthemes 在同一 KF6IconThemes CMake 配置中导出的第二个库（libKF6IconWidgets.so），随 kiconthemes/6.26.0 正常供应，无需额外包或补丁"
  - "ohpcd 的 KF6 6.26.0 制品不向消费者传播依赖组件的传递 include 目录（每个框架的配置只导出自身 ${_IMPORT_PREFIX} 相对头目录，依赖链接被拍平为 -lKF6Xxx 标志与绝对 INTERFACE_LINK_DIRECTORIES）：上游自全量 KF6 安装继承的隐式头目录在 ohpcd 制品上不成立——消费方须把直用框架显式声明进 find_package(KF6 COMPONENTS ...) 与 target_link_libraries（补丁前真机编译实撞 kdialog.cpp:16 'KMessageBox' file not found / widgets.cpp:22 'KPasswordDialog'；补丁 0002 补 KF6::WidgetsAddons/CoreAddons/ConfigCore/I18n；KConfig 框架的 find_package 组件名为 Config——按目标名写 ConfigCore 会被 FindKF6 判 'missing: ConfigCore'）"
  - "find_package(Qt6 COMPONENTS DBus) 与 helper 的 qt_add_dbus_adaptor 由 qtbase/6.11.1.1（FEATURE_dbus=ON 变体）满足并可用（kauth 6.26.0 先例）；kdbusaddons 在 ohpcd 仅发布 6.14.0/6.18.0/6.29.0，6.18.0 为该 6.26 线消费者的既有钉法（kaccounts-integration 26.04.0 先例）：其配方自身传递 qtbase-sql-dbus/6.11.1（完整 Qt 构建，含 Sql/Test），Qt6::DBus 于 kdialog 本体的来源仍为 qtbase/6.11.1.1"
  - "26.04.0 的 --passivepopup 已无 KPassivePopup 回退（kdialog.cpp 仅留注释）：无会话总线时 sendVisualNotification() 返回 false 后 qApp->exec() 进入无窗口事件循环且无事可退出——该分支在无 DBus 设备上挂起，消费者用例有意不驱动；--progressbar 需 kdialog_progress_helper 在 PATH 且等待 DBus 客户端关闭对话框，同样不作端到端驱动。替代验证：--msgbox 是真实模态事件循环（KMessageBox::createKMessageBox + QDialog::exec），作 3 秒宽限存活探针（同时门禁 kdialog 本体 DT_NEEDED closure）；helper 则直接启动做闭包加载门禁（有界等待 + 链接器解析失败字样判定）"
  - "已发布 KF6 制品的不可移植 DT_NEEDED 两类残留（构建机绝对路径 / 构建树相对 '../../bin/*.so'）照 kcron 26.04.1 全链处置：本包两个可执行文件（kdialog、kdialog_progress_helper）在 package() 阶段原位 .dynstr 改写为裸基名 + 重签（HMDFS 禁 symlink，残留路径形态条目 fail-closed 中止打包）；test_package 侧对依赖库做相对条目归一（patchelf --replace-needed + 重签）+ 绝对条目建链 + 符号链农场（kcolorchooser 26.04.0/kblocks 26.04.0 先例）"
  - "无会话总线设备上 kdialog 的对话框本体流程不依赖 DBus：--version/--help/--author/--license（KAboutData/QCommandLineParser）与 --msgbox（KMessageBox 本地模态）均可在离屏平台完整驱动；未知选项走 QCommandLineParser 严格失败（'Unknown option' 诊断 + 非零退出）——四类非交互面构成消费者断言主体"
