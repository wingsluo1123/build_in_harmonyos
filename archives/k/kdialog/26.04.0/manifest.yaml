# 版本级 manifest
# 文件位置: archives/k/kdialog/26.04.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "26.04.0"
software: "kdialog"
status: built
build_date: "2026-10-17"
build_system: "cmake"
conan_ref: "kdialog/26.04.0"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kdialog-26.04.0.tar.xz"
  sha256: "cd612d72c629a5eab5dd2b6385e93e0926df39a6874ece0cf989d345d3aa225f"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DBUILD_TESTING=OFF（上游 0 注册测试；tests/ 仅 3 个交互式演示脚本且不在构建内，清点证据见 test_package/MANIFEST.yml）"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE（OHOS 不在 KDE 平台白名单）"
    - "-DKF_SKIP_PO_PROCESSING=ON（平台无 msgfmt/lconvert；.qm 目录非功能必需）"
    - "-DWITHOUT_X11=ON（平台无 X11：上游跳过 find_package(X11)，HAVE_X11 不定义，utils.cpp 的 X11 集成编译排除）"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_KF6DocTools=TRUE（未发布；26.04.0 无 doc/ 且上游 find_package 无 REQUIRED，属防御性）"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_EXE_LINKER_FLAGS_INIT=-Wl,-z,max-page-size=0x1000 -Wl,--disable-new-dtags（OHOS 加载器要求 4-LOAD 段布局；--disable-new-dtags 保证依赖 RPATH 取 DT_RPATH 形式）"
    - "-DCMAKE_SHARED_LINKER_FLAGS_INIT / -DCMAKE_MODULE_LINKER_FLAGS_INIT=-Wl,-z,max-page-size=0x1000（同源布局要求）"
    - "-DCMAKE_BUILD_RPATH / -DCMAKE_INSTALL_RPATH=<依赖 lib 目录集>（OHOS 加载器先于制品自身的坏 RPATH 条目命中已发布 KF6 库；运行时解析主经 package_info() 导出 LD_LIBRARY_PATH）"
    - "-DQT_ADDITIONAL_PACKAGES_PREFIX_PATH=<qtsvg 前缀>（Qt6Svg 跨包组件查找；否则 find_package(Qt6 ... Svg) 先命中 qtbase 配置而失败）"
    - "-DECM_MODULE_PATH=<ecm/share/ECM 的 modules;find-modules;kde-modules>（CMakeDeps 的 ECMConfig 不带模块路径，手工注入）"
    - "conan_cmakedeps_paths.cmake（CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON + CMAKE_PREFIX_PATH/CMAKE_LIBRARY_PATH/CMAKE_INCLUDE_PATH/CMAKE_MODULE_PATH 注入：CMakeDeps 不写 cmake_find_mode=none 的包，kdialog 主配方与 test_package 同源手工补齐）"

  dependencies:
    - "qtbase/6.11.1.1（override；FEATURE_dbus=ON 变体，导出 Qt6::DBus 组件）"
    - "qtsvg/6.11.1"
    - "ktextwidgets/6.26.0"
    - "knotifications/6.26.0"
    - "kguiaddons/6.26.0（override）"
    - "kiconthemes/6.26.0（含 KF6::IconWidgets 同配置第二库）"
    - "kwindowsystem/6.26.0"
    - "kio/6.26.0（KIOCORE_ONLY 基线；补丁 0001 链接替换 KF6::KIOCore）"
    - "kdbusaddons/6.18.0（ohpcd 无 6.26.0；kaccounts-integration 26.04.0 先例，其传递 qtbase-sql-dbus/6.11.1 → dbus/1.14.10 → expat 链）"
    - "ki18n/6.26.0（override）"
    - "kconfig/6.26.0（override）"
    - "kcoreaddons/6.26.0（override）"
    - "kcrash/6.26.0（override）"
    - "kcolorscheme/6.26.0（override）"
    - "kcodecs/6.26.0（override）"
    - "kwidgetsaddons/6.26.0（override）"
    - "kcompletion/6.26.0.1（ktextwidgets 闭包）"
    - "sonnet/6.26.0（传递，ktextwidgets 闭包）"
    - "kservice/6.26.0（传递，ktextwidgets/kio 闭包）"
    - "karchive/6.26.0（override；kiconthemes 闭包）"
    - "openssl/3.5.6.1"
    - "zstd/1.5.7"
    - "expat/2.8.2.1（override；dbus/1.14.10 经 kdbusaddons→qtbase-sql-dbus 传递，kcron 26.04.1 先例）"
    - "libxml2/2.15.3（kio 闭包；OHOS SDK lld 链接期亦需 libxml2.so.16）"
    - "ecm/6.26.0 (tool_requires)"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - patches/0001-ohos-link-kiocore.patch
  - patches/0002-ohos-explicit-framework-links.patch

