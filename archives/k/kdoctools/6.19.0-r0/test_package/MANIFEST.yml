# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kdoctools/6.19.0-r0
homepage: https://invent.kde.org/frameworks/kdoctools

# kdoctools 上游 autotests 需 Qt6 + ki18n + karchive + libxml2/libxslt，CI worker 预置后可跑，
# 本 test_package 仅做消费者视角的 KF6::DocTools 链通验证（R34 实质调用 API）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 测试实质调用被测包 API — find_package(KF6DocTools) + KDOCTOOLS_VERSION_STRING 宏
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(KF6DocTools REQUIRED CONFIG) + target_link_libraries KF6::DocTools + KDOCTOOLS_VERSION_STRING 宏 — 验证 KF6DocTools 库已正确安装且版本宏可访问"
    command: "cmake --build"

# 测试断言总数 (find_package 成功 + KF6::DocTools 链接通过 + KDOCTOOLS_VERSION_STRING 宏可访问 + test_kdoctools 退出码 0)
assertion_count: 4
