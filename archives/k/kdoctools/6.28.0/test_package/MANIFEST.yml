package: kdoctools/6.28.0
homepage: https://invent.kde.org/frameworks/kdoctools

upstream_check_command: "ctest --test-dir <build-dir> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-dir> --output-on-failure"

upstream_tests:
  - file: autotests/CMakeLists.txt
    source: kdoctools-6.28.0/autotests/CMakeLists.txt
    description: "meinproc_template converts the upstream DocBook template; registered when system DocBook XML 4.5 and DocBook XSL data are available."
    command: "ctest --test-dir <build-dir> --output-on-failure -R meinproc_template"
  - file: autotests/CMakeLists.txt
    source: kdoctools-6.28.0/autotests/CMakeLists.txt
    description: "kdoctools_install configures, builds and installs a downstream CMake consumer that generates man pages and HTML handbooks; registered when system DocBook XML 4.5 and DocBook XSL data are available."
    command: "ctest --test-dir <build-dir> --output-on-failure -R kdoctools_install"

test_package_tests:
  - file: test_package/test_ohos_docbook.py
    description: "On HarmonyOS, exercise the packaged meinproc6/checkXML6 against the installed KDocTools data: version query, catalog/data integrity, a real DocBook-to-HTML transform with the marker check, and checkXML6 positive/negative validation."
    command: "conan create kdoctools/6.28.0"

assertion_count: 7
