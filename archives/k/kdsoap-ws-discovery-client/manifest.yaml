software: kdsoap-ws-discovery-client
display: "KDSoap WS-Discovery Client"
description: "Qt-based client library for WS-Discovery service discovery"
category: network
homepage: "https://invent.kde.org/libraries/kdsoap-ws-discovery-client"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Follows existing E092 guidance: select CMAKE_SYSTEM_NAME=Linux for CMake platform-module behavior while retaining the OHOS aarch64 profile."
    - "Runs upstream QtTest coverage plus a real HarmonyOS loopback UDP and SOAP ProbeMatches integration test."
    - "External WS-Discovery depends on UDP multicast support from the device network."
  common_dependencies:
    - qtbase
    - kdsoap

versions:
  "0.4.0":
    status: built
    build_date: "2026-10-11"
    conan_ref: "kdsoap-ws-discovery-client/0.4.0"
