sources:
  url: "https://invent.kde.org/libraries/kdsoap-ws-discovery-client/-/archive/v0.4.0/kdsoap-ws-discovery-client-v0.4.0.tar.gz"
  sha256: "d0fe9d51a1b641b760f3d837c94b94276ced7a91d4912559cde6bf1df6d4aafa"

patches:
  - patch_file: "patches/0001-KDSoapWSDiscoveryClientConfig.cmake.in.patch"
    patch_description: "Include CMakeFindDependencyMacro before find_dependency() so the generated KDSoapWSDiscoveryClientConfig.cmake can be consumed (the upstream template relied on the macro being preloaded by the consumer)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    patch_description: "Link the KDSoap::kdsoap dependency by its SONAME-style basename (the published kdsoap shared library has no DT_SONAME, which would otherwise put a machine-private Conan cache path into DT_NEEDED) and add its headers privately"
    patch_type: "portability"
