# conandata.yml — kea 3.2.0 (ISC Kea)
# Upstream release tarball from the ISC ftp server (official source).
sources:
  url: "https://ftp.isc.org/isc/kea/3.2.0/kea-3.2.0.tar.xz"
  sha256: "14bf695d37b65b9b1bf550fea5d0adaf9806c50e5419ef2a176a4b8e9aade3df"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "Normalize the HarmonyOS/OpenHarmony system name to Linux so the Meson platform branch selects the Linux sources and flags"
    patch_type: "portability"
  - patch_file: "patches/0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
    patch_description: "Rename the UAPI struct sockaddr_storage while including the netlink headers, avoiding its redefinition against the musl sys/socket.h one"
    patch_type: "portability"
  - patch_file: "patches/0003-meson.build.patch"
    patch_description: "Invoke the configure-time helper scripts (env.sh, cd-and-run.sh, grabber.py, config-report.sh) through their interpreters (sh/python3) because the HarmonyOS PC kernel refuses to execve() scripts whose interpreter line names /bin/sh (EACCES)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-lib-process-cfgrpt-meson.build.patch"
    patch_description: "Invoke tools/mk_cfgrpt.sh through /bin/sh when generating config_report.cc because the HarmonyOS PC kernel refuses to execve() scripts whose interpreter line names /bin/sh (EACCES)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-lib-dhcp-iface_mgr_linux-getifaddrs-fallback.patch"
    patch_description: "Fall back to getifaddrs()-based interface detection when the netlink socket cannot be opened (the HarmonyOS PC sandbox refuses to bind it), mirroring the BSD/Solaris implementation"
    patch_type: "portability"
  - patch_file: "patches/0006-meson-script-tests-interpreter.patch"
    patch_description: "Launch the script-based test suites (25 shell and 1 python test) through /bin/sh and python3 explicitly, because the HarmonyOS PC kernel refuses to execve() scripts whose interpreter line names /bin/sh (EACCES)"
    patch_type: "portability"
  - patch_file: "patches/0007-src-lib-asiolink-process_spawn.cc-exec-fallback.patch"
    patch_description: "Fall back to /bin/sh when execve() of a process fails with EACCES/ENOEXEC (HarmonyOS PC refuses /bin/sh-interpreter scripts) so that run_script hooks can spawn scripts; the fallback argv is pre-built in the constructor to keep the post-fork() path allocation-free"
    patch_type: "portability"
  - patch_file: "patches/0008-src-bin-keactrl-kea-admin-no-shebang.patch"
    patch_description: "Drop the #!/bin/sh line of the build-tree-only keactrl and kea-admin helper scripts: the HarmonyOS PC kernel refuses to execve() such scripts, while POSIX shells interpret shebang-less executable files through the standard fallback (POSIX XCU 2.9.1.1)"
    patch_type: "portability"
  - patch_file: "patches/0009-src-lib-util-tests-pid_file_unittest.cc-premise-probe.patch"
    patch_description: "Probe whether the chmod-based unwritable-file premise of the pidWriteFail unit test is enforced by the running filesystem (HMDFS does not enforce it) and skip that check there instead of failing spuriously; upstream logic unchanged where the premise holds"
    patch_type: "portability"
  - patch_file: "patches/0010-src-lib-testutils-sandbox.h-tmpdir.patch"
    patch_description: "Honor TMPDIR in the unit test Sandbox helper: some sandboxed platforms provide no writable P_tmpdir (HarmonyOS PC mounts /tmp read-only), where mkdtemp() would return NULL and the std::string assignment would crash; hosts with TMPDIR unset keep the previous behavior"
    patch_type: "portability"
  - patch_file: "patches/0011-src-lib-dhcp-tests-iface_mgr_unittest.cc-siocgifhwaddr-fallback.patch"
    patch_description: "Fall back to the MAC address carried in the getifaddrs() AF_PACKET entry when the SIOCGIFHWADDR ioctl is refused with EPERM (HarmonyOS PC sandbox), mirroring the getifaddrs fallback of the production IfaceMgr; the ioctl path is tried first so upstream behavior is unchanged where the ioctl works. Both paths also compare only the bytes the buffer they read from can carry: some interfaces report a link address longer than sockaddr::sa_data (14) and sockaddr_ll::sll_addr (8) - the ip6tnl0 and ip6_vti0 tunnels report a 16-byte all-zero one, which the kernel hands to IfaceMgr through netlink as well - and comparing the full length read past the never-initialized ifreq union, failing the check on hosts carrying such interfaces"
    patch_type: "portability"
  - patch_file: "patches/0012-src-hooks-dhcp-run_script-tests-run_script_unittests.cc-script-spawn-timeout.patch"
    patch_description: "Raise the run_script hook result check deadline from 3 to 10 seconds: on slow or heavily loaded sandboxed build hosts spawning the script alone can exceed the old margin, failing the check spuriously"
    patch_type: "portability"
  - patch_file: "patches/0013-src-bin-dhcp4-tests-ctrl-unix-socket-probe.patch"
    patch_description: "Probe AF_UNIX pathname socket support in the DHCPv4 server unix command channel tests (the HarmonyOS PC sandbox refuses bind() with EPERM) and skip exactly the channel tests when the probe socket cannot be bound"
    patch_type: "portability"
  - patch_file: "patches/0014-src-bin-dhcp6-tests-ctrl-unix-socket-probe.patch"
    patch_description: "Probe AF_UNIX pathname socket support in the DHCPv6 server unix command channel tests (the HarmonyOS PC sandbox refuses bind() with EPERM) and skip exactly the channel tests when the probe socket cannot be bound"
    patch_type: "portability"
  - patch_file: "patches/0015-src-bin-d2-tests-ctrl-unix-socket-probe.patch"
    patch_description: "Probe AF_UNIX pathname socket support in the D2 unix command channel tests (the HarmonyOS PC sandbox refuses bind() with EPERM) and skip exactly the channel tests when the probe socket cannot be bound"
    patch_type: "portability"
  - patch_file: "patches/0016-src-lib-asiolink-tests-unix_domain_socket_unittest.cc-socket-probe.patch"
    patch_description: "Probe AF_UNIX pathname socket support in the asiolink unix domain socket tests and skip the three tests binding a server socket when the probe fails (the HarmonyOS PC sandbox refuses bind() with EPERM)"
    patch_type: "portability"
  - patch_file: "patches/0017-src-lib-config-tests-unix-socket-probe.patch"
    patch_description: "Probe AF_UNIX pathname socket support in the unix command manager and client connection tests and skip the socket-binding tests when the probe fails (the HarmonyOS PC sandbox refuses bind() with EPERM)"
    patch_type: "portability"
  - patch_file: "patches/0018-src-lib-dhcpsrv-tests-memfile-tmpdir-and-perms-probe.patch"
    patch_description: "Memfile lease manager tests: use TMPDIR when set instead of a hard-coded /tmp (read-only on HarmonyOS PC) for the data directory override and path security warning checks, and probe whether chmod() is enforced before relying on the unwritable-PID-file premise (HMDFS does not enforce it)"
    patch_type: "portability"
  - patch_file: "patches/0019-src-hooks-dhcp-tests-tmpdir-substitution.patch"
    patch_description: "Lease commands, forensic legal log and host cache hook tests: use TMPDIR when set instead of a hard-coded /tmp (read-only on HarmonyOS PC) wherever a writable lease/log/cache file path is required"
    patch_type: "portability"
  - patch_file: "patches/0020-src-bin-http-config-write-tmpdir.patch"
    patch_description: "HTTP control socket tests of dhcp4, dhcp6 and d2: use TMPDIR when set instead of a hard-coded /tmp (read-only on HarmonyOS PC) for the config-write full path check"
    patch_type: "portability"
