  upstream_tests_disabled: 38       # DISABLED_ 前缀定义（29 处在启用套件内 gtest 注册不执行；9 处在禁用组件目录）
  upstream_test_suites: 92          # 实测注册：66 gtest + 26 脚本
  upstream_test_exit_code: 0        # 套件级 Ok: 92 / Fail: 0（meson test，无过滤）
  ohos_specific_tests: 2            # test_package: test_ohos_platform + test_ohos_runtime
  ohos_test_command: "./test_ohos_platform <package>/bin/kea-dhcp4 && ./test_ohos_runtime <package>/lib"
  local_ci: "conan-verify 八门禁 G0-G4 全 PASS（L2/L4/L5 因本次无对应 cache 路径跳过）→ Verdict PASS，2026-10-04；test_package 4 程序 129 项检查全过（0 FAIL）"

knowledge_gained:
