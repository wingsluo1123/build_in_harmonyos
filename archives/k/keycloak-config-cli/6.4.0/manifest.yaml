# 版本级 manifest
# 文件位置: archives/k/keycloak-config-cli/6.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.4.0"

# 软件名
software: "keycloak-config-cli"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-13"
build_system: maven

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 codeload，R39 官方来源）
  url: "https://codeload.github.com/adorsys/keycloak-config-cli/tar.gz/refs/tags/v6.4.0"

  # 源码校验和（与上游 .tarball-sha256 交叉验证一致）
  sha256: "c4196406e5d28753f6b72edbb3a283052f3bc2bab3c75ce3a3c434f196b546ce"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: maven

  # 配置选项列表
  configure_options:
  - "-Djava.version=17"
  - "-DskipITs"

  # 编译依赖列表（格式: name/version；均在线消费，非 conan 包，见 W0 报告）
  dependencies:
  - "jdk/17"
  - "maven/3.9.6"

  # 编译器（纯 Java 无 C/C++ 交叉编译）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "codeload 裸 URL 基名无扩展名（v6.4.0）→ conan unzip 按 zip 处理触发 BadZipFile；conandata sources 必须显式 filename: '*.tar.gz'（第二轮 G2 根因）" # knowledge_ref: E429
  - "ohc E017 ghfast.top 镜像注入只匹配 github.com URL 且会写 conandata.yml.ghfast-bak；ghfast.top 从本设备 connect timeout 不可达 → 用 codeload URL 避开注入；崩溃残留的 .ghfast-bak 会在下次启动'恢复'覆盖手工修改，重跑前必须删除" # knowledge_ref: E430
  - "6.4.0 配置模型：KeycloakConfigProperties 无 realm 字段（旧用法 --keycloak.realm 触发 ignoreUnknownFields=false 的 left unbound 绑定失败）；必填仅 keycloak.url + keycloak.version；README 规范调用 = --keycloak.url/--keycloak.ssl-verify/--keycloak.user/--keycloak.password/--import.files.locations" # knowledge_ref: E431
  - "import.files.locations 条目走 Spring glob 解析 + filterExcludedResources：隐藏目录（dot 目录）默认被排除，fixture 位于 .atomcode 等隐藏目录下必须配 --import.files.include-hidden-files=true，否则报 No files matching" # knowledge_ref: E432
  - "41 个 failsafe IT 需 Docker/Testcontainers 拉起 Keycloak 容器，OHOS 真机无 Docker → -DskipITs；surefire 90 单测全绿（36s）；Mockito 5 inline 需 -javaagent byte-buddy-agent 预装载（与 keycloak-metrics 同源根因）" # knowledge_ref: E433
  - "fat jar MANIFEST（ZIP layout）：Main-Class = org.springframework.boot.loader.launch.PropertiesLauncher，Start-Class = de.adorsys.keycloak.config.KeycloakConfigApplication；jar 名无版本号（pom finalName=artifactId）" # knowledge_ref: E434
  - "上游 tag 带 v 前缀：v6.4.0（codeload refs/tags/v6.4.0，sha256 与上游 .tarball-sha256 一致）" # knowledge_ref: E435
