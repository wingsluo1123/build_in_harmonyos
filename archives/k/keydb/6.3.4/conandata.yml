sources:
  url: "https://github.com/Snapchat/KeyDB/archive/refs/tags/v6.3.4.tar.gz"
  sha256: "229190b251f921e05aff7b0d2f04b5676c198131e2abbec1e2cfb2e61215e2f3"

patches:
  - patch_file: "patches/0001-src-Makefile.patch"
    patch_description: "Add the pthread compatibility object to the server target, run the release-header generator and the Tcl test launcher explicitly through sh, and let AArch64 OHOS builds skip the external libatomic (compiler atomics are used instead)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-config.h.patch"
    patch_description: "Include the pthread compatibility header from config.h so every translation unit sees the shimmed entry points"
    patch_type: "portability"
  - patch_file: "patches/0003-src-pthread_compat.cpp.patch"
    patch_description: "New file: GNU pthread affinity and cancellation entry points that non-glibc Linux libcs (musl on HarmonyOS) do not implement, forwarded to the POSIX APIs the platform does provide"
    patch_type: "portability"
  - patch_file: "patches/0004-src-pthread_compat.h.patch"
    patch_description: "New file: declarations for the pthread compatibility entry points (defines _GNU_SOURCE so cpu_set_t is visible)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-server.cpp.patch"
    patch_description: "Treat an unsupported madvise(MADV_FREE) as 'probe cannot run' instead of aborting the server: OHOS kernels reject MADV_FREE with EINVAL, and the arm64 fork bug being probed only exists on kernels that implement it"
    patch_type: "portability"
  - patch_file: "patches/0006-src-setproctitle.c.patch"
    patch_description: "Define the glibc program-name globals that musl does not export, and seed them from argv[] exactly as glibc does, so spt_init() no longer calls strdup(NULL) and crashes the server at startup"
    patch_type: "portability"
  - patch_file: "patches/0007-tests-support-tmpfile.tcl.patch"
    patch_description: "Let the Tcl suite use a short writable temporary root (KEYDB_TEST_TMPDIR), required for Unix socket paths on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0008-tests-unit-tls.tcl.patch"
    patch_description: "Move unit/tls into the same 'if {$::tls}' guard the sibling TLS files already use, so a BUILD_TLS=no build no longer starts a server with the TLS-only 'tls-rotation' directive (upstream bug, present for any non-TLS build)"
    patch_type: "portability"
