software: keydb
display: "KeyDB"
description: "High-performance multi-threaded fork of Redis"
category: db
homepage: "https://github.com/Snapchat/KeyDB"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "OHOS 的 musl 没有 pthread_setaffinity_np，多线程绑核改用 sched_setaffinity 兼容实现"
    - "libuuid 不在 OHOS sysroot 中，改用 Conan 的 uuid 包（静态链接）"
    - "内嵌 jemalloc/memkind 无法交叉编译，使用 MALLOC=libc"
    - "AArch64 使用编译器内建原子操作，无需外部 libatomic"
  common_dependencies:
    - libc (musl)

versions:
  "6.3.4":
    status: built
    build_date: "2026-10-02"
