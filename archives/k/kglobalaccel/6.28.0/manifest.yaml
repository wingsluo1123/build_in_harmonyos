knowledge_gained:
  - "kglobalaccel 6.28.0 keeps the 6.26.0 recipe shape (tier 1: ECM-only KF dependency, KF_IGNORE_PLATFORM_CHECK + WITH_X11=OFF + qtbase-sql-dbus for Qt6::DBus + QT_ADDITIONAL_PACKAGES_PREFIX_PATH for LinguistTools). The 6.26->6.28 delta is 6 upstream files: version/deprecation lines, the setInverseShortcutActions API (6.27+), the kglobalacceld named-bus preference, and the two D-Bus XMLs; no new dependencies, no build-system changes."
  - "OHOS shared-library rules must be SONAME-only: a CMAKE_USER_MAKE_RULES_OVERRIDE_C/CXX rules file defining just CMAKE_SHARED_LIBRARY_SONAME_C_FLAG/-CXX_FLAG (-Wl,-soname,) plus CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE yields an unversioned libKF6GlobalAccel.so with basename DT_SONAME, no RPATH/RUNPATH and no symlink chain (HMDFS rejects symlink(2)); install() is a byte-identical copy of the build artifact, so the device loader accepts dlopen (with CMAKE_SHARED_LIBRARY_RUNTIME_* defined, install() rewrites the ELF and strips RUNPATH -> EACCES)."
  - "setInverseShortcutActions() gates locally before any D-Bus traffic: it returns false unless both actions are registered (setShortcut/setDefaultShortcut) and share one componentName; those two branches are deterministic headless and form the 6.27+ API consumer case."
  - "Upstream registers no CTest cases for kglobalaccel (any version): the only test artifact is the non-checking GUI/QML kglobalacceltest executable whose QML scene needs org.kde.kquickcontrols (from kdeclarative, which reverse-depends on kglobalaccel - cycle), so the R51 declaration stays '0 automated cases + launch-alive smoke' (offscreen run reaches the event loop, killed by the harness timeout at 15 s -> rc=124)."
