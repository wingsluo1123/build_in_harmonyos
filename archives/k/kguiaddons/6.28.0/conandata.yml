# conandata.yml - kguiaddons 6.28.0
# Upstream source: official KDE Frameworks 6.28.0 release tarball.
# First adaptation of the 6.28.0 upstream release; carries the DT_SONAME
# link-flag hardening proven on kguiaddons/6.26.0.1 forward unchanged.
# download.kde.org is a Mirrorbits redirector; on some networks the mirror
# it selects answers with a broken (demo) TLS certificate, so two
# authoritative KDE mirrors are listed as fallbacks (R39: official source or
# authoritative mirror). The sha256 below pins the identical official
# tarball whichever mirror answers first.
sources:
  url:
    - "https://download.kde.org/stable/frameworks/6.28/kguiaddons-6.28.0.tar.xz"
    - "https://mirrors.nju.edu.cn/kde/stable/frameworks/6.28/kguiaddons-6.28.0.tar.xz"
    - "https://mirrors.aliyun.com/kde/stable/frameworks/6.28/kguiaddons-6.28.0.tar.xz"
  sha256: "f46aeca80707e774fcffe8aa82e464a81056ce84f613347a5c9cc24c1c9a8432"
patches: {}
