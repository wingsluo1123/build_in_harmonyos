knowledge_gained:
  - "kguiaddons 6.28.0 is the first adaptation of the 6.28.0 upstream release; the whole 6.26.0.1 recipe carries over unchanged except the version string and the ECM tool_requires, which moves to extra-cmake-modules/6.29.0 because upstream 6.28.0 raises its ECM floor to 6.28.0."
  - "Upstream 6.26 -> 6.28 source delta is small: src/CMakeLists.txt gains qt_extract_metatypes plus an install of the generated metatypes file into KDE_INSTALL_QTMETATYPESDIR (extra installed directory only, no link or runtime impact), and kurlhandler_p.cpp gains an iOS-only guard; the autotests/ set is unchanged."
  - "download.kde.org is a Mirrorbits redirector and answers with a broken (demo) TLS certificate on some networks; listing the official URL first with mirrors.nju.edu.cn and mirrors.aliyun.com fallbacks under one sha256 pin lets get() fall through to a working mirror on both the device and CI (R39)."
  - "The HMDFS user volume rejects symlink(2) with EPERM device-wide (probed in $HOME, $HOME/bih, $HOME/.conan2/p and /tmp, absolute and relative targets alike), so CMake's versioned shared-library chain (libKF6GuiAddons.so.6 -> .so.6.28.0) can never be materialized and cmake_symlink_library fails the post-link step. The recipe disables it with CMAKE_PLATFORM_NO_VERSIONED_SONAME=ON through both tc.variables and tc.cache_variables while keeping CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG=-Wl,-soname,: one unversioned real libKF6GuiAddons.so with a bare, relocatable DT_SONAME (kitemodels/kitemviews/kcontacts 6.28.0 precedents)."
  - "Consumer cases that create pixmaps/icons need a QGuiApplication; on the OHOS device and workers there is no display, so the test_package driver forces QT_QPA_PLATFORM=offscreen and isolates HOME/XDG under its build folder."
