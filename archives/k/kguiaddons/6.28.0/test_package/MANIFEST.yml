# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kguiaddons/6.28.0.

package: kguiaddons/6.28.0
homepage: "https://invent.kde.org/frameworks/kguiaddons"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"

# 上游 autotests/ 实际运行的全部 8 项（BUILD_TESTING=ON 时由 ctest 执行）
upstream_tests:
  - file: autotests/kwordwraptest.cpp
    source: kguiaddons-6.28.0/autotests/kwordwraptest.cpp
    description: "KWordWrap text wrapping and truncation logic"
    command: "kwordwraptest"
  - file: autotests/kcolorutilstest.cpp
    source: kguiaddons-6.28.0/autotests/kcolorutilstest.cpp
    description: "KColorUtils luma/mix/tint/contrastRatio color math"
    command: "kcolorutilstest"
  - file: autotests/kiconutilstest.cpp
    source: kguiaddons-6.28.0/autotests/kiconutilstest.cpp
    description: "KIconUtils icon overlay rendering helpers"
    command: "kiconutilstest"
  - file: autotests/kcursorsavertest.cpp
    source: kguiaddons-6.28.0/autotests/kcursorsavertest.cpp
    description: "KCursorSaver save/restore cursor state"
    command: "kcursorsavertest"
  - file: autotests/kkeysequencerecordertest.cpp
    source: kguiaddons-6.28.0/autotests/kkeysequencerecordertest.cpp
    description: "KKeySequenceRecorder sequence capture"
    command: "kkeysequencerecordertest"
  - file: autotests/kurlhandlertest.cpp
    source: kguiaddons-6.28.0/autotests/kurlhandlertest.cpp
    description: "KUrlHandler url scheme handling"
    command: "kurlhandlertest"
  - file: autotests/kcountryflagemojiiconenginetest.cpp
    source: kguiaddons-6.28.0/autotests/kcountryflagemojiiconenginetest.cpp
    description: "KCountryFlagEmojiIconEngine flag/emoji icon rendering"
    command: "kcountryflagemojiiconenginetest"
  - file: autotests/kgeourihandlertest.cpp
    source: kguiaddons-6.28.0/autotests/kgeourihandlertest.cpp
    description: "KGeoUriHandler geo: scheme parsing"
    command: "kgeourihandlertest"

# 上游 CTest 注册集与 6.26.0.1 相同（8 项）；本版实测无跳过项（8/8 Passed）
expected_skips: []

test_package_tests:
  - file: test.cpp
    description: "Consumer case suite over the installed CamelCase headers: kcolorutils-lighten-darken / kcolorutils-contrast-ratio / kcolorutils-mix-tint / kcolorutils-hcy-roundtrip / kcolorutils-overlay-colors / kwordwrap-truncation / kiconutils-addoverlay / kcountryflagemojiiconengine (QGuiApplication on the offscreen platform; each case prints TEST PASS/FAIL, the run ends with TEST SUMMARY and exits non-zero on any failure)"
    command: "conan create (test_package builds and runs test_kguiaddons)"

assertion_count: 8
