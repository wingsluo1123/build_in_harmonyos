# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ki18n/6.19.0
homepage: https://invent.kde.org/frameworks/ki18n

# ki18n 上游 autotests 需 Qt6 + gettext，CI worker 预置后可跑，
# 本 test_package 仅做消费者视角的 KF6::I18n 链通验证（R34 实质调用 API）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 测试实质调用被测包 API — find_package(KF6I18n) + KLocalizedString kxi18n()
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(KF6I18n REQUIRED CONFIG) + target_link_libraries KF6::I18n + kxi18n() — 验证 KF6I18n 库已正确安装且 KLocalizedString API 可调用"
    command: "cmake --build"

# 测试断言总数 (find_package 成功 + KF6::I18n 链接通过 + kxi18n 宏可调用 + test_ki18n 退出码 0)
assertion_count: 4
