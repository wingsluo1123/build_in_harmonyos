knowledge_gained:
  - "kiconthemes 6.28.0 is a small delta from 6.26.0: only the root CMakeLists (KF_DEP 6.28.0, ECM 6.28.0, deprecation baseline 6.27), a new kiconbutton_unittest, a shared accept-selected handler in kicondialog and a Q_OS_IOS guard around iconutil in ksvg2icns; all pre-existing autotest sources are byte identical, so the 6.26.0 adaptation set applies unchanged apart from the version-dependent bits."
  - "KF_DEP_VERSION 6.28.0 must be lowered to 6.26.0 because the published KF6 stack stops there (kwidgetsaddons has a .1 fix release); the ECM 6.28.0 floor is separate and satisfied by ecm/6.28.0, the kservice 6.28.0 precedent."
  - "KIconTheme::queryIcons() returns full file paths built by KIconThemeDir::constructFileName(), not bare icon names; a consumer check must match the installed file path (e.g. suffix /name.png) rather than compare against the icon name."
  - "The OHOS user volume (HMDFS) rejects symlink(2) with EACCES for all writable directories; any test harness that stages libraries next to a binary must use hardlinks or copies. The kiconthemes test_package now tries os.link() first and falls back to shutil.copy2(), keeping the symlink-free CI path working unchanged."
  - "The new upstream kiconbutton_unittest runs headless under QT_QPA_PLATFORM=offscreen without additional fixtures (KIconButton property defaults), so the existing offscreen test environment covers it."
