knowledge_gained:
  - "CMakeDeps 不显式实例化 = 零依赖 config：generators 目录只有 toolchain 时 configure 直接死于依赖 config 查找失败。kif5 5.116 未受害是因其依赖包自带 config + 手动 prefix 注入；消费 CMakeDeps 产物（OpenEXR/libavif/Imath 链）的配方必须显式 CMakeDeps(self).generate()。"
  - "OpenJPEG 大写变量契约：上游 jp2 插件与 2000-write 测试门消费 OPENJPEG_INCLUDE_DIRS/OPENJPEG_LIBRARIES 与 OPENJPEG_{MAJOR,MINOR,BUILD}_VERSION 大写三元组，CMakeDeps 生成的 config 只定义 mixed-case；把 openjpeg 包目录前置 CMAKE_PREFIX_PATH 让其自带 OpenJPEGConfig.cmake 先胜 + toolchain 大写变量兜底。"
  - "Imath 平头 include：exr.cpp 引 <ImathBox.h>（平文件），制品仓 imath/3.2.2 盘上只有 include/Imath/*，CMakeDeps 的 Imath::Imath 只暴露根目录；imath 包目录前置（其自带 config 同时导出 include/ 与 include/Imath）修复。"
  - "libavif 字面 target：上游链接字面 target 'avif'，CMakeDeps 只提供 libavif::libavif；generators/kif-shims/ 双文件 shim（转发真 config + 建 avif 别名 + 版本文件同时接受两次版本请求）前置搜索序修复。"
  - "openexr/3.3.4 构建机绝对路径 DT_NEEDED（kif5/kio-fuse 同款先例）：libOpenEXR-3_3.so.32 的 libImath.so 条目烘焙了 /storage/Users/currentUser/.cache/conan2/p/imath97b7356a3fe4a/p/lib/libImath.so；含 '/' 的条目被装载器直接按路径 open，设备本地以同名包目录（包短名跨机器确定）复制到该路径即修复；CI 侧自身 conan home 就是 .cache/conan2、依赖包天然落在该路径，构建链自洽、配方内无需任何依赖改写。"
