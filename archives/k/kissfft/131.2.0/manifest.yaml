software: kissfft
version: "131.2.0"
status: published
build_date: "2026-07-15"
build_system: makefile

source:
  url: "https://github.com/mborgerding/kissfft/archive/refs/tags/131.2.0.tar.gz"
  sha256: "205a8f6a448ef12b091f8ac6a514b5091bb5f6b0b543431ed75f673116cf5cbf"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "KISSFFT_TOOLS=0"
    - "KISSFFT_STATIC=1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

notes: |
  kissfft 131.2.0 适配到 OHOS 平台。
  纯数学运算库，无平台特定代码。
  使用 Makefile 构建，禁用工具构建（KISSFFT_TOOLS=0）避免 libpng 依赖。
  静态编译（KISSFFT_STATIC=1）。

test_validation:
  test_date: "2026-07-15"
  test_method: "conan_create"
  test_result: "all_passed"
  test_report: "reports/test-report.md"
  tested_features:
    - "fft_forward_transform"
    - "fft_inverse_transform"
    - "frequency_detection"
    - "signal_reconstruction"
