# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kissfft/131.2.0
homepage: "https://github.com/mborgerding/kissfft"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make testsingle"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_real.c
    source: kissfft-131.2.0/test/test_real.c
    description: "Real FFT self test"
    command: "make testsingle"
  - file: test/twotonetest.c
    source: kissfft-131.2.0/test/twotonetest.c
    description: "Two-tone test (SNR validation)"
    command: "make testsingle"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "FFT forward+inverse reconstruction test"
    command: "./test_kissfft"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
