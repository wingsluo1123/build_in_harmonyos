test_type: executable
test_language: bash
test_requires_install: true
test_description: |
  kitchen 1.2.6 smoke tests covering core API:
  - Module import and version check
  - kitchen.text.converters.to_unicode (taskw dependency)
  - kitchen.text.converters.to_bytes
  - kitchen.text.converters.getwriter
  - kitchen.i18n module existence
  - kitchen.iterutils.iterate
  - kitchen.collections.StrictDict
  - OHOS-specific Unicode conversion test (HarmonyOS native)
  
  8 tests total, including 1 OHOS-specific test for Unicode handling
  in the HarmonyOS environment.
