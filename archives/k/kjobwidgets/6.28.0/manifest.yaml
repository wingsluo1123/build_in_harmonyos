    - "KF_IGNORE_PLATFORM_CHECK=TRUE（OHOS 不在 KDE 平台列表）"
    - "WITH_X11=OFF / USE_DBUS=ON（qtbase/6.11.1.1 提供 Qt6DBus；上游 2 个 autotest 实测 2/2 Passed，ctest --no-tests=error 强制注册数）"
