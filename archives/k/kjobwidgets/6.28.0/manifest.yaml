    - "qtbase cmake_find_mode=none → 手工 conan_cmakedeps_paths.cmake"
    - "CMAKE_PLATFORM_NO_VERSIONED_SONAME=ON（HMDFS 拒 symlink，不生成版本化 .so 软链）"
    - "CMAKE_SHARED_LIBRARY_SONAME_*_FLAG 注入（双变量；E330，CI L5a SONAME 闸）"
  common_dependencies:
    - qtbase/6.11.1.1
    - kcoreaddons/6.28.0
    - kwidgetsaddons/6.28.0
    - knotifications/6.28.0

