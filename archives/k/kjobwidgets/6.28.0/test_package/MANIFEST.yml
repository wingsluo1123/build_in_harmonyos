# test_package/MANIFEST.yml — kjobwidgets 6.28.0
test_name: test_kjobwidgets
test_type: consumer-e2e
driver: conanfile.py (CMake build against published package) + test.cpp (case executor)
files:
  - conanfile.py
  - CMakeLists.txt
  - test.cpp

cases:
  total: 5
  list:
    - "KWidgetJobTracker construction"
    - "registerJob/unregisterJob round-trip (real KJob subclass)"
    - "KDialogJobUiDelegate::setJob association"
    - "KJob::setUiDelegate/uiDelegate round-trip"
    - "KJob::setAutoDelete/isAutoDelete round-trip"

upstream_tests:
  registered: 2
  names: [kuiserver2jobtrackertest, kuiserver2jobtrackertest2]
  executed: 2
  result: "2/2 passed (ctest)"
  reason: >
    Both upstream autotests are HAVE_QTDBUS-guarded; USE_DBUS=ON with
    qtbase/6.11.1.1 (FEATURE_dbus=ON) enables them, and both run green
    in the conan create build step.
