software: klickety
version: "26.04.0"
status: published
package_type: application
build_system: cmake
created_at: 2026-10-15
language: cpp
description: "KDE SameGame/Clickomania adaptation - color-matching puzzle game (Qt6/KF6 QGraphics application, built on KDEGames6/libkdegames)"
homepage: https://invent.kde.org/games/klickety
upstream_source: https://mirrors.bfsu.edu.cn/kde/stable/release-service/26.04.0/src/klickety-26.04.0.tar.xz
source_sha256: d0cf11e0cac9c25542bbf912e80aaa228309a54ba690465310d09bb90833ef3f
license: "GPL-2.0-or-later"

dependencies:
  required:
    - qtbase/6.11.1
    - qtsvg/6.11.1
    - kconfig/6.18.0
    - kconfigwidgets/6.18.0
    - kcoreaddons/6.18.0
    - kcrash/6.18.0
    - kdbusaddons/6.18.0
    - ki18n/6.18.0
    - kiconthemes/6.18.0
    - kio/6.14.0
    - kwidgetsaddons/6.18.0
    - kxmlgui/6.18.0
    - libkdegames/26.04.0
  build:
    - ecm/6.26.0
  forced:
    - karchive/6.18.0 (override=True: libkdegames 26.04.0 graph precedent)

patches_applied:
  - patches/0001-cmake.patch
  - patches/0002-src-cmake.patch
  - patches/0003-src-ui.patch

test_results:
  type: no_upstream_tests_consumer_verified
  upstream: "No upstream test suite: the 26.04.0 tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing()/ecm_add_tests() call in any CMakeLists.txt (grep -rn over the extracted sources returns nothing outside po/). Upstream QA for this module happens via KDE CI source builds (.kde-ci.yml requires-passing-tests-on: Linux/FreeBSD/Windows)."
  test_package: "passed: 2/2 runtime smoke assertions - klickety --version prints the 26.04.0 version string and exits 0 (QCommandLineParser/KAboutData handle --version before GUI creation, QT_QPA_PLATFORM=offscreen headless-safe)."
  package_id: "pending"

platform_adaptations:
  - "KF6 DocTools removed from OPTIONAL_COMPONENTS and doc/ handbook + kdoctools_install(po) dropped (patch 0001): kdoctools is not part of the published KF6 6.18/6.26 closure and the DocBook handbook is not a runtime requirement (kfourinline 26.04.0 precedent)"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE (KDE platform detection does not know OHOS)"
  - "KF_SKIP_PO_PROCESSING=ON (translation catalogs skipped; gettext msgfmt toolchain not needed for smoke-verified deliverable)"
  - "karchive/6.18.0 override=True pin (libkdegames 26.04.0 graph precedent)"
  - "Linker flags -Wl,-z,max-page-size=0x1000: OHOS musl loader workaround (kfourinline 26.04.0 / audiocd 26.04.3 precedent)"
  - "ECM_MODULE_PATH + conan_cmakedeps_paths.cmake written manually (qtbase/KF6 packages use cmake_find_mode=none)"

known_issues:
  - "klickety is a GUI game: on a headless machine it needs QT_QPA_PLATFORM=offscreen for the --version smoke; full gameplay requires a display/launcher environment"
