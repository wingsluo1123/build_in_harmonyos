patches_applied:
  - "0001-ohos-printsupport-cmake.patch"
  - "0002-ohos-printsupport-source.patch"

knowledge_gained:
  - "发布的 qtbase/6.11.1 以 FEATURE_printsupport=OFF 构建，不提供 Qt6PrintSupport 模块与库；kmag 上游已用 QT_NO_PRINTER 守卫打印实现，只需在 find_package/链接行移除组件、给目标加 QT_NO_PRINTER 并删掉 .rc 中两个 file_print 动作（ref: ksystemlog 26.04.0 同类处理）"
  - "QT_QPA_PLATFORM_PLUGIN_PATH 是单个目录而非路径列表：写成 a:b 时 Qt 把整串当目录导致 offscreen 插件找不到（qt.core.plugin.factoryloader 显示扫描的是 'a b' 这一不存在的路径）；test_package 中应去重后只指向实际含 libqoffscreen.so 的目录，其余插件根走 QT_PLUGIN_PATH 路径列表"
  - "kconfigwidgets/6.18.0 在 6.26 override 图下 package_id 变化（be43a923...），本地需从源码重建；源 tarball 走 download.kde.org 会被重定向到 bfsu（TLS 自签证书失败），须用 NJU 镜像的 kconfigwidgets-6.18.0.tar.xz（sha256 aa5a7be6278a19733f77e6a435f84c3e71926b28f1ac3766313778890d640813）种子进 srccache-isc/s 并用 --build=kconfigwidgets/6.18.0 强制构建以跳过 compatible configurations 远程扫描"
