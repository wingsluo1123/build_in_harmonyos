  - "bin/（58 个可执行文件与 Perl 脚本：meryl、leaff、sim4db、snapper2、tapper、seagen、sim4dbutils/* ...）"
  - "lib/libkmer.a、libmeryl.a、libmerylguts.a、libseq.a、libbio.a、libsim4.a、libutil.a、libkaz.a、libmt19937ar.a"
