tests:
  upstream_suite: >
    29 个草稿用例（*/test/ 目录：libutil/test 18、libbio/test 3、libkmer/test 3、meryl/test 2、libseq/test 1、seagen/test 2；
    其中 25 个文件名含 test）；无 check 目标、无测试驱动、无期望输出文件，
    且这些目录没有 Make.include（上游 make 从不编译它们）
  upstream_audit: "build(): grep check_PROGRAMS/TESTS/check 目标 + ls */test/Make.include（均 No such file），结果随 conan create 日志留证"
  upstream_run: >
    build() 内主动编译并运行全部 29 个草稿用例（脚本由配方生成），输出 SCRATCH-PASS / SCRATCH-FAIL-COMPILE /
    SCRATCH-FAIL-RUN 与 SCRATCH-SUMMARY；实测 pass=17 run_fail=2 compile_fail=10
  upstream_pass_rate: "17/29（58.6%）；test 命名的 25 个中 15/25（60%）"
  upstream_fail_reasons: >
    9 个引用同一 tarball 内已不存在的内部 API（seqCache / bzipBuffer / merToString / pdumppalloc 签名 / libbri.H 缺失），
    1 个为上游自带停用开关（merTable.H: #error merTable should be unused），
    1 个需预构建的 meryl 内部数据库，1 个启动即 SIGTRAP（atomic.C），
    1 个上游硬编码了作者本机绝对路径（/home/work/src/genomics/...）
  consumer_checks: 6
  consumer_failures: 0
  consumer_pass_rate: "6/6 (100%)（test_package/test_kmer.cc：md5_string 两条 RFC 1321 向量、reverseString、reverseComplementSequence 两条、uint64MAX/uint32MAX）"
  command: "conan create archives/k/kmer/0-20150903-r2013 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

