  sha256: "cfe906a34034cafda9e74b7b38937a63b4b2d14850ae57a64e859375b54869ba"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DBUILD_TESTING=OFF（上游 0 注册测试；清点证据见 test_package/MANIFEST.yml）"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE（OHOS 不在 KDE 平台白名单）"
    - "-DKF_SKIP_PO_PROCESSING=ON（平台无 msgfmt/lconvert；.qm 目录非功能必需）"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_EXE_LINKER_FLAGS_INIT=-Wl,-z,max-page-size=0x1000（OHOS 加载器要求 4-LOAD 段布局；audiocd 26.04.3 先例）"
    - "-DCMAKE_SHARED_LINKER_FLAGS_INIT=-Wl,-z,max-page-size=0x1000（同源布局要求）"
    - "-DQT_ADDITIONAL_PACKAGES_PREFIX_PATH=<qtsvg 前缀>（Qt6Svg 跨包组件查找；否则 find_package(Qt6 ... Svg) 先命中 qtbase 配置而失败）"
    - "-DECM_MODULE_PATH=<ecm/share/ECM 的 modules;find-modules;kde-modules>（CMakeDeps 生成的 ECMConfig 不带模块路径，手工注入）"
    - "conan_cmakedeps_paths.cmake（CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON + CMAKE_PREFIX_PATH/CMAKE_LIBRARY_PATH/CMAKE_INCLUDE_PATH 注入：CMakeDeps 不写 cmake_find_mode=none 的包，kmines 主配方与 test_package 同源手工补齐）"
    - "KF6DocTools 不注入：上游 find_package(KF6DocTools) 无 REQUIRED，doc/ 与 kdoctools_install(po) 都在 if(KF6DocTools_FOUND) 内，未发布时自动跳过——本包无需补丁"

  dependencies:
    - "qtbase/6.11.1"
    - "qtsvg/6.11.1"
    - "kconfig/6.18.0"
    - "kconfigwidgets/6.18.0"
    - "kcoreaddons/6.18.0"
    - "kcrash/6.18.0"
    - "kdbusaddons/6.18.0"
    - "kdnssd/6.29.0"
    - "ki18n/6.18.0"
    - "ktextwidgets/6.18.0（KF6::TextWidgets）"
    - "kwidgetsaddons/6.18.0"
    - "kxmlgui/6.18.0"
    - "kiconthemes/6.18.0.1（override=True：6.18.0 最新配方修订转向 karchive/6.19.0，registry 无 6.18 线二进制；6.18.0.1 是该配方对 karchive/6.18.0 的重建，kmousetool 26.04.0 先例）"
    - "libkdegames/26.04.0.1（KDEGames6 + KDEGames6Private；.1 修订携带 SONAME/DT_NEEDED 修复）"
    - "karchive/6.18.0（override=True：与 knewstuff/6.18.0 闭包保持一致）"
    - "ecm/6.26.0 (tool_requires)"

  cc: clang
  cxx: clang++

