software: knewstuff5
display: "KNewStuff (KF5)"
description: "KDE Frameworks 5 Get Hot New Stuff framework (libKF5NewStuffCore + qtquick plugin + knewstuff-dialog)"
category: library
homepage: "https://invent.kde.org/frameworks/knewstuff"
license: LGPL-2.1-only OR LGPL-3.0-only OR LicenseRef-KDE-Accepted-LGPL
build_system: cmake

ohos_adaptation:
  key_points:
    - "KNEWSTUFF_OHOS_SCOPED scoped build: only KF5NewStuffCore + qtquick plugin + knewstuff-dialog are built; widgets layer (KIO/XmlGui/KService/Completion/IconThemes/Package/WidgetsAddons) is skipped"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KF_SKIP_PO_PROCESSING=ON: skip translation catalog generation (Qt5LinguistTools not in OHOS Qt5 build)"
    - "E505/E212: runtime mirror of all dependency .so files in build/runtime-mirror with self-signing via binary-sign-tool, because HMDFS MAC policy requires signed .so and musl loader cannot resolve versioned soname symlinks under LD_LIBRARY_PATH"
    - "Upstream autotests/core/ (3 tests) pass 100% (knewstuffauthortest, knewstuffenginetest, installationtest)"
  common_dependencies:
    - qt5-qtbase
    - qt5-qtdeclarative
    - attica5
    - karchive5
    - kconfig5
    - kcoreaddons5
    - ki18n5
    - kpackage5
    - kirigami2
