knowledge_gained:
  - "knotifications 6.28.0 keeps the 6.26.0 recipe shape (KF_IGNORE_PLATFORM_CHECK=TRUE, USE_DBUS=OFF, the DBus/Canberra if(FALSE) block, the po/qm disable); the patch additionally re-quiets the Python-bindings probe, drops the unconditional ECMQmlModule include (Qt6Qml is not part of the published qtbase package), and the build dependency moves to ecm/6.28.0."
  - "OHOS shared-library rules must be SONAME-only: with CMAKE_SHARED_LIBRARY_RUNTIME_* (rpath) defined, cmake's install() rewrites the ELF and strips the RUNPATH, after which the device loader rejects dlopen of the installed library (EACCES). The recipe writes a rules file containing only set(CMAKE_SHARED_LIBRARY_SONAME_C_FLAG/-CXX_FLAG \"-Wl,-soname,\") plus CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE; install() then reduces to a byte-identical copy of the build artifact (kitemviews 6.28.0 precedent)."
  - "libKF6Notifications.so needs only Qt6Gui at configure time from its consumers (KF6NotificationsConfig.cmake.in runs find_dependency(Qt6Gui); KF6Config is find_dependency'd only for static builds); KF6ConfigCore enters as a bare DT_NEEDED at runtime, so the consumer test_package must require kconfig/6.26.0.1 explicitly for the loader to resolve and for the E537 regression check to hold on a clean cache."
  - "Upstream CTest N is 0 in this feature set: the autotest (knotification_test) needs a DBus session bus and is commented out upstream, and tests/ is HAVE_DBUS-guarded. ctest must run with --no-tests=ignore (not error) so a genuine 0-test set stays green while any real test failure still fails the build; the consumer-side coverage is carried by test_package (12 + 6 checks)."
