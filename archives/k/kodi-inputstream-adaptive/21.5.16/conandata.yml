# Vendored build-time dependency (not a conan package on the ohpcd registry):
# the xbmc Bento4 fork that upstream pins in depends/common/bento4/bento4.txt
# ("bento4 https://github.com/xbmc/Bento4/archive/refs/tags/1.6.0-641-3-Omega.tar.gz")
# and builds internally via ENABLE_INTERNAL_BENTO4 (FindBento4.cmake, explicit
# -fPIC). The registry bento4/1.6.0-641 is the axiomatic-systems official
# upstream of a DIFFERENT version family (the xbmc fork carries 3 extra
# patches, ISA is written against the fork API), so the recipe builds the
# pinned fork in-tree (conanfile.source() extracts it to <source>/bento4).
bento4:
  url:
    - "https://gh-proxy.com/https://github.com/xbmc/Bento4/archive/refs/tags/1.6.0-641-3-Omega.tar.gz"
    - "https://github.com/xbmc/Bento4/archive/refs/tags/1.6.0-641-3-Omega.tar.gz"
  sha256: "a9b231b63159b3a4d9e47c5328b476308852bf092ccb9ce98f7cf46a386465ce"

patches: {}
