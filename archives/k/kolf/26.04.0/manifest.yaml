language: cpp
description: "KDE 迷你高尔夫游戏（Kolf）——Qt6/KF6 QWidget 图形应用，2D 俯视球场，基于 KDEGames6（libkdegames），物理引擎 Box2D 静态内嵌"
homepage: https://invent.kde.org/games/kolf
