# 软件级 manifest
# 文件位置: archives/k/kolf/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: kolf

display: "Kolf"

description: "KDE 迷你高尔夫游戏（Kolf）——Qt6/KF6 QWidget 图形应用，2D 俯视球场，基于 KDEGames6"

category: game

homepage: "https://invent.kde.org/games/kolf"

license: GPL-2.0-or-later

build_system: cmake

ohos_adaptation:
  key_points:
    - "KF6 DocTools 不在已发布 KF6 闭包内：从 find_package(KF6 COMPONENTS ...) 移除 DocTools，并去掉 add_subdirectory(doc) 与 kdoctools_install(po)"
    - "kio 取 6.14.0 recipe + 消费者 override=True 抬到 KF6 6.18.0 闭包（制品仓仅发布 kio 6.14.0/6.26.0；ktuberling 26.04.0 先例）"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE + KF_SKIP_PO_PROCESSING=ON（KDE 应用 OHOS 标准 env 组合）"
    - "karchive/6.18.0 override=True（libkdegames 图约束）"
    - "上游无测试套件（405 条目零测试注册）：build() 输出 no_tests 证据并持久化至 res/，test_package 做 4 断言消费者冒烟"
    - "Box2D 物理引擎源码内嵌（src/3rdparty），无额外系统依赖"
  common_dependencies:
    - qtbase
    - qtsvg
    - libkdegames
    - kio
    - kcompletion
    - ktextwidgets
    - ki18n
    - kcoreaddons
    - kconfig
    - kconfigwidgets
    - kcrash
    - kdbusaddons
    - kdnssd
    - kwidgetsaddons
    - kxmlgui
    - kiconthemes
    - ecm

versions:
  "26.04.0":
    status: built
    build_date: 2026-10-16
    conan_ref: "kolf/26.04.0"
