software: kollision
version: "26.04.0"
status: published
package_type: application
build_system: cmake
created_at: 2026-10-18
language: cpp
description: "KDE ball-dodging game (Qt6/KF6 QGraphics application, built on KDEGames6/libkdegames)"
homepage: https://invent.kde.org/games/kollision
upstream_source: https://download.kde.org/stable/release-service/26.04.0/src/kollision-26.04.0.tar.xz
source_sha256: d18e8288525e5ee529f352e651d9317981393084126b57b07e10e9f06094debc
license: "GPL-2.0-or-later"

dependencies:
  required:
    - qtbase/6.11.1
    - qtsvg/6.11.1
    - kconfig/6.18.0
    - kconfigwidgets/6.18.0
    - kcoreaddons/6.18.0
    - kcrash/6.18.0
    - kdbusaddons/6.18.0
    - ki18n/6.18.0
    - kiconthemes/6.18.0
    - kwidgetsaddons/6.18.0
    - kxmlgui/6.18.0
    - libkdegames/26.04.0.1
  build:
    - ecm/6.26.0
  forced:
    - karchive/6.18.0 (override=True: libkdegames 26.04.0.1 graph precedent)

patches_applied:
  - patches/0001-cmake.patch

test_results:
  type: no_upstream_tests_consumer_verified
  upstream: "No upstream test suite: the 26.04.0 tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing()/ecm_add_tests() call in any CMakeLists.txt (grep -rn over the extracted sources returns nothing outside po/). Upstream QA for this module happens via KDE CI source builds."
  test_package: "passed: 2/2 runtime smoke assertions - kollision --version prints the 26.04.0 version string and exits 0 (QCommandLineParser/KAboutData handle --version before GUI creation, QT_QPA_PLATFORM=offscreen headless-safe)."
  package_id: "pending"

platform_adaptations:
  - "KF6 DocTools removed from REQUIRED_COMPONENTS and doc/ handbook + kdoctools_install(po) dropped (patch 0001): kdoctools is not part of the published KF6 6.18/6.26 closure and the DocBook handbook is not a runtime requirement (klickety 26.04.0 precedent)"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE (KDE platform detection does not know OHOS)"
  - "KF_SKIP_PO_PROCESSING=ON (translation catalogs skipped; gettext msgfmt toolchain not needed for smoke-verified deliverable)"
  - "karchive/6.18.0 override=True pin (libkdegames 26.04.0.1 graph precedent)"
  - "Linker flags -Wl,-z,max-page-size=0x1000: OHOS musl loader workaround (klickety 26.04.0 precedent)"
  - "ECM_MODULE_PATH + conan_cmakedeps_paths.cmake written manually (qtbase/KF6 packages use cmake_find_mode=none)"

known_issues:
  - "kollision is a GUI game: on a headless machine it needs QT_QPA_PLATFORM=offscreen for the --version smoke; full gameplay requires a display/launcher environment"
