# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kollision/26.04.0.

package: kollision/26.04.0
homepage: https://invent.kde.org/games/kollision

upstream_check_command: "grep -rn 'add_test\\|enable_testing\\|ecm_add_tests' --include='*.txt' --include='*.cmake' . | grep -v '^./po' || true"
upstream_test_in_build: false
upstream_test_command: "n/a - upstream registers no test suite (no tests/, autotests/ or add_test() in the 26.04.0 tarball)"

upstream_tests:
  - file: "(none)"
    source: kollision-26.04.0.tar.xz
    description: "No upstream test suite: the tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing()/ecm_add_tests() call in any CMakeLists.txt. Upstream QA for this module happens via KDE CI source builds."
    command: "n/a"

test_package_tests:
  - file: test_package/test.sh
    description: "Runtime smoke of the shipped executable: kollision --version prints version containing 26.04.0 and exits 0 (QCommandLineParser/KAboutData handle --version before GUI creation, QT_QPA_PLATFORM=offscreen keeps it headless-safe)."
    command: "conan create (test_package runs test.sh against the installed bin/kollision)"

assertion_count: 2
