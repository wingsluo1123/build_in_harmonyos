# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kona/20211225
homepage: https://github.com/kevinlawler/kona

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - name: "k_test"
    source: kona-20211225/k_test
    description: "kona 内置测试二进制（k_test target）"
    command: "./k_test"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "k 解释器基本功能验证（算术、iota、求和）"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 4
