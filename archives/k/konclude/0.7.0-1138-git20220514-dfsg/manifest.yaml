knowledge_gained:
  - "上游 qmake 项目（.pro/.pri）在 OHOS 上可直接用 qt5-qtbase 提供的 qmake 构建；无需另造 CMake 工程"
  - "qt5-qtbase 制品内的 qt.conf 与 mkspecs/*.pri 硬编码其构建目录，消费方必须做可重定位修正，否则报 Unknown module(s) in QT"
  - "上游 .pro 链接树内预编译 x86_64 Redland/jemalloc：aarch64 必须切换到上游官方的 WithoutRedland 变体"
  - "KoncludeWithoutRedland 下 SPARQL 简易解析仍可用（OWL/XML 本体），但 Turtle/RDF 解析静默产出空知识库"
  - "上游快照 applyATLEASTRule() 的空值守卫求值顺序缺陷导致 SROIQ 本体分类 SIGSEGV；FaultLogger+寄存器+反汇编可闭环定位 NULL 实参"
  - "refresh-patch 的 difflib 通道用通用换行读取，CRLF 源码的补丁必然 dry-run 失败（本次据 R14 走手动模式并以逐字节校验保真）"

