dependencies:
  required:
    - qtbase/6.11.1
    - qtsvg/6.11.1
    - qtscxml/6.11.1
    - karchive/6.18.0 (override=True)
    - kcodecs/6.18.0
    - kcolorscheme/6.18.0
    - kconfig/6.18.0
    - kconfigwidgets/6.18.0
    - kcoreaddons/6.18.0
