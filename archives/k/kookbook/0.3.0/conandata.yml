  - patch_file: "patches/0002-src-desktop-mainwindow.cpp.patch"
    patch_description: "OHOS: 主工具栏移除“打印当前食谱”与“打印预览当前食谱”两个动作（二者绑定 MainPane::print/printPreview）"
    patch_type: "portability"
  - patch_file: "patches/0003-src-desktop-panes-CMakeLists.txt.patch"
    patch_description: "OHOS: panes 静态库的 PUBLIC 链接列表移除 Qt::PrintSupport（与 0001 配套）"
    patch_type: "portability"
  - patch_file: "patches/0004-src-desktop-panes-mainpane.cpp.patch"
    patch_description: "OHOS: MainPane 移除 QPrintDialog/QPrintPreviewDialog/QPrinter 打印实现与对应头文件引用（与 0001 配套）"
    patch_type: "portability"
  - patch_file: "patches/0005-src-desktop-panes-mainpane.h.patch"
    patch_description: "OHOS: MainPane 移除 print()/printPreview() 槽声明（与 0004 配套）"
    patch_type: "portability"
