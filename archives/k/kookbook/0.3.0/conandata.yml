patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "OHOS: 制品仓 qtbase/6.11.1 的 FEATURE_printsupport=OFF（包内无 libQt6PrintSupport.so / Qt6PrintSupportConfig.cmake），从顶层 find_package(Qt6) 组件列表移除 PrintSupport"
