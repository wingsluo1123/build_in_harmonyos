# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "制品仓 qtbase 线的依赖拓扑：qtbase/6.11.1 是全部已发布 Qt6 模块（含 qtdeclarative/6.11.1）的构建基线；带 Qt6::PrintSupport 的是 qtbase/6.11.1.3，但 qtdeclarative/6.11.1 与 /6.11.1.1 精确声明 qtbase/6.11.1（conan Version conflict），qtdeclarative/6.11.1.2 在 qtbase/6.11.1.3 下把 qtshadertools/6.11.1 解析到未发布的 package id（Missing prebuilt package）。因此 Qt6 应用同时需要 Qml 与 PrintSupport 时，二者当前不可兼得。"
- "qtbase/6.11.1 的 binary 实际带 libQt6Test.so 与 Qt6TestConfig.cmake（组件表中未声明 test 组件），纯 QtTest 上游测试可直接 BUILD_TESTING=ON + ctest 在目标机运行。"
- "KDE ECM 作为 tool_requires 时，ECM_MODULE_PATH 与 conan_cmakedeps_paths.cmake 需手工注入（qtbase 用 cmake_find_mode=none，CMakeDeps 不生成后者）；ECMQueryQt 需要显式 QUERY_EXECUTABLE=<qtbase>/bin/qtpaths6，否则 KDEInstallDirs 无法解析安装目录。"
- "GUI 应用的消费者端到端验证：kookbook 无 CLI 输出、不会自行退出、Qt 未安装信号处理器（SIGINT/SIGTERM 不触发析构，QSettings 不写回），因此业务输出改用进程外 inotify 观测——监视应用默认集合目录，核对运行中的应用真实打开并读取每一个 *.recipe.md（即 Scanner 扫描/RecipeParser 解析所消费的字节）。注意本机 hmdfs/tmpfs 的 atime 不更新（对照实验：cat 读取后 atime 不变），不能作为读取证据。"
- "QTextDocument 对 markdown 相对路径图片资源为惰性加载（仅在绘制到视口时 loadResource），offscreen QPA 下即使窗口已显示也不保证加载，不能作为渲染证据。"

