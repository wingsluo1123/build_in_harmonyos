# 软件级 manifest
# 文件位置: archives/k/kookbook/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: kookbook
display: "KookBook"
description: "面向结构化 Markdown（*.recipe.md）食谱集合的食谱管理器，提供 Qt6 Widgets 桌面应用与 Qt6 Qml 触屏应用两个前端"
category: utility
homepage: "https://invent.kde.org/utilities/kookbook"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
  - "依赖拓扑是本包最关键的适配约束：带 Qt6::PrintSupport 的制品线（qtbase/6.11.1.3）与唯一可用的 qtdeclarative（6.11.1，精确锁 qtbase/6.11.1）互斥，且 qtdeclarative/6.11.1.2 在 6.11.1.3 下缺 qtshadertools 传递 binary；同时需要 Qml 与 PrintSupport 时二者不可兼得"
  - "本配方保留 Qt6::Qml（kookbooktouch 前端），裁剪 Qt6::PrintSupport（打印/打印预览两个工具栏动作），与 kgraphviewer 26.04.0 / kdiagram 3.0.1 / kapow 1.7.0 / conducteo 5.0.2 同一取舍"
  - "KDE ECM 以 tool_requires 引入时，必须手工注入 ECM_MODULE_PATH 并自行生成 conan_cmakedeps_paths.cmake（qtbase 用 cmake_find_mode=none）"
  - "ECMQueryQt 需要显式 QUERY_EXECUTABLE=<qtbase>/bin/qtpaths6，否则 KDEInstallDirs 无法解析安装目录"
  - "Qt6 组件（Qml 来自 qtdeclarative）需要 QT_ADDITIONAL_PACKAGES_PREFIX_PATH，否则顶层 find_package(Qt6 COMPONENTS Qml) 解析不到"
  - "qtbase/6.11.1 的 binary 实际含 libQt6Test.so + Qt6TestConfig.cmake，上游 QtTest 套件可 BUILD_TESTING=ON + ctest 在目标机跑通"
  - "GUI 应用的规则12 验证：应用无 CLI 输出且不自行退出，Qt 未装信号处理器，业务输出改用进程外 inotify 观测其对集合内 *.recipe.md 的 OPEN/ACCESS 读取"

  common_dependencies:
  - qtbase
  - qtdeclarative
  - extra-cmake-modules

versions:
  "0.3.0":
    status: built
    build_date: "2026-10-15"
