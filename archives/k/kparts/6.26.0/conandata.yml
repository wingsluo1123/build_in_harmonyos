# conandata.yml — kparts 6.26.0
sources:
  url: "https://download.kde.org/stable/frameworks/6.26/kparts-6.26.0.tar.xz"
  sha256: "049c2cf048b4cbbffe0bea9357bd9ab53b8be672ba509b2bb058f764d21b3f5b"

patches:
  - patch_file: "patches/0001-lower-cmake-and-kf-dep-version.patch"
    patch_description: "Two version floors of the top-level CMakeLists.txt, both lowered to what the OHOS toolchain and the published ohpcd packages actually provide. (1) cmake_minimum_required 3.29 -> 3.22: the OpenHarmony SDK build-tools CMake we build with is 3.28.2 (CI worker / host toolchains are in the same range) and no 3.29-only command is used, so upstream's 3.29 floor is a release-script default that hard-fails configure here. (2) KF_DEP_VERSION 6.26.0 -> 6.14.0: ohpcd's only kio containing KIOWidgets is kio/6.14.0 (kio/6.26.0 is a KIOCORE_ONLY build with no KIOWidgets target and no KUriFilter header, while kparts' NavigationExtension really uses KUriFilter/KUriFilterData and src/CMakeLists.txt links KF6::KIOWidgets). Mixing kio/6.14.0 into the 6.26 series would force kio 6.14 to be rebuilt from source, which fails in its trash worker. The whole KF6 graph therefore stays on the published 6.14.0 series; every KF6/KIO API used by kparts 6.26 exists there."
    patch_type: "portability"
  - patch_file: "patches/0002-lowercase-kio-includes-readonlypart.patch"
    patch_description: "Include the KIO headers by their installed paths (kio/filecopyjob.h, kio/statjob.h) instead of the CamelCase forwarding names (<KIO/FileCopyJob>, <KIO/StatJob>). The ohpcd kio package installs the headers under include/KF6/KIOCore/kio/, so the CamelCase spelling only resolves on a case-insensitive filesystem while the exported include directory is include/KF6/KIOCore. Identical declarations, no behaviour change; makes the build filesystem independent."
    patch_type: "portability"
  - patch_file: "patches/0003-lowercase-kio-includes-readwritepart.patch"
    patch_description: "Same CamelCase -> installed-path include fix for src/readwritepart.cpp (<KIO/FileCopyJob> -> kio/filecopyjob.h); identical declarations, no behaviour change, keeps the build independent of filesystem case sensitivity."
    patch_type: "portability"
