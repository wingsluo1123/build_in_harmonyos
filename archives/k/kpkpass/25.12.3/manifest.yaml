knowledge_gained:
  - "kpkpass installs its public headers under include/KPim6/KPkPass and exports INTERFACE_INCLUDE_DIRECTORIES=include/KPim6, so consumers include <KPkPass/pass.h> style paths; pass.h only forward-declares QImage, so consumers that call Pass::logo() must include <QImage> themselves."
  - "The org.kde.pkpass QML plugin (src/quick) is built unconditionally upstream, so qtdeclarative is a hard dependency even for C++-only consumers of KPim6PkPass."
  - "ECM 6.26 FindSharedMimeInfo runs update-mime-database -v at configure time; version >= 2.5 disables both upstream MIME XML install rules, so pinning shared-mime-info/2.5.1 through UPDATE_MIME_DATABASE_EXECUTABLE avoids needing a MIME database update during install."
  - "HMDFS rejects the versioned .so.6/.so symlink chain CMake creates for a VERSION/SOVERSION target (symlink EPERM at link time); CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE plus explicit CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname, produces a single unversioned libKPim6PkPass.so that still records DT_SONAME (attica 6.14.0 precedent)."
  - "CMake install rewrites the installed RUNPATH, which invalidates the OHOS build-time .codesign section; both packaged ELFs (the library and the QML plugin) are re-signed with binary-sign-tool -selfSign 1 in package()."
