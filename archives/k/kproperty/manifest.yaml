software: kproperty
display: "KProperty"
description: "Qt property editing framework with KDE integration"
category: library
homepage: "https://invent.kde.org/libraries/kproperty"
license: LGPL-2.0-or-later
build_system: cmake
ohos_adaptation:
  key_points:
    - "Keep Qt5 host ABI separate from build-context translation tools."
    - "Add the package share directory to runtime XDG_DATA_DIRS before resource-dependent tests."
    - "A missing resource can open a modal error dialog even in an original GUILESS test."
  common_dependencies: [qt5-qtbase, kconfig5, kcoreaddons5, kguiaddons5, kwidgetsaddons5]
versions:
  "3.2.0":
    status: built
    build_date: "2026-10-14"
    conan_ref: "kproperty/3.2.0"
