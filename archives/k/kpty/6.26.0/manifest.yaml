knowledge_gained:
  - "kpty 6.26.0 是 KDE Frameworks 6 的 pty 抽象层（KPty / KPtyDevice / KPtyProcess），SOVERSION 6，安装 KF6PtyConfig.cmake 自带 find_dependency(Qt6Core/KF6CoreAddons/KF6I18n)，配方须用 cmake_find_mode=none 避免 CMakeDeps 覆盖。"
  - "OHOS sysroot 提供 pty.h 且 libc 已导出 openpty/forkpty，因此 KPty 的 pty 分配路径本身无需补丁（早期「kpty 平台缺口」假设已证伪）；本包实际需要的两处补丁在 CMake UNIX 判定（0001）与 utmp 符号（0002）。"
  - "kpty 在无 UTEMPTER 时走 utmp/utmpx 回退（src/kpty.cpp 的 utmpname/setutent/getutline/pututline 分支）；OHOS libc 仅导出 login_tty、缺 updwtmp/getutline（E121 只收录 utmpx 族，utmp 族符号缺口尚未入库，待补草稿），由补丁 0002 以中性符号探测 + 无平台宏回退兜底。"
  - "上游自带测试唯一 CTest 目标为 kptyprocesstest（QTest 5 槽：test_pty_basic / test_pty_signals / test_ctty / test_shared_pty / test_suspend_pty），BUILD_TESTING=ON 时随 conan create 实跑。"
