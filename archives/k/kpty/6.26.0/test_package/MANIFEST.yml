# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kpty/6.26.0
homepage: "https://invent.kde.org/frameworks/kpty"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --test-dir <build> --output-on-failure --no-tests=ignore"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=ignore"

# 上游实际运行的测试程序
upstream_tests:
  - file: autotests/kptyprocesstest.cpp
    source: kpty-6.26.0.tar.xz/autotests/kptyprocesstest.cpp
    description: "KPtyProcessTest (QTest) - CTest 目标 kptyprocesstest，含 5 个槽: test_pty_basic / test_pty_signals / test_ctty / test_shared_pty / test_suspend_pty；覆盖 KPtyProcess 经 pty 拉起子进程、信号与读回调链路"
    command: "ctest -R kptyprocesstest --output-on-failure"
    result: "实测 1 目标 / 0 通过（initTestCase PASS；test_pty_basic / test_pty_signals / test_ctty / test_shared_pty 四槽 FAIL!，随后在 test_shared_pty 内 SIGSEGV）"
    exemption_note: "平台行为尚未定位，不宣称通过；按实测如实申报，断言级覆盖由 test_package/ 消费者用例承担（KPty 7 个 API 检查点 / 8 处 fail 守卫）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者用例：以 KF6::Pty 为依赖直接驱动内核 pty 路径 —— KPty::open() / ttyName() / masterFd() / slaveFd() / setEcho() / setWinSize() / tcGetAttr() 七个 API 检查点，8 处 return fail() 断言守卫"
    command: "./test_kpty"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
