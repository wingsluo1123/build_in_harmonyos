patches:
  "5.116.0":
    - patch_file: "patches/0001-ohos-portability.patch"
      patch_description: >-
        Portability for HarmonyOS: include <QFile>/<QFileInfo> explicitly
        instead of relying on transitive Qt includes; replace the removed
        QString::sprintf with QString::asprintf and the bare endl with
        Qt::endl; and compile out KPty::login()/logout() on platforms that have
        neither the utmpx API (HAVE_UTMPX) nor login()/logout() (HAVE_LOGIN),
        which is the only case where upstream falls back to the legacy
        updwtmp()/getutline() bookkeeping that the OHOS stub utmp.h does not
        provide. The bodies are enclosed with #if/#else so they are excluded at
        compile time; platforms with a real utmp are unaffected.
        Finally, KPtyDevicePrivate::_k_canRead() sizes its read from an
        ioctl(TIOCINQ) on the pty master; HarmonyOS denies that ioctl (and
        FIONREAD, the same request number) with EACCES on the master while the
        slave answers it, so the guarded read never ran, the zero byte count was
        taken for EOF and the read notifier was switched off - all five upstream
        KPtyProcessTest cases then failed on a pty that never delivered a byte.
        The patch falls back to reading a chunk when the ioctl fails; the master
        is O_NONBLOCK, so the read returns what is queued and the surplus
        reservation is released. Where the ioctl works nothing changes,
        including the closed-slave case that legitimately reads zero bytes.
      patch_type: portability
