knowledge_gained:
  - "The published KF5 5.116.0 set is split across two Qt5 baselines: kcoreaddons5 pins qt5-qtbase/5.15.2 while ki18n5 pins 5.15.2.2, so any recipe needing both is unresolvable without force=True. kjobwidgets5/5.116.0 documents the same conflict and the same remedy."
  - "ki18n5's KF5I18nConfig.cmake includes KF5I18nMacros.cmake which calls find_package(Gettext); FindGettext only probes PATH, so GETTEXT_MSGFMT_EXECUTABLE/GETTEXT_MSGMERGE_EXECUTABLE have to be set explicitly from the gettext package."
  - "On HarmonyOS every CMake check_* probe reports 'not found' (even for termios.h and pty.h, which the sysroot ships) because CMAKE_SYSTEM_NAME is the unknown 'HarmonyOS'. Pre-defining the answers as cache variables makes the probes skip; kpty then takes the openpty() path instead of dying on '#error No method to open a PTY master detected'. Values must be verified against the sysroot, not assumed."
  - "kpty.cpp relies on transitive Qt includes for QFile/QFileInfo, and uses QString::sprintf and a bare endl, none of which exist in this Qt5 configuration."
  - "The OHOS utmp.h is a stub: _PATH_WTMP is /dev/null/wtmp and it declares pututline/getutent but not updwtmp/getutline. A compile-time guard must ENCLOSE the affected function bodies - a bare early return inside an #if does not stop the rest of the function from being compiled."
  - "For the ctest suite to start at all, the command has to run inside Conan's generated run environment (env=\"conanrun\"); with the default conanbuild env the binaries could not resolve libKF5CoreAddons.so.5 even with those directories explicitly on LD_LIBRARY_PATH."
