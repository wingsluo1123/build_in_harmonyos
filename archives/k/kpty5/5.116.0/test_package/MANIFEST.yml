# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kpty5/5.116.0
homepage: "https://invent.kde.org/frameworks/kpty"

# 上游测试命令 (ctest, CMake 项目)
upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"

# conanfile.py build() 中是否已集成上游测试
# 说明: 是。build() 在构建树仍在时执行上游 CTest 套件并把两层账目
# （程序层 / runtime case 层）写进构建日志，因此下面每个数字都能从日志复算。
upstream_test_in_build: true
upstream_measured:
  built_executables: 1
  ctest_registrations: 1
  runtime_cases: 5
  passed: 4
  failed: 0
  skipped: 0
  not_run: 0
  unknown_cases: 0
  environment_blocked: 1        # test_pty_basic：设备 bash 会先把 getcwd 抱怨写进 pty，
                                # 逐字节比对必然不符；pty 往返本身是通的，按环境阻塞记录，
                                # 既不算通过也不算库缺陷（详见 manifest.yaml 的 test_results）
  verified_head: "2be6df7be60a45c0f7f81aadf1d77437038b4149"

# 上游实际运行的测试程序（ctest 1 项注册，5 个 runtime case）
upstream_tests:
  - file: autotests/kptyprocesstest.cpp
    source: kpty-5.116.0/autotests/kptyprocesstest.cpp
    count: 5
    count_unit: cases
    description: "KPtyProcess — test_pty_basic / test_pty_signals / test_ctty / test_shared_pty / test_suspend_pty（initTestCase、cleanupTestCase 是夹具，不计入）"
    command: "ctest -R kptyprocesstest"

# test_package 中自带的测试 (消费者视角验证, 调用 KF5::Pty)
test_package_tests:
  - file: test_kpty5.cpp
    count: 9
    count_unit: assertions
    description: "消费者测试：安装后的 KF5::Pty 9 个断言点（pty 对分配、master/slave fd 可用且互异、ttyName()、setWinSize()、setEcho()，以及 fork 子进程经 master 原样读回负载）"
    command: "./test_kpty5"

# 上游 runtime case 总数（真机实测：kptyprocesstest 的 Totals 行）
assertion_count: 5

# CI checker 读取的扁平键（scripts/ohc/submission.py: test_passed/test_failed）
# 4 + 0 + 0 < test_total = 5：第 5 个 case（test_pty_basic）为 ENVIRONMENT_BLOCKED
test_total: 5
test_passed: 4
test_failed: 0
test_skipped: 0
