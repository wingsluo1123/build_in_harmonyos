software: kpty5
display: "kpty5"
description: "KDE Frameworks 5 伪终端(PTY)库与进程包装器（Qt5）"
category: system
homepage: "https://invent.kde.org/frameworks/kpty"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF5/Qt5 模块；CMakeDeps 通过 cmake_file_name=Qt5 重建聚合 Qt5Config（qt5-qtbase 只发每模块 config）"
    - "Qt5 包内 mkspec 路径指向 Conan 构建目录，需把真实 mkspecs 树复制到生成 config 期望的位置"
    - "KF_IGNORE_PLATFORM_CHECK / KF_SKIP_PO_PROCESSING / KDE_INSTALL_USE_QT_SYS_PATHS=OFF 构成 OHOS 基线"
    - "kcoreaddons5 与 ki18n5 使用 cmake_find_mode=none，须显式把其 <prefix>/lib/cmake 加入 CMAKE_PREFIX_PATH"
    - "恢复 SONAME 发射（CMAKE_SHARED_LIBRARY_SONAME_*_FLAG）并保持 CMAKE_PLATFORM_NO_VERSIONED_SONAME"
  common_dependencies:
    - "qt5-qtbase/5.15.2.2"
    - "kcoreaddons5/5.116.0.1"
    - "ki18n5/5.116.0"
    - "ecm/6.26.0"

versions:
  "5.116.0":
    status: adapting
