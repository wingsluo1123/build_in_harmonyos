package: krb5-server/1.22.2
homepage: "https://web.mit.edu/kerberos/"

upstream_check_command: "configure && make"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_test_note: "上游 make check 依赖 perl/tcl 完整测试环境，本包以 test_package 真实调用服务端工具覆盖"

test_package_tests:
  - file: test_krb5server.c
    description: "链接 libkrb5 等服务端库集，krb5_init_context 验证库可用"
    command: "cmake build + run test_krb5server"
  - file: test_krb5server.sh
    description: "真实调用服务端工具 kdb5_util 创建/查询 KDB（db_module_dir 指向包内插件，断言 K/M@TEST.REALM master key）"
    command: "sh test_krb5server.sh"

assertion_count: 3
