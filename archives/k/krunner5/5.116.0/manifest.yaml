knowledge_gained:
  - "EXCLUDE_DEPRECATED_BEFORE_AND_AT=5.91.0 is the load-bearing knob for krunner5 on a KF5 chain without KF5::Service/Plasma/KIOCore: the KF5-5.116 source guards both the find_package(KF5KIO/KF5Service/KF5Plasma) calls (root CMakeLists.txt) and the KF5::Service/Plasma/KIOCore link block (src/CMakeLists.txt) with EXCLUDE_DEPRECATED_BEFORE_AND_AT VERSION_LESS 5.91.0, and the generated export header flips the KRUNNER_ENABLE_DEPRECATED_SINCE(5, 91) header guards to the KPluginFactory branch, so kservice never enters the dependency graph."
  - "The Qt5 Quick supply on this chain is a split: qt5-qtdeclarative ships the Qt5Qml/Qt5Quick libraries and headers but no lib/cmake. The fix is an aggregate hand-written Qt5Config.cmake shim (first on CMAKE_PREFIX_PATH) that preloads the native qt5-qtbase per-module configs with NO_DEFAULT_PATH, plus a CMakeDeps entry naming the generated qt5-qtdeclarative config Qt5Qml (cmake_file_name) with Qt5::Quick forwarded to Qt5::Qml as an INTERFACE target."
  - "Upstream gap: src/CMakeLists.txt links KF5::I18n PUBLIC into KF5::Runner, but the installed KF5RunnerConfig.cmake does not find_dependency(KF5I18n) (upstream applications find I18n themselves), so every consumer must find_package(KF5I18n) explicitly to resolve the link interface."
  - "QueryMatch::setId() composes the runner id with the given id (\"<runnerId>_<givenId>\") unless the runner enables the unique-results property (querymatch.cpp); the consumer-visible id therefore carries the runner-id prefix for default runners."
  - "RunnerSyntax rewrites the \":q:\" placeholder into the localized term description (\"<search term>\") at storage time (runnersyntax.cpp addExampleQuery), so exampleQueries() never returns \":q:\" verbatim."
  - "KRunner's 3 session-bus test suites must be excluded with ctest -E using the REGISTERED ctest names — note runnermanagersinglerunnermodetest (single+runnermode), not any shorthand; on images with dbus-run-session + dbus-daemon the suites instead run under a private bus (dbus-run-session -- ctest). The OHOS PC validation image has neither tool, so the bus-free branch is the real-device path."
  - "The OHOS toolchain maps os=OHOS to CMAKE_SYSTEM_NAME=HarmonyOS (no UNIX, cross-compiling); forcing CMAKE_SYSTEM_NAME=Linux restores UNIX=1 and ECM's non-cross test registration (chain-wide convention, threadweaver5/kcoreaddons5 precedent)."
