software: kscreen
display: "kscreen"
description: "KDE Plasma 屏幕管理服务（kded 守护插件 + kscreen-console 诊断工具，基于已发布的 libkscreen 6.7.2）"
category: desktop
homepage: "https://invent.kde.org/plasma/kscreen"
license: "GPL-2.0-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "KDE Plasma 屏幕管理 actor：kded 插件（KDEDModule）+ kscreen-console 工具"
    - "依赖 Qt6(Quick/DBus)+libkscreen+KF6(CoreAddons/DBusAddons/I18n/WindowSystem)，KF6 经 ECM FindKF6 伞形模块解析"
    - "Plasma KCM/OSD/plasmoid 与 HDR 校准器依赖未发布：补丁选项化裁剪，上游 ON 默认不变"
    - "KF6 无 SONAME：可重定位链接消除 Conan 缓存绝对路径（E537）"
  common_dependencies:
    - "qtbase/6.11.1.2"
    - "qtdeclarative/6.11.1"
    - "libkscreen/6.7.2"
    - "kcoreaddons/6.26.0"
    - "kdbusaddons/6.18.0"

versions:
  "6.7.2":
    status: built
    build_date: "2026-10-15"
    source_url: "https://download.kde.org/stable/plasma/6.7.2/kscreen-6.7.2.tar.xz"
    packaging: "6.7.2/"
