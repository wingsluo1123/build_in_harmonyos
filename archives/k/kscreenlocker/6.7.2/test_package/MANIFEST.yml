# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kscreenlocker/6.7.2.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: kscreenlocker/6.7.2
homepage: https://invent.kde.org/plasma/kscreenlocker

# Upstream test commands (used for ctest -N analysis)
upstream_check_command: "ctest -N"

# Upstream tests are NOT integrated in this Conan build (BUILD_TESTING=OFF).
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试用例口径（rule2 / rule4）
#
# 上游 N=7（朴素扫描口径：add_executable + ecm_mark_as_test）：
#   autotests/CMakeLists.txt 注册 5 个：logindTest、pamTest、
#     keyboardGrabber、pointerGrabber、x11LockerTest；
#   tests/CMakeLists.txt 注册 2 个：kscreenlocker_test、kcheckpass_test。
# 适配后 N'=0（BUILD_TESTING=OFF，libkscreen 6.7.2 先例），减少 7，
# 原因逐条如下：
#   1) pamTest（autotests）依赖 greeter 的 kscreenlocker_authenticator
#      产物，本适配 KSCREENLOCKER_BUILD_GREETER=OFF（PAM/PlasmaQuick/
#      LayerShellQt/KF6Screen 未发布到 ohpcd），上游其注册条件已带
#      pam_wrapper 探测，本适配在补丁 0002 里追加 GREETER 选项门控；
#   2) keyboardGrabber / pointerGrabber / x11LockerTest 依赖 X11/XCB
#      （x11LockerTest 另需 Qt6GuiPrivate 的 qtx11extras_p.h），OHOS
#      无 X11，补丁 0001/0003 将三者随 HAVE_X11 裁剪；
#   3) kcheckpass_test（tests）链接 kscreenlocker_authenticator 并
#      编译 QML 测试文件，同属 greeter 产物，随 GREETER 选项门控；
#   4) logindTest 需要会话 D-Bus：fakelogind 向会话总线注册
#      org.freedesktop.login1，QVERIFY(connectedSpy.wait()) 在无总线
#      环境下必失败，无法进入构建期 ctest；
#   5) kscreenlocker_test 是交互式演示程序（tests/kscreenlocker_main.cpp
#      无 QTest 断言）：启动即 lock(EstablishLock::Immediate) 拉起
#      greeter（本适配不构建）并 exec() 直到解锁，无头环境必挂起，
#      与 knotifyconfig 6.26.0 的 knotifytest 同款裁剪先例。
# 上游 logindTest 的验证价值已由 test_package 的 KSldApp 无头 E2E
# （18 断言）与 OHOS 制品检查（12+N 断言，真机 N=20 → 32）承接。
upstream_tests:
  - file: autotests/CMakeLists.txt
    source: kscreenlocker-6.7.2/autotests/CMakeLists.txt
    description: "上游 5 个 autotest（logindTest/pamTest/keyboardGrabber/pointerGrabber/x11LockerTest）。pamTest 随 GREETER 选项门控，三个 X11 测试随 HAVE_X11 裁剪，logindTest 需要会话 D-Bus。"
    command: "ctest --test-dir <build_folder> -N"
    condition: "BUILD_TESTING=OFF，未构建未执行（口径见上方）"
  - file: tests/CMakeLists.txt
    source: kscreenlocker-6.7.2/tests/CMakeLists.txt
    description: "上游 2 个 test（kscreenlocker_test 交互式演示/kcheckpass_test greeter 依赖）。前者无断言且无头必挂起，后者随 GREETER 选项门控。"
    command: "ctest --test-dir <build_folder> -N"
    condition: "BUILD_TESTING=OFF，未构建未执行（口径见上方）"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_package/test_kscreenlocker.cpp
    description: "消费者行为验证：find_package(KScreenLocker)+链接 PW::KScreenLocker，QT_QPA_PLATFORM=offscreen + 密闭 XDG 根下驱动 KSldApp——单例惰性创建与幂等、初始 lockState=Unlocked、activeTime=0、forceSoftwareRendering 双向往返、isGraceTime/isInhibited 初值、inhibit/uninhibit 计数器往返（0→1→2→1→0）、idleId 往返，全程锁状态与 activeTime 不变；runCase 执行器每例 TEST PASS/FAIL + SUMMARY + 任一失败 exit(1)（jakarta-authentication-api 3.0.0 先例）。conanfile.py 在 OHOS 上先暂存 E537 兼容 bin（平台发布的 KF6 库如 kconfig 6.26.0 的 libKF6ConfigGui.so 与 ki18n 的 libKF6I18nLocaleData.so 发布产物内带构建树相对 DT_NEEDED ../../bin/…，OHOS 加载器按进程 CWD 解析相对条目；把全部传递依赖的 libKF6*.so 拷贝到 CWD 的 ../../bin/ 落点——拷贝非符号链，/storage 禁 symlink——与 kconfig 6.26.0 配方自身 ctest 的 _prepare_ctest_runtime_links 同款手法），再以 CWD=build_folder 执行 ctest 与直跑。"
    command: "conan create (test_package builds and runs test_kscreenlocker)"
  - file: test_package/test_kscreenlocker_elf.py
    description: "OHOS 制品验证：lib/ 下 libKScreenLocker.so* 恰为单一无版本实体文件 libKScreenLocker.so（OHOS /storage 禁 symlink，无 .so.6/.so.6.7.2 符号链）；实体文件为 ELF64、小端、ET_DYN、EM_AARCH64；节表含 .text 与 .codesign（package() 重签步骤产物）；动态节 DT_SONAME == libKScreenLocker.so（补丁 0008 直传 -Wl,-soname）且每个 DT_NEEDED 条目为纯基名（无路径分隔符，杜绝机器私有缓存路径烧进依赖记录，E537）。仅做结构化 ELF 头/节表/动态节读取（纯 struct.unpack_from），不对二进制做文本 grep。"
    command: "python test_kscreenlocker_elf.py <package_folder>"
  - file: test_package/test_kscreenlocker_fixdeps.py
    description: "注册表卫生（绝对路径变体）：平台发布的多个 KF6 库的 DT_NEEDED 携带发布机私有绝对路径（如 <HOME>/.cache/conan2/p/b/kconf<hash>/p/lib/libKF6ConfigWidgets.so，libKF6XmlGui.so 单文件 9 条）；OHOS 加载器对含路径条目按字面打开、无搜索路径回退，缺少该目录的 worker 在 main() 前即死于加载。脚本扫描 LD_LIBRARY_PATH 全部目录 + 兼容 bin 的运行时闭包，按基名映射把每条缺失的路径条目在其字面路径复制补位（拷贝非符号链，/storage 禁 symlink）。仅落盘形态为 Conan cache 包路径的条目（<…>/.conan2/p/ 或 <…>/.cache/conan2/p/ 段且 basename 以 lib 开头，posixpath.normpath 折叠「..」后判定，校验与写入使用同一折叠值，其余路径条目打印警告拒落盘）。退出码恒 0（无法满足的条目打警告），测试运行本身仍是验收门。"
    command: "python test_kscreenlocker_fixdeps.py <compat_bin_dir>"

# 鸿蒙特有测试条数 (rule12)：固定 12 条 + 每个 DT_NEEDED 条目 1 条
# （test_kscreenlocker_elf.py 的 12+N 条里，除去与平台无关的 4 条）
ohos_specific_tests: "28（8+N，真机 N=20）"
ohos_specific_description: >
  test_package/test_kscreenlocker_elf.py 的 12+N 条制品断言中，8+N 条直接
  绑定鸿蒙产物形态，构成 rule12 的鸿蒙特有测试（N = DT_NEEDED 条目数，
  每条一个基名断言）：
    (1) EM_AARCH64(183) —— OHOS 只接受 AArch64 产物，宿主交叉编译器残留的
        x86-64 会在这里立刻失败（断言的是字节级 ABI，不是文件名）；
    (2) ET_DYN(3) —— OHOS 要求共享对象/PIE 形态；
    (3) EI_CLASS = ELFCLASS64(2)、EI_DATA = ELFDATA2LSB(1)、
        EI_VERSION = EV_CURRENT(1) —— 64 位小端 ELF，
        32 位或大端产物在此失败；
    (4) 节表含 .codesign —— package() 对每一个安装的 ELF 跑
        llvm-objcopy --remove-section .codesign + binary-sign-tool
        -selfSign 1；CMake 在 install 时会重写 RUNPATH，令构建期签名失效，
        未重签的库会被 OHOS 加载器以 "Permission denied" 拒绝。节表里
        看得见 .codesign 是这一步骤真的发生了的证据；
    (5) lib/ 下恰为单一无版本实体文件 libKScreenLocker.so —— OHOS
        /storage 禁 symlink，SOVERSION 版本链（.so.6.7.2/.so.6/.so）
        创建必 EPERM（round 21 真机实录），配方不设
        CMAKE_SHARED_LIBRARY_SONAME flags、产物天然无符号链
        （kpackage/6.26.0.1 先例）；本断言拒绝任何残留的版本链或符号链；
    (6) 动态节 DT_SONAME == libKScreenLocker.so —— 平台无 soname flag 时
        库默认无 DT_SONAME，补丁 0008 直传 -Wl,-soname 使 OHOS 加载器
        按基名解析依赖；本断言验证该直传真的进入链接结果；
    (7) 每个 DT_NEEDED 条目为纯基名（无路径分隔符，N 条）—— ohpcd 发布的
        KF6 库不带 DT_SONAME（IMPORTED_NO_SONAME=TRUE），按绝对缓存路径
        链接会把机器私有路径烧进 DT_NEEDED（E537）；补丁 0008 把 KF6
        依赖改由精确文件名 -l: 标志链接（lld 按命令行原样记录名字），
        本断言逐条验证依赖记录可重定位。
  全部断言只做结构化 ELF 头/节表/程序头/动态节读取（纯 Python
  struct.unpack_from），不对二进制做文本 grep，也不调用
  readelf/file/nm/strings —— 那些工具在 OHOS 上不可用或不适合从测试里驱动。
  另 4 条（ELF magic、节表含 .text、实体文件存在性 isfile、DT_NEEDED
  解析非空）是平台无关的解析健全性检查，不计入本条。

# Test assertion count (approximate, for quality assessment)
# 行为断言 18 条（test_kscreenlocker.cpp）+ OHOS 制品断言 12+N 条
# （test_kscreenlocker_elf.py，N=DT_NEEDED 条目数，真机 N=20）= 50
assertion_count: "50（30+N，真机 N=20）"
