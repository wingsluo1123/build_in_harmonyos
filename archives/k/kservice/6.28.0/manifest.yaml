knowledge_gained:
  - "kservice 6.28.0 raises KF_DEP_VERSION to 6.28.0 while the ohpcd KF6 stack stops at 6.26.0; patch 0001 lowers the floor back to 6.26.0 (resolve logic untouched). ECM stays at 6.28.0 via the ecm/6.28.0 tool package."
  - "OHOS CMake emits no SONAME for shared libraries (E383); CMAKE_USER_MAKE_RULES_OVERRIDE injects ohos-shared-library-rules.cmake to restore -soname emission (ki18n 6.26.0 precedent)."
  - "OHOS/HMDFS user volume rejects symlink creation (E330), so upstream's VERSION/SOVERSION symlink chain fails; CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE keeps -soname emission while producing only the unversioned real .so."
  - "kbuildsycoca6 links the SONAME-less ki18n/6.26.0 package and records path-shaped DT_NEEDED entries; package() rewrites them in place to bare basenames (E537 family) and re-signs the whole tree after the install-time RUNPATH rewrite invalidated .codesign."
  - "Building the sycoca cache requires a menu under XDG_CONFIG_HOME/menus: applications.menu drives the DefaultAppDirs scan, so a consumer without a menu gets an app-dir-less (empty) service database; KSycoca::setupTestMenu() stages the canonical minimal menu (ksycoca.h static, impl ksycoca.cpp) - used by test_package, with patch 0003 adding the same fallback to upstream ksycocatest."
  - "serviceByDesktopPath keys strictly on the absolute entryPath recorded at scan time; lookups by bare desktop file name must use serviceByDesktopName (completeBaseName) instead."
  - "ksycocatest exercises POSIX-only fs semantics (symlink, chmod-then-read, future mtime) that the OHOS user volume cannot satisfy deterministically; patch 0002 guards those three subchecks with QSKIP + printed reason (env-gated, no platform macros - R8 compliant), leaving all other subchecks and assertions intact."
  - "test_package validates the full consumer path on-device: isolated XDG tree + setupTestMenu-driven cold sycoca build, lookup via serviceByDesktopName and via serviceByDesktopPath with an absolute entryPath, plus a second fixture staged under XDG_DATA_DIRS."
