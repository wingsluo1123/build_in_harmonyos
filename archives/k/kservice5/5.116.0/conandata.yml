# conandata.yml - kservice5 5.116.0 (KDE Frameworks 5 / Qt5)
# Official KDE Frameworks release train source. KF5 5.116 is the final KF5
# release and is served by download.kde.org from the KDE Attic archive.
sources:
  "5.116.0":
    url: "https://download.kde.org/stable/frameworks/5.116/kservice-5.116.0.tar.xz"
    sha256: "52b7c2c317d0a662ca33200f9b4f93e0b7efb1843abd120a3b49c9a092f4a869"

patches:
  "5.116.0":
    - patch_file: "patches/0001-ohos-portability.patch"
      patch_type: "portability"
      patch_description: >-
        kbuildsycoca.cpp uses KMemFile without the QT_NO_SHAREDMEMORY guard that
        kmemfile_p.h and ksycoca.cpp both apply. The OHOS qt5-qtbase is built
        with -no-feature-sharedmemory, so the class is compiled out and the
        unguarded use fails to compile.
