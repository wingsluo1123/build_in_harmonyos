knowledge_gained:
  - "kservice 5.116.0 hard-requires KF5Config, KF5CoreAddons, KF5DBusAddons and KF5I18n; the published KF5 5.116.0 packages are split across two Qt5 baselines, so the graph needs qt5-qtbase forced to 5.15.2.2. Established pattern, see kjobwidgets5/5.116.0."
  - "The Trader parser is generated by flex+bison and both are REQUIRED; on a native-building farm they resolve as HOST requirements because the build context computes a package id ohpcd does not publish, and verify runs conan create without --build=missing."
  - "ki18n5's KF5I18nConfig.cmake includes KF5I18nMacros.cmake which calls find_package(Gettext); FindGettext only probes PATH, so GETTEXT_MSGFMT_EXECUTABLE/GETTEXT_MSGMERGE_EXECUTABLE must be set explicitly from the gettext package."
  - "kbuildsycoca reads the MIME XML sources, but KBuildMimeTypeFactory::createEntry() returns nullptr for any path without a '/', so a database shipped as a single mime/freedesktop.org.xml registers nothing at all; the files must be laid out as mime/<group>/<type>.xml, which is what update-mime-database produces."
  - "The MIME fixture has to match the release the upstream assertions describe: shared-mime-info 2.5 turned application/x-shellscript into an alias of text/x-shellscript, so it no longer inherits text/plain and KMimeAssociationsTest::testMultipleInheritance cannot pass against it. 2.4 is the release to use."
  - "These tests call QStandardPaths::setTestModeEnabled(true), so GenericConfigLocation is only $HOME/.qttest/config - XDG_CONFIG_DIRS is ignored and applications.menu must be staged inside the fake HOME."
