knowledge_gained:
  - "Akonadi contacts consumes KF6::TextUtils; later PIM text-editing consumers also need TextAddonsWidgets, TextEmoticonsCore, TextEmoticonsWidgets, and TextCustomEditor."
  - "The expanded build keeps the component set needed by the Akonadi downstream chain while leaving optional service/plugin families disabled."
  - "Qt platform plugin lookup must point QT_QPA_PLATFORM_PLUGIN_PATH at the Qt platform plugin directory, not a path list, for Widgets tests to find the offscreen platform plugin."
  - "When KIO support is disabled, TextCustomEditor web shortcut support is intentionally unavailable; upstream tests were patched to assert the configured feature state instead of assuming KIO is present."
