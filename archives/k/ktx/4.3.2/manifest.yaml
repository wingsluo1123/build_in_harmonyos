# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "4.3.2 and 4.4.2 use different switches for the library type: 4.3.2 has KTX_FEATURE_STATIC_LIBRARY (ON => static), while 4.4.2 uses the standard BUILD_SHARED_LIBS. Setting only BUILD_SHARED_LIBS on the 4.3.2 source tree is silently ignored and yields a shared libktx, so both variables are set explicitly."
  - "ktx 4.3.2 has no KTX_GIT_VERSION_FULL override (4.4.2 added it): cmake/version.cmake calls git_describe_raw() unconditionally and the released tarball has no .git, so it degrades to 0.0.0-noversion and ./mkversion stamps version.h with the DEF_VER=v4.0 fallback. patches/0001 backports the 4.4.2 override path."
  - "cmake/version.cmake is include()d at line 13 of the top-level CMakeLists, before project() at line 25, and cmake only reads conan_toolchain.cmake at project() time. A CMakeToolchain variable is therefore still empty at line 13 and the override would never be seen; KTX_GIT_VERSION_FULL must be passed as a real command-line -D cache variable."
  - "On HarmonyOS PC the whole conan -> cmake -> make chain runs in the restricted adhoc_bin domain, which refuses to start files that live in the user-storage build tree. Upstream runs ./mkversion directly, so the build dies with '/bin/sh: ./mkversion: Permission denied' (make Error 126) even though the file is present with mode 0770 and runs fine from an interactive shell. Handing the script to ${BASH_EXECUTABLE} (guaranteed by find_package(Bash REQUIRED) at CMakeLists line 11) makes the interpreter read it instead. The same restriction is why the upstream ctest suite is run outside conan create here instead of from build()."
  - "Upstream registers its CLI ctest suites under KTX_FEATURE_TOOLS, independently of KTX_FEATURE_TESTS: even with KTX_FEATURE_TESTS=OFF the build tree carries 133 ctest cases (ktx2check 20, ktx2ktx2 22, ktxsc 21, toktx 70) and ctest -N lists all of them. Only the gtest suites are gated on KTX_FEATURE_TESTS, whose upstream default is ON."
  - "A ctest result on this platform has to be triaged, not taken at face value: every child that goes through /data/service/hnp/bin/bash prints 'shell-init: error retrieving current directory: getcwd: cannot access parent directories' before it does anything -- 78 of the 133 cases, of which 71 still pass. Only criteria that need an empty output stream or a successful pushd turn that warning into a failure."
  - "patch_ng, which conan 2.x uses to apply patches, derives a file mode only from a 'new file mode <oct>' line or from a paired 'old mode <oct>' + 'new mode <oct>'; an 'index <sha>..<sha> <oct>' line is ignored. A patch generated on Windows (core.fileMode=false, every file 0666) therefore silently drops the +x bit of a patched script and the later make step fails with Error 126."
  - "patch_ng applies hunks without searching for an offset: two patches that each rewrite a different region of the same file both apply cleanly in isolation, but the second one returns False when applied after the first, because the lines inserted by the first shift its anchor. All edits to one file must live in a single patch file. git apply hides this, since it does search for offsets."
  - "All third-party code is vendored (basisu / astc-encoder / zstd / miniz); tools/imageio links the bundled lodepng, the basisu jpgd and the astc tinyexr, so the build downloads nothing. Only the upstream tarball itself is fetched, and there is no ExternalProject or FetchContent step."
  - "KTX_FEATURE_VK_UPLOAD=OFF also removes include/ktxvulkan.h from the install set: only include/ktx.h and include/KHR/khr_df.h are installed."
  - "Upstream mkversion always writes '#define <NAME>_DEFAULT_VERSION ${DEF_VER}.__default__', where '__default__' is a literal placeholder; no file in the source tree references any *_DEFAULT_VERSION macro, so this line is inert output and not a defect introduced by this adaptation."
