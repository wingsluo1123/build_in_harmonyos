# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.4.2"

# 软件名
software: "ktx"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-29"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/KhronosGroup/KTX-Software/archive/refs/tags/v4.4.2.tar.gz"

  # 源码校验和
  sha256: "9412cb45045a503005acd47d98f9e8b47154634a50b4df21e17a1dfa8971d323"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "KTX_FEATURE_VK_UPLOAD=OFF"
    - "KTX_FEATURE_GL_UPLOAD=OFF"
    - "KTX_FEATURE_JNI=OFF"
    - "KTX_FEATURE_PY=OFF"
    - "KTX_FEATURE_DOC=OFF"
    - "KTX_FEATURE_TESTS=OFF"
    - "KTX_FEATURE_TOOLS=OFF"
    - "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 平台无 Vulkan/OpenGL 依赖，需关闭 KTX_FEATURE_VK_UPLOAD 和 KTX_FEATURE_GL_UPLOAD"
  - "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY 避免 OHOS 交叉编译 try-link 失败"
