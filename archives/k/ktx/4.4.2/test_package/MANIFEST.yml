# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ktx/4.4.2
homepage: "https://github.com/KhronosGroup/KTX-Software"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_ktx.c
    source: KTX-Software-4.4.2/test_package/test_ktx.c
    description: "KTX library API smoke test - verifies ktxErrorString and ktxTexture2_Create"
    command: "./test_ktx"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ktx.c
    description: "消费者测试: 验证 libktx 链接、ktxErrorString API 调用、ktxTexture2_Create 纹理创建"
    command: "./test_ktx"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
