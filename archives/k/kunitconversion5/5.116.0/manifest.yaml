full_reference: "kunitconversion5/5.116.0@ohpcd/stable"
knowledge_gained:
  - "kunitconversion5 只需 Qt5 Core+Network 与 KF5I18n：qt5-qtbase/5.15.2.2 原生 Qt5Config 聚合（cmake_find_mode=none + paths 文件接线）即可喂饱 find_package(Qt5 CONFIG REQUIRED Core Network) 与 autotests 的 Qt5Test，无需手工聚合 shim。"
  - "package() 阶段 cmake.install() 裸跑 /data/service/hnp/bin/cmake 会因 libc++ relocation 失败（Error 127）：cmake 二进制依赖 LD_LIBRARY_PATH 中的兼容 libc++，必须与 build() 同样用 _runtime_env().vars(self).apply() 包装。"
  - "currencytableinittest 真实通过的组合：QStandardPaths::setTestModeEnabled(true) 钉死 GenericDataLocation 到 $HOME/.qttest/share，QFile::copy 不建父目录——配方预建 $HOME/.qttest/share/libkunitconversion/ 缓存目录后，Converter 离线解析 qrc 内嵌 currency.xml 快照并通过 EUR->USD 汇率断言。"
  - "Qt 5.15 的 QSKIP 签名是 QSKIP(statement, ...)（第二参数可变参，Qt6 才引入 SkipSingle/SkipAll 枚举）——Qt5 补丁必须用单参数形式，传 SkipSingle 会编译失败。"
