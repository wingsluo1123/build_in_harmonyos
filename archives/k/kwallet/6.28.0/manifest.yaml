# manifest.yaml — kwallet 6.28.0 (HarmonyOS PC)
version: "6.28.0"
software: "kwallet"
status: "built"
build_date: "2026-10-17"
arch:
  - "armv8"
build_system:
  - "conan2"
  - "cmake"
toolchain:
  cc: "clang 15 (OHOS)"
  cppstd: "17"
source:
  upstream: "https://invent.kde.org/frameworks/kwallet"
  tag: "v6.28.0"
  url: "https://download.kde.org/stable/frameworks/6.28/kwallet-6.28.0.tar.xz"
  sha256: "e21130c86ffa0be49065648f4e753d63d3d786fab876f511d9d09da16480f691"
  license: "LGPL-2.0-or-later"  # dominant upstream SPDX (53 of 68 .cpp/.h headers); matches conanfile.py
build:
  entry: "conan create . --profile:all=ohos-aarch64 --build=missing"
  output_binary: "libKF6Wallet.so + libKF6Wallet.so.6 (KF6::Wallet API) + kwalletd6 + ksecretd daemons (built and exercised inside conan create for real upstream-test DBus round-trips)"
patches_applied:
  - "0001 daemon scope (BUILD_KSECRETD/BUILD_KWALLETD=ON); relax KF_DEP_VERSION to 6.18.0 (published ohpcd daemon-scope KF6 generation) and align find_package(ECM) with the published ohpcd 6.26 baseline; drop the ki18n_install(po) call (no msgfmt toolchain, translations not part of the deliverable)"
  - "0002 drop the VERSION/SOVERSION target properties (E018 symlink denial); the linked ELF keeps CMake's automatic bare DT_SONAME and the recipe materializes the upstream soname name as a signed byte copy" # ref: draft-kio-kwallet-6.28.0-cmake-version-soversion-symlink-e018
  - "0003 same E018 copy-instead-of-link treatment for the libKF6WalletBackend shared library (the daemon-scope build hits the identical cmake_symlink_library failure on libKF6WalletBackend.so.6 at link time); the recipe materializes libKF6WalletBackend.so.6 as a signed copy" # ref: draft-kio-kwallet-6.28.0-cmake-version-soversion-symlink-e018
knowledge_gained:
  - "E018 on this device: the conan python process tree is denied symlink(2) entirely (os.symlink -> EPERM; make -> cmake -E cmake_symlink_library -> 'Permission denied'), while the interactive bash domain can create symlinks freely. Emitting an empty VERSION string still produces a trailing-dot artifact 'libKF6Wallet.so.' that trips the same symlink step — the properties must be removed outright." # ref: draft-kio-kwallet-6.28.0-cmake-version-soversion-symlink-e018
  - "Keeping the upstream soname name after removing the VERSION property: the linked ELF keeps CMake's automatic bare DT_SONAME — a -Wl,-soname pin via CMAKE_SHARED_LINKER_FLAGS is silently overridden by CMake's trailing automatic option (see the last-wins entry) — and package() materializes libKF6Wallet.so.6 as a byte copy of libKF6Wallet.so before OHOS ELF signing, so both names are signed and resolve at runtime." # ref: draft-kio-kwallet-6.28.0-cmake-version-soversion-symlink-e018
  - "Upstream test targets are add_executable + ecm_mark_as_test() without add_test() registration (only fdo_secrets_test and blowfishtest are CTest-registered in this scope), so 'ctest -N' finds 2 tests; the recipe requires the expected binaries after the build and executes every test binary directly with a code-level verdict." # ref: draft-kio-kwallet-6.28.0-kwallettest-zero-ctest-display-guard
  - "kwallettest links QApplication/QLineEdit; the recipe forces QT_QPA_PLATFORM=offscreen (the offscreen plugin never opens an X11 connection) and defines a dummy DISPLAY=:99 so upstream's own headless guard (KWalletTest::init QSKIPs when DISPLAY is unset) passes and the wallet round-trips execute for real instead of silently skipping." # ref: draft-kio-kwallet-6.28.0-kwallettest-zero-ctest-display-guard
  - "Conan Environment.unset() sets the variable to empty rather than removing it — never use it to guard DISPLAY-like platform probes." # ref: draft-kio-kwallet-6.28.0-kwallettest-zero-ctest-display-guard
  - "CMake always appends its own automatic -Wl,-soname,<output name> right before -o in every shared-library link command; the linker honors the LAST -soname option, so a soname pin passed via CMAKE_SHARED_LINKER_FLAGS is silently overridden. Pinning requires a link ITEM: target_link_libraries(<target> PRIVATE \"-Wl,-soname,<name>\"), which lands after CMake's own option." # ref: draft-kwallet-6.28.0-qca-soname-last-wins
  - "Two copies of the same shared library reached through different absolute paths load as two independent instances: the qca-ossl plugin (bare DT_NEEDED resolved to the in-build-tree copy via its RUNPATH) and the ksecretd daemon (DT_NEEDED libqca-qt6.so.2 resolved into the package lib dir via its RPATH) each loaded their own QCA core, so QCA/Botan global state diverged and every QCA-linked process aborted with 'Botan: Library was not initialized correctly'. The fix pins the upstream soname so both binaries resolve the same absolute path string." # ref: draft-kwallet-6.28.0-qca-soname-last-wins
  - "A dependency's versioned-soname chain is the same E018 family as the main project: dbus (MacrosAutotools-derived VERSION/SOVERSION) and QCA (if(NOT ANDROID) VERSION/SOVERSION block) both trip cmake_symlink_library in the conan process domain; each is fixed by an idempotent in-tree edit that drops the properties and pins the upstream soname, with the toolchain-level -Wl,-soname leak of the main package blocked at the same site." # ref: draft-kwallet-6.28.0-qca-soname-last-wins
validation:
  local:
    conan_create: "passed (exit 0; patches applied, daemon stack built, full upstream census executed: 12 of 13 built test binaries — standalone blowfishtest 3/0 + backendtest exit0 (informational smoke, upstream defines no pass/fail conditions) + testbf/testsha exit0; daemon-stack fdo_secrets_test 16/0, kwallettest 3/0, kwalletasync 3/0, kwalletsync 3/0, kwalletboth 3/0, kwalletmany 3/0, kwalletcbc 4/0; kwalletpath ENV-BLOCKED (probe-confirmed at run time: captured /tmp/test.kwl marker + live EROFS write probe; upstream hardcodes /tmp/test.kwl and device /tmp is EROFS in all domains) — executed and reported honestly; runner TOTALS: 7 passed, 0 failed, 1 env-blocked (probe-confirmed); KWALLETTEST-PASS; test_package 1/1)"
    conan_verify: "passed (reports/conan-verify-report.md: G0-G4 all PASS, L2/L4/L5 skipped = no cache path; CONAN_VERIFY_RC=0, milestone conan_verify_passed)"
    upstream_tests: "census: 13 test binaries built (12 executed, kwalletwizardtest excluded as interactive GUI, kwallet-example-asynchronous is an example); ctest -N = 2 (upstream state); 22/23 Qt test functions passed + 3/3 legacy self-checks, 0 code failures, 0 skipped; per-binary totals recorded as BIN-RESULT lines in the build log (census table carried in the delivery MR body)"
    test_package: "passed 1/1 (100% tests passed; PASS: KF6Wallet API kdewallet kdewallet Passwords Form Data; L1e negative test R34 passed)"
  ohos:
    binary_runs: "passed (upstream test binaries real DBus round-trips against live dbus-daemon + ksecretd (--pam-login) + kwalletd6 stack on device)"
    signed: "passed (OHOS package ELF files .codesign-signed)"
