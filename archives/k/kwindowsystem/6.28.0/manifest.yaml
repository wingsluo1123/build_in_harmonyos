knowledge_gained:
  - "kwindowsystem 6.28.0 keeps the same OHOS option set as 6.26.0.1: KWINDOWSYSTEM_X11=OFF / KWINDOWSYSTEM_WAYLAND=OFF / KWINDOWSYSTEM_QML=OFF (dummy backend provides the symbols)."
  - "Upstream 6.26.0 -> 6.28.0 changed the top-level CMakeLists.txt only in KF_VERSION and the ECM minimum (6.28.0), so the OHOS CMake patch applies verbatim: both hunks land at the same lines (29, 89) with zero fuzz."
  - "The recipe tool_requires moves ecm/6.26.0 -> ecm/6.28.0 to satisfy the new find_package minimum; qtbase/6.11.1 still satisfies the Qt 6.9.0 minimum and ships Qt6GuiPrivate for the upstream autotest link set (Qt >= 6.10)."
  - "Defining CMAKE_SHARED_LIBRARY_SONAME_C(CXX)_FLAG on the platform-module-less OHOS toolchain switches CMake to the versioned realname plus .so.6/.so symlink chain, and the device kernel refuses symlinks on /storage (the first on-device conan create failed exactly at that link step); the device-verified pattern is no injection plus a capability-gated basename -Wl,-soname link option (kscreenlocker 6.7.2 patch 0008 precedent), with consumers still recording the bare soname in DT_NEEDED."
  - "With X11/Wayland/QML disabled the only registered CTest remains kwindowsystemplatformwaylandtest, which QSKIPs when weston is absent - same single-test surface as 6.26.0.1."
