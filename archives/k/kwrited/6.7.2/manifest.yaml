knowledge_gained:
  - "形态由上游能力宏决定：cmake_dependent_option(BUILD_AS_EXECUTABLE ... OFF \"KPty_HAVE_UTEMPTER\" ON) —— OHOS 侧 kpty/6.26.0 无 UTEMPTER，宏为 FALSE，自动落可执行分支；该分支不依赖 KF6DBusAddons（无桌面会话平台的正确形态）。"
  - "no-desktop-session 判定：OHOS PC 无会话 D-Bus 总线与 KDED 装载器，KDED 插件形态（plugins/kf6/kded + ServiceTypes=KDEDModule）能编译但永不加载；判定/策略/复现见 knowledge/operations/no-desktop-session-dbus-kded/。"
  - "零补丁的边界条件：能力宏必须由依赖包真实导出（本例 KPty_HAVE_UTEMPTER=FALSE 来自 kpty 包配置），不能由本配方强行注入 -D 覆盖——注入等于伪造能力。"
  - "消费者测试要点：守护进程无 CLI 参数/无 stdout，验证方式为真执行 + 存活判定 + /proc/<pid>/fd/0 的 pty 归属断言，而非 --version 烟雾测试。"
