  required:
    - qtbase/6.11.1
    - kconfig/6.26.0
    - kconfigwidgets/6.18.0
    - kcoreaddons/6.26.0
    - kguiaddons/6.26.0
    - ki18n/6.26.0
    - kiconthemes/6.26.0
    - kitemviews/6.26.0
    - kwidgetsaddons/6.26.0
