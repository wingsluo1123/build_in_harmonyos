# Kyoto Cabinet 软件元数据

software: kyotocabinet
category: database
description: 高性能键值存储数据库库，支持多种数据库类型（HashDB/TreeDB/PolyDB/ForestDB）

# 版本索引
versions:
  - version: "1.2.80"
    status: built
    build_date: "2026-10-14"
    notes: 上游 make check 512 条命令全量通过；test_package 27 项断言通过；zlib 压缩默认开启

# 软件特性
features:
  - HashDB（哈希数据库）
  - TreeDB（B+树数据库）
  - PolyDB（多态数据库）
  - ForestDB（文档数据库）

