# conandata.yml — kywc 1.3.1
# 官方源：kylin-wayland-compositor 上游仓库（openKylin 托管于 Gitee，
# repository/archive 接口直接产出 release tarball，根目录
# kylin-wayland-compositor-upstream-1.3.1/，LF 行尾，sha256 本地下载复核）。
# Gitee 为该项目的官方托管（非搬运镜像），R39 官方托管例外。

sources:
  url: "https://gitee.com/openkylin/kylin-wayland-compositor/repository/archive/upstream/1.3.1.tar.gz"
  sha256: "1bee5ccd84be11bda7659d35cb66d3bb7b1df93b5cd686cd1e881213dccbef0c"

# 静态 wayland-scanner 的源码（官方 freedesktop release 资产）：制品仓
# wayland 包自带的 scanner 在设备上无法执行（DT_NEEDED 固化构建机缓存
# 绝对路径），改用仅依赖 libc 的静态 scanner（chayang 先例）。版本与
# requires 中的 wayland/1.22.0 保持一致。
scanner_sources:
  url: "https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.22.0/downloads/wayland-1.22.0.tar.xz"
  sha256: "1540af1ea698a471c2d8e9d288332c7e0fd360c8f1d12936ebb7e7cbc2425842"

# 补丁作用于 tarball 原文（LF），纯 unified diff，两行头 ---/+++，
# strip=0（conan 2.29 patch 引擎默认值，patch_ng 自动剥离 a//b/ 前缀）。
patches:
  "1.3.1":
    - patch_file: "patches/0001-meson-add-libkywc-only-build.patch"
      patch_description: "meson：新增 libkywc_only / wayland_scanner_path / kywc_install_rpath 选项；libkywc_only=true 时顶层只进入 libkywc/ 并跳过 wlroots、xkbcommon、libdrm、libinput、pixman、json-c、libsystemd、cairo/pango、librsvg、libjpeg、libudev、libunwind、xcb 与合成器可执行文件的依赖块；同时把 Meson project version 从 1.3.0 对齐到 release tag 1.3.1（上游漏 bump），使 kywc.pc 的 Version 与包版本一致"
      patch_type: "portability"
    - patch_file: "patches/0002-libkywc-generate-protocols.patch"
      patch_description: "libkywc：仅库构建下本地生成四个 kywc 客户端协议文件（合成器构建由 protocols/ 生成，该目录在 libkywc_only 模式下不进入），输出落在 libkywc 构建目录并自动进入该目标的 include 路径；去掉 shared_library 的 version 参数，避免 HMDFS 上创建 libkywc.so.1.3.1 软链时报 EPERM（无版本 .so 与已发布 OHOS 库形态一致）；同一目标把 install_rpath 接到 kywc_install_rpath 选项，使安装期 depfixer 写回相同 rpath 字节、不改动 .dynstr，链接期写入的 .codesign 保持有效"
      patch_type: "portability"
