# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kywc/1.3.1
homepage: "https://gitee.com/openkylin/kylin-wayland-compositor"

# 上游测试命令（本包不注册 meson test，见 upstream_tests 说明）
upstream_check_command: "meson test（构建目录内执行）"
upstream_test_in_build: true
upstream_test_command: "meson test（build() 末尾执行，输出 No tests defined.）"

# 上游 1.3.1 全树递归检查：0 个 meson.build 声明 test() / benchmark()，
# 仓库内无 tests 目录（本包只构建 libkywc/，合成器的 examples 与
# protocols 目录不再进入）。上游测试套件为空属事实，meson test 仍真实执行
# 以在日志中留下权威计数；运行时验证由 test_package 的消费者测试承担。
upstream_tests:
  - category: none
    count: 0
    description: "全树递归 `test(` 命中 0 处；无 tests 目录、无 benchmark"
    status: no-upstream-tests
    condition: "上游未提供任何测试目标"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_kywc.c
    description: "libkywc 消费者：进程内起迷你 Wayland 服务端（wl_compositor v4 global + 沙盒内 AF_UNIX 命名 socket，服务端 wl_display_run 线程），客户端侧真实调用 kywc_context_create（连接 + registry 往返）/ create_by_display（外部 wl_display）/ get_display / get_fd / get_user_data / for_each_workspace / find_workspace / process（global_remove 触发后派发）/ destroy（destroy 回调一次）；错误路径含缺失 socket 返回 NULL 与五个 NULL 参数 getter/销毁；逐例 CHECK PASS/FAIL + TEST SUMMARY，失败退出非 0"
    command: "conan test"

# 运行时检查项总数：25 项（含 1 项 socket 可读性等待、7 项错误路径）
assertion_count: 25
