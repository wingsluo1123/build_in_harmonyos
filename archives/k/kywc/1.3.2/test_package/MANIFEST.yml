# test_package/MANIFEST.yml
# Consumer test declaration for kywc/1.3.2.

package: kywc/1.3.2
homepage: https://gitee.com/openkylin/kylin-wayland-compositor

upstream_check_command: "none (no upstream test suite)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "(none)"
    source: kylin-wayland-compositor-1.3.2/
    description: "Upstream has no test suite: no tests/ directory, no meson test() registration outside examples/ukui-effect-test.c (an example, not a test), and no CTest/pytest files. Inventory evidence is recorded in ../notes.md (R51)."
    command: ""
    condition: "not applicable"

test_package_tests:
  - file: test_package/test_kywc.c
    description: "Installed consumer built through pkg-config (kywc + wayland-client), linked with libwayland-server from the published wayland package, executed against an in-process Wayland server: capabilities=0 lifecycle, manager capabilities without globals, create_by_display non-owning display, missing-socket NULL return, NULL-argument helpers."
    command: "conan create (test_package builds and runs the consumer)"
  - file: test_package/harmony_tests/private_signed_loader.py
    description: "Real-device loader scenario: verifies the nonempty OHOS .codesign section, relocates the built binary into a private inode under /data/storage/el2/base/cache and re-runs the full consumer suite from there."
    command: "python3 harmony_tests/private_signed_loader.py <actual-built-test_kywc>"

assertion_count: 37
