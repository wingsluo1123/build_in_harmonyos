software: kywc
display: "KYWC"
description: "Kylin Wayland compositor client library (libkywc)"
category: library
homepage: "https://gitee.com/openkylin/kylin-wayland-compositor"
license: Expat
build_system: meson

ohos_adaptation:
  key_points:
    - "只构建 libkywc：合成器依赖栈（wlroots-0.20/xkbcommon/libdrm/libinput/libdisplay-info/pixman/cairo+pango/librsvg/libsystemd/json-c/udev/gbm）未在 OHOS 发布；ukui-quick 的 window-thumbnail 只消费客户端库"
    - "三个本地补丁新增 compositor 开关（默认 true）并门控合成器侧目标，protocols 与 libkywc 子目录保持无条件构建"
    - "静态 wayland-scanner 由 wayland 1.24.0 源码编译（HMDFS 禁止执行链接缓存共享库的二进制）"
    - "手写 wayland-protocols.pc 暴露 pkgdatadir（protocols/meson.build 通过 get_variable 读取）"
    - "meson install 后重签名安装的 ELF（install 重写 RUNPATH 使链接期 .codesign 失效）"
    - "libkywc.so.N / libkywc.so 链接丢失时重建，symlink 被拒时回退字节拷贝"
  common_dependencies:
    - wayland
    - wayland-protocols

versions:
  "1.3.2":
    status: built
    created_at: "2026-10-20"
    conan_ref: "kywc/1.3.2"
    note: "真机 conan create rc=0；消费者测试 37/37，私有 inode 重跑 1/1"
