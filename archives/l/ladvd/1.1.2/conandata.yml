sources:
  url: "https://codeload.github.com/sspans/ladvd/tar.gz/refs/tags/v1.1.2"
  filename: "ladvd-1.1.2.tar.gz"
  sha256: "3391ad591eb6a97b19fdf243f2bb0dc54a93f0f4a3980e8240ac0ffab353d0d4"

patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "Recognize the canonical linux-ohos target as the Linux network backend"
    patch_type: "portability"
  - patch_file: "patches/0002-src-common.h.patch"
    patch_description: "Provide the BSD MAXPATHLEN alias from the POSIX PATH_MAX limit when absent"
    patch_type: "portability"
  - patch_file: "patches/0003-src-parent.c.patch"
    patch_description: "Keep raw socket lookup outside assert so Release builds retain the assignment"
    patch_type: "portability"
  - patch_file: "patches/0004-src-proto-cdp.c.patch"
    patch_description: "Keep CDP packet validation assignment outside assert in Release builds"
    patch_type: "portability"
  - patch_file: "patches/0005-src-proto-edp.c.patch"
    patch_description: "Keep EDP packet validation assignment outside assert in Release builds"
    patch_type: "portability"
  - patch_file: "patches/0006-src-proto-fdp.c.patch"
    patch_description: "Keep FDP packet validation assignment outside assert in Release builds"
    patch_type: "portability"
  - patch_file: "patches/0007-src-proto-lldp.c.patch"
    patch_description: "Keep LLDP packet validation assignment outside assert in Release builds"
    patch_type: "portability"
  - patch_file: "patches/0008-src-proto-ndp.c.patch"
    patch_description: "Keep NDP packet validation assignment outside assert in Release builds"
    patch_type: "portability"
  - patch_file: "patches/0009-tests-check_child.c.patch"
    patch_description: "Make nested test helpers exit normally on SIGTERM and reject failed fork calls"
    patch_type: "portability"
  - patch_file: "patches/0010-tests-check_util.c.patch"
    patch_description: "Derive the active test function name instead of relying on Check macro internals that changed in 0.13"
    patch_type: "portability"

upstream_has_tests: true
upstream_test_framework: "Check through Automake parallel-tests"
upstream_test_files:
  - "tests/check_compat.c"
  - "tests/check_proto.c"
  - "tests/check_util.c"
  - "tests/check_tlv.c"
  - "tests/check_parent.c"
  - "tests/check_child.c"
  - "tests/check_cli.c"
upstream_test_command: "make check -j1"
test_adaptation_notes: >
  Upstream registers seven Check executables containing 45 START_TEST cases.
  The package build runs all upstream assertions whenever target binaries can
  run.  TEMP and TMPDIR point at a writable private directory because HarmonyOS
  mounts /tmp read-only; no upstream assertion or expected result is changed.
  The check_util log oracle derives the active C function name from __func__
  because Check 0.13+ changed the private symbol generated by START_TEST.
  test_package separately verifies both installed commands from the package.
