software: ladvd
display: "ladvd"
description: "LLDP/CDP/EDP/FDP/NDP link-layer discovery daemon and query client"
category: network
homepage: "https://github.com/sspans/ladvd"
license: ISC
build_system: autotools

ohos_adaptation:
  key_points:
    - "Map the canonical linux-ohos target to the upstream Linux networking backend"
    - "Ship reproducible host-generated Autotools files because autoreconf is not reliable on HarmonyOS storage"
    - "Move side-effecting assignments outside assert expressions so Release builds retain packet validation and raw-socket lookup"
    - "Run all 45 upstream Check cases on the target with a writable private temporary directory"
    - "Make nested test helpers exit normally after SIGTERM and fail explicitly if fork cannot create them"
    - "Decouple the upstream logging oracle from internal function names generated by different Check versions"
    - "Sign and verify target test executables and the packaged daemon"
  common_dependencies:
    - "libevent/2.1.13"
    - "libpcap/1.10.6"

versions:
  "1.1.2":
    status: built
    build_date: "2026-10-13"
