sources:
  "2.0":
    url: "http://lagan.stanford.edu/lagan_web/lagan20.tar.gz"
    sha256: "a65e61ed4fd6608f4e5ad5b11a1b77f4fec1a207d822c5885b3e86727496e1fe"

patches:
  - patch_file: "patches/0001-rename-getline-glibc-collision.patch"
    patch_description: "Rename the custom FILE*-based getline() in anchors.c and glocal/io.cpp to lagan_getline()/glocal_getline(): glibc 2.10+ declares ssize_t getline(char**, size_t*, FILE*) in stdio.h, which collides with LAGAN 2.0's 2006-era custom getline(FILE*, hll*) and breaks the build on the OHOS glibc-based sysroot"
    patch_type: "portability"
  - patch_file: "patches/0002-static-inline-definitions.patch"
    patch_description: "Change bare C99 `inline` function definitions (fchaos.c, multial.c, order.c) to `static inline`: under C99/C11 inline semantics a bare inline definition emits no external symbol, so call sites the compiler chooses not to inline (e.g. findPrev from connectToPrev/doAlgo) fail to link with 'undefined symbol' on clang"
    patch_type: "portability"
  - patch_file: "patches/0003-rename-global-end-variable.patch"
    patch_description: "Rename the global variable `end` in glocal/rightinfluence.cpp to endFrag: structs.h has 'using namespace std;', so under C++11 and later the unqualified name `end` is ambiguous between the global variable and std::end (7 'reference to end is ambiguous' errors)"
    patch_type: "portability"
  - patch_file: "patches/0004-fstream-h-to-fstream.patch"
    patch_description: "Replace the pre-standard header <fstream.h> with <fstream> in glocal/score.cpp: the -h form was removed from modern standard libraries"
    patch_type: "portability"
