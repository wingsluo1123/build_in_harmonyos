patches_applied:
  - "0001-rename-getline-glibc-collision.patch"
  - "0002-static-inline-definitions.patch"
  - "0003-rename-global-end-variable.patch"
  - "0004-fstream-h-to-fstream.patch"

knowledge_gained:
  - "LAGAN 2.0 是 2006 年的 C/C++ 代码，在现代 clang/libc++ 上有 4 类必现编译/链接错误：(a) 自定义 FILE* 版 getline() 与 glibc 2.10+ 的 ssize_t getline(char**,size_t*,FILE*) 同名冲突；(b) C99 裸 inline 定义在现代 clang 上不产出外部符号，编译器选择不内联的调用点链接期 undefined symbol；(c) glocal/structs.h 里 'using namespace std;' 使全局变量 end 与 C++11 std::end 二义；(d) 预标准 <fstream.h> 已从现代标准库移除。四者都在 patches/ 里以最小改动修复。"
  - "src/Makefile 把 CC/CPP 写死成 gcc/g++，且 all 目标会递归进 glocal/ 并再硬编码一次 g++。交叉编译必须显式列出各二进制目标（而不是 make all），才能从 make 命令行覆盖 CC/CPP；glocal/ 需单独以 CC/CLINKER 覆盖再 make 一次。"
  - "src/thrtrie.h 里的 tentative definition 'int indeces[256];' 被 fchaos.c 与 thrtrie.c 同时包含，现代 clang 默认 -fno-common 会让链接器报重复符号，加 -fcommon 恢复 C17 之前的合并语义（与各发行版在 GCC 10 之后的处理一致）。"
  - "LAGAN 的 perl 包装脚本与 mlagan 驱动依赖环境变量 $LAGAN_DIR 定位数据文件；recipe 的 package_info() 用 runenv_info.define 导出 LAGAN_DIR=<package>/bin，并在 runenv 中把 bin/ 加入 PATH，消费者无需手工配置。"
  - "上游 tarball 根目录带一个预编译的 Mach-O prolagan；make 目标 ../prolagan 会用新编出来的 ELF 覆盖它，打包取的是构建目录里的那份，不存在误打包预编译二进制的问题。"
  - "lagan 只链接 -lm，无任何第三方依赖 —— 虽然任务池注解提到 Boost，实测源码树无 Boost 引用。"