sources:
  url: "https://deb.debian.org/debian/pool/main/l/lam/lam_7.1.4.orig.tar.gz"
  sha256: "7cd5f289b9e4887d2a62532c33d93265a049b372ae23d0a6309e6870fef811ae"

patches:
  - patch_file: "patches/0001-configure-main-signature.patch"
    patch_description: "Fix 7 conftest main(int argc, char* argv) signatures that clang 15 rejects (must be char* argv[])"
    patch_type: "portability"
  - patch_file: "patches/0002-config-guess-ohos.patch"
    patch_description: "Teach 2007-era config.guess to emit a *-unknown-linux-ohos triplet on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0003-config-sub-ohos.patch"
    patch_description: "Teach 2007-era config.sub to parse aarch64 and linux-ohos triplets without rewriting to linux-gnu"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-libtool-sh-invocation.patch"
    patch_description: "Invoke the generated libtool via $SHELL in the 6 configure linker-flags probes: the conan cache filesystem does not preserve the exec bit, so directly exec'ing libtool fails with EACCES"
    patch_type: "portability"
