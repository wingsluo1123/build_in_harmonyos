# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: lambda-align/1.0.3
homepage: "https://seqan.github.io/lambda"

# 上游测试命令（ctest 注册 80 个测试：10 mkindex + 70 search）
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "cd build/tests && ctest"

# 上游实际运行的测试程序（R51 实测：本机 OHOS 环境实测 18/80 通过，
# 详情见 reports/test-report.md；失败均为上游期望 md5 过期/压缩格式差异）
upstream_tests:
  - file: maintests.sh
    source: tests/maintests.sh
    description: "上游维护测试脚本（mkindex + search + md5 校验），80 项 ctest 注册"
    command: "ctest"
  - file: db_prot.fasta.gz
    source: tests/db_prot.fasta.gz
    description: "蛋白质数据库（blastp 测试数据）"
    command: ""
  - file: queries_prot.fasta.gz
    source: tests/queries_prot.fasta.gz
    description: "蛋白质查询序列（blastp 测试数据）"
    command: ""

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: "R34 实质验证：执行打包的 lambda/lambda_indexer --version（OHOS 上真实运行）"
    command: "lambda --version; lambda_indexer --version"

# 测试断言总数（近似值）
assertion_count: 2