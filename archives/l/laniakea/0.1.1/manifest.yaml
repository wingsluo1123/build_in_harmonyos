  lang-preflight 实测任务标记 cpp 但源码为 python（纯 Python + Meson 元构建，
  0 个 C/C++ 源文件），按 R47 本应 env_unsupported 终态。用户明确指示走
  完整适配 + PR 流程，且本仓库同生态 laniakea-spark/0.1.1 已按 Python
  application 适配合入 main（PR #3636），bambam/1.4.1 有 r47_override 先例。
  按用户决策覆盖 R47 走 Python application 成功路径适配；覆盖决策与依据
  详见 notes.md 与 .scratch/laniakea-subtask/。
