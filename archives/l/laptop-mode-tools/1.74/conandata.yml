sources:
  url: "https://github.com/rickysarraf/laptop-mode-tools/releases/download/1.74/laptop-mode-tools_1.74.tar.gz"
  sha256: "a1c53b82c7660b1feff9f7e42525c91f8d991e5388d6260df52d9b55b471cc4a"

patches:
  "1.74":
    - patch_file: "patches/0001-install-sh-env-driven-component-gates.patch"
      patch_description: "install.sh: add INSTALL_GUI/INSTALL_UDEV/INSTALL_PM_UTILS env gates (upstream default behaviour unchanged)"
      patch_type: "portability"
    - patch_file: "patches/0002-laptop-mode-runtime-portability-ohos.patch"
      patch_description: "laptop_mode: version/help without installed config, overridable LMT_LOCK_DIR/LMT_RUN_DIR with writable fallback, non-fatal state dir writes"
      patch_type: "portability"
    - patch_file: "patches/0003-confd-disable-missing-tool-modules-ohos.patch"
      patch_description: "conf.d: default-disable modules whose helper tools (hdparm/udevadm/xset/setterm/iw/iwconfig/HAL) do not exist on OHOS"
      patch_type: "configuration"
