sources:
  url:
    - "https://gh-proxy.com/https://github.com/LasemProject/lasem/releases/download/0.6.0/lasem-0.6.0.tar.xz"
    - "https://github.com/LasemProject/lasem/releases/download/0.6.0/lasem-0.6.0.tar.xz"
  sha256: "991a23debf7e2c5683516d7a90eca112a9c985252e984d0e3410691d7e1159ea"
  # MSYS2 MINGW-packages pins the same hash for the identical official URL
  # (mingw-w64-lasem PKGBUILD sha256sums), and preflight computed the
  # identical value on BOTH mirrors (gh-proxy + official). T2 SDE desc hash
  # a68f1e8d... does not match the bytes actually served; pkgsrc distinfo
  # only records size 56053928 (matches) without sha256.
patches:
  "0.6.0":
    - patch_file: "patches/itex2mml-native.patch"
      patch_description: "itex2mml generators run on build machine: find_program native:true + required:true"
      patch_type: "conan"
    - patch_file: "patches/suite-ini-ignore-image-cases.patch"
      patch_description: "suite.ini: ignore 6 image-loader cases (TIFF/SVG) missing from gdk-pixbuf/2.44.6.1.1, same as lasem-render 0.5.1"
      patch_type: "conan"
