# 软件级 manifest
# 文件位置: archives/l/lasem/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: lasem
display: "lasem"
description: "SVG and MathML rendering library with DOM-like API"
category: graphics
homepage: "https://github.com/LasemProject/lasem"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建, wrap_mode=nodownload, 依赖一律走 conan pkg-config"
    - "introspection/documentation/viewer 需 gi-docgen/gtk4, 在 OHOS 上 disabled"
    - "glib-mkenums 经 glib-2.0.pc 变量暴露; llvm-ar 绝对路径注入 native file"
    - "OHOS XPM 要求 build-tree 与安装后的 .so/可执行文件均代码签名"
    - "只读 /tmp: 测试期 TMPDIR/TMP/TEMP/HOME 指向任务可写 tmp"
  common_dependencies:
    - glib
    - cairo
    - pango
    - gdk-pixbuf
    - libxml2

versions:
  "0.6.0":
    status: built
    build_date: "2026-09-30"
    conan_ref: "lasem/0.6.0"
