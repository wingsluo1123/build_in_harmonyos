# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: latex2rtf/2.3.18a
homepage: "https://latex2rtf.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/basic_tests
    source: latex2rtf-2.3.18a/test/
    description: "上游基本测试: 将 .tex 文件转换为 .rtf 并对比结果"
    command: "make check"
  - file: test/align.tex
    source: latex2rtf-2.3.18a/test/align.tex
    description: "对齐测试"
    command: "../latex2rtf -Z3 -P ../cfg/:../scripts/ -T tmp/ align.tex"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "功能测试: 创建 .tex 文件并转换为 RTF, 验证 RTF 头部"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
