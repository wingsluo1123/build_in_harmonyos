# 软件级 manifest
# 文件位置: archives/l/latex2rtf/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: latex2rtf
display: "LaTeX to RTF Converter"
description: "Converts LaTeX documents to RTF format"
category: doc
homepage: "https://latex2rtf.sourceforge.net/"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure 脚本，直接 make CC=clang PREFIX=... 编译"
    - "CFGDIR 在编译时由 PREFIX 决定并硬编码到二进制中，运行时可用 RTFPATH 环境变量覆盖"
  common_dependencies: []

versions:
  "2.3.18a":
    status: built
    build_date: "2026-07-16"
