knowledge_gained:
  - "qt5-qtbase 配方以 -no-feature-sharedmemory 构建，QSharedMemory 不可用：单实例锁改用 QLockFile"
  - "qt5-qtbase 无聚合 Qt5Config 分模块配置（CMakeDeps 聚合模式组件 includes/libs 为空）：直接依赖 + QT5_INCLUDE_DIRS 注入"
  - "X11 头文件宏（Bool/Unsorted/Time 等）污染 AUTOMOC 合并 TU 中后续 Qt 头解析：X11 include 前先完整解析 Qt 头（include guard 防重解析）"
  - "AUTOMOC 合并 TU 与 qmake 逐文件 moc 的行为差异：x11 相关头需预解析 Qt 或拆出合并"

