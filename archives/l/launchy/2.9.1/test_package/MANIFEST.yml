# test_package/MANIFEST.yml — launchy 2.9.1 上游官方测试声明

package: launchy/2.9.1
homepage: "https://github.com/Slesa/launchy"

# 上游测试命令（用于 ctest -N 分析）
upstream_check_command: "ctest --output-on-failure (CMake enable_testing + add_subdirectory(launchy.specs))"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.ctest(cli_args=['--output-on-failure'])"

# 上游实际运行的测试程序（QtTest specs）
upstream_tests:
  - file: launchy.specs/commandlineparser.specs.cpp
    source: launchy-2.9.1/src/launchy.specs/commandlineparser.specs.cpp
    description: "CommandLineParserSpecs — 命令行解析（QCommandLineParser 长短参数/默认值）17 槽用例"
    command: "launchy_specs"
  - file: launchy.specs/singleapplication.specs.cpp
    source: launchy-2.9.1/src/launchy.specs/singleapplication.specs.cpp
    description: "SingleApplicationSpecs — 单实例锁（QLockFile）4 槽用例（上游源码注释为空壳，QLockFile 运行时路径由 test_package 消费者真实执行触及，见 test_package_tests）"
    command: "launchy_specs"

# test_package 中自带的测试（消费者视角验证，鸿蒙专项）
test_package_tests:
  - file: test.c
    description: "真实消费者程序（CMake 构建）:ELF aarch64 断言 + readelf DT_NEEDED 核心 Qt5/X11/libc++ 严格命中（缺失即失败）+ offscreen 平台真实执行 packaged bin/launchy（QLockFile 单实例锁路径真实执行，R40 路径 1）"
    command: "test_launchy <bin>/launchy <tmpdir> <qt_platform_plugin_path>"
  - file: test_launchy.sh
    description: "严格化消费者脚本（set -euo pipefail）:bin/launchy 为 aarch64 ELF + DT_NEEDED 核心库全部命中，任一缺失即失败退出（不再恒 PASS）"
    command: "sh ./test_launchy.sh <bin>/launchy"

# 测试断言总数（上游 21 槽 + 消费者 ELF/DT_NEEDED/QLockFile 运行时验证）
assertion_count: 21