software: lazygit
# 版本级 manifest
# 文件位置: archives/l/lazygit/0.48.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.48.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.48.0.tar.gz"

  # 源码校验和
  sha256: "b8507602e19a0ab7b1e2c9f26447df87d068be9bf362394106bad8a56ce25f82"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=1"
    - "GOFLAGS=-mod=vendor"
    - "go build -trimpath -ldflags '-s -w -X main.commit=v0.48.0 -X main.version=0.48.0 -X main.date=2025-01-01'"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # Go 工具链
  go_version: "go1.24.4 linux/arm64"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 产物信息
# ============================================================

artifacts:
  # 二进制产物
  - name: lazygit
    type: binary
    path: bin/lazygit
    size: 19333304
    sha256: "a72848776d8435d8b76176a0a890d48e7f7a785a4f6424ffeee7270f753cfcd2"
    elf: "ELF64 AArch64 EXEC (static, no dynamic section)"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目 lazygit 使用 vendor 目录，需要 GOFLAGS=-mod=vendor"
  - "lazygit 需要 CGO_ENABLED=1（tcell 终端 UI 库依赖 cgo）"
  - "Go 项目 conanfile.py 参考 fzf 模式：build() 方法直接调用 go build"
  - "SSL 证书问题需设置 SSL_CERT_FILE 环境变量指向 certifi cacert.pem"
  - "ohc-run.py conan-init 默认生成 autotools 模板，Go 项目需手动适配 conanfile.py 和 test_package/conanfile.py"
