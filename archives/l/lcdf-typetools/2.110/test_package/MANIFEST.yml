# test_package/MANIFEST.yml
package: lcdf-typetools/2.110
homepage: "https://www.lcdf.org/type/"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: "make check"
    source: "lcdf-typetools-2.110"
    description: "Autotools build verification (no dedicated test suite)"
    command: "make check"
test_package_tests:
  - file: conanfile.py
    description: "Verify all 11 installed tools are accessible and report version 2.110"
    command: "test_package/conanfile.py test() runs each tool with --version and greps for '2.110'"
assertion_count: 11
