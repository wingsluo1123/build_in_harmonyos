version: "1.5.13"
software: "lcmaps-plugins-verify-proxy"
status: built
build_date: "2026-10-01"
build_system: "autotools"
conan_ref: "lcmaps-plugins-verify-proxy/1.5.13"

source:
  url: "https://software.nikhef.nl/security/lcmaps-plugins-verify-proxy/lcmaps-plugins-verify-proxy-1.5.13.tar.gz"
  sha256: "1da6336ec8ab90d30cf3fe9322d743550ea8811b6dfbef0476f8cd6b1348c318"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-lcmaps-prefix=<lcmaps package>"
  dependencies:
    - "lcmaps/1.6.7"
    - "openssl/3.5.6.1.2"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-harmonyos.patch"
  - "0002-config-sub-ohos.patch"
  - "0003-configure-hmdfs-tmpdir.patch"
  - "0004-mod-install-symlink-fallback.patch"

artifacts:
  plugin_modules:
    - "lib/lcmaps/liblcmaps_verify_proxy.so"
    - "lib/lcmaps/lcmaps_verify_proxy.mod"
  executables:
    - "bin/verify-proxy-tool"

upstream_tests:
  declared_cases: 0
  passed: 0
  skipped: 0
  discovery: "No TESTS/check_PROGRAMS or check target in Makefile.am; upstream has no automated test suite."

consumer_tests:
  assertions: 12
  passed: 12
  command: "test_package/test_lcmaps_plugins_verify_proxy <package_root> <framework_root>"

knowledge_gained:
  - "The plugin is a libtool module loaded by LCMAPS; OHOS musl needs its lcmaps_* and crypto symbols explicitly linked into the module dependency closure."
  - "The .mod install entry must fall back from symlink to cp on OHOS storage policy restrictions."
