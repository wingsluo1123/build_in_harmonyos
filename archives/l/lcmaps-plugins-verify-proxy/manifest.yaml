software: lcmaps-plugins-verify-proxy
display: "LCMAPS verify-proxy plugin"
description: "LCMAPS proxy-chain verification plugin and verify-proxy-tool"
category: security
homepage: "https://github.com/Nikhef-lcaae/lcmaps"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub recognize aarch64-unknown-linux-ohos."
    - "The libtool module explicitly links its LCMAPS and crypto dependency closure."
    - "The .mod install entry falls back from symlink to copy on HMDFS."
  common_dependencies:
    - "lcmaps/1.6.7"
    - "openssl/3.5.6.1.2"

versions:
  "1.5.13":
    status: built
    build_date: "2026-10-01"
    path: archives/l/lcmaps-plugins-verify-proxy/1.5.13
