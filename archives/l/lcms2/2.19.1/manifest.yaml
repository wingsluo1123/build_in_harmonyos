software: lcms2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.19.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.19.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/mm2/Little-CMS/tarball/lcms2.19.1"

  # 源码校验和
  sha256: "calculated-after-success"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_C_COMPILER=clang"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "jpeg/62"
    - "tiff/4.7.1"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无补丁，使用 cmake 构建

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lcms2 同时支持 autotools 和 cmake，在 HarmonyOS 上推荐使用 cmake"
  - "autotools 的 config.guess (2018-02-24) 无法识别 HarmonyOS，即使打了补丁也无法工作"
  - "cmake 可以自动检测到 JPEG、TIFF、ZLIB 库"
  - "编译产物：共享库 liblcms2.so、静态库 liblcms2.a、工具程序（transicc、linkicc、psicc、jpgicc、tificc、tifdiff）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/lcms2-2.19.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/lcms2-2.19.1.work
  source_orig_hash: bf92c6ead4853ced
  source_work_hash: 3c76158fbc4a2069
  generated_at: '2026-05-26T15:06:56'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
