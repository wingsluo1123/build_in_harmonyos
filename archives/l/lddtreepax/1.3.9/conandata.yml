patches:
  - patch_file: "patches/0001-lddtree-py-portable-python3-shebang.patch"
    patch_description: "OHOS 设备 PATH 无裸 python 解释器（仅 python3），上游 shebang 指向不存在的解释器导致 execve ENOENT，且 meson/conan 会把解释器缺失误报成脚本文件丢失（pax-utils/1.3.10 patches/0001 同机制，E037）。/usr/bin/env 是真机 toybox 软链（实测可用）。只改 lddtreepax 交付文件 lddtree.py 的 shebang；测试脚本不改（build() 显式以 bash 启动）。"
    patch_type: "portability"
