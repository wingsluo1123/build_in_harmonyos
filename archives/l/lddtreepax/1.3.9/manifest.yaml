knowledge_gained:
  - "lddtreepax 不是独立上游库：gentoo/pax-utils 的 python 实现 lddtree（lddtree.py），Alpine 重命名为 lddtreepax 的 noarch 子包；C 工具（scanelf 等）属 pax-utils 子包，由 pax-utils/1.3.10 独立适配。（knowledge_ref: DRAFT-13619-lddtreepax-pax-utils-python-subpackage）"
  - "conan 2.29 python-require 依赖的 skip 机制：_skip_binaries 以 files=(headers|libs|run|build) 判定，python-require 无 C 头/库且 run 默认 False → BINARY_SKIP（package_folder=None、runenv 不聚合，conan graph info 实测）；requires 必须显式 run=True。（knowledge_ref: DRAFT-13620-conan2-python-require-run-true-binary-skip）"
  - "上游 lddtree-py 冒烟用例（lddtree.py /bin/bash | grep -i 'none'，负向断言）在 OHOS 上双空跑：fixture /bin/bash 缺失（/bin 只读）+ 设备无裸 python 解释器；修复等价探针（python3+pyelftools+真实 /bin/sh）FAIL 于 musl 无 libc.so soname 链 → lddtree.py:649 打印 None 命中 grep -i none（上游断言为 glibc 而写，alpine musl CI 是 -Dtests=false，musl 路径上游从未测过）。（knowledge_ref: DRAFT-13621-lddtree-py-musl-libc-soname-none-assertion）"
  - "musl/OHOS 布局下 lddtree.py 对无法解析的库打印 None（如 /bin/sh 的 libc.so => None）：上游算法平台边界，工具 rc=0 不崩溃，不修改上游行为。（knowledge_ref: DRAFT-13621-lddtree-py-musl-libc-soname-none-assertion）"
  - "conan.tools.env 在该 conan 构建导出 VirtualRunEnv（大写 E）；dotest-sfx 依赖 $0 带路径（${0%/*} 定位 lib.sh），须以 'bash ./dotest-py' 启动。（knowledge_ref: DRAFT-13623-conan-virtualrunenv-dotest-sfx-dollar0）"

