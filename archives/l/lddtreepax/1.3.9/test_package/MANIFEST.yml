# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

test_files:
  - path: "test_package/test_lddtreepax.py"
    test_type: "R34"
    assertion_count: 5
    description: "被测包内存在可执行 lddtreepax（provenance，显式路径不依赖 PATH 注入）+ pyelftools site-packages 可定位 + 直接执行（shebang #!/usr/bin/env python3）真实 aarch64 ELF /bin/sh：rc=0 + interpreter 行 + libc.so DT_NEEDED 行（substantive，防空壳）"
upstream_test_in_build: true
upstream_test_command: "bash ./dotest-py（tests/lddtree/meson.build 注册名 lddtree-py；conanfile.py build() can_run 时按 meson test 等价环境执行：workdir=tests/lddtree + builddir/srcdir/current_srcdir + pyelftools VirtualRunenv）"
# 上游 pax-utils v1.3.9 全部 meson test() 入口总数（声明 N，供 rule4 对账 实测N ≤ 声明N）：
# 8 条 = lddtree-sh/lddtree-py/lddtree-cmp（tests/lddtree）+ pspax-test（tests/pspax）
# + scanelf-test（tests/scanelf）+ source tests（tests/source）
# + fuzz-dumpelf/fuzz-ar（顶层 meson.build，条件 -Duse_fuzzing + Clang，默认关闭）。
# 本包 build() 实跑其中 1 条（lddtree-py，见 upstream_test_command/result）；
# 其余 7 条依赖 lddtreepax 不交付的 C 工具（scanelf/pspax/dumpelf/lddtree.sh/ar），
# 超出本包范围，由 pax-utils/1.3.10（C 工具子包）承接并单独申报。
upstream_test_count: 8
upstream_test_result: "raw 1/1 PASS（空跑：OHOS 设备无 /bin/bash fixture 且 /bin 只读不可补、设备 PATH 无裸 python 解释器，负向断言被空 stdout 满足，E363 边界，同 pax-utils/1.3.10 notes 第 83 行）。修复等价探针（python3 解释器 + pyelftools runenv + 真实 fixture /bin/sh）= FAIL：smoke 命中 'libc.so => None'——musl 布局无 libc.so soname 链，lddtree.py:649 打印 None 命中上游 grep -i 'none' 负向断言（该断言为 glibc 环境而写；上游 CI 仅 ubuntu/glibc 跑 tests，alpine musl CI 是 -Dtests=false，musl 路径上游从未测过）。真实行为由 test_package 5 条断言覆盖"
