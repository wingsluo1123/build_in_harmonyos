# test_package/MANIFEST.yml
# test_package 测试声明 + 上游测试入口清点（CI 门禁 L0e 要求此文件存在）

package: ldraw/20220211
homepage: "https://library.ldraw.org/"

# ---- 上游测试入口核验结论（2026-10-02，证据见 reports/test-report.md）----
# 1) 官方完整库 complete.zip（37,261 个文件）全量扫描：0 命中
#    test/spec/fixture/bench/regress/doctest/catch/gtest/check/脚本
#    （unzip -l | grep -iE ... → MATCH_COUNT: 0）
# 2) 包内唯一源码 mklist（Windows 时代工具）：
#    - mklist-c.zip / mklist1_4.zip / mklist1_6.zip 内 mklist.c
#      grep TEST|assert|selftest|test_ → 0 命中，无任何测试断言/注册
#    - 各 makefile 仅有 `all: mklist` 目标，无 test 目标
# 3) models/ 仅有 car.dat / pyramid.dat 样例模型与 Note*.txt 更新说明
#    （样例模型属于 LDraw 生态素材，非自动化测试用例）
# 结论：上游没有自动化测试入口（不是"未执行"，而是"不存在"）。
upstream_check_command: "unzip -l complete.zip | grep -icE 'test|spec|fixture|bench|regress|doctest|catch|gtest|check'  → 0"
upstream_test_in_build: false
upstream_test_command: "N/A（上游为纯数据资源库，无测试套件）"

upstream_tests:
  - file: "N/A — 上游为纯数据资源库（LDraw 零件数据 .dat/.ldr/.png），无构建系统、无测试套件"
    source: "https://library.ldraw.org/library/updates/complete.zip"
    description: "complete.zip 37,261 文件全量枚举：0 测试文件；mklist.c 无测试断言；makefile 无 test 目标"
    command: "N/A"

# test_package 自带的消费侧验证（不等于上游测试统计）
test_package_tests:
  - file: "test_package/test_ldraw.py"
    description: "消费侧校验 4 项：parts 全库规模>30000 / .dat 抽检 5 个首行合法 / LDConfig.ldr 颜色定义 / models 样例目录"
    command: "python3 test_ldraw.py <package_folder>"

assertion_count: 4