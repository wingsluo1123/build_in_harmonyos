sources:
  "4.0":
    url: "https://github.com/Orc/levee/archive/refs/tags/v4.0.tar.gz"
    sha256: "3a625efa3d852008eb821f52b30667e16101ca36099711ff513767ceeb527f79"

patches:
  "4.0":
    - patch_file: "patches/0001-levee.h.patch"
      patch_description: "把 levee 自有的全局符号 LINES/COLS/UP/refresh/scroll/overwrite 用宏改为 levee_ 前缀：它们与 curses/terminfo 同名，链接静态 libncursesw.a（R26）时 ld.lld 报 duplicate symbol（动态库场景被可执行文件符号抢占而静默通过）"
      patch_type: "portability"
    - patch_file: "patches/0002-main.c.patch"
      patch_description: "增加 GNU 长选项 --version/--help（打印后返回 0，不触碰终端）：上游只有 -e/-r/-t 短选项，--version 会进入编辑器阻塞，被 conan-verify L2 smoke 判定为二进制无法运行（E503 同类先例）"
      patch_type: "portability"
    - patch_file: "patches/0003-unixcall.c.patch"
      patch_description: "os_mktemp() 优先使用 $TMPDIR（未设置/为空时回退 /tmp）：上游把撤销/yank/! 过滤的临时文件写死在 /tmp，HarmonyOS PC 的 /tmp 只读；同时把 os_glob() 中一处 logit() 调用改为双括号约定，修复 musl（glob 不支持 GLOB_NOMAGIC → 走内置 glob）下的编译错误"
      patch_type: "portability"
