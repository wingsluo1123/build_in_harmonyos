# test_package/MANIFEST.yml — 上游测试声明（CI L0e 门禁读取本文件）
package: levee/4.0
homepage: "https://github.com/Orc/levee"

# 上游没有任何测试：源码包 48 个文件中无 test/tests 目录、无测试源文件，
# Makefile.in 只有 lev/version.c/mkversio/tags/clean/distclean/install* 目标，
# 没有 check/test 目标（清点命令与输出见版本级 notes.md「上游测试清点」）。
upstream_check_command: "none (Makefile.in has no check/test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 新增测试：test_package/test.sh 以使用者身份驱动打包出的 bin/levee
# （键盘输入走 stdin 管道，TERM=vt100 + ncurses/6.6 的 terminfo 数据库，
#  $TMPDIR 指向私有可写目录）。1-8 为功能/负向对照用例，9 为鸿蒙特有消费者流程。
test_package_tests:
  - id: 1
    file: test.sh
    description: "--version 输出 'levee 4.0' 且退出码 0（补丁 0002）"
  - id: 2
    file: test.sh
    description: "--help 输出 usage 行且退出码 0（补丁 0002）"
  - id: 3
    file: test.sh
    description: "可视模式 i 插入两行 + :wq 新建文件，文件字节与输入完全一致"
  - id: 4
    file: test.sh
    description: "-r 只读模式下 :w 被拒绝并提示 'File is readonly'，文件不变"
  - id: 5
    file: test.sh
    description: "终端层：静态链接的 libncursesw 从 TERMINFO 加载 vt100 的 cm 能力，屏幕高度取自 LINES=30，屏幕输出含 ESC[30;1H"
  - id: 6
    file: test.sh
    description: "2Gdd 删除第 2 行；2Gddu 撤销后文件恢复原样"
  - id: 7
    file: test.sh
    description: "负向对照（补丁 0003）：$TMPDIR 指向不存在目录时 6 KiB yank 无法溢出到磁盘，put 不增加行（128 行不变）；本机 /tmp 可写，据此证明溢出文件走 $TMPDIR"
  - id: 8
    file: test.sh
    description: "负向对照（补丁 0003）：$TMPDIR 不存在时 ! 过滤报 '[tempfile error]'，文件不变"
  - id: 9
    file: test.sh + consumer.c.in
    category: harmonyos-specific
    description: "鸿蒙特有消费者流程：levee 编辑 consumer.c.in（:1,$s 替换占位符、4!!sort 经 /bin/sh 过滤排序、:r 读入 128 行后 128yy 6 KiB yank 溢出到 $TMPDIR 再 p 复制），profile 的 OHOS 编译器把编辑结果编译为 AArch64 static PIE 并运行，程序逐项校验编辑结果（stamp、有序 fruit 表、256 行 ROW 与 sum=16512）"
    command: "bash test.sh <levee> <terminfo-dir> <cc> <test_package-dir> <work-dir>"
  - id: runner
    file: conanfile.py
    description: "定位安装包 bin/levee、ncurses/6.6 的 share/terminfo 与 profile C 编译器，以 conanrun 环境执行 test.sh，脚本退出码决定成败；输出 HMBS_UPSTREAM_TEST_RESULT（上游无测试）"

# 断言条数：test.sh 用例 1-9 内 25 处 fail 断言 + consumer.c 4 类校验
# （stamp / fruit 有序 / 行数 256 / 逐行取值）；不含前置检查与计数守卫
assertion_count: 29
