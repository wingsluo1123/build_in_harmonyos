# 上游官方源（作者单位站点 levmar 2.6 官方 tarball）。
# 官方主机 www.ics.forth.gr 的服务端 TLS 证书链不完整：握手只发送叶证书
# CN=ics.forth.gr 与 HARICA TLS RSA Root CA 2021，缺签发叶证书的中间 CA
# "GEANT TLS RSA 1"，故 curl / conan / python-ssl 等一切标准校验客户端恒报
# "unable to get local issuer certificate"（CI build #97837 首错同源）。
# 作者官方下载页在同一作者站点给出的入口主机 users.ics.forth.gr 提供逐字节
# 相同的归档（sha256 与旧 URL 一致），故改用该官方入口的 http 直链；
# 内容完整性由下方 sha256 固定，不依赖传输层校验。
# 属 R39/PF7「官方托管例外」（官方源自身 https 不可用），取证见 notes.md 与 PR 正文。
