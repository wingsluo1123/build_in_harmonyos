  - "上游 CMake 声明 cmake_minimum_required(VERSION 2.6)，配方注入 CMAKE_POLICY_VERSION_MINIMUM=3.5；上游无 install()/无 CTest，制品由配方显式收集，上游自动化用例如实申报 0。"
