software: lhasa
version: "0.6.0"
status: built
build_date: "2026-07-14"
conan_ref: "lhasa/0.6.0@ohpcd/stable"
build_system: autotools

source:
  url: "https://github.com/fragglet/lhasa/releases/download/v0.6.0/lhasa-0.6.0.tar.gz"
  sha256: "9840154367f73e9d9c3196f944a121ab4d398d84e921c8fe8fca8a931274aed7"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-shared"
    - "--enable-static"
    - "--prefix=/"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Lhasa 0.6.0 的 config.sub 已支持 linux-ohos，但 HarmonyOS 上 config.guess 仍可能无法识别，需要显式传入 --build/--host=aarch64-unknown-linux-ohos"
  - "Autoconf 2.73 生成的 config.status 使用 umask 077 创建临时目录，在 OHOS/HMDFS 上会导致权限失败，构建前替换为 umask 022"
  - "OHOS 不支持 GNU make jobserver FIFO，Autotools 构建使用 make -j1"
