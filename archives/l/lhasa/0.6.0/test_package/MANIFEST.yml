package: lhasa/0.6.0
homepage: "https://github.com/fragglet/lhasa"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - "make check: upstream archive regression suite; not run in Conan recipe to keep package verification focused and deterministic on OHOS"

test_package_tests:
  - file: test.c
    description: "消费者视角链接 liblhasa 并调用 lha_input_stream_from() API"
    command: "ctest --output-on-failure"
  - file: conanfile.py
    description: "执行 lha 验证命令行工具安装可用"
    command: "lha"

assertion_count: 2
