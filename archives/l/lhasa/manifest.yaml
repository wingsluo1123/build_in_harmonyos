software: lhasa
display: "Lhasa"
description: "LHA/LZH 归档解析库及兼容 Unix LHA 的命令行工具"
category: archive
homepage: "https://github.com/fragglet/lhasa"
license: ISC
build_system: autotools

ohos_adaptation:
  key_points:
    - "显式传入 --build/--host=aarch64-unknown-linux-ohos，绕过 config.guess 对 HarmonyOS 的识别失败"
    - "将 configure 中 umask 077 替换为 umask 022，避免 HMDFS 临时目录权限问题"
    - "make 使用 -j1，避免 OHOS 不支持 GNU make jobserver FIFO"
    - "禁用 shared，仅构建 liblhasa.a 与 lha 命令行工具"
  common_dependencies: []

versions:
  "0.6.0":
    status: built
    build_date: "2026-07-14"
