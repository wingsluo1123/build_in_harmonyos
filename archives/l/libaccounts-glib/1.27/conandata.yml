sources:
  url: "https://gitlab.com/accounts-sso/libaccounts-glib/-/archive/VERSION_1.27/libaccounts-glib-VERSION_1.27.tar.gz"
  sha256: "a8407a5897a2e425ea1aa955ecf88485dd2fd417919de275b27c781a5d0637a5"

patches:
  - patch_file: "patches/0001-docs-meson.build.patch"
    patch_type: "portability"
    patch_description: "禁用 gtkdoc 文档生成（gtkdoc-scan 未预装）"
  - patch_file: "patches/0002-libaccounts-glib-meson.build.patch"
    patch_type: "portability"
    patch_description: "gobject-introspection 可选化 + 禁用 pygobject 子目录"
  - patch_file: "patches/0003-tools-meson.build.patch"
    patch_type: "portability"
    patch_description: "禁用 ag-backup/ag-tool 工具（libintl 链接问题）"
  - patch_file: "patches/0004-disable-tests.patch"
    patch_type: "portability"
    patch_description: "禁用 tests 子目录（需 check + dbus-test-runner，OHOS 不可用且 /tmp 只读）"
  - patch_file: "patches/0005-pregen-marshal.patch"
    patch_type: "portability"
    patch_description: "跳过 gnome.genmarshal，改用 build() 预生成的 ag-marshal.h/c（HMDFS 无执行位）"
