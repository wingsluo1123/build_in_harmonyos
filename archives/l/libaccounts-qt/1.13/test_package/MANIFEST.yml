# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: libaccounts-qt/1.13
homepage: "https://gitlab.com/accounts-sso/libaccounts-qt"

# Upstream test command (qmake-based project, tests disabled for OHOS)
upstream_check_command: "make -C tests check"

# Upstream tests not run in build (qmake module system unusable on OHOS;
# manual moc + clang++ build path, see ADAPTATION_LOG.md)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test.cpp
    description: "Construct Accounts::Manager and call accountList() to verify linking"
    command: "./test_libaccounts_qt"

# Test assertion count (approximate)
assertion_count: 3
