# test_package/MANIFEST.yml — libadwaita 1.2.0
# CI L0e requires this file to exist.

package: libadwaita/1.2.0
homepage: "https://gitlab.gnome.org/GNOME/libadwaita"

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test"

upstream_tests:
  - file: tests/meson.build
    source: libadwaita-1.2.0/tests/meson.build
    description: "libadwaita test suite covering widgets, styles, animations, and utility functions"
    command: "meson test"

test_package_tests:
  - file: test_libadwaita.c
    description: "Calls adw_get_major_version() to verify library linkage and expected major version (1)"
    command: "./test_libadwaita"

assertion_count: 1
