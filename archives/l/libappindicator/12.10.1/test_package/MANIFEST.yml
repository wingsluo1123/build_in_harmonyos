# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见 docs/TEST_QUALITY_SPEC.md、R51（上游测试三步法）
package: libappindicator/12.10.1
homepage: "https://launchpad.net/libappindicator"

# 上游测试入口（autotools：tests/Makefile.am，autotools 平行测试 harness）
upstream_check_command: "make check"

# conanfile.py build() 是否执行上游 make check：否。build() 只编译测试程序，
# 真实执行发生在 test_package/test()（同属一次 `conan create`，见下方
# upstream_test_command 与实测数字）。
#
# 具体技术原因（R51 第二步）：
#  1. tests/Makefile.am 的 4 个 TESTS 全部生成为脚本，脚本内容固定为
#       export DISPLAY= ; . run-xvfb.sh ; dbus-test-runner -m 300 \
#           --dbus-config /usr/share/dbus-test-runner/session.conf --task ...
#     需要同时具备 (a) Xvfb/X11 显示（OHOS 的 GTK 只有 broadway 后端，无 X11，
#     run-xvfb.sh 无法工作）、(b) dbus-test-runner 及硬编码的
#     /usr/share/dbus-test-runner/session.conf（OHOS 根文件系统只读，无法安放）。
#     这是平台能力缺失，不是配方选择。
#  2. tests/ 8 个 check_PROGRAMS 中 6 个直接 include <dbus/dbus-glib.h>，需要
#     dbus-glib-1（TESTDEPS）。制品仓的 dbus-glib/0.114 锁定 glib/2.88.0，与
#     本库 gtk3 链所 pin 的 glib/2.84.0.1 冲突；实测按其配方对 glib 2.84
#     源码重建失败（ld.lld: unable to find library -lgio-2.0/-lffi，见 notes.md
#     「dbus-glib 不可用」）。故 0003 补丁把 TESTDEPS 探测改为非致命，并只
#     编译不依赖 dbus-glib 的 2 个程序。
upstream_test_in_build: true
upstream_test_command: "./test-libappindicator --verbose   (test_package/test() 内真实执行；g_test 9 用例，本地实测 1..9 全 ok / exit=0，复跑 3/3 次 exit=0；编译阶段为 build() 内 `make -C tests test-libappindicator test-simple-app`，2/8 个 check_PROGRAMS)"

# 上游测试用例普查（tests/Makefile.am + tests/*.c，逐项，R51 第一步）
upstream_tests:
  - file: tests/test-libappindicator
    source: libappindicator-12.10.1/tests/test-libappindicator.c
    description: "上游单元测试：9 个 g_test 用例（init/init_props/init_set_props/prop_signals/set_label/set_menu/label_signals/desktop_menu/desktop_menu_bad）。main() 先 gtk_init()（无显示后端立即退出）→ 需要 broadwayd 显示服务。已逐字复制进 test_package（upstream-test-libappindicator.c，sha256 d5fa8623… 与上游一致）真实执行：本地实测 TAP `1..9` 全 `ok`、exit=0，复跑 3/3 次 exit=0。日志中 8 行 `not ok … FATAL-WARNING: Unable to get the session bus … Bail out!` 来自 libdbusmenu 派生子进程（OHOS 无 D-Bus session bus），不影响父进程 9 个用例判定与退出码"
    command: "./test-libappindicator --verbose   (g_test 9 用例；需 broadwayd；实测 9/9 ok, exit=0)"
  - file: tests/libappindicator-tests
    source: tests/Makefile.am（gtester 包装 test-libappindicator）
    description: "test-libappindicator 二进制的 gtester 包装脚本：export DISPLAY= + run-xvfb.sh(Xvfb) + dbus-test-runner --dbus-config /usr/share/dbus-test-runner/session.conf。Xvfb/X11 与 dbus-test-runner 均超出 OHOS 平台能力 → 脚本不可运行；其被包装的 9 个用例已由上一项真实执行"
    command: "dbus-test-runner --task ./libappindicator-tests-gtester (OHOS 不可用)"
  - file: tests/test-libappindicator-dbus
    source: tests/test-libappindicator-dbus-client.c + tests/test-libappindicator-dbus-server.c
    description: "D-Bus client/server 对端测试（dbus-glib API）：2 个 check_PROGRAMS。① 依赖 dbus-glib-1，与 glib/2.84.0.1 不兼容（实测源码重建失败），未编译；② 编排脚本需 Xvfb + dbus-test-runner，OHOS 不可运行；③ 上游自身把它列入 XFAIL_TESTS"
    command: "dbus-test-runner --task ./test-libappindicator-dbus-client --task ./test-libappindicator-dbus-server (OHOS 不可用)"
  - file: tests/test-libappindicator-status
    source: tests/test-libappindicator-status-client.c + tests/test-libappindicator-status-server.c
    description: "StatusNotifier client/server 对端测试（dbus-glib API）：2 个 check_PROGRAMS。同因 dbus-glib-1 不可用而未编译，编排脚本需 Xvfb + dbus-test-runner，OHOS 不可运行"
    command: "dbus-test-runner --task ./test-libappindicator-status-client --task ./test-libappindicator-status-server (OHOS 不可用)"
  - file: tests/test-libappindicator-fallback-watcher + tests/test-libappindicator-fallback-item
    source: tests/test-libappindicator-fallback-watcher.c + tests/test-libappindicator-fallback-item.c
    description: "回退（fallback）watcher/item 对端测试（dbus-glib API）：2 个 check_PROGRAMS。同因 dbus-glib-1 不可用而未编译，编排脚本需 Xvfb + dbus-test-runner，OHOS 不可运行"
    command: "dbus-test-runner --task ./test-libappindicator-fallback-watcher --task ./test-libappindicator-fallback-item (OHOS 不可用)"
  - file: tests/test-simple-app
    source: libappindicator-12.10.1/tests/test-simple-app.c
    description: "最小消费者示例程序（GtkMenu + app_indicator_* 后进入主循环，需人工终止）：非自动化用例（上游未纳入 TESTS）；已在 build() 中真实编译，其调用面由 test_package 的消费者端到端用例覆盖"
    command: "手动运行（上游未纳入 TESTS）"

# test_package 自带测试
test_package_tests:
  - file: test_consumer.c
    description: "鸿蒙特有消费者端到端用例（rule12，真实运行）：构造 AppIndicator → 设置 status/label/icon/attention-icon/title/icon-theme-path/ordering-index → 事件循环驱动 new-label/new-status/new-icon 信号并校验信号语义 → GtkMenu 挂载后经 dbus-menu-server 属性取回 dbusmenu 树逐项比对标签 → .desktop 构建菜单往返校验。本地实测 `CONSUMER_E2E_RESULT checks=27 failures=0 … display=yes`，连续复跑 5/5 次 exit=0、0 条 Gtk-CRITICAL"
    command: "./test_package"
  - file: upstream-test-libappindicator.c
    description: "上游 tests/test-libappindicator.c 逐字复制（未修改，sha256 与上游一致），9 个 g_test 用例真实执行（需 broadway 显示后端，由 test_package 拉起 broadwayd 并以 GDK_BACKEND=broadway DISPLAY=:5 BROADWAY_DISPLAY=:5 运行）"
    command: "./test-libappindicator --verbose"

# 断言/检查点总数（2026-10-08 机械复算 + 运行期实测对齐）
#
# test_consumer.c 里 `check(` 共 26 处匹配 = 1 处**函数定义**（第 36 行）
#   + 25 处**调用点**。25 个调用点的分布：
#       20 处在 `if (display)` 菜单往返段之外
#        5 处在 `if (display)` 之内，其中 1 处位于 `for (i = 0; i < 3; i++)` 体内
#   故执行次数（check() 内部用 `checks++` 自增，与 PASS 序号同源）：
#       display=yes : 20 + (4 + 3*1) = 27 次
#       display=no  : 20 次（菜单往返段整体跳过）
#   实测：PASS 序号 1..27 **连续无缺口**、failures=0、
#        `CONSUMER_E2E_RESULT checks=27 failures=0 ... display=yes`
#   => consumer_assertion_count 取 display=yes 口径的 **27**。
consumer_assertion_count: 27
# 上游 g_test 用例 9 个，实测 TAP `1..9` 全 ok / exit=0。
upstream_assertion_count: 9
# 合计（display=yes 口径）：27 + 9 = 36
assertion_count: 36
