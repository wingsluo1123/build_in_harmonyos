package: libassuan/3.0.2
homepage: "https://gnupg.org/software/libassuan/"

# ── 上游官方测试声明（HMBS 门禁口径）─────────────────────────────────
# 上游 TestSuite 采用 automake 序列 TESTS 驱动（tests/Makefile.am），无
# test-suite.log（非并行 test driver）。注册的 TESTS 在 OHOS/musl（具备
# struct cmsghdr/cmsg_len，descriptor passing 开启）下为 4 个：
#   version / pipeconnect / fdpassing / fdpassing-socket.sh
# conanfile.py build() 在真机执行上游完整 `make -j1 check`；补丁修改的
# tests/Makefile.in check-TESTS 驱动在该 TESTS 循环结束时，用其自身累计的
# all/failed/skip 计数打印 HMBS_UPSTREAM_TEST_RESULT（唯一确定性来源，
# 不做减法推导、不嗅探测试 stdout）。计数恒等式：discovered=all+skip、
# executed=all、passed=all-failed、failed=failed、skipped=skip。
upstream_tests_exist: true
upstream_test_audit: "审计 libassuan 3.0.2 发布包 tests/Makefile.am：TESTS = (test_programs) + (check_SCRIPTS)。test_programs = version、pipeconnect，USE_DESCRIPTOR_PASSING 开启时追加 fdpassing；check_SCRIPTS = fdpassing-socket.sh（USE_DESCRIPTOR_PASSING 开启时）。USE_DESCRIPTOR_PASSING 由 configure 检查 struct cmsghdr.cmsg_len 决定（OHOS musl <sys/socket.h> 定义该成员 → 开启），故 OHOS 上注册总数为 4。socks5 仅为 pipeconnect 的测试工具（testtools，不在 TESTS）。上游 `make check` 由 conanfile.py build() 在真机完整执行（upstream_test_in_build: true），结果以真机实际执行为准。"
upstream_test_total: 4
upstream_test_count_method: autotools_tests
# 下面三个通过数/失败/跳过为“预期口径声明”，最终以真机 make check 实际结果
# （HMBS_UPSTREAM_TEST_RESULT）为准，证据轮据此对账。
upstream_test_passed: 4
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_not_run: 0
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游测试命令汇总（供人工复现）
upstream_check_command: "make check"

upstream_tests:
  - name: version
    description: "Checks header and runtime version compatibility."
    command: "./version"
  - name: pipeconnect
    description: "Runs an Assuan client/server transaction over spawned-process pipes."
    command: "./pipeconnect"
  - name: fdpassing
    description: "Checks descriptor passing when supported by the target platform."
    command: "./fdpassing"
  - name: fdpassing-socket.sh
    description: "Checks descriptor passing over a Unix-domain socket when supported."
    command: "./fdpassing-socket.sh"

# test_package 消费者测试（真实调用库 API，R34 反空壳）
# test.c 建立 Unix socketpair 上的一对 Assuan 客户端/服务端，执行
# version 校验 + ECHO 数据往返 + BYE 干净关闭，共输出 5 行 "CASE PASS"。
test_package_tests:
  - file: test.c
    description: "Creates an Assuan server and client over socketpair, checks version, sends ECHO data, validates the response, and performs a clean BYE transaction (5 real functional checks)."
    command: "./test_libassuan"

# 测试断言总数（质量评估用）：上游 4 + 消费者 5
assertion_count: 9
