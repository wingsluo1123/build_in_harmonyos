    sha256: "e5f07f34f5921bcb5ccccfe3751c28497879a6451cd7b395e99e24d9b5728e8d"
  - url: "https://codeload.github.com/SSSD/ding-libs/tar.gz/refs/tags/0.6.2"
    sha256: "9068981a3f319cf28724e67b0dc803ede4c74d1e3b61c2b3fb9907824de5e2b7"
    # codeload 路径尾段是 tag 名(0.6.2),conan 按文件名后缀判定压缩格式,
    # 必须显式指定 filename 才会按 tar.gz 解压(否则误判 zip)
    filename: "ding-libs-0.6.2.tar.gz"

patches:
  - patch_file: "patches/0001-align-basicobjects-version-with-package-0.2.0.patch"
    patch_description: "Align basicobjects sub-library version (pc/soname metadata) with the task-specified 0.2.0 package version"
    patch_type: "compatibility"
  - patch_file: "patches/0002-configure-umask-022-for-hmdfs-config-status-tmpdir.patch"
    patch_description: "Use umask 022 for the config.status tmp dir (setgid HMDFS makes umask 077 dirs unwritable, breaking makefile fragment bootstrap on CI workers)"
    patch_type: "portability"
