software: libbasicobjects
version: "0.2.0"
status: built
build_system: autotools
build_date: "2026-10-16"
created_at: 2026-10-16
configure_options:
  - "--disable-nls (OHOS musl 无 GNU gettext,path_utils.h 声明缺失会阻断伞形全量构建)"
  - "--disable-dependency-tracking (受限执行环境 depfiles 引导不可靠,单文件库无收益)"
  - "--build/--host=aarch64-unknown-linux-gnu (OHOS:2018 版 config.guess 不识别 HarmonyOS)"
  - "目标级构建 make simplebuffer_ut(连带 libbasicobjects.la),不做伞形 make all/install"
knowledge_gained:
  - "ding-libs 版本拓扑:0.6.2 是最后提供独立 libbasicobjects.la 的发行版(子版本 0.1.1,-version-info 1:0:1 → libbasicobjects.so.0);0.7.0(2026-03)起 basicobjects 源码并入 libini_config 不再独立出库。任务目录版本 0.2.0 为平台任务标识,以 0.6.2 官方发行包为源,patch 对齐 pc 元数据版本"
  - "GitHub 官方 release asset(带预生成 configure/Makefile.in/aclocal.m4)与 codeload tag archive 字节流不同且后者无预生成 configure:主源用官方 asset 免构建机 autotools,备源 codeload 配 autoreconf 兜底(shutil.which 检测)"
  - "OHOS 上 ding-libs 全量 make all 会挂:libpath_utils 无条件 #include <libintl.h> 且 _(x)=gettext(x),musl 无 GNU gettext 实现导致 -Wint-conversion 编译错误(知识库桶4 --disable-nls 同源);但 libbasicobjects 本体零 gettext 依赖,目标级构建 make simplebuffer_ut 完全绕开"
  - "受限执行环境(HMDFS/沙箱)三连坑与对策:configure 由 bash 显式解释执行;make 传 SHELL=<abs bash> MKDIR_P='<abs mkdir> -p' 规避 /bin/sh recipe 与 install-sh 的 execve 拒绝;libtool wrapper(simplebuffer_ut)为 /bin/sh 脚本不可直跑,须执行 .libs/ 下的真 ELF"
  - "shared 变体真 ELF 的 libtool RUNPATH 指向 conan package_folder/lib(AutotoolsToolchain 默认 prefix):build() 内先部署包布局再跑 UT,UT 即可正确加载同批构建的 .so"
patches_applied:
  - "0001-align-basicobjects-version-with-package-0.2.0.patch (configure + version.m4:子库版本 0.1.1→0.2.0 对齐 conan ref)"
  - "0002-configure-umask-022-for-hmdfs-config-status-tmpdir.patch (config.status tmp 目录 umask 077→022,CI Worker HMDFS setgid 组合坑,与 a52dec 0.7.4 同款)"
source_url: https://github.com/SSSD/ding-libs/releases/download/0.6.2/ding-libs-0.6.2.tar.gz
dependencies: []
notes: |
  版本映射:平台任务指定 libbasicobjects 0.2.0;上游 SSSD/ding-libs 从未发布
  过独立子库 0.2.0(0.6.2=0.1.1 为最后独立版,0.7.0 起并入 libini_config)。
  以 ding-libs 0.6.2 官方发行包为源,配方版本 0.2.0 与任务分支名/CI 归档
  目录一致;patch 0001 将 pc 元数据版本对齐 0.2.0(soname libbasicobjects.so.0
  保持上游 ABI 不变)。

  适配要点:
  - autotools 官方构建系统,目标级构建(伞形全量构建被 path_utils 的
    gettext 声明问题阻断,而 libbasicobjects 零 gettext 依赖)。
  - 包交付:libbasicobjects.{a,so*} + simplebuffer.h + 重写 prefix 的
    basicobjects.pc(lib/pkgconfig/)+ COPYING。
  - 上游官方单测 simplebuffer_ut 在 build() 内执行(CI L1);test_package
    消费者探针 16 断言 + vendored 上游 UT 复跑双保险。
  - 本机(真机 OHOS aarch64)static 与 shared 双变体均完成全流程验证:
    configure/make/UT 直跑 exit 0。
