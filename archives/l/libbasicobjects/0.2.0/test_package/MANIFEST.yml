package: libbasicobjects/0.2.0
homepage: "https://github.com/SSSD/ding-libs"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "simplebuffer_ut -v"

upstream_tests:
  - name: simplebuffer_ut
    command: "basicobjects/simplebuffer_ut"
    expected: "pass (exit 0)"

test_package_tests:
  - file: test.c
    description: "Consumer probe exercising every public simplebuffer API with byte-exact round-trip assertions"
    command: "basicobjects_probe"
  - file: upstream-test/simplebuffer_ut.c
    description: "Upstream official unit test re-run from vendored sources against the installed library"
    command: "simplebuffer_ut"

assertion_count: 20
