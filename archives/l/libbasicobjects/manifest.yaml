software: libbasicobjects
display: "libbasicobjects"
description: "SSSD ding-libs 基础数据对象库(simplebuffer 可增长字节缓冲区)"
category: system
homepage: "https://github.com/SSSD/ding-libs"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "ding-libs 0.6.2 官方发行包为源(最后提供独立 libbasicobjects 的版本);任务版本 0.2.0 为平台标识,patch 对齐 pc 元数据版本,soname libbasicobjects.so.0 不变"
    - "--disable-nls + 目标级构建 make simplebuffer_ut 连带 libbasicobjects.la:绕开伞形仓库 path_utils 的 gettext 声明问题(OHOS musl 无 GNU gettext)"
    - "OHOS 显式 --build/--host=aarch64-unknown-linux-gnu(2018 版 config.guess 不识别 HarmonyOS)"
    - "上游官方单测 simplebuffer_ut 在 build() 内直跑 .libs 真 ELF(绕开 libtool /bin/sh wrapper);test_package 消费者探针 16 断言 + vendored 上游 UT 复跑"
  common_dependencies: []

versions:
  "0.2.0":
    status: built
    build_date: "2026-10-16"
    conan_ref: "libbasicobjects/0.2.0"
