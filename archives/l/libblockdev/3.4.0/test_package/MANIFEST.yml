# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libblockdev/3.4.0
homepage: "https://github.com/storaged-project/libblockdev"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libblockdev uses Python-based integration tests (tests/) that require
# loop devices and kernel modules not available on HarmonyOS.
# The conan test_package uses a minimal C test calling bd_loop_init().
upstream_tests:
  - file: tests/run-tests.py
    source: libblockdev-3.4.0/tests/run-tests.py
    description: "Python integration tests for libblockdev plugins (not runnable on OHOS)"
    command: "python3 tests/run-tests.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 bd_loop_init() 和 bd_loop_close() 验证 loop 插件 API 可用"
    command: "./test_libblockdev"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
