software: libbs2b
version: "3.1.0"
status: built
build_system: autotools
build_date: "2026-10-13"

source:
  # 【换源】上游 sourceforge 在沙箱不可达（含全部镜像），改用 Fedora lookaside 的 pristine 上游 tarball
  # （Fedora 记录 md5 00d32ffa6461dde6a632c846da3e0a13，本包已逐字核验一致）
  url: "https://src.fedoraproject.org/repo/pkgs/libbs2b/libbs2b-3.1.0.tar.lzma/00d32ffa6461dde6a632c846da3e0a13/libbs2b-3.1.0.tar.lzma"
  sha256: "b97164dd98fda4b05722fd68ffed2427b980dfb8316bbbbcfc0cde3ae5238cd5"
  tar_format: tar.lzma
  upstream_url: "https://sourceforge.net/projects/bs2b/files/libbs2b/3.1.0/libbs2b-3.1.0.tar.gz/download"

build:
  system: autotools
  configure_options:
    - "--disable-rpath"
    - "--enable-shared --disable-static"
  dependencies:
    - "libsndfile/1.2.2"
  note: >-
    上游 configure.ac 第 18-19 行对 sndfile 是**硬性**要求（PKG_CHECK_EXISTS 失败即 AC_MSG_ERROR），
    但只检查存在性、不导出其 CFLAGS/LIBS，因此 recipe 额外把 libsndfile 的头/库路径注入 CPPFLAGS/LDFLAGS
    （否则 src/Makefile.am 的 bs2bconvert/bs2bstream 报 'sndfile.h' file not found）。

tests:
  upstream_tests: 0
  added_consumer_scenarios: 1
  added_consumer_assertions: 5

# 路径评估（按仓内口径：A=基础适配、B=知识库扩展、C=高难度挑战）
paths:
  path_a:
    status: "已完成"
    evidence: "conan create rc=0；test_package 实测 level_fcut=700 level_feed=30、cross_feed_f left=0.754334 right=0.039345、版本 0x30100，输出『libbs2b 等级编码/采样率/串扰处理 检查通过』"
  path_b:
    status: "可申报（候选）"
    rationale: >-
      四条可迁移经验：① **srcpkgs 式换源**——上游 sourceforge 不可达时改用 Fedora lookaside 的 pristine
      上游 tarball（与 libcddb 用 Debian pristine orig 同模式）；② **Conan 的 get() 不支持 .tar.lzma**
      （会走 zip 分支报 BadZipFile）→ 用 download()+标准库 lzma/tarfile 解包并自己实现 strip_root，
      且注意 export_sources 已把 patches/ 放进源目录、不能靠"唯一子目录"判断；③ **HMDFS 的 umask 陷阱的双重性**：
      configure 与 config.status 都带 `umask 077`，只改前者仍会在 make 重跑 config.status 时失败；
      且补丁改过 configure.ac 会让 make 触发 autoconf/config.status --recheck 规则 → 需把生成物置新、
      输入置旧（**不能用未来时间戳**，否则 autoconf 健全性检查报 "newly created file is older than
      distributed files"）；④ **PKG_CHECK_EXISTS 不等于会导出 CFLAGS/LIBS**：上游只做存在性检查时，
      消费者/工具目标仍需 recipe 显式注入头库路径。
    artifacts: ["notes.md 的「换源与构建踩坑」", "manifest.yaml 的 source/build 注记"]
  path_c:
    status: "不主张"
    rationale: "单体库 + autotools + 常规换源/构建修补，无 bundled 依赖自举与大规模回归矩阵。"
