# 版本号
version: "0.11.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://libbsd.freedesktop.org/releases/libbsd-0.11.7.tar.xz"
  sha256: "9baa186059ebbf25c06308e9f991fda31f7183c0f24931826d83aa6abd8a0261"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  build_system: autotools
  configure_options:
    - "--disable-dependency-tracking"
  dependencies:
    - "libmd/1.1.0"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure-umask-fix.patch"
  - "0002-config-guess-harmonyos.patch"
  - "0003-config-sub-harmonyos.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E011: HMDFS umask 077 causes permission denied, fix with umask 022"
  - "E007+E072: config.guess/config.sub need HarmonyOS platform detection"
  - "libmd dependency required for MD5/SHA-2 functions, not available in system libc"
  - "closefrom test fails (Signal 31/SIGSYS): close_range syscall not implemented in HarmonyOS kernel"
  - "funopen test fails: fopencookie fclose assertion failure, platform limitation"
