software: libcddb
version: "1.3.2"
status: built
build_date: "2026-10-13"
build_system: autotools

source:
  # 沙箱内 sourceforge 不可达（实测 connection refused），改用 Debian 归档的 pristine orig tarball
  # （内容等同上游发布物，解包目录 libcddb-1.3.2/ 与上游一致；sha256 为本包实测值）
  url: "https://ftp.debian.org/debian/pool/main/libc/libcddb/libcddb_1.3.2.orig.tar.gz"
  sha256: "93f7860bdafa26f21d60a4d0ce2a8e55a0573841116aade79d90b64651b2b664"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-rpath"
    - "--enable-shared"
    - "--disable-static"
  dependencies: []
  note: "charset 转换使用 libc 内置 iconv（musl 提供），不额外引入 libiconv"

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

test:
  test_package: "CMake 消费者测试（断言 CDDB_VERSION 自报 1.3.2、cddb_new/cddb_destroy 生命周期、cddb_errno 初值为 0）"

# 路径评估（按仓内口径：A=基础适配、B=知识库扩展、C=高难度挑战）
paths:
  path_a:
    status: "已完成"
    evidence: "conan create rc=0；消费者测试打印 libcddb version: 1.3.2 aarch64-unknown-linux-ohos 且生命周期断言通过"
  path_b:
    status: "可申报（候选，规模较小）"
    rationale: "两条可迁移经验：① 官方源（sourceforge）在受限网络中不可达时，用 Debian 归档的 pristine orig tarball 作为合规替代（内容等同上游、sha256 可核验）；② HMDFS 下 configure 的 umask 077 必须改 022（config.status 报 could not setup config files machinery）"
    artifacts: ["notes.md"]
  path_c:
    status: "不主张"
    rationale: "单体小库 + autotools + 3 段可移植性补丁，无 bundled 依赖与高成本验证。"

knowledge_gained:
  - "官方源主机不可达时，Debian 归档的 pristine orig tarball 可作为合规替代源（目录名与上游一致、sha256 可核验）；须在 conandata.yml 注明替代理由（ref: notes.md）"
  - "configure 的 `umask 077` 在 HMDFS 上必然失败（0700 临时目录不可写）→ 与 libbluray 同款补丁改 022（ref: notes.md）"
