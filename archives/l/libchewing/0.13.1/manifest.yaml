upstream_tests_exist: true
upstream_test_audit: "libchewing 0.13.1: CMake+CTest+Corrosion(Rust) project. Top CMakeLists.txt includes CTest, option BUILD_TESTING default ON, add_subdirectory(tests). tests/CMakeLists.txt registers 14 C testcases (test-bopomofo, test-config, test-easy-symbol, test-error-handling, test-fullshape, test-keyboard, test-keyboardless, test-logger, test-regression, test-reset, test-special-symbol, test-struct-size, test-symbol, test-userphrase) via add_test plus 3 cargo tests (cargo-test-lib, cargo-test-capi, cargo-test-cli). Test tools (performance, randkeystroke, simulate, stress, testchewing, plus genkeystroke if Curses found) are built but not registered as ctest entries. Valgrind variants only appear when valgrind is found (not on OHOS). Default OHOS ctest -N denominator is 17. Rust crates (chewing_capi, chewing-cli, chewing_testhelper) are built via Corrosion, requiring cargo/rustc >= 1.95. Dictionary data comes from git submodule data/ at bfba418 (libchewing-data), fetched as second source from the github.com/fcitx-contrib/libchewing-data mirror (commit 7bd07548, content-identical to codeberg bfba418); codeberg.org is not in the CI mirror whitelist so both sources are pinned to github.com archives (R39/E549). Thirdparty sqlite amalgamation is bundled, no external sqlite dependency."
upstream_test_total: 17
upstream_test_count_method: ctest_entries
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true

