sources:
  url: "https://github.com/sailfishos/libcontentaction/archive/refs/tags/0.4.13.tar.gz"
  sha256: "24d25797a8b9ee681ff5431f5cd3036887b824f07b531a204a2fdacc6d9e7a65"

patches:
  - patch_file: "patches/0001-test-highlight-respect-contentaction-actions-env.patch"
    patch_description: "tests/test-highlight.sh：CONTENTACTION_ACTIONS 允许执行环境注入（OHOS 无 /usr/share/contentaction 系统目录，测试部署区由测试床提供）；断言与用例逻辑零改动"
    patch_type: "portability"
  - patch_file: "patches/0002-tests-cltool-printio-bytes-str-rstrip.patch"
    patch_description: "tests/cltool.py:200：上游 Py2->Py3 遗留缺陷——io 日志存的是 bytes，却用 str 调 rstrip(\"\\r\\n\") 触发 TypeError；只在打印失败详情时抛出，从而把真实断言错误替换成 TypeError。归一化为 str 后再 strip；断言与用例逻辑零改动"
    patch_type: "portability"
