# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "config.guess/config.sub 2013版不识别 HarmonyOS，需替换为 automake 1.17 (2023) 版本"
- "HMDFS 文件系统下 umask 077 创建的 0700 目录无法写入，需改为 umask 022"
- "Conan 2.x basic_layout 下 build() 工作目录非源码目录，需用 os.path.join(self.source_folder, path)"
- "rgamble/libcsv 无 tag/release，使用 master 分支，版本号在 configure.ac 中确认为 3.0.3"

