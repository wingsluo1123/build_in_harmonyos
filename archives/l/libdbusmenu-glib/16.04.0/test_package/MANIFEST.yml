package: libdbusmenu-glib/16.04.0
homepage: https://launchpad.net/libdbusmenu
upstream_check_command: "Original tests/Makefile.am eight GLib TESTS entries"
upstream_test_in_build: true
upstream_test_command: "Conan package(): build-support/upstream_glib.py original-glib-tests.json"
upstream_tests:
  - test-glib-objects-test
  - test-glib-events
  - test-glib-events-nogroup
  - test-glib-layout
  - test-glib-properties
  - test-glib-proxy
  - test-glib-simple-items
  - test-glib-submenu
test_package_tests:
  - file: main.c
    command: dbusmenu_smoke
    description: "Six installed object API cases including child-find traversal and removal"
harmony_specific_tests:
  - file: harmony_tests/native_state.c
    command: dbusmenu_harmony
assertion_count: 6
