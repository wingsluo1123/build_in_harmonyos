package: libdispatch/6.4.1
homepage: https://github.com/swiftlang/swift-corelibs-libdispatch
upstream_check_command: ctest --show-only=json-v1
upstream_test_in_build: true
upstream_test_command: ctest --output-on-failure --no-tests=error --parallel 1 --output-junit upstream-junit.xml
upstream_test_count: 37
upstream_test_scope: full native extended C/C++ suite; Swift overlay off; Apple-only tests not registered
performance_mode: upstream LENIENT_DEADLINES CI mode; strict latency failure disclosed
