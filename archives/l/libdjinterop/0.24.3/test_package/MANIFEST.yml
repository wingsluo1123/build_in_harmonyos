# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdjinterop/0.24.3
homepage: "https://github.com/xsco/libdjinterop"

# libdjinterop 上游测试依赖外部环境，本打包未在 build() 中集成
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序在本打包中运行
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "链接 libdjinterop 并调用 djinterop::version() 验证库可正常消费"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
