# 软件级 manifest
# 文件位置: archives/l/libdmapsharing/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: libdmapsharing
display: "libdmapsharing"
description: "DMAP (DAAP/DPAP/DACP) 协议库 — 访问/共享/控制 iTunes 类媒体库，含 AirPlay 探测"
category: network
homepage: "https://www.flyn.org/projects/libdmapsharing/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 构建（release 自带生成的 configure），+libsoup3 +avahi mDNS DNS-SD 核心依赖"
    - "全链路共享 glib/2.84.0.1.1（shared）保持单一 GObject 类型系统（libsoup3-r3/libgepub 先例）"
    - "avahi-glib 单合并 cpp_info 只产 avahi-glib.pc，libdmapsharing configure 需 avahi-client>=0.6，配方手写 avahi-client.pc shim"
    - "上游 6 套 Check 单元测试（45 用例，libdmapsharing/ 内 START_TEST 内联）经 tests/unit-test 汇总运行"
    - "HMFS：configure mktemp umask 077 补丁、install 批量头 shim、glib-mkenums python launcher（avahi-glib/avahi 同款）"
  common_dependencies:
    - glib/2.84.0.1.1
    - libsoup3/3.6.5-r3
    - avahi-glib/0.9_rc5
    - check/0.11.0

versions:
  "3.9.14":
    status: built
    build_date: "2026-09-25"
    conan_ref: "libdmapsharing/3.9.14@ohpcd/stable"
