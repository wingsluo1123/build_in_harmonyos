# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenSSL3 迁移 c2i→d2i：ASN1_get_object 成功时返回 0x00（非头长/总长），指针回退须记录 tlv_start 并传 (string-tlv_start)+len，禁用返回值/string-j 回退"
  - "OpenSSL3 栈上 EVP_MD_CTX 悬垂：est_client_X509_REQ_sign 栈分配 + EVP_MD_CTX_init 经 X509_REQ_sign_ctx 引用后函数返回即悬垂，X509_REQ_free bad-free；须 EVP_MD_CTX_new/free 堆分配"
  - "OpenSSL 3.x 默认 SECLEVEL=2 过滤 TLS1.0/1.1 套件（no protocols available），版本语义测试须客户端/服务端 SECLEVEL=0 + DEFAULT@SECLEVEL=0 并 min-pin TLS1.1"
  - "US893 RA PoP 校验：代理证书须含 CMC Registration Authority EKU，否则服务器侧不识别 RA、PoP 跳过分失效"
  - "EST CA default_md 须 sha256（OpenSSL 3.x 拒绝 sha1 CA md too weak），US748/US898 证书/密钥按此重签"
  - "received-cacerts 缓冲区无 NUL 终止，printf 输出须 %.*s 长度限定防越界读"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

