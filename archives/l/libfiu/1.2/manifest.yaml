  - "shebang-only sh compliance for the POSIX test script (HMBS platform diagnosis shell_getcwd: stop hardcoding hnp bash where avoidable; test-basic_run.sh audited fully POSIX so #!/bin/sh is semantics-preserving and fail-closed, killing the script's own init noise; fiu-run keeps bash stock-getopts and fiu-ctrl/fiu-ls keep bash declare-a as documented necessities with unasserted stderr; CONFIG_SHELL=/bin/sh added to make env; FIXLEVEL=46 (shtest46))"
  - "absolute $0 invocation flakes while relative is stable on this device (FIXLEVEL=48 ABSREL rel=1,1 abs=0,1): suite utils run-% reverted to upstream relative ./$< (HMBS_REL_INVOKE49), probe kept as falsification slot; FIXLEVEL=49 (relinvoke49)"
