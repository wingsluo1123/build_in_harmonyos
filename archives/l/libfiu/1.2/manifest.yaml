version: "1.2"
software: "libfiu"
status: built
build_date: "2026-09-17"
build_system: "makefile"

source:
  url: "https://blitiri.com.ar/p/libfiu/files/1.2/libfiu-1.2.tar.gz"
  sha256: "353ab3b50709cdd91522d7e4bb7ff800b27a97f72b989e22ce426c6de2669674"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -j1 CC=<conan-conf> AR=<conan-conf> RANLIB=<conan-conf> all"
    - "make -j1 test (upstream suite, evidence in upstream_tests.log)"
    - "make PREFIX=<package_folder> install (PREFIX is the final prefix, no DESTDIR)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-ohos-no-ldd-symlink-libs.patch"

knowledge_gained:
  - "纯 Makefile 项目：编译器必须经 make 命令行传入（R33），不可依赖 shell 环境"
  - "该项目 PREFIX 即最终安装前缀，与 zlib 式 DESTDIR 语义不同"
  - "上游测试共 28 个单元（C 5 + Python 9 + generated 11 + utils 2 + collisions 1），入口 make test"
  - "musl 无 glibc 专有的 dladdr1/RTLD_DL_SYMENT：libfiu/Makefile 的编译探测会自动切 DUMMY_BACKTRACE，需在源码层 #ifdef 保护才能让栈测试真实运行"
  - "真机文件系统不支持硬链接：tests 的 ln -f  staging 必须改为 cp -f（ln -sf 相对路径会产生悬空链接）"
  - "OHOS musl 缺 backtrace()（仅编译探测是假阳性）：必须编译并运行探针做运行时验证，失败时经命令行 USE_DUMMY_BACKTRACE=-DDUMMY_BACKTRACE 覆盖，栈测试诚实跳过"
  - "LD_PRELOAD 段错误先做单模块分裂隔离：run-only 通过而 posix-only 139 即锁定 posix 装载期构造器；posix 约 100 个 eager dlsym(RTLD_NEXT) 构造器在 OHOS 装载器下死亡，需重定义 mkwrap_init 只去构造器属性、保留解析函数体转首调 lazy（上游自带回退，语义一致；整函数删除会导致装载期 relocation 127）"
  - "posix _fiu_init_final(250) 的 eager fiu_init 会经未解析的 malloc 包装重入 dlsym 致装载期崩溃：只保留 gettimeofday/srandom 种子，把 fiu_init 留给测试二进制与 run 模块（fiu_fail 在 init 前安全返回 0，上游 fiu.c 已保证）"
  - "musl 下 LD_PRELOAD 的 malloc/calloc/realloc 包装必须池化处理 dlsym 重入：在 bootstrap 窗口以进程级 BSS 保存源函数、静态池服务重入分配，保持 libc/mm/* 失败点与 NULL+ENOMEM 语义不变（fiu_fail 仅正常路径查询）"
  - "RTLD_NEXT 在 OHOS 加载器下可能永不解析：libc_symbol 先试 RTLD_NEXT（glibc 行为不变），NULL 则回退到 dlopen(LIBC_SONAME)+NULL 句柄，全部失败才带 dlerror 退出（HMBS_LIBC_HANDLE）"
  - "musl LD_PRELOAD TLS not ready during process init: every posix wrapper touches __thread state on entry, first intercepted call before main segfaults; dlopen-after-startup OK vs LD_PRELOAD crash is the tell. Fix is process-global storage (HMBS_NO_TLS), preloaded test paths are single-threaded"
  - "fiu remote-control needs real fifos: mkfifo EPERM in injected TMPDIR is environmental (no preload wraps mkfifo/mknod); probe mkfifo per candidate dir and run make test with TMPDIR pointed at a fifo-capable fiu-fifo-tmp subdir, test-scoped only"
  - "fifo probe evidence must survive truncation: flush HMBS_DIAG_FIFO_* into hmbs-diag-digest.txt (HMBS_DIAG_DIGEST channel); add /dev/shm tmpfs as fallback candidate, all-denied means the mkfifo syscall itself is blocked (fifotmp2)"
  - "recipe-context mkfifo cannot predict the preloaded child: compile a C mkfifo prober and run the {injected,build,shm} x {plain,run-preload-only} matrix from tests/ cwd (exact test-fiu_ctrl.py:32 first-failure context), digest-persisted as HMBS_DIAG_FIFO_CHILD_*; stale-EEXIST retry in dir probe; FIXLEVEL=8 (fifochild)"
  - "no directory serves fifos to sandboxed children (shm EACCES, injected EPERM): run the identical 28 targets with make -k -j1 test so non-fifo units produce real evidence; per-unit failed mapping from make Error lines (collisions tests->./binary at makelevel 2 only); passed=started-failed-NOTE for real, gate unchanged; FIXLEVEL=9 (keepgoing)"
  - "make -k isolated exactly the fifo-suspect trio (23 pass/3 fail/2 skip) but utils pair needs sharper causes: run.sh Error 126 (exec-EACCES, siblings exec fine) and all utils shell tooling shebangs bash (declare -a in fiu-ctrl/fiu-ls, presence unproven); probe 1b captures script modes, bash presence and utils output tails into digest; FIXLEVEL=10 (utilsdiag)"
  - "device bash lives outside /bin (no /bin/bash, realpath alias-only): rewrite utils shebangs to detected device bash absolute path (bash semantics kept, declare -a needs bash not sh), wrap BASE realpath/readlink/cd-pwd fallback chain, chmod +x; FIXLEVEL=11 (bashwrap)"
  - "recipe-context mkfifo cannot authorize the test TMPDIR: pre-stage tests/libs before probing so run cells run in the exact NICE_RUN context, override follows child plain cells (build>tests>shm, injected needs none), digest carries CHILD_DECISION + fuller utils outputs + fifo-file existence; FIXLEVEL=12 (childdecision)"
  - "external cat escapes posix/io/oc/open while generated-open passes (1.2 has zero openat references tree-wide: static-link or openat path): {device-cat,tcat-open,tcat-openat}x{injected,control} matrix in exact NICE_RUN env, evidence-gated test-scoped dynamic cat shadow on PATH (deterministic error wording); FIXLEVEL=13 (injectshadow)"
  - "EPERM-vs-EACCES split implies path-policy not syscall-block: child matrix widens to XDG_RUNTIME_DIR, /run/user/euid, HOME, /var/tmp with xdg>runuser>home>shm>vartmp>build>tests priority; fifo flow uses absolute paths so no 108-char limit applies; FIXLEVEL=14 (wideruntime)"
  - "unshare user+mount namespace grants CAP_MKNOD for real kernel fifos where the sandbox denies mknod family on every path (EPERM vs EACCES are per-filesystem spellings of one denial): probe unshare variants with the C mkfifo prober, wrap only the identical make test on prober-ok, otherwise honest fail; FIXLEVEL=15 (unshare)"
  - "fresh tmpfs mounted inside a new mount+user ns is owned by our userns, so unprivileged mkfifo is allowed unless seccomp blocks the mknod family: probe with the C prober via unshare -Urm sh -c mount/prober/umount, compound-wrap only the identical make test on prober-ok (inner TMPDIR points at the mount), otherwise honest fail; FIXLEVEL=16 (nstmpfs)"
  - "gap disposition over mechanism retry: after 7-dir search, same-dir userns and ns-tmpfs compound all deny per-layer, emit one HMBS_DIAG_PLATFORM_GAPS line mapping fifo-subset failures (gated on fifo_hints) vs other_failed vs backtrace NOTE-skips for the honest-abandonment record; marker/verdict/tests untouched; FIXLEVEL=17 (gapreport)"
  - "utils getcwd noise plus bare fractional sleep break the file-poll waits: wrap gains a build-time absolute BASE fallback when parent traversal fails, fiu-ctrl waits use sleep 0.05 || sleep 1 with guarded wc prev parse (fresh and already-patched trees, idempotent); same transport, no test/assertion/verdict touch; FIXLEVEL=24 (sleepwrap-absbase)"
