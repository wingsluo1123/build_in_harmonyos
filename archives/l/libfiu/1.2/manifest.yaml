  - "deprecated-option minimal translation plus -e dry-run evidence (part 29 moved suite: -c injects and direct_shadow=rc1, but -e exits 0; both reach fiu_enable(name,1,NULL,0) per parser defaults so only wire bytes differ: emit canonical minimal form byte-identical to proven -c when defaults apply in fiu-run.in and generated fiu-run, non-defaults still appended; chain probe dry-runs -e variant and tolerates bare LD_PRELOAD in -n output; no test/assertion/verdict touch; FIXLEVEL=30 (deprecmin)"
  - "probability-1 normalization plus per-line attribution (part 30 moved suite 23->24 with e_enable present but death line invisible in truncated summary: line 5 (-e minimal) byte-identical to proven line-4 (-c) path, so remaining break is line 6 (-e -p 1 -> enable_random probability=1); normalize integer DEP_PROB>=1 to canonical plain enable in fiu-run.in and generated fiu-run, fresh and stale trees converge; new basicrun probe runs the 6 exact script lines via wrap condensing rc plus apply-error flags to one tail-visible BASICRUN line; no test/assertion/verdict touch; FIXLEVEL=31 (prob1norm-linerun)"
  - "chain byte-diff measurement over a 4th shell-text normalization (5th strategy cycle: FIXLEVEL=31 BASICRUN falsified the translation conclusion itself, L4=rc0/L5=rc1/L6=rc0 with L4 touching no deprecated code, so outcome is not a function of enable bytes: chain probe additionally dry-runs -e -p 1, captures exact L4/L5/L6 enable bytes with one shared regex plus bytes-same flag, and records markers on the wrap-resolved generated fiu-run; diagnosis only, verdict untouched; FIXLEVEL=32 (bytediff)"
  - "wrap-vs-frozen stability split over byte re-measurement (same fingerprint 2nd fix: FIXLEVEL=32 moved suite 23->24 with zero product change while probe regressed L5 rc1->rc0 on identical inputs, proving environmental instability not byte causation: run each of L4/L5/L6 twice via shell chain and twice via frozen colon env with FIU_ENABLE bytes from dry-run logs or flagged fallback, condensed to tail-visible STABLE_SUMMARY beside marker; diagnosis only, verdict untouched; FIXLEVEL=33 (stablesplit)"
