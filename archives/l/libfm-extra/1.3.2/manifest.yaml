software: libfm-extra
build_system: autotools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://deb.debian.org/debian/pool/main/libf/libfm/libfm_1.3.2.orig.tar.xz"

  # 源码校验和
