# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfm-extra/1.3.2
homepage: "https://github.com/lxde/libfm"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libfm-extra 上游没有独立的测试程序，make check 运行的是 check-local（空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 fm_xml_file_new/set_handler/item_new/set_attribute/append_text/insert_first/parse_data 等 API 验证库功能"
    command: "./test_libfm-extra"

# 测试断言总数
assertion_count: 10
