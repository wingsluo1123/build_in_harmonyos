version: '2.3.3'
status: built
build_date: '2026-08-05'

source:
  url: 'https://github.com/libgd/libgd/archive/refs/tags/gd-2.3.3.tar.gz'
  sha256: '24429f9d0dbe0f865aaa4b1a63558242396ba9134e6cfd32ca5e486a84483350'
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - '-DENABLE_PNG=ON'
    - '-DENABLE_JPEG=ON'
    - '-DENABLE_FREETYPE=ON'
    - '-DENABLE_GD_FORMATS=ON'
    - '-DENABLE_CPP=OFF'
    - '-DBUILD_SHARED_LIBS=ON'
  dependencies:
    - 'libpng/1.6.58'
    - 'libjpeg/10'
    - 'freetype/2.14.3'
    - 'zlib/1.3.1.1'
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - 'libgd CMakeLists.txt uses CMake built-in find modules (FindPNG/FindJPEG/FindFreetype/FindZLIB); set cache_variables (ZLIB_LIBRARY, PNG_LIBRARY, JPEG_LIBRARY, FREETYPE_LIBRARY, etc.) to bypass search'
  - 'zlib must be 1.3.1.1 not 1.3.1 to satisfy libpng/1.6.58 dependency'
  - 'OHOS: CMAKE_SYSTEM_NAME=HarmonyOS produces "System is unknown to cmake" warnings but configure succeeds'
  - 'OHOS: CMakeUserMakeRulesOverride provides -Wl,-soname flag for shared lib (libgd.so.3 -> libgd.so)'
  - 'LDFLAGS -L/-rpath-link needed for shared deps so linker finds libpng16.so and libfreetype.so at link time'
  - 'Library output: libgd.so (SONAME libgd.so.3), headers in include/ (gd.h + 11 others), pkgconfig gdlib.pc'
