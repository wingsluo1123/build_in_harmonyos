# test_package/MANIFEST.yml -- upstream test declaration (CI L0e)
package: libgd/2.3.3
homepage: "https://libgd.github.io/"

# libgd ships a test/ suite but it requires Perl + CMake test infrastructure.
# For the OHOS Conan package, we verify via the consumer dlopen test below.
upstream_test_in_build: false
upstream_tests: []

# test_package self-contained test (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Compile #include <gd.h> + dlopen libgd.so + call gdImageCreate/gdImageDestroy"
    command: "./test_probe"

assertion_count: 3
