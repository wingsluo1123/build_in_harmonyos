# conandata.yml — libgdm 50.1
# Source: official GNOME gdm release tarball (R39) from download.gnome.org,
# with the NJU authoritative mirror as fallback. sha256 verified locally
# against the official 50.1 release tarball (2026-10-03).
sources:
  url:
    - "https://mirror.nju.edu.cn/gnome/sources/gdm/50/gdm-50.1.tar.xz"
    - "https://download.gnome.org/sources/gdm/50/gdm-50.1.tar.xz"
  sha256: "770159373512192410f412b5d0c4678ec1573f1ae4b39c81fe75861fe8890174"

patches:
  - patch_file: "patches/0001-introspection-meson-option.patch"
    patch_description: "meson_options.txt: add introspection feature option (default disabled) for OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-gir-conditional.patch"
    patch_description: "libgdm/meson.build: gate gnome.generate_gir behind the introspection option (no g-ir-scanner on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0003-lckpwdf-compat-source.patch"
    patch_description: "daemon/meson.build: add gdm-lckpwdf-compat.c to the gdm daemon sources"
    patch_type: "portability"
  - patch_file: "patches/0004-gdm-lckpwdf-compat.c.patch"
    patch_description: "daemon/gdm-lckpwdf-compat.c: flock(2)-based lckpwdf/ulckpwdf for OHOS musl (libcrypt.a is empty)"
    patch_type: "portability"
  - patch_file: "patches/0005-docs-itstool-optional.patch"
    patch_description: "docs/meson.build: build gnome.yelp help pages only when itstool is available (non-essential for libgdm)"
    patch_type: "portability"
