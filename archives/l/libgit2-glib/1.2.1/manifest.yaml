software: libgit2-glib
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.2.1"
status: built
build_date: "2026-08-10"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gitlab.gnome.org/GNOME/libgit2-glib/-/archive/1.2.1/libgit2-glib-1.2.1.tar.gz"
  sha256: "06c5085186057543d719acc6cf686eb87189a35ae561bbfc7023344cd64ae6dd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dintrospection=false"
    - "-Dpython=false"
    - "-Dvapi=false"
    - "-Dssh=false"
    - "-Dgtk_doc=false"
  dependencies:
    - "glib/2.84.0"
    - "libgit2/1.9.0"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libgit2-glib uses meson build system (not autotools)"
  - "Requires libgit2 and glib (glib-2.0, gobject-2.0, gio-2.0) as dependencies"
  - "gnome.mkenums_simple requires glib_mkenums pkg-config variable from glib"
  - "conan-generated glib pkg-config files need tool variables (glib_mkenums etc.) added manually"
  - "libgit2 must be built as static to avoid PIC relocation errors with conan zlib"
  - "Tests abort with G_DISABLE_ASSERT in release buildtype (expected GNOME behavior)"
