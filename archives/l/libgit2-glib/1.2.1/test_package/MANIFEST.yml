# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libgit2-glib/1.2.1
homepage: "https://gitlab.gnome.org/GNOME/libgit2-glib"

# 上游测试命令
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/repository.c
    source: libgit2-glib-1.2.1/tests/repository.c
    description: "Repository operations test (create, open, commit, etc.)"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: initializes libgit2-glib and verifies version"
    command: "./test_libgit2_glib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
