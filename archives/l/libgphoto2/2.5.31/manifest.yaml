  - "0002-auto-aux-config.sub.patch"
  - "0003-auto-m4-pkg.m4.patch"
  - "0004-auto-m4-gettext-macros.patch"
  - "0005-auto-aux-config.rpath.patch"
  - "0006-po-Makefile.in.in.patch"
  - "0007-libgphoto2_port-po-Makefile.in.in.patch"

knowledge_gained:
  - "E007: config.guess/config.sub needs OpenHarmony patches for aarch64-unknown-linux-ohos triplet"
  - "autoreconf needs explicit -I flags for auto-m4 and gphoto-m4 directories, plus pkg.m4 from pkg-config"
  - "libltdl must be built separately from libtool source before libgphoto2 can configure"
  - "USB IOLib disabled due to OpenHarmony libusb1 API differences"
  - "NLS disabled to avoid gettext build complexity on OpenHarmony"
  - "Source from git archive does not include configure - must run autoreconf -fi"
  - "autopoint not available on OHOS - gettext m4 macros included as patches"
  - "configure umask 077→022 and ./confXXXXXX→${HOME}/tmp/confXXXXXX fix (same as libexif)"

