# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: libgphoto2/2.5.31
homepage: "https://github.com/gphoto/libgphoto2"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests: []

# Test package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Consumer test: calls gp_library_version, gp_context_new, gp_camera_new, gp_camera_free"
    command: "./test_libgphoto2"

# Approximate assertion count
assertion_count: 4
