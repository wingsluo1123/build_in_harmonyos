# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: libgpiod/2.0
homepage: "https://git.kernel.org/pub/scm/libs/libgpiod/"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from tests/ directory)
upstream_tests:
  - file: tests/gpioset/gpioset-test.c
    source: libgpiod-2.0/tests/gpioset/gpioset-test.c
    description: "gpioset interactive mode test (requires GPIO hardware)"
    command: "./gpioset-test"
  - file: tests/gpiomon/gpiomon-test.c
    source: libgpiod-2.0/tests/gpiomon/gpiomon-test.c
    description: "gpiomon event monitoring test (requires GPIO hardware)"
    command: "./gpiomon-test"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.c
    description: "Verify gpiod_api_version() returns valid version string"
    command: "./test_libgpiod"

# Approximate assertion count for quality assessment
assertion_count: 3
