package: libgsasl/2.2.4
homepage: "https://www.gnu.org/software/gsasl/"
upstream_check_command: "make -C tests -j1 check"
upstream_test_in_build: false
upstream_test_command: "TMPDIR=<writable private directory> make -C <build>/tests -j1 check"
upstream_tests:
  - source: "GNU SASL 2.2.4 tests/"
    description: "Full upstream suite in private a761: 32 total, 26 pass, 6 skip, 0 fail; this suite is not run by the Conan build method"
    command: "make -C tests -j1 check"
test_package_tests:
  - file: test_libgsasl.c
    description: "Compile and link against installed libgsasl; verify PLAIN client response bytes"
    command: "./test_libgsasl"