package: libgtp/1.13.0
homepage: "https://gitea.osmocom.org/cellular-infrastructure/osmo-ggsn"

upstream_check_command: "tests/lib/ippool_test tests/lib/in46a_test tests/gtp/gtpie_test tests/gtp/queue_test"
upstream_test_in_build: false
upstream_test_command: "compile and run gtp tests"
upstream_tests:
  - tests/lib/ippool_test.c
  - tests/lib/in46a_test.c
  - tests/gtp/gtpie_test.c
  - tests/gtp/queue_test.c

test_package_tests:
  - file: test_libgtp.c
    description: "GTP IE TLV 与 32 位 TV 编码、长度、type、value 和网络字节序断言"
    command: "clang test_libgtp.c -fno-emulated-tls -I<install>/include -L<install>/lib -lgtp <libosmocore flags>"

assertion_count: 6
