version: "4.6.0"
status: pending_ci
build_date: "2026-09-30"
conan_ref: "libgweather-4/4.6.0"

source:
  url: "https://download.gnome.org/sources/libgweather/4.6/libgweather-4.6.0.tar.xz"
  sha256: "7f5d0e8c9685ef2ff46c2f3a57cae48d7bf3540b2d83921f889ef28e6a876788"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dintrospection=false"
    - "-Dgtk_doc=false"
    - "-Denable_vala=false"
    - "-Dtests=true"
    - "-Dzoneinfo_dir=/system/etc/zoneinfo"
  dependencies:
    - glib/2.84.0.1.1
    - json-glib/1.10.6
    - libsoup3/3.6.5-r3
    - zlib/1.3.1.1
    - libxml2/2.15.3.1
    - geocode-glib/3.26.4
    - gweather-locations/2026.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-musl-bindtextdomain-decl.patch"

test_results:
  type: local_recipe_check
  upstream: "upstream registers 4 TAP tests (test_libgweather/duplicates/timezones/metar); the conan build host is the OHOS armv8 device itself, so the recipe runs all 4 freshly built test binaries natively after the meson build with upstream's environment (LIBGWEATHER_LOCATIONS_PATH -> Locations.bin, SCHEMASDIR/SCHEMAS_BUILDDIR, GSETTINGS_BACKED=memory, GIO_USE_VFS=local, LIBGWEATHER_LOCATIONS_NO_NEAREST=1 for duplicates, TZDIR -> extracted TZif tree). Device run: test_libgweather 7/7 ok (1 SKIP: fr_FR locale unavailable), duplicates 2/2 ok, timezones 3/3 ok, metar 1/1 ok"
  test_package: "consumer test builds against gweather4 (CMakeDeps) and runs on the OHOS host: version macros, world DB load, nearest-city (Eiffel Tower -> Paris), timezone resolution, local sun computation with providers disabled, serialize/deserialize round-trip"
  full_reference: "pending CI"

knowledge_gained:
  - "libgweather 4.6.0 splits the locations database out to the GNOME data module gweather-locations (calendar-versioned); meson hard-requires dependency('gweather-locations') and bakes GWEATHER_LOCATIONS_DB from its pkg-config `locations_db` variable (default prefix/libdir/gweather-locations/Locations.bin)."
  - "gweather-locations' Locations.bin generator (build-aux/gen_locations_variant.py) imports gi.repository.GLib (PyGObject) only to build GLib.Variant values; a pure-python `gi` shim implementing GVariant serialisation (little-endian, nested Variant embedding, dict entries) satisfies both the meson find_installation(modules:['gi']) probe and the generator on hosts without PyGObject."
  - "Conan's PkgConfigDeps drops custom pkg-config variables when regenerating dependency .pc files — gweather-locations.pc's locations_db/locations_xml/locations_dtd must be re-appended by the consumer recipe (same patch-in-place pattern as glib tool variables)."
  - "ZONEINFO_DIR (meson option zoneinfo_dir) is not referenced by 4.6.0 runtime code; the option is still set to the real OHOS tzdata path /system/etc/zoneinfo for correctness."
  - "libgweather installs its enums-generated GSettings schema to share/glib-2.0/schemas and gnome.post_install compiles gschemas.compiled at install time (glib-compile-schemas must be on PATH during meson install)."
  - "GLib resolves GTimeZone ids from individual TZif files under TZDIR; the OHOS image ships neither /usr/share/zoneinfo nor GLib-parseable tzdata — only the Android-style single-file blob /system/etc/zoneinfo/tzdata ('tzdata' magic, BE u32 index/data/final offsets, 48-byte index entries: 40B name + 4B offset + 4B length, payload = raw TZif). gweather-locations 2026.2 data references three ids the blob lacks: Antarctica/South_Pole and Pacific/Johnston are tzdb backward links/merges (restored by copying McMurdo/Honolulu), UTC is a GLib builtin. Without the tree, g_time_zone_new_identifier returns NULL and the upstream timezones test fails at 'United States Minor Outlying Islands does not have an associated timezone'."
