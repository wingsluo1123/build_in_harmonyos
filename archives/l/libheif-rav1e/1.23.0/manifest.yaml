# 必须字段
# ============================================================

version: "1.23.0"
conan_ref: "libheif-rav1e/1.23.0"

# published | built | failed | archived
# O5：只有 release upload 已确认才可标 published，此前一律 built。
status: built

build_date: "2026-09-28"

# 构建系统类型（verify-build 要求的顶层字段）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 父 tarball（本包是其中树内子模块：CMake 目标 heif-rav1e）
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"
  tar_format: tar.gz
  # 包内树构建的编码器（**不是** Conan 依赖；制品仓无 rav1e 包，见 notes.md「W0 依赖判定」）
  bundled_dependency:
    name: rav1e
    version: "0.7.1"
    url:
      - "https://github.com/xiph/rav1e/archive/refs/tags/v0.7.1.tar.gz"
      - "https://codeload.github.com/xiph/rav1e/tar.gz/refs/tags/v0.7.1"
    sha256: "da7ae0df2b608e539de5d443c096e109442cdfa6c5e9b4014361211cf61d030c"
    tar_format: tar.gz
    build_system: cargo                       # Rust（OHOS rust-toolchain/1.97.1）
    produced_artifacts:
      - "librav1e.a（cargo rustc --crate-type staticlib --features capi,asm,threading）"
      - "rav1e.h（cbindgen --config cbindgen.toml --crate rav1e）"
    link_mode: static                         # 静态链入 heif-rav1e 插件模块

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # cmake 选项（与 conanfile.py generate() 一致；由 CMakeToolchain 下发的 -D 变量）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"              # 插件 dlopen 语义要求宿主为共享库
    - "-DENABLE_PLUGIN_LOADING=ON"          # 交付面必要条件：插件模块形态
    - "-DWITH_RAV1E=ON"                     # 交付面：rav1e AV1 编码后端
    - "-DWITH_RAV1E_PLUGIN=ON"              # 交付面：以独立插件模块构建（→ libheif-rav1e.so）
    - "-DWITH_LIBDE265=OFF"
    - "-DWITH_X265=OFF"
    - "-DWITH_X264=OFF"
    - "-DWITH_AOM_DECODER=OFF"
    - "-DWITH_AOM_ENCODER=OFF"
    - "-DWITH_DAV1D=OFF"
    - "-DWITH_KVAZAAR=OFF"
    - "-DWITH_UVG266=OFF"
    - "-DWITH_VVDEC=OFF"
    - "-DWITH_VVENC=OFF"
    - "-DWITH_FFMPEG_DECODER=OFF"
    - "-DWITH_OpenH264_DECODER=OFF"
    - "-DWITH_SvtEnc=OFF"
    - "-DWITH_JPEG_DECODER=OFF"
    - "-DWITH_JPEG_ENCODER=OFF"
    - "-DWITH_OpenJPEG_DECODER=OFF"
    - "-DWITH_OpenJPEG_ENCODER=OFF"
    - "-DWITH_OPENJPH_ENCODER=OFF"
    - "-DWITH_LIBSHARPYUV=OFF"
    - "-DWITH_UNCOMPRESSED_CODEC=OFF"
    - "-DWITH_WEBCODECS=OFF"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_GDK_PIXBUF=OFF"
    - "-DBUILD_TESTING=OFF"                 # 交付构建不编上游测试；上游测试在独立目录 <build>/upstream-tests 里 BUILD_TESTING=ON 编译并真跑（notes.md 6.2）
    - "-DBUILD_DOCUMENTATION=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"           # 设备 uname -s=HarmonyOS 而 SDK 无 Platform/HarmonyOS.cmake → 必须显式走 Linux 平台分支，否则共享库不带 SONAME、插件 DT_NEEDED 写进构建期路径
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON" # install 不得就地改写 RUNPATH（否则破坏 ELF 签名 → dlopen EACCES）
    - "-DCMAKE_INSTALL_RPATH="
    - "-DRAV1E_INCLUDE_DIR=<build>/rav1e-build"                                     # generate() 钉路径（FindRAV1E.cmake 是 MODULE 模式）
    - "-DRAV1E_LIBRARY=<build>/rav1e-build/target/aarch64-unknown-linux-ohos/release/librav1e.a"
    - "-DBUILD_SHARED_LIBS=ON"              # 兼容探针留取

  # 编译工具依赖（tool_requires，格式 name/version；均已验证发布制品仓）
  tool_requires:
    - "rust-toolchain/1.97.1"
    - "cbindgen/0.28.0"
    - "openssl/3.5.6.1.1"

  # 运行时 Conan 依赖列表（空：rav1e 在包内树构建并静态链入插件，无未发布依赖）
  dependencies: []

  cc: clang
  cxx: clang++

