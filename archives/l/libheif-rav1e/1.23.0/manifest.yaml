# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "「编解码插件子包」立项第一步是判依赖边界：先看上游是否 find_package/pkg_check_modules 该后端、再看树内有没有它的源码副本、最后用真实 conan download --only-recipe 探针确认制品仓有没有对应包——三者缺一都会把结论带偏（本包：find_package(RAV1E) + 树内只有 FindRAV1E.cmake/encoder_rav1e.cc + 制品仓 rav1e/librav1e/rust-rav1e 全无 → 只能内树构建）"   # knowledge_ref: E345
  - "R36 依赖门禁是机械的（finish step[5/10] 与 CI L0i 对每个 requires()/tool_requires 跑 conan download --only-recipe），所以「依赖没发布」不能靠写进 notes 绕过：要么先发布依赖，要么让包自包含（内树构建）。自包含在本仓库有已合并先例 libheif-svtenc/libheif-aom/handbrake-1.11.2"   # knowledge_ref: E524
  - "OHOS 上 CMAKE_SYSTEM_NAME 必须显式置 Linux：设备 uname -s 报 HarmonyOS，而 SDK 的 CMake 只有 Platform/OHOS.cmake，落「未知平台」回退会让 CMAKE_SHARED_LIBRARY_SONAME_* 未定义 → 共享库不带 SONAME → 插件 MODULE 把构建期相对路径写进 DT_NEEDED（含斜杠按 CWD 解析）→ 运行期 dlopen 必失败。conan 的 conan_toolchain.cmake 对该变量有 if(NOT DEFINED CMAKE_SYSTEM_NAME) 守卫，故用 tc.cache_variables 生效"   # knowledge_ref: E092
  - "设备 libc++（15.0.4）在未定义 _LIBCPP_ENABLE_EXPERIMENTAL 时通过 _LIBCPP_HAS_NO_INCOMPLETE_RANGES 隐藏 std::ranges::all_of/find；上游 C++20 代码（libheif/box.cc）直接调用即报 no member named all_of in namespace std::ranges。generate() 里 tc.preprocessor_definitions['_LIBCPP_ENABLE_EXPERIMENTAL']=None 即可（编译期宏，无需 -lc++experimental）"   # knowledge_ref: E191
  - "OHOS 上 cmake install 会就地改写 RUNPATH，破坏 clang launcher 写的 .note.ohos.ident 签名（同尺寸但字节变 → sha256 变）⇒ 运行期宿主 dlopen 报 Permission denied（EACCES，不是 not found）。处置：-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_INSTALL_RPATH=（构建期直接用空的安装 RPATH，不触发改写），package() 末尾再 binary-sign-tool 重签兜底"   # knowledge_ref: E207
  - "把 Rust staticlib 链进共享库（非可执行文件）需要 PIC：rust-rav1e 参考配方把 librav1e.a 链进可执行文件（无需 PIC），本包链进 MODULE 插件，故 RUSTFLAGS 追加 -C relocation-model=pic"   # knowledge_ref: E180
  - "OHOS sysroot 里 libpthread.a/libdl.a/libm.a 都是 8 字节空 stub，pthread/dl/math 符号都在 libc.so（musl 合并）；因此把 Rust staticlib 链进 C++ MODULE 时无需额外 -lpthread -ldl -lm，clang++ 默认链的 libc.so 即解析全部符号（llvm-nm -D libc.so 实测导出 pthread_create/dlopen/pow/sqrt/fmod）"   # knowledge_ref: E274
  - "上游 crate 从 GitHub tag 归档下载时，github.com/.../archive/... 实为 codeload.github.com 的重定向端点：网络抖动只会命中其中一个（本任务实测 github.com HTTP 000 而 codeload HTTP 200），conan get() 对 URL 无超时会让首个挂住的 URL 卡死整个 build —— 把官方 tarball 预置进 conan 下载缓存（core.sources:download_cache 的 s/<sha256>）即可让 get() 命中缓存不走网，conandata 仍声明官方 URL"   # knowledge_ref: E345
  - "上游测试要在适配配方里真跑，需三件事同时成立：①按上游自带的测试配置开开关（libheif 是 CMakePresets.json 的 testing preset：BUILD_TESTING=ON + REDUCED_VISIBILITY=OFF + UNCOMPRESSED_CODEC=ON + EXPERIMENTAL=ON）；②把测试 get_encoder_or_decoder_or_skip() 需要的编解码后端接进来——已发布的 Conan 包用 tool_requires 声明（只进 build 上下文，交付包 requires() 保持为空）；③把 CONFIG/MODULE 查找优先级改回 MODULE 优先（conan toolchain 默认 PREFER_CONFIG=ON，会让带 config 文件的后端绕过上游自带 Find<X>.cmake，须用 CMAKE_PROJECT_INCLUDE 覆盖）"   # knowledge_ref: E092
  - "libheif 上游用例在「BUILD_TESTING=OFF 的交付构建」与「testing preset 的测试构建」下可执行面差别巨大（ctest 可执行文件 13 → 38；用例级 34 → 212 可跑），且两种配置必须放进不同构建目录：testing preset 会改 WITH_REDUCED_VISIBILITY 等直接影响产物的开关，混在一起会把测试配置的开关带进交付产物"   # knowledge_ref: E345
