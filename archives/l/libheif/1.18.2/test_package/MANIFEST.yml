# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libheif/1.18.2
homepage: "https://github.com/strukturag/libheif"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: examples/heif_test.cc
    source: libheif-1.18.2/examples/heif_test.cc
    description: "上游 heif-test 工具，验证 HEIF 文件读写"
    command: "./heif-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 测试：调用 heif_get_version/heif_context_alloc/heif_context_get_primary_image_handle/heif_context_free 验证库可链接且 API 可调用"
    command: "./test_libheif"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
