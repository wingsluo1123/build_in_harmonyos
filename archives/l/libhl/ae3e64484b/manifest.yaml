# 编译中学到的知识
knowledge_gained:
  - "上游构建系统位于 build/ 子目录（预生成 configure），必须在 build/ 内启动 configure，srcdir 才能解析为仓库根（VPATH out-of-tree 布局）"
  - "build/configure 位于 EXCLUDE_DIRS(build) 内，refresh-patch 无法为其生成补丁，且 configure 被内容启发式判定为生成文件——此类修复走配方内 replace_in_file（先例 abook 0006-configure.patch）"
  - "HMDFS + toybox mktemp：umask 077 && mktemp -d 产生 2700 目录进程不可写；去掉 umask 077 后为 2751 可写（configure 临时目录修复依据）"
  - "上游手写 install 目标忽略 DESTDIR 且不建目标目录，配方用 copy() 直接打包 lib/ 与 include/"

