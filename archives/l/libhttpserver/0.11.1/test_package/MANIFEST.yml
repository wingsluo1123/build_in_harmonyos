package: libhttpserver/0.11.1
homepage: "https://github.com/etr/libhttpserver"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/Makefile.am check_PROGRAMS）
upstream_tests:
  - file: test/integ/basic.cpp
    source: libhttpserver-0.11.1/test/integ/basic.cpp
    description: "HTTP 基础集成测试（GET/DELETE/PUT/CONNECT/POST/header/body 等，9 用例 27 checks）"
    command: "./basic"
  - file: test/integ/threaded.cpp
    source: libhttpserver-0.11.1/test/integ/threaded.cpp
    description: "线程模式测试"
    command: "./threaded"
  - file: test/unit/http_utils_test.cpp
    source: libhttpserver-0.11.1/test/unit/http_utils_test.cpp
    description: "http_utils 单元测试"
    command: "./http_utils"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "嵌入式 HTTP 服务真实起停+GET 请求往返（create_webserver/register_resource/start/http_get/stop）"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
