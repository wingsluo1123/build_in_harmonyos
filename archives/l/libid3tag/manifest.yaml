software: libid3tag
display: "libid3tag"
description: "ID3 标签解析与操作库，支持读写 MP3 文件中的 ID3v1/ID3v2 元数据"
category: data
homepage: "https://download.savannah.nongnu.org/releases/libid3tag/"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 4.x 与 cmake_minimum_required(3.1) 不兼容，需添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "Savannah 镜像在 OHOS 环境不可达，需使用 Debian pool mirror (ftp.debian.org) 替代"
    - "G0 clean-verify 仅支持 autotools，CMake 项目需创建 hints/configure.sh wrapper"
    - "Conan 适配: zlib/1.3.1 通过 conan 依赖管理，CMakeDeps 生成 find_package(zlib) 和 zlib::zlib 目标"
    - "Conan 适配: 源码 CMakeLists.txt 使用 ZLIB::ZLIB (大写)，需在 build() 中替换为 zlib::zlib"
    - "Conan 适配: zlib 静态库需用 CFLAGS=-fPIC 重编译，否则无法链接进 libid3tag.so"
  common_dependencies:
    - zlib

versions:
  "0.16.3":
    status: published
    build_date: "2026-08-05"
    conan_recipe: "archives/l/libid3tag/0.16.3/conanfile.py"
    conan_package: "libid3tag/0.16.3#7ac35bd0c68fe214787bae90fd35ca82"
