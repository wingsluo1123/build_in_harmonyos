software: libini_config
version: "1.4.0"
conan_ref: "libini_config/1.4.0"
status: built
build_date: "2026-10-16"
build_system: autotools
source:
  url: "https://github.com/SSSD/ding-libs/releases/download/0.7.0/ding-libs-0.7.0.tar.gz"
  sha256: "5df2f202f892b4c1a6caf87f0056398a8288b281da9d7e65cd7637978ec20ef3"
  tar_format: tar.gz
  note: "任务版本 1.4.0 命名 ini_config 组件；源码采用 ding-libs 官方 0.7.0 release tarball（内含 ini_config 2.0.0），配方构建完整源码树并仅打包 ini_config 产物"
build:
  system: autotools
  configure_options: "--disable-nls --disable-dependency-tracking"
  dependencies: []
  build_dependencies:
    - "autoconf/2.72"
    - "automake/1.18"
    - "libtool/2.5.4"
  test_dependencies:
    - "check/0.15.2"
  cc: clang
  cxx: clang++
  profile: "ci/conan/profiles/ohos-aarch64"
patches_applied:
  - "0001-build-config.guess.patch"
  - "0002-build-config.sub.patch"
  - "0003-configure.ac.patch"
  - "0004-ini-ini_augment_ut.c.patch"
  - "0005-ini-ini_config_ut.c.patch"
  - "0006-ini-ini_configmod_ut_check.c.patch"
  - "0007-ini-ini_configobj.c.patch"
  - "0008-ini-ini_parse.c.patch"
  - "0009-ini-ini_parse_ut.c.patch"
  - "0010-ini-ini_print.c.patch"
  - "0011-ini-ini_save_ut.c.patch"
  - "0012-ini-ini_validators_ut_check.c.patch"
  - "0013-path_utils-path_utils.h.patch"
  - "0014-path_utils-path_utils_ut.c.patch"
knowledge_gained:
  - "config.guess/config.sub 需要识别本机 linux-ohos；配方不传 --build/--host/--target。"
  - "通过 configure.ac 源宏重生成 configure，使用 umask 027 兼容 HMDFS 临时目录；生成文件不进入补丁集。"
  - "Autotools bootstrap 使用 autoconf/2.72、automake/1.18、libtool/2.5.4 tool_requires；命令显式使用设备 Perl，并将 PERL5LIB 限定为 Automake 纯 Perl 模块。"
  - "通过 AutotoolsToolchain 注入 Check include 路径，避免修改生成的 Makefile.in；Check 0.15.2 在 OHOS 上使用 CK_FORK=no，并把 TEMP/TMP/TMPDIR 指向构建目录。"
  - "HMDFS 将测试文件权限归一化，相关上游断言采用可移植比较位处理，不引入 patches 平台宏。"
  - "OHOS 无 gettext 时以 ENABLE_NLS 判据使用恒等翻译宏，平台无关。"
  - "open_memstream 在 OHOS 上需要 fflush 后再 fclose 才能发布最终缓冲区大小。"
  - "OHOS regex 诊断文本由 libc 实现决定，测试验证语义而非固定诊断字符串。"
  - "本配方构建完整 ding-libs 源码树以运行全部 20 项上游测试，但 package() 移除 dhash 产物，仅交付 libini_config。"
patch_generation:
  method: "refresh-patch --auto"
  patches_count: 14
  generated_files_in_patch_set: false
  note: "补丁集沿用 ding-libs 0.7.0 已验证的 OHOS 适配（同源源码），未新增平台宏"
verification:
  upstream_tests: "待真机预检回填（目标 20/20，口径 autotools_tests，来源 Makefile.am TESTS）"
  test_package: "待真机预检回填（调用 ini_config 公共 API）"
  target: "HarmonyOS PC arm64, os=OHOS, arch=armv8, clang/LLVM 15"
