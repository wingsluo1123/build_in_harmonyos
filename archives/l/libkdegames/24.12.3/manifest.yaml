knowledge_gained:
  - "libkdegames 24.12.3 builds against Qt6 >= 6.5.0 and KF6 >= 6.0.0 and installs libKDEGames6/libKDEGames6Private with CMake package name KDEGames6 and imported targets KDEGames6 / KDEGames6Private."
  - "find_package(KF6 COMPONENTS ...) here needs Archive/ColorScheme/Completion/Config/ConfigWidgets/DNSSD/GuiAddons/IconThemes/I18n/NewStuff/XmlGui; the KF6 config files pull further requirements through find_dependency (KF6ConfigWidgets -> KF6WidgetsAddons, KF6NewStuffCore -> KF6Attica, KF6ConfigWidgets -> KF6ColorScheme), so the generated CMake prefix path must cover the whole dependency graph, not only the direct requires."
  - "The newest kiconthemes/6.18.0 recipe revision requires karchive/6.19.0 which conflicts with knewstuff/6.18.0 (karchive/6.18.0); self.requires('karchive/6.18.0', override=True) pins a single karchive for the whole graph and must be repeated in test_package/conanfile.py or a standalone `conan test` graph cannot resolve."
  - "A conan binary package whose folder holds only .so files and no conaninfo.txt/conanmanifest.txt is an interrupted extract, not a broken registry upload: the KF6 chain then fails with a cascading 'FindKF6 ... could not be found' message. Clear those recipes with `conan remove -c` and let create re-download before blaming the recipe."
  - "Upstream tests/ (kgamepopupitemtest) is a manual GUI demo with no assertions and is never registered through ecm_mark_as_test when BUILD_TESTING=ON; only src/private/tests contributes ctest entries. Any 'test count' claim for this package must say 2, not 3."
  - "KGamePopupItem::showMessage() starts a QVariantAnimation that needs a live scene view and event loop; a headless consumer test that calls it segfaults (exit 139). Keep the scene/addItem/accessor/forceHide surface in smoke tests and leave showMessage to an interactive run."
