# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libkeccak/1.4.3
homepage: "https://github.com/maandree/libkeccak"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: libkeccak-1.4.3/test.c
    description: "上游官方测试：SHA3/Keccak/SHAKE/RawSHAKE/cSHAKE/HMAC 全量测试"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libkeccak 并计算 SHA3-256 空串哈希"
    command: "./test_libkeccak"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
