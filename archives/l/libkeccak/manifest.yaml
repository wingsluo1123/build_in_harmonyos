software: libkeccak
display: "libkeccak"
description: "Keccak/SHA-3/SHAKE/RawSHAKE hashing algorithm library"
category: crypto
homepage: "https://github.com/maandree/libkeccak"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建系统，无 configure 脚本，通过 make 命令行变量覆盖 CC/CFLAGS"
    - "config.mk 中 CC=c99 需覆盖为 clang"
    - "clang 不支持 __optimize__('-O0') 属性，仅产生警告不影响编译"
    - "Conan 配方需使用 make -C {source_folder} 因 basic_layout 创建 build 子目录"
    - "conandata.yml 需添加 filename 字段帮助 Conan 检测 tar.gz 格式"
  common_dependencies: []

versions:
  "1.4.3":
    status: published
    build_date: "2026-07-08"
    conan_ref: "libkeccak/1.4.3@ohpcd/stable"
