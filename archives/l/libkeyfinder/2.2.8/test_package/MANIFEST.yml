# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libkeyfinder/2.2.8
homepage: "https://github.com/mixxxdj/libkeyfinder"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (uses Catch2 via FetchContent, disabled in conan build)
upstream_tests:
  - file: tests/keyfindertest.cpp
    source: libkeyfinder-2.2.8/tests/keyfindertest.cpp
    description: "KeyFinder main API tests"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Creates AudioData with silence, calls keyOfAudio, verifies SILENCE result"
    command: "./test_libkeyfinder"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
