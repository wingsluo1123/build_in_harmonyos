sources:
  url: "https://download.kde.org/stable/release-service/26.04.3/src/libkleo-26.04.3.tar.xz"
  sha256: "47772211be61a31947474f871e190f36344a87defec7bc97a468ed6a15b50c09"
patches:
  "26.04.3":
    - patch_file: "patches/0001-Use-standard-algorithms-supported-by-OHOS-libcxx.patch"
      patch_description: "Use standard algorithms available in OHOS Clang libc++"
      patch_type: "portability"
    - patch_file: "patches/0002-Give-KPim6Libkleo-an-ELF-SONAME.patch"
      patch_description: "给 KPim6Libkleo 写入上游 SOVERSION 对应的 ELF SONAME，避免测试程序把相对路径记进 DT_NEEDED"
      patch_type: "portability"
    - patch_file: "patches/0003-Point-GpgME-engines-at-PATH-GnuPG.patch"
      patch_description: "仅当设置了 LIBKLEO_GNUPG_BIN 时，在共享库加载时把 GpgME 引擎指到该私有目录，不搜索 PATH，不改写 GNUPGHOME"
      patch_type: "portability"
