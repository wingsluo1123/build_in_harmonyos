knowledge_gained:
  - "Clang malloc/calloc builtins can change allocator edge-case assertions in an upstream libc test; disabling those builtins only for make test preserves the unmodified malloctest3 source and exercises klibc."
  - "A separate no-MAP_NORESERVE allocator control passed malloctest3, so the final package keeps the upstream allocator implementation."
  - "Kbuild links upstream tests with ld.lld without HarmonyOS .codesign; relinking the unchanged upstream test objects with the OHOS Clang driver adds the required section before on-device execution."
  - "The klibc tests include a deterministic vector printer, testrand48, that exits 1 by design; compare its complete expected output rather than counting it as failed or skipped."
