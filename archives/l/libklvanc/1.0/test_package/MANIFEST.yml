# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libklvanc/1.0
homepage: "https://github.com/stoth68000/libklvanc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tools/test_api.c
    source: libklvanc-1.0/tools/test_api.c
    description: "klvanc_test_api 功能测试套件（185 组断言，覆盖核心 VANC 解析/校验/包处理）"
  - file: tools/smpte2038.c
    source: libklvanc-1.0/tools/smpte2038.c
    description: "klvanc_smpte2038 sample 驱动测试（2142 个 PES/VANC 包，0 校验失败）"