patches:
  "26.04.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Stamp IMPORTED_SONAME on the KF6 imported targets and clear IMPORTED_NO_SONAME so the linker records the dependency by basename instead of the machine-private package path (E537 relocatable linkage)"
      patch_type: "portability"
    - patch_file: "patches/0002-src-CMakeLists.txt.patch"
      patch_description: "Link the soname-less KF6 libraries by bare -l with a PRIVATE -L (KSANE_DEP_LIB_DIRS) so ld records libKF6<Name>.so in DT_NEEDED instead of the absolute package path, keeping the include directories as SYSTEM PRIVATE"
      patch_type: "portability"
