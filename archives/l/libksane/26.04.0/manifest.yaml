# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  # 完全复用 E537：Conan cache 绝对路径泄漏进 DT_NEEDED → relocatable SONAME 链接
  - "KF6 依赖（ki18n/kwidgetsaddons/ktextwidgets/kwallet）产物无 DT_SONAME，按 IMPORTED_LOCATION 绝对路径链接会把 Conan cache 路径写进 DT_NEEDED；修复=对导入目标打 IMPORTED_SONAME/清 IMPORTED_NO_SONAME + 用 basename(-l)链接（完全复用 knowledge_ref: E537）"
  # 完全复用 E657：/system/lib64 libc++ 前置
  - "configure 期宿主工具（qtpaths）与测试程序需前置 LD_LIBRARY_PATH=/system/lib64，避免沙箱内不兼容 libc++_shared.so 遮蔽（完全复用 knowledge_ref: E657）"
  # 本包新发现，已出草稿
  - "sane-backends/1.2.1 制品把后端搜索路径固化为 /lib/sane（OHOS 不存在）→ dll 加载器无法枚举任何设备，消费者（libksane/ksanecore）都打不开设备；测试期可用 LD_PRELOAD 官方后端规避（新知识 knowledge_ref: knowledge/drafts/E429-draft-C8F7.kv）"
  # L3 版本级笔记
  - "KF6 版本线：制品仓 ktextwidgets/kwallet 仅有 6.18.0（无 6.26.0），ksanecore/26.04.0 的 ki18n/6.26.0 需 override 降到 6.18.0 并由 --build=missing 重建（L3 版本笔记 knowledge_ref: notes.md 依赖版本选择）"

