# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libksba/1.6.7
homepage: "https://gnupg.org/software/libksba/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/cert-basic.c
    source: libksba-1.6.7/tests/cert-basic.c
    description: "Certificate basic test"
    command: "./cert-basic"
  - file: tests/t-crl-parser.c
    source: libksba-1.6.7/tests/t-crl-parser.c
    description: "CRL parser test"
    command: "./t-crl-parser"
  - file: tests/t-dnparser.c
    source: libksba-1.6.7/tests/t-dnparser.c
    description: "DN parser test"
    command: "./t-dnparser"
  - file: tests/t-oid.c
    source: libksba-1.6.7/tests/t-oid.c
    description: "OID test"
    command: "./t-oid"
  - file: tests/t-reader.c
    source: libksba-1.6.7/tests/t-reader.c
    description: "Reader test"
    command: "./t-reader"
  - file: tests/t-cms-parser.c
    source: libksba-1.6.7/tests/t-cms-parser.c
    description: "CMS parser test"
    command: "./t-cms-parser"
  - file: tests/t-der-builder.c
    source: libksba-1.6.7/tests/t-der-builder.c
    description: "DER builder test"
    command: "./t-der-builder"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - ksba_check_version"
    command: "./test_libksba"

# 测试断言总数 (近似值)
assertion_count: 7
