software: liblscp
version: 1.0.1
status: built
category: library
description: LinuxSampler Control Protocol (LSCP) client API library

build_system:
  type: cmake
  configure_command: "cmake -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release <source>"
  build_command: "cmake --build . -- -j2"
  install_command: "cmake --install ."

configure_options:
  - CMAKE_INSTALL_LIBDIR=lib
  - CMAKE_INSTALL_INCLUDEDIR=include

dependencies:
  runtime: []
  build: []

patches:
  - name: 0001-ohos-thread-cancel-guarded-signal-exit.patch
    description: >-
      现场绑定：4024 B / 107 行，sha256
      bbcf6b83ff92dc968566595940dcdd4a3a9ac998fc299d8a1c4c99769f5398f8（tip
      09a123cac 首次实测，构建 tip 4327f6e14 于 2026-10-13 22:41 与 2026-10-15 13:1x 现场复核逐字相同）。OHOS NDK libc.so 不导出 pthread cancellation 家族
      （pthread_cancel 与
      pthread_setcanceltype 只在静态 libc.a 里有定义，共享 libc.so 为 0 命中），
      上游 lscp_thread_cancel() 的非 WIN32 分支因此留下未定义符号；库本体可带
      未定义符号通过链接，但任何链接 liblscp.so 的可执行文件都被 ld.lld
      --no-allow-shlib-undefined 拒绝。补丁为 __OHOS__ 实现 knowledge/doc/E513.md
      「推荐方案」的 guarded-signal-thread-exit：lscp_thread_create() 在
      pthread_create() 之前用 sigaction() 安装一个只调用 pthread_exit(NULL) 的
      SIGUSR1 处理器（sa_flags=0，不设 SA_RESTART），安装失败则 free() 并返回
      NULL；lscp_thread_cancel() 改为 pthread_kill(pThread->pthread, SIGUSR1)
      使线程定向退出并保留句柄，由 lscp_thread_destroy() 的 lscp_thread_join()
      正常回收。初版 0001-ohos-thread-cancel-cooperative-join.patch（872 B，
      WIN32 式空桩）经独立 W4 判 P1 已删除。Linux/其它平台分支逐字不变。
    files_modified:
      - src/thread.c

