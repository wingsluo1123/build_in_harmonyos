# test_package/MANIFEST.yml — 上游官方测试声明（CI build_and_test.sh L0e 要求）
package: liblscp/1.0.1
homepage: "https://linuxsampler.org/"

# 上游无测试命令：tarball 内 enable_testing / add_test / ctest / BUILD_TESTING
# 命中数为 0（2026-10-12 全树 grep 实测，见 ../notes.md「上游测试分析」）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 消费者测试（test_package）——本包唯一的可执行行为证据
test_package_tests:
  - file: test_liblscp.c
    description: >-
      以库使用者身份编译链接 liblscp.so，断言五组真实行为：configure_file 生成的
      版本字符串（package/version/build）、src/event.c 的 17 项事件枚举与文本互转
      （含 strcasecmp 大小写路径与 NULL/未知回退）、客户端 API 的 NULL 句柄契约、
      对本进程内 loopback 假 LSCP 服务端的一次真实事务（OK[0.85] 解析、
      纯 OK 累积、ERR:400 转 LSCP_ERROR/errno=500）、以及按 knowledge/doc/E513.md
      「推荐方案」guarded-signal-thread-exit 新增的反悬置组：对活线程走
      lscp_thread_cancel()+lscp_thread_join()、自然退出后的 destroy、以及库自身
      可达路径 lscp_socket_agent_start()/lscp_socket_agent_free()（即
      lscp_client_destroy() 实际调用的一条），三条都带
      TEARDOWN_BUDGET_MS=5000 时间上界，退出码由断言结果决定。
    command: "./test_liblscp"

