sources:
  # Canonical snapshot of the Mauve Subversion trunk (r4725) published by the
  # Debian Med team; upstream itself ships no versioned tarball (the homepage
  # points at the SVN trunk). Ubuntu archive mirrors the same file
  # (libmems_1.6.0+4725.orig.tar.xz, 236796 bytes). PF7 note: a distro-pool
  # URL is used here as the official-versioned-source exception because no
  # upstream release asset exists; see notes.md for the justification.
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/libm/libmems/libmems_1.6.0+4725.orig.tar.xz"
  sha256: "67265e1eb1b85a04533be431b906cc8d4773c799fb1a7809b346209380c41e91"
vendored:
  # Private static sub-builds for Conan父母remote缺失的强制依赖
  # (aggregated experience #1:远端缺失依赖时配方内私有构建并合包)。
  # configure.ac PKG_CHECK_MODULES(DEPS, libGenome-1.3 >= 1.3.1
  # libMUSCLE-3.7 >= 1.0.0)为强制检查,ohpcd制品仓无libgenome/libmuscle
  # (preflight: Unable to find 'libgenome/1.3.1' in remotes),故不在
  # requirements()声明远端依赖,改为build()内下载以下官方源码、
  # 静态构建到build_folder私有prefix并合包。sha256与Debian .dsc一致,
  # 不为镜像改校验值;URL为Debian官方池的https地址(与libgenome已验证
  # 配方同源),属官方托管版本源。
  libgenome:
    url: "https://deb.debian.org/debian/pool/main/libg/libgenome/libgenome_1.3.11+svn20110227.4616.orig.tar.xz"
    sha256: "a2ca77c2a4e9c6239d9cc2fd84b84ffa75444283e3c3d34f8e724525b6a1b677"
  libmuscle:
    url: "https://deb.debian.org/debian/pool/main/libm/libmuscle/libmuscle_3.7+4565.orig.tar.xz"
    sha256: "7919b2378c8e41badb0828a8fdf8b184e67aeeb5a9f91566935e8a72a9e3b376"
