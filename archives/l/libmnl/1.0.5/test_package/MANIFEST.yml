# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmnl/1.0.5
homepage: "https://www.netfilter.org/projects/libmnl/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: examples
    source: libmnl-1.0.5/examples/
    description: "上游示例程序编译验证 (无独立测试套件，make check 编译示例程序)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 libmnl API: mnl_nlmsg_size/mnl_nlmsg_put_header/mnl_nlmsg_get_payload_len"
    command: "./test_libmnl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
