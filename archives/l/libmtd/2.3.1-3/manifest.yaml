# 版本级 manifest
# 文件位置: archives/l/libmtd/2.3.1-3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（2.3.1-3 = 上游 mtd-utils 2.3.1 + Debian 修订 3，源码同上游）
version: "2.3.1-3"

# 软件名
software: "libmtd"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（mtd-utils 官方发布源）
  url: "https://infraroot.at/pub/mtd/mtd-utils-2.3.1.tar.bz2"

  # 源码校验和
  sha256: "03d9dc58ad10ea3549d9528f6b17a44d8944e18e96c0f31474f9f977078b83dc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（禁用全部 CLI 工具，只保留 lib/ 四库目标）
  configure_options:
    - "--without-tests"
    - "--without-lsmtd"
    - "--without-jffs"
    - "--without-ubifs"
    # 仅在 OHOS 设备宿主注入（HMDFS 规避）：
    # - "MKDIR_P=/system/bin/mkdir -p"
    # - "CONFIG_SHELL=/system/bin/sh"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条含知识库引用）
knowledge_gained:
  - "config.guess 不识别 UNAME_SYSTEM=HarmonyOS 报 'cannot guess build type'，用 scripts/patch-autotools-ohos.pl 修 config.guess/sub（知识库 ref: E007），禁止 --build/--host 绕过（会误判交叉编译跳过运行时探测）"
  - "mtd-utils 全量工具（mkfs.ubifs/jffsX/lsmtd）才需要 libuuid/openssl/libselinux 等可选依赖，lib/ 四库（libmtd/libubi/libubigen/libscan）仅链 libc：configure 加 --without-tests --without-lsmtd --without-jffs --without-ubifs 即零依赖通过（知识库 ref: 可研 #74 依赖拆分结论）"
  - "上游 noinst_LIBRARIES 的库（.a）不会被 make install 安装，conan 配方须在 package() 用 copy 手动打包 .a 与头文件，且内部头（common.h 等）依赖生成文件 config.h 不可随包分发（知识库 ref: 配方实践，本包 conanfile.py package() 注释）"
  - "测试期间发现 conan 2.29.1 要求 package_type=library 必须声明 shared 选项（'Package type is library, but no shared option declared'），静态-only 库应声明 options shared/fPIC 并在 configure() 对 shared=True 抛 ConanInvalidConfiguration（知识库 ref: 本包 conan-verify G2 失败修复记录）"
