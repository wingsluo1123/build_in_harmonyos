# 版本级 manifest.yaml
# 文件位置: archives/l/libmtp/1.1.21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.21"
software: libmtp

# prepared: 配方与测试已就绪，等待 OHOS 真机构建验证
# （ohc-run.py finish 会将其改写为 built）
status: built

build_date: "2026-09-30"
build_system: conan

source:
  url: "https://github.com/libmtp/libmtp/releases/download/v1.1.21/libmtp-1.1.21.tar.gz"
  sha256: "f4c1ceb3df020a6cb851110f620c14fe399518c494ed252039cbfb4e34335135"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    # MTPZ（Zune 设备）专用，避免引入 libgcrypt
    - "--disable-mtpz"
    # udev 规则/mtp-probe 默认装 /usr/lib/udev（只读），重定向进安装前缀
    - "--with-udev=${prefix}/lib/udev"
    # 库形态（shared=False 时静态库；libusb/1.0.27 同款参数组）
    - "--disable-shared"
    - "--enable-static"
    # 真机首验 D4：libtool 无条件调 config.guess（2021 版不认
    # uname=HarmonyOS）→ 显式三元组（termrec §12.1 同款）
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies:
    # configure.ac:116 PKG_CHECK_MODULES(LIBUSB, libusb-1.0 >= 1.0.0)
    - "libusb/1.0.27"
  cc: clang
  cxx: clang++

patches_applied:
  # examples/pathutils.c:138 rindex() → strrchr()（musl/OHOS 无 rindex）
  - "0001-examples-pathutils-rindex.patch"

knowledge_gained:
  - "configure.ac 无 AC_CANONICAL_HOST，但 libtool（configure:4676）无条件调 config.guess，2021 版不认 uname=HarmonyOS → 显式 --build/--host=aarch64-unknown-linux-gnu（termrec §12.1）"
  - "OHOS musl 忽略 DT_RUNPATH → configure 的 conftest 运行期找不到依赖 .so（errno 127 伪装成 cannot run C compiled programs），须把依赖包 libdirs 注入 LD_LIBRARY_PATH（termrec §12.38③）"
  - "conandata.yml 的 patches 必须是 dict 条目（patch_file/patch_description/patch_type），字符串条目使 export_conandata_patches 崩溃（'str' object has no attribute 'get'）"
  - "USE_LINUX 由编译期探测 __linux__ 判定（OHOS clang 定义 __linux__）→ udev 规则与 mtp-probe 会被构建，--with-udev=${prefix}/lib/udev 重定向"
  - "configure 内嵌 umask 077 && mktemp -d（configure:18485）在 HMDFS 产生不可写临时目录（E011），sed 为 022"
  - "SDK bash getcwd 在 HMDFS 构建目录失败（E386）→ SHELL=/bin/sh + unset CONFIG_SHELL"
  - "musl 无 legacy 函数 rindex()，examples/pathutils.c:138 改用标准 strrchr()"
  - "上游零测试（全部 Makefile.am 无 check_PROGRAMS/TESTS），依 TEST_QUALITY_SPEC 由 test_package 补充消费者测试"
  - "历史：旧格式条目 2026-05-26 曾在真机整链构建成功（hints/ 保留其手工流程），其 0001/0002（config.guess/sub）、0004（.pc）、0005（gphoto2-endian）补丁在 Conan 流程下不再需要"
