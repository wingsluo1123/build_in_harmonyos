sources:
  url: "https://www.netfilter.org/projects/libnetfilter_acct/files/libnetfilter_acct-1.0.3.tar.bz2"
  sha256: "4250ceef3efe2034f4ac05906c3ee427db31b9b0a2df41b2744f4bf79a959a1a"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "Add a HarmonyOS branch to config.guess so the host triplet becomes aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "Accept the linux-ohos kernel-os combination in config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "HMDFS fix: create the configure temp dir with umask 022 instead of 077 (owner-unwritable directories on HMDFS)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-libnetfilter_acct.c.patch"
    patch_description: "musl/kernel-uapi sockaddr_storage double definition in the library TU: suppress the redundant <linux/socket.h> copy and supply __kernel_sa_family_t"
    patch_type: "portability"
  - patch_file: "patches/0005-examples-sockaddr-guard.patch"
    patch_description: "Same musl/kernel-uapi sockaddr_storage guard for the three examples/ check_PROGRAMS, which include <libmnl/libmnl.h> directly and are built by make check"
    patch_type: "portability"
