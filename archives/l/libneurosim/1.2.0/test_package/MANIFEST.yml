# test_package/MANIFEST.yml — libneurosim 1.2.0 适配验证清单
#
# 上游测试来源声明：
#   - build_system: autotools（configure.ac，tarball 无预生成 configure 需 autogen.sh）
#   - 上游无独立自动化测试套件（无 make check 目标）
#   - 本适配以消费者用例为准：ConnectionGenerator 构造/查询 roundtrip
#
# test_package 消费者用例（新增）：
#   test_neurosim.cc — 版本宏/版本函数 + ConnectionGenerator 具体类型构造 +
#   抽象接口实现实例化（使用上游真实公开 API：LIBNEUROSIM_VERSION、
#   libneurosim_version()、ConnectionGenerator::Mask/ClosedInterval）
package: libneurosim/1.2.0
homepage: https://github.com/INCF/libneurosim

upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - name: neurosim-connect-gen
    command: "./test_neurosim"
    assertions:
      - "版本宏 LIBNEUROSIM_VERSION 存在且为 1.2.0"
      - "libneurosim_version() 版本查询函数可调用（真实链接库代码）"
      - "ConnectionGenerator::Mask/ClosedInterval 具体内嵌类型可构造"
      - "抽象接口 ConnectionGenerator 可由消费者实现并实例化（生命周期完整）"
