software: libnsgif
display: "libnsgif"
description: "NetSurf 项目的 GIF 图像解码库"
category: gfx
homepage: "https://www.netsurf-browser.org/projects/libnsgif/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "需要设置 BUILD_CC=clang，鸿蒙环境无 cc 命令"
    - "需要设置 AR=llvm-ar，默认 ar 不可用或版本不兼容"
    - "make install 需要 GNU install 命令，通过安装 coreutils 预编译包解决"
    - "使用 make test 代替 make check（NetSurf buildsystem 无 check 目标）"
    - "需要 NetSurf buildsystem 作为构建依赖，安装到 $DEFAULT_PREFIX/share/netsurf-buildsystem/"
  common_dependencies:
    - netsurf-buildsystem
    - coreutils

versions:
  "1.0.0":
    status: built
    build_date: "2026-06-25"
