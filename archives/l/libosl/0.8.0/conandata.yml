patches:
  - patch_file: "patches/0001-emmintrin-x86-guard.patch"
    patch_description: "Restrict <emmintrin.h> to x86/x86_64 and force the scalar fallback on non-x86 via arch-gated undef of OSL_USE_SSE in quadInt.h (tripleInt.h gets the same enforcement in recipe source(); aarch64 clang has neither SSE headers nor __builtin_ia32_* intrinsics)"
    patch_type: "portability"
  - patch_file: "patches/0003-test-makefile-drop-test-lib.patch"
    patch_description: "Drop -lboost_unit_test_framework from test link lines to match the header-only entry point"
    patch_type: "portability"
  - patch_file: "patches/0004-libcxx-std-hash.patch"
    patch_description: "Include <functional> and drop the redundant std::hash primary forward declaration (ambiguous with libc++); specialize for osl::Move/HashKey/BoardKey directly"
    patch_type: "portability"
  - patch_file: "patches/0005-lightmutex-aarch64.patch"
    patch_description: "Make LightMutex/LightMutexChar spinlock portable to non-x86: keep x86 mov/xchg asm fast path, use compiler atomic test-and-set/release plus yield hint on AArch64 (fixes invalid output constraint '=&q' in asm)"
    patch_type: "portability"
