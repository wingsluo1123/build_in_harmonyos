package: libosmo-mgcp-client/1.14.0
homepage: "https://gitea.osmocom.org/cellular-infrastructure/osmo-mgw"

upstream_check_command: "tests/mgcp_client/mgcp_client_test tests/mgcp/mgcp_test"
upstream_test_in_build: false
upstream_test_command: "compile and run mgcp_client_test"
upstream_tests:
  - tests/mgcp_client/mgcp_client_test.c
  - tests/mgcp/mgcp_test.c

test_package_tests:
  - file: test_mgcp_client.c
    description: "配置分配、默认地址端口、mgcp_client_init 和 endpoint domain"
    command: "clang test_mgcp_client.c -fno-emulated-tls -I<install>/include -L<install>/lib -losmo-mgcp-client <dependency flags>"

assertion_count: 5
