# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libpg_query/17-6.2.2
homepage: "https://github.com/pganalyze/libpg_query"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Note: Upstream make check requires linking examples/tests which fails
# on OHOS due to lld missing libxml2.so.16. Only static library build works.
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Parse SQL query using pg_query_parse API and verify output"
    command: "./test_libpg_query"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
