software: libpq
# 软件级 manifest 模板
# 文件位置: archives/l/libpq/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述（一句话）
description: "PostgreSQL客户端库，用于连接和操作PostgreSQL数据库"

# 官方主页
homepage: "https://www.postgresql.org/"

# 许可证
license: PostgreSQL

# 软件分类
category: library

# ============================================================
# 版本索引（软件级）
# ============================================================

versions:
  - version: "17.2"
    status: built
    build_system: autotools
    compatibility: high
    patches: 3
    path: archives/l/libpq/17.2

# ============================================================
# 构建系统支持
# ============================================================

# 支持的构建系统
build_systems:
  - autotools

# ============================================================
# 依赖信息
# ============================================================

# 无外部依赖（静态库版本）
dependencies: []

# ============================================================
# 知识沉淀
# ============================================================

# 适配经验标签
tags:
  - autotools
  - static-library
  - database-client
  - config-guess-harmonyos

# 平台适配关键点
platform_notes:
  - "静态库版本（无RUNPATH问题，天然可移植）"
  - "需要config.guess/config.sub补丁识别HarmonyOS"