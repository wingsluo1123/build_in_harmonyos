# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libproxyprotocol/1.3.3
homepage: "https://github.com/kosmas-valianos/libproxyprotocol"

# 上游测试命令 (make 目标 tests: 编译 tests/test_libproxyprotocol 并运行)
upstream_check_command: "make tests"

# conanfile.py build() 中已集成上游测试 (make tests 实际执行)
upstream_test_in_build: true
upstream_test_command: "make tests"

# 上游实际运行的测试程序 (tests/test.c, 124 个用例, 输出 All tests completed successfully)
upstream_tests:
  - file: tests/test.c
    source: libproxyprotocol-1.3.3/tests/test.c
    description: "PROXY protocol v1/v2 header create/parse unit tests (124 cases)"
    command: "make tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 pp_create_hdr/pp_parse_hdr/pp2_create_healthcheck_hdr 验证 API 往返"
    command: "./test_libproxyprotocol"

# 测试断言总数 (上游 tests/test.c 124 个用例)
assertion_count: 124
