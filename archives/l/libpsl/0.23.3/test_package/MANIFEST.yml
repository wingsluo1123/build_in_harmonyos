package: libpsl/0.23.3
homepage: https://github.com/rockdaboot/libpsl
upstream_check_command: "make check -j1"
upstream_test_in_build: true
upstream_test_command: "Conan build(): make check -j1 when can_run(self)"
upstream_tests:
  - name: "libpsl fuzz suite"
    source: "libpsl-0.23.3/fuzz/"
    description: "3/3 passed on private native target"
    command: "make check -j1"
  - name: "libpsl API suite"
    source: "libpsl-0.23.3/tests/"
    description: "5/5 passed on private native target"
    command: "make check -j1"
test_package_tests:
  - file: test_libpsl.c
    description: "Compile, link, run installed package; public suffix and cookie-domain API assertions"
    command: "./test_libpsl"
