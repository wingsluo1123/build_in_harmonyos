# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS 的 config.guess 不包含 HarmonyOS/__OHOS__ 检测分支，需要手动添加 aarch64:HarmonyOS case 将其映射为 aarch64-unknown-linux-gnu"
  - "HMDFS 文件系统不支持 umask 077 与 mktemp -d 组合创建安全临时目录，需要移除 umask 077 调用"
  - "OHOS 平台不支持 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype，需要用 __OHOS__ 宏守卫这些调用"
  - "CMake 在 OHOS 平台上不识别 HarmonyOS 系统名称，test_package 需要设置 CMAKE_SYSTEM_NAME=Linux 作为变通方案 (E092)"
  - "Autotools 构建需要设置 CONFIG_SHELL=/usr/bin/sh 和 SHELL=/usr/bin/sh 以避免 OHOS 默认 shell 兼容性问题"
  - "系统依赖 (gmp/mpfr/readline/libxml2) 通过 pkg-config 发现，需要设置 PKG_CONFIG_PATH 指向 ~/usr/local/lib/pkgconfig"
  - "conanfile.py 应使用 Conan Autotools helper (Autotools/AutotoolsToolchain) 而非手动 self.run() 执行 configure/make"
  - "conandata.yml 中的源码 URL 应使用原始 GitHub URL 而非代理 URL，确保可复现性"

