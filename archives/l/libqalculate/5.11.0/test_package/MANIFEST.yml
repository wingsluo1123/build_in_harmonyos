# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libqalculate/5.11.0
homepage: "https://qalculate.github.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test.cc
    source: libqalculate-5.11.0/src/test.cc
    description: "libqalculate 主测试套件，使用 tests/*.batch 批处理数据文件（18个：bitwise, calculus, dates, explog, geometry, limits, matrixvector, numberbase, operators, parser, percentages, polynomial, solver, stats, strings, units, variables）"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "验证 libqalculate 头文件包含和库链接"
    command: "./test_libqalculate"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
