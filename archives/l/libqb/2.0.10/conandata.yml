# conandata.yml — libqb 2.0.10
# 上游源码: ClusterLabs/libqb v2.0.10 release tarball

sources:
  url: "https://github.com/ClusterLabs/libqb/releases/download/v2.0.10/libqb-2.0.10.tar.xz"
  sha256: "326a69fb5b2ee4479f0db4f98d10d670ad0798b5ded8c4cfd585b765fd8941e8"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "config.guess: 识别 HarmonyOS (uname -s 返回 HarmonyOS), 产出 aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "config.sub: 接受 *-linux-ohos 三元组"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: config.status 建临时目录的 umask 077 -> 022 (HMDFS 下 077 会让组无写权限, 写 subs1.awk 报 Permission denied)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-date-toybox.patch"
    patch_description: "configure: AX_PROG_DATE 识别 toybox date (系统 date 为 toybox 0.8.12, --version 无 'GNU' 且无 BSD -v; toybox 实际支持 date -u -d@<epoch>), 避免 'date utility unable to convert epoch to UTC' 硬失败"
    patch_type: "portability"
