# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libreadstat/1.1.9
homepage: "https://github.com/WizardMac/ReadStat"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 来源: Makefile.am 的 `TESTS = test_readstat test_dta_days test_sav_date
#       test_double_decimals`（check_PROGRAMS 同四项），源码在 src/test/。
upstream_tests:
  - file: test_readstat.c
    source: readstat-1.1.9/src/test/test_readstat.c
    description: "核心写读往返套件：读取 src/test/test_list.h 的 19 组 / 99 条注册用例，逐条按 (行偏移×行上限) 2 组参数 × 命中的文件格式位执行写→读比对。循环为 `for (f=RT_FORMAT_DTA_104; f<RT_FORMAT_ALL; f*=2)`，实测该循环实际遍历 23 个格式位（最高 0x400000；注意 RT_FORMAT_ALL=0x6ff1ff 本身不含 SAS7BCAT 位 0x100000，但 f 倍增时会取到它），Σ(每条用例命中的位数)=676，2×676 = 1352 次写读往返（对 test_readstat.c 插桩计数器实测 loop_hits=1352）"
    command: "./test_readstat"
  - file: test_dta_days.c
    source: readstat-1.1.9/src/test/test_dta_days.c
    description: "Stata 日期<->天数转换：1600-01-01..2049-12-31 共 164360 个日期往返 + 4 个非法输入负例 = 164364 次断言"
    command: "./test_dta_days"
  - file: test_sav_date.c
    source: readstat-1.1.9/src/test/test_sav_date.c
    description: "SPSS 日期<->double 转换：1582-10-14..2049-12-31 共 170648 个日期往返 + 2 个定点值 + 1 个负例 = 170651 次断言（每 1000 条打印一行，实测日志 170 行）"
    command: "./test_sav_date"
  - file: test_double_decimals.c
    source: readstat-1.1.9/src/test/test_double_decimals.c
    description: "double_decimals() 小数位判定 11 条 EXPECT_DECIMALS 断言"
    command: "./test_double_decimals"

# test_package 中自带的测试 (消费者视角验证，仅链接已打包产物)
test_package_tests:
  - file: consumer_error_paths.c
    description: "消费者测试（既有）：链接已打包的 libreadstat + <readstat.h>，校验解析器生命周期、sav/dta/sas7bdat 三个解析入口对缺失文件返回 READSTAT_ERROR_OPEN（拒绝假绿）、以及 3 条错误码->消息映射，共 7 条断言"
    command: "./consumer_error_paths <build>/fixtures"
  - file: consumer_round_trip.c
    description: "鸿蒙消费者回归（新增）：经公共 writer API 用真实 POSIX 文件描述符落盘 .sav 与 zlib 压缩 .zsav 各一份，再用 readstat_parse_sav 从磁盘读回，逐值比对（double/int32/string 各 3 行）、校验变量名与行列计数、校验 readstat_set_row_limit(1) 生效、以及缺失文件仍返回 READSTAT_ERROR_OPEN；实测 41 条断言 = 2 种格式 × 19 条 + 3 条守卫"
    command: "./consumer_round_trip <build>/fixtures"
  - file: cli_smoke.py
    description: "已打包命令行工具实跑：对 consumer_round_trip 产出的 ohos-consumer.sav 执行 `readstat <file>`（元数据清单）与 `readstat <file> -`（CSV 转换到 stdout），并断言输出内容（格式/列数/行数/表标签/CSV 表头与首末行）；实测 10 条断言。由 test_package/conanfile.py 的 test() 用 sys.executable 驱动"
    command: "python3 cli_smoke.py <pkg>/bin/readstat <fixtures>/ohos-consumer.sav"

# 测试断言总数 (近似值, 用于质量评估)
# 上游：test_readstat 1352 次写读往返 + test_dta_days 164364 + test_sav_date 170651
#       + test_double_decimals 11 = 336378（automake 层为 4 个测试程序，4/4 PASS）
# 消费者侧另计：consumer_error_paths 7 + consumer_round_trip 41 + cli_smoke 10 = 58
# （不含在上面的上游口径内）
assertion_count: 336378
consumer_assertion_count: 58

