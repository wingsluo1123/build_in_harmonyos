# 编译中学到的知识
knowledge_gained:
  - "libretro/yabause core builds on OHOS aarch64 with plain make; all deps (zlib/LZMA/FLAC/libchdr/libretro-common) are vendored in-tree, no registry requirements"
  - "libretro cores are dlopen'ed plugins loaded by exact filename; consumer surface is libretro.h + retro_* ABI, cpp_info.libs=[]"
  - "libcheck open_tmp_file() checks TEMP before P_tmpdir: in sandboxes with read-only /tmp set TEMP (not TMPDIR) to a writable dir"
  - "Toolchain children can die silently when conan stdout is a pipe in constrained sandboxes; redirect build output to a file and cat it back"
