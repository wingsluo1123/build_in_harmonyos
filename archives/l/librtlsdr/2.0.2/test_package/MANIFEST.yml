# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: librtlsdr/2.0.2
homepage: "https://github.com/osmocom/rtl-sdr"

# rtl-sdr 上游无 make check 测试目标
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "链接 librtlsdr 并调用 rtlsdr_get_version() 验证库可正常消费"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
