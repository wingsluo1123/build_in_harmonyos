software: libsais
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.10.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.10.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/IlyaGrebnov/libsais/archive/refs/tags/v2.10.4.tar.gz"

  # 源码校验和
  sha256: "94aa88f9e29f8812214ecfa6b55f5dca14c7d8a427409c062f734a61ca4c6931"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DLIBSAIS_BUILD_SHARED_LIB=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E092: CMake 不认识 HarmonyOS 平台，需设置 CMAKE_SYSTEM_NAME=Linux"
  - "libsais 的 CMakeLists.txt 设置 PREFIX '' 导致库文件名为 libsais.a（无 lib 前缀），Conan CMakeDeps 的 find_library 找不到，需在 test_package/CMakeLists.txt 中 list(APPEND CMAKE_FIND_LIBRARY_PREFIXES '')"
  - "conan-init 可能误判构建系统为 autotools，对于 CMake 项目需手动重写 conanfile.py"
  - "Conan 2.x 不允许在 generators 属性和 generate() 方法中同时声明 CMakeToolchain"
