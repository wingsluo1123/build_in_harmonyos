software: libsixel
version: "1.10.5"
status: built
build_date: "2026-08-07"
build_system: meson

source:
  url: "https://github.com/libsixel/libsixel/archive/refs/tags/v1.10.5.tar.gz"
  tar_format: tar.gz

build:
  system: meson
  options:
    - "-Dgdk-pixbuf2=disabled"
    - "-Dgd=disabled"
    - "-Dlibcurl=disabled"
    - "-Djpeg=disabled"
    - "-Dpng=disabled"
    - "-Dpython=disabled"
    - "-Dtests=disabled"

knowledge_gained:
  - "libsixel是Sixel图像格式库"
  - "meson构建系统，编译无特殊问题"
  - "可选依赖(gdk-pixbuf2/gd/curl/jpeg/png)全部禁用，使用内置stb-image loader"
  - "meson需要native file指定ar/ranlib等工具路径(HMDFS PATH解析问题)"

