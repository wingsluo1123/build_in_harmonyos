build:
  system: custom       # GN graph pre-generated on host (windows gn, device cc/cxx paths baked in) + ninja on device
  configure_options:
    - 'is_official_build=true'
    - 'target_os="linux" / target_cpu="arm64" (OHOS clang cross)'
    - 'cc/cxx = device /storage/Users/currentUser/usr/local/bin/clang{,++} (baked into the graph)'
    - 'skia_enable_discrete_gpu=false / skia_enable_graphite=false (m146 split of skia_enable_gpu)'
    - 'skia_use_vulkan/gl/egl/dawn/angle/metal/webgpu=false'
    - 'skia_use_system_*=false (bundled expat/freetype/libjpeg-turbo/libpng/libwebp/zlib/wuffs)'
    - 'skia_use_fontconfig=false / skia_use_x11=false / skia_use_harfbuzz=false (no system/bundled deps on device)'
    - 'skia_enable_tools=false / skia_enable_pdf=false / skia_use_icu=false / skia_enable_skottie=false / skia_enable_svg=true / skia_enable_rust=false'
  dependencies: []     # Skia bundles third_party via DEPS; no Conan requires
  cc: clang
  cxx: clang++
  prebuild_steps:
    - "P1: source tarball contains vendored third_party (9 externals at DEPS revisions) + arm64 bin/gn + out/ (pre-generated ninja graph)"
    - "recipe build(): if out/build.ninja exists -> skip gn gen, run ninja -C out -j{2..4} skia directly (device gn not executable on hmdfs)"
    - "graph rewrite before packaging: cmd.exe stamps -> ': >', D$:/harmonyos absolute paths -> ../ relative, FT_CONFIG_*_H angle macros quoted for sh"
  extra_notes:
    - "Device ninja/clang/ar/ld.lld are prestaged in usr/local/bin (exec OK); any non-prestaged ELF (e.g. our gn copy) is denied exec by hmdfs/SELinux policy"

