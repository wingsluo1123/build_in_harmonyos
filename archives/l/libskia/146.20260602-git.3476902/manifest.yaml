    - "recipe package(): added modules/skcms/{skcms.h,src/skcms_public.h} under package ROOT (SkColorSpace.h include chain for encode paths); verified by conan test 2/2"

knowledge_gained:
  - "Skia uses GN+ninja; GitHub archive excludes third_party, requiring tools/git-sync-deps."
  - "googlesource / chrome-infra-packages unreachable from device -> P1 vendored complete tarball with file:// source."
  - "Only 9 of 46 DEPS externals are referenced by the minimal software-raster GN build graph (verified from out/*.ninja)."
  - "m146 GN args: skia_enable_gpu split into skia_enable_discrete_gpu + skia_enable_graphite; skia_use_system_harfbuzz and skia_use_d3d removed."
  - "OHOS hmdfs/SELinux: only prestaged ELF binaries (usr/local/bin, owner file_manager) are executable; user-copied ELF gets Permission denied -> never run gn on the device; pre-generate the ninja graph on the host instead."
  - "gn gen on Windows embeds host paths (D$:/... escapes) and cmd.exe stamps into the graph; a rewrite pass (relative paths, ': >' stamp, quoted <...> FT_CONFIG macros) is required before running ninja on OHOS."
  - "freetype in skia needs -DFT_CONFIG_MODULES_H=<freetype-android/...>; unquoted angle brackets make ninja invoke /bin/sh which treats < > as redirection -> quote the macro values in the graph."
  - "Windows .git read-only files make shutil.rmtree silently fail; chmod + onerror retry needed for pruning."
  - "SkPngEncoder.h pulls include/core/SkColorSpace.h -> modules/skcms/skcms.h (forwarder to src/skcms_public.h); package must ship modules/skcms/ under the package ROOT (includedirs=['.']) or consumer encode paths fail to compile."
