package: libskk/1.1.1
homepage: "https://github.com/ueno/libskk"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/rom-kana.c
    source: libskk-1.1.1/tests/rom-kana.c
    description: "Exercise romaji-to-kana conversion"
    command: "./tests/rom-kana"
  - file: tests/file-dict.c
    source: libskk-1.1.1/tests/file-dict.c
    description: "Exercise file dictionary lookup"
    command: "./tests/file-dict"
  - file: tests/user-dict.c
    source: libskk-1.1.1/tests/user-dict.c
    description: "Exercise user dictionary storage and completion"
    command: "./tests/user-dict"
  - file: tests/cdb-dict.c
    source: libskk-1.1.1/tests/cdb-dict.c
    description: "Exercise CDB dictionary lookup"
    command: "./tests/cdb-dict"
  - file: tests/skkserv.c
    source: libskk-1.1.1/tests/skkserv.c
    description: "Exercise the SKK server protocol"
    command: "./tests/skkserv"
  - file: tests/rule.c
    source: libskk-1.1.1/tests/rule.c
    description: "Exercise typing rule discovery and loading"
    command: "./tests/rule"
  - file: tests/context.c
    source: libskk-1.1.1/tests/context.c
    description: "Exercise context construction, input, output, and dictionaries"
    command: "./tests/context"
  - file: tests/basic.c
    source: libskk-1.1.1/tests/basic.c
    description: "Exercise SKK input state transitions"
    command: "./tests/basic"

test_package_tests:
  - file: test_package.c
    description: "Create a context, convert romaji to hiragana, and verify output and preedit"
    command: "./libskk_consumer"

assertion_count: 5
result: "5 consumer assertions passed on the HarmonyOS device."
