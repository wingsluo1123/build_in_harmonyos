# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsmb2/6.2
homepage: "https://github.com/sahlberg/libsmb2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libsmb2.c
    description: "消费者测试 - 调用 smb2_get_libsmb2Version/smb2_init_context/smb2_set_user/smb2_parse_url/smb2_destroy_context API"
    command: "./test_libsmb2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
