package: libsmpp34/1.14.4
homepage: "https://gitea.osmocom.org/cellular-infrastructure/libsmpp34"

upstream_check_command: "test_pdu/*_test.c + core.c"
upstream_test_in_build: false
upstream_test_command: "compile and run all test_pdu programs"
upstream_tests:
  - test_pdu 27 programs

test_package_tests:
  - file: test_smpp34.c
    description: "BIND_TRANSMITTER PDU pack/unpack 往返、命令 ID、序号与 system_id 断言"
    command: "clang test_smpp34.c -I<install>/include -L<install>/lib -lsmpp34 -lpthread -lrt"

assertion_count: 5
