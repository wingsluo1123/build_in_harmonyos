software: libsndfile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.2"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶层字段，供 verify-build 检查）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# 构建备注
build_note: "CMake 构建（避免 HMDFS autotools 临时文件问题）"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_C_FLAGS=-fPIC -O2"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DENABLE_EXTERNAL_LIBS=OFF"
    - "-DENABLE_MPEG=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 不支持 CMakeLists.txt 中 VERSION < 3.5 的兼容性，需添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "lld 链接器依赖 libxml2.so.16，需设置 LD_LIBRARY_PATH=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/lib"
  - "misc_test_* 测试失败是鸿蒙平台已知限制（E046: chmod 不生效），不影响核心功能"
  - "使用 CMake 构建可避免 HMDFS 文件系统的 autotools configure 临时文件问题"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
