software: libsndfile
version: "1.2.2"
status: built
build_system: cmake
build_date: "2026-05-29"

source:
  url: "https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz"
  sha256: "3799ca9924d3125038880367bf1468e53a1b7e3686a934f098b7e1d286cdb80e"
  tar_format: tar.xz

build:
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_PROGRAMS=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DENABLE_EXTERNAL_LIBS=OFF"
    - "-DENABLE_MPEG=OFF"
    - "-DINSTALL_MANPAGES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "The CMake build avoids the Autotools temporary-file path on HMDFS"
  - "Disabling optional codecs removes unpublished FLAC, Vorbis, Ogg, and Opus dependencies"
  - "The delivered package is a static libsndfile library without command-line programs"
