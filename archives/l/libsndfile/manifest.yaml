software: libsndfile
display: "libsndfile"
description: "A C library for reading and writing sampled audio files"
category: audio
homepage: "https://libsndfile.github.io/libsndfile/"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "使用 CMake 构建避免 HMDFS 文件系统的 autotools configure 临时文件问题"
    - "lld 链接器依赖 libxml2.so.16，需设置 LD_LIBRARY_PATH"
    - "CMake 4.x 需添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "misc_test_* 测试失败是 E046 平台限制（chmod 不生效），不影响核心功能"
  common_dependencies: []

versions:
  "1.2.2":
    status: published
    build_date: "2026-05-29"