# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsodium/1.0.22
homepage: "https://libsodium.org/"

# 上游测试命令 — libsodium uses autotools, has `make check`
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/default/*.c
    source: libsodium-1.0.22/test/default/
    description: "libsodium 自带测试套件 (test/default/)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_libsodium.c
    description: "API 冒烟测试: sodium_init() + sodium_library_version_string()"
    command: "./test_libsodium"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
