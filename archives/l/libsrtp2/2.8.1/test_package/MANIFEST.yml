package: libsrtp2/2.8.1
homepage: https://github.com/cisco/libsrtp
upstream_check_command: "ctest --output-on-failure -V --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -V --no-tests=error"
upstream_test_count: 12
upstream_tests:
  - file: CMakeLists.txt
    source: libsrtp-2.8.1/CMakeLists.txt
    description: "All 12 internal-backend CTest entries: AES-128/256, SHA1, datatypes, cipher, kernel, rdbx, replay, ROC, SRTP driver, test_srtp and rtpw"
    command: "ctest --output-on-failure -V --no-tests=error"
test_package_tests:
  - file: consumer.c
    description: "Installed SRTP/SRTCP API; tamper rejection without replay-state corruption, replay rejection and private OHOS encrypted-packet file roundtrip"
    command: "./bin/consumer"
assertion_count: 21
