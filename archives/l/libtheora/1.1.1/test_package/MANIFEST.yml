# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libtheora/1.1.1
homepage: "https://gitlab.xiph.org/xiph/theora"

# 上游测试命令 (libtheora 使用 autotools, 上游有 make check)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libtheora 上游 autotools 有测试套件，但本构建使用 CMake 替代，未集成上游测试
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_theora.c
    description: "调用 theora_version_string() 和 theora_info_init/clear() 验证库链接"
    command: "./test_theora"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
