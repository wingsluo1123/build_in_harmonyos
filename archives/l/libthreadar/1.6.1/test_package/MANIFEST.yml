package: libthreadar/1.6.1
homepage: "https://github.com/Edrusb/libthreadar"

# Full source audit: one manual upstream test case; no registered make-check cases.
upstream_test_in_build: true
upstream_test_command: "doc/examples/test_barrier (explicit run after make)"
upstream_test_status: pass
upstream_test_reason: >-
  PASS in the clean local Linux x86_64 conan create validation run;
  UPSTREAM-CASE reported workers=10. This is not an OHOS device result.
upstream_tests:
  - file: doc/examples/test_barrier.cpp
    case_count: 1
    status: pass
    reason: >-
      PASS: clean local validation create reported
      UPSTREAM-CASE test_barrier: PASS (workers=10); device execution was not
      performed because the two-hop device tunnel 127.0.0.1:2200 was down as
      of 06:05 CST and this session was explicitly NO-DEVICE.
    description: "One manual ten-worker barrier scenario; the ten participants are not separate cases."
    command: "doc/examples/test_barrier"

upstream_registered_test_targets: []
upstream_non_test_examples:
  - "hello_world"
  - "stack_sizer"
  - "fast_tampon_example.cpp"
  - "thread_example.cpp"
  - "barrier_example.cpp"
  - "condition_example.cpp"

test_package_status: pass
test_package_reason: >-
  The clean local validation create completed package() and test_package on
  Linux x86_64: the header relocation scan and six consumer cases passed.
  Device execution was not performed because the two-hop tunnel
  127.0.0.1:2200 was down as of 06:05 CST and this session was explicitly
  NO-DEVICE.
test_package_tests:
  - file: conanfile.py
    case_count: 1
    cases:
      - name: package_header_relocation
        status: pass
        reason: "PASS: TEST-PACKAGE-CASE package_header_relocation: PASS headers=15 absolute_includes=0 in the clean local validation create."
    description: "Scan installed public headers for absolute include directives that would retain the configured Conan package prefix."
  - file: test_package.cpp
    case_count: 6
    cases:
      - name: condition_lock_unlock
        status: pass
        reason: "PASS: TEST-PACKAGE-CASE condition_lock_unlock: PASS in the clean local validation create."
      - name: thread_run_join_restart
        status: pass
        reason: "PASS: TEST-PACKAGE-CASE thread_run_join_restart: PASS in the clean local validation create."
      - name: thread_cooperative_cancel
        status: pass
        reason: "PASS: TEST-PACKAGE-CASE thread_cooperative_cancel: PASS in the clean local validation create."
      - name: mutex_concurrency
        status: pass
        reason: "PASS: TEST-PACKAGE-CASE mutex_concurrency: PASS in the clean local validation create."
      - name: semaphore_accounting
        status: pass
        reason: "PASS: TEST-PACKAGE-CASE semaphore_accounting: PASS in the clean local validation create."
      - name: barrier_rendezvous
        status: pass
        reason: "PASS: TEST-PACKAGE-CASE barrier_rendezvous: PASS in the clean local validation create."
    description: "Consumer checks for condition lock/unlock, thread run/join/restart/cooperative cancellation, mutex concurrency, semaphore accounting, and barrier rendezvous."
    command: "test_libthreadar"

assertion_count: 7
declared_total_case_count: 8

