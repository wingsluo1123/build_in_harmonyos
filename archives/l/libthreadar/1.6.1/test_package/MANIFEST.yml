  upstream_summary: "UPSTREAM-SUMMARY total=1 pass=1 fail=0"
  consumer_summary: "TEST-PACKAGE-SUMMARY total=6 pass=6 fail=0 notrun=0"
  header_scan_output: "TEST-PACKAGE-CASE package_header_relocation: PASS headers=15 absolute_includes=0"
  exact_recipe_create: >-
    A separate fresh Conan 2.29.1 create of the tracked recipe stopped before
    libthreadar build(): the pinned automake/1.18 source archive at
    https://ftp.gnu.org/gnu/automake/automake-1.18.tar.gz timed out after
    retries. This was a build-requirement download failure, not a case result.
  previous_ci_failure: >-
    CI #98075 / Buildbot build 112717 on head
    7977822e095e5b7142ded1367b11afba96171c4d failed during configure before any
    case ran: config.guess line 1613 could not write
