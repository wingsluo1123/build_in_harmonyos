# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libtwirc/0.1.2
homepage: "https://github.com/domsson/libtwirc"

# 上游无 configure/Makefile，只有手写编译脚本 build-shared/build-static；
# 无 tests/ 目录、无 make check / ctest 注册项（R51 清点：上游零测试）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试，列表为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：twirc_init/get_last_error/is_connected/kill 无网络 API 冒烟"
    command: "./test_libtwirc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
