# MANIFEST.yml — libu2f-host 1.1.10 test_package declaration
# Upstream test inventory (truthful, not fabricated)

package: libu2f-host/1.1.10
homepage: "https://github.com/Yubico/libu2f-host"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  entries: 1
  list:
    - "tests/basic"
  note: "tests/basic exercises the header/library version API, strerror helpers and device discovery; device discovery tolerates the absence of a physical U2F key (U2FH_NO_U2F_DEVICE)"

consumer_tests:
  test_consumer.c: 1
  assertions: 4
  description: "Compile+link against libu2f-host, call u2fh_check_version/u2fh_global_init/u2fh_strerror_name/u2fh_devs_init (read-only, no hardware)"
  read_only_entries:
    - "u2f-host --version"
