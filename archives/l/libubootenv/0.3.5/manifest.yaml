  dependencies:
    - zlib/1.3.1
    - libyaml/0.2.5

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息 (inline replace_in_file in conanfile.py build())
# ============================================================

patches_applied:
  - type: inline
    description: "cmake_minimum_required 2.6 → 3.5 (CMake 4.x compat)"
    files:
      - CMakeLists.txt
      - src/CMakeLists.txt
  - type: inline
    description: "SONAME explicit LINKER:-soname,libubootenv.so (CMake ignores VERSION/SOVERSION)"
    files:
      - src/CMakeLists.txt
  - type: inline
    description: "Conan dependency paths injected at build() stage"
    files:
      - src/CMakeLists.txt
  - type: inline
    description: "OHOS SDK <mtd/ubi-user.h> bug — skip include, provide UBI stubs"
    files:
      - src/uboot_env.c

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libubootenv 使用 CMake 构建系统；cmake_minimum_required 2.6 与 CMake 4.x 不兼容，需提升至 3.5"
  - "CMake 在 OHOS 平台忽略 VERSION/SOVERSION 属性，必须显式 target_link_options(LINKER:-soname,...) 设置 SONAME"
  - "OHOS SDK <mtd/ubi-user.h> 头文件存在 __packed 重定义 bug，需用 __OHOS__ 宏跳过并提供桩结构"
  - "OHOS 无 UBI 子系统；libuboot_initialize(&ctx, NULL) 可在无 MTD 设备情况下纯内存工作"
  - "Conan find_package(zlib/libyaml) 在 OHOS 交叉编译下失效；需在 build() 阶段获取 cpp_info 路径后注入 CMake"

