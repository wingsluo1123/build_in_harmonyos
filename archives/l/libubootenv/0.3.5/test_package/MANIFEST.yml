# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libubootenv/0.3.5
homepage: "https://github.com/sbabic/libubootenv"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: <NONE>
    source: <NONE>
    description: "上游源码无自动化测试入口（无 tests/ 目录、ctest、unittest）"
    command: "<NONE>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ubootenv.c
    description: "消费者API测试 — 链接期依赖包库，调用 libuboot_initialize/exit/set_env/get_env/iterator"
    command: "LD_LIBRARY_PATH=... ./test_ubootenv"
  - file: test_dlopen.c
    description: "鸿蒙特有运行时测试 — dlopen 加载共享库，解析 5 个关键符号，验证 SONAME 和传递依赖可解析"
    command: "LD_LIBRARY_PATH=... ./test_dlopen <libubootenv.so>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
