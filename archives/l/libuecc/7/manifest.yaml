software: libuecc
# 版本级 manifest
# 文件位置: archives/l/libuecc/7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://git.universe-factory.net/fastd/libuecc/archive/v7.tar.gz"

  # 源码校验和
  sha256: "80ef381fae912db88a33ebe1b4c7a722b98ed3b1939f75415068b025c5675818"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 来兼容 cmake_minimum_required(VERSION 2.6)"
  - "Conan 2.12 版本正则要求版本号至少2字符，单数字版本需用 N.0 格式"
  - "CMakeToolchain 的 cache_variables 传递为 -D 命令行参数，variables 写入 toolchain 文件"
  - "libuecc 头文件安装在 include/libuecc-7/ 子目录，需设置 cpp_info.includedirs"
