# conandata.yml — libusb 1.0.27
#
# Source is the upstream *release* tarball (it already contains `configure`,
# `config.guess` and `config.sub`, so no autoreconf step is needed).
#
# Every patch listed below was generated against that exact release tarball and
# is verified to apply cleanly, in the declared order, with `patch -p1`.

sources:
  url: "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2"
  sha256: "ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Refresh config.guess (2025-07-10) so HarmonyOS/OHOS is recognised"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Refresh config.sub (2025-07-10) to accept the ohos-linux triplet"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-umask.patch"
    patch_description: "Relax config.status temp dir umask 077 -> 022 for HMDFS (E112)"
    patch_type: "bugfix"
  - patch_file: "patches/0002-libusb-os-linux_netlink.c.patch"
    patch_description: "Avoid sockaddr_storage redefinition between linux/socket.h and sys/socket.h (E091)"
    patch_type: "portability"
  - patch_file: "patches/0003-libusb-os-linux_usbfs.c.patch"
    patch_description: "Parse 'HongMeng Kernel X.Y.Z' uname release and report a modern Linux version"
    patch_type: "portability"
