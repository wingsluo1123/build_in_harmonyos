software: libusb
name: libusb
version: "1.0.27"
status: built
build_date: "2026-06-24"
compile_date: "2026-06-24"
build_system: autotools

build:
  system: autotools

source:
  url: "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2"
  sha256: "ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575"
  tar_format: tar.bz2

configure_options: "--disable-udev --disable-examples-build --disable-tests-build"

# Conan 配方（conandata.yml）实际应用的补丁。
# 说明：0001-configure.patch 是针对 autoreconf 重新生成的 configure 制作的，
# 与上游 release tarball 行号不符，已由 0004-configure-umask.patch 取代
# （相同的 umask 077 -> 022 修复，针对 release tarball 重新生成）。
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0004-configure-umask.patch"
  - "0002-libusb-os-linux_netlink.c.patch"
  - "0003-libusb-os-linux_usbfs.c.patch"

patch_generation:
  method: per-file-difflib
  # 补丁直接针对上游 release tarball（sha256 见 source 段）生成，
  # 不经过 autoreconf，因此行号与发布包完全一致。
  source_reference: "upstream release tarball libusb-1.0.27.tar.bz2"
  generated_at: '2026-08-02T22:10:00'
  patches_count: 5

# 与 patches_applied 一一对应。guard 说明补丁如何做平台适配：
# 按项目规则 R8，补丁不得引入任何平台条件编译宏，
# 只能使用运行时检测，或无条件且跨平台等价的写法。
patch_classification:
  - file: 0001-config.guess.patch
    type: build-aux-refresh
    platform_only: false
    guard: none
    note: "刷新 config.guess 至 2025-07-10（上游 GNU 版本），无平台分支"
  - file: 0002-config.sub.patch
    type: build-aux-refresh
    platform_only: false
    guard: none
    note: "刷新 config.sub 至 2025-07-10，使其接受 linux-ohos triplet"
  - file: 0004-configure-umask.patch
    type: bugfix
    platform_only: false
    guard: none
    note: "config.status 临时目录 umask 077 -> 022，所有平台等价且安全"
  - file: 0002-libusb-os-linux_netlink.c.patch
    type: portability
    platform_only: false
    guard: unconditional-rename
    note: >
      包含 <linux/netlink.h> 期间无条件把 UAPI 的 sockaddr_storage 临时改名，
      随后 #undef 撤销。本文件只使用 struct sockaddr_nl，改名对代码无影响，
      在所有平台行为一致，不含平台条件编译宏。
  - file: 0003-libusb-os-linux_usbfs.c.patch
    type: portability
    platform_only: false
    guard: runtime-detection
    note: >
      通过 strstr(uts.release, "HongMeng") 运行时判断内核标识，
      非鸿蒙平台走原有解析逻辑，无编译期平台分支。

functional_testing:
  date: "2026-06-24"
  report: "reports/functional-test-report.md"
  result: "pass"
  pass_rate: "87.5%"
  tests_passed: 7
  tests_failed: 1
  tests_skipped: 0
  notes: >
    核心功能全部可用。唯一失败为热插拔回调注册（netlink socket
    在鸿蒙沙箱中不可用，属平台限制非代码缺陷）。
    发现并修复鸿蒙内核版本解析问题（get_kernel_version
    无法解析 'HongMeng Kernel 1.12.0' 格式）。
    推荐使用 LIBUSB_OPTION_NO_DEVICE_DISCOVERY 初始化。

platform_notes:
  - "默认初始化失败：sysfs /sys/bus/usb/devices/ 不可访问（SELinux errno=13）"
  - "热插拔不可用：netlink socket 在沙箱中受限（errno=9 EBADF）"
  - "推荐初始化方式：libusb_init_context + LIBUSB_OPTION_NO_DEVICE_DISCOVERY"
  - "动态链接和静态链接均可正常使用"

knowledge_gained:
  - id: E091
    description: "sockaddr_storage 重定义冲突（linux/socket.h UAPI vs sys/socket.h libc）"
    fix: >
      包含 <linux/netlink.h> 期间无条件将 sockaddr_storage 临时改名，
      include 结束后 #undef 撤销；不使用平台条件编译宏（符合 R8）。
  - id: E112
    description: "HMDFS umask 077 导致 config.status 临时目录权限异常"
    fix: "补丁把 configure 生成的 config.status 中 umask 077 改为 022"
  - description: "HongMeng 内核版本格式 'HongMeng Kernel X.Y.Z' 无法被 libusb get_kernel_version() 解析"
    fix: >
      运行时 strstr(uts.release, "HongMeng") 检测后回报兼容的 5.10.0 版本号；
      非鸿蒙平台保持上游原逻辑，不使用平台条件编译宏（符合 R8）。
