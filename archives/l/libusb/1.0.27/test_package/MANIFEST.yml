package: libusb/1.0.27
homepage: https://libusb.info/

upstream_test_in_build: true
upstream_test_command: "make -j1 check"
upstream_tests:
  - tests/stress
  - tests/stress_mt
  - tests/set_option
  - tests/init_context

test_package_tests:
  - file: test_libusb.c
    description: "Compile and run libusb version, capability, and error API checks"
    command: "./test_libusb"

assertion_count: 4
