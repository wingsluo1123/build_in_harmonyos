software: libuser
display: "libuser"
description: "用户与组账户管理的标准化接口库（libuser）及 luseradd/lusermod 等账户工具"
category: system
homepage: "https://pagure.io/libuser/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建；Python/LDAP/SASL/SELinux/audit 后端按 OHOS 运行时裁剪关闭"
    - "glib/popt/PAM 由 Conan 依赖提供（PKG_CHECK_MODULES 需 PkgConfigDeps 补 .pc）"
    - "后端模块目录经上游原生 LIBUSER_CONF 机制指向包内，无源码补丁"
  common_dependencies:
    - glib
    - popt
    - linux-pam

versions:
  "0.64-git20241106-dfsg":
    status: built
    build_date: "2026-09-26"
