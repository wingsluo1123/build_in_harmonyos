# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.0"

# 软件名
software: "libvalkey"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/valkey-io/libvalkey"

  # 源码校验和（官方 0.5.0 标签归档 tarball）
  sha256: "f70d254f751b98b5539f32bcf696e8cc8888b8d62f853d2cac7b532b3b5acdc7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（R01: reuse_existing 路径 A；R02 新增 #66 NXDOMAIN 修复候选 → new_draft 路径 B）
knowledge_gained:
- "libvalkey 0.5.0 为纯 GNU Make 构建（无 configure 脚本），conanfile 需用 makefile 模板并在 source_folder 下执行 make（basic_layout 的 build-release 子目录不含 Makefile） ref: E392"
- "conan.tools.files 无 remove()，删除包内文件须用 rm() ref: E392"
- "静态模式（shared=False）需在 package() 中删除 .so 与符号链接，避免消费者运行时把同名 .so 当作动态依赖而解析到错误符号 ref: DRAFT-json-parser-1.1.0-cmakedeps-dual-lib-form-symbol-not-found"
- "test_package 消费者测试须直接运行二进制并传 env=conanrun（ctest 不带包内 lib 路径，运行时符号解析失败） ref: E298"
- "GitHub 直连超时时用 codeload.github.com 官方下载通道取 tarball；conan-verify 自动注入 ghfast.top 镜像 ref: E392"
- "基线中其他库误提交的空状态文件（.build-closed/.staging-verified）触发 JC 拦截，需按基线隔离规则做 index 级临时隔离、复验后无条件恢复 ref: DRAFT-kdbusaddons-baseline-noise-isolation"
- "R02: 客户端库双族 getaddrinfo 回退在平台 AF_INET6 解析系统级失败（EAI_SYSTEM）时覆盖白名单 errstr（#66 NXDOMAIN），改为 AF_UNSPEC 单次回退修复（patches/0001-src-net.c.patch）→ 新建草稿 ref: DRAFT-libvalkey-0.5.0-net-af_unspec-fallback"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libvalkey-0.5.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libvalkey-0.5.0.work
  source_orig_hash: 663fa9e737ebe521
  source_work_hash: 181459b17698f1fa
  generated_at: '2026-09-27T19:40:20'
  patches_count: 1

patch_classification:
  - file: 0001-src-net.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
