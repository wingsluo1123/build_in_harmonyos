# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libvalkey/0.5.0
homepage: "https://github.com/valkey-io/libvalkey"

# 上游测试命令：Makefile 无 check 目标（make check 为空操作），
# 实际测试入口为 `make tests` 生成的单元测试二进制与 tests/test.sh 集成脚本
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机实测结果）
upstream_tests:
  - file: ut_parse_cmd.c
    source: libvalkey-0.5.0/tests/ut_parse_cmd.c
    description: "命令参数解析单元测试（不依赖服务器）"
    command: "./tests/ut_parse_cmd"
    result: "PASSED (exit 0)"
  - file: ut_slotmap_update.c
    source: libvalkey-0.5.0/tests/ut_slotmap_update.c
    description: "cluster slotmap 更新单元测试（不依赖服务器）"
    command: "./tests/ut_slotmap_update"
    result: "PASSED (exit 0)"
  - file: ut_connect_fallback.c
    source: libvalkey-0.5.0/tests/ut_connect_fallback.c
    description: "连接地址回退单元测试（ECONNREFUSED 后回退下一地址，不依赖服务器）"
    command: "./tests/ut_connect_fallback"
    result: "PASSED (exit 0)"
  - file: client_test.c
    source: libvalkey-0.5.0/tests/client_test.c
    description: "客户端/协议解析测试：真实启动 valkey-server（redis 8.2.7，127.0.0.1:56379）后跑 TCP/Unix/超时/吞吐集成段；#66 NXDOMAIN 已修复为 PASSED"
    command: "./tests/client_test -h 127.0.0.1 -p 56379 -s <sock>"
    result: "PASSED 112 项 / FAILED 0 / SKIPPED 3（Unix socket 段因 HMDFS 拒绝 AF_UNIX bind 跳过）"

# test_package 中自带的测试（消费者视角验证，R34：实际调用被测包公共 API）
test_package_tests:
  - file: test.c
    description: "消费者测试：valkeyReader 投喂 RESP2 简单字符串并断言解析结果（调用 valkeyReaderCreate/Feed/GetReply/freeReplyObject）"
    command: "./test_libvalkey"
  - file: harmonyos_specific_test.c
    description: "鸿蒙特有测试（R02 新增）：(1) 真机 TCP 栈 + PING 往返（valkeyConnect/valkeyCommand 真实调用）；(2) HMDFS 用户目录 AF_UNIX 受限行为（库优雅返回非致命错误）"
    command: "./harmonyos_specific_test <host> <port> <unix_sock_path>"
    result: "PASSED (exit 0，0 failures)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 78