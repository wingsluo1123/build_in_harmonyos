# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libvdeplug/4.0.1
homepage: "https://github.com/rd235/vdeplug4"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游为纯 CMake 工程，无 CTest 声明、无 make check 目标
upstream_check_command: "ctest -N (无结果：上游未声明任何测试)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 清点证据 (v4.0.1 tag archive, sha256 2299fb2f...d57a)：
#   - 源码树无 tests/ 目录（仅 doc/include/libvdeplug4/libvdeplug4_static/
#     man/srcvdeplug4 七个目录）
#   - 全部 5 个 CMakeLists.txt 中无 add_test()/enable_testing()（grep 0 命中）
#   - 无任何 *test*.c / check 目标；上游README亦未提及测试流程
# 结论：上游无自动化测试入口，无可运行用例；以 test_package 消费者测试补位
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 / 鸿蒙新增用例)
test_package_tests:
  - file: test.c
    description: "OHOS 消费者测试：vde_open(null://) 插件 dlopen -> vde_send 全帧 -> datafd/ctlfd -> vde_close；负例：未知 scheme 必须失败"
    command: "./test_libvdeplug"

# 测试断言总数 (CHECK 宏断言)
assertion_count: 7
