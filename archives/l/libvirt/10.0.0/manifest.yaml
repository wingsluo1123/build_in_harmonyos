# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://libvirt.org/sources/libvirt-10.0.0.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统工具
  build_system: meson
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Ddocs=disabled"
    - "-Dtests=disabled"
    - "-Dc_args=-fPIC -O2 -D__KERNEL_STRICT_NAMES"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.88.0
    - libxml2/2.15.3

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl libc 不支持 RPC 头文件（rpc/types.h），需禁用 RPC 测试"
  - "GLib 2.88.0 宏兼容性问题已通过修改 glibcompat.h 解决"

