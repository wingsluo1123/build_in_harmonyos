    PKG_CONFIG_PATH: "/storage/Users/currentUser/usr/local/lib/pkgconfig:/storage/Users/currentUser/usr/local/share/pkgconfig"
    AR: "llvm-ar"
    STRIP: "llvm-strip"
    NM: "llvm-nm"
