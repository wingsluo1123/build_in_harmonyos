# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: libvldmail/1.2.2
homepage: "https://code.rosaelefanten.org/libvldmail/dir"

# 上游测试命令（CMake 项目，LIBVLDMAIL_TESTS=ON 时注册 ctest 用例）
upstream_check_command: "ctest --test-dir build-tests -C Debug"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test.c + autotest-cases，1 个 ctest 用例，11 个断言）
upstream_tests:
  - file: test.c
    source: libvldmail-release-1.2.2/test.c
    description: "电子邮件校验测试套件（autotest-cases 11 项：有效/无效/Unicode/带引号/IPv4/IPv6/注释）"
    command: "./vldmailtest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 validate_email API（4 项断言：有效/无效/带IP/空域）"
    command: "./test_libvldmail"

# 测试断言总数（上游 11 + test_package 4）
assertion_count: 15
