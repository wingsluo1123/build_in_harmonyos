tests:
  - name: libvorbis-consumer-smoke
    type: conan-test-package
    file: test_libvorbis.c
    assertions:
      - vorbis_version_string returns a non-empty Vorbis version
      - vorbis_encode_init_vbr initializes encoder settings
      - vorbis_comment_add_tag stores a user comment
      - vorbisfile symbol is linkable without real media input
