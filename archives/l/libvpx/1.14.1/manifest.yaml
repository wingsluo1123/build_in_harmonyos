software: libvpx
version: 1.14.1
status: built
category: multimedia
description: VP8/VP9 video codec library

compile_info:
  build_system: custom
  configure_options:
    - --prefix=/storage/Users/currentUser/usr/local
    - --target=arm64-linux-gcc
    - --disable-examples
    - --disable-tools
    - --disable-docs
    - --disable-unit-tests
    - --enable-pic
  build_date: 2026-05-30
  
env_vars:
  LD_LIBRARY_PATH: "/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/lib:/storage/Users/currentUser/usr/local/lib"
  
platform_specific:
  - issue: OHOS SDK lld linker requires libxml2.so.16
    solution: Set LD_LIBRARY_PATH to include SDK's llvm/lib directory
    note: Critical for configure step
    env_required: true
    
artifacts:
  libs:
    - libvpx.a (static library)
    - libvpxrc.a (rate control library)
  headers:
    - vpx/*.h (codec headers)
  pkgconfig:
    - vpx.pc

quality_gate:
  G0: PASS (clean build verified with env.sh setup)
  G1: PASS (binary integrity)
  G2: PASS (functionality - pkg-config verified)
  G3: PASS (portability - static lib, no RPATH issues)
  G4: PASS (packaging complete with tar.gz)
  
knowledge_gained:
  - OHOS SDK lld requires libxml2.so.16, need LD_LIBRARY_PATH setup
  - Environment固化 via hints/env.sh and manifest.yaml env_vars
  
packaging:
  main: libvpx-1.14.1-ohos-aarch64.tar.gz (6.4MB)
  debug: libvpx-1.14.1-ohos-aarch64-debug.tar.gz (441KB)