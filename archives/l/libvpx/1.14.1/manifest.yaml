software: libvpx
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.14.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.14.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/webmproject/libvpx/archive/refs/tags/v1.14.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom  # libvpx 使用自定义 configure 脚本（非标准 autotools）

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--target=arm64-linux-gcc"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libvpx 使用自定义 configure 脚本（非标准 autotools），需指定 --target=arm64-linux-gcc"
  - "链接器 lld 需要 ohos-sdk llvm/lib 路径，否则报错 Toolchain is unable to link executables"
  - "GitHub tarball 可能缺少 build/make/ 目录，需从 orig 复制"
  - "G0 干净构建验证需创建 hints/environment.sh 固化环境依赖"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
software: libvpx
version: 1.14.1
status: built
category: multimedia
description: VP8/VP9 video codec library

compile_info:
  build_system: custom
  configure_options:
    - --prefix=/storage/Users/currentUser/usr/local
    - --target=arm64-linux-gcc
    - --disable-examples
    - --disable-tools
    - --disable-docs
    - --disable-unit-tests
    - --enable-pic
  build_date: 2026-05-30
  
env_vars:
  LD_LIBRARY_PATH: "/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/lib:/storage/Users/currentUser/usr/local/lib"
  
platform_specific:
  - issue: OHOS SDK lld linker requires libxml2.so.16
    solution: Set LD_LIBRARY_PATH to include SDK's llvm/lib directory
    note: Critical for configure step
    env_required: true
    
artifacts:
  libs:
    - libvpx.a (static library)
    - libvpxrc.a (rate control library)
  headers:
    - vpx/*.h (codec headers)
  pkgconfig:
    - vpx.pc

quality_gate:
  G0: PASS (clean build verified with env.sh setup)
  G1: PASS (binary integrity)
  G2: PASS (functionality - pkg-config verified)
  G3: PASS (portability - static lib, no RPATH issues)
  G4: PASS (packaging complete with tar.gz)
  
knowledge_gained:
  - OHOS SDK lld requires libxml2.so.16, need LD_LIBRARY_PATH setup
  - Environment固化 via hints/env.sh and manifest.yaml env_vars
  
packaging:
  main: libvpx-1.14.1-ohos-aarch64.tar.gz (6.4MB)
  debug: libvpx-1.14.1-ohos-aarch64-debug.tar.gz (441KB)