# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libwapcaplet/0.4.3
homepage: "https://www.netsurf-browser.org/projects/libwapcaplet/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/testsuite.c
    source: libwapcaplet-0.4.3/test/testsuite.c
    description: "NetSurf test suite for libwapcaplet (requires libcheck)"
    command: "./test_testrunner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证字符串内化、比较、子串等核心API"
    command: "./test_libwapcaplet"

# 测试断言总数 (近似值)
assertion_count: 7
