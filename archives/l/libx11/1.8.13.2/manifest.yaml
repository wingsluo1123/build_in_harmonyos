software: libx11
version: "1.8.13.2"
status: built
build_date: "2026-10-18"
conan_ref: "libx11/1.8.13.2"
build_system: autotools

source:
  url: "https://xorg.freedesktop.org/archive/individual/lib/libX11-1.8.13.tar.xz"
  sha256: "69606f485c2c07c14ef64f75b7bb326d48587af33795d9ab3e607c0b5f94f11c"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--without-xmlto"
    - "--without-fop"
    - "--without-xsltproc"
    - "--enable-shared"
    - "--disable-static"
  dependencies:
    - "xorgproto/2025.1"
    - "libxau/1.0.12"
    - "libxcb/1.17.0.1"
    - "xtrans/1.4.0"
    - "xcb-proto/1.17.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS 下 configure 需 umask 077→022（E002/HMDFS）及 bash shebang 替换"
  - "config.guess 无法识别 HarmonyOS 时，需补充 --build/--host=aarch64-unknown-linux-gnu"
  - "libX11 1.8.13 上游 make check 运行 nls/compose-check.pl（Perl 测试）"
  - "libX11-xcb.so 由上游无条件构建（AC_CONFIG_FILES 含 x11-xcb.pc，X11_REQUIRES 固定 xcb>=1.11.1，无 AC_ARG_ENABLE(xcb)），暴露给下游只需 depends libxcb + package_info libs 追加 X11-xcb；--enable-xcb 是 unrecognized 选项"
