sources:
  url: "https://github.com/besser82/libxcrypt/releases/download/v4.4.36/libxcrypt-4.4.36.tar.xz"
  sha256: "e5e1f4caee0a01de2aee26e3138807d6d3ca2b8e67287966d1fefd65e1fd8943"

patches:
  - patch_file: "patches/0001-build-aux-m4-autogen-config.guess.patch"
    patch_type: "portability"
    patch_description: "Recognize HarmonyOS and emit the linux-ohos target tuple"
  - patch_file: "patches/0002-build-aux-m4-autogen-config.sub.patch"
    patch_type: "portability"
    patch_description: "Accept linux-ohos target tuples in config.sub"
  - patch_file: "patches/0003-configure.patch"
    patch_type: "portability"
    patch_description: "Use Conan's verified writable TMPDIR and HMDFS-compatible permissions for Autoconf scratch files"
  - patch_file: "patches/0004-lib-util-xbzero-clang-asm.patch"
    patch_type: "portability"
    patch_description: "Use Clang __asm__ with a pointer input and memory clobber to avoid VLA warnings; keep the GCC VLA implementation"
