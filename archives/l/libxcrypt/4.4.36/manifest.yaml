  - "libxcrypt 4.4.36 is an Autotools project; configure remains the build entry point"
  - "OHOS requires linux-ohos target tuple support in config.guess/config.sub"
  - "Conan verifies source/build writability and sets TMPDIR inside the build folder before configure"
  - "The configure scratch directory uses TMPDIR and umask 022 for HMDFS compatibility"
  - "Clang uses __asm__ for OBSERVE_MEM to avoid -Wlanguage-extension-token under -Werror"
