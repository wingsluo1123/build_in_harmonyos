software: libxcrypt
display: "libxcrypt"
description: "Modern extended crypt library supporting descrypt, md5crypt, bcrypt, and sha256crypt/sha512crypt"
category: crypto
homepage: "https://github.com/besser82/libxcrypt"
license: LGPL-2.1-or-later
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "配方验证可写目录并使用 umask 022 运行 configure，避免修改生成的 configure"
    - "需要修补 config.guess/config.sub 添加 HarmonyOS 平台识别"
    - "Clang 使用 __asm__、指针输入和 memory clobber 规避 GNU asm 扩展及 VLA 警告"
  common_dependencies: []

# 版本索引
versions:
  "4.4.36":
    status: built
    build_date: "2026-07-27"
