sources:
  "6.4.0.1.1":
    # Conan historical package version maps to the libXext.so.6.4.0 ABI.
    # The matching upstream source release is libXext 1.3.6.
    # .1.1 is a recipe revision only: repins libx11 to 1.8.13 (force=True)
    # to publish the dependency-closure variant every libxmu/libxt
    # consumer resolves to; upstream tarball/sha256 unchanged.
    upstream_version: "1.3.6"
    url: "https://xorg.freedesktop.org/releases/individual/lib/libXext-1.3.6.tar.xz"
    sha256: "edb59fa23994e405fdc5b400afdf5820ae6160b94f35e3dc3da4457a16e89753"
