software: libxfce4ui
# 版本级 manifest
# 文件位置: archives/l/libxfce4ui/4.20.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "4.20.0"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-15"

# 构建系统类型 (顶层字段)
build_system: autotools

source:
  url: "https://archive.xfce.org/src/xfce/libxfce4ui/4.20/libxfce4ui-4.20.0.tar.bz2"
  sha256: "75e8996984f20375aadecd5c16f5147c211ed0bd26d7861ab0257561eb76eaee"
  tar_format: tar.bz2

build:
  toolchain: "OHOS clang 15 (aarch64-linux-ohos) / GNU Autotools"
  command: "configure + make -j2"
  parallel: 2
  flags: ""
  # patch 0001（仅预生成产物）：顶层 SUBDIRS 剔除 libxfce4kbd-private/
  # xfce4-about/glade/docs/tests；libxfce4ui/Makefile.in 剔除
  # xfce-screensaver.{c,h}（唯一 xfconf 引用文件，公共 API 移除已文档化）；
  # configure 的 XFCONF 探测 stub 化 + config.status mktemp 模板 el2 化
  # （HMFS setgid 目录 bug，garcon 4.20.0 先例）。

test:
  framework: shell
  command: "test_package/test.c 编译执行"
  # 上游 tests/ 链接剔除的子目录（N=0，审计见 test_package/MANIFEST.yml）
  total_cases: 3
  passed_cases: 3
  failed_cases: 0
  skipped_cases: 0
  notes: >-
    上游 libxfce4ui 4.20.0 的 tests/ 程序链接本适配剔除的
    libxfce4kbd-private——N=0 可注册用例，逐文件审计见
    test_package/MANIFEST.yml。功能验证由消费者冒烟补全：版本宏一致性
    （4.20.0 断言）、XfceTitledDialog GType 注册往返（GObject class_init
    链路）、CHECK_VERSION 宏共 3 用例真编译真执行真断言。

artifacts:
  - name: libxfce4ui-2
    type: shared-library
    path: lib/libxfce4ui-2.so

dependencies:
  runtime:
    - name: glib
      version: "2.84.0.1"
      reason: "GLib/GObject/GIO 基础"
    - name: gtk
      version: "3.24.43"
      reason: "GTK3（.pc Requires）"
    - name: libxfce4util
      version: "4.20.1"
      reason: "XFCE 基础库（.pc Requires）"
  build: []

environment:
  os: OHOS
  arch: arm64
  build_env: "OpenHarmony PC (aarch64), conan 2.29.1 OHOS-adapted"
