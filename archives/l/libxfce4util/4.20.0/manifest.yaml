source:
  url: "https://archive.xfce.org/src/xfce/libxfce4util/4.20/libxfce4util-4.20.0.tar.bz2"
  sha256: "21493f9c9995a282823db93839f6b9f06ae31edb094191ba9acf04d932a2b592"
dependencies:
  - glib/2.84.0.1
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-disable-nls-i18n-guards.patch"
knowledge_gained:
  - "纯 autotools 发布包：无 glib host 工具需求（无 gdbus-codegen/mkenums/genmarshal），可见性工具随 tarball 自带"
  - "--disable-nls 规避 AM_GNU_GETTEXT([external]) 的 host libintl 依赖（E015/E027）；但 xfce-i18n.c/libxfce4util-private.c 的 textdomain 调用上游无守卫，proxy-libintl 头会重绑为 g_libintl_*，须以 0004 补丁加 ENABLE_NLS 守卫，否则消费者 lld --no-allow-shlib-undefined 链接必失败（供给 DSO 在 glib 包内、链接行定位不到；绝对路径注入 LDFLAGS 又会打挂 configure conftest 运行检查）"
  - "xfce4-kiosk-query 仅链接 libtool .la，依赖 glib libdir 经 .la dependency_libs 隐式传递；配方以显式 -L 注入满足 lld 链接闭包定律（build-chain-pitfalls 共享库链接闭包节）"
  - "上游无测试套件：无 tests/ 目录、无 TESTS 变量、meson 无 test()；make check 为可验证 no-op（见 test_package/MANIFEST.yml NO_UPSTREAM_TESTS 申报）"
  - "Conan 2 AutotoolsToolchain 默认注入 --sbindir=${prefix}/bin（bin 展平，E2167/E545 佐证注入机制）：上游 sbin_PROGRAMS 的 xfce4-kiosk-query 在 conan 包内实际位于 bin/，cpp_info.bindirs 与 test_package 断言按 bin/ 声明"
