# conandata.yml — libxfconf 4.20.0
# 上游官方 tarball（archive.xfce.org，sha256 已实测核对）
sources:
  url: "https://archive.xfce.org/src/xfce/xfconf/4.20/xfconf-4.20.0.tar.bz2"
  sha256: "8bc43c60f1716b13cf35fc899e2a36ea9c6cdc3478a8f051220eef0f53567efd"

patches:
  - patch_file: "patches/0001-config.guess-config.sub-ohos.patch"
    patch_description: "Teach the shipped config.guess/config.sub the OHOS target name so configure can canonicalize aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-drop-umask-077.patch"
    patch_description: "Drop umask 077 around Autoconf's config.status scratch directory: HMDFS turns 0o700 into 0o2700 owned by the hmdfs account uid, so the directory is not writable"
    patch_type: "portability"
