software: libxfont2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0.7.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.7.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-04"

# 构建系统类型 (顶层字段，供检查器使用)
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://xorg.freedesktop.org/archive/individual/lib/libXfont2-2.0.7.tar.xz"

  # 源码校验和
  sha256: "8b7b82fdeba48769b69433e8e3fbb984a5f6bf368b0d5f47abeec49de3e58efb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-docs"
    - "--disable-specs"
    - "--without-xmlto"
    - "--without-fop"
    - "--without-xsltproc"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - freetype/2.14.3.1
    - libfontenc/1.1.7
    - xorgproto/2025.1
    - xtrans/1.6.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# umask and shebang fixes handled at runtime in conanfile.py build()
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub HarmonyOS detection handled via --build/--host gnu_triplet"
  - "freetype pkg-config name is freetype2 (not freetype); mapped via PkgConfigDeps.set_property"
  - "libXfont2 produces libXfont2.so; cpp_info.libs=['Xfont2'], pkg_config_name='xfont2'"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
