software: libxmlb
version: "0.3.19.1"
status: built
build_date: "2026-10-17"
build_system: meson

source:
  url: "https://github.com/hughsie/libxmlb/releases/download/0.3.19/libxmlb-0.3.19.tar.xz"
  sha256: "0a3ec258b12dbf10e5fe840b2421c84137eb7cc1b09c3de6210f3f7d51733733"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dintrospection=false"
    - "-Dgtkdoc=false"
    - "-Dtests=true"
    - "-Dlzma=enabled"
    - "-Dzstd=enabled"
    - "-Dcli=true"
  dependencies:
    - glib/2.84.0.1.1
    - liblzma/5.8.1
    - zstd/1.5.7.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "修复版本与 GTK4/libpanel 依赖图统一使用共享 glib/2.84.0.1.1，避免同进程出现第二套 GLib/GObject 类型注册表"
  - "glib/2.84.0.1.1 的 Conan 组件名为 glib-2.0、gobject-2.0、gio-2.0"
