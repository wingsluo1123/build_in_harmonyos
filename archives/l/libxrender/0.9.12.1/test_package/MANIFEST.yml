package: libxrender/0.9.12.1
homepage: https://gitlab.freedesktop.org/xorg/lib/libxrender
upstream_check_command: make -j1 check
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The complete release has two Makefile.am files, neither registers TESTS,
  check_PROGRAMS, check_LTLIBRARIES or check-local. The recipe verifies their
  complete source inventory and executes the original make check.
test_package_tests:
  - id: public-api-surface
    source: api_surface.c
    command: libxrender_api_surface
  - id: rgba-color-contract
    source: color_contract.c
    command: libxrender_color_contract
  - id: installed-pkgconfig
    source: color_contract.c
    command: pkgconfig-consumer
harmony_tests:
  - id: harmony-relocated-signed-provider
    source: conanfile.py
    command: harmony-relocated-consumer
    description: >-
      Native HarmonyOS/aarch64 validates the provider's unique codesign section
      and SONAME alias bytes, relocates its package, resolves the installed .pc
      prefix and runs actual color API assertions through the relocated closure.
test_counting:
  upstream_independent_total: 0
  integration_independent_total: 3
  harmony_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false
test_case_count: 4
