version: "1.1.45.2"
software: "libxslt"
status: published
build_date: "2026-07-30"
build_system: cmake

source:
  url: "https://gitlab.gnome.org/GNOME/libxslt/-/archive/v1.1.45/libxslt-v1.1.45.tar.gz"
  sha256: "4298285dfe7220ddfc1908e97b0cf3a67134e6d2d0f1af17c38220eba57477ab"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DLIBXSLT_WITH_PROGRAMS=ON"
    - "-DLIBXSLT_WITH_CRYPTO=OFF"
    - "-DLIBXSLT_WITH_PYTHON=OFF"
    - "-DLIBXSLT_WITH_TESTS=OFF"
  dependencies:
    - "libxml2/2.15.3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS SDK 缺少 llvm-ranlib，需显式指定 -DCMAKE_RANLIB"
  - "规范化 conanfile.py 使用标准 CMake class + CMakeToolchain，移除手动 toolchain 解析和 ELF 签名"
