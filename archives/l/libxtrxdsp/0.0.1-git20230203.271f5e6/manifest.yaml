version: "0.0.1-git20230203.271f5e6"

software: "libxtrxdsp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-13"
build_system: cmake

# Conan 引用
conan_ref: "libxtrxdsp/0.0.1-git20230203.271f5e6"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方源：myriadrf/libxtrxdsp master HEAD，原 xtrx-sdr/libxtrxdsp）
  url: "https://github.com/myriadrf/libxtrxdsp/archive/271f5e60e40dd578c0db5f50ceb7fd6b7119c5ef.tar.gz"

