# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: libyaml/0.2.4
homepage: "https://pyyaml.org/wiki/LibYAML"

# Upstream test command
upstream_check_command: "make check"

# Upstream test integration in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: tests/test-version.c
    source: libyaml-0.2.4/tests/test-version.c
    description: "Tests yaml_get_version_string() returns expected version"
    command: "./test-version"
  - file: tests/test-reader.c
    source: libyaml-0.2.4/tests/test-reader.c
    description: "Tests YAML reader with various inputs"
    command: "./test-reader"

# test_package consumer tests
test_package_tests:
  - file: test.c
    description: "Consumer test: parse a YAML document and verify events"
    command: "./test_libyaml"

# Approximate assertion count
assertion_count: 3
