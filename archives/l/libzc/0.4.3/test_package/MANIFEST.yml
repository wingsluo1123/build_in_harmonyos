# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libzc/0.4.3
homepage: "https://github.com/mferland/libzc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（check 框架，8 个 suite，本地实测 8/8 通过）
upstream_tests:
  - file: check_basic.c
    source: libzc-0.4.3/tests/check_basic.c
    description: "basic 函数（上下文/引用计数）测试"
    command: "./basic"
  - file: check_file.c
    source: libzc-0.4.3/tests/check_file.c
    description: "zc_file 打开/读取 zip 条目测试"
    command: "./file"
  - file: check_pwstream.c
    source: libzc-0.4.3/tests/check_pwstream.c
    description: "密码流生成测试"
    command: "./pwstream"
  - file: check_bruteforce.c
    source: libzc-0.4.3/tests/check_bruteforce.c
    description: "暴力破解器 + 线程取消测试（含 OHOS 垫片路径）"
    command: "./bruteforce"
  - file: check_dictionary.c
    source: libzc-0.4.3/tests/check_dictionary.c
    description: "字典攻击测试"
    command: "./dictionary"
  - file: check_reduce.c
    source: libzc-0.4.3/tests/check_reduce.c
    description: "明文还原（ptext_reduce）测试"
    command: "./reduce"
  - file: check_plaintext_password.c
    source: libzc-0.4.3/tests/check_plaintext_password.c
    description: "明文密码恢复测试"
    command: "./plaintext_password"
  - file: check_plaintext.c
    source: libzc-0.4.3/tests/check_plaintext.c
    description: "明文攻击测试"
    command: "./plaintext"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者视角：zc_new/zc_file_open/条目枚举真实 API 验证"
    command: "./test_libzc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
