# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# libzeep 8.4.1 上游测试：Catch2 v3.4.0 测试集（test/*.cpp），ctest 注册 13 个可执行。
# 已在 OHOS 真机全量运行：13/13 通过（ctest_rc=0），完整日志 reports/upstream-ctest.log，
# 台账 reports/test-ledger.md（source_declared_total=310, configured=13 exe/308 用例,
# executed_passed=308; daemon/rsrc_webapp 因 HTTP_HAS_UNIX_DAEMON=0 / USE_RSRC=0 未实例化）。

package: libzeep/8.4.1
homepage: "https://github.com/mhekkel/libzeep"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure -j13（OHOS 真机, 2026-10-04, 13/13 通过）"

# 上游实际运行的测试程序（ctest 13 个可执行，308 个独立用例全部通过）
