# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libzippp/7.1
homepage: https://github.com/ctabin/libzippp

# 上游使用 CMake + CTest 测试框架
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tests.cpp
    source: libzippp-libzippp-v7.1-1.10.1/tests/tests.cpp
    description: "libzippp 官方测试套件（24 个用例：ZIP 创建/读取/修改/压缩方法/错误处理/进度回调）"
    command: "./libzippp_static_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：创建 ZIP → 写入 hello.txt → 重新打开 → 读取验证内容匹配"
    command: "./test_libzippp"

# 测试断言总数 (24 个上游用例 + 3 个消费者断言)
assertion_count: 27
