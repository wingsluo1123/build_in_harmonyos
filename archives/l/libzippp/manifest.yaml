software: libzippp
display: "libzippp"
description: "C++ wrapper for libzip — object-oriented ZIP archive manipulation"
category: library
homepage: "https://github.com/ctabin/libzippp"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "libzip 预编译包缺少 libzip.so 开发符号链接，需手动创建"
    - "GitHub 源码需通过 codeload.github.com 下载，直连 github.com 会超时"
    - "无需源码修改，零补丁即可编译"
  common_dependencies:
    - libzip
    - zlib

versions:
  "7.1":
    status: published
    build_date: "2026-06-25"
    conan_ref: "libzippp/7.1"
