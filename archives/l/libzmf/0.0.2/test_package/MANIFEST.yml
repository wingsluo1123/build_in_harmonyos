# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libzmf/0.0.2
homepage: "https://wiki.documentfoundation.org/DLP/Libraries/libzmf"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/conv/raw/zmf2raw.cpp
    source: libzmf-0.0.2/src/conv/raw/zmf2raw.cpp
    description: "zmf2raw 命令行工具 — 将 ZMF 文档转换为 raw 格式"
    command: "./zmf2raw"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 构造 librevenge::RVNGStringStream 传入 libzmf::ZMFDocument::isSupported() 验证 API 可调用"
    command: "./test_libzmf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
