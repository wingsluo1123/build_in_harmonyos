# test_package/MANIFEST.yml
# likwid 5.5.1 - upstream test declaration and consumer-test audit.

package: likwid/5.5.1
homepage: "https://github.com/RRZE-HPC/likwid"
upstream_build_system: makefile

upstream_tests_exist: true
upstream_check_command: "make testit"
upstream_test_in_build: true
upstream_test_command: >-
  make testit (builds/runs test/test-likwidAPI then drives
  test/executable_tests/tester.sh over each <app>.txt); the recipe runs the
  OHOS-runnable subset directly in build().

upstream_test_audit: >-
  Upstream ships three kinds of test material.
  (1) test/test-likwidAPI.c is a 71-entry C API suite, but it does NOT compile
  against this release: it only includes <likwid.h> yet calls the bstrlib
  bdata() macro (and on a char*), which is an upstream defect reproducible on
  glibc as well - it is not an OHOS adaptation problem.
  (2) test/executable_tests/*.txt drive the Lua tools through tester.sh
  (9 apps, 202 expectation lines). tester.sh hardcodes /tmp scratch files
  (/tmp is read-only on OHOS), and likwid-perfctr / likwid-powermeter /
  likwid-memsweeper / likwid-setFrequencies / likwid-mpirun need perf_event or
  msr access or MPI. OHOS denies perf_event_open (EACCES) and exposes no
  /dev/cpu/*/msr, so the measurement apps cannot run. The recipe exercises the
  non-measurement tools (likwid-topology, likwid-pin, likwid-features,
  likwid-bench) in build() and in the consumer test.
  (3) test/check_data_files.py / check_group_files.py need pyparsing and a
  hardcoded author-machine absolute path; test/accuracy/ needs a real PMU.

upstream_tests:
  - file: test/test-likwidAPI.c
    source: likwid-5.5.1/test/test-likwidAPI.c
    description: "71-entry C API test list; not compiled - upstream defect (uses bstrlib bdata() without including bstrlib.h, and on a char*)"
    command: "clang -I src/includes -ICLANGARMv8 test/test-likwidAPI.c -llikwid"
    executed: false
  - file: test/executable_tests/likwid-topology.txt
    source: likwid-5.5.1/test/executable_tests/likwid-topology.txt
    description: "14 expectation lines; run via the built likwid-topology (caches/clock/version/help)"
    command: "likwid-topology -c ; likwid-topology -C ; likwid-topology -v"
    executed: true
  - file: test/executable_tests/likwid-pin.txt
    source: likwid-5.5.1/test/executable_tests/likwid-pin.txt
    description: "29 expectation lines; run via the built likwid-pin (pins a child process)"
    command: "likwid-pin -c 0 echo LIKWID_PIN_OK"
    executed: true
  - file: test/executable_tests/likwid-bench.txt
    source: likwid-5.5.1/test/executable_tests/likwid-bench.txt
    description: "26 expectation lines; the bench binary runs (aarch64 benchmark assembly generated by the bundled perl toolkit and assembled with clang)"
    command: "likwid-bench -h"
    executed: true
  - file: test/executable_tests/likwid-perfctr.txt
    source: likwid-5.5.1/test/executable_tests/likwid-perfctr.txt
    description: "45 expectation lines; needs perf_event/msr counters"
    command: "likwid-perfctr ..."
    executed: false
  - file: test/executable_tests/likwid-powermeter.txt
    source: likwid-5.5.1/test/executable_tests/likwid-powermeter.txt
    description: "20 expectation lines; needs msr counters"
    command: "likwid-powermeter ..."
    executed: false
  - file: test/executable_tests/likwid-memsweeper.txt
    source: likwid-5.5.1/test/executable_tests/likwid-memsweeper.txt
    description: "8 expectation lines; needs msr + NUMA memory binding"
    command: "likwid-memsweeper ..."
    executed: false
  - file: test/executable_tests/likwid-genTopoCfg.txt
    source: likwid-5.5.1/test/executable_tests/likwid-genTopoCfg.txt
    description: "5 expectation lines; writes /etc/likwid_topo.cfg (not writable, not installed during test)"
    command: "likwid-genTopoCfg ..."
    executed: false
  - file: test/executable_tests/likwid-mpirun.txt
    source: likwid-5.5.1/test/executable_tests/likwid-mpirun.txt
    description: "41 expectation lines; needs an MPI implementation"
    command: "likwid-mpirun ..."
    executed: false
  - file: test/executable_tests/likwid-setFrequencies.txt
    source: likwid-5.5.1/test/executable_tests/likwid-setFrequencies.txt
    description: "14 expectation lines; needs the setFreq daemon + cpufreq"
    command: "likwid-setFrequencies ..."
    executed: false
  - file: test/check_group_files.py
    source: likwid-5.5.1/test/check_group_files.py
    description: "validates the perfgroup txt files; hardcodes the author machine's absolute groups path"
    command: "python3 test/check_group_files.py"
    executed: false
  - file: test/check_data_files.py
    source: likwid-5.5.1/test/check_data_files.py
    description: "parses perfmon event .txt files; requires the pyparsing module"
    command: "python3 test/check_data_files.py"
    executed: false
  - file: test/accuracy/
    source: likwid-5.5.1/test/accuracy/
    description: "counter accuracy harness; needs a real PMU"
    command: "python3 test/accuracy/likwid-accuracy.py"
    executed: false

platform_skipped_tests:
  - id: "test-likwidAPI"
    reason: "upstream test does not compile (bstrlib bdata() macro used without including bstrlib.h, and on a char*)"
  - id: "likwid-perfctr/powermeter/memsweeper/setFrequencies"
    reason: "OHOS denies perf_event_open (EACCES) and has no /dev/cpu/*/msr - measurement is not possible"
  - id: "likwid-mpirun"
    reason: "no MPI implementation on the device"
  - id: "check_data_files/check_group_files/accuracy"
    reason: "need pyparsing / author-machine absolute paths / a real PMU"

test_package_tests:
  - file: test_consumer.c
    description: >-
      links liblikwid through CMakeDeps and asserts the public C API contract
      that works without a PMU: topology_init/get_cpuTopology (numHWThreads,
      numSockets, numThreadsPerCore), get_cpuInfo osname, timer_getCpuClock,
      numa_init/likwid_getNumberOfNodes, affinity_init/get_affinityDomains,
      cpustr_to_cpulist and likwid_pinProcess. Also runs the installed
      likwid-topology, likwid-pin and likwid-bench end to end.
    command: "./likwid_consumer + ctest + likwid-topology/-pin/-bench"

test_files:
  - path: "test_package/test_consumer.c"
    test_type: "R34"
    assertion_count: 11

upstream_test_cases: 276
executed_upstream_test_cases: 3
test_package_test_count: 11
consumer_assertion_count: 11
assertion_count: 11
