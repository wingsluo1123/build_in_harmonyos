package: lilv/0.26.5-git
homepage: "https://drobilla.net/software/lilv"

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test -C build"

upstream_tests:
  - file: test/meson.build
    source: lilv-5318c9e/test/meson.build
    description: "C unit tests and LV2 bundle discovery/validation tests"
    command: "meson test -C build --suite unit"
  - file: test/cpp/test_lilv_hpp.cpp
    source: lilv-5318c9e/test/cpp/test_lilv_hpp.cpp
    description: "C++ API construction test"
    command: "meson test -C build lilv_hpp"
  - file: test/headers/meson.build
    source: lilv-5318c9e/test/headers/meson.build
    description: "Public header compilation test"
    command: "meson test -C build"

test_package_tests:
  - file: test_lilv.c
    description: "Creates a Lilv world and compares URI nodes through the public C API"
    command: "./test_lilv"

assertion_count: 4
