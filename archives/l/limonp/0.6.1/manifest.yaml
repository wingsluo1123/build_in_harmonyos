  configure_options:
  - "cmake_minimum_required(VERSION 2.6) 过旧：配方 generate() 传 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 CMake 4.x"
  - "header-only（package_type=header-library，v0.6.1 无 add_library(limonp)，头文件 include/limonp/*.hpp 直接打包）"
  - "CMAKE_CXX_STANDARD=17（profile 的 cppstd=17；v0.6.1 需 C++11+ 才不吃 tr1 fallback）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
- "0001-CMakeLists.txt.patch: 3 个 ADD_TEST 用相对路径 COMMAND + 默认 WORKING_DIRECTORY（build 目录），TConfig/TMd5/TStdExtension/TStringUtil 用相对路径 \"../test/testdata/...\" 打开 fixture —— 只有 build 目录恰好是源码根的直接子目录时才解析得到。换成 $<TARGET_FILE:...> + WORKING_DIRECTORY ${PROJECT_SOURCE_DIR}/test，任何 out-of-tree 构建目录（含 Conan 缓存布局）都能跑"
- "0002-include-limonp-StdExtension.hpp.patch: 上游用 #elif(__cplusplus == 201103L) 精确匹配 C++11；OHOS 用 C++17（libc++ 无 <tr1/unordered_map>）掉进 tr1 fallback 编译失败。放宽为 >= 201103L"
- "0003-include-limonp-StringUtil.hpp.patch: LTrim/RTrim 用 std::ptr_fun / std::bind2nd（C++17 已移除），libc++ 下编译失败。改用 lambda"
- "0004-test-unittest-TFileLock.cpp.patch: 硬编码 /tmp/limonp_test_filelock；OHOS /tmp 是只读 erofs。改用 $TMPDIR（回退当前目录）"
- "0005-test-unittest-TMutexLock.cpp.patch: assert(!pthread_create(...)) 在 Release（NDEBUG）下整个表达式被裁剪，线程从未创建、结果恒空。拆成先调用再断言"

knowledge_gained:
- "老年代码（2016 前后）常写 #elif(__cplusplus == 201103L) 精确匹配：C++14/17 下该分支恒假，落到旧 fallback（tr1/boost）直接编译失败。判定信号：grep -n '__cplusplus' 头文件；修复 = 放宽为 >= 201103L"
- "std::ptr_fun / std::bind2nd / std::not1 在 C++17 已移除：libc++ 下报 'no member named ptr_fun'。修复 = 改 lambda"
- "assert(!pthread_create(...)) 这类'把系统调用放进 assert 参数'的写法在 Release（NDEBUG）下整体被裁剪：线程从未创建、测试恒空转失败，且 Debug 下全绿、极难排查。判定信号：grep -n 'assert(.*pthread_create' 测试源码；修复 = 先调用再断言"
- "测试硬编码 /tmp 路径在 OHOS 上是只读 erofs 直接失败（E002 同源）；修复 = 用 getenv(TMPDIR) 回退当前目录，避免改测试语义"
- "v0.6.1 的 GBKTrans 不做 Unicode 查表而是字节对打包（TwocharToUint16 同理）：char 有符号性与打包结果无关（uint16_t(c) & 0x00ff 先转无符号），aarch64/OHOS 与 x86-linux 两端行为一致"
- "rule4 用例计数口径：源码声明 36（TCastFloat.cpp 引用不存在的 limonp/CastFloat.hpp 且未被 ADD_EXECUTABLE(test.run ...) 收录，实跑不注册），实际注册并执行 35。声明数必须 >= 实跑数（36/35），不得以实跑数冒充声明数"
