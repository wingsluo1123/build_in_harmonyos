version: "1.8.0"
software: "liquid-dsp"
status: built
build_date: "2026-07-28"
build_system: cmake

source:
  url: "https://github.com/jgaeddert/liquid-dsp/archive/refs/tags/v1.8.0.tar.gz"
  sha256: "abef8b2ddfd58c0a84ecda4f62158c4824b916144af4a2b07776e1a144d8cda4"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_STATIC_LIBS=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_AUTOTESTS=OFF"
    - "-DBUILD_BENCHMARKS=OFF"
    - "-DBUILD_SANDBOX=OFF"
    - "-DBUILD_DOC=OFF"
    - "-DENABLE_SIMD=OFF"
    - "-DFIND_SIMD=OFF"
    - "-DFIND_FFTW=OFF"
    - "-DFIND_THREADS=OFF"
    - "-DENABLE_LOGGING=OFF"
  dependencies: []
  cc: clang 15.0.4
  cxx: clang++ 15.0.4

patches_applied: []

knowledge_gained:
  - "liquid-dsp v1.8.0 uses CMake (not autotools as older versions). cmake_minimum_required(VERSION 3.10) works with cmake 4.1.2."
  - "System automatically detected as 'HarmonyOS' by OHOS clang toolchain."
  - "Pure math library with zero external dependencies — perfect for OHOS."
  - "Static library (libliquid.a) built successfully with clang 15.0.4 target aarch64-linux-ohos."
  - "Library name in CMake is 'liquid' (LIBNAME=liquid), installed as libliquid.a."
  - "CMake package name is 'liquid-static' (since BUILD_SHARED_LIBS=OFF)."
  - "pkg-config file name is 'liquid-dsp'."
