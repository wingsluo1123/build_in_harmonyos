package: liquid-dsp/v1.8.0
homepage: "https://liquidsdr.org"

# 上游测试命令 (liquid-dsp 使用 cmake CTest)
upstream_check_command: "ctest"

# conanfile.py 中集成上游 autotest（1341 项测试，CI 构建中实际编译运行）
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序 (autotest 已启用)
upstream_tests:
  - file: autotest/src/autotest.c
    source: liquid-dsp-v1.8.0/autotest/
    description: "Autotest suite (1341 tests, BUILD_AUTOTESTS=ON, run via ctest in conan build)"
    command: "xautotest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 liquid_libversion() 返回版本字符串和版本号"
    command: "./test_liquid-dsp"

# 测试断言数 (API 版本号校验: header vs library)
assertion_count: 1
