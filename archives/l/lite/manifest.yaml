# lite 软件级 manifest（Lite XL 轻量文本编辑器）
# 遵循 ARCHIVE-SPEC v2.0

software: lite
display: "Lite XL"
description: "Lite XL 是一个用 Lua + C 编写的轻量、快速、开源的文本编辑器（上游项目 lite-xl 2.1.8）"
homepage: "https://lite-xl.com/"
license: MIT
repository: https://github.com/lite-xl/lite-xl
category: utility
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Meson 构建；wrap_mode=nodownload，依赖全走 conan（R36），禁止 meson 网络下载子项目"
    - "上游优先 SDL3（prefer_sdl3）；本仓有 sdl3/3.4.8 OHOS 适配归档（archives/s/sdl3/3.4.8/，status built、G0-G4 pass、4 个 OHOS 补丁），但无 conan 配方 → 暂用 SDL2；SDK3 切换：sdl3 补全为 conan 配方并发布（R36）后改 requires 并按 prefer_sdl3 构建，复用归档 4 补丁知识（SDL_PLATFORM_OHOS/取消 SDL_PLATFORM_LINUX、禁用 pthread_setcanceltype、禁用 SDL_TRAY/SDL_Gtk_Quit）"
    - "agg 以 meson subproject（git wrap）引入且无 pkg-config，需先适配发布 agg 包（W0/R36 阻塞）"
    - "OHOS Meson 需注入 ar/ranlib 全路径到 conan_meson_native.ini（dav1d/fontconfig 实证）"
    - "应用包可执行文件需 binary-sign-tool 签名（OHOS XPM），R38 需 commands.json"
    - "lite-xl meson 请求 dependency('lua')，本仓 lua 配方 pkg-config 名为 lua-5.4，需补 lua.pc 别名"
  common_dependencies:
    - sdl2
    - freetype
    - lua
    - pcre2
    # - agg（待适配发布，R36）

# 版本索引
versions:
  "2.1.8":
    status: built
    build_date: "2026-07-29"
    notes: "配方三件套 + 元数据已生成；conan create / sha256 / W0 conan download 验证被环境阻塞，待真实环境执行"
