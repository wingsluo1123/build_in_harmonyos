software: live
display: "LIVE555"
description: "Streaming media libraries for RTP/RTCP, RTSP, SIP, and related protocols"
category: multimedia
homepage: "http://www.live555.com/liveMedia/"
license: "LGPL-3.0-or-later AND GPL-3.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "Preserve the default OpenSSL-backed TLS, SRTP, and HMAC feature set"
    - "Build all 37 self-contained upstream program targets with Clang C++20"
    - "Pair cross-thread event-trigger state publication with an active nonblocking select wakeup channel"
    - "Keep explicit positive scheduler granularity and a channel-failure polling fallback"
    - "Package four static libraries and public headers for Conan consumers"
  common_dependencies:
    - "openssl/3.5.8.1"

versions:
  "2025.05.24":
    status: built
    build_date: "2026-10-17"
