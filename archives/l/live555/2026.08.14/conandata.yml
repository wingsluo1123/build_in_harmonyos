  # 上游官方发布位（live555.com / download.live555.com）在本沙箱不可用：
  #   * http://download.live555.com/<file> → 301 且 Location **畸形**（域名与文件名之间缺 '/'）
  #   * https://www.live555.com/... → TLS 版本不兼容（wrong version number）
  #   * http://www.live555.com/liveMedia/public/ → 404
  # 改用 Fedora 官方 lookaside 缓存中的**pristine 上游 tarball**（字节等同上游发布物）。
  # Fedora 记录并已被本包逐字核验的 sha512：
  #   1fc21b675b128dae47713b59b81ab2845f416f30a2dfa46efe60d966fb6fff22433aad14a90e46cd7b020abf595c3242358bbf6344c66729d3eb69760c9ed897
  # sha256（本包实测）：
  #   85848fb28df98a77a6e745959cc3ecf5f541f34c8ffef9021b9f1c2e682edee0
  url: "https://src.fedoraproject.org/repo/pkgs/live555/live.2026.08.14.tar.gz/sha512/1fc21b675b128dae47713b59b81ab2845f416f30a2dfa46efe60d966fb6fff22433aad14a90e46cd7b020abf595c3242358bbf6344c66729d3eb69760c9ed897/live.2026.08.14.tar.gz"
