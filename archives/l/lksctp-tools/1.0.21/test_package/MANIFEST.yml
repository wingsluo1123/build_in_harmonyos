# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lksctp-tools/1.0.21
homepage: "https://github.com/sctp/lksctp-tools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# lksctp-tools 的 func_tests/ 共 35 个测试程序（test_1_to_1_*.c 等），
# 它们需要内核 SCTP 支持（SCTP socket 协议族）；OHOS 环境内核无 SCTP
# 模块时运行报 "Protocol not supported"（BROK），属于环境内核能力边界，
# 库本身 API 可通过 test_package 消费者测试验证。
upstream_tests:
  - file: src/func_tests/test_1_to_1_connect.c
    source: lksctp-tools-1.0.21/src/func_tests/test_1_to_1_connect.c
    description: "1-to-1 SCTP connect 功能测试（需内核 SCTP 支持；OHOS 无 SCTP 模块时 Protocol not supported）"
    command: "./test_1_to_1_connect"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libsctp，验证 sctp_opt_info API 可达与 SCTP 常量"
    command: "./test_lksctp-tools"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2