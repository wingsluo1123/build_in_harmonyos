software: lksctp-tools
display: "lksctp-tools"
description: "SCTP 用户空间工具集与 libsctp 库（sctp_darn/sctp_test/checksctp）"
category: network
homepage: "https://github.com/sctp/lksctp-tools"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "OHOS musl sys/socket.h 与 linux UAPI linux/socket.h 均定义 sockaddr_storage（E091），
      需在 sctp.h.in 模板与 func_tests 中包含 linux/socket.h 处加 define-guard"
    - "GitHub archive tarball 不含 configure，build() 需 autoreconf 自举
      （tool_requires automake/libtool，同 argp-standalone）"
    - "config.guess 不识别 HarmonyOS，configure 需显式 --build/--host triplet"
    - "E114: configure 脚本 umask 077 需改 022（HMDFS UID 映射不可写）"
  common_dependencies: []

versions:
  "1.0.21":
    status: published
    build_date: "2026-09-28"
    published_as: lksctp-tools