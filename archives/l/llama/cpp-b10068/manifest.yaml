  - "全部第三方依赖 vendor 在源码树内(cpp-httplib/miniaudio/nlohmann/stb),OpenSSL 关闭后零外部依赖"
  - "产物 .so 无 DT_SONAME,package() 内 patchelf 补 SONAME 后须重签名(XPM 拒绝未签名 dlopen)"
