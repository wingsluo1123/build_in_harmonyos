# 知识沉淀（每条注明记录位置，供 W5 完整性检查）
knowledge_gained:
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "scripts/build 特性探测基址固定 /tmp/dummy 且候选目录仅 /usr/tmp /var/tmp /tmp：OHOS /tmp 只读（E002）导致所有 C 特性探测静默失败；改为优先 $TMPDIR 后 -DRUSAGE/-DHAVE_DRAND48 等宏正确生成（通用模式：源码树内自带编译器探测脚本的包，探测临时目录必须可配置）"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "musl/OHOS 无 Sun RPC：rpc/rpc.h 不存在。bench.h 无条件 include 该头（上游 1996 年代码假定 UNIX 必有 RPC）；用上游自身 HAVE_pmap_clnt_h 探测保护后，lib_tcp/lib_udp 的 pmap_* 调用还需按既有 NO_PORTMAPPER 宏补齐保护，lat_rpc 改为诊断入口"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "rpc/types.h 在旧 UNIX 上顺带提供 TRUE/FALSE；去掉该 include 后 lat_usleep.c 编译失败，需在 bench.h 补定义（移除系统头时须核对其历史副产物符号）"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "lmbench 自适应标定（find_N ±2% 窗口）对测量噪声敏感：共享设备高负载（并发 conan create -j8，load 26/20 核）时 min-of-10 散布 2 倍以上，N 发散至 10^8，表现为‘无输出长跑’。官方规避机制 = scripts/config-run 先跑 enough/timing_o/loop_o 并把 ENOUGH/TIMING_O/LOOP_O 写入 CONFIG 再运行套件；CI 冒烟应采用同一机制"
  - knowledge_ref: "README.md#OHOS 适配要点"
    text: "lmbench 的 OS 标签不可依赖 uname/config.guess：scripts/os 回退的 scripts/gnu-os（config.guess）在 OHOS 无法运行，必须显式 make OS=aarch64-ohos"

