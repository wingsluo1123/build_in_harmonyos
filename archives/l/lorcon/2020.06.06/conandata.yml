  # Privately vendored packet-capture sources (5th-strategy cycle): the
  # official libpcap 1.10.6 release tarball, byte-identical URL + SHA256
  # to published archives/l/libpcap/1.10.6 (R39: SHA unchanged). It is
  # built privately inside lorcon's build() with an Autotools configure
  # plus committed flex/bison replay outputs (vendor/), so no
  # Conan-level libpcap requirement exists and neither preflight nor CI
  # can resolve the conancenter libpcap recipe (whose unconditional
  # bison/flex tool_requires die on the worker).
  libpcap:
    url: "https://www.tcpdump.org/release/libpcap-1.10.6.tar.xz"
    sha256: "ec97d1206bdd19cb6bdd043eaa9f0037aa732262ec68e070fd7c7b5f834d5dfc"
