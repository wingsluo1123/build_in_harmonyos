software: lorcon
display: "lorcon"
description: "Generic library for injecting 802.11 frames (packet forge and packasm helpers)"
category: library
homepage: "https://github.com/kismetwireless/lorcon"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools zero-patch route: explicit --build/--host triplet, umask 022 rewrite, config.sub aarch64 backfill at build time"
    - "linux/wireless.h hard error relaxed to warning; mac80211 driver stays guarded by upstream ifdefs"
    - "No Conan-level libpcap requirement: official libpcap 1.10.6 sources built privately via Autotools configure, static archive bundled (avoids conancenter bison/flex/m4 chain); flex/bison outputs committed under vendor/pcap_gen and replayed via vendor/tools shims (worker has no generators); libnl stays optional auto-detect"
    - "Upstream ships no automated suite; consumer test covers pure-userspace forge/packasm APIs"
  common_dependencies: []

versions:
  "2020.06.06":
    status: built
    build_date: "2026-10-14"
    source_url: "https://github.com/kismetwireless/lorcon/archive/refs/tags/2020.06.06.tar.gz"
