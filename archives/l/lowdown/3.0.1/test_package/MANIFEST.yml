# test_package/MANIFEST.yml
package: lowdown/3.0.1
homepage: "https://kristaps.bsd.lv/lowdown"

# 上游测试命令
upstream_check_command: "make regress"
upstream_test_in_build: false
upstream_test_command: ""

# 上游回归测试（由 lowdown 自带的 regress/ 目录提供）
upstream_tests:
  - file: regress/
    source: lowdown-3.0.1/regress/
    description: "上游回归测试套件（200+ 测试用例，覆盖所有输出格式）"
    command: "make -f GNUmakefile regress"
    known_issue: "HMDFS 不支持硬链接，regress 套件中的 lowdown-diff 创建步骤跳过"

# test_package 中自带的测试（消费者视角验证库API）
test_package_tests:
  - file: test.c
    description: "低版本库 API 测试：Markdown→HTML 解析渲染验证"
    command: "./test_lowdown"

# 测试断言总数
assertion_count: 3
