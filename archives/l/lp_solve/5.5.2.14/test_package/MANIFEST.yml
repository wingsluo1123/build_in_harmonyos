# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lp_solve/5.5.2.14
homepage: https://lpsolve.sourceforge.net/

# 上游测试命令
# lp_solve 无标准测试套件（make check）
upstream_check_command: ""
upstream_test_in_build: false

# test_package 中自带的测试
test_package_tests:
  - file: test_lp_solve.c
    description: "lp_solve 库 API 烟雾测试：求解 LP 模型 max(x1+x2) s.t. x1+x2<=10"
    command: "ctest"

# 测试断言总数
assertion_count: 3
