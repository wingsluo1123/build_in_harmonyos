# conandata.yml — lpr 2008.05.17.4
#
# 源：Debian 官方归档 deb.debian.org/debian/pool/main/l/lpr/。本 tarball 是
# **native** 包（lpr_2008.05.17.4.dsc: `Format: 3.0 (native)`、`Version: 1:2008.05.17.4`），
# 因此 tarball 内自带 debian/ 目录，不存在单独的 .debian.tar.* 组件 —— 这与
# lpr_2008.05.17.3+nmu* 那些非 native 上游包不同。
#
# 为什么取 Debian 而不是上游 OpenBSD：任务串版本 2008.05.17.4 就是这个 native
# tarball 的上游版本号（维护者 Michael Tokarev 在 2026-02-04 采用并重新上传，见
# changelog 头部），上游 OpenBSD 的 CVS 归档早已下线、GitHub 无对应 tag/发布件，
# Debian 归档是唯一能 HTTP 200 拿到该版本原样源码的一手渠道。实测 2026-10-05：
# HTTP 200，Content-Length 81804，sha256 与 .dsc 的 Checksums-Sha256 段逐字节一致。
#
# 上游源码零改动：所有 OHOS 适配都发生在配方层（编译旗标 + 强制包含的兼容头 +
# 链接期注入的 musl 兼容目标文件，见 conanfile.py 与 notes.md）。

sources:
  url: "https://deb.debian.org/debian/pool/main/l/lpr/lpr_2008.05.17.4.tar.xz"
  sha256: "2f65cb4097b5386ffbce6051785576b7dfb40ac5951e69ca86ed2ad6b564a608"
  # xz 压缩；Conan 的 get() 按扩展名自动选解压器，这里不覆盖它。
  # （tar_format 只写给 manifest.yaml 的人读，**不能**透传给 get()。）

patches: {}