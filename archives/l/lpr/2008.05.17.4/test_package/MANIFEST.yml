# test_package/MANIFEST.yml — lpr 2008.05.17.4 上游官方测试声明
#
# 上游测试审计（源树逐文件 grep + 每个 Makefile 目标枚举，2026-10-05）：
# - 顶层 Makefile 只有 all / clean 两个目标；common_source/Makefile.in 只有
#   .o.c / ${PROG} / clean；8 个子目录 Makefile 除自身的 PROG 变量外不含任何目标。
#   `make check` → "No rule to make target 'check'"。
# - 全树无 TESTS / check_PROGRAMS / add_test / check-local / test-* 目标，
#   无 tests/ 目录，无 configure（因此也没有 `make check` 约定）。
# - 源码里唯一接近测试的东西是 lptest.c（2003 年 POSIX 关于 lpr 兼容性测试套件的
#   一个客户端），它需要真实打印机后端与 /etc/printcap 条目，不是自动化测试。
# 五维账本：上游用例总数=0 执行=0 通过=0 失败=0 跳过=0

package: lpr/2008.05.17.4
homepage: "https://salsa.debian.org/debian/lpr"

# 上游测试命令（不存在，留档供 CI 口径核对）
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 消费者视角测试（OHOS 新增，见 test_lpr.py）
test_package_tests:
  - file: test_lpr.py
    description: >-
      打包后的 CLI 消费者测试。静态段（交叉构建与真机都跑）：bin/ 的
      lpr/lpq/lprm/lptest 与 sbin/ 的 lpc/lpd/lpf/pac 共 8 个程序是常规可执行
      文件（切分沿用上游 debian/install）、每个都是 ELF64 小端 EM_AARCH64、
      8 份 man page（4×man1 + 5×man5 含 printcap.5）、etc/printcap、
      licenses/copyright、无构建残留（.o / compat 源码 / 链接包装脚本）。
      **compat 符号作用域**是本包在 musl 上唯一会静默出错的地方，因此单独断言：
      引用 BSD 兼容层的 6 个程序（lpc/lpd/lpq/lpr/lprm/pac）必须在符号表里把
      rresvport_af 与 innetgr **定义为本地函数**（st_shndx != SHN_UNDEF），
      而 lpf/lptest 必须完全不认识这两个符号 —— 后者证明编译期驱动的链接注入
      范围精确，没有把兼容层塞进用不到它的程序。运行段（仅 can_run() 为真）：
      lpr/lpq/lprm/lpc/pac 对非法旗标 -Z 打印用法/错误并退出，证明动态加载器
      解析了 libc.so、getopt 走通、printcap 子系统初始化完成。lpd 不在运行段内
      —— 它是常驻守护进程。
    command: "python3 test_lpr.py <package> [--runtime]"

assertion_count: 72
runtime_assertion_count: 5

notes:
  - >-
    静态段实际跑出 72 条断言（8 程序 × [常规可执行文件 / 可执行位 / ELF64 小端 /
    EM_AARCH64] = 32，加 6 个 compat 消费者 × 2 符号 × [已定义 / 未定义] = 24，
    加 lpf+lptest × 2 符号 = 4，加 etc/printcap 1 + man page 9 + licenses 1 +
    无构建残留 1）。运行段再加 5 条，真机可执行时合计 77 条。
  - >-
    上游 lpr 完全没有自动化测试套件，L1 因此在 ci/config/no_official_test.txt
    白名单豁免（理由记录在该文件里）。这里的消费者断言**不是**上游测试，不按
    上游测试口径上报。
  - >-
    运行段以 can_run() 为门槛，而不是"试着跑一下"。本机注册了 binfmt_misc +
    qemu-aarch64，aarch64 ELF 确实会被拉起来，但真正加载它的是一份老
    /lib/ld-musl-aarch64.so.1，缺少 OHOS SDK 自带的 sys/select.h 里 FD_SET
    越界检查钩子 __fd_chk（sysroot sys/select.h:33），lpd 引用了它。于是执行会
    以 exit 127 + "Error relocating ... symbol not found" 失败，那是本地模拟
    环境的缺陷而不是包缺陷：真机 OHOS loader/libc.so 导出该符号。
  - >-
    符号表断言是手写 ELF64 解析（.symtab/.dynsym + 关联 .strtab），不调
    nm/readelf/objdump：OHOS worker 的 HMBS 只注入 cmake/make/ninja/python3，
    这些 binutils 未必存在（archives/t/termdebug/2.2/test_package/MANIFEST.yml
    有同样记录）。因此包内二进制刻意 **不 strip**（8 个程序合计约 380 KB），
    保留 .symtab 供断言与事后审计使用。
  - >-
    lpr/lpq/lprm/lpc 的 usage() 写 stderr 并 exit 1（lprm exit 2），lpc 打印
    "?Invalid command" 到 stdout 后 exit 1；断言只要求"输出非空"，因为消费者
    关心的是"程序真的被加载并执行了"，退出码差异属于上游行为不必统一。