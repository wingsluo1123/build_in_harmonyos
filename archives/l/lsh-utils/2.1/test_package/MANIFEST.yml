test_package_tests:
  - file: test_lsh_utils.sh
    description: >
      Consumer test: lsh-make-seed (seed the yarrow generator) -> lsh-keygen
      (RSA key generation, libhogweed+gmp) ->
      lsh-writekey -c aes256-cbc (PKCS#5/AES-256-CBC) plus an unencrypted copy
      -> lsh-decrypt-key --askpass, then byte-compare the decrypted key with
      the unencrypted copy.  Mirrors test_package/conanfile.py test().
    command: "sh test_lsh_utils.sh <package>/bin"

# Assertions actually performed by the consumer test (command exit status,
# generated-file presence and size, and the final byte comparison).
assertion_count: 7

# Measured on HarmonyOS PC (see reports/test-report.md and notes.md):
#   48 PASS / 20 FAIL / 3 SKIP out of 71 registration entries.
# The 20 failures share one root cause: lshd user authentication requires a
# passwd entry whose pw_uid equals getuid(), and this platform's /etc/passwd
# has none for the invoking uid.  The 3 skips are upstream's own exit-77
# skips (no /bin/bash for lcp, no tsocks for socks4/socks5).
