# test_package/MANIFEST.yml
# Upstream test declaration for lsh-utils 2.1 (GNU lsh).
#
# Upstream ships four independent `run-tests' harnesses, all wired into
# `make check'.  The list below is the count of *registration entries*
# (TS_PROGS + TS_SH in each testsuite/Makefile.am), which is the denominator
# used by the PR body and notes.md.
package: lsh-utils/2.1
homepage: "https://www.lysator.liu.se/~nisse/lsh/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Registration entries counted from the four testsuite/Makefile.am files:
# src/testsuite 16 programs + 37 scripts, src/spki 7 + 4, src/sftp 0 + 5,
# src/argp 0 + 2  =>  N_static = 71
upstream_tests:
  - name: arcfour-test
    harness: testsuite
    kind: compiled test program
    command: "srcdir=src/testsuite ./run-tests arcfour-test"
