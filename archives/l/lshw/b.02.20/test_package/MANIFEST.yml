# test_package/MANIFEST.yml
# lshw has no upstream test suite (no 'make check' target)
# The test runs the binary directly (R34: test must depend on tested package)

package: lshw/b.02.20
homepage: "https://github.com/lyonel/lshw"

# lshw Makefile has no 'check' target
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Run lshw -version to verify binary works"
    command: "conan test"

# Approximate assertion count
assertion_count: 1
