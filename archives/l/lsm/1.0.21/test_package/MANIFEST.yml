# test_package/MANIFEST.yml — lsm 1.0.21 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在，详见 docs/TEST_QUALITY_SPEC.md

package: lsm/1.0.21
homepage: "https://lsm.foobar.fi/"

# 上游审计结论：确认无测试（upstream_tests_exist: false 显式证据见下方）
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试审计（源码: foolsm-1.0.21.tar.gz，官方 https://lsm.foobar.fi/download/）
upstream_test_audit:
  source_tarball: "foolsm-1.0.21.tar.gz (https://lsm.foobar.fi/download/foolsm-1.0.21.tar.gz)"
  source_sha256: "527d9c363aa62b9fc511b42c5a06f774a8767c4b5330db4d959c10b46b0dede7"
  build_system: "makefile（纯 Makefile，无 configure / CMake / meson）"
  scanned_for:
    - "tests/ / test/ 目录"
    - "Makefile 中 check / test 目标"
    - "ctest / gtest / pytest 注册"
    - "*_test.c / test_*.c / *_test.go 测试源文件"
    - "CI 测试 job（.github/workflows 等）"
  scan_result: "tarball 共 56 个条目：顶层仅 Makefile / README / LICENSE / *.c / *.h / foolsm.conf / 4 个 *_script 脚本 / foolsm_ munin 插件 / foolsm.spec / foolsm.service / debian/ 目录，无 tests/ 或 test/ 目录，无 *_test.c / test_*.c 文件，无 .github 等 CI 目录；Makefile 目标仅 all / clean / distclean / tar / rpm / install，无 check / test 目标"
  reason: "lsm 1.0.21（foolsm-1.0.21）不提供任何自动化测试套件，make check 无目标可执行，故按 no_tests 处理"

# 上游测试命令（无测试框架，无命令可填）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，故为空表）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，如实调用被测二进制）
test_package_tests:
  - file: test.sh
    description: "消费者冒烟测试：foolsm 二进制存在且可执行；foolsm -h 输出 version 1.0.21 + usage（退出码 2）；foolsm -v 输出 version 1.0.21（退出码 2）"
    command: "sh test.sh <bin/foolsm>"
    assertions: 3

harmonyos_specific_tests: []

# 测试断言总数（test.sh 中 3 个 PASS 检查点）
assertion_count: 3
