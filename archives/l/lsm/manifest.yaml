# 软件级 manifest — lsm
# 遵循 ARCHIVE-SPEC
# 文件位置: archives/l/lsm/manifest.yaml

software: lsm
display: "lsm"
description: "Foobar Link Status Monitor — ping multiple targets and run a script on up/down events"
category: network
homepage: "https://lsm.foobar.fi/"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure；VERSION 从 foolsm.spec 读取"
    - "Makefile 默认装到 $(PREFIX)/sbin，配方以 BINDIR=/bin 覆盖使产物落入 conan bin/foolsm"
    - "上游无任何自动化测试，按 no_tests 申报；test_package 以 foolsm -h/-v 做 3 点冒烟断言"
  common_dependencies: []

versions:
  "1.0.21":
    status: built
    build_date: 2026-09-26
