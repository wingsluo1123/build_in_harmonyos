# ── 预置后的内嵌依赖补丁（不进 patches 表，由 source() 应用）──────────────
# 预置到 modules/lsp-common-lib/ 的源码与 lsp-common-lib 1.0.49 归档同样缺
# GNU qsort_r（musl），补丁内容与 lsp-common-lib/lsp-r3d-base-lib 归档的
# 0001 补丁一致，仅应用基准路径不同（modules/lsp-common-lib）。
module_patches:
  - patch_file: "patches/modules/0001-lsp-common-lib-qsort_r-ohos.patch"
    base_path: "modules/lsp-common-lib"
    patch_description: "内嵌 lsp-common-lib 的 src/main/stdlib.cpp：OHOS libc(musl) 无 GNU qsort_r，改为 qsort + 线程局部比较器上下文（与 lsp-common-lib 1.0.49 归档的 0001 补丁内容一致，仅路径基准不同）"

# ── 本包源码补丁（patches 表，build() 的 apply_conandata_patches 应用）───
# 两者都作用于主源码树中真实存在的文件，对非 OHOS 平台是编译期等价改动：
#   * 0001：公共头 X11/GLX include 用 __has_include 条件化（不引入平台宏，R8）
#   * 0002：src/Makefile 按 make 变量 PLATFORM_OHOS=1 选择编译 src/ohos/*.cpp
# OHOS 后端源码本身不在补丁里：ohos/backend.cpp 经 export_sources 导出、
# source() 拷入 src/ohos/（上游文件零改动）。
patches:
  "1.0.31":
    - patch_file: "patches/0001-ohos-public-header-glu-conditionalization.patch"
      patch_description: "公共头 include/lsp-plug.in/r3d/glx/backend.h：X11/GLX include 用 __has_include 条件化，缺失时给占位 typedef；公共头不引入平台宏"
    - patch_file: "patches/0002-ohos-makefile-build-ohos-backend.patch"
      patch_description: "src/Makefile：make 变量 PLATFORM_OHOS=1 时编译 src/ohos/*.cpp（EGL 后端）替代 src/main/backend.cpp（X11/GLX 后端），平台标识由 make 命令行变量注入"
