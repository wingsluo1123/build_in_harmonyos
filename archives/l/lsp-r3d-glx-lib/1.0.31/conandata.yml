# conandata.yml — lsp-r3d-glx-lib 1.0.31
#
# 单一事实源：主源码 + 构建期内嵌依赖源码 + 内嵌依赖补丁清单 + 本包补丁。
#
# 上游 modules.mk pin 的内嵌依赖（*_TYPE 均为 src）：
#   DEPENDENCIES      = LSP_COMMON_LIB, LSP_R3D_IFACE, LSP_R3D_BASE_LIB（生产）
#   TEST_DEPENDENCIES = LSP_TEST_FW（测试）
# 系统依赖 LIBX11 / LIBGL 为 pkg 型：OHOS 上不存在，新后端（EGL pbuffer）
# 不依赖它们，其 pkg-config 查询结果为空、不参与链接。
# 四个 *_TYPE=src 依赖由 src/Makefile 的 $(ARTIFACT_DEPS) 规则递归
# `make -C modules/<dep> compile` 以 -D<NAME>_BUILTIN 内嵌编译；源码在此登记
# 同版本 tarball，由 source() 预置到 modules/（替代上游联网的 make fetch）。

sources:
  "1.0.31":
    filename: lsp-r3d-glx-lib-1.0.31.tar.gz
    url: "https://codeload.github.com/lsp-plugins/lsp-r3d-glx-lib/tar.gz/refs/tags/1.0.31"
    sha256: "3242dc2a7e927758d9de472cb4d026acb9c4bd97b8911629df2c04f8e9904cb6"

# codeload.github.com 的 tar.gz 链接不带扩展名，conan 的 get() 会据 URL 误判为
# zip：所有条目都必须显式给 filename（.tar.gz）。

