# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lsp-r3d-glx-lib/1.0.31
homepage: "https://github.com/lsp-plugins/lsp-r3d-glx-lib"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中已集成上游测试（FEATURES="test strict"）
upstream_test_in_build: true
upstream_test_command: "./.build/target/lsp-r3d-glx-lib/lsp-r3d-glx-lib-test"

# 上游实际运行的测试程序
# 说明：上游 src/test/ 仅有测试框架入口 main.cpp（调用 lsp::test::main），
# 没有任何 utest/ptest/mtest 用例注册（src/test/ 下无其他源文件）。
# 因此上游测试用例数为 0，不存在"零用例假绿"误判空间——本包验证以
# test_package 消费者测试为主。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "版本宏 + glx::factory_t 构造与 Factory::enumerate 枚举拿到后端 + init_offscreen(重复 init 拒绝) + locate/get_location 往返 + 矩阵存取往返与非法入参拒绝 + 真渲染（红/蓝帧 set_bg_color→start→sync→read_pixels 全图像素断言，验证 eglGetProcAddress 调度生效）+ 背景色往返 + set_lights/draw_primitives 平台能力边界如实断言 STATUS_NOT_IMPLEMENTED + init_window 离屏回退与 NULL 窗口句柄 + destroy"
    command: "./test_lsp-r3d-glx-lib"

assertion_count: 28
