# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lsp-r3d-iface/1.0.31
homepage: "https://github.com/lsp-plugins/lsp-r3d-iface"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# FEATURES="test strict" 下上游会编译并运行测试可执行文件
# .build/target/lsp-r3d-iface/lsp-r3d-iface-test
upstream_test_in_build: true
upstream_test_command: "./.build/target/lsp-r3d-iface/lsp-r3d-iface-test"

# 上游实际运行的测试程序
# 说明：上游 src/test/ 仅有测试框架入口 main.cpp（调用 lsp::test::main），
# 没有任何 utest/ptest/mtest 用例注册（src/test/ 下无其他源文件）。
# 因此上游测试用例数为 0：测试可执行文件可构建并运行，但注册用例为 0，
# 不存在"零用例假绿"误判空间——本包的验证以 test_package 消费者测试为主。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "版本宏编译期校验 + Factory 注册/枚举/函数指针表实调 + 结构布局一致性（10 项断言）"
    command: "./test_lsp-r3d-iface"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
