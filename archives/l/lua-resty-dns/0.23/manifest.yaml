software: lua-resty-dns
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.23/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.23"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# 构建系统类型（顶层字段，用于质量门禁检查）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/openresty/lua-resty-dns/archive/refs/tags/v0.23.tar.gz"

  # 源码校验和
  sha256: "ecc80b91bfb4f795b8a80acfa69e1778288ef60649ddd87f30a9c4a57ac5da79"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 纯 Lua 库，无需编译，只需 make install 复制 .lua 文件

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Lua 库，无需 C/C++ 编译，只需复制 .lua 文件到目标目录"
  - "Makefile 使用 make install 安装，PREFIX 和 LUA_LIB_DIR 可配置"
  - "依赖 ngx_lua 运行环境（nginx + lua module），测试无法独立运行"
