# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e compliance

package: lua-struct/0.9.2
homepage: "https://github.com/iryont/lua-struct"

# Upstream test command
upstream_check_command: "busted spec/struct_spec.lua"

# Whether upstream tests are integrated in the build() method
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test files
upstream_tests:
  - file: spec/struct_spec.lua
    source: lua-struct-0.9.2/spec/struct_spec.lua
    description: "Busted-based spec testing pack/unpack for I, h, B, b, s, L, f, d types"
    command: "busted spec/struct_spec.lua"

# Consumer-side test in test_package
test_package_tests:
  - file: test_lua_struct.c
    description: "C program embedding Lua, loads struct module and verifies pack/unpack for I, h, B, b, ss, d types"
    command: "./test_lua_struct"

# Approximate assertion count
assertion_count: 7
