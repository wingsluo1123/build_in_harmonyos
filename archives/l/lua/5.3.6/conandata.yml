patches:
  - patch_file: "patches/0001-install-path.patch"
    patch_type: "patch"
    patch_description: "Fix install path to /storage/Users/currentUser/usr/local"
    strip: 1
  - patch_string: "--- lua-5.3.6.orig/src/Makefile\t2020-07-14 02:38:27.000000000 +0800\n+++ lua-5.3.6.work/src/Makefile\t2026-06-04 16:22:10.684085313 +0800\n@@ -6,7 +6,7 @@\n # Your platform. See PLATS for possible values.\n PLAT= none\n \n-CC= gcc -std=gnu99\n+CC= clang\n CFLAGS= -O2 -Wall -Wextra -DLUA_COMPAT_5_2 $(SYSCFLAGS) $(MYCFLAGS)\n LDFLAGS= $(SYSLDFLAGS) $(MYLDFLAGS)\n LIBS= -lm $(SYSLIBS) $(MYLIBS)\n"
    patch_type: "patch"
    patch_description: "Use clang instead of gcc (corrected)"
    strip: 1
