patches_applied: []

knowledge_gained:
  - "Lua Makefile hardcodes CC= gcc -std=gnu99 at line 7 — must override on command line"
  - "make -j$(nproc) breaks on HMDFS due to jobserver mkfifo — pin -j1"
  - "Lua public headers are at tarball root, must flatten via keep_path=False"
  - "cpp_info.bindirs = ['bin'] required so VirtualRunEnv puts lua/luac on consumer PATH"
