version: "0.99997"
status: built
build_date: "2026-07-10"

source:
  url: "https://codeload.github.com/TeX-Live/texlive-source/tar.gz/refs/heads/trunk"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--enable-build-in-source-tree"
    - "--disable-shared"
    - "--enable-xetex"
    - "--without-x"
  dependencies:
    - freetype/2.14.3
    - zlib/1.3.1.1
    - fontconfig/2.16.0
    - expat/2.8.2
    - lua/5.2.4
    - gmp/6.3.0
    - mpfr/4.2.1

patches_applied: []

knowledge_gained:
  - "LuaTeX 源码在 XeTeX tarball 的 texk/web2c/luatexdir/ 中"
  - "CWEB .w 源文件不在 git 仓库中，需要从 WEB 生成"
  - "LuaTeX 需要 Lua 5.2、GMP、MPFR、cairo、pixman 等依赖"
  - "复用 XeTeX 构建的 HMDFS 修复和预构建依赖"
