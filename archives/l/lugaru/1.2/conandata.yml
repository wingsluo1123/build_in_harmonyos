sources:
  url: "https://gitlab.com/osslugaru/lugaru/-/archive/1.2/lugaru-1.2.tar.gz"
  sha256: "6e2acc14d62f2bf6b329ddbed8d50d1428ae159b986be1d7833c004a7bfa5a9f"

patches:
  # 0001: ① CMake >= 4 拒绝 cmake_minimum_required(VERSION 3.0)、并已移除
  #          cmake_policy(CMP0004 OLD)；
  #       ② 显式接 ${OPENGL_glu_LIBRARY}（gluPerspective）；
  #       ③ 去掉 Source/Math/XYZ.hpp 里两处 `register`——profile 的
  #          CMAKE_CXX_STANDARD=17 由 CMake 追加在 CMAKE_CXX_FLAGS 之后，
  #          上游自己的 --std=gnu++11 无法胜出，而 register 在 C++17 非法。
  - patch_file: "patches/0001-cmake-ohos-compat.patch"
    strip: 1
