# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# R51 上游测试清点：lwdtc v1.0.0 上游无 tests/ 目录、无 ctest/make check
# 寄存器；仓库仅含 4 个演示示例（cron_basic/cron_multi/cron_calc_range/
# cron_dt_range），全部 include "windows.h"（Sleep/SetConsole 风格），
# OHOS/Linux 无法编译运行，属平台绑定演示而非可移植测试。

package: lwdtc/1.0.0
homepage: "https://github.com/MaJerle/lwdtc"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游无正式测试，4 个示例均为 windows.h 专用）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "lwdtc 消费者测试（cron parse + is_valid_for_time + cron_next）"
    command: "./test_lwdtc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4