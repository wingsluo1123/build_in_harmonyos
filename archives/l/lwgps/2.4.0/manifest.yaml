# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "顶层 CMakeLists 会把 tests/test_parse_sat_det 的 lwgps_opts.h（LWGPS_CFG_STATEMENT_GPGSV_SAT_DET=1）经 add_subdirectory 注入库编译，造成库与消费者头文件结构体布局错位（test_package Signal 11）；配方只构建 lwgps 库子目录（默认 opts）解决"
- "上游顶层 CMakeLists 未调用 enable_testing()，上游官方枚举器 tests/test.py 递归枚举 4 个测试入口（beidou/ext_time/sat_det/standard），需在各入口 __build__ 子目录运行 ctest（上游缺陷）；r02 逐入口真实运行 4/4 通过"
- "上游 CMake 无 install 规则，配方 package() 手工复制 include/lwgps/*.h 与 liblwgps.a；默认 lwgps_opts.h 由官方模板复制产出"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
