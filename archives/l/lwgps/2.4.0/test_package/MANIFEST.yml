# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lwgps/2.4.0
homepage: "https://github.com/MaJerle/lwgps"

# 上游测试命令：顶层 CMakeLists 未调用 enable_testing()（上游缺陷），
# ctest 必须在 build/tests 子目录运行；实际 1/1 通过。
upstream_check_command: "ctest --test-dir build/tests --output-on-failure"

# conanfile.py build() 中未集成上游测试，由 CI/test_package 独立运行
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build/tests --output-on-failure"

# 上游实际运行的测试程序（ctsest 注册项；另有 3 个测试目录存在但未被
# 顶层 CMake 装配：test_parse_standard / test_parse_beidou / test_parse_ext_time）
upstream_tests:
  - file: tests/test_parse_sat_det/test_parse_sat_det.c
    source: lwgps-2.4.0/tests/test_parse_sat_det/test_parse_sat_det.c
    description: "解析 5 条上游样例 NMEA（GPRMC/GPGGA/GPGSA/GPGSV×2）并断言位置、航向、fix、卫星详情"
    command: "./build/tests/LwLibPROJECT"

# test_package 中自带的测试（消费者视角验证，R34 实质调用库 API）
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 lwgps_init/lwgps_process 解析上游样例 NMEA 并断言经纬度/高度/fix/卫星数/航向"
    command: "./test_lwgps"
  - file: lwgps_ohos_test.c
    description: "HarmonyOS 专项测试：aarch64 目标上验证 double 精度浮点类型与经纬度/fix/time 字段"
    command: "./lwgps_ohos_test"

# 测试断言总数（近似：test_lwgps 7 处 + lwgps_ohos_test 5 处）
assertion_count: 12