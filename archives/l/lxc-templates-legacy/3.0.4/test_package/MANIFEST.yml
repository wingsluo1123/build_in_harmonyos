# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: lxc-templates-legacy/3.0.4
homepage: "https://linuxcontainers.org/lxc/"

# Upstream test command (from make check analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (lxc-templates-legacy has no compiled tests)
upstream_tests: []

# test_package tests (consumer-perspective verification)
test_package_tests:
  - file: test_main.c
    description: "Verify LXC template scripts and config files are installed"
    command: "./test_main <package_folder>"

# Test assertion count (approximate, for quality assessment)
assertion_count: 3
