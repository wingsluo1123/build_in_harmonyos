sources:
  "2.8":
    url: "https://github.com/lxi-tools/lxi-tools/archive/refs/tags/v2.8.tar.gz"
    sha256: "ef9d013189c9449f850d467dd35ac3840929e76a888cdb77e0edbce067da0b2d"

patches:
  "2.8":
    - patch_file: "patches/0001-src-lxi_gui-application.c.patch"
      patch_description: "0001 use libadwaita 1.2 about and preferences window APIs while preserving the GUI actions"
      patch_type: "portability"
    - patch_file: "patches/0002-src-lxi_gui-prefs.c.patch"
      patch_description: "0002 back the preferences implementation with AdwPreferencesWindow available in libadwaita 1.2"
      patch_type: "portability"
    - patch_file: "patches/0003-src-lxi_gui-prefs.h.patch"
      patch_description: "0003 expose the preferences window through GTK types supported by libadwaita 1.2"
      patch_type: "portability"
    - patch_file: "patches/0004-src-lxi_gui-prefs.ui.patch"
      patch_description: "0004 use the libadwaita 1.2 preferences window template parent"
      patch_type: "portability"
    - patch_file: "patches/0005-src-meson.build.patch"
      patch_description: "0005 resolve readline through Conan pkg-config metadata instead of the target system search path"
      patch_type: "portability"
    - patch_file: "patches/0006-src-scpi.c.patch"
      patch_description: "0006 frame persistent RAW SCPI responses across receive cycles using protocol boundaries and one monotonic deadline"
      patch_type: "portability"
    - patch_file: "patches/0007-version.sh.patch"
      patch_description: "0007 use the release version when the official source archive has no Git metadata"
      patch_type: "portability"
