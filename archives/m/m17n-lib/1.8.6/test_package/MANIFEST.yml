# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: m17n-lib/1.8.6
homepage: "https://www.nongnu.org/m17n/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# m17n-lib's make check runs no actual test programs (just checks po files)
upstream_tests:
  - file: example/m17n-conv.c
    source: m17n-lib-1.8.6/example/m17n-conv.c
    description: "m17n-conv character encoding conversion tool"
    command: "./m17n-conv --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: verify m17n-lib core API (msymbol, msymbol_name, msymbol_cat)"
    command: "./test_m17n-lib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
