sources:
  url: "https://deb.debian.org/debian/pool/main/m/madwimax/madwimax_0.1.1.orig.tar.gz"
  sha256: "0b552e6a6face4534bc65c4d377dce177c6a1bd39785a63f6d57f1d79e772429"
  filename: "madwimax_0.1.1.orig.tar.gz"
  note: >-
    源取 Debian 源包的 orig —— 就是上游 `ago/madwimax` 的 **0.1.1** 官方发布 tarball（版本与平台清单
    一致），GitHub 标注语言 **C**。选它的关键理由：**自带已生成的 `configure` / `Makefile.in` /
    `config.guess` / `depcomp` / `install-sh`** → 构建时可直接 configure，**不再需要 autoreconf 自举**
    （CI 构建 #94280 曾在 autoreconf 之后卡到 1 小时墙钟超时；换此源即绕开该步骤）。
    包内单层根目录 `madwimax-0.1.1/`（50 个文件）；sha256 为本地实测值。
