adapted_test_pass_rate: >-
  test_package/check_madwimax.py **7 项消费者校验（全部离线）**，本地实测 `checks=7 fails=0 / RESULT: PASS`：
  ①产物齐备（bin/madwimax，47552 字节）②ELF 头自检（真 ELF64、machine=0xB7 AArch64）③`madwimax --help`
  打印用法 ④`madwimax --version` 输出 `madwimax 0.1.1` ⑤许可证随包（COPYING）⑥证据（sha256 + python 版本）
  ⑦运行边界如实记录（真实驱动功能需 WiMAX USB + TAP，本环境不执行）。

knowledge_gained:
  - category: L1
    content: >-
      **OHOS 上 musl 与内核 uapi 头的 `sockaddr_storage` 冲突，可以一个 -D 解决**：上游 `src/tap_dev.c` 先
      `#include <sys/socket.h>` 再 `#include <linux/if.h>` → 后者带出 `linux/socket.h` 又定义一次
      `struct sockaddr_storage` → `error: redefinition of 'sockaddr_storage'`。**看 sysroot 的 musl 头**：
      `sys/socket.h:376` 是 `#ifndef __MUSL__` 包裹 → 只要给编译加 **`-D__MUSL__`**，musl 就不再自定义该
      结构，只剩内核头那份 → 冲突消失（一个 -D 的补丁，**不用改上游源码**）。这类"musl 头 + linux uapi
      头"的重复定义，先查 musl 侧有没有 `__MUSL__`/`__DEFINED_*` 守卫再决定要不要动源码。
    reason: "madwimax 0.1.1 适配实测——sockaddr_storage 重定义"
  - category: L1
    content: >-
      **上游 configure 的"文档工具硬检查"与"sbin 安装"两处小坑**：①madwimax 的 `configure.ac` 默认要生成
      man 页 → 里面**硬检查 asciidoc**（`AC_MSG_ERROR "asciidoc not found"`，实测直接挡住 configure）；
      同处 `AC_ARG_WITH(man-pages)` 提供了 **`--without-man-pages`**，文档非必需时加上即可绕开；
      ②上游是 `sbin_PROGRAMS = madwimax`，实测 `make install` 没把产物落到我们期望的 `bin/` →
      配方在 `package()` 里**显式补装一次** `bin/madwimax`，让包内布局与 `commands.json` 约定一致。
    reason: "madwimax 0.1.1 适配实测——asciidoc 硬检查与 sbin 布局"
