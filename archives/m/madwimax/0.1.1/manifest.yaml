# 版本级 manifest — madwimax 0.1.1
# 遵循 ARCHIVE-SPEC v3.0

version: "0.1.1"
software: madwimax
status: built
build_date: "2026-10-15"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/m/madwimax/madwimax_0.1.1.orig.tar.gz"
  sha256: "0b552e6a6face4534bc65c4d377dce177c6a1bd39785a63f6d57f1d79e772429"
  filename: "madwimax_0.1.1.orig.tar.gz"
  note: >-
    源取 Debian 源包的 orig（= 上游 `ago/madwimax` 的 0.1.1 官方发布 tarball，与平台清单一致；
    GitHub 标注语言 **C**）。**改用该源的原因**：它自带已生成的 `configure`/`Makefile.in`/
    `config.guess`/`depcomp`/`install-sh` → 构建时可直接 configure；CI 构建 #94280 曾在
    **autoreconf 之后卡满 1 小时墙钟被判超时**，换此源即绕开那一步。
    其内附的 `config.sub`/`config.guess` 仍是 2009 年版本、认不出 aarch64 三元组 → 配方在 configure 前
    从 conan 的 `automake` 包取现代版本覆盖这两个脚本（**不重跑 autoreconf**）。
    包内单层根目录 `madwimax-0.1.1/`；sha256 为本地实测值。

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
    - "--without-man-pages"
    - "--sbindir=<package>/bin"
  dependencies:
    - "libusb/1.0.27（唯一外部依赖；上游 configure.ac:60 PKG_CHECK_MODULES libusb-1.0）"
  build_requirements:
    - "automake/1.18"
    - "libtool/2.5.4"
  extra_defines:
    - "__MUSL__（见 knowledge_gained：修 musl 与内核 uapi 头的 sockaddr_storage 冲突）"
  language: "C（autotools；pthread + libusb）"

patches_applied:
  - "（无上游源文件补丁）配方内 acc: 通过 --without-man-pages 关掉 asciidoc 硬检查；通过 -D__MUSL__ 消除 \
     sockaddr_storage 重定义；package() 显式补装 bin/madwimax"

