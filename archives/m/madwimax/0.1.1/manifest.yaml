  **上游 0 个测试**（如实声明：无 test/tests，Makefile.am 无 TESTS）。按仓库既有做法**在配方里补真跑的功能级
  测试**：构建完成后运行产物 —— ①`madwimax --help` 打印用法 ✓（上游 `src/wimax.c:652` 支持 `-h,--help`）；
  ②`madwimax --version` → `madwimax 0.1.1` ✓（`src/wimax.c:648`）。它是**硬件驱动**：真正工作需 WiMAX USB
