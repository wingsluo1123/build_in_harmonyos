  framework: "（上游没有测试套件）"
  test_path: "无 —— 无 test/tests 目录，Makefile.am 里也没有 TESTS"
  test_command: "（上游无）本配方在 build() 内补跑：`madwimax --help` 与 `madwimax --version`"
  test_count: 0
