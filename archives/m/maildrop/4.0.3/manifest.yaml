    - pcre2/10.48
    - gdbm/1.24
    - libidn2/2.3.8
    - courier-unicode/2.6.0
    - libiconv/1.17
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

