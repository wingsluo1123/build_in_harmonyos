# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "本机 /tmp 为 erofs 只读挂载：musl 的 tmpfile() 恒失败且不读 TMPDIR，须改用 TMPDIR+mkstemp（reformime 等以管道 stdin 输入时会崩）"
  - "HMDFS 不支持硬链接（link() 返回 EPERM）：Maildir tmp→new、关键字发布、maildrop 投递、dotlock 四处须分别改用 rename() 或 O_CREAT|O_EXCL"
  - "HMDFS 的 uid 映射使文件 st_uid 恒为挂载映射 id（20001006），getuid() 为 20020082，故 getpwuid() 返回 NULL、属主校验恒失败"
  - "HMDFS 权限归一化：chmod 700 → 0760、600 → 0660，组位恒置、other 位恒清，私有权限与 world 位都无法表达"
  - "clang 15 不为类外定义的嵌套类模板生成隐式推导指引（CTAD），须补显式推导指引；clang 16 已修"
  - "bash 5.3 的 heredoc 以管道实现（sh 用临时文件），上游 Makefile 显式用 bash 跑 testsuite，故 <<EOF 输入全部走管道"
  - "config.guess 不识别 uname -s 返回的 HarmonyOS，需补平台分派；config.sub 已原生接受 ohos 三元组"
  - "conan initialtoolchain 脚本不注入依赖的 -I/-L，autotools 项目须在 build() 中显式注入 CPPFLAGS/LDFLAGS/LIBS"
  - "上游测试驱动 testsuite / testsuite.mailbot 由 configure 从 .in 生成，对这些文件的补丁会被覆盖，须在 configure 之后处理"
  - "conan-verify 以 UTF-8 解码 conan create 输出，测试若向 stdout 输出非 UTF-8 字节（如原始 0xA4）会使工具崩溃"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

