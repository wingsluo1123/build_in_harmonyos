sources:
  url: "https://untroubled.org/mailfront/archive/mailfront-2.12.tar.gz"
  sha256: "a3e3eb2e180a3dfab95f98c3ec65e4add9fb8c14a66987eebdcf02c5f80dca6d"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "0001 Resolve plugin bglibs symbols from the exported host executable"
    patch_type: "portability"
  - patch_file: "patches/0002-builtins.c.patch"
    patch_description: "0002 Rename the accept callback to avoid the POSIX accept declaration"
    patch_type: "portability"
  - patch_file: "patches/0003-mailfront.c.patch"
    patch_description: "0003 Add a security-boundary reset for transport upgrades"
    patch_type: "portability"
  - patch_file: "patches/0004-mailfront.h.patch"
    patch_description: "0004 Extend the protocol ABI with a security reset hook"
    patch_type: "portability"
  - patch_file: "patches/0005-modules.c.patch"
    patch_description: "0005 Resolve packaged modules relative to the executable"
    patch_type: "portability"
  - patch_file: "patches/0006-plugin-starttls-ucspi.c.patch"
    patch_description: "0006 Reset session security state after a successful STARTTLS upgrade"
    patch_type: "portability"
  - patch_file: "patches/0007-protocol-smtp.c.patch"
    patch_description: "0007 Reset SMTP transaction flags and protocol identity at STARTTLS"
    patch_type: "portability"
  - patch_file: "patches/0008-queuedir.c.patch"
    patch_description: "0008 Atomically publish queue files with renameat2 RENAME_NOREPLACE without platform conditionals"
    patch_type: "portability"
  - patch_file: "patches/0009-tests.sh.patch"
    patch_description: "0009 Make the complete upstream suite deterministic in the HarmonyOS application sandbox"
    patch_type: "portability"
  - patch_file: "patches/0010-tests-rbl-deterministic.patch"
    patch_description: "0010 Accept only the canonical listed or unlisted result from the external Spamhaus test lookup"
    patch_type: "portability"
