software: mailfront
display: "mailfront"
description: "模块化 SMTP、QMTP 与 QMQP 邮件协议前端"
category: network
homepage: "https://untroubled.org/mailfront/"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用 HarmonyOS clang 与 Conan Makefile 配置原生构建"
    - "复用已发布的 bglibs、CVM 与 Lua 依赖"
    - "通过相对可执行文件路径发现动态协议、后端与插件模块"
    - "在真实 UCSPI STARTTLS 描述符切换后撤销握手前事务、身份与授权状态"
  common_dependencies:
    - bglibs
    - cvm
    - lua

versions:
  "2.12":
    status: built
    build_date: "2026-10-15"
    conan_ref: "mailfront/2.12"
