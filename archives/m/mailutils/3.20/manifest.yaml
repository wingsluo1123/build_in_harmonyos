  - "0019-comsat-test-mode-passwd-guard.patch"

knowledge_gained:
  - "config.guess/config.sub need HarmonyOS and linux-ohos triplet support."
  - "HMDFS temporary directories require umask 022 because ownership is mapped."
  - "OHOS libc lacks getspnam() and getutxent(); use function probes and portable fallbacks."
  - "HMDFS rejects hard links with EPERM; the dotlock path needs an O_EXCL fallback."
  - "Toybox ls output can break mdate-sh and trigger unavailable makeinfo; preserve generated release docs."
  - "When DBM is disabled, the Sieve uidnew extension must also be excluded because its upstream target still links libmu_dbm unconditionally."
  - "The upstream cwdrepl test helper must tolerate an unset PWD and a failed getcwd() in the isolated HarmonyOS test environment."
  - "Do not rewrite the OHOS ELF after linking: patchelf/signing tools are unavailable on this device, and Conan's run environment supplies the packaged library path."
  - "GnuTLS and libunistring are enabled so the TLS and unistring cases run. Python, PAM, GSSAPI, database, LDAP, Guile, readline, and FriBidi stay disabled; SQL stays off because no module is selected by default."

upstream_tests:
  command: "make -j2 -k check"
  source_testsuite_at_files: 22
  executed_autotest_suites: 21
  result:
    total: 1389
    passed: 1389
    failed: 0
    skipped: 0
  count_note: "Earlier reports used 1387. Summing the 21 Autotest summaries gives 1389: imap4d/tests is 107 and mh/tests is 270, one more each than the old tally."
  not_run:
    - "libmu_scm suite: optional Guile integration is not part of the 21 make-check suites"
    - "mail and pop3d DejaGNU harnesses: runtest is unavailable on the device; not part of the 1389"
  details: "reports/test-report.md"

consumer_tests:
  - "test_package/test_mailutils.c exercises mu_list, mu_url, mu_locker, and file-safety public APIs (14 checks)."
  - "test_package/test_ohos_mailutils.sh checks HarmonyOS executables, server files, version, and library files (24 checks)."
  - "test_package/test_mail_flow.sh creates a mailbox with putmail, then reads it with mail and readmsg (6 checks)."
