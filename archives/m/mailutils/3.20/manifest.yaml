    - "--without-berkeley-db"
    - "--without-ndbm"
    - "--without-tokyocabinet"
    - "--without-kyotocabinet"
    - "--without-mysql"
    - "--without-postgres"
    - "--without-odbc"
    - "--without-ldap"
