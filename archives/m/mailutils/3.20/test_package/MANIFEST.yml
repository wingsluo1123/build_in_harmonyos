optional_upstream_tests:
  - file: libmu_scm/tests/testsuite.at
    source: mailutils-3.20/libmu_scm/tests/testsuite.at
    condition: "Guile support is optional and not part of the default make-check target"

upstream_make_check_suite_count: 21
upstream_make_check_case_count: 1389
upstream_skip_policy: "zero skipped, unsupported, or unresolved cases across all 21 configured make-check suites; enforce 1,389 expected cases"

test_package_tests:
  - file: "none in the HarmonyOS device run"
    category: "PC 特有测试"
    cases: 0
    assertions: 0
    description: "No PC-only binary is executed on the HarmonyOS device; the portable API case is listed separately."
    command: "not run on the HarmonyOS device"
  - file: test_mailutils.c
    category: "通用 API 测试"
    cases: 1
    assertions: 14
    description: "consumer API assertions: mu_list / mu_url / mu_locker / file safety"
    command: "ctest --output-on-failure"
  - file: test_mail_flow.sh
    category: "消费者用例"
    cases: 1
    assertions: 6
    description: "consumer end-to-end flow: putmail creates a mailbox and delivers one message; mail and readmsg read it back"
    command: "sh ./test_mail_flow.sh <package_folder>"
  - file: test_ohos_mailutils.sh
    category: "鸿蒙特有测试"
    cases: 1
    assertions: 24
    description: "HarmonyOS-specific: platform identity, CLI/server smoke test, version"
    command: "sh ./test_ohos_mailutils.sh <package_folder>"

test_package_case_count: 3
assertion_count: 44
