# test_package/MANIFEST.yml — upstream and target-specific test declaration (CI L0e)
package: mailutils/3.20
homepage: "https://www.gnu.org/software/mailutils/"

# All Autotest suites included by the GNU Mailutils 3.20 distribution.
upstream_check_command: "make -j2 check"
upstream_test_in_build: true
upstream_test_command: "make -j2 -k check"

