software: maim
display: "maim"
description: "X11 桌面截图工具（make image），支持区域/窗口选择与 PNG/JPEG/BMP/WebP 编码"
category: gfx
homepage: "https://github.com/naelstrof/maim"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "全部依赖经 Conan CMakeDeps 目标解析，不再使用上游 modules/ 下的旧式 find 模块变量"
    - "cmake_minimum_required 提升到 3.15（CMake 4.x 拒绝 < 3.5 的兼容声明）"
    - "CXX_STANDARD 由 11 提升到 17，匹配 OHOS profile 的 cppstd=17 与 ICU 76 头文件对 C++17 的要求"
  common_dependencies:
    - libx11
    - libxext
    - libxrender
    - libxfixes
    - libxcomposite
    - libxrandr
    - libpng
    - libjpeg-turbo
    - libwebp
    - slop
    - glm
    - icu

versions:
  "5.8.0":
    status: built
    build_date: "2026-10-16"
    conan_ref: "maim/5.8.0"
