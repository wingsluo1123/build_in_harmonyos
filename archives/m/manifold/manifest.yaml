software: manifold
display: "Manifold"
description: "C++ geometry library for topological robustness on manifold triangle meshes"
category: library
homepage: "https://github.com/elalish/manifold"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建（C++17），MANIFOLD_DOWNLOADS=OFF 时必须由 Conan 提供 GTest 与 Clipper2（OHOS 无法从 GitHub git clone FetchContent 依赖）"
    - "测试由 gtest_discover_tests 注册为 ctest 用例（gtest/1.17.0.2）；CrossSection 需要 clipper2/2.0.1（PRIVATE 链接）"
    - "MANIFOLD_PAR=OFF（无 TBB）、MANIFOLD_PYBIND=OFF（无 Python/nanobind）、TRACY/ASSIMP/FUZZ 全关"
    - "不强制 CMAKE_SYSTEM_NAME=Linux（区别于 clipper2）：manifold 用 gtest_discover_tests 在构建期运行测试二进制，强制系统名会误判为交叉编译而禁用用例发现"
    - "3.5.2 零源码补丁构建官方 release（上游 find_package(QUIET) + FetchContent 回退直接接受 Conan CMakeDeps 依赖）"
    - "3.5.2 经 CMAKE_PROJECT_INCLUDE 别名 shim 以 Conan 包提供 gtest/clipper2；上游 gtest_discover_tests 套件（427 用例）在 static 与 shared 两种形态下零修改完整执行"
    - "OHOS hmdfs hmmac=use_task 拒绝写入后的 .so 字节改写，shared 形态以 CMAKE_SKIP_RPATH=ON 链接（链接输出即最终字节镜像，install 仅复制）"
  common_dependencies:
    - gtest
    - clipper2

versions:
  "3.4.1":
    status: built
    build_date: "2026-09-25"
    conan_ref: "manifold/3.4.1"
  "3.5.2":
    status: built
    build_date: "2026-09-29"
    conan_ref: "manifold/3.5.2"
