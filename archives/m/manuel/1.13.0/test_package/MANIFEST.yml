package: manuel/1.13.0
homepage: "https://pypi.org/project/manuel/1.13.0/"
upstream_check_command: "python -m unittest manuel.tests.test_suite"
upstream_test_in_build: true
upstream_test_command: "python -m unittest manuel.tests.test_suite"
upstream_tests:
  - file: src/manuel/tests.py
    source: manuel-1.13.0/src/manuel/tests.py
    description: "Unmodified original suite: 63 unittest groups, 273 original corpus doctest examples, 32 code blocks; units separate"
    command: "python -m unittest manuel.tests.test_suite"
  - file: src/manuel/index.txt
    description: "114 original doctest examples and 10 code blocks"
  - file: src/manuel/table-example.txt
    description: "22 original doctest examples and 7 code blocks"
  - file: src/manuel/README.txt
    description: "87 original doctest examples and 4 code blocks"
  - file: src/manuel/bugs.txt
    description: "33 original doctest examples and 7 code blocks"
  - file: src/manuel/capture.txt
    description: "14 original doctest examples"
  - file: src/manuel/myst-markdown.md
    description: "4 MyST code blocks; included by both original RST and MyST suite construction, not 2 copies of four doctest examples"
  - file: src/manuel/doc1.ex
    description: "Original nested document input, included in original suite behavior, not extra top-level test"
  - file: src/manuel/doc2.ex
    description: "Original nested document input"
  - file: src/manuel/doc3.ex
    description: "Original nested document input"
test_package_tests:
  - file: consumer.py
    description: "1 delivered-package region extraction/claim/reassembly flow; 5 assertions including module identity"
    command: "python consumer.py --package-folder <Conan-package-folder>"
additional_regressions:
  - file: regression.py
    description: "6 unittest boundary cases; executed during Conan build, not 6 consumers"
    command: "python regression.py"
assertion_count: 5
