software: mapserver
display: "MapServer"
description: "Open source platform for publishing spatial data and interactive mapping applications"
category: gis
homepage: "https://mapserver.org/"
license: MIT-style
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake build has mandatory PNG, JPEG, Freetype, PROJ, and GDAL checks."
    - "First pass disables heavyweight optional stacks to keep the OHOS dependency closure tractable."
    - "MapServer installs both libmapserver and CGI/utility commands; commands.json is required."
  common_dependencies:
    - gdal
    - proj
    - libpng
    - libjpeg-turbo
    - freetype

versions:
  "8.6.5":
    status: built
    build_date: "2026-07-20"
