  ohos_specific_assertions: 1
  command: "bash test.sh (javac + java, 调用 mapsforge-core API)"

knowledge_gained:
  - "mapsforge 是纯 Java/Gradle 多模块工程；OHOS PC 无 Android SDK，须排除 3 个 Android 模块"
  - "上游 settings.gradle 同时声明 google() 仓库；该仓库在 OHOS 构建网络不可达时是*连接超时*（非 404），Gradle 会直接中断依赖解析——排除 Android 模块后必须一并移除 google()"
  - "Gradle 的 OperatingSystem 不识别 HarmonyOS，需为构建 JVM 注入 -Dos.name=Linux（ohpcd gradle/8.12 启动器已内置，recipe 再兜底）"
  - "Conan basic_layout 下 project 根在 source_folder 而 cwd 在 build_folder，gradle 必须用 -p 指到 source_folder"
  - "library 类型的 Conan 配方必须声明 shared 选项，否则 conan create 报 'Package type is library, but no shared option declared'"
  - "本机 GitHub 官方源码通道不可达（codeload 限速/git early EOF/raw 超时）；本地验证借助 conan 的 core.sources:download_cache（sha256 索引），CI 侧由 build_and_test.sh 的 mirror fallback（gh-proxy）处理"

