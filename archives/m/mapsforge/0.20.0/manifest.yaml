    - "JAVA_TOOL_OPTIONS=-Dos.name=Linux  (Gradle OperatingSystem 不识别 HarmonyOS)"
    - "GRADLE_USER_HOME=<source_folder>/.gradle-home  (构建状态私有化，不写 HOME)"
  dependencies:
    - "gradle/8.12 (tool_requires, ohpcd 制品仓)"
    - "Maven 依赖由 Gradle 从 Maven Central 解析（kxml2/svgSalamander/guava/trove4j/jts-core/osmosis-core/sqlite-jdbc/activation/jaxb-runtime/junit/commons-io/jetty/slf4j-log4j12）"
  cc: "N/A (pure Java)"
  cxx: "N/A (pure Java)"
  modules_built:
    - mapsforge-core
    - mapsforge-map
    - mapsforge-map-reader
    - mapsforge-map-awt
    - mapsforge-map-writer
    - mapsforge-themes
    - mapsforge-poi
    - mapsforge-poi-awt
    - mapsforge-poi-writer
    - mapsforge-samples-awt
  modules_excluded:
    - "mapsforge-map-android (needs Android SDK)"
    - "mapsforge-poi-android (needs Android SDK)"
    - "mapsforge-samples-android (needs Android SDK + AGP)"

