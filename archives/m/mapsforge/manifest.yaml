software: mapsforge
display: "mapsforge"
description: "OpenStreetMap 二进制矢量地图（.map）的渲染 / 读写 Java 库（Gradle 多模块）"
category: graphics
homepage: "https://github.com/mapsforge/mapsforge"
license: "LGPL-3.0-or-later"
build_system: gradle

ohos_adaptation:
  key_points:
    - "纯 Java（JVM）库：产物为架构无关的 JAR，不使用 OpenHarmony C/C++ 交叉编译器"
    - "上游为 Gradle 多模块工程（13 模块）；OHOS PC 无 Android SDK，排除 3 个 Android 模块"
    - "同时移除仅 Android 需要的 google() Maven 仓库（OHOS 构建网络不可达，连接超时会中断依赖解析）"
    - "使用经 SHA-256 固定的 BiSheng JDK 17.0.13（ohos-aarch64）构建；Gradle 由 ohpcd 的 gradle/8.12 提供"
    - "执行上游 Gradle 构建内 JUnit4 测试（235 用例），而非仅重打包预编译 JAR"
    - "test_package 对打包 JAR 做真实 mapsforge-core API 断言（15 项，含 1 项鸿蒙特有断言）"
  common_dependencies: []

versions:
  "0.20.0":
    status: built
    build_date: "2026-09-30"
    conan_ref: "mapsforge/0.20.0"
