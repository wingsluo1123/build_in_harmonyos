software: maqview
display: "MaqView"
description: "MAQ 比对结果可视化查看器（OpenGL/GLUT GUI）及 maqindex/zrio 命令行工具"
category: science
homepage: "https://maq.sourceforge.net/maqview.shtml"
license: GPL-2.0-only
build_system: autotools
keywords:
  - maq
  - bioinformatics
  - alignment
  - viewer
  - opengl
  - glut

ohos_adaptation:
  key_points:
    - "OHOS 只交付 OpenGL ES；maqview 渲染层是桌面 GL 立即模式 + 选择模式，必须链接 mesa/24.3.4.1 的 libGL.so"
    - "GLU 提供 gluPickMatrix；GLUT 用 freeglut/3.6.0（OHOS 制品 libfreeglut-gles.so）"
    - "无 X display：构建只编译+链接；运行期验证走 OSMesa 离屏上下文与直接执行打包二进制"
    - "tarball 只带 configure.ac，需 autoreconf -fi；AM_CONFIG_HEADER 须换 AC_CONFIG_HEADERS"
    - "生成的 configure 的 umask 077 在 hmdfs 上不可用，须改回 022"
    - "打包 ELF 需 binary-sign-tool 自签并断言恰 1 个 .codesign 段"
  common_dependencies:
    - mesa/24.3.4.1
    - glu/9.0.3
    - freeglut/3.6.0

versions:
  "0.2.5":
    status: built
    build_date: "2026-10-19"
    conan_ref: "maqview/0.2.5"
    source_url: "https://deb.debian.org/debian/pool/main/m/maqview/maqview_0.2.5.orig.tar.gz"
    patches: 3
