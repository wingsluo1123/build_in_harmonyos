# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mariadb-connector-c/3.4.8
homepage: "https://mariadb.com"

# 上游测试命令
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (WITH_UNIT_TESTS=OFF, no upstream tests built)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Calls mysql_library_init/mysql_init/mysql_get_client_version to verify linkage"
    command: "./test_mariadb_connector_c"

# 测试断言总数 (近似值)
assertion_count: 3
