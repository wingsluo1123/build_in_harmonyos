software: massdns
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"
build_system: makefile

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/blechschmidt/massdns/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和
  sha256: "93b14431496b358ee9f3a5b71bd9618fe4ff1af8c420267392164f7b2d949559"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "massdns has no configure script, uses plain Makefile"
  - "Makefile uses $(CC) env var, must pass CC from Conan profile (R33)"
  - "git describe fails in non-git context, MASSDNS_REVISION is empty (harmless)"
  - "Binary only (no library), package_type=application"
  - "Plain Makefile recipes need generate() to set CC from tools.build:compiler_executables"
