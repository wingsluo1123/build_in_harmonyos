# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: mate-menus/1.28.0
homepage: "https://mate-desktop.org"

# Upstream test command (from make -n check analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build() method
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: util/test-menu-spec.c
    source: mate-menus-1.28.0/util/test-menu-spec.c
    description: "mate-menu-spec-test: tests menu loading and directory enumeration"
    command: "./mate-menu-spec-test"

# Test package's own tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Consumer test: calls matemenu_tree_get_type() to verify library linkage"
    command: "./test_mate_menus"

# Approximate assertion count for quality assessment
assertion_count: 2
