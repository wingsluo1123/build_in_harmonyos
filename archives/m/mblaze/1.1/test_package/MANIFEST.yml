package: mblaze/1.1
homepage: "https://github.com/leahneukirchen/mblaze"
upstream_check_command: "make check (prove -v over the twelve t/*.t TAP scripts)"
upstream_test_in_build: true
upstream_test_command: "python3 run_upstream_tests.py SOURCE_DIR (same twelve TAP scripts, sequentially with terminal stdin; counts every TAP assertion)"
upstream_test_result: "WSL Linux x86_64: 12 files, 135 PASS, 0 FAIL; OHOS armv8 pending"
upstream_tests:
  - {file: t/1000-mmime.t, assertions: 8}
  - {file: t/1500-maddr.t, assertions: 11}
  - {file: t/1501-maddr-regress.t, assertions: 33}
  - {file: t/1700-mshow.t, assertions: 2}
  - {file: t/2000-mpick.t, assertions: 29}
  - {file: t/3000-magrep.t, assertions: 10}
  - {file: t/4000-msed.t, assertions: 6}
  - {file: t/5000-mscan.t, assertions: 3}
  - {file: t/6000-msort.t, assertions: 5}
  - {file: t/7000-mseq.t, assertions: 11}
  - {file: t/8000-mflag.t, assertions: 16}
  - {file: t/9000-minc.t, assertions: 1}
test_package_tests:
  - {file: test.sh, description: "All twenty compiled binaries, six scripts, and four aliases are installed and executable"}
  - {file: test.sh, description: "maddr extracts an address from an installed-package Maildir fixture"}
  - {file: test.sh, description: "mhdr extracts the message subject"}
  - {file: test.sh, description: "magrep selects a message by subject"}
  - {file: test.sh, description: "msort processes an explicitly named message"}
  - {file: test.sh, description: "mmime validates the fixture message"}
  - {file: test.sh, description: "mseq resolves an indexed Maildir message"}
  - {file: test.sh, description: "mflag applies the seen flag to the indexed Maildir message"}
assertion_count: 8
