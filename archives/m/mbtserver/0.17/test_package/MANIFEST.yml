# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mbtserver.cxx
    description: "消费者链接测试：引用公共头并取 StartServer/StartJSONServer 地址，强制链接器解析 libmbtserver 真实符号（VersionInfo 上游未定义，故不引用）"
    command: "./test_mbtserver"
  - file: test_package/conanfile.py
    description: "mbtserver --help 冒烟测试：走 StartServer 立即退出路径（exit 0），输出必须含 usage 横幅（非空输出校验）"
    command: "mbtserver --help"
  - file: test_package/conanfile.py
    description: "mbtserver --version 冒烟测试：走 StartServer 立即退出路径（exit 0），不启动服务器、无挂起风险"
    command: "mbtserver --version"

