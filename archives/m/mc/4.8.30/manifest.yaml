patches_applied:
  - "configure.ac: m4_pattern_allow for dnl/AC_MSG_WARN/AC_MSG_ERROR (autoconf 2.73 compat)"
  - "config.guess: HarmonyOS platform recognition"
  - "config.sub: ohos OS alias"
  - "configure: umask 077 -> 022 (HarmonyOS temp dir permission fix)"
  - "po/Makefile.in: add top_builddir variable (gettext 1.0 compat)"

knowledge_gained:
  - "autoconf 2.73 treats dnl/AC_MSG_WARN/AC_MSG_ERROR as undefined macros; use m4_pattern_allow"
  - "HarmonyOS umask 077 creates 700-permission dirs that the build process can't write to; use umask 022"
  - "config.guess/config.sub need HarmonyOS (uname -s) and ohos triplet support"
  - "conan .la files have incorrect libdir paths; remove .la files to force direct .a/.so linking"
  - "mc needs libtermcap when slang uses termcap; create dummy libtermcap.a"
  - "gettext 1.0 po/Makefile.in.in missing top_builddir variable; patch po/Makefile.in"

