# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mc/4.8.30
homepage: "https://www.midnight-commander.org"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/lib/mc_realpath.c
    source: mc-4.8.30/tests/lib/mc_realpath.c
    description: "mc realpath function test"
    command: "make check"

# test_package 中自带的测试
test_package_tests:
  - file: test_mc.sh
    description: "Run mc --version to verify binary works"
    command: "./test_mc.sh"

# 测试断言总数
assertion_count: 3
