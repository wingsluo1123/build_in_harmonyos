# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mcpp/2.7.2
homepage: "https://mcpp.sourceforge.net/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A (compiler-independent-build; make check requires --enable-replace-cpp + GCC testsuite)"

# 上游测试套件 (cpp-test Validation Suite)
upstream_tests:
  - name: "test-t (103 files)"
    source: mcpp-2.7.2/cpp-test/test-t/
    description: "C preprocessing validation tests - trigraph, token, #if, #error, macro expansion, etc."
  - name: "test-l (141 files, 8 .c + 131 .h)"
    source: mcpp-2.7.2/cpp-test/test-l/
    description: "C preprocessing validation tests - long line, #include, #pragma, etc."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py (inline test)
    description: "消费者 smoke test: mcpp -v 版本输出 + mcpp 预处理简单宏展开"
    command: "mcpp -v && mcpp test_input.c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2