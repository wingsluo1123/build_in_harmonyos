# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mdbook/0.5.3
homepage: "https://github.com/rust-lang/mdBook"

# 上游测试命令 (用于 cargo test --list 分析)
upstream_check_command: "cargo test --lib -p mdbook-core -- --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cargo test --lib -p mdbook-core"

# 上游实际运行的测试程序
# mdBook 使用 Rust 内置测试框架, 测试以 #[test] 属性内联在源码中
# 无独立测试二进制文件, 测试由 cargo test 统一编译和运行
upstream_tests:
  - file: src/
    source: mdBook-0.5.3/src/
    description: "Rust 内联单元测试 (#[test] 属性), 覆盖书籍解析、目录结构、配置解析、预处理、渲染等核心功能"
    command: "cargo test --lib -p mdbook-core"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "L2 smoke test: 验证 mdbook 二进制可执行且版本正确"
    command: "mdbook --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 35
