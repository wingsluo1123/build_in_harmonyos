package: mdtest/1.9.3
homepage: "https://sourceforge.net/projects/mdtest/"

upstream_test_in_build: false
upstream_test_command: "python3 test_mdtest.py (compatibility port of scripts/tester.py)"
upstream_tests:
  - name: "scripts/tester.py scenario matrix"
    count: 40
    description: "One help invocation plus all 39 upstream parameter scenarios: 31 positive executions complete successfully; eight shared-directory/multi-path combinations and the clean-directory -r maintenance invocation are classified by their exact negative diagnostic categories. The original Python-2 runner logs but does not inspect child status."

test_package_tests:
  - file: "test_mdtest.py"
    description: "Runs the installed signed AArch64 mdtest under packaged MPICH: executes and classifies all 40 upstream scenarios (31 positive and 9 deterministic negative outcomes), completes one HarmonyOS target-side 2-rank filesystem consumer workflow with barrier-adjacent start skew, validates no-barrier behavior, and checks five OHOS ELF/closure properties."
    command: "python3 test_mdtest.py --mdtest $PACKAGE_ROOT/bin/mdtest --mpiexec $MPI_ROOT/bin/mpiexec --interposer $BUILD_ROOT/libmdtest_delay.so --readelf /data/service/hnp/bin/llvm-readelf"

assertion_count: 47
