# 版本级 manifest — mednafen 1.32.1（ARCHIVE-SPEC v2.0）

version: "1.32.1"
software: "mednafen"
status: built
build_date: "2026-10-18"
build_system: "autotools"

source:
  url: "https://mednafen.github.io/releases/files/mednafen-1.32.1.tar.xz"
  sha256: "de7eb94ab66212ae7758376524368a8ab208234b33796625ca630547dbc83832"
  tar_format: tar.xz

build:
  system: autotools
  # 参数最少化（R1）：原生 driver 只传 --prefix；配方侧 AutotoolsToolchain 自动补
  # --prefix=/ + --bindir/--datadir 等，PKG_CONFIG_PATH 由配方 generate() 注入
  # （指向 PkgConfigDeps 的 generators 目录）。
  # 不加 --enable-*/--disable-*：ALSA/JACK 上游本就优雅降级，
  # --with-external-* 默认 no（用源码树内部实现）。
  # ⚠ 本字段会被 ohc-run.py driver 的 `_read_extra_args()` 逐条拼进**原生**
  # `sh configure` 命令行（shell 不做引号保护），所以只能放 shell 安全的字面量。
  # PKG_CONFIG_PATH 由配方 generate() 自己注入（值含 `<generators_folder>` 这类
  # 占位符会被 shell 当重定向 ⇒ `ambiguous redirect`，实测 configure 0 秒 RC=1），
  # 故这里保持为空：原生 configure 只需 --prefix（driver 自动加）。
  configure_options: []
  dependencies:
    - zlib/1.3.1.1
    - sdl2/2.30.10
    - flac/1.5.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-intl-lock.h.patch"
  - "0005-src-drivers-Joystick_Linux.cpp.patch"

knowledge_gained:
  - "config.guess/config.sub 最小补丁注入 HarmonyOS 分支（+11/-0、+2/-2 行）即可让 2018 年老脚本产出 aarch64-unknown-linux-ohos，无需 --build/--host（ref: E007, E1092, E072）"
  - "HMDFS 上 configure 内嵌 config.status 的 umask 077 && mktemp -d ./confXXXXXX 建出 drwx--S--- 目录导致 subs1.awk 写不进去，最小修法是 umask 077→022（ref: E114）"
  - "OHOS 的 <dirent.h> 不声明 GNU versionsort(3)，scandir 比较器需回退 POSIX alphasort（ref: E1574）"
  - "gnulib intl/lock.h 的 pthread_in_use() 用 pthread_cancel 探测，OHOS sysroot 无此符号，改用已声明的 pthread_self（ref: E1574）"

