# ── 上游 quirk（如实记录，未改上游源码）──────────────────────────────
upstream_quirks:
  - >-
    发布 tarball 是 0.4.5，但 megactl.c:91 的 `static char *version` 仍是
    "0.4.3-hmage"（上游发布时漏改，与 rtl-sdr 2.0.2 的 VERSION_INFO_PATCH_VERSION
    同类）。因此 `megactl -V` 打印 0.4.3-hmage；测试按实测值断言。
  - >-
    上游 Makefile 的 pattern rule `%.o: Makefile.bak %.c` 依赖一个发布 tarball 里
    不存在的 Makefile.bak；实测 GNU Make 4.3 下 make 与 make -j8 均正常（已用最小
    复现件证实），故无需补丁。
  - >-
    megatrace 不在 PROGRAMS 里、不属 all 目标，且 include x86 专有的 <asm/user.h>
    （aarch64 的 asm/ 指向 asm-generic，无 user.h）—— 只构建上游默认目标，与
    上游 make 行为一致，不擅自扩大交付范围。

notes: >-
  零外部依赖；构建零补丁。五处关键处置：①上游把 -g 硬编码进 CFLAGS/LDFLAGS，
  DWARF 会把交叉工具链 sysroot 的构建机绝对路径写进二进制（实测该路径在
  .debug_str 中出现 2 处），改为链接期 -Wl,--strip-debug（降为 0，
  .interp/.note.ohos.ident/.note.gnu.build-id 与符号表均保留）；②不用
  make install（HMDFS 用户态无 install(1)，且 install 的 -d/-m644 用法无法用
  cp 等价覆盖），改用 copy() 落包并 chmod，同时规避 T105 的 install 产物 EPERM；
  ③ARCH= 显式置空防环境串味；④conandata.yml 注释里不写裸 URL——门禁
  Pre-download 会扫描注释并做子串替换，前缀 URL 会把 sources.url 改坏
  （详见 notes.md §3.9）；⑤链接期**显式**索取 -Wl,--build-id=sha1：真机 OHOS
  clang 驱动不会自动给 build-id（本机 shim 会，故本地绿、CI 红，CI #79116 实证），
  而 test_package 用 build-id 证明两个 CLI 是分别编译的两个目标（详见 notes.md §3.10）。
  绝不能用
  make CFLAGS=... 追加选项——上游用 CFLAGS+=，命令行赋值会连 -I./schily 一起
  清掉导致 scg/scsi 头找不到（须走 CPPFLAGS）。详见 notes.md。
