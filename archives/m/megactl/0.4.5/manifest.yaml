  sha256: "3343edab107a33a70d2fa72e9fe0382bc4be2f428ccd1497609b5595e0871bbb"
  upstream_tag: "v0.4.5 (commit 8f86e0be53b273188bf2779d974fcf3f9c68b8f0, 2024-08-14)"
