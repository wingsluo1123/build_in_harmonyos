# test_package/MANIFEST.yml -- megasdk 4.17.1d
# CI (build_and_test.sh L0e) requires this file: upstream test declaration.

package: megasdk/4.17.1d
homepage: "https://github.com/meganz/sdk"

# Upstream test suite runs inside conanfile.py build() via `make check`.
upstream_check_command: "make check"
upstream_tests_exist: true
upstream_test_audit: "Upstream tag v4.17.1d registers automake TESTS in tests/include.am: TESTS = tests/test_unit tests/test_integration. tests/test_unit is 20 gtest translation units (tests/unit/*_test.cpp + main.cpp, linked against -lgmock -lgtest); tests/test_integration is 2 translation units (tests/integration/main.cpp + SdkTest_test.cpp) requiring live MEGA accounts and public network (getAccountsForTest). No other test runner exists in the tree."
upstream_test_in_build: true
upstream_test_command: "make -j1 check (parsed from test-suite.log # TOTAL/# PASS/# FAIL)"

upstream_tests:
  - file: tests/unit/main.cpp
    source: "sdk-4.17.1d/tests/unit/"
    description: "Upstream gtest unit suite (AttrMap/ChunkMacMap/Commands/Crypto/FileFingerprint/File/Logging/MediaProperties/MegaApi/PayCrypter/PendingContactRequest/Serialization/Share/Sync/TextChat/Transfer/User/utils; 20 test translation units)"
    command: "tests/test_unit (via make check)"
  - file: tests/integration/SdkTest_test.cpp
    source: "sdk-4.17.1d/tests/integration/"
    description: "Upstream integration suite; needs live MEGA accounts + public network (getAccountsForTest), unavailable in the build sandbox"
    command: "tests/test_integration (via make check)"

test_package_tests:
  - file: test_megasdk.cpp
    description: "C++ consumer: Base64 roundtrip/empty/itoa, URLCodec roundtrip, MegaProxy roundtrip, MegaApi construct/destroy (6 checks, local only, no network)"
    command: "./test_megasdk"

assertion_count: 6

# rule4: upstream total uses the official registration unit (automake TESTS
# programs in tests/include.am). Real pass counts come from the true-device
# preflight make check output.
upstream_test_total: 2
upstream_test_count_method: autotools_tests
