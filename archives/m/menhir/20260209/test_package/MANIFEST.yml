# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: menhir/20260209
homepage: https://gitlab.inria.fr/fpottier/menhir

# 上游测试命令
upstream_check_command: "dune runtest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "dune runtest"

# Menhir 测试套件 (test/ 目录)
upstream_tests:
  - name: "parser_generation"
    source: menhir-20260209/test
    description: "解析器生成测试"
    command: "dune runtest"
  - name: "bootstrap_consistency"
    source: menhir-20260209/test
    description: "Bootstrap 一致性验证"
    command: "dune runtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "menhir --version + 解析器生成验证"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30
