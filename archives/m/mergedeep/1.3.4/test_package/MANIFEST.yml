package: mergedeep/1.3.4
homepage: "https://github.com/clarketm/mergedeep"
upstream_check_command: "python3.12 -B -m unittest -v mergedeep.test_mergedeep"
upstream_test_in_build: true
upstream_test_command: "python3.12 -B -m unittest -v mergedeep.test_mergedeep"
upstream_tests:
  - file: mergedeep/test_mergedeep.py
    source: "mergedeep-ab871aff9eccb5e1bf0ea237c3cff8f6787ebc56/mergedeep/test_mergedeep.py"
    description: "Full original unmodified unittest.TestCase: 14 test methods; tox originally used pytest"
    command: "python3.12 -B -m unittest -v mergedeep.test_mergedeep"
test_package_tests:
  - file: consumer.py
    description: "One installed-package consumer: 12 strict Mapping conflicts, 3 same-type Counter, 1 recursive dict/list, 4 nonstrict Mapping vectors; 20 public merge calls"
    command: "python3.12 -B consumer.py --package-folder <Conan-package-folder>"
