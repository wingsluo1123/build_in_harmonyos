package: meteocalc
version: "1.1.0"
upstream_url: "https://github.com/malexer/meteocalc"
upstream_tests_exist: true
upstream_test_total: 35
upstream_test_framework: unittest
upstream_test_command: "python -m unittest discover -v"
upstream_tests_run_in_build: true
consumer_test_command: "python test.py <installed-site-packages>"
consumer_test_total: 10
consumer_end_to_end_total: 1
consumer_end_to_end_command: "python weather_report.py <installed-site-packages> <observations.csv> <report.json>"
consumer_end_to_end_scope: "Actual CSV input, installed-module calculations, JSON output and invalid-input failure; runnable on OHOS and native hosts."
notes: >-
  Official 1.1.0 tag includes all tests and MIT LICENSE. PyPI sdist omits them,
  so source() uses the official GitHub tag archive. Consumer executes outside
  source tree, prepends the installed module path and checks the module's location.
  One complete consumer application exercises file I/O, process execution, weather
  calculations and error propagation; nine original interface checks are retained.
  Actual language is Python, despite task cpp label.
