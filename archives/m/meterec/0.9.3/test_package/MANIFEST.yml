package: meterec/0.9.3
runner: test_package
commands:
  - "test (upstream queue self-test, absolute path)"
  - "test (deterministic dump: 12 separators, 20 queue lines)"
  - "meterec -h"
  - "meterec (no args, no jackd: negative)"
  - "sh meterec-init-conf (no args: negative)"
  - "sh meterec-init-conf testsess"
assertions:
  - "upstream queue self-test exits 0"
  - "self-test dump deterministic: 12 '====' separators, 20 'queue N' lines, first line 'queue 1 - type 1 - old 1 - new 1 - buf 1'"
  - "meterec -h prints 'version 0.9.3' and exits 1 (upstream usage() semantics)"
  - "usage text lists the -f/-o options"
  - "meterec without a JACK server exits non-zero with \"Failed to start 'meterec' jack client\""
  - "meterec-init-conf without args prints usage and exits 1"
  - "meterec-init-conf testsess creates testsess.mrec containing ports=( and version=1;"
