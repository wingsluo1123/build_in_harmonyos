sources:
  url: "https://codeload.github.com/NXPmicro/mfgtools/tar.gz/refs/tags/uuu_1.5.243"
  sha256: "9ea8d3f98081372e957e04d748eb50ed3b23a128710f1c3549a3f84b5a33b94b"
  filename: "uuu_1.5.243.tar.gz"
  note: >-
    任务平台条目名是 `mfgtools 1.5.243`，其上游是 **NXPmicro/mfgtools**，产物叫 **`uuu`**
    （Universal Update Utility，i.MX 烧写工具）。
    ⚠️ 源改为 **codeload 的 tag 归档**（360,706 字节，实测 HTTP 200），不再用
    `github.com/…/releases/download/…` 的 release 资产：后者是本环境里最不利的一类源
    （本机实测完全不可达、CI 侧只能靠改写走镜像），且解包后达 26 MB，是"源码下载超时"的合理嫌疑；
    codeload 则是本仓库其他配方上实测可用的通道。该 tag 归档里 `libuuu/`、`uuu/`、各 CMake 与
    `.gitmodules` 齐全，但**子模块只有挂载点、没有内容** —— 本配方用的依赖全部来自 conan
    （bzip2/openssl/libusb/zstd/tinyxml2/zlib），不依赖随包 vendored 副本。sha256 为本地实测值。
