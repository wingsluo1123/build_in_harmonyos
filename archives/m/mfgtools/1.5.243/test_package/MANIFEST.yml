# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mfgtools/1.5.243
homepage: "https://github.com/NXPmicro/mfgtools"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "（上游无测试）本配方补跑：LD_PRELOAD 打桩 libusb 后 `uuu -h` + `uuu -V`（均断言输出）"

upstream_tests:
  - name: "（上游没有测试套件：源码树无 test/tests，CMake 无 enable_testing/add_test）"
    count: 0
    description: >-
      **上游测试数 = 0，如实声明**。按仓库既有做法在配方里补一条能真跑的功能级测试：构建完成后直接运行
      产物。本沙箱/CI **没有 USB 子系统**，而 uuu 在解析参数前就 `libusb_init` → 原生运行返回 rc=-6 且输出
      `std::runtime_error: Call libusb_init failure`。→ **改用 LD_PRELOAD 给 libusb 打桩**（只让 init/
      热插拔注册/设备枚举“成功且无设备”，不伪造设备）后**真跑通**：`uuu -h` rc=0 打印上游用法、`uuu -V`
      打印 libuuu 版本横幅 ⇒ **1/1（100%）**；原生那次的 rc=-6 在消费者侧单独记 skip、**不计入通过**，
      不据此让 build 失败（环境限制而非适配缺陷）。

test_package_tests:
  - file: check_uuu.py
    description: >-
      R34 消费者校验 **6 项**（全部离线）：①产物齐备（`bin/uuu` 可执行）②ELF 头自检（真 ELF64、
      machine=0xB7 AArch64）③原生 `uuu -h`（无 USB → **具名平台限制，单独记 skip**）③′打桩后 `uuu -h`/`uuu -V` **真跑通**（断言输出）④无参调用有明确输出
      ⑤许可证随包（BSD-3-Clause）⑥证据（sha256 + python 版本）。
    command: "python3 check_uuu.py <package-folder>"

assertion_count: 6
added_tests_note: >-
  本库**上游 0 测试**；上表 `upstream_tests.count = 0`，另在配方内补了 1 条功能级断言
  （见 `upstream_test_command`），消费者校验 6 条。**三者分开计数**，不混成一句“测试全过”。
