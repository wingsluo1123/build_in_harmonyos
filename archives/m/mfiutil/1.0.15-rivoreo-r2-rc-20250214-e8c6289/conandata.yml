# conandata.yml — mfiutil 1.0.15-rivoreo-r2-rc-20250214-e8c6289
# 上游：Rivoreo 项目（rivoreo.one 项目页 + Debian .dsc 维护者 WHR
# <whr@rivoreo.one> 即上游作者本人）。官方 Gitiles 源码库
# https://src.rivoreo.one/mfiutil 在版本串内嵌提交
# e8c62898089593cd039b7d0360e030f04f9bfb45（2025-02-14）处提供归档，
# HTTP 200；但该归档为每次请求即时生成，gzip 头带当前时间戳，
# 两次下载 sha256 不同（实测 d2d78e2b… vs 84a6c89e…），无法钉校验和。
#
# 因此改用 Debian 官方归档（deb.debian.org 是 Debian 官方 CDN，不是第三方
# 镜像站）中同一提交的 orig tarball：mfiutil_1.0.15-rivoreo-r2~rc-20250214
# -e8c6289.orig.tar.bz2，其 Checksums-Sha256 与同目录 PGP 签名 .dsc
# （Debian 维护者签发）逐字一致；内容与上游 Gitiles 树 diff -r 完全相同
# （仅少一个 .gitignore，Debian 打包惯例剥离子 VCS 文件，不影响构建）。
# 仓库内已有 497 个配方以 deb.debian.org 为源，属既有官方取源通道。
#
# 镜像回退由 CI 的 get_mirrors 自动追加，配方内不手写镜像前缀。

sources:
