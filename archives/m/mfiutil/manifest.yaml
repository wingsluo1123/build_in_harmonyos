software: mfiutil
display: "mfiutil"
description: "LSI MegaRAID SAS 控制器管理工具：adapter/firmware 查询、BBU、patrol read、foreign 配置导入、固件刷写"
category: storage
homepage: "https://rivoreo.one/?id=Project:mfiutil"
license: BSD-2-Clause AND MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 C 程序（13 个 .c），手写 Makefile，仅依赖 libc，无第三方库"
    - "Linux 代码路径由 __linux__ 预定义宏选择（OHOS clang 目标 aarch64-linux-ohos 同样定义），FreeBSD/Solaris/Darwin 专属头文件均被条件编译排除，无源码补丁"
    - "Makefile 硬编码 CC:=gcc，命令行赋值覆盖即可（GNU make 语义）；CFLAGS 保持默认 -std=gnu99 -Wall -Os"
    - "Gitiles +archive 归档为扁平结构，conan get 需 strip_root=False"
  common_dependencies: []

versions:
  "1.0.15-rivoreo-r2-rc-20250214-e8c6289":
    status: built
    build_date: "2026-10-17"
    conan: true
