software: microsocks
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.5"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/rofl0r/microsocks/archive/refs/tags/v1.0.5.tar.gz"

  # 源码校验和
  sha256: "939d1851a18a4c03f3cc5c92ff7a50eaf045da7814764b4cb9e26921db15abc8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "microsocks是纯Makefile项目，无需configure脚本，conanfile.py直接生成config.mak"
  - "microsocks --help输出到stderr(dprintf(2,...))，测试需捕获stderr"
  - "microsocks --help退出码为1，测试需用shell脚本包装处理非零退出码"
  - "conan basic_layout会创建build-release子目录，需用make -C指向source_folder"

patch_generation:
  method: none
  patches_count: 0
