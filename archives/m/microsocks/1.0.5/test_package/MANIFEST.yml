# test_package/MANIFEST.yml
# Upstream test declaration file (required by CI L0e)

package: microsocks/1.0.5
homepage: "https://github.com/rofl0r/microsocks"

# Upstream test command analysis
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# microsocks has no automated test suite (no `make check` target)
# Upstream relies on manual testing of SOCKS5 protocol functionality
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Run microsocks --help to verify binary is functional"
    command: "microsocks --help"

# Approximate assertion count
assertion_count: 1
