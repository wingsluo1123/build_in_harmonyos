# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: midi-parser/3.6
homepage: "https://github.com/abique/midi-parser"

# 上游测试命令（清点结果：上游无 tests/ 目录、无 ctest 注册，
# 仅有 example/midi-dump.c 演示程序，故 make check 无对应目标）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（演示程序，非断言测试；已在真机用最小 SMF 实测通过）
upstream_tests:
  - file: example/midi-dump.c
    source: midi-parser-3.6/example/midi-dump.c
    description: "midi-dump 演示程序：解析 .mid 文件并输出 header/track/midi 事件流"
    command: "./midi-dump smoke.mid"

# test_package 中自带的测试（消费者视角验证，真实调用库 API 断言事件序列）
test_package_tests:
  - file: test.c
