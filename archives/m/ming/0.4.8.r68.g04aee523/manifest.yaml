knowledge_gained:
  - "源码包不含生成的 configure（只有 configure.ac/Makefile.am），build() 须 autoreconf 自举；宿主与 CI 缺 automake/aclocal/libtool（E178），用 tool_requires 补齐"
  - "config.guess 不认 HarmonyOS，且在本平台写探针临时文件被拒 → 显式传三元组跳过；automake 1.18 的 config.sub 只接受 aarch64-unknown-linux-gnu（*-ohos/*-musl 均被拒）"
  - "config.status 的 (umask 077 && mktemp -d) 临时目录在 HMDFS 上不可写（E114）→ sed 放宽为 umask 000"
  - "flex/bison 各产生一份暂定定义，clang 11+ 默认 -fno-common 使其变强符号 → -fcommon"
  - "注入依赖 -I/-L 不能带引号（否则指向不存在目录致可选库静默禁用）；系统自带 zlib 会掩盖该问题"
  - "本平台 LD_LIBRARY_PATH 无法穿透 make→sh→perl→libtool wrapper 子进程链 → 运行期改用 ELF RUNPATH"
  - "OHOS 无 cpp 可执行文件 → ActionScript 用例的预处理器改 clang -E（util/makeswf_utils.c 的 CPP 宏）"
  - "OHOS 的 /tmp 是只读文件系统（Errno 30）→ util/main.c 的 cws2fws() 硬编码 /tmp 会让 listswf/swftocxx 等处理压缩 SWF(CWS) 全部失败；改为优先取 TMPDIR"
  - "Conan 2.29 的 copy() 无 delete 参数（ADAPTATION_GUIDE 模板过时）→ 改用 rm()"

