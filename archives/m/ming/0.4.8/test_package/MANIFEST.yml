# test_package/MANIFEST.yml — ming 0.4.8 适配验证清单
#
# 上游测试来源声明：
#   - build_system: autotools（configure.in，libming 0.4.8）
#   - 上游无独立消费者测试套件（本项目以 test_package 为准）
#
# test_package 消费者用例（新增）：
#   test_ming.c — Ming_init + Ming_setSWFCompression + Ming_cleanup 冒烟
package: ming/0.4.8
homepage: https://github.com/libming/libming

upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - name: ming-init-cleanup
    command: "./test_ming"
    assertions:
      - "Ming_init 初始化成功（返回 0）"
      - "Ming_setSWFCompression 设置 SWF 压缩级别"
      - "Ming_cleanup 生命周期完整"
