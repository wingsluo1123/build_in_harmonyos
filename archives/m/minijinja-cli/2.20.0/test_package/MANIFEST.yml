# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: minijinja-cli/2.20.0
homepage: "https://github.com/mitsuhiko/minijinja"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cargo test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# minijinja-cli upstream tests require cargo test infrastructure (insta framework),
# which is a Rust-specific test runner. We use smoke test instead.
upstream_tests:
  - file: test.sh
    source: minijinja-cli-2.20.0/test_package/test.sh
    description: "Smoke test: verify minijinja-cli binary runs and renders templates"
    command: "bash test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 验证 minijinja-cli --version 输出正确版本号及模板渲染"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
