package: minimap2/2.30
homepage: "https://github.com/lh3/minimap2"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/MT-human.fa
    source: minimap2-2.30/test/MT-human.fa
    description: "Reference sequence for alignment test"
    command: "./minimap2 -x map-pb test/MT-human.fa test/MT-orang.fa"
  - file: test/MT-orang.fa
    source: minimap2-2.30/test/MT-orang.fa
    description: "Query sequence for alignment test"
    command: "./minimap2 -x map-pb test/MT-human.fa test/MT-orang.fa"

test_package_tests:
  - file: test.c
    description: "Library API test: mm_set_opt initialization and version check"
    command: "./test_minimap2"

assertion_count: 2
