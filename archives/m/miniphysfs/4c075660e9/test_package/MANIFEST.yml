# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: miniphysfs/4c075660e9
homepage: "https://github.com/edubart/miniphysfs"

# 上游测试命令: 上游 test/Makefile 无 check 目标，测试即编译并运行 test_physfs
upstream_check_command: "make CC=clang && ./test_physfs"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "sh -c 'make clean >/dev/null 2>&1; make CC=clang' && printf 'help\\ninit /tmp\\ngetbasedir\\nquit\\n' | ./test_physfs"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_physfs.c
    source: miniphysfs-4c075660e9/test/test_physfs.c
    description: "PhysFS 官方交互式测试 REPL（本配方以脚本化输入驱动 help/init/getbasedir/quit，验证库初始化与平台路径查询）"
    command: "printf 'help\\ninit /tmp\\ngetbasedir\\nquit\\n' | ./test_physfs"

# test_package 中自带的测试 (消费者视角验证 + HarmonyOS 行为验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：PHYSFS 版本/初始化/平台目录/真实文件系统写入-读取-枚举-删除闭环（20 项断言）"
    command: "./test_miniphysfs"
  - file: test_e2e.c
    description: "端到端消费者用例（rule12）：挂载真实目录→枚举→打开读取→内容逐字校验→unmount/deinit 清理（13 步全流程）"
    command: "./test_miniphysfs_e2e"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 33