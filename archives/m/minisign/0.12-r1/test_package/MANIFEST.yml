# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: minisign/0.12-r1
homepage: "https://github.com/jedisct1/minisign"

# 上游测试命令 — minisign is a CMake project with no upstream test suite
# (CMakeLists.txt only builds the binary, no add_test())
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (minisign 无上游测试程序)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能冒烟测试: minisign二进制存在性 + ELF格式验证 + libsodium链接验证 + minisign -v版本检查"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
