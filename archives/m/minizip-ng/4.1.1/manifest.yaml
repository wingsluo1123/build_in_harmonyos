software: minizip-ng
version: "4.1.1"
status: built
build_date: "2026-08-06"
build_system: cmake

source:
  url: "https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.1.1.tar.gz"
  sha256: "ecc1a514f9e455cb627a768e1219369c576a761bc04196941590906c8b622d7e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: "MZ_OPENSSL=ON MZ_ICONV=ON MZ_BUILD_TESTS=OFF"

dependencies:
  - zlib/1.3.1
  - bzip2/1.0.8
  - openssl/3.5.6
  - xz/5.6.2
  - zstd/1.5.7

features:
  MZ_ZLIB: ON
  MZ_BZIP2: ON
  MZ_LZMA: ON
  MZ_PPMD: ON
  MZ_ZSTD: ON
  MZ_PKCRYPT: ON
  MZ_WZAES: ON
  MZ_OPENSSL: ON
  MZ_ICONV: ON
  MZ_COMPAT: ON

patches:
  - file: "patches/0001-CMakeLists.txt.patch"
    description: "Bridge conan CMakeDeps targets to standard CMake uppercase variables; fix ZSTD target name; find iconv.h via compiler implicit include dirs; install mz_config.h generated header"
    type: portability
