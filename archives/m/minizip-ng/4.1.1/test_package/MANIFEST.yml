# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: minizip-ng/4.1.1
homepage: "https://github.com/zlib-ng/minizip-ng"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: minizip.c
    source: minizip-ng-4.1.1/minizip.c
    description: "minizip CLI tool - create/extract zip archives"
    command: "./minizip test.zip test.txt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_minizip_ng.c
    description: "Functional test: create zip archive, extract, verify content integrity"
    command: "./test_minizip_ng"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
