knowledge_gained:
  - "E007 边界：2012 版 config.guess 没有新版才有的 GUESS 变量出口机制，patch-autotools-ohos.pl 插入的分支只赋值不输出，脚本仍报 unable to guess system type；须改为 echo ... ; exit ;;（老版 config.sub 同样缺 android-linux 锚点，需手工补三处 ohos 支持） [knowledge_ref: E007, E429]"
  - "E114 边界：umask 077 的临时目录问题不止出现在生成的 configure/config.status，config.guess 运行期也会用 umask 077 && mktemp -d $TMPDIR/cgXXXXXX 建目录并写 dummy.c，须一并去除 [knowledge_ref: E110, E114, E430]"
  - "E127 落地：OHOS libc 连 pthread_cancel/pthread_setcancelstate/pthread_testcancel 符号都不导出，仅提供空操作回退会让 pthread_cancel+pthread_join 成对调用永久阻塞；必须同时把线程改成协作式停止（stop 标志 + 分片等待） [knowledge_ref: E127, E431]"
  - "E119 落地：内核 UAPI linux/if_ether.h 与 libc netinet/if_ether.h 都定义 struct ethhdr，非 glibc libc 下重复定义编译失败；按 libc 特性宏 __UAPI_DEF_ETHHDR 守卫（同 xdp-tools 先例） [knowledge_ref: E119]"
  - "E432 处置：补丁工具对新增文件固定写 --- a/... 头部（Conan 需 /dev/null）且会覆盖 AI 判定行，预生成 configure 又被判为 GENERATED 无法进补丁；新增代码优先内联进既有文件，GENERATED 的 E114 改写在配方 build() 内做 [knowledge_ref: E432, E490]"

