- "reuse_existing E506: undefined symbol:.*_neon — HarmonyOS cmake 平台探测返回 CMAKE_SYSTEM_PROCESSOR=unknown 导致 NEON 实现源未编译，uname -m 回填解决（等价命中，路径 A）"
- "related E092: System is unknown to cmake — CMake 不识别 HarmonyOS 平台，需修正平台/处理器探测"
