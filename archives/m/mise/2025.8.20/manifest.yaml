software: mise
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2025.8.20/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2025.8.20"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jdx/mise/archive/refs/tags/v2025.8.20.tar.gz"

  # 源码校验和
  sha256: "f92d22face0128612fe27039f80beae0cd30335240cb7be1aff22b429048f485"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

