# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mkinitfs/3.4.5
homepage: "https://github.com/alpinelinux/mkinitfs"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# mkinitfs has a test.sh script but it requires a running kernel and block devices
upstream_tests:
  - file: test.sh
    source: mkinitfs-3.4.5/test.sh
    description: "Upstream integration test (requires kernel + block devices, not runnable in CI)"
    command: "./test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify mkinitfs binary is installed and shows help"
    command: "mkinitfs -h"

# 测试断言总数
assertion_count: 2
