software: mksh
display: "mksh"
description: "MirBSD Korn Shell — 兼容 POSIX 的现代 Korn Shell 实现"
category: system
homepage: "https://mbsd.evolvis.org/"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "使用 Build.sh 自定义脚本编译，非标准 autotools/cmake"
    - "Build.sh 自动检测平台和编译器特性，原生支持 clang"
    - "静态链接使用 LDFLAGS=-static（R26 终端工具规范）"
    - "HarmonyOS /tmp 只读导致部分 test.sh 测试失败"
    - "mksh 不支持 --version/--help 标志（shell 语义），Conan L2 会失败"
  common_dependencies: []

versions:
  "59c":
    status: built
    build_date: "2026-06-30"
    conan_ref: "mksh/59c@ohpcd/stable"
