knowledge_gained:
  - category: L1
    content: >-
      **conan 下 CMake 工程的四处"目标名/路径"不匹配，逐条给可复用处理**：①**CMake ≥4 移除了对
      cmake_minimum_required(<3.5) 的兼容**（上游写 VERSION 3.0 会直接报 Compatibility with CMake < 3.5
      has been removed）→ 按报错提示给 `CMAKE_POLICY_VERSION_MINIMUM=3.5`，不改上游；②上游用
      **CMake 内置模块**的目标名（`FLAC::FLAC`/`JPEG::JPEG`），而 conan 的 CMakeDeps 生成**小写目标**
      （`flac::flac`/`libjpeg-turbo::libjpeg-turbo`）→ 在配方里改写这两处链接目标；③conan 的 config 按
      **包名**命名（`libjpeg-turbo-config.cmake`），上游的 `find_package(JPEG)` 找不到它 → 改成
      `find_package(libjpeg-turbo REQUIRED)`；④依赖 include 不通过目标传播（实测 `lame.h` not found），
      且 **LAME 的头是嵌套目录** `<lame>/include/lame/lame.h` 而上游写 `#include <lame.h>` → 在
      **add_executable() 之前**注入依赖 include（含 `<lame>/include/lame`），否则 include_directories
      对已创建的 target 不生效。
    reason: "mlc 1.2.0 适配实测——7 轮 CI 才打通（策略下限 / 目标名 / config 命名 / 嵌套头目录）"
