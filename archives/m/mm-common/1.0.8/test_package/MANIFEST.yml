package: mm-common/1.0.8
homepage: "https://gtkmm.gnome.org/"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
  - file: test_mm_common.py
    description: >-
      Runs the installed mm-common-get and mm-common-prepare against a scratch
      tree: --version reports 1.0.8, Meson build scripts and doctool files are
      copied out of the package, Autotools AC_CONFIG_AUX_DIR and
      MM_CONFIG_DOCTOOL_DIR .am/doctool files are copied, the copies are
      byte-identical to the package's own share/mm-common data, and (when
      pkg-config can resolve mm-common-util) doctooldir points inside the package.
    command: "python3 test_mm_common.py"
assertion_count: 14
