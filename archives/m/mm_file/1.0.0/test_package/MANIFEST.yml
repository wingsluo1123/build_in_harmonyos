# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mm_file/1.0.0
homepage: "https://github.com/jermp/mm_file"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# mm_file 上游仅有 test/test.cpp + test/CMakeLists.txt（单可执行 test）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
# mm_file 为 header-only 库，无编译构建；上游测试仅在本机适配验证阶段实际运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: mm_file-1.0.0/test
    description: "mm_file 上游测试：file_sink 写入 / file_source 读取 / iterator / advice"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实调用 mm_file API（file_sink 写 + file_source 读回校验 + iterator）"
    command: "./test_mm_file"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
