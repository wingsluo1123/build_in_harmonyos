package: mmllib/1.4
homepage: "https://edugit.org/nik/mmllib"
upstream_check_command: "python3.12 -B -m unittest discover -v"
upstream_test_in_build: true
upstream_tests:
  - file: test/test_parser.py
    description: "3 original parser tests; retain metadata fields, compare floating duration to 12 decimal places"
  - file: test/test_playlist.py
    description: "1 original timed-playlist test with unchanged util and loreley data"
  - file: test/test_musicxml.py
    description: "1 original exact Loreley XML test plus 3 new regression methods, 5 parameterized subcases"
test_package_tests:
  - file: consumer.py
    description: "One installed-wheel API and CLI workflow, including numeric pitch, rest, file export, and lint"
    command: "python3.12 -B consumer.py --package-folder <Conan-package-folder>"
assertion_count: 11
