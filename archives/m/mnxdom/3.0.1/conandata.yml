# conandata.yml — mnxdom 3.0.1
#
# 上游：https://github.com/mnx-works/mnxdom （tag v3.0.1, commit 488aa8757ec602c20ff8cf599a2c6857339d8e93）
# 许可证：MIT
#
# 说明：MNX 文档对象模型（C++17）。除 nlohmann_json（走 ohpcd 制品仓）之外，
# 还依赖 pboettch/json-schema-validator —— 上游把它钉在 commit 40af3ec3，
# 而制品仓只有 2.1.0（schema $id 继承处理不同，会让 schemaValidate() 抛
# "already inserted"，上游测试全挂）。依赖库的适配/发布属于另一个 PR，
# 因此这里把该 commit 的官方源码作为随配方下发的内嵌依赖源。
#
# R39/PF7：URL 只写官方源，镜像 fallback 由 CI/W3 统一注入，配方内不出现镜像前缀。

sources:
  url: "https://github.com/mnx-works/mnxdom/archive/refs/tags/v3.0.1.tar.gz"
  sha256: "1fc1799c76651a58f8bd88b69b098f263ebb9646604a544745b231373508ccb8"

# 随 mnxdom 一起静态编译的私有依赖（不进 package_info 的 requires）
embedded_sources:
  json-schema-validator:
    url: "https://github.com/pboettch/json-schema-validator/archive/40af3ec39670e768fc3f01f935140af311d71024.tar.gz"
    sha256: "36d7e99a73aa6076834736f0fb108fa8e232c4739aa4b3e2089fe96efb21fa8d"

patches: {}
