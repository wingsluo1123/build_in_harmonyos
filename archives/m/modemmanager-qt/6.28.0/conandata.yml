# conandata.yml - modemmanager-qt 6.28.0
# Upstream source: official KDE Frameworks 6.28.0 release tarball.
# download.kde.org is a Mirrorbits redirector; on some networks the mirror it
# selects answers with a broken (demo) TLS certificate, so two authoritative
# KDE mirrors are listed as fallbacks (R39: official source or authoritative
# mirror). The sha256 below pins the identical official tarball whichever
# mirror answers first. No source patches: the OHOS adaptation is entirely in
# conanfile.py (pkg-config module, CMake platform variables, session bus).

sources:
  url:
    - "https://download.kde.org/stable/frameworks/6.28/modemmanager-qt-6.28.0.tar.xz"
    - "https://mirrors.nju.edu.cn/kde/stable/frameworks/6.28/modemmanager-qt-6.28.0.tar.xz"
    - "https://mirrors.aliyun.com/kde/stable/frameworks/6.28/modemmanager-qt-6.28.0.tar.xz"
  sha256: "742891c3c1dfcd6c9eaa2b1664cfe7e9b311187eec7ecd9d8812829dce8485c9"

patches:
  "6.28.0": []
