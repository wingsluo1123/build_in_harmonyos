sources:
  "1.24.2":
    # gitlab.freedesktop.org official archive (freedesktop.org release tarball
    # is behind a bot-check page; gitlab source verified reachable, sha256
    # verified twice by independent downloads)
    url: "https://gitlab.freedesktop.org/mobile-broadband/ModemManager/-/archive/1.24.2/ModemManager-1.24.2.tar.gz"
    sha256: "fbc75adcc0d7b0565f256e7ff4e8872b0a37c4413ff576665f7470932d9c1b68"
    tar_format: tar.gz
patches:
  "1.24.2":
    - patch_file: "patches/0001-meson-daemon-option.patch"
      patch_type: "portability"
      patch_description: "Add a neutral -Ddaemon meson option gating the src/ daemon, cli/ (mmcli), examples/sms-c, test/ and tools/tests subdirs; with -Ddaemon=false only libmm-glib (client library + headers + generated types) is built, the headers-only ModemManager.pc (normally generated by src/meson.build) is generated from the top level instead so mm-glib.pc's requires stays resolvable, and the daemon-side test suites are not configured (test/ links internal daemon libraries declared in src/meson.build and expects real TTY/udev devices at runtime; tools/tests runs through a D-Bus session-bus wrapper), so -Dtests=true keeps working in a library-only build and runs the offline suites (libmm-glib/tests, libqcdm/tests). Upstream 1.24.2 unconditionally builds the daemon, which requires a running D-Bus system bus, udev, libgudev and per-vendor plugin stacks at runtime; the library-only cut keeps the same code path verifiable on Linux"
      patch_source: "https://gitlab.freedesktop.org/mobile-broadband/ModemManager"
