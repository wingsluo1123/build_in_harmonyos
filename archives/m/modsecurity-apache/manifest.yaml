software: modsecurity-apache
display: "ModSecurity v2 Apache Module"
description: "ModSecurity v2 open source web application firewall — Apache2 connector module"
category: network
homepage: "https://github.com/owasp-modsecurity/ModSecurity"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "三套 config.guess/config.sub（modsecurity/apr-util/httpd）需 HarmonyOS 补丁，配方内复刻 E007 脚本逻辑"
    - "apr-util 与 httpd 无可消费 Conan 包，配方私有构建仅作构建引导，不进包"
    - "mlogc 用上游 --disable-mlogc 关停；回归测试需 live Apache，不在 make check 内"
  common_dependencies:
    - apr
    - pcre
    - libxml2
    - lua
    - curl
    - yajl

versions:
  "2.9.13":
    status: built
    build_date: "2026-10-15"
