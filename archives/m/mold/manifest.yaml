# 软件级 manifest
# 文件位置: archives/m/mold/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: mold
display: "mold"
description: "mold — high-performance drop-in replacement for the GNU linker ld"
category: tool
homepage: "https://github.com/rui314/mold"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS libc++ 缺少 C++20 std::ranges 完整支持，需要用自定义 shims 替换"
    - "OHOS libc++ 缺少 operator<=> 支持，需要手动添加 operator< 和 operator=="
    - "禁用 MOLD_USE_MIMALLOC 以避免 mimalloc 在 OHOS 上的兼容性问题"
    - "mold 内置了 zlib/blake3/zstd/TBB，不需要额外 conan 依赖"
    - "CMAKE_INSTALL_LIBEXECDIR=libexec 修复 CMake GNUInstallDirs 在 OHOS 上的默认值问题"
  common_dependencies: []

versions:
  "2.39.1":
    status: built
    build_date: 2026-08-07
