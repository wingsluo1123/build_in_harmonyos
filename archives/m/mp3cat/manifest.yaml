software: mp3cat
display: "mp3cat"
description: "MP3 流处理工具，用于拼接、清洗和分片 MP3 流"
category: data
homepage: "https://github.com/tomclegg/mp3cat"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "原始 Makefile 硬编码 cc，需补丁改为 $(CC)"
    - "原始 Makefile 不支持 DESTDIR，需补丁添加"
    - "原始代码不支持 --version/--help，需补丁添加"
    - "终端工具静态链接 (R26)"
    - "R33: 编译器路径从 self.conf.get() 获取"
  common_dependencies: []

versions:
  "0.5":
    status: published
    build_date: "2026-06-30"
    conan_ref: "mp3cat/0.5"
