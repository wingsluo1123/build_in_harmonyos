test_results:
  upstream_command: "n/a (v1.17 ships no automated test suite)"
  upstream_scope: "No automated upstream tests exist; build_examples/GNU_Make is a manual example only."
  test_package: "Consumer test builds a real mini C project (libmrtest + run) with the installed templates via the OHOS cross toolchain and asserts the .so symlink chain, ELF artifacts, and the make-pod-from-help usage contract"
  local_status: "conan create passed on WSL ext4 with ohos-aarch64-wsl (host=build) on 2026-10-13; test_package 11 unconditional assertions passed plus 2 conditional perl assertions"
  device_status: "pending CI"

knowledge_gained:
  - "mrbuild is a pure file-distribution package (Makefile templates + perl helper); nothing is compiled."
  - "GNU make 4.3 mishandles a second quoted include name (quotes not stripped -> No such file or directory); consumer Makefiles must use unquoted include paths."
  - "The footer hard-codes the GNU-ld-only --default-symver link flag on non-Darwin; LLVM lld (OHOS NDK) rejects it. The portability patch probes the linker and keeps the flag only when accepted."
