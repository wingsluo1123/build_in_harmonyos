package: mrtparse/1.6
homepage: https://github.com/t2mune/mrtparse
upstream_check_command: "python3 upstream_samples.py <absolute-package-folder>/lib/python <results-json>"
upstream_test_in_build: false
upstream_test_command: "python3 upstream_samples.py <absolute-package-folder>/lib/python <results-json>"
upstream_tests:
  - file: upstream_samples.py
    source: "mrtparse-1.6.tar.gz: samples/* and unmodified examples/summary.py; no automatic upstream suite at fixed v1.6 commit"
    description: "Validate all 12 unmodified sample inputs against their original-source summaries and decoder error boundaries; 31 documented BGP4MP_ENTRY records remain unsupported"
    command: "python3 upstream_samples.py <absolute-package-folder>/lib/python <results-json>"
test_package_tests:
  - file: functional.py
    description: "5 unittest consumer methods for plain/extended KEEPALIVE, state change, short timestamp, missing child header, and consecutive-record alignment; uses the selected actual package module"
    command: "python3 functional.py <absolute-package-folder>/lib/python <results-json>"
