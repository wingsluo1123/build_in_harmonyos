# test_package/MANIFEST.yml — mscompress 0.4
# CI L0e requires this file to exist.

package: mscompress/0.4
homepage: "https://github.com/stapelberg/mscompress"

# Upstream ships `make check` running test/test.sh (compress+expand round-trip).
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: test.sh
    description: "Upstream round-trip: mscompress test.txt, msexpand < test.txt_ > test.new, diff both against originals"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs installed mscompress/msexpand: compress sample, expand back, verify byte-identical round-trip"
    command: "bash test.sh"

assertion_count: 4