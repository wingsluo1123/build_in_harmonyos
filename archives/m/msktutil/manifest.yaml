software: msktutil
display: "msktutil"
description: "Tool to create and maintain Kerberos keytabs and Active Directory computer accounts"
category: security
homepage: "https://github.com/msktutil/msktutil"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "release tarball 自带生成的 configure，无需 autoreconf 自举"
    - "config.guess 无法识别 HarmonyOS，显式指定 --build/--host 三元组"
    - "krb5/openldap/SASL devel 经 cmd-pkgs 预编译包与上游头文件补齐"
    - "可选 udns 后端用 --with-udns=no 关闭，走 libc/libresolv 回退"
    - "上游无测试套件，test_package 对打包二进制做离线冒烟校验"
  common_dependencies: []

versions:
  - version: "1.2.2"
    status: built
    conan: true
    build_date: "2026-10-14"
