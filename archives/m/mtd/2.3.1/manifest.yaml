# 版本级 manifest — mtd 2.3.1
# 遵循 ARCHIVE-SPEC v2.0

version: "2.3.1"
software: "mtd"
status: built
build_date: "2026-10-17"
build_system: autotools

source:
  # mtd-utils 官方源: sigma-star GitHub 镜像 codeload tarball
  # (对应上游 git.infradead.org/mtd-utils.git tag v2.3.1; Savannah 发布目录已失效)
  url: "https://codeload.github.com/sigma-star/mtd-utils/tar.gz/refs/tags/v2.3.1"
  sha256: "f53cde04802439fa6ac2ffbd80955f2b790262c02bd6fa2f7783a19fdc33716d"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
  dependencies:
    - zlib/1.3.1
    - lzo/2.10
    - zstd/1.5.6
    - libuuid/2.42.2
    - openssl/3.0.21
  tool_requires:   # CI worker 无系统 automake/aclocal, 由 Conan 补齐 bootstrap 工具链
    - autoconf/2.72
    - automake/1.18
    - libtool/2.5.4
    - pkgconf/3.0.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ubifs-utils-mkfs.ubifs-mkfs.ubifs.c.patch (uuid 头路径; configure-umask 修复在 conanfile.py build() 内)"

knowledge_gained:
  - "E011: HMDFS 上 autotools 生成的 configure 内嵌 umask 077 创建临时目录导致 config.status 'Permission denied (subs1.awk)'，build() 内 Python 替换 umask 077→022（与 akku/guile 同类）"
  - "E566: automake 1.18 的 config.guess/config.sub 不认识 HarmonyOS triplet（本机 uname -s=HarmonyOS），configure 报 'cannot guess build type' → build() 内 _patch_config_guess_sub() 打 OHOS triplet 识别补丁（与 burp2/2.1.0 同款方案）"
  - "conan perl/5.42.2 (autotools 传递依赖) 为 aarch64-ohos 交叉编译版，Cwd.so 无法在构建机 dlopen，故 build() 内强制系统 perl /data/service/hnp/bin/perl 并手动逐步 aclocal→autoheader→automake→autoconf（与 burp2/2.1.0 同款方案）"
  - "CI worker 无系统 automake/aclocal（'Can't exec aclocal'），需 build_requirements 声明 tool_requires autoconf/automake/libtool/pkgconf 补齐 bootstrap 工具链"
  - "上游 #include <uuid.h> 在标准 libuuid 布局（include/uuid/uuid.h）下找不到，改为 <uuid/uuid.h>"
  - "mtd-utils 2.3.1 不依赖 lz4（configure.ac 无 lz4 检查），依赖 zlib/lzo/zstd/libuuid/openssl"

