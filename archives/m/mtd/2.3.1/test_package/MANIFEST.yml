# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mtd/2.3.1
homepage: "https://www.linux-mtd.infradead.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# make check (automake TESTS) 仅注册 1 个测试: tests/jittertest/filename_bounds.sh
# (本机实测 1/1 PASS); 其余测试为 tests/ 下 shell 脚本套件, 需 MTD 设备/
# root 环境, 不在 automake TESTS 内 (ubifs_tools-tests/ubi-tests/fs-tests)
upstream_tests:
  - file: tests/jittertest/filename_bounds.sh
    source: mtd-utils-2.3.1/tests/jittertest/filename_bounds.sh
    description: "jittertest 文件名边界测试 (automake TESTS 唯一注册测试, 实测 PASS)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mtd.sh
    description: "运行打包后核心工具 mtdinfo/flash_erase/ubiformat/mkfs.ubifs 等验证可执行性与版本输出"
    command: "mtdinfo --version; flash_erase --help; ubiformat --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
