# conandata.yml — mtink 1.0.16
#
# 版本实核（三个独立渠道互证，读数见 notes.md）：
#   1) Debian 源码包上游 orig 归档（deb.debian.org 官方镜像池，HTTP 200 /
#      Content-Length 916315）：mtink_1.0.16.orig.tar.gz
#      sha256 = 187e8d145e818b4b56be203403f5fe28c02f899d30d92c58e82bcef311555ba2
#   2) 本批 scout 独立下载同名归档 sha256 同上（逐字节一致，见
#      kb-scout sha256.txt）
#   3) Debian salsa 版本库 refs/tags/upstream/1.0.16
#      = 8814aa807bf93d115f936dc1cebe7e2b6f028ec0（tag）/ 36e90dba...（commit），
#      同 tag 序列另有 upstream/1.0.5 … upstream/1.0.14
#   上游作者站点 xwtools.automatix.de 现已不响应（curl (52) Empty reply from
#   server），故取 Debian 官方池上的**原始上游归档**作权威源（仓库内已有 172
#   个配方使用 deb.debian.org）。
#
# ⚠️ 本文件注释里刻意不写完整 URL：`ci/conan/build_and_test.sh` 的预下载器会把
# conandata.yml 中任何形如 `<scheme>://…` 的串都当源码 URL 下载并整文件改写成本
# 地 file 协议路径（rfdump 1.6 实测教训）。域名写裸名即可规避。

sources:
  url: "https://deb.debian.org/debian/pool/main/m/mtink/mtink_1.0.16.orig.tar.gz"
  sha256: "187e8d145e818b4b56be203403f5fe28c02f899d30d92c58e82bcef311555ba2"
