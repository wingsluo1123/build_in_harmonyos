sources:
  # Debian orig tarball of upstream mtPaint 3.50.14 (upstream release
  # 2026-03-05, commit 8304376). SourceForge file hosting is stale
  # (latest file asset is 3.50 from 2021) and GitHub wjaguar/mtPaint
  # publishes no release artifact, so the Debian orig — the upstream
  # source as shipped for 3.50.14-1 — is the authoritative fetchable
  # archive. SHA256 cross-verified from two independent sources:
  # Launchpad mtpaint_3.50.14.orig.tar.gz page and the Debian
  # tracker ACCEPTED message for 3.50.14-1 (both record
  # 1062ec6c9fddb5a402b0c22e958f28814cc128428d03e8fa9d71c9982b985256).
  # Both URLs serve the identical file, so one sha256 covers the list.
  url:
    - "https://deb.debian.org/debian/pool/main/m/mtpaint/mtpaint_3.50.14.orig.tar.gz"
    - "https://ftp.debian.org/debian/pool/main/m/mtpaint/mtpaint_3.50.14.orig.tar.gz"
  sha256: "1062ec6c9fddb5a402b0c22e958f28814cc128428d03e8fa9d71c9982b985256"
  filename: "mtpaint_3.50.14.orig.tar.gz"
patches: []
