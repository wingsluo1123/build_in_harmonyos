software: mtpaint
display: "mtpaint"
description: "mtPaint 像素绘画程序 (GTK+ 图像编辑工具)"
category: gfx
homepage: "https://github.com/wjaguar/mtPaint"
license: GPL-3.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 mini-configure (非 GNU Autotools), 不传 --build/--host (R15)"
    - "GTK+3 (registry gtk broadway 后端) + jpeg/tiff/lcms2, 关闭 jp2/webp"
    - "二进制工具包 (bin/mtpaint), headless 用 --version/--help 验证"
    - "上游无测试套件, 按 no_tests 口径输出 HMBS 标记"
  common_dependencies:
    - gtk
    - libpng
    - libjpeg-turbo
    - libtiff
    - freetype
    - lcms2
    - zlib

versions:
  "3.50.14":
    status: built
    build_date: "2026-10-14"
