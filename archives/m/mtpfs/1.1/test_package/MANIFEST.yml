# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点证据（R51 三步法）:
#   * mtpfs 1.1 上游【没有任何测试套件】：tarball 内无 tests/ 目录、无
#     check_PROGRAMS / TESTS 声明（Makefile.am 仅 bin_PROGRAMS = mtpfs）、
#     configure.ac 无 AC_CONFIG_TESTDIR、无 make check 目标。
#   * 依据 TEST_QUALITY_SPEC：上游无测试 → 说明原因并补充测试（本 test_package
#     即为补充测试：安装后二进制的消费者验证）。

package: mtpfs/1.1
homepage: "https://github.com/cjd/mtpfs"

# 上游测试命令：不存在
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（上游零测试，原因见上）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：运行安装后的 mtpfs CLI。① --help 语义冒烟（fuse 参数解析与 FUSE 库符号闭合，exit 0）；② 无 MTP 设备路径行为验证（libmtp 枚举失败路径，接受集 {0,1,255} 且均须断言设备枚举输出；124=挂死判失败，其余 rc（126/127/139）显式拒绝；timeout 30s 兜底）。挂载/数据面路径在无 /dev/fuse、无 MTP 硬件的 OHOS 环境不可达，见 notes.md。"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
