patches:
  "1.0":
    - patch_file: "patches/0000-use-modern-c-declarations.patch"
      patch_description: "Use standards-conforming entry points and standard library declarations"
      patch_type: "portability"
    - patch_file: "patches/0001-use-portable-inline-linkage.patch"
      patch_description: "Use translation-unit-local inline helpers with modern C compilers"
      patch_type: "portability"
    - patch_file: "patches/0002-build-generator-with-host-compiler.patch"
      patch_description: "Build the executed table generator with the build-machine compiler"
      patch_type: "portability"
    - patch_file: "patches/0003-preserve-partial-pcm-samples.patch"
      patch_description: "Preserve incomplete 16-bit PCM samples across stream reads"
      patch_type: "portability"
