package: multimon/1.0
homepage: "https://sourceforge.net/projects/multimon/"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests_skip_reason: >-
  The official 1.0 source archive contains no test/tests directory, make check
  target, registered runner, or automated upstream test case (N_static=0,
  N_runtime=0).
upstream_tests: []

test_package_tests:
  - file: test_multimon.py
    description: "Run the installed generator and decode the resulting multi-read DTMF raw file"
    command: "python3 test_multimon.py <package>/bin"
  - file: test_multimon.py
    description: "Run an installed-command HarmonyOS consumer workflow through an inherited pipe split after its first byte"
    command: "python3 test_multimon.py <package>/bin"
  - file: test_multimon.py
    description: "Accept clean EOF without fabricating samples"
    command: "python3 test_multimon.py <package>/bin"
  - file: test_multimon.py
    description: "Reject EOF containing half of a 16-bit sample"
    command: "python3 test_multimon.py <package>/bin"

scenario_count: 4
external_assertion_count: 14
ohos_target_specific_scenarios: 1
max_rss_mb: 64
