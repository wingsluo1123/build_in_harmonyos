software: multimon
display: "multimon"
description: "多协议无线电信号解码器和测试信号生成器"
category: multimedia
homepage: "https://sourceforge.net/projects/multimon/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用 HarmonyOS clang 和已发布的 X11 依赖构建 AArch64 命令"
    - "使用标准 C 内联链接语义"
    - "跨 read() 保存不完整的 16 位 PCM 样本"
    - "真机执行安装后的生成器与分片继承管道解码器"
  common_dependencies:
    - "libx11/1.8.13"
    - "xorgproto/2025.1"

versions:
  "1.0":
    status: built
    build_date: "2026-10-16"
    conan_ref: "multimon/1.0"
