# 版本级 manifest — musicpc 0.35

version: "0.35"
software: "musicpc"
status: built
build_date: "2026-10-15"
build_system: meson

source:
  url: "https://www.musicpd.org/download/mpc/0/mpc-0.35.tar.xz"
  sha256: "382959c3bfa2765b5346232438650491b822a16607ff5699178aa1386e3878d4"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "wrap_mode=nodownload"
    - "documentation=disabled"
    # 上游唯一的测试目标 test_format 由该选项启用（meson_options.txt 默认 false）。
    # 仅当 check 解析进依赖图（即 conan create 期间）时为 true，消费者构建时仍为 false。
    - "test=true (仅 conan create 期间；无 check 时为 false)"
  dependencies:
    - libmpdclient/2.23
  cc: clang

test:
  # 上游测试用例 N=1：test/meson.build 用 meson test() 注册的唯一测试目标 test_format
  # （libcheck，6 个 START_TEST，纯 format_song() 字符串格式化，不需要 MPD 服务器/网络）
  upstream_case_count: 1
  upstream_case_passed: 1
  upstream_pass_rate: "1/1 (100%)"
  upstream_command: "meson test -C <build> -v --print-errorlogs"
  upstream_source_modified: false
  # 执行模型按被测 ELF 的 ELF 头判定：CI 鸿蒙 PC worker 原生 exec；
  # x86_64 交叉机经 qemu-aarch64 -L /opt/ohos-guest 执行（guest 侧预载 fortify shim）
  cross_execution: "qemu-aarch64 -L /opt/ohos-guest -E LD_PRELOAD=libfdchkshim.so"
  # worker 上 libcheck 的临时目录必须显式给可写路径（P_tmpdir 宏 = /tmp 优先级高于 TMPDIR，
  # 而 worker 的 /tmp 只读）——CI #94829 即因此失败，已用 TEMP/TMPDIR 修复
  worker_env: "TEMP=<build>/upstream-test-tmp TMPDIR=<build>/upstream-test-tmp"
  ci_history:
    - build: "94829"
      worker: "OpenHarmonyPCDeveloper-CI-023"
      result: "fail"
      reason: "libcheck check_msg.c:317 Unable to create temporary file for communication（worker /tmp 只读），已修复"
    - build: "94968"
      worker: "OpenHarmonyPCDeveloper-CI-028"
      result: "上游用例 1/1 PASS（100%: Checks: 6, Failures: 0）；build 最终红在 package()"
      reason: "meson install 多余重链接撞 worker 进程枯竭（posix_spawn EAGAIN），已用 meson install --no-rebuild 修复"
  consumer_assertion_count: 4
  consumer_assertion_passed: 4

patches_applied: []

knowledge_gained:
  - "OHOS worker 的 conan buildenv 提供裸名 AR=llvm-ar，MesonToolchain 原样写入 conan_meson_native.ini 的 [binaries] ar；meson 探测归档器的子进程不按 PATH 解析裸名，configure 报 ERROR: Unknown linker(s): [['llvm-ar']]；修法是把绝对路径归档器钉进 native file（tc.binaries['ar']），改 PATH 无效"  # knowledge_ref: E481
  - "conan 配方不得用 Environment().vars(self).save_script('conanbuild')：占用 conan 聚合脚本名会生成自引用的 conanbuild.sh（无限递归），表现为 shell SIGSEGV → ConanException: Error -11 且 meson 无任何输出"  # knowledge_ref: DRAFT-qqwing-1.3.4-conanbuild-recursive-source-printenv-e2big)
