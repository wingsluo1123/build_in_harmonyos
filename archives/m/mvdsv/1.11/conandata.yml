patches:
  "1.11":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Select POSIX sources and register the TCP queue regression when CMake identifies HarmonyOS"
      patch_type: "portability"
    - patch_file: "patches/0002-src-net.c.patch"
      patch_description: "Resume retained TCP output only while the connection has queued bytes"
      patch_type: "portability"
    - patch_file: "patches/0003-src-net_tcp_queue.c.patch"
      patch_description: "Implement injectable retry-safe queue flushing and validate select descriptor bounds"
      patch_type: "portability"
    - patch_file: "patches/0004-src-net_tcp_queue.h.patch"
      patch_description: "Declare queue flush, write-interest and deterministic sender contracts"
      patch_type: "portability"
    - patch_file: "patches/0005-src-net_tcp_stream.c.patch"
      patch_description: "Share stream-list write registration, fd rejection and ready draining between NET_Sleep and tests"
      patch_type: "portability"
    - patch_file: "patches/0006-src-net_tcp_stream.h.patch"
      patch_description: "Declare production TCP stream-list event-loop integration helpers"
      patch_type: "portability"
    - patch_file: "patches/0007-tests-tcp_queue_test.c.patch"
      patch_description: "Reproduce liveness arms and deterministically cover short writes, retry errors and fd guards"
      patch_type: "portability"
