# 版本级 manifest
# 文件位置: archives/m/mwrap/1.3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3.5"
software: "mwrap"
status: built
build_date: "2026-10-08"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/zgimbutas/mwrap/archive/refs/tags/v1.3.5.tar.gz"
  sha256: "d3d2a75dc620813a151a45cb172f6583fda25c4736125e692e083bb804cb00f6"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DMWRAP_BUILD_EXAMPLES=OFF"
    - "-DMWRAP_COMPILE_MEX=OFF"
  dependencies:
    - "bison/3.8.2"
    - "flex/2.6.4"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ohpcd 制品仓 bison/3.8.2 工具包二进制编译期 datarootdir=prefix=/，重定位后报 '/share/bison/m4sugar/m4sugar.m4: cannot open'，消费方须在 build() 内按依赖包真实路径注入 BISON_PKGDATADIR（knowledge_ref: E545）"
  - "CMake 不认识 HarmonyOS 平台属已知风险，由框架 toolchain 映射 CMAKE_SYSTEM_NAME 处理（knowledge_ref: E092）"
  - "mwrap 无 --version 支持（--version 被当作输入文件名，exit 1）：L2 smoke 门禁走 --help 回退路径即可，无需为此打补丁（knowledge_ref: E546）"

# 上游测试 (R51 申报，详见 test_package/MANIFEST.yml)
# 上游共 12 个测试条目：2 个 CTest 日志比对用例（默认配置注册，OHOS 实跑）+ 9 个
# mwrap_add_mex MEX 生成目标 + 1 个 mwrap.octave.test_all Octave 运行时用例；
# 后 10 个需 MWRAP_COMPILE_MEX=ON 且 mkoctfile/mex 或 Octave 解释器，OHOS 无
# MATLAB/Octave 工具链，环境受限未运行（非删除/跳过）。
upstream_tests:
  entry: "ctest (testing/CMakeLists.txt) + 9 mwrap_add_mex targets + 1 Octave runtime test"
  in_build: true
  command: "ctest"
  upstream_total_entries: 12
  ctest_registered_default: 2
  cases_total: 2
  cases_passed: 2
  cases_failed: 0
  cases_skipped: 0
  environment_limited_entries: 10
  environment_limited: "9 个 mwrap_add_mex MEX 生成目标（test_transfers/test_cpp_complex/test_c99_complex/test_catch/test_fortran1/test_fortran2/test_include/test_single_cpp/test_char_cpp）+ 1 个 mwrap.octave.test_all Octave 运行时用例；需 MWRAP_COMPILE_MEX=ON 且 mkoctfile/mex 或 Octave 解释器，OHOS PC 无 MATLAB/Octave 工具链，环境受限未运行（非删除/跳过）"

test_package:
  consumer_cases: 11
  ohos_specific_cases: 6
