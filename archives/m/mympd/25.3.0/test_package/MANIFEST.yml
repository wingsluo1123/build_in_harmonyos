# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mympd/25.3.0
homepage: "https://github.com/jcorporation/myMPD"

# 上游测试命令 (MYMPD_BUILD_TESTING=ON 构建单一 unit_test 二进制,
# ctest 按测试类别逐条执行 `unit_test --filter=<类别>.*`)
upstream_check_command: "cmake -DMYMPD_BUILD_TESTING=ON -B build && cmake --build build && ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake 配置 (MYMPD_BUILD_TESTING=ON) 构建单一 unit_test 二进制, 随后 ctest --output-on-failure 逐测试类别执行; TMPDIR 指向构建临时目录 (OHOS /tmp 只读, 经 patch 0001 贯通)"

# 上游实际运行的测试程序
upstream_tests:
  - name: ctest/utest
    command: "ctest --test-dir <build> --output-on-failure"
    expected: "35 个 ctest 类别条目 (33 个基础类别 + lyrics_id3 + lyrics_flac), 每个条目对 unit_test --filter=<类别>.* 执行; 源码内 UTEST 用例总数 201 (分布在 34 个套件), 其中 m3u 条目在上游 test/ 内无对应用例定义 (运行 0 个用例, 退出码 0, 如实记录); 真机实测结果见版本级 notes.md"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: tests/run_e2e.sh
    description: "消费者端到端执行器: 版本输出 (含嵌入式 libmpdclient 2.26.0 证明) / 帮助输出 / 默认配置 dump (http_port: 8080) / bootstrap 引导 (-c 写出逐项配置文件 config/http_port 并自签 TLS 证书 ssl/ca.pem+ssl/server.pem) / 反例对照: 未知选项必须以非零退出; 逐用例 TEST PASS|FAIL + TEST SUMMARY, 任一失败 exit 1"
    command: "bash tests/run_e2e.sh <mympd>"

# 测试数量 (源码内 UTEST 用例总数; 真机运行数据见版本级 notes.md)
assertion_count: 201
