software: nano
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.0"

# 构建系统（顶层字段，用于质量门禁检测）
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/nano/nano-9.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 注意: 需要额外的 LDFLAGS 强制使用 GNU ld:
  # LDFLAGS="-fuse-ld=/data/service/hnp/binutils.org/binutils_2.45/bin/ld"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ncursesw/system"
    - "magic/5.47"
    - "zlib/system"
    - "gettext/system"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "E011: umask 077 → umask 022 in configure"
  - "LDFLAGS: -fuse-ld=GNU ld in src/Makefile"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lld 链接器依赖 libxml2，SDK 版本不匹配时需使用 GNU ld"
  - "E011: configure 中的 umask 077 必须改为 umask 022"
  - "HMDFS 不支持 ln -s，configure 自动使用 cp -pR 替代"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/nano-9.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/nano-9.0.work
  source_orig_hash: bd7653f6fd6f1c94
  source_work_hash: 8d33e64872f34221
  generated_at: '2026-05-31T12:49:58'
  patches_count: 1

patch_classification:
  - file: 0001-configure.log.patch
    type: auto
    platform_only: True
    guard: 'pending'
