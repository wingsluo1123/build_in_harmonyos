# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nanojsonc/1.3.0
homepage: "https://github.com/open-source-patterns/nanojsonc"

# 上游测试命令 (ctest -N 分析)
upstream_check_command: "cmake --build build && ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (BUILD_TESTS=ON 时由 CMake 构建并注册)
upstream_tests:
  - file: test/test_object.c
    source: nanojsonc-1.3.0/test/test_object.c
    description: "nanoJSONc object parser test (key-value event delivery, overflow codes)"
    command: "./test_object"
  - file: test/test_array.c
    source: nanojsonc-1.3.0/test/test_array.c
    description: "nanoJSONc array parser test (indexed event delivery, nested structures)"
    command: "./test_array"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 nanojsonc API 解析对象/数组 JSON，校验事件流与 error_desc"
    command: "./test_nanojsonc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2