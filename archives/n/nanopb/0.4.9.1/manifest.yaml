version: "0.4.9.1"
software: nanopb
status: built
build_date: "2026-07-17"
build_system: cmake
test_passed: 144
test_failed: 0

source:
  url: "https://gh-proxy.com/https://github.com/nanopb/nanopb/archive/refs/tags/0.4.9.1.tar.gz"
  tar_format: tar.gz
  sha256: "4575944a468718ef25f05eb01d994364650b581563089a9841986bb1e460eac3"

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_STATIC_LIBS=ON"
    - "-Dnanopb_BUILD_RUNTIME=ON"
    - "-Dnanopb_BUILD_GENERATOR=OFF"
  build_tool: cmake
  notes: >
    The Conan build compiles the static nanopb runtime, then runs the upstream
    SCons test suite with protoc and the nanopb generator plugin.

products:
  libraries:
    - protobuf-nanopb
  headers:
    - nanopb/pb.h
    - nanopb/pb_common.h
    - nanopb/pb_encode.h
    - nanopb/pb_decode.h
