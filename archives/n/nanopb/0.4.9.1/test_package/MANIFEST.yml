# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: nanopb/0.4.9.1
homepage: "https://github.com/nanopb/nanopb"

upstream_check_command: "scons -C tests NOVALGRIND=1 NODEFARGS=1"
upstream_test_in_build: true
upstream_test_command: "scons -C tests NOVALGRIND=1 NODEFARGS=1"

upstream_tests:
  - file: tests/SConstruct
    source: nanopb-0.4.9.1/tests/
    description: "上游 SCons 官方测试套件，包含 143 个 RunTest 测试调用"
    command: "scons -C tests NOVALGRIND=1 NODEFARGS=1"

test_package_tests:
  - file: test.c
    description: "消费者测试：实际编码并解码一个 varint 字段"
    command: "./test_nanopb"

assertion_count: 144
