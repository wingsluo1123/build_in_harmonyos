# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "config.guess/config.sub 无 HarmonyOS/ohos 分支时 configure 首阶段中断，按 E007/E072 打补丁输出 aarch64-unknown-linux-ohos"
- "config.status 在 HMDFS 上因 umask 077 创建的 0700 临时目录权限位不生效导致 Permission denied，按 E129 改 umask 022"
- "OHOS libc 无 pthread_cancel 符号，common 层 test-once 无法链接（E051 平台 API 缺失）"
- "服务端加载插件后的 --help/--version/--dump-plugin 路径在 OHOS 上 SIGSEGV/SIGTRAP（平台运行时缺陷，见 knowledge 候选台账）"
- "AF_UNIX socket 绑定在本机被安全策略拒绝（EPERM），socket 类测试无法运行（平台限制）"

