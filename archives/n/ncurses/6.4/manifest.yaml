version: "6.4"
software: ncurses
status: built
build_date: "2026-07-15"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/ncurses/ncurses-6.4.tar.gz"
  sha256: "6931283d9ac87c5073f30b6290c4c75f21632bb4fc3603ac8100812bed248159"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-shared"
    - "--enable-static"
    - "--without-debug"
    - "--without-ada"
    - "--without-manpages"
    - "--without-tests"
    - "--without-cxx-binding"
    - "--enable-widec"
    - "--enable-overwrite"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-port-for-ohos.patch"

knowledge_gained:
  - "ncurses MUST be static (--without-shared): shared lib hijacks system libncursesw.so.6 causing zsh crash"
  - "--enable-widec builds libncursesw (wide character version), readline/bash need it"
  - "--enable-overwrite installs headers to top-level include/ not include/ncursesw/"
  - "-fPIC required for static lib to be linkable into shared libs on OHOS"
