software: ncurses
version: "6.5"
status: built
build_date: "2026-07-25"

source:
  url: "https://invisible-mirror.net/archives/ncurses/ncurses-6.5.tar.gz"
  sha256: "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-shared"
    - "--with-normal"
    - "--enable-widec"
    - "--enable-overwrite"
    - "--without-debug"
    - "--without-ada"
    - "--without-cxx"
    - "--without-cxx-binding"
    - "--without-manpages"
    - "--without-tests"
    - "--disable-stripping"
    - "--disable-db-install"
    - "--with-fallbacks=xterm-256color,vt100"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ncurses 6.5 needs config.guess/config.sub linux-ohos recognition for OHOS cross builds."
  - "Wide-character library is enabled so consumers can link ncursesw."
  - "Terminal database installation is disabled; fallback entries are compiled into the library."
