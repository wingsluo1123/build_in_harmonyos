software: ncurses
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mirrors.tuna.tsinghua.edu.cn/gnu/ncurses/ncurses-6.5.tar.gz"

  # 源码校验和
  sha256: "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/"
    - "--without-shared"
    - "--without-debug"
    - "--without-profile"
    - "--without-ada"
    - "--without-cxx"
    - "--without-cxx-binding"
    - "--without-manpages"
    - "--disable-stripping"
    - "--enable-widec"
    - "--enable-overwrite"
    - "--enable-pc-files"
    - "--with-pkg-config-libdir=/lib/pkgconfig"
    - "--disable-big-strings"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: ohos-clang
  cxx: ohos-clangxx

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ohos-configure-tmpdir-umask.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS runner 的 /tmp 不可写且 $HOME/tmp 权限不稳定，configure 和编译阶段必须设置 TMPDIR 到当前 Conan build 目录"
  - "OHOS HMDFS 用户/组映射下 autoconf 的 umask 077 临时目录不可写，ncurses configure 需放宽到 umask 022"
  - "OHOS runner 上 install -s 调用 strip 会失败，configure 需要 --disable-stripping"
  - "OHOS runner PATH 默认可能先命中 toybox expr/sed，ncurses config.status 的 ac_dir 解析需避免 sed/expr 管道，并在 configure 后对 generated Makefile 做 targeted repair"
  - "OHOS 下禁用 big-strings，避免生成的 terminfo code tables 在静态 tic 链接时缺 boolcodes/numcodes/strcodes 符号"
  - "为避免覆盖系统 shell 依赖的 ncurses 共享库，OHOS 只交付静态 wide-char ncursesw/formw/menuw/panelw 库"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
