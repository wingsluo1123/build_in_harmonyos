version: "6.5"
status: built
build_date: "2026-07-29"
conan_ref: "ncurses/6.5"

source:
  url: "https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz"
  sha256: "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-debug"
    - "--without-ada"
    - "--without-cxx"
    - "--without-cxx-binding"
    - "--without-manpages"
    - "--without-progs"
    - "--without-tests"
    - "--without-shared"
    - "--with-normal"
    - "--enable-widec"
    - "--enable-overwrite"
    - "--enable-pc-files"
    - "--disable-db-install"
    - "--disable-symlinks"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ncurses should be packaged as static wide-character libraries for OHOS consumers."
  - "config.guess and config.sub need recipe-side OHOS triplet normalization."
  - "Non-interactive consumers can validate curses_version, keyname, and unctrl without terminal control."
  - "Upstream ncurses test/progs are interactive terminal programs, so automated upstream pass rate is N/A; consumer smoke coverage is 3/3."
