version: "6.5"
software: ncurses
status: published
build_date: "2026-07-17"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz"
  sha256: "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--without-shared"
    - "--without-debug"
    - "--without-ada"
    - "--without-manpages"
    - "--without-tests"
    - "--without-cxx-binding"
    - "--enable-widec"
    - "--enable-overwrite"
    - "--enable-pc-files"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-port-for-ohos.patch"

knowledge_gained:
  - "鸿蒙环境下必须静态编译，避免运行时误加载自建 ncurses 共享库影响系统 shell"
  - "启用 --enable-widec 后实际导出的主库为 libncursesw.a，当前配方不单独生成 libtinfo.a，消费者应仅链接 ncursesw"
  - "启用 --enable-overwrite 可将 curses 相关头文件安装到顶层 include 目录，减少消费者兼容性问题"
