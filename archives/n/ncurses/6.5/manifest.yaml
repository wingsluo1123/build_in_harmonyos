software: ncurses

# ─────────────────────────────────────────────────────────────
# ncurses 6.5 — HarmonyOS PC (aarch64) 适配
# 状态: built (conan-verify 通过; 未上传制品仓)
# ─────────────────────────────────────────────────────────────
version: "6.5"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源 (R39)
  url: "https://invisible-mirror.net/archives/ncurses/ncurses-6.5.tar.gz"
  # 两次从官方 URL 下载验证一致
  sha256: "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools

  # 关键: --without-shared 系统同名库强制静态编译 (R26/R4)
  configure_options:
    - "--without-shared"
    - "--with-normal"
    - "--without-debug"
    - "--without-ada"
    - "--without-manpages"
    - "--without-cxx-binding"
    - "--enable-widec"
    - "--enable-overwrite"

  # ncurses 无外部依赖 (W0)
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息 (配方内联 sed 实现, 无独立补丁文件)
# ============================================================
patches_applied: []
# 配方 build() 内联执行:
# - E160: config.guess/sub 识别 HarmonyOS (uname -s=HarmonyOS)
# - as_expr=false: 绕过 /usr/bin/expr 对 BRE 交替 "\|" 的 bug (Makefile 乱码)
# - umask 077 移除: HMDFS UID 映射导致 0700 临时目录不可写

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "HMDFS expr bug: /usr/bin/expr 对 '\\|' 交替模式返回垃圾字节, config.status 计算 ac_top_srcdir 出错导致子目录 Makefile 变量行乱码; as_expr=false 强制 sed fallback"
  - "HMDFS UID 映射: config.status umask 077 建的 0700 临时目录对进程不可写, 需移除 umask 077 或 TMPDIR 指向可写目录"
  - "GNU make -jN jobserver 使用 mkfifo, HMDFS 不支持 (Operation not permitted), 需 -j1"
