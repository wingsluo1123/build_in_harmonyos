upstream_test_source: true
upstream_check_command: "make -C test check"
upstream_test_command: "make -C test -j1 && make -C test check"

test_type: upstream_plus_smoke

test_sources:
  - "test_ncurses.c"

verification_steps:
  - "Build ncurses libraries and upstream test programs"
  - "Run upstream make -C test check header compile target"
  - "Compile and run a consumer probe using setupterm, tigetstr, and tputs"
  - "Run packaged tput against the packaged terminfo database"
