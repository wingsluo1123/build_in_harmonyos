# test_package/MANIFEST.yml — ncurses/6.5 官方测试声明
# 上游测试 (make check) 为交互式测试程序, 无头环境无法自动化运行
# (make check 输出 "The test-programs are interactive", 退出码 0)

package: ncurses/6.5
homepage: "https://invisible-island.net/ncurses/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试 (否: 交互式测试无法在无头环境运行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (交互式, 无头环境跳过)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 实质调用 ncurses API)
test_package_tests:
  - file: test.c
    description: "验证 ncurses API: curses_version() 版本字符串 + tputs() terminfo 输出"
    command: "./test_ncurses"

# 测试断言总数
assertion_count: 2
