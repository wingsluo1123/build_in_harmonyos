package: neatvnc/1.0.1
homepage: "https://github.com/any1/neatvnc"
upstream_check_command: "meson test --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test"
upstream_tests:
  - id: pixels
    source: test/meson.build
  - id: base64
    source: test/meson.build
conditional_tests:
  - id: rfb-handshake
    condition: "requires nettle and Python; nettle feature intentionally disabled"
test_package_tests:
  - file: test_neatvnc.c
    description: "Installed API version and server lifecycle with AML event loop"
    command: ./test_neatvnc
assertion_count: 3
