  - "0004-src-libnetdata-threads-threads.c.patch"

knowledge_gained:
  - "CMake uuid检测：OS_OHOS时跳过pkg_check_modules，使用内置arc4random_buf实现"
  - "proc_stat.c：pthread_setaffinity_np/cpu_set_t在__OHOS__下不可用，需用#ifdef守卫"
  - "libh2o submodule为空，需禁用ENABLE_H2O"
  - "libcap/capabilities在OHOS不可用，需禁用ENABLE_PLUGIN_APPS/DEBUGFS"
  - "uuid_generate.c: OHOS无uuid.h，需用arc4random_buf实现UUID v4生成"
  - "threads.c: pthread_setcanceltype/setcancelstate在OHOS不可用，需用#ifndef __OHOS__守卫"
  - "protobuf无需依赖（ENABLE_ACLK=False时不使用）"

