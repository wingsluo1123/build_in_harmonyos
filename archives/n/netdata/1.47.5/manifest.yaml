software: netdata
version: "1.47.5"
status: built
build_date: "2026-08-07"
build_system: cmake

source:
  url: "https://github.com/netdata/netdata/releases/download/v1.47.5/netdata-v1.47.5.tar.gz"
  sha256: "8073eee2392f92daa1f8bb5cf13fb988b8c3b52ff9574b50706ff69bdbdb51ce"
  tar_format: tar.gz

build:
  build_system: cmake
  configure_options:
    - "-DOS_OHOS=True"
    - "-DENABLE_ACLK=False"
    - "-DENABLE_CLOUD=False"
    - "-DENABLE_ML=False"
    - "-DENABLE_PLUGIN_EBPF=False"
    - "-DENABLE_PLUGIN_GO=False"
    - "-DENABLE_PLUGIN_FREEIPMI=False"
    - "-DENABLE_PLUGIN_CUPS=False"
    - "-DENABLE_PLUGIN_SYSTEMD_JOURNAL=False"
    - "-DENABLE_PLUGIN_XENSTAT=False"
    - "-DENABLE_PLUGIN_NFACCT=False"
    - "-DENABLE_PLUGIN_APPS=False"
    - "-DENABLE_PLUGIN_DEBUGFS=False"
    - "-DENABLE_PLUGIN_LOCAL_LISTENERS=False"
    - "-DENABLE_PLUGIN_NETWORK_VIEWER=False"
    - "-DENABLE_EXPORTER_MONGODB=False"
    - "-DENABLE_EXPORTER_PROMETHEUS_REMOTE_WRITE=False"
    - "-DENABLE_WEBRTC=False"
    - "-DENABLE_SENTRY=False"
    - "-DENABLE_H2O=False"
    - "-DUSE_MOLD=False"
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies:
    - openssl/1.1.1w
    - zlib/1.3.1
    - lz4/1.10.0
    - libuv/1.52.1
    - json-c/0.18
    - libyaml/0.2.5
    - sqlite3/3.49.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-collectors-proc.plugin-proc_stat.c.patch"
  - "0003-src-libnetdata-os-uuid_generate.c.patch"
  - "0004-src-libnetdata-threads-threads.c.patch"

knowledge_gained:
  - "CMake uuid检测：OS_OHOS时跳过pkg_check_modules，使用内置arc4random_buf实现"
  - "proc_stat.c：pthread_setaffinity_np/cpu_set_t在__OHOS__下不可用，需用#ifdef守卫"
  - "libh2o submodule为空，需禁用ENABLE_H2O"
  - "libcap/capabilities在OHOS不可用，需禁用ENABLE_PLUGIN_APPS/DEBUGFS"
  - "uuid_generate.c: OHOS无uuid.h，需用arc4random_buf实现UUID v4生成"
  - "threads.c: pthread_setcanceltype/setcancelstate在OHOS不可用，需用#ifndef __OHOS__守卫"
  - "protobuf无需依赖（ENABLE_ACLK=False时不使用）"
