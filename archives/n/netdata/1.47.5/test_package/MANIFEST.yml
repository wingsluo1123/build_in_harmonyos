# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: netdata/1.47.5
homepage: "https://github.com/netdata/netdata"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/run-unit-tests.sh
    source: netdata-1.47.5/tests/run-unit-tests.sh
    description: "netdata unit test suite"
    command: "./tests/run-unit-tests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verify netdata binary runs and reports correct version"
    command: "./test_netdata"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
