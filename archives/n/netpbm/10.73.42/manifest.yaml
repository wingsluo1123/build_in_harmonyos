version: "10.73.42"
software: "netpbm"
status: built
build_date: "2026-10-15"
build_system: "custom-perl"

source:
  url: "https://sourceforge.net/projects/netpbm/files/super_stable/10.73.42/netpbm-10.73.42.tgz"
  sha256: "f1ddaa753d189aa7760a75265b6f7ab96eeedac3e2493ef57227824d058d528c"
  tar_format: "tgz"

build:
  system: "custom-perl"
  configure_options:
    - "generate(): 以上游 config.mk.in 为底稿并追加覆写块生成 config.mk（上游 configure.pl 为交互式脚本，不适用于 CI 无人值守）"
  dependencies:
    - "zlib/1.3.1.1"
    - "libpng/1.6.58"
    - "libjpeg-turbo/3.2.0"
    - "libtiff/4.7.2"

patches_applied: []

knowledge_gained:
  - "自研安装器（非 GNU make install）只安装版本化运行库 libnetpbm.so.11.73，缺 dev 软链 libnetpbm.so 与静态库 libnetpbm.a；Conan 打包语义要求补 dev 软链 + STATICLIB_TOO=Y 静态产物，否则消费者 -lnetpbm 直接失败。"
  - "OHOS 有 /usr/bin/env（→toybox）而无 /usr/bin/perl（perl 在 /data/service/hnp/bin/perl）：首行写死 #!/usr/bin/perl 的脚本须改写为 #!/usr/bin/env perl；E037「鸿蒙没有 /usr/bin/env」前提与实测不符。"
  - "上游 config.mk 的 RUNPATH 必须写 $$ORIGIN（make 会把单个 $O 吃成 RIGIN，生成废路径），$ORIGIN/../lib 方能让包内 CLI 找到同包 libnetpbm.so。"
  - "上游 test/Execute-Tests 与 115 个 *.test 的 shebang 均为 #! /bin/bash（OHOS 无 /bin/bash）：用 $vg_command 环境槽位注入解释器可零补丁跑通。"
  - "test/Execute-Tests 把结果写死 /tmp（OHOS 受限只读）：RESULTDIR 为 make 变量，覆写为 $HOME/ 下可写目录即可。"
