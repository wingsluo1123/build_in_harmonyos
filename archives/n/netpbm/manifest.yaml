software: netpbm
display: "Netpbm"
description: "图像格式转换工具集，支持 100+ 种图像格式"
category: doc
homepage: "https://netpbm.sourceforge.net/"
license: "BSD-3-Clause"
build_system: "custom-perl"

ohos_adaptation:
  level: 2
  notes:
    - "上游 configure.pl 为交互式脚本（不支持 --prefix），配方在 build() 内以上游 config.mk.in 为底稿生成 config.mk + 覆写块"
    - "可选图像库（libpng/libjpeg-turbo/libtiff/zlib）全部启用，PNG/JPEG/TIFF 读写能力可用"
    - "自研安装器只安装版本化运行库 libnetpbm.so.11.73，须补 dev 软链 libnetpbm.so 与静态 libnetpbm.a"
    - "RUNPATH 须写 $$ORIGIN/../lib（make 会把单个 $O 吃成 RIGIN）"

versions:
  "10.73.42":
    status: built
    build_date: "2026-10-15"