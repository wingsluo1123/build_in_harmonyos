package: nettle/3.10.2
homepage: https://www.lysator.liu.se/~nisse/nettle/
upstream_test_in_build: false
upstream_tests:
  - name: "upstream make check"
    status: "not_run_locally"
    reason: "local Windows native conan create validates package build and consumer test; OHOS upstream make check still requires remote project Conan/settings"
test_package_tests:
  - file: test_package/conanfile.py
    description: "Build and run a C consumer covering SHA-256, hash metadata, hogweed RSA key initialization, and GMP mpz operations"
    command: "test_nettle"
    assertion_count: 4
