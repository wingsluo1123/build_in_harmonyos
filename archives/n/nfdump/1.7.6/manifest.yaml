  # 与 OHOS 平台本身无关, 上游同样可以接受: platform_only = false。
  # 0004-0005 才是真正的 OHOS 适配: OpenHarmony 禁用 SysV IPC, 只能改用 POSIX IPC。
  # 五个补丁都用特性探测/无条件改写, 没有任何平台宏, 故 guard 一律为 none。
  - file: 0001-configure.ac.patch
