  - "0002-src-libnfdump-filter-ipconv.c.patch"
  - "0003-src-libnffile-conf-nfconf.c.patch"
  - "0004-src-collector-bookkeeper.h.patch"
  - "0005-src-collector-bookkeeper.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "musl libc (OpenHarmony) 不导出 glibc 的 _res 全局解析器状态; configure.ac 增加 AC_LINK_IFELSE 特性探测生成 HAVE_RES_GLOBAL, 源码据此守卫 set_nameserver()/SetNameserver(), 不使用平台宏 __OHOS__"
  - "OpenHarmony 禁止非特权进程使用 System V IPC: shmget 返回 EACCES, semget/msgget 直接以 SIGSYS(Signal 31) 杀死进程 (最小探针复现); nfcapd 的 bookkeeper 改为 POSIX shm_open/ftruncate/mmap + 命名信号量 sem_open 后, 采集器可正常起停"
  - "上游 tarball 中 COPYING/NEWS/README/bootstrap 是符号链接, FUSE 后端缓存上建链/utimensat 会 EACCES 导致 conan 复制源码失败; 在 source() 中把它们物化为常规文件"
  - "release tarball 不含生成的 configure, build() 需先 autoreconf -fi; 构建机只有 autoconf 家族, automake/libtool/pkgconf 必须由 tool_requires 提供, 并把 pkgconf 的 share/aclocal 挂到 ACLOCAL_PATH 才能展开 PKG_CHECK_MODULES"
  - "config.guess 不识别 HarmonyOS (uname 返回 HarmonyOS/HongMeng Kernel); 显式传 --build/--host=aarch64-unknown-linux-ohos 绕开"
  - "nfdump 必须在源码目录内构建 (Conan folders.build='.'): src/libnffile/Makefile.am 用相对路径 ./gen_version.sh 生成 vcs_track.h, 外部构建目录下必然失败"
  - "OHOS 基线无 liblz4/libbz2/libzstd; configure 检出 LZ4EMBEDDED 走 nfdump 内嵌 LZ4 实现, bzip2/zstd 用例由上游自动不注册"
  - "codeload.github.com/<owner>/<repo>/tar.gz/refs/tags/<tag> 路径以 tag 结尾无扩展名, conan get() 无法判定解压器; 需在 conandata.yml 显式声明 filename"

