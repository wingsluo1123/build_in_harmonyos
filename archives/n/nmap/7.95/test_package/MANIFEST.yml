# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nmap/7.95
homepage: "https://nmap.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: nmap --version
    source: nmap-7.95/nmap
    description: "Verify nmap binary version output"
    command: "./nmap --version"
  - file: ncat --version
    source: nmap-7.95/ncat/ncat
    description: "Verify ncat binary version output"
    command: "./ncat/ncat --version"
  - file: nping --version
    source: nmap-7.95/nping/nping
    description: "Verify nping binary version output"
    command: "./nping/nping --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify nmap, ncat, nping --version output"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
