# manifest.yaml — nnn 5.0 for HarmonyOS
# Version-level manifest

software: nnn
version: "5.0"
status: built
build_system: makefile
build_date: "2026-08-08"
source_url: "https://github.com/jarun/nnn/releases/download/v5.0/nnn-v5.0.tar.gz"

dependencies:
  required:
    - name: ncurses
      version: "6.6"
      note: "static library, from ohpcd Conan repo"
    - name: musl-fts
      version: "1.2.7"
      note: "shared library, from ohpcd Conan repo"
    - name: readline
      version: "8.2"
      note: "built from source within conanfile.py (not in ohpcd repo)"

build_config:
  target: aarch64-linux-ohos
  compiler: clang
  cflags: "-fPIC -O2"
  build_type: Release

patches_applied:
  - file: patches/0001-readline-config-guess.patch
    purpose: "Add HarmonyOS detection to readline config.guess"
    target: readline-8.2
  - file: patches/0002-readline-config-sub.patch
    purpose: "Add HarmonyOS detection to readline config.sub"
    target: readline-8.2
  - file: patches/0003-readline-termcap-link.patch
    purpose: "Fix TERMCAP_LIB linking in readline shlib/Makefile.in"
    target: readline-8.2

compatibility:
  level: high
  issues: []
  notes: |
    - nnn builds natively on HarmonyOS with full functionality (including readline)
    - readline is built from source within conanfile.py (not in ohpcd Conan repo)
    - ncurses and musl-fts are Conan dependencies from ohpcd repo
    - readline and ncurses are statically linked; musl-fts is shared
    - HMDFS umask issue (mktemp -d with umask 077) patched in build()

test_results:
  type: smoke
  passed: 2
  failed: 0
  note: "nnn -V reports version 5.0; nnn -h shows help text"

knowledge_gained:
  - "nnn uses Makefile with pkg-config for ncurses detection"
  - "readline not in ohpcd Conan repo, built from source in conanfile.py"
  - "HMDFS umask 077 causes mktemp -d created directories to be unwritable"
  - "readline config.guess needs HarmonyOS detection patch"
  - "readline TERMCAP_LIB must use -lncursesw (not -lncurses)"

references:
  - https://github.com/jarun/nnn
  - https://ftp.gnu.org/gnu/readline/
