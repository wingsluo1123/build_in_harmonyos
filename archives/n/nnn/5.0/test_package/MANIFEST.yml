# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: nnn/5.0
homepage: "https://github.com/jarun/nnn"

# Upstream test command (nnn has no `make check` target)
upstream_check_command: "make check"
upstream_check_available: false

# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# nnn has no upstream test suite (it is a CLI tool, tested via --version/-h)
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify nnn binary runs and reports version 5.0"
    command: "bash test.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 2
