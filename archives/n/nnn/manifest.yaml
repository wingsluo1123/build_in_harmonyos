# Software-level manifest — nnn
# File: archives/n/nnn/manifest.yaml

software: nnn
display: "nnn (n³)"
description: "The unorthodox terminal file manager"
category: utility
homepage: "https://github.com/jarun/nnn"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "nnn builds natively on HarmonyOS using Makefile"
    - "Depends on ncurses (static), musl-fts (shared), and readline (static, built from source)"
    - "readline is not in ohpcd Conan repo, built from source within conanfile.py"
    - "HMDFS umask 077 causes mktemp -d created dirs to be unwritable, patched in build()"
    - "nnn Makefile uses pkg-config for ncurses detection"
  common_dependencies:
    - ncurses
    - musl-fts
    - readline

versions:
  "5.0":
    status: built
    build_date: "2026-08-08"
    conan_ref: "nnn/5.0"
