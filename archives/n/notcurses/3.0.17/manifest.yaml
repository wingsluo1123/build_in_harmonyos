software: notcurses
version: 3.0.17
status: published
build_system: cmake
build_date: "2026-08-07"
created_at: 2026-04-16
updated_at: 2026-08-07
knowledge_gained:
  - "OHOS终端不响应DA1/DA2等查询，必须用#ifdef __OHOS__跳过send_initial_queries中需要响应的序列"
  - "SMCUP和KKBDENTER不需要响应，必须在OHOS上发送以确保备选屏幕和键盘正常"
  - "OHOS上pthread_cancel被禁用，cancel_and_join会永久阻塞，需用pthread_detach替代"
  - "OHOS上ppoll不可用，用poll替代"
  - "__OHOS__宏由Clang 15自动预定义，无需手动定义"
patches_applied:
  - 0001-CMakeLists.txt.patch
  - 0002-src-demo-input.c.patch
  - 0003-src-demo-reel.c.patch
  - 0004-src-lib-fbuf.h.patch
  - 0005-src-lib-fd.c.patch
  - 0006-src-lib-in.c.patch
  - 0007-src-lib-in.h.patch
  - 0008-src-lib-internal.h.patch
  - 0009-src-lib-reader.c.patch
  - 0010-src-lib-termdesc.c.patch
