build_system: "custom"

source:
  url: "https://notmuchmail.org/releases/notmuch-0.38.3.tar.xz"
  sha256: "9af46cc80da58b4301ca2baefcc25a40d112d0315507e632c0f3f0f08328d054"
  tar_format: tar.xz

build:
