software: npth
version: "1.8"
status: built
build_date: "2026-08-12"
build_system: autotools

# 源码信息
source:
  url: "https://gnupg.org/ftp/gcrypt/npth/npth-1.8.tar.bz2"
  sha256: "8bd24b4f23a3065d6e5b26e98aba9ce783ea4fd781069c1b35d149694e90ca3e"
  tar_format: tar.bz2

# 构建配置
build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/tmp/test-install-npth-1.8"

# 补丁信息
patches_applied:
  - name: 0001-build-aux-config.guess.patch
    description: "添加 HarmonyOS 系统识别支持"
    category: platform_detection
    kb_ref: E007, E072
  - name: 0002-build-aux-config.sub.patch
    description: "添加 ohos-linux 三元组和内核组合验证"
    category: platform_detection
    kb_ref: E007, E072
  - name: 0003-configure.patch
    description: "musl libc pthread_cancel 兼容性修复 + HMDFS tmpdir 修复"
    category: musl_compat
    kb_ref: PSCAN-MUSL-001
  - name: 0004-configure.ac.patch
    description: "musl libc pthread_cancel 兼容性修复（configure.ac 源文件）"
    category: musl_compat
    kb_ref: PSCAN-MUSL-001

# 构建环境
build_env:
  host: aarch64-unknown-linux-ohos
  cc: clang
  cc_version: "15.0.4"
  libc: musl
  thread_model: pthread

# 测试结果
test_result:
  total_tests: 4
  passed_tests: 4
  failed_tests: 0
  test_cases:
    - "t-mutex: PASS"
    - "t-thread: PASS"
    - "t-stdthreads: PASS"
    - "t-stack: PASS"
  test_report: reports/test-report.md

# 生成产物
artifacts:
  libraries:
    - name: libnpth.so.0.3.0
      type: shared_library
    - name: libnpth.so.0
      type: symlink
      target: libnpth.so.0.3.0
    - name: libnpth.so
      type: symlink
      target: libnpth.so.0
  headers:
    - name: npth.h
      location: include/

# 遇到的问题和解决方案
known_issues:
  - id: HMDFS-TMPDIR-001
    description: "HMDFS 不允许 config.status 创建临时子目录，且进程 UID 与文件所有者 UID 不一致导致 umask 077 创建的目录无法写入"
    severity: critical
    solution: "conanfile.py 中 _fix_hmdfs_tmpdir 方法将 mktemp 路径改为 TMPDIR 并移除 umask 077"
    status: resolved
  - id: MUSL-PTHREAD_CANCEL-001
    description: "musl libc 不支持 pthread_cancel"
    severity: critical
    solution: "修改 configure.ac/configure 使用 pthread_create 检查替代"
    kb_ref: PSCAN-MUSL-001
    status: resolved

# 依赖信息
dependencies:
  required:
    - name: pthread
      provided_by: musl-libc
      available: true

