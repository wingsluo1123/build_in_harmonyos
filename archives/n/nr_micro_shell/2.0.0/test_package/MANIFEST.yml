# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nr_micro_shell/2.0.0
homepage: "https://github.com/Nrusher/nr_micro_shell"

# 上游测试命令 (test/test.sh；需要 lcov/gcov + curses 头，tarball 不含
# 库级构建系统，模拟器示例需要 ncurses 开发头)
upstream_check_command: "cd test && ./test.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（4 个 key_rec 按键回放用例，经 nr_shell_test.py 驱动模拟器）
upstream_tests:
  - file: nr_shell_test.py
    source: nr_micro_shell-2.0.0/test/nr_shell_test.py
    description: "上游测试驱动：向 nr_shell_db 模拟器回放 4 个 key_rec 按键日志（help/time/hex2dec/rd/wr/Tab/历史）"
    command: "python3 nr_shell_test.py testcases ../examples/simulator/out/nr_shell_db"

# test_package 中自带的测试 (消费者视角验证 + 鸿蒙专项)
test_package_tests:
  - file: test.c
    description: "消费者测试：shell() 逐字符输入 hex2dec 命令，断言 stdout 输出 0xff = 255；另验证 help 命令表"
    command: "./test_nr_micro_shell"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
