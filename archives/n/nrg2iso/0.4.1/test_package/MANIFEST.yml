# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nrg2iso/0.4.1
homepage: "https://github.com/basrach/nrg2iso"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# nrg2iso 无自动化测试套件（无 make check 目标），功能验证通过手动构造测试文件完成
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: nrg2iso --version / --help"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 2
