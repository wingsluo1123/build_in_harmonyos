# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nsxiv/34
homepage: "https://github.com/nsxiv/nsxiv"

# nsxiv has no automated test suite (GUI application, manual testing only)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream automated tests
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Verify nsxiv binary executes with -v flag"
    command: "nsxiv -v"

# Test assertions: binary exists + version output contains "nsxiv"
assertion_count: 2
