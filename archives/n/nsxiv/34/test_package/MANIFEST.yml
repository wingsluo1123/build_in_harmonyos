# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nsxiv/34
homepage: "https://github.com/nsxiv/nsxiv"

# nsxiv has no automated test suite (GUI application, manual testing only)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream automated tests
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_nsxiv.c
    description: "Verify nsxiv binary exists and is valid ELF64 executable"
    command: "./test_nsxiv $NSXIV_BIN"

# Test assertions: binary exists + is regular file + is executable + ELF magic + 64-bit
assertion_count: 5
