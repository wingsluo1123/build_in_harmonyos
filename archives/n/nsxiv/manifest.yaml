software: nsxiv
display: "nsxiv"
description: "Neo Simple X Image Viewer — lightweight image viewer fork of sxiv"
category: gfx
homepage: "https://github.com/nsxiv/nsxiv"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Disable HAVE_INOTIFY=0 — OHOS kernel lacks inotify API"
    - "Disable HAVE_LIBFONTS=0 — libXft not available as pre-compiled package"
    - "Enable HAVE_LIBEXIF=1 — libexif available via cmd-pkgs"
    - "imlib2 must be built WITH X11 display support"
    - "No patches needed — all flags passed via make arguments"
  common_dependencies:
    - imlib2
    - libx11

versions:
  "34":
    status: published
    build_date: "2026-07-15"
