software: numen
display: "numen"
description: "Voice control tool for hands-free computing — 语音控制命令行工具"
category: accessibility
homepage: "https://git.sr.ht/~geb/numen"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Go 项目，使用 go build 直接编译，无需 configure 步骤"
    - "依赖 vosk-api Go 绑定 (CGO)，构建时需 CGO_ENABLED=1"
    - "产出 numen 二进制 + numenc shell 脚本，package_type=application"
    - "运行时依赖 dotool 和 alsa-utils (arecord)，建议作为运行时依赖说明"
  common_dependencies:
    - dotool

versions:
  "0.7":
    status: published
    build_date: "2026-07-28"
