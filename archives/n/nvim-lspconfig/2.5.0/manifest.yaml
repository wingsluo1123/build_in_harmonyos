knowledge_gained:
  - "Neovim runtime plugins can be packaged as share-only Conan packages without a native build step."
  - "nvim-lspconfig 2.5.0 ships upstream Vusted tests in test/lspconfig_spec.lua; OHOS runner lacks Neovim/Vusted, so the upstream test command was not executed and must not be reported as passed."
