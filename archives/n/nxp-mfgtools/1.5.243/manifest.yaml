software: nxp-mfgtools
version: "1.5.243"
status: built
build_date: "2026-08-07"
build_system: cmake

source:
  url: "https://github.com/nxp-imx/mfgtools/archive/refs/tags/uuu_1.5.243.tar.gz"
  sha256: "9ea8d3f98081372e957e04d748eb50ed3b23a128710f1c3549a3f84b5a33b94b"
  tar_format: tar.gz

build:
  configure_options: []
  dependencies:
    - bzip2/1.0.8
    - zlib/1.3.1
    - libusb/1.0.27
    - zstd/1.5.7
    - tinyxml2/11.0.0
    - openssl/3.5.6
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-libuuu-CMakeLists.txt.patch: Replace pkg_check_modules with Conan CMakeDeps find_package targets in libuuu"
  - "0002-libuuu-buffer.cpp.patch: Add __OHOS__ guard for stat64→stat (OHOS musl libc lacks stat64)"
  - "0003-libuuu-buffer.h.patch: Add __OHOS__ guard for mmap64→mmap (OHOS musl libc lacks mmap64)"
  - "0004-uuu-CMakeLists.txt.patch: Replace pkg_check_modules with Conan CMakeDeps find_package targets in uuu, add find_package(bzip2)"

knowledge_gained:
  - "OHOS musl libc lacks stat64/mmap64 — need __OHOS__ guard to use stat/mmap instead"
  - "Upstream uses pkg_check_modules for deps — replaced with Conan CMakeDeps find_package targets"
  - "base64_encode function is defined inside #ifdef UUUSSL but used unconditionally — OpenSSL must be found"
  - "gen_ver.sh requires .tarball-version file for non-git source tarballs"
  - "CMake imported targets are directory-scoped — find_package(bzip2) needed in both libuuu and uuu CMakeLists.txt"
