# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nxp-mfgtools/1.5.243
homepage: "https://github.com/nxp-imx/mfgtools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build --target help"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: uuu.cpp
    source: nxp-mfgtools-uuu_1.5.243/uuu/uuu.cpp
    description: "uuu main application — builds and links against all deps"
    command: "uuu -h"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Run uuu -h to verify binary links and executes"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
