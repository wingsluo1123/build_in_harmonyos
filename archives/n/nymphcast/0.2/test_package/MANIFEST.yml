# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nymphcast/0.2
homepage: "https://github.com/MayaPosch/NymphCast"

# NymphCast 上游无 make check 测试目标
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 nymphcast --help 验证应用可正常执行"
    command: "nymphcast --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
