# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS SGID directory + umask 077 prevents file creation in mktemp directories; fix: umask 022"
  - "/tmp is read-only on HarmonyOS; use $TMPDIR instead"
  - "lld linker depends on system libxml2; do NOT add conan libxml2 to LD_LIBRARY_PATH during compilation"
  - "config.guess/config.sub need OHOS platform detection patches in all subdirectories"
  - "umask in usersfile.c needs & 0777 mask for HarmonyOS compatibility"

