# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-pam"
    - "--enable-pskc"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libxml2/2.15.3.1
    - linux-pam/1.7.2

  # 编译器
  cc: clang
  cxx: clang++

