# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: oath-toolkit/2.6.13-r0
homepage: "https://oath-toolkit.codeberg.page/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: liboath/tests/tst_basic.c
    source: oath-toolkit-2.6.13/liboath/tests/tst_basic.c
    description: "liboath basic API tests (HOTP/TOTP generation and validation)"
    command: "./tst_basic"
  - file: liboath/tests/tst_coding.c
    source: oath-toolkit-2.6.13/liboath/tests/tst_coding.c
    description: "liboath base32/hex coding tests"
    command: "./tst_coding"
  - file: liboath/tests/tst_errors.c
    source: oath-toolkit-2.6.13/liboath/tests/tst_errors.c
    description: "liboath error handling tests"
    command: "./tst_errors"
  - file: liboath/tests/tst_hotp_algo.c
    source: oath-toolkit-2.6.13/liboath/tests/tst_hotp_algo.c
    description: "liboath HOTP algorithm tests"
    command: "./tst_hotp_algo"
  - file: liboath/tests/tst_totp_algo.c
    source: oath-toolkit-2.6.13/liboath/tests/tst_totp_algo.c
    description: "liboath TOTP algorithm tests"
    command: "./tst_totp_algo"
  - file: libpskc/tests/tst_basic.c
    source: oath-toolkit-2.6.13/libpskc/tests/tst_basic.c
    description: "libpskc basic API tests"
    command: "./tst_basic"
  - file: pam_oath/tests/test-pam_oath.c
    source: oath-toolkit-2.6.13/pam_oath/tests/test-pam_oath.c
    description: "pam_oath PAM module tests"
    command: "./test-pam_oath"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: verify liboath HOTP and TOTP OTP generation API"
    command: "./test_oath_toolkit"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
