# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"          # OHOS 目标是 aarch64-linux-ohos，见 patches/0002
    - "-DCMAKE_SKIP_RPATH=ON"              # OHOS 加载器拒绝 CMake 安装期改写后的 ELF（EACCES）
    - "-DOBS_VERSION_OVERRIDE=32.1.2"      # tarball 无 .git，否则版本回退为 0.0.1
    - "-DENABLE_UI=OFF"
    - "-DENABLE_FRONTEND=OFF"
    - "-DENABLE_PLUGINS=OFF"
    - "-DENABLE_SCRIPTING=OFF"
    - "-DENABLE_UNIT_TESTS=ON"
    - "-DBUILD_TESTS=OFF"
    - "-DENABLE_PULSEAUDIO=OFF"
    - "-DENABLE_WAYLAND=OFF"
  dependencies:
    - ffmpeg/7.1.5
    - simde/0.8.4-rc3
    - zlib/1.3.1.1
    - uthash/2.4.0
    - jansson/2.15.1.1
    - libuuid/2.42.2
    - libx11/1.8.13.1
    - libxcb/1.17.0.1
    - xorgproto/2025.1
    - libdrm/2.4.133
    - gl4es/1.1.6
    - extra-cmake-modules/6.29.0
    - cmocka/2.0.2
  cc: clang
  cxx: clang++

