# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ocl-icd/2.3.5
homepage: "https://github.com/OCL-dev/ocl-icd"

# 上游测试命令（autotest 套件由 make check 驱动）
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 源码审计（v2.3.5 tag）：check_PROGRAMS 提供 ocl_test / ocl_test_icdl；
# tests/ 下 autotest 用例共 34 个（standard 15 + default-platform 16 + workaround 3）。
upstream_tests:
  - file: ocl_test.c
    source: ocl-icd-2.3.5/ocl_test.c
    description: "上游自检程序：枚举平台并校验 ICD 加载流程（含 --default-platform 模式）"
    command: "./ocl_test"
  - file: ocl_test_icdl.c
    source: ocl-icd-2.3.5/ocl_test_icdl.c
    description: "上游自检程序：校验 clGetICDLoaderInfoOCLICD 扩展信息"
    command: "./ocl_test_icdl"
  - file: tests/testsuite
    source: ocl-icd-2.3.5/tests/testsuite.at
    description: "上游 autotest 套件：34 个用例覆盖 vendors 枚举、默认平台选择与 Intel workaround"
    command: "make check"

# 消费者始终运行两个独立进程，分别覆盖无驱动与受控 ICD 驱动。
test_package_tests:
  - file: test.c
    description: "无驱动消费者测试：强制空 vendors；平台数 0 与 -1001；非法枚举参数；解析 loader 自有 clGetICDLoaderInfoOCLICD，校验四项信息及短缓冲/非法 key；未知扩展与 clUnloadCompiler。正常执行 27 个断言。"
    command: "./test_ocl_icd empty"
  - file: test.c
    description: "受控 ICD 消费者测试：test_icd.c 仅实现 vendor 边界，消费者仍链接被测 OpenCL::OpenCL；强制枚举 1 个平台并经 loader dispatch 校验 VENDOR/VERSION。正常执行 32 个断言；驱动缺失/平台查询失败均不得跳过。"
    command: "./test_ocl_icd fixture"

# 分开申报上游用例和消费者断言，避免把条件分支算作已执行测试。
upstream_test_count: 34
consumer_test_count: 2
assertion_count: 59
