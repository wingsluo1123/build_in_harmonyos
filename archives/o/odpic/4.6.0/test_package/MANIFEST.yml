# 395 例失败的逐类具体技术原因（非「没环境」）
upstream_failure_breakdown:
  - count: 361
    where: "dpiConn_create / server attach"
    reason: "OCIServerAttach 失败 —— 无 Oracle 数据库可达（Oracle Database 无 OHOS / aarch64-musl 版本；本机与 CI 均无实例可连，用例默认 localhost/orclpdb）"
  - count: 27
    where: "dpiPool_create / create pool"
    reason: "同上：连接池创建同样需要可达的 Oracle 数据库"
  - count: 5
    where: "无 FN（用例断言服务端错误码）"
    reason: "断言 Oracle 服务端诊断文本 ORA-01017 / ORA-12154 / ORA-24415，桩环境无法产生服务端诊断"
  - count: 2
    where: "lookup charset"
    reason: "NLS 名称目录未在 OCI 桩库中实现 —— 属桩保真度缺口，非平台缺陷（主动标注）"

# 本轮新增的 OCI ABI 桩库说明（测试夹具，非交付物）
oci_abi_stub:
  purpose: "让 ODPI-C 的 OCI 库加载校验通过，使上游 421 例进入执行（一审时因 libclntsh.so 缺失而整体中止）"
  symbol_count: 160
  implemented:
    - "OCIClientVersion (报 23.1.0.0.0，满足 >= 11.2 的加载校验；并解除 JSON/SODA 用例的客户端版本门控跳过)"
    - "OCIThreadProcessInit (空实现)"
    - "OCIEnvNlsCreate / OCIHandleAlloc (非空不透明句柄 + SUCCESS)"
    - "OCIThreadKeyInit/Get/Set/Destroy (真实单槽语义；否则 ODPI-C 线程局部错误缓冲失效、错误消息为空)"
    - "OCIAttrGet (仅对 CHARSET_ID=31 / NCHARSET_ID=262 回写 873(UTF-8)，按调用方 uint16_t* 宽度写)"
    - "OCIAttrSet (no-op SUCCESS)"
    - "OCINlsNumericInfoGet (MAXBYTESZ: 91→4, 92→2)"
    - "OCINlsCharSetNameToId (返回 0 = 未知字符集；注意 id 是**函数返回值**而非出参)"
  all_other_entry_points: "return OCI_ERROR(-1) —— 使 ODPI-C 走正常错误路径，不崩溃、不伪造成功"
  not_delivered: "桩库不属于交付包，消费者不可使用；本声明仅用于说明测试环境的构成"

# test_package 中自带的验证（消费者视角）—— 新增的鸿蒙消费者用例
test_package_tests:
  - file: test.c
    source: archives/o/odpic/4.6.0/test_package/test.c
    description: "消费者实跑：include 已打包 <dpi.h>、链接 dpi::odpic、调用已打包 API dpiContext_createWithParams()。有 Oracle Client 时走完整建连路径；无 Client 时验证库自身产出 DPI- 诊断，二者都证明 .so 已在 OHOS 上成功加载并执行。"
    command: "ctest --output-on-failure --build-config Release"
    api_calls:
      - dpiContext_createWithParams
      - dpiContext_destroy
      - DPI_VERSION_NUMBER
      - DPI_VERSION_STRING
    assertions: 5
  - file: test_ohos.py
    source: archives/o/odpic/4.6.0/test_package/test_ohos.py
    description: "鸿蒙特有 10 断言（pure-python，仅 stdlib struct，无 readelf/objdump/file 外部依赖）：ELF magic / ELFCLASS64+LE / e_type=ET_DYN+e_machine=AArch64(183) / 程序头解析+PT_INTERP 策略 / .note.ohos.ident(owner OHOS) / .codesign 非空 / DT_NEEDED 非空 / DT_NEEDED 绑定 OHOS musl libc.so 且无 glibc 泄漏 / DT_SONAME=libodpic.so.4 / 无 DT_RPATH·DT_RUNPATH"
    command: "python3 test_ohos.py <pkg>/lib/libodpic.so.4.6.0"
    harmony_specific: true
    assertions: 10
  - file: conanfile.py
    source: archives/o/odpic/4.6.0/test_package/conanfile.py
    description: "平台机制门禁（可证伪性，第 3 层）：test() 首行 _assert_ohos_platform(self)，settings.os != 'OHOS' 即抛 ConanException。保证本消费者用例在 linux+gcc profile 下必然失败，而非因换机器而虚假通过。反向对照 4/4：OHOS 放行 / Linux·Macos·Windows 一律拦截。"
    command: "conan create archives/o/odpic/4.6.0 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
    harmony_specific: true
    assertions: 1

# 断言总数：test.c 5 项 + test_ohos.py 10 项 + conanfile 平台门禁 1 项
assertion_count: 16
