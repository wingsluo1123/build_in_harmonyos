# test_package/MANIFEST.yml
# Upstream test declaration

package: open-adventure/1.20
homepage: "https://gitlab.com/esr/open-adventure"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/*.log
    source: open-adventure-1.20/tests/*.log
    description: "115 regression tests via piped game input"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Compile and run test that verifies advent binary produces welcome message"
    command: "./test_advent"

assertion_count: 3
