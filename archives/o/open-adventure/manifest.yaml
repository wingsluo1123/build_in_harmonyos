software: open-adventure
display: "Open Adventure"
description: "Colossal Cave Adventure, the 1995 430-point version"
category: game
homepage: "https://gitlab.com/esr/open-adventure"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "Pure Makefile build, no configure script or install target"
    - "Dependencies libedit and ncurses built from source in conanfile.py"
    - "ncurses configure has umask 077 issue on HMDFS (E002)"
    - "ncurses sub-Makefile top_srcdir gets garbled by sed on HMDFS"
    - "libedit requires -D__STDC_ISO_10646__ on HarmonyOS"
    - "Autotools scripts need shebang fix for OHOS (E165)"
    - "Static linking: only libc.so dynamic dependency"
  common_dependencies:
    - libedit
    - ncurses

versions:
  "1.20":
    status: published
    build_date: "2026-08-07"
    conan: true
