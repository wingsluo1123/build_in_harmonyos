# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: opencore-amr/0.1.6
homepage: "https://sourceforge.net/projects/opencore-amr/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: amrnb-dec.c
    source: opencore-amr-0.1.6/test/amrnb-dec.c
    description: "AMR-NB decoder test program (decodes AMR file to WAV)"
    command: "./amrnb-dec"
  - file: amrnb-enc.c
    source: opencore-amr-0.1.6/test/amrnb-enc.c
    description: "AMR-NB encoder test program (encodes WAV to AMR)"
    command: "./amrnb-enc"
  - file: amrwb-dec.c
    source: opencore-amr-0.1.6/test/amrwb-dec.c
    description: "AMR-WB decoder test program (decodes AMR-WB file to WAV)"
    command: "./amrwb-dec"

test_package_tests:
  - file: test.c
    description: "Consumer test: AMR-NB encode/decode round-trip + AMR-WB decoder init"
    command: "./test_opencore-amr"

assertion_count: 5
