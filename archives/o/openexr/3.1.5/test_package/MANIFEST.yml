# test_package/MANIFEST.yml
# Upstream official test declaration file

package: openexr/3.1.5
homepage: "https://github.com/AcademySoftwareFoundation/openexr"

# Upstream test command
upstream_check_command: "ctest"

# conanfile.py build() method: upstream tests not integrated in build
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (not included in source archive, fetched separately)
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: src/test.cpp
    description: "Verifies OpenEXR library linkage and API calls (Imf::Header, Imf::Array2D)"
    command: "./test_openexr"

# Approximate assertion count
assertion_count: 4
