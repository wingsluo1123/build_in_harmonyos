# conandata.yml — openigtlink 3.0.0
# Auto-generated by ohc-run.py conan-init

sources:
  url: "https://github.com/openigtlink/OpenIGTLink/archive/refs/tags/v3.0.tar.gz"
  sha256: "8eaf7b9895172152c1e1014e5d06a2a1c7588c00a03c0623be570a87a3a74b9e"

patches:
  - patch_file: "patches/0001-OpenIGTLinkConfig.cmake.in.patch"
    patch_description: >-
      Guard the include of the export()-generated targets file with
      if(NOT TARGET OpenIGTLink). CMake >= 3.0 rejects including a file produced
      by export() (policy CMP0024), which broke the upstream in-tree CTest tree
      under CMake 4.x during the OHOS build.
    patch_type: "portability"
  - patch_file: "patches/0002-Source-CMakeLists.txt.patch"
    patch_description: >-
      Populate OpenIGTLink_INCLUDE_FILES unconditionally. Upstream collected the
      public header list only for MSVC/Xcode generators, so on POSIX systems
      (Linux, OpenHarmony) INSTALL(FILES ...) installed no library headers at
      all and the created package could not be consumed by any downstream
      project on OHOS.
    patch_type: "portability"
  - patch_file: "patches/0003-Testing-igtlTestConfig.h.in.patch"
    patch_description: >-
      Replace the GNU-dialect keyword typeof with its reserved spelling
      __typeof__ in the non-gtest EXPECT_THAT fallback. typeof is unavailable
      once a strict C++ standard is pinned (-std=c++17, which the CMake
      toolchain emits whenever compiler.cppstd is set), so the whole upstream
      CTest tree failed to compile. decltype is not a drop-in substitute here:
      it yields the reference type for an lvalue subscript and std::vector<int&>
      is ill-formed.
    patch_type: "portability"
  - patch_file: "patches/0004-UseOpenIGTLink.cmake.in.patch"
    patch_description: >-
      Same CMP0024 guard as 0001, placed at the top of the generated usage file
      so the in-tree Testing/ consumers can be configured with CMake 4.x;
      without it UseOpenIGTLink.cmake hits the same export() include() error.
    patch_type: "portability"
