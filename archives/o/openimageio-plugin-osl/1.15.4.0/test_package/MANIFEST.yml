# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file

package: openimageio-plugin-osl/1.15.4.0
homepage: "https://github.com/AcademySoftwareFoundation/OpenShadingLanguage"

# Upstream test command (OSL uses ctest, disabled in conan build)
upstream_check_command: "ctest -N"

# conanfile.py build() method upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (not run in conan build, OSL_BUILD_TESTS=OFF)
upstream_tests: []

# test_package consumer tests
test_package_tests:
  - file: src/test.cpp
    description: "Consumer test: create OSLQuery object to verify OSL library linkage"
    command: "./test_osl"

# Approximate assertion count
assertion_count: 1
