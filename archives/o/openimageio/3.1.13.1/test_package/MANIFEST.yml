# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file

package: openimageio/3.1.13.1
homepage: "https://github.com/AcademySoftwareFoundation/OpenImageIO"

# Upstream test command (OIIO uses ctest, disabled in conan build)
upstream_check_command: "ctest -N"

# conanfile.py build() method upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (not run in conan build, BUILD_TESTING=OFF)
upstream_tests: []

# test_package consumer tests
test_package_tests:
  - file: src/test.cpp
    description: "Consumer test: include OIIO headers and use ImageSpec API to verify library linkage"
    command: "./test_openimageio"

# Approximate assertion count
assertion_count: 3
