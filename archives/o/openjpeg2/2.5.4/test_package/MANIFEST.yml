# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e.

package: openjpeg2/2.5.4
homepage: "https://github.com/uclouvain/openjpeg"

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/
    source: openjpeg-2.5.4/tests/
    description: "OpenJPEG upstream codec, conformance, and non-regression test data; disabled in this first package to keep the OHOS cross-build focused on the core libopenjp2 library."
    command: "ctest"

test_package_tests:
  - file: test_openjpeg2.c
    description: "Consumer test for version reporting, default encoder parameters, image creation, component dimensions, and J2K codec lifecycle."
    command: "./test_openjpeg2"

assertion_count: 6
