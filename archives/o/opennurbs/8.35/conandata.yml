# conandata.yml — opennurbs 8.35
#
# 上游（mcneel/opennurbs）**没有 release / tag**，只有分支（8.x）；本机到 GitHub 的
# ref 查询通道（api.github.com / git ls-remote / commits.atom）均不可达，无法取得
# commit sha 来钉「永不变更」的归档 URL。故这里钉**分支归档 + sha256**：
#   - URL 用 GitHub 官方归档主机 codeload.github.com（R39 合规，CI 的
#     mirror-fallback 白名单覆盖 github，无需手写镜像前缀）；
#   - sha256 为 2026-10-16 实测（74943888 字节）。
# ⚠️ 漂移风险：分支归档内容会随上游推进变化，届时 sha256 校验失败。
#    后续维护动作（任一即可）：① 上游若出 tag，改用 tag 归档；
#    ② 能访问 GitHub ref 时取 8.x 的 commit sha，把 URL 换成
#       https://codeload.github.com/mcneel/opennurbs/tar.gz/<sha> 并重算 sha256。

sources:
  "8.35":
    url:
      - "https://codeload.github.com/mcneel/opennurbs/tar.gz/refs/heads/8.x"
    sha256: "5e8210705498ea30030827ae4fdeddf9a962e61d34dd7849e4e7e793ebefb15a"

patches: {}

