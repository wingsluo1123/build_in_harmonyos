# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: opennurbs/8.35
homepage: https://github.com/mcneel/opennurbs

# ── 上游测试清点（R51 三步法 ①）────────────────────────────────────────
# 上游 **没有任何注册的测试**：
#   · CMakeLists.txt 中无 `enable_testing()`、无 `add_test()`、无 `include(CTest)`；
#   · `BUILD_TESTING` 只控制是否多安装一个测试头（`opennurbs_plus_testheader.h`）；
#   · 仓库中的 `example_*` 目录是**示例程序**（不属于测试），且不在
#     顶层 `add_subdirectory` 列表中，本配方不会构建它们。
#
# ── 实跑（R51 ②）──────────────────────────────────────────────────────
upstream_check_command: "(无：上游未注册任何 CTest 测试)"
upstream_test_in_build: false
upstream_test_command: "(无)"
upstream_test_declaration:
  cases_total: 0
  executed: 0
  passed: 0
  reason: >-
    上游未注册 CTest 测试（CMakeLists 无 enable_testing/add_test）；example_* 为示例
    程序而非测试，且不参与构建。N = 0 系上游事实，非环境限制。
  exemption: none

# ── 消费侧真实执行（本配方自己的验证）──────────────────────────────────
consumer_test:
  command: "cmake 构建 opennurbs_consumer（find_package(opennurbs CONFIG) + 链 opennurbs::OpenNURBS）后运行"
  assertions:
    - "ON_3dPoint::DistanceTo / 向量 Length / 点积"
    - "ON_LineCurve 合法性与 Domain / PointAt（中点值校验）"
    - "ON_Xform::TranslationTransformation 作用于点"
    - "ON_BoundingBox 合法性与对角线长度"
