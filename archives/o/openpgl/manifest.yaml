software: openpgl
description: Intel Open Path Guiding Library - 光线追踪路径引导库
category: rendering
license: Apache-2.0
homepage: http://www.openpgl.org
repository: https://github.com/OpenPathGuidingLibrary/openpgl

versions:
  0.7.1:
    status: published
    build_date: 2026-06-08
    notes: ARM 架构编译，使用 CPU_4 设备类型

dependencies:
  - tbb (required)

platform_notes:
  - "ARM 架构必须使用 PGL_DEVICE_TYPE_CPU_4 设备类型"
  - "CPU_8 设备类型不支持（invalid vectorSize parameter）"