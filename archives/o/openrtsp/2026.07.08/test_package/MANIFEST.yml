# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: openrtsp/2026.07.08
homepage: "http://www.live555.com/openRTSP/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testProgs/openRTSP.cpp
    source: live-2026.07.08/testProgs/openRTSP.cpp
    description: "Command-line RTSP client — openRTSP binary smoke test"
    command: "./openRTSP -h"
    exempt: true
    exempt_reason: "live555 项目上游无官方测试套件（make check 不存在）。适配后通过 make check 目标执行 openRTSP -h 验证二进制可用性，作为消费者级验证。详见 TEST_QUALITY_SPEC.md §豁免条款。"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests: []
