# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: openscenegraph/3.6.5
homepage: "https://github.com/openscenegraph/OpenSceneGraph"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# OpenSceneGraph 3.6.5 has no automated test suite (requires graphical display)
upstream_tests:
  - file: N/A
    source: N/A
    description: "OpenSceneGraph has no automated test suite; testing requires graphical display"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_openscenegraph.cpp
    description: "Verify OSG library linking and core API functionality (osg::Object, OpenThreads)"
    command: "./test_openscenegraph"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
