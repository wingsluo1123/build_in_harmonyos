# test_package/MANIFEST.yml — openvdb 13.0.0
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
package: openvdb/13.0.0
homepage: "https://www.openvdb.org/"

# ── 上游测试口径（静态清点，方法可复现）───────────────────────────────
#   grep -rhoE '^\s*TEST(_F|_P)?\s*\(' openvdb/openvdb/unittest/*.cc | wc -l
#   → 738
# 上游 openvdb/openvdb/unittest 为 gtest 套件：119 个 .cc 源文件、738 个
# TEST/TEST_F 用例，链接为单一巨型测试二进制（openvdb_test），需 GTest。
upstream_tests: 738
upstream_test_count_method: "grep -rhoE '^\\s*TEST(_F|_P)?\\s*\\(' openvdb/openvdb/unittest/*.cc | wc -l  → 738（119 个 .cc）"

# conanfile.py 的 build() 方法内是否集成上游测试
upstream_test_in_build: false
upstream_test_command: "-DOPENVDB_BUILD_UNITTESTS=ON 构建 openvdb_test 后 gtest 全量执行"

# 未在归档构建中执行上游单测的原因（如实声明，非"跳过即通过"）
upstream_test_skip_reason: >-
  上游单测是单一巨型 gtest 二进制（119 个 .cc / 738 用例），OHOS 上必须
  make -j1 单线程构建（OHOS 禁 mkfifo jobserver），构建+运行成本超出 CI
  单包预算；既有归档 openvdb/12.1.1 亦保持 OPENVDB_BUILD_UNITTESTS=OFF
  （见 archives/o/openvdb/12.1.1/test_package/MANIFEST.yml）。本归档
  未修改上游任何测试源码；真实执行证据由下列消费者测试提供。

# ── test_package 消费者测试（含鸿蒙特有断言）────────────────────────────
test_package_tests:
  - file: test_openvdb.py
    description: >-
      消费者驱动 7 项断言：① lib/libopenvdb.a 存在 ② include/openvdb/openvdb.h 存在
      ③ libopenvdb 为 AArch64 ELF（纯 Python 解析 ELF 头 e_machine=183；不依赖 readelf）
      ④ 导出关键 API 符号（nm 家族按 PATH/编译器同目录/SDK 目录自动定位；无工具时回退纯 Python 解析 .symtab）
      （openvdb::v13_0::{GridBase,Grid<,tree::Tree<,math::Transform}）⑤ 消费者
      编译+链接成功 ⑥ 静态链接产物无 INTERP 段（仅静态链接成功时）
      ⑦ 消费者真实执行 exit 0 且输出含 ALL PASS（原生构建时）
    command: "python3 test_openvdb.py --pkg <package_folder> --cxx <compiler> [--cross] ..."
  - file: consumer.cpp
    description: >-
      鸿蒙消费者断言 6 项（针对鸿蒙上打包产物的真实行为）：网格命名往返 /
      体素写入读回(Coord(3,4,5)=42.5) / activeVoxelCount==1 / tools::foreach
      值变换 / 库版本指纹以 "13." 开头 / LP64（aarch64 OHOS ABI）
    command: "./openvdb_consumer"

# 断言总数（近似值，用于质量评估）
assertion_count: 13
assertion_count_note: >-
  设备端原生构建（官方 CI）：驱动 7 项 + 消费者内部 6 项 = 13 项；
  本机交叉编译环境可验证其中 5 项（①②③④⑤）——本地无法执行动态 aarch64
  产物（SDK 无设备端 musl 加载器、QEMU 跑动态 OHOS 产物段错误、tbb 制品仓
  包仅提供共享库导致无法全静态），详见 notes.md 第五节。

