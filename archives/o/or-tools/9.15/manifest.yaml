# 版本级 manifest —— or-tools 9.15
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "9.15"

# 软件名
software: or-tools

# 编译状态
# published | built | failed | archived
# built：配方已写盘、补丁已验证可 apply；待 W3 conan create + 上游测试回填后由主编推进发布
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release，R39）
  url: "https://github.com/google/or-tools/releases/download/v9.15/or-tools-9.15.tar.gz"

  # 源码校验和（已核实，与官方发布一致）
  sha256: "599c870319bb127441d92c452d8f79bca46ca6fd295c1deb8031ed303a361311"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（真实 CMake 开关，全部注入 conanfile.py generate()）
  configure_options:
    - "-DBUILD_DEPS=OFF"
    - "-DBUILD_ZLIB=OFF -DBUILD_BZip2=OFF -DBUILD_absl=OFF -DBUILD_Protobuf=OFF"
    - "-DBUILD_Eigen3=OFF -DBUILD_re2=OFF -DBUILD_googletest=OFF -DBUILD_benchmark=OFF"
    - "-DBUILD_CXX=ON -DBUILD_PYTHON=OFF -DBUILD_JAVA=OFF -DBUILD_DOTNET=OFF"
    - "-DBUILD_TESTING=ON -DBUILD_SAMPLES=OFF -DBUILD_EXAMPLES=OFF"
    - "-DUSE_GLOP=ON -DUSE_BOP=ON -DUSE_PDLP=ON -DUSE_COINOR=ON -DUSE_HIGHS=ON"
    - "-DUSE_SCIP=OFF -DUSE_GUROBI=OFF -DUSE_XPRESS=OFF -DUSE_GLPK=OFF -DUSE_CPLEX=OFF"
    - "-DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_WITH_INSTALL_RPATH=TRUE"
    - "-Dabsl_DIR=<abseil-cpp>/lib/cmake/absl -Dprotobuf_DIR=<protobuf>/lib/cmake/protobuf -DGTest_DIR=<gtest>/lib/cmake/GTest"
    - "-DOR_TOOLS_PROTOC_EXECUTABLE=<protobuf>/bin/protoc"
    - "-DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES=<abseil-cpp>/include"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - bzip2/1.0.8
    - abseil-cpp/20260107.1
    - protobuf/33.6.1
    - eigen/3.4.0
    - re2/2024-04-01
    - gtest/1.17.0
    - benchmark/1.9.5
    - coinutils/2.11.13
    - coin-or/0.108.12
    - clp/1.17.10
    - cgl/0.60.10.1
    - cbc/2.10.13
    - highs/1.13.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（均已 git apply --check 验证）
patches_applied:
  - "0001-system_deps-coin-or-fallback.patch"
  - "0002-check_deps-target-aliases.patch"
  - "0003-ortools-config-consumer-aliases.patch"
  - "0004-gmock-death-test-string_view-overload.patch"
  - "0005-protobuf-matchers-static.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "BUILD_DEPS=ON 会强制所有 BUILD_*=ON 并从 git FetchContent 克隆依赖，必须 OFF（主编实测）"
  - "Conan CMakeDeps 按 recipe 名导出 target，需在 check_deps/ortoolsConfig 两层加 ALIAS 桥接（ZLIB::ZLIB/BZip2::BZip2/Coin::*）"
  - "coin-or 包名与 find_package(Osi) 无匹配 config，需 system_deps 兜底 find_package(coin-or CONFIG)"
  - "absl/protobuf/gtest 依赖包自带的 lib/cmake 下 CMake config 提供完整 component targets，用 *_DIR 注入"
  - "protobuf 生成 .pb.cc 缺 absl 头 → CMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES 注入 abseil include"
  - "or-tools 根目录 go.mod 为 Go wrapper 模块描述，lang-preflight 应判 cpp 而非 go（知识草稿已沉淀）"
