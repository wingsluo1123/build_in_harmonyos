software: ortp
display: oRTP
description: RTP protocol library implementing RFC 3550 for real-time multimedia communications
category: network
homepage: https://www.linphone.org/technical-corner/ortp
license: AGPL-3.0-or-commercial
build_system: cmake
ohos_adaptation:
  key_points:
  - 需要将 cmake_minimum_required(VERSION 3.1) 改为 3.5 以兼容 CMake 4.x
  - Conan 生产依赖 bctoolbox/5.3.115；上游 tester 使用包内 tester archive 与测试依赖 bcunit/5.3.113
  - 需添加 -Wno-error=sign-compare 处理 CMSG_NXTHDR 宏类型比较警告
  - ENABLE_TESTS=OFF 仅禁用网络收发工具；ENABLE_UNIT_TESTS=ON 完整执行原始 ortp_tester
  common_dependencies:
  - bctoolbox/5.3.115
  known_issues:
  - 函数原型声明弃用警告（不影响编译）
  - CMSG_NXTHDR 宏类型比较警告（平台头文件定义问题）
versions:
  5.2.0:
    status: built
    build_date: '2026-10-15'
    build_system: cmake
    patches_count: 5
