# conandata.yml — osdmixer 0.9
#
# 源码来源说明（R39）：
#   上游原站 MASTER_SITES（http://bsd-geek.de/FreeBSD/distfiles/，FreeBSD
#   ports audio/osdmixer 所记录的官方源）已不可达：实测在本机
#   `GET http://bsd-geek.de/FreeBSD/distfiles/osdmixer-0.9.tar.gz`
#   -> RemoteDisconnected（服务端无响应关闭连接）。
#   现存权威来源为 FreeBSD 项目官方 distcache 中缓存的原始上游 tarball
#   （即 ports distinfo 所引用的上游原件）：
#     https://distcache.FreeBSD.org/ports-distfiles/osdmixer-0.9.tar.gz
#   已在本机实测下载：2269 字节，sha256 与 ports distinfo
#   （615f421850a3eaa0c31375c41da9f6db1d89fd729e775189676ca632a873a98e）
#   逐字节一致（SIZE 2269 一致）。
#
# 可达性说明（playumidi/0.8.3 先例）：
#   主站 distcache.FreeBSD.org（Fastly 段）在 CI worker 侧 historically
#   不可达，因此把 FreeBSD 自建区域站点（非 Fastly）纳入 url 列表作为回退。
#   区域站点的 TLS 证书为 *.freebsd.org 通配、不覆盖二级子域，严格校验必失败，
#   故显式设 verify: false 跳过证书校验；完整性由 sha256 强校验保证。
#   官方原始 URL 依任务守则保留在列表最后作为回退（原站当前不可达，
#   实际下载由前面的 distcache 条目完成）。
#
sources:
  url:
    - "https://distcache.FreeBSD.org/ports-distfiles/osdmixer-0.9.tar.gz"
    - "https://distcache.eu.FreeBSD.org/ports-distfiles/osdmixer-0.9.tar.gz"
    - "https://distcache.us-east.FreeBSD.org/ports-distfiles/osdmixer-0.9.tar.gz"
    - "https://distcache.us-west.FreeBSD.org/ports-distfiles/osdmixer-0.9.tar.gz"
    - "http://bsd-geek.de/FreeBSD/distfiles/osdmixer-0.9.tar.gz"
  sha256: "615f421850a3eaa0c31375c41da9f6db1d89fd729e775189676ca632a873a98e"
  verify: false
