version: "0.108.12"
software: "osi"
status: pending
build_date: "2026-08-01"
build_system: "autotools"

source:
  url: "https://github.com/coin-or/Osi/archive/refs/tags/releases/0.108.12.tar.gz"
  sha256: "1d80d0b4275f2e1ceefc6dda66b8616e3a8c8b07a926ef4456db4a0d55249333"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--disable-dependency-tracking"
    - "--without-glpk"
    - "--without-soplex"
    - "--without-cplex"
    - "--without-mosek"
    - "--without-xpress"
    - "--without-gurobi"
  dependencies:
    - coinutils/2.11.13
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0002-config-scripts-ohos.patch"

knowledge_gained:
  - "Osi can build the core library without optional external solver backends."
  - "COIN-OR autotools projects need a formal config.guess/config.sub patch that maps HarmonyOS and *-linux-ohos to Linux/musl."
  - "COIN-OR configure/config.status needs HMDFS-compatible umask 022 temporary confstat directories on OHOS workers; the recipe rewrites generated configure scripts after source patches to avoid fragile patch context."
