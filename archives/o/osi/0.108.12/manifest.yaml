version: "0.108.12"
software: "osi"
status: pending
build_date: "2026-08-01"
build_system: "autotools"

source:
  url: "https://github.com/coin-or/Osi/archive/refs/tags/releases/0.108.12.tar.gz"
  sha256: "1d80d0b4275f2e1ceefc6dda66b8616e3a8c8b07a926ef4456db4a0d55249333"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--disable-dependency-tracking"
    - "--without-glpk"
    - "--without-soplex"
    - "--without-cplex"
    - "--without-mosek"
    - "--without-xpress"
    - "--without-gurobi"
  dependencies:
    - coinutils/2.11.13
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-configure-hmdfs-umask.patch"

knowledge_gained:
  - "Osi can build the core library without optional external solver backends."
  - "COIN-OR autotools projects need config.guess/config.sub HarmonyOS normalization; old config.sub scripts can accept OHOS by mapping *-linux-ohos to *-linux-musl."
  - "COIN-OR configure/config.status needs a formal HMDFS-compatible umask 022 patch for temporary confstat directories on OHOS workers."
