# OHOS 适配补丁：reqwest 0.13.x 的 `rustls` feature 硬编码启用 aws-lc-rs
# （`rustls` = `__rustls-aws-lc-rs` → hyper-rustls / rustls 的 aws-lc-rs）。
# aws-lc-sys 0.45.0 的 CMake 路径在本机与 CI worker 上**不产出 aarch64 perlasm
# 汇编对象**（构建日志逐字：`Neither OHOS_NDK_HOME nor OHOS_SDK_NATIVE are set!
# No toolchain found.`；产物 libaws_lc_0_45_0_crypto.a 257 个成员里 0 个 ASM 目标、
# `Building ASM object` 计数 = 0），而 C 代码按「有汇编」编译 → 链接期 200+ 个
# `aws_lc_0_45_0_*` 符号未定义（原始失败日志见 $TASK_DIR/conan-create-1.log）。
# 上游 overtls 自身只用 ring：src/lib.rs:36 安装
# `rustls::crypto::ring::default_provider()`，src/tls.rs:30/46 显式使用
# `rustls::crypto::ring::*` 密码套件，WS 握手自实现（src/client.rs:577 的
# client_async 已注释）→ aws-lc-rs 对本包无功能贡献。
# 改用 reqwest 的 `rustls-no-provider`（= dep:rustls-platform-verifier + __rustls，
# 不启用任何 provider）后 `cargo tree -i aws-lc-rs` 报
# `package ID specification 'aws-lc-rs' did not match any packages`，全树只剩 ring；
# 唯一的默认 provider 消费者是 server 侧 PanelSyncClient 的 reqwest::Client，
# 它在 run_server 里紧跟在 `ensure_rustls_crypto_provider()`（src/server.rs:42）之后创建。
patches:
  - patch_file: "patches/0001-Cargo.toml-reqwest-rustls-no-provider.patch"
    patch_description: >-
      reqwest 改用 rustls-no-provider，去掉 OHOS 上无法链接的 aws-lc-sys，
      与上游自身的 ring-only 设计一致
    patch_type: "portability"
    strip: 1
