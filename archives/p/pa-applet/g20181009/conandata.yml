# conandata.yml — pa-applet g20181009
#
# g20181009 是 FreeBSD ports 的版本命名（PORTVERSION g20181009），
# 对应上游提交 fernandotcl/pa-applet@3b4f8b3（最后一个提交，上游无该名字的 tag）。

sources:
  url: "https://codeload.github.com/fernandotcl/pa-applet/tar.gz/3b4f8b3"
  # codeload 的 URL 末段是纯 commit 号、没有扩展名，不显式声明 filename 时
  # conan 会按「非 tar.*」猜测为 zip 而 BadZipFile。
  filename: "pa-applet-g20181009.tar.gz"
  sha256: "32dcd0663cca120cf60d1046443884f854448e7bb71226a416915ae9beb33e11"

patches:
  - patch_file: "patches/0001-guard-x11-key-grabber.patch"
    patch_type: "portability"
    patch_description: >-
      以 GDK 自身后端宏 GDK_WINDOWING_X11 守卫 <gdk/gdkx.h>/<X11/Xlib.h> 与
      XGrabKey 全局媒体键抓键实现；后端未启用 X11 时保留公开 API 并输出诊断，
      不引入任何平台宏。
