# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pacparser/1.5.0
homepage: "https://github.com/manugarg/pacparser"

# 上游测试命令
upstream_check_command: "bash tests/runtests.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/runtests.sh
    source: pacparser-1.5.0/tests/runtests.sh
    description: "PAC file parsing and proxy resolution test suite"
    command: "NO_INTERNET=1 bash tests/runtests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Initializes pacparser, parses a PAC string, finds proxy, verifies DIRECT result"
    command: "./test_pacparser"

# 测试断言总数
assertion_count: 4
