# ⚠️ 必须保持为文件最后一个顶层键（原因见文件头注释）
patch_classification:
  - file: 0001-pacredir.h.patch
    # refresh-patch --auto / finalize-archive 默认写 type=auto、platform_only=True、
    # guard='pending'，并按其输出要求由 AI 复核补实。实测复核结论：本补丁两处改动
    # （补 #include <sys/ioctl.h>、__time_t → time_t）都是**无条件**的 POSIX
    # 可移植性修复，补丁新增行只有 2 行且平台宏计数为 0，在 glibc 下同样正确编译，
    # 因此不是 platform_only、无需 guard。
    type: portability
    platform_only: false
    guard: none
