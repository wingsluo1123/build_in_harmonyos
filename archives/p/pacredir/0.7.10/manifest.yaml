# 版本级 manifest — pacredir 0.7.10
# 遵循 ARCHIVE-SPEC v3.0（交叉校验用，CI 不读取）
#
# ⚠️ 段落顺序有硬约束：patch_classification 必须放在**文件最后**。
# scripts/ohc/refresh_patch.py:547 用
#   re.sub(r'\npatch_classification:.*', '', content, flags=re.DOTALL)
# 清除旧块后再追加新块，DOTALL 会把该键**到文件末尾**的全部内容一并剥掉。
# 本文件首轮就因此丢失了 tests / verification / knowledge_gained /
# knowledge_drafts 四段（finish 的 step [1/10] refresh-patch 与 step [6/10]
# finalize-archive 都会触发），已恢复并把该键移到末尾。

version: "0.7.10"
software: "pacredir"

# published | built | failed | archived
# built = conanfile.py 已生成 + conan create 与 conan-verify 本地实测通过，未 upload。
# 远程 HarmonyOS CI 终态出来后按仓库定义回填。
status: built

build_date: "2026-10-15"
build_system: "makefile"
conan_ref: "pacredir/0.7.10"

source:
  url: "https://github.com/eworm-de/pacredir/archive/refs/tags/0.7.10.tar.gz"
  sha256: "fa73fb62dda010f20d85cfb8864ec993421641edde2cf999a91dd835c0fe36cc"
  tar_format: tar.gz

build:
  system: makefile
  # 上游是裸 Makefile，无 configure 阶段。配方只调 `make pacredir`，显式传：
  configure_options:
    - "CC=<conan tools.build:compiler_executables[c]>"
    - "CFLAGS_EXTRA=<AutotoolsDeps 的 CPPFLAGS/CFLAGS/LDFLAGS/LIBS> -Wl,--as-needed -Wl,--exclude-libs,ALL -Wl,--allow-shlib-undefined"
    - "VERSION=0.7.10"
    - "ARCH=aarch64"
    - "ID=ohos"
  # 编译/链接的其余部分沿用上游 Makefile 自带的 -std=c11 -O2 -fPIC -Wall -Werror
  # 与 -Wl,-z,now -Wl,-z,relro -pie（不在配方里重复声明，避免与上游漂移）。
  dependencies:
    - systemd/261.1
    - libmicrohttpd/1.0.1
    - libcurl/8.5.0
    - iniparser/4.2.6
    - zlib/1.3.1.1
  cc: clang
  cxx: ""

patches_applied:
  - "0001-pacredir.h.patch"

# ── 测试台账（计数口径全流程唯一：独立检查项数量）──
