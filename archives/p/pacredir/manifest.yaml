software: pacredir
display: "pacredir"
description: "Redirect pacman requests to a LAN peer discovered via mDNS, with an embedded HTML status page"
category: network
homepage: "https://github.com/eworm-de/pacredir"
license: "GPL-3.0-or-later"
build_system: makefile
language: c

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "musl 不传递暴露 <sys/ioctl.h>（ioctl / SIOCGIFFLAGS），也不提供 glibc 内部 typedef __time_t —— 上游 pacredir.h 两处都要改"
    - "上游 Makefile 在解析期 $(shell source /etc/makepkg.conf) 与 $(shell source /etc/os-release) 取 CARCH/ID；OHOS 无这两个文件，$(shell) 静默返回空串并把空值编进二进制，必须由配方显式传 ARCH=/ID="
    - "favicon.h 由 resvg|oxipng（Rust CLI）生成；两者在制品仓均未发布且 CI 无 Rust 工具链，需由配方复刻「二进制资产 → C 头」这条链"
    - "contrib/static_file.sh 用 bash 4 的 ${NAME^^} 与 GNU stat --format，在 OHOS 的 /bin/sh 上不可移植"
    - "依赖图：systemd 钉 zlib/1.3.1（非 PIC），libcurl 钉 zlib/1.3.1.1（PIC）——同图必冲突，override 方向决定重建哪个依赖。必须选让 make-based 依赖保住预编译包的方向：libcurl 的 CMake 走 Unix Makefiles，而 OHOS 上 make -j>1 必炸（E074/E525：SELinux 禁 FIFO 使 jobserver 失效），且下游无法给依赖注入 -j1"
    - "已发布的 libsystemd.so 带悬空符号 mallinfo2，链接可执行文件时会被 lld 的 --no-allow-shlib-undefined 升级为硬错误"
  common_dependencies:
    - systemd
    - libmicrohttpd
    - libcurl
    - iniparser

versions:
  "0.7.10":
    status: built
    build_system: makefile
    build_date: "2026-10-15"
    conan_ref: "pacredir/0.7.10"
