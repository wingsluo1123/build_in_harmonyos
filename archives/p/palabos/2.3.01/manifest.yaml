version: "2.3.01"
software: "palabos"
status: built
build_date: "2026-10-14"
build_system: "cmake"

source:
  url: "https://gitlab.com/unigespc/palabos/-/archive/v2.3.0/palabos-v2.3.0.tar.gz"
  sha256: "2085de7b06cc9c4a7b3457f7c2d17747d8960c0f861e32fc883acd504dfc1e23"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DPALABOS_BUILD_EXAMPLES=OFF"
    - "-DENABLE_MPI=OFF"
    - "-DENABLE_POSIX=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "C++17 removed std::random_shuffle (metaStuffWrapper3D.cpp:85); rewrite 2-arg calls to std::shuffle + mt19937 with <random> include"
  - "Upstream v2.3.0 has no test suite; CI only compiles examples"
  - "Root CMake has no install() rules; package() copies libpalabos.a and headers manually"
  - "ENABLE_MPI must be OFF on OHOS (no MPI toolchain)"
