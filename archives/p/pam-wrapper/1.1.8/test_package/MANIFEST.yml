# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer smoke test.

package: pam-wrapper/1.1.8
homepage: "https://cwrap.org/pam_wrapper.html"

upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_mode: "optional: -o pam-wrapper/*:with_upstream_tests=True"
upstream_test_command: "conan create archives/p/pam-wrapper/1.1.8 -o pam-wrapper/*:with_upstream_tests=True"

upstream_tests:
  - file: "tests/test_pam_wrapper.c"
    source: "pam_wrapper-1.1.8/tests/test_pam_wrapper.c"
    description: "CTest/cmocka tests for PAM wrapper interposition, pam_matrix, libpamtest, environment handling, sessions, credentials, and Python binding smoke when Python is found"
    command: "ctest --output-on-failure"
    status: "optional_not_run"
    result: "not run in the default package validation"
    reason: "Optional upstream tests require enabling with_upstream_tests=True and verifying cmocka/2.0.2 availability on the OHOS worker"

test_package_tests:
  - file: test_pam_wrapper.c
    description: "Consumer test: pre-create pam_matrix service/passdb, dlopen libpam_wrapper, and authenticate via libpamtest run_pamtest"
    command: "./test_pam_wrapper"

assertion_count: 5
