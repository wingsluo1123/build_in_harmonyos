# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: papirus-icon-theme/20250501
homepage: "https://github.com/PapirusDevelopmentTeam/papirus-icon-theme"

# 上游测试命令
upstream_check_command: "make test_short"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_rendering_glitches — SVG 渲染异常检测"
    command: "make test_rendering_glitches"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_optimization — XML 优化检测"
    command: "make test_optimization"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_svg_elems — SVG 内嵌对象检测"
    command: "make test_svg_elems"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_symlinks — 断链检测"
    command: "make test_symlinks"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_filenames — 文件名合规"
    command: "make test_filenames"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_decimal_size — 尺寸属性校验"
    command: "make test_decimal_size"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_lengths_units — 长度单位校验"
    command: "make test_lengths_units"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_xml_struct — SVG XML 结构校验（需 xmlstarlet）"
    command: "make test_xml_struct"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "图标主题消费者验证 — index.theme/SVG/PNG/断链/样本图标"
    command: "conan create . -tf test_package"

# 测试断言总数
assertion_count: 130000
