# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2"

# 软件名
software: "paprefs"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-16"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitLab 官方 tag 归档：发布包 freedesktop.org/.../paprefs-1.2.tar.xz
  # 对非浏览器 UA 返回 403，CI 干净环境实测 source() 失败；两者内容逐文件 sha256 一致）
  url: "https://gitlab.freedesktop.org/pulseaudio/paprefs/-/archive/v1.2/paprefs-v1.2.tar.gz"

  # 源码校验和
  sha256: "3ec501aa97bb539991ee4cc87f4fd59fb76357a1b7ce978a62af1ecff7835470"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-meson.build.patch"
- "0002-src-meson.build.patch"
- "0003-src-paprefs.cc.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  patches_count: 3

patch_classification:
  - file: 0001-meson.build.patch
    type: auto
    platform_only: True
    guard: 'GDK_WINDOWING_X11（GTK 自带宏，非平台宏）'
  - file: 0002-src-meson.build.patch
    type: auto
    platform_only: True
    guard: 'GDK_WINDOWING_X11（GTK 自带宏，非平台宏）'
  - file: 0003-src-paprefs.cc.patch
    type: auto
    platform_only: True
    guard: 'GDK_WINDOWING_X11（GTK 自带宏，非平台宏）'
