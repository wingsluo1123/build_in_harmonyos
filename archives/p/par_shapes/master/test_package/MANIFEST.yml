# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 门禁 L0e 强制要求（docs/TEST_QUALITY_SPEC.md）
#
# 清点方式（R51 第一步，实测非推断）：
#   1. 上游 test/CMakeLists.txt 定义 12 个测试目标；其中 describe/it 框架
#      六个文件合计 48 个用例（test_shapes 16 / test_bubbles 11 / test_strings 9
#      / test_filecache 8 / test_octasphere 2 / test_sprune 2）
#   2. 本适配组件 par_shapes 对应 test_shapes 目标：test_shapes.c +
#      console-colors.c，-std=c11 -Wall，include .. 与 .，链接 m
#   3. 实测运行 test_shapes：16/16 用例通过（8 个 describe 块），退出码 0，
#      并向相对路径 build/*.obj 写出 15 个 OBJ 导出产物

package: par_shapes/master
homepage: https://github.com/prideout/par

# 上游测试入口（上游 test/CMakeLists.txt 的 test_shapes 目标）
upstream_check_command: "cmake -Bbuild . && cmake --build build --target test_shapes && ./test_shapes（在 test/ 目录运行；工作目录需先有 build/ 子目录）"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "clang -std=c11 -Wall -I<src> -I<src>/test <src>/test/test_shapes.c <src>/test/console-colors.c -lm -o test_shapes && bash -c 'cd <build> && ./test_shapes'（build() 内按上游 test_shapes 目标的编译方式复刻并直接执行）"

# 与上游判定的等价性说明：
#   - 上游 test_shapes.c 自带 describe/it 描述框架，主函数以失败计数作退出码，
#     直接执行的退出码与 ctest 判定一致（0 = 全过）
#   - 未使用 cmake/ctest 的理由：test/CMakeLists.txt 顶层的 find_package(PkgConfig)
#     与 pkg_search_module(CURL REQUIRED libcurl) 服务于 monorepo 其他目标，
#     test_shapes 目标本身不依赖 libcurl——按该目标的编译方式直接构建即可

# 上游测试实际运行的测试程序
upstream_tests:
  - file: test/test_shapes.c
    source: par-68e1215a055ccbeae378dd5969e09d0c79963a4a/test/test_shapes.c
    description: "上游 16 个用例（8 个 describe 块：cylinders and spheres / plane / export / merge / clone / transforms / misc shapes / lsystems）"
    command: "./test_shapes（构建目录下运行；export 用例写 build/*.obj 共 15 个文件）"
  - file: test/console-colors.c
    source: par-68e1215a055ccbeae378dd5969e09d0c79963a4a/test/console-colors.c
    description: "上游测试输出着色辅助（test_shapes 目标的组成部分）"
    command: "（编译链接进 test_shapes）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_par_shapes.c
    description: "消费者端到端执行器 12 用例 / 66 校验点：以真实消费者视角（PAR_SHAPES_IMPLEMENTATION + 打包头文件）完成网格生成、计数与入参守卫、属性布局、合并偏移、clone 复用、变换与包围盒、OBJ 导出与回读全链路"
    command: "./test_par_shapes"

# 校验计数：上游 16 用例（实跑 16/16 通过）+ 消费者 66 校验点 = 82
assertion_count: 82
