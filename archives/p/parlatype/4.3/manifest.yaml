# 版本级 manifest
# 文件位置: archives/p/parlatype/4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.3"

# 软件名
software: "parlatype"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-15"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39；镜像 fallback 由 CI 自动注入）
  url: "https://github.com/gkarsay/parlatype/releases/download/v4.3/parlatype-4.3.tar.gz"

  # 源码校验和
  sha256: "b942ec53d93cf823ebbbe9153c7b5855f404d4ac4680881dc921f490ec59dda7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表（meson setup 的 -D 选项）
  configure_options:
    - "-Dhelp=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gtk4/4.22.4
    - glib/2.84.0.1.1
    - libadwaita/1.8.8
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
    - iso-codes/4.20.1
    - pango/1.56.4
    - zlib/1.3.1.1
    - fontconfig/2.18.1.1
    - fribidi/1.0.16
    - gettext/0.22.5.1
    - itstool/2.0.7

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-meson.build.patch"
  - "0002-meson_options.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 上 itstool 是 python 脚本，shebang 解释器与 python libxml2 绑定缺失 → gnome.yelp() 帮助页必然失败；共性解法是加 help 布尔选项守卫 subdir('help')（见 knowledge-extension/）"
  - "构建期 host 工具的 libintl 冲突：glib 的 libintl.so.8 导出 g_libintl_*，gettext 的导出 libintl_*，同名库不可共存 → 按工具做 wrapper 隔离（LD_LIBRARY_PATH 分工具设置），不能靠调整顺序"
  - "OHOS glib 包生成的 glib-2.0.pc 带冗余 -lffi，链接期报找不到 → 规范化 .pc 剥离该 flag"
  - "OHOS gstreamer 包提供的 .pc 名称与上游 meson 期望不一致（gstreamer-app-1.0/gstreamer-audio-1.0）→ 生成别名 .pc"
  - "制品仓里 GTK4 的包名是 gtk4（不是 gtk），与 libadwaita 1.8.8 配对（ghex 46.0 先例）"
  - "上游测试注册在 libparlatype/tests/meson.build（非顶层 tests/），7 例；OHOS gstreamer 只有静态插件库、构建环境无显示，5 例无法运行"

patch_generation:
  method: per-file-difflib
  # 可移植写法：不写死本机绝对路径（审计 code-style#5）；<builds> = 构建机上的源码工作根目录
  source_orig_dir: "<builds>/parlatype-4.3.orig"
  source_work_dir: "<builds>/parlatype-4.3.work"
  source_orig_hash: c9fb20183d03db00
  source_work_hash: 670f3cf14b0a5afc
  generated_at: '2026-10-15T23:54:01'
  patches_count: 2

patch_classification:
  - file: 0001-meson.build.patch
    type: auto
    platform_only: False
    guard: "if get_option('help')"
  - file: 0002-meson_options.txt.patch
    type: auto
    platform_only: False
    guard: "option('help', type: 'boolean', value: false)"
