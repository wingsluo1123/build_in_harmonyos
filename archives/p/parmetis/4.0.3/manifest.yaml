software: parmetis
version: 4.0.3
status: built
build_system: cmake
created_at: 2026-08-10
dependencies:
  required:
    - open-mpi/5.0.10
  optional: []
source_url: https://karypis.github.io/glaros/files/sw/parmetis/parmetis-4.0.3.tar.gz
source_sha256: f2d9a231b7cf97f1fee6e8c9663113ebf6c240d407d3c118c55b3633d6be6e5f
patches_applied: []
configure_options:
  - "-DCMAKE_C_COMPILER=mpicc (from open-mpi)"
  - "-DGKLIB_PATH=<source>/metis/GKlib"
  - "-DMETIS_PATH=<source>/metis"
  - "-DSHARED=OFF"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
knowledge_gained:
  - ParMETIS bundles METIS and GKlib internally (no external METIS dep needed)
  - CMakeLists.txt has FindMPI commented out, relies on mpicc wrapper
  - No upstream test suite distributed (add_subdirectory(test) commented out)
  - idxtype width (32/64) must match METIS configuration (default 32-bit)
test_results:
  type: explicit
  status: pending
