# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: partclone-utils/0.4.3
homepage: "https://github.com/vasi/partclone-utils"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# partclone-utils has no automated test suite (no make check target)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run partclone_imageinfo and ntfsclone_imageinfo binaries to verify installation"
    command: "partclone_imageinfo"

# 测试断言总数
assertion_count: 2
