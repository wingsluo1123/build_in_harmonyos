# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# partimage 0.6.9 上游无测试套件 (make check 为空)
# test_package 通过 readelf 验证二进制为有效的 ELF aarch64 可执行文件
# (HarmonyOS 上未签名 ELF 不可直接执行，需 CI 签名)

package: partimage/0.6.9
homepage: "https://sourceforge.net/projects/partimage/"

# 上游测试命令
upstream_check_command: "make check"

# 上游无测试套件
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "通过 readelf 验证 partimage 二进制为有效 ELF aarch64 可执行文件"
    command: "readelf -h partimage"

# 测试断言总数
assertion_count: 2
