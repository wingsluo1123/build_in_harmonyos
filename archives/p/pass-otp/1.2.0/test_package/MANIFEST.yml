# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pass-otp/1.2.0
homepage: "https://github.com/tadfisher/pass-otp"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (pass-otp uses sharness-based tests)
upstream_tests:
  - file: test/code.t
    source: pass-otp-1.2.0/test/code.t
    description: "OTP code generation tests"
    command: "make -C test"
  - file: test/insert.t
    source: pass-otp-1.2.0/test/insert.t
    description: "OTP insert command tests"
    command: "make -C test"
  - file: test/uri.t
    source: pass-otp-1.2.0/test/uri.t
    description: "OTP URI parsing tests"
    command: "make -C test"
  - file: test/validate.t
    source: pass-otp-1.2.0/test/validate.t
    description: "OTP validation tests"
    command: "make -C test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "验证 otp.bash 扩展脚本安装正确且语法有效"
    command: "./test.sh"

# 测试断言总数 (近似值)
assertion_count: 3
