software: pass-otp
display: "pass-otp"
description: "pass 密码管理器的 OTP (一次性密码) 扩展"
category: utility
homepage: "https://github.com/tadfisher/pass-otp"
license: GPL-3.0

build_system: makefile

ohos_adaptation:
