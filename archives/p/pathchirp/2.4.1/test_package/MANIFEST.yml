package: pathchirp/2.4.1
homepage: "http://www.spin.rice.edu/Software/pathChirp/"

# Upstream archive has no tests/ directory, check target or test script.
upstream_check_command: "none (upstream has no test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.py
    description: "Check the installed sender, receiver and master versions"
    command: "python3 test.py (check_versions)"
  - file: test.py
    description: "HarmonyOS PC loopback UDP run, writing estimates in user storage"
    command: "python3 test.py (check_ohos_loopback_storage)"

assertion_count: 10
# Two named cases; ten static assert statements (not ten test cases).
