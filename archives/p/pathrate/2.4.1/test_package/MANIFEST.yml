package: pathrate/2.4.1
homepage: "http://www.cc.gatech.edu/~dovrolis/bw-est/pathrate.html"

upstream_check_command: "none (upstream has no test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.py
    description: "Both installed programs show their own help"
    command: "python3 test.py (check_help)"
  - file: test.py
    description: "Integration: sender/receiver paced UDP loopback yields a finite positive capacity interval"
    command: "python3 test.py (check_capacity_loopback)"
  - file: ohos_consumer.c
    description: "Independent HarmonyOS C consumer: fixed TCP control input, real installed sender, two UDP trains, persisted report compared byte-for-byte with independent reference"
    command: "python3 run_consumer.py (executes ./ohos_consumer)"

assertion_count: 11
# Three functional cases; assertion_count counts only the existing Python assert
# statements. The new C consumer uses explicit error returns, not assert().
