software: patman
display: "PatMaN"
description: "PatMaN: fast approximate matching of short patterns against nucleotide databases"
category: bioinformatics
homepage: "https://bioinf.eva.mpg.de/patman/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 g++、-march=k8 与版本 1.2：补丁改为 $(CXX)、删除架构参数、版本 1.2.2"
    - "依赖 popt/1.16（制品仓已发布），经 AutotoolsDeps 注入 -I/-L/-l"
    - "不使用上游 install 目标（install -s 调用构建机 strip），配方直接打包 bin/patman 与 man 页"
  common_dependencies:
    - popt

versions:
  "1.2.2":
    status: built
    build_date: "2026-10-08"
    conan_ref: "patman/1.2.2"
    source_url: "https://deb.debian.org/debian/pool/main/p/patman/patman_1.2.2+dfsg.orig.tar.xz"
