version: "2.4.0"
software: pbbam
status: built
build_date: "2026-09-26"
build_system: meson

source:
  url: "https://github.com/PacificBiosciences/pbbam/archive/refs/tags/v2.4.0.tar.gz"
  sha256: "a386a5231b06b0ea660d81abe8081041c200d1817710b89bc9888b485a7aab26"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dtests=true"
    - "-Dbuild-tools=true"
    - "-Dbuild-docs=false"
    - "-Ddefault_library=static"
  dependencies:
    - "boost/1.85.0"
    - "zlib/1.3.1"
    - "htslib/1.24-r0"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-samtools-optional.patch (portability: pbbamify + ccs-kinetics-bystrandify cram tests register only when samtools is found)"
  - "patches/0002-libdeflate-golden-offsets.patch (portability: test_PacBioIndex BGZF golden offsets refreshed for htslib --with-libdeflate stack; assertions untouched)"

knowledge_gained:
  - "pbbam 是 Meson 构建的 PacBio BAM C++ 库，tests=true 且 build-tools=true（EndToEnd 用例需 tools/bam2sam，package 阶段再剥离 bin 保纯库交付）"
  - "pbcopper 尚无 OHOS 制品仓配方，pin v2.3.0 离线 vendor 到 subprojects/，wrap_mode=nodownload"
  - "上游 meson 注册 8 个测试（tests/ x3 + tools/ x5），gtest 二进制内含 72 个 TEST 文件；pbbamify 与 ccs-kinetics-bystrandify 的 cram 用例硬依赖 samtools，OHOS 无 samtools 制品时以 environment 缺口计"
  - "上游计数以 meson-logs/testlog.json（逐测试 name/result）为唯一确定源，testlog.txt 仅作失败尾部证据；gtest 失败用例名从 pbbam-gtest-unittests.xml 提取"
