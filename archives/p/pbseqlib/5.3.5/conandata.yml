# conandata.yml - pbseqlib 5.3.5
# Upstream GitHub repo (PacificBiosciences/blasr_libcpp) is no longer
# reachable (all tags/branches return 404, verified 2026-10-14); the
# recipe therefore uses the Debian dfsg-cleaned upstream tarball from
# official Debian mirrors. SHA-256 is the .dsc-recorded value, verified
# locally against the downloaded 973104-byte tarball.
sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/p/pbseqlib/pbseqlib_5.3.5+dfsg.orig.tar.xz"
    - "https://deb.debian.org/debian/pool/main/p/pbseqlib/pbseqlib_5.3.5+dfsg.orig.tar.xz"
  sha256: "81afecd5d7ccb3cd70ed42cd8afa64876fde4c0deee89e1112c7f3b3d6ee8c49"
