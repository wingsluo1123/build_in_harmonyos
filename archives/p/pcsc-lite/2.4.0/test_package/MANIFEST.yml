# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pcsc-lite/2.4.0
homepage: "https://github.com/LudovicRousseau/PCSC"

# 上游测试命令 (meson test --list 显示无测试)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# pcsc-lite meson build has no defined tests; testpcsc binary requires running pcscd daemon
upstream_tests:
  - file: src/testpcsc.c
    source: pcsc-lite-2.4.0/src/testpcsc.c
    description: "PC/SC unitary test (requires pcscd daemon running)"
    command: "./testpcsc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者冒烟测试: 调用 SCardEstablishContext 验证库链接"
    command: "./test_pcsc_lite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
