# test_package/MANIFEST.yml
# pd-boids 1.1.1 - upstream test declaration.

package: pd-boids/1.1.1
homepage: "https://puredata.info"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches (boids2d-help.pd / boids3d-help.pd);
  there is no make check/ctest and no automated test harness.  The externals
  can only be exercised by loading them into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_boids.sh
    description: "headless OHOS pd loads the installed boids externals and checks the deterministic dump parameter report of boids2d/boids3d (neighbors=2)"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_boids.pd sh test_pd_boids.sh"

test_files:
  - path: "test_package/test_pd_boids.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_boids.sh"
    test_type: "R34"
    assertion_count: 2

test_package_test_count: 1
consumer_assertion_count: 2
upstream_test_cases: 0
assertion_count: 2
