software: pd-boids
display: "pd-boids"
description: "Pure Data 群集（boids）模拟外部对象（boids2d / boids3d）"
category: audio
homepage: "https://puredata.info"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "制品仓 puredata/0.54.1 是 application，不暴露 Pd API 头 m_pd.h → 配方 source() 额外拉取 pure-data 0.54-1 源码树，-I 指向其 src"
    - "上游老式 Pd library template 用 uname -s 判平台；OHOS 报 HarmonyOS → make 命令行强制 UNAME=Linux 选中 pd_linux 与 -shared"
    - "CFLAGS 命令行整体给出（覆盖模板的 -O6 等 +=），纯 C、零三方依赖，构建 2 个 .pd_linux"
    - "消费者测试用真机 OHOS pd 无头加载并校验两个类确定性的 dump 参数报告（默认 neighbors=2）"
  common_dependencies: []

versions:
  - version: "1.1.1"
    status: built
    build_date: "2026-10-12"
