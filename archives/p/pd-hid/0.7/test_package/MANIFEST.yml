# test_package/MANIFEST.yml
# pd-hid 0.7 - upstream test declaration.

package: pd-hid/0.7
homepage: "https://puredata.info"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches and abstractions; there is no
  make check/ctest and no automated test harness.  [hid] can only be
  exercised by loading it into a running Pd (and reading real hardware).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_hid.sh
    description: "headless OHOS pd loads the installed [hid] external and checks the version banner + compile timestamp posted on first instantiation"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_hid.pd sh test_pd_hid.sh"

test_files:
  - path: "test_package/test_pd_hid.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_hid.sh"
    test_type: "R34"
    assertion_count: 2

test_package_test_count: 1
consumer_assertion_count: 2
upstream_test_cases: 0
assertion_count: 2
