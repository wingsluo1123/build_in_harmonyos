software: pd-hid
display: "pd-hid"
description: "Pure Data USB HID 对象 [hid]（Hans-Christoph Steiner；含 29 个抽象）"
category: audio
homepage: "https://puredata.info"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Linux 后端 hid_linux.c 走 Linux evdev（<linux/input.h> 与 /dev/input/event*），不使用 libhidapi；OHOS sysroot 自带该头，零三方依赖"
    - "平台任务标注的 hidapi 依赖非 0.7 上游所需（2011 年至今 Linux 后端始终为 evdev），配方按事实不声明"
    - "制品仓 puredata/0.54.1 是 application，不暴露 m_pd.h → source() 额外拉取 pure-data 0.54-1 源码树，-I 指向其 src"
    - "上游老式模板用 uname -s 判平台；OHOS 报 HarmonyOS → make 命令行强制 UNAME=Linux（命中模板的 hid.pd_linux 规则）"
    - "消费者测试用真机 OHOS pd 无头加载 [hid] 并校验首实例的版本横幅；真实设备读取需真机硬件"
  common_dependencies: []

versions:
  - version: "0.7"
    status: built
    build_date: "2026-10-12"
