sources:
  # Upstream publishes jmmmp through Pd's package manager (deken) and the
  # SourceForge file area only carries the ancient jmmmp-0.1.1.tar.gz, so 0.61
  # has no stable upstream tarball URL.  The Debian source package repacks the
  # deken jmmmp-v0.61--externals release as pd-jmmmp_0.61.orig.tar.xz; both
  # mirrors below serve that byte-identical file (sha256 cross-checked), and
  # Debian's own pd-jmmmp packaging is the authoritative record of what the
  # release contains (debian/pd-jmmmp.install: *.pd, *.txt, examples/).
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/p/pd-jmmmp/pd-jmmmp_0.61.orig.tar.xz"
  sha256: "d7d50ee9d95297735d2fd70fae4d23ac22d3a512ad00627fd9efe9225764e002"

patches: []
