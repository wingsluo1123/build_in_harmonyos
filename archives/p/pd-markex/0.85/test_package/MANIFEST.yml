# test_package/MANIFEST.yml
# pd-markex 0.85 - upstream test declaration.

package: pd-markex/0.85
homepage: "https://puredata.info"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches (<class>-help.pd); there is no
  make check/ctest and no automated test harness.  The externals can only be
  exercised by loading them into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_markex.sh
    description: "headless OHOS pd loads the installed markex externals and drives [rgb2hsv 1 0 0]->0 1 1, [hsv2rgb 0 1 1]->1 0 0, [strcat foo]+symbol bar->foobar"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_markex.pd sh test_pd_markex.sh"

test_files:
  - path: "test_package/test_pd_markex.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_markex.sh"
    test_type: "R34"
    assertion_count: 3

test_package_test_count: 1
consumer_assertion_count: 3
upstream_test_cases: 0
assertion_count: 3
