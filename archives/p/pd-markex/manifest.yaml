software: pd-markex
display: "pd-markex"
description: "Pure Data 外部对象集合 markex（Mark Danks；20 个类：数学/颜色/向量/序列）"
category: audio
homepage: "https://puredata.info"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "制品仓 puredata/0.54.1 是 application，不暴露 Pd API 头 m_pd.h → 配方 source() 额外拉取 pure-data 0.54-1 源码树，-I 指向其 src"
    - "上游老式 Pd library template 用 uname -s 判平台；OHOS 报 HarmonyOS → make 命令行强制 UNAME=Linux 选中 pd_linux 扩展名与 -shared"
    - "CFLAGS 在命令行整体给出（覆盖模板的 -O6 等 +=），纯 C、零三方依赖，构建 20 个 .pd_linux"
    - "消费者测试用真机 OHOS pd 无头加载安装后的外部对象并驱动 [rgb2hsv]/[hsv2rgb]/[strcat]"
  common_dependencies: []

versions:
  - version: "0.85"
    status: built
    build_date: "2026-10-12"
