# test_package/MANIFEST.yml
# pd-pdogg 0.25.1 - upstream test declaration.

package: pd-pdogg/0.25.1
homepage: "https://puredata.info"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches (<class>-help.pd); there is no
  make check/ctest and no automated test harness.  The externals can only be
  exercised by loading them into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_pdogg.sh
    description: "headless OHOS pd loads the installed pdogg externals and checks the per-object version banner posted on creation (oggamp~/oggcast~/oggread~/oggwrite~)"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_pdogg.pd sh test_pd_pdogg.sh"

test_files:
  - path: "test_package/test_pd_pdogg.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_pdogg.sh"
    test_type: "R34"
    assertion_count: 4

test_package_test_count: 1
consumer_assertion_count: 4
upstream_test_cases: 0
assertion_count: 4
