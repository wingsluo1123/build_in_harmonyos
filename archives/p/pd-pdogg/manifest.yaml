software: pd-pdogg
display: "pd-pdogg"
description: "Pure Data Ogg/Vorbis 对象库 pdogg（oggamp~/oggcast~/oggread~/oggwrite~）"
category: audio
homepage: "https://puredata.info"
license: LGPL-2.1-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "三方依赖 libvorbis/1.3.7（传递 libogg），制品仓现成"
    - "配方从 Conan 依赖图生成 -I/-L/-l 并以命令行 ALL_CFLAGS/ALL_LDFLAGS/ALL_LIBS 覆盖上游的 pkg-config 取法"
    - "制品仓 puredata/0.54.1 是 application，不暴露 m_pd.h → source() 额外拉取 pure-data 0.54-1 源码树（含 s_stuff.h），-I 指向其 src"
    - "上游老式模板用 uname -s 判平台；OHOS 报 HarmonyOS → 命令行强制 UNAME=Linux"
    - "消费者测试用真机 OHOS pd 无头加载 4 个类，校验创建时 post 的版本横幅"
  common_dependencies:
    - "libvorbis/1.3.7"

versions:
  - version: "0.25.1"
    status: built
    build_date: "2026-10-12"
