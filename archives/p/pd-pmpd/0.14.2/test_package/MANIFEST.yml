# test_package/MANIFEST.yml
# pd-pmpd 0.14.2 - upstream test declaration.

package: pd-pmpd/0.14.2
homepage: "https://github.com/ch-nry/pd-pmpd"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships Pd help patches (<class>-help.pd) and 70+ example patches
  under examples/, but no make check/ctest and no automated test harness.
  The externals can only be exercised by loading them into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_pmpd.sh
    description: "headless OHOS pd loads the installed pmpd externals and drives [mass] setX 0 -> 0 and setX 5 -> 5"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_pmpd.pd sh test_pd_pmpd.sh"

test_files:
  - path: "test_package/test_pd_pmpd.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_pmpd.sh"
    test_type: "R34"
    assertion_count: 2

test_package_test_count: 1
consumer_assertion_count: 2
upstream_test_cases: 0
assertion_count: 2
