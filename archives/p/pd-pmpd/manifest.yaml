software: pd-pmpd
display: "pd-pmpd"
description: "Pure Data 物理建模外部对象库 pmpd（Cyrille Henry；32 个类：mass/link/interactor/train）"
category: audio
homepage: "https://github.com/ch-nry/pd-pmpd"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "制品仓 puredata/0.54.1 是 application，不暴露 Pd API 头 m_pd.h → 配方 source() 额外拉取 pure-data 0.54-1 源码树，PUREDATA_INCLUDE_DIRS 指向其 src"
    - "上游 CMake 默认对象名带多架构后缀 .linux-arm64-32.so → 强制 PUREDATA_SUFFIX=.pd_linux 让 Pd 标准加载器可找到"
    - "git_info.cmake 在非 git 源码树上优雅降级，纯 C、零三方依赖，构建 32 个 .pd_linux"
    - "消费者测试用真机 OHOS pd 无头加载并驱动确定性的 [mass] setX/bang 位置输出"
  common_dependencies: []

versions:
  - version: "0.14.2"
    status: built
    build_date: "2026-10-12"
