sources:
  # Upstream release tarball from the official project file area.  Debian
  # (source package pd-purepd) ships the same orig tarball; all three URLs were
  # downloaded and their sha256 compared before this recipe was written, they
  # are byte identical.  The Debian entries are only download fallbacks.
  url:
    - "https://downloads.sourceforge.net/project/pure-data/libraries/purepd/purepd-0.1.1.tar.gz"
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/p/pd-purepd/pd-purepd_0.1.1.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/p/pd-purepd/pd-purepd_0.1.1.orig.tar.gz"
  sha256: "a670c612019d2b5715deabd66f914d86db56c92d898b98fb573b0bda94bb9389"
