# conandata.yml — pd-vbap 1.2.1
# Official source: GitHub's own tarball delivery host (codeload.github.com), tag
# v1.2.1 of pure-data/vbap — the same bytes as
# https://github.com/pure-data/vbap/archive/refs/tags/v1.2.1.tar.gz (48504 bytes,
# sha256 below).  The codeload form is used because its URL keeps the payload
# reachable without the github.com HTML/redirect front end.
# The recipe passes filename="v1.2.1.tar.gz" to get(): conan picks its unpacker
# from the file name, and this URL ends in the tag name — without the hint conan
# treats the tarball as a zip ("BadZipFile: File is not a zip file").

sources:
  url: "https://codeload.github.com/pure-data/vbap/tar.gz/refs/tags/v1.2.1"
  sha256: "7a754a9c5051f2f9e8e243e1cd5c348255bae348430fec9d4d60e4649facd6d1"

# No patches: the adaptation is done entirely through explicit make variables
# (CC / PDINCLUDEDIR), see knowledge/operations/pd-externals-ohos/.
patches: {}
