# test_package/MANIFEST.yml — pdal/2.10.2

package: pdal/2.10.2
homepage: "https://pdal.io"

# PDAL uses CMake with CTest; WITH_TESTS=OFF in our build
upstream_check_command: "ctest -N"

upstream_test_in_build: false
upstream_test_command: ""

# PDAL upstream tests are in test/ directory (C++ unit tests using gtest)
# We disabled WITH_TESTS in conanfile.py for HarmonyOS adaptation
upstream_tests: []

# Our test_package verifies basic library linkage and StageFactory
test_package_tests:
  - file: test_pdal.cpp
    description: "Verifies PDAL library linkage and basic StageFactory API"
    command: "./test_pdal"

assertion_count: 3
