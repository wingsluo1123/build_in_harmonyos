software: perf
version: "6.6.9"
status: built
build_date: "2026-08-07"

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/kernel/v6.x/linux-6.6.9.tar.gz"
  sha256: "240a99859445c77d2229962a0c34d411dc5d7594193d782e6e73d308f59a32ca"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "HOSTCC=clang"
    - "WERROR=0"
    - 'EXTRA_CFLAGS=-D__kernel_sa_family_t=sa_family_t'
  dependencies:
    - elfutils/0.195
    - zlib/1.3.1
    - bzip2/1.0.8
    - slang/2.3.3
    - openssl/1.1.1w
    - libcap/2.69
    - libtraceevent/1.1.0 (built from linux-5.15 source)

  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-qsort_r-for-ohos.patch"
  - "0002-libtraceevent-remove-kernel-deps.patch"

knowledge_gained:
  - "perf is part of the Linux kernel source tree (tools/perf/), uses custom Makefile"
  - "libtraceevent is required (hard error), removed from kernel in 6.0+, must build from 5.15 source"
  - "qsort_r not available on OHOS/musl, replaced with qsort + static context"
  - "OHOS fortify headers treat open() mode bits as warning (WERROR=0 needed)"
  - "__kernel_sa_family_t not defined in OHOS sysroot, added via -D flag"
  - "libtraceevent from 5.15 kernel needs patch to remove linux/time64.h and asm/bug.h includes"

