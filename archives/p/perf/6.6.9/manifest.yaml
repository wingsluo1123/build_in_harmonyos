version: "6.6.9"
status: built
build_date: "2026-08-07"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/kernel/v6.x/linux-6.6.9.tar.xz"
  sha256: "8ebc65af0cfc891ba63dce0546583da728434db0f5f6a54d979f25ec47f548b3"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "JOBS=1"
    - "NO_LIBELF=1"
    - "NO_LIBTRACEEVENT=1"
  dependencies:
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# Fixes applied inline in conanfile.py build() method:
# - Shebang: #!/bin/bash → #!/data/service/hnp/bin/bash (HarmonyOS /bin read-only)
# - open(path, O_RDONLY, O_NONBLOCK) → open(path, O_RDONLY | O_NONBLOCK) (OHOS fortify)

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "perf from Linux kernel 6.6.9 builds on OHOS with make JOBS=1 (mkfifo not supported)"
  - "#!/bin/bash shebang must be patched to #!/data/service/hnp/bin/bash (HarmonyOS /bin is read-only)"
  - "open(path, O_RDONLY, O_NONBLOCK) triggers OHOS fortify warning; fix to open(path, O_RDONLY | O_NONBLOCK)"
  - "NO_LIBELF=1 required because elfutils binary not in conan repo; libelf feature detection fails without glibc/bionic"
  - "NO_LIBTRACEEVENT=1 required because libtraceevent is not available on OHOS platform"
  - "perf source is in tools/perf/ within the Linux kernel source tree"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/perf-6.6.9.orig
