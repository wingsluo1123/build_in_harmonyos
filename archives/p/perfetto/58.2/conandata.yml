patches:
  - patch_file: "patches/0001-buildtools-use-system-zlib.patch"
    patch_description: "libunwindstack: use the OHOS system zlib instead of the unavailable Chromium zlib fork (//buildtools:zlib)"
    patch_type: "portability"
  - patch_file: "patches/0002-zstd-ohos-qsort-r-fallback.patch"
    patch_description: "zstd cover.c: OHOS musl has no qsort_r; force zstd's portable qsort() fallback"
    patch_type: "portability"
  - patch_file: "patches/0003-libbase-ohos-getprogname.patch"
    patch_description: "libbase logging: derive the program name from the executable path (musl has no program_invocation_short_name)"
    patch_type: "portability"
  - patch_file: "patches/0004-liblog-ohos-getprogname.patch"
    patch_description: "liblog logger_write: derive the program name from /proc/self/exe (musl has no program_invocation_short_name)"
    patch_type: "portability"
  - patch_file: "patches/0005-symbolizer-filesystem-ohos-nftw.patch"
    patch_description: "symbolizer filesystem: use nftw() on OHOS (musl does not ship <fts.h>)"
    patch_type: "portability"
  - patch_file: "patches/0006-vm-sockets-ohos-sockaddr-storage.patch"
    patch_description: "vm_sockets.h: avoid the OHOS <linux/socket.h> sockaddr_storage redefinition by using the built-in UAPI fallback"
    patch_type: "portability"
  - patch_file: "patches/0007-profiling-heapprofd-ohos-sigrtmin.patch"
    patch_description: "heapprofd_producer: OHOS musl has no compile-time __SIGRTMIN; use the kernel raw realtime-signal base"
    patch_type: "portability"
  - patch_file: "patches/0008-profiling-java-hprof-ohos-sigrtmin.patch"
    patch_description: "java_hprof_producer: OHOS musl has no compile-time __SIGRTMIN; use the kernel raw realtime-signal base"
    patch_type: "portability"
  - patch_file: "patches/0009-profiling-proc-descriptors-ohos-sigrtmin.patch"
    patch_description: "proc_descriptors: OHOS musl has no compile-time __SIGRTMIN; use the kernel raw realtime-signal base"
    patch_type: "portability"
  - patch_file: "patches/0010-traced-relay-ohos-statx.patch"
    patch_description: "relay_service: take struct statx/STATX_BTIME from the kernel UAPI header (musl does not expose them)"
    patch_type: "portability"
  - patch_file: "patches/0011-heapprofd-e2e-ohos-basename.patch"
    patch_description: "heapprofd end-to-end test: use perfetto::base::Basename instead of the GNU basename from <string.h>"
    patch_type: "portability"
  - patch_file: "patches/0012-gtest-ohos-tmpdir.patch"
    patch_description: "googletest gtest-port: honour TMPDIR for captured-stream files instead of hard-coding /tmp (OHOS /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0013-ipc-test-socket-ohos-tmpdir.patch"
    patch_description: "ipc test_socket: derive the test unix-socket path from GetSysTempDir() (OHOS /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0014-api-test-support-ohos-tmpdir.patch"
    patch_description: "api_test_support: derive the temp file path from GetSysTempDir() (OHOS /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0015-bundle-integrationtest-ohos-tmpdir.patch"
    patch_description: "bundle_integrationtest: derive the stderr capture path from GetSysTempDir() (OHOS /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0016-gzip-decompressor-unittest-ohos-tmpdir.patch"
    patch_description: "gzip_decompressor_unittest: use perfetto's GetSysTempDir() instead of a hard-coded /tmp path"
    patch_type: "portability"
  - patch_file: "patches/0017-gn-bootstrap-ohos-platform.patch"
    patch_description: "GN standalone bootstrap (build/gen.py): treat OHOS sys.platform 'ohos'/'harmonyos' as linux so it selects a build_*.ninja template"
    patch_type: "portability"
