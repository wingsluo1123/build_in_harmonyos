# conandata.yml — perfetto 58.2 (HarmonyOS PC / OHOS aarch64)
#
# 上游仓库: https://github.com/google/perfetto (tag v58.2, commit add693d8b338ba9599dbcbc3e300b1ab8c000897)
#
# 说明
# ----
# perfetto 的 standalone 构建依赖 20 个第三方源码包，上游由 tools/install-build-deps 从
# *.googlesource.com 抓取。OHOS 侧 *.googlesource.com 不可达，故改为 GitHub 镜像，并逐条核对
# 「同一 commit SHA」（AOSP 系的仓库不在 aosp-mirror，改用 msft-mirror-aosp，同名 SHA 全部命中）。
# 依赖保持上游 vendored 源不变（仅换可达镜像），唯一例外是 zlib：上游用的是 chromium 专有 fork
# （含 chromeconf.h / cpu_features.* / contrib/optimizations/insert_string.h），不可得；
# 故 libunwindstack 改用 OHOS sysroot 自带的系统 zlib（见 patches/0001）。
# 每个包都记录 sha256，供供应链校验。

sources:
  url: "https://codeload.github.com/google/perfetto/tar.gz/refs/tags/v58.2"
  filename: "perfetto-v58.2.tar.gz"
  sha256: "ad566546d5c461135a41962e95b680f374e438cf2d9936867608b84132ec610a"
  tar_format: "tar.gz"

# GN 构建工具链：上游不 vendor 二进制（tools/gn 只是下载器），预编译 gn 为 x86/glibc 且无 .codesign
# → 用 OHOS clang 从源码自举。pin 上游 install-build-deps 指定的同一 revision。
build_tools:
  gn:
    url: "https://codeload.github.com/JiauZhang/gn/tar.gz/0725d7827575b239594fbc8fd5192873a1d62f44"
    sha256: "c802a3c5ffcec6e4395794c43ef713f2b0cbb36468b21e20b89cfa15ef33f181"
    tar_format: "tar.gz"
    strip_root: true

