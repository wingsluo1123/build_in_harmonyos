knowledge_gained:
  - "GN（generate-ninja）私有工具链可在 OHOS 自举：上游预编译 gn 为 x86/glibc 且无 .codesign，需用 OHOS clang 从源码构建"
  - "OHOS 用户存储执行 ELF 需 .codesign 段；本机 OHOS clang 链接期自动添加"
  - "OHOS 上 strip 会破坏 .codesign，构建须 strip=\"\""
  - "OHOS musl 无 qsort_r / fts.h / program_invocation_short_name（glibc 专有），需移植补丁"
  - "OHOS sysroot 的 <linux/socket.h> 无条件重定义 sockaddr_storage，与 musl <sys/socket.h> 冲突"
  - "OHOS 头把 NULL 定义为 0L；perfetto 的 -Weverything 针对 hermetic clang 19 校准，系统 clang 15 需 is_hermetic_clang=false"
