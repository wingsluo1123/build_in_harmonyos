# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perfetto/58.2
homepage: "https://perfetto.dev/"

# 上游测试：perfetto 自带 GN 测试目标（unittests 全套 + trace_processor 套件）
# 本配方在 build() 中构建全部测试二进制（未自动运行，运行见 notes.md 的实测记录）。
upstream_check_command: "ninja -C out/ohos perfetto_unittests && out/ohos/perfetto_unittests"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/*/BUILD.gn (GN unittests)
    source: perfetto-58.2/
    description: "perfetto 自带单元测试套件（perfetto_unittests / _base_ / _misc_ / _profiling_ / _trace_processor_ / _tracing_）"
    command: "out/ohos/perfetto_unittests"
  - file: test/trace_processor/
    source: perfetto-58.2/test/trace_processor
    description: "trace_processor diff/SQL 套件（宿主侧）"
    command: "out/ohos/perfetto_trace_processor_unittests"

test_package_tests:
  - file: test.sh
    description: "消费者用例：以消费者方式调用 trace_processor_shell / perfetto / traced / tracebox / traceconv（存在性/版本/SQL/--help 契约，14 断言）"
    command: "bash test.sh"
  - file: consumer.cc
    description: "消费者测试：编译并链接 libperfetto 的最小消费者程序"
    command: "./consumer"
  - file: test_ohos.sh
    description: "鸿蒙平台特有校验：AArch64 ELF + .codesign 段 + TMPDIR 约定（11 断言）"
    command: "bash test_ohos.sh"

assertion_count: 25
