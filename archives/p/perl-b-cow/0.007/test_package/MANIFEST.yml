package: perl-b-cow/0.007
homepage: https://metacpan.org/dist/B-COW
upstream_test_in_build: true
upstream_test_command: make -j1 test TEST_VERBOSE=1
upstream_program_count: 3
upstream_assertion_count: 22
upstream_tests:
  - {file: t/00-load.t, source: B-COW-0.007/t/00-load.t}
  - {file: t/00-report-prereqs.t, source: B-COW-0.007/t/00-report-prereqs.t}
  - {file: t/01-basic.t, source: B-COW-0.007/t/01-basic.t}
test_package_tests:
  - {file: consumer.pl, command: sh run-perl-test.sh perl consumer.pl, description: Actual matching XS and real COW state isolation}
harmony_tests:
  - {file: harmony_tests/private-cow.pl, command: sh harmony_tests/run-private-cow.sh perl harmony_tests/private-cow.pl, description: Actual OHOS owned POSIX inode and same-ABI COW bytes}
consumer_scenarios: 1
harmony_scenarios: 1
