# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-crypt-openssl-aes/0.21-r1
homepage: "https://metacpan.org/dist/Crypt-OpenSSL-AES"

# 上游测试命令 (Perl MakeMaker: make test)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/Crypt-OpenSSL-AES.t
    source: Crypt-OpenSSL-AES-0.02/t/Crypt-OpenSSL-AES.t
    description: "AES encrypt/decrypt test (4 assertions)"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/Crypt-OpenSSL-AES.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "文件存在性检查 + 模块加载尝试 (OHOS SELinux dlopen 策略可能阻止加载)"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
