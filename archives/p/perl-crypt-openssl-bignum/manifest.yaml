software: perl-crypt-openssl-bignum
display: "Crypt::OpenSSL::Bignum"
description: "OpenSSL's multiprecision integer arithmetic for Perl (XS module)"
category: perl
homepage: "https://metacpan.org/dist/Crypt-OpenSSL-Bignum"
license: GPL-1.0-or-later OR Artistic-1.0
build_system: custom

ohos_adaptation:
  key_points:
    - "Perl XS 模块，使用 ExtUtils::MakeMaker (Makefile.PL) 构建"
    - "依赖系统 OpenSSL (libcrypto)，通过 OPENSSL_PREFIX 环境变量定位"
    - "conanfile.py generate() 使用 _resolve_openssl_prefix() 动态解析 OpenSSL 路径"
    - "❌ 功能不可用: Perl 进程 (hishell_hap:s0) 无法 dlopen HMDFS (hmdfs:s0) 上的 .so"
    - "变通方案: 需 root 权限安装到 /data/service/hnp/ (hnp_file:s0 上下文)"
    - "关联知识: E166 (HMDFS SELinux 限制), E046 (SELinux 权限限制)"
  common_dependencies:
    - openssl

versions:
  "0.09-r13":
    status: published
    build_date: "2026-07-03"
    functional_status: blocked
    functional_blocker: "platform-limitation (SELinux: hishell_hap cannot dlopen hmdfs:s0)"
