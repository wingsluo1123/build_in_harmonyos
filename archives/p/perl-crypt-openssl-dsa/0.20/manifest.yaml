software: perl-crypt-openssl-dsa
# 版本级 manifest
# 文件位置: archives/p/perl-crypt-openssl-dsa/0.20/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.20"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/K/KM/KMX/Crypt-OpenSSL-DSA-0.20.tar.gz"

  # 源码校验和
  sha256: "e4575d787d44e49b3b59cc39eda2e461fe0606dd0e87d3a9c3df5011b133e702"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: custom

build:
  # 构建系统类型（冗余字段，保持兼容性）
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL LIBS=\"-L$HOME/usr/local/lib -lcrypto\" INC=\"-I$HOME/usr/local/include\""

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - openssl/1.1.1w

  # 编译器
  cc: clang
  cxx: clang++

  # 环境变量
  env:
    LD_LIBRARY_PATH: "$HOME/usr/local/lib"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile.PL natively supports OPENSSL_PREFIX env var and LIBS/INC parameters"
  - "No Crypt::OpenSSL::Guess dependency (unlike Crypt::OpenSSL::RSA)"
  - "No LDDLFLAGS patch needed (default linker flags work on OHOS)"
  - "Build produces only char/unsigned char pointer sign warnings (harmless)"
  - "DSA.so links against libcrypto.so.1.1 only (not libssl)"
  - "Conan adaptation: conanfile.py + conandata.yml + test_package/ added"

# ============================================================
# 预编译包信息
# ============================================================

# 预编译包文件名
package_file: "perl-crypt-openssl-dsa-0.20-ohos-aarch64.tar.gz"

# 预编译包大小（字节）
package_size: 70K

# 预编译包内容摘要
package_contents:
  - "lib/site_perl/5.42.0/aarch64-linux/Crypt/OpenSSL/DSA.pm"
  - "lib/site_perl/5.42.0/aarch64-linux/auto/Crypt/OpenSSL/DSA/DSA.so"
  - "lib/site_perl/5.42.0/Crypt/OpenSSL/DSA/Signature.pod"

# 安装方法
install_method: "conan install --requires=perl-crypt-openssl-dsa/0.20"
