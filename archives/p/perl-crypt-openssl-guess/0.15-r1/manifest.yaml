# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Perl 模块在 OHOS 平台无需修改源码即可编译安装"
  - "init-build 自动搜索的 URL 可能不正确，需通过 MetaCPAN API 查找正确 CPAN 下载 URL"
  - "Python urllib SSL 证书验证失败时，可用 curl -kL 手动下载源码包绕过"
  - "conan-init 默认生成 Autotools 模板，纯 Perl 模块需重写 conanfile.py 为 Makefile.PL 流程"
  - "settings 仅保留 os/arch，纯 Perl 模块不需要 build_type/compiler/cppstd"
  - "模块导出函数名为 openssl_inc_paths() 而非 guess_inc()，测试代码必须使用正确函数名"
  - "package_info 中需设置 PERL5LIB 环境变量指向包内 lib/perl5 目录"
