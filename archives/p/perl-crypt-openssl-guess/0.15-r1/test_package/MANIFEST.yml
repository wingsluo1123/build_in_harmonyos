# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-crypt-openssl-guess/0.15-r1
homepage: "https://github.com/akiym/Crypt-OpenSSL-Guess"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00_compile.t
    source: Crypt-OpenSSL-Guess-0.15/t/00_compile.t
    description: "Compile test — verify Crypt::OpenSSL::Guess loads"
    command: "perl -MCrypt::OpenSSL::Guess -e 1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "消费者测试 — 验证 Crypt::OpenSSL::Guess 可加载并调用 openssl_inc_paths()"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
