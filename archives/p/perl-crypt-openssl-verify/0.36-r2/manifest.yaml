# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Crypt::OpenSSL::Guess 的 find_openssl_prefix() 无法在 OHOS 上正常工作，通过 patch 移除依赖并硬编码 OPENSSL_PREFIX 环境变量"
  - "Perl XS 模块的 .so 文件受 HMDFS SELinux 限制 (E073)，dlopen 被拒绝；test_package 中跳过运行时加载测试"
  - "Conan 2.x generate() 应使用 buildenv_info 设置 OPENSSL_PREFIX/LD_LIBRARY_PATH/PERL5LIB/CC/CXX，而非在 build() 中直接操作 os.environ"
  - "package_info() 应通过 system_libs 声明 OpenSSL 系统库依赖 (ssl, crypto)，而非在 requirements() 中声明 Conan 包"

