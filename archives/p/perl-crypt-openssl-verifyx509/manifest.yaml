software: perl-crypt-openssl-verifyx509
display: "Crypt::OpenSSL::VerifyX509"
description: "Perl XS module for simple X.509 certificate verification using OpenSSL"
category: crypto
homepage: "https://metacpan.org/dist/Crypt-OpenSSL-VerifyX509"
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"
build_system: custom

ohos_adaptation:
  key_points:
    - "Perl XS 模块, 使用 ExtUtils::MakeMaker (Makefile.PL) 构建"
    - "需要 OPENSSL_PREFIX 环境变量指向 OpenSSL 安装路径"
    - "Makefile.PL 需补丁添加 OPENSSL_PREFIX 支持"
    - "INSTALL_BASE=/ 确保包布局为 lib/perl5/"
    - "HMDFS SELinux (E073) 阻止 dlopen 用户目录 .so — 平台限制"
    - "运行时依赖 Crypt::OpenSSL::X509 (Conan @ohpcd/stable)"
  common_dependencies:
    - openssl
    - perl
    - perl-crypt-openssl-x509

versions:
  "0.21-r5":
    status: published
    build_date: "2026-07-06"
    conan_ref: "perl-crypt-openssl-verifyx509/0.21-r5@ohpcd/stable"
