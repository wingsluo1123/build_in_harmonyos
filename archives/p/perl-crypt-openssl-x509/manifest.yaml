software: perl-crypt-openssl-x509
display: "Crypt::OpenSSL::X509"
description: "Perl extension to OpenSSL's X509 API — certificate parsing and manipulation"
category: crypto
homepage: "https://github.com/dsully/perl-crypt-openssl-x509"
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"
build_system: custom

ohos_adaptation:
  key_points:
    - "构建系统为 Perl ExtUtils::MakeMaker (Makefile.PL)，非 autotools/cmake"
    - "需设置 OPENSSL_PREFIX 环境变量指向 OpenSSL 安装路径 (conanfile.py 已实现自动探测)"
    - "需设置 PERL5LIB 指向用户安装的 Perl 模块依赖路径"
    - "Conan 构建环境中需显式传递 INC/LIBS 给 perl Makefile.PL，确保找到 OpenSSL 头文件"
    - "运行时受 HMDFS SELinux 限制 (E073)，.so 需安装到系统目录才能 dlopen"
  common_dependencies:
    - openssl
    - perl
    - perl-crypt-openssl-guess
    - perl-convert-asn1

versions:
  "2.0.1-r1":
    status: published
    build_date: "2026-07-06"
    conan_ref: "perl-crypt-openssl-x509/2.0.1-r1@ohpcd/stable"
