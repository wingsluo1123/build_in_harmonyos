# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-devel-caller/2.07
homepage: "https://metacpan.org/pod/Devel::Caller"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 注意: 所有测试需要加载 Caller.so (XS模块), 在OHOS上受SELinux限制
upstream_tests:
  - file: t/Devel-Caller.t
    source: Devel-Caller-2.07/t/Devel-Caller.t
    description: "主测试套件 (72个子测试) - 测试caller_cv, called_with, caller_args, called_as_method等功能"
    command: "perl -MExtUtils::Command::MM -e test_harness t/Devel-Caller.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 - readelf验证Caller.so ELF格式+boot_Devel__Caller符号+libc.so依赖 (R34合规)"
    command: "sh test.sh <Caller.so path>"

# 测试断言总数 (近似值, 用于质量评估)
# 上游: 72 (Devel-Caller.t)
# OHOS平台SELinux限制导致XS模块无法通过perl动态加载, 改用readelf验证ELF+符号
assertion_count: 72
