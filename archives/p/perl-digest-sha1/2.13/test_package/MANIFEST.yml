# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-digest-sha1/2.13
homepage: "https://metacpan.org/pod/Digest::SHA1"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/sha1.t
    source: Digest-SHA1-2.13/t/sha1.t
    description: "上游 SHA-1 算法功能测试 (new/add/hexdigest/sha1_transform/clone)"
    command: "perl -Ilib t/sha1.t"
  - file: t/bits.t
    source: Digest-SHA1-2.13/t/bits.t
    description: "上游 SHA-1 位操作测试"
    command: "perl -Ilib t/bits.t"
  - file: t/badfile.t
    source: Digest-SHA1-2.13/t/badfile.t
    description: "上游错误处理测试"
    command: "perl -Ilib t/badfile.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sha1.sh
    description: "消费者测试：加载 Digest::SHA1 模块并调用 new/add/hexdigest API 验证 SHA-1 哈希"
    command: "sh test_sha1.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
