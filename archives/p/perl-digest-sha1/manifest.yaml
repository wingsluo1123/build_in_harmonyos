software: perl-digest-sha1
display: "Digest::SHA1"
description: "Perl interface to the SHA-1 algorithm"
category: crypto
homepage: "https://metacpan.org/pod/Digest::SHA1"
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"
build_system: perl-makefile-pl

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Perl 5.42.0 on OHOS 已正确配置 clang 编译器，无需额外 INC/LDDLFLAGS 参数"
    - "SELinux HMDFS 限制，XS 模块无法在用户目录加载 (E073)"
  common_dependencies:
    - perl/5.42.0

# 版本索引
versions:
  "2.13":
    status: built
    build_date: "2026-08-07"
