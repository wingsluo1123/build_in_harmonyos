software: perl-digest-sha3
version: "1.01"
status: published
build_date: "2026-08-07"

source:
  url: "https://cpan.metacpan.org/authors/id/M/MS/MSHELOR/Digest-SHA3-1.01.tar.gz"
  tar_format: tar.gz

build_system: perl_xs
build:
  system: perl_xs
  configure_options:
    - "INSTALL_BASE=<build_folder>/lib/perl5"
  dependencies:
    - perl/5.42.0
  cc: clang

conan:
  recipe: conanfile.py
  data: conandata.yml
  test_package: test_package/
  patches: none

knowledge_gained:
  - "L2: Perl XS模块使用ExtUtils::MakeMaker构建，无需额外CCFLAGS/LDDLFLAGS"
  - "L2: Perl Config已包含-D_GNU_SOURCE和正确的lib路径"
  - "L2: SELinux HMDFS限制阻塞.so加载（E073），test脚本需处理Permission denied"
  - "L3: Digest::SHA3 1.01 Makefile.PL直接可用，无需patch"

functional_test:
  verification_status: "platform_limited"
  guarantee_level: "compile_verified"
  unverified_risks:
    - "SHA-3算法输出正确性未运行时验证（HMDFS SELinux限制）"
  conclusion: "编译成功，test_package验证.so和.pm存在，运行时加载受HMDFS SELinux限制（E073）"
  warning: "⚠️ 运行时功能验证需管理员安装到系统目录后确认"
