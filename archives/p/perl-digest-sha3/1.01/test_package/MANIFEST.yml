# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-digest-sha3/1.01
homepage: "https://metacpan.org/dist/Digest-SHA3"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/sha3-256.t
    source: Digest-SHA3-1.01/t/sha3-256.t
    description: "SHA3-256 算法功能测试 (NIST 标准向量)"
    command: "perl -Ilib t/sha3-256.t"
  - file: t/sha3-512.t
    source: Digest-SHA3-1.01/t/sha3-512.t
    description: "SHA3-512 算法功能测试 (NIST 标准向量)"
    command: "perl -Ilib t/sha3-512.t"
  - file: t/sha3-224.t
    source: Digest-SHA3-1.01/t/sha3-224.t
    description: "SHA3-224 算法功能测试 (NIST 标准向量)"
    command: "perl -Ilib t/sha3-224.t"
  - file: t/sha3-384.t
    source: Digest-SHA3-1.01/t/sha3-384.t
    description: "SHA3-384 算法功能测试 (NIST 标准向量)"
    command: "perl -Ilib t/sha3-384.t"
  - file: t/allfcns.t
    source: Digest-SHA3-1.01/t/allfcns.t
    description: "所有API函数功能测试"
    command: "perl -Ilib t/allfcns.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sha3.sh
    description: "消费者测试：加载 Digest::SHA3 模块并调用 sha3_256_hex + sha3_512_hex API (NIST 标准向量验证)"
    command: "sh test_sha3.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
