package: perl-io-tee/0.66
homepage: "https://metacpan.org/dist/IO-Tee"

upstream_check_command: "make test"

upstream_test_in_build: true
upstream_test_command: "make test TEST_VERBOSE=1"

upstream_tests:
  - path: t/
    description: "Upstream CPAN TAP tests for IO::Tee (tee-style multiplex output)"
    cases: 1
    source: IO-Tee-0.66/t/original.t

test_package_tests:
  - file: conanfile.py
    description: "Consumer smoke: load IO::Tee, create tee object writing to multiple files, verify output"
    command: "perl -MIO::Tee -e ..."
    result: "passed"

assertion_count: 27
