software: perl-ipc-run3
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.049-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.049-r1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
compile_date: "2026-08-07"

# 构建系统
build_system: perl-eumm

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RJ/RJBS/IPC-Run3-0.049.tar.gz"

  # 源码校验和
  sha256: "9d048ae7b9ae63871bae976ba01e081d887392d904e5d48b04e22d35ed22011a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 构建系统详细信息（用于质量门禁 G4）
  build_system: perl

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块使用 ExtUtils::MakeMaker (Makefile.PL) 构建，无需C编译器"
  - "conanfile.py settings 应简化为 os+arch，纯Perl模块不需要 compiler/build_type"
  - "package() 使用 glob 查找 .pm 文件，通过 site_perl 路径段重映射到 lib/"
  - "test_package 需使用 self.run() 而非 subprocess.run() 以通过 CI L0d 门禁"
  - "test_package 需包含 .sh 测试源文件以通过 CI L0c 门禁"

# 最终状态: built
