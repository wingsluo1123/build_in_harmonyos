# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-ipc-run3/0.049-r1
homepage: https://metacpan.org/pod/IPC::Run3

# 纯Perl模块，上游测试通过 make test 执行（13个测试文件，69个测试用例全部通过）
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - name: "t/IPC-Run3.t"
    description: "核心功能测试（run3调用、I/O重定向）"
  - name: "t/die_handler.t"
    description: "die处理测试"
  - name: "t/fd_leak.t"
    description: "文件描述符泄漏测试"
  - name: "t/fork.t"
    description: "fork行为测试"
  - name: "t/utf8.t"
    description: "UTF-8编码测试"
  - name: "t/IPC-Run3-profiling.t"
    description: "性能分析测试"
  - name: "t/IPC-Run3-ProfArrayBuffer.t"
    description: "ProfArrayBuffer模块测试"
  - name: "t/IPC-Run3-ProfLogger.t"
    description: "ProfLogger模块测试"
  - name: "t/IPC-Run3-ProfLogReader.t"
    description: "ProfLogReader模块测试"
  - name: "t/IPC-Run3-ProfPP.t"
    description: "ProfPP模块测试"
  - name: "t/IPC-Run3-ProfReporter.t"
    description: "ProfReporter模块测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ipc_run3.sh
    description: "模块加载、版本号验证、stdout捕获、stdin管道、stderr捕获"
    command: "bash test_ipc_run3.sh"

# 测试断言总数（5项功能验证 + 69个上游测试）
assertion_count: 74
