# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.17-r14"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
