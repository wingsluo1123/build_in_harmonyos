  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AN/ANDYA/IPC-ShareLite-0.17.tar.gz"

  # 源码校验和
  sha256: "14d406b91da96d6521d0d1a82d22a306274765226b86b0a56e7ffddcf96ae7bf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
