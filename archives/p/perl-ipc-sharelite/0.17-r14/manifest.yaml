# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块构建系统为 ExtUtils::MakeMaker (Makefile.PL), 非 autotools"
  - "IPC::ShareLite 包含 C 代码 (sharestuff.c + ShareLite.xs) 实现 SysV IPC 共享内存和信号量"
  - "使用 /data/service/hnp/bin/clang 编译器时无需额外 musl 头文件/库路径补丁"
  - "ShareLite.so 仅依赖 libc.so, 导出 boot_IPC__ShareLite 等 XS 符号"
  - "Conan basic_layout 会创建 build-release 子目录, 需用 cwd=self.source_folder"
