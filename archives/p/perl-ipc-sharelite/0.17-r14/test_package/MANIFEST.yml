# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-ipc-sharelite/0.17-r14
homepage: "https://metacpan.org/dist/IPC-ShareLite"

# 上游测试命令 (Perl Makefile.PL 测试体系)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00-load.t
    source: IPC-ShareLite-0.17/t/00-load.t
    description: "加载测试 — 验证 IPC::ShareLite 模块可被 use"
    command: "perl -Mblib t/00-load.t"
  - file: t/sharelite.t
    source: IPC-ShareLite-0.17/t/sharelite.t
    description: "核心功能测试 — 共享内存创建、读写、销毁"
    command: "perl -Mblib t/sharelite.t"
  - file: t/unicode-key.t
    source: IPC-ShareLite-0.17/t/unicode-key.t
    description: "Unicode 键测试 — 验证非 ASCII 键的共享内存操作"
    command: "perl -Mblib t/unicode-key.t"
  - file: t/pod.t
    source: IPC-ShareLite-0.17/t/pod.t
    description: "POD 文档格式测试"
    command: "perl -Mblib t/pod.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证包产物完整性 (ShareLite.so ELF + ShareLite.pm 存在性)"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
