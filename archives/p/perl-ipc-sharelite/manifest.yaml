software: perl-ipc-sharelite
display: "IPC::ShareLite"
description: "Perl module for lightweight SysV shared memory segments"
category: system

homepage: "https://metacpan.org/pod/IPC::ShareLite"
license: Artistic-1.0-Perl OR GPL-1.0-or-later

build_system: perl

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Conan recipe follows p5-compress-raw-bzip2 pattern: perl Makefile.PL + make + ELF sign"
    - "No external C library dependencies; SysV IPC is part of the system"
    - "Devel::CheckLib in inc/ checks for C compiler; CC env var set in generate()"
    - "Previous adaptation used hardcoded paths in Makefile.PL patch; conan recipe uses env vars"
    - "SysV IPC semget/semop blocked by seccomp on OHOS → SIGSYS; module loads OK but functional tests crash"
  common_dependencies:
    - perl

# 版本索引
versions:
  "0.17-r14":
    status: built
    build_date: "2026-08-07"
    notes: "Conan 适配完成，功能测试受限（seccomp 阻止 SysV IPC semget/semop）"