software: perl-json-maybexs
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.004008-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.004008-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# 测试日期（YYYY-MM-DD）
test_date: "2026-06-13"

# 构建系统类型（纯 Perl 模块）
build_system: perl-extutils-makemaker

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/JSON-MaybeXS-1.004008.tar.gz"

  # 源码校验和
  sha256: "cd3937afa78831f80a2ad5abab6c51b9e82fca4c31e5856ea208d598db5dc867"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PUREPERL_ONLY=1"

  # 编译依赖列表（格式: name/version）
  # JSON::PP is a core Perl module, included in perl/5.42.2
  dependencies:
    - perl/5.42.2

  # 编译器
  cc: clang
  cxx: clang++

  # 编译环境变量
  environment:
    PERL5LIB: ""  # Set at runtime via Conan runenv

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块使用PUREPERL_ONLY=1参数可避免XS编译问题"
  - "JSON::MaybeXS会自动检测可用后端，在鸿蒙上使用JSON::PP"
  - "JSON::PP性能比XS版本慢5-10倍，但功能完全相同"
  - "纯Perl模块无SELinux加载限制，可直接在用户目录使用"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
