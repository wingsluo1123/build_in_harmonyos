software: perl-list-compare
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.55/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.55"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# 构建系统类型（顶层字段）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/J/JK/JKEENAN/List-Compare-0.55.tar.gz"

  # 源码校验和
  sha256: "cc719479836579d52b02bc328ed80a98f679df043a99b5710ab2c191669eb837"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，使用 Makefile.PL (ExtUtils::MakeMaker) 构建，无 C 代码"
  - "Conan test_package 需设置 PERL5LIB 指向包安装路径才能加载模块"
