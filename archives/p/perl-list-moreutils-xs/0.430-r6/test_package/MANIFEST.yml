# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-list-moreutils-xs/0.430-r6
homepage: "https://metacpan.org/dist/List-MoreUtils-XS"

# 上游测试命令 (Perl Makefile.PL 测试体系)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/xs/XS.t
    source: List-MoreUtils-XS-0.430/t/xs/XS.t
    description: "上游 XS 模块编译验证测试"
    command: "perl -Mblib t/xs/XS.t"
  - file: t/xs/any.t
    source: List-MoreUtils-XS-0.430/t/xs/any.t
    description: "any() 函数功能测试"
    command: "perl -Mblib t/xs/any.t"
  - file: t/xs/all.t
    source: List-MoreUtils-XS-0.430/t/xs/all.t
    description: "all() 函数功能测试"
    command: "perl -Mblib t/xs/all.t"
  - file: t/xs/uniq.t
    source: List-MoreUtils-XS-0.430/t/xs/uniq.t
    description: "uniq() 函数功能测试"
    command: "perl -Mblib t/xs/uniq.t"
  - file: t/xs/minmax.t
    source: List-MoreUtils-XS-0.430/t/xs/minmax.t
    description: "minmax() 函数功能测试"
    command: "perl -Mblib t/xs/minmax.t"
  - file: t/xs/pairwise.t
    source: List-MoreUtils-XS-0.430/t/xs/pairwise.t
    description: "pairwise() 函数功能测试"
    command: "perl -Mblib t/xs/pairwise.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.py
    description: "消费者测试：验证 XS.so (ELF arm64) 和 XS.pm (version 0.430) 存在性"
    command: "python3 test_package.py <so_path> <pm_path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
