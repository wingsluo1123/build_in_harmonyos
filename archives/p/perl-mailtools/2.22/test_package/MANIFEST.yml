package: perl-mailtools/2.22
homepage: "https://metacpan.org/dist/MailTools"

upstream_check_command: "make test"

upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: t/extract.t
    source: MailTools-2.22/t/extract.t
    description: "Test header field extraction"
    command: "perl -Iblib/lib -Iblib/arch t/extract.t"
  - file: t/header.t
    source: MailTools-2.22/t/header.t
    description: "Test Mail::Header operations"
    command: "perl -Iblib/lib -Iblib/arch t/header.t"
  - file: t/internet.t
    source: MailTools-2.22/t/internet.t
    description: "Test Mail::Internet operations"
    command: "perl -Iblib/lib -Iblib/arch t/internet.t"
  - file: t/mailcap.t
    source: MailTools-2.22/t/mailcap.t
    description: "Test Mail::Cap operations"
    command: "perl -Iblib/lib -Iblib/arch t/mailcap.t"
  - file: t/mailer.t
    source: MailTools-2.22/t/mailer.t
    description: "Test Mail::Mailer operations"
    command: "perl -Iblib/lib -Iblib/arch t/mailer.t"
  - file: t/require.t
    source: MailTools-2.22/t/require.t
    description: "Test module loading requirements"
    command: "perl -Iblib/lib -Iblib/arch t/require.t"
  - file: t/send.t
    source: MailTools-2.22/t/send.t
    description: "Test Mail::Send operations"
    command: "perl -Iblib/lib -Iblib/arch t/send.t"

test_package_tests:
  - file: test_mailtools.sh
    description: "Consumer test: load and use Mail modules"
    command: "sh test_mailtools.sh"

assertion_count: 109
