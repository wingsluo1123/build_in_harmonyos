# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-match-simple-xs/0.002
homepage: "https://metacpan.org/release/match-simple-XS"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/01basic.t
    source: match-simple-XS-0.002/t/01basic.t
    description: "上游基础加载测试 (use_ok match::simple::XS)"
    command: "perl -Ilib t/01basic.t"
  - file: t/02simple.t
    source: match-simple-XS-0.002/t/02simple.t
    description: "上游功能测试 (undef/string/regex/coderef/arrayref/exception 匹配)"
    command: "perl -Ilib t/02simple.t"
  - file: t/03coderefs.t
    source: match-simple-XS-0.002/t/03coderefs.t
    description: "上游 coderef 匹配测试 (内存泄漏检测)"
    command: "perl -Ilib t/03coderefs.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_match_simple_xs.sh
    description: "消费者测试：加载 match::simple::XS 模块并调用 match() + is_regexp() API"
    command: "sh test_match_simple_xs.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
