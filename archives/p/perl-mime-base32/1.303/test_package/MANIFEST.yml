# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-mime-base32/1.303
homepage: "https://metacpan.org/pod/MIME::Base32"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00-base32.t
    source: MIME-Base32-1.303/t/00-base32.t
    description: "Base32 encode/decode tests"
    command: "perl -Iblib/lib -Iblib/arch t/00-base32.t"
  - file: t/01-base32hex.t
    source: MIME-Base32-1.303/t/01-base32hex.t
    description: "Base32Hex encode/decode tests"
    command: "perl -Iblib/lib -Iblib/arch t/01-base32hex.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.pl
    description: "Consumer test: load module, version check, encode/decode round-trip"
    command: "perl -Ilib test.pl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 31
