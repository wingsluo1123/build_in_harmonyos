# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-net-saml2/0.83-r0
homepage: https://metacpan.org/dist/Net-SAML2

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# make test 实际运行的测试程序
upstream_tests:
  - file: t/00-basic.t
    source: Net-SAML2-0.83.tar.gz/t/00-basic.t
    description: "基础加载测试"
    command: "perl t/00-basic.t"
  - file: t/01-create-idp.t
    source: Net-SAML2-0.83.tar.gz/t/01-create-idp.t
    description: "IdP 创建测试"
    command: "perl t/01-create-idp.t"
  - file: t/02-create-sp.t
    source: Net-SAML2-0.83.tar.gz/t/02-create-sp.t
    description: "SP 创建测试"
    command: "perl t/02-create-sp.t"
  - file: t/03-assertions.t
    source: Net-SAML2-0.83.tar.gz/t/03-assertions.t
    description: "断言处理测试"
    command: "perl t/03-assertions.t"
  - file: t/04-response.t
    source: Net-SAML2-0.83.tar.gz/t/04-response.t
