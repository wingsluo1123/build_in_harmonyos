software: perl-net-saml2
description: "SAML bindings and protocol implementation (Net::SAML2)"
homepage: "https://metacpan.org/dist/Net-SAML2"
repository: "https://github.com/perl-net-saml2/perl-Net-SAML2.git"
license: "MIT"

runtime_dependencies:
  - "perl >= 5.014"
  - "Crypt::OpenSSL::Random (XS, HNP)"
  - "Crypt::OpenSSL::Verify (XS, HNP)"
  - "Crypt::OpenSSL::X509 (XS, HNP)"
  - "Crypt::PK::RSA / CryptX (XS, HNP)"
  - "XML::LibXML (XS, HNP)"
  - "XML::Sig (XS, HNP)"
  - "XML::Enc (XS, HNP)"
  - "Net::SSLeay (XS, HNP, for LWP::Protocol::https)"

build_dependencies:
  - "perl >= 5.014"
  - "ExtUtils::MakeMaker"

versions:
  - version: "0.83-r0"
    status: published
    build_date: "2026-06-26"
    conan_reference: "perl-net-saml2/0.83-r0@ohpcd/stable"
