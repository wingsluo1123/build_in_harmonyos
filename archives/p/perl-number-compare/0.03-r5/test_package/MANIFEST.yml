# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-number-compare/0.03-r5
homepage: https://metacpan.org/dist/Number-Compare

# 上游测试命令 (Perl 模块使用 make test)
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# Number::Compare 0.03 上游测试套件 (t/*.t)
upstream_tests:
  - file: t/01_compare.t
    source: Number-Compare-0.03/t/01_compare.t
    description: "Number::Compare 基本比较功能测试"
    command: "perl -Iblib/lib -Iblib/arch t/01_compare.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_compare.sh
    description: "Number::Compare API 调用验证: new('>10') + test(15)/test(5)"
    command: "sh test_compare.sh"

# 测试断言总数 (近似值)
assertion_count: 5
