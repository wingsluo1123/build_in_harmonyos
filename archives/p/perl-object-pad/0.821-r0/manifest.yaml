software: perl-object-pad
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.821-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.821-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Object-Pad-0.821.tar.gz"

  # 源码校验和
  sha256: "b5d505f8fa162e0e6be2ae58b0f334494c4f791b3a040f2f6b89014f0484520c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Build.PL --install_base=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "XS::Parse::Keyword (XS依赖, cpan安装)"
    - "XS::Parse::Sublike (XS依赖, cpan安装)"
    - "perl 5.42.0 (系统Perl)"

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊构建参数
  build_options:
    - "CPATH=/storage/Users/currentUser/usr/local/include"
    - "LIBRARY_PATH=/storage/Users/currentUser/usr/local/lib"
    - "TMPDIR=/storage/Users/currentUser/tmp"
    - "ld.lld wrapper (过滤不支持的flag)"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 源码补丁: 0个
# Builder模块补丁: 2个 (XS::Parse::Keyword::Builder, XS::Parse::Sublike::Builder)
# - 跳过.so加载做ABI检查
# - 硬编码include路径
# 非源码补丁, 不计入patches_applied

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl Module::Build 构建系统在鸿蒙上需要ld.lld wrapper过滤不支持的编译器flag(如-fstack-protector-strong)"
  - "XS模块编译需要设置CPATH和LIBRARY_PATH环境变量指向musl头文件和库目录"
  - "Builder模块加载.so做ABI检查会失败, 需补丁Builder跳过require并硬编码include路径"
  - "SELinux HMDFS限制: 用户目录下的.so文件(hmdfs:s0)无法被hishell_hap域加载, 需安装到系统目录(/data/service/hnp, hnp_file:s0)"
  - "Object::Pad是纯XS模块, 无PurePerl fallback, 必须加载Pad.so才能使用"
  - "XS::Parse::Sublike ABI版本不匹配(库提供v4, 编译目标v3)会导致async相关测试失败, 非编译缺陷"
  - "Conan配方的package()需要从staging目录copy .so到lib/, .h到include/以通过G4产物检查"
  - "Conan 2.x中test_package应使用self.dependencies['name']而非self.deps_cpp_info['name']"
