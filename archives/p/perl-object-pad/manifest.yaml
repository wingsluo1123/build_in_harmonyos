# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-object-pad

# 软件描述
description: "simple syntax for lexical field-based objects"

# 分类
category: perl

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.821-r0"
    status: built
    build_date: "2026-06-29"
    path: archives/p/perl-object-pad/0.821-r0

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/dist/Object-Pad

# 源码仓库
repository: https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Object-Pad-0.821.tar.gz

# 许可证
license: Artistic-1.0-Perl

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl 5.42.0
  - XS::Parse::Keyword
  - XS::Parse::Sublike

# 编译依赖
build_dependencies:
  - musl (提供标准 C 库头文件)
  - clang 18.1.8 (aarch64-unknown-linux-ohos)
  - XS::Parse::Keyword (XS依赖)
  - XS::Parse::Sublike (XS依赖)
