software: perl-package-deprecationmanager
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.18-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.18-r1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/Package-DeprecationManager-0.18.tar.gz"

  # 源码校验和
  sha256: "b68d3f0ced55b7615fddbb6029b89f92a34fe0dd8c6fd6bceffc157d56834fe8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块使用 ExtUtils::MakeMaker (Makefile.PL)，conanfile.py 用 self.run() 调用 perl/make"
  - "Perl模块的 test_package 使用 VirtualRunEnv + PERL5LIB，不需要 CMake/test.c"
  - "Package::DeprecationManager 的 import 需要 -deprecations 参数，不能用 deprecate"
  - "conan配方 settings 只需 os/arch，不需要 compiler/build_type"
  - "package_info() 使用 runenv_info.append_path('PERL5LIB', ...) 而非 cpp_info.libs"
  - "纯Perl模块不受 SELinux HMDFS 限制影响（对比 perl-dbd-pg 的 XS 模块限制）"
  - "上游测试 t/basic.t 从非源码目录运行时，Carp 路径格式不匹配会导致3个测试失败（环境问题非功能缺陷）"
  - "PERL5LIB 设置时需追加而非覆盖系统已有路径（~/usr/local/lib/perl5 含 Module::Implementation 等）"
  - "perl-dbd-pg 编译经验（CRT缺失、SELinux限制）对纯Perl模块不适用，但测试报告格式可复用"
