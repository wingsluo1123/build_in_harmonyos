# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-perlio-utf8_strict/0.010
homepage: "https://metacpan.org/dist/PerlIO-utf8_strict"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/utf8_strict.t
    source: perl-perlio-utf8_strict-0.010/t/utf8_strict.t
    description: "上游 Perl 测试套件，测试 UTF-8 编码/解码、无效序列拒绝等"
    command: "perl -Ilib -MTest::More -e '1' && make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_utf8_strict.sh
    description: "消费者测试：验证 .so/.pm 存在并测试 UTF-8 IO 功能"
    command: "sh test_utf8_strict.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
