# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-set-object/1.43-r0
homepage: "https://metacpan.org/dist/Set-Object"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
# 注: 鸿蒙平台 SELinux HMDFS 限制导致 make test 无法加载 Object.so
# 测试在模块安装到 /data/service/hnp/ 后可正常运行
upstream_tests:
  - file: t/object/insert.t
    source: Set-Object-1.43.tar.gz/t/object/insert.t
    description: "Set::Object insert 操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/object/insert.t"
  - file: t/object/remove.t
    source: Set-Object-1.43.tar.gz/t/object/remove.t
    description: "Set::Object remove 操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/object/remove.t"
  - file: t/object/union.t
    source: Set-Object-1.43.tar.gz/t/object/union.t
    description: "Set::Object 并集操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/object/union.t"
  - file: t/object/intersection.t
    source: Set-Object-1.43.tar.gz/t/object/intersection.t
    description: "Set::Object 交集操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/object/intersection.t"
  - file: t/object/difference.t
    source: Set-Object-1.43.tar.gz/t/object/difference.t
    description: "Set::Object 差集操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/object/difference.t"
  - file: t/object/clear.t
    source: Set-Object-1.43.tar.gz/t/object/clear.t
    description: "Set::Object clear 操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/object/clear.t"
  - file: t/object/members.t
    source: Set-Object-1.43.tar.gz/t/object/members.t
    description: "Set::Object members 操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/object/members.t"
  - file: t/object/equal.t
    source: Set-Object-1.43.tar.gz/t/object/equal.t
    description: "Set::Object 相等比较测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/object/equal.t"
  - file: t/scalar/basic.t
    source: Set-Object-1.43.tar.gz/t/scalar/basic.t
    description: "标量集合基本操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/scalar/basic.t"
  - file: t/scalar/boolean.t
    source: Set-Object-1.43.tar.gz/t/scalar/boolean.t
    description: "标量集合布尔操作测试"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/scalar/boolean.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_set_object.sh
    description: "Set::Object 功能测试: insert/remove/union/intersection 操作验证"
    command: "sh test_package/test_set_object.sh"
  - file: test_package/conanfile.py
    description: "Conan L1 测试: 包结构验证 + ELF 静态分析 + 功能测试"
    command: "conan test test_package/ perl-set-object/1.43-r0@ohpcd/stable"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 51 个 .t 文件, 每个约 5-20 个断言, 估算约 300+
assertion_count: "300+ (上游 51 个测试文件, 鸿蒙平台 SELinux 限制无法运行时验证)"
