# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-set-object

# 软件描述
description: "Perl XS module providing unordered collections (sets) of Perl objects"

# 分类
category: perl

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "1.43-r0"
    status: built
    build_date: "2026-07-01"
    path: archives/p/perl-set-object/1.43-r0

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/dist/Set-Object

# 源码仓库
repository: https://github.com/rurban/Set-Object

# 许可证
license: Artistic-2.0

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl

# 编译依赖
build_dependencies:
  - perl (提供 ExtUtils::MakeMaker 和 Perl 头文件)
