source:
  url: "https://codeload.github.com/sib-swiss/pftools3/tar.gz/refs/tags/v3.2.12"
  sha256: "1de33d6444015942afa690d54a103ad5a3d68f416fad63f247c12fa3f71a550c"
  tar_format: tar.gz
  extra_sources:
    - name: sse2neon.h
      url: "https://raw.githubusercontent.com/DLTcollab/sse2neon/v1.9.1/sse2neon.h"
