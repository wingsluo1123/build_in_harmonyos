dependencies:
  required:
    - pcre2/10.47
    - libfile-slurp-perl/9999.32
  optional: []
  tool_requires:
    - flang-ohos/20.1.0

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - -DUSE_PCRE2=ON
    - -DUSE_AFFINITY=OFF   # musl 不定义 __USE_GNU（INSTALL 记载的官方构型）
    - -DUSE_RPATH=OFF      # rpath 交给 conan
    - -DCMAKE_C_FLAGS=-ffp-contract=off   # AArch64 FMA 收缩会使分数与 x86 参考差 1 ULP

