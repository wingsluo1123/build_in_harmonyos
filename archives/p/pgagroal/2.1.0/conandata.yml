sources:
  "2.1.0":
    url: "https://github.com/pgagroal/pgagroal/releases/download/2.1.0/pgagroal-2.1.0.tar.gz"
    sha256: "728b93154092b9961eb1c59012210ad5fdfbe418aabb650221e1b31d355e6c09"
patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "0001 skip the manual pages instead of failing when rst2man is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    patch_description: "0002 add opt-in PGAGROAL_ALLOW_STATIC_DEPS for dependencies shipped as static libraries only"
    patch_type: "portability"
  - patch_file: "patches/0003-src-libpgagroal-ev.c.patch"
    patch_description: "0003 drop the explicit zero initializer of the _Atomic signal arrays that clang 15 rejects"
    patch_type: "portability"
  - patch_file: "patches/0004-src-libpgagroal-utils.c-src-admin.c.patch"
    patch_description: "0004 fall back from the glibc-only secure_getenv to getenv on other libcs"
    patch_type: "portability"
