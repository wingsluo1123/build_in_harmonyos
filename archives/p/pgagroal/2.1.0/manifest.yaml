software: pgagroal
version: "2.1.0"
status: built
build_date: "2026-10-16"
build_system: cmake

source:
  url: "https://github.com/pgagroal/pgagroal/releases/download/2.1.0/pgagroal-2.1.0.tar.gz"
  sha256: "728b93154092b9961eb1c59012210ad5fdfbe418aabb650221e1b31d355e6c09"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DDOCS=OFF（配方 tc.variables[\"DOCS\"]=False）"
    - "-DPGAGROAL_ALLOW_STATIC_DEPS=ON（配方 cache_variables 注入）"
    - "-DTHREAD_INCLUDE_DIR / -DTHREAD_LIBRARY：由配方运行时探测 OHOS sysroot 的 pthread.h 与 libpthread.a 后写入"
    - "-DHAVE_LINUX=1：经 tc.extra_cflags 追加（OHOS 无 BSD sys/event.h，须走上游 epoll 分支）"
  dependencies:
    - bzip2/1.0.8.2
    - lz4/1.10.0.3
    - openssl/3.5.8.1
    - zlib/1.3.2.1
    - zstd/1.5.6
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-CMakeLists.txt.patch"
  - "0003-src-libpgagroal-ev.c.patch"
  - "0004-src-libpgagroal-utils.c-src-admin.c.patch"

knowledge_gained:
  - "pgagroal 2.1.0 自带 epoll 事件循环（src/libpgagroal/ev.c），不依赖 libev，也无需 libssh"
  - "CMake 硬依赖 zlib/bzip2/zstd/lz4/OpenSSL/rst2man/pthread；rst2man 缺失时上游直接 FATAL，而 doc/ 侧已按 RST2MAN_FOUND 守卫，只需放开顶层判据"
  - "liburing/libatomic/systemd 只在 CMAKE_SYSTEM_NAME==Linux 分支内探测，OHOS 上自动跳过，因此无需 io_uring 支持"
  - "pgagroal_require_shared_libs() 拒绝仅提供静态库的依赖；制品仓中 zlib/bzip2/lz4/OpenSSL 只有 PIC 静态 .a，需要显式开关放行"
  - "Clang 下上游无条件开启 LLVM 覆盖率插桩（-fprofile-instr-generate -O0）；OHOS SDK 自带 aarch64-linux-ohos/libclang_rt.profile.a，可直接链接"
  - "上游测试套件需 docker/podman 起 PostgreSQL 容器；release 资产不含 test/（CPACK 忽略），OHOS worker 亦无容器运行时"
  - "上游 MCTF 套件（10 模块 / 96 用例）可在 OHOS 上真实执行：需可写 TMPDIR（/tmp 是只读 erofs，test_aes.c 写死 /tmp）、可 chmod 的 HOME（~/.pgagroal 须 700）、预建 <project>/log（tsclient 的 PGBENCH_LOG_FILE_TRAIL），实测 96/96 通过"
