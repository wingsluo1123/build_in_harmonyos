knowledge_gained:
  - "pgexporter uses CMake build system"
  - "secure_getenv unavailable on HarmonyOS/musl, need getenv fallback"
  - "HarmonyOS only has static .a versions for many dependency libs"
  - "pthread found in OHOS SDK sysroot, not standard paths"
  - "Test subdir needs skipping on HarmonyOS (ev.h include path missing)"
  - "rst2man not always available in CI, make it optional"
  - "Static build avoids fPIC issues with static-only system deps"
  - "version() function exits with code 1, fix to exit(0) for --version"

