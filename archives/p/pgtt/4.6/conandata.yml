# conandata.yml — pgtt 4.6
# 单一事实源：源码 URL + SHA256 + 补丁。
# conanfile.py 通过 self.conan_data["sources"] 读取，apply_conandata_patches() 应用补丁。
#
# 源码 = 上游 annotated tag v4.6 的官方 GitHub 归档
#   tag v4.6 -> commit c8730243ca993de96122641452a138f284ef0437（扩展内部版本 4.6.0）
# R39/PF7：本文件只允许出现 sources.url 这一个 URL；镜像回退由 CI 自动处理，
# 注释/描述字段不得写任何 http(s) 地址（否则会被 CI 预下载正则改写，污染真实源）。
sources:
  url: "https://github.com/darold/pgtt/archive/refs/tags/v4.6.tar.gz"
  sha256: "9d70ebaa0ef091990dd6ec1446e0e7b894507718249cbf07eaaedf384b66bcbe"

# 无补丁：pgtt 4.6 在 OHOS (aarch64, clang 15) 上零源码修改即可编译，
# 上游 20 个 pg_regress 用例全部通过（见 notes.md）。保留空映射以便后续增量维护。
patches: {}
