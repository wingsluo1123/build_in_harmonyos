software: phast
version: "1.8"
status: built
build_date: "2026-10-14"
build_system: makefile

source:
  url: "https://github.com/CshlSiepelLab/phast/archive/refs/tags/v1.8.tar.gz"
  sha256: "cf940869102cff48bdfbfab6b23c6515eae743959649903174c7e24f21d26b50"
  tar_format: tar.gz

build:
  system: makefile
  make_flags:
    - "-j1（各子包 Makefile 用 ar rs 增量更新 libphast.a，并行 make 并发执行 ar 导致归档损坏）"
  dependencies:
    - lapack/3.12.1（含参考 BLAS + flang FortranRuntime/FortranDecimal）
  cc: clang（tools.build:compiler_executables 注入，R33）

patches_applied:
  - "0001-external-libs-reference-lapack-types.patch"
  - "0002-make-include-no-clapack-autodetect.patch"
  - "0003-src-makefile-skip-manpages.patch"
  - "0004-munge-help-sh-shebang.patch"

knowledge_gained:
  - "上游 version 文件自 v1.7 起未 bump（仍写 v1.6），需以 release 修复特征核对 tag 内容真伪"
  - "命令行 make 变量会抑制 makefile 内同名变量的 = 与 +=，覆盖 CFLAGS 时必须补全上游全部追加项（-I/-D/-fno-strict-aliasing）；最优解是只覆盖 CC/LIBS/LIBPATH、不覆盖 CFLAGS"
  - "CLAPACK integer=f2c long int(Linux 8 字节) 与参考 LAPACK INTEGER(i32) 不兼容，按指针传参会内存越界，改参考 LAPACK 时必须改 typedef"
  - "上游自带测试参考文件（test/jc.mod、test/cons_correct.dat 等）与现行源码约定不一致（jc.mod 0.25=旧 1/n 约定 vs 源码 tm_set_JC69_matrix 1/(n-1)=1/3；cons_correct.dat 为旧版「位置<TAB>分数」输出格式而现行版输出 fixedStep wig），上游 master 同样未更新，跨平台跑上游未修改代码即字节级失败，需归一化数值对比而非字节级 diff"
  - "OHOS 无 /bin/bash：上游脚本 shebang #!/bin/bash（munge-help.sh）构建期即 Error 126，需补丁改 /bin/sh"

verified:
  device: "HarmonyOS PC（ohos-aarch64 profile, clang 15, os=OHOS 6.0）"
  date: "2026-10-14"
  evidence: "conan-verify PASS（G0–G3 全 PASS）；conan create 端到端 exit=0；test_package 消费者用例 5/5 PASS（mat_diagonalize 运行期真实调用 LAPACK dgeev_，特征值 {3,1} 精确复现）；W3 本地 CI 模拟 100%（L0–L5 全 pass）；上游测试 30 项断言：msa_view 12/12 字节级通过，phyloFit/phastCons 差异全部归因上游参考文件过时与跨 LAPACK 末位噪声（≤0.025），0 项功能性失败"
