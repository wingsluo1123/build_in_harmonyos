# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: phast/1.8
homepage: "https://github.com/CshlSiepelLab/phast"

# 上游测试入口：test/Makefile（make msa_view / phyloFit / phastCons 三个
# 目标，共 30 项 diff 断言）。适配后已在鸿蒙真机以产物 bin/ 加入 PATH
# 实际执行，逐项结果见本包 reports/upstream-test-report.md。
# test_package 消费者用例不能替代上游测试统计。
upstream_check_command: "make -C test msa_view phyloFit phastCons"
upstream_test_in_build: true
upstream_test_command: "make -C test msa_view phyloFit phastCons"

# 补全测试说明：test_package 新增鸿蒙消费者用例（R34 + 鸿蒙测试可行性）
supplementary_tests:
  - file: test_package/test.c
    count: 5
    description: >-
      1) mat_diagonalize 返回 0（运行期实际调用 LAPACK dgeev_）；
      2) 特征值虚部为 0；3) 特征值 3.0 存在；4) 特征值 1.0 存在；
      5) 验证消费者链接 phast::phast → 传递 lapack/3.12.1 →
      flang FortranRuntime 全链在 OHOS 真机可执行。
