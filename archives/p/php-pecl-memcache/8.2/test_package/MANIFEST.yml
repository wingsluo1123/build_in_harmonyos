# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: php-pecl-memcache/8.2
homepage: "https://pecl.php.net/package/memcache"

# 上游测试命令 (PHP phpt 测试, 需要 memcached 服务运行)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (PHP phpt 格式, 需要 memcached 服务)
upstream_tests:
  - file: tests/memcache.phpt
    source: php-pecl-memcache-8.2/tests/memcache.phpt
    description: "Memcache connection and basic operations test"
    command: "php -d extension=memcache.so tests/memcache.phpt"
  - file: tests/memcache_pool.phpt
    source: php-pecl-memcache-8.2/tests/memcache_pool.phpt
    description: "Memcache pool functionality test"
    command: "php -d extension=memcache.so tests/memcache_pool.phpt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_memcache.sh
    description: "ELF binary and symbol verification smoke test"
    command: "sh test_memcache.sh memcache.so"
  - file: conanfile.py
    description: "Conan L1 test: verify .so exists, ELF format, symbols, zlib NEEDED"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
