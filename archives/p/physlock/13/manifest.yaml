# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "physlock 是单一 C 可执行文件 + 手写 GNU Makefile；Linux/OHOS 下第三方依赖与上游默认构型一致：linux-pam(-lpam -lpam_misc) + systemd/libsystemd(-lsystemd) (knowledge_ref: archives/p/physlock/13/notes.md)"
  - "OHOS 无 cc/gcc（cc: not found），而 Makefile 的 $(CC) 默认 cc → 必须显式传 CC=clang（从 tools.build:compiler_executables 获取） (knowledge_ref: knowledge/graph/E001.kv)"
  - "Makefile 的 HAVE_SYSTEMD 是 make 变量、从不 -D 传入编译器，session.c 的 #if HAVE_SYSTEMD 代码路径不参与编译；-lsystemd 只出现在链接行（仍要求 libsystemd.so 存在） (knowledge_ref: archives/p/physlock/13/notes.md)"
  - "上游 install 目标硬编码 install -m 4755 -o root -g root（README 注明 install 需 root），非 root/沙箱无法执行 → 配方只 make，打包期手工落 bin/ 与 man1 (knowledge_ref: knowledge/graph/E079.kv)"
  - "OHOS clang 驱动默认给可执行文件加 .codesign 段（自签名），无需额外 binary-sign-tool 步骤 (knowledge_ref: knowledge/graph/E077.kv)"
