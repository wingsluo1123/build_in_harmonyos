# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1"

# 软件名
software: "picocom"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/npat-efault/picocom/archive/refs/tags/3.1.tar.gz"

  # 源码校验和
  sha256: "e6761ca932ffc6d09bd6b11ff018bdaf70b287ce518b3282d29e0270e88420bb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "CFLAGS=-Wall -g -fPIC -O2"
    - "LDFLAGS=-g"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "picocom is a pure Makefile project with no configure script and no install target"
  - "Binary must be manually copied to bin/ during packaging"
  - "picocom has embedded linenoise library (linenoise-1.0/)"
  - "No test suite upstream; smoke test via --help flag"
