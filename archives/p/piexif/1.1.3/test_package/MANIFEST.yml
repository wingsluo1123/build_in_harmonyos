# test_package/MANIFEST.yml — piexif 1.1.3
# 上游官方测试声明文件（build_and_test.sh L0e 强制要求）
package: piexif/1.1.3
homepage: "https://github.com/hMatoba/Piexif"

upstream_check_command: "python3 tests/s_test.py"

# conanfile.py build() 方法中已集成上游全量测试（真实执行）
upstream_test_in_build: true
upstream_test_command: "python3 tests/s_test.py"

upstream_tests:
  - file: "tests/s_test.py"
    source: "Piexif-1.1.3/tests/s_test.py"
    description: >-
      piexif upstream unittest suite — 55 cases (ExifTests 32 / UTests 7 /
      HelperTests 9 / WebpTests 7). build() runs it with ohpcd pillow/10.4.0
      (tool_requires, test-only) so PIL.Image._getexif() cross-checks work;
      55/55 pass on OHOS with patches/0001 (Pillow>=6 IFDRational
      normalization in the test comparison helper).
    command: "python3 tests/s_test.py"

test_package_tests:
  - file: "test_piexif.py"
    description: >-
      consumer regression (鸿蒙特有测试): import from the installed
      site-packages, dump/load round-trip, insert/remove on a JPEG, negative
      controls (non-exif insert payload, garbage segment split, missing file).
    command: "python3 test_piexif.py"

# 用例/断言计数: 上游 55 用例（build() 全量真实执行）+ 消费者回归 12 断言
assertion_count: 67
