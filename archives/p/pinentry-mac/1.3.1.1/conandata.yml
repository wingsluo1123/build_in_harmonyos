# conandata.yml — pinentry-mac 1.3.1.1
# pinentry: GnuPG 的 PIN/passphrase 输入对话框集合（提供 curses / tty 前端）
# 上游仓库：https://github.com/GPGTools/pinentry
#
# 说明：GPGTools/pinentry 与 gnupg.org 的 pinentry 是**同一棵源码树**，
# 只是发布 tag 不同。本文件用 GitHub tag tarball（v1.3.1.1）。
# 该 tarball **不含预生成的 configure 脚本**（只有 configure.ac），
# 因此 conanfile.py 的 source() 里必须先跑 `autoreconf -fi`。

sources:
  url: "https://github.com/GPGTools/pinentry/archive/refs/tags/v1.3.1.1.tar.gz"
  # 实测下载 767631 字节，sha256 如下（curl + sha256sum 实测）
  sha256: "ba929dd1c57b102fbfca12bc2d784be441498e7c82ee97a1231cbe03dcda7ae9"

# ★2026-10-10★ 这里**故意不再声明 patches**。原两份上下文补丁按"tarball 里的旧版 config.guess/sub"写，
#   但 source() 的 `autoreconf -fi` 会用构建机 automake 自带的副本覆盖 build-aux/（实测字节相同），
#   于是补丁能否套上取决于**构建机的 automake 版本** —— 在鸿蒙 PC(automake 1.19) 上直接失败。
#   HarmonyOS 支持改由 conanfile.py 的 _ensure_harmonyos_config() 在 autoreconf 之后做
#   **带守卫的锚行插入**（已有则跳过，幂等；与 automake 版本解耦）。patches/ 目录保留仅作历史参考。
