# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pinentry-mac/1.3.1.1
homepage: "https://github.com/GPGTools/pinentry"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# pinentry-mac 上游无 make check 测试目标（实测 tarball 内 test 条目 0 条）
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 pinentry-curses 和 pinentry-tty 二进制可执行并报告正确版本号"
    command: "pinentry-curses --version && pinentry-tty --version"

# 测试断言总数 (近似值, 用于质量评估)
# L1 版本断言 2 项 + L2 Assuan 接口断言 16 项 = 18 项
assertion_count: 18
