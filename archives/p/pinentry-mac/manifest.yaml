software: pinentry-mac
description: GnuPG PIN输入程序（GPGTools/pinentry 源树；pinentry-curses + pinentry-tty 前端）
category: security
website: https://github.com/GPGTools/pinentry

# 版本索引
versions:
  - version: "1.3.1.1"
    status: built
    build_date: "2026-10-05"
    notes: >-
      GPGTools/pinentry v1.3.1.1 与 gnupg.org 的 pinentry 是同一棵源码树；
      macosx/ 子目录受 configure.ac 的 *-apple-darwin* host 闸门排除（预期行为），
      curses/ 与 tty/ 两个纯 C 前端在 OHOS aarch64 上正常构建。
      产出 pinentry-curses 与 pinentry-tty，均为 ELF64 AArch64。