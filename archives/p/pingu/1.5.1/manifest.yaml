knowledge_gained:
  - "musl 派生 sysroot 的 <linux/socket.h> 不屏蔽内核 UAPI struct sockaddr_storage，与 libc 头同 TU 报重定义（ref: E1604）"
  - "手写 configure 用 'pkg-config --exist libev' 探测（正确选项 --exists），探测恒失败并回退 -lev；libev 在非默认前缀时配置失败（ref: E568）"
  - "configure 把探测程序写到 $TMPDIR；OpenHarmony 上 /tmp 只读，必须把 TMPDIR 指到可写目录（ref: E002）"
  - "OHOS 用户态没有 coreutils install(1)，上游 'make install' 报 127；应在 package() 直接拷贝产物（ref: E108）"

