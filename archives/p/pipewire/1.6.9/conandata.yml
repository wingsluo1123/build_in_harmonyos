# conandata.yml — pipewire 1.6.9

sources:
  url: "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.9/pipewire-1.6.9.tar.gz"
  sha256: "dbc3624cf71215c26a22fc98f6f71f7b8599f5f6b415eab4a5c90ca96c170c7c"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "meson.build: capability checks for pthread_cancel/pthread_setaffinity_np/gettext"
    patch_type: "portability"
  - patch_file: "patches/0002-spa-plugins-support-logger.c.patch"
    patch_description: "logger.c: explicit fflush for musl line buffering"
    patch_type: "portability"
  - patch_file: "patches/0003-src-pipewire-data-loop.c.patch"
    patch_description: "data-loop.c: include config.h and use a signal-free wake-and-stop path when pthread_cancel is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0004-src-pipewire-mem.c.patch"
    patch_description: "mem.c: on EACCES/EPERM derive the memfd size with lseek (covers imported blocks with no local size), else fall back to the block size"
    patch_type: "portability"
  - patch_file: "patches/0005-src-pipewire-pipewire.c.patch"
    patch_description: "pipewire.c: gettext fallbacks, bindtextdomain and bind_textdomain_codeset guarded by their own capability macros"
    patch_type: "portability"
  - patch_file: "patches/0006-src-pipewire-thread.c.patch"
    patch_description: "thread.c: include config.h and guard pthread_setaffinity_np"
    patch_type: "portability"
  - patch_file: "patches/0007-test-test-config.c.patch"
    patch_description: "test-config.c: rindex -> strrchr"
    patch_type: "portability"
  - patch_file: "patches/0008-test-test-spa-json.c.patch"
    patch_description: "test-spa-json.c: explicit fflush around open_memstream"
    patch_type: "portability"
  - patch_file: "patches/0009-daemon-no-symlink-aliases.patch"
    patch_description: "meson: materialise daemon aliases as copies, HMDFS rejects symlinks; install script honours the bindir option"
    patch_type: "portability"
  - patch_file: "patches/0010-libpipewire-no-versioned-soname.patch"
    patch_description: "meson: install libpipewire as a single unversioned shared object"
    patch_type: "portability"
  - patch_file: "patches/0011-test-test-loop.c.patch"
    patch_description: "test-loop.c: skip pthread_cancel-dependent case when the platform lacks pthread_cancel"
    patch_type: "portability"
