knowledge_gained:
  - "OHOS libc (musl) 无 pthread_cancel：cancel 分支改用 pw_loop_invoke(do_stop) 唤醒停止，无信号、线程正常 cleanup（信号处理器 pthread_exit 在 musl 上间歇崩溃）"
  - "OHOS libc 无 pthread_setaffinity_np：能力探测 HAVE_* 守卫后忽略亲和性"
  - "OHOS libc 无 gettext 实现：dgettext/dngettext 回退为 msgid"
  - "OHOS memfd 拒绝 fstat：mem.c 回退 block size 做边界校验"
  - "musl open_memstream 需显式 fflush 才同步外部缓冲"
  - "HMDFS 拒绝 symlink 创建（EPERM）：守护进程别名改用 cp 物化，install_symlink 改为安装脚本复制"
  - "HMDFS 拒绝 symlink 创建（EPERM）：libpipewire 去掉 version/soversion，安装单文件无版本 SONAME"
  - "OHOS 对已签名 ELF 做完整性校验：meson 安装期改写 rpath 后 execve 返回 EPERM；package() 用构建树原始产物覆盖安装副本恢复可执行性"
  - "HMDFS 拒绝 AF_UNIX bind(2)：守护进程测试需探测可绑定目录（/data/storage/el2/base），否则改用 pw_context_connect_self() 进程内消费者流程"
  - "无 pthread_cancel 时上游 cancel_thread_while_dispatching 用例无法中断阻塞在 dispatch 的线程：按上游 ABI 用例同款写法在 HAVE_PTHREAD_CANCEL 缺失时返回 PWTEST_SKIP"

