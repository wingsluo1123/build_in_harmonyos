    - "packaging/26.2"
    - "platformdirs/4.10.0"
    - "userpath/1.9.2"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
