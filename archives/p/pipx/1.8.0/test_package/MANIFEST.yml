# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pipx/1.8.0
homepage: "https://pipx.pipa.io"

# pipx is a pure Python package, no C/C++ tests
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# pipx has no C/C++ upstream tests
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 pipx --version 输出正确版本号"
    command: "pipx --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
