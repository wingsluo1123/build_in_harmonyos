version: "0.37.3"
software: pizzly
conan_ref: "pizzly/0.37.3"
status: built
build_date: "2026-10-15"
build_system: cmake

source:
  url: "https://github.com/pmelsted/pizzly/archive/refs/tags/v0.37.3.tar.gz"
  sha256: "adfb221ed079aa60760e44af6baa300ad0fbdc92b407f7576cc7eab72ec6b310"
  tar_format: tar.gz
  upstream_tag: "v0.37.3"
  upstream_commit: "96368ca642ed72297ac31e99d0fd77227dd23419"

build:
  system: cmake
  # 只有 CMake cache 变量走 -D 命令行；C++ 标准与 SeqAn 异步 IO 能力分别经 settings 与
  # preprocessor_definitions 生效（见 conanfile.py 的 configure()/generate()）。
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5  # generate() cache_variables"
    - "settings.compiler.cppstd=14  # configure() 覆盖 profile 默认 17"
    - "preprocessor_definitions SEQAN_ASYNC_IO=0  # generate() 生成 -DSEQAN_ASYNC_IO=0"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  upstream:
    framework: "无（上游无自动化测试注册）"
    total: 0
    passed: 0
    failed: 0
    skipped: 0
    note: |
      CMakeLists.txt 中不存在 enable_testing()/add_test()，仓库内没有 CTest/gtest/
      Catch2 等测试框架注册，也没有 test 目标。唯一的 test/ 目录是依赖外部 kallisto
      的 snakemake 示例流水线（test/Snakefile 的 rule all 需要 kallisto 与网络），
      不是自动化测试套件。清点口径与证据见 notes.md「上游测试清点」节。
  consumer:
    type: test_package
    total: 2
    passed: 2
    failed: 0
    note: |
      test_package/ 在鸿蒙 PC 目标机（OHOS/aarch64 原生构建）运行两个消费者端到端用例：
      E2E-PIZZLY-001 以真实 kallisto 0.52.0 --fusion 输出为输入跑完整融合检出流程并核对
      output.json / output.fusions.fasta 业务结果；E2E-PIZZLY-002 验证 GTF 注释缓存的
      生成与复用（二次运行命中缓存且结果一致）。逐项证据见 notes.md。

knowledge_gained:
  - "上游 cmake_minimum_required(VERSION 3.0.0) 在 CMake 4.x 下硬失败，需 CMAKE_POLICY_VERSION_MINIMUM=3.5 保留上游声明"
  - "内置 SeqAn 2.2.0 为 C++14 代码；profile 默认 cppstd=17 时 libc++ 的 std::empty(C++17) 与 seqan::empty 在 seqan/arg_parse/*.h 产生二义性，须固定 cppstd=14"
  - "OHOS <aio.h> 只有 struct aiocb 与 AIO_*/LIO_* 常量、不含任何 aio_* 函数，SeqAn 的 __has_include(<aio.h>) 探针假阳性，须 SEQAN_ASYNC_IO=0"
  - "pizzly v0.37.3 的上游 CMakeLists 没有 install() 规则（该行是上游 master 才补的），cmake.install() 会产出空包，须由配方从构建目录安装 bin/pizzly"
  - "只用 CMakeToolchain（不引入 CMakeDeps）时，CMakeToolchain 注入的 CMAKE_LIBRARY_PATH/CMAKE_INCLUDE_PATH 让上游 find_package(ZLIB) 走 FindZLIB 模块模式即可命中 Conan 的 libz.a，无需额外补丁"
  - "OHOS 安装态 ELF 需 binary-sign-tool -selfSign 1 自签名后才可执行"

# 本包无补丁集（conandata.yml 为 `patches: {}`）。
# refresh-patch 在探索阶段曾生成过 0001-CMakeLists.txt.patch，后因改用「只上 CMakeToolchain、
# 不引入 CMakeDeps」的形态而撤销（详见 notes.md「遇到的问题」第 4 条的补充说明）。
# 此处同步清空 refresh-patch 的历史产物段，避免陈旧读数与 patches_applied: [] 互相矛盾。
patch_generation:
  method: none
  patches_count: 0

patch_classification: []
