# 测试断言总数：test_pizzly.sh 中实际执行的断言
#   fixture 完整性: 2（两个 .b64 解码后 sha256 校验）
#   E2E-PIZZLY-001: 1(version 冒烟，见下注) + 2(GTF/保留数 grep) + 2(产物存在)
#                   + 5(JSON 顶层/9 对/EML4-ALK/ID/paircount) + 1(transcripts 数)
#                   + 1(自洽循环断言按记录计) + 1(146 条 fasta) + 1(json↔fasta 一致)
#                   + 1(序列长度核对) = 15
#   E2E-PIZZLY-002: 1(cache 非空) + 3(grep) + 2(sha256/内容一致) = 6
#   合计 2 + 15 + 6 = 23
# 注：`--version` 冒烟行只计入断言数，不计入 E2E 用例数（用例数为 2）。
assertion_count: 23
