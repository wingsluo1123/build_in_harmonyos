    bytes: 199238
    sha256: "aa1cc960ebc2d96c1edf4d9f6a6d86adbf2ccad7ad1c9d1166390f47644094dd"
    source: >-
      kallisto/0.52.0（制品仓 ohpcd 预编译包）执行
      `kallisto index -k 31 -i transcripts.kidx transcripts.fasta.gz` 后
      `kallisto quant -i transcripts.kidx -o kallisto_out --fusion reads_1.fastq.gz reads_2.fastq.gz`，
      取 kallisto_out/fusion.txt；输入 reads/transcripts 取自上游 tag v0.37.3 的 test/ 目录，
      与上游 test/Snakefile 的 rule index / rule kallisto_quant 参数一致。
  - file: fixtures/transcripts.gtf.gz.b64
