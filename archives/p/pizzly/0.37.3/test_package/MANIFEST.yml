package: pizzly/0.37.3
homepage: "https://github.com/pmelsted/pizzly"

# ── 上游测试清点（R51 第一步）────────────────────────────────────────────────
# 清点结论：上游**没有任何自动化测试注册**。
#   * CMakeLists.txt 中不存在 enable_testing() / add_test() / ctest / gtest / Catch2，
#     也没有 test 目标（`grep -inE "enable_testing|add_test|ctest|gtest|catch|boost" CMakeLists.txt`
#     无输出）。
#   * 源码树中唯一的可执行入口是 main.cpp（`grep -rlE "int main" --include=*.cpp` 仅此一个）。
#   * 唯一的 test/ 目录是 snakemake 示例流水线（test/Snakefile），它依赖**外部** kallisto
#     程序（不是本仓库构建产物）与 test/reads_*.fastq.gz，用于人工验证 kallisto+pizzly
#     联动，不构成可自动化执行的测试套件，也不注册任何用例数。
# 因此上游测试用例数 = 0（不是"未找到"，是确实没有可计数的自动化用例）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── 消费者端到端用例（鸿蒙 PC 目标机实跑）──────────────────────────────────
test_package_tests:
  - file: test_pizzly.sh
    id: "E2E-PIZZLY-001"
    description: >-
      融合基因检出主流程：以真实 kallisto 0.52.0 `quant --fusion` 输出（fixtures/fusion.txt，
      由上游 test/reads_*.fastq.gz 与 test/transcripts.fasta.gz 生成）为输入，配合上游自带的
      参考 GTF/FASTA，执行候选融合过滤 → 断点级转录本组装 → 丰度定量，断言
      「Number of kept records 308 out of 366」、output.json 中 9 对融合基因（含真实致癌融合
      EML4-ALK，paircount=4）、146 条组装融合转录本，且 output.fusions.fasta 的 146 条记录与
      JSON 的 fasta_record 一一对应、序列长度等于记录的区间跨度。
    command: "bash test_pizzly.sh (E2E-PIZZLY-001 段)"
  - file: test_pizzly.sh
    id: "E2E-PIZZLY-002"
    description: >-
      GTF 注释缓存生成与复用：首次运行生成 cache.txt；二次运行必须命中缓存分支
      （stderr 出现「Opening cached file」与「loaded 36 genes and 289 transcripts」），
      且 output.json 的 sha256 与 output.fusions.fasta 与冷启动运行完全一致。
    command: "bash test_pizzly.sh (E2E-PIZZLY-002 段)"

# ── fixtures 来源与完整性 ──────────────────────────────────────────────────
fixtures:
