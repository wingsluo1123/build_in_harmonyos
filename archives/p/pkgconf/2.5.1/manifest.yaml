software: pkgconf
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5.1"

# 构建系统类型（顶层字段，用于 verify-build 检查）
build_system: meson

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pkgconf/pkgconf/archive/refs/tags/pkgconf-2.5.1.tar.gz"

  # 源码校验和
  sha256: "79721badcad1987dead9c3609eb4877ab9b58821c06bdacb824f2c8897c11f2a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0004-meson-force-bsd-funcs.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "meson has_header_symbol 在交叉编译时对 strlcpy/strlcat/strndup 检测失败，需通过 patch 强制设置 HAVE_DECL 宏"
  - "CI profile 编译器路径可能指向开发环境不存在的路径，需在 build() 中动态修复"
  - "kyua/atf 测试框架在 OHOS 不可用，需通过 Conan test_package 补充测试"

patch_generation:
  method: per-file-difflib
