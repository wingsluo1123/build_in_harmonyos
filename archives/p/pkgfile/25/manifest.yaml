build:
  system: meson
  meson_options:
    - "cpp_std=c++20（configure() 覆盖 CI profile 的 compiler.cppstd=17）"
    - "-Ddaemon=false（补丁 0001 新增；OHOS 无 systemd/libsystemd）"
    - "-Dman_pages=false（补丁 0002 新增；OHOS 无 perl/pod2man）"
    - "default_options 中 prefix=/usr 由 Conan MesonToolchain 的 --prefix 覆盖为包目录"
    - "为全部 host 依赖补 -I（configure 期 get_define 头宏探测）"
    - "为全部 host 依赖补 -L/-Wl,-rpath,<libdir>（MesonToolchain 只写链接期 -rpath-link）"
    - "tc.binaries ar/as/strip/nm/ranlib 与 tc.pkgconfig 固定为绝对路径（OHOS 无系统 pkg-config 且 posix_spawn 不搜索 PATH）"
  dependencies:
    - "pcre/8.45（上游 dependency('libpcre') >= 8.30；静态；消费侧经 PkgConfigDeps.set_property 改写 .pc 名）"
    - "libarchive/3.8.7（上游 dependency('libarchive') >= 3.2.0；shared，libarchive.so.13）"
    - "curl/8.15.0.1（上游 dependency('libcurl')；shared；curl 配方已声明 pkg_config_name=libcurl）"
    - "zlib/1.3.1.1、xz/5.6.2、openssl/3.5.6.1（传递依赖）"
    - "threads（meson 内建，无需 conan 包）"
  build_requirements:
    - "meson/1.11.0、ninja/1.12.1（meson 配方 requirements() 为 pass，不代管 ninja）"
    - "pkgconf/3.0.5（上游 meson.build 把 pkg-config 作为 find_program 硬要求；包内只提供 bin/pkgconf）"
    - "gmock/1.17.0（test_requires；传递 gtest/1.17.0，仅用于上游单元测试）"
  cpp_defines:
    - "_LIBCPP_ENABLE_EXPERIMENTAL（OHOS；libc++ 15004 默认不暴露 std::format）"
  link_flags:
    - "-lc++experimental（OHOS；std::format 运行时符号）"
  disabled_features:
    - "pkgfiled 守护进程（依赖 libsystemd sd-event；OHOS 无 systemd 生态）"
    - "man 页生成与安装（依赖 pod2man/perl）"
    - "systemd unit 安装（随守护进程一并关闭）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson-make-systemd-daemon-optional.patch：libsystemd 依赖、pkgfiled 目标与 systemd unit 安装块改为 meson 选项 daemon（默认 true）门控"
  - "0002-meson-make-man-pages-optional.patch：pod2man find_program 与两个 man 页 custom_target 改为 meson 选项 man_pages（默认 true）门控"
  - "0003-meson-make-stdcppfs-optional.patch：cpp.find_library('stdc++fs') 改 required: false，未找到时退化为空 declare_dependency()（libc++ 无 libstdc++fs）"
  - "0004-src-db-clang15-libcxx15-portability.patch：db.hh 显式字典序 operator<（libc++15 的 std::string 无 <=>，默认化 <=> 被删除导致 std::sort 无法实例化）；db.cc 花括号聚合初始化（clang 15 未实现 C++20 P0960）"
  - "0005-tests-forward-tmpdir-to-child.patch：tests/pkgfile_test.py 把运行环境的 TMPDIR/TMPPREFIX 透传给被测子进程（OHOS /tmp 只读；夹具原固定最小环境不含 TMPDIR，导致 11 个 -u 用例 rc=255）。断言与期望值零改动，/tmp 可写主机上为 no-op"

# W0 依赖发布检查（本机 conan download 实证 + 真机构建实测）
