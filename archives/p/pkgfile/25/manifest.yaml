knowledge_gained:
  - "OHOS SDK clang 15 + libc++ 15004 的 <format> 头存在但 std::format 默认不暴露：需 -D_LIBCPP_ENABLE_EXPERIMENTAL 且链接 libc++experimental.a（asyncpp 0.2.4 / libpqxx 8.0.1 同口径）；pkgfile 6 文件 44 处 std::format 真机编译链接全通过"
  - "MesonToolchain 用 compiler.cppstd 生成 machine file 的 cpp_std，其优先级高于上游 meson.build 的 default_options，因此上游写死 cpp_std=c++20 的项目在 cppstd=17 的 CI profile 下会被静默降级为 C++17，必须在 configure() 里抬到 20"
  - "OHOS 上 posix_spawn 不搜索 PATH：meson 探测静态归档器时对 llvm-ar-15/llvm-ar/ar/gar 裸名 exec 全部 ENOENT（即使 ar 在 PATH 中），凡含 static_library 的 meson 项目必须把 ar 等 binutils 以绝对路径写入 tc.binaries"
  - "上游用 compiler.get_define(..., args:['-include','x.h']) 做 configure 期头宏探测时不会带上 dependency() 的 include 路径；依赖是 conan 包时必须把其 includedirs 补进 extra_cxxflags，否则 get_define 直接报 Could not get define"
  - "ohpcd 的 pkgconf/3.0.5 包内只落了 bin/pkgconf（pkg-config 别名未生成），OHOS 又无系统 pkg-config；凡上游把 find_program('pkg-config') 当硬要求的项目都要把 tc.pkgconfig 指向包内绝对路径"
  - "meson 的 compiler.find_library() 默认 required: true；GCC 的 libstdc++fs 在 libc++ 上不存在，上游依赖它的项目在 OHOS 会配置期失败，须降级为 required: false + declare_dependency() 兜底"
  - "clang 15 未实现 C++20 P0960（括号聚合初始化）：对聚合类型 emplace_back(a,b) 会报 no matching function for call to 'construct_at'；libc++ 15 的 std::string 没有 operator<=>，含 std::string 成员的默认化 <=> 会被隐式删除，std::sort 随之无法实例化。两者都需源码级等价改写"
  - "OHOS 的 /bin/sh 是 mksh：它在启动时读取并缓存 TMPDIR，脚本内部 export TMPDIR 对 here-doc 等内部临时文件无效；且 mktemp -d（无模板）固定落只读的 /tmp。测试脚本应避免 here-doc 与无模板 mktemp，并在启动前由 test_package 注入可写 TMPDIR"
  - "Conan 的 MesonToolchain 只注入 -Wl,-rpath-link（链接期），不写运行期 rpath；CI 的 L2 smoke test 是裸执行 bin/<tool> --version（不加载 conanrun），凡产物含可执行文件且依赖里有 shared 库的 meson 配方都必须自行补 -Wl,-rpath"
  - "上游测试夹具常给被测进程构造固定最小环境（pkgfile 的 tests/pkgfile_test.py 只有 LC_TIME/LC_COLLATE/TZ/PATH）。OHOS 的 /tmp 只读时，凡是依赖 TMPDIR 的被测代码（如 pkgfile -u 的下载中转文件）都会失败；排查时应先把 TMPDIR 透传进夹具再判断是否为平台结构性不可运行。本次实测也纠正了两个误判：OHOS 上 multiprocessing(fork)/dev/shm/loopback 均可用，夹具里的 Architecture=x86_64 只是 URL 路径片段、与宿主架构无关"
  - "OHOS 上跨进程传 TMPDIR 要注意两层缓存：mksh 在启动时读取并缓存 TMPDIR（脚本内 export 对 here-doc 无效），而 GNU/Toybox 的 mktemp -d（无模板）根本不用 TMPDIR、固定落 /tmp；可移植写法是自己挑可写基目录 + mkdir"
