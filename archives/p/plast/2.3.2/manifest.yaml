  sha256: "9068b4904fa638c57e427eedd1682cd74eba0e1478f9256ecf1768bc538f08d6"
  tar_format: tar.gz
  upstream_homepage: "https://plast.inria.fr/"
  license: "AGPL-3.0-only"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  build_system: cmake

  # 由 conanfile.py generate() 注入的 CMake cache 变量
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux            # E092：os=OHOS 时 conan 映射为 CMake 不认识的 HarmonyOS"
    - "-DSIMDE_INCLUDE_DIR=<simde>/include  # SIMDe 头文件目录（SSE kernel 移植）"
    - "-DCPPUNIT_INCLUDE_DIR=<cppunit>/include  # 上游 CppUnit 单元测试"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "simde/0.8.2"       # header-only，三个 SSE kernel 的跨架构实现
    - "cppunit/1.15.1"    # test_requires：仅供 build() 内构建/运行上游 PlastLibraryTest，不进入消费者依赖图

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "0001-cmake-minimum-required.patch"
    description: "cmake_minimum_required 2.6 → 3.10 并前移到 project() 之前（CMake 4 拒绝 <3.5）"
    type: portability
  - file: "0002-cmake-optional-jni.patch"
    description: "JNI/Java 绑定改为可选：OHOS 无 JDK，缺失时排除 src/launcher/jni 而不是整体配置失败"
    type: portability
  - file: "0003-cmake-portable-cpu-flags.patch"
    description: "-msse3 仅在 x86 目标上传递（aarch64 上 clang 会直接报错）"
    type: portability
  - file: "0004-simde-portable-simd-kernels.patch"
    description: "SmallGapHitIteratorSSE8 / UngapHitIteratorSSE8 / UngapHitIteratorSSE16 改用 SIMDe 头（语义不变），并接入 SIMDE_INCLUDE_DIR"
    type: portability
  - file: "0005-test-in-tree-db-fixtures.patch"
    description: "上游 test target 改为使用仓库内 FASTA fixture 与真实二进制路径，避免访问已失效的 plast.gforge.inria.fr"
    type: portability
  - file: "0006-cxx17-drop-register.patch"
    description: "StatisticsPlastn.cpp 去掉 C++17 已移除的 register 存储类说明符（OHOS profile 的 cppstd=17 下 clang 报错）"
    type: portability
  - file: "0007-systemcommand-tmpdir.patch"
    description: "SystemCommand 的临时文件改用 TMPDIR（OHOS 上 /tmp 只读）"
    type: portability
  - file: "0008-unit-tests-tmpdir.patch"
    description: "上游单测的临时文件改用 TMPDIR，不再硬编码 /tmp"
    type: portability
  - file: "0009-fgetc-eof-unsigned-char.patch"
    description: "fgetc 结果用 int 承载：char 在 aarch64 上无符号，EOF 哨兵失效会在末行无换行时死循环"
    type: portability
  - file: "0010-test-runner-report-failures.patch"
    description: "PlastLibraryTest 打印失败断言详情并返回非零状态，失败不再被吞掉"
    type: portability
  - file: "0011-skip-unavailable-fixture-tests.patch"
    description: "8 个依赖 test/db 语料（归档未附带、上游来源已失效）的用例显式 skip 并打印原因"
    type: portability
  - file: "0012-reading-frame-unsigned-char.patch"
    description: "反向阅读框方向值用 int 承载：char 在 aarch64 上无符号，-1 变 255，导致反向链索引越界（plastx 结果错误 + 段错误）"
    type: portability
  - file: "0013-install-generated-version-header.patch"
    description: "生成的 misc/api/version.hpp 安装到规范路径，避免包内 version 宏停留在 unstable-master 占位值"
    type: portability

