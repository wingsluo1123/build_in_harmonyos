# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 README 明确要求 Intel/AMD 64bit + SSE2+，但 SIMD 面非常收敛：只有 3 个翻译单元使用 _mm_* 内建（SmallGapHitIteratorSSE8.cpp 54 处、UngapHitIteratorSSE8.cpp 22 处、UngapHitIteratorSSE16.cpp 21 处），因此用 SIMDe 头替换即可完整保留 kernel 语义，无需退化到标量迭代器"
  - "PLAST 的整个 OS 抽象层（线程/时间/文件/mmap 文件/内存）由自定义宏 __LINUX__ 选择，而该宏只在 CMakeLists 的 CMAKE_SYSTEM_NAME MATCHES Linux 分支里定义；OHOS 下 conan 把 CMAKE_SYSTEM_NAME 映射为 HarmonyOS，若不处理则 DefaultFactory 的 _thread/_time/_file/_memory/_fileMem 全部保持未初始化（运行期空指针），必须按 E092 覆盖 CMAKE_SYSTEM_NAME=Linux"
  - "find_package(JNI REQUIRED) 是最硬的门禁：ohpcd 制品仓没有 openjdk/jdk 配方（conan download 全部返回 system acceleration policy not enabled），OHOS 上也没有 JDK，Java 绑定必须做成可选"
  - "上游 test target 有两处失效：runTest.sh 会去 plast.gforge.inria.fr 下载测试数据（该域名已不存在），并且硬编码 <build>/bin/PlastLibraryTest，而 EXECUTABLE_OUTPUT_PATH 实际是 ${PROJECT_BINARY_DIR}/bin/${CMAKE_BUILD_TYPE}，单配置生成器下路径不匹配"
  - "上游 src/CMakeLists.txt 用 file(GLOB_RECURSE LibraryFiles ./*) 收集全部源码，包含 src/pcre（内置 PCRE 8.31）与 src/launcher/jni，因此 JNI 头缺失会直接让整库配置/编译失败"
  - "test/unit/CMakeLists.txt 用裸 FIND_PATH/FIND_LIBRARY 查找 CppUnit；把 conan 依赖的 include 目录预置进 CPPUNIT_INCLUDE_DIR 缓存变量即可，FIND_LIBRARY 会通过 <include>/../lib 提示路径找到 libcppunit.a"
  - "PLAST 的 R37 相关经验：本库为首次适配，版本号保持上游 2.3.2，未加适配后缀"
  - "aarch64 上 char 默认无符号，PLAST 有两处真实缺陷由此而来（补丁 0009 / 0012）：一是 fgetc 的 EOF 哨兵失效导致死循环，二是阅读框反向链方向值 -1 变 255 被当作数组下标，造成反向链翻译结果错误并在大库上段错误。clang 的 -Wtautological-constant-out-of-range-compare 在编译期就警告了 0009，构建日志中的这类 warning 值得当作 aarch64 移植线索逐条排查"
  - "同源问题：main.cpp 的测试 runner 只创建 TestResultCollector 而不输出、恒 return 0，导致失败被静默吞掉；配套补丁 0010 让失败可见且让 make test 真正以非零退出"
  - "test_package 里 conanrun 生成的 runenv 在 OHOS 上可能为空（VirtualRunEnv 未写入 PATH），把包内 bin/ 目录显式传给测试脚本比依赖 runenv 更可靠"
  - "上游 install(FILES .../version.hpp DESTINATION include/os/api/) 是笔误，源码树里的 unstable-master 占位 version.hpp 会随 install(DIRECTORY src/) 一起进包并覆盖生成头"
  - "大体量库在 HMDFS 上的构建并行度：PLAST 有 146 个源文件（161 个编译步骤）且 CMake 生成递归 Makefile。HMDFS 不支持 mkfifo（P020），GNU make 的 jobserver 因此退化为 pipe，子 make 拿不到有效 jobserver 时会按无限并行运行，`-j20` 下瞬间耗尽进程配额，表现为**没有任何编译诊断的编译失败**（`make: jobserver mkfifo: Operation not permitted` / `/bin/sh: can't fork - try again` / `Error 127`）。按 E074 显式 `cmake.build(build_tool_args=[\"-j1\"])` 后编译全程通过（CI 构建 #93278 → #93345 对比）"

