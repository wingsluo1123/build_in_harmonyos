version: "1.8.5"
status: built
software: plib
build_date: "2026-10-12"
build_system: autotools

source:
  url: "https://plib.sourceforge.net/dist/plib-1.8.5.tar.gz"
  tar_format: tar.gz
  sha256: "485b22bf6fdc0da067e34ead5e26f002b76326f6371e2ae006415dea6a380a32"

build:
  system: autotools
  configure_options:
    - "--disable-fnt"
    - "--disable-pui"
    - "--disable-puaux"
    - "--disable-ssg"
    - "--disable-ssgaux"
    - "--disable-sl"
    - "--disable-pw"
  dependencies: []
  # 构建工具依赖（tool_requires, build context）
  build_dependencies:
    - "automake/1.18"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "plib 1.8.5 源码取上游官方 dist 目录 https://plib.sourceforge.net/dist/plib-1.8.5.tar.gz（SourceForge files 下载页 404，但项目自身 dist 目录可用；sha256 485b22bf…a32 与 Debian pristine orig 逐字节相同）"
  - "OpenGL 模块(fnt/pui/puaux/ssg/ssgaux)、音频模块(sl/sm) 与 pw(X11) 在 OHOS 禁用，保留 ul/sg/psl/net/js 核心模块"
  - "configure 会把 includedir 自动追加 /plib，头文件装到 include/plib/"
