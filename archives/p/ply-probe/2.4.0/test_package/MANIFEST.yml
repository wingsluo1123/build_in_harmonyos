# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ply-probe/2.4.0
homepage: "https://github.com/iovisor/ply"

# 上游测试命令（test/ 为 QEMU 多架构套件：make check 引导 rootfs 后执行追踪用例）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/rootfs/lib/ply/test.sh
    source: 2.4.0.tar.gz/test/rootfs/lib/ply/test.sh
    description: "QEMU rootfs 内的追踪用例驱动脚本（需 Linux 内核追踪后端，OHOS 不可运行）"
    command: "make check（QEMU 引导 rootfs 后执行）"
  - file: src/ply/self-test.sh
    source: 2.4.0.tar.gz/src/ply/self-test.sh
    description: "ply 内嵌自检脚本（ply -T 触发，会调用 bpf() 加载探针）"
    command: "./ply -T"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "鸿蒙独有测试：产物可执行 + 解析器真实工作 + 内核追踪平台边界断言（4 项）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
