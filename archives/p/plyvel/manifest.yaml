software: plyvel
display: Plyvel
description: Python interface to LevelDB with snapshots, iterators and atomic write
  batches
category: db
homepage: https://github.com/wbolster/plyvel
license: BSD-3-Clause
build_system: custom
ohos_adaptation:
  key_points:
  - Native Python ABI and independent C++ extension linker configuration
  - Match the published LevelDB no-RTTI ABI for the callback comparator
  - Retain upstream permission assertion after a filesystem capability probe
  common_dependencies:
  - python
  - leveldb
versions:
  1.5.1:
    status: built
    build_date: '2026-10-13'
    conan_ref: plyvel/1.5.1
