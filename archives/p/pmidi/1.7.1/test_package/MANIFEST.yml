# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）

package: pmidi/1.7.1
homepage: "https://www.parabola.me.uk/alsa/pmidi.html"

# 上游测试入口：无自动化测试套件。
# 清点证据：顶层与 src/、man/ 的 Makefile.am 均无 TESTS / check_PROGRAMS / check-local，
# 源码包无 tests/ 目录；`make check` 实测 exit 0，逐目录输出 "Nothing to be done for 'check'"。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check（build 阶段真实执行，上游无注册用例：Nothing to be done for 'check'）"
upstream_tests: []

# test_package 消费者测试（真实产物校验 + 鸿蒙特有断言）
test_package_tests:
  - file: test.sh
    description: |
      消费者测试（R34 真实使用）：真实执行包内 bin/pmidi —— `pmidi -v` 输出
      pmidi-1.7.1；无参数调用到达主流程并给出 "No client/port specified" 提示；
      随包安装的手册页 share/man/man1/pmidi.1 存在。共 3 条断言。
    command: "sh test.sh"
    assertion_count: 3
  - file: test_ohos.sh
    description: |
      鸿蒙特有测试（8 条断言）：运行平台为 OpenHarmony/HarmonyOS；bin/pmidi 为
      ELF64/AArch64；携带 .codesign 签名段；PT_INTERP 为 OHOS musl 加载器
      ld-musl-aarch64.so.1；DT_NEEDED 不含 glibc 专有库（libpthread/libdl/librt/libutil）；
      链接 ohpcd alsa-lib 的 libasound.so；全部 NEEDED 在 conanrun 环境下可解析；
      设备端真实运行 `pmidi -v` 输出 pmidi-1.7.1。
    command: "sh test_ohos.sh"
    assertion_count: 8

assertion_count: 11

notes: |
  pmidi 上游没有自动化测试（无 TESTS/check_PROGRAMS/check-local，无 tests/ 目录）；
  `make check` 已真实执行，实测 0 用例（见 reports/upstream-make-check.log）。
  test_package 为消费者视角：真实运行被测包安装的 pmidi 二进制（版本/无端口守卫/手册页）
  并叠加鸿蒙平台专项断言（ELF64/AArch64、.codesign、musl loader、依赖闭包）。
  运行期限制：OHOS 内核无 ALSA sequencer（/dev/snd/seq 不存在），`pmidi -l` 报
  "Could not open sequencer"，属平台能力限制，不影响构建与 --version 验证。
