sources:
  url: "https://git.sr.ht/~anjan/pnc/archive/0.9.5.tar.gz"
  sha256: "48fc76cf1c74ed542278be677f527397f4928e835f819869473f6f32a3cea720"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: >-
      Upstream hardcodes /usr/local/include and find_library(PATHS /usr/local/lib),
      which breaks any prefix-based (Conan) or cross build; dependency include dirs
      and the static link closure are injected by the build driver instead.
    patch_type: "portability"
  - patch_file: "patches/0002-gawkext-CMakeLists.txt.patch"
    patch_description: >-
      Upstream queries AWKLIBPATH by executing gawk at configure time, which returns
      the absolute AWKLIBPATH of the build machine awk and breaks cross builds;
      install prefix-relative (lib/gawk) unless -DAWKLIBPATH= is given.
    patch_type: "portability"
