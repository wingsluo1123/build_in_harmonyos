software: pnc-gawk
display: "pnc GNU AWK extension"
description: "GNU AWK extension (gawkpn.so) exposing libphonenumber parsing, formatting, validation and offline geocoding"
category: utility
homepage: "https://git.sr.ht/~anjan/pnc"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游硬编码 /usr/local/include 与 find_library(PATHS /usr/local/lib)：改为构建驱动注入 include/链接闭包"
    - "上游 configure 期执行 gawk 取 AWKLIBPATH：交叉编译改用前缀相对目录 lib/gawk"
    - "gawk 扩展函数注册在 phonenumber 命名空间，AWK 侧需 phonenumber:: 前缀或 @namespace"
    - "运行期依赖 libc++_shared.so，OHOS 由 /system/lib64 提供"
  common_dependencies:
    - libphonenumber
    - icu4c
    - gawk

versions:
  "0.9.5":
    status: built
    build_date: "2026-10-17"
