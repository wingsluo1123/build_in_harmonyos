# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "protobuf 配方设 cmake_find_mode=none：消费 libphonenumber 这类静态依赖链时 CMakeDeps 会在 find_dependency(protobuf) 断链，只能用 pkg-config"
  - "protobuf 33.6 包内 libutf8_validity.a/libutf8_range.a 未列入 cpp_info.libs，需补写 protobuf.pc 才能链接"
  - "CMakeToolchain 把 generators 目录前置进 PKG_CONFIG_PATH，修复 .pc 必须就地覆盖该目录"
  - "gawk 扩展在 OHOS 上于进程退出阶段随机崩溃（SIGTRAP/SIGABRT，输出已产出），仅 ICU 地理编码路径触发；gawk 自带扩展同环境 40/40 正常"
