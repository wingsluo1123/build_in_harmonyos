knowledge_gained:
  - "ref: E002 / P014 —— OHOS /tmp 是只读 erofs：cmake/clang 的临时目录必须在 generate()/build() 里改指 build_folder 私有目录（TMPDIR/TMP/TEMP 三写）"
  - "ref: E276 / E483 —— codeload.github.com 的 tar.gz 直链末段是 tag 名（无 .tar.gz 后缀），conandata 必须显式给 filename，否则 conan 按末段猜格式报 BadZipFile"
  - "ref: E527 —— OHOS 的 gtk3 只编 broadway 后端（x11_backend=false/wayland_backend=false），include/gtk-3.0 下没有 gdk/gdkx.h、libgdk-3 也没有 gdk_x11_* 符号；任何 include <gdk/gdkx.h> 的上游代码必须做编译期探测（__has_include）+ 守卫"
  - "reference: E527 —— 同一个 broadway 后端反过来是**可测面**：gtk 包自带 bin/broadwayd，起一个私有 display 后 GtkStatusIcon 程序的完整初始化路径能真跑（version 分支、glade 装载、pixmap 装载、audio 挂载、进入主循环），消费者测试因此不必停留在结构性断言"
  - "ref: E660 —— ENABLE_NLS=ON 时上游 CMakeLists 会 FATAL_ERROR 要求 xgettext，且 support-intl.h 会 include 空壳 <libintl.h>；置 OFF 后既不需要 gettext 工具链也不链接 -lintl"
  - "ref: E527 家族 —— glib 的 exp10() 是本平台缺失的 GNU 扩展：OHOS sysroot 的 <math.h> 不声明它、共享 libm 也不导出（只有静态 libc.a 有），链接期报 undefined symbol: exp10；换成 pow(10,x) 等价且必然可用"
  - "reference: 上游 CMakeLists.txt:1 的 cmake_minimum_required(VERSION 3.0) + CMake 4.1.2 移除 <3.5 兼容的策略检查 —— platform 的 CMake 4.1.2 移除了 cmake_minimum_required(<3.5) 兼容，必须用 CMakeToolchain.cache_variables 注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（写成普通 variables 进 toolchain 文件不参与策略检查）"
  - "reference: E468（PkgConfigDeps 写 .pc 但不扩展 PKG_CONFIG_PATH）—— 本条命中既有条目、未新增草稿；CMakeToolchain 不会像 AutotoolsToolchain 那样自动把 generators 目录塞进 PKG_CONFIG_PATH，pkg_check_modules 项目必须自己在 build() 里铺好 PKG_CONFIG_PATH"
  - "reference: 已合入的 lomiri-polkit-agent/0.3.3（同一 glib/2.84 vs 2.88 冲突，改用 libnotify/0.8.3）—— 制品仓 libnotify/0.8.3.1 以 force=True 钉 glib/2.88.0.1，与全部已发布 gtk3 的 glib/2.84.0.1 不可解；0.8.3 与 glib/2.84 同代可直接用（已合入 lomiri-polkit-agent/0.3.3 同款处置）"
  - "reference: E1131 / E1670（.codesign 失效 ⇒ dlopen Permission denied 家族）—— 制品仓 libnotify 的 lib/libnotify.so.4.0.0 带 .codesign 段但签名不被 OHOS 加载器接受（dlopen → Permission denied；同一字节重签后可继续做依赖解析），因此任何链 libnotify 的交付物在 OHOS 上无法启动——依赖制品侧缺陷"

