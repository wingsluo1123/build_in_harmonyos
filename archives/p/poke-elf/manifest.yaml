software: poke-elf
display: "GNU poke ELF pickles"
description: "GNU poke pickle for editing ELF object files, executables, shared libraries and core dumps"
category: utility
homepage: "https://www.jemarch.net/poke-elf"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Data-only autotools package: pickles to share/poke/pickles, info manual, prelinkr script to bin/"
    - "configure umask 077 must be relaxed to 022 for HMDFS (E011)"
    - "makeinfo missing: pin prebuilt poke-elf.info timestamps + MAKEINFO=true"
    - "Upstream make check needs poke>=4.0 with pktest.pk: requires poke/5.0"
    - "Runtime relocation: POKEDATADIR for poke stdlib plus POKE_LOAD_PATH for the elf pickles"
  common_dependencies:
    - "poke"

versions:
  "1.0":
    status: built
    build_date: "2026-10-13"
