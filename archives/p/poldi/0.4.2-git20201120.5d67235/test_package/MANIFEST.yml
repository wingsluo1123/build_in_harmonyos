# test_package/MANIFEST.yml — 上游测试声明 + 消费者用例声明
# CI 门禁 L0e 强制要求本文件存在
# 详见 docs/TEST_QUALITY_SPEC.md 与本目录 conanfile.py

package: poldi/0.4.2-git20201120.5d67235
homepage: "https://www.gnupg.org/software/poldi/index.html"

# ── 上游测试入口（R51 清点口径） ────────────────────────────────────────────
#
# 上游 tests/ 目录源文件 2 个（parse-test.c / pam-test.c），在
# tests/Makefile.am 中注册为 noinst_PROGRAMS —— 即 `make all` 会编译它们，
# 但 Makefile.am 里**没有** `TESTS=` / `check_PROGRAMS=` 条目（清点证据：
# grep -n "TESTS\|check_PROGRAMS" tests/Makefile.am → 无输出），
# 因此 `make check` 输出 "Nothing to be done for 'check'"（自动化注册用例 N=0）。
#
# 故上游 N 口径 = 2 个测试程序（0 个自动注册用例）；两个程序由 conanfile.py
# build() 实际执行，统计随 conan create 日志上报（HMBS_UPSTREAM_TEST_RESULT）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (0 registered cases) + tests/parse-test + tests/pam-test"

upstream_tests:
  - file: tests/parse-test.c
    source: poldi/tests/parse-test.c
    description: "simpleparse（poldi.conf/命令行解析器）测试程序：选项向量解析 + 配置流解析（含语法错误路径）"
    command: "tests/parse-test -f foo.txt -b bar baz rest </dev/null"
    executed: true
    result: "通过（选项向量 3 项解析 + 配置流空输入）"
  - file: tests/pam-test.c
    source: poldi/tests/pam-test.c
    description: "通用 PAM 认证客户端（交互式工具，上游 README 记录用法）"
    command: "tests/pam-test --version / --help"
    executed: true
    result: "CLI 用例通过；其真实认证运行需要可写 PAM 配置 + OpenPGP 卡"
  - file: tests/pam-test.c
    source: poldi/tests/pam-test.c
    description: "pam-test <service>：对 PAM 服务做一次真实认证"
    command: "tests/pam-test poldi"
    executed: false
    result: "跳过——鸿蒙 /etc 只读（/etc -> /system/etc），无法建立 /etc/pam.d/<service>；且无 OpenPGP 卡。该流程由 test_package 的 libpam 宿主用例覆盖"

# ── test_package 消费者用例（R34 实质调用被测产物） ────────────────────────
#
# 被测产物是 PAM 模块（dlopen 插件，无独立 API/可执行文件），故采用 E345
# 「ABI 匹配的私有宿主」验证：消费者程序链接 Conan linux-pam 包，用真实 PAM
# 栈 pam_start_confdir()/pam_authenticate() 加载并调用打包模块。
test_package_tests:
  - file: test_package/test_pam_module.c
    description: "控制用例：service 指向不存在的模块 → libpam 必须返回 PAM_MODULE_UNKNOWN（证明检测非空转）"
    command: "test_pam_module <pam.d> missing unknown"
    executed: true
  - file: test_package/test_pam_module.c
    description: "正例：service 指向打包的 lib/security/pam_poldi.so → 模块被加载、pam_sm_authenticate 真实执行并返回真实 PAM 结果（非模块加载失败码）"
    command: "test_pam_module <pam.d> poldi loaded"
    executed: true

harmony_specific_test_count: 2
harmony_specific_tests:
  - file: test_package/test_pam_module.c
    kind: e2e_consumer_case
    label: "鸿蒙特有测试"
    description: >
      端到端消费者用例（rule12：完整跑通流程，非静态断言）：消费者程序 →
      真实 libpam 栈 → dlopen 打包模块 → poldi 模块内部（simpleparse 配置解析、
      libgcrypt/libgpg-error/libksba 运行时闭包）→ 返回真实 PAM 结果。
      该用例正是 patch 0001 的平台修复动机：OHOS 加载器不把宿主进程已加载库的
      符号放入 dlopen 模块的查找作用域，模块必须自带 DT_NEEDED libpam，
      否则 libpam 报 PAM_MODULE_UNKNOWN；控制用例与之对照。
    command: "test_pam_module <pam.d> poldi loaded"
    executed: true
    result: "rc=7 (Authentication failure) —— 模块被加载且入口执行；控制用例 rc=28 (Module is unknown)"

# 测试断言点数（近似值，用于质量评估）
assertion_count: 2
