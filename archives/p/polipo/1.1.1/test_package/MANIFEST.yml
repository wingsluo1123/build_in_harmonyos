# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: polipo/1.1.1
homepage: "https://github.com/jech/polipo"

# 上游测试命令
upstream_check_command: ""
# Polipo has no 'make check' target — no upstream test suite

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Polipo has no test suite
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 polipo -h 验证二进制可执行"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
