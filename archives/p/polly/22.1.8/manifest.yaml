knowledge_gained:
  - "polly 22.1.8 = llvm-project 单仓 polly/ 子项目（多面体优化器），须 -DLLVM_ENABLE_PROJECTS=polly 从 llvm/ 目录同树构建（LLVM 本体 + polly）"
  - "LLVMPolly.so 是 loadable module（add_polly_loadable_module 设 PREFIX 空，产物无 lib 前缀），且仅当 LLVM_ENABLE_PIC=ON 才生成，否则落入 dummy target 分支"
  - "isl 用 bundled 版本（POLLY_BUNDLED_ISL=ON，polly/lib/External/isl），生成 libPollyISL.a，无外部 Conan 依赖"
  - "check-polly 目标 = polly regression lit + PollyUnitTests(gtest) + polly-isl-test；lit 用构建树 opt 加载 LLVMPolly.so，in-tree 时 POLLY_GTEST_AVAIL=1"
  - "LLVMPolly.so 只链 isl、不链 LLVM 组件（LLVM 符号由宿主 opt 的 libLLVM.so 提供），OHOS musl BIND_NOW/namespace（E004/E088）是加载期风险点"
  - "OHOS musl BIND_NOW + RTLD_LOCAL 下 opt 加载 LLVMPolly.so 报 undefined symbol（_ZN4llvm2cl18getGeneralCategoryEv），须 target_link_libraries(LLVMPolly PUBLIC ${ISL_TARGET} LLVM) 显式链 libLLVM.so"
  - "gtest EXPECT_DEATH（death test）需可写 /tmp（fork+写 gtest_captured_stream），OHOS /tmp 只读（E002）→ Isl.Quota 的 5 个 EXPECT_DEATH 用等价功能断言替换（is_error/is_false/is_true + isl_ctx_last_error==isl_error_quota）"
  - "polly-isl-test 运行时读 test_inputs/*.polylib|*.omega；srcdir 是编译期路径，跨机运行时不存在 → get_filename 改读 getenv(\"srcdir\")，Release(NDEBUG) 下 assert(input) 被编译掉致 fopen(NULL) 段错误"
  - "polly/test 1092 回归 lit 中 39 个 REQUIRES: asserts（依赖断言/debug 输出），Release 构建(NDEBUG)标记 UNSUPPORTED；改 LLVM_ENABLE_ASSERTIONS=ON 后全部 PASS，22 个 XFAIL:* 是上游 Polly 已知 bug 预期失败（任何平台均 XFAIL）"
  - "本地交叉编译路线：DevEco SDK clang --target=aarch64-linux-ohos + 官方 clang+llvm-22.1.8 的 llvm-tblgen.exe（host），GetHostTriple.cmake Windows 返回 x86_64-pc-windows-msvc，OHOS_ALLOW_UNDEFINED_SYMBOLS=ON，产物 ELF 签名后传真机跑测试"
