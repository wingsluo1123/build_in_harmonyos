# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "musl libc (OHOS) does not expose pthread types or PATH_MAX transitively: 2011-era C that only included <syslog.h>/<stdio.h> still needs explicit <pthread.h>/<limits.h> (reference: E552)"
  - "The mactel NV8600MGT backlight driver drives the firmware SMI interface through x86 I/O ports (outb/inb/iopl from <sys/io.h>); on aarch64 <sys/io.h> exists but is empty, so the only correct port is to compile the driver out of the port-IO path and let probe() report the hardware unsupported (reference: E551)"
  - "Legacy Makefiles that probe the build host with `test -e /usr/include/...` mis-detect a cross/native OHOS sysroot; overriding the make variable from the command line (INOTIFY_CFLAGS= TIMERFD_CFLAGS=) keeps the real sysroot headers in use without patching the Makefile (reference: E550)"
  - "PkgConfigDeps names its .pc files after the Conan package ref (dbus.pc, pciutils.pc) while upstream Makefiles ask pkg-config for dbus-1 / libpci: synthesise the expected alias names in generate() (reference: E555)"
  - "2011 C with tentative definitions duplicated across translation units (lcd_bck_info in three files) needs -fcommon with clang >= 11 / GCC >= 10 (-fno-common is the default) (reference: E553)"
  - "libaudiofile.a contains C++ objects, so a C-only link line still needs libc++ (-lc++) (reference: E554)"

