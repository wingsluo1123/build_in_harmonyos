software: poppler
# 版本级 manifest - poppler 25.11.0
# 文件位置: archives/p/poppler/25.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "25.11.0"
status: built
build_date: "2026-06-07"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://poppler.freedesktop.org/poppler-25.11.0.tar.xz"
  sha256: ""
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  dependencies:
    - fontconfig/2.15.0
    - openjpeg/2.5.2
    - libiconv/1.17
    - openssl/3.3.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Requires fontconfig and openjpeg dependencies"
  - "PDF tools: pdfattach, pdfdetach, pdffonts, pdfimages, pdfinfo, etc."

# ============================================================
# 预编译包信息
# ============================================================

package:
  name: poppler-25.11.0-ohos-aarch64.tar.gz
  size: 17.01
  date: "2026-06-07"