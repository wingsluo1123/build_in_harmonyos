# 软件级 manifest - poppler
# 文件位置: archives/p/poppler/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: poppler
display: "Poppler PDF Library"
description: "PDF rendering library based on xpdf, for PDF document manipulation"

category: library

homepage: "https://poppler.freedesktop.org/"

license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

build_system: cmake

# ============================================================
# OHOS 适配知识
# ============================================================

ohos_adaptation:
  key_points:
    - "Requires fontconfig, openjpeg, and other dependencies"
    - "Binary tools: pdfattach, pdfdetach, pdffonts, pdfimages, pdfinfo, etc."
  
  common_dependencies:
    - fontconfig
    - openjpeg
    - libiconv
    - openssl

# ============================================================
# 版本索引
# ============================================================

versions:
  "25.11.0":
    status: built
    build_date: 2026-06-07
  "24.03.0":
    status: built
    build_date: 2026-05-26