knowledge_gained:
  - "OHOS aarch64 sysroot 的 <sys/io.h> 存在但 bits/io.h 为空：缺端口指令时编译只报隐式声明告警，链接不报错（.so 允许未定义符号），故障延后到 dlopen 的 'symbol not found'（musl BIND_NOW） (knowledge_ref: E2141)"
  - "非 x86 适配口径：I/O 入口抛 portio.error（显式失败），ioperm/iopl 返回 ENOSYS（保持返回 errno 契约），避免伪造数据 (knowledge_ref: E2141)"
  - "setuptools 交叉编译：只认环境变量，CC/CFLAGS/C_INCLUDE_PATH/LDSHARED/LDFLAGS 必须显式注入；sysconfig INCLUDEPY 在本环境解析为 //include/python3.12，不可用 (knowledge_ref: knowledge/operations/build-systems.md §14)"
  - "conan python/3.12.9 的 EXT_SUFFIX=.cpython-312-aarch64-linux-ohos.so 与设备 python3 一致，扩展模块两侧通用 (knowledge_ref: E004)"
  - "E077：扩展模块 .so 必须 binary-sign-tool 自签 + chmod 755，否则 import 报 Permission denied；package() 复制后须重新签名 (knowledge_ref: E077)"
  - "构建期 setuptools 需按 pinned sha256 从 PyPI 解包（conan python 不自带） (knowledge_ref: archives/g/gpgmepy/2.0.0/conanfile.py)"

