package: postgresql-hypopg/1.4.2
homepage: "https://github.com/HypoPG/hypopg"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make installcheck PG_CONFIG=pg_config"

upstream_tests:
  - file: test/sql/hypopg.sql
    source: hypopg-1.4.2/test/sql/hypopg.sql
    description: "HypoPG basic functionality tests"
    command: "make installcheck"
  - file: test/sql/hypo_index.sql
    source: hypopg-1.4.2/test/sql/hypo_index.sql
    description: "Hypothetical index creation tests"
    command: "make installcheck"
  - file: test/sql/hypo_brin.sql
    source: hypopg-1.4.2/test/sql/hypo_brin.sql
    description: "BRIN hypothetical index tests"
    command: "make installcheck"
  - file: test/sql/hypo_hash.sql
    source: hypopg-1.4.2/test/sql/hypo_hash.sql
    description: "Hash hypothetical index tests"
    command: "make installcheck"

test_package_tests:
  - file: conanfile.py
    description: "Verify hypopg extension files exist"
    command: "conan test"

assertion_count: 5
