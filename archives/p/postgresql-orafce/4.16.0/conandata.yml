# conandata.yml — postgresql-orafce 4.16.0
# PostgreSQL extension providing Oracle compatibility functions.
# Built using PGXS, which requires PostgreSQL server dev files (pg_config,
# server headers, PGXS makefiles). Since there is no postgresql conan package
# in the artifact repo, this recipe downloads PostgreSQL source as the main
# source (patches apply to it), and orafce source as a secondary download.

sources:
  url: "https://ftp.postgresql.org/pub/source/v18.1/postgresql-18.1.tar.gz"
  sha256: "b0f18c2d6973d2aa023cfc77feda787d7bbe9c31a3977d0f04ac29885fb98ec4"

orafce_sources:
  url: "https://github.com/orafce/orafce/archive/refs/tags/VERSION_4_16_0.tar.gz"
  sha256: "cee32bf74063e17219c7ac8cbe855c849fb3d7cff7591449aa22d06cbeaef854"

patches:
  - patch_file: patches/0001-config.guess-harmonyos.patch
    patch_type: "portability"
    patch_description: "config.guess HarmonyOS detection"
  - patch_file: patches/0002-config.sub-ohos.patch
    patch_type: "portability"
    patch_description: "config.sub OHOS support"
