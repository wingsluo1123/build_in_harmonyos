software: postgresql-orafce
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.16.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.16.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# 构建系统（顶层字段，submit 自检要求）
build_system: pgxs

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/orafce/orafce/archive/refs/tags/VERSION_4_16_0.tar.gz"

  # 源码校验和
  sha256: "cee32bf74063e17219c7ac8cbe855c849fb3d7cff7591449aa22d06cbeaef854"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom  # PostgreSQL Extension (PGXS)

  # 配置选项列表
  configure_options:
  - "CC=clang"  # 必须设置编译器环境变量

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "postgresql/18.1 (source, not conan package)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-config.sub-ohos.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PostgreSQL extension (PGXS) requires pg_config, server headers, and PGXS makefiles; not available as conan package, must build from PostgreSQL source"
  - "Makefile.port is a symlink created by configure; use shutil.copy2() to follow symlink when copying to PGXS dir"
  - "0003-configure-tmpdir.patch line numbers do not match PG18.1 configure; fix programmatically via text replacement"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
