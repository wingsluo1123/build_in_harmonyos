package: postgresql-rum/1.3.15
homepage: "https://github.com/postgrespro/rum"
upstream_check_command: "make USE_PGXS=1 installcheck"
upstream_test_in_build: true
upstream_test_command: "make USE_PGXS=1 installcheck"
upstream_tests:
  - file: "Makefile"
    source: "rum-1.3.15/Makefile"
    description: "RUM extension regression test suite using PGXS installcheck target; tests RUM index operations, full-text search, ordering, and data type support."
    command: "make USE_PGXS=1 installcheck"
test_package_tests:
  - file: "test_rum.sh"
    description: "Verifies rum.so shared library exists in the installed package, is a valid ELF binary, and exports the _PG_init extension entry symbol."
    command: "./test_rum.sh"
assertion_count: 3
