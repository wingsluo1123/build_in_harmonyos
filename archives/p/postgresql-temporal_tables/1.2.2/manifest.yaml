software: postgresql-temporal_tables
# 版本级 manifest 模板
# 文件位置: archives/p/postgresql-temporal_tables/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/arkhipov/temporal_tables/archive/refs/tags/v1.2.2.tar.gz"

  # 源码校验和
  sha256: "85517266748a438ab140147cb70d238ca19ad14c5d7acd6007c520d378db662e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PG_CONFIG=pg_config"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - postgresql/18.3

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: conan_test
  total: 4
  passed: 4
  failed: 0
  note: "ELF inspection + nm symbol verification (Pg_magic_func, versioning, _PG_init, pg_finfo_versioning)"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PGXS构建系统无需configure步骤"
  - "时态表扩展支持SQL:2011标准"
  - "PostgreSQL扩展无法在服务器外dlopen，使用ELF检查+nm符号验证替代"
  - "Conan basic_layout需要cwd=self.source_folder在源码目录执行make"
