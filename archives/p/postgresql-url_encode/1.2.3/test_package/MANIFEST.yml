# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: postgresql-url_encode/1.2.3
homepage: "https://api.pgxn.org/dist/url_encode/"

# 上游测试命令 (PGXS regression test, requires running PostgreSQL server)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (PGXS installcheck, requires PG server)
upstream_tests:
  - file: test/sql/url_encode.sql
    source: postgresql-url_encode-1.2.3/test/sql/url_encode.sql
    description: "PGXS regression test for url_encode extension"
    command: "make USE_PGXS=1 installcheck"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_url_encode.c
    description: "读取 .so ELF 文件并验证 PG_MODULE_MAGIC、url_encode/url_decode/uri_encode/uri_decode 导出符号"
    command: "./test_url_encode <path_to_url_encode.so>"

# 测试断言总数
assertion_count: 6
