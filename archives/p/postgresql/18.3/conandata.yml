# conandata.yml — postgresql 18.3

sources:
  url: "https://ftp.postgresql.org/pub/source/v18.3/postgresql-18.3.tar.bz2"
  sha256: "d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f"

patches:
  - patch_file: "patches/0001-config-config.guess.patch"
    patch_description: "config.guess: add HarmonyOS platform detection"
    patch_type: "portability"
  - patch_file: "patches/0002-config-config.sub.patch"
    patch_description: "config.sub: add ohos* OS type and linux-ohos validation"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: fix umask 077 to 022 for hmdfs permission"
    patch_type: "portability"
  - patch_file: "patches/0004-src-backend-port-sysv_shmem.c.patch"
    patch_description: "SysV IPC: use mmap when shmget is broken (SIGSYS)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-backend-utils-init-miscinit.c.patch"
    patch_description: "miscinit: relaxed ownership/permission checks for broken umask"
    patch_type: "portability"
  - patch_file: "patches/0006-src-bin-initdb-initdb.c.patch"
    patch_description: "initdb: use mmap DSM when shm_open broken, chmod after mkdir"
    patch_type: "portability"
  - patch_file: "patches/0007-src-common-file_perm.c.patch"
    patch_description: "file_perm: disable mode mask when umask is broken"
    patch_type: "portability"
  - patch_file: "patches/0008-src-common-username.c.patch"
    patch_description: "username: getpwuid fallback to numeric UID"
    patch_type: "portability"
  - patch_file: "patches/0009-src-include-pg_config_manual.h.patch"
    patch_description: "pg_config_manual: disable Unix-domain socket when unsupported"
    patch_type: "portability"
  - patch_file: "patches/0010-src-include-storage-dsm_impl.h.patch"
    patch_description: "dsm_impl: use mmap DSM when shm_open is broken"
    patch_type: "portability"
  - patch_file: "patches/0011-src-interfaces-libpq-fe-auth.c.patch"
    patch_description: "libpq: getpwuid fallback to numeric UID"
    patch_type: "portability"
  - patch_file: "patches/0012-src-port-pgmkdirp.c.patch"
    patch_description: "pgmkdirp: fix mkdir permissions for broken umask"
    patch_type: "portability"
  - patch_file: "patches/0013-src-test-regress-pg_regress.c.patch"
    patch_description: "pg_regress: use TCP/IP when Unix sockets unsupported"
    patch_type: "portability"
