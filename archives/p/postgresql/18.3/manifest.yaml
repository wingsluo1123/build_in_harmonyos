knowledge_gained:
  - 'E001: OHOS SysV IPC (shmget/shmat/shmdt/shmctl) returns SIGSYS — use mmap-based DSM'
  - 'E002: OHOS /tmp is read-only — set TMPDIR to build folder'
  - 'E003: hmdfs filesystem imposes abnormal S-bit on mkdir — chmod after mkdir'
  - 'E004: hmdfs umask 077 causes temp dir permission issues — relax to 022'
  - 'E005: getpwuid fails for users not in /etc/passwd — fallback to numeric UID'
  - 'E006: OHOS does not support Unix-domain sockets (bind EPERM) — use TCP/IP'
  - 'E007: config.guess/config.sub lack HarmonyOS detection — add __OHOS__ branch'
  - 'E008: shm_open configure-detects OK but runtime SIGSYS — force DSM_IMPL_MMAP'

