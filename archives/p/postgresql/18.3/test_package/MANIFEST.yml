package: postgresql/18.3
homepage: "https://www.postgresql.org/"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: "src/test/regress/pg_regress.c"
    source: "postgresql-18.3/src/test/regress/pg_regress.c"
    description: "PostgreSQL regression test suite; make check runs full test suite."
    command: "make check"
test_package_tests:
  - file: "test_pg.sh"
    description: "Verifies pg_config binary exists in the installed package and is a valid ELF binary (unsigned binaries cannot be executed on OHOS CI)."
    command: "./test_pg.sh"
assertion_count: 2
