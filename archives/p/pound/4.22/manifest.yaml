software: pound
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.22/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.22"

# 编译状态
# published | built | failed | archived
status: built
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/graygnuorg/pound/archive/refs/tags/v4.22.tar.gz"

  # 源码校验和
  sha256: "5781ba7fe2740f118ce846a32d861ae926f00496e0f2be31880886512407c887"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--disable-dynamic-backends"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w
    - pcre2/10.40

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-openharmony-pthread-compat.patch"
  - "0002-skip-doc-build.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pthread_cancel not available on OpenHarmony, use pthread_detach instead"
  - "pthread_mutexattr_settype not fully supported, use default mutex"
  - "makeinfo not available, skip doc directory in SUBDIRS"
  - "Source from git tag requires bootstrap (autoreconf) before configure"
