# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ppft/1.7.8
homepage: "https://github.com/uqfoundation/ppft"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 ppft/tests/__main__.py（上游 tox.ini 的官方跑法：runner 逐个执行 ppft/tests/*.py，任一失败即 exit 1）；测试期另有环境改动（如实披露，见 notes.md）：sitecustomize shim 把 ppft 探测到的 worker 数压到 2（只改并行度、用例数与断言不变）+ shim 自检（探测值 > 2 即失败，防静默失效）+ 仅对沙箱资源类错误（posix_spawn EAGAIN 一类）重试 1 次"

upstream_tests:
  - name: "ppft/tests/（上游自带 runner：__main__.py 逐个执行目录内脚本）"
    count: 7
    description: >-
      上游 ppft 的"测试"是 ppft/tests/ 下的 7 个可执行脚本（auto_diff.py、callback.py、
      dynamic_ncpus.py、quicksort.py、reverse_md5.py、sum_primes.py、sum_primes_functor.py）；
      官方跑法见其 tox.ini：`{envpython} ppft/tests/__main__.py` —— runner 把目录内除 `__*`
      外的每个 .py 当子进程执行，任一失败即 exit 1（其 __init__.py 亦写明 `python -m ppft.tests`）。
      实测这些脚本只 import math/sys/time/hashlib 与 `ppft` 自身 → **零测试期依赖**
      （早前预估的 dill/pytest 已被实测证伪并去掉，构建全程离线）。
      本地 conan create 实测：7/7 脚本通过（rc=0）；探测不到套件或 rc≠0 一律响亮失败，
      不把"没跑"写成通过。

test_package_tests:
  - file: check_ppft.py
    description: >-
      R34 消费者校验（全部离线、只用可实证断言）：①产物齐备（`ppft/` 模块目录）
      ②模块文件齐备（≥3 个 .py 且含 `__init__.py`）③真实 `import ppft`（零运行期依赖）
      ④公开符号面（按实测 `dir()` 报告，≥3 个）⑤`__version__` 若存在需等于 1.7.8
      （不存在则如实说明"该库如此"，版本以 conandata 钉死的 sdist 为准）
      ⑥证据（模块总字节 + python 版本）
    command: "python3 check_ppft.py <package-folder>"

assertion_count: 6
