  cc: clang

patches_applied: []

test_results:
  type: upstream_and_consumer
  upstream_tests: 2
  upstream_assertions: 7
  consumer_tests: 1
  consumer_assertions: 9
  passed: 3
  failed: 0

knowledge_gained:
  - "PQClean has no unified build system; each scheme directory ships its own Makefile, scheme sources are compiled directly with -I<common>"
  - "Scheme APIs are namespace-macro guarded; functest.c requires -DPQCLEAN_NAMESPACE=PQCLEAN_<SCHEME>_CLEAN to compile"
  - "common/randombytes.c compiles on OHOS via the __linux__ branch (getrandom syscall); /dev/urandom is readable as fallback"
  - "Upstream functest counts: ml-kem-768 3 test functions (keys/invalid_sk_a/invalid_ciphertext), ml-dsa-65 4 (sign/sign_detached/wrong_pk/func_ptrs), NTESTS=1"
