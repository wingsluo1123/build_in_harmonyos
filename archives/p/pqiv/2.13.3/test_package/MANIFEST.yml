# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pqiv/2.13.3
homepage: "https://github.com/phillipberndt/pqiv"

# 上游测试命令
# 清点证据：2.13.3 源码树无 test/ 目录、无 Makefile check/ctest 目标；
# 唯一的官方校验是 .github/workflows/ci.yml 的 "check" 步骤：
#   ./configure && make && ./pqiv --version
upstream_check_command: "./configure && make && ./pqiv --version"

# conanfile.py build() 方法中是否已集成上游测试
# 上游无测试套件，build() 复跑上游 CI 的等效校验命令 ./pqiv --version
# （_upstream_smoke_test()，失败即中止构建）。
upstream_test_in_build: true
upstream_test_command: "./pqiv --version"

# 上游实际运行的校验项（源码树内无测试程序，CI 仅做构建 + 版本冒烟）
upstream_tests:
  - file: ".github/workflows/ci.yml"
    source: pqiv-2.13.3/.github/workflows/ci.yml
    description: "上游 CI 'check' 步骤：configure + make + ./pqiv --version（无测试套件）"
    command: "./pqiv --version"

# test_package 中自带的测试 (消费者视角验证，R34 实质断言)
test_package_tests:
  - file: test.sh
    description: "运行安装后的 bin/pqiv：断言 --version 精确输出、--help 选项面、非法选项非零退出"
    command: "bash test.sh"

# 测试断言总数 (test_package 3 个断言)
assertion_count: 3
