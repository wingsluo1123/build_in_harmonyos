version: "1.3.0"
software: "pqmarble"
status: built
build_date: "2026-10-17"
build_system: "meson"

source:
  url: "https://gitlab.gnome.org/api/v4/projects/20662/repository/archive.tar.gz?sha=v1.3.0"
  sha256: "7f969b5b5f52aed5e7be57d6d49ab9abba46b2fc216d142fa93d71a95de63a70"
  tar_format: tar.gz
  upstream_tag: "v1.3.0"
  upstream_commit: "710a677afa9fab25f2a9ef2161cc80dff23b747d"

build:
  system: meson
  configure_options:
    - "-Dtests=true"
    - "-Dintrospection_typelib=false"
  dependencies:
    - glib/2.84.0.1
    - gtk/3.24.43
  tool_requires:
    - meson/1.11.0
    - ninja/1.12.1
    - vala/0.56.19
    - pkgconf/3.0.6
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson-optional-typelib.patch"

knowledge_gained:
  - "valac 的 vapi 目录编译期硬编码，conan 包重定位后必须用 wrapper 追加 --vapidir=<pkg>/share/vala-0.56/vapi"
  - "meson 无法通过 PATH 找到 valac/llvm-ar/llvm-ranlib，必须在 machine file [binaries] 写绝对路径"
  - "conan 包内 ELF 构建工具未签名，OHOS execve 返回 EPERM；复制到构建目录后 binary-sign-tool 自签名即可执行"
  - "meson gnome.compile_resources() 先从 [binaries] 取 glib-compile-resources，取不到才查 gio-2.0.pc 的 glib_compile_resources 变量"
  - "g-ir-compiler 需要 GObject-2.0.gir；OHOS glib/gtk 包未安装 GIR，.typelib 只能关闭（.gir 由 valac 生成，不受影响）"
  - "包内 libmarble.so 必须自签名，否则 OHOS 加载器拒绝加载（Error loading shared library）"
