# conandata.yml — pragha 1.3.4
# Official GitHub release tarball of the pragha music player (tag v1.3.4).

sources:
  url: "https://github.com/pragha-music-player/pragha/releases/download/v1.3.4/pragha-1.3.4.tar.bz2"
  sha256: "e54e6acdc11e6f19c691c6e069fa9d54934c37b0f4b78cd5e835ce9512866ba6"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    strip: 1
    patch_description: "Teach the 2018 config.guess the HarmonyOS uname tuple so configure guesses aarch64-unknown-linux-ohos natively"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    strip: 1
    patch_description: "Accept the linux-ohos OS in the bundled config.sub (aarch64-unknown-linux-ohos triplet)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask.patch"
    strip: 1
    patch_description: "Create config.status temporary directories with umask 022 (HMDFS setgid semantics reject 0700 dirs)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-pragha-cmdline-selftest.patch"
    strip: 1
    patch_description: "Add a headless --selftest option (runs in local command-line handling before the GTK window activates) covering musicobject round trip/dup/compare, playlist format detection, sqlite3 and GStreamer runtime binding"
    patch_type: "test"
  - patch_file: "patches/0005-configure-intltool-xml-parser.patch"
    strip: 1
    patch_description: "Skip the XML::Parser perl-module probe in the generated intltool macro (the OHOS worker has perl but not the XS module; the recipe-local intltool shims cover every real intltool invocation, intltool package recipe uses the same workaround)"
    patch_type: "portability"
  - patch_file: "patches/0006-src-pragha-session-x11-guard.patch"
    strip: 1
    patch_description: "Guard the X11-only session-management code (gdk/gdkx.h include, GDK_IS_X11_DISPLAY window role) behind the upstream GDK_WINDOWING_X11 backend macro; the OHOS gtk package is built with the broadway backend which provides neither"
    patch_type: "portability"
