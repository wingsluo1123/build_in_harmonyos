# 版本级 manifest
# 文件位置: archives/p/precice/3.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
version: "3.4.1"
software: "precice"

# 编译状态: 真机 rule4 门禁通过前保持 built, 不冒充 published
status: built
build_date: "2026-10-09"
build_system: "cmake"

source:
  url: "https://github.com/precice/precice/archive/v3.4.1.tar.gz"
  sha256: "ef4713c938a1b2000d0b071175e1b45f9ec55c7aec4bbe7b65c3992edcc74ac7"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DPRECICE_FEATURE_MPI_COMMUNICATION=OFF"
    - "-DPRECICE_FEATURE_PETSC_MAPPING=OFF"
    - "-DPRECICE_FEATURE_PYTHON_ACTIONS=OFF"
    - "-DPRECICE_FEATURE_GINKGO_MAPPING=OFF"
    - "-DPRECICE_FEATURE_KOKKOS_KERNELS_MAPPING=OFF"
    - "-DPRECICE_BINDINGS_C=ON"
    - "-DPRECICE_BINDINGS_FORTRAN=OFF"
    - "-DPRECICE_BUILD_TOOLS=OFF"
    - "-DPRECICE_BUILD_BENCHMARKS=OFF"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - boost/1.91.0.1.3
    - eigen/3.4.1
    - libxml2/2.15.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-conan-boost-umbrella.patch"

knowledge_gained:
  - "preCICE 3.2+ 恒为共享库, BUILD_SHARED_LIBS=OFF 被上游忽略并告警, 配方直接声明 shared-library"
  - "MPI/PETSc/Python/Ginkgo/Kokkos 均为官方 opt-out 特性开关, OHOS 单机配方全部关闭, 仅留 Boost + Eigen + libxml2"
  - "Fortran 绑定关闭 (OHOS worker 无 Fortran 编译器), solverdummy fortran 条目随之跳过"
  - "上游测试为 Boost.Test 单二进制 + ctest 发现机制, 计数口径为 ctest_entries"
