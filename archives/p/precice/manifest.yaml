# 软件级 manifest
# 文件位置: archives/p/precice/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
software: precice
display: "preCICE"
description: "面向分区多物理场仿真的耦合库 (流固耦合、共轭传热等)"
category: library
homepage: "https://precice.org"
license: LGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "3.2+ 恒为共享库, BUILD_SHARED_LIBS 开关被上游忽略, 配方声明 shared-library"
    - "MPI/PETSc/Python/Ginkgo/Kokkos 官方 opt-out 开关在 OHOS 单机全部关闭"
    - "Fortran 绑定关闭, 无 Fortran 编译器依赖"
    - "上游 Boost.Test 单二进制由 ctest 逐用例发现, 计数口径 ctest_entries"
  common_dependencies:
    - boost
    - eigen
    - libxml2

versions:
  "3.4.1":
    status: built
    build_date: "2026-10-09"
    source_url: "https://github.com/precice/precice/archive/v3.4.1.tar.gz"
