# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PostgreSQL 扩展（PGXS）的完整构建依赖可由 conan postgresql 包提供：服务端头文件 include/postgresql/server、pgxs.mk 与可重定位 pg_config；build() 无需构建 PostgreSQL 源码"
  - "PGXS 的 LINK.shared 默认带 -Wl,-rpath,'$(libdir)'（Makefile.global: rpathdir=$(libdir)），会把构建机 conan 缓存绝对路径写进 .so；服务端模块不需要 rpath，用 make rpath= 关掉即可得到只依赖 libc.so 的可复现产物"
  - "上游 Makefile 的 REGRESS 顺序存在数据依赖：explain 用例查询 prefix 用例建立的 ranges/numbers 与 falcon 用例建立的 tst，pg_regress 必须按 REGRESS 声明顺序执行，不能并行或重排"
  - "prefix 回归套件依赖外部 fixture prefixes.fr.csv（11966 行官方号段表），prefix.sql 用客户端相对路径 \\copy 读取；pg_regress 的 cwd 不可依赖，需在执行前把该路径固定为绝对路径"
  - "PG 18.3 包内的 pg_regress 位于 lib/postgresql/pgxs/src/test/regress/，其 RUNPATH 只对 bin/ 下程序有效，需显式 LD_LIBRARY_PATH=<pgroot>/lib 才能加载 libpq.so.5"
  - "OHOS 构建的 PostgreSQL 18.3 不带 unix socket 支持（配置含 -DHAVE_NO_UNIX_SOCKETS），启动参数必须用 unix_socket_directories='' 并走 TCP loopback，否则服务起不来"
  - "OHOS 用户文件系统拒绝 posix_fallocate（EACCES），而 PG 18 的 file_extend_method 默认即 posix_fallocate：COPY / 多行插入在成批扩展数据文件时报 'could not extend file ... with FileFallocate(): Permission denied'（HINT 提示磁盘空间但实测仍有 ~639 GB 可用），必须改传 -c file_extend_method=write_zeros"
  - "OHOS PC 可原生运行 PostgreSQL 18.3 服务端：initdb/pg_ctl/psql/pg_regress 可用，扩展在 CREATE EXTENSION 时 dlopen 成功，无需 ELF 签名干预"
