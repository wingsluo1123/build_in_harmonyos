# conandata.yml — PreviSat 7.2.1.3
# 官方站点: http://astropedia.free.fr  /  http://previsat.free.fr
# 源码由上游发布在 SourceForge 项目 previsat 下（官方下载入口）

sources:
  url: "https://downloads.sourceforge.net/project/previsat/previsat/previsat7-2/previsat7-2-1-3/previsat-7.2.1.3-src.tar.gz"
  sha256: "0cbe9a3c66f03612a4b2e86f2b955bc09d2c52be7b116cb4514db77c780845ed"
  tar_format: tar.gz

patches:
  - patch_file: "patches/0001-CMakeLists-qt6-modules-and-clang-flags.patch"
    patch_type: "portability"
    patch_description: "CMakeLists: 去掉 Qt6 PrintSupport（源码仅残留未使用的 include）、去掉 clang 15 不认识的 GCC 专属 release 选项（-fbranch-target-load-optimize/-fcprop-registers/-fcrossjumping/-floop-optimize/-foptimize-register-move/-fpeephole/-fpeephole2/-frerun-cse-after-loop）"
  - patch_file: "patches/0002-src-interface-previsat-unused-print-includes.patch"
    patch_type: "portability"
    patch_description: "src/interface/previsat.cpp: 移除 <QPrintDialog>/<QPrinter> 两个未使用的 include（与 0001 去 PrintSupport 配套；源码内无任何 QPrinter/QPrintDialog 调用）"
  - patch_file: "patches/0003-src-librairies-corps-systemesolaire-luneconst-constexpr-sqrt.patch"
    patch_type: "portability"
    patch_description: "src/librairies/corps/systemesolaire/luneconst.h: constexpr 初始化中的 sqrt() 改为同一表达式的 IEEE-754 double 字面值（clang/libc++ 下 C 库 sqrt 非 constexpr，GCC 才可常量折叠）"
  - patch_file: "patches/0004-src-librairies-corps-terreconst-constexpr-sqrt.patch"
    patch_type: "portability"
    patch_description: "src/librairies/corps/terreconst.h: constexpr 初始化中的 sqrt() 改为同一表达式的 IEEE-754 double 字面值（同上；sgp4const.h 的 RTMS 依赖 TERRE::KE）"
  - patch_file: "patches/0005-src-interface-carte-carte-qvectoriterator-ctad.patch"
    patch_type: "portability"
    patch_description: "src/interface/carte/carte.cpp: QVectorIterator 三处补上显式模板参数 <QPolygonF>（clang 15 未实现 C++20 别名模板 CTAD：QVectorIterator 在 Qt6 中是 QListIterator 的别名模板）"
  - patch_file: "patches/0006-src-configuration-configuration-listeFics-redefinition.patch"
    patch_type: "portability"
    patch_description: "src/configuration/configuration.cpp: Q_OS_LINUX 分支内的 listeFics 重定义为 listeFicsRacine（同一函数作用域内与后面的 listeFics 重名，上游在定义 Q_OS_LINUX 的平台上无法编译）"
  - patch_file: "patches/0007-src-librairies-dates-date-qvectoriterator-ctad.patch"
    patch_type: "portability"
    patch_description: "src/librairies/dates/date.cpp: QVectorIterator 补上显式模板参数 <QPointF>（同 0005，clang 15 不支持别名模板 CTAD）"
