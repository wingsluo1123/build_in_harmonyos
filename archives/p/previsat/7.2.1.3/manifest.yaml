# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PreviSat 要求 Qt6 {Sql, PrintSupport, Multimedia} 三模块同时可用，但制品仓中 qtmultimedia/6.11.1 精确 requires qtbase/6.11.1（FEATURE_sql=OFF 且 FEATURE_printsupport=OFF），而含 Sql/PrintSupport 的 qtbase/6.11.1.3 与之冲突；解法＝qtbase-sql-dbus 变体（Sql/Core/Gui/Widgets/Network/Xml/Concurrent）+ qtmultimedia，且 PrintSupport 在源码中仅剩未使用的 include（可安全移除）(knowledge_ref: E441)"
  - "多 Qt6 前缀装配：Qt6_DIR 指向含 Sql 的基础包，其余模块包经 QT_ADDITIONAL_PACKAGES_PREFIX_PATH + CMAKE_PREFIX_PATH 提供，代码/链接（含 moc/uic/rcc 工具）即可整体工作 (knowledge_ref: E323)"
  - "clang 15 未实现 C++20 别名模板 CTAD：Qt6 的 QVectorIterator 是 QListIterator 的别名模板，QVectorIterator it(x) 直接报 alias template requires template arguments，需补显式模板参数 (knowledge_ref: E397)"
  - "constexpr 初始化中调用 C 库 sqrt() 在 clang/libc++ 下非法（GCC 可常量折叠，且 __builtin_sqrt 同样不被该 clang 接受）→ 内联同一表达式的 IEEE-754 double 字面值（位级等价） (knowledge_ref: E397)"
  - "上游 release 选项夹带 GCC 专属优化开关（-fbranch-target-load-optimize/-fcprop-registers/-fcrossjumping/-floop-optimize/-foptimize-register-move/-fpeephole/-fpeephole2/-frerun-cse-after-loop），clang 15 报 unknown argument 硬失败，需在补丁中剔除 (knowledge_ref: E137)"
  - "上游 configuration.cpp 在 Q_OS_LINUX 分支与主干各定义一个同名局部变量 listeFics，同一函数作用域内重定义 → 定义 Q_OS_LINUX 的平台（OHOS 属之）无法编译，需重命名 (knowledge_ref: E091)"
  - "Qt6 GUI 应用在无窗口系统的 OHOS 上可经 offscreen QPA 插件无头启动，运行期自建 log/、cache/、data/config 等目录并写出日志，可作为可执行包的真实运行时测试依据 (knowledge_ref: E527)"
  - "上游数据库经 QSqlDatabase(\"QSQLITE\") 打开，Qt6Sql 驱动插件（libqsqlite.so）由基础包 plugins/sqldrivers 提供，测试环境需把依赖包 plugins 目录加入 QT_PLUGIN_PATH，否则报 driver not loaded (knowledge_ref: E547)"

