# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试入口清点（PreviSat 7.2.1.3 发布源码包）：
#   CMakeLists.txt 提供 BUILD_TEST 选项（默认 false），为 ON 时注册
#   add_test(NAME PreviSatTest COMMAND PreviSatTest)，构建材料为
#   test/src/*.cpp/*.h（见 CMakeLists.txt 第 151-209 行）。
#   但 7.2.1.3-src.tar.gz 中【不存在 test/ 目录】
#   （包内目录仅：CMakeLists.txt、data/、infos/、resources/、src/、translations/、
#    resources.qrc、icone.rc），因此上游测试目标无源码、无法构建/运行。
#   本项目 ENABLE (BUILD_TEST=OFF)，未修改任何上游测试用例。

package: previsat/7.2.1.3
homepage: "http://previsat.free.fr/"

# 上游测试命令（源码包内无 test/src，ctest 无用例）
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：7.2.1.3 发布包不含 test/ 目录，无法运行
upstream_tests: []

# test_package 中自带的测试（消费者视角、运行时行为验证）
test_package_tests:
  - file: test.sh
    description: "鸿蒙特有功能测试：以 offscreen QPA 无头启动安装后的 PreviSat（已签名 ELF），验证依赖链（含 Qt6 Sql/Multimedia）可加载、可重定位数据根（bin/data、bin/translations）被使用、运行期生成 log/data/config 等目录并记录 XML 数据加载进度、Qt QSQLITE 驱动可打开卫星库"
    command: "bash test.sh"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 5
