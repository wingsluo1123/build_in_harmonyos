# conandata.yml — procps-ng 4.0.6
sources:
  url: "https://downloads.sourceforge.net/project/procps-ng/Production/procps-ng-4.0.6.tar.xz"
  sha256: "67bea6fbc3a42a535a0230c9e891e5ddfb4d9d39422d46565a2990d1ace15216"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "0001 config.guess HarmonyOS triplet recognition (aarch64-unknown-linux-ohos), skipping the compile based guess that needs a writable tmp dir"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "0002 configure: umask 077 to 022 for the mktemp scratch dir (HMDFS setgid quirk), plus a HAVE_UTMPX_FUNCS probe next to the utmpx header check"
    patch_type: "portability"
  - patch_file: "patches/0003-library-sort.c.patch"
    patch_description: "0003 library/sort.c: keep upstream's version sort fallback (local/strverscmp.c) in the library when configure does not find strverscmp() in the libc"
    patch_type: "portability"
  - patch_file: "patches/0004-src-w.c.patch"
    patch_description: "0004 src/w.c: select the utmpx/utmp accessor family from the probed HAVE_UTMPX_FUNCS instead of the utmpx.h header check"
    patch_type: "portability"
