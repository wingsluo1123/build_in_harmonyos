knowledge_gained:
  - "HarmonyOS PC 的 config.guess 盲区：老式分支模型不认识 HarmonyOS，回落编译探测需要可写临时目录而沙箱不给 → 必须直接加 HarmonyOS 分支输出三元组"
  - "HMDFS 坑（再次证实）：configure 的 `(umask 077 && mktemp -d ...)` 目录回来是 0700 且拒所有者写入 → config.status 报 could not setup config files machinery；umask 077→022 即解"
  - "OHOS 的 utmpx.h 只有 struct 与常量，不声明也不导出 getutxent/setutxent/endutxent（libc 只导出 getutent/setutent/endutent/utmpname）——上游的 HAVE_UTMPX_H 头文件探测会选错访问族；正确做法是加函数级探针 HAVE_UTMPX_FUNCS"
  - "OHOS libc 缺 strverscmp：上游 configure 已有 HAVE_STRVERSCMP 探测，且自带 local/strverscmp.c 备用实现，宿主挂到 library/sort.c 即可，无需新增平台宏"
  - "HarmonyOS PC 不带 terminfo 数据库：ncurses 程序（top/watch）在批处理模式下也会因 setupterm 失败而非零退出且**零输出**，须把 ncurses 包的 share/terminfo 指给 TERMINFO/TERMINFO_DIRS"
  - "设备的 sleep 是 toybox 符号链接，subprocess 经 PATH 解析不到（FileNotFoundError）——测试自造常驻进程应改用包内工具（如 vmstat 1）"
  - "procps-ng 是单一顶层 Makefile（非递归）构建，libproc2 装到 include/libproc2/、.pc 给 -lproc2；PIDS_VAL(相对索引, 类型, stack) 为三参访问宏"
  - "发布 tarball 形态下探针只能落预生成 configure：改 configure.ac 会触发 aclocal/automake 维护规则，而 HarmonyOS PC 构建机没有这些工具"

