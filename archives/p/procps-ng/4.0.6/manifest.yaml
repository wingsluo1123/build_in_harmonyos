      check: "procps_linux_version()"
      reason: "osrelease 为 'HongMeng Kernel 1.12.0' → 函数按文档契约返回 -ERANGE（测试断言 >0）；平台事实，未修改上游源码"
  upstream_not_run_detail:
    - suite: 'dejagnu 验收套件（24 个用例文件）'
      reason_primary: '上游 configure.ac:359 用 AM_CONDITIONAL(LINUX, test "x$host_os" = xlinux-gnu) 门控 testsuite/Makefile.am:15-47 的全部 DEJATOOL 注册块；本平台 host_os = linux-ohos ≠ linux-gnu → LINUX 为假 → 套件在 OHOS 上不被注册（此处 make check 并不报 could not find runtest，而是 DEJATOOL 展开为空、0 个工具被注册）'
      evidence_primary: '构建树 config.status 记 S["LINUX_TRUE"]="#"，且 make -C testsuite check 实跑输出 l=''     ''（空 DEJATOOL）'
      reason_secondary: '补齐框架后复验仍不可跑：装入仓库内已适配 OHOS 的 dejagnu/1.6.3.1 + expect/5.45.4 + tcl/8.6.14（ohpcd 制品仓有 OHOS 二进制；runtest --version 实测 = DejaGnu 1.6.3 / Expect 5.45.4 / Tcl 8.6），越过注册门控手工跑 free 工具：被测程序输出正确，但 expect 每次 spawn 都注入 sh: /bin/stty: inaccessible or not found（系统镜像无 /bin/stty，exp_tty.c 的 EXP_STTY 规避只覆盖一个调用点且实测不生效），击穿用例首行锚定正则 → free 单个工具即 14 FAIL / 1 unresolved（testsuite/free.sum）'
      decision: '不改上游 .exp、不往镜像塞 /bin/stty、不把 dejagnu/expect/tcl 加进 tool_requires（LINUX 门控下加了也不会执行，徒增构建期依赖）'
  note: '主 N = 24（dejagnu 用例资产口径，与平台评审脚本口径一致）；N′ = 8（automake TESTS 全部进入执行，7 通过 / 1 平台事实失败）'
  test_package: "conan create 退出码 0：libproc2 C 消费者（CMakeDeps 链接 procps-ng::procps-ng，互校 loadavg/uptime/utmp 用户数/全 pids 走查）+ 10 项命令行工具实测（free/uptime/ps/vmstat/top -b/w/sysctl/pgrep/pidof/pkill，其中 pkill 断言 SIGTERM 退出码 -15）"

