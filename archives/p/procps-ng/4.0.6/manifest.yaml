patches_applied:
  - 0001-config.guess.patch
  - 0002-configure.patch
  - 0003-library-sort.c.patch
  - 0004-src-w.c.patch

patch_detail:
  - file: 0001-config.guess.patch
    purpose: "config.guess 增加 HarmonyOS 识别分支：tarball 自带版本不认识 HarmonyOS，回落到需要可写临时目录的编译探测并失败（cannot guess build type）"
    lines_changed: 12
    guard: "无平台宏：config.guess 的 os 判定分支，输出 aarch64-unknown-linux-ohos"
  - file: 0002-configure.patch
    purpose: "configure：(a) 内嵌临时目录创建 umask 077→022（HMDFS 上 0700 目录拒所有者写入，config.status 写 subs1.awk 被拒）；(b) 新增中性功能探针 HAVE_UTMPX_FUNCS（AC_CHECK_FUNCS([getutxent setutxent endutxent])）"
    lines_changed: 25
    guard: "HAVE_UTMPX_FUNCS（中性 autoconf 功能宏，非平台宏）"
  - file: 0003-library-sort.c.patch
    purpose: "以库内 library/sort.c 为宿主载入上游自带备用实现 local/strverscmp.c，修补 OHOS libc 缺 strverscmp 导致的链接失败"
    lines_changed: 15
    guard: "HAVE_STRVERSCMP（上游 configure 已有该探测；OHOS 上为未定义）"
  - file: 0004-src-w.c.patch
    purpose: "src/w.c 由 HAVE_UTMPX_H（仅头文件存在）改为按 HAVE_UTMPX_FUNCS 选 utmp 访问族：OHOS 的 utmpx.h 不声明也不导出 getutxent/setutxent/endutxent"
    lines_changed: 14
    guard: "HAVE_UTMPX_FUNCS（同上，中性功能宏）"

compatibility:
  level: high
  issues:
    - "procps_linux_version()（library/version.c）在 HarmonyOS PC 上返回负错误码 -ERANGE：/proc/sys/kernel/osrelease 为 'HongMeng Kernel 1.12.0'，sscanf(\"%u.%u.%u\") 零转换；上游的 /proc/version 回退路径亦不可用（该文件 EACCES）。硬造版本号会让调用方的内核特性门控误判，故不改源码"
    - "top/watch 需运行时提供 terminfo：设备不带 terminfo 库，须把所用 ncurses 的 share/terminfo 指给 TERMINFO/TERMINFO_DIRS，否则批处理 top -b 亦静默以非零码退出"
  notes: "可执行程序（ps/top/free/uptime/vmstat/pgrep/pkill/pidof/sysctl/w）与 libproc2 在真机上端到端可用；上游套件 8 项中 7 项通过"

