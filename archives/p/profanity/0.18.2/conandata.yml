# conandata.yml -- profanity 0.18.2
# Official release archive (homepage: https://profanity-im.github.io/).
# Mirror first (ci/conan/build_and_test.sh GitHub mapping: gh-proxy.com),
# official URL last as fallback. sha256 is the official tar.xz checksum.

sources:
  url:
    - "https://gh-proxy.com/https://github.com/profanity-im/profanity/releases/download/0.18.2/profanity-0.18.2.tar.xz"
    - "https://github.com/profanity-im/profanity/releases/download/0.18.2/profanity-0.18.2.tar.xz"
  sha256: "46964928742733fffcf8ca65d37ac0874c8ccd6270cbc065cb1013cee94e9e3b"

# Vendored libstrophe 0.14.0 (statically linked into the profanity binary).
# Upstream `make dist` release tarball -- it SHIPS a pre-generated
# `configure`, so no autoreconf (and no autoconf/automake/libtool at all)
# is needed. Deliberately NOT the GitHub-archive snapshot: that tree has no
# `configure`, and bootstrapping it would require autoconf whose conancenter
# m4 dependency dies on真机 (`/data/service/hnp/bin/bash: inaccessible or
# not found`). Mirror first, official release URL as fallback.
libstrophe_sources:
  url:
    - "https://gh-proxy.com/https://github.com/strophe/libstrophe/releases/download/0.14.0/libstrophe-0.14.0.tar.gz"
    - "https://github.com/strophe/libstrophe/releases/download/0.14.0/libstrophe-0.14.0.tar.gz"
  sha256: "d079668474d5c3aa4555347c33e77014a1071629603557cc506a6bc6f82e01f5"
