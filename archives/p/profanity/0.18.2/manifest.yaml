# Version manifest -- profanity 0.18.2
version: "0.18.2"
software: "profanity"
status: built
build_date: "2026-10-19"
build_system: meson

source:
  url: "https://github.com/profanity-im/profanity/releases/download/0.18.2/profanity-0.18.2.tar.xz"
  sha256: "46964928742733fffcf8ca65d37ac0874c8ccd6270cbc065cb1013cee94e9e3b"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dtests=true (builds the cmocka `unittests` binary)"
    - "all optional features stay at upstream default disabled"
  dependencies:
    - "glib/2.84.0.1"
    - "ncurses/6.6"
    - "readline/8.3"
    - "curl/8.15.0.1"
    - "sqlite3/3.49.1"
    - "expat/2.8.2.1.1 (vendored libstrophe backend)"
    - "openssl/3.5.6.1 (vendored libstrophe backend)"
    - "zlib/1.3.1.1 (vendored libstrophe backend)"
    - "libstrophe/0.14.0 VENDORED static (no conan requires; see notes.md)"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches-libstrophe/0001-src-auth.c.patch (vendored libstrophe tls_free rename)"
  - "patches-libstrophe/0002-src-conn.c.patch (vendored libstrophe tls_free rename)"
  - "patches-libstrophe/0003-src-tls.h.patch (vendored libstrophe tls_free rename)"
  - "patches-libstrophe/0004-src-tls_dummy.c.patch (vendored libstrophe tls_free rename)"
  - "patches-libstrophe/0005-src-tls_openssl.c.patch (vendored libstrophe tls_free rename)"

testing:
  upstream_tests:
    - name: "unit tests"
      status: "integrated"
      command: "conanfile.py build() runs the cmocka `unittests` binary"
    - name: "functional tests"
      status: "skipped"
      command: "needs stabber XMPP stub server + libutil, neither on OHOS"
      reason: "environment: no stabber recipe in registry, bionic has no libutil"
  test_package_tests:
    - name: "profanity --version"
      test_command: "test_profanity <pkg>/bin/profanity (output contains 0.18.2)"
      assertion_count: 1
    - name: "profanity --help"
      test_command: "test_profanity <pkg>/bin/profanity (exit code 0)"
      assertion_count: 1

knowledge_gained:
  - "Upstream 0.18.x builds only with Meson (Autotools removed in 0.18.0)"
  - "Optional features must be explicitly enabled; minimal build needs no extra flags"
  - "meson test registers 'unit tests' (cmocka) + 'functional tests' (stabber+libutil)"
  - "cmocka test dependency via test_requires keeps it out of the app package"
