software: profanity
display: "Profanity"
description: "Console based XMPP client written in C using ncurses and libstrophe"
category: network
homepage: "https://profanity-im.github.io"
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson-only build (Autotools removed upstream in 0.18.0)"
    - "Minimal client: all optional features stay disabled"
    - "Unit tests via cmocka test_requires; functional tests skipped (no stabber/libutil on OHOS)"
  common_dependencies:
    - glib
    - libstrophe
    - ncurses
    - readline
    - curl
    - sqlite3

versions:
  "0.18.2":
    status: built
    build_date: "2026-10-19"
