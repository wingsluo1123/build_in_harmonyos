# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: proj/9.3.1
homepage: "https://proj.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# proj 9.3.1 上游使用 CTest，构建时 BUILD_TESTING=OFF 未集成
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者功能测试：验证 proj_info/proj_create_crs_to_crs/proj_trans API"
    command: "./test_proj"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
