# test_package/MANIFEST.yml
package: proj/9.3.1
homepage: "https://proj.org/"

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/unit/CMakeLists.txt
    source: proj-9.3.1/test/unit
    description: "C/C++ API unit tests registered by CMake"
    command: "ctest -R 'proj_|gie_self_tests|test_'"
  - file: test/cli/CMakeLists.txt
    source: proj-9.3.1/test/cli
    description: "CLI script tests for proj/cs2cs/cct/geod/gie/projinfo"
    command: "ctest -R 'test27|test83|testproj|testinvproj|testvarious|testdatumfile|testIGNF|testntv2|testprojinfo|testcct|test_projsync'"
  - file: src/tests/CMakeLists.txt
    source: proj-9.3.1/src/tests
    description: "Geodesic C tests"
    command: "ctest -R geodesic"

test_package_tests:
  - file: test_proj.cpp
    description: "Consumer test: version query, context lifecycle, pipeline transform, invalid pipeline rejection, and geodesic inverse calculation"
    command: "./test_proj"

assertion_count: 6
