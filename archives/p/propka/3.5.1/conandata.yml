# 上游测试数据（**仅测试用、不进产物**）：官方 sdist 带 `tests/*.py` 但**不带测试数据**
# （`pdb/`、`results/` 未随 sdist 发布；测试代码找不到会直接
# `FileNotFoundError: Can't find pdbs test files …`），故钉死上游仓库 tag v3.5.1 归档补齐。
test_assets:
  url: "https://codeload.github.com/jensengroup/propka/tar.gz/refs/tags/v3.5.1"
  sha256: "e7357db9dfbeeee5ea67791e09710557980555808371253c674ae4f13b9c22f0"
  filename: "propka-3.5.1-repo.tar.gz"
  note: >-
    仅用于 build() 内提供 `tests/pdb`（PDB 输入）与 `tests/results`（期望结果），
    按上游方式跑 pytest；**不进包产物**。
