software: protobuf
version: '21.12'
status: published
build_date: '2026-07-03'
compile_date: '2026-07-03'
build_system: cmake
source:
  url: https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protobuf-all-21.12.tar.gz
  sha256: '2c6a36c7b5a55accae063667ef3c55f2642e67476d96d355ff0acb13dbb47f09'
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - -DCMAKE_BUILD_TYPE=Release
    - -Dprotobuf_BUILD_TESTS=OFF
    - -Dprotobuf_BUILD_SHARED_LIBS=OFF
    - -Dprotobuf_BUILD_PROTOC_BINARIES=ON
    - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
  dependencies:
    - zlib/1.3.1@ohpcd/stable
  makedepends: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - E092: CMake does not recognize HarmonyOS as target platform, fixed with CMAKE_SYSTEM_NAME=Linux
  - E001: Compiler path in conan profile needs to point to correct clang location
