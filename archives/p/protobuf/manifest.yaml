software: protobuf
display: "Protocol Buffers"
description: "Google's data serialization format library and compiler"
category: data
homepage: "https://github.com/protocolbuffers/protobuf"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 不识别 HarmonyOS 平台，需设置 CMAKE_SYSTEM_NAME=Linux (E092)"
    - "CMake 配置：-Dprotobuf_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release"
    - "ELF 签名限制：Conan cache 中的 protoc 未签名，test_package 需预生成 proto 代码"
    - "静态编译（BUILD_SHARED_LIBS=OFF）避免动态库 RPATH 问题"

versions:
