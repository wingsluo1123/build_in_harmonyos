build:
  system: custom
  # 2026-10-13 零重跑更正：configure 为上游作者手写脚本（291 行，无 AC_INIT/configure.ac/Makefile.am，
  # `grep -c 'Generated by GNU Autoconf'`=0），配方按 archives/l/libudns/0.6 成例就地 configure+make，
  # 不经任何 autoconf/automake helper ⇒ 取仓内在用值 custom，与 notes.md:4/222 同源。
  configure_options:
    - "./configure 无命令行选项可用（除 --help 一律 unknown option），CC 由环境变量注入"
    - "make -j2 proxycheck proxylogger（all: 只含 proxycheck，proxylogger 需显式目标）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-event-selftest-callback-signatures.patch (strip=1)"

knowledge_gained:
  - "手写 configure 的 12 项探针在 OHOS SDK clang 15.0.4 + musl 下全绿：socket/gethostbyname/sys/select.h/poll/epoll/memmem 均由 musl 提供，无需 -lsocket -lnsl -lresolv"
  - "event.c 的 glibc _syscall* 裸 syscall 回退路径由 #if IMPLEMENT_LINUX_EPOLL 关闭（上游任何地方都不定义该宏），因此 musl 下不会走到 __NR_epoll_* 缺宏的死代码"
  - "上游无 install/check 目标：二进制与 man1/man3 手册页在 package() 手动 staging；make -n check 报 No rule to make target 'check'"
  - "event.c 的 #if TEST 自检块（919-964）在 OHOS clang 下真机取证：改前 clang -DTEST 编译通过但 5 条告警（4 条 -Wincompatible-function-pointer-types @930/942/956/958）、运行 rc=139 SIGSEGV；打补丁对齐 ev_tm_cbck_f/ev_io_cbck_f 后编译告警降为 1（仅剩 SDK sys/poll.h 重定向）、运行 rc=0 且输出 input: x。配方在 build() 内显式编译并执行该自检（stdin 必须是管道：epoll 对 /dev/null 返回 EPERM，io 回调永不触发）"

