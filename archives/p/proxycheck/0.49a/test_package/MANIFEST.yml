# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: proxycheck/0.49a
homepage: "https://www.corpit.ru/mjt/proxycheck.html"

# 上游测试命令: 上游 Makefile.in 无 check 目标（本配方的自检执行命令见 upstream_test_command）
# 实测 `make -n check` -> make: *** No rule to make target 'check'. Stop.
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 上游自身 source_declared_total 仍为 0（无 tests/ 目录、无测试框架、无 make check 目标，
# 且从未编译 event.c 的 #if TEST 块 —— 不谎称上游注册过）。
# 本配方把上游自带的 event 层自检显式注册进 build() 并真实执行（详见 notes.md 五维账本）。
upstream_test_in_build: true
upstream_test_command: "clang -DTEST -o event_selftest event.c; printf x | timeout 20 ./event_selftest | 断言 input: x"

# 实际注册并运行的测试程序（注册方=本配方 build()，非上游构建系统）
upstream_tests:
  - name: event_selftest
    origin: "上游 event.c:919-964 的 #if TEST 自检块（上游从不编译）+ 本归档补丁 0001-event-selftest-callback-signatures.patch"
    registered_by: "conanfile.py build()（配方新增注册；上游 N_static 仍为 0）"
    executed_in_build: true
    run_rc: 0
    stdout: "evio method: epoll / input: x"
    before_patch: "COMPILE_RC=0 + 5 warnings, RUN_RC=139 SIGSEGV"
    after_patch: "COMPILE_RC=0 + 1 warning, RUN_RC=0"

# 披露：上游存在 1 个「未注册」的自检块，未被任何构建目标编译，因此不计入 N_registered，
# 但必须如实登记（否则正文写 "上游无测试" 构成少报）。真机取证见 notes.md「上游测试枚举台账」。
unregistered_upstream_test_blocks:
  - file: event.c
    lines: "919-964"
    guard: "#if TEST"
    kind: "上游自带 event 层自检/演示 main()"
    registered_in_build: false
    probe_compile_rc: 0            # clang -DTEST 单独编译通过（OHOS SDK clang 15.0.4）
    probe_run_rc: 139              # SIGSEGV：TEST 块回调签名与 typedef 漂移（上游自身缺陷，跨平台）
    warnings: "4x -Wincompatible-function-pointer-types (event.c:930/942/956/958)"
    registered_by_this_recipe: true
    patched: true
    run_rc_after_patch: 0
    disposition: "2026-10-12 统筹裁定①：补两行回调签名（patches/0001-event-selftest-callback-signatures.patch）后由 build() 显式编译并执行；改前/改后同源对照读数与输入形态实测见 notes.md"

# test_package 中自带的测试 (消费者视角验证，执行已安装二进制并断言退出码/输出)
test_package_tests:
  - file: smoke.sh
    description: "消费者测试：调用包内 proxycheck/proxylogger，7 条断言覆盖版本宏代入、帮助与协议表、用法错误码、回环端口真实探测（socket + epoll 事件循环）、.invalid 解析失败、proxylogger 的 inetd socket 契约、man1/man3 手册页 staging；全部离线确定性"
    command: "bash smoke.sh"

