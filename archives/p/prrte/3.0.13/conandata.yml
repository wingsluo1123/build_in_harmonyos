# conandata.yml — prrte 3.0.13
# Source URL + hash + patches declaration.

sources:
  url: "https://github.com/openpmix/prrte/releases/download/v3.0.13/prrte-3.0.13.tar.gz"
  sha256: "81c27025182a26e90b0bb6aa67929a9313186fbd43964fc6d8734ce5cecd00ae"

patches:
  - patch_file: "patches/0001-config-guess-ohos.patch"
    patch_description: "config.guess: recognize HarmonyOS (aarch64-unknown-linux-ohos) and relax umask 077→022 for HMDFS mktemp compatibility"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "config.sub: accept ohos OS (ohos-linux map, OS whitelist, kernel-os whitelist) so linux-ohos triplets validate"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: "configure/config.status: relax embedded umask 077→022 so mktemp -d temp dir is writable on HMDFS (E011)"
    patch_type: "portability"
  - patch_file: "patches/0004-plm-ssh-strrchr.patch"
    patch_description: "plm_ssh_module.c: replace BSD legacy rindex() with standard strrchr() (absent from OHOS libc)"
    patch_type: "portability"
