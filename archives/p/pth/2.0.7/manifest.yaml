software: pth
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.7"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/pth/pth-2.0.7.tar.gz"

  # 源码校验和
  sha256: "72353660c5a2caafd601b20e12e75d865fd88f6cf1a088b306a3963f0bc77232"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-shared"
    - "--prefix=/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-shtool.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony 无 makecontext/swapcontext，但支持 sigsetjmp/siglongjmp + sigaltstack，configure 正确检测为 sjlj/ssjlj/sas"
  - "HMDFS 文件系统不支持 mkfifo，make jobserver 失效，必须使用 make -j1"
  - "HMDFS 上 umask 077 导致临时目录创建后不可访问，需改为 umask 022"
  - "configure 的 Linux braindead 检测在缺少 features.h 时会覆盖正确的 sjlj 结果，需修复"
  - "/tmp 是只读文件系统，需用 ${TMPDIR:-/tmp} 替代硬编码的 /tmp 路径"
  - "pth 的 Makefile 使用相对路径 (./shtool)，Conan 配方需设置 in-source 构建 (folders.build='.')"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/pth-2.0.7.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/pth-2.0.7.work
  source_orig_hash: f78092f23f219659
  source_work_hash: b490475d002cba44
  generated_at: '2026-06-26T05:34:36'
  patches_count: 4

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-shtool.patch
    type: auto
    platform_only: True
    guard: 'pending'
