# 软件级 manifest
# 文件位置: archives/p/puf/manifest.yaml
# 版本级细节见 1.0.0/manifest.yaml

software: puf
display: "puf"
description: "Parallel URL fetch utility (wget-like HTTP downloader)"
category: utility
homepage: "https://sourceforge.net/projects/puf/"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 Autotools C 命令行工具，仅产出 bin/puf，无库 API、无上游测试"
    - "configure.in 仅做 xnet/socket/nsl/snprintf 检查，bionic libc 直接满足，无外部依赖"
    - "--prefix=/ 使 make install 落到 package_folder/bin 直下"
    - "OHOS shell：不覆写 SHELL/CONFIG_SHELL，放行 profile 的 /data/service/hnp/bin/bash；强制 /bin/sh shim 会让 configure 在真机 fork/exec 子进程失败"
    - "test_package 用本地 HTTP 回环抓取验证并行下载核心能力"
  common_dependencies: []

versions:
  "1.0.0":
    status: built
    build_date: "2026-10-10"
