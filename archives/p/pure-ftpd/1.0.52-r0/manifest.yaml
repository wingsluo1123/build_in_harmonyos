software: pure-ftpd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.52-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.52-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# 构建系统（顶层，供自检）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.pureftpd.org/pub/pure-ftpd/releases/pure-ftpd-1.0.52.tar.gz"

  # 源码校验和
  sha256: "1126f3a95856d08889ff89703cb1aa9ec9924d939d154e96904c920f05dc3c74"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=${prefix}"
    - "--disable-dependency-tracking"
    - "--with-everything"
    - "--with-tls"
    - "--with-altlog"
    - "--with-puredb"
    - "--with-extauth"
    - "--with-cookie"
    - "--with-throttling"
    - "--with-ratios"
    - "--with-quotas"
    - "--with-ftpwho"
    - "--with-uploadscript"
    - "--with-virtualhosts"
    - "--with-virtualchroot"
    - "--with-diraliases"
    - "--with-peruserlimits"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-src-ftpd.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "struct statvfs64 在 OHOS 上未完整定义（forward declaration only），configure 检测为 false positive，需在 ftpd.h 中用 __OHOS__ 守卫"
  - "config.status 使用 mktemp -d 创建临时目录时，在 OHOS 上目录属主为 20001006（file_manager），umask 077 导致当前用户无法写入，需改为 umask 022"
  - "pure-ftpd 是命令行工具（FTP daemon），构建产物为可执行文件，需声明 commands.json"
  - "OpenSSL 静态库（.a）来自 conan 制品仓 openssl/1.1.1w，通过 CPPFLAGS/LDFLAGS 传递"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/pure-ftpd-1.0.52-r0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/pure-ftpd-1.0.52-r0.work
  source_orig_hash: ec3497c855f2a15f
  source_work_hash: b99bb9a1f5dd3ec2
  generated_at: '2026-08-08T04:09:48'
  patches_count: 3

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
