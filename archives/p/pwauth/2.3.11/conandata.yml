# conandata.yml — pwauth 2.3.11
#
# 源码来源说明 (R39):
#   上游 Google Code 项目 (code.google.com/p/pwauth) 已下线；GitHub 镜像
#   https://github.com/phokz/pwauth 只有 pwauth-2.3.10 标签，没有 2.3.11 标签，
#   无法用 GitHub release/标签归档取得 2.3.11。因此使用 Debian 源码池中的
#   orig.tar.gz —— Debian 的 orig 包即未经修改的上游发布包，属权威镜像。
#   主源与清华镜像已分别下载并校验 sha256 一致（见 notes.md）。

sources:
  url:
    - "https://deb.debian.org/debian/pool/main/p/pwauth/pwauth_2.3.11.orig.tar.gz"
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/p/pwauth/pwauth_2.3.11.orig.tar.gz"
  sha256: "3c6ab789d6ec92984954b4217418781508df393639adc32514d8491d8825fa22"

patches:
  - patch_file: "patches/0001-config.h-ohos-defaults.patch"
    patch_description: "0001 config.h OHOS PAM defaults"
    patch_type: "portability"
  - patch_file: "patches/0002-main.c-ohos-portability.patch"
    patch_description: "0002 main.c OHOS portability"
    patch_type: "portability"
  - patch_file: "patches/0003-auth-pam.c-ohos-test-confdir.patch"
    patch_description: "0003 auth_pam.c optional PAM confdir for end-to-end tests"
    patch_type: "portability"
