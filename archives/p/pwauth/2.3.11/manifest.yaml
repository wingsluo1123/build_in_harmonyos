known_risks:
  - "端到端成功链路依赖 linux-pam 包当前提供的 pam_permit 模块（真机实测 pam_start_confdir/pam_authenticate/pam_acct_mgmt 全 0，pwauth 退出码 0）；这是模块级的真实认证链路，但不是“真实系统口令”校验——OHOS 的 linux-pam 未构建 pam_unix，真实口令认证需后续单独适配。"
  - "补丁 0003 的 PWAUTH_PAM_CONFDIR 钩子只在 getuid()==geteuid()（非提权）时生效，setuid 安装始终走系统 PAM 配置；若审核认为连这个条件也不可接受，可改为编译期开关（默认关闭）。"
  - "L2 冒烟检出 '--version/--help'：pwauth 不支持这两个参数（它会读 stdin 并以 51 退出），真机实测 L2 为 skip/warn（CI 中该步非阻塞），真实 CLI 验证由 L1（test_package 7/7）承担。"
