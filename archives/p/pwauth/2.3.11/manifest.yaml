    - "隔离 CONAN_HOME 下 conan source：从主源下载源码并通过 sha256 校验，strip_root 后源码位于根目录"
    - "python -m py_compile conanfile.py test_package/conanfile.py"
    - "python 校验 conandata.yml / manifest.yaml / test_package/MANIFEST.yml 可解析，commands.json 为合法 JSON"
    - "用 patch_ng（Conan apply_conandata_patches 的实际实现，strip=0）在 conan source 解出的源码树上应用两个补丁：APPLY OK"
    - "脚本核对 config.h 8 处宏与 main.c 的 int main / memset：全部符合预期"
    - "CI L0 门禁静态复核：L0a-L0h、L0k、L0m、L0n 全部满足（L0i 依赖已发布，L0j 该版本尚未发布）"
