# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 本包为 Conan 自定义测试（L1 级别），非上游官方测试套件。
# 上游 pxr/base/ts 自带 C++/Python 测试（testenv/testTsSplineAPI.cpp 等），
# 但它们由 PXR_BUILD_TESTS 控制，且依赖 tsTest 框架与 Python 绑定；
# 本配方以 PXR_BUILD_TESTS=OFF 构建（沿用同族 pxr-vt / pxr-gf / pxr-kind 的
# 既定做法），故此处为等价的 C++ 烟雾测试。
# 测试内容：TsSpline 构造 / 值类型 / 结点插入 / 求值，
# 以及依赖闭包 arch (ArchStrerror) / tf (TfGetenv) / vt (VtValue) /
# gf (GfVec3d) 的基础接口。

test_level: L1
test_type: conan_test_package
upstream_tests: none
description: "Smoke test for pxr-ts: TsSpline construct/knot/eval plus arch/tf/vt/gf bundled interfaces"
