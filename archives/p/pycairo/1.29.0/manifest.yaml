version: "1.29.0"
status: adapting
build_system: meson

source:
  url: "https://github.com/pygobject/pycairo/archive/refs/tags/v1.29.0.tar.gz"
  sha256: "25c6a8a5a488afdd21208b5a71f95796891cceb2ee94f2ec1c51fdf0735eab0b"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dtests=false"
  dependencies:
    - "cairo/1.18.4"
    - "Python 3.12 interpreter supplied by the build environment"

test:
  package_test: "python3 test.py"
  assertions: 6
  upstream: "pytest is required by the upstream test suite and is probed during device validation."
