# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pydl/1.0.1
homepage: "https://github.com/weaverba137/pydl"

# 上游测试命令 (pytest，需 astropy/scipy 运行环境)
upstream_check_command: "pytest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（sdist 含 conftest.py + pydl/tests/test_pydl.py，
# 依赖 astropy/scipy；本环境已安装 astropy 8.0.1 + scipy 1.18.0）
upstream_tests:
  - file: pydl/tests/test_pydl.py
    source: pydl-1.0.1/pydl/tests/test_pydl.py
    description: "pydl 单元测试（pytest）"
    command: "pytest pydl/tests/"

# test_package 中自带的测试 (消费者视角验证, 真实导入 pydl)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试: PYTHONPATH 加载打包的 pydl 并断言版本 1.0.1"
    command: "python -c 'import pydl'"

# 测试断言总数（版本断言；上游 pytest 用例数待 test_package 实测补充）
assertion_count: 1
