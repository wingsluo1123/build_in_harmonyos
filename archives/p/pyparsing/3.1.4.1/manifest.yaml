      可选依赖）后运行 python3 -m pytest tests/test_unit.py tests/test_simple_unit.py，
      1690/1690 全部通过（含 1475 subtests）。本机 pytest 9.1.1 可用，
      "无外网无法复现 pytest 框架"不成立。test_diagram.py 需 railroad 依赖，
      安装后同套件一并通过。
  consumer:
    test_package: "5 断言 smoke test 通过"

knowledge_gained:
  - "纯 Python 库使用 setuptools 安装，不需要传统编译"
  - "pyparsing 是纯 Python 实现，无平台依赖"
  - "上游测试用 pytest（1690 用例），需 railroad-diagrams 可选依赖（diagram 模块 import railroad）；安装后实测 100% 通过"
