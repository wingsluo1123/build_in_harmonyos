package: pyparsing/3.1.4.1
homepage: "https://github.com/pyparsing/pyparsing"

# 上游测试命令 — pyparsing 上游使用 pytest
upstream_check_command: "python3 -m pytest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: pyparsing-3.1.4/tests/
    description: "上游 pytest 测试套件（test_unit.py + test_simple_unit.py）"
    command: "python3 -m pytest tests/test_unit.py tests/test_simple_unit.py"
    ran: true
    result: "1690 passed / 0 failed（实测，需 pytest + railroad-diagrams 依赖）"
    note: >
      2026-08-11 实测：安装 railroad-diagrams（上游 pyproject.toml 声明为 diagram
      可选依赖，pip install railroad-diagrams 成功）后，上游测试 1690/1690 全部
      通过（0 失败），含 1475 subtests。之前 PR body 声明"设备无外网无法复现
      pytest 框架"不成立——本机 pytest 9.1.1 可用且测试可真实运行。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: 模块导入 + 基本解析 + DOT 语法兼容验证"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
