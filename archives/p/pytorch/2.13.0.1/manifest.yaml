# pytorch 2.13.0 — HarmonyOS PC (aarch64) 适配（修订 2.13.0.1）
software: pytorch
version: "2.13.0.1"
status: built
build_date: "2026-09-25"
build_system: cmake
source:
  url: "https://github.com/pytorch/pytorch/archive/refs/tags/v2.13.0.tar.gz"
  sha256: "b36fbbc96f89185666047c44167e7f8ebc9cadaf7a3e7ef75c85d25b1285c0b4"
dependencies:
  # 2.13.0.1: OpenBLAS gives real LAPACK + optimized GEMM; without it the build
  # falls back to the bundled Eigen BLAS (no LAPACK at all).
  required:
    - "openblas/0.3.34"
  optional:
    - "clang/22.1.8 (tool_requires)"
    - "python/3.12.9 + pyyaml/6.0.2 + typing-extensions/4.16.0 + packaging/26.3 (tool_requires, BUILD_PYTHON codegen)"
patches_applied:
  - "0001-pytorch-ohos-adapt.patch"
  - "0002-cpuinfo-ohos.patch"
  - "0003-sleef-ohos-aarch64.patch"
  - "0004-c10-enumerate-ssize-musl.patch"
  - "0005-googletest-captured-stream-tmpdir.patch"
  - "0006-c10-test-targets-cxx20.patch"
  - "0007-shm-manager-cxx20.patch"
  # 2.13.0.1 新增：分布式（c10d + Gloo + TensorPipe）在 OHOS 上的门控与 musl 适配
  - "0008-gloo-tcp-transport-ohos.patch"
  - "0009-libuv-linux-gating-ohos.patch"
  - "0010-gloo-linux-cc-musl.patch"
  - "0011-gloo-tcp-sources-ohos.patch"
  # 2.13.0.1 新增：NNPACK 家族（NNPACK/QNNPACK/XNNPACK）平台门控放行
  - "0012-nnpack-family-ohos-platform-gating.patch"
  # 2.13.0.1 新增：oneDNN 内置 xbyak_aarch64 的 musl 兼容（glibc 专有 _SC_LEVEL*_CACHE_SIZE）
  - "0013-xbyak-aarch64-musl-cache-sysconf.patch"
  # 2.13.0.1 新增：libkineto 的 C++20 ranges 算法在 libc++ 15 下的可移植改写
  - "0014-kineto-ranges-libcxx15.patch"
  # 2.13.0.1 新增：默认量化引擎在 aarch64 上改为 QNNPACK
  # （上游用 fbgemmSupportedCPU() 做判据，FBGEMM 在 ARM 上也返回真 → 默认 kX86，
  #  而 kX86 派发的内核是 avx2/avx512 专用，首个量化算子即抛 "unknown architecure"）
  - "0016-context-default-qengine-aarch64.patch"
  # 2.13.0.1 新增：oneDNN 的 aarch64 JIT 在「拿不到可执行内存」的进程里自动降级
  # （新增 at::isMKLDNNJitUsable() 运行时探测，只门控派发；hasMKLDNN() 仍如实报真）
  - "0017-context-mkldnn-jit-runtime-gate.patch"
  # 2.13.0.1 新增：ITT 的架构门控放行（上游 cmake_dependent_option(..., ON "CPU_INTEL" OFF)）
  - "0018-itt-enable-aarch64.patch"
  # 2.13.0.1 新增：qnnpack/xnnpack 的 add 对 0 维标量张量的分派修正
  - "0019-qnnpack-add-scalar-and-empty.patch"
  # 2.13.0.1 新增：pow 向量体指数窄化修复（cast_scalar_t -> scalar_t 往返丢信息时走标量路径）
  - "0020-pow-vector-exponent-narrowing.patch"
  # 2.13.0.1 新增：量化 zero_point 与舍入次序在 ARM 上与 ATen/测试参考一致
  #（USE_FBGEMM=ON 后 aarch64 走 fbgemm LEGACY 路径，halfway 值差 1）
  - "0021-quantize-zero-point-rounding-order-arm.patch"
  # 2.13.0.1 新增：Half 融合算子（fmadd/fnmadd/fmsub/fnmsub）回落分支改 fp32 累加
  #（无 -march 时 __ARM_FEATURE_FP16_VECTOR_ARITHMETIC 未定义，原回落用 fp16 双舍入，
  #  与 OpMathType<Half>=float 的约定不符 → vec_test BitwiseFloatsAdditional 3 例）
  - "0022-half-fmadd-fp32-fallback.patch"
  # 2.13.0.1 新增：vec_test 目标在 OHOS 上关循环向量化（clang22 -O2+ 对该测试自身
  #  字节拷贝脚手架的误优化 → Memory/UnAlignedLoadStore 4 例；仅作用于测试目标）
  - "0023-vec-test-clang-no-vectorize-ohos.patch"
  # 2.13.0.1 新增：量化内核（quantize_tensor_per_tensor_affine_cpu）与参考实现同序——
  #  aarch64 走 fbgemm 泛型 LEGACY=true（先加 zero_point 再 nearbyint），x86 的 AVX2
  #  快路径本就先舍入，故仅 ARM 改 false（quantized_test RoundingMode / qint32 例）
  - "0024-quantize-kernel-zero-point-order-arm.patch"
  # 2.13.0.1 新增：oneDNN 的 aarch64 eltwise gelu 路径在本平台不终止（无限自旋），
  #  gelu 前/反向在 OHOS 上跳过 oneDNN 派发、走 ATen 自带向量/标量内核；
  #  其余 oneDNN 算子正常，ISA 上限与 OMP_NUM_THREADS 均不影响该现象
  - "0025-ohos-gelu-skip-onednn-eltwise.patch"
  # 2.13.0.1 新增：AnyValue::try_get() 只比 typeid hash，而本机 libc++ 的 "Unique"
  #  实现把 hash 绑定在类型名指针上；库对部分头文件实例化类型只发 local RTTI
  #  （.dynsym 无该符号），消费者另带一份弱副本无法合并 → 同名类型被判不等。
  #  hash 不等时回退比较 mangled 名（libc++ 在不保证 RTTI 合并平台的语义）
  - "0026-anyvalue-typeinfo-name-fallback.patch"
  # 2.13.0.1 新增：JIT 属性类的 RTTI 跨 DSO 合并（Attributes::getAttr<T> 内联模板的
  #  dynamic_cast 在 -fvisibility=hidden 的库上失败 → 7 例 test_jit 报 "wrong type"；
  #  实测 TORCH_API 与 visibility pragma 对隐式实例化模板无效，故回退比较 mangled 名）
  - "0027-jit-attribute-rtti-cross-dso.patch"
# 2.13.0.1 相对 2.13.0 的功能开关（2.13.0 全部为 OFF）
backends:
  enabled:
    - name: "OpenMP"
      cmake: "USE_OPENMP=ON"
      evidence: "at::hasOpenMP()==true; ATen parallel backend = OMP; 静态链接 SDK libomp.a（无运行时 .so 依赖）"
    - name: "FBGEMM"
      cmake: "USE_FBGEMM=ON"
      evidence: "supportedQEngines() 含 kFBGEMM; 引擎可 setQEngine 往返（其内核为 x86 优化，见 disabled_by_platform 中 oneDNN 条目对 kX86 的说明）"
    - name: "QNNPACK"
      cmake: "USE_PYTORCH_QNNPACK=ON"
      evidence: "supportedQEngines() 含 kQNNPACK; 引擎可 setQEngine 往返; dynamic quantized Linear 实跑通过（本平台唯一可计算的量化引擎，补丁 0016 使其成为默认）"
    - name: "XNNPACK"
      cmake: "USE_XNNPACK=ON"
      evidence: "torch.backends.xnnpack.enabled==true; _is_xnnpack_enabled()==true"
    - name: "NNPACK"
      cmake: "USE_NNPACK=ON"
      evidence: "at::_nnpack_available()==true; torch.backends.nnpack.is_available()==true; 空间卷积可用"
    - name: "Kineto (torch.profiler)"
      cmake: "USE_KINETO=ON"
      evidence: "libkineto.a 产出并链入 libtorch_cpu.so; torch.autograd.profiler.kineto_available()==true; torch.profiler 采到事件"
    - name: "oneDNN (MKLDNN)"
      cmake: "USE_MKLDNN=ON（补丁 0017 加运行时门控）"
      evidence: >-
        编进来了：at::hasMKLDNN()==true、torch._C._has_mkldnn 为真。是否**派发**给
        oneDNN 由 at::isMKLDNNJitUsable() 决定（mmap(RW) + mprotect(RWX) + mprotect(RX)
        探测，每进程一次）：解释器域实测为假（mprotect 均 EINVAL），同机原生消费者域为真。
        test_package 断言门控恒等式 userEnabledMkldnn() == isMKLDNNJitUsable()、
        supportedQEngines() 与默认 qengine 随门控一致；受限域自动走 ATen 原生内核，
        故不再有「打开 oneDNN 即让卷积抛 Xbyak::Error」的问题。
    - name: "ITT (Intel VTune)"
      cmake: "USE_ITT=ON（补丁 0018 放行架构门控）"
      evidence: >-
        ittapi（pinned 0c57540）在 OHOS 工具链实测构出 libittnotify.a（134KB）；
        torch.profiler.itt.is_available() 为真，range_push/mark/range_pop 调用路径实跑通过
        （无采集器时是安全 no-op）。
  disabled_by_platform:
    - name: "x86 quantized engine (kX86)"
      cmake: "随 USE_FBGEMM 编入，但默认引擎在非 x86 上改为 QNNPACK（补丁 0016）"
      reason: >-
        上游用 fbgemmSupportedCPU() 决定默认量化引擎，而 FBGEMM 在 aarch64 上也返回真
        （FBGEMM 含部分 ARM 支持），于是 at::kX86 成了 ARM 上的默认引擎；但 kX86 派发的
        fbgemm::ExecuteKernelU8S8 只实现 avx2/avx512，真实量化算子会抛
        "unknown architecure"。补丁 0016 把 kX86 限制在 x86（与上游注释
        "Make it default qengine for X86 CPU platforms" 一致），非 x86 回落 QNNPACK。
  unchanged_off:
    - "USE_SLEEF (本包自写 sleef 头补丁维持可用，向量 pow 走 std::pow 路径)"
    - "USE_NUMA / USE_GFLAGS / USE_GLOG（上游默认 OFF，OHOS 无对应子系统）"

upstream_tests:
  command: >-
    cmake -S <source> -B <build> -DBUILD_TEST=ON -DINSTALL_TEST=OFF &&
    cmake --build <build> --target <114 个测试目标> -- -jN &&
    TEST_TMPDIR=<build>/upstream-test-tmp ctest --test-dir <build> -R "^(...)$" --timeout 600 --output-on-failure
  test_count: 4429
  targets: 114
  notes: >-
    全量集成到 build() 的上游测试阶段 (_run_upstream_tests): 三个来源合并去重后共 114 个目标
    —— c10/test 51 个 (50 个 *_test + cpp17 头文件检查, 868 用例)、caffe2/ATen 58 个
    (pow_test / tensor_iterator_test / inline_container_test 等, 由生成的 CTestTestfile.cmake
    读回, 2116 用例)、test/cpp 5 个 (test_api 1020 / test_jit 585 / test_lazy 612 /
    test_shim 2 / test_aoti_abi_check 94)。子集内共 4429 个 gtest 运行时用例,
    与库同工具链编译后执行; ctest 选择 108 项 (inline_container_test 走切分路径)。
    所需补丁: 0004 (musl 下 Enumerate.h 缺 <sys/types.h>)、0005 (googletest CapturedStream
    硬编码 /tmp, HarmonyOS PC 上只读 → death test 需 TEST_TMPDIR)、0006 (c10 测试目标
    C++20)、0020 (pow 向量体指数窄化, 见 notes.md)。
    两个套件按「每组一个进程」切分以规避本平台的进程内累积问题 (test_lazy 单进程第 69 例
    SIGSEGV → 切 11 组; inline_container_test 与 allocator 用例同进程即挂 → 切 5 组),
    切分后用例全覆盖且全通过。
    未执行: test/*.py (184 文件 / 9926 def test_*, 需 python -m torch 构建); 其在原型上的
    实测分类 (通过 74504 / 失败 104 / 跳过 9040 / 错误 67) 与理由见 test_package/MANIFEST.yml
    与 notes.md「上游测试」。test/cpp 另有 10 个目标 (c10d / dist_autograd / rpc / nativert /
    aoti_inference / profiler / inductor 等) 在本包配置下不存在 (依赖本包关闭或未启用的特性)。

