      该项因此不是静默跳过而是结构化验证：断言 torch/lib/*.so 与 C++ 消费者本轮实际加载的
      lib/*.so 逐字节一致、_C 扩展为合法 ELF、相关 .so 仍带 .codesign（E077）；任一不满足即失败。
    local_ci_w3: >-
      build_and_test.sh 本地 CI 预审（与 CI 同脚本/profile/超时预算）：
      Pass rate 100.0% (1/1)，L0_RESULT=pass、L1_RESULT=pass、L5_RESULT=pass
    python_module_files: 2449
    built_targets: [torch_cpu, torch_shm_manager, torch_python, _C]
  test_package_assertions: 80
  harmony_specific_tests:
    - file: test_package/test_pytorch_ohos.cpp
      description: >-
        HarmonyOS 专项测试 (R6): 运行时判定宿主平台 (uname(2)), 在 HarmonyOS 上校验 8 组
        鸿蒙/musl aarch64 特有适配点（共 56 项运行时检查）, 非 HarmonyOS 宿主打印 SKIP 并以 0
        退出 (R8: 不使用平台条件编译宏) —
        平台身份 (uname sysname=HarmonyOS + machine=aarch64 + CPU 后端与默认 dtype)、
        补丁 0004 的 musl ssize_t 可见性、补丁 0001 的 group_norm ranges→iterator 路径与空张量判定、
        OHOS aarch64 上的 CPU 张量算术 / complex64 乘法 / int64 归约 / STL 互操作、
        分布式 c10d (libuv 符号经 dlsym 解析 / gloo vtable / FileStore 实跑)、
        BLAS/LAPACK (linalg_solve / linalg_svd 数值 + 复数 dot)、
        ATen 线程池 (parallel_for 覆盖每下标恰好一次 + OpenMP)、
        后端 (oneDNN 运行时门控恒等式 / ITT / FBGEMM / QNNPACK / XNNPACK / NNPACK / Kineto)。
      command: "./test_pytorch_ohos"
  note: >-
    上游测试阶段实测: 114 个目标 / 4429 个 gtest 用例; ctest 选择 108 项全部通过,
    切分组与 test/cpp 套件 2321 用例通过 + 5 跳过 (均为上游自身 SKIP, 非失败) + 0 失败。
    两个套件按「每组一个进程」切分以规避本平台的进程内累积问题 (test_lazy / inline_container_test,
    见 notes.md「test/cpp 接入的两个平台性约束与处置」), 切分后用例全覆盖。
    CI 数字随构建回填。test_package 侧另有 56 项鸿蒙专项检查 + 23 项 Python 断言。
knowledge_ref:
  - E017
  - E092
  - E298
  - E077
  - E212
  - E488
knowledge_gained:
  - "pytorch 源码 tarball 不含 37 个 third_party 子模块，需按 pinned commit 从 codeload 逐个子模块补齐；本环境 codeload 被阻断，改用 gh-proxy.com 镜像（ghfast.top 对 cutlass 等大 repo 限速）"
  - "pybind11 绑定包按 cpp 适配（R47 D.4-2）；pytorch 产出 C++ libtorch（libtorch.so/libtorch_cpu.so/libc10.so），非 python 包"
  - "CMAKE_SYSTEM_NAME 用 HarmonyOS 时 CMake 不生成 SONAME（NEEDED 记相对路径 ../lib/xxx 无法解析）；改 OHOS + 不设 SOVERSION → 纯名 SONAME，musl 可加载"
  - "dlopen 报 'Permission denied' 在本机可判别的成因是 .codesign：删除该段即复现（EACCES），用 binary-sign-tool 去段重签后恢复；HMDFS 上 chmod 无法放宽 other 位（775 仍 770），故涉及可加载性的修复应重写文件或重签，而非改权限"
  - "CI 上 Python 扩展被拒（Error loading shared library ...: Permission denied）的另一成因是 hmmac 安全域：解释器在 /data/service/hnp 下运行于 hnp_file 域，该域只允许 dlopen 同标签 .so，而 conan 包位于用户路径；同一次运行的 C++ 消费者可加载完全相同的字节，仓内 aggdraw/pillow 亦按此口径处置（E212/E488）"
  - "交叉编译需 tool_requires clang/22.1.8（SDK 仅 clang 15 不满足 pytorch Clang>=16），保留 SDK libc++15（__n1 ABI）+ -D__MUSL__"
  - "CI worker 沙箱不允许从 conan 缓存路径加载 .so（HMDFS 执行限制），且 musl 命中不可加载的候选后不再回退；libc++/zlib 等宿主库必须走 /system/lib64 等平台路径（环境变量 LD_PRELOAD 也无效），故工具链须显式固定 LD_LIBRARY_PATH 到平台目录"
  - "CMake 的 LINK_WHAT_YOU_USE（pytorch 顶层默认开启 CMAKE_LINK_WHAT_YOU_USE TRUE）会在每次链接后调用 ldd；OHOS 无 ldd，需提供 readelf 实现的 ldd 兼容 shim 并设置 CMAKE_LINK_WHAT_YOU_USE_CHECK，否则所有链接目标失败（Error running 'ldd'）"
  - "上游测试集成方式：主构建 BUILD_TEST=OFF，build() 末尾重新配置 -DBUILD_TEST=ON -DINSTALL_TEST=OFF，把本配置下上游注册的 114 个 gtest 目标（c10/test 51 + caffe2/ATen 58 + test/cpp 5）全部构建后执行（ctest 选择 108 项 + test/cpp 直跑 + 2 个套件按组切分）；既保持包内容不含测试二进制，又能让上游用例以与库完全相同的工具链运行"
  - "HarmonyOS PC 的 /tmp 只读：googletest CapturedStream 在非 Android/iOS 分支硬编码 \"/tmp/\"，导致所有 death test（EXPECT_DEATH）在 OHOS 上 abort；上游仅 Android 分支用 testing::TempDir() 读 TEST_TMPDIR/TMPDIR。需补丁改为 TempDir() 并在 ctest 前设置可写 TEST_TMPDIR"
  - "musl 不透传提供 ssize_t：c10/util/Enumerate.h 使用 ssize_t 但未 include <sys/types.h>（glibc 下经其它头传递可见），交叉编译到 OHOS/musl 时编译失败；同类 POSIX 类型头文件依赖在 musl 移植时需逐个补 include"
  - "conan_toolchain.cmake 以普通变量 set(CMAKE_CXX_STANDARD <profile cppstd>)，会遮蔽下层的 CACHE 写法，故 pytorch 顶层 set(CMAKE_CXX_STANDARD 20 CACHE ...) 在 compiler.cppstd=17 的 profile 下不生效；上游测试按 C++20 基线编写（std::unordered_set/.contains），需对测试目标单独设 CXX_STANDARD 20（不影响库目标，避免全量重编）"
  - "在既有构建目录里重新 configure 时改全局 CMAKE_CXX_STANDARD 会导致所有目标 flag 变化并触发全量重编（torch_cpu 数千文件）；给单个目标设 CXX_STANDARD 属性可只影响该目标，是增量接入上游测试的正确做法"
  - "cmake_dependent_option(INSTALL_TEST ... ON \"BUILD_TEST\" OFF)：BUILD_TEST=ON 会使 INSTALL_TEST 自动变 ON，从而让 c10/test 与 c10/benchmark 的 install() 规则全部生效；只构建测试目标而未构建 benchmark 时，package() 的 cmake.install() 会因找不到 bin/c10_intrusive_ptr_benchmark 而失败，需显式 -DINSTALL_TEST=OFF"
