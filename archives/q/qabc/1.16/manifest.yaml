knowledge_gained:
  - "Qt6 qmake 工程在 OHOS 构建：qtbase 包内 qmake6 + QMAKE_LRELEASE 需显式指向 qttools 包的 lrelease（qtbase 不含 LinguistTools）"
  - "qtbase/qttools 的 host 工具（qmake6/lrelease）是 OHOS 本机 ELF，DT_NEEDED 含 libc++_shared.so，运行期需注入 OHOS SDK llvm/lib/aarch64-linux-ohos 目录"
