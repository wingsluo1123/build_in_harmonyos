sources:
  url: "https://gitlab.com/CodethinkLabs/qad/qad/-/archive/43adc42/qad-43adc42.tar.gz"
  sha256: "12859224c9d21da1ed40bd27e6d0c3d6a643b1c7199303253dbaea4b57070838"
patches:
  "0.0-git20240206.43adc42":
    - patch_file: "patches/0001-use-system-cjson.patch"
      patch_description: >
        Replace bundled cJSON git submodule with system-provided libcjson
        dependency from Conan (the upstream tarball has an empty src/cjson/
        directory because the git submodule was not populated); add
        install: true to the executable() definition so meson install
        deploys the binary.
      patch_type: "portability"
