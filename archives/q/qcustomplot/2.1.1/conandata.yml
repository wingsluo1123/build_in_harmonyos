# conandata.yml — qcustomplot 2.1.1
# 卡面源：QCustomPlot 官方发布包。归档内容为单文件库（qcustomplot.cpp、
# qcustomplot.h、GPL.txt、changelog.txt），上游不带构建系统与测试。
# sha256 与 ConanCenter 同版本记录逐字节一致；设备下载复核同一哈希。
# 补丁按上游归档根目录（strip_root 后）为根。

sources:
  url: "https://www.qcustomplot.com/release/2.1.1/QCustomPlot-source.tar.gz"
  sha256: "5e2d22dec779db8f01f357cbdb25e54fbcf971adaee75eae8d7ad2444487182f"

patches:
  - patch_file: "patches/0001-guard-qt-print-support-include.patch"
    patch_description: "qcustomplot.h 仅在 Qt 提供 PrintSupport 时包含 QtPrintSupport 头（QT_NO_PRINTER 能力宏守卫；savePdf 实现上游本就带同一守卫）。OHOS qtbase 以 FEATURE_printsupport=OFF 构建，不带 Qt6PrintSupport 模块"
    patch_type: "portability"
