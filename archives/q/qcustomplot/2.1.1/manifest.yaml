# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "qcustomplot 2.1.1 是单翻译单元 Qt 部件库（qcustomplot.cpp 35,529 行 + qcustomplot.h 7,774 行），上游只发布源码与 GPL.txt/changelog.txt，没有构建系统、没有安装规则、没有任何测试；配方的 CMakeLists.txt 与 QCustomPlotConfig.cmake.in 必须由归档提供，并通过 export_sources() 复制进 Conan 源目录。"
  - "OHOS qtbase/6.11.1 以 FEATURE_printsupport=OFF 构建，不带 Qt6PrintSupport 模块；公共 qconfig.h 不定义 QT_NO_PRINTER，因此 CMake 必须用 find_package(Qt6 QUIET OPTIONAL_COMPONENTS PrintSupport) 做能力探测并在缺失时显式 target_compile_definitions(QCustomPlot PUBLIC QT_NO_PRINTER)（R8：能力探测而非平台宏）。补丁 0001 给 qcustomplot.h 的 QtPrintSupport 头包含加上同一 QT_NO_PRINTER 守卫；savePdf 的实现上游本就带该守卫，缺了模块会返回 false 且不写文件（E2E save_pdf_capability 用例实证）。"
  - "CMakeToolchain 变量在第一个 project() 命令执行期间才被加载，project(QCustomPlot VERSION ${QCUSTOMPLOT_VERSION}) 的参数展开发生在工具链加载之前，VERSION 为空会让 write_basic_package_version_file 报 No VERSION specified；正确写法是先 project(QCustomPlot LANGUAGES CXX)，再读取 QCUSTOMPLOT_VERSION 并用于 target VERSION/SOVERSION 与包版本文件。"
  - "Conan test_package 若未定义 build()，conan create 不会执行 cmake configure/build，test() 里的 cmake.test() 会因缺少 CMakeCache.txt 报 not a CMake build directory；test_package 必须显式 build()（cmake.configure + cmake.build）。"
  - "conan-verify G1 要求 test_package/MANIFEST.yml 存在（CI L0e 门禁）；即使上游没有任何测试，也要用 upstream_tests: [] 与逐文件 test_package_tests 声明消费者用例。"
  - "E330：HMDFS 用户卷拒绝 symlink()，CMake 的 VERSION/SOVERSION 软链无法落地——运行期 symlink 探测失败时设置 CMAKE_PLATFORM_NO_VERSIONED_SONAME=ON，产出单文件 libQCustomPlot.so，DT_SONAME 为裸基名；OHOS CMake 走 Generic 平台模块，必须注入 CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG 才会记录 SONAME。"
  - "包导出面：QCustomPlotConfig.cmake（find_dependency Qt6 Core/Gui/Widgets，PrintSupport 仅在构建时存在才转发）+ QCustomPlot::QCustomPlot 目标 + include/qcustomplot.h；package_info 使用 cmake_find_mode=none 防止 CMakeDeps 遮蔽真实配置，builddirs=lib/cmake。"
  - "测试口径：上游 0 个测试函数，按 rule4「补全测试用例说明=是」；test_package 的 16 个具名消费者用例覆盖版本宏、部件构造、图元与数据、坐标轴范围、时间 ticker、图例、绘图项、颜色图、离屏 replot、toPixmap、PNG 导出（含像素方差）、缩放导出、removeGraph、数据裁剪、QCP 枚举元类型反射与 savePdf 能力分支，真机 16/16 通过。"
