# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "QCUSTOMPLOT_VERSION=2.1.1（CMakeToolchain 变量；project() 参数展开时工具链尚未加载，版本在 project() 之后读取）"
    - "BUILD_SHARED_LIBS=ON / CMAKE_POSITION_INDEPENDENT_CODE=ON（默认 shared=True）"
    - "-DCMAKE_INSTALL_LIBDIR=lib（单前缀布局）"
    - "find_package(Qt6 QUIET OPTIONAL_COMPONENTS PrintSupport)：OHOS qtbase 以 FEATURE_printsupport=OFF 构建，组件缺失时 target 定义 QT_NO_PRINTER，savePdf 走上游自带存根（能力探测，无平台宏，R8）"
    - "CMAKE_SHARED_LIBRARY_SONAME_C/CXX_FLAG=-Wl,-soname,（OHOS CMake 无 Platform/HarmonyOS 模块，默认不产 SONAME）"
    - "CMAKE_PLATFORM_NO_VERSIONED_SONAME=ON（HMDFS 禁 symlink：单文件无版本 libQCustomPlot.so + 裸 DT_SONAME，E330）"
    - "Qt6_DIR=<qtbase>/lib/cmake/Qt6，conan_cmakedeps_paths.cmake（qtbase 为 cmake_find_mode=none，CMakeDeps 不生成配置）"
    - "QCUSTOMPLOT_COMPILE_LIBRARY（PRIVATE）/ QCUSTOMPLOT_USE_LIBRARY（INTERFACE）：上游 QCP_LIB_DECL 的共享库导入导出开关"

  dependencies:
    - "qtbase/6.11.1（Core/Gui/Widgets；运行期 DT_NEEDED = libQt6Widgets.so.6 / libQt6Gui.so.6 / libQt6Core.so.6；不带 Qt6PrintSupport）"

  cc: clang
  cxx: clang++

