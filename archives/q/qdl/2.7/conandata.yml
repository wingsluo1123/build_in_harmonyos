# conandata.yml — qdl 2.7
# 位置: archives/q/qdl/2.7/conandata.yml
# 本文件是源码 URL + SHA256 + 补丁的唯一权威来源。
# conanfile.py 通过 self.conan_data["sources"] 与 apply_conandata_patches() 读取。

sources:
  # URL 列表的三条硬规则（与 archives/r/ruy、archives/r/reliable/1.3.5 一致）：
  #   1) 第一项必须是官方源；
  #   2) 必须含 ghfast.top 一项（本地 conan-verify 的 G2 会对此做 E017 预防）；
  #   3) 其余镜像项写成「镜像前缀 + 官方完整 URL」，不得裸用镜像域名。
  #
  # url 形态取 `archive/refs/tags/v2.7.tar.gz`（而不是 commit hash 形态）：
  # 同仓 GitHub 项目先例 archives/2/2048.c/1.0.3 用的就是
  #   https://github.com/mevdschee/2048.c/archive/refs/tags/v1.0.3.tar.gz
  # 且任务给的版本号就是 2.7 / 上游 tag 就是 v2.7，语义一一对应。
  #
  # 实测（2026-10-04）：官方直连、ghfast.top、gh-proxy.com 三路下载
  # **sha256 逐字节一致**（110260 bytes），
  # 解包根目录 qdl-2.7/（单根目录，strip_root=True 可用）。
  #   sha256 = 0eee137badceb8dfc6b2bc43af7223e5770d48be5eeab5c808c08cf1beb1de9a
  url:
    - "https://github.com/linux-msm/qdl/archive/refs/tags/v2.7.tar.gz"
    - "https://ghfast.top/https://github.com/linux-msm/qdl/archive/refs/tags/v2.7.tar.gz"
    - "https://gh-proxy.com/https://github.com/linux-msm/qdl/archive/refs/tags/v2.7.tar.gz"
  sha256: "0eee137badceb8dfc6b2bc43af7223e5770d48be5eeab5c808c08cf1beb1de9a"

patches:
  # 唯一一处上游改动，且只碰 tests/（不进包的产物代码）：
  # 两个 bash 集成测试用 `uname -s` 选可执行文件名，只认
  #   Linux*|Darwin* → qdl      CYGWIN*|MINGW*|MSYS* → qdl.exe
  # 其余平台一律 `exit 1`。HarmonyOS 的 `uname -s` 正是 "HarmonyOS"
  # （真机实测），于是两个集成测试在 configure 后必然以退出码 1 失败。
  # 补丁只往那个 case 分支里补一个 `HarmonyOS*`。
  #
  # 为什么必须改而不是"让它失败也无所谓"：meson.test() 只要有一条 test() 失败
  # 就返回非 0，conan create 直接失败；而这两条恰好是覆盖 qdl 真实功能
  # （VIP 表生成、flashmap dry-run）的集成测试，不能裁掉。
  # 上游不认别的类 unix 平台属于上游的平台判据缺失，属可移植性修复而非绕过测试。
  - patch_file: "patches/0001-tests-accept-harmonyos-uname.patch"
    patch_description: "tests: accept HarmonyOS in the `uname -s` platform switch so the VIP/flashmap integration tests run on OpenHarmony PC"
    patch_type: "portability"

  # 第二处上游改动，同样只碰 tests/（不进包的产物代码）：
  # HarmonyOS PC 上，凡是从「用户可写目录」启动的可执行文件，其进程都会进入
  # adhoc_bin 这个 HMMAC 强制访问控制域；该域**读不到 /usr/bin**
  # （真机实测 `ls -ld /usr/bin/zip` → Permission denied，而同一进程读
  # /system/bin、/data/service/hnp 都正常，`/usr/bin` 是 erofs 只读挂载、
  # 两条路径的 mount id 完全相同 ⇒ 纯属 MAC 域判定，不是缺文件也不是权限位）。
  # conan 自己就是 /storage/Users/currentUser/usr/local/bin/python3 启动的，
  # 因此 `conan create` 之后的**整棵子进程树**都在 adhoc_bin 域内，
  # /usr/bin/zip 明明装着却取不到（Domain 对照：宿主 shell 是
  # `u:r:hishell_hap:s0` 可以读；python/conan 是 `u:r:adhoc_bin:s0` 读不到）。
  # 上游 tests/data/generate_flat_build.sh 用 `zip` 打 flashmap.zip
  # （该 zip 正是 test_flashmap.sh 的「flashing flashmap.zip」用例的输入，
  # 不能删），于是两条集成测试必然 `zip: command not found`（退出码 127）。
  # 补丁把归档那一步改成：有 `zip` 就用 `zip`（Linux/macOS/Cygwin 行为不变），
  # 否则回退到 Python 标准库 `python3 -m zipfile -c`（同样是 deflate 的标准 zip）。
  # 被测能力（`qdl --dry-run flash flashmap.zip`）与断言完全不变，属可移植性修复。
  - patch_file: "patches/0002-tests-portable-zip-fallback.patch"
    patch_description: "tests: fall back to `python3 -m zipfile` when the Info-ZIP CLI is unreachable (wrong HMMAC domain cannot read /usr/bin on HarmonyOS PC)"
    patch_type: "portability"
