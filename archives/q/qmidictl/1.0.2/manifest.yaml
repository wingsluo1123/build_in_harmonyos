software: qmidictl
version: "1.0.2"
status: built
build_date: "2026-10-02"
conan_ref: "qmidictl/1.0.2"
build_system: cmake

source:
  url: "https://download.sf.net/qmidictl/qmidictl-1.0.2.tar.gz"
  sha256: "5c9e04e560c564b03b6ebd451e310246418b8416f25e6038575bae16c34f4339"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_CXX_STANDARD=17"
    - "Qt6_DIR=<qtbase>/lib/cmake/Qt6"
    - "Qt6Svg_DIR=<qtsvg>/lib/cmake/Qt6Svg"
    - "CMAKE_MODULE_PATH=<qtbase>/lib/cmake/Qt6/platforms"
  dependencies:
    - qtbase/6.11.1.3
    - qtsvg/6.11.1.1
  cc: clang
  cxx: clang++
  cxxstandard: "17"

notes: |
  - 上游为 Qt6 (Core/Gui/Widgets/Svg/Network) 桌面 GUI 应用，CMake >= 3.15，
    AUTOMOC/AUTOUIC/AUTORCC 全开，产物安装到 bin/（R38 → 软件级 commands.json）。
  - E438：qtbase 自带可重定位 Qt6Config.cmake（cmake_find_mode "none"），配方把
    qtbase/qtsvg 包目录直接交给 CMake（CMAKE_PREFIX_PATH + Qt6_DIR + Qt6Svg_DIR
    + CMAKE_MODULE_PATH 指向 Platform/HarmonyOS.cmake）。
  - E077：OHOS 内核只允许加载带有效 .codesign 的 ELF，package() 打包期对
    bin/qmidictl 自签（qastools/1.4.0 先例），使 test_package 的真实 exec 探针有效。
  - R51：上游无任何自动化测试（见 test_package/MANIFEST.yml 的清点证据）；
    test_package 独立承担 L1 验证（TP-001..011，16 项断言）。
  - 上游源码零修改（patches: []）。
