# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qmidictl/1.0.2
homepage: "https://qmidictl.sourceforge.io"

# 上游测试命令
# R51 清点证据（2026-10-02，解压官方 tarball qmidictl-1.0.2.tar.gz，
# sha256 5c9e04e5...f4339）：
#   * tarball 顶层仅 CMakeLists.txt / ChangeLog / LICENSE / README / src
#   * `find -type d -name 'test*'`、`find -type f -name '*test*'` 均无命中
#   * 顶层与 src/CMakeLists.txt 中无 enable_testing() / add_test() / CTest 注册
#   * 无 check / test / make-check 目标
# 结论：上游不提供任何自动化测试入口。
upstream_check_command: "none (upstream has no test suite; no tests/ tree, no enable_testing()/add_test(), no test target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，真实 exec 被测二进制)
test_package_tests:
  - file: test_qmidictl.sh
    source: "archives/q/qmidictl/1.0.2/test_package/test_qmidictl.sh"
    description: >-
      真实运行被测包安装的 bin/qmidictl：--version 断言 "QmidiCtl" 与 "1.0.2"，
      --help 断言 --udp-port / --interface；并核对 ELF 头、DT_NEEDED 中的
      libQt6Core/Widgets/Gui/Svg/Network 与安装的 .desktop / scalable icon /
      man page / licenses 文件（QT_QPA_PLATFORM=offscreen，不开窗）。
    command: "bash test_qmidictl.sh <package_folder>/bin <package_folder>"

# 测试断言总数 (用于质量评估)
# TP-001..TP-011 共 11 个测试项, 展开为 16 条断言:
#   TP-001/002/004/005/006/007/008/009/010/011 各 1 条 = 10 条
#   TP-003 = DT_NEEDED 解析 1 条 + 5 个 Qt6 运行库链接断言 5 条 = 6 条
# 本地实测: RESULT: PASSED (16/16)
assertion_count: 16
