package: qpack/0.0.21
homepage: "https://github.com/cesbit/qpack"
upstream_test_in_build: false
upstream_test_command: "python3 -m unittest discover -s test -p qpack_test.py"
upstream_tests:
  - file: upstream_tests/qpack_test.py
    description: "Complete, byte-identical upstream suite: 9 methods run and passed, zero failures/errors/skips in private native verifier and formal W3"
test_package_tests:
  - file: functional.py
    description: "One real native-package consumer: 4/4 groups passed (UTF8 aliases, Latin1 aliases, default bytes, strict/ignore-errors) in private native verifier and formal W3; original 9 methods counted separately"
    command: "python3 functional.py <package-folder> <upstream-test-dir> <results-json>"
