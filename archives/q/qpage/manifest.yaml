software: qpage
display: "QuickPage (qpage)"
description: "QuickPage：通过 SNPP（RFC 1861）/IXO(TAP) 向数字寻呼机发送消息的客户端与服务器"
category: network
homepage: "http://www.qpage.org/"
license: LicenseRef-Qpage-NonCommercial
build_system: custom

ohos_adaptation:
  key_points:
    - "小型 C 程序（约 10 个源文件），自带 autoconf-2.12 生成的 configure + 手写 Makefile；无三方依赖"
    - "上游只以明文 HTTP 发布 .tar.Z；改用 NetBSD pkgsrc distfiles 镜像（HTTPS，sha256 固定）"
    - "compress(1) 的 .Z（LZW）容器需在 source() 里用纯 Python 解码，Conan/Python 标准库均不支持"
    - "客户端固定连 SNPP 端口 444；消费者测试用 LD_PRELOAD connect() shim 改写到高位端口跑 mock 服务器"
  common_dependencies: []

versions:
  - version: "3.3"
    status: built
    build_date: "2026-10-15"
