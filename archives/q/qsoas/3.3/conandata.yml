sources:
  "3.3":
    url: "https://github.com/fourmond/QSoas/archive/refs/tags/3.3.tar.gz"
    sha256: "d04584108b7cf889ff95b2423306486d15a94176d61799022c2a70741f1cd644"
patches:
  "3.3":
    - patch_file: "patches/0001-QSoas.pro.patch"
      patch_description: "Support deterministic build metadata and explicit optional-module selection"
      patch_type: "portability"
    - patch_file: "patches/0002-qsoas.qrc.patch"
      patch_description: "Use only version-controlled logo resources"
      patch_type: "portability"
    - patch_file: "patches/0003-src-externalfunction.cc.patch"
      patch_description: "Enforce a monotonic deadline for external function transactions"
      patch_type: "correctness"
    - patch_file: "patches/0004-src-filebrowser.hh.patch"
      patch_description: "Include the public QTreeView declaration directly"
      patch_type: "portability"
    - patch_file: "patches/0005-src-general-commands.cc.patch"
      patch_description: "Report unavailable SVG export explicitly"
      patch_type: "portability"
    - patch_file: "patches/0006-src-headers.hh.patch"
      patch_description: "Guard optional QtHelp and QtSvg headers"
      patch_type: "portability"
    - patch_file: "patches/0007-src-helpbrowser-noqthelp.cc.patch"
      patch_description: "Provide an informative help fallback without QtHelp"
      patch_type: "portability"
    - patch_file: "patches/0008-src-helpbrowser.hh.patch"
      patch_description: "Declare the QtHelp-free interface"
      patch_type: "portability"
    - patch_file: "patches/0009-src-mainwin.cc.patch"
      patch_description: "Load the tracked SVG application icon"
      patch_type: "portability"
    - patch_file: "patches/0010-src-solver.cc.patch"
      patch_description: "Treat recoverable GSL root-iteration failures as seed failures"
      patch_type: "correctness"
