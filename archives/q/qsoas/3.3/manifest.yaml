  upstream_exceptions: "6（未交付的 ZIP 可选能力）"
  upstream_not_completed: "0"
  consumer_scenarios: 5
  consumer_assertions: 15
  consumer_passed: 15

knowledge_gained:
  - "外部计算进程的同步事务必须用单一单调截止时间覆盖启动、请求写入和响应完成，并在失败时回收进程、丢弃半包；逐次固定超时会被碎片输出无限续期。(ref: E202610160430-draft-6F91)"

