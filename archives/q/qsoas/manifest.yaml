software: qsoas
display: "QSoas"
description: "可脚本化的科学数据分析和拟合应用程序"
category: science
homepage: "https://qsoas.org/"
license: GPL-2.0-or-later
build_system: qmake

ohos_adaptation:
  key_points:
    - "确定性预生成 build.hh 取代仅写入主机名和时间的 Ruby 元数据脚本"
    - "在包构建目录创建可迁移 qmake 元数据视图，不改写 Qt 依赖制品"
    - "外部函数事务使用单调总截止时间，并在失败时回收子进程和半包"
  common_dependencies:
    - qt5/5.15.19
    - mruby/3.3.0
    - gsl/2.8

versions:
  "3.3":
    status: built
    build_date: "2026-10-16"
    source_url: "https://github.com/fourmond/QSoas/archive/refs/tags/3.3.tar.gz"
