# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.4"

# 软件名
software: "qstylizer"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-17"
build_system: "pure-python"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/41/f1/8714c35fcebabe591756a868416b968e4da457b02bbfcb3a451cafbf6f9d/qstylizer-0.2.4.tar.gz"

