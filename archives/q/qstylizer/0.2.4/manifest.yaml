  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - patches/0001-qstylizer-style.py.patch
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
