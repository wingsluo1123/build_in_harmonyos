version: "5.15.2"
status: built
build_date: "2026-08-08"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  tar_format: tar.xz

build:
  system: custom
  configure_options:
    - "Manual compilation: clang++ with Qt5 headers and MariaDB libmariadb"
  dependencies:
    - "qt5-qtbase/5.15.2"
    - "mariadb-connector-c/3.4.8"
    - "ohenvironment (OHOS SDK sysroot)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qt-mariadb shares the same driver source and output file (libqsqlmysql.so) as qt-mysql"
  - "Qt5 mysql/mariadb plugin requires Qt5-specific headers; installed headers are mixed Qt5/Qt6"
  - "Mixed Qt5/Qt6 header environment requires explicit Qt5 header paths for plugin compilation"
  - "libqsqlmysql.so supports QMYSQL3, QMYSQL, and QMARIADB keys simultaneously"
  - "MariaDB driver links against libmariadb.so rather than libmysqlclient.so"
  - "Runtime dlopen testing blocked by OHOS ELF signing requirement (platform limitation)"
  - "qtsql-config.h not included in qt5-qtbase package (SQL disabled with -no-feature-sql); must be generated"
  - "Plugin links without Qt5Sql (not built); uses --allow-shlib-undefined for runtime resolution"
  - "ohenvironment library available in OHOS SDK sysroot at /data/service/hnp/ohos-sdk.org/"
