# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qt-mariadb/5.15.2
homepage: "https://download.qt.io/archive/qt/5.15/"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Qt5 plugin cannot be tested standalone)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_symbols.c
    description: "Verify plugin .so exists, links against libmariadb, exports qt_plugin_instance"
    command: "conan test"

# 测试断言总数
assertion_count: 3
