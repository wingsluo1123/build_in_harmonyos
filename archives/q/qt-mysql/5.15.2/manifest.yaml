version: "5.15.2"
status: published
build_date: "2026-08-08"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  tar_format: tar.xz

build:
  system: custom
  configure_options:
    - "Manual clang++ compilation: Qt5Sql library from qtbase source + MySQL driver plugin"
  dependencies:
    - "qt5-qtbase/5.15.2"
    - "mariadb-connector-c/3.4.8"
    - "openssl/1.1.1w"
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-plugins-sqldrivers-mysql-qsql_mysql.cpp.patch"

knowledge_gained:
  - "qt5-qtbase/5.15.2 conan package built without -no-feature-sql, so Qt5Sql must be built from source"
  - "Qt5Sql source from qtbase/src/sql/ can be compiled manually with clang++ using conan package headers"
  - "Forward headers for qtsql-config.h and private headers must be created for Sql module compilation"
  - "libqsqlmysql.so links against libQt5Sql.so, libQt5Core.so, libmariadb.so, libohenvironment.so"
  - "libohenvironment.so available from OHOS SDK sysroot"
  - "moc files must be compiled with -x c++ flag to avoid PCH generation"