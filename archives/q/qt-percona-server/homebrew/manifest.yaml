version: "homebrew"
status: built
build_date: "2026-07-19"

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtbase-everywhere-src-6.11.1.tar.xz"
  sha256: "d9594a31228aa23ad6b531719a29b45f0f3989fe6c136d45767ea179f233c1ac"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DFEATURE_sql_ibase=OFF"
    - "-DFEATURE_sql_mysql=ON"
    - "-DFEATURE_sql_oci=OFF"
    - "-DFEATURE_sql_odbc=OFF"
    - "-DFEATURE_sql_psql=OFF"
    - "-DFEATURE_sql_sqlite=OFF"
    - "-DMySQL_LIBRARY=libperconaserverclient"
  dependencies:
    - "qtbase/6.11.1"
    - "percona-server/8.0.36"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt6 mysql plugin 使用 CMake 构建，源码在 qtbase src/plugins/sqldrivers/mysql"
  - "Homebrew formula 中仅启用 FEATURE_sql_mysql=ON，其余 SQL 驱动全部 OFF"
  - "通过 -DMySQL_LIBRARY 指定 percona-server 的 libperconaserverclient.so"
  - "与 qt-mysql、qt-mariadb 冲突（均安装 libqsqlmysql.so）"
  - "运行时 dlopen 加载驱动需要 ELF 签名（OHOS 平台限制）"
