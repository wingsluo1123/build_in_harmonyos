# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md
#
# This package extracts only the mysql sqldriver from qtbase source.
# There is no standalone upstream test suite for the extracted subdirectory.
# Validation is done via the consumer test_package.

package: qt-percona-server/homebrew
homepage: "https://www.qt.io/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_driver.cpp
    description: "Verify QMYSQL driver is available via QSqlDatabase::drivers() and can be instantiated"
    command: "./test_driver"

assertion_count: 3
