software: qt-percona-server
display: "Qt6 Percona Server Driver"
description: "Qt6 SQL driver plugin for Percona Server (QMYSQLDriver with libperconaserverclient backend)"
category: db
homepage: "https://www.qt.io/"
license: LGPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "Qt6 SQL driver plugin，从 qtbase src/plugins/sqldrivers/mysql 源码构建"
    - "使用 CMake + Ninja 构建，启用 FEATURE_sql_mysql=ON"
    - "链接 Percona Server 客户端库 libperconaserverclient"
    - "与 qt-mysql、qt-mariadb 冲突（安装相同的 libqsqlmysql.so）"
    - "运行时 dlopen 加载需要 ELF 签名（OHOS 平台限制）"
  common_dependencies:
    - qtbase
    - percona-server

versions:
  "homebrew":
    status: built
    build_date: "2026-07-19"
