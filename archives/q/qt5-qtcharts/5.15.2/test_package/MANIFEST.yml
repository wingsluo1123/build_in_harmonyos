# test_package/MANIFEST.yml
# Upstream test declaration for qt5-qtcharts/5.15.2

package: qt5-qtcharts/5.15.2
homepage: "https://www.qt.io/"

# Upstream test command (qmake-based: make check runs Qt auto tests)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (Qt Charts auto tests from tests/auto/)
upstream_tests:
  - file: tests/auto/qchart/tst_qchart.cpp
    source: qtcharts-everywhere-src-5.15.2/tests/auto/qchart/tst_qchart.cpp
    description: "QChart class unit tests"
    command: "./tst_qchart"
  - file: tests/auto/qlineseries/tst_qlineseries.cpp
    source: qtcharts-everywhere-src-5.15.2/tests/auto/qlineseries/tst_qlineseries.cpp
    description: "QLineSeries class unit tests"
    command: "./tst_qlineseries"
  - file: tests/auto/qpie_series/tst_qpie_series.cpp
    source: qtcharts-everywhere-src-5.15.2/tests/auto/qpie_series/tst_qpie_series.cpp
    description: "QPieSeries class unit tests"
    command: "./tst_qpie_series"

# test_package consumer-side tests
test_package_tests:
  - file: test.cpp
    description: "Consumer test: verify Qt5Charts library linkage and QChart/QLineSeries API"
    command: "./qt5charts_test"

# Approximate assertion count
assertion_count: 5
