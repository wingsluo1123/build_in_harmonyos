# test_package/MANIFEST.yml
package: qt5-qtserialport/5.15.2
homepage: "https://doc.qt.io/qt-5/qtserialport-index.html"
upstream_check_command: "make -C tests/auto/qserialport && make -C tests/auto/qserialportinfo"
upstream_test_in_build: true
upstream_test_command: "./tests/auto/qserialport/tst_qserialport && ./tests/auto/qserialportinfo/tst_qserialportinfo"
upstream_tests:
  - file: tests/auto/qserialport/tst_qserialport.cpp
    description: "QSerialPort core API test (53 slots: open/baudRate/dataBits/parity/stopBits/flowControl/loopback 等；需 QTEST_SERIALPORT_SENDER/RECEIVER 物理串口对，无硬件时 initTestCase QSKIP)"
    command: "./tests/auto/qserialport/tst_qserialport"
  - file: tests/auto/qserialportinfo/tst_qserialportinfo.cpp
    description: "QSerialPortInfo port enumeration test (3 slots: initTestCase/constructors/assignment；同上 QSKIP 机制)"
    command: "./tests/auto/qserialportinfo/tst_qserialportinfo"
test_package_tests:
  - file: test_qtserialport.cpp
    description: "QSerialPortInfo/QSerialPort API verification (availablePorts 枚举 + 构造/属性 round-trip + error 读取)"
    command: "./test_qtserialport"
assertion_count: 5
