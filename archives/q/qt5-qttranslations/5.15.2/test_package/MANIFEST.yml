# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qttranslations/5.15.2
homepage: https://www.qt.io/

# 上游测试命令：qttranslations 5.15.2 无 QTest 套件，其"资源生成"挂在上游
# 构建图中（translations.pro 的 updateqm 编译器：lrelease <in.ts> -qm <out.qm>，
# 由 qmake 生成的 Makefile 驱动）。本配方在 build() 内按同一语义逐 .ts 执行
# lrelease，并对每个 .qm 的产出做断言（266 源 .ts + 17 个空 _en 占位）。
upstream_check_command: "lrelease translations/*.ts -qm translations/*.qm"
upstream_test_in_build: true
upstream_test_command: "lrelease <translations/*.ts> -qm <translations/*.qm> (upstream updateqm target semantics)"

upstream_test_changes: []

# 上游资源生成目标位置
upstream_tests:
  - file: translations/translations.pro
    source: qttranslations-everywhere-src-5.15.2/translations/translations.pro
    description: "上游 updateqm 编译器用 Qt Linguist 的 lrelease 将全部 TRANSLATIONS(.ts) 转换为 .qm（MODULE_BASE_OUTDIR/translations/<base>.qm），并 write_file() 生成 17 个空 <module>_en.ts 一并编译"
    command: "lrelease <in.ts> -qm <out.qm>"
    count: 266

# test_package 中自带的测试（消费者视角验证：Qt5 运行时 QTranslator 加载产物）
test_package_tests:
  - file: test_qttranslations.cpp
    description: "QT_TRANSLATIONS_PATH 与 translations/ 目录存在性、.qm 数量≥250、5 个关键中文翻译逐个用 Qt5 QTranslator 加载并断言 load()==true 且 !isEmpty()"
    command: "./test_qt5_qttranslations"

assertion_count: 13
