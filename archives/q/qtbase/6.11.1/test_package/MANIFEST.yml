# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qtbase/6.11.1
homepage: https://code.qt.io/qt/qtbase.git

# qtbase 是预构建引用模式（赛事 prebuilt/qtbase-6.11.1-ohos-aarch64.tar.gz），
# 上游单元测试套件需 Qt6 源码构建环境 + DevEco Studio SDK + ohos-additional-packages，
# CI 预构建引用上下文豁免上游自检。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 测试实质调用被测包 API — find_package(Qt6 COMPONENTS Core) + QString + QDebug
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(Qt6 REQUIRED COMPONENTS Core CONFIG) + target_link_libraries Qt6::Core + 实质调用 QString QStringLiteral + qDebug() — 验证 Qt6::Core 预构建产物已正确安装且可被 find_package 消费"
    command: "cmake --configure"

# 测试断言总数 (find_package 成功 + Qt6::Core 链接成功 + QStringLiteral 调用通过 + qDebug 输出 + test_qtbase 退出码 0)
assertion_count: 5
