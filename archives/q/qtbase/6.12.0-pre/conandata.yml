  # Qt6 开发分支 6.12 真含 mkspecs/ohos-clang + cmake/QtAutoDetectHelpers.cmake qt_auto_detect_ohos()。
  # conan 2.x get() 不支持 git 源，source() 用 git clone 拉 6.12 分支源。
  # commit hash 锁定可重现版本（2026-07-23 6.12 分支 HEAD）
  url: "https://code.qt.io/qt/qtbase.git"
  branch: "6.12"
  commit: "4cd34f389333c9a69815980cf4c00c205d89adaa"
