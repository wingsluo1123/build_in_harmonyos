    result: "8 passed, 2 failed（targetDetected 仿真信号未触发）"
  - file: "tests/auto/qnearfieldtagtype1"
    description: "Type 1 标签（nfccommons 仿真器）"
    result: "2 passed, 3 failed（targetDetected 仿真信号未触发）"
  - file: "tests/auto/qnearfieldtagtype2"
    description: "Type 2 标签（nfccommons 仿真器）"
    result: "2 passed, 2 failed, 1 skipped（同上）"

# 构建方式说明（可复核）：
# 22 个 tst 目标经独立 CMake 工程构建——与上游 qt_internal_add_test 同
# SOURCES/DEFINES；Qt::*Private 为 header-only（符号在公共 .so），私有头根
# 手动补齐；QNFC 三个仿真器目标额外编译树内私有实现
# （src/nfc/qnearfieldtarget{,_p}.cpp、qnearfieldmanager.cpp——安装库按
# ELF 可见性隐藏了私有类的 moc/虚分派符号，nm 实证在案），AUTOMOC 自包含。
upstream_test_exemption:
  rule: "none"
  reason: "22/22 目标均已真实构建并执行，无豁免项；8 个 failed 为真实执行结果（NFC 仿真器 targetDetected 路径 7 个 + BlueZ 专属 debug dump 断言 1 个），48 个 skipped 为上游设计内跳过"

test_package_tests:
  - file: "test_package/test_qtconnectivity.cpp"
    description: "消费者视角验证：QBluetoothAddress/QBluetoothUuid/QBluetoothDeviceInfo 数据类往返、NFC NDEF 记录往返、无适配器时 QBluetoothLocalDevice::isValid() 优雅报告（输出 QTCONNECTIVITY-CONSUMER-OK）"
    command: "conan test"

assertion_count: 6
