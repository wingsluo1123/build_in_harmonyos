software: qthttpserver
version: "6.11.1"
status: built
build_system: cmake
source_url: https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qthttpserver-everywhere-src-6.11.1.tar.xz
dependencies:
  - qtbase/6.11.1
configure_options:
  - QT_BUILD_TESTS=OFF
  - QT_BUILD_EXAMPLES=OFF
  - QT_BUILD_BENCHMARKS=OFF
  - QT_BUILD_DOCS=OFF
  - QT_QMAKE_TARGET_MKSPEC=harmonyos-clang
knowledge_gained:
  - Qt modules require qtbase's native Qt6Config.cmake and Qt6BuildInternals package files.
  - qtbase/6.11.1 must be published before this package can pass the release dependency gate.
