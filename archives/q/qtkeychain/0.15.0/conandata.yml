patches:
  "0.15.0":
    - patch_file: "patches/0001-autotest-basic.cpp.patch"
      patch_description: "Enable QKeychain insecure fallback in the upstream autotest (autotest/basic.cpp) because OHOS provides no keyring service (gnome-keyring/kwallet), so the write/read/delete round-trip is exercised through the documented fallback QSettings store."
      patch_type: "portability"