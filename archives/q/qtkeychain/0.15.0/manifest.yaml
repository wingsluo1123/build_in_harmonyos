  - "0.15.0 registers the upstream autotest (autotest/basic.cpp via ECMAddTests) when BUILD_TESTING=ON and builds the testclient application when BUILD_TEST_APPLICATION=ON."
  - "0.15.0 removed the LIBSECRET_SUPPORT=OFF default-safe path: the option exists only inside the UNIX branch and defaults ON, so it must be explicitly disabled to avoid a mandatory pkg_check_modules(libsecret-1) lookup."
