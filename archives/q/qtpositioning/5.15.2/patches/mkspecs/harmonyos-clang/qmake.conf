#
# qmake configuration for OHOS aarch64 (clang)
#

MAKEFILE_GENERATOR      = UNIX
# force_independent：独立构建本模块（qtbase 的 qmake 编译 prefix 为 /，
# 非独立模式下 MODULE_BASE_OUTDIR 会落到 QT_HOST_PREFIX=/，导致
# qt_module_headers.prf 写 /include/QtPositioning/... 失败）
CONFIG                 += ohos force_independent
QMAKE_PLATFORM         += ohos

# Compiler
QMAKE_CC               = clang
QMAKE_CXX              = clang++
QMAKE_LINK             = clang++
QMAKE_LINK_SHLIB       = clang++
QMAKE_AR               = llvm-ar cqs
QMAKE_OBJCOPY          = llvm-objcopy
QMAKE_NM               = llvm-nm
QMAKE_STRIP            = llvm-strip

# Architecture
QMAKE_CFLAGS           += -target aarch64-linux-ohos -D__OHOS__
QMAKE_CXXFLAGS         += -target aarch64-linux-ohos -D__OHOS__
QMAKE_LFLAGS           += -target aarch64-linux-ohos

# C++ standard library — 与 qt5-qtbase 构建一致（profile: compiler.libcxx=libc++），
# 避免与 libc++ 构建的 Qt5Core ABI 不一致
QMAKE_CFLAGS           += -stdlib=libc++
QMAKE_CXXFLAGS         += -stdlib=libc++
QMAKE_LFLAGS           += -stdlib=libc++
QMAKE_LIBS             += -lc++

# Sysroot - read from Conan build environment (if defined)
# R33: 环境变量无定义来源时不得引用；CONAN_SYSROOT 未设置则不传 --sysroot，
# 交由 OHOS 工具链默认 sysroot 处理，避免空 --sysroot= 参数或链接宿主头文件。
CONAN_SYSROOT = $$(CONAN_SYSROOT)
!isEmpty(CONAN_SYSROOT) {
    QMAKE_CFLAGS           += --sysroot=$$CONAN_SYSROOT
    QMAKE_CXXFLAGS         += --sysroot=$$CONAN_SYSROOT
    QMAKE_LFLAGS           += --sysroot=$$CONAN_SYSROOT
}

# C++ standard
QMAKE_CXXFLAGS_CXX11   = -std=c++11
QMAKE_CXXFLAGS_CXX14   = -std=c++14
QMAKE_CXXFLAGS_CXX17   = -std=c++17

# PIC/PIE
QMAKE_CFLAGS_RELEASE   += -O2 -fPIC
QMAKE_CXXFLAGS_RELEASE += -O2 -fPIC

QMAKE_CFLAGS_DEBUG     += -g -O0
QMAKE_CXXFLAGS_DEBUG   += -g -O0

load(qt_config)
