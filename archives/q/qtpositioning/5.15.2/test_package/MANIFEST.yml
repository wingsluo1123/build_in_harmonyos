# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: qtpositioning/5.15.2
homepage: "https://github.com/qt/qtlocation"

# 上游测试命令
upstream_check_command: "qmake tests/auto/auto.pro && make && make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tst_qgeocoordinate
    source: qtlocation-5.15.2/tests/auto/qgeocoordinate/tst_qgeocoordinate.cpp
    description: "QGeoCoordinate unit tests"
    command: "./tst_qgeocoordinate"
  - file: tst_qgeocircle
    source: qtlocation-5.15.2/tests/auto/qgeocircle/tst_qgeocircle.cpp
    description: "QGeoCircle unit tests"
    command: "./tst_qgeocircle"
  - file: tst_qgeopath
    source: qtlocation-5.15.2/tests/auto/qgeopath/tst_qgeopath.cpp
    description: "QGeoPath unit tests"
    command: "./tst_qgeopath"
  - file: tst_qgeorectangle
    source: qtlocation-5.15.2/tests/auto/qgeorectangle/tst_qgeorectangle.cpp
    description: "QGeoRectangle unit tests"
    command: "./tst_qgeorectangle"
  - file: tst_qgeopositioninfo
    source: qtlocation-5.15.2/tests/auto/qgeopositioninfo/tst_qgeopositioninfo.cpp
    description: "QGeoPositionInfo unit tests"
    command: "./tst_qgeopositioninfo"
  - file: tst_qnmeapositioninfosource
    source: qtlocation-5.15.2/tests/auto/qnmeapositioninfosource/tst_qnmeapositioninfosource.cpp
    description: "NMEA position source unit tests"
    command: "./tst_qnmeapositioninfosource"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "验证 Qt5Positioning 库链接及核心 API (QGeoCoordinate/QGeoCircle/QGeoRectangle)"
    command: "./test_qtpositioning"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
