# MANIFEST.yml — qtremoteobjects test_package
# OHOS 平台限制：stripped ELF 共享库无法被 dlopen 加载 (Permission denied)
# 测试方式：静态验证（readelf + nm -D），不依赖运行时加载
test_type: static_verification
test_method:
  - readelf -d (SONAME, NEEDED)
  - nm -D (exported symbols)
  - file existence check
reason: |
  OHOS musl 动态链接器拒绝加载 stripped ELF 共享库 (dlopen 返回 Permission denied)。
  qt5-qtbase 依赖库 (libQt5Core.so.5, libQt5Network.so.5) 被 make install 自动 strip，
  导致 test_package 无法在运行时加载完整的 Qt5 依赖链。
  采用 readelf/nm 静态验证绕过此限制，验证库的 ELF 结构和导出符号。
