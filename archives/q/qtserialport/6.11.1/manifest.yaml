software: qtserialport
version: "6.11.1"
status: built
build_date: "2026-08-08"
build_system: cmake

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtserialport-everywhere-src-6.11.1.tar.xz"
  sha256: "9af31a898ffd9a7e4faf6fed845d29e783c716885789055cbe319f3e072d3974"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DQT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
  dependencies:
    - qtbase/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qtserialport 是 Qt6 串口模块，依赖 qtbase/6.11.1（Qt Core）"
  - "Qt6 子模块统一使用 download.qt.io / 国内镜像的 everywhere-src tarball"
  - "OHOS 适配：QT_QMAKE_TARGET_MKSPEC=harmonyos-clang，关闭不适用特性"
