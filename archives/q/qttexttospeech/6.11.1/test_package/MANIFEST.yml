package: qttexttospeech/6.11.1
homepage: "https://doc.qt.io/qt-6/qttexttospeech-index.html"
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure -j1"

upstream_tests:
  - file: tests/auto/qtexttospeech/tst_qtexttospeech.cpp
    description: "QTextToSpeech API tests (engines, voices, locales, say/stop)"
    command: "ctest -R '^tst_qtexttospeech$' --output-on-failure"
  - file: tests/auto/qvoice/tst_qvoice.cpp
    description: "QVoice value and accessor tests"
    command: "ctest -R '^tst_qvoice$' --output-on-failure"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test exercising QTextToSpeech/QVoice APIs from the installed Qt6TextToSpeech package"
    command: "./test_package"

assertion_count: 8
