software: quorum
display: Quorum
description: Quality-aware DNA sequencing read error correction
category: data
homepage: https://github.com/gmarcais/Quorum
license: GPL-3.0-or-later
build_system: cmake
ohos_adaptation:
  key_points:
    - Public zlib gzip stream instead of GNU private filebuf
    - Explicit header/library traits for immutable published mixed tool/library dependencies
    - Case-sensitive Perl options preserve distinct prefix and paired-read parameters
  common_dependencies: [jellyfish, zlib, perl]
versions:
  "1.1.2":
    status: built
    build_date: "2026-10-11"
    conan_ref: quorum/1.1.2
