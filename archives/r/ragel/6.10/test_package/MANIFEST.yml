# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: ragel/6.10
homepage: "https://www.colm.net/open-source/ragel/"

# Upstream test command (from make check)
upstream_check_command: "make check"

# Upstream tests are run in conanfile.py build() method
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream actual test programs
upstream_tests:
  - file: test/runtests
    source: ragel-6.10/test/runtests
    description: "Ragel test suite runner"
    command: "./test/runtests"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: src/test_simple.rl
    description: "Compile a simple state machine with ragel"
    command: "ragel -C -o test_simple.c src/test_simple.rl"

# Approximate assertion count
assertion_count: 2
