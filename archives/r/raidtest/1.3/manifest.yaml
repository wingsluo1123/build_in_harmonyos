software: raidtest
version: "1.3"
status: device-verified
build_date: "2026-10-04"
build_system: direct-cc
conan_ref: "raidtest/1.3"

source:
  # No upstream release tarball exists: the port keeps its sources in-tree
  # (MASTER_SITES=none). Files are pinned to a FreeBSD ports commit.
  vcs: "https://codeberg.org/FreeBSD/freebsd-ports"
  commit: "86b2c5122a18d1f73e6e4e4626889fab8fb0803a"
  files:
    - path: "benchmarks/raidtest/files/raidtest.c"
      sha256: "70cb131d744ea339dc7054a9a8f61c552e517bb2dc070eb04d569847b9ed2237"
    - path: "benchmarks/raidtest/files/README"
      sha256: "64307426f57910f3661b88bc6aed586632cd5a4ffd0df8c23de079e068e7e215"

build:
  system: direct-cc   # single translation unit; ports Makefile is bsd.port.mk-only
  dependencies: []    # libc only
  cc: clang

patches_applied:
  - "0001-musl-endian: <endian.h> + static inline le64enc/le64dec/le32enc/le32dec helpers on __linux__/__OHOS__ (musl lacks both the FreeBSD header and the helpers) — applied in conanfile.py build()"
  - "0002-freebsd-version-guard: #if defined(__FreeBSD__) && __FreeBSD_version < 500028, else the FreeBSD 4.x compat block wrongly activates (uintmax_t typedef redefinition)"
  - "0003-getprogname-fallback: static getprogname() on non-FreeBSD (not declared by the OHOS musl headers)"
  - "0004-fork-loop-index: upstream writes procs[i] in a loop over j (out-of-bounds write for -n > 1); fixed to procs[j]"
  - "All patches applied in conanfile.py build() via replace_in_file; verified by OHOS SDK aarch64 cross-compile (exit 0, no warnings)."

artifacts:
  libraries: []
  headers: []
  binaries:
    - bin/raidtest
  documentation:
    - share/raidtest/doc/README
    - licenses/raidtest.c   # BSD-2-Clause grant lives in the source header

knowledge_gained:
  - "raidtest 1.3 has no upstream tarball; sources live inside the FreeBSD ports tree and must be pinned per-file (commit + SHA256)."
  - "Per-file download() in source() avoids both the CI conandata.yml pre-download defect and archive-format inference (no conandata.yml needed)."
  - "OHOS musl lacks the FreeBSD leNNenc/leNNdec helpers and getprogname declaration, and leaves __FreeBSD_version undefined (activating the FreeBSD 4.x compat block); all three need explicit patches, confirmed by cross-compile."
  - "Upstream fork loop has an index typo (procs[i] in a j loop) that is an out-of-bounds write with -n > 1; fixed in the OHOS recipe."
  - "The ports README mentions a -R option that the 1.3 code does not implement (stale upstream doc); not a portability issue."
  - "Verified on device shadow CI (2026-10-04): L0/L1/L4/L5 pass, L2 skip (tool has no --version/--help by design), L1e negative test confirmed, test_package 15/15, conan create 1/1 (100%)."
  - "Conan runenv variables did not reach the test_package script on the device runner; passing paths as explicit argv is the reliable handover."
