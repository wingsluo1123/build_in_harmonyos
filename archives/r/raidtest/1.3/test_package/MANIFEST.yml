package: "raidtest/1.3"
test_type: consumer
description: >
  Functional consumer tests for the installed raidtest binary, implemented as
  a POSIX sh script (no pytest dependency). Exercises the genfile subcommand
  end to end (on-disk record layout, alignment, type and bounds validation,
  read-only mode, force-overwrite, collision handling, stdout counters) plus
  error paths of the test subcommand that do not need a block device
  (missing -d, missing device, -r with -w, -n 0).

assertions: 13
external_tools:
  - sh
  - python3   # ships with the Conan runner; used once for record validation

notes: >
  The storage `test` subcommand needs a raw block device and is therefore not
  exercised beyond argument validation. On a device, a real throughput run
  can be done manually against a scratch block device or a file-backed loop
  device.
