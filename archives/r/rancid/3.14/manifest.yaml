software: rancid
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.14"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.shrubbery.net/pub/rancid/rancid-3.14.tar.gz"

  # 源码校验和
  sha256: "cbf608d8508b55dffb6b30c7a1c45c16ea53af7611a466e0cc47a863252f6e49"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "expect/5.45.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"
  - "0002-configure.ac.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony ping 不支持 -v 标志, 需移除 configure 中的 ping -v 测试"
  - "HMDFS 文件系统 umask 077 创建临时目录会触发 setgid 位权限问题, 需改为 umask 000"
  - "rancid 的 etc/Makefile 未使用 $(srcdir) 前缀, 不支持 out-of-source build, conanfile 需设置 in-source build"
  - "Conan 2.x test_package 需使用 self.dependencies 而非 self.deps_cpp_info"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/rancid-3.14.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/rancid-3.14.work
  source_orig_hash: 7036a995857fcc97
  source_work_hash: 423f8e323211f735
  generated_at: '2026-06-26T03:49:08'
  patches_count: 2

patch_classification:
