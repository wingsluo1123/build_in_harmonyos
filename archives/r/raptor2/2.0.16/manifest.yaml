source:
  url: "https://download.librdf.org/source/raptor2-2.0.16.tar.gz"
  sha256: "089db78d7ac982354bdbf39d973baf09581e6904ac4c92a98c5caadb3de44680"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-yajl=<yajl package folder>"
    - "--without-xslt-config"
  dependencies:
    - libxml2/2.15.3.1
    - libxslt/1.1.45.2
    - yajl/2.1.0
    - curl/8.22.0
    - icu4c/78.3
  cc: clang
  cxx: clang++
  notes: >-
    Native OHOS/aarch64 build (build == host, clang 15.0.4).  LDFLAGS gains -lc++
    because ICU is a C++ library linked statically into this C library.

