# test_package/MANIFEST.yml — rarcrack 0.2-20240214-413ea3a 上游测试声明（L0e 强制要求的文件）

package: rarcrack/0.2-20240214-413ea3a
homepage: "https://github.com/jaredsburrows/rarcrack"

# ---- 上游测试审计（上游确无测试） -------------------------------------------
upstream_tests_exist: false
upstream_test_audit:
  - source: "rarcrack@413ea3a source tree (root, commit 2024-02-14)"
    reason: "No tests/ or test/ directory and no *test*.c/h harness file exist; the tree holds only rarcrack.c, Makefile, docs (README/CHANGELOG/RELEASE_NOTES/LICENSE), scripts/, .github/ CI config and three manual fixtures (test.rar/test.7z/test.zip)."
  - source: "Makefile (sole build file)"
    reason: "It defines only the `all` (link rarcrack binary), `debug`, `clean`, `install` and `uninstall` targets; there is no check, test or TESTS/check_PROGRAMS target of any kind."
  - source: ".github/workflows/build.yml (upstream CI)"
    reason: "The CI 'test' step merely launches `./rarcrack --type zip test.zip` (a manual, unbounded cracking run with no assertions and no registered cases); it is not an automated test suite and registers zero countable cases."
  - conclusion: "Upstream 0.2-20240214-413ea3a provides no automated tests; the adaptation adds an installed-binary CLI contract test (6 assertions) without presenting it as upstream coverage."

# rule4 强制字段：upstream_test_total 缺失（而非 0）会被直接拒绝。
# rarcrack 经逐项审计确认确实无任何自动测试：源码树无 tests/、
# Makefile 无 TESTS/check_PROGRAMS，`make check` 无目标可执行，故总量为 0，
# 口径为 autotools_tests（Makefile 系测试注册口径，regldg/1.0.1 同型先例）。
upstream_test_total: 0
upstream_test_count_method: autotools_tests
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- Consumer tests (test_package) -----------------------------------------
# test_package/conanfile.py runs test_rarcrack.sh against the packaged
# bin/rarcrack, parses its deterministic "RESULT: P passed, F failed" trailer
# into HMBS_TEST_PACKAGE_RESULT, and emits HMBS_UPSTREAM_TEST_RESULT
# (status=no_tests, 0 counts).
test_package_tests:
  - file: test_rarcrack.sh
    description: "Run the packaged `rarcrack` through 6 real CLI-contract assertions: (1) bare invocation prints the USAGE text, (2) `--help` prints the Options screen, (3) a missing archive with `--type zip` reports not exists, (4) an invalid `--type rarx` warns invalid parameter, (5) `--threads 20` is clamped to 12 with the notice redirected to an HMFS writable-dir file, (6) negative control - no status *.xml may appear in the workdir since every case returns before crack_start(). Emits a machine-readable RESULT trailer parsed by test_package/conanfile.py."
    command: "sh test_rarcrack.sh <package>/bin/rarcrack <workdir>"

assertion_count: 6
