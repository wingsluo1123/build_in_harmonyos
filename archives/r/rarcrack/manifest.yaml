software: rarcrack
display: "rarcrack"
description: "Brute-force password cracker for RAR, 7Z and ZIP encrypted archives"
category: security
homepage: "https://github.com/jaredsburrows/rarcrack"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Builds the upstream single-binary Makefile target with clang, passing CC from Conan conf."
    - "Makefile xml2-config backticks replaced by XML2_CFLAGS/XML2_LIBS fed from the conan libxml2 package."
    - "Requires the warehouse-unique libxml2/2.15.3.1 (same upstream v2.15.3) to avoid the CCI cmake KeyError."
    - "The consumer test executes bin/rarcrack through 6 CLI-contract assertions without starting a real crack."
  common_dependencies:
    - libxml2/2.15.3.1

versions:
  "0.2-20240214-413ea3a":
    status: built
    build_date: "2026-10-04"
