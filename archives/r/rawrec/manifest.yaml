software: rawrec
display: "rawrec"
description: "CLI program to record or play raw audio data via OSS"
category: utility
homepage: "http://rawrec.sourceforge.net"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain Makefile build in src/ with clang from Conan conf."
    - "OSS linux/soundcard.h via __has_include fallback (no platform macro in patches)."
    - "Skip upstream suid make install; stage binary plus rawplay symlink and man page manually."
  common_dependencies: []

versions:
  "0.9.991":
    status: built
    build_date: "2026-10-13"
