version: "8.2"
software: readline
status: built
build_date: "2026-07-15"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/readline/readline-8.2.tar.gz"
  sha256: "3feb7171f16a84ee82ca18a36d7b9be109a52c04f492a053331d7d1095007c35"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-curses=yes"
    - "--disable-shared"
    - "--enable-static"
  dependencies:
    - ncurses/6.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-port-for-ohos.patch"
  - "0002-fix-shlib-termcap-link.patch"

knowledge_gained:
  - "CFLAGS=-fPIC is critical: static lib must be position-independent for OHOS shared lib linking"
  - "TERMCAP_LIB must be appended to shared library link command (shlib/Makefile.in)"
  - "config.sub needs 3 modifications: linux-ohos* whitelist, ohos* system type, linux-ohos* kernel-os"
  - "ncurses static (--without-shared) automatically embeds into libreadline"
