package: readline/8.2
homepage: "https://tiswww.case.edu/php/chet/readline/rltop.html"

upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: examples/rl.c
    source: readline-8.2.tar.gz/examples/rl.c
    description: "Upstream readline example demonstrating line editing"
    command: "./rl"

test_package_tests:
  - file: test.c
    description: "Verify readline version API and history add/list functionality"
    command: "./test_readline"

assertion_count: 5
