# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: redsocks/0.5
homepage: "https://github.com/darkk/redsocks"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# redsocks tests require VM networking + docker containers (squid, dante, nginx)
# Cannot run in OHOS environment
upstream_tests:
  - file: tests/test_smoke.py
    source: redsocks-0.5/tests/test_smoke.py
    description: "Integration smoke tests requiring VM network with docker containers"
    command: "cd tests && ./run"
  - file: tests/prlimit-nofile.c
    source: redsocks-0.5/tests/prlimit-nofile.c
    description: "Helper binary for RLIMIT_NOFILE tests"
    command: "make tests/prlimit-nofile"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify redsocks binary runs and reports version"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
