# test_package 自带的消费者视角测试（真实调用 API，非打印空壳）
test_package_tests:
  - file: test_refnx.py
    description: >-
      17 项公开 API 消费者验证，数值核心从四个独立方向交叉钉死：_creflect（C, refcalc.c）、
      _cyreflect（Cython + OpenMP）、_reflect（上游纯 Python 译本）三者必须互相一致，且都必须
      复现 sdist 自带、由 Motofit 生成的参考曲线（theoretical.txt, 500 点, rel < 1e-9）；六个可
      选后端（c/c_parratt/cython/cython_parratt/py_parratt/python）全部比对；abeles_vectorised
      批量路径与标量逐条一致（dev 0.0）；极化核 gepore 在零磁化下非自旋翻转道等于非极化核、
      自旋翻转道为 0；_cyreflect 的 threads=0/1/4 结果逐位相同（OpenMP on OHOS）；Spline 微切片
      对均匀剖面退化为等厚单层；Objective 的 chi2/nll/logl 记账与参数树；CurveFitter.fit 从
      95 Å 起点恢复 100 Å（stderr 0.011, chi2 137.7）；emcee MCMC 后验均值 100.03±0.01；
      Data1D(dot.out)=1122 点、ReflectDataset(e361r)=99 点、OrsoDataset 存读往返逐位一致；
      Structure pickle 往返反射率逐位一致。
    command: "python3 test_refnx.py --json <out>.json"
    checks: 17
  - file: test_ohos_platform.py
    description: >-
      9 项鸿蒙平台验证（6 静态 + 3 运行期），见下方 added_tests。
    command: "python3 test_ohos_platform.py --site-dir <site-packages> --runtime --json <out>.json"
    checks: 9

# 新增鸿蒙特有测试 (rule12)
added_tests:
  - name: "harmonyos-specific-test"
    source: test_package/test_ohos_platform.py
    description: >-
      鸿蒙特有断言，用纯 stdlib 自行解析 ELF64（不依赖 readelf，因而在拒绝 dlopen 用户路径的
      E212 AppSpawn 沙箱内同样可执行），逐一覆盖本配方产出的 4 个扩展，并把扩展总数钉在
      EXPECTED_EXTENSIONS=4（上游 meson.build 的固定 target 列表）——只移走一个产物也会 6 项
      全红，而不是 "3/3 全绿"：
      1) ELF 魔数 + ELF64 + e_machine == EM_AARCH64(183)；
      2) 必须存在 .codesign 段——OHOS E077 对未签名映射直接拒绝 dlopen；
      3) 必须自带 DT_NEEDED libpython3.12.so——musl 不把解释器符号导出给 dlopen 对象，
      否则 PyModuleDef_Init 等符号不可解析（E004）；
      4) C 库必须是 musl 的 libc.so（出现 libc.so.6/libm.so.6/ld-linux* 即失败），并且每个
      扩展的 DT_NEEDED 尾部必须精确等于 meson.build 声明的契约——_cutil/_cevent 为 C（仅
      libc.so），_creflect/_cyreflect 为 C++（+libc++_shared.so），且只有 OpenMP 版
      _cyreflect 链接 libomp.so；
      5) 扩展文件名后缀必须等于当前解释器的 EXT_SUFFIX（本端口
      .cpython-312-aarch64-linux-ohos.so），防止把 Linux glibc wheel 误当 OHOS 产物；
      参与比对的解释器取自 test_package 自身的 tool_requires("python/3.12.9")（制品仓已发布），
      并先校验其 EXT_SUFFIX 含 -linux-ohos，因而不会拿设备上 PATH 里的 HNP 解释器
      （.cpython-312.so）当作基准误判扩展；
      6) 包内布局：refnx/__init__.py 必须 `from refnx.version import version as __version__`，
      且 meson 构建期由 tools/gitversion.py 生成的 refnx/version.py 必须写出 0.1.62
      （sdist 无 git checkout，这一步是 OHOS 构建链上的真实风险点），同时
      _lib/reflect/reduce/analysis/dataset/util 六个子包与 sdist 数据资产齐全。
      运行期追加 3 项（仅需 numpy，故在缺 scipy 的 worker 上仍可执行）：平台字符串
      aarch64、LP64、_cutil 确实从 .so 载入；扩展从 conan 包目录被 dlopen（E004 的运行期
      证据）+ 在 OHOS 文件系统上 mmap 一个 (120,200) 数组并让打包的 Cython 助手在其上做
      c_flatten/c_unique（与纯 Python 参考实现逐元素一致）；musl 分配器压力（50 万元素
      不规则展平）与非连续内存视图输入。
    command: "python3 test_ohos_platform.py --site-dir <site-packages> [--runtime] --json <out>.json"
    ohos_specific: true

# 测试断言总数（用于质量评估，由脚本对两个测试源文件的 `assert` 语句计数得来）
#   test_refnx.py 17 项检查 36 条 assert；test_ohos_platform.py 9 项检查 32 条 assert；
#   合计 68 条。另：后者 6 项静态检查还会对 4 个扩展逐个执行 ELF 校验
#   （运行时展开为额外 24 次断言级检查，不计入上面的源码 assert 条数）。
assertion_count: 68
