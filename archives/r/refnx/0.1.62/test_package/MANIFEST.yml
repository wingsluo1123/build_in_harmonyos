# test_package/MANIFEST.yml — 上游官方测试声明文件（L0e 门禁要求存在）
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 本文件的每一个计数都由脚本从真机 pytest --junitxml 结果
# (junit/upstream-pkg.xml) 直接读取求和得到：模块路径取自执行时 pytest 的
# classname，passed/failed/errors/skipped 取自各 testsuite 的汇总属性。无手工
# 填写数字。执行对象是 **本配方 conan create 产出的 package_folder**
# (site-packages/refnx)，不是源码树，因此它验证的是交付物本身。

package: refnx/0.1.62
homepage: https://refnx.readthedocs.io

# 上游官方测试方式：pytest（测试目录随 sdist 安装进 site-packages/refnx/**/tests）
upstream_check_command: "python3 -m pytest refnx/"

# conanfile.py build() 是否集成上游测试：false。
#   原因：跑上游 pytest 需要 scipy、pandas、orsopy、h5py 等运行期依赖，它们未发布
#   到 OHPCD Conan 制品仓（该仓只有 python/meson/ninja/cython/numpy），CI worker 的
#   build() 阶段拿不到，硬塞进 build() 只会产出假通过或假失败。上游全量套件因此在
#   真机离线执行：用本配方 build+install 产出的 4 个扩展 + 平台 OHOS wheel 的
#   scipy/pandas/orsopy/h5py 等，对 package_folder 逐目录收集，聚合见
#   reports/test-report.md 与 manifest.yaml 的 upstream_test_run。
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest <site-packages>/refnx/<MODULE>/tests -q -p ohos_testdata --junitxml=<MODULE>.xml"

