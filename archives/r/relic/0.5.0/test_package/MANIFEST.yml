# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/src/main.c
    description: "以库使用者身份从安装后的包编译链接 relic，调用 core_init / bn_read_str / bn_add / bn_sub / bn_cmp / bn_sqr / bn_div / bn_mul / bn_is_zero 公开 API，3 条大整数恒等式断言决定退出码"
    command: "./test_relic_consumer"

# 测试断言总数（近似值，用于质量评估）
#   1877 = test/test_*.c 的 TEST_ASSERT( 数（上游原子断言）
#      3 = test_package/src/main.c 的消费者断言
assertion_count: 1880
