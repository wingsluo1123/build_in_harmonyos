  - file: test/test_eb.c
    source: relic-relic-toolkit-0.5.0/test/test_eb.c
    description: "二元域椭圆曲线（51 个用例）"
    command: "./test_eb"
  - file: test/test_ed.c
    source: relic-relic-toolkit-0.5.0/test/test_ed.c
    description: "Edwards 曲线（47 个用例）"
