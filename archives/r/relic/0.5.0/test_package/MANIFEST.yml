    description: "素域椭圆曲线（47 个用例）"
    command: "./test_ep"
  - file: test/test_epx.c
    source: relic-relic-toolkit-0.5.0/test/test_epx.c
    description: "素域椭圆曲线扩域（48 个用例）"
