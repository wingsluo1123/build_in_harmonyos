name: retawq
software: retawq
version: "0.2.6c"
status: published
build_date: "2026-08-08"
build_system: makefile
source:
  url: "https://downloads.sourceforge.net/project/retawq/retawq/retawq-0.2.6c/retawq-0.2.6c.tar.gz"
  sha256: "a42e82494f00e054c2de1b065bbc8fb439d93eb69f9b97cc4868e71e48a9eae0"
  tar_format: tar.gz
configure_options:
  - "--set-tg=curses:ncurses.h:ncursesw"
  - "--set-tls=2"
  - "--enable-news"
  - "--enable-cookies"
  - "--enable-textmodemouse"
  - "--enable-ipv6"
  - "--enable-local-cgi"
  - "--set-threading=1"
dependencies:
  - "ncurses/6.6"
  - "openssl/1.1.1w"
cc: "clang"
cxx: "clang++"
patches_applied:
  - "0001-fix-umask-for-hmdfs.patch"
  - "0002-fix-ncurses6-opaque-window.patch"
  - "0003-fix-openssl11-compat.patch"
knowledge_gained:
  - "HMDFS SGID + umask 077 prevents file creation in temp dirs"
  - "ncurses 6.x opaque WINDOW requires getcury()/getcurx() API"
  - "OpenSSL 1.1.1w OPENSSL_NO_EGD requires conditional RAND_egd"
  - "OpenSSL 1.1.1 const SSL_METHOD* return"
