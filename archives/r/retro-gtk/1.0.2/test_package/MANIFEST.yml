# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）

package: retro-gtk/1.0.2
homepage: "https://gitlab.gnome.org/GNOME/retro-gtk"

# 上游测试入口：meson 注册的 2 项 test()（tests/meson.build）
upstream_check_command: "meson test -C <builddir> --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test -C <builddir> --print-errorlogs（build() 内实际执行，2/2 OK）"
upstream_tests:
  - file: tests/meson.build
    source: retro-gtk-1.0.2/tests/meson.build
    description: "test('RetroCore test', tests/RetroCore)` —— test-core.c 对 13 个 RetroCore 特性逐一 boot（retro_core_new + retro_core_boot + 断言 API 版本/initiated/game_loaded/state 存取/控制器/选项），核心是 tests/retro-dummy.c 编出的 retro-dummy.so；实测 OK（1.57–1.78s，各批次）；g_test 注册 13 例"
    command: "meson test -C <builddir> RetroCore"
  - file: tests/meson.build
    source: retro-gtk-1.0.2/tests/meson.build
    description: "test('/retro-dummy reftest', tests/retro-reftest, args: retro-dummy.reftest.build)` —— 按 .reftest 基线文件跑固定帧数并与参考 PNG 逐像素比对（retro-dummy.reftest.in + retro-dummy.png），同时校验 boot/options/state/fast-forward/video 各阶段（g_test 注册 7 例）；实测 OK（0.30–0.33s，各批次）"
    command: "meson test -C <builddir> retro-dummy"

# test_package 消费者测试（真实产物校验 + 鸿蒙专项）
test_package_tests:
  - file: consumer.c
    description: |
      消费者测试（走 libretro-gtk 公开 API，R34 真实使用）：retro_core_new →
      连接 "video-output" → retro_core_boot → retro_core_iteration ×3，校验
      API 版本 1、initiated、fps=60.00、帧几何 320x240、每次 iteration 都拿到
      pixdata，并用 test_pattern.h 的契约逐像素（5 个采样点）与整帧 FNV-1a
      校验和比对 frame 1/2/3。链路覆盖：被测库 → 被测包内 libexec/retro-runner
      进程 → 私有 GDBus IPC → memfd 帧缓冲 → RetroPixdata → GdkPixbuf。
    command: "RETRO_RUNNER_PATH=<pkg>/libexec/retro-runner retro-gtk-consumer <libretro-test-core.so>"
    assertion_count: 12
  - file: test_ohos.sh
    description: |
      鸿蒙专项测试（19 条断言）：libretro-gtk-1.so.0 与 retro-runner 均为
      ELF64/AArch64 且带 .codesign；SONAME 为 libretro-gtk-1.so.0（按名解析）；
      无 Linux 专有动态依赖（libpthread/librt/libutil/libdl）；7 个公开 API
      符号导出齐全；include/retro-gtk 头文件与 retro-gtk-1.pc 齐备；设备端
      用包内 runner 重跑消费者并断言整帧校验和 0x52f0e94d（确定）。
    command: "bash test_ohos.sh <pkg> <builddir> <pkg>/libexec/retro-runner"
    assertion_count: 19

assertion_count: 31

notes: |
  上游有测试：tests/meson.build 注册 2 项 meson test（RetroCore test、reftest），
  build() 内实跑 2/2 OK（R51 三步法：清点 → 实跑 → 本文件如实回填）。
  上游 CI 自身用 flatpak + xvfb-run 跑同一批测试（retro-gtk 的 run-tests.sh），
  其中 reftest 依赖 display：本适配用补丁 0003 把 gtk_test_init() 换成
  g_test_init()（该 reftest 只比较软件渲染 pixdata、不建 widget，断言一条未删），
  使其可在无显示器的 OHOS 沙箱内实跑。
  test_package 为消费者视角：驱动被测包内的 retro-runner 跑一个自写假核心，
  逐像素校验视频输出契约，并额外做鸿蒙平台断言（ELF64/AArch64、.codesign、
  soname、无 Linux 专有依赖、符号/头文件/.pc、设备端校验和确定）。
