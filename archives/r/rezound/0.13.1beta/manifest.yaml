# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "conan get() 用 os.path.basename(url) 推断文件名并据此选解压器：SourceForge 项目页的 /download 结尾 URL 会被当 zip 解压（BadZipFile），须改用 downloads.sourceforge.net/project/<proj>/<path>/<file> 直链形式"
  - "fox-config 的 prefix 固化为 '/'（上游在 DESTDIR staging 前烘焙），--prefix= 覆盖只改脚本内部变量，includedir/libdir 已定型：-I/-L 必须由配方直接注入，不能指望 fox-config --cflags/--libs"
  - "AX_PATH_GENERIC 通过 PATH 查找 fox-config、AC_PATH_PROG 查找 reswrap —— 二者必须经 build env PATH 暴露，否则 configure.ac:739/746 直接 AC_MSG_ERROR"
  - "新版 libc++ 下 map<const string, T> 非法（const 限定键类型），须去掉 const（TPoolFile.h/.cpp 共 4 处）"
  - "新版 libc++ 不再间接包含 <string>，头文件须显式自包含（TMemoryPipe.h、CTrigger.h）"
  - "vector<bool> 是特化：operator[] 返回代理引用而非 bool&，模板 anytype_to_string 无法推导元素类型而落到未定义的primary template，须补普通重载"
  - "make 并行会踩 HMDFS jobserver fifo，OHOS 上固定 make -j1"
  - "configure 的 (umask 077 && mktemp -d) 造出的 confXXXXXX 目录在 HMDFS 上权限不可用（E011），改为 umask 022"

