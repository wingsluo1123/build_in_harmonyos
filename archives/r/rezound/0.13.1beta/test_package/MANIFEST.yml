# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: rezound/0.13.1beta
homepage: "https://rezound.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# ── 上游测试清点（R51 三步法，证据留档）────────────────────────────
# 清点结论：ReZound 0.13.1beta 上游不含任何测试。
#   证据 1: 源码树无 tests/ 目录，configure.ac / 各 Makefile.am 无 TESTS、
#           check_PROGRAMS、check-local 声明。
#   证据 2: 实际执行 `make check` → "make: Nothing to be done for 'check'"
#           (rc=0)，零个测试被编译或运行。
#   证据 3: 全树唯一的 check 目标是 Makefile.am:74 的 `distcleancheck:`，
#           属 automake 自动生成的清理目标，非测试。
# 因此无力可借上游测试，消费者验证由下方 test_package 的鸿蒙特有用例承担。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: >-
      鸿蒙消费者测试（非上游用例）：① 经 VirtualRunEnv 定位已安装的
      bin/rezound；② 解析 ELF 头校验 64 位 + e_machine=0xB7(AArch64)，
      证明产物为 OHOS 交叉编译目标而非宿主二进制；③ 校验 share/rezound
      下 5 个数据文件（presets/key_bindings/menu/impulse_hall1.wav/
      icon_logo_32.gif）已随包安装；④ 实跑二进制（无 DISPLAY），
      断言失败点恰为 FOX 的 "unable to open display" 且不含动态加载器
      缺库报错——即整条动态依赖链 libFOX-1.6→libX11/libXext→Xft/
      freetype/fontconfig 在鸿蒙侧可解析，这是 GUI 依赖链漏打包时
      唯一会挂掉的环节。
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
