knowledge_gained:
  - "鸿蒙没有 /bin/bash（E165）：依赖 bash 特性的脚本（$(< file)、echo -en、[ == ]）不能改成 /system/bin/sh，shebang 应指向 /data/service/hnp/bin/bash"
  - "鸿蒙 /tmp 只读（E002）：脚本把工作目录硬编码成 /tmp/<name>-$$ 时，改成 ${TMPDIR:-/tmp}/<name>-$$；『保留现场』分支里的 cd /tmp 要同步改为 cd 到工作目录的父目录，否则 tar 打包找不到目录"
  - "lang-preflight 对纯 Shell 项目判 other（无构建系统、无可统计源文件），必须用 --lang other 如实申报，不能伪报 cpp"
  - "init-build 对无构建系统的脚本包把 build_system 误渲染为 autotools，conan-init 随之生成 autotools 配方与 CMake test_package 骨架，需要整体改写为脚本包（参照 headeronly 变体 C）"

