software: rfcdiff
display: "rfcdiff"
description: "比较两份 Internet-Draft / RFC 文本的差异（单文件 bash + awk 脚本），去掉页眉页脚后输出并排 HTML、变更条文本、普通 diff 或 wdiff"
category: development
homepage: "https://github.com/ietf-tools/rfcdiff"
license: "GPL-2.0-or-later"
build_system: custom

ohos_adaptation:
  key_points:
    - "单文件 bash 脚本（内嵌 awk），无编译单元、无构建系统、无 Conan 依赖"
    - "鸿蒙没有 /bin/bash（知识条目 E165）：脚本依赖 bash 特性，shebang 改为 /data/service/hnp/bin/bash（不能降级到 /system/bin/sh）"
    - "鸿蒙 /tmp 只读（知识条目 E002）：工作目录由 /tmp/rfcdiff-$$ 改为 ${TMPDIR:-/tmp}/rfcdiff-$$，--keep 分支的 cd /tmp 同步改为工作目录的父目录"
    - "package_type=application；package_id 删除 arch/compiler/build_type，保留 os（产物含鸿蒙专用 shebang）"
    - "上游发布树无测试（仅 LICENSE/README.md/rfcdiff），test_package 补充 10 条通用 + 5 条鸿蒙特有消费者用例"
  common_dependencies: []

versions:
  "1.49":
    status: built
    build_date: "2026-10-04"
    conan_ref: "rfcdiff/1.49"
