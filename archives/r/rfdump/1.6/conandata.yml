# conandata.yml — rfdump 1.6
# 官方源（R39）：rfdump 项目官网（www.rfdump.org）下载区的发布归档。上游 2008 年后
# 停更、无 git tag，版本以「官方发行渠道存在该版本可构建发行物 + sha256」实核：
#   官网下载区 dl/rfdump-1.6.tar.gz（151954 B，HTTP 200）
# sha256 与 Debian 源码包 rfdump_1.6-9.1 的 .orig.tar.gz 逐字节一致（两个独立渠道
# 互证；版本清单见 sources.debian.org 上的 rfdump 条目）。tar 包内文件 mtime 为
# 2008-06，非重打包。
#
# ⚠️ 本文件注释里刻意不写完整 URL：`ci/conan/build_and_test.sh` 的预下载器会把
# conandata.yml 中任何形如 `<scheme>://…` 的串都当源码 URL 下载，并对**整份文件**做
# 裸字符串替换改写成本地 file 协议路径。注释里再写一个站内 URL（如官网首页）会让真正
# 的源 URL 被前缀改写坏（实测得到 `<注释 URL 的本地缓存>dl/rfdump-1.6.tar.gz`），随后
# source() 直接 FileNotFoundError。域名写裸名即可规避。

sources:
  url: "https://www.rfdump.org/dl/rfdump-1.6.tar.gz"
  sha256: "5b1ec066d28905df8526862c77629c8cecb6f3ea2462021a0b30d8c44d7b30dc"

# strip 用 0（默认值）：本补丁集含「新增 src/rfdump.ui」与「删除
# src/rfdump.glade / rfdump.gladep」两种形态。Conan 的 patch_ng 对
# 新增/删除分支先 decode_clean 掉 a//b/ 前缀、再按 strip 二次剥路径，
# 用 strip: 1 会把 src/ 一并剥掉（双剥缺陷）；strip: 0 三种形态均正确
# （纯修改分支由 patch_ng findfiles 的 a//b/ 回退处理，同仓库 altermime 先例）。
patches:
  - patch_file: "patches/0001-port-gtk2-to-gtk3-builder.patch"
    strip: 0
    patch_description: "Port the GUI from GTK2 + libglade to GTK3 + GtkBuilder (drop-libglade port, adapted from the Arch Linux / Debian package patch by Ballo Gyorgy): configure.in, src/*.c, src/*.h, src/Makefile.am, remove rfdump.glade/rfdump.gladep, add rfdump.ui"
    patch_type: "portability"
  - patch_file: "patches/0002-modern-toolchain-fixes.patch"
    strip: 0
    patch_description: "clang 15 build fixes carried by the Debian package: -Wformat-security clean error_dialog() calls and drop the duplicate windowPreferences/windowAbout globals already declared extern in main.h"
    patch_type: "portability"
  - patch_file: "patches/0003-packaging-paths.patch"
    strip: 0
    patch_description: "Keep every installed artefact under $(prefix): pixmapdir $(prefix)/share/pixmaps and a theme-name Icon in rfdump.desktop"
    patch_type: "portability"
  - patch_file: "patches/0004-shipped-autotools-gtk3.patch"
    strip: 0
    patch_description: "Update the shipped generated configure/Makefile.in for GTK3 (gtk+-3.0 probe, drop the libglade probe, GTK2_* -> GTK3_*, drop the perl CFLAGS munging, strip the HMDFS-hostile umask 077) so that no autoreconf is needed; the 2008 autoconf-2.61 tree cannot be regenerated by automake 1.18 (AM_CONFIG_HEADER was removed)"
    patch_type: "portability"
  - patch_file: "patches/0005-ohos-runtime-paths.patch"
    strip: 0
    patch_description: "OHOS runtime paths: resolve rfdump.ui/rfd_types.xml next to the executable (the Conan package is relocatable) and keep the RFID reader bring-up working when /var/lock does not exist"
    patch_type: "portability"
  - patch_file: "patches/0006-headless-cli-and-reader-probe.patch"
    strip: 0
    patch_description: "Answer --version/--help before gtk_init and add a --probe-reader entry point that runs the packaged GtkBuilder resource, the expat tag-type table and the termios reader bring-up without realising a window"
    patch_type: "test"
