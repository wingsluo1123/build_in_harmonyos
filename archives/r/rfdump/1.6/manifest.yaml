knowledge_gained:
  - "HarmonyOS 没有 /var（进而没有 /var/lock），传统串口互斥锁 /var/lock/LCK..<tty> 会让 termios 串口 bring-up 在碰到设备节点之前就失败，错误措辞指向读写器/驱动；降级为提示后继续，才能把失败点归因到真正缺失的设备节点"
  - "本机串口设备节点整片缺失（/dev/ttyUSB0、/dev/ttyS0、/dev/input 均 ABSENT，只有 /dev/tty）：串口类包必须提供可在无设备环境下自报结果的无头探测入口，否则「串口配置是否正确」结构性不可验证"
  - "OHOS clang 三元组是 aarch64-linux-ohos，__linux__ 仍被定义，因此 #if defined(__linux__) 的 /var/lock 串口锁分支在鸿蒙上照常编入并生效"
  - "lld 不像 GNU ld 默认 --as-needed：configure 注入的 -lexpat 即使 conftest 从不调用也会留下 DT_NEEDED，于是 autoconf 的 int main(){} 探针加载失败并报假的 'cannot run C compiled programs'；解法是给 configure 环境注入依赖 libdir 的 LD_LIBRARY_PATH"
  - "2008 年 autoconf 2.61 生成产物存在恒真的 maintainer 规则（aclocal.m4/configure/Makefile.in/config.h.in）：一旦 configure.in/Makefile.am 比生成产物新就会触发；设备上 autoconf 2.73 会重写 configure 并重新引入 umask 077 的 AS_TMPDIR（HMDFS 落盘后目录不可写 → config.status 报 subs1.awk: Permission denied）。补丁化生成产物时必须同时在 build() 里给它们盖章"
  - "鸿蒙 GTK3 只有 broadway 后端：最小 GTK3 程序可正常运行，但 rfdump 主窗口的 GtkTreeView 触发 'infinite surface size not supported' 后 GDK 断言 abort（_gdk_broadway_server_window_update data != NULL），GUI 只能交付到编译/链接/资源加载级"

knowledge_ref:
  - "E2296: HarmonyOS 无 /var/lock 且无串口设备节点——termios 串口 bring-up 的失败点与降级取证（knowledge/drafts/E2296-draft-ohos-serial-lockfile-no-device-node.kv）"
