## 上游测试

GNU Binutils 提供完整的 `make check` 测试套件，包含数千个测试用例。
对于交叉工具链，需要 qemu-riscv64 用户态模拟器才能完整运行目标代码相关的测试。
主机端工具（--version 输出等）可以在 OHOS 上直接验证。

## 质量规范

符合 SKILL.md 中的质量要求：
- R34 ✅ test_package 实质调用被测包二进制
- G1 ✅ 配方完整性（conanfile.py + conandata.yml + test_package/）
- L2 ✅ smoke test 通过 `--version` 验证
- R38 ✅ 命令行工具声明（commands.json）
- R32 ✅ settings.os 兼容 ("Linux", "OHOS")
