software: riscv64-elf-binutils
display: "RISC-V 64-bit ELF cross binutils"
category: toolchain
build_system: autotools
url_template: "https://ftp.gnu.org/gnu/binutils/binutils-{version}.tar.gz"
url_fallback: "https://mirrors.tuna.tsinghua.edu.cn/gnu/binutils/binutils-{version}.tar.gz"
tar_format: "tar.gz"
static_build: false
known_issues:
  - "交叉编译工具链，目标 riscv64-elf bare-metal"
  - "--disable-gprofng（SIGEV_THREAD_ID 在 OHOS 未定义）"
  - "需要 config.guess/config.sub 补丁（HarmonyOS 识别，E007）"
  - "所有 configure 脚本 umask 077→022（HMDFS 兼容，E011）"
  - "test_package 验证 `--version` 输出（不需要目标代码执行）"

versions:
