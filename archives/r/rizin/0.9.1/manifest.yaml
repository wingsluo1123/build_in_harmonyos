# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.1"

# 软件名
software: "rizin"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-09"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 release 源码包，含内置 subprojects）
  url: "https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-src-v0.9.1.tar.xz"

  # 源码校验和
  sha256: "7ac1cd7daca7afdda742e15478b1f747fc1f813e496fee71839d1e109e543dca"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "use_sys_pcre2=enabled"
    - "use_sys_magic=enabled"
    - "use_sys_zlib=enabled"
    - "use_sys_lz4=enabled"
    - "use_sys_libzstd=enabled"
    - "use_sys_openssl=enabled"
    - "use_sys_capstone=disabled"
    - "use_sys_libzip=disabled"
    - "use_sys_lzma=disabled"
    - "use_sys_xxhash=disabled"
    - "use_sys_libmspack=disabled"
    - "use_sys_tree_sitter=disabled"
    - "use_sys_softfloat=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "pcre2/10.45.1"
    - "file/5.48"
    - "zlib/1.3.1.1"
    - "lz4/1.10.0"
    - "zstd/1.5.7"
    - "openssl/3.5.6"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-librz-debug-meson.build.patch"
  - "0002-librz-include-rz_userconf.h.in.patch"
  - "0003-librz-util-thread.c.patch"
  - "0004-meson.build.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS bionic/musl libc 不实现 POSIX 线程取消 API（pthread_setcancelstate/type），需 meson has_function 探测 + 宏守卫（R8 合规）"
  - "meson 默认 use_sys_* 全 disabled，v0.9.1 官方 release tarball 已内置 subprojects 源码，无需 git 预克隆"

patch_generation:
  method: refresh-patch --auto
  source_orig_dir: /storage/Users/currentUser/tmp/rizin-0.9.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/rizin-0.9.1.work
