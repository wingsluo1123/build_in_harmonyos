# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rmlint/v2.10.3
homepage: "https://github.com/sahib/rmlint"

# 上游测试命令 (rmlint uses pytest for testing)
upstream_check_command: "python3 -m pytest tests/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests/ -x -v --timeout=120"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: rmlint-v2.10.3/tests/
    description: "Python pytest test suite"
    command: "pytest tests/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 rmlint 二进制可执行并输出版本信息"
    command: "rmlint --help && rmlint --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2