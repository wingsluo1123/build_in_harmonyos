sources:
  # rna-star 2.7.11b 官方源码（Spliced Transcripts Alignment to a Reference）
  # 镜像优先，官方 github.com 保留末尾作回退（与 ci/conan/build_and_test.sh get_mirrors 一致）
  url:
    - "https://gh-proxy.com/https://github.com/alexdobin/STAR/archive/refs/tags/2.7.11b.tar.gz"
    - "https://github.com/alexdobin/STAR/archive/refs/tags/2.7.11b.tar.gz"
  sha256: "3f65305e4112bd154c7e22b333dcdaafc681f4a895048fa30fa7ae56cac408e7"

patches:
  - patch_file: "patches/0001-remove-register-keyword-cxx17.patch"
    patch_description: "0001 remove C++17 removed register storage class from SuffixArrayFuns.cpp"
    patch_type: "portability"
  - patch_file: "patches/0002-add-sys-types-h-for-key_t.patch"
    patch_description: "0002 add <sys/types.h> include to SharedMemory.h for key_t (not pulled in transitively on OHOS musl)"
    patch_type: "portability"
