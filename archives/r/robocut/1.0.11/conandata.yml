# 上游 Robocut.pro 只声明 `QT += svg`，但全部源码使用 QtWidgets 类
# （QApplication/QMainWindow/QDialog/QFileDialog/QMessageBox/QPushButton…）；
# Qt5 的默认 QT 是 `core gui`（mkspecs/features/spec_pre.prf），svg 模块
# depends=core gui 也不含 widgets → 不显式声明时 <QApplication> 等头文件
# 找不到（实测 `fatal error: 'QApplication' file not found`）。
patches:
  "1.0.11":
    - patch_file: "patches/0001-Robocut.pro-add-qt-widgets.patch"
