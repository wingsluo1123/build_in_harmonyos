version: "9.0.0"
status: published
build_date: "2026-07-02"

source:
  url: "https://github.com/rocq-prover/rocq/releases/download/V9.0.0/rocq-9.0.0.tar.gz"
  sha256: "82f86646fd3d047f760837648195c73374beee667b1c9592d31c5426e3b43a51"
  tar_format: tar.gz

build:
  system: dune
  configure_options:
    - "-prefix /storage/Users/currentUser/usr/local"
    - "-no-ask"
    - "-native-compiler no"
    - "-bytecode-compiler yes"
  dependencies:
    - "ocaml/4.14.1 (system)"
    - "dune/3.17.0 (system)"
    - "findlib/1.9.8 (system)"
    - "zarith/1.14 (system)"
    - "menhir/20260209 (system)"
    - "gmp/6.3.0 (system)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Rocq 9.0.0 is the first release after Coq -> Rocq renaming"
  - "Uses Dune build system (not autotools)"
  - "OHOS: native ELF binaries blocked, bytecode workers used"
  - "dune install has path traversal issues on OHOS, manual copy used"
  - "rocqworker replaced with bytecode version for OHOS security"
