patches:
  - patch_file: "patches/0001-subprojects-libnkutils-core-src-format-string.c.patch"
    patch_description: "libnkutils (bundled subproject) format-string '/' branch OOB write fix: escape removal in the counting loop shifts the string tail left in place but the outer e (closing brace position) is not updated, so the pair walk runs one extra round and token.replace[c].regex=NULL writes 8 bytes past the g_new array (heap OOB write; harmless on Linux due to allocator size-class rounding, corrupts heap on OHOS and crashes at G_MAXSIZE/2 allocation ceiling); upstream sardemff7/libnkutils master still carries the defect"
    patch_type: "bugfix"
