# 编译中学到的知识
knowledge_gained:
- "OHOS 包树 (.conan2/p/...) 内 ELF 执行需有效 .codesign，无效报 EPERM (126)；.so dlopen 无效签名报 EACCES (13) → llvm-objcopy --remove-section .codesign 后 binary-sign-tool sign -selfSign 1（appstream/aravis 先例）"
- "ohpcd wayland/1.22.0 包内 libwayland-cursor.so.0.22.0 的 .codesign 失效（同包 client 正常）→ package() 复制重签入本包 lib/ 并在 libdirs 前置"
- "check 0.15.2 临时目录优先级 TEMP → P_tmpdir（编译期固定 /tmp，OHOS 只读）→ build() 内 os.environ 注入 TEMP=<build>/test-tmp"
- "libnkutils format-string '/' 分支 OOB 写（上游 sardemff7/libnkutils master 未修复）→ 2 行最小补丁"

