# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rofi/2.0.0
homepage: "https://github.com/DaviDar/rofi"

# 上游测试命令 (meson 项目: meson test)
upstream_check_command: "meson test"

# conanfile.py build() 方法中已集成上游测试
# (meson test, TEMP 指向构建私有目录 + LD_LIBRARY_PATH 注入, 见 conanfile.py _run_upstream_tests)
upstream_test_in_build: true
upstream_test_command: "meson test -C <build_folder>"

# 上游实际运行的测试程序 (共 18 个: 捆绑子工程 libnkutils 6 + rofi 12;
# rofi 侧 3 个 check 门控测试需 -Dcheck=enabled)
upstream_tests:
  - file: subprojects/libnkutils/core/tests/enum.c
    source: rofi-2.0.0/subprojects/libnkutils/core/tests/enum.c
    description: "libnkutils enum module tests (13 subtests, TAP)"
    command: "./nk-enum.test --tap"
  - file: subprojects/libnkutils/core/tests/format-string.c
    source: rofi-2.0.0/subprojects/libnkutils/core/tests/format-string.c
    description: "libnkutils format-string module tests (94 subtests, TAP; 含 OOB 修复覆盖用例 replace/escaping/forwardslash)"
    command: "./nk-format-string.test --tap"
  - file: subprojects/libnkutils/core/tests/colour.c
    source: rofi-2.0.0/subprojects/libnkutils/core/tests/colour.c
    description: "libnkutils colour module tests (17 subtests, TAP)"
    command: "./nk-colour.test --tap"
  - file: subprojects/libnkutils/core/tests/xdg-de.c
    source: rofi-2.0.0/subprojects/libnkutils/core/tests/xdg-de.c
    description: "libnkutils xdg-de module tests (19 subtests, TAP)"
    command: "./nk-xdg-de.test --tap"
  - file: subprojects/libnkutils/core/tests/gtk-settings.c
    source: rofi-2.0.0/subprojects/libnkutils/core/tests/gtk-settings.c
    description: "libnkutils gtk-settings module tests (4 subtests, TAP)"
    command: "./nk-gtk-settings.test --tap"
  - file: subprojects/libnkutils/core/tests/xdg-theme.c
    source: rofi-2.0.0/subprojects/libnkutils/core/tests/xdg-theme.c
    description: "libnkutils xdg-theme module tests (4 subtests, TAP)"
    command: "./nk-xdg-theme.test --tap"
  - file: test/history-test.c
    source: rofi-2.0.0/test/history-test.c
    description: "rofi history mode 历史条目解析 (check)"
    command: "./history.test"
  - file: test/widget-test.c
    source: rofi-2.0.0/test/widget-test.c
    description: "rofi widget 行/元数据 (check)"
    command: "./widget.test"
  - file: test/box-test.c
    source: rofi-2.0.0/test/box-test.c
    description: "rofi box 布局 (check)"
    command: "./box.test"
  - file: test/scrollbar-test.c
    source: rofi-2.0.0/test/scrollbar-test.c
    description: "rofi scrollbar 几何 (check)"
    command: "./scrollbar.test"
  - file: test/textbox-test.c
    source: rofi-2.0.0/test/textbox-test.c
    description: "rofi textbox 渲染/截断 (check)"
    command: "./textbox.test"
  - file: test/helper-test.c
    source: rofi-2.0.0/test/helper-test.c
    description: "rofi helper 工具函数 (check)"
    command: "./helper.test"
  - file: test/helper-expand.c
    source: rofi-2.0.0/test/helper-expand.c
    description: "rofi helper_expand 宏展开 (check)"
    command: "./helper_expand.test"
  - file: test/helper-pidfile.c
    source: rofi-2.0.0/test/helper-pidfile.c
    description: "rofi helper_pidfile 单实例锁 (check)"
    command: "./helper_pidfile.test"
  - file: test/helper-config-cmdline-parser.c
    source: rofi-2.0.0/test/helper-config-cmdline-parser.c
    description: "rofi helper_config_cmdline_parser 配置/命令行解析 (check)"
    command: "./helper_config_cmdline_parser.test"
  - file: test/mode-test.c
    source: rofi-2.0.0/test/mode-test.c
    description: "rofi mode 模式加载 (check, 需 -Dcheck=enabled)"
    command: "./mode.test"
  - file: test/helper-tokenize.c
    source: rofi-2.0.0/test/helper-tokenize.c
    description: "rofi helper_tokenize 分词 (check, 需 -Dcheck=enabled)"
    command: "./helper_tokenize.test"
  - file: test/theme-parser-test.c
    source: rofi-2.0.0/test/theme-parser-test.c
    description: "rofi theme_parser 主题解析 (check, 需 -Dcheck=enabled; bison/flex 生成解析器)"
    command: "./theme_parser.test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者用例: 模拟上层组件经 popen 调用 rofi 公开 CLI (rofi -v 版本探针), 断言退出码 0 且输出含 Version"
    command: "./test_rofi"

# 测试断言总数 (实测: libnkutils 6 套 TAP 151 subtests + rofi 12 个 check 套件 489 断言)
assertion_count: 640
