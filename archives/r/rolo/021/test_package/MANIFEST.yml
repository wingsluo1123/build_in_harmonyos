# test_package/MANIFEST.yml — rolo 021
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 结论：上游 rolo v021 tag 有 4 个 shunit2 单元测试（test/run-tests），
# 由 conanfile.py build() 的 `make check` 在真机实跑；计数字段全部来自
# 真机实测，见下方 upstream_test_audit。

package: rolo/021
homepage: "https://github.com/libvc/rolo"

# ── 上游测试套件（经审计官方 v021 tag 确认存在）─────────────────────
upstream_tests_exist: true
upstream_test_total: 4
upstream_test_count_method: auto

upstream_test_audit: "rolo v021（官方 GitHub tag 归档，39 个文件）：test/run-tests（#!/bin/sh，set -e）定义 4 个 shunit2 测试函数 — test_rolo_version（断言 `rolo -v` 输出与 configure.ac 的 AC_INIT 名称/版本一致）、test_rolo_startup_and_help（echo hqq | TERM=dumb rolo -f contacts.vcf）、test_rolo_search_and_delete（mktemp 拷贝 fixture，搜索 Burger 后删除并 grep 确认消失）、test_rolo_move_and_edit（ROLO_EDITOR=cat 导出 Alex Winter 条目并断言 FN 行）；build() 经 sh 直接执行 run-tests（不再经 test/Makefile 的 check 目标，因无 autoreconf 可生成 Makefile；ROLO 默认为 ../src/rolo 即直接链接产物）；test/contacts.vcf 为真实 vCard fixture。计数口径 auto（单一 shunit2 框架：测试函数数 == shunit2 'Ran N tests.' 汇总行）。"

upstream_check_command: "sh test/run-tests"
upstream_test_in_build: true
upstream_test_command: "sh test/run-tests（ROLO 默认为 $CURDIR/../src/rolo）"

upstream_tests:
  - name: "run-tests (shunit2)"
    file: test/run-tests
    source: rolo-021/test/
    description: "4 个 shunit2 用例：版本断言 / 启动与帮助 / 搜索删除 / 移动编辑；全部以 TERM=dumb 无头驱动 curses 界面"
    command: "make check"
    executed: true
    result: "待 HMBS 真机预检回填（首轮工作树未跑真机，不得猜测）"

# ── test_package 自带的消费者视角测试（真机实跑）────────────────────
test_package_tests:
  - file: test.sh
    description: >-
      5 个独立消费者断言（test.sh 确定性计数 ROLO_TEST_TOTAL/PASS/FAIL，
      discovered/passedCount=5）：(A) rolo 在 PATH 可定位；(B) rolo -v 精确
      输出 rolo 021 且 rc=0；(C) rolo -V 打印 GPL 声明且 rc=0；(D) rolo -h
      打印 usage 且 rc=0；(E) printf qq 管道 + TERM=dumb 无头运行，
      rc=0 且联系人文件字节级不变（只读退出）。全部为真实执行+行为校验。
    command: "bash test.sh <package_folder>（由 test_package/conanfile.py test() 经 self.run 实跑，解析 ROLO_TEST_* 生成 HMBS_TEST_PACKAGE_RESULT；同时把包内 share/doc/rolo/upstream-check.json 逐字节重发为 HMBS_UPSTREAM_TEST_RESULT）"
    assertion_count: 5

# 测试断言总数（test_package 消费者视角断言）
assertion_count: 5
test_package_test_count: 5
