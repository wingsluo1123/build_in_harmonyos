software: rolo
display: "rolo"
description: "rolo - text-based (vCard) contact management software with an ncurses interface"
category: utility
homepage: "https://github.com/libvc/rolo"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub v021 tag 无 configure 生成物，需 autoreconf -fi（tool_requires automake/1.18 + libtool/2.5.4）"
    - "config.guess 不识别 HarmonyOS，显式 --build/--host=aarch64-unknown-linux-gnu"
    - "test/run-tests 用 $0 相对路径定位 fixture，必须 in-source 构建"
    - "硬依赖 libvc（本仓尚无配方，为 R36 前置任务）+ ncursesw/menuw + glib-2.0 + unac"
    - "上游 4 个 shunit2 用例由 make check 实跑并落证 JSON，test_package 逐字节重发标记"
  common_dependencies:
    - ncurses
    - glib
    - unac
    - libvc

versions:
  "021":
    status: built
    build_date: "2026-10-13"
