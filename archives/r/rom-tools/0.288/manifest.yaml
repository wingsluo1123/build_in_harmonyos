  - 0002-3rdparty-lzma-C-Sha256.c.patch
  - 0003-src-osd-modules-lib-osdlib_unix.cpp.patch

knowledge_gained:
  - "MAME build system requires genie + SDL2; standalone build bypasses this"
  - "chdman/romcmp are pure CLI tools that don't need SDL"
  - "osdlib_unix.cpp includes SDL headers for clipboard functions; guarded with __OHOS__"
  - "LZMA AesOpt.c and Sha256Opt.c use ARM crypto intrinsics not available on HarmonyOS clang 15"
  - "Aes.c and Sha256.c define USE_HW_AES/Z7_COMPILER_SHA256_SUPPORTED based on clang version; disabled via __OHOS__ guard"
  - "MAME needs C++20 for char8_t, std::span, std::u8string_view"
  - "FLAC conan package has OGG dependency; use embedded FLAC with FLAC__HAS_OGG=0 instead"

