# test_package/MANIFEST.yml — rover 1.0
# CI L0e requires this file to exist.

package: rover/1.0
homepage: "https://github.com/lecram/rover"

# 上游无自动化测试套件（单文件 C 程序，Makefile 无 check 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 自带的验证（消费者视角）
test_package_verification:
  - command: "rover --version"
    expect: "rover 1.0.0"
  - command: "rover --help"
    expect: "Usage: rover [OPTIONS] [DIR [DIR [...]]]"
