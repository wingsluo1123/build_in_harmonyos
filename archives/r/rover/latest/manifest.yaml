# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "aws-lc-sys (AWS-LC crypto) fails to build on OHOS: assembly files not compiled because DISABLE_PERL=ON prevents Perl-based assembly generation, and ARCH detection may set 'generic' for OHOS targets"
  - "Solution: switch from aws-lc-rs to ring crypto provider by changing reqwest features from 'rustls' to 'rustls-no-provider' and adding explicit rustls/hyper-rustls/tokio-rustls deps with 'ring' feature"
  - "reqwest 0.13+ supports 'rustls-no-provider' feature which enables rustls without aws-lc-rs, allowing ring to be used as the crypto provider"
  - "rustls 0.23 default features include 'aws_lc_rs'; must use default-features=false with features=['ring'] to avoid pulling in aws-lc-rs"
  - "Go linker fails with 'mapping output file failed: permission denied' on OHOS tmpfs; GOCACHE and GOTMPDIR must be set to writable directories"
  - "Apollo Rover is a Rust/Cargo workspace project with multiple crates; all Cargo.toml files using reqwest 'rustls' feature must be updated"
  - "Rust edition 2024 requires Rust 1.85+; harmonybrew provides Rust 1.96.1 which is compatible"

