# MANIFEST.yml — test_package for rover 0.40.0
# Upstream test declaration

package: rover
version: 0.40.0

tests:
  - name: "smoke-test"
    type: "shell"
    description: "Verify rover binary executes and reports version correctly"
    command: "test.sh"
    expected_output_contains:
      - "Rover 0.40.0"
      - "All smoke tests passed"

upstream_tests:
  - name: "cargo test"
    url: "https://github.com/apollographql/rover/blob/v0.40.0/Cargo.toml"
    note: "Upstream uses cargo test for unit tests; CI smoke test verifies binary functionality"
