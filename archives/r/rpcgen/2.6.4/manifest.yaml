knowledge_gained:
  - "rpcgen 无独立发布轨：维护中的副本是 nfs-utils 源码树 tools/rpcgen/，包版本 = nfs-utils 版本，源码取官方 tarball；子目录式打包必须跑顶层 configure，因而继承其无条件门禁（uuid/libevent/sqlite3/rpc.h）"
  - "OHOS 的 C 预处理器只以 clang-cpp 提供，没有 `cpp` 命令；rpcgen 运行期恒需外部预处理器（/lib/cpp → PATH 中 cpp → -Y <dir>），且 clang 对 .x 扩展名必须显式 -x c 才会进入预处理模式"
  - "rpcgen 源码使用 LFS64 的 struct stat64/stat64()；OHOS libc 仅在 _LARGEFILE64_SOURCE（POSIX 特性宏）下提供这些别名，glibc 默认提供，因此上游没有守卫——用编译期特性宏即可，不必打补丁"
  - "OHOS libc 只声明 index()，从不声明 BSD 遗留的 rindex()（<strings.h> 亦无）；-Werror=implicit-function-declaration 下必须改用 POSIX strrchr()"
  - "libtirpc 的旧式 clnttcp_create() 要经 netconfig 解析 netid，OHOS 无 /etc/netconfig 且路径为编译期常量（NETCONFIG 环境变量不生效），报 RPC: Unknown protocol；改用 clnt_vc_create()/svc_vc_create() 直接传 fd+地址可完全绕开"

