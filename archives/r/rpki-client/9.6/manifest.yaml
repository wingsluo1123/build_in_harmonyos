software: rpki-client
# 版本级 manifest
# 文件位置: archives/r/rpki-client/9.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "9.6"
status: published
build_date: "2026-08-08"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/rpki-client/rpki-client-portable/releases/download/9.6/rpki-client-9.6.tar.gz"
  sha256: "07cbd27af99f1b6096769e697e38631519c69cb642bee3af39a763fa1590d947"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-gnu"
    - "--with-tal-dir=${package_folder}/etc/rpki"
    - "--with-base-dir=/usr/local/cache/rpki-client"
    - "--with-output-dir=/usr/local/db/rpki-client"

  dependencies:
    - "libressl/3.9.1"
    - "musl-fts/1.2.7"
    - "expat/2.8.2"
    - "zlib/1.3.1"
    - "rsync/3.3.0"

  build_requires:
    - "automake/1.18"
    - "libtool/2.5.4"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 文件系统限制导致 configure/config.status 无法创建临时文件"
  - "config.guess 不识别 HarmonyOS，需手动指定 --host=aarch64-unknown-linux-gnu"
  - "config.status 的 umask 077 在 HMDFS 上创建不可写的临时目录，需移除 umask"
  - "GitHub release tarball 包含完整源码，auto-generated archive 仅含移植层"
  - "rpki-client 依赖 LibreSSL（非 OpenSSL）的 libtls"
  - "rpki-client 使用 autotools 构建，需 automake + libtool 作为 build_requires"
