# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rpki-client/9.6
homepage: "https://rpki-client.org"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# rpki-client uses OpenBSD-style make check which requires network access
# and RPKI repository connectivity — not feasible in CI environment
upstream_tests:
  - file: "N/A"
    source: "OpenBSD usr.sbin/rpki-client (no standalone test suite)"
    description: "rpki-client has no standalone test suite; validation requires live RPKI data"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "通过 popen() 调用 rpki-client -V 验证版本号输出（R34 合规）"
    command: "./test_rpki_client"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
