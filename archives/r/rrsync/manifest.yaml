software: rrsync
display: "rrsync"
description: "Script that restricts rsync to a subdirectory declared in .ssh/authorized_keys"
category: "network"
homepage: "https://rsync.samba.org/"
license: GPL-3.0-or-later
build_system: none

ohos_adaptation:
  key_points:
    - "rrsync 是 rsync 官方源码自带的纯 Python3 脚本（support/rrsync），无编译阶段（no-build 脚本工具族）"
    - "补丁 0001：RSYNC 常量由硬编码 /usr/bin/rsync 改为 shutil.which('rsync') 动态解析，适配 conan/鸿蒙 PATH 布局"
    - "运行期依赖 python3 解释器（目标环境需具备，如 conan python/3.12.9 包或系统 python3）"
    - "运行期依赖 rsync 二进制（配合 conan rsync 包使用）"
  common_dependencies:
    - python3 (runtime, provided by environment)
    - rsync (runtime, see conan rsync package)

versions:
  "3.4.4":
    status: published
    build_date: "2026-10-03"
