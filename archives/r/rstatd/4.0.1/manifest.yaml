# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://downloads.sourceforge.net/project/rstatd/rstatd/4.0.1/rpc.rstatd-4.0.1.tar.gz"
  sha256: "b1ff2da2fb8516335c8e430a479779630fce4955ad564156da381864bb301843"
  # 与 Debian/Ubuntu 重打包的 rstatd_4.0.1.orig.tar.gz 同一个 md5，证明是未经改动的上游发布件
  md5: "116d9a8a35656e76f16c679d0596519a"
  tar_format: tar.gz
  size_bytes: 86883

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  # 2005 年的 autoconf 2.59 configure + Makefile（in-tree 构建，srcdir = .）
  # 实际执行的 configure 行（取自 conan create 日志的 `RUN: .../configure` 行）：
  #   --prefix=/ --bindir=${prefix}/bin --sbindir=${prefix}/bin --libdir=${prefix}/lib
  #   --includedir=${prefix}/include --oldincludedir=${prefix}/include
  #   --build=aarch64-unknown-linux-ohos --host=aarch64-unknown-linux-ohos
  #   CPPFLAGS=-I<libtirpc>/include/tirpc -I<libtirpc>/include
  #   LDFLAGS=-L<libtirpc>/lib  LIBS=-ltirpc
  # 后三项由配方 _tirpc_flags() 注入：libtirpc/1.3.7 已发布的二进制 conaninfo.txt
  # 里没有任何 cpp_info，消费者拿不到 include 路径也拿不到 -ltirpc。
  configure_options:
  - "--prefix=/"
  - "--bindir=${prefix}/bin"
  - "--sbindir=${prefix}/bin"
  - "--libdir=${prefix}/lib"
  - "--includedir=${prefix}/include"
  - "--oldincludedir=${prefix}/include"
  - "--build=aarch64-unknown-linux-ohos"
  - "--host=aarch64-unknown-linux-ohos"
  - "CPPFLAGS=-I<libtirpc pkg>/include/tirpc -I<libtirpc pkg>/include"
  - "LDFLAGS=-L<libtirpc pkg>/lib"
  - "LIBS=-ltirpc"
  dependencies:
  - "libtirpc/1.3.7"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
- patches/0001-rstat_proc.c-portability.patch
- patches/0002-clients-strrchr-int-getopt.patch
- patches/0003-getdata.c-modern-kernel-procfs.patch
- patches/0004-rstat_main.c-portability.patch
- patches/0005-procfs-collector-data-integrity.patch
- patches/0006-clients-drop-redundant-kr-decls.patch
- patches/0007-vendor-generated-rstat.h.patch
- patches/0008-rstat_main.c-netconfig-free-inetd-transport.patch

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
- "OHOS 无 SunRPC：<rpc/rpc.h> / <rpc/clnt.h> / <rpc/pmap_clnt.h> 与 xdr_*/svc_*/clnt_* 全部由 libtirpc/1.3.7 提供（与 archives/l/libnsl/2.0.1 同一选择）"
- "libtirpc/1.3.7 已发布的二进制 conaninfo.txt 里完全没有 cpp_info（只有 [settings]/[options]），消费者拿不到 include 路径也拿不到 -ltirpc，表现为 fatal error: 'rpc/rpc.h' file not found；必须在配方里按 package_folder 显式注入 CPPFLAGS/LDFLAGS/LIBS"
- "rstat_main.c 独立模式把 proto=IPPROTO_UDP 传给 svc_register()，而 TI-RPC 的 svc_register() 会直接返回 pmap_set() 的结果，所以没有 portmapper 时 rpc.rstatd 拒绝启动（exit 1）；inetd 模式下 proto=0，不碰 portmapper"
- "rstat_service 是 rstat_main.c 注册的手写分发器，对任何版本的 RSTATPROC_STATS 都固定用 xdr_statsusers 序列化（恒 108 字节结果），rstat.x 里 rpcgen 生成的 rstatprog_N 实际未被使用"
- "rstat_main.c 只注册版本 5/3/2/1，RSTATVERS_VAR(4) 未注册，请求版本 4 会得到 PROG_UNAVAIL"
- "上游 getdata_setup() 用 strncmp 前缀匹配 uname().release 的 2.2/2.4/2.6 来选 /proc 采集器，比 2.6 新的内核（含鸿蒙 PC）会保留 get_disk() 占位函数，收到第一个 STATS 请求即 exit(EXIT_FAILURE)"
- "OHOS clang 默认 -fno-signed-char，`char c; (c = getopt(...)) != EOF` 是恒真死循环"
- "musl 不提供 rindex()（已被 POSIX 移除），用 strrchr() 代替"
- "musl 无 <sys/cdefs.h>，原型括号宏 __P() 不存在；rstat_proc.c 依赖 glibc 的定义"
- "glibc-only 头文件 <nlist.h> 的死包含（struct nlist 全树未使用）会让 musl/OHOS 编译失败"
- "Makefile.am 把 rstat.h 放进 BUILT_SOURCES 用 rpcgen 生成，但发布 tarball 只带另外三个生成文件；OHOS 无 rpcgen 且制品仓无任何包提供它"
- "rpcgen -h -o rstat.h rstat.x 的输出即内嵌的 rstat.h；rpcgen -c 生成的 rstat_xdr.c 与 tarball 自带的逐字节一致（972 行），证明生成器与上游一致"
- "in-tree autotools 包（Makefile 里 srcdir = .）不能把 build_folder 与 source_folder 分开"
- "autoconf configure 里的 `umask 077` 在 HMDFS 上会让 config.status 建不了临时目录（与 sysstat/libnsl 同因）"

