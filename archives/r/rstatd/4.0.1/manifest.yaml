# ============================================================
# 平台注意事项
# ============================================================
platform_notes:
- "OHOS 无 SunRPC，RPC 能力来自 libtirpc/1.3.7；libtirpc 的 svcudp_create() 硬依赖 /etc/netconfig（TI-RPC 把该路径编译进二进制，无 env 可重定向），而鸿蒙 PC 不带此文件 —— 补丁 0008 让 inetd 路径改用 svc_dg_create() 彻底摆脱该依赖（真机 CI #69263 暴露）"
- "rpc.rstatd 独立模式需要运行中的 portmapper（pmap_set 失败即 exit 1）；inetd 模式不需要，测试走 inetd 模式"
- "OHOS clang 默认 -fno-signed-char，任何 `char c; while ((c = getopt(...)) != EOF)` 都要改成 int"
- "musl 不提供 rindex()"
- "musl 无 <sys/cdefs.h>，无 __P() 宏"
- "HMDFS: configure/config.status 的 `umask 077` 需放宽为 022"

# ============================================================
# 2026-10-14 修复（CI 构建 #87224 的真实失败）
# ============================================================
fixes:
  - date: "2026-10-14"
    ci_build: "87224"
    symptom: >-
      test() 第 102 行失败（ConanException: Error 2）；CI 日志里守护进程的
      syslog 被 LD_PRELOAD 的 syslog shim 透出为
      '[rstatd-syslog prio=2] cannot parse kernel release "HongMeng Kernel 1.13.0"'，
      与 notes.md 里 exit(1) 来源表 #1 完全对应。
    root_cause: >-
      patches/0003 第一版把 uname().release 整串交给 sscanf("%d.%d")，解析不到
      就直接 exit(EXIT_FAILURE)。OHOS 的 release 串是 "HongMeng Kernel 1.13.0"，
      不是 "<major>.<minor>..." 形态 —— 于是「比 2.6 新得多的内核」被判成解析失败，
      守护进程起不来。这不是内核版本挑剔，而是解析器假定了发行版命名习惯。
    fix: >-
      patches/0003 改为先跳到 release 串里第一个数字序列再按 major.minor 解析；
      仍保留 2.2/2.4 两个上游分支，其余（含 2.10/3.x/1.13）一律选 2.6+ 的
      /proc/diskstats + /proc/vmstat 采集器；只有「整串没有任何数字」才保留硬失败。
      patches/0005 的 getdata.c hunk 因 0003 加长 24 行而失效，按 0003 之后的真实
      源码树重新生成（@@ -326,13 +326,13 @@），其余两项（getdata22.c/getdata26.c 补
      string.h）原样保留。
    evidence:
      - "A/B 对照（logs/kver_check 源码 kver_check.c）：'HongMeng Kernel 1.13.0' 在旧判据下 EXIT(1)、新判据下 get_disk26+get_vm26；2.2/2.4/2.6/3.x/5.x/WSL 串两版判定一致；空串两版都硬失败"
      - "补丁按序套用（0001..0008）在真实上游源码树上 dry-run 与实套全部 rc=0"
      - "本机 conan create（profile ohos-aarch64-wsl）：test_rstatd == 41 checks, 0 failed == / RESULT: PASS"
