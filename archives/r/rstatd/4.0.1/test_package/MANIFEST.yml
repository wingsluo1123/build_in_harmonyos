# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在
package: rstatd/4.0.1
homepage: "http://rstatd.sourceforge.net/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_rstatd.c
    description: >-
      rstatd 的功能测试：直接对打包后的 rpc.rstatd 走 ONC RPC。测试自己实现
      RPC/XDR 编解码（不复用包内 rpcgen 生成的桩代码），并模拟 inetd 的行为
      （把一个已 connect 的 UDP socket 放到 fd 0），使守护进程进入不需要
      portmapper 的 inetd 模式；随后逐项断言守护进程从 /proc 采集到的真实数据。
    command: "conan test"
  - file: conanfile.py
    description: >-
      test_package 驱动：校验三个可执行文件已安装（且通过包声明的 bindirs
      出现在 PATH 上），然后执行 test_rstatd。
    command: "conan test"
  - file: CMakeLists.txt
    description: "以 C99 构建 test_rstatd.c（只依赖 libc，不链接被测包的库）"
    command: "cmake build"

assertion_count: 41

# ── 上游测试情况 ────────────────────────────────────────────────────────────
# rpc.rstatd 4.0.1 没有测试套件：Makefile.am 里没有 TESTS / check_PROGRAMS，
# automake 也没有生成 check_PROGRAMS，发布 tarball 里没有 test/ 目录，
# `make check` 因此是空目标。所以 build() 不执行 make check，
# 下面的 test_package_tests 就是本包全部的测试来源。
upstream_no_tests_reason: >-
  Makefile.am declares no TESTS and no check_PROGRAMS, automake therefore
  generates an empty `check` target, and the release tarball ships no test
  directory. `make check` is a no-op upstream, so the functional coverage is
  provided by test_package instead.

# ── 鸿蒙特有测试 ────────────────────────────────────────────────────────────
harmonyos_specific_tests:
  - id: ohos-modern-kernel-procfs
    assertion: >-
      守护进程能在鸿蒙 PC 的 Linux 内核（5.x/6.x）上完成一次 STATS 请求并正常返回。
      上游 getdata_setup() 只按 uname().release 的 "2.2"/"2.4"/"2.6" 字面前缀
      选择 /proc 采集器，比 2.6 新的内核会保留 get_disk() —— 那个 syslog
      "dummy function, should never be called!" 并 exit(EXIT_FAILURE) 的占位
      函数，也就是第一个 STATS 请求就会让守护进程退出。本测试断言
      /proc/diskstats、/proc/vmstat、/proc/stat、/proc/loadavg、/proc/uptime
      五个采集器都返回了合理数值。
  - id: ohos-fno-signed-char-getopt
    assertion: >-
      rup -v 与 rsysinfo -v 必须在 OHOS 上退出 0。OHOS clang 默认 -fno-signed-char，
      上游 `char c; (c = getopt(...)) != EOF` 永远为真，两个客户端的参数循环会
      死循环；本测试断言它们能正常返回版本横幅。
  - id: ohos-no-sunrpc-in-libc
    assertion: >-
      整条 RPC 通路在 OHOS 上可用：<rpc/rpc.h> 等 SunRPC 头文件与 xdr_*/svc_*/
      clnt_* 实现由 libtirpc/1.3.7 提供（本包 requires 它），测试通过真实 UDP
      套接字完成一次完整的 RPC 调用-应答。
  - id: ohos-musl-no-rindex
    assertion: >-
      两个客户端的 argv[0] 基名提取使用 strrchr()，musl 不提供 rindex()；
      `rup 127.0.0.1`（无可达守护进程）必须以非零码退出并给出错误信息。
