software: rsyslog
version: "8.2404.0"
status: published
build_date: "2026-08-09"
conan_adaptation_date: "2026-08-09"

source:
  url: "https://www.rsyslog.com/files/download/rsyslog/rsyslog-8.2404.0.tar.gz"
  sha256: "30528d140ec1b1f079224081fa37df6e06587ff42b02e3e61f2daa0526c54d33"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/usr/local"
  dependencies:
    - "libestr/0.1.11"
    - "libfastjson/1.2304.0"
    - "libgcrypt/1.11.0"
    - "uuid/2.40.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-E011-HMDFS-fix.patch"
  - "0002-runtime-dnscache.c-pthread-cancel.patch"
  - "0003-runtime-queue.c-pthread-cancel.patch"
  - "0004-runtime-wti.c-pthread-cancel.patch"
  - "0005-runtime-net.c-pthread-cancel.patch"
  - "0006-threads.c-pthread-cancel.patch"

knowledge_gained:
  - "E011: HMDFS umask 077 fix for configure temp directory"
  - "E007: config.guess/config.sub update for HarmonyOS detection"
  - "E001: CC=clang for systems without cc symlink"
  - "OHOS/musl lacks pthread_cancel - condition compilation guards"
  - "HMDFS symlinks (E050) affect conan package library resolution"
  - "Unsigned ELF binaries can't be executed on HarmonyOS during configure"
  - "PkgConfigDeps needed for autotools projects using PKG_CHECK_MODULES"
  - "AutotoolsDeps + LD_LIBRARY_PATH needed for configure run tests"
