# conandata.yml — rtnppd 1.7b
# Official source: SourceForge project "rtnppd", folder Original/1.7
# (https://sourceforge.net/projects/rtnppd/files/Original/1.7/rtnppd-1.7b.tar.gz).
# sha256 verified against the 44248-byte tarball downloaded 2026-10-13.
# CI (ci/conan/build_and_test.sh) adds SourceForge mirror fallback automatically,
# so only the official URL is listed here (R39).

sources:
  url: "https://downloads.sourceforge.net/project/rtnppd/Original/1.7/rtnppd-1.7b.tar.gz"
  sha256: "06651a98c99048d9a211a92a68d8e5ed03ffdf2caf04904923a8ae7418a5eca4"

patches:
  - patch_file: "patches/0001-blowfish-h-stdint.patch"
    patch_description: "Use C99 uint32_t/uint64_t from <stdint.h> instead of BSD u_intN_t (not provided by musl/OHOS libc sys/types.h)"
    patch_type: "portability"
  - patch_file: "patches/0002-blowfish-c-portability.patch"
    patch_description: "Same u_intN_t -> uintN_t conversion in blowfish.c plus missing <arpa/inet.h> for htonl/ntohl"
    patch_type: "portability"
  - patch_file: "patches/0003-rtnppd-c-portability.patch"
    patch_description: "Include <fcntl.h> instead of glibc-only <sys/fcntl.h>; add missing decrypt_packet() prototype; u_int64_t -> uint64_t"
    patch_type: "portability"
  - patch_file: "patches/0004-testq-c-main.patch"
    patch_description: "Give testq main() an explicit int return type and add missing <stdlib.h>/<unistd.h> (exit/unlink)"
    patch_type: "portability"
  - patch_file: "patches/0005-tnpppage-c-return.patch"
    patch_description: "Return 0 instead of bare return in int send_tnpp_packet()"
    patch_type: "portability"
