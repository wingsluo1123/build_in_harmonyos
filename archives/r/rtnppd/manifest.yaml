software: rtnppd
display: "rtnppd"
description: "TNPP 3.8 分组路由守护进程 (串口/IP 寻呼组网)"
category: network
homepage: "https://sourceforge.net/projects/rtnppd/"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目, 无 configure 步骤、无上游测试套件"
    - "BSD 类型 u_intN_t 整体替换为 C99 uintN_t (musl 无 BSD 名)"
    - "glibc 专有 <sys/fcntl.h> 改为可移植 <fcntl.h>"
    - "package() 不调用上游 make install (写系统目录 + 生成 key), 直接拷贝产物"
  common_dependencies: []

versions:
  "1.7b":
    status: built
    build_date: "2026-10-13"
