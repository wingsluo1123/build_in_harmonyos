software: rtorrent
display: "rtorrent"
description: "Ncurses based BitTorrent client (rakshasa)"
category: network
homepage: "https://github.com/rakshasa/rtorrent"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools config.status fails on HarmonyOS (print command, mktemp)"
    - "Custom build method: compile .cc files directly"
    - "Depends on libtorrent-rakshasa, ncurses, openssl, zlib, curl"
    - "Pre-generated config.h provided as patch"
  common_dependencies:
    - libtorrent-rakshasa
    - ncurses
    - openssl
    - zlib
    - curl

versions:
  "0.16.2":
    status: built
    build_date: "2026-08-08"
