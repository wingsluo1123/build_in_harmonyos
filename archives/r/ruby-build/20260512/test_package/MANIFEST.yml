# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ruby-build/20260512
homepage: "https://github.com/rbenv/ruby-build"

# 上游测试命令
upstream_check_command: "test/test_run"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_run
    source: ruby-build-20260512/test/test_run
    description: "Upstream test runner for ruby-build (requires Ruby environment)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: ruby-build --version + --list"
    command: "bash test.sh"
  - file: conanfile.py (inline Shell test)
    description: "消费者测试: ruby-build --version + --list 功能验证 (env-aware)"
    command: "conan test (ruby-build --version + --list)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
