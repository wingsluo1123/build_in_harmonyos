# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "jemalloc (tikv-jemalloc-sys) 的 autoconf config.sub 不识别 OHOS 平台，需用 --no-default-features 禁用"
  - "ruby-prism-sys 依赖 libclang 进行 FFI bindgen，需设置 LIBCLANG_PATH 环境变量"
  - "cargo 二进制需要 LD_LIBRARY_PATH 包含 ~/.harmonybrew/lib 以找到 OpenSSL 库"
  - "Rust edition 2024 需要 rustc >= 1.85"
  - "cargo build 可能遇到 'Text file busy' (ETXTBSY) 错误，使用 -j1 串行编译可规避"

