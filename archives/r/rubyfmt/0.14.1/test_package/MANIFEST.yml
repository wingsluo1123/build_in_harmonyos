# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: rubyfmt/0.14.1
homepage: "https://github.com/fables-tales/rubyfmt"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cargo test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cargo test --no-default-features"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/cli_interface_test.rs
    source: rubyfmt-0.14.1/tests/cli_interface_test.rs
    description: "CLI 接口集成测试（46 个测试函数）"
    command: "cargo test --test cli_interface_test --no-default-features"
  - file: tests/error_handling_test.rs
    source: rubyfmt-0.14.1/tests/error_handling_test.rs
    description: "错误处理集成测试（11 个测试函数）"
    command: "cargo test --test error_handling_test --no-default-features"
  - file: tests/stress_test.rs
    source: rubyfmt-0.14.1/tests/stress_test.rs
    description: "压力测试（3 个测试函数）"
    command: "cargo test --test stress_test --no-default-features"
  - file: tests/fixtures_test.rs
    source: rubyfmt-0.14.1/tests/fixtures_test.rs
    description: "Fixture 格式化测试（395 个动态用例，通过 libtest-mimic 从 fixtures/ 目录收集）"
    command: "cargo test --test fixtures_test --no-default-features"
  - file: librubyfmt/src/string_escape.rs
    source: rubyfmt-0.14.1/librubyfmt/src/string_escape.rs
    description: "字符串转义单元测试（32 个测试函数）"
    command: "cargo test --lib --no-default-features"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Conan 消费者烟雾测试：验证 rubyfmt 二进制可执行、--version 输出正确、Ruby 代码格式化功能正常"
    command: "conan test test_package rubyfmt/0.14.1"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 487
