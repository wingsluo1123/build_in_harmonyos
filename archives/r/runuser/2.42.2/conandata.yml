sources:
  "2.42.2":
    url:
      - "https://mirrors.ustc.edu.cn/kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
      - "https://mirrors.tuna.tsinghua.edu.cn/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
      - "https://mirror.nju.edu.cn/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
      - "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
    sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
patches:
  - patch_file: "patches/0001-config-config.guess.patch"
    patch_description: "Add HarmonyOS detection to config.guess for OHOS cross-compilation"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Allow runuser to build without GNU utmpx functions and fix umask 077 tempdir on OHOS (E011)"
    patch_type: "portability"
  - patch_file: "patches/0003-include-shells.h.patch"
    patch_description: "Declare getusershell(3) family in shells.h for OHOS musl (lib/shells.c provides stubs)"
    patch_type: "portability"
  - patch_file: "patches/0004-lib-shells.c.patch"
    patch_description: "Provide no-op stubs for getusershell family in lib/shells.c for OHOS musl"
    patch_type: "portability"
  - patch_file: "patches/0005-login-utils-su-common.c.patch"
    patch_description: "Guard updwtmpx calls with HAVE_UPDWTMPX in su-common.c for musl libc compatibility"
    patch_type: "portability"
