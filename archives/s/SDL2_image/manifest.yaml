software: SDL2_image
display: "SDL2_image"
description: "SDL2 的图像加载库，支持多种图像格式（PNG/JPEG/TIFF/WebP 等）"
category: gfx
homepage: "https://www.libsdl.org/projects/SDL_image/"
license: zlib
build_system: cmake

ohos_adaptation:
  key_points:
    - "推荐使用 CMake 构建（避免 autotools heredoc 权限问题 E009/E011）"
    - "需先安装 SDL2（建议 cmd-pkgs 预编译包 SDL2 2.30.0）"
    - "pkg-config 路径需设置: PKG_CONFIG_PATH=~/usr/local/lib/pkgconfig"
  common_dependencies:
    - SDL2 >= 2.0.9
  known_issues:
    - "无标准测试套件（仅示例程序）"
    - "config.guess/config.sub 需补丁（E007）"

versions:
  "2.6.0":
    status: built
    build_date: "2026-05-27"
    published_as: SDL2_image

# 软件级 manifest
# 文件位置: archives/s/SDL2_image/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: SDL2_image

# 软件描述（简短）
description: SDL2图像加载扩展库（支持PNG/JPEG/TIFF/BMP/GIF/WebP等）

# 软件分类
# library-tool | gui-app | cli-app | header-only | data-package
category: library-tool

# 项目主页
homepage: https://www.libsdl.org/projects/SDL_image/

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "2.8.0"
    status: published
    build_date: "2026-05-19"
    dependencies:
      - SDL2/2.30.0

# 当前推荐版本
latest: "2.8.0"
