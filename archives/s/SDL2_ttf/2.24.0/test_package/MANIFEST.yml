# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl2_ttf/2.24.0
homepage: https://github.com/libsdl-org/SDL_ttf

# SDL2_ttf uses CMake; upstream tests require SDL2 runtime
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sdl2_ttf.c
    description: "SDL2_ttf 版本、初始化和关闭状态验证 (消费者测试)"
    command: "./test_sdl2_ttf"

# 测试断言总数
assertion_count: 4
