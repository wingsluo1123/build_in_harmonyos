# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sdl2_ttf/2.24.0
homepage: https://github.com/libsdl-org/SDL_ttf

# SDL2_ttf uses CMake; upstream tests require SDL2 runtime
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sdl2_ttf.c
    description: "SDL2_ttf 版本、初始化和关闭验证；设置 SDL_TTF_TEST_FONT 时执行字体打开与渲染"
    command: "./test_sdl2_ttf"

# 四项基础断言始终执行，另有三项由 SDL_TTF_TEST_FONT 启用的渲染断言。
assertion_count: 4
optional_assertion_count: 3
