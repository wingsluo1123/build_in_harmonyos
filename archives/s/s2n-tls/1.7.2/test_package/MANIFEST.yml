# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: s2n-tls/1.7.2
homepage: "https://github.com/aws/s2n-tls"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (s2n-tls uses ctest with unit tests)
upstream_tests:
  - file: tests/unit/s2n_safety_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_safety_test.c
    description: "s2n safety checks unit test"
    command: "ctest -R s2n_safety_test"
  - file: tests/unit/s2n_random_test.c
    source: s2n-tls-1.7.2/tests/unit/s2n_random_test.c
    description: "s2n random number generation unit test"
    command: "ctest -R s2n_random_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 s2n_init/s2n_get_openssl_version/s2n_cleanup_final 链路"
    command: "./test_s2n"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
