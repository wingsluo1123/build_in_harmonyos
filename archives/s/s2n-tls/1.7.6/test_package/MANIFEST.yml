# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: s2n-tls/1.7.6
homepage: "https://github.com/aws/s2n-tls"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build --target test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/s2n_self_talk_nonblocking_test.c
    source: s2n-tls-1.7.6/tests/s2n_self_talk_nonblocking_test.c
    description: "s2n TLS self-talk non-blocking test"
    command: "./build/test/s2n_self_talk_nonblocking_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证s2n_init和s2n_config_new API可用"
    command: "./test_s2n_tls"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
