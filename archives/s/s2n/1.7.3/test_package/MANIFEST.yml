# test_package/MANIFEST.yml
package: s2n/1.7.3
homepage: "https://github.com/aws/s2n-tls"

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/
    source: s2n-1.7.3/tests/
    description: "s2n-tls upstream unit tests (disabled in package build)"
    command: "ctest"

test_package_tests:
  - file: test.c
    description: "Verify s2n TLS library loads and s2n_init succeeds"
    command: "./test_s2n"

assertion_count: 3
