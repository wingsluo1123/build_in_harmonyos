# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: s3fs-fuse/1.94
homepage: "https://github.com/s3fs-fuse/s3fs-fuse"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# s3fs-fuse 1.94 test/ directory contains integration tests that require
# S3 credentials and network access, not suitable for CI
upstream_tests:
  - file: test/test_s3fs.cfg
    source: s3fs-fuse-1.94/test/test_s3fs.cfg
    description: "S3 connection configuration test (requires credentials)"
    command: "./test_s3fs"
  - file: test/curldelcheck.cc
    source: s3fs-fuse-1.94/test/curldelcheck.cc
    description: "CURL delete check utility"
    command: "./curldelcheck"
  - file: test/multipartshot.cc
    source: s3fs-fuse-1.94/test/multipartshot.cc
    description: "Multipart upload test utility"
    command: "./multipartshot"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Binary availability check - verifies s3fs binary can be located and executed"
    command: "./test_s3fs-fuse"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
