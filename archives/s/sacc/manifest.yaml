software: sacc
display: "sacc"
description: "Terminal Gopher client with TLS support"
category: network
homepage: "https://git.codemadness.org/sacc/"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "Build upstream UI=ti and IO=tls with the Conan target C compiler"
    - "Link the OHOS ncursesw library and LibreSSL static libraries explicitly"
    - "Use an installed-package local Gopher fixture for deterministic behavior checks"
  common_dependencies:
    - libressl
    - ncurses

versions: {}
