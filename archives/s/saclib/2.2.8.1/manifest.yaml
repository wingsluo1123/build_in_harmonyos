# ============================================================
# 与 2.2.8 的差异（本版本只有一处，即 0003 补丁）
# ============================================================

diff_from_2_2_8:
  upstream_tarball: "完全不变（同一 URL、同一 sha256 E8E3ACB2...203B、同一大小 3060308）"
  new_patch: "patches/0003-ohos-round-macros.patch —— 在 include/hfloats.h 增加 _OHOS_AARCH64_ 分支，定义 rounddown()/roundup()"
  reason: >-
    2.2.8 的制品里 lib/saclibo.a 留有 13 处悬空外部符号（rounddown 7、roundup 6），
    来自 src/HIACC.c、HIPCHT.c、HIPFES.c、HIPROD.c、HIPTR1.c、HIQUOT.c、HISUM.c：
    hfloats.h 只为 _SPARC_SOLARIS_/_X86_LINUX_/_MAC_OSX_ 定义了这两个宏，OHOS 端口用的是
    _OHOS_AARCH64_，于是 rounddown(); 被当作隐式函数声明编译。SACLIB 自身只做 ar 归档、
    从不链接，所以只有第一个链接 libsaclibo.a 的下游（qepcad）才会暴露；下游也无法绕行，
    因为未定义引用已经烘进归档成员。由 qepcad 1.74 适配会话定位并提出补丁。
  verification: "归档层符号检查（llvm-nm 精确符号名）与最小消费者真实链接（引用 HI 系列符号），见 round_macros_fix"
  fix_effect: "宏展开后不再引用这两个符号；未定义引用由 13 处降为 0"

# ============================================================
# rounddown/roundup 修复的验证记录（修复意见第 5 节）
# ============================================================

round_macros_fix:
  reported_by: "qepcad 1.74 适配会话（分支 feat/qepcad-1.74），2026-10-16"
  before:
    archive: "saclib/2.2.8 lib/saclibo.a（与已发布版同代码）"
    undefined_only: "llvm-nm --undefined-only → 7 个 rounddown + 6 个 roundup"
    members: "HIACC.o / HIPCHT.o / HIPFES.o / HIPROD.o / HIPTR1.o / HIQUOT.o / HISUM.o"
  after:
    archive: "saclib/2.2.8.1 lib/saclibo.a 1987176 字节 / 1069 个成员（含 GC.o）"
    defined_only: "无 rounddown/roundup（宏展开，不再有同名符号）"
    undefined_only: "无（悬空引用清零）"
    fesetround: "7 个 HI 成员改为引用 libc 的 fesetround —— 与修复前引用悬空符号的成员完全一致"
    real_link: "最小消费者（extern 声明 HIACC 并链接 libsaclibo.a）链接成功，exit 0"
  regression: "预处理器对四种宏组合逐一验证：_X86_LINUX_/_MAC_OSX_/_OHOS_AARCH64_ 各自展开，无平台宏时不展开（复现 2.2.8 缺陷）"
  note: >-
    判定必须按精确符号名（awk '{print $NF}' | grep -x），不能用 grep -i round ——
    归档里还有 IEEEROUND、RNROUND 等名字含 round 的已定义符号。
  endpoints:
    recipe_revision: "saclib/2.2.8.1#87e968103f842664bbb0b5a216e3d131"
    package_id: "6b129b068851896169fae42d399fa922d239ce8a"

key_points:
  - "OHOS port（_OHOS_AARCH64_）必须定义 rounddown()/roundup()：hfloats.h 原先只覆盖
    SPARC/X86_LINUX/MAC_OSX，缺失时 HIP*.c 会引用未定义符号，且只有下游链接时才暴露"
  - "SACLIB 自身只做 ar 归档、从不链接，因此『本库构建通过』不能证明没有悬空符号：
    库类适配应额外做一次归档层符号检查（定义/未定义两侧）与一次最小消费者真实链接"
  - "conandata.yml 的 sources/patches 键必须等于配方 version：Conan 2 按 self.version 取表，
    键不匹配时取到空表且不报错（本次导致补丁全部未导出，构建才在缺 sysdep/ohosAarch64 时失败）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SACLIB 无 configure/CMake，平台适配全部集中在 sysdep/<port>：sysdep.h + GC.c，由 bin/mksysdep.pl 选择安装"
  - "sysdep/linuxX86_64/sysdep.h 定义 _X86_LINUX_，会让 include/hfloats.h 引入 glibc 专有的 <ieee754.h>；OHOS 的 musl 系 libc 没有该头文件，必须另开端口"
  - "AArch64 版 GC() 不能用上游 x86_64 的『哑参数落栈』写法：AAPCS64 允许调用者把活跃 Word 留在被调用者保存寄存器 x19-x28 跨过调用，栈扫描看不见。真机实测该写法 -O0 6/6 通过、-O1/-O2/-Os 0/18 全部段错误；改用 setjmp() 强制溢出后 24/24 通过"
  - "AAPCS64 给叶子函数 16 字节 red zone，编译器会把溢出槽放在 sp 之下；GC() 必须以自身局部变量地址（而非 GCSI 自己的帧）作为扫描下界，否则刚调用过 printf 的调用者其 red zone 内的活跃对象会被漏扫"
  - "bin/mkmake 生成的 makefile 硬编码 AFLAGS = -I${saclib}/include -P；AArch64 as 不认 GNU as 的 -P，需把 AFLAGS 参数化并由 mklib 传 -ansi（2.2.8 的 src 已无 .s，Debian 打包亦去掉该选项）"
  - "生成的 makefile 还硬编码 AR = ar / RANLIB = ranlib，而 OHOS clang 工具链没有 ranlib（只有 llvm-ranlib）；mklib 原本只转发 CC，需让它同时转发 AR/RANLIB 并在配方侧用绝对路径注入"
  - "bin/sconf 是 bash + Perl 包装，只有 bin/mksysdep.pl 真正需要 Perl；设备上没有 perl，其内部 system(\"bash -c ...\") 在 PATH 无 bash 时会静默不安装端口，导致后续 GC 未定义 —— 必须显式执行等价拷贝并断言文件已落地"
  - "设备没有 /bin/bash（bash 在 $HOME/usr/local/bin），SACLIB 构建脚本的 #!/bin/bash shebang 直接执行会 bad interpreter；且不能用 bash -c \"<绝对路径>\"（会重新走 shebang 查找），必须用 bash <绝对路径>"
  - "Conan run(env=...) 接的是环境文件名而不是 KEY=VALUE 映射：传 dict 报 'should be a list'，传 KEY=VALUE 列表会被当成不存在的 env 脚本；工具变量应写成命令行前置赋值"
  - "bin/mkproto 生成 sacproto.h 时跳过 main.c，因此 sacMain 的前向声明只在 main.c 内；2.2.8 的 include/sacproto.h 与重新生成结果逐字节一致，可安全跳过该步"
  - "上游 tarball 内部换行不一致（部分文本文件 CRLF、部分 LF），生成补丁必须按字节替换以保留原换行，否则整个文件被算作改动"
  - "Conan 2 的 apply_conandata_patches() 用 patch_ng 的 strip=0（patch_ng 的 decode_clean 自带 a//b/ 前缀剥离）；补丁块必须带 index/new file mode 行才会被判为 GIT 类型并正确剥前缀"
  - "ci/conan/build_and_test.sh 的 JC 门禁依赖 PR diff 基线，在没有基线的设备 checkout 上会把整棵 archives/ 判为变更，不能作为单包验证入口；单包真机验证应直接用 conan create"
