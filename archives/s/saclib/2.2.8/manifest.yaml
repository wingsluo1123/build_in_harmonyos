# ============================================================
# 构建配置
# ============================================================

build:
  system: custom
  # SACLIB 自带生成器，无 configure / CMake / Meson：
  #   bin/mksysdep.pl ohosAarch64   选择并安装平台端口（bin/sconf 只是它的 bash 包装）
  #   sysdep/ohosAarch64/install    拷贝 GC.c -> src/、sysdep.h -> include/
  #   bin/mkmake                    生成 lib/objo/makefile
  #   bin/mklib opt                 编译 + 归档为 lib/saclibo.a
  configure_options:
    - "perl bin/mksysdep.pl ohosAarch64"
    - "cd sysdep/ohosAarch64 && sh ./install"
    - "bin/mkmake"
    - "bin/mklib opt CC=clang AR=llvm-ar RANLIB=llvm-ranlib MAKE=make SUBMAKEFLAGS=-j1"
  dependencies: []
  cc: clang
  cxx: null

patches_applied:
  - "0001-sysdep-ohos-aarch64-port.patch"
  - "0002-weak-sacmain-hook.patch"

