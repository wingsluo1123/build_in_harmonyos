    - "lib/saclibo.a 必须存在（qepcad 的 source/Makefile 与 cad2d/Makefile 直接链接该路径）"
    - "必须是静态库：qepcad 在 qesource/source/saclib/ 下重定义了 CREAD/GCSI 等同名符号"
  provided:
    - "include/ 安装全部 .h（含 sysdep.h）"
    - "lib/saclibo.a（上游命名）与 lib/libsaclib.a（同一归档的常规命名）"
