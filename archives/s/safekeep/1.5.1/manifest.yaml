software: safekeep
version: "1.5.1"
status: built
build_date: "2026-07-31"
source:
  url: "https://codeload.github.com/dimipaun/safekeep/tar.gz/refs/tags/1.5.1"
  sha256: "c5efcbbdb8e141d6aeac648c4833f935f5982c01f58cd26ff6b35fcc43c609fb"
  tar_format: "tar.gz"
  local_archive: "safekeep-1.5.1.tar.gz"
  fetch_strategy: "Use the exported local archive first in CI; keep the upstream URL as provenance and fallback."
build:
  system: "conan"
  type: "python-script"
  profile: "win-mingw"
  runtime_dependencies:
    - "python3"
    - "rdiff-backup"
    - "openssh"
validation:
  - "OHOS 6.0 armv8 Conan create on port 33332: /storage/Users/currentUser/ohos-test-runs/codex-a-1.5.1-safekeep-1.5.1-upstreamtests-r1-conan-20260731-212720-26678"
  - "L0=pass, L1=pass(test_package executed), L1e=pass, L2=pass(safekeep --version OK), L4=pass(no patches), L5=pass(bin/ has content)"
knowledge_gained:
  - "safekeep 1.5.1 ships a single upstream integration test driver, safekeep-test, with local and remote backup flows."
  - "The upstream integration test requires rdiff-backup, SSH, and mutable backup/restore directories; safekeep-test was not executed in the OHOS runner and must not be reported as passed."
  - "The package-level Python test validates packaged CLI/docs/config/sample data and safekeep-test flow markers only; it is adapted consumer validation, not upstream integration execution."
  - "The packaged command needs a portable #!/usr/bin/env python3 shebang on OpenHarmony because python3 is provided from the user runtime prefix, not /usr/bin/python3."
  - "The verified safekeep-1.5.1 source archive is committed in this version directory and exported by the recipe, so CI does not need to reach GitHub/codeload for source retrieval."
