    description: "Consumer test 1: sag -V returns 0.3.0"
    command: "bash test.sh"
  - file: test.sh
    description: "Consumer test 2: sag --help succeeds offline"
    command: "bash test.sh"
  - file: test.sh
    description: "Consumer test 3: sag prompting prints offline guide"
    command: "bash test.sh"

assertion_count: 3
