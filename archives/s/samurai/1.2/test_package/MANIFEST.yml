# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: samurai/1.2
homepage: "https://git.sr.ht/~mcf/samurai"

# Upstream check command
upstream_check_command: "make check"

# Upstream tests are not integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# samurai has no upstream test suite — it is a build tool
# The test_package verifies the binary runs correctly
upstream_tests: []

# test_package consumer-side tests
test_package_tests:
  - file: conanfile.py
    description: "Run samu --version to verify the binary is functional"
    command: "samu --version"

# Assertion count (approximate)
assertion_count: 1
