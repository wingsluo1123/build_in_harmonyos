      - "knowledge/drafts/DRAFT-scikit-learn-1.6.1-cython-pxd-vendoring.kv"
    summary: "Cython 跨包 cimport 只需声明文件：SciPy 不在 Conan 制品仓时逐字 vendor 所需 .pxd 并用 --include-dir 喂给编译器，同时把上游 meson 的 numpy/scipy 版本探测从 check:true 改为非致命；真实可 import 的 SciPy 优先，声明文件不编译不链接不安装。"
  - id: "DRAFT-static-artifact-count-pinning"
    files:
      - "knowledge/drafts/DRAFT-static-artifact-count-pinning.md"
      - "knowledge/drafts/DRAFT-static-artifact-count-pinning.kv"
    summary: "『枚举产物 + 逐文件断言』的静态校验通道必须把产物总数钉成构建系统已知值：本例移走 1 个扩展后 6 项静态检查仍全绿（67/67），加入 EXPECTED_EXTENSIONS=68 后才让 L1e 破坏性反向验证具备判别力。"
  - id: "DRAFT-cython-3-1-cpdef-enum-members-not-module-level"
    files:
      - "knowledge/drafts/DRAFT-cython-3-1-cpdef-enum-members-not-module-level.md"
      - "knowledge/drafts/DRAFT-cython-3-1-cpdef-enum-members-not-module-level.kv"
    summary: "Cython ≥ 3.1 不再把具名 cpdef enum 的成员平铺到模块级（官方 CHANGES 3.1.0rc1），而 OHOS 制品仓与平台 pip 索引只有 3.3.0：conan create 全绿、68 个扩展 ELF/ABI 全合规，破坏只在 import 期出现（上游 test_cython_blas.py 收集阶段 ImportError）。补丁在 .pyx 末尾按官方建议回填成员，并要求换代后在将要交付的产物上重跑上游计数。"
