# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS E004（musl）：dlopen 的扩展拿不到解释器符号，必须显式 -lpython3.12；用纯 stdlib 解析 ELF 的 DT_NEEDED 即可批量验证 68 个扩展（不依赖 readelf，因 E212 沙箱里连 dlopen 都不允许）。"
  - "OHOS E077：DevBox lld 会自动带 .codesign，CI lld 不会，故 package() 必须对每个打包 .so 执行 llvm-objcopy --remove-section .codesign → binary-sign-tool -selfSign 1 → chmod a+x，且重复执行幂等。"
  - "SciPy 未发布到 OHPCD Conan 制品仓，但 sklearn 构建期对它只有『声明依赖』：只有 utils/_cython_blas.pyx 与 tree/_criterion.pyx 直接 cimport SciPy，Cython 生成 __Pyx_ImportFunction 在 import 期取符号，因此扩展的 DT_NEEDED 里没有 BLAS。vendor 两个 .pxd（BSD-3-Clause，声明文件，不编译不链接不安装）即可让 CI 离线构建。"
  - "目标解释器能 import scipy 时应优先用真实 SciPy 自带的 .pxd（无版本漂移），vendor 目录只作回退——配方里 _scipy_declaration_root() 实现这条优先级。"
  - "上游 meson.build 的 numpy/scipy 版本探测用 run_command() 且默认 check:true，构建解释器缺包时直接 fatal；portability 补丁改为 check:false + returncode() 判断，可导入时仍是权威判据。"
  - "Conan 2：tool_requires 只能在 self.dependencies.build[name] 取到，host 上下文 self.dependencies[name] 会 KeyError；self.dependencies 也没有 .keys()。"
  - "Conan 2：export_sources 的内容落在 <cache>/p/<hash>/es/，配方里要用 self.export_sources_folder 回落 self.recipe_folder 才能同时适配 export 后与本地路径。"
  - "调用目标解释器做任何探测之前就必须先备好 LD_LIBRARY_PATH（musl 版 libpython3.12.so.1.0 在 <pyroot>/py/lib），否则连 python3.12 -c 都起不来。"
  - "sklearn 1.6.1 的 OpenMP 辅助函数是 _openmp_parallelism_enabled/_openmp_effective_n_threads(n)，≥1.7 才导出 get_num_threads/set_num_threads/openmp_enabled/get_thread_limit；且 OMP_NUM_THREADS 不是每次调用重读，配方测试不能声称 honoring env。"
  - "Cython >= 3.1 起，具名 cpdef enum 只导出 enum 类本身，不再把成员平铺到模块级：sklearn/utils/_cython_blas.pyx 的 ColMajor/RowMajor/NoTrans/Trans 因此在 3.3.0 下 import 失败，上游 test_cython_blas.py 直接在收集阶段报错。OHOS 制品仓与平台 pip 索引都只有 3.3.0，降版本不是选项，只能补丁重新发布成员。"
  - "构建期与校验期的 Python 都必须显式 tool_requires 平台 CPython：worker PATH 上的 /data/service/hnp/bin/python3 EXT_SUFFIX 是 '.cpython-312.so'，用它驱动 meson 会给扩展打上错误 ABI 标签，而静态通道若改用它的解释器做基线，又会把 68 个正确命名的 .so 全判成缺陷。校验顺序应为『先验证候选解释器的 EXT_SUFFIX，再拿它当基线』。"
  - "meson install 不产出 wheel 的 *.dist-info/METADATA，包完整性校验应改用 sklearn/__init__.py 的 __version__ 与子包存在性。"
  - "平台 pip 索引 pypi.cnb.cool/OpenHarmonyPCDeveloper/pypi 确实提供 ohos_aarch64 wheel（scipy 1.14.1/1.17.1、torch、joblib、threadpoolctl、scikit_learn 1.8+、skorch 1.4.0）。判断 Python 库能否适配 OHOS 时不能只看 Conan 制品仓，必须同时查该平台 pip 索引，否则会误判为『依赖不可得』。"

