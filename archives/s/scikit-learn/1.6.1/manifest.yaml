# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.6.1"
software: "scikit-learn"

# 编译状态：published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-14"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # conanfile.py source() 实际下载的 URL（conandata.yml 为唯一真值）
  url: "https://pypi.tuna.tsinghua.edu.cn/packages/9e/a5/4ae3b3a0755f7b35a280ac90b28817d1f380318973cff14075ab41ef50d9/scikit_learn-1.6.1.tar.gz"
  sha256: "b4fc2525eca2c69a59260f583c56a7557c6ccdf8deafdba6e060f94c1c59738e"
  tar_format: tar.gz
  # 说明：官方 PyPI sdist 的同一份字节（files.pythonhosted.org 同 sha256）。
  # CI worker 网络策略阻断 files.pythonhosted.org，清华镜像是唯一可达端点，
  # 与 numpy/2.5.2（PR #5882）同一结论。

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "meson setup <builddir> <src> --prefix=<package_folder> --buildtype=release --native-file=ohos-native.ini"
    - "--native-file: [binaries] clang/clang++/llvm-ar/llvm-strip/llvm-objcopy/ninja 全部指向 OHOS SDK (ohos-sdk_26.0.0.18)"
    - "--native-file: [properties] numpy-include-dir = <numpy/2.5.2 package_folder>/include/numpy"
    - "--native-file: [built-in options] c/cpp_link_args = ['-L<python libdir>', '-lpython3.12']（musl E004：解释器符号不导出给 dlopen 对象）"
    - "--native-file: [host_machine] system=Linux / cpu_family=aarch64 / cpu=aarch64，build 与 host 完全相同（本机编译 + exe_wrapper 校验）"
  dependencies:
    - "numpy/2.5.2"        # host requires：C 头 + numpy/__init__.pxd + 运行期同一份 numpy
    - "python/3.12.9"      # tool_requires：构建/校验解释器，EXT_SUFFIX 为 .cpython-312-aarch64-linux-ohos
    - "meson/1.11.0"       # tool_requires
    - "ninja/1.12.1"       # tool_requires
    - "cython/3.3.0"       # tool_requires
  cc: "clang (OHOS SDK aarch64-linux-ohos)"
  cxx: "clang++ (OHOS SDK aarch64-linux-ohos)"

# 构建产物规模（由本配方在真机/CI-sim 各构建一次，两次一致）
build_output:
  ninja_targets: 251
  extension_modules: 68          # sklearn/**/*.so，全部由 package() 重新签名
  openmp: "detected, version 5.0 (meson required:false)"

# ============================================================
# 运行期依赖（不是 Conan requires；由目标 Python 环境提供）
# ============================================================

runtime_dependencies:
  - "numpy>=1.19.5（上游 pyproject 声明；制品仓已有 numpy/2.5.2，本配方直接 requires）"
  - "scipy>=1.6.0（构建期只需 .pxd 声明，见 pxds/；运行期由平台 OHOS wheel 提供：scipy-1.14.1/-1.17.1-cp312-cp312-ohos_aarch64.whl @ pypi.cnb.cool/OpenHarmonyPCDeveloper/pypi）"
  - "joblib>=1.2.0（纯 Python，同一平台 OHOS 索引有 py3-none-any / ohos wheel）"
  - "threadpoolctl>=3.1.0（纯 Python，同上）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-ohos-tolerate-build-time-numpy-scipy-probe.patch"
  - "patches/0002-ohos-cython31-cpdef-enum-member-exports.patch"

