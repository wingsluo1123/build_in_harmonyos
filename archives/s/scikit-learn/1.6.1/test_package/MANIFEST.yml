# test_package/MANIFEST.yml — 上游官方测试声明文件（L0e 门禁要求存在）
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 本文件中的每一个计数都由 tools 生成器从真机逐目录 pytest --junitxml 结果
# (tmp/sktest2/xml/*.xml，34 个目录) 直接读取求和得到：模块路径取自执行脚本自身的
# MODULES 列表，xfailed 取自 JUnit 的 skipped[type=pytest.xfail]，xpassed 取自各
# 目录 pytest 汇总行，跳过原因分类取自 JUnit 的 skip message。无手工填写数字。

package: scikit-learn/1.6.1
homepage: https://scikit-learn.org

# 上游官方测试方式：pytest（测试目录随 sdist 安装进 site-packages/sklearn/**/tests）
upstream_check_command: "python3 -m pytest sklearn/"

# conanfile.py build() 是否集成上游测试：false。
#   原因：跑上游 pytest 需要 scipy、joblib、threadpoolctl 三个运行期依赖，它们未发布
#   到 OHPCD Conan 制品仓（该仓只有 numpy/meson/ninja/cython/openblas/python），CI
#   worker 的 build() 阶段拿不到，硬塞进 build() 只会产出假通过或假失败。上游全量套件
#   因此在真机离线执行：用本配方构建出的 68 个扩展 + 平台 OHOS wheel 的
#   scipy 1.14.1 / joblib 1.4.2 / threadpoolctl，逐目录 --junitxml 收集，聚合见
#   reports/test-report.md 与 manifest.yaml 的 upstream_test_run。
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest <site-packages>/sklearn/<MODULE>/tests -q -rf --no-header --tb=short -o addopts='' --junitxml=<MODULE>.xml"

