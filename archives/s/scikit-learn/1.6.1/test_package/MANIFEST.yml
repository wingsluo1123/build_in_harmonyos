# test_package 自带的消费者视角测试（真实调用 API，非打印空壳）
test_package_tests:
  - file: test_sklearn.py
    description: >-
      12 项公开 API 消费者验证：版本断言；12 个编译扩展必须以 .so 形式被导入；
      sklearn.utils._cython_blas 的裸名 enum 成员（NoTrans/Trans/RowMajor/ColMajor，
      Cython ≥ 3.1 不再自动导出，见补丁 0002）可 import，且其声明的 BLAS 入口点在
      float32/float64 两种实例化下 dot/asum/nrm2/copy/axpy/scal/gemv/gemm 全与 numpy 参考一致；RandomForest 在 iris
      测试集精度 > 0.9；KDTree/BallTree/brute 三条 Cython 近邻实现 3-NN 结果完全一致；
      ElasticNet(cd_fast)/liblinear/SGD/saga 四条 Cython 优化路径收敛；PCA 残差恒等式
      rel == sqrt(1 - explained_variance_ratio_.sum())（1e-9）；randomized_svd 前 10 个
      奇异值与精确 svd 相对偏差 < 1e-5；KMeans/DBSCAN/Agglomerative 恢复三点云；
      pairwise euclidean/manhattan/sqeuclidean/cosine 与 numpy 参考一致到 1e-12；
      Pipeline + 3 折 CV；OpenMP 与 joblib 线程数不变性；pickle + joblib 落盘往返预测一致。
    command: "python3 test_sklearn.py --json <out>.json"
    checks: 12
  - file: test_ohos_platform.py
    description: >-
      9 项鸿蒙平台验证（6 静态 + 3 运行期），见下方 added_tests。
    command: "python3 test_ohos_platform.py --site-dir <site-packages> --runtime --json <out>.json"
    checks: 9

# 新增鸿蒙特有测试 (rule12)
added_tests:
  - name: "harmonyos-specific-test"
    source: test_package/test_ohos_platform.py
    description: >-
      鸿蒙特有断言，用纯 stdlib 自行解析 ELF64（不依赖 readelf，因而在拒绝 dlopen 用户路径的
      E212 AppSpawn 沙箱内同样可执行），逐一覆盖本配方产出的 68 个扩展，并把扩展总数钉在
      EXPECTED_EXTENSIONS=68（上游 meson 构建的固定值）——只移走一个产物也会 6 项全红，
      而不是 "67/67 全绿"：
      1) ELF 魔数 + ELF64 + e_machine == EM_AARCH64(183)；
      2) 必须存在 .codesign 段——OHOS E077 对未签名映射直接拒绝 dlopen；
      3) 必须自带 DT_NEEDED libpython3.12.so——musl 不把解释器符号导出给 dlopen 对象，
      否则 PyModuleDef_Init 等符号不可解析（E004）；
      4) C 库必须是 musl 的 libc.so，出现 libc.so.6/libm.so.6/libdl.so.2/ld-linux* 即失败，
      且不得直接链接 BLAS/OpenBLAS（SciPy 在 import 期经 __Pyx_ImportFunction 供给符号）；
      5) 扩展文件名后缀必须等于当前解释器的 EXT_SUFFIX（本端口
      .cpython-312-aarch64-linux-ohos.so），防止把 Linux glibc wheel 误当 OHOS 产物；
      参与比对的解释器取自 test_package 自身的 tool_requires("python/3.12.9")（制品仓已发布），
      并先校验其 EXT_SUFFIX 含 -linux-ohos，因而不会拿设备上 PATH 里的 HNP 解释器
      （.cpython-312.so）当作基准误判扩展；
      6) 包内布局：sklearn/__init__.py 的 __version__ == 1.6.1，
      utils/linear_model/ensemble/model_selection/datasets/metrics 子包齐全。
      运行期追加 3 项：平台字符串 harmonyos-*-aarch64 且核心扩展确实从 .so 载入；
      OpenMP 线程数不变性（_openmp_parallelism_enabled、_openmp_effective_n_threads(1/3)，
      KMeans 1 线程 vs 8 线程预测逐位一致、HistGradientBoosting 重复拟合一致）；
