# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scim-thai/0.1.4
homepage: "https://github.com/tlwg/scim-thai"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# scim-thai 上游无测试套件：make check 在 src/data/po 均为
# "Nothing to be done for 'check'"（无 TESTS 注册），手动编译已验证。
upstream_tests:

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: dlopen 加载安装的 thai.so SCIM IMEngine 模块，验证 scim_imengine_module_create_factory 符号导出且可调用"
    command: "./test_probe <thai.so>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
