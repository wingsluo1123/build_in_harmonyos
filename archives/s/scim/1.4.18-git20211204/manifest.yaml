knowledge_gained:
  - "HMDFS 上 autotools config.status 的 AS_TMPDIR umask 077 临时目录不可写，需在 configure.ac 中 m4_define 覆盖 AS_TMPDIR 为 umask 002（E052/E060）"
  - "上游 git 快照缺 m4/pkg.m4 导致 PKG_PROG_PKG_CONFIG 未展开，随配方 export_sources 提供 pkg.m4（serial 12, pkg-config-0.29.2）"
  - "上游缺 m4/intltool.m4 导致 IT_PROG_INTLTOOL 未展开，随配方 export_sources 提供 intltool.m4（intltool 0.51.0）"
  - "conan tool_requires perl 包注入 PERL5LIB(5.42.2 XS)与系统 perl 5.42.0 ABI 不匹配，须将 PERL 指向系统 perl 且 PERL5LIB 仅指向 automake share 目录"
  - "conan libtool 包 libltdl 数据在 share/libtool-conan/libltdl 仅头文件，完整源在 share/libtool/，需 _stage_libtool_data 复制后以 _lt_pkgdatadir 指向（E443）"
  - "conan 子进程 HNP cmake 运行时缺 libc++_shared.so，test_package 改用 pkg-config 直编方式规避"
