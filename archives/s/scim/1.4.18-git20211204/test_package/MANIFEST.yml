# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scim/1.4.18-git20211204
homepage: "https://github.com/scim-im/scim"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/ 目录, --enable-tests 构建)
upstream_tests:
  - file: tests/testiconvert.cpp
    source: scim-1.4.18-git20211204/tests/testiconvert.cpp
    description: "字符编码转换测试 (UTF-8/EUC-JP/GB18030/BIG5)"
    command: "./testiconvert"
  - file: tests/testlang.cpp
    source: scim-1.4.18-git20211204/tests/testlang.cpp
    description: "语言/区域设置解析测试"
    command: "./testlang"
  - file: tests/testsocketserver.cpp
    source: scim-1.4.18-git20211204/tests/testsocketserver.cpp
    description: "SCIM socket 服务器测试"
    command: "./testsocketserver"
  - file: tests/testsocketclient.cpp
    source: scim-1.4.18-git20211204/tests/testsocketclient.cpp
    description: "SCIM socket 客户端往返测试"
    command: "./testsocketclient"
  - file: tests/testpanel.cpp
    source: scim-1.4.18-git20211204/tests/testpanel.cpp
    description: "SCIM 面板 HelperAgent 连接测试 (需运行中的 Panel)"
    command: "./testpanel"
  - file: tests/scim_test_helper.cpp
    source: scim-1.4.18-git20211204/tests/scim_test_helper.cpp
    description: "测试 Helper 模块 (GTK)"
    command: "make test-helper.la"
  - file: tests/scim_test_imengine.cpp
    source: scim-1.4.18-git20211204/tests/scim_test_imengine.cpp
    description: "测试 IMEngine 模块"
    command: "make test-imengine.la"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: scim.h 版本宏 + UTF-8/WideString 往返转换 (pkg-config 直编)"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
