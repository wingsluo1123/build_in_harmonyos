software: scooter
# 版本级 manifest 模板
# 文件位置: archives/s/scooter/0.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.1"

# 编译状态
# published | built | failed | archived
status: failed

# 构建系统类型
# cmake | autotools | makefile | meson | cargo | custom
build_system: cargo

# 构建日期
build_date: "2026-08-06"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/thomasschafer/scooter/archive/refs/tags/v0.9.1.tar.gz"
  # P3 R39: 删 mirror_url 个人 fork — CI 自动为 GitHub URL 添加 gh-proxy/ghproxy 镜像 fallback，勿手动硬编码非官方镜像
  # P3: sha256 placeholder — 本地 gh-proxy 截断 9MB+ 包导致假 hash，CI 下载完整包后回填真 sha256
  sha256: "0763a96361c4d0c7b6548b0c48b0e3c89b26f2136ba73cf85d570db78496917b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: cargo
  configure_options:
    - "cargo build --release --target aarch64-unknown-linux-ohos"
  dependencies: []
  cc: rustc
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []
patch_classification: []

# ============================================================
# 适配知识
# ============================================================
