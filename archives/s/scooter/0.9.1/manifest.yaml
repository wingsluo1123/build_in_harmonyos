  - "E180: rust-native-compile (新 HNP 工具链 Rust 1.95.0 支持 OHOS target)"
  - "E186: patchelf-fix-runpath (cargo RUNPATH musl ldso namespace 修)"

# ============================================================
# 上游测试信息
# ============================================================
upstream_tests:
  total: 3
  passed: 0
  skipped: 3
