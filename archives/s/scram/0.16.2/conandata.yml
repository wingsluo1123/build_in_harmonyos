# conandata.yml — scram 0.16.2

sources:
  url: "https://github.com/rakhimov/scram/archive/refs/tags/0.16.2.tar.gz"
  sha256: "7f8ca91ef549adcdd019541c87d72b9fbf10c7eb0feeed87fbf658e294f26f09"

patches:
  - patch_file: "patches/0001-src-CMakeLists.txt.patch"
    patch_description: "scram-cli 链接补充 LIBXML2_LIBRARY：conan CMakeDeps 提供的 LibXml2Config 用 target 方式，传统 LIBXML2_LIBRARIES 变量为空导致 CLI 链接缺 xml 符号"
    patch_type: "portability"
  - patch_file: "patches/0002-src-error.h.patch"
    patch_description: "BOOST_THROW_EXCEPTION_CURRENT_FUNCTION 在 Boost>=1.73 移除，改用 BOOST_CURRENT_FUNCTION"
    patch_type: "portability"
  - patch_file: "patches/0003-src-initializer.cc.patch"
    patch_description: "C++17 禁止 lambda 捕获结构化绑定变量（Clang 15 严格报错），改用局部引用变量"
    patch_type: "portability"
  - patch_file: "patches/0004-src-xml.cc.patch"
    patch_description: "libxml2 2.15.x 的 xmlGetLastError() 返回 const xmlError*，变量类型改为 const xmlError*"
    patch_type: "portability"
  - patch_file: "patches/0005-src-xml.h.patch"
    patch_description: "libxml2 2.15.x 的 xmlGetLastError() 返回 const xmlError*，GetError 参数与赋值改为 const xmlError*"
    patch_type: "portability"
  - patch_file: "patches/0006-tests-CMakeLists.txt.patch"
    patch_description: "scram_tests 链接补充 LIBXML2_LIBRARY：conan CMakeDeps 传统 LIBXML2_LIBRARIES 变量为空"
    patch_type: "portability"
