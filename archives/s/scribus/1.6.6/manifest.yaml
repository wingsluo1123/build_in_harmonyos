# 编译中学到的知识
knowledge_gained:
  - "CRLF 行尾源文件补丁生成失败：refresh-patch 产 LF 补丁 dry-run 不匹配 CRLF 源文件，须手动 CRLF 补丁置独立目录（patches-crlf/）并声明 conandata.yml"
  - "cmake/构建工具运行时需注入 SDK c++ 子目录 libc++_shared.so（W3 模拟环境）"
  - "Qt5Test 库在 qt5-qtbase 包内但 CMakeDeps 未暴露 QT_QTTEST_LIBRARY/QT_LIBRARIES，需显式注入以启用 WITH_TESTS 测试链接"

