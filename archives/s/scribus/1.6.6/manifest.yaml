# 版本号
version: "1.6.6"

# 软件名
software: "scribus"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/scribus/files/scribus/1.6.6/scribus-1.6.6.tar.xz/download"

  # 源码校验和
  sha256: "fdfe3e7cbe84b760b38d0561ed8736f9d25d4923adde6e15e03760d83be6166d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "WITH_TESTS=ON"
    - "WITH_PODOFO=OFF"
    - "QT_PREFIX=<qt5-qtbase package folder>"
    - "CMAKE_IGNORE_PREFIX_PATH=$HOME/usr/local"
    - "Python3_EXECUTABLE=<python package bin/python3.12>"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qt5-qtbase/5.15.2.2
    - poppler/25.12.0
    - zlib/1.3.1.1
    - libjpeg-turbo/3.2.0
    - libpng/1.6.58
    - libtiff/4.7.2
    - freetype/2.14.3
    - fontconfig/2.18.1.1
    - expat/2.8.2.1
    - openssl/1.1.1w
    - cairo/1.18.4
    - lcms2/2.19
    - libxml2/2.15.3
    - cups/2.4.19
    - harfbuzz/14.2.0
    - icu/76.1
    - python/3.12.9
    - hunspell/1.7.3
    - boost/1.90.0.3
    - librevenge/0.0.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
