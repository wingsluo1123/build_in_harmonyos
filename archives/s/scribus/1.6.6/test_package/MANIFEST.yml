# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scribus/1.6.6
homepage: "https://www.scribus.net"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游主 CMakeLists.txt 第 97 行 `#enable_testing()` 被注释 —— ctest 入口未启用，
# 但 scribus/tests/CMakeLists.txt 仍注册了 add_test(cellareatests) 单元测试。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cellareatests (build 阶段独立二进制) + scribus --tests (TestStoryText 聚合运行)"

# 上游实际运行的测试程序（源码包清点：scribus/tests/CMakeLists.txt + runtests.cpp）
upstream_tests:
  - file: scribus/tests/CMakeLists.txt
    source: scribus-1.6.6/scribus/tests/CMakeLists.txt
    description: "单元测试构建定义（enable_testing 被注释，不向 ctest 注册；配方以 WITH_TESTS=ON 构建测试目标并直接运行）"
    command: "./cellareatests"
  - file: scribus/tests/cellareatests.cpp
    source: scribus-1.6.6/scribus/tests/cellareatests.cpp
    description: "CellArea 单元测试源（upstream add_test 注册目标；OHOS 实测 111 断言全过）"
    command: "./cellareatests"
  - file: scribus/tests/testStoryText.cpp
    source: scribus-1.6.6/scribus/tests/testStoryText.cpp
    description: "StoryText 单元测试源（经 runtests.cpp RunTests::runTests 聚合；OHOS 实测 9 个函数全过）"
    command: "scribus --tests"
  - file: scribus/tests/runtests.cpp
    source: scribus-1.6.6/scribus/tests/runtests.cpp
    description: "测试聚合入口 RunTests::runTests（--tests 参数触发，运行 TestStoryText）"
    command: "scribus --tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_scribus.sh
    description: "消费者测试：真实 exec scribus --version，断言版本横幅与 ELF 头"
    command: "test_scribus.sh <bin-dir>"

# 测试断言总数 (近似值, 用于质量评估)
# = 上游 cellareatests 111 断言 + TestStoryText 9 个函数（QTest 聚合）+ test_package 4 断言
assertion_count: 124
