sources:
  url: "https://github.com/scrollz/scrollz/archive/refs/tags/ScrollZ-2.2.3.tar.gz"
  sha256: "cba8cdbf01d64aed6e9ba94781629f24be58ab18929ccef28c775e8678cbad2a"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: >-
      configure: probe tgetent in -lncursesw instead of -lncurses. The OHOS
      ncurses package (static, wide-char) ships libncursesw.a; there is no
      libncurses.so/.a, so the upstream `AC_CHECK_LIB(ncurses, tgetent)` link
      test would fail and configure would abort with "Can not find curses or
      termcap library". Only the library name in the tgetent probe and the
      resulting LIBS entry are changed; the detection logic is untouched.
    patch_type: "portability"
