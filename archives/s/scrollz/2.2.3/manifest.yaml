# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "老 autoconf 2.13 生成的 configure 不接受 `VAR=value` 形式的命令行赋值（报 invalid host type）；需要注 入 CPPFLAGS 时应走环境变量/self.buildenv。"
  - "configure 头文件探测（AC_CHECK_HEADERS/AC_EGREP_CPP）走 $CPP，只读 $CPPFLAGS 不读 $CFLAGS；依赖头文件路径必须进 CPPFLAGS，否则驱动库原型缺失（隐式 int）导致编译失败。"
  - "OHOS 已发布 ncurses 为静态宽字符版（仅 libncursesw.a），旧式 configure 的 `-lncurses` 探测必须改为 `-lncursesw`。"

