software: scrot
version: "2.0.0"
status: built
compile_date: "2026-10-17"
build_system: autotools

source:
  url: "https://github.com/resurrecting-open-source-projects/scrot/releases/download/2.0.0/scrot-2.0.0.tar.gz"
  sha256: "1b4b3acadfe07bf89234838675d1d23508a9a6810cb64584f1d9610103d6cdfa"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
  dependencies:
    - "libx11/6.4.0"
    - "libxcomposite/0.4.6"
    - "libxfixes/6.1.0"
    - "libxrandr/1.5.5.1"
    - "imlib2/1.9.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-deps-pc-imlib-floor-1.9.1.patch"
  - "patches/0002-scrot-imlib2-1.9.1-compat.patch"

knowledge_gained:
  - "scrot 2.0.0 is Autotools bin_PROGRAMS (CLI tool): package_type=application + commands.json"
  - "Upstream 2.0.0 dropped Xinerama, uses Xrandr for monitor capture (PR #406)"
  - "Upstream 2.0.0 requires imlib2 >= 1.11.0 with X support (deps.pc)"
  - "OHOS port: in-source imlib2 1.9.1 compat (deps.pc floor to 1.9.1 + XGetImage capture shims + temp-file save-fd fallback, self-disabling vs imlib2 >= 1.11+X)"
  - "Upstream ships no test suite: no tests/ dir, no TESTS in Makefile.am, no make check target"
