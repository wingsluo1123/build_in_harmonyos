  - knowledge_ref: DRAFT-SCST-221-KERNEL-BOUNDARY-HEADER-DELIVERY
    note: "scst/2.2.1 是 iscsi-scst 2.2.1 用户态构建的唯一外部依赖（event.c 消费 SCST_SYSFS_KEY_MARK 等）——R36 拓扑序：先发 scst 再发 iscsi-scst"
