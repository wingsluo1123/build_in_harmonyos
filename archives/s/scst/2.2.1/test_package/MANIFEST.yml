# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: scst/2.2.1
homepage: "https://sourceforge.net/projects/scst/"

# 上游无测试（Linux 内核模块项目，测试依赖内核构建树 + insmod，tarball 内无任何测试资产）
# 清点证据（R51）：
#   find scst-2.2.1 -iname '*test*' -o -iname '*check*'  → 0 命中
#   grep -n '^check\|test:' scst-2.2.1/Makefile          → 0 命中（无 check 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "头文件契约测试：静态断言 SCST 版本编码 (2,2,1,0)=0x02020100 与 SCST_USER_PARSE_* ABI 序；运行期断言 SCST_VERSION_NAME/SCST_CONST_VERSION/SCST_SYSFS_KEY_MARK/DEV_USER_NAME 字符串契约——覆盖 iscsi-scst 2.2.1 用户态事件泵 (event.c) 实际消费的全部 scst 核心标识符"
    command: "./test_scst (conan create 经 test_package 自动执行)"

assertion_count: 9
