# 知识沉淀
knowledge_gained:
  - "GNU make 命令行变量赋值优先于 Makefile 内的 +=：以 make CFLAGS=... 传参会让上游 LDFLAGS += -lX11 -lXrandr 整行失效，链接报 X11 符号未定义；改为环境变量（env=conanbuild）传 CFLAGS/LDFLAGS 后恢复正常（ref: DRAFT-sct-1.0.0-make-commandline-var-suppresses-append）"
  - "sct 的 Makefile 用 X11INC/X11LIB/INCS/LIBS 指向 /usr/local，交叉编译时置空 INCS= LIBS= 即可消除宿主机路径，同时保留 Makefile 自己追加的 -lX11/-lXrandr（ref: DRAFT-sct-1.0.0-make-commandline-var-suppresses-append）"
  - "libxrandr/1.5.5.1 固定依赖 libxrender/0.9.12，而后者在 libx11/6.4.0 下的二进制缺失，需 --build=missing 从源码重建（约 1.5 分钟），CI 同样使用 --build=missing（ref: notes.md 遇到的问题 #4）"
  - "sct 先 XOpenDisplay 再解析 argv，无 X server 时任何参数都走 'Failed to open X display' 退出路径；真实温度范围（1000-10000K）与 gamma 写入只能在有 X server 的环境验证（ref: reports/test-report.md）"

knowledge_ref:
  - "DRAFT-sct-1.0.0-make-commandline-var-suppresses-append"
