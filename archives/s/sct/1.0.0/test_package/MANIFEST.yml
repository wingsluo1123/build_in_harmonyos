# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
#
# 上游测试结论: sct 1.0.0 不提供任何测试套件。
#   源码包仅含 sct.c / Makefile / sct.1 / README.md / LICENSE，
#   Makefile 中没有 check/test 目标，`make check` 直接报
#   "No rule to make target 'check'"。因此"上游用例全部测试"退化为 0 条，
#   适配后按积分赛要求补全消费者测试与鸿蒙特有测试（见下）。

package: sct/1.0.0
homepage: "https://github.com/0mp/sct"

# 上游测试命令（经实测：Makefile 无 check 目标，无测试可执行）
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无
upstream_tests: []

# test_package 中新增的测试（消费者视角 + 鸿蒙平台）
test_package_tests:
  - file: test.c
    description: >-
      消费者端到端测试（18 条断言）：经 conanrun PATH 定位并真实执行包内
      bin/sct；无 DISPLAY / 不可达 DISPLAY（含非法与越界温度参数）均须
      返回 1 且不崩溃（HarmonyOS PC 默认无 X server 的错误契约；上游先
      打开 display 再解析 argv，故参数范围钳制需真实 X server 才可达，
      由 conanfile.py 的 X server 分支覆盖）；同时校验鸿蒙平台标记——
      ELF64 LE AArch64 PIE、/lib/ld-musl-aarch64.so.1 解释器、NEEDED 含
      libX11.so.6 与 libXrandr.so.2、无 glibc 依赖、.note.ohos.ident 存在
    command: "./test_sct"
  - file: conanfile.py
    description: >-
      有 X server 时（DISPLAY 或 Xvfb）额外执行真实 gamma 设置：
      sct 3000 / sct 6500 均须 rc=0；无 X server 时按平台限制跳过并说明
    command: "sct 3000; sct 6500"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 18
