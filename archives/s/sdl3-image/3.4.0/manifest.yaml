software: sdl3-image
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.4.0"

# 构建系统类型
build_system: cmake

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libsdl-org/SDL_image/archive/refs/tags/release-3.4.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
    - "-DSDLIMAGE_SAMPLES=OFF"
    - "-DSDLIMAGE_TESTS=OFF"
    - "-DSDLIMAGE_STRICT=OFF"
    - "-DSDLIMAGE_WEBP=OFF"
    - "-DSDLIMAGE_AVIF=OFF"
    - "-DSDLIMAGE_JXL=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sdl3/3.4.8
    - zlib/1.3.1
    - libpng/1.6.39
    - libtiff/4.7.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
