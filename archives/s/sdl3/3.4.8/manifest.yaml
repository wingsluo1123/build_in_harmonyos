software: sdl3
version: "3.4.8"
status: published
build_system: cmake
build_date: "2026-07-22"

source:
  url: "https://ghfast.top/https://github.com/libsdl-org/SDL/archive/refs/tags/release-3.4.8.tar.gz"
  sha256: "429a9f38483f834da5727a63dd7b5127a7c9d06a16439d7c6de4b7ebbfdb6374"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DSDL_SHARED=OFF"
    - "-DSDL_STATIC=ON"
    - "-DSDL_X11=OFF"
    - "-DSDL_WAYLAND=OFF"
    - "-DSDL_KMSDRM=OFF"
    - "-DSDL_DIRECTFB=OFF"
    - "-DSDL_PULSEAUDIO=OFF"
    - "-DSDL_ALSA=OFF"
    - "-DSDL_OPENGL=OFF"
    - "-DSDL_OPENGLES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-include-SDL3-SDL_platform_defines.h.patch"
  - "0003-src-SDL.c.patch"
  - "0004-src-thread-pthread-SDL_systhread.c.patch"

knowledge_gained:
  - "OHOS maps to CMAKE_SYSTEM_NAME=HarmonyOS via conan — patch detects via MATCHES HarmonyOS|OpenHarmony"
  - "All audio/video backends must be explicitly disabled (X11/Wayland/ALSA/etc.) — none are available on OHOS"
  - "Dummy and offscreen video drivers are opt-in via SDL_HINT_VIDEO_DRIVER — must set hint before SDL_Init"
  - "SDL3's SDL_platform_defines.h defines SDL_PLATFORM_OHOS when __OHOS__ is set; consumers must define __OHOS__ themselves"
  - "test_package must clear cmake build cache after editing CMakeLists.txt or conan uses stale config"
