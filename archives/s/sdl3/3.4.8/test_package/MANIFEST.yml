package: "sdl3/3.4.8"
homepage: "https://www.libsdl.org/"
upstream_check_command: "cmake -S . -B build -DSDL_TESTS=ON && cmake --build build && ctest --test-dir build"
upstream_test_in_build: false
upstream_tests:
  - file: "test/testversion.c"
    source: "SDL3-3.4.8/test/testversion.c"
    description: "Validate SDL compile-time and runtime version APIs"
    command: "./testversion"
test_package_tests:
  - file: "test.c"
    description: "Link the Conan target and validate SDL 3.4.8 at runtime"
    command: "ctest --output-on-failure"
assertion_count: 4
