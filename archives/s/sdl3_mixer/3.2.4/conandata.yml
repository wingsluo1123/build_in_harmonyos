patches:
  "3.2.4": []  # No patches — SDL3_mixer doesn't do OHOS-specific platform
              # detection; it just propagates SDL3's CMAKE_SYSTEM_NAME,
              # which our sdl3 recipe already maps to HarmonyOS.
              # find_package(SDL3) call resolves via conan's
              # CMakeDeps-generated SDL3Config.cmake (sdl3 sets
              # cmake_file_name=SDL3 + cmake_build_modules for SDL3::Headers).