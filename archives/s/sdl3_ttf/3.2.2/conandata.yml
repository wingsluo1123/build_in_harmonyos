patches:
  "3.2.2":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Use lowercase freetype::freetype target name to match our conan freetype recipe (which exposes cmake_file_name=freetype + cmake_target_name=freetype::freetype). SDL3_ttf's CMakeLists.txt hardcodes Freetype::Freetype (uppercase), which our freetype recipe does not expose; sed-replace both the vendored-freetype ALIAS block and the system-freetype find_package block."
      patch_type: "conan"
