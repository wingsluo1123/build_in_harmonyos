software: sem-cli
version: 0.16.0
status: built
build_system: cargo
description: Semantic version control CLI with entity-level diffs and blame
homepage: https://github.com/Ataraxy-Labs/sem
license: MIT OR Apache-2.0

dependencies:
  - openssl/3.5.6@ohpcd/stable
  - libgit2/1.9.4@ohpcd/stable

build_config:
  settings:
    os: ["Linux", "OHOS"]
  cargo_manifest: crates/sem-cli/Cargo.toml
  cargo_profile: release

notes:
  - "Rust/Cargo project, uses direct cargo build commands"
  - "libgit2 and openssl are conan-managed (R27 compliant)"
  - "R32: settings.os check in ('Linux', 'OHOS')"
