# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sem-cli/0.16.0
homepage: https://github.com/Ataraxy-Labs/sem

# 上游使用 cargo test，但不在 Conan 构建流程中执行
upstream_check_command: "cargo test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "sem --version 验证二进制可执行且版本正确"
    command: "sem --version"

# 测试断言总数
assertion_count: 1
