# ── test_package 自带测试（消费者视角，赛规 N≥1） ────────────────
test_package_tests:
  - file: test_sems.sh
    description: "运行打包的 sbin/sems -v，断言退出码 0、输出包含 2.1.0 且横幅为 'Sip Express Media Server'"
    command: "SEMS_BIN=<package_folder>/sbin/sems sh test_sems.sh"
    assertions: 3
  - file: conanfile.py
    description: "test() 两步：①真实运行包内 sbin/sems_tests（上游 11 suite / 204 断言）②真实运行 sbin/sems 冒烟脚本 test_sems.sh；另校验 plug-in 目录非空"
    command: "<pkg>/sbin/sems_tests && SEMS_BIN=<pkg>/sbin/sems sh test_sems.sh"
    assertions: 207

# 断言统计
