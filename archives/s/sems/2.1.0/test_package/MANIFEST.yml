# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制存在）
# 口径：R51 三步法 —— ①清点 ②真实执行 ③如实回填（本文件即第 ③ 步产物）
package: sems/2.1.0
homepage: "https://github.com/sems-server/sems"

# ── ① 清点（R51 第一步） ──────────────────────────────────────────
# 上游 2.1.0 已全量迁移 CMake；测试位于 core/tests/：
#   · sems_tests.cpp —— fct.h 测试入口，FCT_BGN() 内以 FCTMF_SUITE_CALL() 注册 11 个 suite
#   · test_*.cpp × 11 —— 各 suite 源文件（每个配同名 .h）
#   · fct.h —— 上游自带 fct 测试框架（单头文件实现）
# 上游 CMake 将该目录编译为**单体可执行程序** sems_tests（ctest 注册 1 项），
# 11 个 suite 共 204 个断言级子测试。各 suite 用例数（源文件 FCT_TEST_BGN 静态计数）：
#   rfc3261_musts=88, rfc3261_parser=25, uriparser=15, amconfig=14, jsonarg=13,
#   parser=13, auth=11, headers=10, extensions=8, replaces=5, sdp=2  →  合计 204
upstream_check_command: "ctest（core/tests 注册 1 项：单体 sems_tests，内部 204 个断言级子测试）"

# ── ② 真实执行（R51 第二步）已集成进配方 ─────────────────────────
# 配方 build() 全量构建（含 sems_tests 目标），package() 将 sems_tests 收进 sbin/，
# test_package/conanfile.py 的 test() 第一步真实运行它 —— conan create（本地 W3 与 CI 同源）
# 每次都会真实执行上游 204 项用例；test() 第二步再以 test_sems.sh 真实运行打包的
# sbin/sems -v 并断言版本横幅。
upstream_test_in_build: true
upstream_test_command: "cmake --build <build_folder> --target sems_tests && <package_folder>/sbin/sems_tests"
upstream_tests_exist: true

# ── ② 真实执行记录 ───────────────────────────────────────────────
upstream_test_audit:
  run_env: >-
    本地：WSL(x86_64) + qemu-aarch64 -L /opt/ohos-guest（OHOS guest rootfs，预载
    libbacktraceshim/libarc4shim/libfdchkshim/libchkfcnshim 等 guest libc 缺失符号 shim）
    直接运行交叉编译产物 sbin/sems_tests；CI：原生 HarmonyOS PC worker 经 conan create →
    test_package 运行同一二进制（无需 shim）
  run_date: "2026-10-15"
  discovered: 11
  executed: 11
  passed: 11
  failed: 0
  skipped: 0
  excluded: 0
  assertions_total: 204
  assertions_passed: 204
  assertion_count_source: "各 suite 源文件 FCT_TEST_BGN 静态计数（合计 204），与运行末行 204/204 一致"
  conclusion: >-
    上游 core/tests/ 的 11 个 fct.h suite（204 个断言级子测试）已真实执行：配方构建 sems_tests
    并随包分发（sbin/sems_tests）；本地以 qemu-aarch64 + OHOS guest rootfs 运行交叉编译产物，
    实测 `PASSED (204/204 tests in 0.197590s)`、退出码 0、零失败；同一二进制在 CI 由 test_package
    的 test() 第一步运行（原生 HarmonyOS PC）。无 skipped、无 excluded。

