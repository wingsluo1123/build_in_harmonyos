knowledge_gained:
  - "鸿蒙没有 /usr/bin/env（E037）：脚本类工具包改写 shebang 为 /data/service/hnp/bin/bash，否则 commands.json 声明的直接执行不可用"
  - "上游 bash 脚本 `set -e` 下 `status=$(check_fn)`，check_fn 返回非零会令脚本静默退出（rc=1、无输出）：适配时先用 x86 参照 + 最小复现确认是上游行为再决定是否修补，避免误归因于鸿蒙 bash/toybox 差异；测试应断言退出码与副作用而非输出文本"
  - "Git 驱动型脚本工具的 test_package 需隔离 Git 配置（HOME + GIT_CONFIG_NOSYSTEM + GIT_CONFIG_GLOBAL=/dev/null）并用 `git symbolic-ref HEAD refs/heads/master` 代替 `git init -b`，才能在无 Git 身份的账号上复现真实行为"
  - "lang-preflight 对纯 Shell 项目判 other（无 manifest/构建系统/可统计源文件）：用 --lang other 显式声明后放行"

