software: semtag
display: "semtag"
description: "Git 语义化版本打标签工具（单文件 Bash 脚本）：根据仓库现有 tag 推算并创建下一个 SemVer 版本号"
category: development
homepage: "https://github.com/nico2sh/semtag"
license: "Apache-2.0"
build_system: custom

ohos_adaptation:
  key_points:
    - "单文件 Bash 脚本，无编译单元、无构建系统；运行时依赖 bash(>=4.3) 与 git，均为系统工具，配方无 requires"
    - "鸿蒙没有 /usr/bin/env（知识条目 E037）：补丁把 shebang 从 #!/usr/bin/env bash 改为 #!/data/service/hnp/bin/bash，否则安装后的 semtag 无法直接执行（commands.json 声明依赖直接执行）"
    - "package_type=application；package_id 删除 arch/compiler/build_type，保留 os（产物含鸿蒙专用 shebang）"
    - "HMDFS 上 chmod 常被忽略，配方尽力 chmod 0755，测试一律通过显式解释器调用，不依赖执行位"
    - "上游 v0.2.0 源码包不含任何测试（7 个文件，无 tests 目录/构建系统），功能覆盖全部由 test_package 提供"
  common_dependencies: []

versions:
  "0.2.0":
    status: built
    build_date: "2026-10-03"
    conan_ref: "semtag/0.2.0"
