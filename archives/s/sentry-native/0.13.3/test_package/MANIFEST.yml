# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sentry-native/0.13.3
homepage: https://sentry.io/

# sentry-native uses ctest; upstream tests run separately during exploration
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sentry.c
    description: "sentry SDK 版本验证 + options 创建 + init/close 生命周期测试"
    command: "./test_sentry"

# 测试断言总数
assertion_count: 4
