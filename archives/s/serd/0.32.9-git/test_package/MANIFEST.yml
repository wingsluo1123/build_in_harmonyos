# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: serd/0.32.9-git
homepage: "https://drobilla.net/software/serd"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson.test() in build() — runs serd upstream test suite (node, reader, writer, etc.)"

# 上游实际运行的测试程序 (serd 0.32.9-git meson test 列表)
upstream_tests:
  - file: test/test_node.c
    source: serd-0317806/test/test_node.c
    description: "SerdNode construction and comparison"
    command: "./test_node"
  - file: test/test_reader.c
    source: serd-0317806/test/test_reader.c
    description: "RDF reader functionality"
    command: "./test_reader"
  - file: test/test_writer.c
    source: serd-0317806/test/test_writer.c
    description: "RDF writer functionality"
    command: "./test_writer"
  - file: test/test_env.c
    source: serd-0317806/test/test_env.c
    description: "SerdEnv prefix expansion"
    command: "./test_env"
  - file: test/test_string.c
    source: serd-0317806/test/test_string.c
    description: "SerdString escaped/unescaped handling"
    command: "./test_string"
  - file: test/test_uri.c
    source: serd-0317806/test/test_uri.c
    description: "SerdURI parsing and resolution"
    command: "./test_uri"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：serd_node_new_uri_from_string + serd_node_free"
    command: "./test_serd"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 6 个测试程序 + 消费者 test_package 1 个，每个约 3-5 个断言
assertion_count: 41
