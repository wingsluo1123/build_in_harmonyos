sources:
  "0.17.0":
    url: "https://github.com/janestreet/sexplib0/archive/refs/tags/v0.17.0.tar.gz"
    sha256: "5b0910b5dab8ec63633be5dbf92a3e4863d415d803cad9dddf99dba43ce7498b"

patches:
  - patch_file: "patches/0001-test-dune.patch"
    patch_description: "Port the upstream expect-test stanza to a standalone dune test stanza (the upstream library+ppx_expect runner cannot be built in the public ecosystem: base v0.17 requires OCaml >= 5.1, expect_test_helpers_core depends on core/ppx_jane which is not published for OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0002-test-sexplib0_test.ml.patch"
    patch_description: "Port the upstream expect-test file to the standalone runner: all 7 upstream cases (inputs and expected outputs) are kept verbatim; only the test-framework glue is replaced (Base/Expect_test_helpers_base/ppx_expect/Parsexp/Sexplib.Conv_error -> local equivalents). See the file header for the full rationale."
    patch_type: "portability"
