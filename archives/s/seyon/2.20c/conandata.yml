  sha256: "f221699ac420e55f0d769d4c50699a7e1552132cafe2a65192c3f3f090ca9048"

patches:
  - patch_file: "patches/0001-separse-y-bison-multiline-strings.patch"
    patch_description: "Join multi-line string literals in the yacc epilogue so modern bison (>=3.0) accepts SeParse.y"
    patch_type: "portability"
  - patch_file: "patches/0002-getline-rename-and-usleep-decl.patch"
    patch_description: "Rename the local getline() to seyon_getline() and drop the K&R usleep() prototype (clash with OHOS libc <stdio.h>/<unistd.h>)"
    patch_type: "portability"
