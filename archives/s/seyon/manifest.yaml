software: seyon
description: seyon — X11/Athena (Xaw) 串行通信终端程序，带可脚本化的命令语言
category: terminal
license: LicenseRef-Seyon-Berkeley
homepage: https://www.seyon.org/
repository: https://deb.debian.org/debian/pool/main/s/seyon/
build_system: makefile
keywords:
  - modem
  - serial
  - terminal
  - x11
  - xaw
  - athena
ohos_adaptation:
  key_points:
    - "上游只有 Imakefile；配方用生成的 POSIX Makefile 重写构建，链接 conan 提供的 X11/Xaw 栈"
    - "旧式 K&R C：需 -fcommon（SeDial.c/SeTrans.c 都有 mlw 的暂定定义）"
    - "bison>=3.0 会解析 yacc 尾声，SeParse.y 的多行字符串需打补丁"
    - "getline()/usleep() 的 K&R 原型与 OHOS libc 头文件冲突，需重命名/删除"
    - "OHOS ELF 需 binary-sign-tool 自签，readelf 断言恰 1 个 .codesign"
versions:
  2.20c:
    status: built
    build_date: "2026-10-19"
    patches: 2
