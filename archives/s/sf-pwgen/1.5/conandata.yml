    patch_description: "Add sf-pwgen-portable.c: pure-C99 portable backend implementing the sf-pwgen 1.5 CLI contract (memorable/random/letters/alphanumeric/numbers, count/length/language/version/help, 8..128 clamp, shorter-than-requested warning) on /dev/urandom. Upstream sf-pwgen.m needs macOS Foundation/SecurityFoundation and cannot compile on OHOS; the macOS sources are left untouched and simply not used for the OHOS artifact."
