# conandata.yml — sfront 0.99
#
# Official upstream release tarball from the project's own site
# (https://john-lazzaro.github.io/sa/, the homepage Debian's control file points
# at). Provenance was cross-checked against Debian's own sfront 0.99 source
# package: its signed .dsc
# (https://deb.debian.org/debian/pool/main/s/sfront/sfront_0.99-5.dsc) carries the
# orig tarball with sha256
# d354fbd44fda59013a8111d489ca4155a4eba3c902e081440c8efbc568dc61c4, and
# diff -r of src/ and lib/ between the two releases is empty - byte-identical
# sources and SAOL library. They differ elsewhere: Debian's orig tarball is the
# 2.2 MB "lite" distribution (16 example orchestras, 12 SASL scores) while the
# official tarball is the full 10 MB release (26 / 20), and the official one
# rewrites the author's www.cs.berkeley.edu/~lazzaro links to
# john-lazzaro.github.io in the HTML manual.
sources:
  url: "https://john-lazzaro.github.io/sa/sfront0.99.tar.gz"
  sha256: "97296d8308ad7fabc8944a44592bbb996293ee66975b3c07c4022a548ef68862"
  filename: "sfront0.99.tar.gz"

