knowledge_gained:
  - "上游 CMake 用 CMAKE_SYSTEM_NAME STREQUAL \"Linux\" 判定 Linux 专属 pass-through 实现：HarmonyOS 会落入 PT_DUMMY 降级分支，PT 全部空转且 14 个可执行文件不构建（SG3_UTILS_LINUX_ONLY 的 13 个 + sg_scan，示例 sg_map/sg_scan/sg_rbuf/sg_emc_trespass；其中 sg_* 前缀 11 个，另含 sginfo/sgm_dd/sgp_dd 三个别名），必须把 HarmonyOS/OHOS 并入该分支"
  - "OHOS sysroot 已具备 scsi/sg.h、linux/bsg.h、linux/nvme_ioctl.h，sg v4/bsg 真实 PT 可直接编译，无需打桩（R40 检查通过）"
  - "上游 libsgutils2 的 OUTPUT_NAME 内嵌版本（libsgutils2-1.49.a），且 install(TARGETS) 只声明 LIBRARY DESTINATION —— 静态库根本不会被安装，需 package() 从构建目录补齐并归一为 libsgutils2.a"

