    - "-DSPIRV_SKIP_EXECUTABLES=ON"
    - "-DSPIRV_SKIP_TESTS=ON"
patches_applied: []
knowledge_gained:
  - "shaderc 源码树不含子模块，glslang/SPIRV-Tools/SPIRV-Headers 提交由上游 DEPS 固定，配方须按同源提交拉取并还原 third_party 布局（含 spirv-tools/external/spirv-headers 同源副本）（reference: conanfile.py#source, notes.md#二）"
  - "OHOS clang 驱动自带 --gcc-toolchain=<sdk> 参数，shaderc 默认 -Werror 会以 -Wunused-command-line-argument 失败，须关闭 SHADERC_ENABLE_WERROR_COMPILE（reference: conanfile.py#build, E063）"
  - "构建目录路径含 '.' 时，glslc 对无扩展名输入文件的输出名推导与上游测试框架的期望路径同时被截断，上游 glslc 集成用例会假失败（改用无 '.' 路径即 445/445 通过）（reference: notes.md#四, reports/test-report.md）"
  - "CMake 4.x 无 Platform/HarmonyOS.cmake 模块，上游 SOVERSION 不生效：libshaderc_shared.so 无版本后缀且无 DT_SONAME，且会被 collect_libs() 收进 cpp_info.libs；本包声明 static-library，须在 package() 剔除该共享库并把 shaderc.pc 链接项改写为静态库（reference: conanfile.py#_drop_soname_less_shared_lib, E383）"
  - "受限 CI worker 上 CMake 编译器可用性探测的 try-compile 会因 fork/exec EAGAIN 失败（日志为裸 `resource temporarily unavailable`，conan 只抛 `Error 1 while executing` 不带原文），须按签名退避重试并从 CMakeConfigureLog.yaml 回查证据；同一配方在健康 worker（CI-028）可完整通过（reference: conanfile.py#_configure_with_fork_retry, notes.md#对话 #4）"
  - "Makefiles 生成器执行每条规则要额外 fork /bin/sh，在进程紧张的 worker 上是 try-compile 最先失败的环节，故在能探测到 ninja 时固定 Ninja 生成器并钉死 CMAKE_MAKE_PROGRAM，探测不到则回退 conan 默认生成器（reference: conanfile.py#_ninja_path, E346）"
