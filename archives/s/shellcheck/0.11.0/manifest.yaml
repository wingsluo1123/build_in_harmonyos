software: shellcheck
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.11.0"

# 编译状态
# published | built | failed | archived
status: failed

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/builds/shellcheck-0.11.0.tar.gz"

  # 源码校验和
  sha256: "8b07554f92e4fbfc33f1539a1f475f21c6503ceae8f806efcc518b1f529f7102"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ghc/required"  # Haskell compiler - missing in cmd-pkgs
    - "cabal/required"  # Haskell build tool - missing in cmd-pkgs
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "ShellCheck 是 Haskell 项目，需要 GHC/Cabal 构建工具"
    - "cmd-pkgs 当前无 Haskell 工具链预编译包（440个包中无ghc/cabal）"
    - "编译 GHC 需要数小时，违反 R18 预编译包优先原则"
    - "Haskell 项目不适合当前编译流程，应提前识别并报错"
    - "init-build 需增强 Cabal 文件识别（ShellCheck.cabal）"
