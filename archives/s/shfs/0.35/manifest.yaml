# ============================================================
# 知识沉淀（路径 B：知识为必交项）
# ============================================================

knowledge_gained:
  - "clang 拒绝 GCC 遗留的 -I- include 分隔符，须按语义改写为 -iquote/-I；错误在 driver 参数解析阶段，无文件名行号 —— knowledge_ref: knowledge/drafts/E2141-draft-24E4.kv"
  - "OHOS libc 的 <mntent.h> 只有读侧，addmntent(3) 缺失在链接期报 undefined symbol（clang 把隐式声明降为 warning 所以错误面不在编译器）；包内 static 写侧 helper 按 mtab(5) 六字段直接 fprintf —— knowledge_ref: knowledge/drafts/E2142-draft-24E4.kv"
  - "源码 tar 含符号链接成员时 conan 的 source→build copytree(symlinks=True) 必炸：建链成功但紧接着的 copystat(follow_symlinks=False) 走 lchmod，鸿蒙文件系统返回 EACCES；失败早于 build()，只能在解压阶段 excludes 排除 —— knowledge_ref: knowledge/drafts/E2143-draft-24E4.kv"
  - "SourceForge 以 /download 结尾的 URL 隐藏归档扩展名，conan 格式嗅探报 BadZipFile，须用 conandata 的 filename: 显式补 .tar.gz —— ref: knowledge/graph/E483.kv"
  - "mount(2)/umount2(2) 被鸿蒙 seccomp 拦为 SIGSYS：用户态挂载工具的端到端断言应固化成\"恰好停在 syscall 边界且 /proc/mounts 无残留\" —— reference: knowledge/drafts/DRAFT-mhddfs-0.1.39.0-ohos-fuse-consumer-mount-boundary.kv"

