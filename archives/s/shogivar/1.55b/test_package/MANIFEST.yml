# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
package: shogivar/1.55b
homepage: "https://hgm.nubati.net/ShogiVars.html"

# ── 上游自动化测试清点（实测证据，2026-10-14）─────────────────────────────
# 上游 **没有** 任何自动化测试入口，清点证据：
#   1. 源码包内只有两个子目录：Data/（棋盘/棋子/标题/帮助图片与 .dat/.rul 变体
#      定义）与 gtk/（前端源码），没有 tests/、test/、t/ 目录；
#   2. 全树 find -iname "*test*" / "check*" / "*.trs" 命中 0 个文件；
#   3. Makefile.am 无 TESTS / check_PROGRAMS / check_SCRIPTS / check_LTLIBRARIES
#      任何一项（grep 无输出）；
#   4. 因此 automake 生成的 check 目标为空壳，实测输出仅
#      `CDPATH=...: && cd <srcdir> && true`，退出码 0，注册用例 0 个；
#   5. 上游 README 亦未提及任何测试方式（只说明 autogen.sh/configure/make/
#      make install 的构建安装步骤）。
# 故上游 N = 0、N′ = 0，通过率不适用；功能验证由本目录的鸿蒙消费者用例提供。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: >-
      鸿蒙消费者用例（二进制契约）: 纯 Python 解析安装后 bin/shogivar 的 ELF 头与
      PT_DYNAMIC，断言 64 位小端 AArch64、PT_INTERP = /lib/ld-musl-aarch64.so.1
      （OHOS musl 加载器），以及 DT_NEEDED 中确实存在 libgtk-3.so.0、libcairo.so.2、
      libglib-2.0.so.0、libpango-1.0.so.0 —— 证明该包真的构建成了 OHOS aarch64 上
      可加载的 GTK3 图形程序，而非占位产物
    command: "conan test (conan create 自动触发)"
  - file: test.sh
    description: >-
      鸿蒙消费者用例（运行期契约）: 在 conanrun 环境（PATH 指向包内 bin/）中真实
      执行包内二进制与资源：CLI 入口 --version/-v/--help 的退出码与输出、18 个
      变体 .dat/18 个 .rul 规则文件齐全且非空、pieces/titles/help 图片数量与
      PNG 魔数、资源树无 0 字节文件、man page、--help 报告的运行时资源目录确实
      存在且可用（可重定位安装的端到端验证）、以及无显示环境下启动必须以
      display 相关错误干净退出（不得信号崩溃）
    command: "bash test.sh <package-folder>"

# 断言总数: test.sh 内 15 个检查点 + conanfile.py test() 内 6 项 ELF/链接契约断言
assertion_count: 21

# 备注：上游图形界面需要窗口系统，CI worker 无显示（GTK 报
# "cannot open display"），因此图形路径只能验证"确实需要显示且不崩溃"，
# 棋盘/规则的真实交互无法在无头环境断言，此处如实声明，不伪造通过。
headless_note: "GTK 图形路径需窗口系统；无头环境仅断言干净退出"
