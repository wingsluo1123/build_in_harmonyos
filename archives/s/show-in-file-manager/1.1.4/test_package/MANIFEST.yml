# test_package/MANIFEST.yml — show-in-file-manager 1.1.4
# 上游官方测试声明（详见 docs/TEST_QUALITY_SPEC.md）
#
# 上游测试入口（仓库 src/rundoctest.py，对 src/showinfm/system/linux.py 的
# wsl_transform_path_uri doctest 运行 docstring 示例）：
#   python3 src/rundoctest.py
# 用例总数：wsl_transform_path_uri docstring 129 个 doctest 示例
#
# 运行情况（真机实测口径，打平台补丁后的源码树）：
#   - 129 个 doctest 用例：52 passed / 77 failed / 0 errors / 0 skipped /
#     0 timeout。
#   - 77 个失败均为上游 doctest 期望值与 WSL/文件系统环境相关：大量示例
#     依赖 /home/damon/...、~/.bashrc 等路径在本机存在且为 WSL 环境
#     （如 `r.win_path if r.exists else ...` 分支、file://.../.../home/...
#     期望值）。本真机为 HarmonyOS（非 WSL，platform=Linux 分支），路径
#     不存在且 is_wsl=False，导致输出不匹配（+ELLIPSIS 仍不匹配）。
#     属于环境差异，如实记录为 failed，未改写为 skip，未修改上游断言、
#     数据、用例选择、skip 条件或预期结果。
#   - rundoctest.py 使用 doctest.run_docstring_examples 且不设退出码
#     （恒为 0），故以 doctest runner 的 attempted/failed 统计为准。
#   - conanfile.py build() 仅做确定性构建与包内基础自检（wheel 构建、
#     import、CLI 入口），上游 doctest 按独立测试阶段运行并单独报告。

package: show-in-file-manager/1.1.4
homepage: "https://github.com/damonlynch/showinfilemanager"

upstream_check_command: "python3 src/rundoctest.py"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/rundoctest.py
    source: showinfilemanager-1.1.4/src/rundoctest.py
    description: "wsl_transform_path_uri doctest 运行器：129 个 doctest 用例，52 passed / 77 failed（WSL/文件路径环境差异，非适配缺陷）"
    command: "python3 src/rundoctest.py"
    result: failed

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: smoke.py
    description: "消费者断言（5 项）：import showinfm + 公共 API / 平台识别=Linux（补丁生效）/ URI 工具函数真实工作 / linux_desktop_humanize / CLI 入口存在可执行"
    command: "python3 smoke.py"
  - file: conanfile.py
    description: "消费者测试：调用 smoke.py + showinfilemanager --version/-h CLI smoke"
    command: "conan test test_package show-in-file-manager/1.1.4@"

# 测试断言总数（test_package 消费者断言 5 项；上游 129 个 doctest 用例与
# 断言分离统计，不混入消费者断言通过率）
assertion_count: 5
