sources:
  "4.4.0":
    url: "https://codeload.github.com/siconos/siconos/tar.gz/refs/tags/4.4.0"
    filename: "siconos-4.4.0.tar.gz"
    sha256: "363238d57a32347fce5dd4924d24a0862dbbe48e3887f4b5236aa93d0be0e3e5"

patches:
  - patch_file: "patches/0001-siconos-config.cmake.in.patch"
    patch_description: "Make the native installed CMake config relocatable and discover its real public dependency targets"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-FindLAPACKDEV.cmake.patch"
    patch_description: "Export the singular LAPACK header include variable that the module actually discovers"
    patch_type: "portability"
  - patch_file: "patches/0003-cmake-SiconosPackageSetup.cmake.patch"
    patch_description: "Install the GMP discovery module required by the public native CMake export"
    patch_type: "portability"
  - patch_file: "patches/0004-cmake-SiconosSetup.cmake.patch"
    patch_description: "Use real module/config dependency contracts and make the optional driver packaging module optional"
    patch_type: "portability"
  - patch_file: "patches/0005-cmake-tools4tests.cmake.patch"
    patch_description: "Retain nonempty inherited runtime library paths in the no-RPATH test environment"
    patch_type: "portability"
  - patch_file: "patches/0006-externals-CMakeLists.txt.patch"
    patch_description: "Retain bundled external headers and public BLAS linkage; restrict GNU Fortran flags to GNU and C warnings to C/C++"
    patch_type: "portability"
  - patch_file: "patches/0007-externals-externals_tests.cmake.patch"
    patch_description: "Restrict the ODEPACK GNU argument-mismatch compatibility option to GNU Fortran"
    patch_type: "portability"
  - patch_file: "patches/0008-io-src-mechanics-MechanicsIO.cpp.patch"
    patch_description: "Generate existing Lagrangian base visitor forwarding for the two real derived linear systems"
    patch_type: "bugfix"
  - patch_file: "patches/0009-kernel-CMakeLists.txt.patch"
    patch_description: "Export real public numerics/GMP dependencies and the published Boost header definitions"
    patch_type: "portability"
  - patch_file: "patches/0010-kernel-kernel_tests.cmake.patch"
    patch_description: "Build the original TestPlugin callbacks and register the AVI test only when its sole case is enabled"
    patch_type: "bugfix"
  - patch_file: "patches/0011-kernel-src-utils-SiconosAlgebra-SimpleMatrixOperators.cpp.patch"
    patch_description: "Correct the unreachable symmetric matrix assignment branch to test the symmetric input type"
    patch_type: "bugfix"
  - patch_file: "patches/0012-kernel-src-utils-SiconosAlgebra-SimpleMatrixSolvers.cpp.patch"
    patch_description: "Write the successfully solved sparse right-hand-side result back from the NumericsMatrix copy"
    patch_type: "bugfix"
  - patch_file: "patches/0013-kernel-src-utils-SiconosAlgebra-test-BlockVectorTest.cpp.patch"
    patch_description: "Align insertPtr assertion with its documented sharing contract and add a shared-mutation check"
    patch_type: "bugfix"
  - patch_file: "patches/0014-kernel-src-utils-SiconosAlgebra-test-SiconosVectorTest.cpp.patch"
    patch_description: "Assert the existing dense block-copy contract and add source/copy storage independence check"
    patch_type: "bugfix"
  - patch_file: "patches/0015-kernel-src-utils-SiconosSharedLibrary-SiconosSharedLibrary.cpp.patch"
    patch_description: "Use the existing normal dlopen path when RTLD_DEEPBIND is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0016-kernel-tests-common-TestMain.cpp.patch"
    patch_description: "Reject empty CppUnit suites and propagate actual boolean success to the process exit status"
    patch_type: "bugfix"
  - patch_file: "patches/0017-numerics-CMakeLists.txt.patch"
    patch_description: "Export real public external headers and LAPACK dependencies for native installed consumers"
    patch_type: "portability"
  - patch_file: "patches/0018-numerics-src-QP-ConvexQP_ProjectedGradient.c.patch"
    patch_description: "Evaluate the original Armijo quadratic increment without subtracting nearly equal objective values; preserve the symmetric PSD contract and original residual oracle"
    patch_type: "bugfix"
  - patch_file: "patches/0019-numerics-src-tools-open_lib.c.patch"
    patch_description: "Use the existing normal dlopen path when RTLD_DEEPBIND is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0020-numerics-src-tools-test-utils-test_utils.c.patch"
    patch_description: "Correct succeeded-collection diagnostic indexing and emit distinct PASS/FAIL/XFAIL/XPASS/unstable case outcomes"
    patch_type: "bugfix"
  - patch_file: "patches/0021-scripts-siconos.py.in.patch"
    patch_description: "Make the native example driver relocatable, preserve runtime library paths, use standard-library CMake comparisons and stringify the jobs argument"
    patch_type: "portability"
  - patch_file: "patches/0022-externals-hairer-test-dr1_radau5.f.patch"
    patch_description: "Propagate the existing Hairer solver negative IDID failure status without adding a numerical oracle"
    patch_type: "bugfix"
  - patch_file: "patches/0023-externals-hairer-test-dr2_radau5.f.patch"
