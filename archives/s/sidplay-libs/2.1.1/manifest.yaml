# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "config.guess/config.sub: 2004 年老版本不认识 HarmonyOS，需打 E007 补丁输出 aarch64-unknown-linux-ohos"
- "configure/config.status: mktemp umask 077 在 HMDFS setgid 目录不可写，需改 umask 022 (E112)"
- "C++11 窄化错误：老代码 int8_t 数组用 '\x80' 等字面量溢出，改 int 或加 -Wno-c++11-narrowing"
- "模板两阶段查找：派生类访问依赖基类成员需 this-> 前缀 (SmartPtr.h)"
- "extra qualification：老代码 operator= 带类名限定需去掉 (SidUsage.h)"
- "顶层 configure 是自定义递归脚本硬编码相对路径，conan 需 in-source 构建 (folders.build='.')"