# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sidplay-libs/2.1.1
homepage: "https://sourceforge.net/projects/sidplay2/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (2004-era autotools 项目，无注册测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者 C++ 测试：构造 sidplay2 引擎并查询 info，构造 SidDatabase 并调用 error() API"
    command: "./test_sidplay-libs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
