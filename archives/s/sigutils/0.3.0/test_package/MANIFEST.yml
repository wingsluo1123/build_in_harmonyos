# test_package/MANIFEST.yml
# 上游官方测试声明文件；详见 docs/TEST_QUALITY_SPEC.md

package: sigutils/0.3.0
homepage: "https://github.com/BatchDrake/sigutils"

# 上游测试命令（上游未注册 CTest add_test；直接运行构建树 sutest 主程序）
upstream_check_command: "run upstream sutest (all registered tests) from the build tree"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "run upstream sutest (all registered tests) from the build tree"

# 上游 18 个注册测试（源码审计值，src/main.c 的 SU_TEST_ENTRY 列表，详见 notes.md）：
# ncqo 1 + butterworth_lpf 1 + agc 3 + pll 1 + costas 4 + clock_recovery 2
# + channel_detector 3 + specttuner 1 + matfile 2。
# su_test_channel_detector_real_capture 在样本文件缺失时按上游源码语义
# 自跳过并计通过（与 tarsnap 网络用例 SKIP 同类，如实披露）。
# 真机实测（MateBook 鸿蒙 PC aarch64，2026-10-17）：18/18 全过、失败 0、
# 跳过 0，退出码 0；计数口径以 notes.md 与 PR 实测数字为准。
upstream_tests:
  - file: src/tests/ncqo.c
    source: sigutils-0.3.0/src/tests/ncqo.c
    description: "NCQO 振荡器幅度/相位官方测试"
    command: "./sutest"
    test_count: 1
  - file: src/tests/filt.c
    source: sigutils-0.3.0/src/tests/filt.c
    description: "Butterworth 低通滤波器官方测试"
    command: "./sutest"
    test_count: 1
  - file: src/tests/agc.c
    source: sigutils-0.3.0/src/tests/agc.c
    description: "AGC 暂态/上升/下降稳态官方测试"
    command: "./sutest"
    test_count: 3
  - file: src/tests/pll.c
    source: sigutils-0.3.0/src/tests/pll.c
    description: "锁相环官方测试"
    command: "./sutest"
    test_count: 1
  - file: src/tests/clock.c
    source: sigutils-0.3.0/src/tests/clock.c
    description: "Costas 环（bpsk/qpsk/qpsk_noisy）与时钟恢复官方测试"
    command: "./sutest"
    test_count: 6
  - file: src/tests/detect.c
    source: sigutils-0.3.0/src/tests/detect.c
    description: "信道检测器 qpsk/qpsk_noisy/真实采样官方测试（真实采样项缺样本自跳过）"
    command: "./sutest"
    test_count: 3
  - file: src/tests/specttuner.c
    source: sigutils-0.3.0/src/tests/specttuner.c
    description: "频谱调谐器双音官方测试"
    command: "./sutest"
    test_count: 1
  - file: src/tests/mat.c
    source: sigutils-0.3.0/src/tests/mat.c
    description: "Matlab .mat 文件常规/流式读写官方测试"
    command: "./sutest"
    test_count: 2

# test_package 中自带的消费者视角测试
# 直接 CC 链接已安装的 libsigutils，验证 ABI/版本/NCQO/滤波器选择性。
test_package_tests:
  - file: test.c
    description: "消费者程序链接 libsigutils，验证 ABI/版本/NCQO/Butterworth 选择性离线 API"
    command: "./test_sigutils"
    assertion_count: 6

# 上游 18 + 消费者测试 6
assertion_count: 24
