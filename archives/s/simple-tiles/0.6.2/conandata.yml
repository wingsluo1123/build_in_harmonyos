patches:
  - patch_file: "patches/0001-waf-python312-compat.patch"
    patch_description: "waf 2.0.17 兼容 Python 3.12：禁用 posix_spawn（OHOS 上不做 PATH 查找）并注入 imp shim 路径。"
    patch_type: "portability"
  - patch_file: "patches/0002-wscript-gdal-pkgconfig.patch"
    patch_description: "gdal 依赖检查改用 pkg-config（gdal.pc 由 conan gdal 包提供），替代 gdal-config 脚本（其 -L 指向不存在的 build 目录）。"
    patch_type: "portability"
