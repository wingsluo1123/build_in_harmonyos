# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: simple-tiles/0.6.2
homepage: "https://github.com/propublica/simple-tiles"

# 上游测试命令（waf test 目标：C 测试套件 runner + api + benchmark）
upstream_check_command: "python3 waf test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/ 目录 C 测试套件）
upstream_tests:
  - file: test/runner.c + test/test_bounds.c,test_integration.c,test_list.c,test_map.c,test_query.c,test_raster_layer.c,test_style.c,test_vector_layer.c
    source: simple-tiles-0.6.2/test/
    description: "上游 C 单元测试套件（runner 程序，8 个测试文件 / 106 断言）"
    command: "./build/test/runner"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test.c
    description: "消费者测试：链接 libsimple-tiles 并调用 simplet_map_new API 断言"
    command: "./test_simple_tiles"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 106
