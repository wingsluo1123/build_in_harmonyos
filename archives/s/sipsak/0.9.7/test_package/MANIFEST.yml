package: sipsak/0.9.7
homepage: "https://sipsak.org"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "compiled and executed during build when the Check framework is available"

excluded_upstream_tests:
  - command: "make check"
    reason: "Upstream 'make check' relies on the generated Autotools test harness, which is bypassed; the Check-based unit test sources (check_helper, check_md5) are compiled and executed directly during build when the Check framework is present, and skipped only when Check is not available in the build environment."

upstream_tests:
  - file: tests/check_helper.c
    source: sipsak-0.9.7/tests/check_helper.c
    description: "Upstream helper-function unit tests"
    command: "./tests/check_helper"
  - file: tests/check_md5.c
    source: sipsak-0.9.7/tests/check_md5.c
    description: "Upstream MD5 implementation unit tests"
    command: "./tests/check_md5"

test_package_tests:
  - file: test_sipsak.sh
    description: "Run the packaged sipsak --version command"
    command: "bash test_sipsak.sh <package_folder>"

assertion_count: 2
