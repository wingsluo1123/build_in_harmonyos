# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点（R51 三步法，证据见 0.4/notes.md）：
#   1. Makefile 目标仅有 all / sircbot / sircbot-send / clean / install /
#      install-lua，没有 check 或 test 目标；
#   2. `make -n check` -> "No rule to make target 'check'"；
#      `make -n test`  -> "No rule to make target 'test'"；
#   3. 源码包内无 tests/ 目录，sircbot.c / irc.c / sircbot-send.c 中没有任何
#      断言或测试程序。
# 结论：上游没有测试，上游实测数为 0；下表的验证全部来自本次新增的消费者用例。

package: sircbot/0.4
homepage: "https://git.alpinelinux.org/cgit/sircbot/"

# 上游测试命令（上游不存在此目标，留空并在上方说明）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试（消费者视角端到端验证，调用已安装的二进制）
test_package_tests:
  - file: consumer_test.sh
    description: >-
      消费者端到端用例 E2E-1：以伪 IRC 服务器为对端，按文档用法以守护进程方式启动已安装的
      sircbot，用已安装的 sircbot-send 从 stdin 投递消息，核对该消息以
      "PRIVMSG #testchan :hello-from-iot" 抵达 IRC 服务器；随后由服务器注入一条入站
      PRIVMSG，核对钩子脚本以 (sender, message, channel) 三个参数被执行；最后按钩子日志中
      的标记行计数核对目录扫描行为——两个可执行钩子各恰好执行一次，不可执行的钩子未被执行
    command: "bash consumer_test.sh"
  - file: fakeircd.py
    description: "测试对端：最小 IRC 服务器（测试脚手架，非被测物）"
    command: "python3 fakeircd.py --portfile <port> --log <log>"

# 消费者用例断言数（consumer_test.sh 中的 check 调用数）
assertion_count: 7

# 上游断言数（上游无测试）
upstream_assertion_count: 0
