# test_package/MANIFEST.yml
# Upstream test declaration for siril 1.2.3
# CI script (build_and_test.sh L0e) requires this file

package: siril/1.2.3
homepage: "https://free-astro.org/index.php/Siril"

# Upstream test command analysis
upstream_check_command: "make check"

# siril's autotools build has a test suite in src/tests/
# but it requires a display and FITS test data
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from src/tests/)
upstream_tests:
  - file: src/tests/siril_date_test.c
    source: siril-1.2.3/src/tests/siril_date_test.c
    description: "Tests siril date parsing functions"
    command: "./siril_date_test"
  - file: src/tests/siril_world_cs_test.c
    source: siril-1.2.3/src/tests/siril_world_cs_test.c
    description: "Tests world coordinate system transformations"
    command: "./siril_world_cs_test"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.c
    description: "Verifies siril binary exists, is executable, and has correct version"
    command: "./test_siril"

# Approximate assertion count for quality assessment
assertion_count: 5
