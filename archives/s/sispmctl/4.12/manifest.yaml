# manifest.yaml — sispmctl 4.12（版本级）
# 遵循 ARCHIVE-SPEC v3.0

version: "4.12"

# 编译状态：published | built | failed | archived
status: built

build_date: "2026-10-10"

conan_ref: "sispmctl/4.12"

source:
  url: "https://downloads.sourceforge.net/project/sispmctl/sispmctl/sispmctl-4.12/sispmctl-4.12.tar.gz"
  sha256: "e757863a4838da6e1ca72a57adc5aca6fc47ffbddc72a69052d8abd743d57082"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - libusb-compat/0.1.7   # libusb-0.1 API（usb.h / -lusb）
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  exist: false
  test_count: 0
  audit: "Audited sispmctl-4.12 tar.gz: no tests/ directory, no TESTS/check_PROGRAMS/check-local in Makefile.am or src/Makefile.am, no make check target, no gtest/ctest/CUnit framework. make -n check yields 'No rule to make target'. See test_package/MANIFEST.yml."

knowledge_gained:
  - "configure.ac requires 'libusb >= 0.1.11' via PKG_CHECK_MODULES; libusb-compat's generated libusb.pc reports 0.1.7 which fails the gate, so a pkg-config shim reporting the upstream libusb-0.1 API version 0.1.12 is authored in generate()"
  - "config.guess/config.sub (shipped in admin/) need HarmonyOS aarch64-unknown-linux-ohos recognition; patched in build()"
  - "The pre-generated configure is executed through bash (OHOS mksh /bin/sh not reliable); in-tree build from the source folder"
  - "sispmctl is a CLI tool whose hardware operations need a physical GEMBIRD USB device; without one, only -v/-h paths run. Consumer test exercises pure library API (plannif_reset, pms2_schedule_to_buffer round-trip) plus the version output."
