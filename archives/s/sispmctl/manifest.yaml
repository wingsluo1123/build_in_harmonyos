# 软件级 manifest
# 文件位置: archives/s/sispmctl/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: sispmctl

display: "sispmctl"

description: "控制 GEMBIRD (m)SiS-PM 系列 USB 电源插座（排插）的命令行工具"

# system | utility | network（硬件控制工具）
category: system

homepage: "https://sispmctl.sourceforge.net/"

license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "依赖 libusb-0.1 API（libusb-compat），configure PKG_CHECK_MODULES 需 libusb >= 0.1.11，用 pc shim 报告 0.1.12 通过"
    - "config.guess/config.sub 需补 aarch64-unknown-linux-ohos 识别"
    - "预生成 configure 经 bash 直跑（OHOS mksh /bin/sh 不可靠），config.status umask 077→022"
  common_dependencies:
    - libusb-compat
    - libusb

versions:
  "4.12":
    status: built
    build_date: "2026-10-10"
    published_as: sispmctl
