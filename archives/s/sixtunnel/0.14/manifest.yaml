# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "6tunnel 的 configure 为手写 minimal autoconf，只用原生编译检测（无 config.guess/config.sub 主机探测），可在 HarmonyOS PC 直接原生构建，无需 config.guess 补丁"
  - "上游测试为 automake TESTS=./test.py，test.py 内含 24 个 test() 场景（python_def 口径）；顺序执行、首个失败即中止，make check 退出码 0 即代表 24 例全部通过"
  - "test.py 在构建目录运行 `./6tunnel` 二进制，依赖 IPv6 回环 (::1) 与 AF_INET6；HarmonyOS PC 网络栈支持"
