  sha256: "0a5043f5b82ec0764c1e47ecee61aec345e9cad644026fc5ee003c8c026f6c90"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -C external/pflash -j1 CC=clang CROSS_COMPILE="
    - "make -C external/gard -j1 CC=clang CROSS_COMPILE="
    - "make -C external/ffspart -j1 CC=clang CROSS_COMPILE="
    - "make -C external/xscom-utils -j1 CC=clang CROSS_COMPILE="
    - "PFLASH_VERSION=pflash-7.0 GARD_VERSION=gard-7.0 FFSPART_VERSION=ffspart-7.0 XSCOM_VERSION=xscom-7.0"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied:
  - file: 0001-Makefile.main.patch
    purpose: "make check 宿主机单测：HOSTEND 识别 aarch64/arm 为 LITTLE，避免 ccan/endian 报 Unknown endian"
    lines_changed: 1
  - file: 0002-ccan-endian-endian.h.patch
    purpose: "musl alltypes.h 已定义字节序宏；加 #ifndef 保护，避免 clang -Werror 的宏重定义错误"
    lines_changed: 8
  - file: 0003-external-common-get_arch.sh.patch
    purpose: "识别 __aarch64__ 为 ARM 闪存后端；交叉前缀无 cpp 时回退到 $CC"
    lines_changed: 10
  - file: 0004-external-ffspart-test-tests-18-eraseblock-gt-first-partition.patch
    purpose: "修正 '|| echo skip && exit 0' 的 shell 优先级，使 pflash 在 PATH 中时用例真正执行"
    lines_changed: 5
  - file: 0005-external-gard-rules.mk.patch
    purpose: "clang 不支持 -Wno-stringop-truncation；先探测再传入"
    lines_changed: 4
  - file: 0006-external-pflash-test-test-pflash.patch
    purpose: "测试辅助函数改用 POSIX cmp -n（toybox 无 --bytes/--ignore-initial）"
    lines_changed: 2
  - file: 0007-external-pflash-test-tests-02-erase.patch
    purpose: "stat --printf 改为 stat -c（toybox 兼容）"
    lines_changed: 2
  - file: 0008-external-pflash-test-tests-03-erase-parts.patch
    purpose: "cmp --bytes/--ignore-initial 改为 cmp -n + 位置参数（两个文件偏移语义保持一致）"
    lines_changed: 7
  - file: 0009-external-pflash-test-tests-04-program-rand.patch
    purpose: "同上，改为 POSIX stat/cmp 形式"
    lines_changed: 10
  - file: 0010-external-pflash-test-tests-05-bad-numbers.patch
    purpose: "同上，改为 POSIX stat/cmp 形式"
    lines_changed: 10
  - file: 0011-libflash-file.c.patch
    purpose: "readlink 缓冲改用 PATH_MAX：OHOS procfs 的 st_size 固定为 64，不能用于确定路径长度"
    lines_changed: 4
  - file: 0012-libflash-test-stubs.c.patch
    purpose: "glibc 专有的 <sys/unistd.h> 改为 <unistd.h>（musl）"
    lines_changed: 1
  - file: 0013-libflash-test-test-ecc.c.patch
    purpose: "显式包含 <endian.h> 以获取 be64toh（musl 不隐式提供）"
    lines_changed: 1
  - file: 0014-libflash-test-test-flash.c.patch
    purpose: "显式包含 <endian.h> 以获取 be64toh（musl 不隐式提供）"
    lines_changed: 1
  - file: 0015-make_version.sh.patch
    purpose: "OHOS 无 /bin/bash；shebang 改为 /usr/bin/env bash"
    lines_changed: 1
  - file: 0016-test-run.sh.patch
    purpose: "OHOS 无 /bin/bash；测试 runner shebang 改为 /usr/bin/env bash"
    lines_changed: 1

