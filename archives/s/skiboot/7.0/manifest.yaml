knowledge_gained:
  - "skiboot 固件本体为 ppc64 专属（-mcpu=power8/大端/PowerPC 汇编），aarch64/OHOS 只能适配 external/ 用户态工具；Debian/Raspbian 亦如此"
  - "external/common/get_arch.sh 仅识别 __arm__，aarch64 会落到 ARCH_UNKNOWN 桩，需补 __aarch64__"
  - "Makefile.main 的 HOSTEND 只识别 x86/ppc；aarch64 主机需补 LITTLE，否则 ccan/endian 报 Unknown endian"
  - "上游 make check 的部分 core/libc/hdata 用例内嵌 PowerPC 汇编（include/cmpxchg.h 的 cr0），aarch64 无法编译"
  - "OHOS procfs 的 /proc/self/fd/<n> lstat st_size 固定为 64；libflash 必须按 PATH_MAX 分配 readlink 缓冲，否则长路径被截断"
  - "CI worker 的 /tmp 可能只读；测试临时目录应放在可写构建目录（self.build_folder）而非 /tmp"
  - "部分 CI worker 的沙箱以 EPERM 拒绝执行 pflash/opal-gard 等硬件工具（同目录 hello 可执行）；上游测试应标记 skipped_sandbox，消费者测试降级为静态 ELF/符号校验"
  - "libflash 测试使用 glibc 专有的 <sys/unistd.h>，musl 需改为 <unistd.h>；be64toh 需显式包含 <endian.h>"
  - "toybox 的 stat/cmp 不支持 GNU 长选项 --printf/--bytes/--ignore-initial，上游 shell 测试需改用 -c/-n 与位置偏移参数"
  - "ffspart 测试 18 的 'command -v pflash || echo skip && exit 0' 因 shell 优先级恒 exit 0，修正为 if 语句后才能覆盖该用例"
  - "OHOS 无 /bin/bash，上游脚本与 test/run.sh 的 shebang 需用 /usr/bin/env bash"
  - "部分 CI worker 的沙箱会以 EPERM 拒绝执行 pflash/opal-gard 等硬件工具（同目录的普通 hello、静态 hello 均可执行）；上游测试需在可执行环境运行，CI 侧降级为静态 ELF/符号校验并如实标记 skipped_sandbox"

references:
