knowledge_gained:
  - "KDE Gear 游戏裁 KIO 的两种上游形态：kgoldrunner 是 KIO::mkpath（QDir().mkpath() 等价替换，零功能损失）；skladnik 是 KIO::file_copy 远程关卡下载 + KUrlMimeData 拖放取 URL，等价替换为 QNetworkAccessManager（NoLessSafeRedirectPolicy + 阻塞 QEventLoop，对应上游 job->exec()）与 QMimeData::urls()"
  - "KF6DocTools 在 skladnik 上游本就是非 REQUIRED 且 doc/ 已被 if(KF6DocTools_FOUND) 守卫，因此无需补丁，只要 CMAKE_DISABLE_FIND_PACKAGE_KF6DocTools=TRUE 即可；对比 kgoldrunner 上游把 DocTools 写在 REQUIRED 里必须打补丁"
  - "src/images/CMakeLists.txt 用 find_package(POVRay) 在渲染器存在时重生成 sprite PNG，而 tarball 已随附渲染结果；不显式 CMAKE_DISABLE_FIND_PACKAGE_POVRay=TRUE 会让构建结果依赖 worker 上是否恰好有 povray，破坏可复现性"
  - "knewstuff/6.18.0 的 requires 不含 kio（实测 conan download 后读配方），因此 KIO 不在 libkdegames/26.04.0 的传递闭包内，想用 KIO 必须自己引入 kio 并接受跨线源码重建"
  - "L5a/L5b 的 SONAME 门禁只扫描包内 lib/lib*.so 一级目录，application 包（无 lib/）不触发；因此依赖 libkdegames/26.04.0（无 DT_SONAME）不会让本包 L5 变红，可执行文件的 path-form DT_NEEDED 由 test_package 的运行时兜底逻辑处理"
  - "Trimming KF6 KIOCore requires explicitly relinking KF6 CoreAddons: upstream target_link_libraries never lists CoreAddons, yet src/main.cpp includes KAboutData, whose include path only arrived through the PUBLIC transitive interface of KIOCore. Omitting the relink makes CI fail with a missing KAboutData header (reproduced in build 92251; same handling as the kgoldrunner 26.04.0 patch)."
  - "The CI checkout-pr step fetches the PR diff through the shared robot account p_repoRobot, which is rate limited to 200 calls per minute. When it saturates, both the worker and a developer machine get HTTP 429 for the same URL, and the wget fallback also fails because busybox wget rejects the -q option. This is transient platform-side breakage unrelated to the recipe; the correct action is to wait for the window and re-trigger, not to change the recipe."
  - "依赖侧源码重建往往不是必需的：先查制品仓有没有同上游版本的 R37 适配修复版（X.Y.Z.N）。kiconthemes/6.18.0 在 karchive/6.18.0 override 下必然 Missing、每轮 CI 都要源码重建（本次 3 轮红的共同落点：ctest 挂 / configure 期 fork 失败），但 kiconthemes/6.18.0.1 把 karchive 钉在 6.18.0，其已发布二进制的 package_id 恰为本闭包所需的 5937e6fd91b6589196a15790f369a1328a4907fb；改用 override=True 指向它之后 conan graph info 的 needs building 由 1 变 0，整图预编译。判据：conan list 该包该版本的 * 通配，比对已发布 package_id 与本图谱算出的 id 是否相等"
  - "worker 报 make[1]: /bin/sh: Resource temporarily unavailable 且 CMake 编译器 ABI 探测 Error 127，是 worker 进程槽耗尽（skill 12.0 的 D 类），发生在依赖包 configure 期、本包代码尚未编译；正确处置不是重刷 CI，而是回到依赖图消除源码重建这一暴露面"

