# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E072: config.sub 不识别 ohos 操作系统，需要添加 ohos-linux 映射和 OS/kernel-os 白名单"
  - "umask 077 在 OHOS 上导致目录权限为 drwx--S---，无法写入文件，需要改为 umask 022"
  - "config.guess 在 OHOS 上无法创建临时文件，通过 --build 和 --host 三元组绕过"
  - "/tmp 只读，需要设置 TMPDIR=$HOME/tmp 并预先创建"

