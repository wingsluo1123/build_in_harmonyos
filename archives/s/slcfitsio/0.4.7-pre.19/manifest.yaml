software: slcfitsio
version: "0.4.7-pre.19"
status: built
build_system: autotools
build_date: "2026-10-14"

source:
  url: "https://www.jedsoft.org/snapshots/slcfitsio-pre0.4.7-19.tar.gz"
  sha256: "913cf288070c36629bdae9d9695d6f2ced6af488c669b8bcb5316a2de8d7ea2c"
  tar_format: tar.gz
  bytes: 177895
  note: "官方 jedsoft.org 快照区；与 Debian 的 slcfitsio_0.4.7~pre.19.orig.tar.gz 逐字节相同"

build:
  system: autotools
  configure_options:
    - "--prefix=/usr"
    - "--build=x86_64-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--with-slanginc=<slang package>/include"
    - "--with-slanglib=<slang package>/lib"
    - "--with-cfitsioinc=<cfitsio package>/include"
    - "--with-cfitsiolib=<cfitsio package>/lib"
  make_targets:
    - "make -C src SHELL=/bin/sh SLANG_LIB= OTHER_LIBS='-L<zlib>/lib -lz' cfitsio-version.h"
    - "make -C src SHELL=/bin/sh RPATH= OTHER_LIBS='-L<zlib>/lib -lz'"
    - "make -C src SHELL=/bin/sh RPATH= install DESTDIR=<staging>"
  in_tree_build: true
  dependencies:
    - cfitsio/4.6.4      # static libcfitsio.a, linked into the module
    - slang/2.3.3        # shared libslang.so.2 + slsh runtime
    - zlib/1.3.1.1       # static libz.a, pulled through cfitsio -> OTHER_LIBS
  cc: clang 15
  package_type: shared-library

patches_applied: []

artifacts:
  - lib/slang/v2/modules/cfitsio-module.so
  - lib/slang/v2/modules/cfitsio-module.so.0.4.7
  - share/slsh/local-packages/cfitsio.sl
  - share/slsh/local-packages/fits.sl
  - share/slsh/local-packages/fitswcs.sl
  - share/slsh/local-packages/help/cfitsio.hlp
  - licenses/COPYRIGHT

module:
  sha256: "6293627d80f72fc6cf2d68cf803f298470a3b735be3169cda0256137be090a93"
  bytes: 1379032
  elf: "ELF 64-bit LSB shared object, ARM aarch64, dynamically linked"
  needed: ["libslang.so.2", "libc.so"]
  rpath: none
  entry_point: init_cfitsio_module_ns

test_results:
  local_cross_build: pass
  conan_create: pass
  reproducibility: "in-place rebuild at /root/ohpcd-work/build/slcfitsio-0.4.7-pre.19 -> identical module sha256"
  upstream_test_suite: "src/tests/test_fits.sl + src/tests/test_wcs.sl (upstream `make test` runs slsh on each)"
  test_package: "run_test.sh + adapted test_fits.sl load the installed module with slsh; skipped on the cross build host, executes on the OHOS worker"

knowledge_gained:
  - "2007 版 config.sub 不认 aarch64-*-ohos → 显式 --build/--host GNU triplet 即可，无需 patch（与 jlog 2.6.0 同款结论，E122 的另一条路径）"
  - "上游 cfitsio-version.h 靠『编译并运行 helper』生成；helper 只调 fits_get_version() 却被链接了 -lslang，交叉编译时会在 __fd_chk 上装载失败 → 该规则单独 SLANG_LIB= 链接即可执行"
  - "JD_SET_RPATH 把构建机 conan 缓存路径写进 DT_RUNPATH → 模块链接时 RPATH= 剥离，运行期靠 conanrun/LD_LIBRARY_PATH"
  - "上游 Makefile 的 OTHER_LIBS 是 zlib 的合法注入点；-lz 不给 -L 会命中 sysroot 的 libz.so（多一个运行期依赖），指向 conan zlib 目录则静态链入 libz.a"
  - "S-Lang 模块入口点模板是 init_%s_module_ns（libslang 2.3.3），可静态校验模块是否可被 import 加载"
