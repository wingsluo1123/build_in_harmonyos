version: "2.15"
software: "sleepd"
status: built
build_date: "2026-09-29"
build_system: "makefile"

source:
  url: "https://deb.debian.org/debian/pool/main/s/sleepd/sleepd_2.15.tar.xz"
  sha256: "93511084c4413794e71851417069cb51039ba72fd8dd4cdafce06ddd5f24f52a"
  tar_format: tar.xz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "无 configure 的手写 Makefile：配方直接 self.run(make)，但命令行的 CFLAGS= 会覆盖 Makefile 内的 `CFLAGS += -DACPI_APM -pthread`，必须把该宏与 -pthread 在命令行重述"
  - "上游 `make install` 用 install -m 4755 -o root -g root（setuid root）——设备无 root/属主语义受限，配方自行 copy 安装并保持 0755"
  - "musl 下 -lpthread 可正常链接（无独立 libpthread，折入 libc）"
  - "OHOS sysroot 自带 <linux/input.h>，eventmonitor.c 无需 shim"
  - "设备 /var/run 不存在：sleepd/sleepctl 的控制文件（/var/run/sleepd.ctl）与 pid 文件在运行期不可写，但读取失败会回落默认值 0，故 `sleepctl status` 是可断言的确定性消费者测试"
