# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sleepd/2.15
homepage: "https://packages.debian.org/source/sleepd"

# 上游测试命令：Makefile 仅有 all / clean / install 三个目标，
# 源码树内无 tests/ 目录、无断言脚本、无 CI 配置 → 上游无测试套件。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# 豁免声明 (TEST_QUALITY_SPEC.md 3.3)
exemptions:
  - rule: "upstream_has_no_test_suite"
    reason: "上游 Makefile 仅有 all/clean/install，无 tests 目录与断言脚本；sleepd 是电源事件守护进程，功能验证需真实 ACPI/sysfs 电池数据与 root 能力，非构建沙箱可提供"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sleepd.py
    description: "① sleepd -h 退出 0 且输出 usage；② sleepctl status 输出默认状态（无控制文件/无 pid 文件 → sleeping enabled / not running）；③ sleepctl 无参数非零退出并输出 usage"
    command: "conan create . (test_package)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
