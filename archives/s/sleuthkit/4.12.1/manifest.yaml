version: "4.12.1"
software: "sleuthkit"
status: built
build_date: "2026-10-15"
build_system: autotools
conan_ref: "sleuthkit/4.12.1"

source:
  url: "https://github.com/sleuthkit/sleuthkit/releases/download/sleuthkit-4.12.1/sleuthkit-4.12.1.tar.gz"
  sha256: "6b2de0baabc6a38429a33993114ca3820329b477d5038cbf45fcf69fca8addfd"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--prefix=<package_folder>"
    - "--with-pic"
    - "--disable-shared"
    - "--enable-static"
    - "--without-afflib"
    - "--without-libewf"
    - "--without-libbfio"
    - "--without-libvhdi"
    - "--without-libvmdk"
    - "--without-libvslvm"
  dependencies:
    - zlib/1.3.2
  cc: clang
  upstream_test_command: "make -j1 <4 个 check_PROGRAMS> + gen_upstream_fixtures.py 生成合成镜像 + 4 程序全部真实执行 (tests/)"

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "make check(tests/:TESTS=runtests.sh test_libraries.sh + check_PROGRAMS=4 个 C++ API 测试)"
  upstream_discovered: 6
  upstream_passed: 4
  upstream_failed: 0
  upstream_skipped: 2
  upstream_note: "check_PROGRAMS 4 个测试程序全部真实执行(13 个执行单元:read_apis 6 子测试/fs_fname_apis 2/fs_attrlist_apis 3/fs_thread_test 2 组确定性 diff);TESTS 2 个脚本离线不可运行按上游设计豁免——runtests.sh 需非公开的 $HOME/from_brian 镜像(上游注释明言 not public),test_libraries.sh 运行时从 Google Drive 下载镜像且 mmls 子测试依赖 --without-* 关闭的 libvmdk/libvhdi/libewf。release tarball 不含磁盘镜像(tests/Makefile.am 预期 data/ 未随包发布),配方自带 gen_upstream_fixtures.py(纯 Python 标准库)在构建期生成 6 个满足上游断言的合成 FAT12/16/32+NTFS 镜像供执行。真机实测(round5,2026-10-15)。"
  test_package_passed: 12
  test_package_failed: 0
  test_package_assertions: 12
  execution: "真机 round5(2026-10-15,SHA ef8d4732fe):conan create rc=0(缓存已清全量重建,6 镜像生成 + check_PROGRAMS 4/4 真实执行)→ conan test rc=0(消费者 12/12)→ finish exit_code=0(integrity_hash 54ee0f1525216e5e)→ W4 审计 pass(P0=0/P1=0)"

patches_applied:
  - "0001-ohos-config-sub-triplet.patch"
  - "0002-configure-umask-022.patch"
  - "0003-remove-werror-pool-util.patch"

knowledge_gained:
  - "官方 release tarball 自带生成的 configure(config.guess 2021-08-14),无需 autoreconf/tool_requires automake"
  - "config.guess 认不出 HarmonyOS(设备 uname 返回 HarmonyOS);用 --build=aarch64-unknown-linux-ohos 显式三元组规避,0001 补丁让 config.sub 接受 *-*-linux-ohos"
  - "旧 stub 补丁(0001-0005,config.guess/config.sub 整文件替换等)针对另一份 4.12.1 快照(config.guess 2021-06-03),对官方 release tarball 有 4/5 不能应用,已全部重做"
  - "configure 生成的 mktemp 脚本段含 umask 077(两处,configure:24261/24266),HMDFS setgid 目录下临时目录不可写(E114),0002 改 umask 022"
  - "tsk/pool 与 tsk/util 两处 Makefile.am 设 -Werror(-Wall -Wextra -Werror),OHOS SDK 头文件警告会中止编译,0003 移除(旧 stub 只处理了 tsk/pool,漏了 tsk/util)"
  - "上游全部外部依赖均为可选(TSK_OPT_DEP_CHECK);zlib 经 Conan/ AutotoolsDeps 注入启用,afflib/libewf/libbfio/libvhdi/libvmdk/libvslvm 用 --without-* 显式关闭保证确定性"
  - "make check 的 TESTS 按上游设计不可离线运行(runtests.sh 需非公开 from_brian 镜像,test_libraries.sh 需 Google Drive 下载);check_PROGRAMS 需外部镜像根目录参数,release tarball 不含任何磁盘镜像——配方自带纯标准库生成器 gen_upstream_fixtures.py 按各测试断言构造 6 个合成 FAT12/16/32+NTFS 镜像(fat12.dd/fat-img-kw.dd/fat32.dd/fe_test_1.img/ntfs-comp-1.img/ntfs-img-kw-1.dd),使 4 个测试程序可离线真实执行"
  - "openssl 支持在 configure.ac 中整段注释掉(307-310 行),非可用选项"
