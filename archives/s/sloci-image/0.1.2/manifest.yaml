# 版本级 manifest 模板
# 文件位置: archives/s/sloci-image/0.1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.2"

# 软件名
software: "sloci-image"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jirutka/sloci-image/archive/refs/tags/v0.1.2.tar.gz"

  # 源码校验和
  sha256: "4c5baee9a4915ca88e3a54befa1ccb8616be20208070cf54ac366c195647da79"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "sloci-image 是纯 POSIX shell 脚本，无需编译，package() 使用 copy() 安装到 bin 目录"
  - "conanfile.py 中 build() 仅调用 apply_conandata_patches，package() 使用 copy() + chmod 755"
