sources:
  url: "https://www.jedsoft.org/releases/slrn/slrn-1.0.3a.tar.bz2"
  sha256: "3ba8a4d549201640f2b82d53fb1bec1250f908052a7983f0061c983c634c2dac"

patches:
  - patch_file: "patches/0001-autoconf-config.sub.patch"
    patch_description: "Teach the bundled 2014 config.sub the linux-ohos OS token (both canonicalization paths)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-Makefile.in.patch"
    patch_description: "Skip running the build-time chkslang helper when cross compiling (SKIP_CHKSLANG=1); native builds still run it"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "config.status tmp dir created with umask 022 instead of 077 (HMDFS ownership mapping makes 0700 dirs unwritable, knowledge E011)"
    patch_type: "portability"
