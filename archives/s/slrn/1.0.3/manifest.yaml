# slrn 1.0.3 版本级 manifest
version: "1.0.3"
software: "slrn"
status: built
build_date: "2026-10-01"
build_system: autotools

source:
  url: "https://www.jedsoft.org/releases/slrn/slrn-1.0.3a.tar.bz2"
  sha256: "3ba8a4d549201640f2b82d53fb1bec1250f908052a7983f0061c983c634c2dac"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--with-slang=<conan slang package folder>"
    - "--with-ssl=<conan openssl package folder>"
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "slrn_cv_va_copy=yes"
    - "slrn_cv___va_copy=yes"
    - "slrn_cv_va_val_copy=no"
  dependencies:
    - slang/2.3.3
    - openssl/3.0.16
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-autoconf-config.sub.patch"
  - "0003-src-Makefile.in.patch"
  - "0002-configure.patch"

knowledge_gained:
  - "slrn src/Makefile.in 构建期运行目标端 chkslang 校验 slang 版本，交叉编译需 SKIP_CHKSLANG=1 守卫（OHOS CI 原生构建仍执行）（ref: DRAFT-slrn-1.0.3-build-time-target-tool-run-guard）"
  - "configure 三个 AC_TRY_RUN（slrn_cv_va_copy/slrn_cv___va_copy/slrn_cv_va_val_copy）交叉编译必须预置（ref: E543）"
  - "config.status 临时目录 umask 077 在 HMDFS 不可写（ref: E011），改 022"
  - "conan --prefix=/ 固化 //share/slrn/slang 导致 S-Lang 脚本库运行时找不到，用上游官方 SLRN_SLANG_DIR 经 runenv_info.define 覆盖（ref: DRAFT-slrn-1.0.3-runenv-override-prefix-root-resource-dir，E317 同族）"

