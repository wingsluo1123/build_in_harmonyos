knowledge_gained:
  - "2009-11-20 版 config.guess 没有 *:HarmonyOS:*:* 分支，worker 上 uname -s 返回 HarmonyOS 时直接 'unable to guess system type' 退出（E007）；补该分支后输出 aarch64-unknown-linux-ohos。旧版脚本用 echo+exit 而不是新版的 GUESS= 变量，照搬 scripts/patch-autotools-ohos.pl 的块会静默失效"  # knowledge_ref: E007/E205 已覆盖（2009 版形态差异记入 notes.md 路径 B 评估）
  - "同版 config.sub 有两处会拒绝 linux-ohos：①maybe_os 的 KERNEL-OS 列表缺 linux-ohos*，导致 aarch64-linux-ohos 被当成 machine aarch64-linux（旧脚本还不认识裸 aarch64，必须带 vendor 位）；②即使补了①，OS 分支末尾的 -linux*) 兜底会用 sed 把 -linux-ohos 改写成 -linux-gnu-ohos，所以基本系统类型列表也要加 -linux-ohos*。E122 的 sed 模板针对新版 linux-uclibc*- ) 形态，对 2009 版的续行形态不匹配，需按实际文本改"  # knowledge_ref: E072/E122/E268 已覆盖（2009 版形态差异记入 notes.md 路径 B 评估）
  - "上游 test/Makefile.am 硬编码 -I../src/ -I../test，out-of-source（VPATH）构建下 test 程序找不到 elib.h；必须 self.folders.build = '.' 在源码树内构建（同 redis/recode/runit 惯例）"  # knowledge_ref: 无需独立条目（包内构建系统特性，已固化在 conanfile.layout）
  - "src/Makefile.am 的 libsgm_a_LIBADD = libseq.a 让 libseq.a 成为 libsgm.a 的归档成员：OHOS lld 只告警 'archive member is neither ET_REL nor LLVM bitcode' 并正常链接，Apple ld64 直接报错。故该库只能在 OHOS/Linux 工具链下构建，macOS 原生便捷构建需先 ar d libsgm.a libseq.a"  # knowledge_ref: 候选（链接器对嵌套归档的容忍度差异）；本次未新开条目，评估见 notes.md 路径 B 小节
  - "AM_PATH_PYTHON([2.6]) 只探测 python/python2*，机器上只有 python3 时它把 PYTHON 设为 ':'、WITH_TESTDRIVER 为假、TESTS 变空 —— make check 会 0 用例通过（与 box2d ctest 空套件假通过同型）。配方显式传 PYTHON=<sys.executable>，并在 build() 里断言 PASS 行数 == 6，杜绝空跑"  # knowledge_ref: 候选，建议 merge-into DRAFT-box2d-2.4.1-ctest-empty-suite-false-pass（同类：测试入口静默空转）
  - "上游 6 个 make check 驱动与 testdata.py/formats.py 是 Python 2 代码（print 语句、cmp()、缺 __ne__、gzip 文本模式），worker 无 python2；机械移植到 py3 后本机原生实测 make check 6/6 PASS。Debian 对同一上游版本携带等价 2to3.patch，可作旁证"  # knowledge_ref: 无需独立条目（语言代差移植，非平台问题）
  - "zlib 在本生态是纯静态包（libz.a + pkgconfig，无 .so），musl 的 libm.a/libpthread.a 是空壳档案，因此上游 -lm -lpthread -lz 链接行产出的 DT_NEEDED 实测恰为 [libc.so]，天然满足 R26，无需额外静态开关"  # knowledge_ref: 无需独立条目（已固化为 test_package 的 A3 断言）
  - "smalt 用 rand()/srand48()（randef.h 的 RANSEED，sort.c 的随机化快排枢轴）做并列最优选择，未给 -r 时以 time(0) 播种；musl 与 glibc 实现不同，故设备端测试固定 -r 42 并断言 3 次运行逐字节一致（H5）"  # knowledge_ref: 无需独立条目（已固化为 test_package 的 H5 断言）

