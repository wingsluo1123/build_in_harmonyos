software: smartlist
display: "SmartList"
description: "SmartList mailing-list manager on top of procmail"
category: utility
homepage: "https://github.com/procmail-org/SmartList"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Standalone helpers (hsort/gethome) built with clang; script suite shipped verbatim"
    - "Full flist/multigram binary needs procmail source blending and is out of scope"
    - "K&R sources compiled with -std=gnu17"
  common_dependencies: []

versions:
  "3.15":
    status: built
    build_date: "2026-10-18"
    note: "First OHOS adaptation; single-version recipe"
