sources:
  # The 0.3.8 release is no longer served from the origin site
  # (www.iki.fi/patrik/sn/); the pristine upstream tarball in the Debian
  # pool is the authoritative https mirror, used per R39 (same precedent
  # as jpegpixi 1.1.1).
  url: "https://deb.debian.org/debian/pool/main/s/sn/sn_0.3.8.orig.tar.gz"
  sha256: "e415a019c556ffbf148d052ee84cdb990a6385cb272f438013d448d90914d8e1"

patches:
  - patch_file: "patches/0001-portability-caddr_t-to-void.patch"
    patch_description: "caddr_t 为 glibc 遗留类型（musl/OHOS libc 不提供，2004 年代码 6 文件 9 处 munmap 强转引用）；统一替换为语义等价的 void *（caddr_t 本就是 void* 别名），不改任何运行时行为"
    patch_type: "portability"
