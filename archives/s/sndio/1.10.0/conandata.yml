sources:
  "1.10.0":
    url: "https://sndio.org/sndio-1.10.0.tar.gz"
    sha256: "bebd3bfd01c50c9376cf3e7814b9379bed9e17d0393b5113b7eb7a3d0d038c54"

patches:
  "1.10.0":
    - patch_file: "patches/0001-bsd-compat-bsd-compat.h.patch"
      patch_description: "OHOS/musl already defines SOCK_CLOEXEC; guard the fallback with #ifndef"
      patch_type: "portability"
    - patch_file: "patches/0002-bsd-compat-getpeereid.c.patch"
      patch_description: "musl headers expose an incomplete struct ucred on OHOS; use a local sndio_ucred definition"
      patch_type: "portability"
    - patch_file: "patches/0003-configure.patch"
      patch_description: "add HarmonyOS) platform case (alsa off, -lm, so_link + -Wl,-soname) to configure"
      patch_type: "portability"
