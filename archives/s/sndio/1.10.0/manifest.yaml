test_results:
  upstream: "none - the 1.10.0 tarball ships no regress/ directory, so there is no
    upstream test suite to run"
  test_package: "HarmonyOS consumer test (test_package/), executed by conan create
    after the package is built. Real assertions, all [ok] in the recorded run:
    the CMake consumer builds and links libsndio and resolves all 24 public entry
    points; sio_initpar() leaves every parameter at the ~0u sentinel; sio_open()/
    sioctl_open()/mio_open() return NULL for an absent device; installed layout
    (include/sndio.h, lib/pkgconfig/sndio.pc, bin/{aucat,sndiod,sndioctl,midicat},
    lib/libsndio.so{,.7,.7.3}); the consumer's DT_NEEDED is the bare soname
    libsndio.so.7 with no build path (parsed from the ELF dynamic section in pure
    Python, no readelf dependency); libsndio.so.7.3 carries DT_SONAME=libsndio.so.7;
    sndio.pc is relocatable (prefix=${pcfiledir}) and links -lsndio; `aucat -n`
    runs a real off-line playback->record pipeline (16000 B raw s16 in, 16000 B
    out, non-silent); each installed tool executes and prints its usage string.
    Not covered anywhere: anything that needs a live sndiod (sio_open on a real
    device, the sndiod daemon itself) - there is no audio hardware in the sandbox
    and sndiod's -f only accepts existing sndio devices, so those paths are
    asserted as clean NULL returns instead of being reported as passes."
