# test_package/MANIFEST.yml — sng 1.1.1
package: sng/1.1.1
homepage: "https://gitlab.com/esr/sng"

# 上游测试入口核验（R51 清点）：
# - Makefile 的 `check` 目标 = shellcheck sng_regress + `./sng_regress test.sng pngsuite/[a-wyz]*.png`
# - 上游测试体只有 1 个脚本 sng_regress（对每个参数做 反编译/重编译/规范化 的往返比对，
#   失败时才打印一行，"无输出即通过"）；无 tests/ 目录，无 ctest/pytest 注册
# - pngsuite（Willem van Schaik PNG 测试集）不在上游发布包内，无法随源码获取；
#   配方 build() 改用发布包自带的 test.sng 与 snglogo.png 跑 sng_regress
# - 构建机能执行目标二进制时在 build() 实跑（输出必须为空），否则如实 skip（不写成通过）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "bash ./sng_regress test.sng snglogo.png"

upstream_tests:
  - file: sng_regress
    description: "test.sng 与 snglogo.png 的 sng<->png 往返比对（decompile/recompile/canonicalize，diff -u 比对）"

# test_package 中自带的测试：完整消费者流程（鸿蒙特有测试 1 条）
test_package_tests:
  - file: conanfile.py + check_png.c + sample.sng
    description: >-
      被测包 sng 参与构建 → 编译链接消费者程序 check_png.c（libpng）→ 运行：
      sng 把 sample.sng 编译成 PNG（调色板含 X11 颜色名 red/dark slate gray/gold，
      经包内 share/X11/rgb.txt 解析）→ check_png 用 libpng 解码并校验尺寸/位深/调色板 RGB/
      像素索引/tEXt → sng 反编译回文本并校验 → 再编译，往返后 check_png 再校验 →
      垃圾输入被拒绝（退出码非 0）
    runtime_smoke:
      - cmd: sng < sample.sng > out1.png
        expected: 退出码 0，输出以 PNG 魔数开头
      - cmd: check_png out1.png
        expected: 退出码 0（4x2、8 位调色板、4 个调色板项与 rgb.txt 一致、像素与 tEXt 一致）
      - cmd: sng < out1.png > back.sng
        expected: 文本含 (255,0,0)/(47,79,79)/(255,215,0)/(0,0,255)、width:4;height:2;、Title 文本块
      - cmd: sng < back.sng > out2.png && check_png out2.png
        expected: 往返后消费者校验仍通过
      - cmd: sng < junk.bin
        expected: 退出码非 0

assertion_count: 9
