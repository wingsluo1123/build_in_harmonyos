knowledge_gained:
  - "The GitHub refs/tags archive of sniffit 0.7 is a git snapshot: it carries configure.ac/Makefile.am/autogen.sh but no generated configure/Makefile.in; the recipe does NOT bootstrap it on-device (no automake/autoconf/libtool tool_requires) and instead direct-compiles the 7 TUs from src/Makefile.am SOURCES with a generated config.h, so the conancenter m4/1.4.19 build edge (configure[139] HNP-bash Error 127) is removed (aldo/0.7.8 vendoring precedent)."
  - "configure.ac hard-requires libpcap (AC_CHECK_LIB fatal) and optionally uses ncurses; the recipe requires libpcap/1.10.6 pinned to ohpcd rrev e4d43bf9 (conancenter-first shadowing would pull the CCI autotools recipe and its bison/flex->m4 chain) plus ncurses/6.6 (absent from CCI) so the interactive mode (INCLUDE_INTERFACE) builds deterministically via AutotoolsDeps."
  - "Upstream ships no automated tests: no tests/ or test/ directory, neither Makefile.am defines TESTS/check_PROGRAMS, and make check has no target; the adaptation validates the packaged binary through the consumer test_package instead."
