# 版本级 manifest — snort 3.12.2.0
# 文件位置: archives/s/snort/3.12.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "3.12.2.0"
software: "snort"
status: built
build_date: "2026-10-03"
build_system: cmake

source:
  url:
    - "https://gh-proxy.com/https://github.com/snort3/snort3/archive/refs/tags/3.12.2.0.tar.gz"
    - "https://ghproxy.net/https://github.com/snort3/snort3/archive/refs/tags/3.12.2.0.tar.gz"
    - "https://github.com/snort3/snort3/archive/refs/tags/3.12.2.0.tar.gz"
  sha256: "43000d6b0e0307bc1a735874d00deb61e8b6a96d074f8cc9b2fe2cde0058720b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_UNIT_TESTS=ON"
    - "-DMAKE_DOC=OFF -DMAKE_HTML_DOC=OFF -DMAKE_PDF_DOC=OFF -DMAKE_TEXT_DOC=OFF"
    - "-DCMAKE_PREFIX_PATH=<全部依赖包目录>"
    - "-DPCAP_/LUAJIT_/PCRE2_/DNET_/DAQ_/FLEX_ 各 *_HINT=<对应依赖实际目录>（Find* 定位；hwloc 经 PKG_CONFIG_PATH 发现）"
    - "-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib;<全部依赖 lib 绝对目录>（CMAKE_BUILD_RPATH 同值）"
  dependencies:
    - libpcap/1.10.6
    - pcre2/10.45
    - hwloc/2.14.0
    - libdnet/1.12
    - openssl/3.5.6.1
    - zlib/1.3.1.1
    - luajit-openresty/2.1-20260311.1
    - cpputest/4.0_r2
    - liblzma/5.8.1
    - flex/2.6.4.2
    - pkgconf/3.0.5
    - automake/1.18
    - libtool/2.5.4.1
    - "libdaq/3.0.27（无发行 tarball，作为第二源码内置、配方内自举构建）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-optional-libs-ohos.patch"
  - "0002-ohos-tmpfile-fallback.patch"
  - "0003-ohos-rpath.patch"
  - "0004-ohos-test-clock-tick-wait.patch"

patch_classification:
  - file: 0001-cmake-optional-libs-ohos.patch
    type: portability
    platform_only: False
    guard: 'RPC 分支 = HarmonyOS|OHOS 平台守卫；lzma 门控 / EXTERNAL_INCLUDES 传播 / sh 包装 = 跨平台 hunk（他平台行为等价：EXTERNAL_INCLUDES 传播表现为 lzma 头目录显式注入，与 Find 结果等价，真机构建/测试全绿）'
  - file: 0002-ohos-tmpfile-fallback.patch
    type: portability
    platform_only: True
    guard: 'OHOS /tmp read-only（回退代码跨平台编译，触发仅 OHOS，他平台行为等价）'
  - file: 0003-ohos-rpath.patch
    type: portability
    platform_only: True
    guard: 'HarmonyOS / OHOS rpath'
  - file: 0004-ohos-test-clock-tick-wait.patch
    type: portability
    platform_only: False
    guard: 'HarmonyOS coarse SnortClock（测试助手有界等待；跨平台编译，非测试构建不受影响）'

knowledge_gained:
  - "Conan 工具链设置 CMAKE_FIND_PACKAGE_PREFER_CONFIG 使上游 pkg-config 形态的 FindCppUTest.cmake 永不执行（CPPUTEST_INCLUDE_DIR/LIBRARIES 未定义，测试程序编译链接失败）——直接锚定这两个变量"
  - "OHOS /tmp 只读且 libc tmpfile() 硬编码 /tmp（TMPDIR 无效，探针：返回 NULL/errno EACCES）——perf_monitor 的 csv/json/text 三个格式化测试以 mkstemp($TMPDIR) 回退（创建即 unlink，语义等价；text 测试的裸 tmpfile() 未兜底时直接把 NULL 交给 FILE* 写入，内嵌 Catch2 套件 SIGSEGV）"
  - "HarmonyOS PC 的 C++ 高频钟（SnortClock=high_resolution_clock）粒度粗：背靠背读取约 70% 返回相同值（真机 50 万次探针零增量 334845–370666 次）——上游 rule_profiler.cc 与 time_profiler.cc 各自的 avoid_optimization() 空循环又会被优化消除，Catch2 用例 'rule profiler time context'（elapsed > 0）与 'time context exclude'（elapsed < hr_duration::max()，elapsed 0 时哨兵值不减）成竞态；以有界跨 tick 等待修复两处（patch 0004，测试助手内，生产代码不受影响）"
  - "HarmonyOS libc 无 RPC program number database，service_rpc.cc 的 getrpcent() 枚举上游无源码保护——add_definitions(-DSNORT_NO_RPC_DB) 编译排除，保留静态端口模式（知识草稿 DRAFT-snort-3.12.2.0-ohos-no-rpc-program-db-configure-gate-static-fallback，真机探针：<rpc/netdb.h> 缺失 / check_function_exists(getrpcent) 恒假 / 无 /etc/rpc 数据文件；libtirpc/1.3.7 制品仓可得，本适配不引入）"
  - "HMDFS 拒绝 execve 脚本文件（有可执行位亦 EACCES）——lua_wrap.sh/ffi_wrap.sh/plug_gen.sh 共 5 处调用点经 sh 启动；libdaq configure/install_sh/MKDIR_P 同法"
  - "HMDFS 拒绝 mkfifo——make 用 --jobserver-style=pipe 跑并发"
  - "libdaq 3.0.27 无发行 tarball 且不在 Conan 源——第二源码内置 + 手写自举链（libtoolize→aclocal→autoheader→automake→autoconf；autoconf/autoheader 用宿主原生二进制，automake/libtool 经 perl 启动）"
  - "libdaq --disable-shared（HMDFS 无符号链接）后上游不安装 libdaq_static_*.pc，而 snort FindDAQ 靠 pkg-config --list-all 发现静态模块——install 后补装全部 modules/*/libdaq_static_*.pc"
  - "E114: libdaq configure 的 ac_tmp 指向预建可写目录并去除清理 trap（HMDFS 拒写新建目录）"
  - "新版 FindLibLZMA 恒定义 LIBLZMA_LIBRARIES（未找到时为 -NOTFOUND），上游 if (DEFINED ...) 判定使 check_library_exists 硬失败——改以 LIBLZMA_FOUND 为门"
  - "设备 CMake 4.1.2 把宿主系统自检为 HarmonyOS（uname），而平台模块只随 OHOS 提供（Platform/OHOS.cmake = include(Platform/Linux)）——HarmonyOS 名下 CMAKE_SHARED_LIBRARY_RUNTIME_*_FLAG 等全部为空（Generic 默认空串），CMake 静默丢弃一切 -rpath/-rpath-link 标志；配方经 tc.variables 固定 CMAKE_SYSTEM_NAME=OHOS 后平台标志齐全（微型工程 RUNPATH 探针实证）"
  - "上游 cmake/platforms.cmake 无条件 set(CMAKE_SKIP_RPATH ON)：仅修平台标志不足，须同时为其加 HarmonyOS/OHOS 守卫（patch 0003）——否则安装树 bin/snort 无 RUNPATH，官方空环境冒烟门禁（L2）加载 libhwloc.so.15 即失败"
  - "OHOS 每个 ELF 在链接期写入 .codesign 段，任何后链接改写都会使签名失效：cmake 安装期的 rpath 重写（Set non-toolchain portion of runtime path）即其一，装出来的 bin/snort 及全部工具 exec 返回 EPERM（Operation not permitted，rc 126；strip 同族的 DRAFT-E703 已入草稿库）——配方以 CMAKE_BUILD_WITH_INSTALL_RPATH=ON 让链接期直接携带最终 rpath，安装退化为逐字节拷贝（md5 一致），签名保持有效（真机：安装树原位与 env -i 均运行成功）"
  - "上游 install 规则引用的构件由默认 ALL 目标产出（api_def 归档、daq 模块 .so、tools 四件、api_options/snort_api 生成头）：只定向 build snort+check 时 cmake --install 逐个报缺件——构建链须含一次 ALL 目标（真机实证 ALL 在 OHOS 上整体构建成功）"
  - "OHOS PATH 双 grep 陷阱：默认 PATH 下 /system/bin/grep 是 toybox（GNU BRE 交替（反斜杠竖线）按字面量匹配，恒不命中），/data/service/hnp/bin/grep 是 GNU 3.12（支持该交替）——warmup 脚本的 PATH 经 hnp 命中 GNU、官方 verify 默认 PATH 命中 toybox，同一 test_package 判定两环境结果相反；多模式匹配改 grep -e/-e 后环境无关（官方 verify 复跑 6/6 实证）"
