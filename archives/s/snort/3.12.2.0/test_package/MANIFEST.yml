# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: snort/3.12.2.0
homepage: "https://www.snort.org"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "cmake --build . --target check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build <build_dir> --target check"

# 上游实际运行的测试程序
upstream_tests:
  - name: cpputest
    command: "ctest"
    expected: "158 个 CTest 可执行测试 (CppUTest 130 + Catch2 28, add_cpputest/add_catch_test -> add_test 注册; check 目标先构建全部测试程序, 再由 CTest 运行; 真机实测 158/158 通过)"
  - name: catch2
    command: "snort --catch-test all"
    expected: "内嵌 Catch2 套件随二进制发布 (ENABLE_UNIT_TESTS=ON), 由 test_package 消费者用例执行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: tests/run_e2e.sh
    description: "消费者端到端执行器: 版本输出 / --help / -T 配置校验(内联规则) / 合成 pcap 正例检测 / 非匹配规则反例对照 / 内嵌 Catch2 套件; 逐用例 TEST PASS|FAIL + TEST SUMMARY, 任一失败 exit 1"
    command: "bash tests/run_e2e.sh <snort> <tests_dir>"

# 测试数量 (assertion_count 口径 = CTest 注册用例数; 158: CppUTest + Catch2 可执行测试;
# 内嵌 Catch2 套件另由消费者用例覆盖)
assertion_count: 158
