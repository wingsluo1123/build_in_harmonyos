# Sofia-SIP v1.13.18 upstream source pinned for reproducible Conan builds.
sources:
  url: "https://github.com/freeswitch/sofia-sip/archive/refs/tags/v1.13.18.tar.gz"
  sha256: "d2ad4e64753a7c9843b766b8de8081d9c1d7acfaeb53c12b3aed7fdb9235766c"

patches:
  - patch_file: "patches/0001-libsofia-sip-ua-iptsec-test_auth_digest.c.patch"
    patch_description: "Use TMPDIR for the authentication test's temporary password database"
    patch_type: "portability"
  - patch_file: "patches/0002-libsofia-sip-ua-nta-Makefile.am.patch"
    patch_description: "Link NTA test targets against the combined static library and use Automake's single shell runner"
    patch_type: "portability"
  - patch_file: "patches/0003-libsofia-sip-ua-nua-check_register.c.patch"
    patch_description: "Bound the NUA REGISTER Check case on HarmonyOS while retaining it by default"
    patch_type: "test-adaptation"
  - patch_file: "patches/0004-libsofia-sip-ua-nua-check_session.c.patch"
    patch_description: "Bound the NUA TCP INVITE Check case on HarmonyOS while retaining it by default"
    patch_type: "test-adaptation"
  - patch_file: "patches/0005-libsofia-sip-ua-nua-nua_client.c.patch"
    patch_description: "Restore outgoing Contact generation and preserve RFC 5057 full-dialog termination"
    patch_type: "bugfix"
  - patch_file: "patches/0006-libsofia-sip-ua-nua-nua_notifier.c.patch"
    patch_description: "Restore NUA client NOTIFY and REFER flows, and retain pending SUBSCRIBE until its final response"
    patch_type: "bugfix"
  - patch_file: "patches/0007-libsofia-sip-ua-nua-nua_session.c.patch"
    patch_description: "Correct NUA answer state when duplicate SDP is rejected or an explicit ACK answer is sent"
    patch_type: "bugfix"
  - patch_file: "patches/0008-libsofia-sip-ua-sresolv-sres.c.patch"
    patch_description: "Preserve DNS server failure status when partial CNAME records are returned"
    patch_type: "bugfix"
  - patch_file: "patches/0009-libsofia-sip-ua-sresolv-test_sresolv.c.patch"
    patch_description: "Match HarmonyOS resolver tests to BIND SERVFAIL and platform resolver semantics"
    patch_type: "test-adaptation"
  - patch_file: "patches/0010-libsofia-sip-ua-su-torture_su_root.c.patch"
    patch_description: "Allow the root stress test to use measured HarmonyOS fd_set and poll limits"
    patch_type: "portability"
  - patch_file: "patches/0011-libsofia-sip-ua-glib-su-glib-su_source.c.patch"
    patch_description: "Use Sofia's realtime clock domain when GLib checks su_timer deadlines"
    patch_type: "bugfix"
  - patch_file: "patches/0012-tests-check_dlopen_sofia.c.patch"
    patch_description: "Report the upstream dlopen test as skipped for static-only Conan builds"
    patch_type: "test-adaptation"
  - patch_file: "patches/0013-tests-suite_for_nua.c.patch"
    patch_description: "Allow full NUA Check integration items a bounded 300-second timeout on HarmonyOS"
    patch_type: "test-adaptation"
  - patch_file: "patches/0014-tests-test_100rel.c.patch"
    patch_description: "Skip the 100rel redirect restart test when upstream NUA redirect restart is compiled out"
    patch_type: "test-adaptation"
  - patch_file: "patches/0015-tests-test_basic_call.c.patch"
    patch_description: "Assert the RFC 5057 BYE completion flow after UPDATE receives 480"
    patch_type: "test-adaptation"
  - patch_file: "patches/0016-tests-test_call_reject.c.patch"
    patch_description: "Skip the NUA 302/305 redirect retry test when upstream restart code is disabled"
    patch_type: "test-adaptation"
  - patch_file: "patches/0017-tests-test_cancel_bye.c.patch"
    patch_description: "Wait for CANCEL completion and accept either valid CANCEL/INVITE callback order"
    patch_type: "test-adaptation"
  - patch_file: "patches/0018-tests-test_nua.c.patch"
    patch_description: "Add HarmonyOS-only direct-loopback and extended-timeout controls to the NUA runner"
    patch_type: "test-adaptation"
  - patch_file: "patches/0019-tests-test_proxy.c.patch"
    patch_description: "Avoid sharing the native test proxy port with its WebSocket listener"
    patch_type: "test-adaptation"
  - patch_file: "patches/0020-tests-test_register.c.patch"
    patch_description: "Report the measured stateful TCP reconnect limitation explicitly in aggregate NUA runs"
    patch_type: "test-adaptation"
  - patch_file: "patches/0021-libsofia-sip-ua-nta-run_test_nta.patch"
    patch_description: "Skip the NTA fixture when BIND tools are absent and filter WebSocket from native test agent transports"
    patch_type: "test-adaptation"
  - patch_file: "patches/0022-tests-test_proxy.c.patch"
    patch_description: "Generate a proxy-side 100 Trying when the HarmonyOS test endpoint omits the downstream Via chain"
    patch_type: "test-adaptation"
  - patch_file: "patches/0023-tests-test_cancel_bye.c.patch"
    patch_description: "Allow the threaded NUA cancellation regression to cancel after a fast provisional response"
    patch_type: "test-adaptation"
  - patch_file: "patches/0024-tests-extend-nua-matrix-timeout.c.patch"
    patch_description: "Extend the bounded HarmonyOS NUA suite limit after the full Check matrix exceeded 300 seconds"
    patch_type: "test-adaptation"
  - patch_file: "patches/0026-libsofia-sip-ua-nta-nta.c.patch"
    patch_description: "Route only tagged in-dialog SUBSCRIBE refresh and unsubscribe requests to their existing NTA dialog, preserving out-of-dialog event fetch"
    patch_type: "bugfix"
  - patch_file: "patches/0027-tests-test_nua-honor-no-nat-in-check-build.patch"
    patch_description: "Honor the HarmonyOS no-cross-family-NAT setting after the Check runner's final option initialization"
    patch_type: "test-adaptation"
  - patch_file: "patches/0028-tests-check_sofia-honor-no-nat.patch"
    patch_description: "Apply the same no-cross-family-NAT setting to check_sofia's proxy matrix while retaining non-NAT coverage"
    patch_type: "test-adaptation"
