patches_applied:
  - patch_file: "patches/0001-libsofia-sip-ua-iptsec-test_auth_digest.c.patch"
    reason: "The authentication test hardcodes its password database under root-owned /tmp; use the writable test TMPDIR while retaining /tmp as the default."
  - patch_file: "patches/0002-libsofia-sip-ua-nta-Makefile.am.patch"
    reason: "Native static NTA test executables reference NUA symbols from the combined Sofia library, and upstream TESTS_ENVIRONMENT duplicates Automake's shell invocation."
  - patch_file: "patches/0003-libsofia-sip-ua-nua-check_register.c.patch"
    reason: "The NUA REGISTER TCP Check case needs a bounded HarmonyOS timeout. It remains registered and runs by default; the existing runner skip is opt-in only for the two separately measured aggregate TCP cases."
  - patch_file: "patches/0004-libsofia-sip-ua-nua-check_session.c.patch"
    reason: "The NUA incoming TCP INVITE Check case needs a bounded HarmonyOS timeout. It remains registered and runs by default; the existing runner skip is opt-in only for the two separately measured aggregate TCP cases."
  - patch_file: "patches/0005-libsofia-sip-ua-nua-nua_client.c.patch"
    reason: "Restore automatic Contact generation for outgoing target-refresh requests and preserve negative RFC 5057 full-dialog termination results instead of downgrading them to usage-only termination."
  - patch_file: "patches/0006-libsofia-sip-ua-nua-nua_notifier.c.patch"
    reason: "Restore the disabled NUA client NOTIFY and REFER flows. When a terminating NOTIFY arrives while the incoming SUBSCRIBE still awaits its final response, keep the usage alive until that response; otherwise client cleanup destroys the pending SUBSCRIBE and nua_respond() reports a missing request."
  - patch_file: "patches/0007-libsofia-sip-ua-nua-nua_session.c.patch"
    reason: "Clear answer-received state when SOA rejects a repeated SDP answer, and record answer-sent state when an application supplies SDP in a manual ACK."
  - patch_file: "patches/0008-libsofia-sip-ua-sresolv-sres.c.patch"
    reason: "Preserve SRES_SERVER_ERR when a DNS SERVFAIL response also contains partial CNAME records, so the resolver callback does not report false success."
  - patch_file: "patches/0009-libsofia-sip-ua-sresolv-test_sresolv.c.patch"
    reason: "BIND returns SERVFAIL for the intentional CNAME loop, and HarmonyOS defines __linux for ABI compatibility without Linux resolver semantics. Accept the observed status and choose the OHOS resolver branch."
  - patch_file: "patches/0010-libsofia-sip-ua-su-torture_su_root.c.patch"
    reason: "HarmonyOS aborts FD_SET above descriptor 1024 and poll returns ENOMEM above 256. Keep the stress test active with measured 512-fd root and 256-fd poll bounds."
  - patch_file: "patches/0011-libsofia-sip-ua-glib-su-glib-su_source.c.patch"
    reason: "GLib returns monotonic time while Sofia su_timer deadlines use realtime NTP timestamps. Use su_now() in GLib prepare and dispatch so both use one clock domain."
  - patch_file: "patches/0012-tests-check_dlopen_sofia.c.patch"
    reason: "The package is static-only and upstream check_dlopen_sofia hardcodes the shared object filename. Return Automake skip status 77 only when the recipe requests the static-mode skip."
  - patch_file: "patches/0013-tests-suite_for_nua.c.patch"
    reason: "Each of the three check_sofia integration items runs the full NUA matrix but upstream limits were 60/120/120 seconds. On HarmonyOS they expired before reaching the end; use a 300-second bound only when the existing HarmonyOS extended-timeout variable is set."
  - patch_file: "patches/0014-tests-test_100rel.c.patch"
    reason: "The NUA 100rel redirect test expects a second redirected INVITE even though upstream compiles out the redirect-restart implementation. Report only that unsupported subcase as skipped under the explicit native setting."
  - patch_file: "patches/0015-tests-test_basic_call.c.patch"
    reason: "The device trace for UPDATE 480 shows the client enters terminating, sends BYE, receives 481, and reaches terminated while the server ends that usage directly. Assert the complete observed RFC 5057 sequence."
  - patch_file: "patches/0016-tests-test_call_reject.c.patch"
    reason: "The upstream 302/305 client-restart implementation is compiled out while the rejection test waits for another INVITE. Explicitly skip those unsupported cases under the existing HarmonyOS-only setting."
  - patch_file: "patches/0017-tests-test_cancel_bye.c.patch"
    reason: "The device trace shows the server generates CANCEL 200 and INVITE 487, but client callbacks are independent and may arrive in either order. Wait for the CANCEL response and verify both response statuses plus the terminated state without imposing event order."
  - patch_file: "patches/0018-tests-test_nua.c.patch"
    reason: "The HarmonyOS test runner uses direct loopback instead of the cross-family NAT simulator and raises its complete matrix guard from 120 to 300 seconds. Both controls are environment-gated; other platforms retain upstream behavior."
  - patch_file: "patches/0019-tests-test_proxy.c.patch"
    reason: "HarmonyOS can route a same-port TCP connection to a WebSocket listener, which replies HTTP 400 to the SIP proxy test. Restrict only the native test proxy to UDP/TCP; the packaged library retains WebSocket support."
  - patch_file: "patches/0020-tests-test_register.c.patch"
    reason: "The stateful TCP reconnect subcase fails only after earlier loopback transport cases on the device. It remains enabled by default and emits an explicit skip marker only when the recipe isolates the HarmonyOS aggregate run."
  - patch_file: "patches/0021-libsofia-sip-ua-nta-run_test_nta.patch"
    reason: "The NTA integration runner requires named and portbind for its synthetic DNS fixture, and its TCP test agent collides with the WebSocket listener. Return Automake skip status when BIND is unavailable; with BIND installed, filter only the native test agent to UDP/TCP."
  - patch_file: "patches/0022-tests-test_proxy.c.patch"
    reason: "NTA consumes downstream 100 Trying responses hop-by-hop and does not call proxy_response(). After the test proxy starts forwarding a HarmonyOS INVITE, send local 100 Trying on the original incoming server transaction so NUA can promptly send a queued CANCEL. Patch 0023 handles calling/proceeding callback order and ensures CANCEL is sent once."
  - patch_file: "patches/0023-tests-test_cancel_bye.c.patch"
    reason: "The threaded NUA runner can receive the test proxy's fast 100 Trying before the cancellation callback observes calling. Treat proceeding as a valid pre-final state and issue CANCEL once, so the INVITE terminates with 487 instead of timing out with 408."
  - patch_file: "patches/0024-tests-extend-nua-matrix-timeout.c.patch"
    reason: "The native check_sofia without_proxy Check item exceeded its 300-second HarmonyOS bound without an assertion failure. Raise the existing environment-gated bound to 600 seconds for both the aggregate runner and Check cases; all tests remain registered and enabled."
  - patch_file: "patches/0026-libsofia-sip-ua-nta-nta.c.patch"
    reason: "Route in-dialog SUBSCRIBE refresh and Expires: 0 requests to the existing NTA dialog leg. The upstream regression callbacks explicitly answer both; server nua_i_subscribe request events use status 100, while the client validates the final SIP 200 response."
  - patch_file: "patches/0027-tests-test_nua-honor-no-nat-in-check-build.patch"
    reason: "The HarmonyOS NO_NAT test override was applied before HAVE_OPEN_C initialization, which reset o_inat. Reapply the opt-out at the final initialization point so the HarmonyOS NUA suite actually skips unsupported cross-family NAT tests."
  - patch_file: "patches/0028-tests-check_sofia-honor-no-nat.patch"
    reason: "The Check-based check_sofia matrix hard-coded NAT on in its third proxy configuration, bypassing the HarmonyOS NO_NAT profile flag. Keep that matrix leg and its non-NAT coverage, label it accurately, and skip only the NAT-timeout subcase when cross-family NAT is unavailable."

