knowledge_gained:
  - "E550-draft-CA07: HarmonyOS NUA tests need a local 100 Trying after the test proxy accepts INVITE forwarding; the cancellation callback must handle calling and proceeding states. (ref: knowledge/drafts/E550-draft-CA07.kv)"
  - "E551-draft-8F61: Route in-dialog SUBSCRIBE refresh/unsubscribe through the existing NTA leg, answer requests in the application callback, and distinguish NUA request-event status 100 from the client's final SIP 200. (ref: knowledge/drafts/E551-draft-8F61.kv)"
  - "E2296-draft-7880: If a terminated NOTIFY completes while its initial SUBSCRIBE is still pending, clear the NOTIFY's terminating flag and retain the SUBSCRIBE request until its final response; otherwise NUA usage cleanup destroys it and a later nua_respond() returns 500. (ref: knowledge/drafts/E2296-draft-7880.kv)"
