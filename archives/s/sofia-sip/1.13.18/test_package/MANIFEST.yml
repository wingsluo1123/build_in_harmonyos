test_package_tests:
  - file: test_sofia_consumer.c
    description: "消费者测试：初始化 GLib-backed su_root，创建 NUA agent 与 handle，并验证清理路径"
    command: "./test_sofia_consumer"
  - file: test_sofia_harmonyos.c
    description: "HarmonyOS 原生集成测试：GLib 主循环驱动 Sofia NUA，通过 loopback UDP 完成 OPTIONS/200 SIP 事务"
    command: "./test_sofia_harmonyos"
harmonyos_tests:
  - file: test_sofia_harmonyos.c
    operation: "发送一条 SIP OPTIONS 到本机 UDP responder，并回传包含 Via/From/To/Call-ID/CSeq 的 200 响应"
    runtime: "HarmonyOS PC 6.0 AArch64，su_glib_root_gsource 附着到 GMainLoop"
    success_marker: "SOFIA_SIP_HARMONYOS_OPTIONS_OK"
upstream_aggregate_exclusions:
  - name: "registrar_1_4_1"
    reason: "HarmonyOS AArch64 loopback TCP state makes this NUA test time out after prior transport cases; the case remains enabled by default and is excluded only when the Conan recipe sets SOFIA_OHOS_SKIP_STATEFUL_NUA_TCP=1."
  - name: "call_2_1_3_2"
    reason: "Same sequence-dependent HarmonyOS loopback TCP timeout; the case remains enabled by default and is excluded only when the Conan recipe sets SOFIA_OHOS_SKIP_STATEFUL_NUA_TCP=1."
assertion_count: 6
