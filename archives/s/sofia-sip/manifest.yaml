# Software-level manifest — Sofia-SIP
software: sofia-sip
display: "Sofia-SIP"
description: "RFC 3261 compliant SIP User-Agent library with a GLib event-loop adapter"
category: library
homepage: "https://github.com/freeswitch/sofia-sip"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Build the SIP UA core and optional GLib event-loop adapter from the same native package graph."
    - "Keep upstream sofia-sip-ua and sofia-sip-ua-glib pkg-config modules available to consumers."
    - "Exercise su_root and su_timer dispatch through GLib and a real loopback SIP transaction."
  common_dependencies:
    - "glib"
    - "openssl"
    - "zlib"
  test_requires:
    - "check/0.15.2"

versions:
  "1.13.18":
    status: built
    build_date: "2026-10-18"
    conan_ref: "sofia-sip/1.13.18"
