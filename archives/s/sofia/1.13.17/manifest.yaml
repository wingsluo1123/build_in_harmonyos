software: sofia
version: "1.13.17"
build_system: autotools
status: built
build_date: "2026-10-02"

source:
  url: "https://github.com/freeswitch/sofia-sip/archive/refs/tags/v1.13.17.tar.gz"
  sha256: "daca3d961b6aa2974ad5d3be69ed011726c3e4d511b2a0d4cb6d878821a2de7a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build/--host=aarch64-unknown-linux-ohos --disable-stun --disable-nth --disable-ntlm"
  cc: clang

patches_applied: []

knowledge_gained:
  - "sofia-sip 1.13.17 tag 归档无预生成 configure，需 autogen（aclocal/libtoolize/autoheader/autoconf/automake，tool_requires automake+libtool，libneurosim 同型）"
  - "OHOS 沙箱 umask 077 + ./confXXXXXX 相对路径临时目录不可写：recipe 级 os.umask(022) + config.status 临时目录改 $TMPDIR 绝对路径"
  - "make install 递归进子目录会重跑 config.status，需 -o config.status -o Makefile.in + autotools 工具变量 no-op（build 与 install 两处）"
  - "config.guess 无法识别 HarmonyOS，需显式 --build/--host=aarch64-unknown-linux-ohos"
  - "--disable-stun/nth/ntlm 禁用可选重依赖模块，保留核心 SIP UA + su 层"

package_contract:
  libraries: ["sofia-sip-ua"]
  pkg_config: ["sofia-sip-ua.pc"]
  headers: ["sofia-sip/su.h", "sofia-sip/su_log.h", "sofia-sip/sip.h"]

test_results:
  type: consumer
  total: 2
  passed: 2
  failed: 0
  note: "上游 autotools 项目无独立消费者测试套件；test_package 消费者 2 断言（su_init + su_deinit 生命周期）"
