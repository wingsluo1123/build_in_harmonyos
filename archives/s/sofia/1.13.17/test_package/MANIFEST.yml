# test_package/MANIFEST.yml — sofia 1.13.17 适配验证清单
#
# 上游测试来源声明：
#   - build_system: autotools（configure.ac，sofia-sip 1.13.17）
#   - 上游无独立消费者测试套件（本项目以 test_package 为准）
#
# test_package 消费者用例（新增）：
#   test_sofia.c — su_init + su_deinit 生命周期冒烟（SIP 协议栈 su 层）
package: sofia/1.13.17
homepage: https://github.com/freeswitch/sofia-sip

upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - name: su-init-deinit
    command: "./test_sofia"
    assertions:
      - "su_init 初始化成功（返回 0）"
      - "su_deinit 生命周期完整"
