    type: portability
    description: >-
      _scb_init_cmdbuf 中 void* → uint8_t* 显式转换：上游 C 隐式
      转换在 C++ 编译 sokol_cmdbuf.h 实现段时为硬错误（上游自身
      compile 套件 sokol_cmdbuf.cc 契约路径），一行 cast 修复。

knowledge_gained:
  - "utest.h（sheredom）在 OHOS musl 下不可直接编译：Linux 分支用 syscall(SYS_clock_gettime,…) 而 OHOS musl 的 sys/syscall.h 无 SYS_* 宏；且 __GLIBC__ 探测分支不命中导致 time.h 未包含 → 解法纯编译 flag：-DUTEST_USE_CLOCKGETTIME -include time.h，零补丁"
  - "sokol 单头库集 header-only 打包：8 core 头平铺 include/、util 头进 include/util/，cpp_info.includedirs 双根（['include','include/util']）对齐上游 -I<root> -I<root>/util 消费契约"
  - "sokol_app.h 实现段 Linux 路径硬性要求 X11+真实 3D 后端（无 dummy 支持）——OHOS 无 X11，app/glue 的 app 相关 TU 排除出编译套件；glue.h 本身可 dummy 编译"
  - "sokol_gfx/audio 支持 SOKOL_DUMMY_BACKEND（上游为 CLI 测试设计），是 headless 环境验证逻辑层的官方通道"

test_results:
