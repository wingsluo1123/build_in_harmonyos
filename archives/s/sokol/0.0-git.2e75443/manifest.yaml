  upstream_functional: "294/294 passed (dummy backend, OHOS aarch64 clang15)"
  upstream_compile: "15 C + 14 C++ TUs compile clean (dummy backend)"
  test_package: "C 54/54 checks + C++ cmdbuf impl OK"
