# 版本级 manifest — somagic 1.1
# 遵循 ARCHIVE-SPEC v3.0
# 文件位置: archives/s/somagic/1.1/manifest.yaml

version: "1.1"
software: "somagic"
status: built
build_date: "2026-10-15"
conan_ref: "somagic/1.1"
build_system: "makefile"

source:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/easycap-somagic-linux/somagic-easycap_1.1.tar.gz"
  sha256: "3a9dd78a47335a6d041cd5465d28124612dad97939c56d7c10e000484d78a320"
  tar_format: tar.gz
  source_identity: "easycap-somagic-linux 1.1 release archive preserved by the Google Code Archive"

build:
  system: makefile
  configure_options:
    - 'make -j1 CC="<conan c compiler>" CFLAGS="-s -W -Wall -I<dep includes>" LFLAGS="-L<dep libs> -lusb-1.0 -lgcrypt -Wl,-rpath,<dep libs>" all beta'
    - "无 configure / CMake / meson；上游为纯 Makefile（隐式 .c: 后缀规则）"
  dependencies:
    - libusb/1.0.27
    - libgcrypt/1.11.0
  cc: clang
  cxx: clang++

patches_applied:
    - "0001-guard-libusb-init-failure.patch"

knowledge_gained:
  - "纯 Makefile 项目可用 make 命令行变量覆盖 CC/CFLAGS/LFLAGS，无需补丁即可注入 Conan 工具链（R33）。"
  - "源码 #include <libusb-1.0/libusb.h>，而 libusb 的 Conan 包 includedir 是 include/libusb-1.0，因此必须额外把其父目录 include/ 加入 -I 搜索路径。"
  - "execinfo.h 仅在上游 DEBUG 宏下引用（默认未定义），因此无需 libexecinfo 依赖。"
  - "上游 install 目标写死 /usr/local 且只装两个 PROGRAMS；配方改在 package() 内拷贝全部四个可执行文件（含 beta 目标）加手册页。"
  - "OHOS 拒绝执行未签名 ELF，package() 对四个可执行文件做 binary-sign-tool 自签。"
  - "上游无任何自动化测试套件（Makefile 无 check/test 目标，tarball 无 tests/），按 no_tests 申报，由 test_package 真实执行四个 CLI 补位。"
  - "上游四个程序的 libusb_init() 返回值被忽略，鸿蒙内核 netlink 不可用时初始化失败后代码解引用未初始化句柄：somagic-init --skip-check 必 SIGSEGV(139)。补丁把四个调用点改为失败即打印诊断并 exit 1。"

upstream_tests:
  exists: false
  test_count: 0
  count_method: none
  # 上游完全没有测试框架，不存在可用统计单位（非子集口径）。
  command: ""
  notes: "tarball 仅含 Makefile / README / 四个单文件 C 程序 / man 手册 / debian 打包目录。"

test_package:
  assertion_count: 16
  description: "消费者测试真实执行打包后的四个 CLI（含 libgcrypt 固件 CRC 校验与 libusb-1.0 设备枚举路径）。"
