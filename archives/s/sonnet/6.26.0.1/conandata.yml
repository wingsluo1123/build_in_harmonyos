# conandata.yml — sonnet 6.26.0
# 6.26.0.1 is an adaptation revision of the same upstream 6.26.0 tarball
# (DT_SONAME fix only, no upstream source change).
#
# download.kde.org redirects to a geo-selected mirror (mirrors.bfsu.edu.cn)
# that is unreachable from this environment, so list the reachable KDE
# mirrors first and keep the official URL as the last fallback. All URLs
# serve the identical tarball; sha256 verified against nju/aliyun/dotsrc.

sources:
  urls:
    - "https://mirrors.nju.edu.cn/kde/stable/frameworks/6.26/sonnet-6.26.0.tar.xz"
    - "https://mirrors.aliyun.com/kde/stable/frameworks/6.26/sonnet-6.26.0.tar.xz"
    - "https://mirrors.dotsrc.org/kde/stable/frameworks/6.26/sonnet-6.26.0.tar.xz"
    - "https://download.kde.org/stable/frameworks/6.26/sonnet-6.26.0.tar.xz"
  sha256: "3ac4e165c0b3c79eda416b754bb837292f354188a1220f2065f57f686489af25"

patches: {}
