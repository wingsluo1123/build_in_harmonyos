# conandata.yml — sonnet 6.28.0
# canonical upstream source first: download.kde.org (Mirrorbits redirects by
# region); mirrors.nju.edu.cn — a member of KDE's official mirror list — is
# kept as the fallback for restricted CI workers and the device-side bfsu TLS
# failure. Both host the byte-identical tarball (sha256 cross-checked against
# the official .sha256 sidecar and re-verified against a fresh download).
# Conan 2.x get() tries the listed URLs in order and uses the first success.

sources:
  url:
    - "https://download.kde.org/stable/frameworks/6.28/sonnet-6.28.0.tar.xz"
    - "https://mirrors.nju.edu.cn/kde/stable/frameworks/6.28/sonnet-6.28.0.tar.xz"
  sha256: "66c6b439950bec7f67b730e6e49d6d30cba21dad115e4a47c4fe46014cc19c3b"

patches: {}
