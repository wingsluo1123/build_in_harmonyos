software: sops
# 版本级 manifest
# 文件位置: archives/s/sops/3.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.11.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# Conan 引用
conan_ref: "sops/3.11.0@ohpcd/stable"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (release tag)
  url: "https://github.com/getsops/sops/archive/refs/tags/v3.11.0.tar.gz"

  # 源码校验和
  sha256: "0182659099cd6a2fbcb41b507f8cd363667a0d6eb442098f6cebdf4ca8ecd2ac"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | go
  system: go

  # Go 构建配置
  go:
    module: "github.com/getsops/sops/v3"
    go_version: "1.24.4"
    cgo_enabled: false
    build_command: "go build -trimpath -ldflags '-s -w -X github.com/getsops/sops/v3/version.Version=3.11.0' -o sops ./cmd/sops"
    goproxy: "https://goproxy.cn,direct"

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器（Go 项目不使用 C/C++ 编译器）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 打包产物
# ============================================================

packaging:
  release_tarball: "packaging/sops-3.11.0-ohos-aarch64.tar.gz"
  release_sha256: "f6a75ee2034f01237f2154a18ae06d31cbbd1450dba506bdb9283c3eab7173af"
  contents:
    - "bin/sops (shell wrapper, 55 bytes)"
    - "bin/sops.real (Go binary, 43974840 bytes, ELF64 AArch64 static)"

# ============================================================
# 测试结果
# ============================================================

test_results:
  conan_verify: "PASS (G1/G2/G3/G4/L2/L4/L5 全通过)"
  version_test: "sops 3.11.0 (exit code 0)"
  test_package: "conan create test_package 执行成功，sops --version 输出正确"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目在 OHOS 上编译需设置 CGO_ENABLED=0 生成纯静态二进制"
  - "Conan 2.x self.run() 的 env 参数必须是 list 格式 ['KEY=VALUE']，不能是 dict"
  - "Conan 2.x basic_layout 下 build_folder 和 source_folder 不同，go build 需要 cwd=self.source_folder"
  - "Conan 2.x test_package 中 deps_cpp_info 已移除，需用 self.dependencies['name'].package_folder"
  - "OHOS 未签名 ELF 二进制无法直接执行，需 elfldr 包装器；conanfile.py 创建 shell wrapper 脚本"
  - "package_info() 需显式设置 cpp_info.bindirs=['bin'] 才能让 conanrun 环境正确设置 PATH"
