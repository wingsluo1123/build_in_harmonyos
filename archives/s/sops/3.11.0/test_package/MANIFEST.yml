# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sops/3.11.0
homepage: "https://github.com/getsops/sops"

# sops is a Go project; no traditional make check/ctest
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Go unit tests, not applicable for binary package)
upstream_tests:
  - file: test.sh
    source: test_package/test.sh
    description: "Smoke test: verify sops --version output"
    command: "./test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Verify sops binary runs and reports version 3.11.0"
    command: "sops --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
