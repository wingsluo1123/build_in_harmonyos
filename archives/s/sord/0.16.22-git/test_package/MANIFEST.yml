# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sord/0.16.22-git
homepage: "https://drobilla.net/software/sord"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson.test() in build() — runs sord upstream test suite"

# 上游实际运行的测试程序 (sord 0.16.22-git meson test 列表)
upstream_tests:
  - file: test/test_sord.c
    source: sord-c9b049b/test/test_sord.c
    description: "SordWorld + SordModel CRUD operations"
    command: "./test_sord"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：sord_world_new + sord_world_free"
    command: "./test_sord"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 1 个测试程序 + 消费者 test_package 1 个
assertion_count: 3
