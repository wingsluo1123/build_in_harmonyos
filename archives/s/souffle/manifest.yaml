software: souffle
display: "Soufflé"
description: "A Datalog compiler — a logic programming language and analysis tool"
category: build-tool
homepage: "https://souffle-lang.github.io/"
license: UPL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "源码归档非 git checkout，需 SOUFFLE_GIT=OFF 跳过 configure 阶段的 git describe"
    - "可选功能 (zlib/sqlite3/libffi/ncurses/OpenMP) 通过 SOUFFLE_USE_*=OFF 关闭，仅保留 Flex+Bison 作为构建期工具"
    - "上游测试由 CTest 驱动；自包含单元测试二进制 (label unit_test) 在 OHOS 上直接运行"
  common_dependencies:
    - flex
    - bison

versions:
  "2.5":
    status: built
    build_date: "2026-10-10"
