software: source-highlight
version: "3.1.9"
status: built
build_date: "2026-07-17"
build_system: autotools

source:
  url: "https://ftpmirror.gnu.org/gnu/src-highlite/source-highlight-3.1.9.tar.gz"
  sha256: "3a7fd28378cb5416f8de2c9e77196ec915145d44e30ff4e0ee8beb3fe6211c91"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - "boost/1.90.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "E125: HMDFS blocks config.status mktemp -d, fix with mktemp wrapper using fixed dirname"
  - "E165: fix shebangs for HarmonyOS (/bin/bash → /data/service/hnp/bin/bash)"
  - "E007: fix config.guess to recognize HarmonyOS as Linux+musl"
  - "boost::regex is header-only since 1.69, configure must be patched to skip link check"
  - "C++17 compat: -Wno-dynamic-exception-spec and -Wno-register needed for old source code"
