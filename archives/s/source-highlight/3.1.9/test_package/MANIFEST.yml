# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: source-highlight/3.1.9
homepage: "https://www.gnu.org/software/src-highlite/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: "N/A"
    source: "source-highlight-3.1.9"
    description: "上游测试套件在 OHOS 编译环境中无法运行 (CMake/CTest 未集成)"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 创建 SourceHighlight 对象验证库链接和基础功能"
    command: "./test_source-highlight"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
