# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: sox_ng/14.8.0.1
homepage: "https://codeberg.org/sox_ng/sox_ng"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/tests.sh
    source: sox_ng-14.8.0.1/src/tests.sh
    description: "格式互转自检（sox_sample_test + 15 种格式往返，168 用例全 ok）"
    command: "./src/tests.sh"
  - file: test/check.sh
    source: sox_ng-14.8.0.1/test/check.sh
    description: "76 功能用例（synth/effects/格式读写；74 OK + 2 VOID，VOID 为上游标记：BUG-305 复现、wav>4GB 资源条件）"
    command: "./test/check.sh"
  - file: src/sox_sample_test.c
    source: sox_ng-14.8.0.1/src/sox_sample_test.c
    description: "样本转换测试（二进制执行，1 用例）"
    command: "./src/sox_sample_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试"
    command: "./test_sox_ng"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 245
