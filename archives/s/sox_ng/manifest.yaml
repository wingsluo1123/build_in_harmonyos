# 软件级 manifest
# 文件位置: archives/s/sox_ng/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: sox_ng

# 显示名
display: "SoX next generation"

# 一句话描述
description: "SoX (Sound eXchange) 重写版：音频格式转换库 libsox_ng 与命令行工具 sox_ng/soxi_ng/play_ng/rec_ng"

# 分类标签
category: multimedia

# 官网 URL
homepage: "https://codeberg.org/sox_ng/sox_ng"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "config.guess/config.sub 不识别 linux-ohos triplet（E007/E072），需 patch-autotools-ohos.pl"
    - "/tmp 只读（E002），上游测试脚本硬编码 /tmp 需改 ${TMPDIR:-/tmp}"
    - "musl tmpfile() 将 TMPDIR 截断为 7 字符，lsx_tmpfile 需改 mkstemp 全路径（长 TMPDIR 下 EACCES）"

  # 跨版本通用依赖
  common_dependencies:
    - zlib/1.3.1
    - libogg/1.3.6
    - libvorbis/1.3.7
    - libsndfile/1.2.2
    - libflac/1.5.0
    - libmp3lame/3.100
    - libmad/0.15.1b
    - libid3tag/0.16.3
    - libopus/1.6.1
    - libpng/1.6.39
    - libspeexdsp/1.2.1

# ============================================================
# 版本索引
# ============================================================

versions:
  "14.8.0.1":
    status: built
    build_date: 2026-10-13
