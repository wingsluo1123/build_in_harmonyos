knowledge_gained:
  - "Spark 4.1.2 是 JVM 预编译分发包，无 configure/make，build() 仅需解压复制。"
  - "HarmonyOS 上 Java 可能报告 os.name=HarmonyOS/user.home=?，Spark/Hadoop 需通过包装脚本设置 -Dos.name=Linux 与 -Duser.home。"
  - "HarmonyOS UID 可能无法被 whoami/passwd 反查，Spark/Hadoop UGI 需设置 SPARK_USER/HADOOP_USER_NAME/user.name。"
  - "消费者测试需真实运行 spark-submit --class org.apache.spark.examples.SparkPi --master local[1]。"
