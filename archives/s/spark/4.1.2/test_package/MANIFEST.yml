# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。

package: spark/4.1.2
homepage: "https://spark.apache.org/"

# Spark 4.1.2 此归档使用官方预编译 Hadoop 3 分发包，无 configure/make/ctest。
# 上游分发包内含 examples/jars/spark-examples_2.13-4.1.2.jar，可作为真实功能烟测入口。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: examples/src/main/scala/org/apache/spark/examples/SparkPi.scala
    source: "Apache Spark upstream example included in spark-4.1.2-bin-hadoop3.tgz"
    description: "Run SparkPi via spark-submit on local[1]"
    command: "spark-submit --class org.apache.spark.examples.SparkPi --master local[1] examples/jars/spark-examples_2.13-4.1.2.jar 2"

test_package_tests:
  - file: test.sh
    description: "消费者测试: spark-submit --version reports 4.1.2"
    command: "sh test.sh <spark-submit> <examples-jar>"
  - file: test.sh
    description: "消费者测试: spark-submit runs upstream SparkPi example and prints Pi is roughly"
    command: "spark-submit --class org.apache.spark.examples.SparkPi --master local[1] spark-examples_2.13-4.1.2.jar 2"

assertion_count: 2
