sources:
  spdk:
    # Single canonical GitHub URL: the CI mirror injection only rewrites the
    # single ``url:`` value.  codeload is the byte-identical endpoint reachable
    # from the OHOS device (github.com is commonly unreachable there).
    url: "https://github.com/spdk/spdk/archive/refs/tags/v25.05.tar.gz"
    codeload: "https://codeload.github.com/spdk/spdk/tar.gz/refs/tags/v25.05"
    sha256: "57639f69494bb2141fc4e5c810c655aeaf705724f021c6a4bc2ff82381b8de2b"
  dpdk:
    url: "https://github.com/spdk/dpdk/archive/cf36799c473a686fa14fde9af97f917a2125d3d5.tar.gz"
    codeload: "https://codeload.github.com/spdk/dpdk/tar.gz/cf36799c473a686fa14fde9af97f917a2125d3d5"
    sha256: "33329a9ccf3e34f61467c50f8c54c2677de2ef5e41b802a7dcc9944c61c9bab5"

patches:
  "25.05":
    - patch_file: "patches/0001-dpdk-ohos-portability.patch"
      strip: 1
    - patch_file: "patches/0002-spdk-ohos-portability.patch"
      strip: 1
    - patch_file: "patches/0003-pmd-use-configured-archiver.patch"
      strip: 1
    - patch_file: "patches/0004-unit-test-fixtures.patch"
      strip: 1
    - patch_file: "patches/0005-unit-writable-fixtures.patch"
      strip: 1
    - patch_file: "patches/0006-unit-dix-requires-crypto.patch"
      strip: 1
    - patch_file: "patches/0007-hkdf-explicit-empty-salt.patch"
      strip: 1
    - patch_file: "patches/0008-unit-auth-drive-delayed-poller.patch"
      strip: 1
