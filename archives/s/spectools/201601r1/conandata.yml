# 声明的同源地址 http://www.kismetwireless.net/spectools/）。官方归档
# spectools-2016-01-R1.tar.xz 经 kismetwireless.net/code/ 目录列表实测
# 存在，HTTP 200（2026-10-14）。
# 文件名 spectools-2016-01-R1.tar.xz 按 Debian uversionmangle
# （s/(\d\d\d\d)-(\d\d)-R(.*)/$1$2r$3/）映射为版本号 201601r1。
