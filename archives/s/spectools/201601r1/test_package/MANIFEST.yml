# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 三步法：清点 → 实测 → 回填，详见 notes.md）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: spectools/201601r1
homepage: "http://www.kismetwireless.net/spectools/"

# 上游测试命令：spectools 201601r1 源码树无 test/ 目录、Makefile.in 无
# TESTS 目标、无 CUTTER/Check/CMocka 等测试框架引用 —— 上游未提供正式
# 自动测试（Debian 打包亦未附带任何测试入口）。
upstream_check_command: ""
upstream_check_result: "上游未提供正式自动测试（无 TESTS 目标 / 测试框架 / test 目录）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（清点结果为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: harmonyos_specific_test.c
    description: "鸿蒙平台特有测试：编译期硬绑定 __OHOS__/__aarch64__ + 运行时纯进程内 ELF64 解析（不依赖 readelf/objdump 等外部工具，OHOS 运行环境不保证提供）校验 spectool_raw/spectool_curses/spectool_net 三个安装产物：ELF magic / ELFCLASS64 / e_machine=EM_AARCH64 / PT_INTERP 为 aarch64 动态加载器（ld-musl-aarch64.so.1 或 ld-linux-aarch64.so.1）/ .note.ohos.ident 段存在 / DT_NEEDED 含 libc.so（每产物 6 项 × 3 产物 = 18 项断言）"
    command: "clang harmonyos_specific_test.c -o t && ./t <pkg>/bin/spectool_raw <pkg>/bin/spectool_curses <pkg>/bin/spectool_net"
  - file: run_spectools_test.sh
    description: "消费者冒烟测试：真实执行安装产物（spectool_raw -h/-l 参数解析+用法/设备枚举 + spectool_curses -h + spectool_net -h，全部离线，无需 Wi-Spy USB 硬件；126/127 判 FAIL 其余非零容忍 WARN）"
    command: "sh run_spectools_test.sh <pkg>/bin/spectool_raw <pkg>/bin/spectool_curses <pkg>/bin/spectool_net"

# 测试断言总数（harmonyos_specific_test.c 输出 "18 checks"：
# 每产物 ELF magic / ELFCLASS64 / EM_AARCH64 + PT_INTERP aarch64 加载器 +
# .note.ohos.ident + DT_NEEDED libc.so = 6 × 3 产物 = 18；冒烟脚本 4 个测试点
# （raw -h / raw -l / curses -h / net -h））
assertion_count: 22
