# test_package/MANIFEST.yml
package: spek/0.8.5
homepage: "https://www.spek.cc/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游 spek 是 GUI 应用（wxWidgets），无自带测试套件，make check 目标不存在.
# upstream_tests 条目已删除以反映真实情况，避免误导后续维护者.

test_package_tests:
  - file: conanfile.py
    description: "CLI --help smoke test"
    command: "spek-cli --help"

assertion_count: 1
