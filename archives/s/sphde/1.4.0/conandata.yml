# conandata.yml — sphde 1.4.0
# SPHDE (Shared Persistent Heap Data Environment) — official LLNL/IBM source.
# R39/PF7: conandata.yml 只写上游官方源 URL；CI 会自动为 github.com 源
# 加上镜像 fallback（gh-proxy 等），不需要也不允许手写镜像前缀。
sources:
  url: "https://github.com/sphde/sphde/archive/refs/tags/1.4.0.tar.gz"
  sha256: "f49d50979007cf7d9e735de9367cbced86f19a148c202245d9651251b3c2a4e7"

patches:
  - patch_file: "patches/0001-config.guess-ohos.patch"
    patch_description: "config.guess 增加 HarmonyOS 系统检测，识别 aarch64-unknown-linux-ohos 三元组 (E205/E007)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos.patch"
    patch_description: "config.sub 增加 ohos/linux-ohos 三元组支持 (E205/E072)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: "configure 临时目录创建 umask 077->022，规避 HMDFS setgid 写权限问题 (E129)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-pwd-fallback.patch"
    patch_description: "configure ac_pwd 增加 $PWD 回退 (E158, HMDFS getcwd)；-mhtm 探测加入 -Wall -Werror，避免 aarch64 clang 上 'argument unused' 告警被 -Werror 提升为致命编译错误 (E143)"
    patch_type: "portability"
  - patch_file: "patches/0005-sasshm-key_t.patch"
    patch_description: "sasshm.h 自包含：显式 #include <sys/types.h> 使 key_t 在使用点可用，规避 sasshm.c 先含 sasshm.h 后含 sys/ipc.h 的顺序问题 (E131)"
    patch_type: "portability"
  - patch_file: "patches/0006-makefile-no-unused-function.patch"
    patch_description: "AM_CFLAGS/AM_CXXFLAGS 追加 -Wno-unused-function -Wno-unused-but-set-variable：OHOS clang 对未使用的 static inline 函数触发 -Wunused-function（GCC 不报），以及 sphlflogger.cpp SPHLFLoggerPrefetch 中仅作 prefetch 副作用的局部变量 touch 触发 -Wunused-but-set-variable（GCC 豁免），被上游 -Werror 提升为致命编译错误 (sascompoundheap.cpp:60 SASCompoundHeapPercentFree、sphlflogger.cpp:973)"
    patch_type: "portability"
  - patch_file: "patches/0007-makefile-no-changelog.patch"
    patch_description: "顶层 Makefile.in 从 dist_doc_DATA 移除 ChangeLog.md 并删除其生成规则：ChangeLog.md 需 git+#!/bin/bash 生成，OHOS 无 /bin/bash（bash 在 /data/service/hnp/bin/bash）且无 git 历史，make all 的 all-am 因 ChangeLog.md 不存在而触发 generate-changelog.sh 报 bad interpreter 致 Error 126"
    patch_type: "portability"
  - patch_file: "patches/0008-makefile-wformat-wabsolute.patch"
    patch_description: "src/Makefile.in 的 AM_CFLAGS/AM_CXXFLAGS 追加 -Wno-format -Wno-absolute-value：make check 编译 tests/sphgtod_t.c、tests/sphgettime_t.c 时，OHOS 上 __WORDSIZE 分支使 NS_P_* 取 ULL 后缀，uint64_t 表达式为 unsigned long long 而 PRIu64 展开为 'lu'（均为 64 位同宽，仅类型名不同），且 llabs() 作用于无符号 uint64_t 差值，clang 分别报 -Wformat 与 -Wabsolute-value，被上游 -Wall -Werror 提升为致命错误 (sphgtod_t.c:48/51/76/79/81/96/99/101)"
    patch_type: "portability"
  - patch_file: "patches/0009-sphlflogger-pid-t.patch"
    patch_description: "tests/sphlflogger_tt.c、sphlflogger_ttt.c、sphlogportal_tt.c、sphsinglepcqueue_tt.c 中 glibc 内部类型 __pid_t 替换为可移植的 pid_t：OHOS musl 系 libc 无 __pid_t 定义，只有公开的 pid_t（unistd.h 提供，均为 int，与 /proc/%d 的 %d 格式一致），编译报 'unknown type name __pid_t'"
    patch_type: "portability"
  - patch_file: "patches/0010-strerror_r-portable.patch"
    patch_description: "tests/sphdirectpcqueue_ttt.c、sphmultipcqueue_t.c 中 strerror_r 返回值按两种 libc 签名分别处理：glibc GNU 版（_GNU_SOURCE 下）返回 char*（可能指向静态串而非 buf），musl 系 libc 恒返回 int（POSIX/XSI 版）且结果写入 buf；原写法 char *msg = strerror_r(...) 在 musl 上报 'incompatible integer to pointer conversion' 被 -Wall -Werror 提升为致命错误，且忽略返回值在 glibc 上可能读到未填充的 buf。改为按 `__GLIBC__ && _GNU_SOURCE` 分支并把结果统一落在 buf：GNU 版取返回值，若非空且非 buf 自身则用 snprintf 写回 buf；其余（POSIX/XSI，含 OHOS musl，且 glibc 未定义 _GNU_SOURCE 时）忽略返回值直接读 buf。先置 buf[0]='\\0'，随后一律打印 buf"
    patch_type: "portability"
