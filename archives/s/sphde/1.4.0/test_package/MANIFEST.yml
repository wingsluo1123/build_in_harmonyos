    command: "(not registered on aarch64/OHOS: HTM unavailable)"

# Note: sphmultipcqueue_t (src/tests/sphmultipcqueue_t.c) is gated behind
# HTM (POWER transactional memory, -mhtm) in src/Makefile.am and does not
# compile/register on aarch64 OHOS. It is part of the declared 24-entry
# upstream inventory and is reported as an `environment` gap in
# HMBS_UPSTREAM_TEST_RESULT (not executed), never counted as passed.

# Consumer-perspective checks executed by conan create (L1)
test_package_tests:
  - file: test.c
    description: "links libsphde.so and exercises the public C API: SASJoinRegion, SASSimpleHeapCreate/Alloc/write-back/Free/Destroy, SASRemove (6 checked assertions)"
    command: "./test_sphde"
  - file: conanfile.py
    description: "re-emits the persisted HMBS_UPSTREAM_TEST_RESULT from package res/upstream_test_result.json so every round carries upstream evidence"

assertion_count: 6

# Known platform limitation (ohos_feature, not a missing dependency):
# SPHDE maps the SAS region via System V shared memory (shmget/shmat/shmctl in
# sasshm.c/sassim.cpp) plus fixed-address mmap(MAP_FIXED) at __SAS_BASE_ADDRESS.
# On HarmonyOS this either trips seccomp (SIGSYS signal 31, so SAS-region tests
# abort with "Signal 31 (core dumped)") or, when the mapping succeeds, the
# multi-threaded lock-free SPSC-queue tests (sphsinglepcqueue_ttt /
# sphdirectpcqueue_ttt) can spin indefinitely in upstream unbounded
# `while(...Empty/Full) sched_yield();` loops. The recipe's make check therefore
# runs every upstream test under a per-test timeout wrapper (LOG_COMPILER=
# test-timeout-wrapper.sh, SPHDE_TEST_TIMEOUT default 300s) so a hung test is
# killed and recorded as FAIL instead of stalling the whole job (CI observed a
# 14400s stall in sphsinglepcqueue_ttt). Non-SAS tests (sphgtod/sphgettime/
# bitvec/sasatom) pass. The test_package consumer smoke test test.c calls
# SASJoinRegion() first, which on OHOS crashes with a signal (seccomp SIGSYS /
# "Signal 31 (core dumped)", shell rc 159/139) inside that call, so it cannot
# complete; test_package/conanfile.py therefore reports HMBS_TEST_PACKAGE_RESULT
# with passedCount=0 and an ohos_feature gap and does NOT hard-fail conan create
# for that documented platform limitation (genuine non-platform failures still
# raise). The 24-entry inventory stays honest (23 executed + 1 HTM-gated
# not-executed environment gap); actual pass/fail and gaps are reported
# in the run markers from the real-device test-suite.log (not edited here).
