# test_package/MANIFEST.yml — sphde 1.4.0
# Upstream and consumer test declaration required by CI L0e.
# Facts audited from the sphde/sphde 1.4.0 tag (23f745a); device-execution
# numbers are filled only from real-device runs (never estimated).

package: sphde/1.4.0
homepage: "https://github.com/sphde/sphde"

# Upstream suite listing tool
upstream_check_command: "make check"

# Machine-evidence declaration (required by the device-test gate).
# Total inventory uses the official upstream unit: the automake TESTS
# programs listed in src/Makefile.am. 24 entries exist in the file; on
# aarch64/OHOS only 23 register because sphmultipcqueue_t is gated behind
# AM_CONDITIONAL(HTM) (POWER transactional memory, -mhtm). The declared
# total is the full inventory (24) to avoid under-reporting; the 1 entry
# that cannot register/run on this platform is reported as an
# `environment` gap in HMBS_UPSTREAM_TEST_RESULT, never as passed.
upstream_tests_exist: true
upstream_test_total: 24
upstream_test_count_method: autotools_tests
upstream_test_count_detail: "24 automake TESTS programs listed in src/Makefile.am of the 1.4.0 tag (full inventory of `TESTS +=` entries). 23 register on aarch64/OHOS; sphmultipcqueue_t is gated by `if HTM` (POWER hardware transactional memory, -mhtm) which is unavailable on aarch64, so it is counted as a not-executed environment gap (not passed, not zeroed). discovered=24, executed=23 from test-suite.log."

# The main recipe build() runs `make check` after building; automake writes
# src/test-suite.log which the recipe parses (#TOTAL/#PASS/#FAIL) and emits
# as HMBS_UPSTREAM_TEST_RESULT, persisted into package res/.
upstream_test_in_build: true
upstream_test_command: "make check (runs src/test-suite.log via automake test-driver)"

upstream_tests:
  - file: src/tests/sphgtod_t.c
    source: sphde-1.4.0/src/tests/sphgtod_t.c
    description: "emulated gettimeofday (libsphgtod) test"
