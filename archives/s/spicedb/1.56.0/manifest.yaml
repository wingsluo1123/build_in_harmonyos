software: spicedb
version: "1.56.0"
status: pending
build_date: "2026-08-02"
build_system: go
conan_ref: "spicedb/1.56.0"
status_notes: "Builds the upstream Go command from source; bootstraps the pinned Go toolchain from a mirror when the CI worker has no system Go; CI #13022 fix recursively normalizes fallback Go toolchain directory and executable bits after extraction."

source:
  url: "https://github.com/authzed/spicedb/archive/refs/tags/v1.56.0.tar.gz"
  sha256: "e8c15ecc241e3f50feeab0c63062c961e4558608f25376623ce38e44ec3897b1"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH derived from Conan target arch"
    - "Use GOROOT/PATH from the discovered or bootstrapped Go toolchain"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct by default"
    - "chmod-normalize fallback Go toolchain directories and bin/pkg/tool executables before go build"
  dependencies: []
  cc: N/A
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "spicedb is distributed as a Go CLI/server command rooted at ./cmd/spicedb."
  - "The Homebrew formula injects version metadata through github.com/jzelinskie/cobrautil/v2.Version; this recipe keeps the same version flag path."
  - "The OHOS CI worker may not provide Go, so the recipe falls back to a pinned Go toolchain archive from mirrors.aliyun.com."
  - "OHOS/HMDFS workers can unpack the fallback Go toolchain without traversable or executable bits, so the recipe restores parent/root directory and tool executable permissions before running go."
  - "The packaged command can be smoke-tested without starting a long-running server."

validation:
  local_windows:
    py_compile: passed
    diff_check: passed
    conan_create: not_run
    reason: "No local Conan/OHOS target runtime is installed in this Windows workspace."
  ohos:
    conan_create: pending_ci
    reason: "Official GitCode/OHPCD CI is authoritative for target binary execution."
