package: spicedb/1.56.0
homepage: "https://github.com/authzed/spicedb"

upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: "go test ./..."
upstream_tests:
  - "go test ./... (not run locally; official CI provides target verification)"
upstream_case_count: 0
upstream_test_note: "The package smoke test focuses on the installed command because full upstream Go tests need the target Go toolchain and service dependencies."

test_package_tests:
  - file: "test_spicedb.py"
    description: "Execute the packaged spicedb command and verify help/version output."
    command: "python3 test_spicedb.py <path-to-spicedb>"

test_package_assertion_count: 3
assertion_count: 3
