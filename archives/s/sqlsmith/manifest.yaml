software: sqlsmith
display: "SQLsmith"
description: "随机 SQL 查询生成器（模糊测试工具），支持 PostgreSQL / SQLite / MonetDB"
category: build-tool
homepage: "https://github.com/anse1/sqlsmith"
license: "GPL-3.0-only"
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 依赖发现改写为 Conan 包：libpq::libpq / libpqxx::pqxx / boost1.84-regex::boost1.84-regex"
    - "Boost.Regex 为硬依赖（核心源码无条件 include <boost/regex.hpp>）"
    - "C++20 由 CMakeToolchain cppstd block 强制（libpqxx 8.x 头要求）"
  common_dependencies:
    - libpqxx
    - libpq
    - boost1.84-regex

versions:
  "1.5":
    status: built
    build_date: 2026-10-12
