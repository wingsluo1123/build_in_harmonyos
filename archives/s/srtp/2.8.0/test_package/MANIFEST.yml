# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: srtp/2.8.0
homepage: "https://github.com/cisco/libsrtp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/srtp_driver.c
    source: srtp-2.8.0/test/srtp_driver.c
    description: "SRTP driver test"
    command: "./test/srtp_driver -v"
  - file: test/rdbx_driver.c
    source: srtp-2.8.0/test/rdbx_driver.c
    description: "RDBX driver test"
    command: "./test/rdbx_driver -v"
  - file: test/roc_driver.c
    source: srtp-2.8.0/test/roc_driver.c
    description: "ROC driver test"
    command: "./test/roc_driver -v"
  - file: test/replay_driver.c
    source: srtp-2.8.0/test/replay_driver.c
    description: "Replay driver test"
    command: "./test/replay_driver -v"
  - file: crypto/test/cipher_driver.c
    source: srtp-2.8.0/crypto/test/cipher_driver.c
    description: "Cipher driver test"
    command: "./crypto/test/cipher_driver -v"
  - file: crypto/test/kernel_driver.c
    source: srtp-2.8.0/crypto/test/kernel_driver.c
    description: "Kernel driver test"
    command: "./crypto/test/kernel_driver -v"
  - file: crypto/test/sha1_driver.c
    source: srtp-2.8.0/crypto/test/sha1_driver.c
    description: "SHA1 driver test"
    command: "./crypto/test/sha1_driver -v"
  - file: crypto/test/datatypes_driver.c
    source: srtp-2.8.0/crypto/test/datatypes_driver.c
    description: "Datatypes driver test"
    command: "./crypto/test/datatypes_driver -v"
  - file: crypto/test/aes_calc.c
    source: srtp-2.8.0/crypto/test/aes_calc.c
    description: "AES calculation test"
    command: "./crypto/test/aes_calc"
  - file: crypto/test/env.c
    source: srtp-2.8.0/crypto/test/env.c
    description: "Environment info test"
    command: "./crypto/test/env"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试"
    command: "./test_srtp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
