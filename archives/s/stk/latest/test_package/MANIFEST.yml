# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: stk/latest
homepage: "https://github.com/thestk/stk"

# 上游测试命令
#
# 核实结果: STK 上游不提供任何测试套件。
#   - Makefile.in 只有 distclean / install 两个 target, 没有 check;
#   - configure.ac 没有 AC_CONFIG_TESTDIR / TESTS;
#   - 仓库中没有 test/ 或 tests/ 目录;
#   - CMakeLists.txt 及 projects/*/CMakeLists.txt 中没有任何
#     enable_testing() 或 add_test()。
# projects/ 下的 demo / effects / eguitar / examples / ragamatic 是需要
# 实时音频设备和交互输入的示例程序, 不是自动化测试, 且本归档以
# COMPILE_PROJECTS=OFF 构建, 不会编译它们。
# 因此没有可运行的上游测试命令, 功能验证全部由 test_package 承担。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: >-
      链接已安装的 libstk, 逐项验证 DSP 核心的数值行为与线程原语:
      全局采样率读写; SineWave 输出有界/满幅/整周期直流为零/reset 归零;
      Noise 输出有界且非常量; OnePole 直流增益收敛到 1 与 OneZero 的
      冲激响应; Delay 精确延后 N 个采样; ADSR 走完 attack 停在 sustain
      并在 keyOff 后归零; Thread 的 start/cancel/testCancel/wait 全生命
      周期与 Mutex 互斥计数。其中 Thread 部分正是本归档两个可移植性补丁
      所覆盖的代码路径, 且因为用到 Thread.h/Mutex.h, 它同时验证了配方向
      消费者传递 __OS_LINUX__ 开关是否生效 (否则无法编译)。
    command: "test_package"

# 测试断言总数
assertion_count: 20
