sources:
  url: "https://github.com/stlink-org/stlink/archive/refs/tags/v1.8.0.tar.gz"
  sha256: "cff760b5c212c2cc480f705b9ca7f3828d6b9c267950c6a547002cd0a1f5f6ac"

patches:
  "1.8.0":
    - patch_file: patches/0001-cmake-modules-c_flags.cmake.patch
      patch_description: "Disable an unsupported narrowing warning on HarmonyOS"
    - patch_file: patches/0002-src-st-util-gdb-remote.c.patch
      patch_description: "Use the portable poll.h include"
    - patch_file: patches/0003-src-stlink-lib-chipid.c.patch
      patch_description: "Use the correct integer width for filename lengths"
    - patch_file: patches/0004-src-stlink-lib-common.c.patch
      patch_description: "Use the correct integer width for input lengths"
    - patch_file: patches/0005-src-stlink-lib-flash_loader.c.patch
      patch_description: "Use the correct integer width for flash offsets"
    - patch_file: patches/0006-src-stlink-lib-map_file.c.patch
      patch_description: "Use the mapped-file length type expected by stlink"
    - patch_file: patches/0007-src-stlink-lib-usb.c.patch
      patch_description: "Match libusb serial length return types"
