# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: stlink/1.8.0
homepage: "https://github.com/stlink-org/stlink"

# stlink 上游测试依赖真实硬件，无 make check 目标
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 st-info --version 验证工具链可正常执行"
    command: "st-info --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
