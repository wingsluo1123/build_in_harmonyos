# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: stuntman/1.2.17
homepage: "https://github.com/jselbie/stunserver"

# 上游测试命令 (stuntman uses custom Makefile, no check target)
upstream_check_command: "./stuntestcode"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: stuntestcode
    source: stuntman-1.2.17/testcode/testcode.cpp
    description: "STUN protocol unit tests (13 test suites)"
    command: "./stuntestcode"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify stunclient binary installed and can show help"
    command: "stunclient --help"

# 测试断言总数 (13 test suites, each with multiple assertions)
assertion_count: 39
