# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: superseedr/latest
homepage: "https://github.com/Jagalite/superseedr"

# 上游测试命令
upstream_check_command: "cargo test --release"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cargo test --release"

# 上游实际运行的测试程序
upstream_tests:
  - file: "src/lib.rs"
    source: "superseedr-latest/src/lib.rs"
    description: "Rust unit tests (1460 passed, 64 failed on OHOS)"
    command: "cargo test --release"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "验证 superseedr 二进制可执行并输出版本号"
    command: "superseedr --version"

# 测试断言总数
assertion_count: 1524
