# conandata.yml — svox 1.0
# 上游: SVOX Pico 小 footprint TTS 引擎 (随 Android AOSP 发布)。
# 版本 1.0 的源码包形态是 Debian 官方快照 svox_1.0+git20130326
# (salsa a11y-team 维护)，OpenWrt sound/svox 用的就是同一个包：
#   PKG_SOURCE:=svox_1.0+git20130326.orig.tar.gz
#   PKG_SOURCE_URL:=http://ftp.debian.org/debian/pool/non-free/s/svox
#   PKG_HASH:=337b25e6... (sha256，与 Launchpad 公布值一致)
# 本配方取 Debian 官方池 HTTPS 地址为回退，国内 Debian 镜像在前
# (真机预检 2026-10-13：deb.debian.org 直连 25MB 包下载至 56% 后
# Signal 9/退出码 137 中断，conan create 未进入编译；沿 freetype
# 2.14.3.2.1 / qzxing 3.3.0 已合入先例，把同路径的国内镜像排在前面，
# 官方原始 URL 保留在最后；镜像与官方服务同一归档，sha256 不变)。
# 注意分池是 non-free (语音 lingware 数据授权原因)，不是 main。
# sha256 三方交叉确认：
#   Launchpad svox 1.0+git20130326-{1,3,13} 源码包页 + OpenWrt .mk，
#   均为 337b25e6ccb3764f0df1e176470b883c90e40e98840d4133340fcc89eb3cea0c。
sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/non-free/s/svox/svox_1.0+git20130326.orig.tar.gz"
    - "https://mirrors.ustc.edu.cn/debian/pool/non-free/s/svox/svox_1.0+git20130326.orig.tar.gz"
    - "https://mirrors.aliyun.com/debian/pool/non-free/s/svox/svox_1.0+git20130326.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/non-free/s/svox/svox_1.0+git20130326.orig.tar.gz"
  sha256: "337b25e6ccb3764f0df1e176470b883c90e40e98840d4133340fcc89eb3cea0c"

# Vendored 构建依赖：libpopt（仅 pico2wave 链接它）。
# 与 logrotate/3.22.0 及 archives/p/popt/1.16 用的是同一个包
#（OpenBSD distfiles 镜像的 rpm-software-management/popt 1.16）。
# 保持配方自包含：conancenter 的 popt/1.16 配方自带古董 config.sub，
# 在 HarmonyOS 下 configure 直接报 cannot run config.sub，且远端排序
# 总是先命中 conancenter 修订，OHOS 下总是从源码重编 popt 而失败，
# svox 本体连被读到的机会都没有。
popt:
  url:
    - "https://ftp.openbsd.org/pub/OpenBSD/distfiles/popt-1.16.tar.gz"
  sha256: "e728ed296fe9f069a0e005003c3d6b2dde3d9cad453422a10d6558616d304cc8"

# 注 (2026-10-13 第六策略周期)：E007 曾尝试经 conandata patches
# (base_path: popt) 整文件替换 config.guess/config.sub，但真机预检导出
# 日志无 .patch 拷贝、同一 config.sub 错误逐字复现，未生效；已改走
# conanfile.py _build_popt 构建期恒等映射覆盖，此处不再声明补丁。
