# 软件级 manifest
# 文件位置: archives/s/svox/manifest.yaml

software: svox
display: "SVOX Pico TTS"
description: "SVOX Pico small-footprint 离线语音合成引擎（libttspico 库 + pico2wave 工具）"
category: utility
homepage: "https://android.googlesource.com/platform/external/svox/"
license: Apache-2.0

build_system: custom-direct-cc

ohos_adaptation:
  key_points:
    - "orig 包无 autotools 文件，直接按 pico/lib/Android.mk 用 CC 编译归档"
    - "pico2wave 的 popt 以 vendored 源码静态编入（沿 logrotate 先例，无外部 Conan 依赖）"
    - "CC/AR 经 tools.build:compiler_executables 显式解析（R33）"
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: 2026-10-13
