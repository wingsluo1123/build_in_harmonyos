  - E037

knowledge_gained:
  - "swaks 是单文件 Perl 脚本：没有构建系统，适配重点是解释器依赖声明与真实 SMTP 会话证据"
  - "脚本硬 use Pod::Usage、File::Spec::Functions，并运行时 require IO::Socket::IP/IPC::Open2 等核心模块；依赖检查要清点 perl 包内部模块，而不只是确认包名已发布"
  - "OHOS perl 5.42.2 包内已含 Pod::Usage 2.05 与 Pod::Text/Pod::Simple/Encode 整条 POD 渲染链路，也含 IO::Socket::IP 与 IPC::Open2；缺 Net::SSLeay/Net::DNS/Authen::NTLM/Authen::SASL，真机 --support 已如实报告 TLS not available"
  - "Pod::Usage 文档里出现的 use Pod::Find 位于 __END__ 之后的 POD 段，不是加载期依赖，不需要 Pod-Parser"
  - "#!/usr/bin/env perl 是上游自带的可移植 shebang，OHOS（HongMeng Kernel 1.12.0 起）已有 /usr/bin/env，无需打补丁（E037）"
  - "CI 门禁 L0p 要求 settings 必须声明 os/compiler/build_type/arch 四项；纯脚本包照抄 acme.sh 的 settings=(\"os\",\"arch\") 会被 L0 拦截（本包首轮真机构建即因此失败，已修正）"
  - "L2 smoke 不激活 conanrun：解释器由 Conan 依赖提供的脚本包（perl 不在设备 PATH 上）结构上无法通过 L2，CI 将其标为 non-blocking，需在 PR 中说明"
  - "上游发布 tarball 不含 testing/ 回归框架，但**上游 git 仓库有完整套件**（2,589 例 / 12 组）；第一次提交只看了发布资产、把上游用例记成 0，被人工审查判为少报，已更正为真实数量并附真机执行结果"
  - "上游套件真机全量实测（2026-10-17）：2,589 例全部执行 → PASS 2,133 / FAIL 455 / SKIP 1（82.39%）；较首轮（2,354 例 / 1,667 pass / 70.83%）在同一 2,353 例子集上从 70.8% 提到 85.2%"
  - "**Net::SSLeay 不是不可解**：在设备上手工 xsubpp + clang 编译 Net::SSLeay 1.96、静态链接 ohpcd 的 OHOS openssl/3.5.8 后，swaks --support 报 TLS supported，_options-tls 252/252 全过，_exec-transactions 首次执行 235 例（122 pass）"
  - "该设备 perl 有两个硬坑：①Config{cc} 指向不存在的 /data/service/hnp/bin/clang；②`perl Makefile.PL` futex 死锁 → 任何 XS 模块都必须手写 xsubpp + clang（用 Config.pm 覆盖层修 cc/archlibexp），且手工构建后要自己跑 AutoSplit"
  - "剩余 455 例失败里 418 例（92%）是 harness 的 hostname munge 环境差异（设备 hostname 恰为 localhost，被替换成 LOCAL_HOST_NAME，而上游 ref 是字面 localhost），非 swaks 缺陷；PERL5OPT 能修掉其中 32 例的 strict.pm 报错，但最终仍被 munge 判死"
  - "IO::Socket::INET6 也能真做出来：Socket6 的 autoconf 在设备上失败，但手写 config.h + xsubpp + clang -shared 可编成（真实现），装好后 swaks --support 16/16 全 supported，缺模块类失败降为 0"
  - "裸 CLI 选项名是 --support（脚本内部 okey 为 get_support）；本机演练先于真机发现了这个命名差异"
