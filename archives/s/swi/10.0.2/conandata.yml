    sha256: "e42cc098f7b8a6051c4f79a99b55162d467098aba60f69649bdc7583f0734b57"
patches:
  - patch_file: "patches/0001-packages-link-libswipl.patch"
    patch_description: "Allow explicit libswipl linkage for native extension modules"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-preserve-install-rpath.patch"
    patch_description: "Link with the final relative RPATH to preserve ELF signatures during installation"
    patch_type: "portability"
  - patch_file: "patches/0003-unregister-altstack-before-free.patch"
    patch_description: "Unregister the owner thread alternate signal stack before releasing memory"
    patch_type: "portability"
