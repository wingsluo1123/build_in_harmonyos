software: swift
version: "6.0.3"
status: built
build_system: source-bootstrap
compile_date: "2026-08-03"

source:
  upstream: "Swift 6.0.3 release source components"
  llvm_substrate: "OpenHarmony third_party_llvm-project 2026_0313_llvm15_release @ b568f98a0639500102f0d4c9470f3ee3b6322547"
  sha256: "see conandata.yml for Swift release components; OHOS LLVM substrate is pinned by commit"

dependencies:
  required:
    - "OHOS LLVM fork / clang-15"
    - "OHOS sysroot and signing tools"
    - "zlib/libxml2/xz runtime dependencies for downstream SwiftPM packages"
  optional: []

patches_applied:
  - "0001-add-ohos-platform-sdk-and-swiftpm-triple.patch"
  - "0002-ohos-driver-swiftpm-runtime-irhandoff.patch"

helper_scripts:
  - "scripts/source-bootstrap-ohos.sh"
  - "scripts/assemble-stage-ohos.sh"
  - "scripts/monitor-device.sh"
  - "scripts/swift-irhandoff-wrapper.c"

test_results:
  type: true-device manual + downstream Conan validation
  status: "unxip/3.3 conan create and test_package passed with the experimental OHOS-native Swift 6.0.3 path"
  evidence:
    - "$BASE/logs/conan-create-unxip-swiftpm-irhandoff-20260803-004816.out"
    - "$BASE/logs/conan-test-unxip-swiftpm-irhandoff-20260803-0104-test.out"
    - "$BASE/logs/conan-create-unxip-swiftpm-irhandoff-20260803-0105-full-create.out"
    - "/storage/Users/currentUser/ohos-users/codex-a/swift-6.0.3-recipe-20260803-040827/logs/conan-create-swift-notest-20260803-070911.log"
    - "/storage/Users/currentUser/ohos-users/codex-a/swift-6.0.3-recipe-20260803-040827/logs/conan-create-swift-full-20260803-071356.log"

quality_gates:
  official_linux_toolchain_probe: "blocked on glibc PT_INTERP and OHOS loader/runtime mismatch"
  swiftly_probe: "installer starts after signing but installs the same glibc-targeted toolchain unless a true OHOS host toolchain is provided"
  ohos_source_build: "swift/swiftc/swift-frontend and SwiftPM entrypoints built and ran on true device"
  downstream_validation: "unxip/3.3 SwiftPM release build completed under Conan; test_package returned TEST_RC=0"
  toolchain_package_validation: "swift/6.0.3 Conan create -tf empty and full test_package passed; test_package printed swift-ohos-smoke"

known_issues:
  - "Current successful path still depends on experimental IR handoff wrapper, runtime staging, SDK/resource-dir propagation, modulewrap handling, and signing."
  - "The Conan recipe now defaults to source-bootstrap-ohos.sh, which downloads verified Swift 6.0.3 sources, applies the exported patches, requires the pinned OHOS LLVM build substrate, and assembles the resulting stage; the older staged package path is gated behind SWIFT_OHOS_ALLOW_STAGED_PACKAGE=1 and records package/stage provenance hashes."
  - "Compilation consumers need a writable TMPDIR and an OHOS sysroot exposed through SDKROOT/OHOS_SYSROOT/OHOS_SDKROOT; test_package now supplies these when detectable."
  - "Staged SwiftPM binaries still carry source-bootstrap absolute RUNPATH entries; Conan runenv LD_LIBRARY_PATH covers this for validation, while RUNPATH relocation remains follow-up work."
