package: swift/6.0.3
homepage: "https://www.swift.org/"

upstream_check_command: "Swift upstream build/test suite; not run inside this toolchain packaging smoke"
upstream_test_in_build: false
upstream_test_command: "not run locally; full Swift validation is tracked in notes.md and true-device logs"

test_package_tests:
  - file: hello.swift
    description: "Compile and run a minimal Swift program through packaged swiftc"
    command: "swift --version && swiftc hello.swift -o hello && ./hello"

test_sources:
  - hello.swift

assertion_count: 2
