# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — L1 smoke（swirc --version，stdin 应答免责声明提问）+ OHOS rule12 消费者 e2e（swirc --help），bash + conanrun 环境执行，退出码判定（非断言式）"
    command: "bash test.sh"

# 上游测试断言/用例总数 (cmocka [ RUN ] 统计: 144 个用例全部通过)
assertion_count: 144
