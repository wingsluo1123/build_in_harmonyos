# test_package/MANIFEST.yml
# 上游官方测试声明文件
# swirc 3.5.9 上游测试：tests/ 目录下 35 个 cmocka 单元测试可执行（共 144 个测试用例），
# 通过 `make check`（根 Makefile → `make -Ctests` → `./run`）触发。
# cmocka 不在 ohpcd registry，包配方不引入该依赖；上游测试已在独立工作区
# 真实执行（cmocka/1.1.8 conancenter 交叉编译）：35/35 全部运行，144/144 用例通过。

name: swirc
version: "3.5.9"
description: "Test package for swirc IRC client"
homepage: "https://www.nifty-networks.net/swirc/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/run 脚本中的 35 个 cmocka 单元测试)
upstream_tests:
  - file: tests/cmd_servlist.c
    description: "ICB/IRC cmd_servlist 命令单元测试 (cmocka)"
    command: "tests/cmd_servlist.run"
  - file: tests/cmd_squery.c
    description: "cmd_squery 命令单元测试 (cmocka)"
