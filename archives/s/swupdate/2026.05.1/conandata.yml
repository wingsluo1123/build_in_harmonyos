sources:
  url: "https://github.com/sbabic/swupdate/archive/refs/tags/2026.05.1.tar.gz"
  sha256: "26236a354e8cf21806d20a76728b3805ae49c23cfb2eb794fe91d1f0b280298e"
  tar_format: "tar.gz"
patches:
  "2026.05.1":
    - patch_file: "patches/0001-ubootenv-optional-when-libubootenv-missing.patch"
      patch_description: "libubootenv 在 OHOS 制品仓无任何版本（conan list -r=ohpcd '*uboot*' 0 命中；u-boot-tools/2026.07 只装 bin 工具、不导出 libubootenv；sysroot 无 libuboot.h）。上游 2026.05.1 对它的使用是硬依赖而非可选：core/Makefile 的 obj-y 恒含 swupdate_vars.o，include/swupdate_vars.h 顶层 #include <libuboot.h>，Makefile.flags:112 恒 'LDLIBS += pthread ubootenv json-c'。本补丁新增 Kconfig 符号 UBOOTENV（depends on HAVE_LIBUBOOTENV，default y），把该面收敛为可编译出的显式空洞：无 libubootenv 时三个头/实现按 #else 分支给出 -ENOTSUP 语义（不静默吞写操作），Makefile.flags 只在 CONFIG_UBOOTENV=y 时链接 -lubootenv；有 libubootenv 的平台上行为与上游逐字节一致"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-no-pthread-cancellation-sigterm.patch"
      patch_description: "OHOS libc 不提供 POSIX 线程取消：readelf --dyn-syms 实测 libc.so 中 pthread_cancel/pthread_testcancel/pthread_setcanceltype 计数全 0（pthread_create/pthread_kill 为 1，libpthread.a 仅 8 字节占位）。上游 SIGTERM 处理器 pthread_cancel(network_daemon) 因此链接失败（ld.lld: undefined symbol: pthread_cancel）。本补丁按 __OHOS__ 分支改为 exit(exit_code)：仍走到上游注释所述的 atexit() 收尾，且守护主循环不会永久阻塞在 pthread_join()；非 OHOS 平台保持上游 pthread_cancel 原样。engine 命中 E085（OHOS/musl 不实现 POSIX 线程取消），本补丁即该条目的 compile-out/stub 分支；按 R8 例外在 PR 正文说明平台宏理由"
      patch_type: "portability"
    - patch_file: "patches/0003-test-makefile-keep-buildtime-ld-library-path.patch"
      patch_description: "test/Makefile 的 EXECUTE_TEST 用 'LD_LIBRARY_PATH=$(objtree)' 整体覆盖继承值，设备上被覆盖掉的正是 conan 依赖（libssl/libcurl/libconfig/libjson-c…）的 .so 目录，用例会在加载期报 'Error loading shared libraries'。改为追加继承值（$(objtree):${LD_LIBRARY_PATH}），上游在有 rpath/系统库的构建机上行为不变"
      patch_type: "portability"
    - patch_file: "patches/0004-add-ohos-defconfig.patch"
      patch_description: "新增 configs/ohos_defconfig：按 OHOS 制品仓实有依赖（openssl/libconfig/json-c/libcurl/libarchive/lua/zlib/libmtd/libubi）选定功能面——含签名校验/加密（openssl）、下载与 hawkBit（libcurl/json-c）、mongoose web 服务器、Lua 扩展、归档处理器，以及 MTD/CFI/UBIVOL（libmtd+libubi 制品）；不引用 libubootenv/zeromq/librsync/libwebsockets/uriparser/zstd/zck/wolfssl/mbedtls 等缺失项，kconfig 在配方显式 HAVE_*=n 下自动收敛（UBOOT 与对应 handler 不可选）"
      patch_type: "feature"
    - patch_file: "patches/0005-makefile-harmonyos-uses-linux-mtd-abi.patch"
      patch_description: "HAVE_LINUX 是 MTD/UBIVOL 面（以及 test_flash_handler 单测二进制）的唯一总闸：上游只认 uname -s == Linux，设备上 uname 返回 HarmonyOS ⇒ HAVE_LINUX=n 会把 CONFIG_MTD/CFI/UBIVOL 整体静默收敛。OHOS 是 Linux 内核 ABI 上的 ELF 用户态、MTD/UBI ioctl 接口同源（libmtd 2.3.1 制品提供 mtd-user.h/mtd-abi.h 与 libmtd.a/libubi.a），故把 HarmonyOS 并入 Linux 分支；HAVE_LINUX 在 C 代码中零引用（仅 Kconfig depends 与 Makefile.deps 默认值），其余平台行为不变"
      patch_type: "portability"
    - patch_file: "patches/0006-test-hash-backport-upstream-return-fix.patch"
      patch_description: "回移上游修复 648eff6da1f0 \"test: Fix expected hash error value\"（2026-07-29，晚于本 tag）：test_hash_vectors 断言 swupdate_HASH_final() 返回 1，而全部 provider（openssl 0/成功、mbedtls 0/成功）与全部调用方（core/cpio_utils.c:573、corelib/channel_curl.c:1510 均以 <0 判错）的约定是成功返回 0 ⇒ 本 tag 上该用例在本机与上游 CI 均必失败。仅改一处期望值，测试强度不变（同一用例仍校验 sha1/sha256 四组标准向量与长度）"
      patch_type: "bugfix"
