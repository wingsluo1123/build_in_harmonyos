knowledge_ref: []

knowledge_gained:
  - "OHPCD imlib2/1.9.1 is built with --without-x and has no imlib display/drawable symbols."
  - "sxiv can keep the imlib2 image pipeline and provide its seven missing X11 drawable symbols with a libX11 compatibility object."
  - "The compatibility object uses XCreateImage/XPutImage and blends imlib2 RGBA pixels against the destination drawable."
  - "The sxiv Makefile can be built without source patches by overriding objs, CPPFLAGS, CFLAGS and LDLIBS from the Conan recipe."
