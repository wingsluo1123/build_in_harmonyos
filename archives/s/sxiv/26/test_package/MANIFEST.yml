package: sxiv/26
homepage: "https://github.com/muennich/sxiv"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
  - file: test_sxiv.c
    description: "The installed sxiv binary is a regular executable file (1 assertion)"
    command: "./test_sxiv <sxiv>"
  - file: test_sxiv_scaling.c
    description: >-
      The production scaling predicate is exercised with identity dimensions,
      a color modifier, a source offset, a source crop, a smaller destination,
      and a larger destination. The mismatched-destination cases cover the
      stride over-read fixed in ohos_x11_render.c (6 assertions).
    command: "./test_sxiv_scaling"
  - file: conanfile.py
    description: "Runs the installed sxiv -v path and asserts the exact output 'sxiv 26' (1 assertion)"
    command: "<sxiv> -v"

test_package_assertion_count: 8
assertion_count: 8
