# 软件级 manifest（跨版本共享）
software: sxiv
display: "sxiv"
description: "Simple X image viewer: lightweight keyboard-driven image viewer built on Imlib2 and X11"
category: gfx
homepage: "https://github.com/muennich/sxiv"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "OHPCD imlib2/1.9.1 is built with --without-x; sxiv supplies the seven missing X11 drawable functions in a libX11-backed compatibility object while retaining Imlib2 loading, scaling and colour modifiers"
    - "AUTORELOAD=nop disables the upstream inotify backend because OHOS does not provide inotify"
    - "Dependency include/lib paths and the object list are injected through make command-line variables; upstream sources remain unpatched"
    - "Consumer test exercises the installed binary and its shared-library closure without requiring an X display"

  common_dependencies:
    - "libx11/1.8.13"
    - "libxft/2.3.9"
    - "fontconfig/2.18.3"
    - "imlib2/1.9.1"
    - "giflib/6.1.3"
    - "libexif/0.6.26.1"
    - "freetype/2.14.3.1"

versions:
  "26":
    status: built
    build_date: 2026-10-13
