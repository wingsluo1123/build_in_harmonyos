#
# Patches:
#   0001: config.guess — add HarmonyOS recognition before NetBSD case
#   0002: config.sub — add linux-ohos to maybe_os list + explicit case

sources:
  url: "https://sylpheed.sraoss.jp/sylpheed/v3.7/sylpheed-3.7.0.tar.gz"
  sha256: "6619a016c2ab772cda4d37598f675a2ab747db723800295d440fba04c08eccd9"

patches:
  - patch_file: "patches/0001-config-guess-harmonyos.patch"
    patch_description: "config.guess: add *:HarmonyOS:*:* branch before NetBSD to recognize OHOS as <machine>-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-linux-ohos.patch"
    patch_description: "config.sub: add linux-ohos* to maybe_os list and -linux-ohos* case to set os=-linux-ohos (prevent linux-gnu fallback)"
    patch_type: "portability"
