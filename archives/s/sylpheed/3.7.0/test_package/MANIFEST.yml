package: sylpheed/3.7.0
homepage: "https://sylpheed.sraoss.jp/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "Consumer driver: invokes test_sylpheed.sh via CONFIG_SHELL bash (self.run, aa3d precedent)"
    command: ""
  - file: test_sylpheed.sh
    description: "HarmonyOS consumer test (non-assertion): sylpheed --version + file libsylph-0.so.1.3.0 + file libgtk-x11-2.0.so.0 (OHOS has no ldd/readelf, `file` validates ELF arm64 shared-library closure)"
    command: "test_sylpheed.sh <sylpheed_bin> <libsylph> <libgtk2>"

assertion_count: 0
