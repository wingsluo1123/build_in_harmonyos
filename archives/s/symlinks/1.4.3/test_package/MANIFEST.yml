# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: symlinks/1.4.3
homepage: "https://github.com/brandt/symlinks"

# 上游测试命令
upstream_check_command: "make check"

# symlinks is a Makefile-only project with no upstream test suite
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run symlinks --version to verify binary works"
    command: "symlinks --version"

# 测试断言总数
assertion_count: 1
