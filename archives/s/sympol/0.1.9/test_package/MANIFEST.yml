name: sympol
version: "0.1.9"
test_type: upstream_and_consumer
upstream_tests:
  source: "https://github.com/tremlin/SymPol/tree/v0.1.9"
  command: "python3 upstream.py <source-dir> <build-dir>"
  registered_entries: 2
  case_count: 30
  cases:
    - "contrib/test-sympol.pl: all 28 original test_polyhedron calls"
    - "test/test-rank.cpp: matrix_rank and matrix_rank2"
consumer_tests:
  command: "consumer && python3 test_sympol.py <installed-bin> <private-work>"
  case_count: 2
  assertion_count: 4
  description: "One QArray API consumer (four assertions) plus one installed CLI V-H-V exact square workflow in a UTF-8 path containing spaces"
harmony_specific_tests:
  case_count: 1
  command: "python3 test_sympol.py <installed-bin> <private-work>"
  description: "Use the installed OHOS executable and its real shared-library closure to read, convert, serialize and reconstruct a polytope; compare exact rational facets and vertices"
validation_status: pending_target_execution
