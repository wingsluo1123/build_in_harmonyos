# published | built | failed | archived
# built：W3 本地 CI（ci/conan/build_and_test.sh）与 conan create 全绿（63/63 用例），
# 但 conan-verify 的 G1 只按 C/C++ 配方形态检查 `export_sources` 与 `apply_conandata_patches`
