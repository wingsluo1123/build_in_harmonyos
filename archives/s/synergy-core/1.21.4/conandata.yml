sources:
  url: "https://github.com/symless/synergy-core/archive/refs/tags/v1.21.4.tar.gz"
  sha256: "369d789ae5616e6e43b5eeb6feac644ab7d3384c138748a13ed9f7e1df7361a6"

patches:
  - patch_file: "patches/0001-cmake-Libraries.cmake.patch"
    patch_description: "OHOS: apply the recipe-exported SYNERGY_CONAN_INCLUDE_DIRS/SYNERGY_CONAN_LIB_DIRS cache variables as directory-level include_directories()/link_directories() so every target's compile and link command lines see the conan X11 client headers and libraries; append to (not overwrite) CMAKE_REQUIRED_INCLUDES/CMAKE_LIBRARY_PATH in configure_xorg_libs so the probe paths survive; normalize the XRRNotifyEvent size probe to a numeric default so an absent libxrandr leaves HAVE_X11_EXTENSIONS_XRANDR_H at 0 instead of an empty controlling expression; drop the glib-2.0 pkg-config probe (only the libportal sources consume glib and they are not selected in this X11-only delivery)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-lib-base-PriorityQueue.h.patch"
    patch_description: "OHOS: clang 15 libc++ has no C++20 ranges algorithms (use classic iterator-pair std::push_heap/pop_heap/make_heap) and requires typename before dependent type names on the alias right-hand side even in C++20 mode (GCC-accepted, clang-rejected)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-lib-base-String.cpp.patch"
    patch_description: "OHOS: clang 15 libc++ lacks std::ranges::lexicographical_compare; use the classic iterator-pair std::lexicographical_compare"
    patch_type: "portability"
  - patch_file: "patches/0004-src-lib-deskflow-KeyState.cpp.patch"
    patch_description: "OHOS: clang 15 libc++ lacks std::ranges::set_difference; use the classic iterator-pair std::set_difference"
    patch_type: "portability"
  - patch_file: "patches/0005-src-lib-deskflow-unix-X11LayoutsParser.cpp.patch"
    patch_description: "OHOS: clang 15 libc++ lacks std::ranges::find_if; use the classic iterator-pair std::find_if (four sites)"
    patch_type: "portability"
  - patch_file: "patches/0006-src-lib-server-InputFilter.cpp.patch"
    patch_description: "OHOS: clang 15 libc++ lacks std::ranges::partial_sort; use std::sort over iterator pairs and include <algorithm>"
    patch_type: "portability"
  - patch_file: "patches/0007-src-lib-server-Server.cpp.patch"
    patch_description: "OHOS: clang 15 libc++ lacks std::ranges::find; use the classic std::find over iterators"
    patch_type: "portability"
  - patch_file: "patches/0008-src-lib-platform-XWindowsKeyState.cpp.patch"
    patch_description: "OHOS: clang 15 libc++ lacks std::ranges::fill; use the classic std::fill over iterators"
    patch_type: "portability"
  - patch_file: "patches/0009-src-lib-platform-XWindowsClipboard.cpp.patch"
    patch_description: "OHOS: clang 15 libc++ lacks std::ranges::find_if/for_each; use the classic iterator-pair algorithms"
    patch_type: "portability"
  - patch_file: "patches/0010-src-lib-arch-unix-ArchMultithreadPosix.cpp.patch"
    patch_description: "OHOS: the OpenHarmony libc does not declare pthread_setcancelstate/pthread_setcanceltype (POSIX cancellation is absent); drop the deferred-cancel thread setup - deskflow cancels cooperatively via its own m_cancel flag and SIGWAKEUP wakeup"
    patch_type: "portability"
  - patch_file: "patches/0011-src-apps-deskflow-core-deskflow-core.cpp.patch"
    patch_description: "OHOS: guard the QSharedMemory single-instance duplicate check with QT_NO_SHAREDMEMORY (the OpenHarmony Qt5 package is built with -no-feature-sharedmemory, verified by probe); the duplicate check degrades to running every invocation"
    patch_type: "portability"
  - patch_file: "patches/0012-src-unittests-CMakeLists.txt.patch"
    patch_description: "OHOS/Qt5: resolve the Qt Test package through the version-agnostic QT_VERSION_MAJOR name in create_test() and gate the gui test subdirectory behind BUILD_GUI so the headless core build only registers buildable suites"
    patch_type: "portability"
  - patch_file: "patches/0013-src-unittests-common-CMakeLists.txt.patch"
    patch_description: "OHOS: add a SKIP_I18N_TESTS option excluding I18NTests when the toolchain provides no Qt LinguistTools (lrelease) to compile the deskflow_*.qm artifacts the suite copies"
    patch_type: "portability"
  - patch_file: "patches/0014-src-apps-deskflow-core-CMakeLists.txt.patch"
    patch_description: "OHOS: gate install(TARGETS RUNTIME_DEPENDENCY_SET) behind WIN32; the runtime dependency set only feeds the WIN32 DLL deploy and the OHOS-hosted CMake rejects the keyword on this platform"
    patch_type: "portability"
  - patch_file: "patches/0015-src-lib-arch-unix-ArchNetworkBSD.cpp.patch"
    patch_description: "OHOS: clang 15 libc++ lacks make_shared for array types (P0970); allocate the pollfd array through new[] with value initialization wrapped in the shared_ptr array deleter"
    patch_type: "portability"
  - patch_file: "patches/0016-src-unittests-common-SettingsTests.cpp.patch"
    patch_description: "OHOS/Qt5: include <QRegularExpression> explicitly in SettingsTests; Qt6 headers transitively provide it while Qt5 do not"
    patch_type: "portability"
  - patch_file: "patches/0017-src-unittests-base-LogTests.cpp.patch"
    patch_description: "OHOS/Qt5: include <QRegularExpression> explicitly in LogTests; Qt6 headers transitively provide it while Qt5 do not"
    patch_type: "portability"
