patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "synscan 5.02 是 2011 年老 autotools 纯工具（Makefile.in + configure），产物为 synscan 与 sslog 两个二进制；configure 硬性要求 libpcap（AC_ERROR），而 synscan 二进制本身并不用 pcap（只有 sslog 用），但构建仍需满足 configure 探测。"
  - "配方把已发布的 libpcap/1.10.6 的 include/pcap/pcap.h 与 lib/libpcap.a 暂存到 build 私有 stage 目录，configure 传 --with-libpcap=<stage>；该老 configure 对 --with-libpcap 只需 -f $withval/pcap.h -a -f $withval/libpcap.a 文件存在，不做链接测试，随后设 CFLAGS -I/-L/-lpcap。"
  - "该老 autoconf（2011, ~2.59）只定义 ac_config_guess/ac_config_sub 字符串从不执行，因此不需要 config.guess/config.sub，也无需 --build/--host 三元组；仅在明确 CC 下用 AC_PROG_CC，OHOS 上可直接 configure。"
  - "net.c/common.c/obuf.c（纯解析逻辑，零 libpcap 依赖）归档为 libsynscan.a 随包发布：net_parse_portlist/net_parse_iplistv4/迭代器/net_iplistv4_sum/net_portlist_sum/net_ipv4_parse_flags 等是无可 raw socket/root 依赖、真机可跑的核心逻辑，test_package 链接 libsynscan.a 以 20 项断言覆盖。"
  - "synscan/sslog -V 在 parse_args 阶段即 exit(EXIT_SUCCESS)，早于 root 检查与 raw socket/pcap 打开；-h 打印用法并 exit(1)。真机消费者测试用 -V/-h 做二进制冒烟，不触碰需要 root 的扫描路径。"
  - "二进制安装不走 make install（其 install 目标 strip + @INSTALL_PROGRAM@，在 OHOS 上可能有意外的 strip/install 兼容问题），package() 手动 copy 两个二进制 + 静态库 + 5 个公共头文件。"
  - "net_parse_portlist 用 strtok/strchr 原地改写入参，必须传可变缓冲区（字符串字面量会段错误）；net_portlist_add 头插法导致迭代顺序与解析顺序相反；net_parse_portlist_item 对端口号无上界校验（70000 被截断为 4464 仍接受）；net_ipv4_parse_flags 对未知标志只 warning 不返回错误。这些上游真实行为在测试断言里如实反映（证伪后按实际行为断言）。"

