software: syntax-highlighting
display: "Syntax Highlighting"
description: "KDE Frameworks 6 syntax highlighting engine (libKF6SyntaxHighlighting) for Kate/KWrite-style consumers"
category: library
homepage: "https://invent.kde.org/frameworks/syntax-highlighting"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt6LinguistTools not published to ohpcd"
    - "BUILD_EXAMPLES option patched in and set to OFF: example apps not needed for library packaging"
    - "QRC_SYNTAX=ON embeds syntax definitions/themes as Qt resources"
    - "C++20 (std::strong_ordering) pinned via CMakeLists patch: profile compiler.cppstd=17 shadows recipe-injected CACHE CMAKE_CXX_STANDARD=20"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
    - "Upstream 6 CTest entries run headless under QT_QPA_PLATFORM=offscreen"
  common_dependencies:
    - qtbase
    - ecm
    - perl

versions:
  "6.28.0":
    status: built
    build_date: "2026-10-17"
    conan_ref: "syntax-highlighting/6.28.0"
