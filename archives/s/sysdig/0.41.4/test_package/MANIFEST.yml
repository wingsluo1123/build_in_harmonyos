# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sysdig/0.41.4
homepage: https://github.com/draios/sysdig

# sysdig 上游测试为集成测试 shell 脚本，依赖内核驱动模块
# 鸿蒙平台无对应接口，无法运行
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - name: "csysdig_trace_regression"
    source: test/csysdig_trace_regression.sh
    description: "csysdig 追踪回归测试 (依赖内核驱动模块，鸿蒙平台无法运行)"
  - name: "sysdig_batch_parser"
    source: test/sysdig_batch_parser.sh
    description: "sysdig 批量解析测试 (依赖内核驱动模块，鸿蒙平台无法运行)"
  - name: "sysdig_trace_regression"
    source: test/sysdig_trace_regression.sh
    description: "sysdig 追踪回归测试 (依赖内核驱动模块，鸿蒙平台无法运行)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "sysdig --version 版本号验证"
    command: "conan test"

# 测试断言总数
assertion_count: 1
