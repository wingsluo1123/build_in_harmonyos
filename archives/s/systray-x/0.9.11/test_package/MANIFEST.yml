# test_package/MANIFEST.yml
# systray-x 0.9.11 测试声明文件

package: systray-x/0.9.11
homepage: "https://github.com/Ximi1970/systray-x"

# systray-x 是 Thunderbird 系统托盘扩展原生应用，无独立测试套件
upstream_check_command: ""
upstream_test_in_build: false

upstream_tests: []

# test_package 自带测试
test_package_tests:
  - file: test_ohos_closure.py
    description: "鸿蒙特有权测试 — 验证 SysTray-X 二进制 ELF NEEDED 条目包含 libX11.so"
    command: "python3 test_ohos_closure.py"
