software: tabixpp
display: "tabixpp"
description: "C++ wrapper to the tabix indexer for bgzf-compressed files"
category: data
homepage: "https://github.com/vcflib/tabixpp"
license: MIT
build_system: makefile
ohos_adaptation:
  key_points:
    - "使用仓库根 raw Makefile 为唯一构建入口（make all / make test），无 configure/CMake"
    - "发布包内 htslib 子模块为空，改用外部 Conan 包 htslib/1.24-r0（INCLUDES/LIBPATH 覆盖传入）"
    - "链接行去掉 htslib 已禁用的 curl/bz2，补静态 libhts.a 所需的 libdeflate"
  common_dependencies:
    - htslib
versions:
  "1.1.2":
    status: built
    build_date: "2026-09-26"
    conan_ref: "tabixpp/1.1.2"
