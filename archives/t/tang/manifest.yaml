software: tang
display: "tang"
description: "Network-bound cryptographic key release service and key management commands"
category: security
homepage: "https://github.com/latchset/tang"
license: "GPL-3.0-or-later"
build_system: meson

ohos_adaptation:
  key_points:
    - "Conan PkgConfigDeps supplies the http-parser include and link metadata that upstream's hard-coded /usr/local/include probe cannot discover."
    - "The complete upstream Meson suite is retained using a writable build-tree TMPDIR and Python fallbacks for unavailable ss and shuf commands."
    - "socat is a test tool requirement so all upstream socat integration cases execute instead of skipping."
    - "Meson's install step relinks tangd and invalidates the OHOS ELF signature, so package() preserves the tested build artifact byte-for-byte."
  common_dependencies:
    - "jose/15"
    - "http-parser/2.9.4"

versions:
  "15":
    status: built
    build_date: "2026-10-13"
    conan_ref: "tang/15"
    upstream_tests: "9/9 passed, 0 skipped"
    consumer_tests: "1/1 passed"
    note: "Upstream latchset/tang v15; device conan create and packaged daemon/CLI consumer test passed."
