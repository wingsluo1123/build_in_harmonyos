package: target-factory/2.5
homepage: "https://github.com/Xilinx/Vitis-AI"
# Upstream test/CMakeLists.txt builds three executables and does not register
# ctest entries; the binaries are executed directly by build().
upstream_test_in_build: true
upstream_tests:
  - file: "test/test_factory.cpp"
    description: "Create a DPU target by name (DPUCAHX8H_ISA2), print type/ISA/feature code/fingerprint and dump the target description"
    command: "./test/test_factory DPUCAHX8H_ISA2"
    result: passed
  - file: "test/test_fingerprint.cpp"
    description: "Create a DPU target from a numeric fingerprint and dump it; the fingerprint is taken from test_factory output"
    command: "./test/test_fingerprint <fingerprint>"
    result: passed
  - file: "test/test_lib_info.cpp"
    description: "Report the target-factory library name and id from the TargetFactory static API"
    command: "./test/test_lib_info"
    result: passed
test_package_tests:
  - file: test_target_factory.cpp
    description: "HarmonyOS-specific consumer test: target registration, creation by name, type/ISA checks, fingerprint round-trip in both directions, description dump file and get_lib_name through the installed libtarget-factory"
    command: "./test_target_factory"
assertion_count: 12
upstream_test_total: 3
upstream_test_count_method: source_files
