# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tass64/1.60.3243
homepage: "https://tass64.sourceforge.net/"

# 上游测试命令
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tass64 无自动化测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.asm
    description: "汇编简单6502程序，验证64tass二进制可正常工作"
    command: "64tass test.asm -o test.prg"

# 测试断言总数
assertion_count: 2
