software: tcping
display: "tcping"
description: "非阻塞式 TCP 端口连接测试工具，通过 TCP 3 次握手检测端口开放/关闭/超时状态"
category: network
homepage: "https://github.com/mkirchner/tcping"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure 脚本"
    - "Makefile 无 install 目标，需补丁添加 DESTDIR/PREFIX 支持"
    - "无外部依赖，仅使用 POSIX sockets API"
  common_dependencies: []

versions:
  - version: "2.1.0"
    status: published
    build_date: "2026-07-15"
