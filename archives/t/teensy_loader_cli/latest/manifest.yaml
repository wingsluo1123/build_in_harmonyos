software: teensy_loader_cli
# 版本线 manifest 模板
# 文件位置: archives/{letter}/{name}/latest/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "latest"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: makefile

# 编译日期 (YYYY-MM-DD)
build_date: "2026-08-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/PaulStoffregen/teensy_loader_cli/archive/refs/tags/2.3.tar.gz"

  # 源码校验和
  sha256: "d9c5357d7e8b99e9a9ae93f5e921c35a133a4a5d399f57eec10f3a606be5d89f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项 (平面字符串格式)
  configure_options: ""

  # 编译依赖列表 (格式: name/version)
  dependencies:
    - libusb/1.0.27

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - 0001-teensy_loader_cli.c-libusb-1.0.patch

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 项目，无 autotools/configure，直接调用编译器构建"
  - "上游 Linux 分支使用 libusb-0.1 compat API (usb.h / -lusb)，已移植到 libusb 1.0"
  - "libusb 1.0 头文件位于 include/libusb-1.0/libusb.h，编译时需追加该子目录到 -I 路径"
  - "USB 后端函数已用真实 libusb 1.0 实现: teensy_open/teensy_write/teensy_close/hard_reboot/soft_reboot"
  - "错误处理使用 libusb_strerror(真实返回码)，不再硬编码错误码"
  - "AutotoolsToolchain 生成 CC/CFLAGS/LDFLAGS 环境变量，配合 libusb cpp_info 直接编译"
