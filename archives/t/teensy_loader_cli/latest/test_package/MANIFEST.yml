# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: teensy_loader_cli/latest
homepage: "https://github.com/PaulStoffregen/teensy_loader_cli"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "校验 --list-mcus 输出，并以 --mcu=atmega32u4 -b 触发真实 libusb 设备枚举路径，断言无设备时明确报错而非静默成功"
    command: "test_package"
  - file: test.sh
    description: "对打包后的真实可执行文件重复上述两项校验（MCU 列表 + 真实 USB 枚举路径）"
    command: "sh test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
