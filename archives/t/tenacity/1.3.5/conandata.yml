sources:
  # tenacity 1.3.5 官方 release（tenacityteam/tenacity）
  # R39: 只写官方原始 URL，不手动加镜像前缀（CI 自动 fallback）
  # 注：Codeberg 官方镜像 codeberg.org/tenacityteam/tenacity/archive/v1.3.5.tar.gz
  #     HTTP 200 可达，但实测响应体会被截断（gzip -t 失败），故以 GitHub 为主用源。
  url: "https://github.com/tenacityteam/tenacity/archive/refs/tags/v1.3.5.tar.gz"
  sha256: "3bcbbbddf3d7ed9036d5c131c4dd3cc6b037c0888c6b6099c7c149c9dbfcdcb8"

patches:
  "1.3.5":
    # OHOS 适配补丁 1/9：wxWidgets 降为 base-only。
    # ohpcd 已合入的 wxWidgets 全部版本以 wxUSE_GUI=OFF 构建，仅提供 wxBase 组件
    # （libwx_baseu-*.a / libwxregexu-*.a），无 core/html/net GUI 组件；而上游
    # find_package(wxWidgets 3.1 REQUIRED COMPONENTS base core html net) 为致命缺失。
    # 同时把 include(${wxWidgets_USE_FILE}) 加空值保护，并对 CMakeDeps 的目标名做
    # 兼容桥接（3.2.10 提供小写 wxwidgets::wxwidgets；3.3.x 的 cmake_target_name
    # 即驼峰 wxWidgets::wxWidgets，与上游同名，该桥接分支自动跳过）。
    - patch_file: "patches/0001-ohos-wxwidgets-base-only.patch"
    # OHOS 适配补丁 2/9：去掉 GLIB/GTK 的 REQUIRED 探测。
    # 二者仅服务被跳过的 GUI 前端（src/ 的 GTK 集成），保留的 libraries/lib-*
    # 对 glib/gtk 零直接使用；顺带消除依赖图版本冲突
    # （glib→fontconfig→expat/2.8.2.1 与 wxwidgets→expat/2.8.2 互斥）。
    - patch_file: "patches/0002-ohos-skip-glib-gtk-probe.patch"
    # OHOS 适配补丁 3/9：只构建 libraries/lib-* 非 GUI 核心库。
    # 跳过 src/（GUI 前端，346 个文件直接用 wxWindow 等 GUI 类）、modules/、
    # plug-ins/、nyquist/、lib-src/libnyquist 及 help/images/locale/scripts。
    # 手法与本仓库 aegisub 3.4.2（libaegisub 核心库 + 禁用 GUI 前端）同构。
    - patch_file: "patches/0003-ohos-libraries-only.patch"
    # OHOS 适配补丁 4/9：为保留的 17 个 lib-* 核心库补齐 install() 规则。
    # 上游 libraries/ 无任何安装规则（GUI 前端的安装规则在 src/CMakeLists.txt，
    # 已随 GUI 前端跳过）；头文件按 libraries/<lib>/ 相对结构装到
    # include/tenacity/<lib>/，与各目标 PUBLIC ${TARGET_ROOT} 包含目录对应。
    - patch_file: "patches/0004-ohos-libraries-install.patch"
    # OHOS 适配补丁 5/9：移除 lib-project/Project.cpp 未使用的 <wx/display.h>。
    # wxDisplay 属 wxWidgets GUI 组件，OHOS 制品头文件树不含 wx/display.h；
    # 而该文件全程未使用 wxDisplay（全树核验零命中），属 Audacity 时代残留。
    - patch_file: "patches/0005-ohos-drop-wx-display-include.patch"
    # OHOS 适配补丁 6/9：不让可选的 FLAC 探测变成硬失败。
    # FindFLAC++.cmake 内部写死 find_package(FLAC REQUIRED)，而顶层对 FLAC 的探测
    # 是可选的（find_package(FLAC++) → cmake_dependent_option(FLAC ... OFF)）；
    # OHOS 未打包 FLAC，其余可选编解码器（id3tag/MAD/twolame/Matroska/Ogg/Vorbis…）
    # 都只是打印 "disabled" 并继续，FLAC 却会中止 configure，行为不一致。
    - patch_file: "patches/0006-ohos-flac-probe-not-required.patch"
    # OHOS 适配补丁 7/9：桥接 EXPAT::EXPAT 与 Conan 的小写 expat::expat。
    # conan_toolchain.cmake 设 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，find_package(EXPAT)
    # 走 config 模式得到 expat::expat，而 libraries/lib-xml 链接 CMake 内建模块命名的
    # EXPAT::EXPAT，generate 阶段报 "target was not found"。手法同补丁 1 对 wxWidgets 的处理。
    - patch_file: "patches/0007-ohos-expat-target-bridge.patch"
    # OHOS 适配补丁 8/9：Internat.cpp 的 wxPathFormat 兜底。
    # 该变量仅在 __WXMAC__/__WXGTK__/__WXMSW__ 三个 GUI 端口宏分支下声明，OHOS 用
    # wxUSE_GUI=OFF 的 wxBase 制品，三者皆未定义 → "use of undeclared identifier 'format'"。
    # 补一个 #else 兜底取 wxPATH_UNIX（OHOS 属 POSIX 类系统），与同仓库 lib-files/FileNames.cpp
    # 中上游既有的 #else 写法一致。
    - patch_file: "patches/0008-ohos-internat-pathformat-fallback.patch"
    # OHOS 适配补丁 9/9：FileNames.cpp 的 magic.h 绝对路径 include。
    # 上游写作 #include "/usr/include/linux/magic.h"，仅在宿主 sysroot 恰为
    # /usr/include 时成立；交叉编译 sysroot 在 SDK 内部另处，报 fatal error:
    # "'/usr/include/linux/magic.h' file not found"。改为标准尖括号引入，
    # OHOS sysroot 的 linux/magic.h 同样提供本文件所用的 MSDOS_SUPER_MAGIC。
    - patch_file: "patches/0009-ohos-filenames-magic-h-relative.patch"
