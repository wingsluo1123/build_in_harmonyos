# test_package/MANIFEST.yml
# 上游测试声明文件
#
# tenacity 1.3.5 上游测试：全树 `add_test` / `enable_testing` / `include(CTest)` /
# `add_custom_target(check` **零命中**，未接入 CTest。`tests/` 目录存在
# （SequenceTest.cpp、SimpleBlockFileTest.cpp、ProjectCheckTests/、octave/、
# samples/、results/）但不构成构建或测试目标——唯一提及它的
# `scripts/CMakeLists.txt:43-44` 是传给 `add_custom_target` 的**源码 tarball 打包清单**
# （配合 `set( TLD "tenacity-minsrc-…" )` 与 `tar.xz`），属打包数据清单，不产生测试目标；
# 且其中 SequenceTest.cpp / SimpleBlockFileTest.cpp 引用的 DirManager.h 与
# blockfile/SimpleBlockFile.h 在 1.3.5 源码中已不存在（Audacity 时代残留），
# 即便手工纳入构建也无法编译。
# 故上游自动化测试 **0/0**（附技术原因，如实申报，不以 test_package 结果替代）。

package: tenacity/1.3.5
homepage: "https://tenacityaudio.org"

# 上游测试命令：不存在（上游未注册任何测试目标）
upstream_check_command: ""

# conanfile.py build() 中是否集成上游测试：否（本包仅交付 17 个非 GUI 静态核心库）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 自带的测试（消费者视角验证，本包新增）
test_package_tests:
  - file: test_tenacity.cpp
    description: >-
      消费者用例：真实链接全部 17 个交付归档并调用真实 API ——
      lib-math 的 SamplesToFloats / ClearSamples / ReverseSamples / SAMPLE_SIZE /
      SAMPLE_SIZE_DISK（断言取值由源码推导：CONVERT_DIV16 = float(1<<15)，
      SAMPLE_SIZE(F) = F>>16），lib-string-utils 的 Tenacity::ToUTF8 / ToWString
      UTF-8↔wchar_t 往返，以及 platform 组的 OHOS 64 位指针、float 采样宽度、
      DISPLAY/WAYLAND_DISPLAY 缺省的无头 fail-closed 断言。
    command: "./test_tenacity --selftest"
  - file: elf_check.c
    description: >-
      交付物架构校验：对 17 个归档逐一校验 ar magic（!<arch>\n）与首个 ELF 成员的
      e_machine == EM_AARCH64 (183)，确保交付的是 aarch64 目标而非宿主 x86_64 产物。
    command: "./elf_check <17 个 lib-*.a 归档>"

# test_package 消费者用例断言总数（22 项 API/平台断言；另 17 项归档架构校验）
assertion_count: 22
