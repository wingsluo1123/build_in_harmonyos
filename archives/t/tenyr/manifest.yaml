software: tenyr
display: "tenyr"
description: "32 位 CPU 架构/模拟器的工具链（汇编器 tas、链接器 tld、模拟器 tsim）"
category: utility
homepage: "https://github.com/kulp/tenyr"
license: "MIT"

build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 默认启用 JIT 与 SDL（`ifneq ($(VAR),0)` 在未定义时为真），软件模拟核心须传 JIT=0 SDL=0"
    - "构建需 flex/bison 重新生成 lexer/parser，作为 tool_requires 提供"
    - "clang 严格模式 -Werror=shorten-64-to-32 触发 src/common.h SEXTEND32 精度丢失，打补丁修复"
    - "make -j1 避免 HMDFS jobserver fifo EPERM"
  common_dependencies: []

versions:
  - version: "0.9.9"
    status: built
    build_date: "2026-10-12"
