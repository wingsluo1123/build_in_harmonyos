# 软件级 manifest - termbox2
software: termbox2
display: "termbox2"
description: "Terminal I/O library for writing text-based user interfaces"
category: library
homepage: "https://github.com/termbox/termbox2"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 GNU Make 构建，共享库真实 ELF 为 libtermbox2.so.2.0.0，SONAME 为 libtermbox2.so.2"
    - "HMDFS 不支持 ln -sf 软链接覆盖，打包时把(签名后)ELF 复制为 SONAME/链接名别名"
    - "OHOS 共享库需 binary-sign-tool 自签（objcopy 移除 .codesign + sign）"
    - "上游 tests/ 为 16 个 PHP-FFI + X11 屏幕捕获比对用例，OHOS 无头设备无该工具链，已逐一移植为原生 C 程序并经 PTY 在真机全部执行（test_package 内）"
  common_dependencies: []

versions:
  "2.5.0":
    status: built
    build_date: "2026-09-26"
