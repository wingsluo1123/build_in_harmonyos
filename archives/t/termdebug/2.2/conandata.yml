# conandata.yml — termdebug 2.2
#
# 源：上游作者 G.P. Halkes 的官方站点归档 os.ghalkes.nl/dist/。termdebug 没有官方
# git 仓库（Vcs-Git 指向 Debian 的 salsa 打包仓库，只含 debian/ 目录），也没有 GitHub
# release，所以官方 dist tarball 是唯一一手归档。2026-10-05 实测 HTTP 200，
# Content-Length 148192，Last-Modified 2013-06-23（与上游 News 里 "2.2 released
# 23-Jun-2013" 一致）。
#
# Debian/Ubuntu 的 termdebug_2.2+dfsg.orig.tar.gz 是 +dfsg 重打包（剔除了上游自带
# 文档），sha256 与官方归档不同；本配方按任务要求用官方归档，不用发行版重打包。

sources:
  url: "https://os.ghalkes.nl/dist/termdebug-2.2.tar.bz2"
  sha256: "06bd95bb6eeb1581bc4fbadc0111500f1d016ca0ba34c21ddf39b78857de5969"
  # bzip2 压缩；Conan 的 get() 会按扩展名自动选解压器，这里不覆盖它。
  # （tar_format 只写给 manifest.yaml 的人读，**不能**透传给 get()。）

# 上游源码零改动：所有 OHOS 适配都发生在构建环境层（依赖探测用的 .pc 转发 stub、
# 显式 -I/-L/-D/-O2 导出、就地构建、package() 阶段 ELF 自签名）。
patches: {}
