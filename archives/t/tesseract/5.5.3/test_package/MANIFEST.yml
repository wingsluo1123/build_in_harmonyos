# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tesseract/5.5.3
homepage: "https://github.com/tesseract-ocr/tesseract"

upstream_check_command: "ctest"

upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure --timeout 30"

upstream_test_total: 59
upstream_test_passed: 39
upstream_test_failed: 20
upstream_test_pass_rate: "66.1%"

upstream_failure_categories:
  - category: "leptonica 未启用 TIFF 支持"
    count: 10
    tests: ["apiexample_test", "baseapi_test", "baseapi_thread_test", "layout_test", "resultiterator_test", "pagesegmode_test", "equationdetect_test", "textlineprojection_test", "fileio_test", "commandlineflags_test"]
    reason: "leptonica 构建时禁用了 TIFF，测试图片为 TIFF 格式"
    fix: "在 leptonica 配方中启用 TIFF 支持"
  - category: "缺少 traineddata 语言模型"
    count: 5
    tests: ["loadlang_test", "lang_model_test", "osd_test", "progress_test"]
    reason: "OCR 语言模型文件不在源码/test 子模块中"
    fix: "下载 tesseract-ocr/tessdata"
  - category: "LSTM 计算超时"
    count: 3
    tests: ["lstm_recode_test", "lstm_squashed_test", "lstm_test"]
    reason: "LSTM 神经网络测试在 arm64 上 30s 超时"
    fix: "增加超时或跳过"
  - category: "训练器缺少数据"
    count: 2
    tests: ["lstmtrainer_test", "mastertrainer_test"]
    reason: "训练器需要完整训练数据集"
    fix: "下载训练数据"

upstream_tests:
  - file: unittest/apiexample_test.cc
    description: "API example test"
    status: "failed"
    reason: "leptonica TIFF + traineddata"
  - file: unittest/bitvector_test.cc
    description: "Bit vector test"
    status: "passed"
  - file: unittest/capiexample_test.cc
    description: "C API example test"
    status: "passed"
  - file: unittest/unicharset_test.cc
    description: "Unicharset test"
    status: "passed"

test_package_tests:
  - file: test.cpp
    description: "消费者测试: TessVersion API"
    command: "./test_tesseract"
    status: "passed"

assertion_count: 2
upstream_test_count: 59
upstream_test_passed: 39
upstream_test_failed: 20
