# test_package/MANIFEST.yml
package: texi2html/5.0
homepage: "https://www.nongnu.org/texi2html/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/base_tests
    source: texi2html-5.0/test/base_tests
    description: "Upstream regression suite is present but not run during package build because it is large and documentation-output focused."
    command: "make check"

test_package_tests:
  - file: conanfile.py
    description: "Runs texi2html --version and converts a minimal Texinfo document to HTML."
    command: "conan create ... invokes test()"

assertion_count: 2
