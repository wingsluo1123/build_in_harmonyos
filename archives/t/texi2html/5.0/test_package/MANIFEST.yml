# test_package/MANIFEST.yml
package: texi2html/5.0
homepage: "https://www.nongnu.org/texi2html/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: test/base_tests
    source: texi2html-5.0/test/base_tests
    description: "Upstream make check runs in build(); known NLS/locale/.mo failures are logged and white-listed."
    command: "make check"

test_package_tests:
  - file: conanfile.py
    description: "Runs texi2html --no-validate on a minimal Texinfo document and verifies sample.html is generated."
    command: "conan create ... invokes test() -> texi2html --no-validate sample.texi"

assertion_count: 2
