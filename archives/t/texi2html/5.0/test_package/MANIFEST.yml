# test_package/MANIFEST.yml
package: texi2html/5.0
homepage: "https://www.nongnu.org/texi2html/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: test/base_tests
    source: texi2html-5.0/test/base_tests
    description: "Upstream make check runs in build(); known NLS/locale/.mo failures are logged and white-listed."
    command: "make check"

test_package_tests:
  - file: conanfile.py
    description: "Checks texi2html binary exists and libintl-perl dir is bundled, then invokes test_texi2html.sh."
    command: "conan create ... invokes test() -> binary/libintl checks -> test_texi2html.sh"
  - file: test_texi2html.sh
    description: "Runs texi2html --no-validate sample.texi and asserts sample.html is generated with expected content 'Hello from texi2html'."
    command: "test_texi2html.sh <texi2html_bin> <libintl_dir> <source_dir>"

assertion_count: 4
