# 软件级 manifest
# 文件位置: archives/t/texi2html/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: texi2html

# 显示名
display: "texi2html"

# 一句话描述
description: "Texinfo 文档格式转换工具，将 .texi 文件转换为 HTML"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: build-tool

# 官网 URL
homepage: "https://www.nongnu.org/texi2html/"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "需要 update config.guess/config.sub 支持 OHOS 平台检测"
    - "/bin/sh shebang 改为 /system/bin/sh"
    - "install-sh 权限需修复为 0755"

  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "5.0":
    status: built
    build_date: 2026-07-17