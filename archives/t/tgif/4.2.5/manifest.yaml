version: "4.2.5"
software: tgif
status: built
build_date: "2026-10-18"
conan_ref: "tgif/4.2.5"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/tgif/tgif/4.2.5/tgif-QPL-4.2.5.tar.gz"
  sha256: "2f24e9fecafae6e671739bd80691a06c9d032bdd1973ca164823e72ab1c567ba"
  tar_format: tar.gz
  upstream_release: "tgif-QPL-4.2.5.tar.gz (QPL source release, packed by Debian as tgif_4.2.5.orig.tar.gz — no dfsg repack, byte-identical upstream source)"

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
  dependencies:
    - libx11/1.8.13
    - libxt/1.3.1
    - zlib/1.3.2
  transitive_dependencies:
    - libsm/1.2.6
    - libice/1.1.2
    - xorgproto/2025.1
    - libxcb/1.17.0
    - libxau/1.0.11
    - libxdmcp/1.1.5
    - xtrans/1.6.0
  cc: clang

patches_applied:
  - "0001-Makefile.am.patch"
  - "0002-Makefile.in.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "The 4.2.5 release tarball is dirty: it was packed from an already-configured tree and ships config.status/config.h/config.log/Makefile with a hardcoded srcdir; Conan's out-of-tree (VPATH) build aborts with 'source directory already configured' until they are removed."
  - "Makefile.am sets CFLAGS = <tgif's own -D defines>, which shadows the toolchain CFLAGS; the definitions must move to AM_CPPFLAGS so both the defines and the Conan CFLAGS apply."
  - "configure (Autoconf 2.61) creates its config.status temp directory under 'umask 077'; on HMDFS that directory is not writable even by its owner, so config.status fails with 'Permission denied' (E114)."
  - "tgif references no libXext/libSM/libICE/libXmu symbol; those entries in tgif_LDADD are vestigial and cannot be satisfied by the Conan graph, so they are pruned."
  - "libxt/1.3.1 pins libx11/1.8.13 while libxext/6.4.0 pins libx11/6.4.0; since tgif needs no libXext, the whole graph is aligned on the libxt track."
  - "A parallel make jobserver creates a FIFO under $TMPDIR that HMDFS rejects with EPERM; the build runs make -j1 (E074)."
  - "G0 之外的覆盖范围：conan-verify 的 L2/L4/L5 在工具侧 G4 报「无法找到程序包 ID」后走 skip 分支，字段 PASS 不等于已执行；CI 同构的 L2 冒烟在无 X server 设备上为 skip（非阻断）。"

patch_classification:
  - file: 0001-Makefile.am.patch
    type: build
    platform_only: False
    guard: "none"
  - file: 0002-Makefile.in.patch
    type: build
    platform_only: False
    guard: "none"
  - file: 0003-configure.patch
    type: portability
    platform_only: True
    guard: "none"
