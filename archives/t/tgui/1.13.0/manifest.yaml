  sha256: "6e6000b5b130d6ddf73d593ff62cdd6f5c2045a1f8ffacb10262aedcb7ea7465"
  tar_format: tar.gz

build:
  build_system: cmake
  system: cmake
  configure_options:
    - "-DTGUI_BACKEND=SDL_RENDERER"
    - "-DTGUI_USE_X11=OFF"
    - "-DTGUI_BUILD_TESTS=OFF"
    - "-DTGUI_BUILD_EXAMPLES=OFF"
    - "-DTGUI_BUILD_GUI_BUILDER=OFF"
  dependencies:
    - name: sdl2
      version: "2.30.10"
    - name: sdl2_ttf
      version: "2.24.0"
  cc: clang
  cxx: clang++

backend_info:
  selected: SDL_RENDERER
  reason: "SFML_GRAPHICS backend unavailable (sfml package is partial: System+Network only, missing Graphics/Window modules)"
  alternatives_considered:
    - name: SFML_GRAPHICS
      status: built
      reason: "制品仓 sfml/2.6.1.1 为 partial 配方，缺少 Graphics/Window 模块"
    - name: SDL_RENDERER
      status: built
      reason: "SDL2 和 SDL2_ttf 均有完整 armv8 预编译包"

patches_applied:
  - "0001-cmake-Config-HarmonyOS.patch (ref: tgui-1.13.0-notes)"

knowledge_gained:
  - "TGUI 1.13.0 can be built on HarmonyOS using SDL_RENDERER backend with X11 disabled. (ref: tgui-1.13.0-notes)"
  - "SDL_RENDERER backend requires sdl2 and sdl2_ttf dependencies, both available in the package repository. (ref: tgui-1.13.0-notes)"
  - "X11 support can be disabled via -DTGUI_USE_X11=OFF with only minor impact on mouse cursor rendering. (ref: tgui-1.13.0-notes)"
  - "SFML_GRAPHICS backend is incompatible with partial SFML packages that lack Graphics/Window modules. (ref: tgui-1.13.0-notes)"
  - "Upstream tests require display device initialization, unsuitable for headless CI environments. (ref: tgui-1.13.0-notes)"

test_package:
  framework: cmake
  tests:
    - "Consumer String API assertion"
    - "Consumer Layout API assertion"
    - "Consumer Color API assertion"
  assertion_count: 3
  upstream_source_count: 83
  upstream_runtime_result: skipped_headless_no_display
  note: "All 83 upstream test sources were compiled in the standalone source build; runtime execution requires a display device and was skipped in the headless worker."

