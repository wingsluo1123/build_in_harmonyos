# conandata.yml — theseus 3.3.0
#
# Source provenance (verified 2026-10-13):
# - Official upstream hosts (http://www.theseus3d.org/src/ and
#   https://theobald.brandeis.edu/theseus/src/) are unreachable: theobald
#   fails DNS resolution, theseus3d.org (129.64.68.88) times out on connect,
#   from two independent network paths.
# - The file below is the pristine upstream release as carried by the Debian
#   source pool. sha256 matches three independent records: the checksum
#   MacPorts recorded from the live official site in 2020, the GPG-signed
#   Debian .dsc (theseus_3.3.0-15), and a byte-for-byte comparison of two
#   pool copies (deb.debian.org and the TUNA mirror) downloaded here.
# - deb.debian.org (pool origin) is intermittently stalled from this
#   environment (20 s timeouts on 2026-10-13 after one full 22.5 MB
#   success), so the TUNA mirror of the same Debian pool is used; CI
#   workers (CN) get the same file faster there. If the official upstream
#   site comes back, switch to http://www.theseus3d.org/src/theseus_3.3.0.tar.gz
#   (same file, same sha256).
sources:
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/t/theseus/theseus_3.3.0.orig.tar.gz"
  sha256: "3cfd4f906717f9cb8e77f689fc97059b32df355c0696077034ea99a485e3f2fe"

patches:
  - patch_file: "patches/0001-fix-buffer-sizes-gcc7.patch"
    patch_description: "Increase string buffer sizes so the build survives modern compiler checks (upstream Debian gcc-7.patch, bug #853681)"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-strncpy-overflow.patch"
    patch_description: "Fix digit/name buffer overflows in libmsa/msa.c and MultiPose2MSA.c (upstream Debian 0005_stringbuffer.patch, bug #908459)"
    patch_type: "fix"
  - patch_file: "patches/0003-fix-error-include-case.patch"
    patch_description: "NWfill.c includes lowercase error.h; the header is Error.h - hard error on case-sensitive filesystems (Linux/OHOS), only worked on macOS"
    patch_type: "portability"
