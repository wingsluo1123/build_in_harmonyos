# 版本级 manifest — theseus 3.3.0
# 遵循 ARCHIVE-SPEC v2.0

version: "3.3.0"
software: "theseus"

# 编译状态: built（本地交叉编译通过；CI upload 成功后改 published）
status: built
build_date: "2026-10-13"
build_system: "makefile"

source:
  # 官方源 theseus3d.org / theobald.brandeis.edu 当前不可达（2026-10-13 实测，
  # 双网络路径 DNS 失败/连接超时）；此 URL 为 Debian 源池托管的同一份上游
  # 原始发布文件，sha256 与 MacPorts 2020 年从官网记录的校验和一致。
  url: "https://deb.debian.org/debian/pool/main/t/theseus/theseus_3.3.0.orig.tar.gz"
  sha256: "3cfd4f906717f9cb8e77f689fc97059b32df355c0696077034ea99a485e3f2fe"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make.inc 由 conanfile build() 重新生成（交叉工具链 + GSL 路径）"
  dependencies:
    - gsl/2.8
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-buffer-sizes-gcc7.patch"
  - "0002-fix-strncpy-overflow.patch"
  - "0003-fix-error-include-case.patch"

knowledge_gained:
  - "上游 Makefile 默认 ARCH=libtool（macOS 默认值），Linux/OHOS 必须改 make.inc 为 ar -rvs（上游文档指定 make.inc 即平台扩展点）"
  - "make.inc 默认 OPT 含 -mtune=native，交叉编译必须去掉"
  - "上游无测试套件；真实功能验证 = 上游 examples/README 演示命令 `theseus 1s40.pdb`（10 模型 NMR 家族 ML 超叠）"
  - "gsl 依赖：gsl/2.7 与 gsl/2.8 在 ohpcd 均有 OHOS armv8 预编译二进制；按 main 已绿先例（astrometry.net/dieharder）选 gsl/2.8"
