  filename: "thrax-1.3.10.tar.gz"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Add HarmonyOS platform detection to config.guess (Linux based triplet)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-bin-Makefile.am.patch"
    patch_description: "Keep libfst.a inside --whole-archive for the command line tools so the FST type registration objects survive linking"
    patch_type: "portability"
  - patch_file: "patches/0003-src-bin-Makefile.in.patch"
    patch_description: "Same --whole-archive LDADD fix in the pre-generated Makefile.in used by configure"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-conf-tmpdir-mkdir.patch"
    patch_description: "Replace mktemp -d primary temp-dir branch with $$-$RANDOM + (umask 000 && mkdir) so config.status confXXXX stays writable under HMDFS FUSE uid remap (E011/DRAFT-6507 CI-verified form)"
    patch_type: "portability"
