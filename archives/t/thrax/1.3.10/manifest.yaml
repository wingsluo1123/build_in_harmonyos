# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "FST 类型注册对象只经静态初始化器可达（fst/register.h 的 REGISTER_FST 在 libfst.a:fst-types.o 内为文件局部符号），裸 -l 链接按需抽取时不拉入该成员，运行期 FST 类型表为空 → 读 .far/.fst 报 Unknown FST type \"vector\"、import 语法编译直接 Signal 11"
  - "修复口径：把 -lfst 包进 whole-archive。libtool 会重排两个独立的 -Wl,--whole-archive / -Wl,--no-whole-archive，必须写成单个 -Wl 参数：-Wl,--whole-archive,-lfst,--no-whole-archive"
  - "openfst 包内 .la 记录构建机前缀 '//lib'，libtool 报 cannot find the library '//lib/libfst.la'；在构建目录内做一份只含 .a 的私有库目录并置于 LDFLAGS 首位即可绕开（不改 Conan 缓存），且该 -L 必须是链接行上第一个（顺序反了即复现失败）"
  - "thrax 的 import 相对**当前工作目录**解析（不是语法文件所在目录），且 import 'x.grm' 取同目录同名 x.far；消费者测试必须在语法目录内、按 byte → numbers → example 顺序编译"
  - "thrax 1.3.10 上游无可运行的测试套件：make check 为空操作，唯一的 gtest 驱动 src/bin/regression_test.cc 只在 EXTRA_DIST 中（只分发不构建）"

