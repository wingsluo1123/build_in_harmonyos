# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# thrax 1.3.10 发布包**不含可运行的测试套件**：`make check` 为空操作，上游 test
# 目标未声明任何 TESTS。清点过程与证据见版本目录 notes.md「上游测试清点」。

package: thrax/1.3.10
homepage: "https://www.openfst.org/twiki/bin/view/GRM/Thrax"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游存在但**不可运行**的测试文件（清点留痕，非本次运行的测试）
upstream_tests:
  - file: src/bin/regression_test.cc
    source: thrax-1.3.10/src/bin/regression_test.cc
    description: >-
      上游 gtest 驱动，仅在 src/bin/Makefile.am 的 EXTRA_DIST 中（只分发不构建），
      依赖 absl 且需要未随包分发的 --test_file 语料 → 不可运行，上游可运行测试数 = 0
    command: "(不可运行)"

# test_package 中自带的测试 (消费者视角验证，鸿蒙适配新增)
test_package_tests:
  - file: check_thrax.sh
    description: >-
      消费者全链路用例：thraxcompiler 编译 byte.grm → 编译 import byte.far 的
      example.grm → thraxrewrite-tester 改写三行文本并断言逐行输出 →
      thraxrandom-generator 随机生成；第 3 步为 FST 类型注册表回归护栏
    command: "bash check_thrax.sh <thraxcompiler> <thraxrewrite-tester> <thraxrandom-generator> <grammars> <libdir>"
  - file: conanfile.py
    description: "test() 通过 self.run 调用 check_thrax.sh；交叉编译时退化为产物布局检查"
    command: "conan test test_package thrax/1.3.10"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
