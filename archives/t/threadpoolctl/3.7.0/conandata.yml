sources:
  # 官方 GitHub tag 归档（不是 PyPI sdist）。
  #
  # 原因：PyPI 的 threadpoolctl-3.7.0.tar.gz **只含 5 个文件、不带 tests/**
  # （实测：LICENSE / README.md / pyproject.toml / threadpoolctl.py / PKG-INFO），
  # 而上游仓库的 3.7.0 tag **自带 tests/**（14 个 .py，其中 44 个 `def test_`）。
  # 若用 PyPI sdist，配方内**根本无法运行上游测试**——这正是审查 rule4
  # 判定"少报（上游实测 N=44 > 声明 N=0）"的根因。
  # 故改用官方 tag 归档，使上游测试随源码交付、可在 build() 内真实运行。
  url: "https://github.com/joblib/threadpoolctl/archive/refs/tags/3.7.0.tar.gz"
  sha256: "435415e3dbcaa51d9f30bca91730c8483eabd83779dface976b10bf84a3a4b97"
