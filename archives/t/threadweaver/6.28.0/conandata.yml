# conandata.yml — threadweaver 6.28.0
# 源码来自 KDE Frameworks 官方源（download.kde.org）；download.kde.org 为
# Mirrorbits 重定向器，部分网络下（CI 工位实录）访问超时或选中证书异常的
# 镜像，故列两个权威 KDE 镜像作回退（R39：官方源或权威镜像）。回退 URL 与
# 官方 tarball 逐字节一致，sha256 钉死官方字节。

sources:
  url:
    - "https://download.kde.org/stable/frameworks/6.28/threadweaver-6.28.0.tar.xz"
    - "https://mirrors.nju.edu.cn/kde/stable/frameworks/6.28/threadweaver-6.28.0.tar.xz"
    - "https://mirrors.aliyun.com/kde/stable/frameworks/6.28/threadweaver-6.28.0.tar.xz"
  sha256: "ab4a7e1a2ff4ee9e3ebb73097fb93beda6857f08d1c4ab7d15af17c383ffaf7e"

# 6.28.0 无需补丁：无 po/ 目录（不需要 Linguist 相关裁剪），无 designer 插件；
# examples/ 无条件参与构建，但所需的 Qt6 Widgets/Network/Xml/Test 模块与
# uic/moc 工具均在 qtbase 包内（已在设备端包缓存核查）。
