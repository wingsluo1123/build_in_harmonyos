software: tigervnc
version: "1.15.0"
status: built
build_date: "2026-10-02"
build_system: cmake

source:
  url: "https://github.com/TigerVNC/tigervnc/archive/refs/tags/v1.15.0.tar.gz"
  sha256: "7f231906801e89f09a212e86701f3df1722e36767d6055a4e619390570548537"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_VIEWER=OFF"
    - "-DBUILD_SERVER=OFF"
    - "-DBUILD_JAVA=OFF"
    - "-DENABLE_NLS=OFF"
    - "-DENABLE_PAM=OFF"
    - "-DENABLE_GNUTLS=OFF"
    - "-DENABLE_NETTLE=OFF"
    - "-DENABLE_H264=OFF"
    - "-DENABLE_PWQUALITY=OFF"
    - "-DINSTALL_SYSTEMD_UNITS=OFF"
    - "-DBUILD_TIMESTAMP=2026-01-01 00:00"
  dependencies:
    required:
      - "zlib/1.3.2.1"
      - "libjpeg-turbo/3.2.0"
      - "pixman/0.46.4.3"
    optional:
      - "gnutls/3.8.10 (ENABLE_GNUTLS，默认关闭)"
      - "nettle/3.10.2.1 (ENABLE_NETTLE，默认关闭)"
    unavailable:
      - "X11 / libX11 / libXext / libXdamage / libXfixes / libXrandr / libXtst (OHOS 无 X11，仓库内亦无可用配方)"
      - "FLTK 1.3.x (vncviewer 必需，OHOS 无)"
      - "PAM / libpam (security/pam_appl.h 与 libpam 均缺失，OHOS 无)"
      - "Xorg server 源码树 (Xvnc/libvnc.so 必需，OHOS 无)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-make-x11-pam-optional.patch"
  - "0002-ohos-gate-x11-unix-tools.patch"

