package: timewarrior/1.9.1
homepage: https://timewarrior.net/
upstream_check_command: "cmake --build . --target test"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target test"
upstream_tests:
  - file: test/run_all
    source: timew-1.9.1.tar.gz/test/run_all
    description: "Run all 36 Python/TAP scripts and report their assertion-level totals"
    command: "./run_all --verbose"
  - file: test/CMakeLists.txt
    source: timew-1.9.1.tar.gz/test/CMakeLists.txt
    description: "Build and run the upstream C++ test executables"
    command: "cmake --build . --target test"
test_package_tests:
  - file: test.sh
    description: "Execute the packaged timew binary and verify version output"
    command: "timew --version"
assertion_count: 1
