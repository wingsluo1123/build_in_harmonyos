# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tinyhttpd/1.0
homepage: "https://github.com/EZLippi/Tinyhttpd"

# 上游测试命令 (tinyhttpd 无 make check / ctest)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# tinyhttpd 无自动化测试套件，仅有手动测试（启动服务器访问页面）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tinyhttpd.sh
    description: "启动 httpd 服务器并验证进程运行"
    command: "sh test_tinyhttpd.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
