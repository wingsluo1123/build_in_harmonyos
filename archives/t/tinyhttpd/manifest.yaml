software: tinyhttpd
display: "tinyhttpd"
description: "Ultra-lightweight HTTP server written in C by J. David Blackstone (1999)"
category: networking
homepage: "https://github.com/EZLippi/Tinyhttpd"
license: GPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "tinyhttpd 使用纯 Makefile（非 autotools），无 configure 脚本"
    - "Makefile 中硬编码 gcc，conanfile.py 中通过 replace_in_file 替换为 $(CC) $(CFLAGS)"
    - "使用 pthreads 多线程处理请求，OHOS 平台原生支持"
    - "tinyhttpd 是命令行工具（R38: 需创建 commands.json）"
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: "2026-07-15"
