package: tlsrpt/0.5.0
homepage: "https://github.com/sys4/libtlsrpt"
upstream_tests_exist: false
upstream_test_audit: >-
  Release v0.5.0 has two library C translation units and no automated test
  directory, TESTS, check_PROGRAMS or registered tests in Makefile.am.
  The generated make check target only builds the library and executes no
  test cases. demo.c is not part of this release archive's build/test targets.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"
upstream_tests: []
upstream_test_cases: 0
test_package_tests:
  - file: check_reports.py
    description: >-
      14 functional cases: version compatibility, error helpers, allocator
      failures, missing connection, long socket path, socket lifecycle,
      STS success, escaped failure details, multiple policies, cancellation,
      empty/nested/unfinished policy rejection, missing datagram receiver.
      Validate the three received datagrams by exact decoded JSON equality.
    command: "python3 check_reports.py <CMake-built test_tlsrpt>"
test_files:
  - path: "test_package/test_tlsrpt.c"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/check_reports.py"
    test_type: "R34"
    assertion_count: 14
test_package_test_count: 14
consumer_assertion_count: 14
assertion_count: 14
