patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "Use TMPDIR for configure temporary files"
    patch_type: "portability"
  - patch_file: "patches/0002-etc-config.guess.patch"
    patch_description: "Make etc/config.guess recognize HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0003-etc-config.sub.patch"
    patch_description: "Make etc/config.sub accept linux-ohos"
    patch_type: "portability"
