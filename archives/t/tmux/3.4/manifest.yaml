software: tmux
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.4"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tmux/tmux/releases/download/3.4/tmux-3.4.tar.gz"

  # 源码校验和
  sha256: "551ab8dea0bf505c0ad6b7bb35ef567cdde0ccb84357df142c254f35a23e19aa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

bundled_sources:
  - name: ncurses
    version: "6.5"
    url: "https://invisible-mirror.net/archives/ncurses/ncurses-6.5.tar.gz"
    sha256: "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libevent/2.1.12

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"
  - "0002-etc-config.guess.patch"
  - "0003-etc-config.sub.patch"
  - "0004-ncurses-config.sub.patch"
  - "0005-ncurses-configure-umask.patch"
  - "0006-ncurses-config.guess-umask.patch"
  - "0007-ncurses-configure-expr-fallback.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS HMDFS 文件系统限制：config.status 应使用 TMPDIR，并以 umask 022 创建临时目录"
  - "静态链接配置：使用 --enable-static 和 LDFLAGS=-static，由 Conan 注入依赖路径"
  - "ncurses 6.5 由配方从官方源码构建为私有静态库，不依赖 Worker 预装状态"
  - "config.guess/config.sub 补丁：添加 HarmonyOS 系统识别（*:HarmonyOS:*:*）和 linux-ohos 三元组支持"
  - "HarmonyOS expr 会以退出码 0 返回损坏的 alternation 结果；ncurses configure 应禁用 expr 探测并使用 sed 回退"

patch_classification:
  - file: 0001-configure.patch
    type: portability
    platform_only: True
    guard: 'os=OHOS'
  - file: 0002-etc-config.guess.patch
    type: portability
    platform_only: True
    guard: 'os=OHOS'
  - file: 0003-etc-config.sub.patch
    type: portability
    platform_only: True
    guard: 'os=OHOS'
  - file: 0004-ncurses-config.sub.patch
    type: portability
    platform_only: True
    guard: 'os=OHOS'
  - file: 0005-ncurses-configure-umask.patch
    type: portability
    platform_only: True
    guard: 'os=OHOS'
  - file: 0006-ncurses-config.guess-umask.patch
    type: portability
    platform_only: True
    guard: 'os=OHOS'
  - file: 0007-ncurses-configure-expr-fallback.patch
    type: portability
    platform_only: True
    guard: 'os=OHOS'
