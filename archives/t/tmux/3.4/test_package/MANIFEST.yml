# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tmux/3.4
homepage: "https://github.com/tmux/tmux"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# tmux 3.4 的默认 make check 不含断言式测试程序；fuzz/input-fuzzer
# 仅在显式启用 fuzzing 时构建。
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "运行 tmux -V 并精确核对版本输出"
    command: "bash test.sh"

assertion_count: 1
