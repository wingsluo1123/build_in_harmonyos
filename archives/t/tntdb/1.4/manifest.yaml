# 版本级 manifest
# 文件位置: archives/t/tntdb/1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.4"

# 软件名
software: "tntdb"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "autotools"
conan_ref: "tntdb/1.4"

# 源码信息
source:
  # 源码下载 URL
  url: "https://github.com/maekitalo/tntdb/archive/refs/tags/V1.4.tar.gz"

  # 源码校验和
  sha256: "20f5d10817c0ad74f7728a0ca393337c0c73336dbc2b3273dcde22e5cc7cd76d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-sqlite=yes (sqlite/3.53.3)"
    - "--with-replicate=yes (internal, no external dep)"
    - "--with-mysql=no --with-postgresql=no --with-oracle=no (no servers/clients on device)"
    - "--with-driverdir=${libdir} (drivers into lib/ for loader search path)"
    - "--build=aarch64-unknown-linux-ohos --host=aarch64-unknown-linux-ohos"
    - "default shared=True (driver plugins need a shared core library)"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - cxxtools/3.0.0
    - sqlite/3.53.3

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied: []

# 编译中学到的知识
knowledge_gained:
  - "GitHub tag archive ships no configure; bootstrap with autoreconf -fi (automake/1.18 + libtool/2.5.4.1, same as cxxtools 3.0.0)"
  - "Upstream defines no automake TESTS: make check only builds test/tntdb-test; run it explicitly with -s and a sqlite fixture from test/sqlite-test.sql"
  - "Driver plugins must live on the loader search path: --with-driverdir=${libdir} beats the default lib/tntdb subdir for relocatable Conan packages"
