# 软件级 manifest
# 文件位置: archives/t/tntdb/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: tntdb

# 显示名
display: "tntdb"

# 一句话描述
description: "C++ class library for easy database access"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: db

# 官网 URL
homepage: "https://github.com/maekitalo/tntdb"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "GitHub tag archive has no generated configure; bootstrap with autoreconf -fi"
    - "config.guess cannot identify HarmonyOS; pass --build/--host=aarch64-unknown-linux-ohos explicitly"
    - "Enable only server-less drivers on OHOS: sqlite + replicate; disable mysql/postgresql/oracle"
    - "Install drivers into lib/ (--with-driverdir=${libdir}) so the runtime loader finds them"
    - "Upstream defines no automake TESTS; run test/tntdb-test -s explicitly with a sqlite fixture"

  common_dependencies:
    - cxxtools
    - sqlite

# 版本索引
versions:
  "1.4":
    status: built
    build_date: "2026-09-27"
    conan_ref: "tntdb/1.4"
