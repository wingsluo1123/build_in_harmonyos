build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu（显式三元组：本机 config.guess 不识别 HarmonyOS 内核且 HMDFS 下 mkdtemp 写 dummy.c 被拒；build==host 保持本机原生编译并跳过 config.guess）"
    - "autotools.configure()（prefix/bindir/datarootdir 由 conan AutotoolsToolchain 注入包目录）"
    - "build() 先执行上游 bootstrap（aclocal/autoconf/autoheader/automake）自举 configure 与 Makefile.in"
    - "生成 configure 内 umask 077 → 022 改写（HMDFS：2700 临时目录不可写、chmod 为 no-op）"
    - "源码内构建：basic_layout(src_folder='.') + folders.build='.'（上游 test/check-* 按源码树相对路径取值）"
    - "PKG_CHECK_MODULES(CACA, caca >= 0.99.beta18)：PkgConfigDeps 生成 caca.pc，PKG_CONFIG_PATH 指向本配方 generators_folder"
  dependencies:
    - libcaca/0.99.beta20.1
    - automake/1.18（tool_requires，构建期自举；传递 ncurses/6.4、zlib/1.3.1 由 libcaca 配方静态链入）
  cc: clang
  cxx: clang++

# 本版本仅 1 个补丁：为编译期字体目录加 make 覆盖点（默认值不变，非平台宏守卫）
patches_applied:
  - "0001-src-Makefile.am.patch"

knowledge_gained:
  - "HMDFS 按组位判定目录访问权（本机 uid 20020082 非文件属主，靠 file_manager 组通行）：config.status 的 (umask 077 && mktemp -d ./confXXXXXX) 生成 2700 目录后写入必 EACCES，且 chmod 无效果；修法是改写生成 configure 里两处 umask 077 → 022（对应 E175 家族）"
  - "本机 config.guess(2024-07-27) 在 HMDFS 上 mkdtemp 后写 dummy.c 被拒 → 无法猜测 build 三元组；必须显式传 --build/--host 才能 configure（conan 仅在 build profile != host profile 时才自动注入三元组）"
  - "autotools 库的官方测试若按源码树相对路径取值（../src、../fonts），必须源码内构建（basic_layout(src_folder='.') + folders.build='.'）；conan basic_layout 默认的 build-release/ 子目录会让这类测试假失败"
  - "automake/1.18（制品仓）以 perl 脚本分发，其 Automake::Config 模块靠包的 buildenv_info 注入 PERL5LIB/ACLOCAL_PATH，只在 conanbuild 环境内生效；直接调用包内 bin/aclocal 会报 Can't locate Automake/Config.pm"

