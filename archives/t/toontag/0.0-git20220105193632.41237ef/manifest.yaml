patches_applied: []

knowledge_gained:
  - "toontag 是 TooN 的姊妹算法库（TaG），Autotools 构建，configure 只认 --with-TooN=目录；Conan 侧用 AutotoolsDeps 注入 -I + 显式 --with-TooN 指向 toon 包的 include"
  - "41237ef 已把 src/*.cpp 的 tr1 引用清掉，但 tag/*.h 仍以 NEWCPPSTD 宏切换 <tuple>/<array> 与 <tr1/...>；OHOS 上必须 -DNEWCPPSTD 编译且经 package_info defines 传递给消费者（Debian #1133653 同因）"
  - "上游无任何自动化测试套件：Makefile.am 无 TESTS/check_PROGRAMS，configure.in 无测试宏，test/ 下 4 个 .cpp 为手工演示程序；配方如实输出 no_tests，不跑空的 make check 冒充"
