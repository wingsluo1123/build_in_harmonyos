# test_package 中自带的测试 (消费者视角验证，含鸿蒙特有断言)
test_package_tests:
  - file: test_toot.py
    description: "消费者测试 — 安装布局/元数据版本/入口可执行 + 鸿蒙特有断言（H1 平铺布局、H2 setuptools_scm 版本落定、H3 HarmonyOS 平台指纹、H4 wrapper shebang、H5 剥离 LD_LIBRARY_PATH、H6 无 site-packages 隔离解释器仍可运行）"
    command: "python3 test_toot.py <package_folder> 0.52.1"

# 测试断言总数 (近似值, 用于质量评估)
# 实测 test_toot.py 输出 "结果: 14/14 全部通过"；声明数必须与实际执行数一致
assertion_count: 14
