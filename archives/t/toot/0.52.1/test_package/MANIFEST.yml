    command: "TOOT_TEST_BASE_URL=http://localhost:3000 python3 -m pytest tests/integration/test_update_account.py -q"
    result: "12 passed"
  - file: tests/integration/test_status.py
    source: toot-0.52.1/tests/integration/test_status.py
    description: "状态相关集成测试（10 用例，经桩服务真实执行）"
