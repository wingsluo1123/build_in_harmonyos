package: torchvision/0.28.0
homepage: "https://github.com/pytorch/vision"

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

excluded_upstream_tests:
  - command: "test/"
    reason: "Most torchvision upstream tests require Python, PyTorch/libtorch 2.9.0 runtime components, datasets, or accelerator-specific backends that are not available in the isolated OHOS Conan CI worker; this adaptation keeps consumer smoke coverage for the packaged C++ entry point."
  - command: "examples/cpp"
    reason: "The C++ examples require the same libtorch 2.9.0 Conan dependency before they can be built and executed in this recipe."
  - command: "examples/python"
    reason: "Python examples are outside the C++ Conan package smoke-test scope."

upstream_tests:
  - path: test/
    type: upstream pytest and C++ extension regression tests
  - path: examples/cpp
    type: upstream C++ example tests
  - path: examples/python
    type: upstream Python examples

test_package_tests:
  - file: test.cpp
    description: "Consumer smoke test calling torchvision::ops NMS when libtorch is available"
    command: "./test_torchvision"

assertion_count: 2
