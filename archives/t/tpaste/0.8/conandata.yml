sources:
  "0.8":
    # tpaste 没有独立的上游 tarball：Alpine aports 的 APKBUILD 在 package() 中以 printf 生成脚本。
    # 此处固定 aports commit 3f28b79b 下的 main/tpaste/APKBUILD（GitLab 官方仓库的只读镜像
    # github.com/alpinelinux/aports，commit 与 sha256 与 gitlab.alpinelinux.org 一致）。
    # gitlab.alpinelinux.org 对 Conan 的 User-Agent 返回 HTTP 418，故用 GitHub 镜像下载。
    url: "https://raw.githubusercontent.com/alpinelinux/aports/3f28b79bb6e626953e3786be38349719ebd1789d/main/tpaste/APKBUILD"
    sha256: "5a50dbf249186b2ce5c954dcf45d96d13f72f9018a1f8dca9fb4769c671d2f2b"

