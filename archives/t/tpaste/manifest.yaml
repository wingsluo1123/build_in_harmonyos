software: tpaste
display: "tpaste"
description: "Helper script to paste stdin to https://tpaste.us (POSIX sh wrapper around curl)"
category: network
homepage: "https://tpaste.us"
license: GPL-2.0-only
build_system: shell

ohos_adaptation:
  key_points:
    - "无独立上游 tarball：脚本由 Alpine aports APKBUILD 的 package() 以 printf 生成，配方固定 aports commit 并校验 APKBUILD 的 sha256"
    - "配方在 build() 中按 APKBUILD 同一模板生成脚本（pkgver 与 url 取自 APKBUILD），并用 sh -n 做语法检查"
    - "运行时只 exec curl，配方 requires curl/8.15.0；脚本与架构无关，无需交叉编译"
    - "依赖外部 HTTPS 服务 tpaste.us，消费者用例用假 curl 观测调用，不访问网络"
  common_dependencies:
    - curl

versions:
  "0.8":
    status: built
    build_date: "2026-10-08"
    conan_ref: "tpaste/0.8"
    source_url: "https://raw.githubusercontent.com/alpinelinux/aports/3f28b79bb6e626953e3786be38349719ebd1789d/main/tpaste/APKBUILD"  # GitHub 官方只读镜像，与 gitlab 官方 commit 内容 sha256 一致
