knowledge_gained:
  - "tqdm 4.69.0 与 4.70.1 同为纯 Python 零运行时依赖 sdist，模块 version.py 经
    importlib.metadata 解析 __version__——copytree 移植必须补 tqdm-4.69.0.dist-info
    （METADATA+WHEEL，cachecontrol recipe 先例），否则干净环境报 UNKNOWN。
    补齐后 __version__ 可精确断言 4.69.0（无 4.70.1 那种上游 bump 遗漏问题）。"
  - "上游 tests/ 的 8 例 asyncio 用例需 pytest-asyncio 插件：设备 pip 安装
    pytest-asyncio 1.4.0 后全部通过；未安装时以 'async def functions are not
    supported' 失败，属测试依赖而非实现缺陷。"
  - "设备环境两处 pytest/OS 差异：① pytest tmp_path 的 basetemp 所有权检查在
    设备文件系统上误报（st_uid 与 getuid 不一致），用 --basetemp 指向可写目录
    规避；② tests_main.py::test_pipes 以裸命令名 'ls' 调 subprocess，本设备
    Python 3.12 的 posix_spawn 路径不做 PATH 解析（shutil.which 可定位
    /system/bin/ls、绝对路径可正常执行）——环境归因，非实现缺陷。"
  - "非 TTY 场景（重定向 stdout）进度条自动降级为普通输出，设备实测正常；
    R38：库 API 为 lastversion 消费面，CLI 入口不安装，无 commands.json。"

