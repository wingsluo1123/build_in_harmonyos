# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tqdm/4.69.0
homepage: "https://github.com/tqdm/tqdm"

upstream_check_command: "python3 -m pytest tests/"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/"

upstream_tests:
  - name: tests/（pytest 套件）
    count: "N/A"
    description: "CI 纯 conan 流程不引入 pytest，本文件不承载通过数（不伪造，
      WR-006）。上游 tests/ 已在 OHOS 设备真实运行（-o addopts= 清空 pyproject
      addopts），实测数字与失败归因见版本 manifest.yaml / notes.md 与 run 证据
      reports/upstream-pytest.log。等效验证以 test_package 对打包产物的真实
      API 调用为准（R34）。"

test_package_tests:
  - file: test_tqdm.py
    description: "消费者测试（R34）：非 TTY 流（StringIO/重定向）下 trange 静默
      迭代、iterable 包装、format_meter 渲染、类 API update 计数；__version__
      经 dist-info 精确断言 4.69.0。"
    command: "python3 test_tqdm.py <site-packages>"

assertion_count: 7
