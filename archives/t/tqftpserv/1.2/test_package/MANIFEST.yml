package: tqftpserv/1.2
homepage: "https://github.com/linux-msm/tqftpserv"

upstream_check_command: "meson test --list"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

consumer_tests:
  - file: conanfile.py
    description: "ELF header validation (aarch64) + binary-sign-tool signature + tqftpserv -h execution"
    type: "execution"
    command: "./tqftpserv -h"
  - file: consumer_test.sh
    description: "OHOS-specific non-assertion consumer test: signed binary execution + shared-library closure (NEEDED) report"
    type: "execution"
    command: "sh consumer_test.sh ./tqftpserv"

assertion_count: 0
