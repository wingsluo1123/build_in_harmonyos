# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: traceroute/2.1.6
homepage: "https://sourceforge.net/projects/traceroute/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: traceroute.c
    source: traceroute-2.1.6/traceroute/traceroute.c
    description: "Main traceroute program, builds to binary"
    command: "./traceroute --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 clif.h 头文件和 libsupp.a 库可用"
    command: "./test_traceroute"
  - description: "验证 traceroute 二进制可执行"
    command: "traceroute --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
