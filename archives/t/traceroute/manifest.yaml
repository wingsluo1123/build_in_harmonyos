software: traceroute
display: "Traceroute"
description: "网络诊断工具，跟踪数据包到目的地址的路径"
category: network
homepage: "https://sourceforge.net/projects/traceroute/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Make.rules LIBDEPS 需过滤 -l% 选项避免 -lm 被当作文件依赖"
    - "默认 CC 需从 gcc 改为 clang（OHOS 平台仅有 clang）"
    - "env=yes 继承环境变量以支持自定义编译器"
  common_dependencies: []

versions:
  "2.1.6":
    status: published
    build_date: "2026-07-16"
