  - "0002-crates-tracexec-backend-ptrace-src-ptrace-tracer.rs.patch"
  - "0003-src-main.rs.patch"

knowledge_gained:
  - "OHOS 无特权 ptrace 返回 EPERM（PTRACE_TRACEME/ATTACH/SEIZE/process_vm_readv 实测矩阵）——ptrace 类工具需如实声明运行限制（与 DRAFT-10103 同源）"
  - "鸿蒙内核无 BPF syscall：eBPF 后端应在构建期关闭（--no-default-features，上游 CI 已覆盖该变体）"
  - "libc 的 musl 系 OHOS target_env 缺 PTRACE_GET_SYSCALL_INFO/ptrace_syscall_info（仅 gnu 模块提供）；内核 ABI 无架构差异，可用局部 shim 补齐"
  - "OHOS pthread_t = *mut c_void（musl 定义），既非 Send 亦非 Sync——跨线程传递 tid 需中转 usize"
  - "OHOS uname -r 为 'HongMeng Kernel 1.12.0'，不以 Linux 式版本号开头：依赖 uname 版本解析的工具会启动即失败，需按'不满足最低内核'的告警路径降级"
  - "Harmonybrew bottle URL 会被 CDN 轮换移除（多版本实测 404）；用 brew fetch <formula> 探测当前版本并以实测 sha256 锁定；CI 预下载对含百分号编码 URL 的重写与 conan file:// 解码不一致——bottle 固定在配方常量可绕开"
  - "Cargo 工程根目录无 configure/CMakeLists/Makefile/meson.build 标记时，init-build 嵌套源码检测会误提升演示子目录（F068 误报，需人工修复 .orig/.work）"

