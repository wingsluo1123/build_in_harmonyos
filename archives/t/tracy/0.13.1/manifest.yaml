# ============================================================
# 补丁信息
# ============================================================

# 应用 3 个源码 patch（探索阶段直接改源码后固化）：
#   0001: 根 CMakeLists 加 _GNU_SOURCE=1 + CMake check_symbol_exists 特性检测
#         （HAS_PTHREAD_SETCANCELSTATE、HAS_PROGRAM_INVOCATION_SHORT_NAME）
#   0002: TracyProfiler.cpp 用 /proc/self/cmdline + readlink /proc/self/exe 替代
#         program_invocation_short_name / program_invocation_name（bionic 全家无）
#   0003: TracySystem.cpp 用 #ifdef HAS_PTHREAD_SETCANCELSTATE 守护
#         pthread_setcancelstate 调用（bionic 不存在该 GNU 扩展）
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-public-client-TracyProfiler.cpp.patch"
  - "0003-public-common-TracySystem.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OpenHarmony bionic libc 不默认定义 _GNU_SOURCE，且 pthread_setcancelstate 等 GNU 扩展根本不存在（与 Android bionic 同样缺）"
  - "program_invocation_short_name / program_invocation_name 是 glibc 独有的 errno.h 扩展，bionic（Android + OHOS）都无；用 /proc/self/cmdline + readlink /proc/self/exe 替代（特性检测 #elif !defined(HAS_PROGRAM_INVOCATION_SHORT_NAME) 触发）"
  - "OHOS bionic 不暴露 __NR_perf_event_open syscall，必须 -DTRACY_NO_SYSTEM_TRACING=ON 关闭 system tracing"
  - "libTracyClient.a 仅依赖 pthread + dl，不依赖其他系统库，0 个外部 Conan 依赖"
  - "上游 install 把 headers 装到 include/tracy/tracy/（双层），使用方 include 路径为 <tracy/tracy/Tracy.hpp>"
