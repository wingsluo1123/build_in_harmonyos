# conandata.yml — Star Traders (trader) 7.21
#
# 源码归档与官方发布页完全一致（sha256 相同，均来自 John Zaitseff 的官方发布）。
# 官方站点 ftp.zap.org.au / www.zap.org.au 在 CI 网络下不可达（连接超时），
# 故把多个可信镜像放在前面、官方原始 URL 保留在最后作为回退：
#   - Debian 源码仓库保存的 .orig.tar.xz 即上游原始发布归档（位级相同，
#     sha256 一致），由 Debian FTP masters 长期维护，国内镜像同步稳定。
#   - 所有镜像必须提供与官方完全相同的归档，继续沿用同一 sha256 校验。
# Conan 2.x 的 get() 支持 url 列表，会按顺序逐个尝试直到成功。

sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/t/trader/trader_7.21.orig.tar.xz"
    - "https://mirrors.aliyun.com/debian/pool/main/t/trader/trader_7.21.orig.tar.xz"
    - "https://mirror.nju.edu.cn/debian/pool/main/t/trader/trader_7.21.orig.tar.xz"
    - "https://deb.debian.org/debian/pool/main/t/trader/trader_7.21.orig.tar.xz"
    - "https://www.zap.org.au/projects/trader/unix/trader-7.21.tar.xz"
    - "https://ftp.zap.org.au/pub/trader/unix/trader-7.21.tar.xz"
  sha256: "541d1180dde04173c071d5c59eaf72a6572f8dfc8065e184eaf7d14bccd0257d"

patches:
  - patch_file: "patches/0001-utils-c-strfmon-ohos.patch"
    patch_type: portability
    patch_description: "Provide a self-contained strfmon() implementation for OHOS (musl-derived libc lacks the POSIX strfmon symbol, which trader-utils.o references)."
