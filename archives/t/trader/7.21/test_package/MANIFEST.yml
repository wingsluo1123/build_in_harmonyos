# test_package/MANIFEST.yml
# Star Traders (trader) 7.21 — 上游官方测试声明文件
# CI (build_and_test.sh L0e) 强制要求此文件存在。
# 详见: docs/TEST_QUALITY_SPEC.md

package: trader/7.21
homepage: "https://www.zap.org.au/projects/trader/"

# 上游测试存在性审计（逐文件审计官方发布包 trader-7.21.tar.xz）
upstream_tests_exist: false
upstream_test_audit: >-
  逐文件审计 trader-7.21.tar.xz（官方发布包，sha256
  541d1180dde04173c071d5c59eaf72a6572f8dfc8065e184eaf7d14bccd0257d）确认上游
  无任何自动化测试：1) 顶层 Makefile.am 的 SUBDIRS = lib src po data doc m4，
  无 tests/ 目录；全树无 test/、tests/、regress/、*_test 等测试目录或测试源
  文件。2) src/Makefile.am：仅 bin_PROGRAMS = trader（trader_SOURCES 业务源码
  与 trader_CPPFLAGS/LDADD），无 TESTS、check_PROGRAMS、check-local、
  noinst_PROGRAMS 等 automake 测试目标。3) lib/Makefile.am（gnulib 生成）：虽
  含空的 TESTS_ENVIRONMENT 变量，但全树无 TESTS 赋值、无测试程序登记，
  check 目标恒为 automake 默认空操作的 `check-am: all-am`（只重建不跑用例）。
  4) configure.ac：无 AC_CONFIG_TESTDIR、AC_ARG_ENABLE(enable-tests) 等测试
  宏；data/Makefile.am 的 desktop/metainfo 规则用 build-aux/msgfmt-* 生成数据
  文件（非测试）；po/ 为 gettext 翻译目录（非测试）。5) 本地 configure +
  make check 实证：全部子目录与顶层 check 均为 "Nothing to be done for
  'check'"，无任何用例被执行。⇒ 上游不提供任何测试框架，无 make check。

# rule4 强制字段：上游注册总数 0，口径为 autotools_tests（automake 无测试注册）。
upstream_test_total: 0
upstream_test_count_method: "autotools_tests"
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 消费者验证（R34: 真实执行被适配的 trader 二进制）
test_package_tests:
  - file: test.c
    description: "真实调用安装产物 bin/trader 做 4 项确定性断言：①二进制存在且可执行 ②trader --version 退出码 0 且输出含 '7.21' ③trader --help 退出码 0 且显示 Usage/Star Traders ④trader --no-color --version 组合选项正常；任一失败返回非零。"
    command: "./test_trader <bindir>/trader"

# 断言总数（消费者 4 项确定性断言，与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致）
assertion_count: 4
