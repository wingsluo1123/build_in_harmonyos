software: tran
display: "tran"
description: "Perl text transliteration filter with pluggable character tables"
category: text
homepage: "https://github.com/kilobyte/tran"
license: "GPL-2.0-or-later"
build_system: custom
ohos_adaptation:
  key_points:
    - "Rewrite the Perl shebang to the target interpreter path."
    - "Resolve the bundled data directory through FindBin instead of the current working directory."
    - "Verify both the script list and a real Greek transliteration through the installed command."
  common_dependencies:
    - perl
versions:
  "5":
    status: built
    build_date: "2026-10-15"
    conan_ref: "tran/5.0"
    note: "目录和任务分支保持 5；制品经 set_version() 归一化为 5.0，满足 Conan 版本校验"
