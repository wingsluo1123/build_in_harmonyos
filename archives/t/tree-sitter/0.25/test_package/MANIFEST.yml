# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tree-sitter/0.25
homepage: "https://tree-sitter.github.io/tree-sitter/"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序 (requires Rust/cargo, not available on OHOS)
upstream_tests:
  - file: Cargo.toml
    source: tree-sitter-0.25/Cargo.toml
    description: "Rust-based test suite (cargo xtask test), requires cargo — skipped on OHOS"
    command: "cargo xtask test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Creates a TSParser, verifies non-NULL, checks ABI version constant, deletes parser"
    command: "./test_tree-sitter"

# 测试断言总数
assertion_count: 2
