# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lh3 的 ksw.c（fermi-lite/trimadap 同源）只实现 SSE2 且无条件 include <emmintrin.h>（x86 专属头），aarch64 必须补标量回退（ref: DRAFT-trimadap-0.1-4-ksw-sse2-scalar-fallback 草稿）"
  - "ksw.c 标量回退须按 SSE2 的运算顺序逐步饱和（_mm_adds_epu8/_mm_subs_epu8/_mm_adds_epi16/_mm_subs_epu16 一一对应），合并成单个 clamp 表达式会在 h+S>255 时不等价（ref: DRAFT-trimadap-0.1-4-ksw-sse2-scalar-fallback 草稿）"
  - "lh3 的 kthread.c 依赖 glibc 经 <pthread.h> 间接暴露 int64_t，非 glibc libc 需显式 include <stdint.h>（ref: DRAFT-trimadap-0.1-4-ksw-sse2-scalar-fallback 草稿）"
  - "跨架构验收可用上游打包生态的既有期望值当 oracle：Homebrew 断言 test.fa 上第 4 个默认接头命中数为 1，aarch64 标量路径实测一致（ref: DRAFT-trimadap-0.1-4-ksw-sse2-scalar-fallback 草稿）"
  # 版本级构建细节（L3，未挂图谱条目）：Makefile 无 CPPFLAGS/LDFLAGS 钩子，
  # 依赖 zlib 的 include/lib 路径须经 CC/CFLAGS 传入（同 seqtk 配方）

