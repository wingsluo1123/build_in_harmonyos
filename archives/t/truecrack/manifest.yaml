software: truecrack
display: "truecrack"
description: "TrueCrypt volume password cracker (CPU backend for HarmonyOS)"
category: security
homepage: "http://code.google.com/p/truecrack"
license: "GPL-3.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "CPU-only build via --enable-cpu (no NVIDIA CUDA on HarmonyOS PC)"
    - "configure 使用 --build/--host=aarch64-unknown-linux-gnu 绕过 2009 版 config.guess 无法识别 OHOS"
    - "AS_TMPDIR 的 umask 077 改为 022，规避 HMFS 只读临时目录导致 config.status 写 subs1.awk 失败"
    - "源码依赖 -fcommon 旧行为，补丁把头文件全局量改 extern 单处定义"
  common_dependencies: []

versions:
  "3.5":
    status: built
    build_date: "2026-10-10"
