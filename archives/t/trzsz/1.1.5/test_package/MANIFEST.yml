package: trzsz/1.1.5
homepage: "https://github.com/trzsz/trzsz"
upstream_check_command: "python -m unittest discover trzsz-libs && python -m unittest discover trzsz-svr"
upstream_test_in_build: false
upstream_test_command: "python3 upstream_tests.py"
upstream_tests:
  - file: trzsz-libs/tests
    source: "Official commit e433a8c326dddd1b7a9fe79f3f1b766f76fe9ca8"
    description: "Unmodified original libs unittest discovery; actual run count must be recorded."
    command: "python -m unittest discover trzsz-libs"
  - file: trzsz-svr/svr-tests
    source: "Same pinned commit; original tests/trzsz and svr-tests/trzsz symlinks preserved"
    description: "Unmodified original server unittest discovery; optional iTerm2 tests excluded."
    command: "python -m unittest discover trzsz-svr"
test_package_tests:
  - file: functional.py
    description: "Consume this package's modules, three real distribution metadata records, dependency versions and CLI entry points."
    command: "python3 functional.py"
  - file: progress_regression.py
    description: "Exercise real incomplete-file empty DATA errors, legitimate empty/multichunk transfers and CLI protocol propagation."
    command: "python3 progress_regression.py"
