sources:
  "10.0":
    main:
      url: "https://github.com/gfto/tsdecrypt/archive/refs/tags/v10.0.tar.gz"
      sha256: "5c69bec60046fa808fe92f2ce2236b69aa8b59af66aa0a3b86618488659e450e"
    libfuncs:
      url: "https://github.com/gfto/libfuncs/archive/2d8b0cb1051ce0196ee387ab6ae731c2f841c67b.tar.gz"
      sha256: "3d45fe6972a3a1b7d7b717a7121d6daac72598484fa66c7772a601cf4ad4884b"
    libtsfuncs:
      url: "https://github.com/gfto/libtsfuncs/archive/5b303b7933b66b806f4bc953aa5f88cdd3286433.tar.gz"
      sha256: "d6e5d6f1359ca807e45f633a8719d5899f964b9f7eb142441e54425c41053c4b"
patches:
  "10.0":
    - patch_file: "patches/0001-Makefile.patch"
      patch_description: "0001 Propagate dependency include flags to generated dependency scans"
      patch_type: "portability"
    - patch_file: "patches/0002-camd-newcamd.c.patch"
      patch_description: "0002 Include the portable crypt declaration explicitly"
      patch_type: "portability"
    - patch_file: "patches/0003-filter.c.patch"
      patch_description: "0003 Include standard allocation and conversion declarations"
      patch_type: "portability"
    - patch_file: "patches/0004-libfuncs-asyncdns.c.patch"
      patch_description: "0004 Use the synchronous resolver where pthread cancellation is unavailable"
      patch_type: "portability"
    - patch_file: "patches/0005-libtsfuncs-crc.c.patch"
      patch_description: "0005 Use the standard fixed-width integer type"
      patch_type: "portability"
    - patch_file: "patches/0006-libtsfuncs-tdt.c.patch"
      patch_description: "0006 Keep mutable TDT/TOT diagnostic labels in writable storage"
      patch_type: "portability"
    - patch_file: "patches/0007-libtsfuncs-time.c.patch"
      patch_description: "0007 Keep decoded time storage alive for the complete encoder call"
      patch_type: "portability"
    - patch_file: "patches/0008-process.c.patch"
      patch_description: "0008 Include standard allocation declarations"
      patch_type: "portability"
    - patch_file: "patches/0009-tsdecrypt.c.patch"
      patch_description: "0009 Parse complete RTP headers and validate MPEG-TS payload boundaries"
      patch_type: "portability"
