  url: "https://files.pythonhosted.org/packages/source/t/tubeup/tubeup-2026.5.8.tar.gz"
  sha256: "4c75423a429493bddaf78ede0031947938b3eb35435847ee6597b49a4be76ad7"
  filename: "tubeup-2026.5.8.tar.gz"

patches:
  - patch_file: "patches/0001-guard-optional-yt-dlp.patch"
    patch_description: >-
      Guard the top-level `from yt_dlp import YoutubeDL` import so tubeup
      remains importable when yt-dlp is not installed, and raise an explicit
      runtime error only on the actual download path. yt-dlp is a declared
      upstream dependency but its Conan package is not published on ohpcd yet,
      so it cannot be declared as a Conan require (R36). The CLI surface,
      metadata generation and all utility code stay fully functional.
    patch_type: "portability"
