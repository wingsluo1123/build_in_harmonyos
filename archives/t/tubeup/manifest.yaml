software: tubeup
display: "tubeup"
description: "下载视频/音频并上传到 archive.org 的纯 Python 命令行工具"
category: python
homepage: "https://github.com/bibanon/tubeup"
license: GPL-3.0-or-later
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python（setuptools 构建后端），零 C/C++ 编译，python-require 模式打包到 lib/python3.12/site-packages"
    - "上游硬依赖 yt-dlp，但其 Conan 包尚未发布到 ohpcd 制品仓（R36 禁止声明未发布依赖）——0001 守护补丁使顶层 import 可降级，仅在真实下载路径给出明确受控报错；internetarchive/5.10.1 与 docopt/0.6.2 已发布并声明为 requires"
    - "生成 bin/tubeup 入口脚本（对应上游 [project.scripts] tubeup = tubeup.__main__:main）"
    - "上游 tests/ 全部 27 个 pytest 用例在 OHOS aarch64 运行时上通过（见 2026.5.8/notes.md「验证结果」）"
  common_dependencies:
    - "internetarchive/5.10.1"
    - "docopt/0.6.2"
    - "tqdm/4.70.1"
    - "yt-dlp（运行期可选；ohpcd 未发布，故未声明为 requires）"

versions:
  "2026.5.8":
    status: built
    build_date: "2026-10-13"
    conan_ref: "tubeup/2026.5.8"
