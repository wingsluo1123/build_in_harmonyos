# 版本级 manifest
# 文件位置: archives/t/tuning/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.0"
# 软件名（任务给定名；真实上游工程名 = tuning-library，见下方 source.upstream_project）
software: "tuning"
status: built
build_date: "2026-10-04"
build_system: cmake

source:
  url: "https://github.com/surge-synthesizer/tuning-library/archive/refs/tags/release_1.1.0.tar.gz"
  sha256: "32b908494cd96fa7f92307df842356a5f3c9469d7ec7c14c8db063e70a41cf46"
  tar_format: tar.gz
  upstream_project: "tuning-library"
  upstream_tag: "release_1.1.0"
  debian_source: "tuning-library 1.1.0+ds-4 (trixie/forky/sid) -> libtuning-library-dev"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"        # E092: CMake 无 HarmonyOS platform module
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64" # conan arch=armv8 不是合法 CMake processor 名
  dependencies: []      # 库本体零第三方运行时依赖；上游测试用源码包内置 libs/catch2/catch2.hpp
  cc: clang
  cxx: clang++
  package_type: header-library

patches_applied: []     # 库本体零补丁

knowledge_gained:
  - "tuning-library 1.1.0 是 header-only C++14 库（CMake INTERFACE target），头文件只 include C++ 标准库，零第三方运行时依赖"
  - "E092：CMake 无 HarmonyOS platform module；-DCMAKE_SYSTEM_NAME=HarmonyOS 时 CMake 打印 'System is unknown to cmake' 且对象扩展名退化为 .obj；须显式映射 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "conan arch=armv8 不能直接当 CMAKE_SYSTEM_PROCESSOR，必须映射为 aarch64"
  - "上游测试套件以 tests/data/... 相对路径读取样本，cwd 必须 = 源码根（上游 run-all-tests 的 WORKING_DIRECTORY 即 CMAKE_SOURCE_DIR）"
  - "OHOS 目标机缺少 es_ES / fr_FR locale 数据（zh_CN / en_US.UTF-8 / C 可用）：上游 alltests.cpp:227 'Test All Constraints SCL and KBM in Spain' SECTION 按上游设计优雅跳过；库本体与 locale 无关"
  - "Catch2 2.9.2 的 -r 不支持 'reporter::output-file' 语法，须用 -r junit -o <file>"
  - "上游 package() 需手写：上游无 install 规则，Conan 2 copy() 需通配符保留目录结构"
  - "本地 conan-verify 会临时把 conandata 的 github.com 改写为 ghfast.top 镜像；镜像不可达时 source() 追加官方源回退（sha256 强校验），CI 侧用 gh-proxy.com + 原 URL 回退"
