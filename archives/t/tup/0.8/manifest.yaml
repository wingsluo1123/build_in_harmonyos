  tar_format: tar.gz

build:
  # 上游自带 build.sh（既不是 cmake/autotools，也不是 make）
  system: custom
  target: aarch64-unknown-linux-ohos
  # build.sh 通过环境变量接收，无 configure 参数
  configure_options:
    - "TUP_SERVER=ldpreload"
    - "TUP_LABEL=0.8"
    - "CC=clang"
  dependencies: []
  cc: clang
  cxx: clang++
  options:
    - "TUP_SERVER=ldpreload（沙箱内无可用 /dev/fuse，ldpreload 是唯一可用的依赖追踪后端；build.sh 新增 HarmonyOS 分支）"
    - "TUP_LABEL=0.8 写入 tup --version（默认 bootstrap）"
    - "产物 build/tup + build/tup-ldpreload.so，两者必须同目录（depfile.c 按可执行文件路径推导 .so 路径）"

dependencies:
  required: []
  optional: []

patches_applied:
  - file: 0001-build.sh.patch
    purpose: "build.sh 无 HarmonyOS 分支：uname -s 返回 HarmonyOS 会落到默认 fuse 后端且不链入 Linux 兼容文件（dummy.c/utimensat_linux.c），链接期缺 compat_lock_disable/enable。补丁新增 HarmonyOS 分支并选择 ldpreload 后端（沙箱无可用 /dev/fuse）"
    lines_changed: 12
  - file: 0002-src-ldpreload-ldpreload.c.patch
    purpose: "ldpreload shim 三重缺陷修复：①musl 把 open64/fopen64/stat64 定义为宏，glibc 专有包装器需 __GLIBC__ 守卫；②init_fd 的 ELF 构造器晚于 OHOS 早期已打开文件，depfd==-1 会永久丢弃事件，改为惰性打开；③上游 shim 从不包装 utimensat，而 OHOS 用户态为 toybox（touch 新建文件只 open(O_CREAT)、已存在文件只 utimensat），导致所有用 touch 产出输出的规则报 'Expected to write to file ... but didn't'；另跳过 S_ISDIR 避免为目录建依赖节点"
    lines_changed: 160
  - file: 0003-src-tup-db.c.patch
    purpose: "environ.c 白名单变更后按源码 NOTE 递增 PARSER_VERSION 16 -> 17，促使已有 .tup/db 重建"
    lines_changed: 2
  - file: 0004-src-tup-environ.c.patch
    purpose: "tup 只把'数据库记录过的环境变量'传子进程（PATH/HOME 等白名单 + Tupfile 里 export 过的），于是把 TMPDIR 从子进程环境中剔除；而鸿蒙 /tmp 只读，令 clang/gcc 等一切需要临时目录的命令报 'unable to make temporary file: Read-only file system'。按上游 Windows 分支已有的 TEMP/TMP 先例，把 TMPDIR 加入 environ.c 的 default_env 白名单，使平台级 TMPDIR 与 PATH/HOME 一样被传递"
    lines_changed: 8
  - file: 0005-src-tup-file.c.patch
    purpose: "tup 在解析与命令日志两处使用 libc tmpfile()，而 glibc/musl 都把 /tmp 硬编码进 tmpfile()；鸿蒙 /tmp 是 erofs 只读挂载（知识库 E002/E272），导致 tup 完全无法运行（tmpfile: Permission denied → 1 job failed）。新增 tup_tmpfile() 按 $TMPDIR → .tup/tmp 依次回退，保持 tmpfile() 语义（匿名、自动删除）"
    lines_changed: 61
  - file: 0006-src-tup-fileio.h.patch
    purpose: "声明 tup_tmpfile() 原型，供 parser.c / updater.c 调用"
    lines_changed: 3
  - file: 0007-src-tup-parser.c.patch
    purpose: "解析 Tupfile 的临时文件改用 tup_tmpfile()（原 libc tmpfile() 在只读 /tmp 下失败）"
    lines_changed: 1
  - file: 0008-src-tup-updater.c.patch
    purpose: "命令错误日志的临时文件改用 tup_tmpfile()（原 libc tmpfile() 在只读 /tmp 下失败）"
    lines_changed: 1

compatibility:
  level: high
  issues:
    - "无 /dev/fuse（ls /dev/fuse: Permission denied，且 /dev 不可写）→ 只能用 ldpreload（纯链接器注入）后端，fuse/fuse3 后端不可选"
    - "OHOS 用户态为 toybox：touch 与 GNU coreutils 语义不同（补丁 0002 已在 shim 内对齐，无需改动用户态）"
    - "/tmp 是 erofs 只读挂载：libc 的 tmpfile() 完全不可用（补丁 0003 让 tup 改走 $TMPDIR / .tup/tmp，开箱可用）；需要临时目录的构建命令也能拿到 TMPDIR（补丁 0004）；上游测试里直接把 mkdir/mktemp 写到 /tmp 的用例仍属平台阻塞"
    - "沙箱限制：HMDFS 不允许创建硬链接（ln 'Operation not permitted'）、不允许扫描 / 根目录 → 上游 full-deps 用例（t4062-t4067/t4171）与个别用例属平台阻塞"
    - "沙箱缺 gcc/git/sqlite3 等外部工具：相关用例按平台阻塞记录"
    - "ldpreload 后端上游固有限制：vardict_fd=-1 /* TODO */（t3000 系列）"
  notes: "编译产物正确：tup（CLI，1.5MB）+ tup-ldpreload.so（依赖追踪注入库），两者同目录安装"

