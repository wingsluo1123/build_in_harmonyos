  note: |
    上游自带测试套件 test/ 的 981 个 t[0-9]*.sh 用例全量执行（100% 覆盖、无跳过，
    通过率 95.3%）。执行方式：for i in t[0-9]*.sh; do timeout -k 5 180 sh -e "$i"; done。
    适配前 270 项失败（165 项为 "Expected to write to file ... but didn't"，
