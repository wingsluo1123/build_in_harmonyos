knowledge_gained:
  - "OHOS/HarmonyOS 的 uname -s 返回 'HarmonyOS'（不是 Linux）：任何按 uname -s 分派的构建脚本都会走错分支，必须显式加 HarmonyOS 分支"
  - "glibc 与 musl 都把 /tmp 硬编码进 tmpfile()（P_tmpdir）：知识库 E002 推荐的『设置 TMPDIR』对使用 tmpfile() 的程序无效，必须改代码按 $TMPDIR → 项目内临时目录 → /tmp 回退"
  - "OHOS 运行时是 musl + Linux ABI（clang 定义 __linux__），但 musl 把 open64/fopen64/stat64 定义成宏，glibc 专有符号包装器必须用 __GLIBC__ 守卫隔离"
  - "ELF 构造器时序：OHOS 在 ldpreload shim 的 init_fd() 构造器之前就会打开文件，构造器里一次性建好的 fd 会永久丢失早期事件，须改为首次使用时惰性打开"
  - "tup 的 ldpreload shim 以 open() 的 O_WRONLY/O_RDWR 判定'写'，不包装 utimensat：对 GNU coreutils touch 成立（open(O_WRONLY|O_CREAT)），但对 toybox touch 不成立（utimensat / open(O_CREAT)），须同时补 utimensat 与 O_CREAT 实际创建两条路径"
  - "tup 的依赖图只跟踪文件：把目录的 utimensat 记为写会让 tup 为目录建节点且 create_list 标志永不清理（t5091），shim 需跳过 S_ISDIR"
  - "tup 只把数据库记录过的环境变量传给子进程（environ.c 的 default_env 白名单：PATH/HOME，Windows 下另有 TEMP/TMP；再加 Tupfile 里 export 过的）。在 /tmp 只读的平台上，必须把 TMPDIR 也列入该白名单，否则 clang/gcc 等命令都拿不到可写临时目录；改动该白名单需按源码注释递增 PARSER_VERSION"
  - "Conan 的补丁器不处理新增文件（--- /dev/null）hunk：补丁若需要新建文件，必须改写进既有文件，否则 gate2 直接 FAIL"
  - "跑上游测试套件前必须确认被测二进制身份：tup 的 test/tup.sh 会把仓库根放在 PATH 最前，仓库根的旧 tup 副本会静默遮蔽 build/tup，导致整套结果失真（本次曾出现 289 项伪失败）"

