patches:
  - patch_file: "patches/0001-common-TuxGuitar-lib-src-main-java-app-tuxguitar-util-TGUserFileUtils.java.patch"
    patch_description: "HarmonyOS 用户目录修复：JVM 在鸿蒙上把 user.home 报告为不可用的相对占位符（实测为字面量 \"?\"），导致 TuxGuitar 的配置/缓存/模板目录被写到相对当前工作目录的 \"?/.config/tuxguitar\"。改为在 user.home 不可用时回退到 POSIX HOME 环境变量（unix 系平台恒为绝对路径），无副作用：user.home 正常时行为完全不变"
    patch_type: "portability"
  - patch_file: "patches/0002-desktop-pom.xml.patch"
    patch_description: "HarmonyOS 构建修复：聚合器父 POM 仅按 Maven OS family（linux/windows/macos/freebsd）激活平台 profile 定义 org.eclipse.swt.groupId/artifactId，os.name=HarmonyOS 不匹配任何 family，属性未定义导致 Maven 直接 ProjectBuildingException。新增 os.name=HarmonyOS 激活的 platform-harmonyos profile"
    patch_type: "portability"
