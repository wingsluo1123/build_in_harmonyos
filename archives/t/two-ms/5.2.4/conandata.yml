# conandata.yml — two-ms 5.2.4 (Checkmarx/2ms, Apache-2.0)
#
# two-ms 是 Checkmarx/2ms 的 Homebrew formula 名（别名/产物 `2ms`），一个纯 Go 的
# 密钥/凭据泄露扫描 CLI：https://github.com/Checkmarx/2ms
# Go module: github.com/checkmarx/2ms/v5，tag v5.2.4（tag 时间 2026-03-11）。
#
# 上游构建（Makefile build-local / Dockerfile）：
#     GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o 2ms .
# 版本串由 -X github.com/checkmarx/2ms/v5/cmd.Version=<ver> 注入
# （上游 release.yml 写的是不带 /v5 的符号路径，对其 v5 module 无效，本配方用正确路径）。
# 依赖仅 Go 模块，经 GOPROXY 自动拉取（无 vendor/，无 cgo，无第三方 C/C++ 库）。
#
# OHOS 无原生 Go 工具链（knowledge E250）⇒ 配方自举下载 Go 官方 SDK 发布包；
# SDK 与产物均需 binary-sign-tool 自签名才能在鸿蒙上 execve（E128）；
# GOCACHE/GOMODCACHE/GOPATH/GOTMPDIR/TMPDIR 与链接输出落 ext2 分区（E166）。

