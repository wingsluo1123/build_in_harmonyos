# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: txacme/0.9.3
homepage: "https://github.com/mithrandi/txacme"

# 上游测试命令（tox.ini: trial 驱动；import 包 txacme + integration）
upstream_check_command: "trial --temp-directory=<tmp> txacme integration"

# conanfile.py build() 方法中是否已集成上游测试（test_package 消费者测试，见下）
upstream_test_in_build: false
upstream_test_command: "PYTHONPATH=src python3 -m twisted.trial txacme integration"

# 上游实际运行的测试（实测 2026-10-14，OHOS PC 运行时 Python 3.12.9）：
#   109 tests, 99 passed, 10 skipped, 0 failed
#   txacme 包：106 tests（98 passed / 8 skipped-libcloud 不可用）
#   integration 包：3 tests（1 passed / 2 skipped-需 ACME_HOST/LIBCLOUD_*）
upstream_tests:
  - file: src/txacme/test/
    source: txacme-0.9.3/src/txacme/test/
    description: "上游 txacme 单元测试（7 模块：test_challenges/test_client/test_endpoint/test_matchers/test_service/test_store/test_util）"
    command: "PYTHONPATH=src trial txacme"
  - file: src/integration/test_client.py
    source: txacme-0.9.3/src/integration/test_client.py
    description: "上游 integration 测试（FakeClientTests + 两个需外部 ACME 服务器的 staging 用例）"
    command: "PYTHONPATH=src trial integration"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_txacme.py
    description: "消费者 API 冒烟（txacme.__version__ / 模块来源 / Twisted 插件）+ HarmonyOS 特有用例（sys.platform==ohos / aarch64 / HarmonyOS）"
    command: "python3 test_txacme.py <site-packages>"

# 测试断言总数（上游实测通过用例数）
assertion_count: 109
