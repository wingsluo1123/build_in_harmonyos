# 软件级 manifest — typeshare

software: "typeshare"
homepage: "https://github.com/1Password/typeshare"
license: "MIT OR Apache-2.0"
description: >-
  从 Rust 类型定义同步生成 TypeScript / Swift / Kotlin / Scala / Go / Python
  类型文件的命令行工具（Rust 实现，crate `typeshare-cli`，二进制名 `typeshare`）。

# 版本索引（每个版本目录的适配状态见各自的 manifest.yaml）
versions:
  - version: "1.13.4"
    status: built
    build_system: custom
    path: "1.13.4"
    artifact: "bin/typeshare"
