knowledge_gained:
  - "typometer 是 Java 8 (source/target 8) Swing 应用，Maven 构建，依赖 net.java.dev.jna:jna:4.2.0；maven-shade-plugin 生成含 JNA 的 uber-jar（主类 com.pavelfatin.typometer.Application），maven-assembly-plugin 生成 bin 分发包（ref: DRAFT-typometer-1.0.1-java-maven-ohos-jar-app）"
  - "OHOS 上 os.name=HarmonyOS，JNA 4.2.0 的 Platform.isLinux() 返回 false，且 JNA jar 内不存在 harmonyos-aarch64 native dispatcher（Platform.RESOURCE_PREFIX=harmonyos-aarch64）（ref: DRAFT-typometer-1.0.1-jna-harmonyos-platform-detection）"
  - "适配补丁在 ScreenAccessor 中显式识别 HarmonyOS/OHOS，禁止选用 LinuxScreenAccessor（依赖 X11/libX11）与 WindowsScreenAccessor，回退到可移植的 AwtRobotScreenAccessor；避免在 OHOS 上误加载不存在的 native 库（ref: DRAFT-typometer-1.0.1-jna-harmonyos-platform-detection）"
  - "上游测试为 JUnit 4.12，surefire 汇总 89 个用例（CsvDataTest 2、MetricsTest 37、RecognitionTest 49、HeapTest 1），全部 headless 纯计算，在 HarmonyOS/aarch64 + JDK17 上全绿（ref: DRAFT-typometer-1.0.1-java-maven-ohos-jar-app）"
  - "Swing GUI 运行时需要 libfreetype.so.6（JDK libfontmanager.so 依赖），OHOS 开发镜像未预置该库；GUI 显示还依赖图形显示服务，属运行时环境项，不影响构建/单测/打包（ref: DRAFT-typometer-1.0.1-java-maven-ohos-jar-app）"
  - "Maven Central 直连在 OHOS 网络偶发重置，配方经阿里云 central 镜像（settings.xml mirror）构建，失败重试 3 次并回退直连（ref: DRAFT-typometer-1.0.1-java-maven-ohos-jar-app）"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)；R38: JAR 置于 libexec/（库包），无需 commands.json（ref: DRAFT-typometer-1.0.1-java-maven-ohos-jar-app）"

