# 软件级元数据 — typometer
# 文件位置: archives/t/typometer/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0
software: typometer
display: "Typometer"
description: "文本/代码编辑器打字延迟（视觉延迟）分析工具（Java/Swing GUI）"
category: utility
homepage: "https://github.com/pavelfatin/typometer"
license: "Apache-2.0"

build_system: maven

ohos_adaptation:
  key_points:
    - "显式识别 HarmonyOS/OHOS 平台，禁用依赖 X11/libX11 的 native 屏幕访问，回退到可移植 AWT Robot"
    - "JNA 4.2.0（net.java.dev.jna）无 harmonyos-aarch64 native dispatcher，OHOS 上不能走 native 路径"
    - "Maven Central 直连在 OHOS 网络不稳定，经阿里云 central 镜像构建（重试 + 直连回退）"
  common_dependencies:
    - bishengjdk 17
    - apache-maven 3.9.11

versions:
  "1.0.1":
    status: built
    build_date: 2026-10-14
