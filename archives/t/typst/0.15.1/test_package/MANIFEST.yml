# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: typst/0.15.1
homepage: "https://github.com/typst/typst"

# 上游测试命令（Rust cargo workspace，无 make check / ctest / meson test）
upstream_check_command: "cargo test --workspace --tests"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --target aarch64-unknown-linux-ohos --workspace --tests --no-fail-fast"

# 上游实际运行的测试程序：
#   集成套件 typst-tests（tests/suite/*.typ，222 个 .typ 文件逐段展开）
#   + 各 crate #[test] 单元测试（typst-cli smoke / typst-ide / typst-library /
#     typst-syntax / typst-utils / typst-layout / typst-kit / typst-eval /
#     typst-html / typst-pdf 等）
# 实测合计 3886 用例：3882 通过 / 4 失败（平台差异） / 0 跳过。
# doctest 未运行：rust-toolchain/1.97.1 基础设施包不含 rustdoc 二进制。
upstream_tests:
  - file: "tests/ (typst-tests 集成套件) 与 crates/*/src 单元测试"
    source: "typst-0.15.1/tests, typst-0.15.1/crates/*"
    description: "上游集成 + 单元测试；集成 3684 用例（3680 通过 / 4 平台差异失败 / 0 跳过），单元 202 通过"
    command: "cargo test --release --target aarch64-unknown-linux-ohos --workspace --tests --no-fail-fast"
    total: 3886
    passed: 3882
    failed: 4
    skipped: 0

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_typst.py
    description: "消费者冒烟测试：运行打包的 typst —— --version / eval / compile→PDF·PNG / fonts（12 项断言）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_typst.py"
    assertion_count: 12

# 鸿蒙特有测试（HarmonyOS-specific）：断言产物在本平台可用所必需的特性
# H1 ELF e_machine = AArch64(183)；H2 64 位小端；H3 PT_INTERP =
# /lib/ld-musl-aarch64.so.1（OHOS musl 加载器，非 glibc）；H4 含 .codesign
# 段（未签名 ELF 在 HarmonyOS 上无法 execve —— 正是配方 _sign_binaries()
# 修复的失败点）；H5 含 .note.ohos.ident 段；H6 `typst fonts` 在本平台发现系统字体
harmonyos_specific_tests:
  - file: test_typst.py
    description: "鸿蒙特有测试 6 项（AArch64 / 64 位小端 / OHOS musl 解释器 / code signature / OHOS identity note / 系统字体发现）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_typst.py"
    assertion_count: 6

# 依赖功能测试（dependency functional test）：typst 静态链接 openssl，产物无
# DT_NEEDED，仅运行 typst 无法证明依赖在 HarmonyOS 上真实可用。test_openssl.c
# 以消费者身份用 OHOS clang 编译并链接 conan openssl 包，在设备上执行真实
# OpenSSL 代码路径：version / EVP SHA-256 已知向量 / AES-256-GCM 加解密往返 /
# RAND_bytes。
dependency_tests:
  - file: test_openssl.c
    description: "依赖功能测试 5 项断言（SHA-256 向量 + AES-GCM 往返 + RAND_bytes），OHOS clang 编译消费者程序并实跑"
    command: "conan test ...（自动编译并执行）"
    assertion_count: 5
    dependencies:
      - "openssl/3.5.8.1"

# 测试断言总数（近似值）
# 上游 3886（3882 通过 / 4 平台差异失败）
# + test_package 消费者冒烟 12 + 鸿蒙特有 6 + 依赖功能 5
assertion_count: 3909
