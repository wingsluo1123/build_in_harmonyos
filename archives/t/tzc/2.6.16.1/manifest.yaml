knowledge_gained:
  - "raw Makefile 项目适配 Conan 配方三要素：get() 需显式 filename 避免解码器误选、tools.build:compiler_executables 须按 dict 取值而非单键、make 须显式 cwd=source_folder（knowledge_ref: E392）"
  - "OHOS/musl 运行期动态依赖解析：tzc 的 DT_NEEDED 为 libzephyr.so.4，须经 LD_LIBRARY_PATH（Conan VirtualRunEnv）解析；com_err 则由 e2fsprogs 静态库 libcom_err.a 静态链入、不出现在 DT_NEEDED；缺库时加载器以 127 退出并报 shared library（knowledge_ref: E019）"
  - "上游无自动化测试时，消费者验证由 test_package 端到端用例承担，判定全部基于 self.run/脚本退出码而非 Python assert；上游测试清点采信 E305 的『无传统测试用例』核验口径（knowledge_ref: E305, E239）"
