# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: usockets/0.7.1
homepage: "https://github.com/uNetworking/uSockets"

# uSockets Makefile has no 'check' target — no upstream test runner
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游源码包含 tests/sni_test.c 但无 Makefile 构建它
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "创建事件循环并释放，验证 uSockets 静态库链接和核心 API 符号可用"
    command: "./test_usockets"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
