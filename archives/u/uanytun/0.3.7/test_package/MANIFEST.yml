# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: uanytun/0.3.7
homepage: "https://www.anytun.org/"

# 上游测试命令（uanytun 的 src/Makefile 只有 all/clean/install 目标，无 check）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "经 PATH 调用已安装的 uanytun：验证 -v 版本输出与 -h 用法输出"
    command: "./test_uanytun"
  - file: conanfile.py
    description: "执行 uanytun -v 验证二进制可运行（原生非交叉构建时）"
    command: "uanytun -v"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
