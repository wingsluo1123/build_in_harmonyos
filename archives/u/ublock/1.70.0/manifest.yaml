  dependencies: []
  test_only_dev_dependencies:
    - "mocha (npm registry)"
    - "esm-world (npm registry)"
    - "scaling-palm-tree @15cf1ab (可选全量电池；GitHub 专属)"
  cc: "N/A (纯 JS)"
  cxx: "N/A (纯 JS)"

# 语言核验（R47 口径）：上游全仓 1028 文件，*.c/.h/.cpp/.hpp/.m/.mm 命中 0，
# 主体为 JavaScript（268 个 .js）+ 已提交的 WebAssembly 制品。lang-preflight 判定
# detected=javascript ≠ task=cpp；按仓库既有 JS/npm 范式（uglify/roblox-ts/
# leaflet-markercluster）继续适配，判定证据如实记录于 notes.md。
lang_preflight:
  detected_language: javascript
  task_language: cpp
  build_system: make
  manifest_evidence: "Makefile + package.json(engines node>=22/npm>=11)；无 CMake/autotools/meson/Cargo/go"
  source_stats: "源码 1028 文件，C/C++ 源文件 0；.js 268、.json 164、.html 42、.wasm 4"
  protocol_verdict: env_unsupported
  decision: "人工复核后按既有 JS/npm 范式继续适配（同族先例已并入 main）"

patches_applied:
  - "patches/0001-tools-explicit-bash.patch"   # OHOS/CI：显式 bash 调用 tools 子脚本，规避 shebang 执行失败（E165）

