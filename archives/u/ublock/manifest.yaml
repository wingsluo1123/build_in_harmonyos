software: ublock
display: "uBlock Origin"
description: "高效广谱内容拦截器（浏览器扩展 + @gorhill/ubo-core 静态网络过滤引擎，纯 JS）"
category: utility
homepage: "https://github.com/gorhill/uBlock"
license: GPL-3.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "目标库为纯 JavaScript 浏览器扩展 + 静态网络过滤引擎库，仓库内零 C/C++ 源文件（WebAssembly 制品已随仓），无原生编译。"
    - "真实执行上游 make 目标（make chromium → 扩展；make npm → @gorhill/ubo-core 库）。"
    - "构建期与 test_package 统一以 NODE_OPTIONS=--jitless 驱动 Node.js（OHOS E400：node 执行 JS 可能触发 V8 崩溃）。"
    - "bash/make/node/npm/python3 由 shutil.which 显式解析绝对路径，不依赖 shell 环境变量与 shebang 解释器路径（R33）。"
    - "settings.os 判定 in (Linux, OHOS)（R32）；OHOS os.version 子设置由 configure() rm_safe 处理。"
  common_dependencies: []

versions:
  "1.70.0":
    status: built
    build_date: "2026-10-12"
    conan_ref: "ublock/1.70.0"
