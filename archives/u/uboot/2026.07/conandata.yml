sources:
  url: "https://ftp.denx.de/pub/u-boot/u-boot-2026.07.tar.bz2"
  sha256: "78e8bfc382fe388f9b55aa1daf8c563522a037779b5d4c349d1415e381f1243e"
patches:
  "2026.07":
    - patch_file: "patches/0001-outputmakefile-source-link-fallback.patch"
      patch_description: "HMDFS/OHOS 全域禁 symlink：O= 分离构建的 source 链接创建失败时物化为路径文件（该链接无任何构建消费者，仅便利入口）"
      patch_type: "portability"
    - patch_file: "patches/0002-kbuild-script-exec-via-shell.patch"
      patch_description: "OHOS 内核无脚本 execve（binfmt_script 缺失，直接 exec 一律 EACCES rc=126）：Kbuild/Kconfig 中直接 exec 的辅助脚本（gcc/clang-version.sh、check-of.sh、check-local-export）改经 sh/$(CONFIG_SHELL) 解释执行；check-local-export 是 bash 脚本（shopt）且上游裸 exec（scripts/Makefile.build），设备 /bin/sh 无 shopt、bash 位于 HNP 工具链 PATH，配方以 CONFIG_SHELL=bash（Kbuild 标准覆盖位）提供 POSIX 超集解释器"
      patch_type: "portability"
    - patch_file: "patches/0003-binman-stamp-python-enable-guard.patch"
      patch_description: "NO_PYTHON=1 模式下 .binman_stamp 不再调用 binman（PYTHON_ENABLE 门），sandbox binman 节点为空=no-op，跳过零产物差异"
      patch_type: "portability"
    - patch_file: "patches/0004-tools-version-h-for-host-tools.patch"
      patch_description: "host 工具以尖括号包含 <version.h>，UBOOTINCLUDE 被 tools/Makefile 降级为 -idirafter（系统头之后才搜索）；OHOS SDK sysroot 自带 version.h 遮蔽 u-boot shim 头（PLAIN_VERSION 未定义）。常规 tools 目标也依赖上游已有的 tools/version.h 拷贝规则，使 objtree/tools/version.h 进入 -I 路径（先于系统目录），与 envtools/tools-only 行为一致"
      patch_type: "portability"
    - patch_file: "patches/0005-image-host-fit-check-sign-tools-gate.patch"
      patch_description: "上游 TOOLS_LIBCRYPTO=n（无 OpenSSL 构建机文档化模式）+ FIT_SIGNATURE=y 组合无法构建的修复之一：image-host.c 中 fit_check_sign() 的守卫用了裸 #ifdef CONFIG_FIT_SIGNATURE（目标符号），未走 include/linux/kconfig.h 的 USE_HOSTCC 重映射，导致 host 工具在无 OpenSSL 时仍编译出引用 TOOLS_LIBCRYPTO 门控对象的代码；改为与文件内其余守卫一致的 CONFIG_IS_ENABLED(FIT_SIGNATURE)（host 构建解析为 CONFIG_TOOLS_FIT_SIGNATURE）"
      patch_type: "bugfix"
    - patch_file: "patches/0006-fit-check-sign-gated-by-tools-fit-signature.patch"
      patch_description: "上游 TOOLS_LIBCRYPTO=n + FIT_SIGNATURE=y 组合无法构建的修复之二：fit_check_sign 工具的启用条件从 CONFIG_FIT_SIGNATURE（目标符号）改为 CONFIG_TOOLS_FIT_SIGNATURE（宿主侧签名栈开关，depends on TOOLS_LIBCRYPTO），与 FIT_SIG_OBJS 等签名对象的 TOOLS_LIBCRYPTO 门控对齐，避免链接到不存在的签名对象"
      patch_type: "bugfix"
    - patch_file: "patches/0007-fit-cipher-host-gate-via-tools-symbol.patch"
      patch_description: "上游 TOOLS_LIBCRYPTO=n + FIT_CIPHER=y 组合无法构建的修复之三：include/image.h 中 host 加密能力门用了裸 #if defined(CONFIG_FIT_CIPHER)（目标符号），host 工具编译包含共享的 generated/autoconf.h（目标侧 FIT_CIPHER=y 时必然定义）→ 无 OpenSSL 设备上 include <openssl/evp.h> 直接炸；改为 CONFIG_IS_ENABLED(FIT_CIPHER)（host 构建经 USE_HOSTCC 重映射解析为新增的 CONFIG_TOOLS_FIT_CIPHER，depends on TOOLS_LIBCRYPTO），有 OpenSSL 时能力保留、无 OpenSSL 时正确回落"
      patch_type: "bugfix"
    - patch_file: "patches/0008-sandbox-syshdrs-wchar-musl.patch"
      patch_description: "arch/sandbox/cpu 的 CFLAGS_USE_SYSHDRS 文件（eth-raw-os.o/initjmp.o/os.o/sdl.o）以系统头构建：上游规则去掉 -nostdinc 并把 -I 转 -idirafter（libc 头优先），但保留 -fshort-wchar；musl <bits/alltypes.h> 硬编码 typedef unsigned wchar_t（aarch64 32-bit）与 clang 在 -fshort-wchar 下的 __WCHAR_TYPE__ typedef（16-bit）重定义冲突（真机 initjmp.o 实证：alltypes.h:15 vs 资源目录 stddef.h:74）。上游已为 sdl.o 覆盖同款 filter-out -fshort-wchar 并加 -fno-lto（注释明言 musl），本补丁把该覆盖完整扩展到其余三个文件：这些文件零宽字符 API 使用，去掉该旗标后 wchar_t 交由 C 库定义；同时必须一并 -fno-lto——否则其 bitcode 携带 wchar_size=4 的 module flag，LTO 链接时 ld.lld 与全树 -fshort-wchar（16-bit）世界的 wchar_size=2 合并冲突，硬报 linking module flags 'wchar_size': IDs have conflicting values（真机第 5 轮 LTO 链接实证：initjmp.o at 2526 vs ld-temp.o）；退出 LTO 即不再参与 module flags 合并。与 sdl.o 先例一致，glibc 平台行为不变"
      patch_type: "portability"
    - patch_file: "patches/0009-capsule-esl-gen-via-python.patch"
      patch_description: "lib/efi_loader 的 capsule_esl_file 生成规则硬编码调用 efitools 的外部 C 工具 cert-to-efi-sig-list（上游 CI 通过 apt 安装 efitools；OHOS 工具链无该命令且无 OpenSSL 开发头可自行构建）。本补丁随源码附上该工具的忠实 Python 移植 scripts/cert-to-efi-sig-list.py（纯标准库：PEM 证书体 base64 解码即 i2d_X509 的 DER 字节，按 UEFI 规范包装 EFI_SIGNATURE_LIST/EFI_SIGNATURE_DATA，SignatureType=EFI_CERT_X509_GUID、SignatureHeaderSize=0、SignatureOwner 全零，与上游调用参数一致），并把生成规则改为 python3 $(srctree)/scripts/cert-to-efi-sig-list.py。本地已用 openssl x509 -outform DER 交叉验证：移植输出与 i2d_X509 字节级一致。CONFIG_EFI_CAPSULE_AUTHENTICATE=y 的 EFI 胶囊认证自测（test/lib/efi_loader）因此完整保留。2026-10-12 评审整改：EFI_CERT_X509_GUID 字节数组的 Data2 段修正为小端（0xe4,0x94，原 0x94,0xe4 与 efitools 的实际输出不符——GUID 混合端序 Data1/2/3 均小端——写出的 SignatureType 在固件中永不匹配、胶囊认证静默失效），并在生成器加载时增加运行期自证守卫（与 uuid.UUID(...).bytes_le 比对，用显式 if+sys.exit 而非 assert，python -O 下仍生效）；本地复核：完整 15 补丁链 patch_ng 重放应用通过、生成器正例（ESL 头 16 字节与 uuid.bytes_le 逐字节一致、size 字段全对）与反例（还原旧字节序即拒生成，含 -O 模式）双向验证"
      patch_type: "portability"
    - patch_file: "patches/0010-dhcpv6-ethaddr-compound-literal.patch"
      patch_description: "net/dhcpv6.c:35 的静态初始化器 IPV6_ALL_NODE_ETH_ADDR(dhcp_mcast_ip6) 对 const 限定全局变量的成员做下标访问——GCC 作为扩展接受 const 全局对象为常量表达式，clang 严格按 C99 6.6 拒绝（真机 clang 15.0.4 实证：initializer element is not a compile-time constant，已用最小复现 t8.c 在设备 clang 上双向验证：左值形式报错、复合字面量形式通过）。修复：改用同一初始化器的复合字面量 (struct in6_addr)DHCP6_MULTICAST_ADDR——C99 文件作用域复合字面量有静态存储期，其常量下标成员访问是标准常量表达式；字节值与原形式完全相同（同一宏展开），dhcp_mcast_ip6 全局变量保留（dhcpv6.c:207/257 仍以值使用）"
      patch_type: "portability"
    - patch_file: "patches/0011-keep-syms-lto-script-via-shell.patch"
      patch_description: "CONFIG_LTO=y（sandbox 经 arch/Kconfig `imply LTO` 默认开启，上游默认构建形态；qemu_arm64 无 LTO 不受影响）下顶层 Makefile 的 keep-syms-lto.c 生成规则直接 exec scripts/gen_ll_addressable_symbols.sh（生成链接器列表符号的 __ADDRESSABLE 引用、防 LTO 优化消符号，真机 make[1] Error 126 实证）——OHOS 内核无脚本 execve（binfmt_script 缺失，直接 exec 一律 EACCES rc=126），与 0002 同族；改为 $(CONFIG_SHELL) 前缀经 bash 解释执行，与 Kbuild 全链解释器覆盖一致；配套配方层 LTO_FINAL_LDFLAGS=-fuse-ld=lld（仅 OHOS）：clang -flto 链接需 LLVMgold 插件而设备无，ld.lld 在工具链 PATH（实测）"
      patch_type: "portability"
    - patch_file: "patches/0012-ldflags-no-warn-rwx-guard-for-lld.patch"
      patch_description: "KBUILD_LDFLAGS 的 --no-warn-rwx-segments 是 GNU ld 的警告抑制旗标（上游以 ld-option 对 $(LD)=GNU ld 探测通过后加入），lld 无此旗标且硬报 unknown argument（真机 lld 链接 u-boot 目标实证）——探测用链接器与实际链接器错配的典型；经 lld 链接时（LTO_FINAL_LDFLAGS 带 -fuse-ld=lld，即 OHOS 分支）跳过该探测，其余环境（含 CI clang+GNU ld）保持上游原样"
      patch_type: "portability"
    - patch_file: "patches/0013-create-symlink-cp-fallback.patch"
      patch_description: "scripts/Makefile.autoconf 的 create_symlink 规则（CONFIG_CREATE_ARCH_SYMLINK，arm/arm64 目标专属；sandbox 不触发）在 include/config.h 依赖链上用 ln -fsn 建 asm/arch 链接——OHOS 全盘禁 symlink（EPERM，真机 qemu_arm64 首建实证：make[2] Makefile.autoconf:136 失败→auto.conf 缺失连锁）。修复：ln 失败自动回退 cp -r 真实目录拷贝（include 路径解析完全一致）；rm -rf 先行防上次 cp 遗留目录让 ln -fsn 嵌套链接；cp 仅当源存在时执行——上游 ln -fsn 对不存在的 arch-$(SOC)/arch-$(CPU) 目录会静默建悬空链接（无害：无任何 <asm/arch/*> 消费者；qemu_arm64 即此场景，CPU=armv8 但上游无 arch-armv8 目录），cp -r 缺失源却是硬错误（真机第二轮实证：cp: bad arch-armv8 No such file or directory→Error 2），以 [ -e ] 门对齐悬空语义；正常文件系统（CI/Linux）ln 成功即行为与上游逐字节一致，零配方改动"
      patch_type: "portability"
    - patch_file: "patches/0015-sandbox-nand-tmpdir.patch"
      patch_description: "sandbox NAND 驱动（drivers/mtd/nand/raw/sand_nand.c）经 os_mktemp 在硬编码路径 /tmp/u-boot.nand<N>.XXXXXX 创建后备文件；OHOS /tmp 只读 → os_mktemp EROFS，driver probe 整体失败（真机实证：board_nand_init() Failed to get sandbox NAND: -30，NAND 容量退化为 0 MiB，ut bootstd 全部子测试日志可见），全部依赖 UCLASS_MTD 的测试（test/dm/nand.c 等）随之失去设备。修复（三文件）：sand_nand.c 改读宿主 TMPDIR 环境变量（测试环境已将 TMPDIR 导出到可写目录；与 os.c 既有 getenv() 式宿主变量消费同思路），未设置时回退 /tmp；固定 30 字节栈缓冲改为按 strlen(tmpdir)+40 动态分配（真机 TMPDIR 路径远超 30 字节），malloc 失败返回 -ENOMEM 并走既有 err_chip 清理路径、成功路径 free；并一并补齐读取宿主环境变量所需的 os_getenv() 接口——上游 include/os.h 与 arch/sandbox/cpu/os.c 均无该函数（缺之 sand_nand.c 引用即编译失败），故 os.c 新增直通宿主 getenv() 的实现、include/os.h 补声明。Linux/CI（TMPDIR 未设置）行为与上游逐字节一致；真机修复后 NAND 恢复 4100 MiB 枚举。与 0002/0011/0013 同族（设备侧只读路径/缺失机制的上游适配）"
      patch_type: "portability"
    - patch_file: "patches/0017-expo-textline-cursor-at-text-end.patch"
      patch_description: "expo 文本行打开态的光标位置：SDL 门控测试面接入后 cedit_render_lineedit 成为 16 个失败项的最后一项。test/boot/cedit.c:413 断言既存文本 my-machine 打开渲染帧的 bz2 压缩长度 5283——该帧内光标画在文本末尾，且测试引入提交 c43791c4 的提交信息明言 The cursor should start at the end（常量自此在各发行标签间未变）。scene_textline_render_deps 打开分支在文本绘制完成后执行 vidconsole_entry_restore(cons, &scn->entry_save)，把控制台状态回卷到 scene_textline_open 时刻的存档（彼时 set_cursor_pos 已把笔位钉在字段起点 x=250）→ vidconsole_set_cursor_visible 经 xcur 分支把光标画在字段起点（帧长 5270）≠ 烘焙值。修复=该处改调 vidconsole_entry_start（清位置历史、不回卷笔位）：光标回归刚绘完文本的实时笔位 x=329=文本末尾，与烘焙帧逐字节一致。逐键编辑路径 scene_textline_send_key 的 entry_restore/entry_save 配对保持原样；真机验证：cedit_render_lineedit 四帧 5336/5363/5283/5170 全中、0 失败，cedit_render 12 帧逐字节不变、空场帧 4851 不变；上游测试文件零修改（恢复上游行为语义，而非改测试常量）"
      patch_type: "bugfix"
