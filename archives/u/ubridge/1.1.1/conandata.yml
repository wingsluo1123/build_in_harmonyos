# ubridge 1.1.1 — 源码与补丁清单（conanfile.py 的唯一事实来源）
sources:
  url: "https://github.com/GNS3/ubridge/archive/refs/tags/v1.1.1.tar.gz"
  sha256: "9bf68e46fd68f262ccd3f4d5244d50f44fe3a4f09c57cddc4670fa167a0380d8"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Makefile: 把 HarmonyOS 与 Linux 同等对待（OHOS 的 uname 返回 HarmonyOS，否则 LINUX_RAW 分支与 brctl/link/docker/netlink 源文件全被跳过），并纳入 OHOS 线程取消兼容层"
    patch_type: "portability"
  - patch_file: "patches/0002-src-hypervisor_brctl.c.patch"
    patch_description: "E091: OHOS 的 UAPI linux/socket.h 与 musl sys/socket.h 重复定义 struct sockaddr_storage；在包含内核头的语句块内把该 struct tag 临时改名、包含后立即 undef（无条件改写，不含平台条件编译）"
    patch_type: "portability"
  - patch_file: "patches/0003-src-hypervisor_docker.c.patch"
    patch_description: "E091: 同上（hypervisor_docker.c）"
    patch_type: "portability"
  - patch_file: "patches/0004-src-hypervisor_link.c.patch"
    patch_description: "E091: 同上（hypervisor_link.c）"
    patch_type: "portability"
  - patch_file: "patches/0005-src-netlink-nl.c.patch"
    patch_description: "E091 同上（netlink/nl.c）；并把 glibc 专有的 ushort 改为标准的 unsigned short（musl 未定义 ushort）"
    patch_type: "portability"
  - patch_file: "patches/0006-src-netlink-nl.h.patch"
    patch_description: "把 glibc 专有的 ushort 改为标准的 unsigned short（musl 未定义 ushort）"
    patch_type: "portability"
  - patch_file: "patches/0007-src-nio_linux_raw.c.patch"
    patch_description: "E091 同上（nio_linux_raw.c，<linux/if.h> 间接引入 linux/socket.h）"
    patch_type: "portability"
  - patch_file: "patches/0008-src-nio_tap.c.patch"
    patch_description: "E091 同上（nio_tap.c，<linux/if_tun.h>）"
    patch_type: "portability"
  - patch_file: "patches/0009-src-ohos_pthread_compat.c.patch"
    patch_description: "新增 OHOS 线程取消兼容层：musl 既不声明也不导出 pthread_cancel/pthread_testcancel（E085/E513），用 SIGUSR1 + 处理器内 pthread_exit 保留「定向退出 + 可 join」语义"
    patch_type: "portability"
  - patch_file: "patches/0010-src-ubridge.c.patch"
    patch_description: "main() 中调用 ubridge_ohos_pthread_cancel_init() 安装取消用信号处理器（非 OHOS 为空操作）"
    patch_type: "portability"
  - patch_file: "patches/0011-src-ubridge.h.patch"
    patch_description: "补充声明 OHOS 线程取消兼容接口"
    patch_type: "portability"
