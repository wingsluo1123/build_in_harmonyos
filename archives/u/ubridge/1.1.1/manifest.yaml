tests:
  # 上游 v1.1.1 无 make check / ctest / meson test 目标，测试是 tests/ 下的
  # Python 黑盒套件（每套一个 main()，用 r.check(描述, 条件) 断言，通过 TCP
  # 控制端口驱动 ubridge）。
  upstream_suite: "tests/brctl 7 套 + tests/link 1 套 = 8 套（119 个 r.check 检查点）"
  upstream_test_command: "cd tests/brctl && python3 test_no_privs.py"
  upstream_test_in_build: true
  upstream_tests_executed: 4      # test_no_privs.py 的 4 个检查点，已集成进 build()
  upstream_tests_passed: 4
  upstream_suites_executed: 1     # 8 套中唯一无需特权的
  upstream_suites_total: 8
  upstream_suites_blocked: 7      # 缺 ip 工具 + 无 root/cap_net_admin（逐套原因见 notes.md）
  upstream_tests_modified: false
  test_package_assertions: 20
  test_package_passed: 20

knowledge_gained:
  - "E091: OHOS 的 UAPI linux/socket.h 与 musl sys/socket.h 重复定义 struct sockaddr_storage；在包含内核头的语句块内把该 struct tag 临时改名、包含后 undef 即可（无条件改写，非平台宏）"
  - "E085/E513: OHOS musl 不声明也不导出 pthread_cancel/pthread_testcancel；ubridge 用法是 cancel+join，空实现会让 join 挂死，需用保留信号(SIGUSR1)+处理器内 pthread_exit 保留取消语义"
  - "OHOS 的 uname 返回 HarmonyOS（uname -o 仍是 GNU/Linux），上游 ifeq ($(shell uname), Linux) 会整段跳过 Linux 源文件，须用 $(filter Linux HarmonyOS,...) 判定"
  - "glibc 专有类型 ushort 在 musl 未定义（u_short 才有），须改 unsigned short"

