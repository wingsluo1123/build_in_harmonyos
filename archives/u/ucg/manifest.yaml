software: ucg
display: Universal Code Grep
description: Concurrent source-code search with PCRE2
category: system
homepage: https://github.com/gvansickle/ucg
license: GPL-3.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - Preserve portable ARM search and x86 architecture guards
    - Reject negative GNU grep version banners for the optional comparator
    - Execute all original tests with full corpora and exact XFAIL causes
  common_dependencies:
    - pcre2
    - argp-standalone
versions:
  "0.3.3":
    status: built
    build_date: "2026-10-12"
    conan_ref: ucg/0.3.3
