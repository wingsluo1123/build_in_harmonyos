# conandata.yml — uefitool 0.28.0-a73
# 位置: archives/u/uefitool/0.28.0-a73/conandata.yml
# 本文件是源码 URL + SHA256 + 补丁的唯一权威来源。
# conanfile.py 通过 self.conan_data["sources"] 与 apply_conandata_patches() 读取。

sources:
  # 版本号 `0.28.0-a73` 的解：上游有三个分支，`0.28.0` 是 **old_engine** 的版本号，
  # 而本任务要的 `a73` 对应 **new_engine** 分支的 tag `A73`
  # （commit 29796629，2026-01-26；version.h 里写着 `"NE alpha 73"`）。
  # 因此 URL 必须取 tag `A73`，不能取 `0.28.0` 那个 release。
  #
  # URL 列表三条硬规则（与 archives/r/ruy、archives/r/reliable/1.3.5、
  # archives/q/qdl/2.7 一致）：
  #   1) 第一项必须是官方源；
  #   2) 必须含 ghfast.top 一项（本地 ohc-run.py conan-verify 的 G2 会据此
  #      预防 E017：缺项会被注入 gh-proxy.com/ghfast.top/github.com 双重代理）；
  #   3) 其余镜像项写成「镜像前缀 + 官方完整 URL」，不得裸用镜像域名。
  #
  # 实测（2026-10-04，本机 curl -sL 下载）：
  #   2400878 bytes，解包根目录 UEFITool-A73/（单根目录，strip_root=True 可用）；
  #   sha256 = 81d9944d75e27d4afbc8559d9ba913552006fd21ce9cadf357a4a0f58e59507e
  url:
    - "https://github.com/LongSoft/UEFITool/archive/refs/tags/A73.tar.gz"
    - "https://ghfast.top/https://github.com/LongSoft/UEFITool/archive/refs/tags/A73.tar.gz"
    - "https://gh-proxy.com/https://github.com/LongSoft/UEFITool/archive/refs/tags/A73.tar.gz"
  sha256: "81d9944d75e27d4afbc8559d9ba913552006fd21ce9cadf357a4a0f58e59507e"

# 本包**零补丁**：上游源码一行不改。
# 唯一让两个 CLI 能被构建的改动是适配侧自带的构建入口
# （cmake/CMakeLists.txt，由 conanfile.py 的 export_sources() 随包带出），
# 它不在上游源码树里，因此不构成 patch。
patches: []
