software: ufiformat
display: "ufiformat"
description: "Command-line formatter for floppy disks in UFI-compatible USB floppy drives"
category: system
homepage: "https://github.com/tedigh/ufiformat"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2011-era configure 无 triplet 规范化，无需 --build/--host 与 config.sub 改造"
    - "libext2fs 来自已发布的 e2fsprogs/1.47.4，静态链接需 -lcom_err -luuid 闭合"
    - "终端工具全静态链接（-static），产物需 OHOS 自签名"
    - "SCSI/设备主设备号头文件用 __has_include 探测 + ABI 常量回退，无平台宏"
  common_dependencies:
    - e2fsprogs

versions:
  "0.9.9":
    status: built
    build_date: "2026-10-13"
    conan_ref: "ufiformat/0.9.9"
