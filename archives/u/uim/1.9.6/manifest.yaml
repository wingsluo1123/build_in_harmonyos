# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "uim 1.9.6 OHOS 适配：禁用所有 GUI 后端，仅保留核心库 + sigscheme (ref: E545)"
  - "getpeereid() 在 OHOS 不可用，通过 stub + 编译器宏修复 (ref: E545)"
  - "HMDFS execve() 限制：autotools helper scripts 需 shebang 指向真实 bash ELF (ref: E545)"
  - "config.status 的 umask 077 mktemp 临时目录在 HMDFS UID 映射下对 worker 进程不可写，configure 需放宽为 umask 022 (ref: E011)"
  - "OHOS 制品仓 gauche/0.9.15.2 存在两处结构性缺陷：share/gauche-0.98/0.9.15/lib 下 81 个条目是指向构建机 .conan2 路径的断链绝对符号链接；且完全不发布带 C 实现的 ext 模块（gauche.charconv/uvector/unicode/termios/process 等 14 个，pristine 包下 (use gauche.charconv) 直接段错误）。宿主侧解法：以 pinned 官方 Gauche 源码包就地 configure + make ext/charconv 重建 gauche--charconv.so，并用 lib/tools/precomp 预编译纯 Scheme 模块"
  - "HMDFS：子进程若继承与真实 cwd 不一致的 PWD，getcwd()/pwd 均失败，autoconf 直接报 'configure: error: working directory cannot be determined'；每个子进程必须注入 PWD=<其 cwd>"
  - "uim test/ 的上游 make check 由 AM_CONDITIONAL(DO_CHECK_IN_TEST, have_gosh_and_gaunit && enable_debug) 门控，默认不注册任何用例；须显式以 gosh test/run-test.scm 驱动 28 个 test-*.scm"
