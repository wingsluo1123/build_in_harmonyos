version: "1.9.6"
software: "uim"

# 编译状态
status: built

# 编译日期
build_date: "2026-10-10"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/uim/uim/releases/download/1.9.6/uim-1.9.6.tar.gz"
  sha256: "5436f5507f64c772da64e8ad7e598cb8b32dc9e5617e01d54e4a71eaf5566a3d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-linux-gnu"
    - "--host=aarch64-linux-gnu"
    - "--disable-qt5"
    - "--disable-qt6"
    - "--disable-gtk2"
    - "--enable-gtk3=no"
    - "--disable-m17n"
    - "--disable-anthy"
    - "--disable-canna"
    - "--disable-eb"
    - "--disable-wnn"
    - "--disable-prime"
    - "--disable-man"
    - "--disable-scm-docs"
    - "--disable-pad"
    - "--disable-skelson"
    - "--disable-dependency-tracking"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

