# uim — 软件级 manifest
# 文件位置: archives/u/uim/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: uim
display: "uim"
description: "多语言输入法库（Multilingual Input Method Library），支持 SCHEME 扩展和多种输入法引擎"

# 分类标签
category: library

# 官网 URL
homepage: "https://uim.im/"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "禁用所有 GUI 后端（GTK2/3、Qt3/4/5/6、M17N、Anthy、Canna、WNN）"
    - "getpeereid() 在 OHOS 不可用，需 stub 跳过"
    - "-Duim_internal_getpeereid=getpeereid 修复链接期符号未定义"
    - "HMDFS 不允许 execve() 脚本，autotools helper shebang 需指向真实 bash ELF"
    - "配置 --build=aarch64-linux-gnu --host=aarch64-linux-gnu 绕过 OHOS 检测"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.9.6":
    status: built
    build_date: "2026-10-01"
