sources:
  url: "https://github.com/umurmur/umurmur/archive/refs/tags/v0.3.1.tar.gz"
  sha256: "8327dd0b2c5bd187a38d098295e896a6b85d698c9268205bcb27f6244f760a73"

patches:
  "0.3.1":
    - patch_file: "patches/0001-modern-cmake-dependency-targets.patch"
      patch_description: "Use the protobuf-c include root and consume Conan's OpenSSL imported target when available"
      patch_type: "portability"
    - patch_file: "patches/0002-report-release-version.patch"
      patch_description: "Report the v0.3.1 release version in CLI and protocol metadata"
      patch_type: "backport"
    - patch_file: "patches/0003-flush-first-frame-after-tls-handshake.patch"
      patch_description: "Flush application frames queued before the nonblocking TLS handshake becomes ready"
      patch_type: "portability"
    - patch_file: "patches/0004-relocatable-config-and-rpath.patch"
      patch_description: "Resolve the default configuration relative to the executable and disable absolute install RUNPATHs"
      patch_type: "portability"
