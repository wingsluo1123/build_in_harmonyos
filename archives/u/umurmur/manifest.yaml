software: umurmur
display: "uMurmur"
description: "兼容 Mumble 协议的轻量语音通信服务器"
category: network
homepage: "https://github.com/umurmur/umurmur"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "使用 HarmonyOS clang 与 Conan CMake 工具链原生构建"
    - "复用已发布的 OpenSSL、libconfig 与 protobuf-c 依赖"
    - "消费者测试关联验证 TLS 控制通道、Protobuf-C 帧与同一会话的加密 UDP 数据通道"
  common_dependencies:
    - openssl
    - libconfig
    - protobuf-c

versions:
  "0.3.1":
    status: built
    build_date: "2026-10-12"
    conan_ref: "umurmur/0.3.1"
