# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl libc 无 getpass()：GNUSTEP 分支的交互式密码读取需桩实现（补丁 0001，仿非 GNUSTEP 分支的 fgets 回退）（knowledge_ref: E093）"
  - "musl regex.h 无 REG_STARTEND（GNU 扩展）；且 regexec() 要求 NUL 终止字符串——XADRegex 直接传 NSData bytes 在 musl 堆上越界读，导致 tar.gz 子档案识别静默失败（补丁 0002；llvm-nm/堆布局实证，glibc 下碰巧可用）（knowledge_ref: DRAFT-UNAR-1108-MUSL-REGEXEC-NUL-OVERREAD）"
  - "gnustep-base 在库加载期（constructor 阶段，早于 main）读取 TZ 并固化时区状态：OHOS 无 TZ 环境变量、无 /etc/localtime、无 /usr/lib/zoneinfo → 固化失败状态 → 日期/日历 API 抛 NSInvalidArgumentException、嵌套档案行为异常。main() 内 setenv 太迟（补丁 0003/0004 仅为第二道防线）；解法 = libtzguard.so 以首个 DT_NEEDED 链接，constructor 先行设 TZ=UTC（knowledge_ref: DRAFT-UNAR-1108-GNUSTEP-TZ-CONSTRUCTOR）"
  - "conan 生态 zlib/bzip2/icu 包在本平台为静态库（libz.a/libicuuc.a/libicudata.a）→ -lz/-licuuc 静态链接进二进制，运行时 NEEDED 无对应 .so；XADMaster 自带 bzip2 算法（BWT.c），仅 CSBzip2Handle.h 需要 bzlib.h 头文件；但预编译 libgnustep-base.so 动态 NEEDED libz.so → 链接期静态与运行期 .so 可发现是两个独立要求（knowledge_ref: DRAFT-UNAR-1108-CONAN-STATIC-LINK-FABRIC）"
  - "最终二进制 NEEDED = libtzguard.so(首位) + libgnustep-base.so.1.31 + libwavpack.so.1 + libobjc.so + libc++_shared.so + libc.so（knowledge_ref: DRAFT-UNAR-1108-GNUSTEP-TZ-CONSTRUCTOR）"

