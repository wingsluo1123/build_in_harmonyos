# test_package/MANIFEST.yml
# 上游官方测试声明文件
# unar 1.10.8 (MacPaw/XADMaster) 上游无自动化测试套件：
#   - 源码树无 tests/ 目录（tarball 清点：0 个 tests/ 条目）
#   - Makefile.linux 无 check/test 目标
#   - .github/workflows 仅含构建 + CodeQL 分析，无测试步骤
# 消费侧验证由 test.sh 覆盖（--version + zip 列表/解压/内容校验 + tar.gz 嵌套档案识别/解压/内容校验）。

package: unar/1.10.8
homepage: "https://github.com/MacPaw/XADMaster"

# 上游测试命令 (上游无测试套件，故为空)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — unar/lsar --version + zip 列表/解压/内容校验 + tar.gz 嵌套档案识别/解压/内容校验"
    command: "bash test.sh"

# 上游测试断言总数
assertion_count: 0
