# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: unarj/2.63a
homepage: "https://arj.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: (none — unarj has no upstream test suite)
    source: unarj-2.63a/
    description: "unarj source has no test suite; Makefile only has build/clean/install targets"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_unarj.sh
    description: "Smoke test: runs unarj binary and verifies it prints usage info"
    command: "bash test_unarj.sh /path/to/unarj"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
