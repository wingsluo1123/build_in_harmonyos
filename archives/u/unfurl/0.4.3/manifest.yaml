software: unfurl
# 版本级 manifest 模板
# 文件位置: archives/u/unfurl/0.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-07-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 GitHub archive v0.4.3 tag)
  url: "https://github.com/tomnomnom/unfurl/archive/refs/tags/v0.4.3.tar.gz"

  # 源码校验和 (实测值)
  sha256: "124e7c476af31745838322422771c664280d192aa56b586e431fc0b9b422ea50"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: custom

  # 配置选项列表
  configure_options: []
  # Go 工具链, 无 configure 步骤

  # 编译依赖列表 (格式: name/version)
  dependencies: []
  # 纯 Go 模块, 构建期无 C/C++ 依赖 (CGO_ENABLED=0)

  # 编译器 (Go 工具链, 非 C/C++ 编译器)
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 上游源码无需补丁 (纯 Go, GOOS=ohos GOARCH=arm64 直接交叉编译)

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "unfurl 是 Go 写的 CLI 工具 (tomnomnom/unfurl), 非 C/C++ 库, 使用 custom 构建系统 (go build)"
  - "HarmonyOS aarch64 交叉编译: GOOS=ohos GOARCH=arm64 CGO_ENABLED=0 (Go 1.22+ 支持 ohos)"
  - "package_type=application, cpp_info.libs=[] (无可链接库), bindirs=['bin']"
  - "上游仅有 1 个测试函数 TestFormat (format_test.go, 32 个 case), 用 go test 验证"
  - "go.sum 中依赖 Cgboal/DomainParser 与 jakewarren/tldomains, 由 go build 自动拉取"
