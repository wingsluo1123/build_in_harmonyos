software: unfurl
# 版本级 manifest 模板
# 文件位置: archives/u/unfurl/0.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-07-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 GitHub archive v0.4.3 tag)
  url: "https://github.com/tomnomnom/unfurl/archive/refs/tags/v0.4.3.tar.gz"

  # 源码校验和 (实测值)
  sha256: "124e7c476af31745838322422771c664280d192aa56b586e431fc0b9b422ea50"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0 GOOS=linux GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
    - "go build -trimpath -ldflags '-s -w'"
  # Go 工具链, 无 configure 步骤

  # 编译依赖列表 (格式: name/version)
  dependencies: []
  # 纯 Go 模块, 构建期无 C/C++ 依赖 (CGO_ENABLED=0)

  # 编译器 (Go 工具链, 非 C/C++ 编译器)
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 上游源码无需补丁 (纯 Go, GOOS=ohos GOARCH=arm64 直接交叉编译)

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "unfurl 是 Go 写的 CLI 工具 (tomnomnom/unfurl), 非 C/C++ 库, 使用 custom 构建系统 (go build)"
  - "标准 Go 工具链没有 ohos 目标, GOOS=ohos 会直接报 unsupported GOOS/GOARCH; HarmonyOS 基于 Linux 内核, 正确参数是 GOOS=linux GOARCH=arm64 CGO_ENABLED=0 (与仓库内 15+ 个 Go 包一致)"
  - "Go 1.26.0 的 HarmonyOS 二进制存在 corrupted 问题, 需使用 1.26.3 (~/usr/local/go1263); go 未必在 profile PATH 中, 配方需自行探测 GOROOT"
  - "no_copy_source=True + basic_layout 会分离 source_folder 与 build_folder, build() 的 CWD 是 build_folder, 必须 chdir 到 source_folder 才能找到 go.mod"
  - "self.run(env=...) 的 env 形参接收环境脚本名(str/list), 传 dict 会抛 TypeError; 注入环境变量应使用 conan.tools.env.Environment"
  - "package_type=application, cpp_info.libs=[] (无可链接库), bindirs=['bin']; CLI 工具需在软件级目录声明 commands.json (R38)"
  - "上游仅有 1 个测试函数 TestFormat (format_test.go, 32 个 case), 已在 build() 中通过 go test ./... 接入 CI"
  - "unfurl 遇到未知 mode 只向 stderr 打印 unknown mode 且退出码仍为 0, 因此 test_package 必须断言 stdout 内容, 否则是恒真的假阳性测试"
  - "go.sum 中依赖 Cgboal/DomainParser 与 jakewarren/tldomains, 由 go build 自动拉取, 需 GOPROXY=https://goproxy.cn,direct"
