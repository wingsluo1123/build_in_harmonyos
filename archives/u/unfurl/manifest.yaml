software: unfurl

display: "unfurl"
description: "Pull out bits of URLs provided on stdin (scheme, domain, apex, path, query keys/values)"
category: utility
homepage: "https://github.com/tomnomnom/unfurl"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 项目, 标准 Go 工具链无 ohos 目标; HarmonyOS 基于 Linux 内核, 使用 GOOS=linux GOARCH=arm64 CGO_ENABLED=0 生成静态 ELF。"
    - "Go 1.26.0 在 HarmonyOS 上二进制损坏, 需使用 1.26.3 (~/usr/local/go1263)。"
    - "GOPROXY=https://goproxy.cn,direct 加速 Go module 拉取。"
    - "no_copy_source=True 配合 basic_layout 会分离 source/build 目录, 必须 chdir 到 source_folder 再执行 go build。"
    - "命令行工具包需声明 commands.json (R38)。"
  common_dependencies: []

versions:
  "0.4.3":
    status: built
    build_date: "2026-07-31"
    conan_ref: "unfurl/0.4.3"
