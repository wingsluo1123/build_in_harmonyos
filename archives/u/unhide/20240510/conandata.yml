    - patch_file: "patches/0001-fix-wait-include.patch"
      patch_description: "include <wait.h> -> <sys/wait.h> (glibc ships a wait.h redirect, musl has none; nwipe 0.39 precedent)"
      patch_type: "portability"
    - patch_file: "patches/0002-add-limits-include.patch"
      patch_description: "add #include <limits.h> to unhide-linux-compound.c / unhide-linux-procfs.c (PATH_MAX users; glibc satisfied it transitively, musl needs the explicit include)"
      patch_type: "portability"
