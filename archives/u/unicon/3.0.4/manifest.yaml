# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "1990s pth 私有线程库 → pthread 全量移植（17 处）：pth_spawn/pth_join/pth_terminate → pthread_create/pthread_join/pthread_exit；原 32KB 线程栈在 64 位下不足以支撑 dlopen+模块加载深栈 → 256KB"
- "malloc 中硬编码结构头常数（6/4）以 32 位指针为前提，64 位下每条少分配 4 字节 → 堆损坏段错误；统一改 sizeof 基线"
- "1990s client/server 协议不对称：client 有命令而 server handler 无对应 case（IMM_SET_INPUTMODE 被 default 丢弃）；移植时须按命令头常量表逐一对照 handler switch"
- "上游 install 目标不安装头文件时，recipe package() 须从源码树补拷 include/"
- "手写 Makefile.in 配方模式：CC/CXX 环境变量化 + -fPIC，由 AutotoolsToolchain 的 conanbuild 环境注入（R33）"
- "卸载顺序：dlclose/UnloadImm 前必须先完成模块清理（析构），否则析构访问已释放的 slib/pImmOp 崩溃"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

