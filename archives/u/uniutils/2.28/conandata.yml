sources:
  url: "https://billposer.org/Software/Downloads/uniutils-2.28.tar.gz"
  sha256: "41c14c0223376f2d96c80c2ba1b1494fc74cd8982d561630e688e2245aaf3364"
  filename: "uniutils-2.28.tar.gz"

patches:
  - patch_file: "patches/0001-uniname-include-ctype.patch"
    description: "显式包含 ctype.h，提供 isspace() 声明并适配严格 C99/C11 编译器"
  - patch_file: "patches/0002-configure-ohos-mktemp.patch"
    description: "OHOS 上 mktemp 目录权限异常，configure 改用 umask 022 的普通 mkdir"
  - patch_file: "patches/0003-runtime-gettext-check.patch"
    description: "libintl.h 存在不代表 gettext 运行时可用，仅在函数可链接时启用 NLS"
  - patch_file: "patches/0004-strict-c99-void-functions.patch"
    description: "补齐严格 C99 函数签名和标准头文件，并用 stdint 的 uint32_t 替换 BSD 专有 u_int32_t"
  - patch_file: "patches/0005-unireverse-unsigned-char.patch"
    description: "OHOS 上 char 为无符号类型，修正 UTF-8 高位判断和 EOF 处理"
