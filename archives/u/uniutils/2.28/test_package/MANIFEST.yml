# test_package/MANIFEST.yml
# uniutils upstream has no formal test suite; the consumer test exercises the
# installed Unicode tools with real UTF-8 data.

package: uniutils/2.28
homepage: "https://billposer.org/Software/uniutils.html"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Run uniname on real UTF-8 data and check the resulting Unicode name; verify installed tools are executable"
    command: "sh test.sh"
    assertions:
      - "all seven expected executables are installed"
      - "uniname identifies Greek small letter beta"
      - "unidesc accepts UTF-8 input and emits output"
      - "unireverse reverses UTF-8 characters without changing their encoding"
      - "unihist -cg reports U+03B2 for the input"
      - "ExplicateUTF8 explains U+03B2 as a valid UTF-8 sequence"
      - "unifuzz is deterministic for a fixed seed"
      - "unisurrogate 1F600 emits U+D83D U+DE00"

assertion_count: 8
