version: "0.21.10-r3"
software: "unrtf"
status: built
build_date: "2026-07-25"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/unrtf/unrtf-0.21.10.tar.gz"
  sha256: "b49f20211fa69fff97d42d6e782a62d7e2da670b064951f14bbff968c93734ae"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: "--datarootdir=${prefix}/share"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-autotools-config.patch"
  - "0002-output-include-stdint.patch"

knowledge_gained:
  - "GNU autotools 项目在 HarmonyOS 上需处理 config.guess/config.sub 对 HarmonyOS/linux-ohos 的识别。"
  - "configure 生成 config.status 时的 umask 077 会导致临时 awk 文件权限问题，需改为 umask 022。"
  - "HarmonyOS/HMDFS 环境下 make jobserver FIFO 可能失败，构建与安装使用 -j1。"
  - "Windows/MinGW 本地验证需通过 Git Bash 执行 autotools，并接入上游 Windows 兼容源文件 unrtf_w.c。"
  - "OHOS/HMDFS 下 configure 脚本不保证可直接执行，非 Windows 构建通过 CONFIG_SHELL/bash 调用。"
  - "shell 测试脚本必须保持 LF 行尾，避免真机 bash 将 CRLF 中的回车解析进选项名。"
