software: unscd
display: "unscd Micro Name Service Cache Daemon"
description: "Lightweight single-file nscd replacement caching passwd/group/hosts NSS lookups"
category: system
homepage: "https://busybox.net/~vda/unscd/"
license: GPL-2.0-only
build_system: makefile
ohos_adaptation:
  key_points:
    - "Pure C single-file build with the OHOS clang toolchain (no dependencies)"
    - "Upstream Makefile CFLAGS overridden on the command line for clang/lld"
    - "Daemon binary packaged as bin/unscd plus bin/nscd (real copies, no symlinks)"
  common_dependencies: []
versions:
  "0.54":
    status: built
    build_date: "2026-10-13"
