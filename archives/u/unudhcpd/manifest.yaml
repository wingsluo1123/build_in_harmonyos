software: unudhcpd
display: unudhcpd
description: "极简 DHCP 服务器：只给单个客户端下发一个固定 IP（postmarketOS）"
category: network
homepage: https://gitlab.postmarketos.org/postMarketOS/unudhcpd
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "上游源码零修改：clang 15.0.4 原生 OHOS aarch64（构建=目标=OHOS）经 meson 直接编译通过，未产生任何补丁"
    - "上游已自带 meson 注册测试（tests/meson.build 用 test() 注册 3 个用例，合计 24 条断言），配方 build() 以 meson.test() 集成，属层1 上游官方测试"
    - "产物为可执行文件（bin/unudhcpd）而非库 → package_type=application；按 R38 在软件级目录提供 commands.json"
    - "不产出 .so，R26（系统同名库静态链接）约束不适用"
    - "上游 meson.build 的 project(version:'0.1') 与发布 tag 0.2.1 不一致，故 -v 实测输出 'unudhcpd 0.1'；属上游遗留问题，为保持上游行为未作修改"
    - "运行期绑定网卡走 SO_BINDTODEVICE（需 CAP_NET_RAW），test_package 只验证启动路径与参数解析，不做真实收包"
  common_dependencies: []

versions:
  "0.2.1-r2":
    status: built
    build_date: "2026-10-12"
    conan_ref: "unudhcpd/0.2.1-r2"
