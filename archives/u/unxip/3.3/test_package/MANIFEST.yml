package: unxip/3.3
homepage: "https://github.com/saagarjha/unxip"

upstream_check_command: "GitHub Actions: swift build, then run unxip against an encrypted Xcode .xip fixture"
upstream_test_in_build: false
upstream_test_command: "not run locally; upstream fixture requires a secret decryption key and a large Xcode archive"

test_package_tests:
  - file: test.sh
    description: "Run unxip --version and assert the expected upstream version string"
    command: "unxip --version"

test_sources:
  - test.sh

assertion_count: 1
