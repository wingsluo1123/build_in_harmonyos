upstream_test_pass_rate: "**43 passed（rc=0）**（本地 conan create 实测，纯离线；上游用 mock 替换网络）。⚠️ **被测源码取自仓库归档 v1.0.1 的 `src/` 而非 sdist 抽出的那份**，成因是环境产物而非代码差异：官方 sdist 的成员时间戳被归一化到 **epoch（mtime = 0）**，而上游 `tests/test_update_checker.py::test_import__without_package_metadata` 用 `zipfile.write()` 按**源文件 mtime** 造 zip → 直接 `ValueError: ZIP does not support timestamps before 1980`（在 git 检出、mtime 正常时该用例通过）。已实测两种口径：sdist 源码 42 passed / 1 failed（即上述时间戳用例），仓库归档同版本源码 43 passed；本清单取后者并把差异如实披露。**包产物本身仍由 sdist 源码树打包**（见 notes.md）。"
adapted_test_pass_rate: "test_package/check_update_checker.py **9 项消费者校验（全部离线，不触网）**，本地实测 `checks=9 fails=0 / RESULT: PASS`：①产物齐备（`update_checker/` 模块）②模块文件齐备（`__init__.py`/`core.py`/`py.typed`）③真实 `import update_checker`（零运行期依赖）④公开符号面（`__all__` 的 12 个导出全部可访问）⑤真实离线 API：`parse_version()`（'1.2.3' 与 '1.0.0b1' 两例归一化）⑥真实离线 API：`pretty_date()`（now-2d → '2 days ago'、now-1h → '1 hour ago'）⑦真实离线 API：`standard_release('1.0.0') is True` + `UpdateChecker(bypass_cache=True)` 构造成功⑧`__version__`（上游 core.py 的兜底值 'unknown'，如实报告不臆造）⑨证据（模块总字节 + python 版本）"

knowledge_gained:
  - category: L1
    content: "**Conan 2 的 test_requires 落在 `test` 上下文**：配方里要遍历依赖图收集 site-packages 时，**只遍历 `self.dependencies`（默认 host）/`.build` 都拿不到 test_requires**，必须用 `self.dependencies.test`（实测：aiohttp 作 test_requires 时，host+build 两次遍历都得到空集合）。另外**不要用“库名子串”匹配 conan 包路径**——包目录名是截断名（如 `.conan2/p/aioht9f1a043272ee1/p/…`，没有 `aiohttp` 子串），按路径匹配会假阴性；应改为检查模块目录是否存在（`os.path.isdir(os.path.join(site, 'aiohttp'))`）。"
    reason: "update_checker 适配实测——test_requires 的上下文与包路径判定"
  - category: L1
    content: "**PyPI sdist 可能把成员时间戳归一化到 epoch（SOURCE_DATE_EPOCH=0）**，这会打到“按文件 mtime 造 zip”的上游用例：update_checker 的 `test_import__without_package_metadata` 用 `zipfile.write()` 取 mtime → `ValueError: ZIP does not support timestamps before 1980`（报错看起来像测试坏了，其实是打包时间戳产物）。判定：`tarfile` 看成员 `mtime` 是否为 0；处置：优先按上游“从 git 检出跑测试”的语义、把仓库归档（同 tag）的源码置于 PYTHONPATH 最前（实测 43 passed），并在清单与 PR 正文如实披露该差异，而不是改上游测试或伪造时间戳。"
    reason: "update_checker 适配实测——sdist 时间戳归一化对上游用例的影响与处置"
