knowledge_gained:
  - "UQM 自研 build.sh 的 configure 是交互菜单；无人值守用 config.state + reprocess_config（ref: E754）"
  - "UQM 的 CFLAGS/LDFLAGS 从环境继承，可注入 Conan 依赖的 -I/-L（libpng 探测写死 -lpng 且不带 -L）（ref: E754）"
  - "UQM 探测 SDL2 走 sdl2-config、Vorbis/zlib 走 pkg-config、libpng 走 -lpng 编译探测，三种机制需分别接入（ref: E754）"
  - "OHOS /tmp 只读 + 脚本硬编码 /tmp 字面量：设置 TMPDIR 无效，须补丁改 ${TMPDIR:-/tmp}（ref: E754）"
  - "musl 下 fd_set/FD_SETSIZE/select 需显式 #include <sys/select.h>（netmanager_bsd.c）（ref: E757）"

