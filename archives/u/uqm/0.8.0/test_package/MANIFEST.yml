# test_package/MANIFEST.yml — uqm 0.8.0 (The Ur-Quan Masters)
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）

package: uqm/0.8.0
homepage: "http://sc2.sourceforge.net/"

# 上游测试命令
# 清点证据（uqm-0.8.0-src.tgz 解压后）：
#   - 无 tests/ 目录；全树仅 doc/devel/checklist（文档），无测试源文件
#   - 构建系统为自研 build/unix/build.sh，Makeproject 中 TARGETS="uqm"，
#     无 check/test 目标；无 configure.ac/Makefile.am（非 autotools），
#     无 CMakeLists.txt（非 cmake），无 meson.build（非 meson）
#   - 上游 INSTALL 仅描述编译与打包流程，未提供任何测试入口
upstream_check_command: ""   # 上游无 make check / ctest -N / meson test 入口

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：上游 0.8.0 未随源码发布任何测试用例
upstream_tests: []

# test_package 中自带的测试（消费者视角验证已安装的 uqm 启动器；L0c 测试源文件）
test_package_tests:
  - file: test.sh
    description: "L0c 测试源：真实调用已安装的 uqm 启动器并断言——--version 输出 0.8.0；--help 含 Ur-Quan Masters 横幅与 --contentdir 选项；缺失内容目录时输出上游致命诊断且退出码非 0；默认启动器成功挂载随包安装的 content 目录"
    command: "bash test.sh"
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"

# 测试断言总数（上游 0 项；test_package 4 项断言）
assertion_count: 4
