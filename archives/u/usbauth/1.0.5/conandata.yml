sources:
  url: "https://deb.debian.org/debian/pool/main/u/usbauth/usbauth_1.0.5.orig.tar.gz"
  sha256: "8df8b44028bbee7ca39c177ada0678911341bd9128f9f239fc6adec2eafa7101"
  filename: "usbauth_1.0.5.orig.tar.gz"
  note: >-
    源取 Debian 源包的 orig —— 就是上游 `kochstefan/usbauth-all` 里 **usbauth** 子工程的
    **1.0.5** 发布源（版本与平台清单一致）。包内**平铺**（无顶层目录，直接是 configure.ac/src/…，
    因此 strip_root 不能用 —— 见 conanfile.py 的 source()）。
    ⚠️ 上游 `configure.ac` 里的 `AC_INIT([usbauth], [1.0.3], …)` **没跟着发版改**（仍是 1.0.3），
    故二进制自报版本可能为 1.0.3 —— 本配方以**包版本 1.0.5** 为准，并在此如实记录该上游笔误。
