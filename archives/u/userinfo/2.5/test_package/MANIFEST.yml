# test_package/MANIFEST.yml
# userinfo 2.5 - upstream test declaration.

package: userinfo/2.5
homepage: "http://userinfo.sourceforge.net/"

upstream_tests_exist: false
upstream_test_audit: >-
  Userinfo 2.5 (Ben Kibbey, 2015) ships autotools build files (Makefile.am /
  configure.ac / pre-generated configure) and documentation only.  There is no
  test suite (no `make check`, no ctest, no tests/ directory, no .sh/.py test
  harness); the only "extra" programs are the loadable modules themselves.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_userinfo.sh
    description: >-
      Runs the installed ui program: version/help, the passwd/mail/login
      modules (loaded via RUNPATH), custom field separator, config-file loading,
      multiple users, verbose mode, and error paths (unknown user/module).
    command: "sh test_userinfo.sh"

test_files:
  - path: "test_package/test_userinfo.sh"
    test_type: "R34"
    assertion_count: 23

test_package_test_count: 1
consumer_assertion_count: 23
upstream_test_cases: 0
assertion_count: 23
