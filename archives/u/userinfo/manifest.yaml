software: userinfo
display: "Userinfo (ui)"
description: "Userinfo：显示本地用户各类信息的命令行工具（模块化：passwd/mail/login）"
category: system
homepage: "http://userinfo.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "小型 C 程序 + 三个可动态加载模块（passwd.so/mail.so/login.so），autotools 构建，无三方依赖"
    - "autoconf config.status 的 umask 077 临时目录在 HMDFS 上会 Permission denied → 补丁改为 022"
    - "显式 --build/--host/--target=aarch64-unknown-linux-gnu 绕开不认 HarmonyOS 的老 config.guess/sub"
    - "AC_CANONICAL_TARGET 会加程序名前缀，需 --program-prefix= 恢复为 ui"
  common_dependencies: []

versions:
  - version: "2.5"
    status: built
    build_date: "2026-10-15"
