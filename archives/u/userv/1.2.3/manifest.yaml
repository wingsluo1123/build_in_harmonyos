      上游 make check 本身无校验集（只打印 "There is no validation suite for this package."，退出码 0）。
  test_package: "10 项：9 通过 + 1 SKIP（客户端运行期契约需 setuid-root，原因见 compatibility）"
  evidence: "notes.md §五/§十/§十一 真机记录；RUN_DIR 见 verification.device_done"

