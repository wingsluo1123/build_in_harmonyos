knowledge_gained:
  - "userv 的 client.c/overlord.c 把 NDEBUG 视为安全错误：编译期 #error、运行期 abort；Conan AutotoolsToolchain 在 Release 下会注入 -DNDEBUG，因此本包必须绕开它"
  - "Makefile.in 的 INSTALL_FLAGS 硬编码 -o root -g 0，非 root CI 必须命令行覆盖 INSTALL_FLAGS="
  - "userv 的 CPPFLAGS 在 Makefile.in 中被重新赋值，会静默丢弃环境里的 CPPFLAGS —— 依赖外部 CPPFLAGS 传递宏定义在这里不可靠"
  - "构建期需要 md5sum（pcsum.h 协议校验和），configure 只探测 md5sum/md5/gmd5sum"
  - "Conan 没有 tools.build:ldflags 这个 conf，可执行文件链接选项要用 tools.build:exelinkflags"
  - "Environment.save_script 不能取名 conanbuild/conanrun：那是 Conan 聚合脚本名，会被覆盖并产生自引用脚本，导致自定义环境变量全部丢失；应改用独立名字（本包用 conanbuildenv-userv）"
  - "VirtualBuildEnv 对 tool_requires 的隐式 PATH 合成，在 profile [buildenv] 已定义 PATH 时会被 compose 逻辑丢弃（探针实测），需要显式 prepend_path"
  - "上游 1.2.3 没有 make check 断言集；tarball 内 tests/ 是 Debian autopkgtest（needs-root/breaks-testbed），Conan 沙箱不可运行"
  - "上游官网 'current version' 的 userv.tar.gz 实测仍是 1.2.0，取 1.2.3 必须用 Debian 源码池版本化 tarball"
  - "真机 HMDFS：autoconf `(umask 077 && mktemp -d \"./confXXXXXX\")` 生成的目录是 drwx--S--- 且内容连 ls 都 Permission denied（MAC 标签），config.status 随后执行 ./confXXXXXX/subs1.awk 必失败；改 umask 077→022 即可（vcprompt 在同设备已证）"
  - "影子 CI 设备上没有 /data/service/hnp/bin/bash（该目录只有 git），clang/bash 都在 $HOME/usr/local/bin；配方里硬编码 hnp 路径会 Error 127 —— CONFIG_SHELL 只存在于 profile [buildenv] 的子进程环境里，必须用 shell 参数展开在运行时求值"
  - "影子 CI 必须经 $HOME/bin/ohos-test-runner.sh 启动：它设置 TMPDIR/TMPPREFIX（设备 /tmp 只读）并加 device-global 锁；直接 sh run-ohos-shadow-ci-local.sh 会因 heredoc 临时文件写 /tmp 失败"
  - "OHOS 会把用户域进程的特权系统调用直接拦成 SIGSYS（shell 报 exit=159 + core dumped）：最小 C 探针显示 getpid/getuid/getgid/getgroups 正常，而 setreuid(0,uid) 立即被杀 —— userv 客户端因此在真机上一启动就死，与 setuid 位、参数、打包方式都无关"
  - "userv 客户端按设计要求 setuid root 安装（client.c:248 priv_suspend 无条件 setreuid(0,uid)）；Conan 包内二进制不是 setuid root，所以 --version/--help 在 Linux 上也是 EPERM 报错退出 —— 这类包的 test_package 必须区分「产物正确」与「运行期需要特权」，不能把跑不起来当通过"

compatibility:
  level: partial
  issues:
    - >
      userv 客户端在普通用户域无法运行：security_init()（client.c:808-821）在解析参数前调用
      priv_suspend()，后者无条件执行 setreuid(0,uid)（client.c:248）。Conan 包内不是 setuid root
      （CI 用户无法 chown root），因此任何调用（含 --version/--help）都会在打印前失败。
    - >
      OHOS 上该特权系统调用被安全策略直接拦成 SIGSYS：真机实测 `userv --version` → exit=159
      （128+31）+ core dumped、无输出；已用最小 C 探针复现（setreuid 是触发点）。
    - >
      完整功能（跨用户受限服务调用）还需要 setuid-root 安装到系统路径 + /etc/userv 配置 +
      常驻 uservd（VARDIR=/var/run/userv），属系统集成方工作，CI 沙箱不可验证。
  notes: >
    编译、链接、安装、打包已在真机全部通过；uservd 可执行（参数校验路径）；userv 的构建身份
    （版本串/用法串/许可证串/AArch64 ELF）可静态校验。客户端运行期行为与整机 setuid 部署未验证，
    本包不声明"服务可用"。

