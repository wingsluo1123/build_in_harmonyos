    - "--prefix=/"
  install_overrides:
    - "DESTDIR=<package_folder>"
    - "INSTALL_FLAGS=            # 覆盖上游 -o root -g 0（CI 非 root）"
    - "sbindir=/bin             # uservd 也进 Conan 标准 bin/（CI L2/L5 扫描 bin/）"
    - "etcdir=/res              # /etc/userv 骨架收进 res/，不写系统 /etc"
  cc: clang
  cxx: clang++

dependencies:
  required: []
  build:
    - coreutils/9.10        # 构建期 md5sum（生成 pcsum.h）；ohpcd 已发布，二进制内含 md5sum

patches_applied:
  - file: 0001-configure-mktemp-umask.patch
    purpose: >
      configure/config.status 的临时目录创建 `(umask 077 && mktemp -d "./confXXXXXX")` 在真机
      HMDFS 上会生成 drwx--S--- 目录且内容不可访问（MAC 标签），导致
      `config.status: ./confXXXXXX/subs1.awk: Permission denied`；改为 umask 022。
    lines_changed: 2
    evidence: "真机影子 CI 第二轮实测复现 + archives/v/vcprompt/1.3.0 同设备结论一致"

artifacts_expected:
