# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# userv 1.2.3 上游测试情况（已实际解包核对，证据见 ../notes.md）：
#   * Makefile.in:113-114 的 check 目标只打印
#       "There is no validation suite for this package."
#     然后退出码 0 —— 上游没有 make check 断言集。
#   * tarball 内确有 tests/（t-basic / t-config / t-persist / t-userconfig），
#     但它们是 Debian autopkgtest 用例：debian/tests/control 声明
#     needs-root / isolation-container / breaks-testbed，并依赖 chiark-really、
#     系统级 setuid 安装（/usr/bin/userv + /usr/sbin/uservd）、常驻 uservd 与
#     /etc/userv 配置。Conan 构建沙箱（普通用户、不做系统安装、没有守护进程）
#     内不可运行，故登记为"未运行"，不计入通过率。

package: userv/1.2.3
homepage: "https://www.chiark.greenend.org.uk/~ian/userv/"

# 上游测试入口（Makefile 的 check 目标；1.2.3 中无断言）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试入口
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际存在的测试程序（Debian autopkgtest；本包内不可运行，理由见文件头）
upstream_tests:
  - file: tests/t-basic
    source: userv_1.2.3.tar.gz/tests/t-basic
    description: "autopkgtest 基础调用：userv --override 'execute whoami' games spong"
    command: "tests/t-basic"
    run_in_ci: false
    skip_reason: "needs-root + 系统级 setuid 安装 + 常驻 uservd（debian/tests/control: needs-root, isolation-container）"
  - file: tests/t-config
    source: userv_1.2.3.tar.gz/tests/t-config
    description: "autopkgtest 配置解析：services.d 配置 + USERV_* 环境变量断言"
    command: "tests/t-config"
    run_in_ci: false
    skip_reason: "needs-root, breaks-testbed，且依赖 Debian 包 chiark-really"
  - file: tests/t-userconfig
    source: userv_1.2.3.tar.gz/tests/t-userconfig
    description: "autopkgtest 用户级配置：~/.userv 解析检查"
    command: "tests/t-userconfig"
    run_in_ci: false
    skip_reason: "同 t-config（needs-root, breaks-testbed, chiark-really）"
  - file: tests/t-persist
    source: userv_1.2.3.tar.gz/tests/t-persist
    description: "autopkgtest 守护进程持久性/重连检查"
    command: "tests/t-persist"
    run_in_ci: false
    skip_reason: "needs-root + 常驻 uservd + 系统级安装"

upstream_tests_note: >
  上游测试用例总数 N=4（tests/t-basic、t-config、t-userconfig、t-persist，均为 Debian autopkgtest），
  CI 构建沙箱内可运行 0 个：debian/tests/control 逐条要求 needs-root / isolation-container / breaks-testbed，
  且依赖 chiark-really、系统级 setuid 安装（/usr/bin/userv + /usr/sbin/uservd）与常驻守护进程 + /etc/userv 配置
  —— 属环境限制，不是"上游没有用例"。make check 本身没有校验集，只打印
  "There is no validation suite for this package."（退出码 0）。
  完整清单与裁剪理由见 ../notes.md「上游测试清点」一节。

# 上游用例数（审核脚本按上游实测 N 核对，声明值必须 >= 实测值）
upstream_tests_total: 4
upstream_tests_run_in_ci: 0

# test_package 自带的实质断言（消费者视角）
#
# 分层依据（真机实测，见 ../notes.md §十）：
#   * uservd 可以真正执行：带参数时打印 usage 到 stderr 并以 3 退出（overlord.c:279-283，
#     发生在 openlog/chdir 之前，不需要 root）。
#   * userv 客户端按设计要求 setuid root 安装：client.c:248 无条件 setreuid(0,uid)。
#     Conan 包内不是 setuid root，因此 Linux 上 EPERM、OHOS 上被安全策略拦成 SIGSYS
#     （真机 exit=159 + core dumped；最小 C 探针复现）。脚本此时不伪装通过，而是对
#     打包二进制做构建身份校验（版本串/用法串/许可证串 + AArch64 ELF 头）并打印 SKIP。
#   两条路径都要求 bin/ 下真实产物存在，CI L1e（移走 bin/ 必须失败）依然成立。
test_package_tests:
  - file: test.sh
    description: >
      bin/userv 与 bin/uservd 存在且可执行；两者都是 AArch64 ELF；
      uservd --help 退出码 3 且打印 "usage: uservd [-daemon]"（真实执行）；
      userv：可执行时验完整 CLI 契约（--version == 1.2.3std、--help 的用法与版本行、
      --copyright 的 GPLv3 声明、非法选项非 0 退出且 stderr 有 usage），
      不可执行时（需要 setuid-root）退化为静态构建身份校验并显式 SKIP
    command: "bash test.sh <package_bin_dir>"

# 断言总数：OHOS CI 沙箱实际执行 10 项（9 通过 + 1 SKIP，SKIP 为客户端运行期契约，原因见 notes §十.5）；
# 在允许客户端运行的环境（或 setuid-root 部署）为 13 项全执行
assertion_count: 10
