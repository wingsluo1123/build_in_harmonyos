software: util-linux
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.42.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.42.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"

  # 源码校验和（与 kernel.org 官方 sha256sums.asc 一致）
  sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires: []

# 构建配置选项
build_options:
  - "autotools；沿用 2.39/2.42 裁剪：--disable-all-programs --enable-libblkid/libuuid/libmount；config.guess/config.sub OHOS patch；umask 077 修复（E011）；compat getusershell（lib/shells.c）/versionsort（libmount tab_parse.c）"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | partial | failed | skipped | not_run
# partial：包级 test_package 通过，上游完整构建套件在当前环境存在环境性失败（详见 test_note）
test_status: partial

# 测试说明（R51 上游测试三步法：清点 → 实跑 → 回填实测）
test_note: "上游 ts 套件**已实跑**（2026-10-18，完整构建树，非配方裁剪）：run.sh 汇总 **367 项注册测试中 17 项 FAILED**；子测试展开 **820 项 = 773 通过 / 41 失败 / 6 项上游 KNOWN FAILED（预期失败）**，通过率 **94.3%**；SKIPPED 记录 224 条（无 root 权限 112、相关工具未构建 89、其余 23 环境项）。失败分布（run.sh 明细行）：lsblk 14、hardlink 7、mkswap 7、getopt 6、script 4、fallocate 3、lscpu 3、kill 3、logger 2，fadvise/flock/ionice/misc/setarch/swaplabel/uuidd/chrt 各 1——均为完整构建下的工具行为与环境差异（无 root、无块设备、toybox sed 无 --in-place 导致文本比对偏差），与交付的 libblkid/libuuid/libmount 无关。与交付库直接相关的组件：blkid 11 项中 3 项实跑通过（superblocks probing 134 子测试 + partitions 7 + output formatting 12）、8 项因无 root/缺 mkfs.ext2 跳过；uuidgen 4/4 通过。配方构建 conan create 从干净源码构建 RC=0，test_package 消费者探针真实调用三库 API（blkid_new_probe_from_filename + uuid_generate/uuid_parse + mnt_new_context）并通过，同时验证 package_info 链接顺序。"
