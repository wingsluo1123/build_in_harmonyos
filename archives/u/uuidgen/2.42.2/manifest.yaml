version: "2.42.2"
software: uuidgen
status: built
build_date: "2026-10-12"
build_system: autotools

source:
  url:
    - "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
    - "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
  sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-all-programs"
    - "--enable-uuidgen"
    - "--enable-libuuid"
    - "--disable-libblkid"
    - "--disable-libmount"
    - "--disable-libsmartcols"
    - "--disable-libfdisk"
    - "--without-python"
    - "--without-systemd"
    - "--without-udev"
    - "--disable-makeinstall-chown"
    - "--disable-makeinstall-setuid"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-ohos-detection.patch"

knowledge_gained:
  - "The uuidgen command can be built independently from util-linux by enabling only uuidgen and libuuid."
  - "Upstream uuidgen tests are split across tests/ts/uuidgen/uuidgen and tests/ts/uuidgen/oids, totaling 12 subtests."
  - "Existing E011 and util-linux config.guess knowledge is sufficient; no new generic knowledge gap was found."
