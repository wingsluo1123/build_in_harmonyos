# 软件级 manifest — uuu

software: uuu
display: "Universal Update Utility"
description: "NXP i.MX 芯片镜像部署工具（mfgtools 3.0 命令行工具）"
category: build-tool
homepage: "https://github.com/nxp-imx/mfgtools"
license: "BSD-3-Clause"
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建：顶层仅编译 libuuu 静态库 + uuu 可执行文件，安装到 bin/"
    - "系统 Conan 依赖经 CMakeDeps/PkgConfigDeps 提供（bzip2、libusb、openssl、tinyxml2、zstd、zlib）"
    - "FindBZip2 需显式 BZIP2_INCLUDE_DIR/BZIP2_LIBRARIES 提示（CMakeDeps 生成小写包名）"
    - "libuuu gen_ver.sh 优先读源码根 .tarball-version，配方写入版本号保证 --version 稳定"
    - "上游 uuu 本体无测试套件，按 no_tests 处理（见 test_package/MANIFEST.yml 审计）"
  common_dependencies:
    - bzip2
    - libusb
    - openssl
    - tinyxml2
    - zstd
    - zlib

versions:
  "1.5.243":
    status: built
    build_date: "2026-10-15"
