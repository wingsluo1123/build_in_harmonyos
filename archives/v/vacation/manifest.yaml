software: vacation
display: "vacation mail auto-responder"
description: "Automatic mail responder with loop suppression and reply throttling"
category: mail
homepage: "https://packages.debian.org/source/sid/vacation"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "Build against the published Berkeley DB 1.85 compatibility library"
    - "Evaluate automatic-reply policy on bounded unfolded logical headers"
    - "Exercise the installed command through an end-to-end HarmonyOS consumer flow"
  common_dependencies:
    - "db1-compat/2.1.3"

versions:
  "3.3.3-nmu1":
    status: built
    build_date: "2026-10-15"
    conan_ref: "vacation/3.3.3-nmu1"
