# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: valgrind/3.24.0
homepage: "https://valgrind.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# valgrind make check 为庞大的回归套件（memcheck/helgrind/drd 等），
# 需在宿主环境完整运行，未集成到 conan build() 中。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# OHOS 适配：make check 已在本地执行，测试程序全部编译链接通过；
# 个别测试因 musl libc 缺失符号（pthread_cancel/index/rindex/_res/POSIX mq）加 __OHOS__ 守卫跳过
# （详见 patches/ 下 0006-0016 各 test_fix 补丁）。
upstream_tests:
  - file: memcheck/tests/str_tester.c
    source: valgrind-3.24.0/memcheck/tests/str_tester.c
    description: "memcheck 字符串函数测试 (glibc 遗留 index/rindex 在 OHOS 映射为 strchr/strrchr)"
    command: "./str_tester"
  - file: none/tests/mq.c
    source: valgrind-3.24.0/none/tests/mq.c
    description: "POSIX 消息队列测试（OHOS 无 mq_* 符号，__OHOS__ 跳过）"
    command: "./mq"
  - file: none/tests/pth_cancel1.c
    source: valgrind-3.24.0/none/tests/pth_cancel1.c
    description: "线程取消测试（OHOS 无 pthread_cancel/setcanceltype，__OHOS__ 跳过）"
    command: "./pth_cancel1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: smoke.c
    description: "消费者测试: valgrind --version + memcheck 实际运行冒烟程序"
    command: "valgrind -q --error-exitcode=1 smoke"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
