patches:
  "3.8.2":
    - patch_file: "patches/0001-cmake-soften-spatialite-tools-check.patch"
      patch_description: "Do not hard-fail when the spatialite/spatialite_tool CLIs are absent (only used by the online timezone builder)"
      patch_type: "portability"
    - patch_file: "patches/0002-gurka-drop-build-timezones-dependency.patch"
      patch_description: "Gurka tests build tiles in-process and do not need the online tz.sqlite artifact"
      patch_type: "portability"
    - patch_file: "patches/0003-cmake-force-module-protobuf.patch"
      patch_description: "Force CMake MODULE mode for Protobuf so protobuf_generate_cpp() exists"
      patch_type: "portability"
    - patch_file: "patches/0004-cmake-load-config-zlib-before-boost.patch"
      patch_description: "Load the config-mode ZLIB before Boost so ZLIB::ZLIB exists"
      patch_type: "portability"
    - patch_file: "patches/0005-logging-strftime-timestamp.patch"
      patch_description: "Format the log timestamp with strftime (OHOS libc++ has no chrono formatters)"
      patch_type: "portability"
    - patch_file: "patches/0006-missing-includes-and-tellp-ambiguity.patch"
      patch_description: "Add missing <sstream> include and disambiguate ostream::tellp() arithmetic for libc++"
      patch_type: "portability"
    - patch_file: "patches/0007-costmatrix-drop-std-pmr.patch"
      patch_description: "Replace std::pmr (absent from OHOS libc++) with the default allocator"
      patch_type: "portability"
    - patch_file: "patches/0008-cmake-valhalla-build-with-install-rpath.patch"
      patch_description: "Link libvalhalla with its final RPATH so the OHOS loader accepts the installed library"
      patch_type: "portability"
