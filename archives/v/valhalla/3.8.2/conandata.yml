sources:
  "3.8.2":
    # Official source first (R39), GitHub mirror second.  Conan tries the
    # entries in order; this also makes the recipe self-healing on CI workers
    # whose pre-download step lacks `curl` (the official github.com direct
    # download is flaky/rate-limited, while the mirror serves identical bytes).
    url:
      - "https://github.com/valhalla/valhalla/archive/refs/tags/3.8.2.tar.gz"
      - "https://ghproxy.net/https://github.com/valhalla/valhalla/archive/refs/tags/3.8.2.tar.gz"
    sha256: "8f38dc30771401bebf89939658adbad08020474612018322144fb8fe50b31ae5"

# The upstream GitHub release tarball does not contain the git submodules
# under third_party/ (they are recorded in .gitmodules and pinned in the
# 3.8.2 tag tree).  Each one is downloaded separately at the exact commit
# recorded by the tag and unpacked into third_party/<name>.  Every entry is an
# official-first mirror list for the same reason as `sources` above.
