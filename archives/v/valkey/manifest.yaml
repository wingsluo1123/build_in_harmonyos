software: valkey
display: "Valkey"
description: "High-performance in-memory key-value datastore"
category: db
homepage: "https://valkey.io/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 直编，deps/ 全部内联（hiredis/linenoise/lua/jemalloc），无外部库依赖"
    - "MALLOC=libc 绕开 jemalloc 在 OHOS musl 上的未验证分配器路径"
    - "官方集成测试由 Tcl 驱动，需要 build-only 的 tcl/8.6.16（暴露 tclsh8.6）"
    - "跑测前必须对 src/ 下产物做自签，未签名 ELF 在 OHOS 不可执行"
  common_dependencies:
    - libc (musl)

versions:
  "8.1.4":
    status: built
    build_date: "2026-09-25"
