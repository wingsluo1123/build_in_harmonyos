test:
  type: conan-test-package
  language: c
  framework: direct-compiler
  assertion_count: 3
  commands:
    - "clang test_vapoursynth.c -o test_vapoursynth -lvapoursynth"
    - "./test_vapoursynth"
  assertions:
    - "getVapourSynthAPI(VAPOURSYNTH_API_VERSION) returns a non-null VSAPI pointer"
    - "VSAPI reported version matches the headers used by the consumer"
    - "VSAPI can create and free a VSCore instance"
upstream_tests:
  status: not-run
  reason: "Upstream tests are Python-module tests; this precheck recipe disables the Python module until Python/Cython packaging is handled separately."
