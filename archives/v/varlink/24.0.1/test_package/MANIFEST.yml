# test_package/MANIFEST.yml — varlink 24.0.1 适配验证清单
#
# 上游测试来源声明：
#   - build_system: meson（libvarlink 24.0.1）
#   - 上游无独立消费者测试套件（本项目以 test_package 为准）
#
# test_package 消费者用例（新增）：
#   test_varlink.c — varlink_object_new + varlink_object_unref 生命周期冒烟
package: varlink/24.0.1
homepage: https://varlink.org/

upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - name: varlink-object-new
    command: "./test_varlink"
    assertions:
      - "varlink_object_new 初始化成功（返回 0）"
      - "varlink_object_unref 生命周期完整"
