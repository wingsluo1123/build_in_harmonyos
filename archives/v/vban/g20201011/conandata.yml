sources:
  url:
    - "https://github.com/quiniouben/vban/archive/4f69e5a6cd02627a891f2b15c2cf01bf4c87d23d.tar.gz"
  sha256: "50e2d45b9e1cbf50f35b9f7edc5bc5e0960b9fbd8cfca107288ed7a6d63b4e7a"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Consume PulseAudio and JACK through Conan CMake targets"
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    patch_description: "Link the selected imported dependency targets"
    patch_type: "portability"
  - patch_file: "patches/0003-src-common-packet.c.patch"
    patch_description: "Use bounds-checked explicit wire header accessors"
    patch_type: "portability"
  - patch_file: "patches/0004-src-common-backend-pipe_backend.c.patch"
    patch_description: "Use TMPDIR or the requested FIFO path and clean it safely"
    patch_type: "portability"
  - patch_file: "patches/0005-src-emitter-main.c.patch"
    patch_description: "Add version probe and terminate cleanly at file EOF"
    patch_type: "portability"
  - patch_file: "patches/0006-src-receptor-main.c.patch"
    patch_description: "Add a deterministic version probe"
    patch_type: "portability"
  - patch_file: "patches/0007-src-sendtext-main.c.patch"
    patch_description: "Serialize the text packet header explicitly"
    patch_type: "portability"
  - patch_file: "patches/0008-src-vban-vban.h.patch"
    patch_description: "Define the VBAN wire header as bytes with endian-safe helpers"
    patch_type: "portability"
