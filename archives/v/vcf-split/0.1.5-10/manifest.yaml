knowledge_gained:
  - "上游 Makefile.depend 为同级目录开发工作流写死了 ../local/include/... 路径，在 Conan 隔离构建目录下 make 直接报 No rule to make target；用补丁收敛依赖行、由配方注入依赖 include/lib 位置"
  - "Conan 2 的 apply_conandata_patches 按 export_sources_folder 解析 patch_file，配方加补丁时必须把 patches/* 写进 exports_sources，否则 conan create 在 build() 抛 FileNotFoundError"
  - "OHOS SDK sysroot 提供 sysexits.h，同族 auerlab 项目并非一概需要兼容头，应按实测决定"
  - "OHOS 的 clang 15 默认产物已是完整 PIE + BIND_NOW + NX，无需显式 -fPIE/-pie"
  - "上游 test.sh 含交互式 pause() 且使用 bashism 时，只重放其断言主体并如实申报未执行项"

