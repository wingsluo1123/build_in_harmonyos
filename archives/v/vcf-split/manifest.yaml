software: vcf-split
homepage: "https://github.com/auerlab/vcf-split"
description: "Splits a combined-sample VCF stream into single-sample VCF files"
category: tool
license: "BSD-2-Clause"
versions:
  - "0.1.5-10"
dependencies:
  - "biolibc/0.2.7"
  - "libxtend/0.2.1"
ohos_adaptation:
  notes:
    - "Build vcf-split with the upstream Makefile"
    - "Use biolibc and libxtend as Conan dependencies"
    - "Patch Makefile.depend to drop the ../local/include/... paths baked in by the upstream sibling-directory layout"
    - "Pass VERSION explicitly because upstream version.sh needs .git at build time"
    - "Sign the OHOS executable with binary-sign-tool"
