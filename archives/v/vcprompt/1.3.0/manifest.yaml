    - "make check-simple"
  outputs:
    binaries:
      - "bin/vcprompt"
    libraries: []
  notes:
    - "package_type=application; R38 satisfied by the software-level commands.json"
    - "vcprompt detects VCS state from on-disk metadata; no external VCS binary is needed for the default and %n/%b/%r/%p formats"
    - "The Perl wrapper vcprompt-hgst from the tarball is deliberately not packaged"
    - "OHOS: the generated configure script is patched from `umask 077` to `umask 022` (HMDFS/E129/E136 config.status temp dirs); reproduced on the device as \"can't create ./conf49901-963/subs1.awk: Permission denied\", fixed by the patch"
    - "OHOS: packaged bin/vcprompt is signed with binary-sign-tool when available (ML-0043)"
