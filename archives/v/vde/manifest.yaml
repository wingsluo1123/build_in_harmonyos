software: vde
display: "VDE"
description: "Virtual Distributed Ethernet — virtual Ethernet switches, cables and plug libraries"
category: network
homepage: "https://vde.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag 归档不含预生成 configure：tool_requires automake/1.18 + libtool/2.5.4 后 autoreconf -fi 自举"
    - "原生 OHOS 构建显式指定 --build/--host=aarch64-unknown-linux-ohos（config.sub 由 automake 1.18 重新生成后支持 linux-ohos）"
    - "OHOS musl libc：-D__MUSL__ 避免 sys/socket.h 与 linux/socket.h 的 sockaddr_storage 重定义（E091）"
    - "wolfssl/libpcap/TUN-TAP 在 OHOS 不可用，--disable-cryptcab/--disable-pcap/--disable-tuntap"
    - "OHOS 未签名 ELF 不可执行：package() 后对 bin/lib/libexec 下全部 ELF 自签"
  common_dependencies:
    - libc (musl)

versions:
  "2.3.3":
    status: built
    build_date: "2026-10-18"
    conan_ref: "vde/2.3.3"
