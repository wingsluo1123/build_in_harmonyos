# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vector-blf/2.4.2
homepage: "https://github.com/Technica-Engineering/vector_blf"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 src/Vector/BLF/tests/unittests/CMakeLists.txt 通过 add_boost_test() 为每个
# Boost.Test 二进制注册一个 ctest 用例；OPTION_BUILD_TESTS=ON 时 `ctest -N` 列出 126 项。
upstream_check_command: "cmake -DOPTION_BUILD_TESTS=ON .. && ctest -N   # 126 registered tests"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：126 个测试二进制链接已编译的 Boost.Test 库
# (boost_unit_test_framework/system/filesystem)，OHOS Boost 包只提供头文件与
# filesystem/regex/program_options/iostreams 静态库，干净环境中不可用；
# 该套件已在真机以 header-only Boost.Test 入口独立跑通，见 r51_run_evidence。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（126 个 Boost.Test 二进制，与 ctest 注册项一一对应）
# description 由逐文件解析 test_*.cpp 中的 .blf/.asc 字面量 + 校验该固定装置是否随
# 源码发布生成，避免把上游 #if 0 的失效引用写成实际读取。
upstream_tests:
  - file: src/Vector/BLF/tests/unittests/test_AllLogfiles.cpp
    source: v2.4.2.tar.gz
    description: "Upstream Boost.Test case AllLogfiles: iterates the events_from_binlog / events_from_converter fixture directories and writes/reads test_GlobalMarker.blf"
    command: "./test_AllLogfiles"
  - file: src/Vector/BLF/tests/unittests/test_A429BusStatistic.cpp
