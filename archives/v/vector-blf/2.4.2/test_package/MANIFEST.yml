# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_vector_blf.cpp
    description: >-
      L1 API 往返用例：写 4000 条 CAN 报文（>128 KiB，触发多个 zlib 压缩 LOG_CONTAINER）
      后读回，逐字段校验 channel/flags/dlc/id/data 与 objectSize==calculateObjectSize()，
      并校验缺失文件经 is_open() 报告。
    command: "./test_vector_blf"
    result: "Passed — 28007 checks, 0 failures"
  - file: test_ohos_e2e.cpp
    description: >-
      【鸿蒙特有 · 端到端消费者用例】构造输入：6000 条确定性 CAN 报文（无随机数）；
      真实执行：经安装后的库写入 $TMPDIR（OHOS /tmp 只读，E002）→ 3 个数据容器
      (131072+131072+25856=288000 B) + 关闭时 1 个空容器 = 4 个 zlib 压缩 LOG_CONTAINER
      → 全量流式读回两遍；产出结果：确定性报告；校验内容：与独立实现 ref_blf_parser
      （不链接 vector-blf）逐字段比对并强制校验容器/压缩口径。
    command: "./test_ohos_e2e <report> <blf>"
    result: "Passed — 6000/6000 报文, 14 checks, 0 failures, digest=4964f8fbec9dd913"
  - file: ref_blf_parser.cpp
    description: >-
      【鸿蒙特有 · 独立参考实现】不链接 vector-blf、不包含其头文件，自行解析 BLF
      文件头(144B)、LOG_CONTAINER 框架(objectSize%4 填充)、zlib 载荷与 CAN_MESSAGE 字段。
    command: "./ref_blf_parser <blf> <ref-report>"
    result: "Passed — 6000 objects, 4 containers(方法全为 2=zlib), trailing=0, digest 与库侧一致"
  - file: test_compare.cpp
    description: >-
      【鸿蒙特有 · 交叉校验 + 强制不变量】逐字段比对两侧报告（lib:/ref: 为各实现私有项），
      并强制 6 条不变量：容器数≥2 / 压缩方法全为 2(zlib) / 对象流无尾随字节 /
      独立推算的未压缩大小与文件头一致 / 独立读出的文件大小一致 / 读回报文数==写入数。
    command: "./test_compare <lib-report> <ref-report>"
    result: "Passed — 23 shared fields compared, 6 invariants enforced, 0 mismatches"
  - file: ohos_dlopen_probe.cpp
    description: >-
      【鸿蒙特有 · OHOS ELF 可加载性】探针**不链接** vector-blf、也不包含其头文件，
      因此加载器是在该进程内首次映射产物（若在已链接本库的二进制里 dlopen 则会被
      动态链接提前完成而失去验证意义）。
    command: "./ohos_dlopen_probe <pkg>/lib/libVector_BLF.so"
    result: "Passed — dlopen 成功并解析到导出符号"

# 鸿蒙特有测试用例数（完整消费者用例；供 review rule12 核验）
