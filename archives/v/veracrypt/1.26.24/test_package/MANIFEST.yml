# test_package/MANIFEST.yml
package: veracrypt/1.26.24
homepage: "https://veracrypt.io/"

# Upstream's release link target invokes this built-in platform and encryption suite.
upstream_check_command: "veracrypt --text --test"
upstream_test_in_build: true
upstream_test_command: "veracrypt --text --test"
upstream_tests:
  - file: src/Main/Main.make
    source: src/Main/Main.make release link target
    description: "Upstream built-in platform tests, encryption tests, and AutoTestAlgorithms suite"
    command: "veracrypt --text --test"

test_package_tests:
  - file: test_package/test.sh
    description: "Consumer checks the packaged CLI and repeats the full upstream self-test"
    command: "conan test"
