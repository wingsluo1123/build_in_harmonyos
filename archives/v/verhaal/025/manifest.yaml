# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/025/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "025"

# 软件名
software: "verhaal"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-15"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://git.sr.ht/~gregkh/verhaal/archive/v025.tar.gz"

  # 源码校验和
  sha256: "269584a581631a984ed26cc13181a3cd8bfa520813768a0f646d2ba1107a8d23"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dwrap_mode=nodownload"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libgit2/1.9.0
    - sqlite3/3.53.4
    - pcre2/10.45
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-main.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libgit2 >= 1.7 的仓库属主校验（GIT_OPT_SET_OWNER_VALIDATION）在 HMDFS 共享属主文件系统上对本机任何仓库恒失败，消费者需在打开失败时关闭校验重试（知识草稿 DRAFT-libgit2-1.9.0-owner-validation-hmdfs；命令层同根因族见 E101/E497）"
  - "meson 工程依赖 libpcre2-8 时：Conan pcre2 包经 PkgConfigDeps 只产出合并的 pcre2.pc，包内自带 libpcre2-8.pc 前缀写死为 '/' 不可重定位，需按包实际路径补别名"
  - "verhaal 以本地 master 分支头 + 附注 tag 判定发行版本；轻量 tag 会导致 git describe 失败（error -3）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/verhaal-025.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/verhaal-025.work
  source_orig_hash: 4c9f3452f039021c
  source_work_hash: 0e147974e27df972
  generated_at: '2026-10-16T02:24:30'
  patches_count: 1

patch_classification:
  - file: 0001-src-main.c.patch
    type: portability
    platform_only: False
    guard: 'none'

