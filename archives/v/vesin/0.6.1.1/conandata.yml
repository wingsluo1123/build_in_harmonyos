sources:
  url: "https://github.com/Luthaf/vesin/archive/refs/tags/v0.6.1.tar.gz"
  sha256: "2846f238c61109791e4315acc145c740d338f4f994bfd0e04ab2bfceb82077a0"
# vesin 在 configure 期用 FetchContent 从 github 拉 gpulite —— 设备上必失败。
# 上游自带逃生口：`vesin/external/gpulite.tar.gz` 存在就改用本地 URL、不走 git
# （见 vesin/CMakeLists.txt:85-99）。这里按上游锁定的 commit 预取该 tarball 放进去，
# 既不打补丁、也不把网络依赖留在 configure 里。
gpulite:
  url: "https://github.com/metatensor/gpu-lite/archive/6c221167aeca7e113ea6f27e9a2e12391bdb189a.tar.gz"
  sha256: "c4236d9e0b28844ae5dea8ec85098c3037ef3f5b56301bb04a65fa1ad215de07"
# 上游 tests/ 用 FetchContent 从 github 拉 Catch2（vesin/tests/CMakeLists.txt:6-12，
# GIT_TAG v3.5.3）—— 设备上 git clone 不稳定。预取 tarball 解压到
# vesin/external/Catch2-3.5.3，configure 时用 -DFETCHCONTENT_SOURCE_DIR_CATCH2 指过去，
# 让上游单元测试真实构建并运行（不依赖网络）。
catch2:
  url: "https://github.com/catchorg/Catch2/archive/refs/tags/v3.5.3.tar.gz"
  sha256: "8d723b0535c94860ef8cf6231580fa47d67a3416757ecb10639e40d748ab6c71"
patches: {}
