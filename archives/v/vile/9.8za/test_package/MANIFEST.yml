# test_package/MANIFEST.yml — vile 9.8za
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。
#
# 计数口径：按独立检查项数量计数。上游 0 项；适配后 5 项 =
# 功能补全 2 项（F1-F2）+ 鸿蒙特有 3 项（A1-A3）。

package: vile/9.8za
homepage: "https://invisible-island.net/vile/"

upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  source_tarball: "vile-9.8za.tgz (https://invisible-island.net/archives/vile/current/vile-9.8za.tgz)"
  source_sha256: "65ba15ec145dfc5506217162228c7d88f01c0490a0dccde7a8a19f1c7c1b93b2"
  build_system: "autotools (configure + make)"
  scanned_for:
    - "make check / test / check_PROGRAMS / TESTS"
    - "test/ and tests/ directories"
    - "ctest / pytest / gtest / check / CUnit framework files"
    - "assert / EXPECT / PASS / FAIL markers"
  scan_result: "Upstream makefile defines check but prints 'Sorry, no batch tests available.'; the source tree contains test_io.c, test_btree/test_regexp debug drivers, and a plugin example, none registered to a batch test runner."
  reason: "vile 9.8za has no formal automated upstream test suite; count is 0."

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: >-
      F1 verifies the packaged executable prints the exact vile 9.8za version
      string and exits successfully. F2 verifies the CLI usage path by invoking
      vile with an invalid option and checking that the usage banner is printed.
    command: "sh test.sh <bindir>"
    assertion_count: 2

harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      A1 verifies the packaged executable is ELF64 little-endian and targets
      EM_AARCH64, matching HarmonyOS PC arm64.
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/vile"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      A2 verifies the ELF interpreter is /lib/ld-musl-aarch64.so.1, matching
      the HarmonyOS musl loader rather than a glibc loader.
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/vile"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      A3 verifies DT_NEEDED contains no shared libncurses entry, locking in the
      static Conan ncurses dependency and avoiding a system-name library clash.
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/vile"
    assertion_count: 1

assertion_count: 5
test_package_test_count: 2
harmonyos_specific_test_count: 3
count_method: "independent_check_items"
