software: vips
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.17.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.17.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ghfast.top/https://github.com/libvips/libvips/releases/download/v8.17.3/vips-8.17.3.tar.xz"

  # 源码校验和
  sha256: "41e9a1439cd57dcc6d4435a085e2cfe181d9da1962fa84a484f09e8b536e4b77"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dfontconfig=disabled"
    - "-Dpangocairo=disabled"
    - "-Dpng=disabled"
    - "-Dspng=disabled"
    - "-Dtiff=disabled"
    - "-Dopenexr=disabled"
    - "-Dopenjpeg=disabled"
    - "-Dheif=disabled"
    - "-Dpdfium=disabled"
    - "-Dpoppler=disabled"
    - "-Drsvg=disabled"
    - "-Djpeg-xl=disabled"
    - "-Dmagick=disabled"
    - "-Dintrospection=disabled"
    - "-Dvapi=false"

  # 编译依赖列表（格式: name/version）
  # 系统依赖通过 cmd-pkgs 预安装，非 Conan 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "meson 构建需要修补 native ini 文件添加 llvm-ar 路径和 pkg_config_path"
  - "libffi.pc 命名不匹配（cmd-pkgs 安装为 ffi.pc，glib 要求 libffi）"
  - "libwebp.pc 中 libsharpyuv 在 Requires.private 需改为 Requires"
  - "expat.pc prefix 路径从 conan 缓存路径改为 /usr/local"
  - "test_package 运行时因 musl namespace 限制失败（E088，已知平台限制）"
  - "conan 2.29.1 meson 使用 build() 而非 compile()"
