software: vips
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.18.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.18.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# 构建系统类型（顶层字段）
# cmake | autotools | makefile | meson | custom
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libvips/libvips/releases/download/v8.18.2/vips-8.18.2.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Dfontconfig=disabled"
    - "-Dpangocairo=disabled"
    - "-Dpng=disabled"
    - "-Dspng=disabled"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.88.0
    - libtiff/4.7.1
    - libjpeg/2.1.5.1
    - zlib/1.3.1
    - xz/5.6.2
    - lcms2/2.19
    - OpenEXR/3.1.5
    - libopenjp2/2.5.2
    - libheif/1.22.2
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cplusplus-meson.build.patch"
  - "0002-libvips-iofuncs-meson.build.patch"
  - "0003-libvips-meson.build.patch"
  - "0004-meson.build.patch"
  - "0005-tools-meson.build.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "meson 构建系统：使用 link_whole 合并静态库时，依赖关系可能不会正确传递到动态库，需要显式设置 RPATH 或手动添加 NEEDED 依赖"
  - "meson 对静态库的传递依赖检测不完整，功能检测时需手动添加传递依赖（如 libtiff 需要 liblzma）"
  - "toybox rm 在某些情况下无法执行，ninja 的 STATIC_LINKER 规则使用 'rm -f' 前置命令时需要修改 build.ninja 或使用 GNU rm wrapper"
  - "HMDFS 不支持 ln -sf 覆盖软链接（E018），需要使用 'rm -f && ln -s' 方式创建"
  - "meson 构建：PKG_CONFIG_PATH 需要正确设置以找到预编译包的 pkg-config 文件"
  - "依赖链问题：freetype2.pc 需要 libpng，禁用相关功能可绕过（-Dfontconfig=disabled -Dpangocairo=disabled）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

