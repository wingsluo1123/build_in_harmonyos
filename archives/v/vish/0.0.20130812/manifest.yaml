  cxx: clang++

patches_applied: []

knowledge_gained:
  - "官方源 librevisa.org/download 已 404（2026-10-13 实测），改用 Debian pool orig 权威镜像（sha256 本地实测一致）；PF7/R39 例外已在 PR 说明登记"
  - "vish 归档虽带生成式 configure，但无 config.guess/config.sub，且真机池无 autoconf 套件：直接以 CXX 编译 vish.cpp + 链接 librevisa 包的 libvisa.a，等价于 configure 的 AC_CHECK_LIB(visa)/AC_CHECK_HEADER(visa.h) 选择"
  - "直接编译不生成 config.h，--version 分支依赖 PACKAGE/VERSION 宏，需 -D'PACKAGE=\"vish\"' -D'VERSION=\"0.0.20130812\"' 替代"
  - "vish.cpp 用 std::string/getline 未显式 include <string>，libc++ 经 <iostream> 传递包含，无需补丁"
  - "上游无测试目录（11 文件无 tests/，Makefile.am 无 check target），N=0；鸿蒙特有 test_package 2 断言（--version 退出0含版本串、--scan 退出0走真实 VISA 资源管理器路径）"
