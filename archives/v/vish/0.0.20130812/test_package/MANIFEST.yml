# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: vish/0.0.20130812
homepage: ""

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 审计结论 (R51, 2026-10-13): 上游 vish 0.0.20130812 无任何测试套件
#   - 源码包 11 个文件, 无 tests/ 目录
#   - Makefile.am 仅声明 bin_PROGRAMS=vish + dist_man_MANS, 无 check_PROGRAMS/TESTS
#   - 无 *_test 文件, 无 CI 测试配置
# 故 upstream_tests 为空 (N=0), 详见 notes.md 与 conanfile.py test() 中
# HMBS_UPSTREAM_TEST_RESULT (status=no_tests)。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 由 test_package/conanfile.py test() 以 self.run 调用本目录 test.sh 执行,
# 实际断言命令即下方 command (vish --version / vish --scan)。
test_package_tests:
  - file: test.sh
    description: "鸿蒙特有冒烟测试: vish --version 退出 0 且输出含版本串 0.0.20130812"
    command: "vish --version"
  - file: test.sh
    description: "鸿蒙特有冒烟测试: vish --scan 退出 0 (真实 VISA 资源管理器路径 viOpenDefaultRM->viFindRsrc->viClose, 无硬件时 0 设备仍退出 0)"
    command: "vish --scan"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
