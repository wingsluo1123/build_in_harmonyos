# 软件级 manifest
# 文件位置: archives/v/vish/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: vish

display: "vish"

description: "VISA 命令行 shell，用于仪器读写（LibreVISA 项目，Simon Richter）"

# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

homepage: "https://tracker.debian.org/pkg/vish"

license: GPL-3.0-or-later

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

ohos_adaptation:
  key_points:
    - "真机池无 autoconf 且源码归档缺 config.guess/config.sub：跳过 autotools，直接 CXX 编译 vish.cpp + 静态链接 librevisa 包的 libvisa.a（等价于 configure 的 AC_CHECK_LIB(visa)/AC_CHECK_HEADER(visa.h) 选择）"
    - "直接编译不生成 config.h，--version 分支依赖 PACKAGE/VERSION 宏，需 -D'PACKAGE=\"vish\"' -D'VERSION=\"0.0.20130812\"' 替代"
    - "vish.cpp 用 std::string/getline 未显式 include <string>，libc++ 经 <iostream> 传递包含，无需补丁"
    - "上游无测试套件（无 tests/、Makefile.am 无 check target，N=0）；鸿蒙特有 test_package 2 断言（--version 含版本串、--scan 走真实 VISA 资源管理器路径）"
  common_dependencies:
    - librevisa

versions:
  0.0.20130812:
    status: built
    build_date: "2026-10-13"
