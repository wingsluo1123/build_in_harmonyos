  sha256: "8c4484158f0851e4887e595542bd65bdd991de9c20652b442b3fd9742ce8b031"
  filename: "visidata-3.1.1.tar.gz"
  note: >-
    上游 `saulpw/visidata` **3.1.1** 的 PyPI sdist，版本与平台清单 `visidata 3.1.1` 一致；
    URL 用平台 pip 镜像直链。本地实测 13,166,704 字节、317 个文件、单层根目录 `visidata-3.1.1/`；
    仓库自带 `visidata/tests/`（含 conftest.py，11 个用例），入口 `visidata=visidata.main:vd_cli`，
    另随 `scripts=["bin/vd", "bin/vd2to3.vdx"]`。
