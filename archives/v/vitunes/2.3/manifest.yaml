patch_classification:
  - file: 0001-e_commands.c.patch
    type: portability
    platform_only: false
    guard: none
    description: "getopt(3) 返回值必须为 int（aarch64 上 char 为 unsigned，-1 哨兵失效）——通用可移植性修复，无平台宏"
  - file: 0002-medialib.c.patch
    type: portability
    platform_only: false
    guard: none
    description: "目录遍历改用 POSIX dirent（fts(3) 在 OHOS sysroot 缺失），附带 dev/inode 祖先表防符号链接环——纯 POSIX 实现，无平台宏"
  - file: 0003-medialib.h.patch
    type: portability
    platform_only: false
    guard: none
    description: "头文件 <fts.h> 改为 <dirent.h>——通用可移植性修复，无平台宏"

