# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS sysroot 无 fts.h/libfts：C 代码的 fts(3) 目录遍历需改用 POSIX dirent 递归（并自带 dev/inode 祖先表防符号链接环）—— knowledge_ref: E688"
  - "aarch64 上 char 默认 unsigned：getopt(3) 返回值存进 char 时 -1 哨兵永不为真，带选项的 e-command 全部报 usage；须用 int —— knowledge_ref: E697"
  - "vitunes 只用 taglib 的 C API（tag_c.h/libtag_c）：taglib/2.3 配方 BUILD_BINDINGS=OFF 无 C wrapper，须依赖 taglib/1.13.1 —— knowledge_ref: E699"
  - "OHOS 上 C++ 运行时静态链：clang -static-libstdc++ 对 libc++ 不生效，需显式链接 clang -print-file-name=libc++.a/libc++abi.a/libunwind.a，产物仅依赖 libc.so —— knowledge_ref: E699"
  - "上游 Makefile.linux 链接 -lncurses/-lutil：ncurses 包只提供 wide 静态库、源码不引用 libutil，链接行需由配方按依赖重组 —— knowledge_ref: E697"

