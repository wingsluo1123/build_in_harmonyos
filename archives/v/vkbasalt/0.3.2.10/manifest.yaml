patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "vkBasalt 的 src/meson.build 不通过 dependency('vulkan') 获取头文件，而是裸 include vulkan/vk_layer.h + spirv/unified1/spirv.hpp，需在 MesonToolchain 的 c_args/cpp_args 注入 vulkan-headers/spirv-headers include"
  - "keyboard_input_x11.cpp 的 static_library 不挂 x11_dep（dependency 只挂在 shared_library），OHOS 需从 libx11+xorgproto 注入 include，否则 X11/Xlib.h 与 X11/X.h 找不到"
  - "OHOS ELF 代码签名陷阱：.codesign 段零填充的 .so 在 dlopen 时报 Permission denied（非文件权限问题），必须在 package() 用 binary-sign-tool self-sign；工具路径 CI 在 /data/service/hnp/bin、本地在 usr/local/bin，需双路径探测"
  - "vkBasalt 是 Vulkan implicit layer，导出 vkBasalt_GetInstanceProcAddr/vkBasalt_GetDeviceProcAddr（带前缀），非标准 vkGetInstanceProcAddr"
  - "构建 worker umask 027 会使 meson.install 产物权限为 750，非 owner 的 test 进程无法加载，package() 需 chmod 755"
