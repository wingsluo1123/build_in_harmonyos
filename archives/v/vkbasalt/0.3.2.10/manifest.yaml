version: "0.3.2.10"
software: "vkbasalt"

# 编译状态: published（conan-verify 全绿，已标记）
status: published
build_date: "2026-10-13"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/DadSchoorse/vkBasalt/archive/refs/tags/v0.3.2.10.tar.gz"
  sha256: "22f0d44518361b12cf51f30fc9931423977af32a396e746ebf6d726c05788de6"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options: []
  # 依赖均为制品仓已发布包，无源码适配依赖
  dependencies:
    - vulkan-headers/vulkan-sdk-1.4.357.0
    - spirv-headers/vulkan-sdk-1.3.290.0
