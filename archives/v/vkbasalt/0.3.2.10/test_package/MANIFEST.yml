# MANIFEST.yml — vkbasalt 0.3.2.10 test_package
# 鸿蒙特有测试：验证 Vulkan implicit layer 的动态加载、导出符号与层配置

test:
  name: test_vkbasalt
  language: cpp
  description: >
    dlopen 加载 libvkbasalt.so，dlsym 检查 layer 关键导出符号
    （vkGetInstanceProcAddr / vkCreateInstance），并校验 implicit layer
    配置文件 vkBasalt.json 已随包安装。
  build: cmake
  run: test_vkbasalt
  assert: "PASS: all"
  targets:
    - HarmonyOS PC (aarch64)
