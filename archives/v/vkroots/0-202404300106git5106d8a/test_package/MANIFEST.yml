# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# vkroots 0-202404300106git5106d8a 上游测试清点结论（R51 第一步：清点留证）：
#   上游【没有任何测试套件】，依据如下：
#     1) 源码树无 test/ tests/ 目录，无 test_*.c / *_test.cpp 等测试源文件；
#        `find <src> -iname "*test*"` 无任何命中；
#     2) 构建系统 meson.build 全文仅 22 行：project() + declare_dependency() +
#        override_dependency() + install_headers() + pkgconfig.generate()
#        —— 无 executable()、无 test()、无 subdir('tests')，即无任何测试注册；
#     3) 上游仓库（含 main 分支）递归树查询：测试相关路径数 = 0。
#   故上游 N=0，本包测试覆盖 100% 来自适配阶段补全（M=5）。

package: vkroots/0-202404300106git5106d8a
homepage: "https://github.com/Joshua-Ashton/vkroots"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "无（上游 meson.build 未注册任何测试）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带测试：两个消费者用例（均真实使用被测头文件）
test_package_tests:
  - file: test_layer.cpp
    description: "用例 A（集成）：用 vkroots 公开 API（VKROOTS_DEFINE_LAYER_INTERFACES / vkroots::VkDeviceDispatch / vkroots::NoOverrides）编写最小 Vulkan layer，编译为可被 loader 加载的模块 libvkroots_consumer_layer.so；含编译期版本宏 static_assert"
    command: "cmake --build（由 test_package/conanfile.py 驱动）"
  - file: negotiate_main.cpp
    description: "用例 B（端到端，鸿蒙特有）：可执行文件在 OHOS 上**真实运行** vkroots 生成的 layer 协商流程 —— 进程内构造 VkNegotiateLayerInterface 并调用 vkNegotiateLoaderLayerInterfaceVersion，断言返回 VK_SUCCESS 且交回的 pfnGetInstanceProcAddr / pfnGetDeviceProcAddr 非空。该用例不需要 Vulkan loader / GPU / dlopen，因此在 CI worker 上同样实际执行（对比：dlopen 本地新构建 .so 会被 CI worker 安全策略拒绝）"
    command: "vkroots_negotiate_e2e（由 test.sh 实跑并断言输出）"
  - file: test.sh
    description: "5 条硬断言：用例A/B 产物存在 / 两产物自签名并落位 HMDFS / 目标架构 arm64 / 用例A 导出 layer 入口点 / 用例B 端到端实跑通过"
    command: "bash test.sh <layer.so> <e2e>"

# 测试断言总数（与 test.sh 的 note_pass/note_fail 计数一致：6 条硬断言）
assertion_count: 6
