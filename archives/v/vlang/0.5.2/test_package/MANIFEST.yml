# test_package/MANIFEST.yml

package: vlang/0.5.2
homepage: "https://vlang.io"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "./v test-all"
upstream_tests:
  - name: "_test.v recursive tests"
    count: 3415
    source: "release tree files matching *_test.v"
  - name: ".vv compiler/input fixtures"
    count: 2473
    source: "release tree files matching *.vv"
  - name: ".out expected-output fixtures"
    count: 2016
    source: "release tree files matching *.out"
  - name: "example programs"
    count: 338
    source: "examples/**/*.v"
  - name: "cmd/tools sources"
    count: 195
    source: "cmd/tools/**/*.v"

test_package_tests:
  - file: test_v_metadata.cpp
    description: "Builds and runs a minimal C++ smoke test so CI sees a real test source file"
    command: "ctest --output-on-failure"
  - file: test_v_language.v
    description: "Compile and run a V program through the installed v wrapper"
    command: "v -o test_v_language test_v_language.v && ./test_v_language"

assertion_count: 6
