# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: voms/2.1.3
homepage: "https://github.com/italiangrid/voms"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check || true"

# 上游实际运行的测试程序 (voms 上游为 DejaGNU 测试套件，共 213 个 .exp 测试用例，
# 依赖 runtest (DejaGNU/Tcl 工具) 与 mock VOMS server 环境；
# OHOS 沙箱与 CI worker 均无 runtest，故未实际执行——如实记录)
upstream_tests:
  - file: testsuite/lib/vomslib.exp
    source: voms-2.1.3/testsuite/lib
    description: "DejaGNU VOMS 客户端测试库 (testsuite/lib/*.exp：db/vomslib/vomssetup/vomstest/newfail/whois 共 6 个)"
    command: "runtest --tool voms"
  - file: testsuite/voms
    source: voms-2.1.3/testsuite
    description: "DejaGNU VOMS 测试用例集 (共 213 个 .exp 测试用例；依赖 runtest + mock VOMS server)"
    command: "runtest --tool voms --srcdir ./testsuite"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_voms.cpp
    description: "消费者测试：链接 libvomsapi 并调用公开 C API VOMS_Init（链接+调用成功）"
    command: "./test_voms"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
