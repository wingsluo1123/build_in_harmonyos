software: vtgamma
# 版本级 manifest — 遵循 ARCHIVE-SPEC v2.0
version: "0.5"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-12"

# 构建系统标识
build_system: custom

# ============================================================
# 源码信息
# ============================================================
source:
  # 上游官方仓库 kilobyte/vtgamma 的 tag 0.5 归档（GitHub codeload 直链，非镜像、
  # 非第三方重打包）。github.com 网页端在本机不可达（连接超时），codeload.github.com
  # 可达且返回 HTTP 200 + content-type application/x-gzip，两处内容字节一致。
  url: "https://codeload.github.com/kilobyte/vtgamma/tar.gz/refs/tags/0.5"
  sha256: "ccdbb779eb25639b46711d2766a8fe310704a3cd6d5d3c728901504e92ddc03f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom
  system: custom

  # 上游无 configure/Makefile，配方直接安装脚本 + man page
  configure_options: []

  # 运行时依赖（制品仓已发布 perl/5.42.2 的 OHOS/armv8 二进制，实测 Already installed）
  dependencies:
    - "perl/5.42.2"

  # 纯 Perl 脚本包，无编译步骤，以下两项不适用
  cc: "N/A (纯 Perl 脚本，无编译)"
  cxx: "N/A (纯 Perl 脚本，无编译)"

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []
runtime_modifications:
  - "vtgamma shebang 由 #!/usr/bin/perl -w 改写为 #!/usr/bin/env perl（避免把构建机/系统绝对 perl 路径烤进脚本，解释器改由运行时 PATH 解析）"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "vtgamma 0.5 是单文件纯 Perl 脚本包（发行归档仅 LICENSE/README/vtgamma/vtgamma.1），无 C/C++ 源码、无构建系统，适配工作量为脚本安装 + shebang 可重定位化"
  - "Perl 解释器路径不可假设：HarmonyOS PC 系统自带 /data/service/hnp/bin/perl，同时制品仓已有 perl/5.42.2（OHOS/armv8），配方按 Conan 运行时依赖声明 perl/5.42.2，脚本用 #!/usr/bin/env perl 从 PATH 解析"
  - "上游归档走 codeload.github.com 直链（HTTP 200），github.com 网页端在本机不通；sha256 与 conandata.yml 双向核验一致"
  - "纯脚本类包同样需 R38/CI L0k 的软件级 commands.json（包内含 bin/ 可执行文件），位置固定为 archives/v/vtgamma/commands.json"

# ============================================================
# 测试
# ============================================================
test:
  upstream_cases: 0
  upstream_suite: "无（kilobyte/vtgamma 0.5 归档不含任何测试设施：全树仅 4 个文件，无 tests/、无 Makefile、无 CI 配置）"
  runnable: 0
  runnable_note: "上游无测试可运行；以 test_package 消费者测试替代（R34 实质验证：检查 bin/vtgamma 存在 + shebang 已改写 + perl -c 语法校验）"
  pass_rate: "N/A（消费者测试断言全部通过）"
  consumer_test: "test_vtgamma.py：bin/vtgamma 存在性、shebang == #!/usr/bin/env perl、perl -c 语法校验（可执行环境下真实调用 perl）"
