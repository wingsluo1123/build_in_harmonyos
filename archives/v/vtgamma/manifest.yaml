# 软件级 manifest — vtgamma
# 位置: archives/v/vtgamma/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

software: vtgamma
display: "vtgamma"
description: "虚拟终端与 xterm 类图形终端模拟器的伽马校正工具：按给定伽马值生成并应用颜色斜坡（单文件纯 Perl 脚本，无 C/C++ 源码）"
homepage: "https://github.com/kilobyte/vtgamma"
license: Public-Domain
category: utility
languages: [perl]

# ============================================================
# 构建信息
# ============================================================

# 上游归档无构建系统（LICENSE/README/vtgamma/vtgamma.1 四文件），配方直接安装
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本包：配方直接安装脚本 + man page，无编译步骤"
    - "上游 shebang 写死 #!/usr/bin/perl -w；HarmonyOS PC 系统 perl 在 /data/service/hnp/bin/perl（非标准路径），配方改写为 #!/usr/bin/env perl，运行期从 PATH 解析解释器"
    - "运行期依赖 perl 5 解释器：配方声明 Conan 依赖 perl/5.42.2（OHOS/armv8 二进制已在制品仓发布），VirtualRunEnv 将其 bin/ 加入 PATH"
  common_dependencies:
    - perl

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.5":
    status: built
    build_date: "2026-10-13"
    source_url: "https://codeload.github.com/kilobyte/vtgamma/tar.gz/refs/tags/0.5"
