# ============================================================
# 必须字段
# ============================================================

version: "9.0.0"
conan_ref: "vtr/9.0.0"

software: "vtr"

# 编译状态
# published | built | failed | archived
status: failed

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 release asset（不是 GitHub 自动生成的 tag tarball）——理由见 conandata.yml：
  # 自动 tag tarball 的 libs/EXTERNAL/{libcatch2,sockpp} 是空子模块（各 1 条目），
  # 而 release asset 内含完整内容（639 / 153 条目）。Catch2 是所有 VTR 单元测试
  # 目标的链接依赖，用 tag tarball 会静默丢掉整个单元测试套件。
  url: "https://github.com/verilog-to-routing/vtr-verilog-to-routing/releases/download/v9.0.0/vtr-verilog-to-routing-9.0.0.tar.gz"
  sha256: "bebbfac162630a2bea7403f2b2102200c31709dfea26bac85626ee7327a2881c"
  size_bytes: 468148819
  tar_format: tar.gz
  tag: "v9.0.0"
  tag_commit: "8cb20aa5293b5ce5f6a05c88b37b38e1305d9b07"
  release_date: "2025-01-21"
  license: "MIT"
  # 与自动 tag tarball 的对账（实测）
  auto_tarball:
    url: "https://codeload.github.com/verilog-to-routing/vtr-verilog-to-routing/tar.gz/refs/tags/v9.0.0"
    sha256: "a007d40537e90af4fee311771ce3c54545e72aad3ce2694ab92a8e534e3e9a5d"
    size_bytes: 107425921
    deficiency: "libs/EXTERNAL/libcatch2 与 libs/EXTERNAL/sockpp 为空子模块，未使用"

  # 流程运行所必需的 Python 模块（随包分发，见 notes.md 第 5.4 节）。
  # import vtr 会在模块层 from prettytable import PrettyTable，prettytable 渲染时
  # 又惰性 import wcwidth，二者缺一则流程与上游回归 runner 都无法启动。
  # 三份归档统一放在 conandata.yml 的 `sources:` **列表**中（[0] VTR、[1] prettytable、
  # [2] wcwidth），这样构建流水线的 prefetch 会把它们一并暂存并校验 sha256。
  python_runtime_modules:
    - name: "prettytable"
      version: "3.18.0"
      role: "sources[1]"
      url: "https://files.pythonhosted.org/packages/81/74/ba08d81e668ccfe8658d7520a307e63c19862c08eb4ccb26f356c5239a7a/prettytable-3.18.0.tar.gz"
      sha256: "439217116152244369caf3d9f1caf2f9fe29b03bd79e88d2928c8e718c95d680"
    - name: "wcwidth"
      version: "0.9.1"
      role: "sources[2]"
      url: "https://files.pythonhosted.org/packages/dc/ac/3a943d2792c9bb368aaa8b50121c0f778460ba2d7fbdc0a0366201d9e761/wcwidth-0.9.1.tar.gz"
      sha256: "5823209b0d43af322ce698c689380d7c15ca31fa8e6e3be8459f27031bef0af5"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # 传给 CMake 的关键变量（在 conanfile.py generate() 中设置）
  configure_options:
    - "-DVPR_USE_EZGL=off"       # 上游官方 headless 配置（GTK3/X11 缺失时的既有回退路径）
    - "-DWITH_ODIN=ON"           # 上游默认 OFF，本次显式开启以覆盖 ODIN II 全链路
    - "-DWITH_ABC=ON"            # 上游默认
    - "-DWITH_PARMYS=ON"         # 上游默认（驱动 Yosys + parmys 插件）
    - "-DVTR_ENABLE_CAPNPROTO=ON" # 上游默认
    - "-DVTR_ENABLE_STRICT_COMPILE=OFF"  # 上游默认；显式写出避免漂移为 -Werror
    - "-DVTR_IPO_BUILD=off"      # 关闭 PGO（release_pgo 会在构建中途跑 titan 基准套件）

  dependencies:
    - "zlib/1.3.1"
    - "openssl/3.5.6"
    - "eigen/3.4.1"
    - "tcl/8.6.16"
    - "readline/8.3"
    - "libffi/3.5.2"

  tool_dependencies:
    - "bison/3.8.2"
    - "flex/2.6.4.2"   # 2.6.4 的制品仓 revision 无 binary，见 notes.md 第 5.2 节
    - "pkg-config/0.29.2"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "patches/0001-cmake-modules-AutoClangFormat.cmake.patch"
    root_cause: "BUILD:configure:AutoClangFormat-ProcessorCount"
    target: "cmake/modules/AutoClangFormat.cmake"
    reason: >
      ProcessorCount() 返回 0 时 VTR 直接 FATAL_ERROR 中止整个 CMake 配置；
      而该值只用于 clang-format 辅助目标的 xargs -P。CMake 文档明确 ProcessorCount()
      可能返回 0，故改为退化为串行（CPU 数可知时行为不变）。不改算法语义、不删功能、
      不改测试期望。详见 notes.md 第 5.3 节。

