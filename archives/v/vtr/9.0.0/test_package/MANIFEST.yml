# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 本文件的全部数字均来自对 vtr-verilog-to-routing-9.0.0 官方 release archive
# 解包树的实际扫描，命令与结果见 notes.md「上游测试清点」一节。

package: vtr/9.0.0
homepage: "https://github.com/verilog-to-routing/vtr-verilog-to-routing"

# ── 上游测试命令 ────────────────────────────────────────────────────
# VTR 根 Makefile 没有自己的 test 目标，`make test` 被转发给 CTest；
# 上游 README.developers.md 的写法是 `make && make test`。
upstream_check_command: "make && make test"

# conanfile.py build() 中已集成 CTest（4 个 Catch2 单元测试目标 / 126 个 TEST_CASE）。
# 说明：VTR 的回归套件是独立的 Python 程序（run_reg_test.py），既不注册进 CTest，
# 也不在 CMake 构建体系内，见下方 upstream_tests 的 odin/parmys/regression 条目。
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# ── 上游测试体系（完整清点）──────────────────────────────────────────
upstream_tests:
  # ---- 层 1a: C++ 单元测试 (CTest) ----
  - file: "vpr/test/CMakeLists.txt"
    source: "vtr-verilog-to-routing/vpr/CMakeLists.txt:313-331"
    description: "test_vpr — vpr 单元测试（29 个 .cpp，80 个 TEST_CASE），链接 libvpr + Catch2::Catch2WithMain"
    command: "ctest -R test_vpr --output-on-failure"
  - file: "libs/libvtrutil/test/CMakeLists.txt"
    source: "vtr-verilog-to-routing/libs/libvtrutil/CMakeLists.txt:139"
    description: "test_vtrutil — vtrutil 单元测试（13 个 .cpp，29 个 TEST_CASE）"
    command: "ctest -R test_vtrutil --output-on-failure"
  - file: "libs/libarchfpga/test/CMakeLists.txt"
    source: "vtr-verilog-to-routing/libs/libarchfpga/CMakeLists.txt:74"
    description: "test_archfpga — 架构解析单元测试（2 个 .cpp，3 个 TEST_CASE）"
    command: "ctest -R test_archfpga --output-on-failure"
  - file: "utils/fasm/test/CMakeLists.txt"
    source: "vtr-verilog-to-routing/utils/fasm/CMakeLists.txt:58"
    description: "test_fasm — FASM 比特流写出单元测试（5 个 .cpp，14 个 TEST_CASE）"
    command: "ctest -R test_fasm --output-on-failure"

  # ---- 层 1b: VTR task 回归套件 (独立 Python, 不在 CTest 内) ----
  - file: "vtr_flow/tasks/regression_tests/*/task_list.txt"
    source: "vtr-verilog-to-routing/vtr_flow/tasks/regression_tests/"
    description: >
      23 个可运行回归套件（由 <suite>/task_list.txt 枚举，run_reg_test.py:341-344 硬编码该路径）。
      vtr_flow/tasks/**/config/config.txt 共定义 342 个 task（其中 regression_tests 下 328 个），
      task_list.txt 实际列出 303 个唯一 task；333 个 task 带 golden_results.txt 基准。
      差额说明：39 个 regression_tests task 未被任何 task_list 引用（定义了但 runner 跑不到），
      另有 14 条 task_list 条目为目录式写法（parmys/f4pga），不指向 config.txt。
      每个 task 展开为 arch × circuit × script_params 的笛卡尔积，再由 parse 规则比对 golden 值。
      完整口径见 notes.md 第 4 节。
    command: "./run_reg_test.py <suite> -j<N>"

  - file: "run_quick_test.py"
    source: "vtr-verilog-to-routing/run_quick_test.py"
    description: "vtr_reg_basic 冒烟套件（4 个 task）——仅用于早期冒烟，不能代表全量"
    command: "./run_quick_test.py -j<N>"

  - file: "odin_ii/verify_odin.sh"
    source: "vtr-verilog-to-routing/odin_ii/verify_odin.sh"
    description: "ODIN II 语法/算子回归驱动（run_reg_test.py 中 odin* 套件走此脚本）"
    command: "./run_reg_test.py odin_reg_strong"

  - file: "parmys/verify_parmys.sh"
    source: "vtr-verilog-to-routing/parmys/verify_parmys.sh"
    description: "PARMYS 前端回归驱动（run_reg_test.py 中 parmys* 套件走此脚本）"
    command: "./run_reg_test.py parmys_reg_strong"

# ── test_package 自带的测试（消费者视角验证）────────────────────────
test_package_tests:
  - file: "test_package/assert_flow.py"
    description: >
      对安装后的包跑一次真实端到端 CAD 流程（用 VTR 自带的 single_wire.v +
      k6_N10_mem32K_40nm.xml），并逐阶段断言：综合/Packing/Placement/Routing/
      时序分析的日志标记必须出现，.net/.place/.route 产物必须存在且非空。
      标记字符串取自上游自身的 parse 配置，非自造。
    command: "python3 assert_flow.py <flow_temp_dir>"

  - file: "test_package/conanfile.py"
    description: >
      定位包内 vtr_flow 资源（脚本/benchmark/architecture 是否真的打进去了），
      调用 run_vtr_flow.py 完成综合→打包→布局→布线→时序分析全流程。
    command: "run_vtr_flow.py single_wire.v k6_N10_mem32K_40nm.xml"

# 测试断言总数 (近似值)
assertion_count: 11
