name: vusted
version: "2.5.3-1"
package_type: lua
license: MIT
homepage: "https://github.com/notomo/vusted"
source:
  url: "https://github.com/notomo/vusted/archive/refs/tags/v2.5.3.tar.gz"
  mirror: "https://gh-proxy.com/https://github.com/notomo/vusted/archive/refs/tags/v2.5.3.tar.gz"
  sha256: "b7e15560ecc822fe5da5dfa8229ea1e30895f3c28c79e16c694f57f43416ba42"

build:
  system: custom
  requires:
    - lua/5.4.8
    - luasystem/0.6.3-1
    - busted/2.2.0-1
    - neovim/0.11.3

artifacts:
  - bin/vusted
  - bin/vusted_entry.vim
  - share/lua/5.4/vusted/run.lua
  - share/lua/5.4/busted/outputHandlers/vusted/default.lua

validation:
  consumer_smoke: true
  upstream_tests: "24 Vusted specs present; pending Neovim-backed OHOS validation"

notes:
  - "Entry script is patched to use Conan-provided LUA_PATH/LUA_CPATH"
  - "Runtime requires nvim on PATH"

