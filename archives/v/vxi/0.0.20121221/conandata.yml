# entries forward the identical official GitHub release archive byte-for-byte
# (sha256 unchanged, E017 use-ghfast + dasel/2.8.1-r14 multi-proxy precedent);
# official GitHub URL stays last as fallback. True preflight 2026-10-14:
# gh-proxy.com -> 403 forbidden, github.com direct -> connect timeout, so a
# single-proxy list cannot survive; ghfast.top + mirror.ghproxy.com added.
