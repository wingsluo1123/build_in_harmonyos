version: "0.0.20121221"
software: vxi
status: built
build_date: "2026-10-14"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/v/vxi/vxi_0.0.20121221.orig.tar.gz"
  sha256: "12b04dbc8f8538dfebb062c16fbaa8fdf11a3ca110e8ffabdeba60363e3af8d8"
