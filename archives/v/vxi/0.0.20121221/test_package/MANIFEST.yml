  source_sha256: "12b04dbc8f8538dfebb062c16fbaa8fdf11a3ca110e8ffabdeba60363e3af8d8"
  source_origin: "https://deb.debian.org/debian/pool/main/v/vxi/vxi_0.0.20121221.orig.tar.gz"
  top_level_files:
    - file: "Makefile.am"
      role: "automake 入口，仅 lib_LIBRARIES + nodist 头/源（rpcgen 生成）"
      test_targets: "none（无 TESTS/check_PROGRAMS/check-local）"
      is_test: false
    - file: "configure.ac"
      role: "autoconf 输入，仅 AC_PROG_CC/AC_PROG_RANLIB + AC_OUTPUT"
      test_targets: "none（无测试框架探测与注册）"
      is_test: false
