# test_package 自带的测试（消费者视角验证：真实调用 RPC 头/XDR 编解码/桩符号）
test_package_tests:
  - file: test_vxi.c
    description: "消费者测试：DEVICE_CORE/ASYNC/INTR 程序号与规范常量比对"
    command: "./test_vxi"
  - file: test_vxi.c
    description: "消费者测试：xdr_Create_LinkParms 内存流编解码往返"
    command: "./test_vxi"
  - file: test_vxi.c
    description: "消费者测试：xdr_Device_WriteParms 负载编解码往返"
    command: "./test_vxi"
  - file: test_vxi.c
    description: "消费者测试：libvxiclient/libvxiserver XDR 符号链接解析"
    command: "./test_vxi"

# 测试断言总数（test_vxi.c 内 4 项 CHECK，全部断言真实行为）
assertion_count: 4
