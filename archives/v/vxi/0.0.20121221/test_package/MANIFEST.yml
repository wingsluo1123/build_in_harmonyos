      role: "VXI-11 RPC 规范源（附录 C），Public Domain"
      test_targets: "none（规范定义，非测试）"
      is_test: false
    - file: "configure / Makefile.in / aclocal.m4 / config.* / depcomp / install-sh / missing"
      role: "预生成 autotools 产物与辅助脚本"
      test_targets: "none"
      is_test: false
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check-local"
    - "tests/ / test/ / t/ / spec/ 目录"
    - "*_test.c / test_*.py / *check*.c 测试源"
    - "configure.ac enable_testing / add_test"
    - "ctest / meson test / pytest 入口"
