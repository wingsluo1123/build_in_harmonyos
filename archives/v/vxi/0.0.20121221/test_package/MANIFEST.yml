  make_check_output: "automake 默认 no-op（Makefile.am 无 TESTS，check 目标无用例可执行）；build() 不调用 make check（upstream_test_in_build: false），证据由 test_package 阶段 no_tests 标记给出（对齐 bwm/0.6.3 范例）"
  reason: "vxi 0.0.20121221 上游（Debian vxi 源码包）为纯 RPC 桩库发布包，不含任何测试套件：无 tests/test 目录，无 TESTS/check_PROGRAMS 定义，无测试源文件与测试框架注册"

