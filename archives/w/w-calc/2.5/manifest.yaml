# 版本级 manifest — w-calc 2.5
# 文件位置: archives/w/w-calc/2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.5"
software: "w-calc"
status: built
build_date: "2026-10-14"
build_system: autotools
conan_ref: "w-calc/2.5"

source:
  url: "https://downloads.sourceforge.net/project/w-calc/Wcalc/2.5/wcalc-2.5.tar.bz2"
  sha256: "0e2c17c20f935328dcdc6cb4c06250a6732f9ee78adf7a55c01133960d6d28ee"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--without-readline"
    - "--with-gmp=<Conan gmp package folder>"
    - "--with-mpfr=<Conan mpfr package folder>"
  dependencies:
    - "gmp/6.3.0"
    - "mpfr/4.2.2.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-configure-hmdfs-umask.patch"

knowledge_gained:
  - "上游 configure 以 umask 077 创建 config.status 临时目录，OHOS HMDFS 上不可写导致 subs1.awk Permission denied；改用 umask 022 解决（E011）。"
  - "readline 为可选依赖，--without-readline 可移除；标准输入交互保留，仅历史/补全缺失。"
  - "make check 的 9 个 err.* 用例是上游 XFAIL_TESTS 声明的预期失败，按预期结果计为通过而非跳过。"
