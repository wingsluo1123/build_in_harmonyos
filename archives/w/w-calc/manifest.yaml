software: w-calc
display: "w-calc"
description: "任意精度命令行科学计算器（基于 GMP/MPFR）"
category: utility
homepage: "https://wcalc.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 用 --without-readline 关闭可选的 readline 依赖；标准输入交互仍可用，仅历史与补全不可用"
    - "上游 configure 以 umask 077 创建 config.status 临时目录，在 OHOS HMDFS 上不可写；补丁 0001 改为 umask 022（知识条目 E011）"
    - "GMP/MPFR 由已发布的 gmp/6.3.0 与 mpfr/4.2.2.1 Conan 包提供，经 --with-gmp/--with-mpfr 定位"
    - "在 conanfile build() 内真实执行上游 make check（21 个 automake 测试）"
  common_dependencies:
    - "gmp/6.3.0"
    - "mpfr/4.2.2.1"

versions:
  "2.5":
    status: built
    build_date: "2026-10-14"
    conan_ref: "w-calc/2.5"
