software: w-scan
display: "w_scan"
description: "Command-line DVB channel scanner that generates tuning and channel-list output"
category: multimedia
homepage: "https://wirbel.htpc-forum.de/w_scan/index2.html"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "The Debian source archive ships generated Autotools files; the recipe compiles the C sources directly and avoids the upstream version target rewriting version.h and configure.ac."
    - "A CRLF-safe build-time replacement changes the non-portable <sys/errno.h> include to standard <errno.h> for OHOS/musl."
    - "The DVB UAPI headers are taken from the OHOS sysroot; iconv and clock_gettime are provided by the OHOS libc."
  common_dependencies: []

versions:
  "20210218":
    status: pending_ci
    build_date: "2026-10-10"
    conan_ref: "w-scan/20210218"
