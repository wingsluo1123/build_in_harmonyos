# 软件级 manifest — waffle
# 文件位置: archives/w/waffle/manifest.yaml

software: waffle
display: "Waffle"
description: "Cross-platform library for selecting an OpenGL API and window system at runtime"
category: gfx
homepage: "https://waffle.freedesktop.org/"
license: BSD-2-Clause
build_system: meson

ohos_adaptation:
  key_points:
    - "上游主推 meson 构建（CMake 已废弃且 Linux 强制至少一个 GL 后端，OHOS 不可用）"
    - "OHOS 无 GL/EGL/GBM/DRM/X11/Wayland 图形栈，meson auto 探测全部 GL 后端 disabled，只构建核心库"
    - "真机/CI PATH 无 meson，需 vendoring meson 源码；cmocka 测试框架需 vendoring 到 subprojects/cmocka/"
    - "上游核心单元测试（cmocka，3 可执行文件共 86 用例）与平台无关，OHOS 全通过"
  common_dependencies:
    - "vendored meson 1.11.2（构建工具）"
    - "vendored cmocka 1.1.2（测试框架）"

versions:
  "1.8.3":
    status: built
    build_date: "2026-10-07"
