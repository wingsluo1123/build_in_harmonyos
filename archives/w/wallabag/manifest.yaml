software: wallabag
display: "wallabag"
description: "Self-hostable read-it-later web application (PHP/Symfony)"
category: network
homepage: "https://github.com/wallabag/wallabag"
license: MIT
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "PHP 应用生产包无编译过程：build() 做审计 + 纯 python 结构完整性校验，有系统 php 时追加 lint/装载验证（conan 远端无 php 配方，不声明 tool_requires）"
    - "生产包 vendor/bin/ 为空，上游 phpunit 套件需外部 DB/redis/rabbitmq，计 environment gaps"
    - "package_type=application 会触发 L0k，须配软件级 commands.json"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "2.6.14":
    status: built
    build_date: "2026-09-30"
    conan_ref: "wallabag/2.6.14"
