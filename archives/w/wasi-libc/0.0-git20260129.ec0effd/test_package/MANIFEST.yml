name: test_package
package: wasi-libc/0.0-git20260129.ec0effd
entry: test_consumer.c + wasi-run.mjs
what: |
  Consumer compiled to wasm32-wasip1 against the packaged sysroot with
  zig cc, executed under Node.js built-in WASI (preview1) through
  wasi-run.mjs (wasmtime-compatible --dir/--env CLI).
checks:
  - snprintf/strlen/strstr (stdio+string)
  - malloc+qsort correctness
  - file create/write/read/stat/unlink against a preopen fixture dir
  - time/gmtime_r/strftime
  - getenv (runner-passed environment)
  - final marker CONSUMER_PASS / exit code 0
