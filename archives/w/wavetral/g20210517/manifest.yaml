# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/g20210517/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "g20210517"

# 软件名
software: "wavetral"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-15"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/jeanette-c/wavetral/tar.gz/b54422a2859d9a32ec1c9e37474f6d6e23135d9e"

  # 源码校验和
  sha256: "3b09b3ffb1c629c2a0a404528f3d0d8f2d53a60ffca7d014558b22035195ee97"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.90.0.4
    - fftw/3.3.11
    - libsndfile/1.2.2
    - libsamplerate/0.2.2
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Conan get() 对 codeload tar.gz URL 需显式 filename，否则误判 zip（E276）"
  - "上游 CMake legacy Boost/pkg-config 变量需要桥接 Conan CMakeDeps imported targets 或绝对库路径（E550 draft）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
