    description: "消费者测试：执行打包后的 wavetral，验证版本横幅；把提交的正弦波文本夹具转换为 4 条频谱并断言基波归一化为 1、高次谐波低于阈值；再转换为 16 帧单声道 16-bit WAV 并解析 RIFF/fmt/data 块；最后验证缺输入文件必须失败"
    command: "./test_wavetral"

