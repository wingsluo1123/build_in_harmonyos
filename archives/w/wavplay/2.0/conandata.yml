sources:
  url: "https://download.sourceforge.net/project/wavplay/Release%20Downloads/wavplay-2.0.tar.gz"
  sha256: "256ea0b581d587b482e0c928869e3896845a5299b8e124c01749b4b9edfeb552"
patches:
  - patch_file: "patches/0001-include-wavplay.h.in.patch"
    patch_description: "Extend DSPFILE with OH_AudioRenderer/OH_AudioCapturer handles and audio-callback sync state; add pthread.h include"
    patch_type: "portability"
  - patch_file: "patches/0002-src-file.c.patch"
    patch_description: "Rewrite the legacy OSS /dev/dsp audio backend as OHOS native OH_AudioRenderer/OH_AudioCapturer (pure callback model); guard the OSS code with #ifndef __OHOS__"
    patch_type: "portability"
  - patch_file: "patches/0003-src-locks.c.patch"
    patch_description: "No-op DSP locking on OHOS (the audio service manages device lifecycle); guard the sysv semaphore implementation with #ifndef __OHOS__"
    patch_type: "portability"
  - patch_file: "patches/0004-src-server.c.patch"
    patch_description: "Guard the SNDCTL_DSP_RESET ioctl with #ifndef __OHOS__ (device lifecycle managed by the renderer/capturer)"
    patch_type: "portability"
