# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "2009 版 config.guess 不识别 HarmonyOS build machine；autotools OHOS 交叉编译显式 --build/--host=aarch64-unknown-linux-gnu 绕过（config.sub 接受）"
- "OHOS SDK clang 已 baked-in aarch64-unknown-linux-ohos + sysroot，无需显式 --target/--sysroot"
- "OSS /dev/dsp 后端重写为 OH_AudioRenderer/OH_AudioCapturer（纯回调）；播放用 OnWriteDataCallbackAdvanced（返回填充字节数，0=EOF），录音用 OnReadDataCallback"
- "OHOS 音频设备锁由 audio service（binder）管理，userspace no-op；OpenDSPLocks 须返回 0（非 -1）否则调用方误判锁失败"
- "OHOS 仅支持 8/16bit PCM（12/24/32bit 不支持）；HAVE_OS_UNKNOWN 下不 include soundcard.h，SNDCTL_DSP_* 需 #ifndef HAVE_OHOS_AUDIO 包裹"

patch_generation:
