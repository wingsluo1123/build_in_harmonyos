# wavplay 2.0 test_package manifest
#
# 上游 wavplay 2.0 无自动化测试套件：无 tests/ 目录、无 `make check` 目标、
# 无 CTest（2009 年的 autotools CLI 工具）。test_package 因此提供自研消费者
# smoke 测试，驱动打包后的 wavplay / wavrec CLI（即该包的对外公开接口）。
package: wavplay/2.0
homepage: "https://sourceforge.net/projects/wavplay/"

upstream_check_command: "none"
upstream_test_in_build: false

test_type: smoke
test_package_tests:
  - file: consumer_test.c
    description: "驱动 wavplay / wavrec CLI 公开接口（--version / --help / -i 信息模式），验证消费者编译+链接+运行通过及 WAV 头解析正确（6 项断言，不触音频设备）"
    command: "./consumer_test"

assertion_count: 6
