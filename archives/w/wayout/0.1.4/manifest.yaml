knowledge_gained:
  - "Meson removed dependency.get_pkgconfig_variable() in 1.6; sources written for older Meson must switch to get_variable(pkgconfig: ...) (wayout 0.1.4, wdisplays family)."
  - "Conan PkgConfigDeps only emits .pc files for a package's single pkg_config_name, so dependency('wayland-cursor') and dependency('pangocairo') are missing even when the packages ship those libraries; bridge .pc files with the real package prefix are needed."
  - "The wayland package's bin/wayland-scanner cannot execute on HMFS (unsigned ELF + absolute build-machine DT_NEEDED); stage it with patchelf + re-sign and wrap it with LD_LIBRARY_PATH."
  - "Meson on OHOS cannot spawn bare command names (ENOENT for pkg-config/ninja/ar/ranlib); the machine file needs absolute paths."
  - "wayout declares its no-op wl_output listener with an empty parameter list, which modern clang rejects under -Wstrict-prototypes -Werror; disabling that warning at the build-system level keeps the intentional callback table intact."
