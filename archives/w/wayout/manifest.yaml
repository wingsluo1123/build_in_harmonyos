software: wayout
display: "wayout — Wayland Desktop Text Widget"
description: "Reads stdin feeds and renders them on a wlr-layer-shell desktop widget"
category: utility
homepage: "https://git.sr.ht/~proycon/wayout"
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson >= 1.6 compatibility patch: dependency.get_pkgconfig_variable() was removed, use get_variable(pkgconfig:)."
    - "Bridge .pc files (wayland-cursor, pangocairo, wayland-scanner, wayland-protocols pkgdatadir) are generated because Conan PkgConfigDeps only emits one .pc per package."
    - "wayland package's wayland-scanner is staged with patchelf + re-sign and executed through an LD_LIBRARY_PATH wrapper on HMFS."
    - "Meson machine file gets absolute pkg-config/ninja/ar/ranlib paths (OHOS cannot spawn bare command names)."
    - "Produced ELF is self-signed for HMFS execution."
  common_dependencies:
    - wayland
    - wayland-protocols
    - cairo
    - pango

versions:
  "0.1.4":
    status: built
    build_date: "2026-10-17"
