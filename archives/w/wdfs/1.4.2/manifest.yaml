software: wdfs
version: '1.4.2'
status: published
build_date: '2026-10-16'
build_system: autotools

source:
  url: 'https://github.com/codyps/wdfs/archive/3fa703545e384dca75417b01a45a534a253ef4c7.tar.gz'
  sha256: '6001cf77011a1d9e98a4e7734baba9fe58cd20363ff0de62c15290ca8346b237'
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - 'PKG_CONFIG_PATH=<conan generators>（fuse/neon/glib-2.0 模块解析）'
  cc: clang

patches_applied: []

knowledge_gained:
  - 'OHOS musl libc 未导出 pthread_setcanceltype（仅导出 pthread_cancel/pthread_setcancelstate）：源码直接调用该 API 时，二进制虽因 -Wl,--unresolved-symbols=ignore-all 链接成功，但运行期动态加载器以 "Error relocating <exe>: pthread_setcanceltype: symbol not found" 拒绝启动（rc=127）→ 配方内提供语义兼容实现并随可执行文件链入'
  - 'neon 的公开头文件安装在 <prefix>/include/neon/（源码用无前缀 #include <ne_props.h>），而 conan PkgConfigDeps 生成的 neon.pc 仅带 -I<prefix>/include → 需手写 neon.pc 补 include/neon（同 libfuse 无 pkg_config_name 时手写 fuse.pc 的做法）'
  - 'neon/0.34.0 约束 zlib/1.3.1、glib/2.88.3.1 约束 zlib/1.3.2，同图内版本冲突 → 用 self.requires("zlib/1.3.2", override=True) 统一（仓库 zlib/1.3.2 为 -fPIC 静态版）'
  - '宿主 $HOME/usr/local 的 CPPFLAGS/LDFLAGS 污染会让 -lglib-2.0 命中宿主 libglib-2.0.a 静态库（LDFLAGS 在链接行中先于 LIBS），产生 g_libintl_* 运行期缺符号假象；本地验证须 unset CPPFLAGS/CFLAGS/CXXFLAGS/LDFLAGS/LD_LIBRARY_PATH 以对齐 CI 干净环境'
