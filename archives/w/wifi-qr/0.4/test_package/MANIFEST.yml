# test_package/MANIFEST.yml — wifi-qr 0.4
# 上游官方测试声明文件（R51 上游测试三步法）
#
# 1) 清点：上游无自动化测试套件。仓库无 tests/ 目录，无 ctest/pytest 注册；
#    Makefile 仅有 test-install/test-uninstall（安装演练，非功能测试），
#    且依赖 dh_make/gpg/debuild 等 Debian 打包工具，与功能验证无关。
# 2) 实测：上游无测试 → 以 test_package 消费者测试代替（真实调用工具）。
# 3) 申报：上游测试 0/0，通过率 N/A；test_package 自有测试见下。

package: wifi-qr/0.4
homepage: "https://github.com/kokoye2007/wifi-qr"

upstream_check_command: ""      # 上游无 make check / ctest / pytest
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []              # 上游确无测试（清点证据见上方说明）

test_package_tests:
  - file: conanfile.py (test())
    description: "真实运行 wifi-qr -v，断言版本横幅 WiFi-QR 0.4 输出"
    command: "conan test（conan create 自动执行）"
  - file: conanfile.py (test())
    description: "真实运行 wifi-qr -h，断言用法信息输出且退出码为 0"
    command: "conan test（conan create 自动执行）"

assertion_count: 2
