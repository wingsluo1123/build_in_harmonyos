# conandata.yml — wiki-tui 0.9.2
# wiki-tui: 终端 Wikipedia 浏览器 TUI（Rust / ratatui + crossterm）
# 上游：github.com/Builditluc/wiki-tui

sources:
  url:
    - "https://gh-proxy.com/https://github.com/Builditluc/wiki-tui/archive/refs/tags/v0.9.2.tar.gz"
    - "https://github.com/Builditluc/wiki-tui/archive/refs/tags/v0.9.2.tar.gz"
  filename: "wiki-tui-v0.9.2.tar.gz"
  sha256: "4f51547c0597ee9d6be9e946a612bfc052f8addd59b01f2bd599b31c3b636004"

# Rust 工具链走仓库内 conan 包 rust-toolchain/1.97.1（tool_requires，
# rust-lang 官方 dist，OHOS aarch64 宿主/目标），构建期由配方自签名。
# cargo 动态链接 libssl.so/libcrypto.so/libz.so（实测 NEEDED）由 tool_requires
# openssl/3.5.8.1 + zlib/1.3.2.1 的静态 PIC 归档重链私有 .so 提供（cbindgen
# 0.28.0 同款方案），不走 Harmonybrew bottle（该 CDN 会轮换旧版，实测 404）。

patches:
  - patch_file: "patches/0001-wiki-api-reqwest-switch-to-rustls.patch"
    description: "wiki-api 的 reqwest 切换到 rustls-tls（纯 Rust TLS），去掉 native-tls/OpenSSL 依赖"
