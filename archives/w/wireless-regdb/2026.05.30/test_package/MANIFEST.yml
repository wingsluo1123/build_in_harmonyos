# test_package/MANIFEST.yml
# Upstream test declaration file for wireless-regdb

package: wireless-regdb/2026.05.30
homepage: "https://wireless.wiki.kernel.org/en/developers/regulatory"

# wireless-regdb has no upstream test suite (make check / ctest)
# It is a data-only package; verification = file existence check
upstream_check_command: "make"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (data-only package)
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Verify regulatory database files (regulatory.bin, regulatory.db, regulatory.db.p7s) are installed"
    command: "conan test"

assertion_count: 3
