# 软件级 manifest
# 文件位置: archives/w/wireless-regdb/manifest.yaml

software: wireless-regdb
display: "wireless-regdb"
description: "Linux Wireless Regulatory Database — regulatory rules for WiFi/Bluetooth"
category: data
homepage: "https://wireless.wiki.kernel.org/en/developers/regulatory"
license: ISC

build_system: makefile

ohos_adaptation:
  key_points:
    - "Python scripts use #!/usr/bin/env python, must patch to python3 on OHOS"
    - "gen-pubcert.sh uses #!/bin/bash, must patch to /usr/bin/env bash on OHOS"
    - "Pure data package, no C/C++ compilation needed"
  common_dependencies: []

versions:
  "2026.05.30":
    status: built
    build_date: 2026-07-15
