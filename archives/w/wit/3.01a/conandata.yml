sources:
  url: "https://deb.debian.org/debian/pool/main/w/wit/wit_3.01a.orig.tar.gz"
  sha256: "513a34cf97bbec6e1e04a2d9e02e4090cad77ea91a3f6d749f14e3bf7806358b"
patches:
  - patch_file: "patches/0001-setup-sh-cross-compile-guard.patch"
    patch_description: "Add WIT_SETUP_SKIP guard to setup.sh so cross builds can inject a pre-made Makefile.setup"
  - patch_file: "patches/0002-use-conan-bzip2-mhash.patch"
    patch_description: "Link conan bzip2 and mhash instead of bundled sources, adapted from the Debian use-libbz2-and-mhash patch"
  - patch_file: "patches/0003-dclib-color-musl-const-stdio.patch"
    patch_description: "Stop assigning to stdout/stderr, which are const FILE* on the musl based OHOS libc"
