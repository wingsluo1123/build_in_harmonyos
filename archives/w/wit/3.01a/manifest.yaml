knowledge_gained:
  - "setup.sh is an interactive host detection script that writes Makefile.setup at build time; it cannot run while cross compiling, so a WIT_SETUP_SKIP=1 guard (patch 0001) plus a pre-written Makefile.setup with fixed revision 7464 is used instead."
  - "WIT_SETUP_SKIP must be present in the make environment, not only on the make command line: setup.sh is invoked from a $(shell) context which does not inherit command line variables."
  - "SYSTEM=linux in Makefile.setup keeps the build away from makefiles-local/Makefile.local.x86_64 (-march=x86-64) and matches what system.c detects for linux; there is no Makefile.local.linux."
  - "All pre-generated UI sources ship in src/ui/, so no generator step is needed; gen-ui is compiled but never executed during the build."
  - "XFLAGS is the Makefile injection point for CFLAGS (-fPIE plus dependency include paths); LDFLAGS takes -pie plus dependency library paths; STRIP=true keeps binaries unstripped."
  - "musl based OHOS libc declares stdout/stderr as const FILE*, so dclib-color.c needs a set_std_stream() helper (patch 0003) instead of direct reassignment."
  - "The bundled lzma decoder is kept (Debian drops it only because Debian bans embedded copies); bzip2 and SHA-1 are replaced by the conan bzip2 and mhash packages following the Debian patch."
knowledge_ref:
  - "archives/w/wit/3.01a/notes.md"
