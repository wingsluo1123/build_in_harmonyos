# test_package/MANIFEST.yml
# wit 3.01a 上游测试声明
# 上游 wit 没有可运行的测试套件：源码树中的 wtest 工具依赖未发布的私有
# "work" 源码（wtest+.c / HAVE_WORK_DIR，tarball 不含）；上游与 Debian 打包
# 均不运行任何测试。因此如实登记为空，消费者侧验证放在 test_package_tests。

package: wit/3.01a
homepage: "https://wit.wiimm.de/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_wit.sh
    description: "消费者测试：① wit/wwt/wdf 版本横幅精确匹配 v3.01a r7464；② ELF64/小端/AArch64/PIE 头校验；③ 手工构造 Wii 镜像与 WDF v1 容器做功能验证：wit FTYPE 探测（ISO/WII、WDF1/WII、OTHER、NO-FILE）、wdf +DUMP 结构解析、wdf +CAT 字节级还原（sha256 相等）、wdf +DUMP 缺文件错误路径"
    command: "bash test_wit.sh"

assertion_count: 17
