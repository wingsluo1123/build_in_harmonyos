package: wlc/2.0.0
homepage: https://github.com/WeblateOrg/wlc
upstream_check_command: python3.12 -B -m unittest discover -s tests -t . -v
upstream_test_in_build: true
upstream_test_command: python3.12 -B -m unittest discover -s tests -t . -v
upstream_tests:
- file: tests/test_*.py
  source: wlc-2.0.0/tests/
  description: All 218 dynamically discovered original unittest cases, plus one separately
    identified pagination regression; original test bodies and all fixtures unchanged
  command: python3.12 -B -m unittest discover -s tests -t . -v
test_package_tests:
- file: consumer.py
  description: One consumer imports this installed package and makes three real loopback
    HTTP requests; asserts unique pages, 50 unique translation URLs, original params
    unchanged and finite termination
  command: python3.12 -B consumer.py PACKAGE_FOLDER fixtures
assertion_count: 5
