  1. 上游仓库（github.com/ArtsyMacaw/wlogout 1.2.2 归档逐文件核对）：
     main.c（唯一应用源）、jsmn.h（内置 JSON 解析器）、meson.build、
     meson_options.txt、layout/style.css/assets/icons/completions/man——
     无 tests/ 目录、无 *test* 源文件、meson.build 无 test() 目标。
  2. GUI 应用（GTK3 对话框），上游亦无 CI 测试配置（.github/ 仅
     release 打包 workflow）。
  3. 功能验证由消费者冒烟测试补全（test_package/test.sh）：
     --version/-v（版本标识 1.2.2）、--help/-h（usage 文本）共 4 个
     用例，全部真执行真断言。

