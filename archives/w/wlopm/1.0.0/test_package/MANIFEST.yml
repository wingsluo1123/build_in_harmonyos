upstream_test_in_build: false
upstream_test_command: ""

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: false
upstream_test_audit: |
  审计结论：上游 wlopm 1.0.0 不存在测试套件（N=0）。
  1. 上游仓库（git.sr.ht/~leon_plickat/wlopm v1.0.0 归档逐文件核对）：
     wlopm.c（唯一源文件）、wlr-output-power-management-unstable-v1.xml
     （协议定义）、Makefile、wlopm.1（man 手册）、bash-completion、
     README、LICENSE——无 test/ 目录、无 *test* 文件、无 CI 测试目标。
  2. Makefile 目标仅有 wlopm/install/uninstall/clean，无 check/test 目标。
  3. 功能验证由消费者冒烟测试补全（test_package/test.sh）：
     --version/-v（版本标识 wlopm v1.0.0）、--help/-h（usage 文本含
     --json/--on/--off/--toggle 选项）共 5 个用例，全部真执行真断言。

# 上游实际运行的测试程序（无——N=0）
upstream_tests: []
