# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wlrobs/1.2
homepage: "https://hg.sr.ht/~scoopta/wlrobs"

# 上游测试清点证据（R51 三步法第一步）：
#   - v1.2 源码树顶层仅 COPYING.md / README.md / inc/ / meson.build /
#     meson_options.txt / proto/ / src/，无 tests/ 或 test/ 目录
#   - meson.build 无 test() 声明（全文仅 1 个 shared_library 目标）
#   - meson_options.txt 仅 use_scpy / use_dmabuf 两个构建选项
#   - `meson test` 将报 "no tests defined"
#   结论: 上游自动化测试规模 0/0（确无测试入口，非未运行）
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游确无自动化测试，空列表 + 清点证据见上）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证；鸿蒙侧新增用例）
test_package_tests:
  - file: "test_link.c"
    description: "鸿蒙消费者用例 1（链接期 ABI）：以消费者身份引用 obs_module_load 与打包 lib/obs-plugins/libwlrobs.so 链接，由链接器解析 OBS 插件契约符号"
    command: "clang test_link.c -o test_link -L<lib/obs-plugins> -lwlrobs"
  - file: "test_elf.sh"
    description: "鸿蒙消费者用例 2（运行期 ELF 结构断言）：readelf 断言打包插件为 ELF64/AArch64/ET_DYN、DT_NEEDED 声明 libobs.so+libwayland-client.so、.dynsym 导出 obs_module_load/obs_module_set_pointer（OHOS PC 对未签名 ELF 的 dlopen 一律 EACCES，E258/E077，故采用结构断言）"
    command: "bash test_elf.sh <lib/obs-plugins/libwlrobs.so>"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 6
