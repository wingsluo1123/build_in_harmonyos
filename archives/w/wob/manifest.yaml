software: wob
display: "wob"
description: "轻量 Wayland overlay 进度条（wlr-layer-shell），兼容 sway/i3，在屏幕上显示进度/音量等状态"
category: desktop
homepage: "https://github.com/francma/wob"
license: ISC
build_system: meson

ohos_adaptation:
  key_points:
    - "纯 C99 + Meson；依赖 wayland-client、wayland-protocols（>=1.31）、inih"
    - "wayland-scanner staging+patchelf+重签名（HMFS 未签名 ELF 执行限制，wdisplays 同款）"
    - "wayland-protocols.pc 注入 pkgdatadir 变量（meson get_variable 定位协议 XML）"
    - "seccomp 显式 disabled（上游 musl CI 同款；仅运行期 self-sandbox）"
    - "systemd-unit-files/man-pages 显式 disabled（OHOS 无 systemd；scdoc 仅文档）"
  common_dependencies:
    - "wayland/1.22.0"
    - "wayland-protocols/1.36"
    - "inih/r62"
    - "cmocka/2.0.2"

versions:
  "0.16":
    status: built
    build_date: "2026-10-15"
    source_url: "https://github.com/francma/wob/archive/refs/tags/0.16.tar.gz"
