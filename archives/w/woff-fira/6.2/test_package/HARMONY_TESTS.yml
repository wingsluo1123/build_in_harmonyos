package: woff-fira/6.2
platform: "HarmonyOS PC"
HARMONY_TEST_COUNT: 1
tests:
  - name: harmony-browser-loads-and-rasterizes-woff
    source: harmony_tests/run_webview_font_test.py
    count: 1
    command: "python3 harmony_tests/run_webview_font_test.py --font-dir <package>/share/fonts/woff-fira/woff --serial <hdc-serial>"
    purpose: "Use the HarmonyOS PC system browser to decode all packaged WOFF faces and rasterize Fira Code glyphs on-device."
    capability: "USB-connected HarmonyOS PC with system browser and HDC port forwarding"
