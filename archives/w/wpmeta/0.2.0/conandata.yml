# cargo 运行期共享库：cargo 1.97 动态链接 libssl.so/libcrypto.so/libz.so，且
# 需要 OpenSSL 3.5+ 的 SSL_get0_group_name（系统 /usr/lib 的 3.0 缺该符号）。
# 使用 Harmonybrew OHOS 预编译 bottle（below/argc/alass/weggli 先例）。
# 2026-10-13 实测：weggli 当时使用的 openssl 3.6.4 / zlib 2.3.3_1 bottle 已在
# bottle 仓下架（404），改用 formula API（formula.jws.json）当前发布的
# openssl@3 3.6.5_1 / zlib-ng-compat 2.3.3_2 bottle.1，sha256 与 API 一致并已
# 本地下载实测核验。
cargo_runtime:
  - url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.5_1.arm64_ohos.bottle.1.tar.gz"
    sha256: "ae1d5bf9252d65d86053e68d7c91fc9d0066016bce50662ce4a32a0b0e954ef2"
  - url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_2.arm64_ohos.bottle.1.tar.gz"
