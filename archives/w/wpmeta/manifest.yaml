software: wpmeta
display: "wpmeta"
description: "AOSC 壁纸元数据生成器：读取 metadata.toml 壁纸目录树，为 GNOME（gnome-background-properties XML）与 KDE（KPlugin metadata.json）生成壁纸包元数据，拷贝/规范化图像文件并用 kmeans+material-color-utilities 提取主题强调色"
category: desktop
homepage: "https://github.com/AOSC-Dev/wpmeta"
license: "MIT"
build_system: cargo

ohos_adaptation:
  key_points:
    - "纯 Cargo 虚拟 workspace（localized + wpmeta），203 个锁定依赖全部为 Rust crate，无 C/C++ 编译参与"
    - "rust-toolchain/1.97.1（tool_requires）提供 cargo/rustc + aarch64-unknown-linux-ohos 标准库"
    - "cargo 运行期共享库（libssl/libcrypto/libz）由 Harmonybrew OHOS bottle 提供到私有 build prefix（R49）"
    - "crates.io 走 rsproxy.cn 稀疏镜像 + 显式 CA bundle"
  common_dependencies: []

versions:
  "0.2.0":
    status: built
    build_date: "2026-10-13"
