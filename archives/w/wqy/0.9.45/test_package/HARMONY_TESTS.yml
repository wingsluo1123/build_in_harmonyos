# HARMONY_TEST_COUNT=2
version: 1
tests:
  - name: wqy_native_oh_drawing_ttc_face_rasterization
    source: harmony_tests/native_drawing_probe.cpp
    count: 1
    platform: OHOS
    capability: Native OH_Drawing loads the TTC on the target and rasterizes Chinese glyphs into a bitmap
    boundary: Direct aarch64 target execution with the HarmonyOS NDK; fails on invalid glyph count, failed metrics, or a blank output bitmap
  - name: wqy_app_scoped_ttc_native_drawing_cjk_rasterization
    source: harmony_tests/run_device_test.py
    count: 1
    platform: OHOS
    capability: app-scoped TTC loading and OH_Drawing CJK rasterization across all three collection faces
    boundary: signed HarmonyOS 6 PC HAP installed and launched on one connected USB or TCP aarch64 HDC target
