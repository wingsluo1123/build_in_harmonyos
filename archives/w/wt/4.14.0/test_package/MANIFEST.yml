# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wt/4.14.0
homepage: "https://github.com/emweb/wt"

# ── R51 上游测试三步法：清点 → 运行 → 如实回填 ──────────────────────────
# Wt 4.14.0 上游存在测试套件（test/ 目录，CMake BUILD_TESTS 选项控制，
# 默认 OFF；上游 CI 在启用时跑 WtTestSuite + 各组件测试），但：
#   1. 本配方构建未启用 BUILD_TESTS（上游测试需要 boost-test 全家桶 +
#      Wt 源码内 test 数据，与制品仓依赖图无关，按"上游测试不随包构建"
#      惯例处理）；
#   2. 故 upstream_test_in_build: false，无"随构建运行"的上游测试可回填。
# 结论：上游测试存在但未随本包构建运行，不属于静默跳过（此处如实声明）。
upstream_check_command: "ls test/ 2>/dev/null; grep -n 'BUILD_TESTS' CMakeLists.txt"
upstream_test_in_build: false
upstream_test_command: ""

# 上游随构建实际运行的测试程序（未启用 BUILD_TESTS，0 个）
upstream_tests: []

# ── test_package 自带测试（消费者视角 + 鸿蒙特有，均真实编译/链接/运行）──
test_package_tests:
  - file: test_wt.cpp
    description: "消费者端到端 smoke test（3 条断言）：WServer 以 wthttp 连接器在 127.0.0.1:18087 起服务 → WResource 输出 text/plain 'HELLO_WT_OK' → 原生 socket 发 GET /hello 取回完整 HTTP/1.x 状态行 + 应用标记（真实起服务器、真实网络 IO，非 mock）"
    command: "./test_wt"
    assertions: 3
