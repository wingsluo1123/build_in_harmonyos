      patch_description: "Use HMDFS-compatible permissions for config.status temporary directories"
      patch_type: "portability"
    - patch_file: "patches/0002-lfo.c.patch"
      patch_description: "Include GLib directly for G_MAXUINT"
      patch_type: "compatibility"
