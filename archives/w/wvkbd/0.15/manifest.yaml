version: "0.15"
software: wvkbd
status: built
build_date: "2026-10-16"
build_system: cmake

source:
  url: "https://github.com/jjsullivan5196/wvkbd/archive/refs/tags/v0.15.tar.gz"
  sha256: "b64ae5c1f8d92c0a4437b1288f7760a8df562330aae5398f2dc4ad6116a95f69"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DWVKBD_BUILD_TESTS=OFF"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "HarmonyOS system input methods should use InputMethodExtensionAbility and ArkUI; upstream Wayland panel/input transport is replaced while keyboard behavior remains in a small C core"
  - "HarmonyOS 6.1 can destroy an old IME panel during real TextInput client handoff without emitting inputStop; lifecycle acceptance must use correlated focus, panel destruction, and a distinct replacement token"
  - "A component-only pixel snapshot can verify the rendered non-ASCII Shift glyph without recording editor contents or the full screen"
  - "On SDK 26 InputClient, deleteForward removes text before the cursor and deleteBackward after it; use deleteForward for Backspace at end-of-text"
  - "Repeated lifecycle evidence needs a monotonically increasing sequence so same-run JSON de-duplication does not hide valid repeated events"
