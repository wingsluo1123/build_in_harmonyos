software: wvkbd
display: "wvkbd"
description: "Lightweight virtual keyboard behavior ported as a HarmonyOS PC system input method"
category: system
homepage: "https://github.com/jjsullivan5196/wvkbd"
license: GPL-3.0-only

build_system: cmake

ohos_adaptation:
  key_points:
    - "Upstream is a Wayland client without a cross-platform IME/display abstraction; the HarmonyOS product uses a Stage InputMethodExtensionAbility and ArkUI panel"
    - "The C keyboard core is built as an AArch64 OHOS static library and linked into the HarmonyOS NAPI adapter"
    - "IME panel state and lifecycle are verified from real HarmonyOS UI and session markers"
  common_dependencies: []

versions:
  "0.15":
    status: built
    build_date: "2026-10-16"
    ref: "wvkbd/0.15"
