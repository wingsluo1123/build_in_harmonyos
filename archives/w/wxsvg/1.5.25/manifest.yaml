# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "wxsvg 消费 wxwidgets-gtk3 需 wx-config 包装：包内 wx-config 硬编码 CI 机路径，以 --prefix/--exec-prefix 重定位；包装须编译为 ELF 二进制（设备会话窗脚本 shebang exec 全线被拒）"
  - "glib 包私有代理 libintl.so 提供 gettext→g_libintl_* 桥，.pc/cpp_info 不传递：消费端补 -L{glib_libdir} -lintl（aris/2.2 同款）"
  - "libffi/pcre2 为 glib 静态传递依赖，AutotoolsDeps 与 .pc 链均不聚合：wx 静态链消费须 LIBS 尾置 -lffi -lpcre2-8"
  - "发布的 ffmpeg .pc Version 写包版本（8.1.2）而非上游的库版本号（62.x）：按库版本语义的 PKG_CHECK_MODULES 必挂，用 LIBAV_CFLAGS/LIBAV_LIBS 旁路"
  - "configure/config.status 的 umask 077 临时目录在 HMDFS 不可写（E533）：补丁改 002；depfiles 引导直接 exec install-sh → --disable-dependency-tracking + make install MKDIR_P=/bin/mkdir -p"
  - "wxsvg 1.5.25 的 AC_INIT 仍写 1.5.24（上游打包笔误）；SONAME libwxsvg.so.3（LIBRARY_VERSION 15:8:12）"
  - "E505：Autotools 配方禁止导出全局 LD_LIBRARY_PATH——会被 clang→lld 子进程继承，lld 自身的 libxml2 被 Conan 版抢占后崩溃，autoconf 报成 C compiler cannot create executables（本地常不复现、CI 必炸）；正确做法是实体化运行视图 + DT_RPATH（--disable-new-dtags）嵌入，产物 rpath 再归一为 $ORIGIN"

