# test_package/MANIFEST.yml — wxsvg 1.5.25
# CI L0e 要求本文件存在；按 TEST_QUALITY_SPEC §4.3 声明上游测试来源。
# 上游 wxsvg 1.5.25 tarball 无 tests/ 目录（src/svgxml、svgview 均无 check
# 目标，`make check` 输出 "Nothing to be done for 'check-am'"），上游
# SourceForge 亦未发布独立测试套件 —— R51 上游测试清点为 0。

package: wxsvg/1.5.25
homepage: "https://wxsvg.sourceforge.net/"

# 上游测试命令（清点结论：无测试目标）
upstream_check_command: "make check  # => Nothing to be done for 'check-am'（无测试目标）"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（tarball 无 tests/、无 check 目标、无 ctest/pytest 注册）
upstream_tests: []

# test_package 中自带的测试（消费者视角，弥补上游零测试）
# 覆盖四条关键路径：SVG 解析（expat）/ DOM 查询 / 离屏渲染（cairo 真实光栅化）
# / 像素级断言（红色矩形与白色背景）
test_package_tests:
  - file: test_package.cpp
    description: "消费者冒烟测试：解析+DOM+离屏渲染+像素断言"
    command: "./test_wxsvg"

# 测试断言总数：9 个 CHECK（Load/根元素/标题/按 id 查询/id 回读/渲染有效/
# 尺寸/矩形像素红色/背景像素白色）
assertion_count: 9
