sources:
  url: "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.10/wxWidgets-3.2.10.tar.bz2"
  sha256: "d66e929569947a4a5920699539089a9bda83a93e5f4917fb313a61f0c344b896"
patches:
  - patch_file: "patches/0001-support-ohos-platform.patch"
    patch_description: "Support OHOS platform in CMake toolkit detection"
    patch_type: "portability"
  - patch_file: "patches/0002-gtk-monitor-geometry-fallback.patch"
    patch_description: "Use real GTK screen geometry when its sole monitor has no geometry"
    patch_type: "portability"
  - patch_file: "patches/0003-gtk-unset-font-resolution.patch"
    patch_description: "Use the default Cairo font scale when GTK screen resolution is unset"
    patch_type: "portability"
  - patch_file: "patches/0004-prefer-builtin-image-codecs.patch"
    patch_description: "Link selected builtin image codecs before GTK dependencies exporting another codec ABI"
    patch_type: "portability"
