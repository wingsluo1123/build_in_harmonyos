software: x-loader
display: "TI OMAP First-Stage Bootloader"
description: "TI OMAP first-stage bootloader (MLO) and its signGP host utility"
category: utility
homepage: "https://github.com/joelagnel/x-loader"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Bare-metal ARM firmware: the upstream Makefile is reused unchanged with clang targeting arm-none-eabi plus the LLVM binutils instead of arm-none-linux-gnueabi-gcc."
    - "signGP, the host-side signing utility, is built natively for HarmonyOS PC (aarch64 + musl) so the signed MLO can be produced on device."
    - "The upstream division helpers are assembled with clang (movsne / no (PLT)) and export the ARM EABI __aeabi_uidiv/__aeabi_idiv entry points clang emits."
    - "No external dependencies; the ARM EABI division helpers come from the patched lib/ files rather than libgcc."
  common_dependencies: []

versions:
  "1.5.1-git20110715-fca7cd2":
    status: built
    build_date: "2026-10-15"
