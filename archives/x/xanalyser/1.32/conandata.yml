# conandata.yml — xanalyser 1.32
# 上游官方发布点：arvin.schnell-web.net/xanalyser（作者 Arvin Schnell 的自建站）。
# 官方站点仅提供明文 HTTP：2026-10-14 实测该域名 443 端点返回的是托管商证书
# （CN=*.kasserver.com，SAN 仅 *.kasserver.com / kasserver.com），与域名不匹配，
# TLS 校验必然失败，不存在可用的 https 端点；站点 /xanalyser/ 索引返回 500，而
# 发布文件 xanalyser-1.32.tar.bz2 返回 200（站点与文件均在线）。未发现提供同一
# 原件（sha256 一致）的 https 镜像。故源 URL 取官方 HTTP 地址——属 R39「官方源」
# （非镜像/非搬运/非网盘），完整性由 sha256 钉住。仓内同类明文官方 http 源先例：
# mgetty/1.2.1、fungw/1.2.2、yell/1.1 等（均以官方站点无 https 端点为由保留）。
# 注意：本文件（含注释）只保留下面 sources.url 一处 URL 字面量。
sources:
  url: "http://arvin.schnell-web.net/xanalyser/xanalyser-1.32.tar.bz2"
  sha256: "8ca3f65bcaad92b1421912311da47e4aa1741a4bb1f422eaf85d75e5996f7946"
  tar_format: tar.bz2
  upstream_version: "1.32"

# 无源码补丁：全部平台修复在 conanfile.py 内完成（configure umask、源码根
