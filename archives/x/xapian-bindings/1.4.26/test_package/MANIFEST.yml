# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xapian-bindings/1.4.26
homepage: "https://xapian.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（xapian-bindings 的 python3 绑定测试）
upstream_tests:
  - file: python3/testsuite.py
    source: xapian-bindings-1.4.26/python3/testsuite.py
    description: "上游 python3 绑定测试套件入口"
    command: "make -C python3 check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xapian_bindings.py
    description: "验证 import xapian、版本号、内存数据库创建/检索"
    command: "python3 test_xapian_bindings.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
