# xapp 3.2.2 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "3.2.2"

software: xapp

# 编译状态
# published | built | failed | archived
# built = 配方 + test_package 就绪，实编与用例执行由权威 CI（同配方同 profile
# ohos-aarch64）复现；结果以 CI 日志（UPSTREAM-TEST-* / L*_RESULT 行）为准。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-10"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（linuxmint/xapp 官方 GitHub tag 3.2.2）
  url: "https://github.com/linuxmint/xapp/archive/refs/tags/3.2.2.tar.gz"

  # 源码校验和
  sha256: "d0ea664053e6f35cc556e060b161905004f03d0695473772d2fb8a37cf445591"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表（全部为上游一等公民 meson 开关，见 meson_options.txt；
  # 3.2.2 的 meson_options.txt 与 2.8.9 逐字节一致，开关集照旧）
  # app-lib-only=true：只建核心库 libxapp.so——绕开 libgnomekbdui（X11/XKB
  #   栈，无 OHOS 配方）、dbusmenu-gtk3（配方目录在树但 ohpcd 未发布）、
  #   gtk3-module/icons/applets/scripts/data/sn-watcher；
  #   仍产出 libxapp.so + xapp.pc + 头文件 + gsettings schema（xed 消费面完整）。
  # introspection/vapi 必须成对关（libxapp/meson.build 有 assert）；
  #   g-ir-scanner 需加载自定义 C 扩展，OHOS 拒绝执行未签名 ELF（E179）。
  configure_options:
    - "-Dapp-lib-only=true"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dstatus-notifier=false"
    - "-Ddocs=false"

  # 编译依赖列表（格式: name/version；与 2.8.9 基线一致——依赖闭包面在
  # 3.2.2 无任何变化。dbus 钉 1.14.10.1：.2 拉 glib/2.88.3 与 gtk 的
  # glib/2.84.0.1 pin 对撞，.0 pin expat/2.8.2 与 fontconfig 传递的
  # expat/2.8.2.1 对撞，.1 是 gtk3 生态对齐变体）
  dependencies:
    - gtk/3.24.43
    - libx11/6.4.0
    - libxkbfile/1.1.3
    - dbus/1.14.10.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-gdk-windowing-x11-guard.patch"
# 0001：xapp-gtk-window.c 未守卫直用 <X11/*.h>/<gdk/gdkx.h>/gdk_x11_*/
# GDK_IS_X11_DISPLAY/XChangeProperty/GDK_WINDOW_XID，而 OHOS 的 gtk/3.24.43
# 为 broadway-only（设备缓存实证：无 gdk/gdkx.h；gdkconfig.h 为
# "#undef GDK_WINDOWING_X11"；libgtk-3.so 的 DT_NEEDED 无 libX11）。
# 用 GTK 自带的 GDK_WINDOWING_X11 窗口系统宏守卫（非平台条件宏），非 X11
# 构建下 WM-hint 入口退化为 no-op，公开 API/ABI 不变。
# 3.2.2：xapp-gtk-window.c 与 2.8.9 逐字节一致，补丁零改动平移（对 3.2.2
# 树 git apply --check 干净适用）。

# ============================================================
# 测试统计（rule4：N=上游源码包 test/tests 目录文件数）
# ============================================================

test_summary:
  upstream_test_files: 0            # 无 tests/ 目录（N 口径；test-scripts/ 为 7 个未接入构建的人工 GUI 演示脚本，不计）
  upstream_registered: 0            # 13 个 meson.build 零 test() 调用
  upstream_runnable: 0              # 无自动化用例可跑（NO_UPSTREAM_TESTS，discovery EVIDENCE_COMPLETE）
  upstream_display_limited: 0
  consumer_assertion_count: 20      # test_package 消费者用例 TAP 断言数
  notes: >-
    上游 3.2.2 无任何自动化测试（全 13 个 meson.build 零 test()、无 tests/
    目录、test-scripts/ 为需真实显示的 7 个人工脚本、.github 唯一 workflow
    委托 linuxmint do-builds.yml 仅 build/codespell、meson_options.txt 无
    测试开关）——按 policy 记录 NO_UPSTREAM_TESTS（discovery
    EVIDENCE_COMPLETE）。鸿蒙特有消费者用例沿用 2.8.9 基线的
    test_package/test_xapp.c（20 项 TAP 断言，全部在权威 CI ohos-aarch64
    真实运行计入统计；逐条对 3.2.2 树复核仍适用）：xapp.pc 元数据闭包（含
    Requires.private:xkbfile 在 pkg-config 0.29.2 严格解析下）、libxapp.so.1
    headless GType 注册（GtkWindow 子类 / favorites / mkenums 枚举经 dlsym）、
    dlopen+g_libintl_bindtextdomain 全局可解析（proxy-libintl 经 libglib 链
    全局可达实证；musl 下 libxapp 自身 gettext 走 libc/glib，--as-needed 后
    自身无 libintl DT_NEEDED）、产物无 libX11 DT_NEEDED（GDK_WINDOWING_X11
    守卫生效）且 NEEDED 闭包落在 conan 图内（gio/glib/gtk）、gsettings
    schema glib-compile-schemas 编译 + memory 后端 set/get 往返（无 dconf、
    无 session bus）。全部断言不开显示连接。3.2.2 唯一库代码变化
    （xapp-gpu-offload-helper.c 内部 GVariant "Discrete" 逻辑）不导出新
    符号、无低成本纯逻辑断言面，不强加断言（见 MANIFEST.yml 记录）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "小版本升级移植的成本判据先行动手再定论：2.8.9→3.2.2 全树 diff 后配方零逻辑改动——root meson.build 仅版本行，libxapp/meson.build、xapp-gtk-window.c、meson_options.txt 逐字节一致，唯一库代码变化是 xapp-gpu-offload-helper.c 内部 GVariant 逻辑（不导出新符号）；依赖 pin 全套（dbus/1.14.10.1 对齐 gtk3 生态）、app-lib-only 开关集、-lintl 绝对路径注入、别名 .pc 两件套全部原样平移"
  - "broadway-only gtk3 的头文件面实证：gtk/3.24.43（OHOS shared）不安装 gdk/gdkx.h，gdkconfig.h 为 '#undef GDK_WINDOWING_X11 / #define GDK_WINDOWING_BROADWAY'，libgtk-3.so DT_NEEDED 无 libX11——下游凡直用 gdkx/Xlib 的代码必须以 #ifdef GDK_WINDOWING_X11 守卫（GTK 自带窗口系统宏，非平台条件宏），Xlib 直调面退化为 no-op 是合法上游语义（is_x11_session 运行时守卫已存在）"
  - "glib>=2.84 proxy-libintl 闭包是 GTK3 生态配方必做项：PkgConfigDeps 重生成的 .pc 丢 -lintl，meson b_lundef 默认开 → 链接 g_libintl_* undefined；追加 glib 包 lib/libintl.so 的绝对路径而非裸 -lintl（裸名落在非 glib .pc 的下游 -L 之后时 lld 报 unable to find library -lintl）"
  - "meson dependency() 按 .pc 文件名解析的两个别名缺口：glib 配方无 gio-unix-2.0 组件、dbus 配方 pkg_config_name 为 dbus（且 dbus-1.pc 需带 session_bus_services_dir 变量，xapp 无 default_value 直接 get_variable）——在消费方 generate() 合成别名 .pc，不改上游配方"
  - "gdbus-codegen/glib-mkenums 宿主工具链四件套：绝对路径钉工具 + conanbuildenv 追加 NINJA/LD_LIBRARY_PATH + 工具自签名 + pc 工具变量注入，缺一即死"
  - "OHOS 消费者断言可零显示验证链接闭包与守卫生效：dlsym(RTLD_DEFAULT, g_libintl_*) 证 -lintl 闭包真被解析（非静默跳过），二进制搜 libX11/libintl DT_NEEDED 串证守卫补丁生效——两步均可进 CI 统计；升级移植时 20 条断言逐条对新城源复核（schema key/枚举生成/gettext 消费面/pc Requires 闭包）后原样平移"
