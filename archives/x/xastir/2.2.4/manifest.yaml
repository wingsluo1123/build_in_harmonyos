# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "umask 077 && mktemp -d 建的目录在 HMDFS 上对任何写入 EACCES——生成 configure 后全量替换 umask 077→022（含内嵌 config.status 模板）" (ref: xastir-2.2.4-ohos-worker-ldflags-prepend-umask0700-xt-displayless)
  - "worker shell 预设 LDFLAGS=-L<worker>/usr/local/lib（含旧 libcurl.so.4/共享 libpcre2-8.so.0），conan 环境组合保留预设在先——配方必须 environment.prepend() 抢占 -L/-I 优先级" (ref: xastir-2.2.4-ohos-worker-ldflags-prepend-umask0700-xt-displayless)
  - "libXt/1.3.1 无显示错误路径在 OHOS 上直接 SIGSEGV（最小 XtOpenDisplay 程序可复现）；headless 消费者测试应断言零 loader 诊断+非零退出，而非等待 'Can't open display'" (ref: xastir-2.2.4-ohos-worker-ldflags-prepend-umask0700-xt-displayless)
  - "本 OHOS conan 的 conandata patches 只认版本键控字典（patches: {\"2.2.4\": [...]}），patch 文件名做键的元数据格式会静默不导出" (ref: xastir-2.2.4-ohos-worker-ldflags-prepend-umask0700-xt-displayless)
  - "remote automake/1.19 recipe 需要 os.version——构建侧必须用与 CI 相同的完整 profile" (ref: xastir-2.2.4-ohos-worker-ldflags-prepend-umask0700-xt-displayless)
  - "能力判据优于平台宏（R8）：线程取消用 AC_CHECK_FUNCS 探测 HAVE_PTHREAD_CANCEL/HAVE_PTHREAD_TESTCANCEL 并守卫调用点（不伪造取消成功）；glibc 专有全局 __progname/__progname_full 用 defined(__GLIBC__) 判据；rindex 用标准 strrchr 等价替换 (ref: xastir-2.2.4-ohos-worker-ldflags-prepend-umask0700-xt-displayless)"
  - "E050 链接视图需同时覆盖链接期（-L 首位）与运行期（LD_LIBRARY_PATH 首位，make check 的测试二进制真实执行）" (ref: xastir-2.2.4-ohos-bootstrap-magick-bdb-zlib-graph)

