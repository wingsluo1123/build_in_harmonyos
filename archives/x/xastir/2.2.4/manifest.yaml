    - shapelib/1.5.0
    - pcre2/10.48
    - libax25/0.0.12-rc5
    - curl/8.15.0
    - cjson/1.7.19
    - berkeley-db/4.8.30
    - zlib/1.3.1.1

  # 编译器
  cc: clang
