# conandata.yml — xcalc 1.1.3
# 源码：X.Org 官方下载站 xorg.freedesktop.org 的两条官方路径（同一官方主机、均为
# 官方原始发布件）。无第三方代理前缀、无本地路径型 URL ⇒ 符合 R39「conandata.yml
# 只写上游官方原始 URL，回退由 CI 自动处理」。
#
# 排序依据（本轮实测，取证见 notes.md「W3 预下载投喂 404 页」一节）：框架
# ci/conan/build_and_test.sh 的预下载步骤对 xorg.freedesktop.org 的 archive/ 与
# releases/ 两个路径段走「镜像优先」重试，而其成功判据只有 size>100B——既不校验
# HTTP 状态码也不校验 sha256 ⇒ archive/ 这一条会被换成一页 162 字节的 404 错误页
# 并被当作下载成功、原地改写本文件。pub/ 不命中那条路径正则 ⇒ 预下载直连官方主机
# 取到 146996 字节的真包。故 pub/ 排第一、archive/ 留作兜底。
# conan 的 tools.files.download() 对 URL 列表按顺序逐条尝试、且逐条校验 sha256，
# 任一条失败只 warn 后落到下一条 ⇒ 列表顺序即正确性来源。
#
# sha256 为对真实 tarball（146996 字节）的实测值，与上游官方发布及 FreeBSD ports
# x11/xcalc distinfo 记录值逐字一致；本排序调整未改动该值。
# ⚠ 本文件注释刻意不写带协议的 URL 串：预下载步骤会连注释一起正则抓取。

sources:
  url:
    - "https://xorg.freedesktop.org/pub/individual/app/xcalc-1.1.3.tar.xz"
    - "https://xorg.freedesktop.org/archive/individual/app/xcalc-1.1.3.tar.xz"
  sha256: "86e157b6174678675a4a912995dccd0ff4e2ce32b01bdd6f91bfe93333324980"

patches:
  # E007 / E205：原生 build=host（铁律 #0 禁止 --build/--host/--target）。
  # 设备 uname -s 返回 HarmonyOS，tarball 自带 config.guess（2024-07-27）不认识
  # 该 OS（且对 Linux|GNU 分支用编译探针写 $TMPDIR，HMFS 上失败）→ configure 报
  # "cannot guess build type"。补丁教 config.guess 把 HarmonyOS/aarch64 判为
  # aarch64-unknown-linux-ohos（tarball 自带 config.sub 2024-05-27 已接受
  # ohos*/linux-ohos*，无需 config.sub 补丁），并把编译探针临时目录
  # umask 077→022（HMFS/E011）。
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS as aarch64-unknown-linux-ohos; relax temp-dir umask (E007/E205/E011)"
    patch_type: "portability"

  # E011 / E114：HMDFS 下 conan 缓存父目录对 getcwd() 不可达，autoconf 2.72
  # 生成的 configure 顶部严格 `pwd` 判定直接 abort；config.status 用
  # `umask 077 && mktemp -d ./confXXXXXX` 创建的临时目录在 HMFS 上不可写。
  - patch_file: "patches/0002-configure.patch"
    patch_description: "configure: PWD fallback when getcwd/pwd is unavailable; HMDFS-safe config.status temp-dir umask (E011/E114)"
    patch_type: "portability"
