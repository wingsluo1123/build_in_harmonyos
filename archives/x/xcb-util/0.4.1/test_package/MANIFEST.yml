package: xcb-util/0.4.1
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxcb-util"

# Upstream ships no standalone test suite in this release tarball.
# The source has no tests/ directory; make check is a no-op.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.c
    description: |
      Link libxcb-util and exercise the atom name helper API:
      xcb_atom_name_unique, xcb_atom_name_by_screen,
      xcb_atom_name_by_resource — all pure string-formatting functions
      that do not require an X server connection.
    command: "test_xcb_util"

assertion_count: 5
