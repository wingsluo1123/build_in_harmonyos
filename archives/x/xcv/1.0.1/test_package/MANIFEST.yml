# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: xcv/1.0.1
homepage: https://github.com/busterc/xcv

# 上游仓库仅含 xcv / README.md / package.json，无任何测试（已清点，见 notes.md）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角：运行已安装的 bin/xcv 完成剪切/复制/粘贴流程）
test_package_tests:
  - file: test_xcv.sh
    description: "T1-T6：shebang 适配(PATH 解析 bash 并直接执行)、参数错误、复制-列出-粘贴(含点文件/子目录/逐字节比对)、剪切-粘贴、暂存区覆盖、临时 HOME 隔离"
    command: "bash test_xcv.sh <installed bin/xcv>"

# 测试断言总数（T1-T6）
assertion_count: 6
