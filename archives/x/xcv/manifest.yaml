# 软件级 manifest
# 文件位置: archives/x/xcv/manifest.yaml

software: xcv
display: "xcv"
description: "用 bash 在命令行完成文件的剪切、复制、粘贴"
category: utility
homepage: "https://github.com/busterc/xcv"
license: ISC

build_system: custom

ohos_adaptation:
  key_points:
    - "单个 bash 脚本，无需编译，直接安装到 bin/"
    - "上游 shebang 为 #!/bin/bash，OHOS 上无此路径，打包时改为 #!/usr/bin/env bash"
    - "运行时依赖 bash/5.3；脚本会清空 $HOME/.xcv，测试必须使用临时 HOME"
  common_dependencies:
    - bash

versions:
  "1.0.1":
    status: published
    build_date: "2026-10-07"
    archive_path: "1.0.1"
