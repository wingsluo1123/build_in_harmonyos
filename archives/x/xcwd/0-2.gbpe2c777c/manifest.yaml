# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS `uname -s` 返回 HarmonyOS：手写 Makefile 里 `UNAME:=$(shell uname)` 的平台闸会落到 `$(error Operating System not supported.)`（本包 Makefile:20）——用 make 变量 UNAME=Linux 选中上游自身 Linux 分支，无需改源码、无需平台宏补丁"
  - "GNU make 命令行变量会覆盖 makefile 内的 `+=`：一旦在命令行传 CFLAGS，上游 `CFLAGS += -DLINUX` 被静默丢弃，必须把 -DLINUX 与上游自带告警/标准标志一并重述，否则会出现「能编能链但功能分支为空」的静默假成功"
  - "OHOS 系统无 libX11（/lib、/usr/lib、/system/lib* 均无同名库），X11 CLI 的 libX11.so.6 只能来自 Conan 依赖；产物不写 RUNPATH（OHOS 加载器拒绝指向 Conan 缓存目录的 RUNPATH），由 conanrun 提供搜索路径"
  - "X11 客户端类任务在 OHOS PC 上无法端到端验证（设备与制品仓均无 Xorg/Xvfb/Xwayland，无 /tmp/.X11-unix）——消费者测试按可观测契约设计（无显示退出码/平台分支字面量/动态段不变量/负向依赖验证），逐项写明未覆盖范围"
  - "上游 install 规则（`install -m 0755 ${EXE} $(prefix)/bin`）不支持 DESTDIR：Makefile 类配方在 package() 直接 copy 产物到 package_folder/bin 更可靠（R20：DESTDIR staging 已废弃）"
