# 软件级 manifest
# 文件位置: archives/x/xd/manifest.yaml

software: xd

display: "Xd"

description: "eXtra smart Directory changer — 把参数当成嵌套目录名的首字母展开成目标目录的 cd 辅助工具"

category: utility

homepage: "https://fbb-git.gitlab.io/xd/"

license: GPL-3.0-or-later

# ============================================================
# 构建信息
# ============================================================

build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游用作者自有的 icmake 构建（./build program -> icmbuild program）；本仓无 icmake 配方，需按 icmconf/CLASSES 复刻 program 模式（顶层 *.cc + 各模块目录 *.cc，链接 -lbobcat）"
    - "bobcat 公共头要求 C++20，配方必须把 profile 的 cppstd 抬到 >= 20"
    - "上游源码树同时含 VERSION（文件）与 version/（目录），不区分大小写的文件系统（macOS APFS）无法解包，只有 Linux/HarmonyOS 可构建"
    - "OHOS 对 TIOCSTI 有安全限制，--input 模式 ioctl 可能返回 -1；不依赖 --input 的常规用法可正常工作"
  common_dependencies:
    - bobcat

# ============================================================
# 版本索引
# ============================================================

versions:
  "5.00.03":
    status: built
    build_date: "2026-10-12"
    conan_ref: "xd/5.00.03"
