# test_package/MANIFEST.yml — xdffileio 0.3
# Upstream and consumer test declaration required by CI L0e.

package: xdffileio/0.3
homepage: "https://github.com/mmlabs-mindmaze/xdffileio"

upstream_tests_exist: true
upstream_test_total: 6
upstream_test_count_method: "autotools_tests"
upstream_test_audit:
  - path: "tests/Makefile.am (TESTS)"
    finding: "TESTS = testbdf testedf testgdf1 testgdf2 readcheck unconditionally (5); errorcheck appended under RUN_ERROR_TEST"
  - path: "configure.ac (AC_CHECK_FUNC setrlimit / AM_CONDITIONAL RUN_ERROR_TEST)"
    finding: "run_error_test=true when setrlimit exists; OHOS musl provides setrlimit, so errorcheck registers and the suite totals 6 automake TESTS"
  - path: "xdffileio_0.3.orig.tar.bz2 (Debian orig tarball)"
    finding: "Ships generated configure + Makefile.in + gnulib libgnu; reference fixtures tests/ref128-13-97-50-11-7-1.{bdf,edf,gdf1,gdf2} are part of EXTRA_DIST and must be non-empty at build time"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (6 automake TESTS, tests/test-suite.log口径)"

upstream_tests:
  - file: tests/testbdf.c
    source: "xdffileio_0.3/tests/testbdf.c (+ copy_xdf/filecmp/validation helpers)"
    description: "BDF write/read round-trip against ref128 BDF fixture"
    command: "make check"
  - file: tests/testedf.c
    source: "xdffileio_0.3/tests/testedf.c (+ copy_xdf/filecmp/validation helpers)"
    description: "EDF write/read round-trip against ref128 EDF fixture"
    command: "make check"
  - file: tests/testgdf1.c
    source: "xdffileio_0.3/tests/testgdf1.c (+ copy_xdf/filecmp/validation helpers)"
    description: "GDF 1.x write/read round-trip against ref128 GDF1 fixture"
    command: "make check"
  - file: tests/testgdf2.c
    source: "xdffileio_0.3/tests/testgdf2.c (+ copy_xdf/filecmp/validation helpers)"
    description: "GDF 2.x write/read round-trip against ref128 GDF2 fixture"
    command: "make check"
  - file: tests/readcheck.c
    source: "xdffileio_0.3/tests/readcheck.c"
    description: "Read-path checks over the reference files"
    command: "make check"
  - file: tests/errorcheck.c
    source: "xdffileio_0.3/tests/errorcheck.c"
    description: "Error-path checks (rlimit-gated; registered when setrlimit exists)"
    command: "make check"

test_package_tests:
  - file: test_xdffileio_api.c
    description: "Consumer BDF round-trip via public xdfio.h (open/set_conf/add_channel/define_arrays/prepare_transfer/write/close/reopen/get_conf NCHANNEL, 15 CHECKs)"
    command: "./test_xdffileio_api"
    assertions: 15
  - file: test_xdffileio_ohos.c
    description: "HarmonyOS-specific: enum contract + writable TMPDIR EDF round-trip, 6 CHECKs"
    command: "./test_xdffileio_ohos"
    assertions: 6

assertion_count: 21
