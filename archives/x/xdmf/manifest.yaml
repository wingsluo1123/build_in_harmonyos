software: xdmf
display: "xdmf"
description: "eXtensible Data Model and Format (XDMF) scientific data-model library"
category: science
homepage: "http://www.xdmf.org"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake build with OHOS toolchain (CMAKE_SYSTEM_NAME=OHOS, aarch64)"
    - "Git snapshot source pinned to upstream commit 8d9c9808"
    - "Boost/HDF5/LibXml2 from Conan; TIFF/MPI/DSM disabled for deterministic tests"
    - "Upstream ctest suite enabled via XDMF_BUILD_TESTING=ON"
  common_dependencies:
    - "boost/1.90.0"
    - "hdf5/1.14.6"
    - "libxml2/2.15.3.1"

versions:
  "3.0-git20190531":
    status: built
    build_date: "2026-10-12"
