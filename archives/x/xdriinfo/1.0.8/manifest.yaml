build:
  system: autotools
  configure_options:
    - "native build=host; no --build/--host/--target (iron rule #0)"
    - "PKG_CONFIG_PATH=<conan dependency lib/pkgconfig + share/pkgconfig dirs> (resolves PKG_CHECK_MODULES(XDRIINFO, x11 glproto))"
    - "XDRIINFO_LIBS / GL link flags come from AutotoolsDeps (mesa libdir + -lGL); configure's AC_SEARCH_LIBS([glXGetProcAddressARB], [GL]) resolves against mesa's libGL.so"
  dependencies:
    - "libx11/6.4.0"
    - "glproto/1.4.17"
    - "mesa/24.3.4.1.1.1 (libGL.so.1 + GL/glx.h + gl.pc)"
    - "llvm/20.1.0 (run; mesa libGL -> libgallium -> DT_NEEDED libLLVM.so.20.1)"
  cc: clang
  cxx: ""

patches_applied:
  - file: "patches/0001-config.guess.patch"
    type: portability
    platform_only: true
    targets: ["config.guess"]
    description: >-
      The bundled config.guess (timestamp 2024-07-27) does not recognise
      HarmonyOS: `uname -s` returns HarmonyOS, config.guess exits 1 with
      "unable to guess system type", and ./configure then aborts with
      "cannot guess build type; you must specify one". The patch adds a
      `*:HarmonyOS:*:*` branch that emits ${MACHINE}-unknown-linux-ohos so the
      build works without --build/--host/--target (iron rule #0). config.sub
      already accepts linux-ohos (verified), so no config.sub change is needed.
      The patch adds no __OHOS__ preprocessor token (shell script change).
  - file: "patches/0002-configure.patch"
    type: portability
    platform_only: true
    targets: ["configure"]
    description: >-
      Relax the autoconf secure temporary directory mode from umask 077 to
      umask 007 (two occurrences). HMDFS maps ownership so the creating
      process is not the directory owner, hence a 0700 directory is evaluated
      against the group permission bits and writing confXXXXXX/subs1.awk
      fails with EACCES, aborting configure with "config.status: error: could
      not setup config files machinery". umask 007 keeps group rwx and leaves
      glibc/tmp behaviour unchanged on hosts with matching uids (E114 /
      DRAFT-10863). The `umask 077` in Makefile.in:782 sits in the distdir
      rule, which is not on the build path, and is intentionally left alone.

