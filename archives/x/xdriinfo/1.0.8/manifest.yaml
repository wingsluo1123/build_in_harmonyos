knowledge_gained:
  - >-
    A DRI/GLX query tool cannot be satisfied by libglvnd as this registry
    publishes it: libglvnd/1.7.0 builds with x11+glx disabled, so it has no
    libGL.so, no libGLX.so, no gl.pc and no GL/glx.h, and configure's
    AC_SEARCH_LIBS([glXGetProcAddressARB], [GL]) fails. mesa is the provider
    that actually exports the DRI entry points; verify a GL "provider" by
    inspecting the published binary's exported symbols, not by name.
  - >-
    mesa's binary package records its LLVM libdir in a mesa_llvm_lib_dir marker
    that points at the builder's conan home (.cache/conan2/...), so a consumer
    whose conan home differs cannot resolve libgallium's DT_NEEDED
    libLLVM.so.20.1 through mesa's own runenv hint, and the OHOS SDK only ships
    libLLVM-15. Declaring llvm/20.1.0 as a runtime requirement of the consumer
    is the working arrangement.
  - >-
    config.guess on HarmonyOS exits 1 (uname -s = HarmonyOS), which turns into
    configure's "cannot guess build type; you must specify one". Adding a
    `*:HarmonyOS:*:*` branch keeps the build free of --build/--host/--target
    (iron rule #0); a shell-script patch carries no __OHOS__ token so it does
    not collide with the PF5 gate.
  - >-
    xdriinfo resolves glXGetScreenDriver/glXGetDriverConfig before parsing
    argv, so any consumer test that wants to exercise `--version`/`-help` needs
    a GL provider whose glXGetProcAddressARB returns those two entry points
    without a display; mesa's does, gl4es's does not (measured with a probe).

