# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# xdu 3.0 上游无自动化测试（Imakefile 仅 ComplexProgramTarget/InstallAppDefaults
# 目标，无 check/TESTS；源码树无 tests/ 目录；xdu.man 无测试章节），
# test_package 以真实执行被测二进制（R34）的行为验证代替。

package: xdu/3.0
homepage: "https://github.com/vlasovskikh/xdu"

# 上游测试命令（Imakefile 无 check 目标，此项仅记录审计结论）
upstream_check_command: "make check (no check target in Imakefile)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，真实执行被测二进制)
test_package_tests:
  - file: test_xdu.sh
    description: |
      R34 实质依赖被测包：执行 xdu 二进制验证动态链接链完整。
      无 DISPLAY 环境下 xdu -help/无参数走 XtAppInitialize 报
      "Can't open display" 干净退出（exit=1），证明 libXaw7/libXt/
      libXext/libX11 完整加载（缺库时 loader 报 "Error loading
      shared library" + exit 127，测试脚本据此区分）。
    command: "sh test_xdu.sh <bin>/xdu <preload>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3

# 上游测试审计结论
upstream_test_audit:
  status: "no_tests"
  framework: "none"
  reason: >
    xdu 3.0 (X11R6 contrib, 1994) 发布包无自动化测试：Imakefile 仅有
    ComplexProgramTarget(xdu)/InstallAppDefaults(XDu) 目标，无
    check/TESTS 目标；源码树无 tests/ 目录；xdu.man 无测试章节。
