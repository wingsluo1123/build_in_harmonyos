version: "0.99997"
status: built
build_date: "2026-07-09"

source:
  url: "https://codeload.github.com/TeX-Live/xetex/tar.gz/refs/tags/xetex-0.99997"
  sha256: "4d11b4e612ab25b9a8cda172efd42abe519635de7c276c7442c2574f8a416a08"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--enable-build-in-source-tree"
    - "--disable-all-pkgs"
    - "--disable-shared"
    - "--enable-xetex"
    - "--without-x"
    - "--with-system-freetype2"
    - "--with-system-zlib"
    - "--with-system-icu"
  dependencies:
    - freetype/2.14.3
    - zlib/1.3.1.1
    - fontconfig/2.16.0
    - expat/2.8.2

patches_applied: []

knowledge_gained:
  - "HMDFS 不支持 umask 077 创建的目录写入，需全局替换为 umask 022"
  - "HMDFS getcwd 在 ../../ 路径下失败，子目录构建需预配置"
  - "XeTeX 依赖 fontconfig/harfbuzz/graphite2/ICU/libpng/teckit/poppler"
  - "harfbuzz 可直接编译源文件（绕过 autotools）"
  - "graphite2 用 cmake 构建（改 SHARED 为 STATIC）"
  - "fontconfig 用 meson 构建（绕过 autotools gettext 依赖）"
