knowledge_gained:
- "xeus 5.0.0 为 CMake/C++17 纯 Jupyter 内核协议库，OHOS 上 CMAKE_SYSTEM_NAME 需归一化为 Linux（CMake 无 HarmonyOS 平台模块）"
