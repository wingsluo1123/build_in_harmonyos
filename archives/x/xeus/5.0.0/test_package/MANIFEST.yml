# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: xeus/5.0.0
homepage: "https://github.com/jupyter-xeus/xeus"

# 上游测试命令（ctest -N 已在本任务实际运行）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 51 个独立 TEST_CASE 已由 Task5 单独枚举、构建并全部运行通过
# （见 reports/test-ledger.md），配方构建不重复编译上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（5 个可执行体，均由 test/CMakeLists.txt add_test 注册）
upstream_tests:
  - file: test/test_xbasic_fixed_string.cpp
    source: xeus-5.0.0/test/test_xbasic_fixed_string.cpp
    description: "xbasic_fixed_string 行为用例（36 个 TEST_CASE）"
    command: "./test_xbasic_fixed_string"
  - file: test/test_xhash.cpp
    source: xeus-5.0.0/test/test_xhash.cpp
    description: "哈希函数用例（2 个 TEST_CASE）"
    command: "./test_xhash"
  - file: test/test_xin_memory_history_manager.cpp
    source: xeus-5.0.0/test/test_xin_memory_history_manager.cpp
    description: "内存历史管理器用例（3 个 TEST_CASE）"
    command: "./test_xin_memory_history_manager"
  - file: test/test_xsystem.cpp
    source: xeus-5.0.0/test/test_xsystem.cpp
    description: "系统接口用例（2 个 TEST_CASE）"
    command: "./test_xsystem"
  - file: test/test_unit_kernel.cpp
    source: xeus-5.0.0/test/test_unit_kernel.cpp
    description: "单元内核用例（8 个 TEST_CASE）"
    command: "./test_unit_kernel"

# test_package 中自带的测试（消费者视角验证 + HarmonyOS 专项）
test_package_tests:
  - file: test_consumer.cpp
    description: "消费者验证：xeus 公开 API（reply JSON/GUID/系统路径/fixed_string）"
  - file: test_ohos_special.cpp
    description: "HarmonyOS 专项测试：OHOS 运行时 PID/临时目录/目录创建/GUID 熵源"