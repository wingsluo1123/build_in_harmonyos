# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xf86-video-savage/2.4.1
homepage: "https://gitlab.freedesktop.org/xorg/driver/xf86-video-savage"

# 上游测试命令 (X.Org driver 无自测套件)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (X.Org driver 无自测)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "dlopen加载savage_drv.so并验证savageModuleData符号"
    command: "./test_savage_drv"

# 测试断言总数
assertion_count: 3
