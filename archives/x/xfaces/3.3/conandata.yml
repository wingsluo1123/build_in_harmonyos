  # xfaces 3.3 上游原始 tarball（.orig.tar.gz 为未修改的上游原包，非 Debian
  # 重打包/dfsg 改写，仅归档托管在 snapshot.debian.org——上游 1994 年发布后
  # 无官方站点存续，ftp.x.org/ibiblio/funet 等 historic 镜像逐一实测 404）。
  url: "https://snapshot.debian.org/archive/debian/20050312T000000Z/pool/main/x/xfaces/xfaces_3.3.orig.tar.gz"
  sha256: "f991f4e3078bcad14c82db6f5af6b5b725eddc31e748a8c5b99225a9859265ff"

# 无补丁：构建逻辑完全由 conanfile.py 内手写编译命令承载
# （上游仅提供 imake 生成的 Makefile 与 Makefile.noimake，均绑定
# /usr/X11R5 前缀与 netaudio，OHOS 上不可直接使用，详见 notes.md）。
