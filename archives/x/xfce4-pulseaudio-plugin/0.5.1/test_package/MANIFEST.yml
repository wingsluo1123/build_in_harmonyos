# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xfce4-pulseaudio-plugin/0.5.1
homepage: "https://gitlab.xfce.org/panel-plugins/xfce4-pulseaudio-plugin"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# xfce4-pulseaudio-plugin is a panel plugin with no automated test suite
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证插件 .so 为有效 ELF 且可通过 dlopen 加载，检查 xfce_panel_module_init 符号"
    command: "./test_xfce4-pulseaudio-plugin <so_path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
