version: "1.1.2"
software: "xfontsel"

# 编译状态: published | built | failed | archived
# PR 阶段尚未由 release 流水线 upload 到制品仓，真实状态为 built
status: built

build_date: "2026-10-16"
build_system: autotools

# 源码信息
source:
  url: "https://www.x.org/releases/individual/app/xfontsel-1.1.2.tar.xz"
  sha256: "78ff018757c7b22137cf5d3526ef5e9388bc0cdead1f00daf2c898e2e274553f"
  tar_format: tar.xz

# 构建配置
build:
  system: autotools
  # 原生 build=host（铁律 #0：不使用 --build/--host/--target）。
  # config.guess 经补丁 0001 识别 HarmonyOS → aarch64-unknown-linux-ohos，
  # configure 以原生方式判定 build==host。
  configure_options:
    - "--with-appdefaultdir=/share/X11/app-defaults"
  dependencies:
    - "libx11/1.8.13"
    - "libxext/6.4.0.1"
    - "libxt/1.3.1"
    - "libxmu/1.3.1.1"
    - "libxaw/1.0.14"
    - "xorgproto/2025.1"
    - "libxcb/1.17.0 (run)"
    - "libxau/1.0.11 (run)"
    - "libxdmcp/1.1.5 (run)"
  cc: clang
  cxx: ""

# 补丁信息
patches_applied:
  - "patches/0001-config.guess.patch: config.guess 识别 HarmonyOS/aarch64 → aarch64-unknown-linux-ohos（原生 build=host，铁律 #0；tarball 自带 config.sub 已接受 linux-ohos），并把编译探针临时目录 umask 077→022（E007/E205/E011）"
  - "patches/0002-configure.patch: autoconf 2.73 生成的 configure 在 HMDFS 下 getcwd/pwd 不可用时报 'working directory cannot be determined'——加 $PWD 回退；config.status 的 ./confXXXXXX 临时目录 umask 077→022（E011/E114）"

# 知识沉淀
knowledge_gained:
  - "X.Org 小 X 客户端（autotools，xaw7/xmu/xt/x11/xproto）可直接用 ohpcd 已发布的 libxaw/1.0.14 + libxmu/1.3.1.1 + libxt/1.3.1 + libxext/6.4.0.1 + libx11/1.8.13 + xorgproto/2025.1 作依赖，无需像早期 xeyes 那样在配方内 vendored 构建 X11 库"
  - "PkgConfigDeps 生成的 .pc 名取自 Conan 的 pkg_config_name：libxmu 的 Xmu 组件发布名为 'libxmu'、xorgproto 无 pkg_config_name；消费端需 set_property 重命名为 xmu / xproto（libxaw/1.0.14 generate() 同款）"
  - "xfontsel main() 在 XtAppInitialize 之前处理 -help/-version（单双横线均接受），无 X server 即可无头验证（-version 打印 PACKAGE_STRING 'xfontsel 1.1.2'，-help 打印 usage）；无 DISPLAY 时 XtAppInitialize 干净失败退出非零"
  - "上游无测试套件：Makefile.am 无 TESTS/check_PROGRAMS/check-local、meson.build 无 test()、发布包无 tests/ 目录；构建仍显式跑 make check（0 用例）"
  - "原生 build=host 下 tarball 自带 config.guess（2024-07-27）不识别 uname -s HarmonyOS，且用编译探针写 $TMPDIR（HMFS 上失败）——须补丁教它输出 aarch64-unknown-linux-ohos；tarball 自带 config.sub（2024-05-27）已含 ohos*/linux-ohos*，无需 config.sub 补丁"

