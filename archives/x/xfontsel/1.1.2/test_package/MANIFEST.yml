# Upstream test inventory and consumer test declaration for xfontsel 1.1.2.

package: xfontsel/1.1.2
homepage: "https://gitlab.freedesktop.org/xorg/app/xfontsel"

upstream_tests_exist: false
upstream_test_audit:
  - source: "Official X.Org xfontsel-1.1.2.tar.xz archive"
    reason: "File inventory contains no tests/ or test/ directory and no upstream test source files; only COPYING, ChangeLog, INSTALL, README.md, ULabel.*, xfontsel.c, the man page and build autotools files."
  - source: "Makefile.am"
    reason: "Declares SUBDIRS=man, bin_PROGRAMS=xfontsel, the app-defaults data file and EXTRA_DIST; it has no TESTS, check_PROGRAMS or check-local declaration, so the Automake `make check` target registers zero tests."
  - source: "man/Makefile.am"
    reason: "Only installs the man page; no test targets."
  - source: "meson.build"
    reason: "Defines the executable, config header, app-defaults install and man page custom_target only; it contains no test() or test_suite() call."
  - source: "configure.ac"
    reason: "Contains AC_INIT, XORG_DEFAULT_OPTIONS, PKG_CHECK_MODULES and gettext/locale checks only; it declares no test suite or AC_CONFIG_TESTDIR."
  - conclusion: "The upstream 1.1.2 release ships no automated test suite. The build runs `make check` (0 registered cases); test_package separately exercises the installed executable."

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (0 registered tests)"
upstream_tests: []

test_package_tests:
  - file: test_xfontsel.py
    description: "Executes the installed xfontsel binary directly (subprocess execve) over its no-server paths: -version and --version (PACKAGE_STRING 'xfontsel 1.1.2', rc 0), -help and --help (usage text 'where options include:', rc 0), and a no-display launch with DISPLAY unset (XtAppInitialize must report a display failure and exit non-zero without hanging)."
    command: "python test_xfontsel.py <installed-bin/xfontsel> <runtime-LD_PRELOAD>"
    assertions: 5

assertion_count: 5
