# test_package/MANIFEST.yml — CI L0e upstream/consumer test declaration.
package: xfractint/20.4.10
homepage: "http://www.fractint.org/"

# 上游没有注册的自动化测试。三个 Makefile 均无 test/check 目标，源码树无
# tests/ 目录，也无 CI 配置；唯一的构建期程序 ./hc 是帮助文件编译器，
# 不是测试。详细清点见 notes.md 与 NO_UPSTREAM_TESTS 申报。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_count: 0
upstream_test_pass_count: 0
upstream_test_status: "no_tests"
upstream_test_reason: "官方源码无 tests/ 目录，三个 Makefile（顶层/common/unix）无 test/check 目标，无 CI 配置；./hc 是构建工具不是测试。"
upstream_tests: []

# test_package 消费者测试：真实执行 OHOS aarch64 xfractint（无显示冒烟）。
test_package_tests:
  - file: test_xfractint.sh
    description: "校验包内 xfractint：aarch64 ELF、PIE、NEEDED libX11，且无 DISPLAY 时以 exit 255 打印 'Could not open display' 优雅退出。"
    command: "bash test_xfractint.sh"

# 断言项：binary 存在、aarch64 ELF、libX11 NEEDED、PIE、无显示优雅退出。
assertion_count: 5
