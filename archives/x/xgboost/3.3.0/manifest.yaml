# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.3.0"

# 软件名
software: xgboost

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-17"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/dmlc/xgboost/releases/download/v3.3.0/xgboost-src-3.3.0.tar.gz"

  # 源码校验和
  sha256: "50ae0f5cffa4b0479faecd7d062d4a4b28006a9f35470ec31c9694a747747466"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DUSE_OPENMP=ON"
    - "-DUSE_CUDA=OFF"
    - "-DBUILD_STATIC_LIB=ON"
    - "-DJVM_BINDINGS=OFF"
    - "-DR_LIB=OFF"
    - "-DGOOGLE_TEST=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 不识别 HarmonyOS，需设置 CMAKE_SYSTEM_NAME=Linux 解决 E092"
  - "xgboost 内置 dmlc-core 子模块，无需额外依赖"
  - "需禁用 CUDA/JVM/R 绑定以适配 OHOS 环境"
  - "使用 BUILD_STATIC_LIB=ON 生成静态库"
