# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: xgboost/3.3.0
homepage: "https://github.com/dmlc/xgboost"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 xgboost 库可被链接和调用"
    command: "./test_xgboost"

# 测试断言总数
assertion_count: 1
