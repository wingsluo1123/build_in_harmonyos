sources:
  "2.6.1-dfsg.2":
    url:
      - "https://deb.debian.org/debian/pool/main/x/xgks/xgks_2.6.1+dfsg.2.orig.tar.gz"
      - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/x/xgks/xgks_2.6.1+dfsg.2.orig.tar.gz"
    sha256: "451dd35080fd3e2fc1f5ed83b8b86e29c5ad0af2adf4c4d08ff13643ece641ab"
patches:
  - patch_file: "patches/0001-xcolours-xcmap-pointer.patch"
    patch_description: "Fix XcMap pointer passing in XcInit (&ws->XcMap) and GKSindexes OOB write; Debian xcolours.patch port"
    patch_type: "bugfix"
  - patch_file: "patches/0002-xopws-visual-cast.patch"
    patch_description: "Cast &wk->vinfo to Visual* for XCreateWindow under clang -Wincompatible-pointer-types; Debian gcc-14.patch xopws hunk port"
    patch_type: "portability"
  - patch_file: "patches/0003-input-void-return.patch"
    patch_description: "Declare bare-return K&R input handlers void (XgksIProcessXEvent/XgksIDevDisable/XgksIDevEnable) and static DisCount int; fixes clang -Wreturn-type hard errors"
    patch_type: "portability"
