software: xgks
name: XGKS Graphical Kernel System
description: ANSI GKS level 2C implementation for the X Window System (C library)
category: gfx
license: IBM-permissive
website: http://xgks.sourceforge.net/

build_system: autotools

ohos_adaptation:
  key_points:
    - "只构建 C 子集（lib/c + port/misc + fontdb），跳过 Fortran 绑定/演示/troff 文档"
    - "package() 显式拷贝产物，不调用无 DESTDIR 支持的 make install"
    - "上游无自动化测试，消费者以 MO 文件工作站做无显示验证"
  common_dependencies:
    - libx11

versions:
  - version: "2.6.1-dfsg.2"
    status: built
    build_date: 2026-10-14
