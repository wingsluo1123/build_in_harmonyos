knowledge_gained:
  - "CMakeDeps traits 剥离：包 package_type=shared-library 时，conan transform_downstream 对其传递依赖向下游消费者硬编码 headers=False/libs=False，CMakeDeps 据此清空传递依赖的 INCLUDE_DIRS/LIBS —— shared 包公共头若 include 传递依赖头（xir attrs.hpp → UniLog.hpp），消费者编译必挂；修复为在自身 cpp_info 显式 append 依赖绝对 includedirs（unilog 'EA header-only draft' 同款先例）"
  - "glog 0.7 消费方必须显式声明 GLOG_USE_GLOG_EXPORT，否则 <glog/logging.h> was not included correctly 直接 #error；经公共头链引入 glog 的包需在 cpp_info.defines 传播该宏"
  - "bare cmake 经 CMakeDeps imported target 链接依赖时 lld 将绝对路径写进 DT_NEEDED（conan 缓存路径，CI 不可复现，L5b SONAME gate 拦截）；conan 缓存构建树目录不可写（patchelf open: Operation not permitted），须在 package() 安装后用 patchelf --replace-needed 重写为 basename 再签名"
  - "xir 内置 op 表要求 conv2d weights 为 4 维 NCHW（shape_inference.cpp 校验，2 维直接 UNILOG FATAL XIR_INVALID_ARG_OCCUR）；上游测试代码与内置 op 表漂移（pad_mode int→string、concat axis 缺省），R51 上游测试须注入 attrs helpers 对齐"
  - "上游 11 个测试 main 无 add_test 注册，直接执行 .bin；test_subgraph_topo 依赖外部 graphviz dot（OHOS 无），no-op dot shim 使 save_to_dot 断言真实执行、渲染输出披露为空文件（CI L1d fake-test 正则按行匹配 self.run 与 echo/print/true 同行，注释中同现也会误判，配方注释需规避）"
  - "HMDFS 下 python glob 的 recursive '**' 不够可靠（构建树深层匹配失败），ELF 扫描用 os.walk；conan 缓存 .conan2/p/b 目录文件 patchelf 写入报 Operation not permitted，包目录 p/ 可写"

