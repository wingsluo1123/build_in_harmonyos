# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xlax/2.4
homepage: "https://hea-www.harvard.edu/~fine/Tech/xlax.html"

# 上游没有自动化测试：release tarball 内没有 tests 目录、没有 check 目标、
# 没有任何测试程序（取证见 reports/test-report.md §2）。
upstream_tests_exist: false
upstream_test_audit:
  - source: "xlax2.4.tar.gz（上游作者发布包，sha256 aae92537…9ad2dc）文件清单"
    reason: "只有 Imakefile / LICENSE / README / TODO / dot-mkxlax / mkxlax / mkxlax.man / vroot.h / xlax.c / xlax.h / xlax.man 共 11 个文件；`find . -iname '*test*' -o -iname '*check*'` 返回空。"
  - source: "Imakefile 全文"
    reason: "只有 DEPLIBS/LOCAL_LIBRARIES/SRCS/OBJS 与 `ComplexProgramTarget(xlax)`；`grep -Ei 'test|check' Imakefile` 无匹配，即没有 check target、没有 TESTS 变量。"
  - source: "README（1992 年作者说明）"
    reason: "安装说明只有 `xmkmf` / `make` / `make install` 与 `mkxlax` 启动多窗口的手工步骤，没有测试章节。"
  - source: "Debian 打包（xlax 2.4-3）"
    reason: "debian/ 下无 tests/ 目录，debian/rules 只有 dh $@，补丁集仅 typos/use-libbsd/fix-warnings/protos 四个可移植性补丁，未引入任何测试。"
  - conclusion: "上游测试数 N = 0；适配后新增的鸿蒙消费者用例（test_package）单独计数，不冒充上游覆盖。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试（消费者视角；HarmonyOS PC 无 X server，故驱动无头路径）
test_package_tests:
  - file: test_xlax.sh
    description: "包内容存在性：bin/xlax 可执行，share/man/man1/xlax.1 与 mkxlax.1 安装，share/xlax/{mkxlax,dot-mkxlax} 作为数据安装。"
    command: "test_xlax.sh <package>/bin/xlax <package>"
  - file: test_xlax.sh
    description: "上游 CLI 合约：--version 退出码 0 且首行精确等于 'xlax 2.4'。"
    command: "xlax --version"
  - file: test_xlax.sh
    description: "新增无头自检 --selftest：12 项程序化检查必须全绿并打印 'selftest: 12/12 checks passed'（libXt 初始化/分配器、libXaw 7 个 Athena widget class 记录、libXmu XmuClientWindow、libX11 版本头）。"
    command: "xlax --selftest"
  - file: test_xlax.sh
    description: "libXaw 符号可解析：--selftest 输出中出现 'libXaw exports the asciiText widget class record'，证明 7 个 widget class 记录在运行期真的读到了。"
    command: "xlax --selftest"
  - file: test_xlax.sh
    description: "无显示错误路径：DISPLAY= 时 GUI 启动必须以非 0 退出并给出 Xt 的 display 诊断（证明打包二进制确实加载并初始化了整条 X11 栈）。"
    command: "DISPLAY= xlax -find"
  - file: test_xlax.sh
    description: "鸿蒙 ELF 事实：ELF64/AArch64、DT_NEEDED 含 libXaw.so.7/libXmu.so.6/libXt.so.6/libX11.so.6、且不链接 libbsd（OHOS libc 自带 strlcpy）。"
    command: "readelf -h <package>/bin/xlax ; readelf -d <package>/bin/xlax"

test_scenario_count: 6
assertion_count: 23
assertion_count_basis:
  shell_harness: 11
  selftest_internal_checks: 12
  notes: >-
    Shell 台账 11 条断言（4 条包内容存在性、1 条 --version、1 条 --selftest 汇总、
    1 条 libXaw 符号解析、1 条无显示错误路径、3 条 ELF 事实），加上
    `xlax --selftest` 自身打印的 12 条程序化检查，合计 23。实测输出
    `[test] 11 passed, 0 failed` 与 `selftest: 12/12 checks passed`。
