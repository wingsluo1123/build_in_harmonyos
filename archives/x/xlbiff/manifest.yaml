# 版本级 manifest — xlbiff（软件级）
# 遵循 ARCHIVE-SPEC v2.0

software: xlbiff
display: "xlbiff"
description: "X11 Athena 组件邮箱摘要弹窗工具（带图形界面的 biff）：监视邮件 spool 文件，有新邮件时弹出窗口显示 from/subject 摘要"
category: utility
homepage: "https://github.com/edsantiago/xlbiff"
license: MIT

# 构建信息
build_system: autotools
languages:
  - C
  - Python（mailbox-preview 辅助脚本）

versions:
  - "4.6.11"

notes: |
  xlbiff 是经典 X11 biff 工具的现代维护版（edsantiago/xlbiff），
  依赖 libX11/Xt/Xaw/Xmu/Xrandr。纯 X11 客户端，无平台强绑定。
  另附 mailbox-preview（Python 脚本）辅助工具，声明于 commands.json。
