knowledge_gained:
  - "Upstream offers --without-x which downgrades GRAPHSYS to GNUPLOT: a pure terminal build with no X11/ncurses dependency; the X11/Athena build would need libxaw/libxmu/libxt (not yet packaged here)."
  - "Upstream GitHub mirror (jhbadger/xlispstat) has no tags; the canonical reproducible source is the uiowa release tarball (URL/SHA256 cross-checked against the Homebrew formula)."
  - "Upstream recursive Makefiles hardcode CFLAGS from UCFLAGS; pass UCFLAGS on the configure command line to inject toolchain flags."
  - "The build and install are three separate top-level targets (xlisp, xlisp.wks, xlispstat); splitting them lets the interpreter be signed before the .lsp compilation runs on OHOS."
  - "setup.shell-generated xlispstat wrapper bakes XLISPLIB=${prefix}/lib/xlispstat; a one-line patch makes it honor an inherited XLISPLIB so package_info runenv keeps the package relocatable."
  - "Bundled config.guess is 2002-03-20 echo/exit style and rejects both HarmonyOS uname and aarch64->ohos triples (its config.sub rejects aarch64 entirely); emitting <machine>-unknown-linux-gnu from a HarmonyOS branch passes the vintage config.sub unchanged (E007)."
  - "With GCC=yes (clang defines __GNUC__) the *linux* configure branch appends -export-dynamic to ULDFLAGS; override via make command-line ULDFLAGS=\"-Wl,--export-dynamic\" instead of patching generated configure."
  - "HEADLESS: with --without-x the dummygraph C stubs make (require graphics) -> graph2.lsp (send spin-proto :depth-cuing t) a deterministic SIGSEGV; replace with the upstream nongraph.lsp gnuplot layer and drop the same require from regress.lsp."
  - "HMDFS refuses script execution via shebang (bad interpreter), while signed ELF exec works: the consumer test drives the signed interpreter directly; the sh wrapper is shipped for interactive shells that permit script exec."
  - "OHOS device stack default (8MB) is insufficient for xlisp GC mark recursion on large workspaces; raise ulimit -s in build steps, the installed wrapper, and the consumer test harness."
  - "Build with -O1 -fno-strict-aliasing: -O2/-O3 corrupt the old GC (optimization-sensitive UB); verified by device-side rebuild comparison."
  - "Device profile differences matter: 134/51 style profiles need the -fixed variant (os.version + K&R-tolerant cflags); conan may be a native ELF launcher (never python3 it)."

knowledge_contribution:
  type: "preflight_draft"
  draft: "none yet; promote after first successful device shadow CI"
