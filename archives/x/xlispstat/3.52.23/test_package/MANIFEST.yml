# test_package/MANIFEST.yml
# Upstream and consumer test declaration for xlispstat 3.52.23.

package: xlispstat/3.52.23
homepage: "https://homepage.stat.uiowa.edu/~luke/xls/xlsinfo/"

upstream_check_command: "no make check upstream; see tests/README: run xlisp and load tests/test"
upstream_test_in_build: true
upstream_test_command: "./xlisp xls-test-runner.lsp (recipe-owned runner replicating tests/test.lsp; echoes per-file check counts)"

upstream_tests:
  - file: tests/test.lsp (+ arith/complex/manip/matrix/matrix2/blas/math/prob/trig/rans .lsp)
    source: xlispstat-3-52-23/tests/
    description: "Official 'thorough tests from new S' numerical regression suite (10 files)"
    command: "./xlisp xls-test-runner.lsp"
    expected: "no 'test failed in <file> at check <n>' lines; per-file evidence '[xls-test] <file> checks=<n>'"
    expected_cases: "per-file check counts echoed at run time (not fixed upstream)"

