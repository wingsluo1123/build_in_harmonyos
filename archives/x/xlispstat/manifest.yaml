# 软件级 manifest — xlispstat
software: xlispstat
display: "xlispstat"
description: "基于 XLISP 方言的交互式统计计算与动态图形环境（Luke Tierney）"
category: science
homepage: "https://homepage.stat.uiowa.edu/~luke/xls/xlsinfo/"
license: HPND-sell-variant

build_system: autotools

ohos_adaptation:
  key_points:
    - "采用 --without-x 终端图形路径（GRAPHSYS=GNUPLOT），零 X11/ncurses 依赖"
    - "构建中途需原生执行解释器（.lsp→.fsl 编译 + dump xlisp.wks），仅支持原生构建"
    - "上游 Makefile 忽略环境 CFLAGS，经 configure 命令行 UCFLAGS 注入工具链标志"
    - "包装脚本 XLISPLIB 烘焙路径补丁（0001），包内经 runenv 保持可重定位"
  common_dependencies: []

versions:
  "3.52.23":
    status: built
    build_date: "2026-10-13"
    conan_ref: "xlispstat/3.52.23"
