# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xmltoman/0.4
homepage: "https://sourceforge.net/projects/xmltoman/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.sh
    source: xmltoman-0.4/test.sh
    description: "Smoke test: verify xmltoman/xmlmantohtml binaries are installed and executable"
    command: "./test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：验证 xmltoman 和 xmlmantohtml 可执行文件已正确安装"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
