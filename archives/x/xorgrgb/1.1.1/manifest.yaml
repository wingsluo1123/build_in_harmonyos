software: xorgrgb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.1"

# 构建系统类型
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.freedesktop.org/xorg/app/rgb/-/archive/rgb-1.1.1/rgb-rgb-1.1.1.tar.gz"

  # 源码校验和
  sha256: "ca7a8643243dabc4174a914661855df9ad2e62cbf18ba5ab948ac617b4d89564"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 配置选项列表
  configure_options:
    - "--with-rgb-db-type=text"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - xorgproto/2024.1
    - util-macros/1.20.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁 — E011 (HMDFS umask 077) 修复在 conanfile.py build() 中通过 sed 内联处理
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011: HMDFS umask 077 导致 autotools config.status 临时目录不可写，需 sed umask 022"
  - "xorgrgb (xorg/app/rgb) 源码托管在 freedesktop GitLab，非 GitHub"
  - "xproto pkg-config check 在 xorg-macros 生成的 configure 中语法异常（参数交换），但仅提供头文件不影响编译"
  - "R6: 不应补丁生成文件 configure，改为 build() 内 sed 修复"
