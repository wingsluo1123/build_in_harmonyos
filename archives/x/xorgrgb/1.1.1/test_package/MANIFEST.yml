# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xorgrgb/1.1.1
homepage: "https://gitlab.freedesktop.org/xorg/app/rgb"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# xorgrgb 上游无独立测试套件，仅通过 showrgb 功能验证
upstream_tests:
  - file: showrgb
    source: xorgrgb-1.1.1/showrgb
    description: "showrgb 命令输出颜色数据库，验证 rgb.txt 可读"
    command: "./showrgb"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "showrgb 二进制功能验证：版本输出、颜色数量、颜色查找"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
