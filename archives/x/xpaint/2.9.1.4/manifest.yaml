# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "E546: Imake/xmkmf 体系在 OHOS 不可用（无 imake 工具链/X11 config 规则树），老式 X11 软件需通读 Imakefile 手工提取编译单元（SRCS/OBJS/DEFINES/SYS_LIBRARIES）在配方内组织编译"
- "xaw3dxft 内嵌 widget 库随主程序编译（制品仓无 libXaw3d/libxaw）；laygram/laylex 由 bison/flex 生成后需 sed 's/yy/LayYY/g' 前缀改写（Imakefile 原规则）"
- "E524 家族实证扩展：HMDFS 对 libXft.so.2 单文件 mmap(EXEC) 拒载（dlopen Permission denied），同目录同布局 libXmu/libXt/libX11 可载；跨版本(2.3.9/2.3.8)/位置(4处)/拷贝方式复现——静态桩注入规避（stub 返回 NULL，二进制无 libXft DT_NEEDED）"
- "misc.h 原型参数名 'bool' 与 X11 头链引入的 stdbool typedef 冲突（0003 补丁改名 boolval）"
- "image.h 的 struct imageprocessinfo 被 #ifdef _XLIB_H_ 守卫，conan 包 Xlib.h 守卫宏为 _X11_XLIB_H_ 不匹配，主程序 CFLAGS 需 -D_XLIB_H_；rw/ 不带此宏（-include X11/Xlib.h 提供 XColor）"
- "上游 EXTRA_DEFINES 含 -DFEATURE_FRACTAL（Local.config），漏掉会使 operation.c 菜单数组与回调 #ifdef 不一致编译失败"

patch_generation:
  method: manual
  generated_at: '2026-10-05T22:50:00'
  patches_count: 1

patch_classification:
  - file: 0003-misc-h-bool-param.patch
    type: manual
    platform_only: false
    guard: 'stdbool.h typedef collision rename — no platform macro (R8 compliant)'

