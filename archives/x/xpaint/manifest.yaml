software: xpaint
display: "XPaint"
description: "X11 位图/像素图画板程序（画布编辑器，支持 PNG/JPEG/TIFF/XPM 读写）"
category: gfx
homepage: "http://xpaint.sourceforge.net/"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Imake 体系（E546）：无 xmkmf，配方内手工 GNUmakefile 从三层 Imakefile 提取编译单元"
    - "内嵌 xaw3dxft widget 库随包静态编译（制品仓无 libXaw3d）"
    - "libXft 动态加载被 HMDFS 拒（E524 家族）→ 静态桩注入规避"
  common_dependencies:
    - libx11
    - libxt
    - libxpm
    - libpng
    - libjpeg
    - libtiff
    - freetype

versions:
  "2.9.1.4":
    status: published
    build_date: "2026-10-05"
    conan_ref: "xpaint/2.9.1.4"
    note: "Imake manual-build + Xft static-stub; knowledge draft E546 bundled"
