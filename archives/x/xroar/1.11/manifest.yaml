version: "1.11"
software: "xroar"
status: built               # 真机 shadow CI conan create exit=0（r9，2026-10-13）
build_system: autotools
build_date: "2026-10-08"
conan_ref: "xroar/1.11"

source:
  url: "http://www.6809.org.uk/xroar/download/1.11/xroar-1.11.tar.gz"
  sha256: "70270805ebd52c0b62237cc2f28b32b5c7df9764d10a7c7190de584cfc6e95af"
  tar_format: tar.gz
  # 上游官方 1.11 release tarball；含预生成 configure/Makefile.in，
  # 无需 autoreconf；URL/SHA256 直接写入 conanfile.py（规避 CI conandata
  # 预下载 BUILD_DIR 缺陷），故本目录不含 conandata.yml。

build:
  system: autotools
  configure_options:
    - "--without-gtk2 --without-gtk3 --without-gtkgl --without-sdl2 --without-sdl3"
    - "--without-cocoa --without-alsa --without-oss --without-pulse --without-coreaudio --without-jack"
    - "--without-evdev --without-joydev --without-sndfile --without-tre --without-zlib --without-libpng --without-pthreads"
    - "--disable-wasm --disable-gdb-target --enable-ao-null --enable-filereq-cli"
    - "--disable-gdb-target：规避 src/gdb.c 的 pthread_cancel（musl 兼容预扫 critical 项，该代码仅 gdb-target 构建编译）"
    - "headless null-UI 构建（src/null/ui_null.c + null 音频驱动）"
  dependencies: []          # W0：零必需依赖，全部可选后端显式禁用
  build_tools: []           # tarball 自带 configure，无需 autoreconf 工具链
  cc: clang
  cxx: ""

patches_applied: []         # 无 patch 文件；config.guess/sub/umask/字体表 4 处
                            # 均在 build() 内以 replace_in_file/utime 就地修复

knowledge_gained:
  - "xroar 所有 GUI/音频/IO 后端均为可选集成（PKG_CHECK_MODULES :, : 优雅降级），显式 --without-* 可得零依赖确定性构建，无需拆分依赖适配任务"
  - "src/null/ui_null.c 与 null 音频驱动始终编译进 xroar，headless 可执行文件成立；但运行时仍需用户 ROM（非自由许可，不入包）"
  - "E007：tarball 自带 GNU config.guess 无 HarmonyOS 分支；build() 内补 *:HarmonyOS:*:*) 分支 + __OHOS__ libc 探测（R1 不伪造 --host）"
  - "E114：configure 内 (umask 077 && mktemp) 在 HMDFS 上产出不可写目录；去掉 umask 077"
  - "font2c 陷阱：src/Makefile.am 将预生成字体表列为 BUILT_SOURCES，重新生成需编译 tools/font2c 且其 LDADD 是 SDL+SDL2_image；tarball 已带全部 6 个生成物，make 前 touch 即可让规则永不触发，避免引入 SDL"
  - "上游无测试套件（无 tests/、无 check 目标）；验证口径=完整构建 + test_package 消费者冒烟（--version/--help/无 ROM 报错）"
  - "上游 configure 无 GL 时把 GL_LIBS 替换为字面量 no 且 vo_opengl.c 无条件编译；OHOS 用 make GL_LIBS=-lGLESv3（系统 libGLESv3）链接修复"
  - "CONFIG_SHELL/SHELL 必须 /bin/sh 前缀压过 profile buildenv（hnp bash 在 HMDFS getcwd 失败，见 libfec 知识草稿）"
  - "headless null-UI 构建无 ROM 时进入主循环空转而非报错；test_package 无 ROM 断言须双分支（报错或有界超时）"

conan_adaptation:
  recipe: conanfile.py
  conandata: false          # 源码 URL/SHA256 内联于配方，规避 CI BUILD_DIR 缺陷
  test_package: test_package/
  package_type: application
  commands_json: true
