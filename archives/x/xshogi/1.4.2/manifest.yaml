# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "libXt（1.3.1 Initialize.c 全量核对）不实现 -help/-version，Xt 的标准选项表只有
  -display/-geometry/-name/... 等；因此 X11 程序要支持无头查询版本，必须在
  XtAppInitialize 之前自己早退（xeyes/appres 上游即如此），不能指望 Xt。"
- "AC_PATH_XTRA 在无 xmkmf、无系统 X11 树的 OHOS 环境会走 mktemp/Imakefile 探测分支；
  预置 autoconf 缓存变量 ac_cv_have_x='have_x=yes' 可整段跳过，X_CFLAGS/X_LIBS 保持空，
  头/库路径全部交给 Conan 依赖（AutotoolsDeps），比传 --x-includes/--x-libraries 更完整
  （后者只接受单目录，覆盖不了 xorgproto+libxaw+libxmu+libxt 的多前缀头文件）。"
- "xshogi tarball 已带预生成 configure/Makefile.in/parser.c/scanner.c/parser.h，
  且 configure.ac 未用 AC_CANONICAL_*，因此无需补 config.guess/config.sub 的 ohos
  三元组，也无需 --host/--build（build=host 原生编译）。"
- "设备无系统 X11 运行期库（/lib、/lib64、/usr/lib、/system/lib*、$HOME/usr/local/lib
  均无 libX11*/libXaw*）→ GUI 应用包必须自包含：package() 把依赖 .so 按 SONAME 名
  复制进包内 lib/，链接期 DT_RPATH=$ORIGIN/../lib；裸环境 bin/xshogi --version
  才能 rc=0（否则 loader 报 Error loading shared library libXaw.so.7，CI L2 也拿不到 pass）。"
- "DT_RPATH=$ORIGIN 要穿过三层转义才写得对（每层都实测踩过）：
  (1) conan 工具链脚本 export LDFLAGS=\"...\" 是双引号 → 值里须写 \\$\\$ORIGIN；
  (2) Makefile 的 LDFLAGS 是递归变量，make 展开时把 $$ORIGIN 折成 $ORIGIN ——
      若只写单个 $，make 会把 $O 当未定义变量吃掉，实测得到 DT_RPATH=[RIGIN]；
  (3) recipe 行交给 sh 时用字面单引号保住 $ORIGIN 不被展开。
  且 extra_ldflags 必须在 AutotoolsToolchain.environment() 之前 append
  （environment() 会快照 self.ldflags，之后再 append 不生效）。"
- "AC_PATH_XTRA 会把全部 X 库塞进 configure 的 conftest 链接行，configure 要直接运行
  ./conftest；无系统 X11 库时会报 cannot run C compiled programs。修法是把各依赖
  libdir 注入构建环境 LD_LIBRARY_PATH（AutotoolsToolchain env.append_path）。"

