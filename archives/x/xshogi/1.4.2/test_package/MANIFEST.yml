# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: xshogi/1.4.2
homepage: "https://www.gnu.org/software/gnushogi/"

# 上游源码清点（R51）：xshogi 1.4.2 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am（8.3KB，构建定义全文）"
    reason: "只有 bin_PROGRAMS/EXTRA_PROGRAMS = xshogi、xshogi_SOURCES、
      xshogi_CPPFLAGS、AM_CFLAGS、xshogi_LDADD、BUILT_SOURCES/AM_YFLAGS、
      dist_man_MANS、dist_noinst_DATA 与 noinst_HEADERS（位图清单）；
      全文无 TESTS、check_PROGRAMS、check-local、TESTS_ENVIRONMENT。"
  - source: "Makefile.in（43KB，automake 生成的构建脚本）"
    reason: "匹配 check 的只有 automake 的固定骨架
      （check-am/check/installcheck 与其 .PHONY 列表），
      展开后 TESTS 为空 → check-TESTS 无任何用例；无 check_PROGRAMS。"
  - source: "configure.ac（2.7KB）"
    reason: "AC_PROG_YACC/AC_PROG_LEX/AC_PATH_XTRA/AC_CHECK_HEADERS/
      AC_CHECK_FUNCS 等探测宏 + 少量 --with-* 选项，无测试相关宏，
      无 AC_CONFIG_TESTDIR / AM_INIT_AUTOMAKE 的 test 扩展。"
  - source: "源码树"
    reason: "发布包文件清单无 tests/、test/ 目录，无 *_test 或 test_* 源文件；
      产品源码只有 xshogi.c、预生成的 parser.c/scanner.c（yacc/lex 产物）、
      位图目录（eastern_bitmaps/ western_bitmaps/ new_*_bitmaps/）与文档。"
  - observation: "make check 在本配方 build() 中实际执行：automake 空套件，
      无编译/无用例（日志见 conan create 输出）。"
  - conclusion: "上游未提供自动化测试套件（N=0，可运行 N'=0）。
      由 test_package 真实执行被测二进制（--version/-version/无显示时的
      Xt 显示失败路径）做 L1 消费者验证。"

# 上游测试命令（用于清点复核）
upstream_check_command: "make -n check  # TESTS 为空，无任何用例"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带的消费者测试（真实执行被测二进制）
test_package_tests:
  - file: test_xshogi.sh
    description: "真实执行包内 bin/xshogi（脚本主动清空 LD_LIBRARY_PATH/LD_PRELOAD
      的裸环境，复现 CI L2 bin/xshogi --version 的执行条件）：
      (1) --version 断言退出码 0 且输出含 'xshogi version 1.4.2'（与上游
          configure.ac AC_INIT 版本一致）；裸环境成功即证明包自包含
          （依赖 .so 已随包放 lib/ + DT_RPATH=$ORIGIN/../lib）；
      (2) -version 单横线形式同断言；
      (3) 无效 DISPLAY（:987）下 -help 断言非 0 退出且报 Xt 显示失败诊断——
          证明二进制真加载 libXaw/libXmu/libXt/libXext/libX11 并调用
          XtAppInitialize，而不是只打印字符串。"
    command: "$SHELL test_xshogi.sh <package>/bin/xshogi"

assertion_count: 3
