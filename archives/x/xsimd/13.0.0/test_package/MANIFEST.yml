# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: xsimd/13.0.0
homepage: "https://github.com/xtensor-stack/xsimd"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序
# xsimd 上游 test/CMakeLists.txt 注册单个 ctest 用例 "test_xsimd"，
# 该可执行文件基于 doctest 框架，内部包含 37 个 SIMD 单元测试（覆盖 batch/math/memory/arch 等）
upstream_tests:
  - file: test/test_xsimd.cpp
    source: xsimd-13.0.0/test/test_xsimd.cpp
    description: "xsimd 上游 SIMD 单元测试套件 (doctest, 37 个子测试)"
    command: "ctest -R test_xsimd"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试"
    command: "./test_xsimd"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
