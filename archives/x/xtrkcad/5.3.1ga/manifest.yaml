# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS/HarmonyOS 不是 CMake 已知系统名，UNIX 变量为假会导致工程走非 POSIX 分支；应在源码补丁里按 Unix 类平台处理（set(UNIX 1)），禁止伪装 CMAKE_SYSTEM_NAME（会把平台模块载错，见 E092）"
  - "工程缺少 inkscape 时，可用制品仓的 librsvg 静态库自建一个接受同一命令行形态（INPUT.svg -h N -o OUT.png）的 SVG 光栅化小工具顶上，使位图头文件仍可在构建期生成"
  - "Conan CMakeDeps 生成小写导入目标（libzip::libzip / cmocka::cmocka），工程自带 Find 模块定义大写变量，需在顶层 CMakeLists 做双向桥接"
  - "补丁管线按文本模式读源码会剥掉 CR，CRLF 源文件（app/bin/bitmaps/CMakeLists.txt）无法套用 LF 补丁（dry-run Hunk FAILED）；改为 exports_sources 携带整文件覆盖交付"
  - "conan 包里没有 .pc wrapper 时，工程的 Find 模块应改为按头文件实际存在性判定（能力探针），不要依赖 pkg-config 缓存前缀"

