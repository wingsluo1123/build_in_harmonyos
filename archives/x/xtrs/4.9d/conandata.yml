patches:
  - patch_file: "patches/0001-ohos-guard-linux-only-feature-blocks.patch"
    patch_description: "Guard vendor Linux-only feature blocks by capability instead of platform identity: OHOS clang defines __linux, activating blocks that #include Linux kernel/driver headers (<sys/soundcard.h> OSS, <linux/fd.h> physical floppy) which are absent on OHOS. Use '#if defined(__linux) && __has_include(<header>)' so the blocks compile only where the required headers exist."
    patch_type: "portability"
