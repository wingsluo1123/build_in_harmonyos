# test_package/MANIFEST.yml
# xtrs 4.9d - upstream/consumer test declaration.

package: xtrs/4.9d
homepage: "http://www.tim-mann.org/xtrs"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships a hand-written Makefile/Makefile.local that only builds the
  four programs (xtrs, mkdisk, hex2cmd, cmddump) and the man pages; there is
  no tests/ directory, no `make check`/ctest, and no automated regression.
  The Z80 core is exercised only implicitly. Upstream test case count N = 0.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_xtrs.sh
    description: "headless OHOS: hex2cmd(fakerom.hex)->154B .cmd, cmddump load range/transfer address, mkdisk -3 -> 8704B, xtrs loads libX11 and reports no display"
    command: "BIN_DIR=... FIXTURE_DIR=... sh test_xtrs.sh"

test_files:
  - path: "test_package/test_xtrs.sh"
    test_type: "R34"
    assertion_count: 5
  - path: "test_package/fakerom.hex"
    test_type: "R34"
    assertion_count: 0

test_package_test_count: 1
consumer_assertion_count: 5
upstream_test_cases: 0
assertion_count: 5
