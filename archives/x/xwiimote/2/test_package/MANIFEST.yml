# test_package/MANIFEST.yml — xwiimote/2 上游测试申报（R51 三步法）
#
# 清点结论：上游 xwiimote-2（tag xwiimote-2, commit 2bc2942a）**无测试套件**。
#   证据 1：源码包顶层无 test/ tests/ 目录（仅 doc/ lib/ res/ tools/）
#   证据 2：根 Makefile.am 无 TESTS / check_PROGRAMS / check-local 目标，
#           也未定义 SUBDIRS（SUBDIRS = .），即 `make check` 不执行任何测试
#   证据 3：上游仓库 README/DEV 未提及自动化测试
# 因此上游测试通过率无从统计，质量保障由本 test_package 的消费者测试承担。

package: xwiimote/2
homepage: "https://github.com/xwiimote/xwiimote"

# 上游测试命令（实际 make check 为空目标，无测试可跑）
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试（上游无测试）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，实质调用 libxwiimote 公共 API）
test_package_tests:
  - file: test.c
    description: "监视器构造/引用计数/轮询、非法 syspath 拒绝、生命周期复用"
    command: "./test_xwiimote"
  - file: test_xwiishow_cli.py
    description: "执行打包 bin/xwiishow 的无头 list 路径与 -h，断言真实 stdout/退出码"
    command: "python3 test_xwiishow_cli.py <package_folder>/bin/xwiishow"
  - file: conanfile.py
    description: "ELF 契约：bin/ 与 lib/ 下每个实体 ELF 断言 AArch64 + 恰 1 个 .codesign 段，并断言 bin/xwiishow 的 DT_NEEDED（fail-closed）"
    command: "test() → _verify_elf_contract()"

# 确定性断言数（test.c 中可失败的判定点：NULL 入参必须 -EINVAL、
# 不存在 syspath 必须返回负错误码）
assertion_count: 2
# 另有 2 项监视器生命周期检查（ref/poll/unref、重复构造）仅在 udev 枚举能力可用时
# 执行；门禁实测 OHOS 上 xwii_monitor_new() **构造成功**（udev 枚举能力可用），
# 日志 "当前无 wiimote 设备（预期行为）" 出自构造成功分支，仅 poll() 因构建机/CI
# 无实体 wiimote 设备而返回 NULL，故跳过轮询断言，不计入断言数
conditional_checks: 2
# CLI 断言数（test_xwiishow_cli.py 的 check() 计 5 项：
# list 退出码/list 头/list 尾/-h 退出码/-h 用法文本）
cli_assertion_count: 5
# ELF 契约断言：每个实体 ELF 的 AArch64 + 恰 1 个 .codesign，外加
# bin/xwiishow 的 DT_NEEDED 存在性；任一失败即 raise
elf_contract: "per-artefact AArch64 + exactly-1 .codesign; bin/xwiishow DT_NEEDED"

