software: yadifa
display: "YADIFA"
description: "轻量级权威 DNS 服务器，支持 DNSSEC 功能"
category: network
homepage: "https://www.yadifa.eu"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tarball 不含预生成 configure，需 autoreconf -fi"
    - "OpenHarmony 不支持 pthread_setaffinity_np，需 HAS_PTHREAD_SETAFFINITY_NP 宏守护"
    - "config.status ECHO 需改为 printf（ksh 语法不兼容）"
    - "/tmp 只读，需设置 TMPDIR=$HOME/tmp"
    - "Makefile 中 /usr/bin/install 需 sed 替换"
    - "E007: config.guess 不识别 HarmonyOS，需补丁处理"
  common_dependencies:
    - openssl

versions:
  "3.0.5":
    status: built
    build_date: "2026-06-25"
    conan_ref: "yadifa/3.0.5@ohpcd/stable"
