sources:
  url: "https://distfiles.macports.org/yamcha/yamcha-0.33.tar.gz"
  sha256: "413d4fc0a4c13895f5eb1468e15c9d2828151882f27aea4daf2399c876be27d5"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach the legacy config.guess script the native HarmonyOS aarch64 triplet and modern Darwin arm64"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept aarch64 CPUs and the linux-ohos operating-system suffix"
    patch_type: "portability"
  - patch_file: "patches/0003-cxx11-make_pair.patch"
    patch_description: "Drop explicit std::make_pair template arguments so lvalue arguments compile under libc++ C++11"
    patch_type: "portability"
  - patch_file: "patches/0004-umask-000.patch"
    patch_description: "config.status confstat temp dir: umask 077 -> 000 so HMDFS can create/write it (E011/E206 family; CI native OHOS build showed Permission denied on confstat*/subs.sed)"
    patch_type: "portability"
  - patch_file: "patches/0005-c-api-try-catch.patch"
    patch_description: "yamcha_svm_new: wrap SVM::open in try/catch so a missing/broken model returns NULL with an error string instead of leaking a C++ exception across the C API boundary (libc++abi terminate on OHOS)"
    patch_type: "bugfix"
