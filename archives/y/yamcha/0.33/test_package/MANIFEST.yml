package: yamcha/0.33
homepage: "http://chasen.org/~taku/software/yamcha/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: upstream-shell-suite
    source: yamcha-0.33/tests/test1.sh through test4.sh
    description: "Four official integration tests training a chunking model with svm_learn, annotating test.data, scoring with conlleval.pl, and re-annotating the compressed model"
    command: "make check"

test_package_tests:
  - file: test_yamcha.cpp
    description: "HarmonyOS installed-library consumer: load the shared library and exercise the public C API error path (missing model, strerror content, NULL-safe destroy)"
    command: "./yamcha_api_test"
  - file: conanfile.py (CLI)
    description: "HarmonyOS installed-command consumer: verify bin/yamcha is installed, --version reports 0.33, and --help shows usage"
    command: "yamcha --version; yamcha --help"

assertion_count: 9
