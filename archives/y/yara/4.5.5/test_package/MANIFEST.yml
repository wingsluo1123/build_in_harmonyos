# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: yara/4.5.5
homepage: "https://github.com/VirusTotal/yara"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (16 tests, 15 PASS, 1 FAIL)
upstream_tests:
  - file: test-arena
    source: yara-4.5.5/tests/test-arena.c
    description: "Arena memory management test"
    command: "./test-arena"
  - file: test-alignment
    source: yara-4.5.5/tests/test-alignment.c
    description: "Alignment test"
    command: "./test-alignment"
  - file: test-atoms
    source: yara-4.5.5/tests/test-atoms.c
    description: "Atoms test"
    command: "./test-atoms"
  - file: test-api
    source: yara-4.5.5/tests/test-api.c
    description: "API test"
    command: "./test-api"
  - file: test-rules
    source: yara-4.5.5/tests/test-rules.c
    description: "Rules test"
    command: "./test-rules"
  - file: test-version
    source: yara-4.5.5/tests/test-version.c
    description: "Version test"
    command: "./test-version"
  - file: test-bitmask
    source: yara-4.5.5/tests/test-bitmask.c
    description: "Bitmask test"
    command: "./test-bitmask"
  - file: test-math
    source: yara-4.5.5/tests/test-math.c
    description: "Math test"
    command: "./test-math"
  - file: test-stack
    source: yara-4.5.5/tests/test-stack.c
    description: "Stack test"
    command: "./test-stack"
  - file: test-re-split
    source: yara-4.5.5/tests/test-re-split.c
    description: "Regex split test"
    command: "./test-re-split"
  - file: test-async
    source: yara-4.5.5/tests/test-async.c
    description: "Async test"
    command: "./test-async"
  - file: test-string
    source: yara-4.5.5/tests/test-string.c
    description: "String test"
    command: "./test-string"
  - file: test-exception
    source: yara-4.5.5/tests/test-exception.c
    description: "Exception test (FAIL on OHOS - platform limitation)"
    command: "./test-exception"
  - file: test-dotnet
    source: yara-4.5.5/tests/test-dotnet.c
    description: "Dotnet module test"
    command: "./test-dotnet"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "Consumer test: compile and run a yara rule"
    command: "./test_yara"

# 测试断言总数
assertion_count: 60
