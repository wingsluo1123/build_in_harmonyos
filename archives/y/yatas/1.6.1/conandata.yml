# conandata.yml — yatas 1.6.1
# 源码使用官方 GitHub tag 归档，sha256 由官方 v1.6.1 源码包实测得到。
# 镜像优先：gh-proxy.com 是 ci/conan/build_and_test.sh 的 get_mirrors() 为
# github.com 维护的官方镜像源（实测其归档与官方 sha256 完全一致），官方
# GitHub URL 保留在最后作为回退。CI 的 pre-download 层会再追加 file:// 预缓存
# 兜底，因此官方直连慢/超时也有多层回退保障。
sources:
  url:
    - "https://gh-proxy.com/https://github.com/padok-team/yatas/archive/refs/tags/v1.6.1.tar.gz"
    - "https://github.com/padok-team/yatas/archive/refs/tags/v1.6.1.tar.gz"
  sha256: "d4ecca0180fe9c5447cc13ce9a2b2bdab4a5b977060f5e89b87e9f4ca71d5857"

patches: {}
