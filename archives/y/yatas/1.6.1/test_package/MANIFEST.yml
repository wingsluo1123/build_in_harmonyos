# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yatas/1.6.1
homepage: "https://github.com/padok-team/YATAS"

# 上游测试命令（上游 Makefile 的 test target）：
#   make test → go test ./... -cover
# 本适配为获得确定性的逐用例计数（HMBS 门禁要求），在 build() 里实际运行
# 上游全部 48 个 Go 顶层测试：先对每个含 *_test.go 的包执行 `go test -c` 在
# ext2 工作区链接出单个测试二进制，用与主程序相同的 binary-sign-tool 自签名
# （OHOS），再以 cwd=<包目录> 直接执行该测试二进制（等价于 go test 的工作目录
# 语义），并逐用例解析非缩进的 `--- PASS:` / `--- FAIL:` / `--- SKIP:` 行，把聚合
# 结果持久化为 res/upstream_test_result.json，由 test_package 在每次预检重新输出。
# 这与官方 go test ./... 属于同一上游测试套件（全部 48 个顶层 Go 测试），仅执行
# 方式在 OHOS 上更稳健；计数口径一致。
upstream_check_command: "go test ./... -cover"
upstream_test_in_build: true
upstream_test_command: "go test -c（每含测试的包）→ 自签名测试二进制 → 以 cwd=<包目录> 直接执行 (-test.v -test.count=1)"

# 上游实际运行的测试程序：11 个 *_test.go 文件、48 个顶层 Go 测试函数。
# 逐文件盘点（均来自官方 v1.6.1 tarball，见 upstream_test_audit）：
#   internal/cli/cli_test.go ........................ 3
#   internal/helpers/file_test.go ................... 1
#   internal/report/parser_test.go .................. 2
#   internal/report/report_test.go .................. 6
#   plugins/commons/checConfig_test.go .............. 6
#   plugins/commons/config_test.go .................. 5
#   plugins/commons/pluginRPC_test.go ............... 3
#   plugins/commons/pluginUsage_test.go ............. 4
#   plugins/commons/types_test.go ................... 9
#   plugins/commons/yatas_test.go ................... 7
#   plugins/logger/logger_test.go ................... 2
#   ──────────────────────────────────────────────────
#   合计 ................................................ 48
upstream_tests:
  - file: internal/cli/cli_test.go
    source: "yatas-1.6.1/internal/cli/cli_test.go"
    description: "CLI：插件初始化 / Execute 错误路径 / ciReporting"
    command: "go test ./... -cover"
  - file: internal/helpers/file_test.go
    source: "yatas-1.6.1/internal/helpers/file_test.go"
    description: "文件读取 helper"
    command: "go test ./... -cover"
  - file: internal/report/parser_test.go
    source: "yatas-1.6.1/internal/report/parser_test.go"
    description: "报告解析"
    command: "go test ./... -cover"
  - file: internal/report/report_test.go
    source: "yatas-1.6.1/internal/report/report_test.go"
    description: "报告聚合/忽略/退出码/HDS 过滤"
    command: "go test ./... -cover"
  - file: plugins/commons/checConfig_test.go
    source: "yatas-1.6.1/plugins/commons/checConfig_test.go"
    description: "CheckConfig 校验"
    command: "go test ./... -cover"
  - file: plugins/commons/config_test.go
    source: "yatas-1.6.1/plugins/commons/config_test.go"
    description: "配置解析 / exclude / include / 插件查找"
    command: "go test ./... -cover"
  - file: plugins/commons/pluginRPC_test.go
    source: "yatas-1.6.1/plugins/commons/pluginRPC_test.go"
    description: "插件 RPC Server/Client（本地内存，无网络）"
    command: "go test ./... -cover"
  - file: plugins/commons/pluginUsage_test.go
    source: "yatas-1.6.1/plugins/commons/pluginUsage_test.go"
    description: "插件安装路径 / tag / asset / 校验"
    command: "go test ./... -cover"
  - file: plugins/commons/types_test.go
    source: "yatas-1.6.1/plugins/commons/types_test.go"
    description: "commons 类型与 Result/Check/Test 逻辑"
    command: "go test ./... -cover"
  - file: plugins/commons/yatas_test.go
    source: "yatas-1.6.1/plugins/commons/yatas_test.go"
    description: "Yatas 插件接口"
    command: "go test ./... -cover"
  - file: plugins/logger/logger_test.go
    source: "yatas-1.6.1/plugins/logger/logger_test.go"
    description: "日志器"
    command: "go test ./... -cover"

# ── 上游测试总数与计数口径（规则强制字段）──
upstream_tests_exist: true
upstream_test_total: 48
# 口径：官方 Makefile 的 test target = `go test ./... -cover`，Go 顶层测试函数
# 为单一可解析框架；48 为官方 v1.6.1 tarball 中全部 *_test.go 的顶层
# `func Test...` 函数数（panel 见上，来源目录逐文件盘点，非本次可运行子集）。
upstream_test_count_method: go_test_functions
# 期望分解（真实执行数由 build() 运行全部 48 个上游 Go 测试得出，存于
# res/upstream_test_result.json 并由 test_package 每次预检重新输出；此处为盘点声明，
# res/upstream_test_result.json 并由 test_package 重新输出；此处为盘点声明，
# 不替代实测数字）
upstream_test_passed: 48
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_not_run: 0
upstream_test_audit:
  - source: "官方 v1.6.1 tarball（github.com/padok-team/yatas v1.6.1，sha256 d4ecca…d5857，内置 .github/workflows/release.yml）"
    build_system: "go test (Go 单元测试，纯本地：无网络、无 t.Skip、无 t.Parallel)"
    test_definition: "11 个 *_test.go 文件中 48 个顶层 func Test 函数（逐文件盘点合计）"
    dependency: "无外部测试依赖；go.mod 仅标准库 + testify 等纯 Go 依赖，CGO 关闭"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: yatas --help 退出码 0 且列出核心 flag + --init 在临时目录生成 .yatas.yml"
    command: "sh test.sh <bin/yatas>"

# test.sh 中的断言数（HMBS_TEST_PACKAGE_RESULT 的 discovered/passedCount 与此对应）:
#   1. yatas 二进制存在且可执行
#   2. `yatas --help` 退出码为 0
#   3. `--help` 输出非空且列出核心 flag（Go 标准 flag 包在 usage 中打印为单横线形式
#      -init / -readme / -install；命令行同时接受 --init/--readme）
#   4. `yatas --init` 退出码为 0（写入 .yatas.yml）
#   5. `--init` 在临时工作目录实际创建了非空 .yatas.yml
assertion_count: 5
