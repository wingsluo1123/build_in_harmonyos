# 软件级 manifest — yatas
software: yatas
display: "yatas"
description: "A simple tool to audit AWS/GCP infrastructure for misconfiguration or potential security issues (纯 Go CLI)"
category: build-tool
homepage: "https://github.com/padok-team/YATAS"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 静态编译（CGO_ENABLED=0，GOOS=linux，GOARCH=arm64）"
    - "Go linker mmap 在 HMDFS 上 permission denied，链接输出需放在 ext2 可写分区（/data/storage/el2/base/haps/entry/files）"
    - "OHOS 上每个被 fork/exec 的 ELF 必须用 binary-sign-tool 自签名（含 .codesign section）"
    - "上游自带 11 个 *_test.go / 48 个纯本地 Go 单元测试，`go test -v -count=1 ./...` 全量运行"
  common_dependencies: []

versions:
  "1.6.1":
    status: built
    build_date: "2025-12-12"
    conan_ref: "yatas/1.6.1"
