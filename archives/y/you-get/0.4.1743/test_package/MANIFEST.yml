package: you-get/0.4.1743
homepage: "https://github.com/soimort/you-get"

upstream_check_command: "PYTHONPATH=src python3 -m unittest tests.test -q"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

external_integration_note: "you-get is a pure Python CLI tool. The --version flag is the standard smoke test. Full upstream tests (tests/test.py) hit live third-party sites (imgur/tiktok/twitter/weibo/...) and require network; tests/test_common.py and tests/test_util.py are local assertions. dukpy is only needed by the YouTube extractor and is not packaged."

test_package_tests:
