# test_package/MANIFEST.yml
# ytt 0.55.1 — Go binary, no C/CMake tests

package: ytt/0.55.1
homepage: "https://carvel.dev/ytt"

# Go project: no make check / ctest / meson test
upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: ""

# ytt has Go unit tests (not C tests)
upstream_tests:
  - file: "cmd/ytt/main_test.go"
    source: "ytt-0.55.1/cmd/ytt/"
    description: "ytt CLI unit tests"
    command: "go test ./cmd/ytt/..."

# test_package: verify binary runs
test_package_tests:
  - file: "conanfile.py"
    description: "Verify ytt binary runs and reports correct version"
    command: "ytt --version"

# Test assertions
assertion_count: 1
