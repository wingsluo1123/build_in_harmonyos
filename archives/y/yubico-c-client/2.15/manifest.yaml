software: yubico-c-client
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.15/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.15"

# 构建系统
build_system: autotools

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"
compile_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/Yubico/yubico-c-client/tar.gz/refs/tags/ykclient-2.15"

  # 源码校验和
  sha256: "3863f4fc2f3320c59fcbf57862bba48bcb716fddb886840bb0dd8db14d5ab7f0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "curl/8.19.0"
    - "zlib/1.3.1"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS platform: umask 077 + setgid bit on directories prevents file creation in temp dirs (config.status). Fix: sed umask 077 -> umask 022 in configure (ref: E011)"
  - "GitHub source archive (tarball) does not include generated configure script - need autoreconf --install -f (ref: E017)"
  - "selftest requires network access to Yubico validation servers - fails in isolated environment (ref: E024)"
  - "help2man needed for man page generation - installed from precompiled package (ref: E048)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/yubico-c-client-2.15.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/yubico-c-client-2.15.work
  source_orig_hash: 1d961fcf4476b188
  source_work_hash: 4eafccec4ce8d20c
  generated_at: '2026-06-25T20:07:29'
  patches_count: 1

patch_classification:
  - file: 0001-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
