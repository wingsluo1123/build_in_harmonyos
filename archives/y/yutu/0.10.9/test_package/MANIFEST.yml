    description: "共享客户端/上下文工具（16）"
    command: "go test ./pkg/common/"
  - file: pkg/auth/{auth,service,verifier}_test.go
    source: yutu-0.10.9/pkg/auth/
    description: "OAuth 客户端/令牌缓存/Google TokenVerifier（13+2+3=18）"
    command: "go test ./pkg/auth/"
  - file: pkg/utils/utils_test.go
