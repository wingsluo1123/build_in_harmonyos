# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yutu/0.10.9
homepage: "https://github.com/eat-pray-ai/yutu"

# 上游测试入口（上游 CI 实际使用的命令）
# .github/workflows/test.yml -> job go-test -> "go test ./... -coverprofile=... -coverpkg=./pkg/..."
upstream_check_command: "go test -count=1 ./..."

# 上游测试在 conanfile.py build() 中执行（OHOS 需先编译再签名，见下）
upstream_test_in_build: true

# OHOS 上不能直接 `go test ./...`：它会链接出测试二进制并立即 execve，
# 而未带 .codesign 的 ELF 在 OHOS 上无法执行（知识 E128）。因此逐包
# `go test -c` 编译 → binary-sign-tool 签名 → 执行测试二进制（同 kor/0.6.8 策略）。
upstream_test_command: "go test -c -count=1 -timeout 1200s -o <ext2>/<pkg>.test <pkg> && sign <pkg>.test && <pkg>.test -test.v"

# 上游测试包（30 个 *_test.go，按包归并；括号内为顶层 Test/Benchmark/Example 函数数）
upstream_tests:
  - file: cmd/flags_test.go
    source: yutu-0.10.9/cmd/flags_test.go
    description: "--dry-run / --yes 确认逻辑与 ErrDryRun 语义（10 个顶层测试函数）"
    command: "go test ./cmd/"
  - file: pkg/common/common_test.go
