# ── 上游测试审计（upstream_tests_exist=true 的证据）──
upstream_tests_exist: true
upstream_test_audit:
  - source: "yutu-0.10.9 source tree (`find . -name '*_test.go' | wc -l`)"
    reason: "共 30 个 *_test.go；顶层 Test/Benchmark/Example 函数 177 个（grep '^func (Test|Benchmark|Example)')。"
  - source: ".github/workflows/test.yml"
    reason: "job `go-test` 执行 `go test ./... -coverprofile=coverage.out -coverpkg=./pkg/...`，随后 `./scripts/command-test.sh`；另有 job `bazel-test` 执行 `bazel test //... --test_output=errors`。"
  - source: "docs/HOW_TO_TEST.md"
    reason: "上游测试策略文档：TDD + httptest 桩，目标 >80% 覆盖率，声明测试为 hermetic（不依赖外网）。"
  - source: "scripts/command-test.sh"
    reason: "CLI 级测试脚本：对 help/completion/version 及各资源子命令逐个 `--help` 断言，可接受被测二进制路径。"
  - conclusion: "上游 0.10.9 提供完整的自动化测试入口；本适配在 build() 中实际执行全部 30 个测试包（compile+sign+run），真实用例数与通过/失败/跳过数见 reports/ 与 conan create 日志。"
upstream_test_count: 177

# test_package 中自带的测试 (消费者视角验证，不冒充上游覆盖)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: ELF magic / yutu version 断言 v0.10.9 + linux/arm64 / help 暴露 video·playlist / yutu video --help / 静态链接无 DT_NEEDED"
    command: "sh test.sh <bin/yutu>"

# test.sh 中的断言数:
#   1. 包内产物为 ELF 可执行文件（magic 7f454c46）
#   2. `yutu version` 退出码为 0
#   3. version 输出包含 "v0.10.9"
#   4. version 输出包含 "linux/arm64"
#   5. `yutu help` 退出码为 0
#   6. help 输出包含 "video"
#   7. help 输出包含 "playlist"
#   8. `yutu video --help` 退出码为 0
#   9. 二进制为静态链接（无 DT_NEEDED）
assertion_count: 9
