software: zathura-pdf-mupdf
version: "2026.05.10"
status: built
build_date: "2026-08-09"
build_system: meson

source:
  url: "https://pwmt.org/projects/zathura-pdf-mupdf/download/zathura-pdf-mupdf-2026.05.10.tar.xz"
  sha256: "e57c046e80b65e0a8df82cb04b537102099c38b3ed4d7f30161c2e7dcd9a6e28"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dc_std=c17"
    - "-Dtests=disabled"
    - "-Dpdf=enabled"
  dependencies:
    - "glib/2.84.0.1 (conan)"
    - "cairo/1.18.4 (conan)"
    - "mupdf/1.27.2 (built from source within recipe)"
    - "girara/2026.02.04 (headers from source)"
    - "zathura/2026.05.20 (headers from source)"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/mupdf/0001-thirdparty-mujs-mujs.h.patch"
  - "patches/mupdf/0002-thirdparty-mujs-regexp.c.patch"
  - "patches/mupdf/0003-thirdparty-mujs-regexp.h.patch"
  - "patches/mupdf/0004-thirdparty-mujs-utf.c.patch"
  - "patches/mupdf/0005-thirdparty-mujs-utf.h.patch"
  - "patches/mupdf/0006-thirdparty-mujs-utfdata.h.patch"

knowledge_gained:
  - "zathura-pdf-mupdf is a meson-based shared_module plugin for zathura"
  - "meson.build default c_std=c23, clang 15 doesn't support C23, override with -Dc_std=c17"
  - "zathura plugin-api.h includes links.h which includes <gtk/gtk.h> — stub gtk.h created (GdkAtom typedef)"
  - "mupdf built with bundled thirdparty (freetype, harfbuzz, libjpeg, etc.) — no system deps needed"
  - "mupdf mujs=no avoids need for full mujs source; patches fill regexp/utf files for FZ_ENABLE_JS=0"
  - "girara/zathura only need headers for plugin compilation; stub .a libs for linker"
  - "plugin exports zathura_plugin_67 symbol (API=6, ABI=7)"
