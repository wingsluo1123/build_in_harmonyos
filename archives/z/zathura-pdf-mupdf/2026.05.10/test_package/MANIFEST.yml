# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zathura-pdf-mupdf/2026.05.10
homepage: "https://github.com/pwmt/zathura-pdf-mupdf"

# 上游测试命令 (meson test --list)
upstream_check_command: "meson test --list"

# zathura-pdf-mupdf uses meson with -Dtests=disabled (OHOS platform limitation)
upstream_test_in_build: false
upstream_test_command: "meson test"

# 上游实际运行的测试 (meson test suite)
upstream_tests:
  - file: tests/
    source: zathura-pdf-mupdf-2026.05.10/tests/
    description: "Upstream meson test suite (disabled on OHOS)"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "dlopen plugin .so and verify zathura_plugin_67 symbol (API=6, ABI=7)"
    command: "./test_zathura_pdf_mupdf"

# 测试断言总数
assertion_count: 3
