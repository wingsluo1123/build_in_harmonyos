version: '2026.07.18'
status: pending
build_date: ''

source:
  url: 'https://github.com/pwmt/zathura/archive/refs/tags/2026.07.18.tar.gz'
  sha256: '737911eaf3ff7047004e0cb68548365313f072c3522b89efa0e4b7a036730b80'
  tar_format: tar.gz

build:
  system: meson
  conan_recipe: true
  configure_options:
    - '-Dwrap_mode=nodownload'   # meson project option; the --wrap-mode CLI flag is set separately
    - '-Dtests-x11=disabled'
    - '-Dtests-wayland=disabled'
    - '-Dmanpages=disabled'
    - '-Dconvert-icon=disabled'
    - '-Dseccomp=disabled'
    - '-Dlandlock=disabled'
    - '-Dsynctex=disabled'
    - '-Dc_std=c2x'
  dependencies:
    - 'girara/2026.07.07.1 (Conan, pkg-config, >=2026.07.07.1)'
    - 'glib/2.84.0.1.1 (Conan, override, >=2.84)'
    - 'gtk4/4.22.4 (Conan, >=4.12)'
    - 'json-glib/1.10.6 (Conan)'
    - 'cairo/1.18.4 (Conan)'
    - 'libmagic/5.48 (Conan)'
    - 'sqlite3/3.49.1 (Conan, >=3.35.0)'
    - 'xxhash/0.8.3 (Conan, libxxhash)'
    - 'harfbuzz/14.2.0.1.1.1 (Conan, override)'
    - 'zlib/1.3.1.1 / fontconfig/2.18.1.1 (Conan, override)'
  cc: clang
  cxx: clang++

patches_applied:
  - '0001-stdckdint-fallback.patch'
  - '0002-static-assert-message.patch'

knowledge_gained:
  - 'zathura 2026.07.x 把 GTK 层重写为 girara-gtk/ 并改用 GTK4（meson dependency gtk4 >= 4.12）；沿用 2026.05.20 配方的 gtk/3.24.43 在该版本必然 configure 失败'
  - '上游 meson_options.txt 无 tests 选项（只有 tests-x11/tests-wayland），传 -Dtests=<bool> 会被 meson 判为未知选项'
  - 'girara/2026.07.07 钉死 glib/2.84.0，gtk4 栈（pango/1.56.4 → harfbuzz）钉 glib/2.84.0.1.1 + pcre2/10.45；两者不可共存，消费方必须 override 统一版本并重建 girara'
  - 'package_type="application" 时 conan 会移除 shared/fPIC 选项，声明它们会导致 Invalid: options.fPIC value not defined'
  - 'default_options={"shared": True} 会广播到所有依赖，把 harfbuzz 压成 shared=False 并导致找不到已发布二进制（Options conflicts）'
  - 'clang 15 无 c23 语言模式（仅 c2x 草案，__STDC_VERSION__=202000L），且缺少 C23 <stdckdint.h>；块作用域 _Static_assert 在 switch case 内被 clang 15 拒绝'
  - 'libzathura 为 static_library，随包安装的是 CLI（export_dynamic，导出插件 API 符号）+ 插件头文件 + pkg-config'

test_evidence:
  upstream_tests:
    framework: 'meson test / GLib TAP'
    total: 5
    passed: 5
    failed: 0
    note: '上游 headless 子集（-Dtests-x11=disabled -Dtests-wayland=disabled；上游全部测试目标为 9+1，含同一批 session/config/setting 源码的 X11/Wayland 两次注册）：document 1 + types 2 + utils 2，在 qemu-aarch64 + OHOS musl 运行根下实测'
  consumer_e2e:
    file: 'test_package/test.c'
    total: 14
    passed: 14
    failed: 0
    note: '插件角色消费者端到端：dlopen 已安装 zathura 宿主并解析其导出 API 后执行整页 image buffer 回环。14 为 CHECK 断言数；另有 1 个 dlopen 成功的裸 TAP 点，故 TAP 测试点为 15'
  device_e2e:
    device: 'DAYU200-RK3568 (OpenHarmony 6.0.0.47, aarch64)'
    total: 11
    passed: 11
    failed: 0
    note: '静态链接真实 zathura image-buffer 实现，真机执行，_device_evidence.json exit_code=0'
