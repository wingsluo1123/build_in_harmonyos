version: 1
package: zegrapher/3.1.1
homepage: https://zegrapher.com/

tests:
  package:
    status: pass
    command: "ZeGrapher (QT_QPA_PLATFORM=offscreen, timeout 5s)"
    description: >
      Smoke test of the packaged ZeGrapher binary. The app boots straight
      into the Qt event loop with no CLI argument handling, so the test
      asserts it survives until a timeout kills it under
      QT_QPA_PLATFORM=offscreen (crash/missing-lib/platform-plugin failure
      exits non-zero within a second). Upstream ships no test suite
      (verified: no tests/ directory, no test target in ZeGrapher.pro).

notes:
  - "GUI 应用无 CLI 参数；offscreen 平台 + timeout 存活性断言是无头环境下的唯一可观察冒烟口径"
