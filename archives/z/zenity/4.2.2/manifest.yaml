# 版本级 manifest — zenity 4.2.2
# 遵循 ARCHIVE-SPEC v2.0

version: "4.2.2"
software: "zenity"

status: built
build_date: "2026-08-09"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/GNOME/zenity/archive/refs/tags/4.2.2.tar.gz"
  sha256: "62156891e975539cd8441231e7999c0027326159bb316e2ef95047498d523e81"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dwebkitgtk=false"
    - "-Dmanpage=false"
  dependencies:
    - "libadwaita/1.2.0"
    - "gtk4/4.22.4"
    - "glib/2.84.0.1"
    - "pango/1.56.4"
    - "cairo/1.18.4"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson-help-subdir-conditional.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "zenity 4.2.2 requires libadwaita-1 >= 1.2 and gtk4"
  - "help subdirectory requires itstool with libxml2 Python bindings, not available on OHOS — made conditional via patch"
  - "graphene 1.10.8 built from source (dependency of gtk4)"
  - "sassc required for gtk4 css compilation, used dart-sass wrapper"
  - "HMDFS prevents execution of musl-linked glib tools, used system glib-compile-resources with wrapper"
  - "zenity is a command-line tool (R38): commands.json at software level"
