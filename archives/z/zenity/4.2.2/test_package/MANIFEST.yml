# test_package/MANIFEST.yml — zenity 4.2.2
# CI L0e requires this file to exist.

package: zenity/4.2.2
homepage: "https://gitlab.gnome.org/GNOME/zenity"

upstream_check_command: "meson test -C _build"
upstream_test_in_build: true
upstream_test_command: "meson test"

upstream_tests:
  - file: tests/meson.build
    source: zenity-4.2.2/tests/meson.build
    description: "Zenity test suite (if present)"
    command: "meson test"

test_package_tests:
  - file: test.sh
    description: "Runs zenity --version and verifies the output contains the expected version string (4.2.2)"
    command: "bash test.sh"

assertion_count: 1
