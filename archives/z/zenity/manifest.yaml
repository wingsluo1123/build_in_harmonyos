# 软件级 manifest — zenity
# 遵循 ARCHIVE-SPEC v2.0

software: zenity
display: "zenity"
description: "Display GTK dialog boxes from the command line"
category: utility
homepage: "https://gitlab.gnome.org/GNOME/zenity"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Help subdirectory made conditional (requires itstool with libxml2 Python bindings not available on OHOS)"
    - "webkitgtk disabled, manpage disabled"
    - "Requires libadwaita, gtk4, glib, pango, cairo as conan dependencies"
  common_dependencies:
    - libadwaita
    - gtk4
    - glib
    - pango
    - cairo

versions:
  "4.2.2":
    status: built
    build_date: "2026-08-09"
    dependencies:
      libadwaita: 1.2.0
      gtk4: 4.22.4
      glib: 2.84.0.1
      pango: 1.56.4
      cairo: 1.18.4
