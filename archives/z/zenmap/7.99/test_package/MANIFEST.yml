test_type: executable
test_language: python
test_requires_install: true
test_description: |
  Consumer integration tests for the installed zenmap 7.99 package
  (test_package/test_core.py, 12 cases):

  Upstream API consumed from the installed package:
  - zenmapCore.Version.VERSION == "7.99"
  - wheel dist-info (zenmap-7.99.dist-info) present next to the payload
  - GTK-free zenmapCore modules import (NmapCommand/TargetList/UmitConf/Diff)
  - NmapOptions parse/render round-trip, quoted values, split_quoted
  - StringPool.unique memoisation
  - NmapParser parses a real `nmap -oX` document (host/port/service/OS)
  - SearchResult query layer (open/closed/service) end to end

  HarmonyOS-specific tests:
  - the nmap run dependency is the OHOS aarch64 build (aarch64 ELF linked
    against the OHOS musl loader /lib/ld-musl-aarch64.so.1)
  - bin/zenmap launcher installed and starts via /usr/bin/env python3
  - zenmapCore data-path resolution works under the HarmonyOS CPython runtime
