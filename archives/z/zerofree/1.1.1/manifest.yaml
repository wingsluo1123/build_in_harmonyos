# 版本号
version: "1.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/z/zerofree/zerofree_1.1.1.orig.tar.gz"

  # 源码校验和
  sha256: "956bc861b55ba0a2b7593c58d32339dab1a0e7da6ea2b813d27c80f08b723867"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "CFLAGS=-I$DEFAULT_PREFIX/include -DHAVE_SYS_TYPES_H -fPIC -O2"
    - "LDFLAGS=-L$DEFAULT_PREFIX/lib"
    - "LIBS=-lcom_err"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - e2fsprogs/1.47.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile 硬编码 CC=gcc，用 make CC=clang 覆盖 ref: E109"
  - "需要 -DHAVE_SYS_TYPES_H 定义，因为 ext2fs.h 条件包含 sys/types.h ref: E110"
  - "需要链接 -lcom_err，ext2fs 库依赖 com_err 库 ref: E111"
  - "Makefile 无 install 目标，需添加 install target 支持 DESTDIR/PREFIX ref: E112"
  - "e2fsprogs 预编译包缺少 ext2fs.h 等多个头文件，需从源码补充 ref: E113"

