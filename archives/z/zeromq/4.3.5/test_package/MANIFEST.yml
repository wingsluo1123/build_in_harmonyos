# test_package/MANIFEST.yml
# Upstream test declaration file (required by CI L0e)

package: zeromq/4.3.5
homepage: "https://zeromq.org/"

# Upstream test command
upstream_check_command: "make check"

# conanfile.py build() method - upstream tests not integrated in build
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: tests/test_system.cpp
    source: zeromq-4.3.5/tests/test_system.cpp
    description: "System capability test"
    command: "./test_system"

# test_package consumer-side test
test_package_tests:
  - file: test.c
    description: "Consumer test: zmq_version, zmq_ctx_new, zmq_socket, zmq_bind"
    command: "./test_zeromq"

# Approximate assertion count
assertion_count: 5
