# 编译中学到的知识
knowledge_gained:
  - "musl 无 SunRPC：自包含 header-only xdrmem shim（rpc/xdr.h），xdr_string DECODE 需支持调用方预分配缓冲区原地解码  # knowledge_ref: KV-zfs-fuse-0.7.0-001"
  - "clang15 默认 -fno-common 与 2011 时代代码的暂定定义冲突，需 -fcommon  # knowledge_ref: KV-zfs-fuse-0.7.0-002"
  - "沙箱文件系统 bind() UNIX socket 返回 EPERM，改抽象命名空间 socket  # knowledge_ref: KV-zfs-fuse-0.7.0-003"
  - "SCons posix.py SHELL 需 patch 为 /system/bin/sh；AR/RANLIB 需绝对路径  # knowledge_ref: KV-zfs-fuse-0.7.0-004"
  - "musl 无 pthread_cancel 导出，协作取消场景 stub 返回 0  # knowledge_ref: KV-zfs-fuse-0.7.0-005"
