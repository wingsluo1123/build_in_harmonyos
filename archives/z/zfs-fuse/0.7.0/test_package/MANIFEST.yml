# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zfs-fuse/0.7.0
homepage: "https://zfs-fuse.net/"

# 上游测试命令：上游无独立 tests/ 目录，官方测试入口为 ztest
# （用户态池测试器，含 SIGKILL 容错与 zdb 完整性校验）+ zdb 标签校验
upstream_check_command: "ztest -f <dir> -T <seconds>"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ztest -f <builddir>/zfs-run/ztest-pool -T 10 + zdb -l label.vdev + zpool create/destroy labelpool"

# 上游实际运行的测试程序
upstream_tests:
  - file: cmd/ztest/ztest.c
    source: zfs-fuse-0.7.0/src/cmd/ztest/ztest.c
    description: "用户态 ZFS 池综合测试：元数据/数据全操作 + SIGKILL 崩溃容错 + zdb 完整性校验"
    command: "ztest -f <dir> -T 10"
  - file: cmd/zdb/zdb.c
    source: zfs-fuse-0.7.0/src/cmd/zdb/zdb.c
    description: "zdb -l vdev 标签解析（nvlist/XDR shim 冒烟）"
    command: "zdb -l <vdev>"
