    sha2_test: "RC=0，6 向量 OK"
    edonr_test: "RC=0，2 向量 OK"
    skein_test: "RC=0，9 向量 OK"
    blake3_test: "RC=0，105 向量 OK"
    btree_test: "RC=0（本地预验证），4 子测试（600 万插删压力）"
    test_package_library: "13 API 断言全过（nvpair 往返/uutil 列表/libzfs+libzfs_core 句柄边界）"
    test_package_binary: "zfs/zpool/zdb 真实执行（exit 1 + 上游内核边界消息）+ ztest usage banner"
  skipped:
