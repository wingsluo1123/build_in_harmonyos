# 编译中学到的知识
knowledge_gained:
- "config.guess(2008) 无 HarmonyOS 识别：添加 *:HarmonyOS:*:*) 分支输出 aarch64-unknown-linux-ohos 并立即 echo+exit（老版 config.guess 无统一 GUESS 输出）"
- "config.sub 三处补丁：KERNEL-OS 列表 + os 列表 + -linux-ohos* 分支（patch-autotools-ohos.pl 因缺 android-linux 锚点失效需手动）"
- "HMDFS umask 077 权限陷阱（E011）：configure/config.status 内 umask 077 → 022 规避 confXXXXXX 目录不可写"
- "新版 libc++ make_pair 完美转发拒绝显式模板实参绑定 const 左值：去掉显式模板实参"

