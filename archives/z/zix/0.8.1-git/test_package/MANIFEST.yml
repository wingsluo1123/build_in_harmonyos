# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zix/0.8.1-git
homepage: "https://drobilla.net/software/zix"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson.test() in build() — runs zix upstream test suite (filesystem, btree, ring, sem, etc.)"

# 上游实际运行的测试程序 (zix 0.8.1-git meson test 列表)
upstream_tests:
  - file: test/filesystem.c
    source: zix-a4fab09/test/filesystem.c
    description: "filesystem operations (hardlink, copy, etc.)"
    command: "./test_filesystem"
  - file: test/btree.c
    source: zix-a4fab09/test/btree.c
    description: "btree data structure"
    command: "./test_btree"
  - file: test/ring.c
    source: zix-a4fab09/test/ring.c
    description: "ring buffer"
    command: "./test_ring"
  - file: test/sem.c
    source: zix-a4fab09/test/sem.c
    description: "semaphore"
    command: "./test_sem"
  - file: test/tree.c
    source: zix-a4fab09/test/tree.c
    description: "tree data structure"
    command: "./test_tree"
  - file: test/digest.c
    source: zix-a4fab09/test/digest.c
    description: "digest hash"
    command: "./test_digest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：zix_default_allocator + zix_malloc/free"
    command: "./test_zix"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 6 个测试程序 + 消费者 test_package 1 个，每个约 3-5 个断言
assertion_count: 24
