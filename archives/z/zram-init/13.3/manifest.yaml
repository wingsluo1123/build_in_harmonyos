# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/13.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "13.3"

# 软件名
software: "zram-init"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/vaeth/zram-init/tar.gz/refs/tags/v13.3"

  # 源码校验和（codeload 官方端点实测，E406 多路径交叉校验）
  sha256: "1a37dd28a7f7ad19500d95173563e70d781e83035dbcb3e9317da276e2994471"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "toybox 无 install 命令，含 `install -D` 的 make install 在鸿蒙构建机不可用（E392 原始 Makefile 配方模式：build() 跑 make 生成、package() 显式 copy）"
  - "codeload.github.com 官方端点在本机可达而 github.com 归档直连超时；conandata.yml 保持官方 URL + conan get() 显式传 filename（E483/E276）"
  - "纯 shell 软件包配方模式：package_type=application + package_id 清空 + 零 requires；MAKE 变量表达平台决策（GETTEXT/SYSTEMD/OPENRC/MODIFY_SHEBANG=FALSE）避免源码补丁"
