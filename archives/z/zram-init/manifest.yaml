software: zram-init
display: "zram-init"
description: "POSIX shell script to set up (and release) zRAM devices as swap or tmpfs mounts"
category: system
homepage: "https://github.com/vaeth/zram-init"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Pure POSIX shell package (no C/C++ sources): handwritten GNU Makefile, built with make GETTEXT=FALSE SYSTEMD=FALSE OPENRC=FALSE MODIFY_SHEBANG=FALSE sbin/zram-init"
    - "toybox has no `install` command: upstream `make install` (INSTALL_EXE hardcodes install -D) unusable on OHOS build host (E392) — package() stages files explicitly via conan copy"
    - "codeload.github.com tag archive has no extension in its basename: conan source() passes explicit filename (E483/E276)"
    - "MODIFY_SHEBANG=FALSE keeps upstream '#!/usr/bin/env sh' shebang: portable on OHOS and reproducible across build hosts"
    - "package_id cleared (interpreted script + data files, no ABI/toolchain influence)"
  common_dependencies: []

versions:
  "13.3":
    status: built
    build_date: "2026-09-29"
    conan_ref: "zram-init/13.3"
