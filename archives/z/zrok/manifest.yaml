software: zrok
display: "zrok"
description: "zrok 是 openziti 的下一代点对点安全分享平台，用于安全、私密地共享网络与文件资源（CLI：zrok2）"
category: network
homepage: "https://zrok.io/"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "Go 项目（模块 github.com/openziti/zrok/v2，go.mod 声明 go 1.26），CGO_ENABLED=1 用 OHOS SDK clang（aarch64-unknown-linux-ohos-clang）交叉编译，产物为 ld-musl-aarch64 原生 ELF（上游 goreleaser 同样 CGO_ENABLED=1）"
    - "mattn/go-sqlite3 是 cgo-only 包（//go:build cgo），CGO_ENABLED=0 会因 controller/createFrontend.go 引用 sqlite3.Error 编译失败，必须启用 cgo"
    - "Web UI（ui/ 与 agent/agentUi/）用上游自带的 -tags no_zrok_ui（embed_stub.go 占位）绕开 npm 构建，headless CLI 无需 UI"
    - "OHOS 上 GOOS=linux，主二进制与 go test 编译出的 .test ELF 均需 binary-sign-tool 自签名方可 execve"
    - "Go 工作目录（GOCACHE/GOMODCACHE/GOTMPDIR/链接输出）路由到 OHOS go-workspace（/data/storage/el2/base/haps/entry/files，可 OHOS_GO_WORKDIR 覆盖），规避 HMDFS mmap 链接限制（E124/E134/E166/E318）"
  common_dependencies:
    - "go/1.26.0"

versions:
  "2.0.4":
    status: built
    build_date: "2026-10-03"
