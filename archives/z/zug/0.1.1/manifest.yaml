  - "0002-test-__inline_var_tests-CMakeLists.txt.patch"
  - "0003-test-transducer-random_sample.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "zug 是 header-only C++ transducers 库，使用 CMake 构建系统"
  - "C++14 模式依赖 boost/variant.hpp，切换到 C++17 可使用 std::variant 避免 Boost 依赖"
  - "C++17 下 std::result_of 被 deprecated，需要 -Wno-error 或 DISABLE_WERROR 来处理 -Werror"
  - "Catch2 测试需要显式链接 Catch2::Catch2 到 target_link_libraries"
  - "C++17 的 std::uniform_real_distribution 要求 URNG 提供 result_type typedef"
  - "HMDFS 文件系统上 cp -r 和 tar 不可靠，应使用 Python shutil.copytree"
  - "OHOS 环境 curl 存在 SSL 证书验证问题，使用 -k 参数绕过"

patch_generation:
