# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-Dzug_BUILD_TESTS=ON"
    - "-DCMAKE_CXX_FLAGS=-Wno-error"
    - "-DCMAKE_PREFIX_PATH=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.84.0
    - catch2/2.13.10

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
