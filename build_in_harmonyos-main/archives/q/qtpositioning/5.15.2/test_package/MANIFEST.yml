# test_package MANIFEST — qtpositioning 5.15.2
# 上游测试声明

# 测试文件
test_source:
  - test.cpp

# 构建系统
build_system: cmake

# 测试类型：L1 (smoke test) — 验证包可被正确链接和加载
test_type: L1

# 测试内容：
# - 创建 QGeoCoordinate 对象
# - 创建 QGeoCircle 对象
# - 创建 QGeoRectangle 对象
# - 验证 QtPositioning 模块可正常链接

# 上游测试用例（来自 qtlocation 仓库 tests/auto/ 目录）
# 由于上游测试需要 Qt5 完整环境（qmake + Qt5Core + Qt5Test），当前无法运行
# CI 环境中 Qt5 就绪后可通过 `qmake tests/auto/auto.pro && make && make check` 运行
upstream_tests:
  - tests/auto/qgeocoordinate/ — 坐标 API 测试（tst_qgeocoordinate.cpp）
  - tests/auto/qgeocircle/ — 圆形区域测试（tst_qgeocircle.cpp）
  - tests/auto/qgeopath/ — 路径测试（tst_qgeopath.cpp）
  - tests/auto/qgeopolygon/ — 多边形测试（tst_qgeopolygon.cpp）
  - tests/auto/qgeorectangle/ — 矩形区域测试（tst_qgeorectangle.cpp）
  - tests/auto/qgeopositioninfo/ — 位置信息测试（tst_qgeopositioninfo.cpp）
  - tests/auto/qnmeapositioninfosource/ — NMEA 位置源测试（tst_qnmeapositioninfosource.cpp）
  - tests/auto/positionplugin/ — 位置插件测试（tst_positionplugin.cpp）
  - tests/auto/declarative_core/ — QML 位置/坐标测试（7 个 .qml 文件）
