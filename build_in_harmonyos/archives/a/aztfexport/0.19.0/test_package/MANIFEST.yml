# test_package/MANIFEST.yml
# aztfexport 是 Go 纯二进制工具，无需 C 编译测试

package: aztfexport/0.19.0
homepage: "https://github.com/Azure/aztfexport"

# Go 项目无传统上游 make check
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试（Go 内置测试，由 Go 工具链管理）
upstream_tests: []

# test_package 验证（消费者视角）
test_package_tests:
  - file: conanfile.py
    description: "验证 aztfexport 二进制已安装且可执行"
    command: "./aztfexport --version"

# 测试断言总数
assertion_count: 2
